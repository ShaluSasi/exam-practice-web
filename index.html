<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F5F0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1022" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Free chapter-wise practice for CBSE Class 9 and 10: Maths, Science, Social Science and English, with explanations, learning games and live quizzes." />
    <!-- Link previews. The Worker replaces these with full tags (absolute image URLs) on / and /s/<code>. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vijayeemantra" />
    <meta property="og:title" content="Vijayeemantra — CBSE exam practice that feels like a game" />
    <meta property="og:description" content="Free interactive practice for CBSE Class 9 and 10: instant feedback, streaks, XP and leaderboards." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Plus+Jakarta+Sans:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <title>Vijayeemantra — Exam Practice</title>
    <!-- Loading screen until the app starts (React then replaces it). It covers the words and links the Worker puts in
         the page for search engines. It is only shown when scripts run, and goes away if the app can't be loaded. -->
    <script>
      (function (root) {
        root.classList.add("js");
        try {
          var theme = JSON.parse(localStorage.getItem("prepquest-profile")).state.theme;
        } catch (e) {}
        if (theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) root.classList.add("dark");
        addEventListener("error", function (e) {
          if (e.target && e.target.tagName === "SCRIPT") root.classList.remove("js");
        }, true);
      })(document.documentElement);
    </script>
    <style>
      #splash { display: none; }
      .js #splash { position: fixed; inset: 0; z-index: 50; display: grid; place-content: center; justify-items: center; gap: 28px; background: #f7f5f0; animation: splash-end 0s 25s forwards; }
      .js.dark #splash { background: #0e1022; }
      #splash svg { width: 84px; height: 84px; animation: splash-pulse 1.4s ease-in-out infinite; }
      #splash i { width: 32px; height: 32px; border-radius: 50%; border: 4px solid rgb(128 128 128 / 0.25); border-top-color: #ff8a1f; animation: splash-spin 0.8s linear infinite; }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
      @keyframes splash-pulse { 50% { transform: scale(1.07); } }
      @keyframes splash-end { to { visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) { #splash svg { animation: none; } #splash i { animation-duration: 2.4s; } }
    </style>
  </head>
  <body>
    <div id="root"><div id="splash" role="status" aria-label="Loading"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#1B1F3B" /><path d="M18 34l9 9 19-21" fill="none" stroke="#FF8A1F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /></svg><i></i></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
