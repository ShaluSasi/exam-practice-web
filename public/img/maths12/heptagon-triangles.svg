<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img"><title>A seven-sided polygon being cut into triangles from one corner</title><style>text{font-family:system-ui,sans-serif;font-weight:600;font-size:14px;fill:#2B2F4A}.t{animation:pop 6s ease-in-out infinite}@keyframes pop{0%,8%{opacity:0}28%,85%{opacity:1}100%{opacity:0}}.t1{animation-delay:0s}.t2{animation-delay:0.5s}.t3{animation-delay:1s}.t4{animation-delay:1.5s}.t5{animation-delay:2s}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><polygon class="t t1" points="200,30 276.6,66.9 295.5,149.8" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><polygon class="t t2" points="200,30 295.5,149.8 242.5,216.3" fill="#FFD9B0" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><polygon class="t t3" points="200,30 242.5,216.3 157.5,216.3" fill="#CDEFD2" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><polygon class="t t4" points="200,30 157.5,216.3 104.5,149.8" fill="#F9D0D2" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><polygon class="t t5" points="200,30 104.5,149.8 123.4,66.9" fill="#FCE8B0" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><polygon points="200,30 276.6,66.9 295.5,149.8 242.5,216.3 157.5,216.3 104.5,149.8 123.4,66.9" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><circle cx="200" cy="30" r="4" fill="#2B2F4A"/><circle cx="276.6" cy="66.9" r="4" fill="#2B2F4A"/><circle cx="295.5" cy="149.8" r="4" fill="#2B2F4A"/><circle cx="242.5" cy="216.3" r="4" fill="#2B2F4A"/><circle cx="157.5" cy="216.3" r="4" fill="#2B2F4A"/><circle cx="104.5" cy="149.8" r="4" fill="#2B2F4A"/><circle cx="123.4" cy="66.9" r="4" fill="#2B2F4A"/></svg>