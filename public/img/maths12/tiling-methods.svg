<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 245" role="img"><title>A four-sided tile and a second copy turned a half-turn about the midpoint of one edge</title><style>text{font-family:system-ui,sans-serif;font-weight:600;font-size:14px;fill:#2B2F4A}.rt{transform-origin:207.5px 82.5px;animation:rt 5s ease-in-out infinite}@keyframes rt{0%,15%{transform:rotate(-180deg)}55%,85%{transform:rotate(0deg)}100%{transform:rotate(-180deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><polygon points="110,60 190,40 225,125 120,160" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><g class="rt"><polygon points="305,105 225,125 190,40 295,5" fill="#FFD9B0" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /></g><circle cx="110" cy="60" r="4" fill="#2B2F4A"/><circle cx="190" cy="40" r="4" fill="#2B2F4A"/><circle cx="225" cy="125" r="4" fill="#2B2F4A"/><circle cx="120" cy="160" r="4" fill="#2B2F4A"/><circle cx="207.5" cy="82.5" r="6" fill="#E5484D"/><text x="96" y="56" text-anchor="middle"  >S</text><text x="190" y="28" text-anchor="middle"  >O</text><text x="240" y="132" text-anchor="middle"  >M</text><text x="106" y="176" text-anchor="middle"  >E</text><text x="300" y="210" text-anchor="middle" font-size="13" >half-turn about the</text><text x="300" y="228" text-anchor="middle" font-size="13" >midpoint of OM</text></svg>