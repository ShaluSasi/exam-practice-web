<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 245" role="img"><title>A triangle ABC with P and Q the midpoints of two sides</title><style>text{font-family:system-ui,sans-serif;font-weight:600;font-size:14px;fill:#2B2F4A}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><polygon points="200,40 60,205 340,205" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><line x1="130" y1="122.5" x2="270" y2="122.5" stroke="#E5484D" stroke-width="3" stroke-linecap="round"  /><circle cx="200" cy="40" r="4" fill="#2B2F4A"/><circle cx="60" cy="205" r="4" fill="#2B2F4A"/><circle cx="340" cy="205" r="4" fill="#2B2F4A"/><circle cx="130" cy="122.5" r="4.5" fill="#E5484D"/><circle cx="270" cy="122.5" r="4.5" fill="#E5484D"/><text x="200" y="28" text-anchor="middle"  >A</text><text x="44" y="222" text-anchor="middle"  >B</text><text x="356" y="222" text-anchor="middle"  >C</text><text x="114" y="118" text-anchor="middle"  >P</text><text x="286" y="118" text-anchor="middle"  >Q</text><text x="200" y="232" text-anchor="middle" font-size="15" >BC = 18 cm</text></svg>