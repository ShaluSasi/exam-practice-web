<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>Picture option</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#E3F2FD"/><g transform="translate(100 66) scale(1.5)"><g><path d="M-18 -8Q-18 -30 0 -30Q18 -30 18 -8Z" fill="#E8D5B5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 -30V-38" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-34" y="-8" width="68" height="6" fill="#D9C39A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-29.5" y="-2" width="7" height="22" fill="#FFF3DA" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-16.5" y="-2" width="7" height="22" fill="#FFF3DA" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-3.5" y="-2" width="7" height="22" fill="#FFF3DA" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="9.5" y="-2" width="7" height="22" fill="#FFF3DA" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="22.5" y="-2" width="7" height="22" fill="#FFF3DA" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-38" y="20" width="76" height="6" fill="#D9C39A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-32" y="26" width="64" height="5" fill="#D9C39A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="100" y="140" font-size="11" text-anchor="middle">Council hall</text></svg>