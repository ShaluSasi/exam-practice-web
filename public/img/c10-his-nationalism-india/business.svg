<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A mill, a ledger with coins, and a crate of imported goods crossed out</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF6DE"/><rect y="196" width="400" height="44" fill="#E8D7A8"/><g transform="translate(90 140) scale(1.5)"><g><rect x="-34" y="-4" width="68" height="28" fill="#D7C2A5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-34 -4L-22 -16V-4L-8 -16V-4L6 -16V-4L20 -16V-4Z" fill="#B9A07D" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="22" y="-30" width="10" height="26" fill="#A0693A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g class="rise"><circle cx="27" cy="-34" r="6" fill="#fff" opacity=".9"/></g><rect x="-26" y="6" width="9" height="9" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-10" y="6" width="9" height="9" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="6" y="8" width="12" height="16" fill="#2B2F4A"/></g></g><g transform="translate(220 166) scale(1.2)"><g><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-14" y="-10" width="28" height="20" fill="#FFF3DA"/><path d="M-9 -4H9M-9 2H9M-9 8H3" stroke="#9AA3B5" stroke-width="2"/></g></g><g transform="translate(220 120) scale(0.9)"><g class="bob"><circle r="11" fill="#FFC93C" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="4" font-size="10" text-anchor="middle">Rs</text></g></g><g transform="translate(250 110) scale(0.7)"><g class="bob" style="animation-delay:0.6s"><circle r="11" fill="#FFC93C" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="4" font-size="10" text-anchor="middle">Rs</text></g></g><g transform="translate(320 170) scale(1.0)"><g><path d="M-14 -8Q-18 8 -16 22H16Q18 8 14 -8Q8 -14 0 -10Q-8 -14 -14 -8Z" fill="#E8C99B" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-6 -12L-8 -20H8L6 -12" fill="#C68B4E" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><path d="M296 130L344 188M344 130L296 188" stroke="#E5484D" stroke-width="6" stroke-linecap="round"/></svg>