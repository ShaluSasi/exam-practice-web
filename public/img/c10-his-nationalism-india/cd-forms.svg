<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A heap of salt, a pile of foreign cloth and a picketed liquor shop</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#E3F2FD"/><rect y="196" width="400" height="44" fill="#E8D7A8"/><g transform="translate(70 160) scale(1.2)"><g><path d="M-26 20Q-16 -8 0 -18Q16 -8 26 20Z" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-12 12Q0 -2 8 10" fill="none" stroke="#C9D3E3" stroke-width="3" stroke-linecap="round"/><path d="M-4 -26l2 6M12 -20l5 3M-18 -14l-5 3" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" class="blk"/></g></g><g transform="translate(180 170) scale(1.2)"><g><rect x="-22" y="10" width="44" height="10" rx="4" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-14 10V20M-4 10V20" stroke="#fff" stroke-width="1.5" opacity=".6"/><rect x="-19" y="-1" width="44" height="10" rx="4" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-11 -1V9M-1 -1V9" stroke="#fff" stroke-width="1.5" opacity=".6"/><rect x="-16" y="-12" width="44" height="10" rx="4" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -12V-2M2 -12V-2" stroke="#fff" stroke-width="1.5" opacity=".6"/></g></g><g transform="translate(300 150) scale(1.0)"><g><rect x="-30" y="-14" width="60" height="38" fill="#FFE0B2" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-30" y="-26" width="15" height="14" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-15" y="-26" width="15" height="14" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="0" y="-26" width="15" height="14" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="15" y="-26" width="15" height="14" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-10" y="2" width="20" height="22" fill="#2B2F4A"/><g transform="translate(-22 8) scale(.4)"><rect x="-4" y="-22" width="8" height="8" rx="2" fill="#2B2F4A"/><path d="M-4 -14L-9 -4V18Q-9 22 -5 22H5Q9 22 9 18V-4L4 -14Z" fill="#B9770E" fill-opacity=".85" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-9 4H9" stroke="#fff" stroke-width="3"/></g><g transform="translate(22 8) scale(.4)"><rect x="-4" y="-22" width="8" height="8" rx="2" fill="#2B2F4A"/><path d="M-4 -14L-9 -4V18Q-9 22 -5 22H5Q9 22 9 18V-4L4 -14Z" fill="#7B3F00" fill-opacity=".85" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-9 4H9" stroke="#fff" stroke-width="3"/></g></g></g><g transform="translate(340 170) scale(0.8)"><g><path d="M-9 -3L-15 -18M9 -3L15 -18" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-4 14V26M4 14V26" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-9" y="-8" width="18" height="24" rx="6" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-17" r="8" fill="#F4C9A0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -18Q0 -28 8 -18Q4 -21 -8 -18Z" fill="#2B2F4A"/></g></g></svg>