ty=".75" stroke="#2B2F4A" stroke-width="2"/><g transform="translate(200 76) scale(0.8)"><g><rect x="-34" y="-4" width="68" height="28" fill="#D7C2A5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-34 -4L-22 -16V-4L-8 -16V-4L6 -16V-4L20 -16V-4Z" fill="#B9A07D" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="22" y="-30" width="10" height="26" fill="#A0693A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g class="rise"><circle cx="27" cy="-34" r="6" fill="#fff" opacity=".9"/></g><rect x="-26" y="6" width="9" height="9" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-10" y="6" width="9" height="9" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="6" y="8" width="12" height="16" fill="#2B2F4A"/></g></g><rect x="278.0" y="20.0" width="112" height="100" rx="12" fill="#fff" fill-opacity=".75" stroke="#2B2F4A" stroke-width="2"/><g transform="translate(334 76) scale(1.1)"><g><path d="M0 22V0" stroke="#3FA34D" stroke-width="3" stroke-linecap="round"/><circle cx="-7" cy="-4" r="6" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7" cy="-6" r="6" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-14" r="6" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><rect x="10.0" y="120.0" width="112" height="100" rx="12" fill="#fff" fill-opacity=".75" stroke="#2B2F4A" stroke-width="2"/><g transform="translate(66 176) scale(1.0)"><g><path d="M-9 -3L-14 10M9 -3L14 10" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-4 14V26M4 14V26" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-9" y="-8" width="18