linecap="round" stroke-linejoin="round"/><text x="306.6666666666667" y="174" font-size="11" text-anchor="middle">200</text><path d="M360.0 144V156" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="360.0" y="174" font-size="11" text-anchor="middle">240</text><text x="200" y="196" font-size="12" text-anchor="middle">Distance walked (miles)</text><g transform="translate(40 108) scale(0.7)"><g><rect x="-20" y="-2" width="40" height="24" fill="#E8C99B" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-26 -2L0 -24L26 -2Z" fill="#C68B4E" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-6" y="8" width="12" height="14" fill="#2B2F4A"/><path d="M-34 24H34" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(360 112) scale(0.7)"><g><path d="M-26 20Q-16 -8 0 -18Q16 -8 26 20Z" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-12 12Q0 -2 8 10" fill="none" stroke="#C9D3E3" stroke-width="3" stroke-linecap="round"/><path d="M-4 -26l2 6M12 -20l5 3M-18 -14l-5 3" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" class="blk"/></g></g><g transform="translate(90 118) scale(0.5)"><g class="bob"><path d="M-9 -3L-14 10M9 -3L14 10" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-4 14V26M4 14V26" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-9" y="-8" width="18" height="24" rx="6" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-17" r="8" fill="#F4C9A0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -19Q0 -30 8 -19Z" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(