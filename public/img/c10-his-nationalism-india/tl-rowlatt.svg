idth="2" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(344.0 94) scale(0.7)"><g><path d="M0 -10V28" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-24" y="-30" width="48" height="26" rx="3" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="-20" font-size="8" text-anchor="middle">MARTIAL</text><text x="0" y="-10" font-size="8" text-anchor="middle">LAW</text></g></g><text x="200" y="28" font-size="13" text-anchor="middle">Spring 1919</text></svg>