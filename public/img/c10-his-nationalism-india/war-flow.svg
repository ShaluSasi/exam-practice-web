<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Flow: the war raised defence spending, paid for somehow, and prices doubled</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="18.0" y="88.0" width="80" height="64" rx="10" fill="#FFD9D9" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="116.5" font-size="12" text-anchor="middle">First</text><text x="58" y="131.5" font-size="12" text-anchor="middle">World War</text><line x1="100" y1="120" x2="112" y2="120" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" class="fl" marker-end="url(#ah)"/><rect x="112.0" y="88.0" width="80" height="64" rx="10" fill="#FFE9A8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="152" y="116.5" font-size="12" text-anchor="middle">Defence</text><text x="152" y="131.5" font-size="12" text-anchor="middle">spending up</text><line x1="194" y1="120" x2="206" y2="120" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" class="fl" marker-end="url(#ah)"/><rect x="208.0" y="88.0" width="80" height="64" rx="10" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="248" y="116.5" font-size="12" text-anchor="middle">Paid for</text><text x="248" y="131.5" font-size="12" text-anchor="middle">how?</text><line x1="290" y1="120" x2="302" y2="120" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" class="fl" marker-end="url(#ah)"/><rect x="302.0" y="88.0" width="80" height="64" rx="10" fill="#E1F5D0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="342" y="116.5" font-size="12" text-anchor="middle">Prices</text><text x="342" y="131.5" font-size="12" text-anchor="middle">doubled</text><g transform="translate(152 70) scale(0.8)"><g class="bob"><circle r="11" fill="#FFC93C" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="4" font-size="10" text-anchor="middle">Rs</text></g></g><g transform="translate(248 70) scale(0.8)"><g class="bob" style="animation-delay:0.6s"><circle r="11" fill="#FFC93C" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="4" font-size="10" text-anchor="middle">Rs</text></g></g><g transform="translate(342 70) scale(0.8)"><g class="bob" style="animation-delay:1.2s"><circle r="11" fill="#FFC93C" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="4" font-size="10" text-anchor="middle">Rs</text></g></g><text x="200" y="208" font-size="12" text-anchor="middle">Common people faced extreme hardship</text></svg>