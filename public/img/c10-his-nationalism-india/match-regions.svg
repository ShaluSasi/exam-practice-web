roke-width="2"/><g transform="translate(334 76) scale(1.1)"><g><rect x="-4" y="4" width="8" height="18" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-6" r="16" fill="#4CB85A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><rect x="10.0" y="120.0" width="112" height="100" rx="12" fill="#fff" fill-opacity=".75" stroke="#2B2F4A" stroke-width="2"/><g transform="translate(66 176) scale(1.0)"><g><ellipse cx="0" cy="14" rx="24" ry="9" fill="#2E7D32" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-20 10Q-20 -12 0 -12Q20 -12 20 10Z" fill="#4CAF50" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-12 2l4 -6l4 6z" fill="#A5D6A7" stroke="#2B2F4A" stroke-width="1.5"/><path d="M0 -4l4 -6l4 6z" fill="#A5D6A7" stroke="#2B2F4A" stroke-width="1.5"/><path d="M10 4l4 -6l4 6z" fill="#A5D6A7" stroke="#2B2F4A" stroke-width="1.5"/></g></g><rect x="144.0" y="120.0" width="112" height="100" rx="12" fill="#fff" fill-opacity=".75" stroke="#2B2F4A" stroke-width="2"/><g transform="translate(200 176) scale(0.9)"><g><rect x="-32" y="-8" width="64" height="30" fill="#D5DAE6" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-36" y="-14" width="72" height="8" fill="#9AA5B8" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-8" y="4" width="16" height="18" fill="#2B2F4A"/><rect x="-26" y="2" width="12" height="10" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="14" y="2" width="12" height="10" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-18" y="-26" width="36" height="12" rx="2" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="0" y="-17" font-size="9" text-anchor="middle">POLICE</text></g></g><rect x="278.0" y="120.0" width="112" height="100" rx="12" fill="#fff" fill-opacity=".75" stroke="#2B2F4A" stroke-width="2"/><g transform="translate(334 176) scale(1.0)"><g><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-14" y="-10" width="28" height="20" fill="#FFF3DA"/><path d="M-9 -4H9M-9 2H9M-9 8H3" stroke="#9AA3B5" stroke-width="2"/></g></g></svg>