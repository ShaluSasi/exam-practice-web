<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A book, a scroll and a spinning wheel as symbols of how nationalism spread through culture</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF1D6"/><rect y="196" width="400" height="44" fill="#E8D7A8"/><g transform="translate(90 150) scale(1.8)"><g><rect x="-16" y="-12" width="32" height="24" rx="3" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-10 -12V12" stroke="#fff" stroke-width="2"/><path d="M-4 -4H10M-4 3H8" stroke="#fff" stroke-width="2"/></g></g><g transform="translate(200 140) scale(1.5)"><g><rect x="-22" y="-16" width="44" height="32" rx="3" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="-22" cy="0" rx="4" ry="16" fill="#F3E2B8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="22" cy="0" rx="4" ry="16" fill="#F3E2B8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-14 -8H14" stroke="#9AA3B5" stroke-width="2.5" stroke-linecap="round"/><path d="M-14 0H14" stroke="#9AA3B5" stroke-width="2.5" stroke-linecap="round"/><path d="M-14 8H6" stroke="#9AA3B5" stroke-width="2.5" stroke-linecap="round"/></g></g><g transform="translate(310 150) scale(1.4)"><g><path d="M-14 16L-18 30M2 16L6 30M26 6L30 30" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="6" y="-6" width="22" height="14" rx="3" fill="#C68B4E" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g class="spin" style="animation-duration:3s"><circle cx="-6" cy="0" r="15" fill="#FFE8C2" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="-6" y1="0" x2="7.0" y2="0.0" stroke="#2B2F4A" stroke-width="2"/><line x1="-6" y1="0" x2="3.2" y2="9.2" stroke="#2B2F4A" stroke-width="2"/><line x1="-6" y1="0" x2="-6.0" y2="13.0" stroke="#2B2F4A" stroke-width="2"/><line x1="-6" y1="0" x2="-15.2" y2="9.2" stroke="#2B2F4A" stroke-width="2"/><line x1="-6" y1="0" x2="-19.0" y2="0.0" stroke="#2B2F4A" stroke-width="2"/><line x1="-6" y1="0" x2="-15.2" y2="-9.2" stroke="#2B2F4A" stroke-width="2"/><line x1="-6" y1="0" x2="-6.0" y2="-13.0" stroke="#2B2F4A" stroke-width="2"/><line x1="-6" y1="0" x2="3.2" y2="-9.2" stroke="#2B2F4A" stroke-width="2"/></g><path d="M9 0L-6 0" stroke="#2B2F4A" stroke-width="2"/></g></g></svg>