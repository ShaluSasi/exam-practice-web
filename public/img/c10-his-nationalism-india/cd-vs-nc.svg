18Z" fill="#2B2F4A"/></g></g><path d="M118 100L134 108" stroke="#E5484D" stroke-width="5" stroke-linecap="round"/><g transform="translate(100 190) scale(0.6)"><g><rect x="-30" y="-6" width="60" height="30" fill="#FFE0B2" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-34 -6L0 -28L34 -6Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-6" y="6" width="12" height="18" fill="#2B2F4A"/><rect x="-24" y="2" width="9" height="9" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="15" y="2" width="9" height="9" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-12" r="4" fill="#FFC93C" stroke="#2B2F4A" stroke-width="2"/></g></g><g transform="translate(270 120) scale(1.2)"><g><path d="M-9 -3L-14 10M9 -3L19 4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-4 14V26M4 14V26" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-9" y="-8" width="18" height="24" rx="6" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-17" r="8" fill="#F4C9A0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -19Q0 -30 8 -19Z" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(330 150) scale(1.0)"><g><path d="M-26 20Q-16 -8 0 -18Q16 -8 26 20Z" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-12 12Q0 -2 8 10" fill="none" stroke="#C9D3E3" stroke-width="3" stroke-linecap="round"/><path d="M-4 -26l2 6M12 -20l5 3M-18 -14l-5 3" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" class="blk"/></g></g><g transform="translate(320 196) scale(0.7)"><g><path d="M-50 -12q10 -8 20 0t20 0t20 0t20 0t20 0" fill="none" stroke="#0B93D4" stroke-width="3.5" stroke-linecap="round" class="drift" style="animation-delay:0.0s"/><path d="M-50 0q10 -8 20 0t20 0t20 0t20 0t20 0" fill="none" stroke="#0B93D4" stroke-width="3.5" stroke-linecap="round" class="drift" style="animation-delay:0.5s"/><path d="M-50 12q10 -8 20 0t20 0t20 0t20 0t20 0" fill="none" stroke="#0B93D4" stroke-width="3.5" stroke-linecap="round" class="drift" style="animation-delay:1.0s"/></g></g><path d="M200 70V220" stroke="#2B2F4A" stroke-width="2" stroke-dasharray="5 6"/></svg>