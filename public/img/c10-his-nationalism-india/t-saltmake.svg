<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>Picture option</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF6DE"/><g transform="translate(150 100) scale(0.6)"><g><path d="M-50 -12q10 -8 20 0t20 0t20 0t20 0t20 0" fill="none" stroke="#0B93D4" stroke-width="3.5" stroke-linecap="round" class="drift" style="animation-delay:0.0s"/><path d="M-50 0q10 -8 20 0t20 0t20 0t20 0t20 0" fill="none" stroke="#0B93D4" stroke-width="3.5" stroke-linecap="round" class="drift" style="animation-delay:0.5s"/><path d="M-50 12q10 -8 20 0t20 0t20 0t20 0t20 0" fill="none" stroke="#0B93D4" stroke-width="3.5" stroke-linecap="round" class="drift" style="animation-delay:1.0s"/></g></g><g transform="translate(60 90) scale(1.0)"><g><path d="M-26 20Q-16 -8 0 -18Q16 -8 26 20Z" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-12 12Q0 -2 8 10" fill="none" stroke="#C9D3E3" stroke-width="3" stroke-linecap="round"/><path d="M-4 -26l2 6M12 -20l5 3M-18 -14l-5 3" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" class="blk"/></g></g><g transform="translate(112 82) scale(0.8)"><g><path d="M-9 -3L-14 10M9 -3L19 4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-4 14V26M4 14V26" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-9" y="-8" width="18" height="24" rx="6" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-17" r="8" fill="#F4C9A0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -19Q0 -30 8 -19Z" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="100" y="140" font-size="11" text-anchor="middle">Making salt by the sea</text></svg>