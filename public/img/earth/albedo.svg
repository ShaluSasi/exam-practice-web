<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>Equal sunlight falling on four different surfaces</title>
<defs>
<marker id="ay" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#E0A92E"/></marker>
</defs>
<style>
.ray{stroke-dasharray:8 6;animation:ray 1.4s linear infinite}
@keyframes ray{to{stroke-dashoffset:-28}}
.sp{animation:tw 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sp:nth-child(2){animation-delay:.7s}.sp:nth-child(3){animation-delay:1.3s}
@keyframes tw{0%,100%{transform:scale(.4);opacity:.3}50%{transform:scale(1.1);opacity:1}}
.sun{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle class="sun" cx="200" cy="34" r="22" fill="#F6C453" stroke="#E0A92E" stroke-width="2.5"/>
<g fill="none" stroke="#E0A92E" stroke-width="3" stroke-linecap="round">
<path class="ray" d="M180 50L66 112" marker-end="url(#ay)"/>
<path class="ray" d="M192 58L156 112" marker-end="url(#ay)"/>
<path class="ray" d="M208 58L244 112" marker-end="url(#ay)"/>
<path class="ray" d="M220 50L334 112" marker-end="url(#ay)"/>
</g>
<g stroke-width="2.5" stroke-linejoin="round">
<rect x="18" y="122" width="84" height="94" rx="10" fill="#FFFFFF" stroke="#9DB6CC"/>
<rect x="112" y="122" width="84" height="94" rx="10" fill="#D6F0FA" stroke="#5FB4E6"/>
<rect x="206" y="122" width="84" height="94" rx="10" fill="#C7C2B6" stroke="#8A8270"/>
<rect x="300" y="122" width="84" height="94" rx="10" fill="#4A3A30" stroke="#2B2F4A"/>
</g>
<g fill="#E1ECF4"><circle cx="40" cy="190" r="8"/><circle cx="76" cy="172" r="10"/><circle cx="58" cy="148" r="6"/></g>
<g><path class="sp" d="M44 160l3 7 7 3-7 3-3 7-3-7-7-3 7-3z" fill="#F6C453"/><path class="sp" d="M80 140l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#F6C453"/><path class="sp" d="M70 196l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#F6C453"/></g>
<path d="M124 150L150 140M160 180L186 166M128 196L146 190" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
<g fill="#9A9284" stroke="#6E6656" stroke-width="1.5">
<path d="M220 140l10-4 6 6-8 6z"/><path d="M250 150l12-2 2 9-11 3z"/><path d="M228 176l9-5 7 7-10 4z"/><path d="M264 186l11 1-2 10-10-3z"/><path d="M238 200l8 0 2 7-9 1z"/>
</g>
<g fill="#2E241D"><circle cx="320" cy="146" r="4"/><circle cx="352" cy="164" r="5"/><circle cx="334" cy="196" r="4"/><circle cx="368" cy="198" r="3"/></g>
<g font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="middle">
<text x="60" y="238">Snow</text><text x="154" y="238">Ice</text><text x="248" y="238">Crushed rock</text><text x="342" y="238">Black soil</text>
</g>
</svg>
