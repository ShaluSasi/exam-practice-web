<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" role="img">
<title>Mountain slopes around a valley with moving air</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#FF8A1F"/></marker></defs>
<style>
.w{stroke-dasharray:10 6;animation:w 1.2s linear infinite}
@keyframes w{to{stroke-dashoffset:-32}}
.sun{animation:p 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes p{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.tw{animation:t 2.5s ease-in-out infinite}
@keyframes t{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect width="300" height="200" rx="16" fill="#E3F2FD"/>
<circle class="sun" cx="150" cy="34" r="18" fill="#F6C453" stroke="#E0A92E" stroke-width="2.5"/>
<path d="M0 184V150L48 52L118 168H182L252 52L300 150V184Q300 200 284 200H16Q0 200 0 184Z" fill="#9BD08A" stroke="#3FA34D" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M48 52L38 72L46 68L52 76L58 68L62 74Z M252 52L242 72L248 68L254 76L262 68L266 74Z" fill="#FFFFFF" stroke="#3FA34D" stroke-width="1.5" stroke-linejoin="round"/>
<g stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"><path d="M140 168v-12l10-8l10 8v12z" fill="#F6E3C4"/><path d="M146 168v-7h8v7" fill="#C8925A"/></g>
<g fill="none" stroke="#FF8A1F" stroke-width="5" stroke-linecap="round"><path class="w" d="M72 80L112 146" marker-end="url(#a)"/><path class="w" d="M228 80L188 146" marker-end="url(#a)"/></g>
</svg>