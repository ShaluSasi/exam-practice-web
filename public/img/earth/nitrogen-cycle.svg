.bolt{animation:flash 2.8s linear infinite}
@keyframes flash{0%,70%,76%,84%,100%{opacity:1}72%,80%{opacity:.15}}
.bac{animation:wig 1.6s ease-in-out infinite alternate}
@keyframes wig{to{transform:translate(3px,-2px)}}
.nd{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.bolt{opacity:1}}
</style>
