<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>A plant, a person, a campfire and a rusting iron bucket under the open sky</title>
<style>
.bu{animation:up 3s ease-in infinite}
.bu:nth-child(2){animation-delay:1s}.bu:nth-child(3){animation-delay:2s}
@keyframes up{0%{transform:translateY(10px);opacity:0}25%{opacity:1}100%{transform:translateY(-50px);opacity:0}}
.fl{animation:fl .9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.br{animation:br 2.6s ease-out infinite}
@keyframes br{0%{transform:translateX(0);opacity:0}30%{opacity:.9}100%{transform:translateX(26px);opacity:0}}
.sun{animation:p 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes p{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
