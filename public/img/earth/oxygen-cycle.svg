<circle class="sun" cx="40" cy="36" r="20" fill="#F6C453" stroke="#E0A92E" stroke-width="2.5"/>
<ellipse cx="210" cy="36" rx="52" ry="20" fill="#D5DAEA" stroke="#7E84A8" stroke-width="2.5"/>
<text x="210" y="41" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#2B2F4A" text-anchor="middle">O₂</text>
<path d="M78 206V150" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/>
<g fill="#7CC36A" stroke="#2C7A37" stroke-width="2">
<ellipse cx="60" cy="150" rx="20" ry="9" transform="rotate(-25 60 150)"/><ellipse cx="96" cy="140" rx="20" ry="9" transform="rotate(25 96 140)"/><ellipse cx="78" cy="122" rx="9" ry="20"/>
</g>
<g fill="#FFFFFF" stroke="#5FB4E6" stroke-width="2"><circle class="bu" cx="70" cy="100" r="5"/><circle class="bu" cx="90" cy="96" r="4"/><circle class="bu" cx="80" cy="88" r="6"/></g>
<g stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
<path d="M170 206V180M186 206V180" fill="none"/>
<rect x="164" y="138" width="28" height="44" rx="10" fill="#0B93D4"/>
<circle cx="178" cy="120" r="14" fill="#F2C9A0"/>
<path d="M174 124q4 3 8 0" fill="none"/>
</g>
<g fill="#C3C7D6"><circle class="br" cx="196" cy="122" r="4"/><circle class="br" cx="200" cy="118" r="3" style="animation-delay:1.3s"/></g>
<g stroke="#8A5A2B" stroke-width="6" stroke-linecap="round"><path d="M262 206L300 194M266 194L304 206"/></g>
<path class="fl" d="M270 196Q268 170 284 154Q284 172 296 176Q302 186 296 196Z" fill="#FF8A1F" stroke="#E5484D" stroke-width="2" stroke-linejoin="round"/>
<path class="fl" d="M278 196Q278 182 286 174Q288 186 292 196Z" fill="#F6C453"/>
<path d="M336 204L340 166H376L380 204Z" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/>
<g fill="#B5562B"><circle cx="346" cy="178" r="4"/><circle cx="362" cy="190" r="5"/><circle cx="370" cy="174" r="3"/><circle cx="350" cy="196" r="3"/></g>
