<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img">
<title>Two equal beams of sunlight striking a round Earth at different places</title>
<style>
.ray{stroke-dasharray:10 6;animation:ray 1.3s linear infinite}
@keyframes ray{to{stroke-dashoffset:-32}}
.hot{animation:hot 2.4s ease-in-out infinite}
@keyframes hot{0%,100%{opacity:.55}50%{opacity:1}}
.sun{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path class="sun" d="M0 92A48 48 0 0 1 0 188Z" fill="#F6C453" stroke="#E0A92E" stroke-width="2.5"/>
<circle cx="250" cy="140" r="110" fill="#8FD0F2" stroke="#0B93D4" stroke-width="3"/>
<g fill="#9BD08A" stroke="#3FA34D" stroke-width="2" stroke-linejoin="round">
<path d="M200 80q20-18 46-8q14 14-4 26q-22 6-30 0q-16-6-12-18z"/>
<path d="M266 168q22-10 38 4q6 22-14 30q-20 2-26-12q-4-14 2-22z"/>
<path d="M300 92q14-6 22 4q2 12-10 14q-12-2-12-18z"/>
</g>
<path d="M140 140H360" stroke="#2B2F4A" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M250 22V258" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" opacity=".5"/>
<g fill="none" stroke="#E0A92E" stroke-width="3" stroke-linecap="round">
<path class="ray" d="M50 127H140"/><path class="ray" d="M50 140H139"/><path class="ray" d="M50 153H140"/>
<path class="ray" d="M50 42H199"/><path class="ray" d="M50 55H179"/><path class="ray" d="M50 68H166"/>
</g>
<g fill="none" stroke-width="7" stroke-linecap="round">
<path class="hot" d="M141 125A110 110 0 0 0 141 155" stroke="#FF8A1F"/>
<path class="hot" d="M204 40A110 110 0 0 0 165 70" stroke="#F6D77A"/>
</g>
</svg>
