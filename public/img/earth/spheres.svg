<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
<title>A mountain valley with snow, a lake, rocks, grazing sheep and clouds</title>
<style>
.cl{animation:drift 6s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.melt{stroke-dasharray:6 6;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.rip{animation:rip 3s ease-in-out infinite}
@keyframes rip{0%,100%{opacity:.3}50%{opacity:.9}}
.sh{animation:graze 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes graze{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
