<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A city of concrete buildings and roads beside green countryside on a summer night</title>
<style>
.hw{animation:rise 2.8s ease-in infinite}
.hw:nth-child(2){animation-delay:.9s}.hw:nth-child(3){animation-delay:1.8s}.hw:nth-child(4){animation-delay:.4s}
@keyframes rise{0%{transform:translateY(10px);opacity:0}30%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
.dm{animation:gl 4s ease-in-out infinite}
@keyframes gl{0%,100%{opacity:.25}50%{opacity:.45}}
.st{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
