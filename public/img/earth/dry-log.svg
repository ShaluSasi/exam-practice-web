<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" role="img">
<title>A dried log of wood resting on a weighing scale</title>
<style>
.nd{animation:sw 3s ease-in-out infinite;transform-origin:150px 160px}
@keyframes sw{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(24deg)}}
.lf{animation:fall 4s ease-in-out infinite}
@keyframes fall{0%{transform:translate(0,-10px) rotate(0);opacity:0}20%{opacity:1}100%{transform:translate(30px,40px) rotate(90deg);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.nd{transform:rotate(24deg)}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round">
<rect x="70" y="118" width="160" height="66" rx="10" fill="#CDEBFA"/>
<rect x="56" y="104" width="188" height="14" rx="5" fill="#A3A8CC"/>
<circle cx="150" cy="160" r="20" fill="#FFFFFF"/>
<rect x="66" y="58" width="168" height="44" rx="22" fill="#C8925A"/>
<ellipse cx="226" cy="80" rx="14" ry="22" fill="#E8C49A"/>
</g>
<g fill="none" stroke="#8A5A2B" stroke-width="2" stroke-linecap="round"><path d="M90 72q30-6 60 0M100 88q40 6 90 0"/><ellipse cx="226" cy="80" rx="7" ry="11"/><circle cx="226" cy="80" r="2.5"/></g>
<path class="nd" d="M150 160V144" stroke="#E5484D" stroke-width="3" stroke-linecap="round"/>
<path class="lf" d="M60 20q10-10 20 0q-10 10-20 0z" fill="#9BD08A" stroke="#3FA34D" stroke-width="1.5"/>
</svg>
