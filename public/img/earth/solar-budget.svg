<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
<title>Sunlight entering the atmosphere and meeting clouds, air and the ground</title>
<defs>
<marker id="ay" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#E0A92E"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#E5484D"/></marker>
</defs>
<style>
.ray{stroke-dasharray:9 6;animation:ray 1.4s linear infinite}
@keyframes ray{to{stroke-dashoffset:-30}}
.ir{stroke-dasharray:6 4;animation:ray 1.8s linear infinite}
.hot{animation:hot 2.4s ease-in-out infinite}
@keyframes hot{0%,100%{opacity:.35}50%{opacity:.85}}
.cl{animation:drift 5s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
.sun{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M16 0H384Q400 0 400 16V52H0V16Q0 0 16 0Z" fill="#D8DCF0"/>
<rect x="0" y="52" width="400" height="188" fill="#E3F2FD"/>
<path d="M0 52H400" stroke="#7E84A8" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M0 236H400V284Q400 300 384 300H16Q0 300 0 284Z" fill="#B9D98A" stroke="#6E9A45" stroke-width="2.5"/>
<path d="M0 262H400V284Q400 300 384 300H16Q0 300 0 284Z" fill="#D9C49A"/>
<circle class="sun" cx="38" cy="32" r="22" fill="#F6C453" stroke="#E0A92E" stroke-width="2.5"/>
<g class="cl"><path d="M150 120Q146 98 168 98Q176 82 196 90Q216 84 222 102Q240 104 234 120Z" fill="#FFFFFF" stroke="#9DB6CC" stroke-width="2.5" stroke-linejoin="round"/></g>
<g fill="none" stroke="#E0A92E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
<path class="ray" d="M58 44L170 100L210 30" marker-end="url(#ay)"/>
<path class="ray" d="M54 54L104 152" marker-end="url(#ay)"/>
<path class="ray" d="M60 50L178 232" marker-end="url(#ay)"/>
<path class="ray" d="M66 44L250 236L284 78" marker-end="url(#ay)"/>
</g>
<g fill="#C9B8A0" stroke="#8A7556" stroke-width="1.5">
<circle cx="100" cy="164" r="3"/><circle cx="114" cy="158" r="2.5"/><circle cx="108" cy="172" r="2.5"/><circle cx="92" cy="152" r="2"/><circle cx="120" cy="170" r="2"/>
</g>
<ellipse class="hot" cx="180" cy="242" rx="26" ry="7" fill="#FF8A1F"/>
<g fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round">
<path class="ir" d="M320 234q-6 -8 0 -16t0 -16t0 -16t0 -16t0 -16t0 -16" marker-end="url(#ar)"/>
<path class="ir" d="M352 150q6 8 0 16t0 16t0 16t0 16t0 16" marker-end="url(#ar)"/>
</g>
<g stroke="#2B2F4A" stroke-width="1.5">
<g transform="translate(336 136)"><circle cx="-8" cy="0" r="4" fill="#E5484D"/><circle cx="0" cy="0" r="5" fill="#6E7396"/><circle cx="8" cy="0" r="4" fill="#E5484D"/></g>
<g transform="translate(360 118)"><circle cx="-8" cy="0" r="4" fill="#E5484D"/><circle cx="0" cy="0" r="5" fill="#6E7396"/><circle cx="8" cy="0" r="4" fill="#E5484D"/></g>
<g transform="translate(296 152)"><circle cx="0" cy="0" r="5" fill="#6E7396"/><circle cx="-5" cy="-6" r="3" fill="#FFFFFF"/><circle cx="5" cy="-6" r="3" fill="#FFFFFF"/><circle cx="-5" cy="6" r="3" fill="#FFFFFF"/><circle cx="5" cy="6" r="3" fill="#FFFFFF"/></g>
</g>
</svg>
