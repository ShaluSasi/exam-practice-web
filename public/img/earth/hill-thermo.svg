.mq{animation:mq 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes mq{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.94)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
