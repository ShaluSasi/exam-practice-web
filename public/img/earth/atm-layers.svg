<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400" role="img">
<title>A column of the atmosphere from the ground up to space, divided into bands</title>
<style>
.cl{animation:drift 6s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-12px)}to{transform:translateX(14px)}}
.pl{animation:fly 7s linear infinite}
@keyframes fly{from{transform:translateX(-90px)}to{transform:translateX(250px)}}
.oz circle{animation:oz 2.6s ease-in-out infinite}
.oz circle:nth-child(odd){animation-delay:1.3s}
@keyframes oz{0%,100%{opacity:.35}50%{opacity:1}}
.st{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M16 0H344Q360 0 360 16V55H0V16Q0 0 16 0Z" fill="#3A3F6B"/>
<rect y="55" width="360" height="70" fill="#5A5F9A"/>
<rect y="125" width="360" height="70" fill="#9097CC"/>
<rect y="195" width="360" height="100" fill="#C9D6F4"/>
<rect y="295" width="360" height="75" fill="#E3F2FD"/>
<path d="M0 370H360V384Q360 400 344 400H16Q0 400 0 384Z" fill="#A9D98E"/>
<g class="st" fill="#FFFFFF"><circle cx="70" cy="20" r="1.8"/><circle cx="150" cy="40" r="1.5"/><circle cx="240" cy="16" r="1.8"/><circle cx="330" cy="44" r="1.5"/><circle cx="110" cy="80" r="1.4"/><circle cx="300" cy="100" r="1.4"/></g>
<g transform="translate(292 28)" stroke="#2B2F4A" stroke-width="1.5"><rect x="-6" y="-5" width="12" height="10" fill="#A3A8CC"/><rect x="-22" y="-3" width="14" height="6" fill="#0B93D4"/><rect x="8" y="-3" width="14" height="6" fill="#0B93D4"/></g>
<g class="oz" fill="#9B6BDA"><circle cx="60" cy="240" r="3.5"/><circle cx="90" cy="248" r="3.5"/><circle cx="120" cy="238" r="3.5"/><circle cx="150" cy="246" r="3.5"/><circle cx="180" cy="236" r="3.5"/><circle cx="210" cy="248" r="3.5"/><circle cx="240" cy="240" r="3.5"/><circle cx="270" cy="246" r="3.5"/><circle cx="300" cy="238" r="3.5"/><circle cx="330" cy="246" r="3.5"/></g>
<g stroke="#2B2F4A" stroke-width="1.5" stroke-dasharray="5 4" opacity=".6"><path d="M48 55H360M48 125H360M48 195H360M48 295H360"/></g>
<path d="M210 370L268 306L330 370Z" fill="#A3A8CC" stroke="#6E7396" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M268 306L254 322L264 318L270 326L278 318L284 322Z" fill="#FFFFFF" stroke="#6E7396" stroke-width="2" stroke-linejoin="round"/>
<g class="cl"><path d="M86 352Q84 336 100 336Q108 324 124 330Q140 326 144 340Q158 342 154 352Z" fill="#FFFFFF" stroke="#9DB6CC" stroke-width="2.5" stroke-linejoin="round"/></g>
<g class="pl"><path d="M60 308h34l8-5h4l-4 8h-42l-4-3z M76 308l-6-8h5l10 8z M78 311l-6 7h5l10-7z" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round"/></g>
<g font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2B2F4A">
<text x="6" y="368">0 km</text><text x="6" y="293">12 km</text><text x="6" y="193">50 km</text>
</g>
</svg>
