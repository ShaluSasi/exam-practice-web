<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" role="img">
<title>A pulse of light travelling across empty space from the Sun to the Earth</title>
<style>
.ph{animation:go 3s linear infinite}
@keyframes go{from{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}to{transform:translateX(220px);opacity:0}}
.sun{animation:p 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes p{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect width="400" height="160" rx="16" fill="#2E3460"/>
<g fill="#FFFFFF" opacity=".7"><circle cx="160" cy="24" r="1.5"/><circle cx="250" cy="134" r="1.5"/><circle cx="300" cy="30" r="1.2"/><circle cx="200" cy="120" r="1.2"/></g>
<path class="sun" d="M0 10A70 70 0 0 1 0 150Z" fill="#F6C453" stroke="#E0A92E" stroke-width="3"/>
<circle cx="340" cy="80" r="26" fill="#6EC1EC" stroke="#0B6FA4" stroke-width="2.5"/>
<path d="M326 70q10-8 18 0q2 10-8 12q-10-2-10-12zM342 90q8-4 12 4q-2 6-8 6q-6-2-4-10z" fill="#9BD08A" stroke="#3FA34D" stroke-width="1.5"/>
<g class="ph"><path d="M80 80q6 -10 12 0t12 0t12 0" fill="none" stroke="#F6C453" stroke-width="3" stroke-linecap="round"/><circle cx="118" cy="80" r="4" fill="#FFF3C4"/></g>
<g fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity=".8"><path d="M76 132H310M84 126L76 132L84 138M302 126L310 132L302 138"/></g>
</svg>
