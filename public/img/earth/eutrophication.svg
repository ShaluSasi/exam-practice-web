<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>A farm on a slope draining into a lake covered with green scum</title>
<style>
.ro{stroke-dasharray:8 6;animation:f 1.4s linear infinite}
@keyframes f{to{stroke-dashoffset:-28}}
.al{animation:al 4s ease-in-out infinite alternate}
@keyframes al{from{transform:translateX(-4px)}to{transform:translateX(4px)}}
.fi{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{0%,100%{transform:translateY(0) rotate(180deg)}50%{transform:translateY(-4px) rotate(172deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
