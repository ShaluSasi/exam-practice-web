<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
<title>Water moving between the sea, the sky, a mountain, a tree and the ground</title>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0B93D4"/></marker>
</defs>
<style>
.ev{animation:rise 2.6s ease-in infinite}
.ev:nth-of-type(2){animation-delay:.9s}.ev:nth-of-type(3){animation-delay:1.7s}
@keyframes rise{0%{transform:translateY(16px);opacity:0}30%{opacity:1}100%{transform:translateY(-22px);opacity:0}}
.tr{animation:rise 3s ease-in infinite}
.rain{stroke-dasharray:6 8;animation:fall .8s linear infinite}
@keyframes fall{to{stroke-dashoffset:-28}}
.riv{stroke-dasharray:8 6;animation:flow 1.4s linear infinite}
.gw{stroke-dasharray:8 6;animation:flow 2.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.cl{animation:drift 5s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
.dr{animation:merge 3s ease-in-out infinite}
@keyframes merge{0%,100%{opacity:.2}50%{opacity:1}}
.sun{animation:p 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes p{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M16 0H384Q400 0 400 16V240H0V16Q0 0 16 0Z" fill="#E3F2FD"/>
<circle class="sun" cx="42" cy="40" r="22" fill="#F6C453" stroke="#E0A92E" stroke-width="2.5"/>
<path d="M0 230H172L184 300H16Q0 300 0 284Z" fill="#8FD0F2" stroke="#0B93D4" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M172 232Q195 228 215 214L305 108L400 190V284Q400 300 384 300H184Z" fill="#A9D98E" stroke="#3FA34D" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M305 108L291 125L300 121L307 129L315 121L322 127Z" fill="#FFFFFF" stroke="#3FA34D" stroke-width="2" stroke-linejoin="round"/>
<path d="M181 262H400V284Q400 300 384 300H184Z" fill="#D9C49A"/>
<path class="gw" d="M380 282H200" fill="none" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" marker-end="url(#a)"/>
<g stroke="#0B93D4" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 4"><path d="M232 226V256M262 196V256M330 160V256"/></g>
<path class="riv" d="M292 128Q270 160 250 178Q228 200 205 218Q190 228 174 234" fill="none" stroke="#3D9BE0" stroke-width="4" stroke-linecap="round"/>
<g fill="none" stroke="#5FB4E6" stroke-width="3" stroke-linecap="round">
<path class="ev" d="M50 222q-6 -8 0 -16t0 -16t0 -16"/>
<path class="ev" d="M92 222q-6 -8 0 -16t0 -16t0 -16"/>
<path class="ev" d="M134 222q-6 -8 0 -16t0 -16t0 -16"/>
</g>
<path d="M98 104Q96 90 110 90Q116 80 128 86Q140 84 142 96Q152 98 148 106Z" fill="#FFFFFF" stroke="#9DB6CC" stroke-width="2.5" stroke-linejoin="round"/>
<g class="dr" fill="#9DD3F3"><circle cx="100" cy="116" r="2.5"/><circle cx="114" cy="122" r="2.5"/><circle cx="128" cy="116" r="2.5"/><circle cx="142" cy="122" r="2.5"/></g>
<g class="cl">
<path d="M226 72Q222 50 244 50Q252 34 272 42Q292 36 298 54Q316 56 310 74Z" fill="#E7EDF5" stroke="#8399B3" stroke-width="2.5" stroke-linejoin="round"/>
<g fill="none" stroke="#3D9BE0" stroke-width="2.5" stroke-linecap="round"><path class="rain" d="M240 82V130M256 82V140M272 82V132M288 82V118"/></g>
</g>
<path d="M365 162V140" stroke="#8A5A2B" stroke-width="6" stroke-linecap="round"/>
<circle cx="365" cy="128" r="17" fill="#3FA34D" stroke="#2C7A37" stroke-width="2.5"/>
<g fill="none" stroke="#5FB4E6" stroke-width="2.5" stroke-linecap="round"><path class="tr" d="M358 106q-4 -5 0 -10t0 -10"/><path class="tr" d="M372 106q-4 -5 0 -10t0 -10" style="animation-delay:1.4s"/></g>
</svg>
