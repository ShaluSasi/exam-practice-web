<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img">
<title>Two loops of ocean water on either side of the equator</title>
<style>
.cw,.ccw{transform-box:fill-box;transform-origin:center}
.cw{animation:cw 6s linear infinite}.ccw{animation:ccw 6s linear infinite}
@keyframes cw{to{transform:rotate(360deg)}}@keyframes ccw{to{transform:rotate(-360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<defs><marker id="h" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1"/></marker></defs>
<rect x="8" y="8" width="184" height="184" rx="12" fill="#BFE6FA" stroke="#0B93D4" stroke-width="2.5"/>
<path d="M8 100H192" stroke="#2B2F4A" stroke-width="2" stroke-dasharray="6 5"/>
<g class="ccw"><path d="M135.9 42.4A34 34 0 0 0 70.5 48.1" fill="none" stroke="#0B6FA4" stroke-width="5" stroke-linecap="round" marker-end="url(#h)"/><path d="M72.1 65.6A34 34 0 0 0 137.5 59.9" fill="none" stroke="#0B6FA4" stroke-width="5" stroke-linecap="round" marker-end="url(#h)"/></g><g class="cw"><path d="M72.1 134.4A34 34 0 0 1 137.5 140.1" fill="none" stroke="#0B6FA4" stroke-width="5" stroke-linecap="round" marker-end="url(#h)"/><path d="M135.9 157.6A34 34 0 0 1 70.5 151.9" fill="none" stroke="#0B6FA4" stroke-width="5" stroke-linecap="round" marker-end="url(#h)"/></g>
<g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" font-size="13"><text x="14" y="26">N</text><text x="14" y="186">S</text></g>
</svg>