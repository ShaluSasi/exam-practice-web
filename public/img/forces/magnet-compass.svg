<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" role="img">
<title>A bar magnet brought near a magnetic compass whose needle turns</title>
<style>
.nd{animation:nd 3s ease-in-out infinite;transform-box:view-box;transform-origin:262px 100px}@keyframes nd{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(30deg)}}.mg{animation:mg 3s ease-in-out infinite}@keyframes mg{50%{transform:translateX(16px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g class="mg"><rect x="24" y="80" width="70" height="40" rx="4" fill="#E5484D" stroke="#2B2F4A" stroke-width="3"/><rect x="94" y="80" width="70" height="40" rx="4" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3"/><text x="59" y="106" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">N</text><text x="129" y="106" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">S</text></g><circle cx="262" cy="100" r="62" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="3"/><circle cx="262" cy="100" r="52" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><path d="M262 52v8M262 140v8M214 100h8M302 100h8" stroke="#2B2F4A" stroke-width="2.5"/><g class="nd"><path d="M262 58L270 100H254Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><path d="M262 142L270 100H254Z" fill="#E6E8F2" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/></g><circle cx="262" cy="100" r="4" fill="#2B2F4A"/>
</svg>
