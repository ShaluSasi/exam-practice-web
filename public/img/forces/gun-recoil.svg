<style>
.pl{animation:pl 2.4s ease-in-out infinite}@keyframes pl{50%{opacity:.55}}.rc{animation:rc 3s ease-out infinite}@keyframes rc{0%,20%{transform:translateX(0)}28%{transform:translateX(-14px)}60%,100%{transform:translateX(0)}}.bl{animation:bl 3s linear infinite}@keyframes bl{0%,20%{transform:translateX(0);opacity:0}21%{opacity:1}50%{transform:translateX(110px);opacity:1}55%,100%{transform:translateX(120px);opacity:0}}.pf{opacity:0;animation:pf 3s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pf{0%,19%{opacity:0;transform:scale(.4)}24%{opacity:1}45%,100%{opacity:0;transform:scale(1.4)}}
