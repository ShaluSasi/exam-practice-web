<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A pipe with crude oil, gas, water and slurry that can flow through it</title><style>.flow{stroke-dasharray:6 10;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-16}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="22" font-family="sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Things that can travel through a pipeline</text><path d="M60 56 Q72 72 60 78 Q48 72 60 56Z" fill="#5A4632" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><text x="60" y="100" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >crude oil</text><path d="M160 58 Q150 66 156 74 Q148 70 152 84 Q160 92 170 84 Q176 70 166 64 Q166 72 160 58Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="160" y="100" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >natural gas</text><path d="M260 56 Q272 72 260 78 Q248 72 260 56Z" fill="#7FD1F5" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><text x="260" y="100" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >water</text><circle cx="340" cy="66" r="9" fill="#8B6B4A" stroke="#2B2F4A" stroke-width="2" /><circle cx="358" cy="74" r="7" fill="#A47E57" stroke="#2B2F4A" stroke-width="2" /><circle cx="346" cy="82" r="6" fill="#8B6B4A" stroke="#2B2F4A" stroke-width="2" /><text x="348" y="100" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >solids as slurry</text><path d="M20 150 H380" fill="none" stroke="#8A93A6" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" /><path d="M20 150 H380" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="flow"/><rect x="20" y="134" width="360" height="32" rx="10" fill="none" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="200" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >a pipeline carries them without loading and unloading</text></svg>