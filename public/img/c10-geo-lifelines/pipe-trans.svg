<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Oil moved by road, rail and ship with transfers marked, compared with one continuous pipeline</title><style>.spin{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.flow{stroke-dasharray:6 10;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-16}}
.puff{animation:puff 3s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes puff{from{transform:translateY(0) scale(.6);opacity:.9}to{transform:translateY(-26px) scale(1.4);opacity:0}}
.hop{animation:hop 2.4s ease-in-out infinite}@keyframes hop{50%{transform:translateY(-6px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="22" font-family="sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Moving oil from a well to a refinery</text><text x="30" y="52" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="start" >By road, rail, ship</text><g transform="translate(34 100) scale(0.5 0.5)"><path d="M-14 0 L0 -56 L14 0 M-9 -20 H9 M-5 -38 H5" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="-24" y="-8" width="10" height="8" rx="2" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" /><g class="hop"><path d="M16 -8 L36 -8 L30 -22 L22 -22 Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2"/></g></g><g transform="translate(130 100) scale(0.55 0.55)"><rect x="-40" y="-34" width="50" height="26" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.2" /><rect x="-36" y="-46" width="40" height="12" rx="6" fill="#9AA3B0" stroke="#2B2F4A" stroke-width="1.8" /><path d="M10 -30 H26 L34 -18 V-8 H10 Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><rect x="14" y="-27" width="11" height="8" rx="1.5" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="-26" cy="-8" r="7" fill="#333" stroke="#2B2F4A" stroke-width="2" /><g class="spin"><circle cx="-26" cy="-8" r="3.5" fill="#DDD"/><path d="M-29.5 -8 H-22.5 M-26 -11.5 V-4.5" stroke="#777" stroke-width="1.3"/></g><circle cx="22" cy="-8" r="7" fill="#333" stroke="#2B2F4A" stroke-width="2" /><g class="spin"><circle cx="22" cy="-8" r="3.5" fill="#DDD"/><path d="M18.5 -8 H25.5 M22 -11.5 V-4.5" stroke="#777" stroke-width="1.3"/></g></g><g transform="translate(250 100) scale(0.5 0.5)"><rect x="-20" y="-34" width="50" height="26" rx="5" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.2" /><rect x="-14" y="-30" width="12" height="9" rx="2" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.5" /><rect x="2" y="-30" width="12" height="9" rx="2" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.5" /><path d="M30 -30 L40 -16 V-8 H30 Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="-8" cy="-8" r="6" fill="#333" stroke="#2B2F4A" stroke-width="2" /><g class="spin"><circle cx="-8" cy="-8" r="3.0" fill="#DDD"/><path d="M-11.0 -8 H-5.0 M-8 -11.0 V-5.0" stroke="#777" stroke-width="1.3"/></g><circle cx="20" cy="-8" r="6" fill="#333" stroke="#2B2F4A" stroke-width="2" /><g class="spin"><circle cx="20" cy="-8" r="3.0" fill="#DDD"/><path d="M17.0 -8 H23.0 M20 -11.0 V-5.0" stroke="#777" stroke-width="1.3"/></g><rect x="-72" y="-32" width="48" height="24" rx="3" fill="#FFD9A0" stroke="#2B2F4A" stroke-width="2.2" /><rect x="-67" y="-27" width="10" height="8" rx="1.5" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.4" /><rect x="-53" y="-27" width="10" height="8" rx="1.5" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.4" /><rect x="-39" y="-27" width="10" height="8" rx="1.5" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.4" /><circle cx="-62" cy="-8" r="5.5" fill="#333" stroke="#2B2F4A" stroke-width="2" /><g class="spin"><circle cx="-62" cy="-8" r="2.75" fill="#DDD"/><path d="M-64.75 -8 H-59.25 M-62 -10.75 V-5.25" stroke="#777" stroke-width="1.3"/></g><circle cx="-34" cy="-8" r="5.5" fill="#333" stroke="#2B2F4A" stroke-width="2" /><g class="spin"><circle cx="-34" cy="-8" r="2.75" fill="#DDD"/><path d="M-36.75 -8 H-31.25 M-34 -10.75 V-5.25" stroke="#777" stroke-width="1.3"/></g><path d="M-24 -14 h4" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(336 100) scale(0.38 0.38)"><path d="M-70 -18 H70 L56 4 H-56 Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin=