roke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="-24" y="-8" width="10" height="8" rx="2" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" /><g class="hop"><path d="M16 -8 L36 -8 L30 -22 L22 -22 Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2"/></g></g><g transform="translate(372 196) scale(0.5 0.5)"><rect x="-8" y="-70" width="16" height="70" rx="4" fill="#C9CED6" stroke="#2B2F4A" stroke-width="2.2" /><path d="M-8 -52 H8 M-8 -34 H8 M-8 -16 H8" fill="none" stroke="#2B2F4A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><circle class="puff" cx="0" cy="-74" r="4" fill="#E8EDF5"/></g><path d="M64 186 H348" fill="none" stroke="#8A93A6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" /><path d="M64 186 H348" fill="none" stroke="#FF8A1F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" class="flow"/><text x="210" y="214" font-family="sans-serif" font-size="11" font-weight="700" fill="#3FA34D" text-anchor="middle" >one continuous flow: no transfers, no delay</text></svg>