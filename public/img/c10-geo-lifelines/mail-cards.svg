<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Two cards: cards and envelopes flown by air, and book packets and newspapers carried by road</title><style>.spin{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.drive{animation:drive 5s linear infinite}@keyframes drive{from{transform:translateX(-30px)}to{transform:translateX(60px)}}
