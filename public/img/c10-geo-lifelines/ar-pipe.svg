<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A tall bar for the cost of laying a pipeline and a short bar for the cost of running it</title><style>.grow{animation:grow 2.6s ease-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.3)}to{transform:scaleY(1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="22" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Pipeline costs (imaginary heights)</text><text x="146.09756097560975" y="66.72727272727273" font-family="sans-serif" font-size="14" font-weight="600" fill="#E5484D" text-anchor="middle" >HIGH</text><text x="253.90243902439025" y="178.72727272727272" font-family="sans-serif" font-size="14" font-weight="600" fill="#3FA34D" text-anchor="middle" >LOW</text><path d="M70 60 V200 H330" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g class="grow"><rect x="114.4" y="72.7" width="63.4" height="127.3" rx="3" fill="#E5484D" stroke="#2B2F4A" stroke-width="2"/></g><text x="146.09756097560975" y="214" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Cost of laying</text><g class="grow"><rect x="222.2" y="184.7" width="63.4" height="15.3" rx="3" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2"/></g><text x="253.90243902439025" y="214" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Cost of running</text></svg>