<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Crude oil flowing through a pipeline from an oil field to a refinery and a factory</title><style>.flow{stroke-dasharray:6 10;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-16}}
.puff{animation:puff 3s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes puff{from{transform:translateY(0) scale(.6);opacity:.9}to{transform:translateY(-26px) scale(1.4);opacity:0}}
.hop{animation:hop 2.4s ease-in-out infinite}@keyframes hop{50%{transform:translateY(-6px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="240" rx="0" fill="#E3F2FD" /><path d="M0 160 H400 V224 Q400 240 384 240 H16 Q0 240 0 224 Z" fill="#CFE8B5"/><g transform="translate(50 170) scale(0.9 0.9)"><path d="M-14 0 L0 -56 L14 0 M-9 -20 H9 M-5 -38 H5" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="-24" y="-8" width="10" height="8" rx="2" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" /><g class="hop"><path d="M16 -8 L36 -8 L30 -22 L22 -22 Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2"/></g></g><g transform="translate(250 170) scale(0.9 0.9)"><rect x="-8" y="-70" width="16" height="70" rx="4" fill="#C9CED6" stroke="#2B2F4A" stroke-width="2.2" /><path d="M-8 -52 H8 M-8 -34 H8 M-8 -16 H8" fill="none" stroke="#2B2F4A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><circle class="puff" cx="0" cy="-74" r="4" fill="#E8EDF5"/></g><g transform="translate(340 170) scale(0.55 0.55)"><rect x="-40" y="-34" width="80" height="34" rx="2" fill="#B9C2D0" stroke="#2B2F4A" stroke-width="2.2" /><path d="M-40 -34 L-26 -48 V-34 M-26 -34 L-12 -48 V-34 M-12 -34 L2 -48 V-34" fill="#B9C2D0" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="14" y="-64" width="12" height="30" rx="1" fill="#C97B63" stroke="#2B2F4A" stroke-width="2.2" /><rect x="-30" y="-22" width="14" height="12" rx="0" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.6" /><rect x="-8" y="-22" width="14" height="12" rx="0" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.6" /><rect x="24" y="-18" width="12" height="18" rx="0" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1.6" /><circle class="puff" cx="20" cy="-68" r="5" fill="#E8EDF5"/><circle class="puff" cx="24" cy="-72" r="4" fill="#E8EDF5" style="animation-delay:1.2s"/></g><path d="M72 168 H330" fill="none" stroke="#8A93A6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><path d="M72 168 H330" fill="none" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="flow"/><text x="200" y="215" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >crude oil travels underground to where it is used</text></svg>