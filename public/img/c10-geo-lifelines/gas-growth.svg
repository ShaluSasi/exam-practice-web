<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Two bars: 1,700 km of gas pipeline at first and 18,500 km now</title><style>.grow{animation:grow 2.6s ease-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.3)}to{transform:scaleY(1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="22" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Cross-country gas pipelines (km), drawn to scale</text><path d="M60 50 V200 H340" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M60 200.0 H340" fill="none" stroke="#D6DAE3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="204.0" font-family="sans-serif" font-size="10" font-weight="500" fill="#2B2F4A" text-anchor="end" >0</text><path d="M60 151.4 H340" fill="none" stroke="#D6DAE3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="155.35135135135135" font-family="sans-serif" font-size="10" font-weight="500" fill="#2B2F4A" text-anchor="end" >6,000</text><path d="M60 102.7 H340" fill="none" stroke="#D6DAE3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="106.70270270270271" font-family="sans-serif" font-size="10" font-weight="500" fill="#2B2F4A" text-anchor="end" >12,000</text><path d="M60 54.1 H340" fill="none" stroke="#D6DAE3" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="58.05405405405406" font-family="sans-serif" font-size="10" font-weight="500" fill="#2B2F4A" text-anchor="end" >18,000</text><g class="grow"><rect x="100.0" y="186.2" width="80.0" height="13.8" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2"/></g><text x="140.0" y="181.21621621621622" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >1,700</text><text x="140.0" y="214" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >First line (HVJ)</text><g class="grow"><rect x="220.0" y="50.0" width="80.0" height="150.0" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2"/></g><text x="260.0" y="45.0" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >18,500</text><text x="260.0" y="214" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Now</text></svg>