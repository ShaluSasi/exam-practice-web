<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A balance scale tipping towards imports against exports</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="22" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Imports bigger than exports</text><path d="M200 60 V190 M130 190 H270" fill="none" stroke="#2B2F4A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><path d="M110 94 H290" fill="none" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" transform="rotate(8 200 94)"/><g transform="translate(130 128) scale(1 1)"><rect x="-34" y="-20" width="68" height="24" rx="6" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" /><text x="0" y="-3" font-family="sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle" >Exports</text></g><g transform="translate(272 142) scale(1 1)"><rect x="-34" y="-20" width="68" height="24" rx="6" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" /><text x="0" y="-3" font-family="sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle" >Imports</text></g></svg>