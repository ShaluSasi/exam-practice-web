<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A stacked bar showing broad, metre and narrow gauge route lengths drawn to scale</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="26" font-family="sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Indian Railways route length by gauge (total 67,956 km)</text><rect x="30" y="50" width="319.95703102007184" height="40" rx="0" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" /><rect x="349.95703102007184" y="50" width="12.017776208134675" height="40" rx="0" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" /><rect x="361.9748072282065" y="50" width="8.025192771793513" height="40" rx="0" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" /><text x="189.97851551003592" y="76" font-family="sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle" >Broad gauge  63,950 km</text><path d="M356.0 90 V112 H150" fill="none" stroke="#FF8A1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="148" y="116" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="end" >Metre gauge  2,402 km</text><path d="M366.0 90 V140 H150" fill="none" stroke="#3FA34D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="148" y="144" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="end" >Narrow gauge  1,604 km</text><rect x="40" y="170" width="320" height="50" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><text x="200" y="191" font-family="sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="middle" >63,950 + 2,402 + 1,604 = 67,956 km</text><text x="200" y="210" font-family="sans-serif" font-size="10" font-weight="500" fill="#2B2F4A" text-anchor="middle" >Source: Railway Yearbook 2019-20</text></svg>