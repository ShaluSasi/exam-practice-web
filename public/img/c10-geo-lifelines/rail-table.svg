mily="sans-serif" font-size="16" font-weight="600" fill="#E5484D" text-anchor="middle" >?</text><path d="M20 148 H380" fill="none" stroke="#C9CED6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="100" y="172" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Narrow Gauge</text><text x="230" y="172" font-family="sans-serif" font-size="12" font-weight="500" fill="#2B2F4A" text-anchor="middle" >0.762 and 0.610</text><text x="335" y="172" font-family="sans-serif" font-size="16" font-weight="600" fill="#E5484D" text-anchor="middle" >?</text><text x="200" y="216" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Put the routes in order of length</text></svg>