<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>An underground pipeline joining an oil field to a refinery, a storage tank, a factory and a power plant</title><style>.drift{animation:drift 5s ease-in-out infinite alternate}@keyframes drift{from{transform:translateX(0)}to{transform:translateX(14px)}}
.flow{stroke-dasharray:6 10;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-16}}
.puff{animation:puff 3s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes puff{from{transform:translateY(0) scale(.6);opacity:.9}to{transform:translateY(-26px) scale(1.4);opacity:0}}
