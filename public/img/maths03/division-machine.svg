<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" role="img" font-family="system-ui, sans-serif" font-weight="600">
<title>A gear machine turning a fraction card into a decimal tape</title>
<style>
.g1{transform-box:fill-box;transform-origin:center;animation:rot 4s linear infinite}.g2{transform-box:fill-box;transform-origin:center;animation:rot 4s linear infinite reverse}@keyframes rot{to{transform:rotate(360deg)}}
.tape{animation:tp 3s ease-in-out infinite}@keyframes tp{0%{transform:translateX(-30px)}60%,100%{transform:translateX(0)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="200" y="70" width="230" height="190" rx="18" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="3"/>
<g class="g1"><rect x="264" y="102" width="12" height="14" fill="#F6C453" stroke="#2B2F4A" stroke-width="2" transform="rotate(0 270 140)"/><rect x="264" y="102" width="12" height="14" fill="#F6C453" stroke="#2B2F4A" stroke-width="2" transform="rotate(45 270 140)"/><rect x="264" y="102" width="12" height="14" fill="#F6C453" stroke="#2B2F4A" stroke-width="2" transform="rotate(90 270 140)"/><rect x="264" y="102" width="12" height="14" fill="#F6C453" stroke="#2B2F4A" stroke-width="2" transform="rotate(135 270 140)"/><rect x="264" y="102" width="12" height="14" fill="#F6C453" stroke="#2B2F4A" stroke-width="2" transform="rotate(180 270 140)"/><rect x="264" y="102" width="12" height="14" fill="#F6C453" stroke="#2B2F4A" stroke-width="2" transform="rotate(225 270 140)"/><rect x="264" y="102" width="12" height="14" fill="#F6C453" stroke="#2B2F4A" stroke-width="2" transform="rotate(270 270 140)"/><rect x="264" y="102" width="12" height="14" fill="#F6C453" stroke="#2B2F4A" stroke-width="2" transform="rotate(315 270 140)"/><circle cx="270" cy="140" r="30" fill="#F6C453" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="270" cy="140" r="10" fill="#FFF9EE" stroke="#2B2F4A" stroke-width="2"/></g><g class="g2"><rect x="339" y="158" width="12" height="14" fill="#FFB27A" stroke="#2B2F4A" stroke-width="2" transform="rotate(0 345 190)"/><rect x="339" y="158" width="12" height="14" fill="#FFB27A" stroke="#2B2F4A" stroke-width="2" transform="rotate(45 345 190)"/><rect x="339" y="158" width="12" height="14" fill="#FFB27A" stroke="#2B2F4A" stroke-width="2" transform="rotate(90 345 190)"/><rect x="339" y="158" width="12" height="14" fill="#FFB27A" stroke="#2B2F4A" stroke-width="2" transform="rotate(135 345 190)"/><rect x="339" y="158" width="12" height="14" fill="#FFB27A" stroke="#2B2F4A" stroke-width="2" transform="rotate(180 345 190)"/><rect x="339" y="158" width="12" height="14" fill="#FFB27A" stroke="#2B2F4A" stroke-width="2" transform="rotate(225 345 190)"/><rect x="339" y="158" width="12" height="14" fill="#FFB27A" stroke="#2B2F4A" stroke-width="2" transform="rotate(270 345 190)"/><rect x="339" y="158" width="12" height="14" fill="#FFB27A" stroke="#2B2F4A" stroke-width="2" transform="rotate(315 345 190)"/><circle cx="345" cy="190" r="24" fill="#FFB27A" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="345" cy="190" r="8" fill="#FFF9EE" stroke="#2B2F4A" stroke-width="2"/></g>
<rect x="40" y="120" width="110" height="100" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="3"/><text x="95" y="166" font-size="30" text-anchor="middle" fill="#2B2F4A">p</text><line x1="83" y1="170" x2="107" y2="170" stroke="#2B2F4A" stroke-width="2"/><text x="95" y="201" font-size="30" text-anchor="middle" fill="#2B2F4A">q</text>
<path d="M156 170h36" stroke="#2B2F4A" stroke-width="4"/><path d="M182 160l12 10l-12 10" fill="none" stroke="#2B2F4A" stroke-width="4"/>
<g class="tape"><rect x="440" y="150" width="180" height="50" rx="6" fill="#fff" stroke="#2B2F4A" stroke-width="2.5"/><text x="460" y="185" font-size="24" text-anchor="start" fill="#2B2F4A">0. _ _ _ …</text></g>
<rect x="250" y="260" width="20" height="30" fill="#2B2F4A"/><rect x="360" y="260" width="20" height="30" fill="#2B2F4A"/>
</svg>
