<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" font-family="system-ui, sans-serif" font-weight="600">
<title>A sieve that sorts the prime factors of a denominator</title>
<style>
.fall{animation:fa 3s ease-in infinite}@keyframes fa{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(120px);opacity:0}}
.d1{animation-delay:-1s}.d2{animation-delay:-2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="320" y="34" font-size="18" text-anchor="middle" fill="#2B2F4A">prime factors of the denominator</text>
<g class="fall "><circle cx="220" cy="74" r="18" fill="#D4F0D0" stroke="#2B2F4A" stroke-width="2.5"/><text x="220" y="81" font-size="20" text-anchor="middle" fill="#2B2F4A">2</text></g><g class="fall d1"><circle cx="320" cy="74" r="18" fill="#D4F0D0" stroke="#2B2F4A" stroke-width="2.5"/><text x="320" y="81" font-size="20" text-anchor="middle" fill="#2B2F4A">5</text></g><g class="fall d2"><circle cx="420" cy="74" r="18" fill="#FDE2E2" stroke="#2B2F4A" stroke-width="2.5"/><text x="420" y="81" font-size="20" text-anchor="middle" fill="#2B2F4A">3</text></g>
<path d="M140 150h360l-120 110h-120z" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/>
<path d="M170 170h300M200 196h240M230 222h180" stroke="#A3A8CC" stroke-width="3" stroke-dasharray="12 10"/>
<circle cx="250" cy="290" r="16" fill="#3FA34D"/><path d="M243 290l5 6l10 -12" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
<circle cx="390" cy="290" r="16" fill="#E5484D"/><path d="M384 284l12 12M396 284l-12 12" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
</svg>
