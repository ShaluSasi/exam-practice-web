<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" role="img" font-family="system-ui, sans-serif" font-weight="600">
<title>Four debt slips of minus three rupees being taken away</title>
<style>
.gone{animation:gone 4s ease-in-out infinite}@keyframes gone{0%,30%{transform:translateX(0);opacity:1}70%,100%{transform:translateX(120px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g class="gone" style="animation-delay:0s"><rect x="60" y="110" width="100" height="62" rx="8" fill="#FDE2E2" stroke="#E5484D" stroke-width="3"/><text x="110" y="150" font-size="24" text-anchor="middle" fill="#C62828">−₹3</text></g><g class="gone" style="animation-delay:0.25s"><rect x="180" y="110" width="100" height="62" rx="8" fill="#FDE2E2" stroke="#E5484D" stroke-width="3"/><text x="230" y="150" font-size="24" text-anchor="middle" fill="#C62828">−₹3</text></g><g class="gone" style="animation-delay:0.5s"><rect x="300" y="110" width="100" height="62" rx="8" fill="#FDE2E2" stroke="#E5484D" stroke-width="3"/><text x="350" y="150" font-size="24" text-anchor="middle" fill="#C62828">−₹3</text></g><g class="gone" style="animation-delay:0.75s"><rect x="420" y="110" width="100" height="62" rx="8" fill="#FDE2E2" stroke="#E5484D" stroke-width="3"/><text x="470" y="150" font-size="24" text-anchor="middle" fill="#C62828">−₹3</text></g><path d="M60 220h470" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round"/><path d="M516 206l18 14l-18 14" fill="none" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="300" y="262" font-size="18" text-anchor="middle" fill="#2B2F4A">Four debts taken away</text>
<circle cx="320" cy="60" r="30" fill="#F6C453" stroke="#2B2F4A" stroke-width="3"/><circle cx="310" cy="54" r="3" fill="#2B2F4A"/><circle cx="330" cy="54" r="3" fill="#2B2F4A"/><path d="M306 68q14 12 28 0" stroke="#2B2F4A" stroke-width="3" fill="none" stroke-linecap="round"/>
