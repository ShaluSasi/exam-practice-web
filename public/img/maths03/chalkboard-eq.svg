<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" role="img" font-family="system-ui, sans-serif" font-weight="600">
<title>A chalkboard with an equation in x</title>
<style>
.ch{animation:ch 2s ease-in-out infinite}@keyframes ch{50%{transform:translate(-14px,-4px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="30" y="24" width="580" height="250" rx="12" fill="#2F5D50" stroke="#8B5A2B" stroke-width="12"/>
<text x="170" y="146" font-size="36" text-anchor="middle" fill="#FFFFFF">x</text><line x1="156.2" y1="150" x2="183.8" y2="150" stroke="#FFFFFF" stroke-width="2"/><text x="170" y="187" font-size="36" text-anchor="middle" fill="#FFFFFF">3</text><text x="230" y="162" font-size="36" text-anchor="middle" fill="#FFFFFF">+</text><text x="290" y="146" font-size="36" text-anchor="middle" fill="#FFFFFF">x</text><line x1="276.2" y1="150" x2="303.8" y2="150" stroke="#FFFFFF" stroke-width="2"/><text x="290" y="187" font-size="36" text-anchor="middle" fill="#FFFFFF">5</text><text x="355" y="162" font-size="36" text-anchor="middle" fill="#FFFFFF">=</text><text x="440" y="146" font-size="36" text-anchor="middle" fill="#FFFFFF">16</text><line x1="415.4" y1="150" x2="464.6" y2="150" stroke="#FFFFFF" stroke-width="2"/><text x="440" y="187" font-size="36" text-anchor="middle" fill="#FFFFFF">15</text>
<rect x="40" y="280" width="560" height="14" rx="4" fill="#8B5A2B"/><g class="ch"><rect x="470" y="268" width="40" height="10" rx="4" fill="#fff"/></g><rect x="120" y="264" width="60" height="16" rx="3" fill="#C8925A" stroke="#2B2F4A" stroke-width="2"/>
</svg>
