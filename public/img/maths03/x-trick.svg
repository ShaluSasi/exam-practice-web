<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" role="img" font-family="system-ui, sans-serif" font-weight="600">
<title>Two decimals with the same endless tail lined up for subtraction</title>
<style>
.fade{animation:fd 3s ease-in-out infinite}@keyframes fd{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="140" y="90" font-size="26" text-anchor="end" fill="#2B2F4A">100x =</text><text x="160" y="90" font-size="26" text-anchor="start" fill="#2B2F4A">81.</text><g class="fade"><text x="214" y="90" font-size="26" text-anchor="start" fill="#0B93D4">818181…</text></g>
<text x="140" y="150" font-size="26" text-anchor="end" fill="#2B2F4A">x =</text><text x="174" y="150" font-size="26" text-anchor="start" fill="#2B2F4A">0.</text><g class="fade"><text x="214" y="150" font-size="26" text-anchor="start" fill="#0B93D4">818181…</text></g>
<text x="40" y="150" font-size="30" text-anchor="start" fill="#E5484D">−</text>
<path d="M60 172h340" stroke="#2B2F4A" stroke-width="3"/><text x="230" y="214" font-size="18" text-anchor="middle" fill="#3FA34D">the endless tails cancel!</text>
<path d="M470 70l40 40M510 70l-40 40" stroke="#E5484D" stroke-width="6" stroke-linecap="round" class="fade"/><circle cx="490" cy="170" r="30" fill="#D4F0D0" stroke="#3FA34D" stroke-width="3"/><path d="M476 170l10 10l18 -20" fill="none" stroke="#3FA34D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
