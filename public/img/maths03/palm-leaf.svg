<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" font-family="system-ui, sans-serif" font-weight="600">
<title>A palm-leaf manuscript with ten raised to the power twelve written on it</title>
<style>
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .9s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.8,1.15)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M40 70Q30 140 40 190L600 190Q612 140 600 70Z" fill="#E9D29A" stroke="#B28B3E" stroke-width="3" stroke-linejoin="round"/>
<circle cx="120" cy="130" r="7" fill="#FFF9EE" stroke="#B28B3E" stroke-width="2"/><circle cx="520" cy="130" r="7" fill="#FFF9EE" stroke="#B28B3E" stroke-width="2"/>
<path d="M60 100h40M60 160h40M540 100h40M540 160h40" stroke="#B28B3E" stroke-width="2" stroke-dasharray="6 5"/>
<text x="300" y="150" font-size="64" text-anchor="middle" fill="#6B4423">10</text><text x="358" y="112" font-size="32" text-anchor="middle" fill="#6B4423">12</text>
<text x="320" y="240" font-size="26" text-anchor="middle" fill="#2B2F4A" font-style="italic">parārdha</text>
<path d="M290 300q30 -18 60 0z" fill="#C8643C" stroke="#2B2F4A" stroke-width="2"/><path class="fl" d="M320 284q-8 -12 0 -26q8 14 0 26z" fill="#FF8A1F"/>
</svg>
