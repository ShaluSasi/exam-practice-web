<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" role="img" font-family="system-ui, sans-serif" font-weight="600">
<title>An empty decimal place-value chart from ones to ten-thousandths</title>
<style>
.cur{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="40" y="70" width="90" height="50" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2"/><text x="85" y="101" font-size="14" text-anchor="middle" fill="#2B2F4A">Ones</text><rect x="40" y="120" width="90" height="80" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><rect x="160" y="70" width="120" height="50" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2"/><text x="220" y="101" font-size="14" text-anchor="middle" fill="#2B2F4A">Tenths</text><rect x="160" y="120" width="120" height="80" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><rect x="280" y="70" width="120" height="50" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2"/><text x="340" y="101" font-size="14" text-anchor="middle" fill="#2B2F4A">Hundredths</text><rect x="280" y="120" width="120" height="80" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><rect x="400" y="70" width="120" height="50" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2"/><text x="460" y="101" font-size="14" text-anchor="middle" fill="#2B2F4A">Thousandths</text><rect x="400" y="120" width="120" height="80" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><rect x="520" y="70" width="130" height="50" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2"/><text x="585" y="101" font-size="14" text-anchor="middle" fill="#2B2F4A">Ten-thousandths</text><rect x="520" y="120" width="130" height="80" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><circle cx="145" cy="180" r="7" fill="#2B2F4A"/><rect class="cur" x="215" y="135" width="6" height="50" fill="#FF8A1F"/><path d="M560 250l60 -60l14 14l-60 60l-20 6z" fill="#F6C453" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
