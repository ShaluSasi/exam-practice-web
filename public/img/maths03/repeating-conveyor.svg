<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" role="img" font-family="system-ui, sans-serif" font-weight="600">
<title>A conveyor belt carrying the digits 3 and 6 again and again after a decimal point</title>
<style>
.belt{animation:bt 3s linear infinite}@keyframes bt{to{transform:translateX(640px)}}
.rl{transform-box:fill-box;transform-origin:center;animation:rl 1.2s linear infinite}@keyframes rl{to{transform:rotate(-360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<defs><clipPath id="w"><rect x="110" y="60" width="540" height="100"/></clipPath></defs>
<rect x="30" y="74" width="76" height="76" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="3"/><text x="68" y="126" font-size="34" text-anchor="middle" fill="#2B2F4A">0.</text>
<g clip-path="url(#w)"><rect x="120" y="80" width="56" height="64" rx="8" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><text x="148" y="124" font-size="32" text-anchor="middle" fill="#2B2F4A">3</text><rect x="190" y="80" width="56" height="64" rx="8" fill="#FCE7B2" stroke="#2B2F4A" stroke-width="2.5"/><text x="218" y="124" font-size="32" text-anchor="middle" fill="#2B2F4A">6</text><rect x="260" y="80" width="56" height="64" rx="8" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><text x="288" y="124" font-size="32" text-anchor="middle" fill="#2B2F4A">3</text><rect x="330" y="80" width="56" height="64" rx="8" fill="#FCE7B2" stroke="#2B2F4A" stroke-width="2.5"/><text x="358" y="124" font-size="32" text-anchor="middle" fill="#2B2F4A">6</text><rect x="400" y="80" width="56" height="64" rx="8" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><text x="428" y="124" font-size="32" text-anchor="middle" fill="#2B2F4A">3</text><rect x="470" y="80" width="56" height="64" rx="8" fill="#FCE7B2" stroke="#2B2F4A" stroke-width="2.5"/><text x="498" y="124" font-size="32" text-anchor="middle" fill="#2B2F4A">6</text><rect x="540" y="80" width="56" height="64" rx="8" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><text x="568" y="124" font-size="32" text-anchor="middle" fill="#2B2F4A">3</text><rect x="610" y="80" width="56" height="64" rx="8" fill="#FCE7B2" stroke="#2B2F4A" stroke-width="2.5"/><text x="638" y="124" font-size="32" text-anchor="middle" fill="#2B2F4A">6</text><rect x="680" y="80" width="56" height="64" rx="8" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><text x="708" y="124" font-size="32" text-anchor="middle" fill="#2B2F4A">3</text><rect x="750" y="80" width="56" height="64" rx="8" fill="#FCE7B2" stroke="#2B2F4A" stroke-width="2.5"/><text x="778" y="124" font-size="32" text-anchor="middle" fill="#2B2F4A">6</text><rect x="820" y="80" width="56" height="64" rx="8" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><text x="848" y="124" font-size="32" text-anchor="middle" fill="#2B2F4A">3</text><rect x="890" y="80" width="56" height="64" rx="8" fill="#FCE7B2" stroke="#2B2F4A" stroke-width="2.5"/><text x="918" y="124" font-size="32" text-anchor="middle" fill="#2B2F4A">6</text><rect class="belt" x="40" y="70" width="40" height="84" fill="#fff" opacity=".45"/></g>
<rect x="104" y="150" width="560" height="10" rx="5" fill="#2B2F4A"/><g class="rl"><circle cx="130" cy="170" r="16" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="2.5"/><path d="M130 156v28" stroke="#2B2F4A" stroke-width="2"/></g><g class="rl"><circle cx="200" cy="170" r="16" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="2.5"/><path d="M200 156v28" stroke="#2B2F4A" stroke-width="2"/></g><g class="rl"><circle cx="270" cy="170" r="16" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="2.5"/><path d="M270 156v28" stroke="#2B2F4A" stroke-width="2"/></g><g class="rl"><circle cx="340" cy="170" r="16" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="2.5"/><path d="M340 156v28" stroke="#2B2F4A" stroke-width="2"/></g><g class="rl"><circle cx="410" cy="170" r="16" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="2.5"/><path d="M410 156v28" stroke="#2B2F4A" stroke-width="2"/></g><g class="rl"><circle cx="480" cy="170" r="16" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="2.5"/><path d="M480 156v28" stroke="#2B2F4A" stroke-width="2"/></g><g class="rl"><circle cx="550" cy="170" r="16" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="2.5"/><path d="M550 156v28" stroke="#2B2F4A" stroke-width="2"/></g><g class="rl"><circle cx="620" cy="170" r="16" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="2.5"/><path d="M620 156v28" stroke="#2B2F4A" stroke-width="2"/></g>
<text x="640" y="230" font-size="18" text-anchor="end" fill="#2B2F4A">… forever</text>
</svg>
