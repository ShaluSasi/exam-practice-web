<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" role="img" font-family="system-ui, sans-serif" font-weight="600">
<title>The digits 2, 0, 5, 5, 5 in boxes with a decimal point sliding between them</title>
<style>
.dot{animation:dt 5s ease-in-out infinite}@keyframes dt{0%,20%{transform:translateX(0)}35%,55%{transform:translateX(66px)}70%,90%{transform:translateX(132px)}100%{transform:translateX(0)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="110" y="90" width="56" height="70" rx="8" fill="#FCE7B2" stroke="#2B2F4A" stroke-width="2.5"/><text x="138" y="138" font-size="34" text-anchor="middle" fill="#2B2F4A">2</text><rect x="176" y="90" width="56" height="70" rx="8" fill="#F7C6D9" stroke="#2B2F4A" stroke-width="2.5"/><text x="204" y="138" font-size="34" text-anchor="middle" fill="#2B2F4A">0</text><rect x="242" y="90" width="56" height="70" rx="8" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><text x="270" y="138" font-size="34" text-anchor="middle" fill="#2B2F4A">5</text><rect x="308" y="90" width="56" height="70" rx="8" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><text x="336" y="138" font-size="34" text-anchor="middle" fill="#2B2F4A">5</text><rect x="374" y="90" width="56" height="70" rx="8" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><text x="402" y="138" font-size="34" text-anchor="middle" fill="#2B2F4A">5</text><rect x="440" y="90" width="56" height="70" rx="8" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><text x="468" y="138" font-size="34" text-anchor="middle" fill="#2B2F4A">5</text><rect x="506" y="90" width="56" height="70" rx="8" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><text x="534" y="138" font-size="34" text-anchor="middle" fill="#2B2F4A">5</text><text x="588" y="138" font-size="34" text-anchor="start" fill="#2B2F4A">…</text><g class="dot"><circle cx="171" cy="152" r="7" fill="#E5484D"/></g><text x="340" y="220" font-size="18" text-anchor="middle" fill="#2B2F4A">Watch the decimal point move</text>
</svg>
