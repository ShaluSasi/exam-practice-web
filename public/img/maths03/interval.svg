<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" role="img" font-family="system-ui, sans-serif" font-weight="600">
<title>A number line from −1 to 1 with a highlighted stretch between two open circles</title>
<style>
.la{animation:la 2.4s ease-in-out infinite}.ra{animation:ra 2.4s ease-in-out infinite}
@keyframes la{50%{transform:translateX(-5px)}}@keyframes ra{50%{transform:translateX(5px)}}.hl{animation:hl 2.4s ease-in-out infinite}@keyframes hl{50%{opacity:.45}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect class="hl" x="200" y="101" width="225" height="18" rx="9" fill="#9FD6F5"/><g class="arr"><line x1="26" y1="110" x2="674" y2="110" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/>
<path d="M20 110l14 -8v16z" fill="#2B2F4A" class="la"/><path d="M680 110l-14 -8v16z" fill="#2B2F4A" class="ra"/></g><line x1="50" y1="94" x2="50" y2="126" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/><text x="50" y="150" font-size="20" text-anchor="middle" fill="#2B2F4A">−1</text><line x1="350" y1="94" x2="350" y2="126" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/><text x="350" y="150" font-size="20" text-anchor="middle" fill="#2B2F4A">0</text><line x1="650" y1="94" x2="650" y2="126" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/><text x="650" y="150" font-size="20" text-anchor="middle" fill="#2B2F4A">1</text><line x1="125" y1="102" x2="125" y2="118" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><line x1="275" y1="102" x2="275" y2="118" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><line x1="500" y1="102" x2="500" y2="118" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><line x1="575" y1="102" x2="575" y2="118" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><circle cx="200" cy="110" r="9" fill="#FFF9EE" stroke="#E5484D" stroke-width="3.5"/><circle cx="425" cy="110" r="9" fill="#FFF9EE" stroke="#E5484D" stroke-width="3.5"/><text x="200" y="166" font-size="18" text-anchor="middle" fill="#2B2F4A">1</text><line x1="191.6" y1="170" x2="208.4" y2="170" stroke="#2B2F4A" stroke-width="2"/><text x="200" y="189" font-size="18" text-anchor="middle" fill="#2B2F4A">2</text><text x="183.6" y="176" font-size="18" text-anchor="middle" fill="#2B2F4A">−</text><text x="425" y="166" font-size="18" text-anchor="middle" fill="#2B2F4A">1</text><line x1="416.6" y1="170" x2="433.4" y2="170" stroke="#2B2F4A" stroke-width="2"/><text x="425" y="189" font-size="18" text-anchor="middle" fill="#2B2F4A">4</text>
</svg>
