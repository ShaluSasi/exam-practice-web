<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" font-family="system-ui, sans-serif" font-weight="600">
<title>A pile of coins for fortune, slips for debt and a zero between them</title>
<style>
.c{animation:cn 2s ease-in-out infinite}@keyframes cn{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g class="c"><ellipse cx="140" cy="190" rx="44" ry="13" fill="#F6C453" stroke="#B8860B" stroke-width="2.5"/><ellipse cx="140" cy="176" rx="44" ry="13" fill="#F6C453" stroke="#B8860B" stroke-width="2.5"/><ellipse cx="140" cy="162" rx="44" ry="13" fill="#F6C453" stroke="#B8860B" stroke-width="2.5"/><ellipse cx="140" cy="148" rx="44" ry="13" fill="#F6C453" stroke="#B8860B" stroke-width="2.5"/><ellipse cx="140" cy="134" rx="44" ry="13" fill="#F6C453" stroke="#B8860B" stroke-width="2.5"/></g><text x="140" y="240" font-size="22" text-anchor="middle" fill="#2E7D32">Dhana</text><text x="140" y="266" font-size="18" text-anchor="middle" fill="#2B2F4A">fortune  +</text>
<g><rect x="430" y="110" width="110" height="70" rx="8" fill="#FDE2E2" stroke="#E5484D" stroke-width="3" transform="rotate(-8 485 145)"/><rect x="440" y="120" width="110" height="70" rx="8" fill="#FDE2E2" stroke="#E5484D" stroke-width="3"/><path d="M460 145h70M460 162h50" stroke="#E5484D" stroke-width="3"/></g>
<text x="495" y="240" font-size="22" text-anchor="middle" fill="#C62828">Ṛiṇa</text><text x="495" y="266" font-size="18" text-anchor="middle" fill="#2B2F4A">debt  −</text>
<circle cx="320" cy="150" r="34" fill="#fff" stroke="#2B2F4A" stroke-width="3"/><text x="320" y="160" font-size="30" text-anchor="middle" fill="#2B2F4A">0</text><text x="320" y="216" font-size="18" text-anchor="middle" fill="#2B2F4A">Śhūnya</text>
</svg>
