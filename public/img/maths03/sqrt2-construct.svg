<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" role="img" font-family="system-ui, sans-serif" font-weight="600">
<title>A right triangle with legs of 1 unit standing on a number line</title>
<style>
.la{animation:la 2.4s ease-in-out infinite}.ra{animation:ra 2.4s ease-in-out infinite}
@keyframes la{50%{transform:translateX(-5px)}}@keyframes ra{50%{transform:translateX(5px)}}
.hyp{stroke-dasharray:14 10;animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-24}}
.cmp{transform-box:fill-box;transform-origin:50% 0;animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:rotate(10deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g class="arr"><line x1="24" y1="250" x2="676" y2="250" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/>
<path d="M18 250l14 -8v16z" fill="#2B2F4A" class="la"/><path d="M682 250l-14 -8v16z" fill="#2B2F4A" class="ra"/></g><line x1="40" y1="243" x2="40" y2="257" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><line x1="140" y1="236" x2="140" y2="264" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/><text x="140" y="290" font-size="20" text-anchor="middle" fill="#2B2F4A">0</text><line x1="240" y1="243" x2="240" y2="257" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><line x1="340" y1="236" x2="340" y2="264" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/><text x="340" y="290" font-size="20" text-anchor="middle" fill="#2B2F4A">1</text><line x1="440" y1="243" x2="440" y2="257" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><line x1="540" y1="236" x2="540" y2="264" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/><text x="540" y="290" font-size="20" text-anchor="middle" fill="#2B2F4A">2</text><line x1="640" y1="243" x2="640" y2="257" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><path d="M140 250L340 250L340 50Z" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/>
<path d="M322 250V232H340" fill="none" stroke="#2B2F4A" stroke-width="2"/>
<line x1="140" y1="250" x2="340" y2="50" stroke="#FF8A1F" stroke-width="5" stroke-linecap="round" class="hyp"/>
<circle cx="140" cy="250" r="5" fill="#2B2F4A"/><circle cx="340" cy="50" r="5" fill="#2B2F4A"/><text x="122" y="236" font-size="20" text-anchor="middle" fill="#2B2F4A">O</text><text x="300" y="48" font-size="20" text-anchor="middle" fill="#2B2F4A">B</text><text x="358" y="160" font-size="20" text-anchor="start" fill="#2B2F4A">1</text><text x="250" y="238" font-size="20" text-anchor="middle" fill="#2B2F4A">1</text><g transform="translate(560 40)"><g class="cmp"><circle cx="0" cy="0" r="9" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="2"/>
<path d="M-4 6L-30 110" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round"/><path d="M4 6L30 110" stroke="#A3A8CC" stroke-width="5" stroke-linecap="round"/>
<path d="M30 110l3 14" stroke="#E5484D" stroke-width="4" stroke-linecap="round"/></g></g>
</svg>
