<text x="150" y="80" font-size="34" text-anchor="start" fill="#0B93D4">0.0 7 6 …</text>
<path d="M150 190h160" stroke="#2B2F4A" stroke-width="2" stroke-dasharray="6 6"/><path class="pen" d="M330 240l60 -60l14 14l-60 60l-20 6z" fill="#F6C453" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
