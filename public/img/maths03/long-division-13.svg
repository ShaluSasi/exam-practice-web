<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310" role="img" font-family="system-ui, sans-serif" font-weight="600">
<title>A long division of 1 by 13 that has just begun</title>
<style>
.pen{animation:pn 1.4s ease-in-out infinite}@keyframes pn{50%{transform:translateX(30px)}}
