<text x="100" y="130" font-size="34" text-anchor="middle" fill="#2B2F4A">13</text><path d="M130 92q14 20 0 50" fill="none" stroke="#2B2F4A" stroke-width="3"/><path d="M132 92h330" stroke="#2B2F4A" stroke-width="3"/>
