<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" role="img" font-family="system-ui, sans-serif" font-weight="600">
<title>A wheel one unit across rolling once along a ruler</title>
<style>
.roll{animation:mv 5s linear infinite}@keyframes mv{0%,10%{transform:translateX(0)}80%,100%{transform:translateX(314.2px)}}
.spin{transform-origin:70px 170px;animation:sp 5s linear infinite}@keyframes sp{0%,10%{transform:rotate(0)}80%,100%{transform:rotate(360deg)}}
.trail{transform-box:fill-box;transform-origin:0 50%;animation:tr 5s linear infinite}@keyframes tr{0%,10%{transform:scaleX(0)}80%,100%{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M40 220H640" stroke="#2B2F4A" stroke-width="3"/><path d="M70 220v14" stroke="#2B2F4A" stroke-width="2.5"/><text x="70" y="260" font-size="18" text-anchor="middle" fill="#2B2F4A">0</text><path d="M170 220v14" stroke="#2B2F4A" stroke-width="2.5"/><text x="170" y="260" font-size="18" text-anchor="middle" fill="#2B2F4A">1</text><path d="M270 220v14" stroke="#2B2F4A" stroke-width="2.5"/><text x="270" y="260" font-size="18" text-anchor="middle" fill="#2B2F4A">2</text><path d="M370 220v14" stroke="#2B2F4A" stroke-width="2.5"/><text x="370" y="260" font-size="18" text-anchor="middle" fill="#2B2F4A">3</text><path d="M470 220v14" stroke="#2B2F4A" stroke-width="2.5"/><text x="470" y="260" font-size="18" text-anchor="middle" fill="#2B2F4A">4</text><path d="M570 220v14" stroke="#2B2F4A" stroke-width="2.5"/><text x="570" y="260" font-size="18" text-anchor="middle" fill="#2B2F4A">5</text>
<rect class="trail" x="70" y="217" width="314.2" height="6" fill="#E5484D"/>
<g class="roll"><g class="spin"><circle cx="70" cy="170" r="50" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="3"/><path d="M70 170L70 220" stroke="#2B2F4A" stroke-width="2"/><circle cx="70" cy="220" r="7" fill="#E5484D"/></g></g>
<text x="340" y="60" font-size="18" text-anchor="middle" fill="#2B2F4A">A wheel 1 unit across rolls once</text>
</svg>
