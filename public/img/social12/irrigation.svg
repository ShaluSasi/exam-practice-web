<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A turning wheel lifting water in pots into a channel that waters fields, beside a well with a rope pulley and bucket</title>
<style>
.spin{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}.sway{animation:sw 4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sw{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}.pulse{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}.bucket{animation:bk 2.5s ease-in-out infinite alternate}@keyframes bk{from{transform:translateY(0)}to{transform:translateY(-14px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
