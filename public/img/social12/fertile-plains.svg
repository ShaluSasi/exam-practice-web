<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A wide river flowing from snowy mountains through green fields, with full sacks of grain on the bank</title>
<style>
.sway{animation:sw 4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sw{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}.drift{animation:dr 6s ease-in-out infinite alternate}
@keyframes dr{to{transform:translateX(24px)}}.pulse{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}.flow{animation:fw 2s linear infinite}@keyframes fw{from{transform:translateY(-6px);opacity:.3}to{transform:translateY(6px);opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
