<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A fort spread over three rocky hills joined by long walls, with a citadel on the tallest hill and a gateway at the base</title>
<style>
.drift{animation:dr 6s ease-in-out infinite alternate}
@keyframes dr{to{transform:translateX(24px)}}.fl{animation:fl 1.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0 50%}
@keyframes fl{to{transform:scaleX(.72)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
