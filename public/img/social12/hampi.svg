<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A walled city gate among huge rounded boulders, with a wide river flowing in front</title>
<style>
.pulse{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}.drift{animation:dr 6s ease-in-out infinite alternate}
@keyframes dr{to{transform:translateX(24px)}}.fl{animation:fl 1.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0 50%}
@keyframes fl{to{transform:scaleX(.72)}}.rip{animation:rp 3s ease-in-out infinite alternate}@keyframes rp{to{transform:translateX(12px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect width="400" height="240" rx="16" fill="#E3F2FD"/><g class="pulse"><circle cx="340" cy="40" r="14" fill="#F6C453" stroke="#E0A526" stroke-width="2.5"/></g><g class="drift"><g transform="translate(90 36) scale(0.8)" fill="#FFFFFF" stroke="#C9D6E8" stroke-width="2"><path d="M-30 8Q-34 -6 -20 -8Q-16 -22 0 -18Q12 -26 20 -12Q34 -12 30 8Z"/></g></g>
<path d="M0 240V140H400V240Z" fill="#E2C78F"/><circle cx="40" cy="140" r="34" fill="#C9A27A" stroke="#7D6447" stroke-width="2.5"/><circle cx="90" cy="130" r="26" fill="#B8916A" stroke="#7D6447" stroke-width="2.5"/><circle cx="130" cy="146" r="30" fill="#D2AE84" stroke="#7D6447" stroke-width="2.5"/><circle cx="300" cy="132" r="30" fill="#C9A27A" stroke="#7D6447" stroke-width="2.5"/><circle cx="350" cy="140" r="36" fill="#B8916A" stroke="#7D6447" stroke-width="2.5"/><circle cx="260" cy="148" r="22" fill="#D2AE84" stroke="#7D6447" stroke-width="2.5"/><circle cx="70" cy="106" r="18" fill="#D2AE84" stroke="#7D6447" stroke-width="2.5"/><circle cx="330" cy="100" r="18" fill="#D2AE84" stroke="#7D6447" stroke-width="2.5"/><g stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"><rect x="150" y="116" width="100" height="40" fill="#E3C08A"/><rect x="150" y="109.6" width="8" height="6.4" fill="#E3C08A"/><rect x="166" y="109.6" width="8" height="6.4" fill="#E3C08A"/><rect x="182" y="109.6" width="8" height="6.4" fill="#E3C08A"/><rect x="198" y="109.6" width="8" height="6.4" fill="#E3C08A"/><rect x="214" y="109.6" width="8" height="6.4" fill="#E3C08A"/><rect x="230" y="109.6" width="8" height="6.4" fill="#E3C08A"/></g><g stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"><path d="M186 156V130Q200 118 214 130V156Z" fill="#6B4527"/></g>
<path d="M0 196Q100 180 200 196T400 190V224Q400 240 384 240H16Q0 240 0 224Z" fill="#7FC4E8" stroke="#3E9BD0" stroke-width="2.5"/>
<g class="rip" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"><path d="M40 214q10-5 20 0t20 0"/><path d="M250 210q10-5 20 0t20 0"/><path d="M150 224q10-5 20 0t20 0"/></g>
<path d="M200 108V86" stroke="#7A5230" stroke-width="3" stroke-linecap="round"/><path class="fl" d="M200 86L220 92L200 98Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/>
</svg>
