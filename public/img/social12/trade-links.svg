<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>A network diagram: a busy market town in the centre linked to four places by four routes, each with a different kind of transport</title>
<style>
.dash{stroke-dasharray:8 6;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-28}}.pulse{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}.bob{animation:bob 3s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-3px)}to{transform:translateY(3px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
