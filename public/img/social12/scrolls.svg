<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Five rolled-up scrolls, each tied with a ribbon of a different colour</title>
<style>
.bob{animation:bob 3s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-3px)}to{transform:translateY(3px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="0" y="190" width="400" height="50" fill="#C8925A"/><g class="bob" style="animation-delay:-0s"><g stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"><rect x="34" y="90" width="32" height="100" rx="14" fill="#FBEFD2"/><ellipse cx="50" cy="90" rx="16" ry="6" fill="#E9D3A3"/><rect x="33" y="134" width="34" height="12" fill="#E5484D"/></g><circle cx="50" cy="140" r="6" fill="#E5484D" stroke="#2B2F4A" stroke-width="2"/></g><g class="bob" style="animation-delay:-0.6s"><g stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"><rect x="109" y="72" width="32" height="100" rx="14" fill="#FBEFD2"/><ellipse cx="125" cy="72" rx="16" ry="6" fill="#E9D3A3"/><rect x="108" y="116" width="34" height="12" fill="#0B93D4"/></g><circle cx="125" cy="122" r="6" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2"/></g><g class="bob" style="animation-delay:-1.2s"><g stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"><rect x="184" y="90" width="32" height="100" rx="14" fill="#FBEFD2"/><ellipse cx="200" cy="90" rx="16" ry="6" fill="#E9D3A3"/><rect x="183" y="134" width="34" height="12" fill="#3FA34D"/></g><circle cx="200" cy="140" r="6" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2"/></g><g class="bob" style="animation-delay:-1.7999999999999998s"><g stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"><rect x="259" y="72" width="32" height="100" rx="14" fill="#FBEFD2"/><ellipse cx="275" cy="72" rx="16" ry="6" fill="#E9D3A3"/><rect x="258" y="116" width="34" height="12" fill="#9B6BD3"/></g><circle cx="275" cy="122" r="6" fill="#9B6BD3" stroke="#2B2F4A" stroke-width="2"/></g><g class="bob" style="animation-delay:-2.4s"><g stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"><rect x="334" y="90" width="32" height="100" rx="14" fill="#FBEFD2"/><ellipse cx="350" cy="90" rx="16" ry="6" fill="#E9D3A3"/><rect x="333" y="134" width="34" height="12" fill="#FF8A1F"/></g><circle cx="350" cy="140" r="6" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2"/></g>
</svg>
