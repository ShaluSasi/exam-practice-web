@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}.shot{animation:sh 2.6s ease-in infinite}@keyframes sh{0%{transform:translateX(-30px);opacity:0}30%{opacity:1}70%,100%{transform:translateX(0);opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
