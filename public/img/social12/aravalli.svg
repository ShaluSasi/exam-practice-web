<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Layers of rugged forested hills with a small fort on one ridge</title>
<style>
.drift{animation:dr 6s ease-in-out infinite alternate}
@keyframes dr{to{transform:translateX(24px)}}.pulse{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}.fl{animation:fl 1.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0 50%}
@keyframes fl{to{transform:scaleX(.72)}}.fly{animation:fy 6s ease-in-out infinite alternate}@keyframes fy{to{transform:translate(40px,-10px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
