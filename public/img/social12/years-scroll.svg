<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>An hourglass with running sand beside a long scroll of years</title>
<style>
.top{animation:tp 4s linear infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes tp{from{transform:scaleY(1)}to{transform:scaleY(.2)}}
.bot{animation:bt 4s linear infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes bt{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
.stream{stroke-dasharray:6 4;animation:st .6s linear infinite}@keyframes st{to{stroke-dashoffset:-10}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="0" y="200" width="400" height="40" fill="#C8925A"/>
<g stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"><rect x="60" y="30" width="100" height="12" rx="4" fill="#A8743F"/><rect x="60" y="188" width="100" height="12" rx="4" fill="#A8743F"/>
<path d="M72 42H148Q148 90 116 112Q148 136 148 188H72Q72 136 104 112Q72 90 72 42Z" fill="#E3F2FD"/></g>
<g class="top"><path d="M80 52H140Q136 88 110 108Q84 88 80 52Z" fill="#F6C453"/></g>
<path class="stream" d="M110 110V184" stroke="#F6C453" stroke-width="3"/>
<g class="bot"><path d="M80 186Q110 150 140 186Z" fill="#F6C453"/></g>
<g stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"><rect x="200" y="60" width="170" height="110" fill="#FBEFD2"/><rect x="192" y="52" width="16" height="126" rx="8" fill="#E9D3A3"/><rect x="362" y="52" width="16" height="126" rx="8" fill="#E9D3A3"/></g>
<g stroke="#B58F4E" stroke-width="3" stroke-linecap="round"><path d="M224 84H346M224 104H330M224 124H346M224 144H300"/></g>
</svg>
