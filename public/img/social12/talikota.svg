<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>An abstract battle diagram: four differently coloured blocks with arrows converging on one orange block</title>
<style>
.dash{stroke-dasharray:8 6;animation:dash 1.4s linear infinite}
