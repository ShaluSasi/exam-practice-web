<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Four crossed-out cards (language, race, religion, territory) and four hidden cards for the essential conditions</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7C5CFF"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="26.0" font-size="13" text-anchor="middle">What makes a nation, according to Renan?</text><text x="105" y="52" font-size="11" text-anchor="middle">Not enough by themselves</text><text x="300" y="52" font-size="11" text-anchor="middle">Essential conditions</text><g><rect x="20" y="60" width="170" height="34" rx="10" fill="#FFE9E9" stroke="#E5484D" stroke-width="2.5"/><text x="105.0" y="81.2" font-size="12" text-anchor="middle">Common language</text></g><path d="M30 66L180 88M180 66L30 88" stroke="#E5484D" stroke-width="2.5" opacity=".6"/><g><rect x="20" y="102" width="170" height="34" rx="10" fill="#FFE9E9" stroke="#E5484D" stroke-width="2.5"/><text x="105.0" y="123.2" font-size="12" text-anchor="middle">Common race</text></g><path d="M30 108L180 130M180 108L30 130" stroke="#E5484D" stroke-width="2.5" opacity=".6"/><g><rect x="20" y="144" width="170" height="34" rx="10" fill="#FFE9E9" stroke="#E5484D" stroke-width="2.5"/><text x="105.0" y="165.2" font-size="12" text-anchor="middle">Common religion</text></g><path d="M30 150L180 172M180 150L30 172" stroke="#E5484D" stroke-width="2.5" opacity=".6"/><g><rect x="20" y="186" width="170" height="34" rx="10" fill="#FFE9E9" stroke="#E5484D" stroke-width="2.5"/><text x="105.0" y="207.2" font-size="12" text-anchor="middle">Common territory</text></g><path d="M30 192L180 214M180 192L30 214" stroke="#E5484D" stroke-width="2.5" opacity=".6"/><g><rect x="210" y="60" width="176" height="34" rx="10" fill="#E6F6E4" stroke="#3FA34D" stroke-width="2.5"/><text x="298.0" y="87.5" font-size="18" text-anchor="middle">?</text></g><circle cx="222" cy="77" r="0"/><g><rect x="210" y="102" width="176" height="34" rx="10" fill="#E6F6E4" stroke="#3FA34D" stroke-width="2.5"/><text x="298.0" y="129.5" font-size="18" text-anchor="middle">?</text></g><circle cx="222" cy="119" r="0"/><g><rect x="210" y="144" width="176" height="34" rx="10" fill="#E6F6E4" stroke="#3FA34D" stroke-width="2.5"/><text x="298.0" y="171.5" font-size="18" text-anchor="middle">?</text></g><circle cx="222" cy="161" r="0"/><g class="bob"><rect x="210" y="186" width="176" height="34" rx="10" fill="#E6F6E4" stroke="#3FA34D" stroke-width="2.5"/><text x="298.0" y="213.5" font-size="18" text-anchor="middle">?</text></g><circle cx="222" cy="203" r="0"/></svg>