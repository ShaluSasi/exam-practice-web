<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A central aim box with arrows to eight hidden cards on the settlement of 1815</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7C5CFF"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="26.0" font-size="13" text-anchor="middle">The Treaty of Vienna, 1815</text><g class="pul"><rect x="130" y="36" width="140" height="36" rx="10" fill="#FFF3D6" stroke="#FF8A1F" stroke-width="2.5"/><text x="200.0" y="51.0" font-size="11" text-anchor="middle">Aim: undo Napoleonic</text><text x="200.0" y="64.7" font-size="11" text-anchor="middle">changes</text></g><line x1="200" y1="72" x2="57" y2="98" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" class="fl" marker-end="url(#ahb)"/><g><rect x="12" y="98" width="90" height="62" rx="10" fill="#fff" stroke="#0B93D4" stroke-width="2.5"/><text x="57.0" y="139.1" font-size="18" text-anchor="middle">?</text></g><line x1="200" y1="72" x2="153" y2="98" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" class="fl" marker-end="url(#ahr)"/><g><rect x="108" y="98" width="90" height="62" rx="10" fill="#fff" stroke="#E5484D" stroke-width="2.5"/><text x="153.0" y="139.1" font-size="18" text-anchor="middle">?</text></g><line x1="200" y1="72" x2="249" y2="98" stroke="#3FA34D" stroke-width="2.5" stroke-linecap="round" class="fl" marker-end="url(#ahg)"/><g><rect x="204" y="98" width="90" height="62" rx="10" fill="#fff" stroke="#3FA34D" stroke-width="2.5"/><text x="249.0" y="139.2" font-size="18" text-anchor="middle">?</text></g><line x1="200" y1="72" x2="345" y2="98" stroke="#7C5CFF" stroke-width="2.5" stroke-linecap="round" class="fl" marker-end="url(#ahp)"/><g><rect x="300" y="98" width="90" height="62" rx="10" fill="#fff" stroke="#7C5CFF" stroke-width="2.5"/><text x="345.0" y="139.1" font-size="18" text-anchor="middle">?</text></g><line x1="200" y1="72" x2="57" y2="168" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" class="fl" marker-end="url(#ahb)"/><g><rect x="12" y="168" width="90" height="62" rx="10" fill="#fff" stroke="#0B93D4" stroke-width="2.5"/><text x="57.0" y="209.1" font-size="18" text-anchor="middle">?</text></g><line x1="200" y1="72" x2="153" y2="168" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" class="fl" marker-end="url(#aho)"/><g><rect x="108" y="168" width="90" height="62" rx="10" fill="#fff" stroke="#FF8A1F" stroke-width="2.5"/><text x="153.0" y="209.2" font-size="18" text-anchor="middle">?</text></g><line x1="200" y1="72" x2="249" y2="168" stroke="#3FA34D" stroke-width="2.5" stroke-linecap="round" class="fl" marker-end="url(#ahg)"/><g><rect x="204" y="168" width="90" height="62" rx="10" fill="#fff" stroke="#3FA34D" stroke-width="2.5"/><text x="249.0" y="209.1" font-size="18" text-anchor="middle">?</text></g><line x1="200" y1="72" x2="345" y2="168" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" class="fl" marker-end="url(#ahr)"/><g><rect x="300" y="168" width="90" height="62" rx="10" fill="#fff" stroke="#E5484D" stroke-width="2.5"/><text x="345.0" y="209.1" font-size="18" text-anchor="middle">?</text></g></svg>