<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Three speech bubbles with different views about women's political rights</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7C5CFF"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#E3F2FD"/><text x="200" y="26.0" font-size="13" text-anchor="middle">Views on women and the vote</text><path d="M10 50H132V150H50L32 168V150H10Z" fill="#fff" stroke="#0B93D4" stroke-width="3" stroke-linejoin="round"/><text x="71" y="70" font-size="11" text-anchor="middle">Woman's sphere is</text><text x="71" y="83" font-size="11" text-anchor="middle">the home;</text><text x="71" y="96" font-size="11" text-anchor="middle">equality would</text><text x="71" y="109" font-size="11" text-anchor="middle">endanger family</text><text x="71" y="122" font-size="11" text-anchor="middle">harmony</text><g transform="translate(32 218) scale(0.9)"><g><rect x="-8" y="-28" width="16" height="22" rx="5" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-4 -6V0M4 -6V0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-36" r="8" fill="#F4C9A0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="86" y="206" font-size="11" text-anchor="middle">Carl</text><text x="86" y="220" font-size="11" text-anchor="middle">Welcker</text><path d="M140 50H262V150H180L162 168V150H140Z" fill="#fff" stroke="#3FA34D" stroke-width="3" stroke-linejoin="round"/><text x="201" y="70" font-size="11" text-anchor="middle">Liberty is</text><text x="201" y="83" font-size="11" text-anchor="middle">indivisible; free</text><text x="201" y="96" font-size="11" text-anchor="middle">men must not</text><text x="201" y="109" font-size="11" text-anchor="middle">tolerate the</text><text x="201" y="122" font-size="11" text-anchor="middle">unfree</text><g transform="translate(162 218) scale(0.9)"><g><path d="M0 -26L-10 0H10Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-36" r="8" fill="#F4C9A0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="216" y="206" font-size="11" text-anchor="middle">Louise</text><text x="216" y="220" font-size="11" text-anchor="middle">Otto-Peters</text><path d="M270 50H392V150H310L292 168V150H270Z" fill="#fff" stroke="#FF8A1F" stroke-width="3" stroke-linejoin="round"/><text x="331" y="70" font-size="11" text-anchor="middle">Women who own</text><text x="331" y="83" font-size="11" text-anchor="middle">property are</text><text x="331" y="96" font-size="11" text-anchor="middle">denied the vote:</text><text x="331" y="109" font-size="11" text-anchor="middle">injustice</text><g transform="translate(292 218) scale(0.9)"><g><path d="M0 -26L-10 0H10Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-36" r="8" fill="#F4C9A0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="346" y="206" font-size="11" text-anchor="middle">An</text><text x="346" y="220" font-size="11" text-anchor="middle">anonymous reader</text></svg>