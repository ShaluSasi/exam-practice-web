<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Eight numbered cards; three show la patrie and le citoyen, the assembly of active citizens and uniform laws, five are hidden</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7C5CFF"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="26.0" font-size="13" text-anchor="middle">Steps to build a French national identity</text><g><rect x="12" y="64" width="90" height="62" rx="10" fill="#fff" stroke="#0B93D4" stroke-width="2.5"/><text x="57.0" y="85.1" font-size="11" text-anchor="middle">La patrie</text><text x="57.0" y="98.8" font-size="11" text-anchor="middle">and le</text><text x="57.0" y="112.6" font-size="11" text-anchor="middle">citoyen</text></g><circle cx="57" cy="56" r="10" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="57" y="60" font-size="11" text-anchor="middle" style="fill:#fff">1</text><g><rect x="108" y="64" width="90" height="62" rx="10" fill="#fff" stroke="#E5484D" stroke-width="2.5"/><text x="153.0" y="105.1" font-size="18" text-anchor="middle">?</text></g><circle cx="153" cy="56" r="10" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="153" y="60" font-size="11" text-anchor="middle" style="fill:#fff">2</text><g><rect x="204" y="64" width="90" height="62" rx="10" fill="#fff" stroke="#FF8A1F" stroke-width="2.5"/><text x="249.0" y="85.1" font-size="11" text-anchor="middle">Assembly of</text><text x="249.0" y="98.8" font-size="11" text-anchor="middle">active</text><text x="249.0" y="112.6" font-size="11" text-anchor="middle">citizens</text></g><circle cx="249" cy="56" r="10" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="249" y="60" font-size="11" text-anchor="middle" style="fill:#fff">3</text><g><rect x="300" y="64" width="90" height="62" rx="10" fill="#fff" stroke="#3FA34D" stroke-width="2.5"/><text x="345.0" y="85.1" font-size="11" text-anchor="middle">Uniform</text><text x="345.0" y="98.8" font-size="11" text-anchor="middle">laws,</text><text x="345.0" y="112.6" font-size="11" text-anchor="middle">central rule</text></g><circle cx="345" cy="56" r="10" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="345" y="60" font-size="11" text-anchor="middle" style="fill:#fff">4</text><g><rect x="12" y="152" width="90" height="62" rx="10" fill="#fff" stroke="#7C5CFF" stroke-width="2.5"/><text x="57.0" y="193.2" font-size="18" text-anchor="middle">?</text></g><circle cx="57" cy="144" r="10" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="57" y="148" font-size="11" text-anchor="middle" style="fill:#fff">5</text><g><rect x="108" y="152" width="90" height="62" rx="10" fill="#fff" stroke="#0B93D4" stroke-width="2.5"/><text x="153.0" y="193.1" font-size="18" text-anchor="middle">?</text></g><circle cx="153" cy="144" r="10" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="153" y="148" font-size="11" text-anchor="middle" style="fill:#fff">6</text><g><rect x="204" y="152" width="90" height="62" rx="10" fill="#fff" stroke="#FF8A1F" stroke-width="2.5"/><text x="249.0" y="193.1" font-size="18" text-anchor="middle">?</text></g><circle cx="249" cy="144" r="10" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="249" y="148" font-size="11" text-anchor="middle" style="fill:#fff">7</text><g><rect x="300" y="152" width="90" height="62" rx="10" fill="#fff" stroke="#3FA34D" stroke-width="2.5"/><text x="345.0" y="193.2" font-size="18" text-anchor="middle">?</text></g><circle cx="345" cy="144" r="10" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="345" y="148" font-size="11" text-anchor="middle" style="fill:#fff">8</text></svg>