<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A timeline with four dots, 1688, 1707, 1798 and 1801, each with a card below</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7C5CFF"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#E3F2FD"/><text x="200" y="26.0" font-size="13" text-anchor="middle">The making of the United Kingdom</text><path d="M20 120H380" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="60" cy="120" r="9" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="104" font-size="12" text-anchor="middle">1688</text><circle cx="153" cy="120" r="9" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="153" y="104" font-size="12" text-anchor="middle">1707</text><circle cx="246" cy="120" r="9" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="246" y="104" font-size="12" text-anchor="middle">1798</text><circle cx="339" cy="120" r="9" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="339" y="104" font-size="12" text-anchor="middle">1801</text><g><rect x="15" y="160" width="90" height="64" rx="10" fill="#fff" stroke="#0B93D4" stroke-width="2.5"/><text x="60.0" y="182.1" font-size="11" text-anchor="middle">English</text><text x="60.0" y="195.8" font-size="11" text-anchor="middle">Parliament</text><text x="60.0" y="209.6" font-size="11" text-anchor="middle">seizes power</text></g><path d="M60 129V160" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="108" y="160" width="90" height="64" rx="10" fill="#fff" stroke="#3FA34D" stroke-width="2.5"/><text x="153.0" y="175.2" font-size="11" text-anchor="middle">Act of</text><text x="153.0" y="189.0" font-size="11" text-anchor="middle">Union:</text><text x="153.0" y="202.7" font-size="11" text-anchor="middle">England and</text><text x="153.0" y="216.5" font-size="11" text-anchor="middle">Scotland</text></g><path d="M153 129V160" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="201" y="160" width="90" height="64" rx="10" fill="#fff" stroke="#FF8A1F" stroke-width="2.5"/><text x="246.0" y="182.1" font-size="11" text-anchor="middle">United</text><text x="246.0" y="195.8" font-size="11" text-anchor="middle">Irishmen</text><text x="246.0" y="209.6" font-size="11" text-anchor="middle">revolt fails</text></g><path d="M246 129V160" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="294" y="160" width="90" height="64" rx="10" fill="#fff" stroke="#E5484D" stroke-width="2.5"/><text x="339.0" y="182.1" font-size="11" text-anchor="middle">Ireland</text><text x="339.0" y="195.8" font-size="11" text-anchor="middle">forcibly</text><text x="339.0" y="209.6" font-size="11" text-anchor="middle">incorporated</text></g><path d="M339 129V160" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="66" font-size="11" text-anchor="middle">Before the 18th century there was no British nation</text><text x="200" y="86" font-size="11" text-anchor="middle">English, Welsh, Scot, Irish: ethnic identities</text></svg>