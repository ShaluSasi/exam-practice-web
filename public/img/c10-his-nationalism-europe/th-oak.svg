<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>Crown of oak leaves</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7C5CFF"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#E6F6E4"/><g transform="translate(100 80) scale(1.7)"><g><ellipse cx="24.0" cy="0.0" rx="8" ry="4.5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(90.0 24.0 0.0)"/><ellipse cx="20.8" cy="7.0" rx="8" ry="4.5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(120.0 20.8 7.0)"/><ellipse cx="12.0" cy="12.1" rx="8" ry="4.5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(150.0 12.0 12.1)"/><ellipse cx="0.0" cy="14.0" rx="8" ry="4.5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(180.0 0.0 14.0)"/><ellipse cx="-12.0" cy="12.1" rx="8" ry="4.5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(210.0 -12.0 12.1)"/><ellipse cx="-20.8" cy="7.0" rx="8" ry="4.5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(240.0 -20.8 7.0)"/><ellipse cx="-24.0" cy="0.0" rx="8" ry="4.5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(270.0 -24.0 0.0)"/><ellipse cx="-20.8" cy="-7.0" rx="8" ry="4.5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(300.0 -20.8 -7.0)"/><ellipse cx="-12.0" cy="-12.1" rx="8" ry="4.5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(330.0 -12.0 -12.1)"/><ellipse cx="-0.0" cy="-14.0" rx="8" ry="4.5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(360.0 -0.0 -14.0)"/><ellipse cx="12.0" cy="-12.1" rx="8" ry="4.5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(390.0 12.0 -12.1)"/><ellipse cx="20.8" cy="-7.0" rx="8" ry="4.5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(420.0 20.8 -7.0)"/></g></g></svg>