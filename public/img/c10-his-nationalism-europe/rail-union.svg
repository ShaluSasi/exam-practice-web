<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A train on a track with two cards about the customs union and the railways</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7C5CFF"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#E3F2FD"/><text x="200" y="26.0" font-size="13" text-anchor="middle">Customs union and railways</text><rect x="10" y="150" width="380" height="8" fill="#9AA3B5"/><rect x="14" y="156" width="10" height="6" fill="#8B5A2B"/><rect x="34" y="156" width="10" height="6" fill="#8B5A2B"/><rect x="54" y="156" width="10" height="6" fill="#8B5A2B"/><rect x="74" y="156" width="10" height="6" fill="#8B5A2B"/><rect x="94" y="156" width="10" height="6" fill="#8B5A2B"/><rect x="114" y="156" width="10" height="6" fill="#8B5A2B"/><rect x="134" y="156" width="10" height="6" fill="#8B5A2B"/><rect x="154" y="156" width="10" height="6" fill="#8B5A2B"/><rect x="174" y="156" width="10" height="6" fill="#8B5A2B"/><rect x="194" y="156" width="10" height="6" fill="#8B5A2B"/><rect x="214" y="156" width="10" height="6" fill="#8B5A2B"/><rect x="234" y="156" width="10" height="6" fill="#8B5A2B"/><rect x="254" y="156" width="10" height="6" fill="#8B5A2B"/><rect x="274" y="156" width="10" height="6" fill="#8B5A2B"/><rect x="294" y="156" width="10" height="6" fill="#8B5A2B"/><rect x="314" y="156" width="10" height="6" fill="#8B5A2B"/><rect x="334" y="156" width="10" height="6" fill="#8B5A2B"/><rect x="354" y="156" width="10" height="6" fill="#8B5A2B"/><rect x="374" y="156" width="10" height="6" fill="#8B5A2B"/><g class="sw" style="animation-duration:5s"><g transform="translate(60 150)"><rect x="-30" y="-30" width="60" height="30" rx="6" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-22" y="-24" width="14" height="12" fill="#fff"/><circle cx="-16" cy="2" r="6" fill="#2B2F4A"/><circle cx="14" cy="2" r="6" fill="#2B2F4A"/></g></g><g><rect x="14" y="48" width="170" height="56" rx="10" fill="#fff" stroke="#FF8A1F" stroke-width="2.5"/><text x="99.0" y="66.1" font-size="11" text-anchor="middle">1834: customs union at</text><text x="99.0" y="79.8" font-size="11" text-anchor="middle">Prussia's initiative;</text><text x="99.0" y="93.6" font-size="11" text-anchor="middle">most German states join</text></g><g><rect x="216" y="48" width="170" height="56" rx="10" fill="#fff" stroke="#3FA34D" stroke-width="2.5"/><text x="301.0" y="73.0" font-size="11" text-anchor="middle">Railways made goods and</text><text x="301.0" y="86.7" font-size="11" text-anchor="middle">people more mobile</text></g><text x="200" y="200" font-size="12" text-anchor="middle">Economic interests tied to national unification</text></svg>