<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Four cards with plain female figures named Liberty, Justice, Marianne and Germania; their attributes are hidden</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7C5CFF"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="26.0" font-size="13" text-anchor="middle">Female allegories in the nineteenth century</text><rect x="10" y="46" width="90" height="156" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(55 106)"><path d="M0 -6L-16 34H16Z" fill="#B9A7FF" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><circle cx="0" cy="-18" r="11" fill="#F4C9A0" stroke="#2B2F4A" stroke-width="3"/></g><text x="55" y="190" font-size="18" text-anchor="middle">?</text><text x="55" y="160" font-size="12" text-anchor="middle">Liberty</text><rect x="108" y="46" width="90" height="156" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(153 106)"><path d="M0 -6L-16 34H16Z" fill="#B9A7FF" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><circle cx="0" cy="-18" r="11" fill="#F4C9A0" stroke="#2B2F4A" stroke-width="3"/></g><text x="153" y="190" font-size="18" text-anchor="middle">?</text><text x="153" y="160" font-size="12" text-anchor="middle">Justice</text><rect x="206" y="46" width="90" height="156" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(251 106)"><path d="M0 -6L-16 34H16Z" fill="#B9A7FF" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><circle cx="0" cy="-18" r="11" fill="#F4C9A0" stroke="#2B2F4A" stroke-width="3"/></g><text x="251" y="190" font-size="18" text-anchor="middle">?</text><text x="251" y="160" font-size="12" text-anchor="middle">Marianne</text><rect x="304" y="46" width="90" height="156" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(349 106)"><path d="M0 -6L-16 34H16Z" fill="#B9A7FF" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><circle cx="0" cy="-18" r="11" fill="#F4C9A0" stroke="#2B2F4A" stroke-width="3"/></g><text x="349" y="190" font-size="18" text-anchor="middle">?</text><text x="349" y="160" font-size="12" text-anchor="middle">Germania</text></svg>