<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Prussia fighting three hidden wars that lead to victory and a proclamation in January 1871</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7C5CFF"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="26.0" font-size="13" text-anchor="middle">Prussia leads German unification</text><g class="pul"><rect x="10" y="52" width="100" height="64" rx="10" fill="#fff" stroke="#0B93D4" stroke-width="2.5"/><text x="60.0" y="67.2" font-size="11" text-anchor="middle">Prussia:</text><text x="60.0" y="81.0" font-size="11" text-anchor="middle">Bismarck, army</text><text x="60.0" y="94.7" font-size="11" text-anchor="middle">and</text><text x="60.0" y="108.5" font-size="11" text-anchor="middle">bureaucracy</text></g><line x1="112" y1="84" x2="148" y2="60" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" class="fl" marker-end="url(#ahr)"/><g><rect x="150" y="44" width="100" height="34" rx="10" fill="#fff" stroke="#E5484D" stroke-width="2.5"/><text x="200.0" y="64.8" font-size="11" text-anchor="middle">War with ?</text></g><line x1="252" y1="61" x2="282" y2="130" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" class="fl" marker-end="url(#ahr)"/><line x1="112" y1="84" x2="148" y2="100" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" class="fl" marker-end="url(#aho)"/><g><rect x="150" y="84" width="100" height="34" rx="10" fill="#fff" stroke="#FF8A1F" stroke-width="2.5"/><text x="200.0" y="104.8" font-size="11" text-anchor="middle">War with ?</text></g><line x1="252" y1="101" x2="282" y2="130" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" class="fl" marker-end="url(#aho)"/><line x1="112" y1="84" x2="148" y2="140" stroke="#3FA34D" stroke-width="2.5" stroke-linecap="round" class="fl" marker-end="url(#ahg)"/><g><rect x="150" y="124" width="100" height="34" rx="10" fill="#fff" stroke="#3FA34D" stroke-width="2.5"/><text x="200.0" y="144.8" font-size="11" text-anchor="middle">War with ?</text></g><line x1="252" y1="141" x2="282" y2="130" stroke="#3FA34D" stroke-width="2.5" stroke-linecap="round" class="fl" marker-end="url(#ahg)"/><g><rect x="284" y="100" width="106" height="60" rx="10" fill="#E6F6E4" stroke="#3FA34D" stroke-width="2.5"/><text x="337.0" y="113.2" font-size="11" text-anchor="middle">Prussian</text><text x="337.0" y="127.0" font-size="11" text-anchor="middle">victory:</text><text x="337.0" y="140.7" font-size="11" text-anchor="middle">unification</text><text x="337.0" y="154.5" font-size="11" text-anchor="middle">complete</text></g><g><rect x="60" y="176" width="280" height="44" rx="10" fill="#FFF3D6" stroke="#FF8A1F" stroke-width="2.5"/><text x="200.0" y="195.0" font-size="11" text-anchor="middle">18 January 1871: William I proclaimed</text><text x="200.0" y="208.7" font-size="11" text-anchor="middle">German Emperor at Versailles</text></g></svg>