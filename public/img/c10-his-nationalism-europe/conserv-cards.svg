<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Three cards with arrows pointing to modernisation strengthening monarchies</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7C5CFF"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="26.0" font-size="13" text-anchor="middle">Conservatism after 1815</text><g><rect x="14" y="52" width="118" height="62" rx="10" fill="#fff" stroke="#0B93D4" stroke-width="2.5"/><text x="73.0" y="73.1" font-size="11" text-anchor="middle">Preserve</text><text x="73.0" y="86.8" font-size="11" text-anchor="middle">monarchy, Church,</text><text x="73.0" y="100.6" font-size="11" text-anchor="middle">family, property</text></g><line x1="73" y1="116" x2="200" y2="150" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" class="fl" marker-end="url(#ahb)"/><g><rect x="142" y="52" width="118" height="62" rx="10" fill="#fff" stroke="#3FA34D" stroke-width="2.5"/><text x="201.0" y="73.1" font-size="11" text-anchor="middle">Modern army and</text><text x="201.0" y="86.8" font-size="11" text-anchor="middle">efficient</text><text x="201.0" y="100.6" font-size="11" text-anchor="middle">bureaucracy</text></g><line x1="201" y1="116" x2="200" y2="150" stroke="#3FA34D" stroke-width="2.5" stroke-linecap="round" class="fl" marker-end="url(#ahg)"/><g><rect x="270" y="52" width="118" height="62" rx="10" fill="#fff" stroke="#FF8A1F" stroke-width="2.5"/><text x="329.0" y="80.0" font-size="11" text-anchor="middle">Abolish feudalism</text><text x="329.0" y="93.7" font-size="11" text-anchor="middle">and serfdom</text></g><line x1="329" y1="116" x2="200" y2="150" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" class="fl" marker-end="url(#aho)"/><g class="pul"><rect x="110" y="152" width="180" height="44" rx="10" fill="#FFF3D6" stroke="#E5484D" stroke-width="2.5"/><text x="200.0" y="171.0" font-size="11" text-anchor="middle">Modernisation strengthens</text><text x="200.0" y="184.7" font-size="11" text-anchor="middle">autocratic monarchies</text></g></svg>