<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Scales of reason with a cross, an emotions card, and three hidden cards pointing to the spirit of the nation</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7C5CFF"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="26.0" font-size="13" text-anchor="middle">Romantic nationalism</text><g transform="translate(100 96) scale(1.2)"><g><path d="M0 -26V22M-12 22H12" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-24 -18H24" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-24 -18L-30 0H-18Z M24 -18L18 0H30Z" fill="#FFD84D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><path d="M60 126L140 66" stroke="#E5484D" stroke-width="5" opacity=".7"/><g><rect x="20" y="138" width="160" height="36" rx="10" fill="#EEF" stroke="#E5484D" stroke-width="2.5"/><text x="100.0" y="153.0" font-size="11" text-anchor="middle">Reason and science</text><text x="100.0" y="166.7" font-size="11" text-anchor="middle">(criticised)</text></g><g><rect x="20" y="182" width="160" height="36" rx="10" fill="#E6F6E4" stroke="#3FA34D" stroke-width="2.5"/><text x="100.0" y="197.0" font-size="11" text-anchor="middle">Emotions, intuition,</text><text x="100.0" y="210.7" font-size="11" text-anchor="middle">mystical feelings</text></g><g class="bob"><rect x="220" y="52" width="100" height="38" rx="10" fill="#fff" stroke="#7C5CFF" stroke-width="2.5"/><text x="270.0" y="81.1" font-size="18" text-anchor="middle">?</text></g><line x1="322" y1="71" x2="328" y2="100" stroke="#7C5CFF" stroke-width="2.5" stroke-linecap="round" class="fl" marker-end="url(#ahp)"/><g class="bob"><rect x="220" y="98" width="100" height="38" rx="10" fill="#fff" stroke="#0B93D4" stroke-width="2.5"/><text x="270.0" y="127.1" font-size="18" text-anchor="middle">?</text></g><line x1="322" y1="117" x2="328" y2="112" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" class="fl" marker-end="url(#ahb)"/><g class="bob"><rect x="220" y="144" width="100" height="38" rx="10" fill="#fff" stroke="#FF8A1F" stroke-width="2.5"/><text x="270.0" y="173.1" font-size="18" text-anchor="middle">?</text></g><line x1="322" y1="163" x2="328" y2="124" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" class="fl" marker-end="url(#aho)"/><circle cx="352" cy="124" r="32" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="352" y="121" font-size="11" text-anchor="middle">Spirit of</text><text x="352" y="135" font-size="11" text-anchor="middle">the nation</text></svg>