<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Four powers with arrows pointing at the Balkans</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7C5CFF"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="26.0" font-size="13" text-anchor="middle">The Balkans after 1871</text><circle cx="200" cy="128" r="40" fill="#FFE9E9" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="pul"/><text x="200" y="132" font-size="13" text-anchor="middle">Balkans</text><g><rect x="18" y="48" width="104" height="36" rx="10" fill="#fff" stroke="#0B93D4" stroke-width="2.5"/><text x="70.0" y="69.8" font-size="11" text-anchor="middle">Russia</text></g><line x1="106.1" y1="83.2" x2="158.5" y2="108.2" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" class="fl" marker-end="url(#ahb)"/><g><rect x="278" y="48" width="104" height="36" rx="10" fill="#fff" stroke="#3FA34D" stroke-width="2.5"/><text x="330.0" y="69.8" font-size="11" text-anchor="middle">Germany</text></g><line x1="293.9" y1="83.2" x2="241.5" y2="108.2" stroke="#3FA34D" stroke-width="3" stroke-linecap="round" class="fl" marker-end="url(#ahg)"/><g><rect x="18" y="170" width="104" height="36" rx="10" fill="#fff" stroke="#7C5CFF" stroke-width="2.5"/><text x="70.0" y="191.8" font-size="11" text-anchor="middle">England</text></g><line x1="106.3" y1="171.2" x2="158.2" y2="147.3" stroke="#7C5CFF" stroke-width="3" stroke-linecap="round" class="fl" marker-end="url(#ahp)"/><g><rect x="278" y="170" width="104" height="36" rx="10" fill="#fff" stroke="#FF8A1F" stroke-width="2.5"/><text x="330.0" y="191.8" font-size="11" text-anchor="middle">Austro-Hungary</text></g><line x1="293.7" y1="171.2" x2="241.8" y2="147.3" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" class="fl" marker-end="url(#aho)"/><text x="200" y="44" font-size="11" text-anchor="middle"></text></svg>