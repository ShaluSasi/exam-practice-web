<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Expanding rings from France with arrows to three hidden consequences</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7C5CFF"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#E3F2FD"/><text x="200" y="26.0" font-size="13" text-anchor="middle">July 1830: the ripple from France</text><circle cx="110" cy="130" r="30" fill="none" stroke="#FF8A1F" stroke-width="3" class="blk" style="animation-delay:0s"/><circle cx="110" cy="130" r="60" fill="none" stroke="#FF8A1F" stroke-width="3" class="blk" style="animation-delay:0.6s"/><circle cx="110" cy="130" r="90" fill="none" stroke="#FF8A1F" stroke-width="3" class="blk" style="animation-delay:1.2s"/><circle cx="110" cy="130" r="20" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="134" font-size="11" text-anchor="middle" style="fill:#fff">France</text><g><rect x="230" y="44" width="150" height="54" rx="10" fill="#fff" stroke="#E5484D" stroke-width="2.5"/><text x="305.0" y="81.1" font-size="18" text-anchor="middle">?</text></g><g><rect x="230" y="104" width="150" height="54" rx="10" fill="#fff" stroke="#FF8A1F" stroke-width="2.5"/><text x="305.0" y="141.1" font-size="18" text-anchor="middle">?</text></g><g><rect x="230" y="164" width="150" height="54" rx="10" fill="#fff" stroke="#3FA34D" stroke-width="2.5"/><text x="305.0" y="201.1" font-size="18" text-anchor="middle">?</text></g><line x1="134" y1="124" x2="228" y2="76" stroke="#E5484D" stroke-width="3" stroke-linecap="round" class="fl" marker-end="url(#ahr)"/><line x1="138" y1="130" x2="228" y2="130" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" class="fl" marker-end="url(#aho)"/><line x1="134" y1="140" x2="228" y2="184" stroke="#3FA34D" stroke-width="3" stroke-linecap="round" class="fl" marker-end="url(#ahg)"/></svg>