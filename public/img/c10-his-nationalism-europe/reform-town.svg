"-22" y="-18" width="44" height="18" rx="4" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-12" cy="2" r="7" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="2" r="7" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><rect x="346" y="120" width="30" height="48" rx="3" fill="#D9DEE8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(361 112)"><rect x="-14.0" y="-11.0" width="28" height="22" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-9.0 -11.0V11.0" stroke="#fff" stroke-width="2"/><path d="M-5.0 -6H11.0M-5.0 1H11.0" stroke="#fff" stroke-width="2" stroke-linecap="round"/></g></svg>