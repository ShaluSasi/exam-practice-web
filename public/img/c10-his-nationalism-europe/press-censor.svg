ke-linejoin="round"/><path d="M168 182V210M302 182V210" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(235 168) scale(1.2)"><g><rect x="-8" y="-28" width="16" height="22" rx="5" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-4 -6V0M4 -6V0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-36" r="8" fill="#F4C9A0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-6" y="-52" width="12" height="11" fill="#2B2F4A"/><rect x="-10" y="-43" width="20" height="3" fill="#2B2F4A"/></g></g><rect x="196" y="150" width="22" height="16" rx="3" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="204" y="138" width="6" height="12" fill="#2B2F4A"/><rect x="262" y="154" width="38" height="14" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M266 160H296M266 164H288" stroke="#9AA3B5" stroke-width="2"/><g transform="translate(284 142)" class="drift"><path d="M-8 -6L8 8M8 -6L-8 8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-8" cy="-9" r="4" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="-9" r="4" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="338" y="150" width="46" height="12" rx="2" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="342" y="138" width="40" height="12" rx="2" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="338" y="126" width="46" height="12" rx="2" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M334 162L388 122" stroke="#E5484D" stroke-width="4" stroke-linecap="round"/></svg>