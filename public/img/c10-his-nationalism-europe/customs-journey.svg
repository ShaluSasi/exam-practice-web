<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A road with eleven numbered customs barriers and a merchant's cart travelling along it</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7C5CFF"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#E3F2FD"/><text x="200" y="26.0" font-size="13" text-anchor="middle">Hamburg to Nuremberg, 1833</text><rect x="10" y="150" width="380" height="14" rx="7" fill="#D8C7A8"/><path d="M40 150V112" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 122H50" stroke="#E5484D" stroke-width="5" stroke-linecap="round"/><text x="40" y="104" font-size="11" text-anchor="middle">1</text><path d="M72 150V112" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M62 122H82" stroke="#E5484D" stroke-width="5" stroke-linecap="round"/><text x="72" y="104" font-size="11" text-anchor="middle">2</text><path d="M104 150V112" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M94 122H114" stroke="#E5484D" stroke-width="5" stroke-linecap="round"/><text x="104" y="104" font-size="11" text-anchor="middle">3</text><path d="M136 150V112" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M126 122H146" stroke="#E5484D" stroke-width="5" stroke-linecap="round"/><text x="136" y="104" font-size="11" text-anchor="middle">4</text><path d="M168 150V112" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M158 122H178" stroke="#E5484D" stroke-width="5" stroke-linecap="round"/><text x="168" y="104" font-size="11" text-anchor="middle">5</text><path d="M200 150V112" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M190 122H210" stroke="#E5484D" stroke-width="5" stroke-linecap="round"/><text x="200" y="104" font-size="11" text-anchor="middle">6</text><path d="M232 150V112" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M222 122H242" stroke="#E5484D" stroke-width="5" stroke-linecap="round"/><text x="232" y="104" font-size="11" text-anchor="middle">7</text><path d="M264 150V112" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M254 122H274" stroke="#E5484D" stroke-width="5" stroke-linecap="round"/><text x="264" y="104" font-size="11" text-anchor="middle">8</text><path d="M296 150V112" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M286 122H306" stroke="#E5484D" stroke-width="5" stroke-linecap="round"/><text x="296" y="104" font-size="11" text-anchor="middle">9</text><path d="M328 150V112" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M318 122H338" stroke="#E5484D" stroke-width="5" stroke-linecap="round"/><text x="328" y="104" font-size="11" text-anchor="middle">10</text><path d="M360 150V112" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M350 122H370" stroke="#E5484D" stroke-width="5" stroke-linecap="round"/><text x="360" y="104" font-size="11" text-anchor="middle">11</text><g class="sw" style="animation-duration:5s"><g transform="translate(30 150)"><rect x="-16" y="-20" width="32" height="16" rx="4" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-8" cy="0" r="6" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="0" r="6" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><g><rect x="14" y="174" width="120" height="56" rx="10" fill="#fff" stroke="#0B93D4" stroke-width="2.5"/><text x="74.0" y="199.0" font-size="11" text-anchor="middle">Merchant starts</text><text x="74.0" y="212.7" font-size="11" text-anchor="middle">at Hamburg</text></g><g><rect x="266" y="174" width="120" height="56" rx="10" fill="#fff" stroke="#3FA34D" stroke-width="2.5"/><text x="326.0" y="205.8" font-size="11" text-anchor="middle">Ends at Nuremberg</text></g><g><rect x="142" y="174" width="116" height="56" rx="10" fill="#FFF3D6" stroke="#E5484D" stroke-width="2.5"/><text x="200.0" y="192.1" font-size="11" text-anchor="middle">11 barriers,</text><text x="200.0" y="205.8" font-size="11" text-anchor="middle">about 5% duty</text><text x="200.0" y="219.6" font-size="11" text-anchor="middle">each</text></g></svg>