<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Bar chart of the length of an elle of cloth in four towns: 54.7, 55.1, 65.6 and 53.5 centimetres</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7C5CFF"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M40 190H370M40 190V30" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M40 190.0H370" stroke="#C9D3E3" stroke-width="1.5"/><text x="34" y="194.0" font-size="11" text-anchor="end">0</text><path d="M40 147.14285714285714H370" stroke="#C9D3E3" stroke-width="1.5"/><text x="34" y="151.14285714285714" font-size="11" text-anchor="end">20</text><path d="M40 104.28571428571429H370" stroke="#C9D3E3" stroke-width="1.5"/><text x="34" y="108.28571428571429" font-size="11" text-anchor="end">40</text><path d="M40 61.428571428571445H370" stroke="#C9D3E3" stroke-width="1.5"/><text x="34" y="65.42857142857144" font-size="11" text-anchor="end">60</text><rect x="66" y="72.8" width="48" height="117.2" rx="5" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="90" y="66.8" font-size="12" text-anchor="middle">54.7</text><text x="90" y="208" font-size="11" text-anchor="middle">Frankfurt</text><rect x="141" y="71.9" width="48" height="118.1" rx="5" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="165" y="65.9" font-size="12" text-anchor="middle">55.1</text><text x="165" y="208" font-size="11" text-anchor="middle">Mainz</text><rect x="216" y="49.4" width="48" height="140.6" rx="5" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="43.4" font-size="12" text-anchor="middle">65.6</text><text x="240" y="208" font-size="11" text-anchor="middle">Nuremberg</text><rect x="291" y="75.4" width="48" height="114.6" rx="5" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="315" y="69.4" font-size="12" text-anchor="middle">53.5</text><text x="315" y="208" font-size="11" text-anchor="middle">Freiburg</text><text x="205" y="228" font-size="11" text-anchor="middle">Length of one elle of cloth (cm), by town</text></svg>