<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Four cards: a crown, a sun, a ballot box and a ballot paper</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7C5CFF"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="26.0" font-size="13" text-anchor="middle">Key terms</text><rect x="12" y="46" width="184" height="84" rx="12" fill="#fff" stroke="#E5484D" stroke-width="3"/><g transform="translate(48 88) scale(1.3)"><g><path d="M-14 8L-17 -8L-8 -1L0 -12L8 -1L17 -8L14 8Z" fill="#FFC93C" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="124" y="94" font-size="14" text-anchor="middle" style="fill:#E5484D">Absolutist</text><rect x="204" y="46" width="184" height="84" rx="12" fill="#fff" stroke="#7C5CFF" stroke-width="3"/><g transform="translate(240 88) scale(1.3)"><g><g class="spin"><line x1="13.0" y1="0.0" x2="20.0" y2="0.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="9.2" y1="9.2" x2="14.1" y2="14.1" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="0.0" y1="13.0" x2="0.0" y2="20.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="-9.2" y1="9.2" x2="-14.1" y2="14.1" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="-13.0" y1="0.0" x2="-20.0" y2="0.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="-9.2" y1="-9.2" x2="-14.1" y2="-14.1" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="-0.0" y1="-13.0" x2="-0.0" y2="-20.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="9.2" y1="-9.2" x2="14.1" y2="-14.1" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/></g><circle r="8" fill="#FFC93C" stroke="#FF8A1F" stroke-width="3"/></g></g><text x="316" y="94" font-size="14" text-anchor="middle" style="fill:#7C5CFF">Utopian</text><rect x="12" y="138" width="184" height="84" rx="12" fill="#fff" stroke="#3FA34D" stroke-width="3"/><g transform="translate(48 180) scale(1.3)"><g><rect x="-12" y="-6" width="24" height="18" rx="3" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-6 -6V-12H6V-6" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="124" y="186" font-size="14" text-anchor="middle" style="fill:#3FA34D">Plebiscite</text><rect x="204" y="138" width="184" height="84" rx="12" fill="#fff" stroke="#0B93D4" stroke-width="3"/><g transform="translate(240 180) scale(1.3)"><g><rect x="-10" y="-10" width="20" height="24" rx="3" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-5 0L-1 5L6 -5" fill="none" stroke="#3FA34D" stroke-width="3"/></g></g><text x="316" y="186" font-size="14" text-anchor="middle" style="fill:#0B93D4">Suffrage</text></svg>