<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A crown above eight patches, each naming a region or people of the Habsburg Empire</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7C5CFF"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="26.0" font-size="13" text-anchor="middle">The Habsburg Empire: a patchwork of peoples</text><g transform="translate(200 62) scale(1)"><g class="bob"><path d="M-14 8L-17 -8L-8 -1L0 -12L8 -1L17 -8L14 8Z" fill="#FFC93C" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><g><rect x="12" y="82" width="90" height="62" rx="10" fill="#FFFFFF" stroke="#0B93D4" stroke-width="2.5"/><text x="57.0" y="103.1" font-size="11" text-anchor="middle">Tyrol,</text><text x="57.0" y="116.8" font-size="11" text-anchor="middle">Austria,</text><text x="57.0" y="130.6" font-size="11" text-anchor="middle">Sudetenland</text></g><g><rect x="108" y="82" width="90" height="62" rx="10" fill="#FFFFFF" stroke="#3FA34D" stroke-width="2.5"/><text x="153.0" y="103.1" font-size="11" text-anchor="middle">Bohemia:</text><text x="153.0" y="116.8" font-size="11" text-anchor="middle">German</text><text x="153.0" y="130.6" font-size="11" text-anchor="middle">nobles</text></g><g><rect x="204" y="82" width="90" height="62" rx="10" fill="#FFFFFF" stroke="#FF8A1F" stroke-width="2.5"/><text x="249.0" y="103.1" font-size="11" text-anchor="middle">Lombardy,</text><text x="249.0" y="116.8" font-size="11" text-anchor="middle">Venetia:</text><text x="249.0" y="130.6" font-size="11" text-anchor="middle">Italian</text></g><g><rect x="300" y="82" width="90" height="62" rx="10" fill="#FFFFFF" stroke="#7C5CFF" stroke-width="2.5"/><text x="345.0" y="103.1" font-size="11" text-anchor="middle">Hungary:</text><text x="345.0" y="116.8" font-size="11" text-anchor="middle">half spoke</text><text x="345.0" y="130.6" font-size="11" text-anchor="middle">Magyar</text></g><g><rect x="12" y="152" width="90" height="62" rx="10" fill="#FFFFFF" stroke="#E5484D" stroke-width="2.5"/><text x="57.0" y="173.1" font-size="11" text-anchor="middle">Galicia:</text><text x="57.0" y="186.8" font-size="11" text-anchor="middle">aristocracy</text><text x="57.0" y="200.6" font-size="11" text-anchor="middle">spoke Polish</text></g><g><rect x="108" y="152" width="90" height="62" rx="10" fill="#FFFFFF" stroke="#0B93D4" stroke-width="2.5"/><text x="153.0" y="166.2" font-size="11" text-anchor="middle">Subject</text><text x="153.0" y="180.0" font-size="11" text-anchor="middle">peasants:</text><text x="153.0" y="193.7" font-size="11" text-anchor="middle">Slovaks,</text><text x="153.0" y="207.5" font-size="11" text-anchor="middle">Bohemians</text></g><g><rect x="204" y="152" width="90" height="62" rx="10" fill="#FFFFFF" stroke="#3FA34D" stroke-width="2.5"/><text x="249.0" y="173.1" font-size="11" text-anchor="middle">Slovenes in</text><text x="249.0" y="186.8" font-size="11" text-anchor="middle">Carniola,</text><text x="249.0" y="200.6" font-size="11" text-anchor="middle">Croats</text></g><g><rect x="300" y="152" width="90" height="62" rx="10" fill="#FFFFFF" stroke="#FF8A1F" stroke-width="2.5"/><text x="345.0" y="180.0" font-size="11" text-anchor="middle">Roumans in</text><text x="345.0" y="193.7" font-size="11" text-anchor="middle">Transylvania</text></g><text x="200" y="232" font-size="11" text-anchor="middle">Only tie: common allegiance to the emperor</text></svg>