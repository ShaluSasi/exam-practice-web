<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Four hidden causes with arrows converging on pauperism</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7C5CFF"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="26.0" font-size="13" text-anchor="middle">Why the 1830s were years of hardship</text><g><rect x="10" y="44" width="90" height="66" rx="10" fill="#fff" stroke="#0B93D4" stroke-width="2.5"/><text x="55.0" y="87.1" font-size="18" text-anchor="middle">?</text></g><line x1="55" y1="112" x2="200" y2="156" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" class="fl" marker-end="url(#ahb)"/><g><rect x="108" y="44" width="90" height="66" rx="10" fill="#fff" stroke="#FF8A1F" stroke-width="2.5"/><text x="153.0" y="87.1" font-size="18" text-anchor="middle">?</text></g><line x1="153" y1="112" x2="200" y2="156" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" class="fl" marker-end="url(#aho)"/><g><rect x="206" y="44" width="90" height="66" rx="10" fill="#fff" stroke="#3FA34D" stroke-width="2.5"/><text x="251.0" y="87.1" font-size="18" text-anchor="middle">?</text></g><line x1="251" y1="112" x2="200" y2="156" stroke="#3FA34D" stroke-width="2.5" stroke-linecap="round" class="fl" marker-end="url(#ahg)"/><g><rect x="304" y="44" width="90" height="66" rx="10" fill="#fff" stroke="#7C5CFF" stroke-width="2.5"/><text x="349.0" y="87.1" font-size="18" text-anchor="middle">?</text></g><line x1="349" y1="112" x2="200" y2="156" stroke="#7C5CFF" stroke-width="2.5" stroke-linecap="round" class="fl" marker-end="url(#ahp)"/><g class="pul"><rect x="120" y="158" width="160" height="44" rx="10" fill="#FFE9E9" stroke="#E5484D" stroke-width="2.5"/><text x="200.0" y="176.7" font-size="12" text-anchor="middle">Pauperism in town and</text><text x="200.0" y="191.7" font-size="12" text-anchor="middle">country</text></g></svg>