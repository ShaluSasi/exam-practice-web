<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A steaming hot spring in a cold mountain valley, with bacteria living in it</title>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BFE3F7"/><stop offset="1" stop-color="#EAF6FC"/></linearGradient>
<radialGradient id="pool" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#9BE3D6"/><stop offset="1" stop-color="#3FB0A4"/></radialGradient>
<clipPath id="lens"><circle cx="322" cy="88" r="48"/></clipPath>
</defs>
<style>
.b{animation:rise 3s ease-in infinite;opacity:0}
.b2{animation-delay:-1s}.b3{animation-delay:-2s}.b4{animation-delay:-.5s}.b5{animation-delay:-1.6s}
.s{animation:steam 5s ease-in-out infinite;opacity:0}
.s2{animation-delay:-1.7s}.s3{animation-delay:-3.3s}
.r{transform-box:fill-box;transform-origin:center;animation:wig 2s ease-in-out infinite}
.r2{animation-delay:-.6s}.r3{animation-delay:-1.2s}.r4{animation-delay:-1.6s}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}80%{opacity:.8}100%{transform:translateY(-20px);opacity:0}}
@keyframes steam{0%{transform:translate(0,0);opacity:0}25%{opacity:.85}100%{transform:translate(8px,-60px);opacity:0}}
@keyframes wig{0%,100%{transform:rotate(-12deg) translateX(-2px)}50%{transform:rotate(12deg) translateX(2px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.b,.s{opacity:.7}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect width="400" height="240" rx="16" fill="url(#sky)"/>
<path d="M0 150 L60 70 L100 110 L160 40 L220 120 L260 80 L320 150 L400 110 L400 170 L0 170 Z" fill="#9C6B45" stroke="#6E4628" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M44 91 L60 70 L78 92 L68 88 L60 96 L52 88 Z M140 64 L160 40 L182 72 L170 66 L160 74 L150 66 Z M248 92 L260 80 L276 100 L266 96 L258 102 Z" fill="#FFFFFF" stroke="#C8D6E0" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M0 160 C80 146 160 150 240 156 C300 160 360 150 400 152 L400 224 Q400 240 384 240 L16 240 Q0 240 0 224 Z" fill="#F4F8FB" stroke="#C8D6E0" stroke-width="2"/>
<ellipse cx="160" cy="190" rx="112" ry="28" fill="#B9A58A" stroke="#7E6A50" stroke-width="2.5"/>
<ellipse cx="160" cy="188" rx="100" ry="22" fill="url(#pool)" stroke="#2E8A80" stroke-width="2.5"/>
<path d="M100 186 q10 -4 20 0 M170 194 q10 -4 20 0 M200 182 q8 -3 16 0" fill="none" stroke="#E6FBF7" stroke-width="2" stroke-linecap="round"/>
<g fill="#E6FBF7" stroke="#2E8A80" stroke-width="1.2">
<circle class="b" cx="120" cy="192" r="3"/><circle class="b b2" cx="150" cy="196" r="2.5"/><circle class="b b3" cx="182" cy="190" r="3.2"/><circle class="b b4" cx="208" cy="194" r="2.2"/><circle class="b b5" cx="136" cy="186" r="2"/>
</g>
<g fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity=".9">
<path class="s" d="M118 176 c-8 -10 8 -18 0 -30"/><path class="s s2" d="M160 174 c-8 -10 8 -18 0 -30"/><path class="s s3" d="M200 176 c-8 -10 8 -18 0 -30"/>
</g>
<path d="M289 123 L262 152" stroke="#6E4628" stroke-width="8" stroke-linecap="round"/>
<circle cx="322" cy="88" r="48" fill="#DDF5F1"/>
<g clip-path="url(#lens)">
<g fill="#CFE9A8" stroke="#4E8F2A" stroke-width="2">
<rect class="r" x="290" y="62" width="26" height="10" rx="5"/><rect class="r r2" x="324" y="54" width="22" height="9" rx="4.5"/>
<rect class="r r3" x="300" y="90" width="24" height="10" rx="5"/><rect class="r r4" x="332" y="80" width="26" height="10" rx="5"/>
<rect class="r r2" x="312" y="112" width="22" height="9" rx="4.5"/><rect class="r" x="282" y="100" width="14" height="8" rx="4"/>
<rect class="r r3" x="344" y="104" width="18" height="9" rx="4.5"/>
</g>
</g>
<circle cx="322" cy="88" r="48" fill="none" stroke="#2B2F4A" stroke-width="4"/>
<path d="M294 70 a34 34 0 0 1 20 -18" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".8"/>
<text x="388" y="230" text-anchor="end" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2B2F4A">Puga Valley, Ladakh</text>
</svg>
