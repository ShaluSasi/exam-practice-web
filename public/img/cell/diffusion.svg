.tint{opacity:0;animation:tint 5s ease-out infinite}
@keyframes tint{0%,12%{opacity:0}80%,92%{opacity:.35}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.tint{opacity:.35}}
</style>
