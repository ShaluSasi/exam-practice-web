<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img">
<title>Plant tissue culture: a single cell grows into a callus and then into a plantlet</title>
<defs>
<g id="dish">
<rect x="-56" y="132" width="112" height="34" rx="9" fill="#EAF4FA" stroke="#7FA6BF" stroke-width="2.5"/>
<rect x="-50" y="144" width="100" height="18" rx="6" fill="#F5E3A1" stroke="#D9B85A" stroke-width="2"/>
<ellipse cx="0" cy="132" rx="56" ry="6" fill="none" stroke="#7FA6BF" stroke-width="2"/>
</g>
<marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker>
</defs>
<style>
.st1{animation:a1 7s ease-in-out infinite}
.ar1{animation:a2 7s ease-in-out infinite}
.st2{animation:a3 7s ease-in-out infinite}
.ar2{animation:a4 7s ease-in-out infinite}
.st3{animation:a5 7s ease-in-out infinite}
.pulse{transform-box:fill-box;transform-origin:center bottom;animation:grow 7s ease-in-out infinite}
@keyframes a1{0%{opacity:0}6%,88%{opacity:1}96%,100%{opacity:0}}
@keyframes a2{0%,16%{opacity:0}22%,88%{opacity:1}96%,100%{opacity:0}}
@keyframes a3{0%,26%{opacity:0}34%,88%{opacity:1}96%,100%{opacity:0}}
@keyframes a4{0%,44%{opacity:0}50%,88%{opacity:1}96%,100%{opacity:0}}
@keyframes a5{0%,54%{opacity:0}62%,88%{opacity:1}96%,100%{opacity:0}}
@keyframes grow{0%,54%{transform:scale(.5)}72%,100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g class="st1">
<rect x="34" y="72" width="64" height="56" rx="12" fill="#EEF8E0" stroke="#4E8F2A" stroke-width="4"/>
<rect x="44" y="82" width="34" height="30" rx="10" fill="#CDE9FF" stroke="#4A90C8" stroke-width="2"/>
<circle cx="84" cy="114" r="8" fill="#D9C3F5" stroke="#7B4BC0" stroke-width="2"/>
<circle cx="85" cy="114" r="2.5" fill="#6D3BB0"/>
<ellipse cx="52" cy="120" rx="6" ry="3.5" fill="#3FA34D"/><ellipse cx="88" cy="86" rx="5" ry="3" fill="#3FA34D"/>
</g>
<path class="ar1" d="M112 100 H138" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/>
<g class="st2">
<use href="#dish" x="200"/>
<g fill="#E4EFB8" stroke="#8AA33A" stroke-width="2">
<circle cx="178" cy="138" r="10"/><circle cx="222" cy="138" r="10"/><circle cx="190" cy="128" r="11"/><circle cx="210" cy="127" r="11"/>
<circle cx="200" cy="138" r="12"/><circle cx="200" cy="116" r="10"/><circle cx="186" cy="114" r="7"/><circle cx="214" cy="114" r="7"/>
</g>
<g fill="#8AA33A" opacity=".6"><circle cx="190" cy="127" r="1.6"/><circle cx="210" cy="126" r="1.6"/><circle cx="200" cy="137" r="1.6"/><circle cx="200" cy="115" r="1.6"/><circle cx="178" cy="138" r="1.4"/><circle cx="222" cy="138" r="1.4"/></g>
</g>
<path class="ar2" d="M262 100 H288" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/>
<g class="st3">
<use href="#dish" x="340"/>
<g fill="none" stroke="#B08A4E" stroke-width="2" stroke-linecap="round"><path d="M340 144 v14 M340 148 l-10 10 M340 148 l10 9 M336 154 l-6 6 M344 153 l8 4"/></g>
<g class="pulse">
<path d="M340 146 V92" stroke="#3E7A22" stroke-width="4" stroke-linecap="round"/>
<path d="M340 118 C328 104 310 104 302 112 C312 124 330 124 340 118 Z M340 106 C352 92 370 92 378 100 C368 112 350 112 340 106 Z M340 94 C334 84 336 74 340 70 C344 74 346 84 340 94 Z" fill="#5FAE3A" stroke="#3E7A22" stroke-width="2.5" stroke-linejoin="round"/>
</g>
</g>
</svg>
