<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
  <title>Structure of a nucleus</title>
  <style>
    .wiggle { animation: wiggle 4s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    @keyframes wiggle { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
    .pore { animation: pore 2.5s ease-in-out infinite; }
    @keyframes pore { 50% { opacity: 0.4; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>

  <!-- Double nuclear membrane -->
  <circle cx="200" cy="130" r="105" fill="#EFE4FB" stroke="#7B4BC0" stroke-width="5"/>
  <circle cx="200" cy="130" r="96" fill="#E6D6FA" stroke="#7B4BC0" stroke-width="3"/>

  <!-- Nuclear pores (gaps across both membranes) -->
  <g fill="#FFF9EE" stroke="#7B4BC0" stroke-width="1.5">
    <rect class="pore" x="194" y="22" width="12" height="16" rx="4"/>
    <rect class="pore" x="296" y="124" width="16" height="12" rx="4"/>
    <rect class="pore" x="194" y="222" width="12" height="16" rx="4"/>
    <rect class="pore" x="88" y="124" width="16" height="12" rx="4" style="animation-delay:-1s"/>
    <rect class="pore" x="263" y="52" width="12" height="12" rx="4" transform="rotate(45 269 58)"/>
    <rect class="pore" x="125" y="196" width="12" height="12" rx="4" transform="rotate(45 131 202)"/>
  </g>

  <!-- Chromatin threads -->
  <g class="wiggle" fill="none" stroke="#9A6FD6" stroke-width="2.5" stroke-linecap="round">
    <path d="M130 160q10-14 20 0t20 0t20 4"/>
    <path d="M140 185q12-10 22 2t22-4"/>
    <path d="M250 165q8 12 18 2t16 6"/>
    <path d="M150 90q10 10 20 0t18 4"/>
    <path d="M240 190q10-8 18 2"/>
    <path d="M260 90q8 10 16 2"/>
  </g>

  <!-- Nucleolus -->
  <circle cx="215" cy="120" r="26" fill="#6D3BB0"/>
  <circle cx="207" cy="112" r="6" fill="#8C5CC9"/>
</svg>
