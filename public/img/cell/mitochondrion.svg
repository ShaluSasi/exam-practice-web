<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
  <title>Structure of a mitochondrion</title>
  <style>
    .atp { animation: rise 3.6s ease-out infinite; opacity: 0; }
    .a2 { animation-delay: 1.2s; }
    .a3 { animation-delay: 2.4s; }
    @keyframes rise { 0% { opacity: 0; transform: translateY(0); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-34px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .atp { opacity: 1; } }
  </style>
  <rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>

  <!-- Outer membrane -->
  <ellipse cx="200" cy="120" rx="160" ry="80" fill="#F8B878" stroke="#D9692A" stroke-width="6"/>
  <!-- Inner membrane -->
  <ellipse cx="200" cy="120" rx="148" ry="68" fill="#FCE0C4" stroke="#C0561E" stroke-width="3"/>

  <!-- Cristae: folds of the inner membrane -->
  <g stroke="#C0561E" stroke-width="12" stroke-linecap="round">
    <path d="M110 58v76"/><path d="M190 52v84"/><path d="M270 56v78"/>
    <path d="M150 186v-80"/><path d="M230 188v-82"/><path d="M310 176v-64"/>
  </g>
  <g stroke="#FCE0C4" stroke-width="5" stroke-linecap="round">
    <path d="M110 58v74"/><path d="M190 52v82"/><path d="M270 56v76"/>
    <path d="M150 186v-78"/><path d="M230 188v-80"/><path d="M310 176v-62"/>
  </g>

  <!-- DNA loop -->
  <path d="M66 125c0-12 18-12 18 0s-18 12-18 0" fill="none" stroke="#7B4BC0" stroke-width="3"/>
  <!-- Ribosomes -->
  <g fill="#5B3A8C"><circle cx="330" cy="120" r="3.5"/><circle cx="338" cy="108" r="3"/><circle cx="130" cy="160" r="3"/><circle cx="210" cy="80" r="3"/></g>

  <!-- Energy released as ATP -->
  <g font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#B7791F">
    <text class="atp" x="120" y="34">ATP</text>
    <text class="atp a2" x="250" y="30">ATP</text>
    <text class="atp a3" x="330" y="50">ATP</text>
  </g>
</svg>
