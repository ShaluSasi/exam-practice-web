<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
  <title>A compound light microscope</title>
  <style>
    .beam { animation: beam 2.4s ease-in-out infinite; }
    @keyframes beam { 50% { opacity: 0.25; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>

  <!-- Light beam from mirror up through the stage -->
  <path class="beam" d="M160 236L174 236L172 202L162 202Z" fill="#FFE27A" opacity="0.6"/>

  <!-- Arm (handle) -->
  <path d="M245 255C300 205 300 120 236 82" fill="none" stroke="#2B2F4A" stroke-width="24" stroke-linecap="round"/>

  <!-- Base -->
  <rect x="120" y="255" width="170" height="24" rx="10" fill="#2B2F4A"/>

  <!-- Body tube and eyepiece -->
  <rect x="150" y="50" width="34" height="110" rx="5" fill="#3C4166"/>
  <rect x="157" y="20" width="20" height="32" rx="4" fill="#5B6290" stroke="#2B2F4A" stroke-width="2"/>
  <rect x="154" y="16" width="26" height="7" rx="3" fill="#2B2F4A"/>
  <path d="M184 76h50" stroke="#2B2F4A" stroke-width="12" stroke-linecap="round"/>

  <!-- Revolving nosepiece and objective lenses -->
  <rect x="142" y="158" width="50" height="12" rx="5" fill="#2B2F4A"/>
  <rect x="158" y="170" width="18" height="30" rx="4" fill="#8A90B8" stroke="#2B2F4A" stroke-width="2"/>
  <rect x="140" y="168" width="13" height="22" rx="4" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="2" transform="rotate(18 146 179)"/>
  <rect x="181" y="168" width="13" height="22" rx="4" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="2" transform="rotate(-18 188 179)"/>

  <!-- Stage with a glass slide -->
  <rect x="110" y="205" width="150" height="12" rx="3" fill="#2B2F4A"/>
  <rect x="135" y="199" width="64" height="6" rx="1.5" fill="#CDE9FF" stroke="#4A90C8" stroke-width="1.5"/>
  <rect x="118" y="200" width="10" height="5" rx="1" fill="#5B6290"/>
  <rect x="206" y="200" width="10" height="5" rx="1" fill="#5B6290"/>

  <!-- Mirror -->
  <path d="M167 246v9" stroke="#2B2F4A" stroke-width="4"/>
  <ellipse cx="167" cy="238" rx="18" ry="8" fill="#CDE9FF" stroke="#2B2F4A" stroke-width="3"/>

  <!-- Coarse and fine adjustment knobs -->
  <circle cx="262" cy="140" r="16" fill="#5B6290" stroke="#2B2F4A" stroke-width="3"/>
  <circle cx="262" cy="140" r="5" fill="#2B2F4A"/>
  <circle cx="262" cy="175" r="9" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="3"/>
</svg>
