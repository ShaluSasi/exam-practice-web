.d2{animation-name:d2}.d3{animation-name:d3}.d4{animation-name:d4}
@keyframes shrink{0%,10%{transform:scale(1,1)}60%,85%{transform:scale(.82,.62)}100%{transform:scale(1,1)}}
@keyframes d1{0%,10%{opacity:0;transform:translate(0,0)}25%{opacity:1}70%,100%{opacity:0;transform:translate(-26px,-22px)}}
