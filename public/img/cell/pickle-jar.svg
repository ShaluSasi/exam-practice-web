@keyframes d4{0%,25%{opacity:0;transform:translate(0,0)}40%{opacity:1}85%,100%{opacity:0;transform:translate(28px,22px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.d{opacity:1}}
</style>
