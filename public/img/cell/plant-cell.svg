<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
  <title>A typical plant cell</title>
  <style>
    .drift { animation: drift 6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    .d2 { animation-delay: -2s; }
    .d3 { animation-delay: -4s; }
    @keyframes drift { from { transform: translate(-3px, -2px) rotate(-4deg); } to { transform: translate(3px, 2px) rotate(4deg); } }
    .pulse { animation: pulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 50% { transform: scale(1.12); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>

  <!-- Cell wall and membrane -->
  <rect x="24" y="24" width="352" height="252" rx="28" fill="#CFE8B0" stroke="#4E8F2A" stroke-width="8"/>
  <rect x="36" y="36" width="328" height="228" rx="20" fill="#EEF8E0" stroke="#8CC152" stroke-width="3"/>

  <!-- Large central vacuole -->
  <ellipse cx="262" cy="168" rx="82" ry="74" fill="#CDE9FF" stroke="#4A90C8" stroke-width="3"/>
  <circle cx="240" cy="140" r="5" fill="#fff" opacity="0.7"/>
  <circle cx="290" cy="200" r="4" fill="#fff" opacity="0.6"/>
  <circle cx="300" cy="130" r="3" fill="#fff" opacity="0.6"/>

  <!-- Nucleus -->
  <circle cx="108" cy="96" r="36" fill="#D9C3F5" stroke="#7B4BC0" stroke-width="4"/>
  <circle cx="108" cy="96" r="30" fill="none" stroke="#7B4BC0" stroke-width="1.5" stroke-dasharray="10 4"/>
  <path d="M86 84q6-8 12 0t12 0M90 112q6 6 12 0t14 2M120 108q6-6 10 2" fill="none" stroke="#9A6FD6" stroke-width="2" stroke-linecap="round"/>
  <circle class="pulse" cx="114" cy="92" r="11" fill="#6D3BB0"/>

  <!-- Endoplasmic reticulum -->
  <g fill="none" stroke="#D46A8A" stroke-width="4" stroke-linecap="round">
    <path d="M150 72q8-7 16 0t16 0t16 0"/>
    <path d="M150 85q8-7 16 0t16 0t16 0"/>
    <path d="M150 98q8-7 16 0t16 0t16 0"/>
  </g>
  <g fill="#5B3A8C">
    <circle cx="158" cy="66" r="2"/><circle cx="174" cy="79" r="2"/><circle cx="190" cy="66" r="2"/>
    <circle cx="166" cy="92" r="2"/><circle cx="198" cy="92" r="2"/>
  </g>

  <!-- Golgi apparatus -->
  <g fill="none" stroke="#E0679A" stroke-width="5" stroke-linecap="round">
    <path d="M88 168q22-12 44 0"/>
    <path d="M90 177q20-11 40 0"/>
    <path d="M92 186q18-10 36 0"/>
    <path d="M95 195q15-8 30 0"/>
  </g>
  <circle cx="138" cy="172" r="4" fill="#F28CB1"/>
  <circle cx="134" cy="194" r="3" fill="#F28CB1"/>

  <!-- Mitochondria -->
  <g class="drift d2">
    <ellipse cx="150" cy="232" rx="24" ry="12" fill="#F6A15A" stroke="#D9692A" stroke-width="2.5"/>
    <path d="M132 232l5-6 5 12 5-12 5 12 5-12 5 12 5-6" fill="none" stroke="#C0561E" stroke-width="1.8" stroke-linejoin="round"/>
  </g>
  <g class="drift d3">
    <ellipse cx="320" cy="252" rx="16" ry="8" fill="#F6A15A" stroke="#D9692A" stroke-width="2"/>
    <path d="M308 252l4-4 4 8 4-8 4 8 4-8 4 4" fill="none" stroke="#C0561E" stroke-width="1.5"/>
  </g>

  <!-- Chloroplasts -->
  <g class="drift">
    <ellipse cx="300" cy="62" rx="26" ry="13" fill="#3FA34D" stroke="#2E7D32" stroke-width="2.5"/>
    <g fill="#2E7D32"><rect x="282" y="57" width="7" height="10" rx="2"/><rect x="293" y="57" width="7" height="10" rx="2"/><rect x="304" y="57" width="7" height="10" rx="2"/><rect x="315" y="58" width="5" height="8" rx="2"/></g>
  </g>
  <g class="drift d2">
    <ellipse cx="60" cy="215" rx="17" ry="9" fill="#3FA34D" stroke="#2E7D32" stroke-width="2"/>
    <g fill="#2E7D32"><rect x="50" y="211" width="5" height="8" rx="1.5"/><rect x="58" y="211" width="5" height="8" rx="1.5"/><rect x="66" y="212" width="4" height="6" rx="1.5"/></g>
  </g>
  <g class="drift d3">
    <ellipse cx="215" cy="56" rx="15" ry="8" fill="#3FA34D" stroke="#2E7D32" stroke-width="2"/>
    <g fill="#2E7D32"><rect x="206" y="52" width="5" height="8" rx="1.5"/><rect x="214" y="52" width="5" height="8" rx="1.5"/></g>
  </g>

  <!-- Free ribosomes -->
  <g fill="#5B3A8C">
    <circle cx="60" cy="150" r="2"/><circle cx="72" cy="170" r="2"/><circle cx="196" cy="140" r="2"/>
    <circle cx="170" cy="150" r="2"/><circle cx="105" cy="250" r="2"/><circle cx="200" cy="245" r="2"/>
    <circle cx="350" cy="90" r="2"/><circle cx="58" cy="60" r="2"/>
  </g>
</svg>
