<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" role="img">
<title>Red blood cell in an isotonic solution: water moves in and out equally</title>
<style>
.ar{fill:none;stroke:#2F6FA8;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.in{animation:in 3s ease-in-out infinite}
.out{animation:out 3s ease-in-out infinite}
.d1{animation-delay:-1.5s}
@keyframes in{0%{transform:translateX(0);opacity:0}25%,75%{opacity:1}100%{transform:translateX(-8px);opacity:0}}
@keyframes out{0%{transform:translateX(0);opacity:0}25%,75%{opacity:1}100%{transform:translateX(8px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<radialGradient id="rbc">
<stop offset="0" stop-color="#F6A3A5"/>
<stop offset=".45" stop-color="#EF7D80"/>
<stop offset=".85" stop-color="#E5484D"/>
</radialGradient>
</defs>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="100" cy="80" r="72" fill="#E9F5FF" stroke="#4A90C8" stroke-width="3"/>
<circle cx="100" cy="80" r="64" fill="#CDE9FF" stroke="#4A90C8" stroke-width="1.5" stroke-opacity=".5"/>
<g transform="translate(100 80)">
<circle r="26" fill="url(#rbc)" stroke="#B8323A" stroke-width="2.5"/>
<g class="ar">
<g transform="rotate(0)"><path class="in" d="M58 0H46M50 -4L46 0L50 4"/></g>
<g transform="rotate(90)"><path class="in d1" d="M58 0H46M50 -4L46 0L50 4"/></g>
<g transform="rotate(180)"><path class="in" d="M58 0H46M50 -4L46 0L50 4"/></g>
<g transform="rotate(270)"><path class="in d1" d="M58 0H46M50 -4L46 0L50 4"/></g>
<g transform="rotate(45)"><path class="out d1" d="M30 0H42M38 -4L42 0L38 4"/></g>
<g transform="rotate(135)"><path class="out" d="M30 0H42M38 -4L42 0L38 4"/></g>
<g transform="rotate(225)"><path class="out d1" d="M30 0H42M38 -4L42 0L38 4"/></g>
<g transform="rotate(315)"><path class="out" d="M30 0H42M38 -4L42 0L38 4"/></g>
</g>
</g>
</svg>
