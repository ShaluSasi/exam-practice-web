<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img">
<title>Lysosome</title>
<style>
.p{transform-box:fill-box;transform-origin:center;animation:p 3s ease-in-out infinite}
.e{transform-box:fill-box;transform-origin:center;animation:r 8s linear infinite}
