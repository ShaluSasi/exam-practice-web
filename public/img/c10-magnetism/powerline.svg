<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A horizontal power line with current flowing from east to west, points A above and B below the wire</title>
<style>.flow{stroke-dasharray:7 9;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.nd{transform-box:view-box}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><marker id="mn" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2B2F4A"/></marker><marker id="mo" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#FF8A1F"/></marker><marker id="mb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0B93D4"/></marker><marker id="mg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3FA34D"/></marker><marker id="mr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#E5484D"/></marker><marker id="mp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7C5CFF"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M40 90L40 225" fill="none" stroke="#7A5C3A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><path d="M18 100L62 100" fill="none" stroke="#7A5C3A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><path d="M360 90L360 225" fill="none" stroke="#7A5C3A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><path d="M338 100L382 100" fill="none" stroke="#7A5C3A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><path d="M40 100Q200 112 360 100" fill="none" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M300 82L125.8 82.0" fill="none" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><polygon points="117.6,82.0 129.6,76.7 129.6,87.3" fill="#FF8A1F" stroke="#FF8A1F" stroke-width="1" stroke-linejoin="round"/><text x="210" y="66" font-family="sans-serif" font-size="13" font-weight="700" fill="#FF8A1F" text-anchor="middle">current: East to West</text><text x="382" y="92" font-family="sans-serif" font-size="14" font-weight="700" fill="#3FA34D" text-anchor="middle">E</text><text x="18" y="92" font-family="sans-serif" font-size="14" font-weight="700" fill="#3FA34D" text-anchor="middle">W</text><circle cx="200" cy="50" r="0" fill="none" stroke="none" stroke-width="0"/><text x="310" y="40" font-family="sans-serif" font-size="16" font-weight="700" fill="#7C5CFF" text-anchor="middle">A</text><path d="M310 44L310 85" fill="none" stroke="#7C5CFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="310" y="168" font-family="sans-serif" font-size="16" font-weight="700" fill="#7C5CFF" text-anchor="middle">B</text><path d="M310 118L310 154" fill="none" stroke="#7C5CFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="200" y="205" font-family="sans-serif" font-size="12" font-weight="600" fill="#5B6178" text-anchor="middle">view from the south: East on the right</text><text x="200" y="225" font-family="sans-serif" font-size="12" font-weight="600" fill="#5B6178" text-anchor="middle">into the page = North, out of the page = South</text>
</svg>
