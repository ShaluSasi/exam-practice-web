<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A wire above a compass: reversing the current makes the needle deflect the other way</title>
<style>.flow{stroke-dasharray:7 9;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.nd{transform-box:view-box}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.sa{animation:sa 3.5s ease-in-out infinite}.sb{animation:sb 3.5s ease-in-out infinite}@keyframes sa{0%,15%{transform:rotate(0)}35%,80%{transform:rotate(40deg)}100%{transform:rotate(0)}}@keyframes sb{0%,15%{transform:rotate(0)}35%,80%{transform:rotate(-40deg)}100%{transform:rotate(0)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
