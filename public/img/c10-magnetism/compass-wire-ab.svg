dth="1" stroke-linejoin="round"/><circle cx="300" cy="135" r="36" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3"/><g class="nd sb" style="transform-origin:300px 135px;"><polygon points="293,135 307,135 300,107" fill="#E5484D" stroke="#2B2F4A" stroke-width="2"/><polygon points="293,135 307,135 300,163" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><circle cx="300" cy="135" r="2.5" fill="#2B2F4A"/></g><text x="300" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#3FA34D" text-anchor="middle">N</text><text x="352" y="139" font-family="sans-serif" font-size="12" font-weight="700" fill="#3FA34D" text-anchor="middle">E</text><text x="248" y="139" font-family="sans-serif" font-size="12" font-weight="700" fill="#3FA34D" text-anchor="middle">W</text><text x="300" y="202" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">(b) cells reversed:</text><text x="300" y="219" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">south to north</text><path d="M200 20L200 200" fill="none" stroke="#D5D8E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
