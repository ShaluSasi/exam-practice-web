<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A fuse wire inside a glass holder heats up and melts, breaking the circuit when the current is too large</title>
<style>.flow{stroke-dasharray:7 9;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.nd{transform-box:view-box}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.cur{animation:cu 4s linear infinite}@keyframes cu{0%,45%{opacity:1}55%,100%{opacity:0}}.fw{animation:fw 4s linear infinite}@keyframes fw{0%,35%{opacity:1;stroke:#9AA0B8}50%{stroke:#FF8A1F}55%,100%{opacity:0}}.gp{animation:gp 4s linear infinite}@keyframes gp{0%,50%{opacity:0}60%,100%{opacity:1}}.gl{animation:gl 4s linear infinite}@keyframes gl{0%,35%{opacity:0}48%{opacity:1}60%,100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><marker id="mn" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2B2F4A"/></marker><marker id="mo" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#FF8A1F"/></marker><marker id="mb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0B93D4"/></marker><marker id="mg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3FA34D"/></marker><marker id="mr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#E5484D"/></marker><marker id="mp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7C5CFF"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M30 120L150 120" fill="none" stroke="#2B2F4A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><path d="M250 120L370 120" fill="none" stroke="#2B2F4A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><g class="cur"><path d="M30 120L150 120" fill="none" stroke="#FFD0A0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="flow" /><path d="M250 120L370 120" fill="none" stroke="#FFD0A0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="flow" /></g><rect x="150" y="92" width="100" height="56" rx="10" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3"/><rect x="143" y="100" width="10" height="40" rx="2" fill="#B8BCD0" stroke="#2B2F4A" stroke-width="2"/><rect x="247" y="100" width="10" height="40" rx="2" fill="#B8BCD0" stroke="#2B2F4A" stroke-width="2"/><path d="M153 120L247 120" fill="none" stroke="#9AA0B8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="fw" /><circle class="gl" cx="200" cy="120" r="22" fill="#FF8A1F" opacity="0"/><g class="gp"><path d="M153 120L180 120" fill="none" stroke="#9AA0B8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M220 120L247 120" fill="none" stroke="#9AA0B8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M180 120Q190 100 188 90" fill="none" stroke="#5B6178" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="200" y="75" font-family="sans-serif" font-size="13" font-weight="700" fill="#FF8A1F" text-anchor="middle">fuse wire melts (Joule heating)</text><text x="200" y="190" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">too much current: wire heats, melts, circuit breaks</text><text x="200" y="210" font-family="sans-serif" font-size="12" font-weight="600" fill="#5B6178" text-anchor="middle">the appliance is protected</text>
</svg>
