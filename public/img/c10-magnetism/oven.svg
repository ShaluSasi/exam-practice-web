<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A 2 kilowatt electric oven connected to a 220 volt domestic circuit rated 5 amperes</title>
<style>.flow{stroke-dasharray:7 9;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.nd{transform-box:view-box}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.gw{animation:pulse 1.5s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><marker id="mn" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2B2F4A"/></marker><marker id="mo" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#FF8A1F"/></marker><marker id="mb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0B93D4"/></marker><marker id="mg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3FA34D"/></marker><marker id="mr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#E5484D"/></marker><marker id="mp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7C5CFF"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="190" y="50" width="170" height="120" rx="12" fill="#E8EAF4" stroke="#2B2F4A" stroke-width="3"/><rect x="210" y="75" width="130" height="70" rx="6" fill="#FFD9A8" stroke="#2B2F4A" stroke-width="3"/><text x="275" y="118" font-family="sans-serif" font-size="22" font-weight="700" fill="#E5484D" text-anchor="middle">2 kW</text><text x="275" y="195" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">electric oven</text><rect x="20" y="70" width="90" height="80" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3"/><text x="65" y="98" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">supply</text><text x="65" y="118" font-family="sans-serif" font-size="16" font-weight="700" fill="#0B93D4" text-anchor="middle">220 V</text><text x="65" y="138" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">5 A circuit</text><path d="M110 100L190 100" fill="none" stroke="#E5484D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M110 125L190 125" fill="none" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><rect x="135" y="85" width="28" height="18" rx="3" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><text x="149" y="98" font-family="sans-serif" font-size="10" font-weight="700" fill="#2B2F4A" text-anchor="middle">5A</text><text x="150" y="72" font-family="sans-serif" font-size="11" font-weight="700" fill="#5B6178" text-anchor="middle">fuse</text><text x="200" y="225" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">Will the 5 A circuit cope with the oven?</text>
</svg>
