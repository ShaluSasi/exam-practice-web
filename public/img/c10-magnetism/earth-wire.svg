<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A leaking live wire touches the metal body of an appliance; the green earth wire carries the current safely into the ground</title>
<style>.flow{stroke-dasharray:7 9;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.nd{transform-box:view-box}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.ew{stroke-dasharray:7 9;animation:ewf 1s linear infinite}@keyframes ewf{to{stroke-dashoffset:-16}}.zp{animation:pulse 1s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><marker id="mn" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2B2F4A"/></marker><marker id="mo" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#FF8A1F"/></marker><marker id="mb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0B93D4"/></marker><marker id="mg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3FA34D"/></marker><marker id="mr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#E5484D"/></marker><marker id="mp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7C5CFF"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="110" y="50" width="140" height="70" rx="10" fill="#B8BCD0" stroke="#2B2F4A" stroke-width="3"/><text x="180" y="90" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">metal body</text><text x="180" y="106" font-family="sans-serif" font-size="12" font-weight="600" fill="#5B6178" text-anchor="middle">(toaster)</text><path d="M110 70L60 70L60 30L20 30" fill="none" stroke="#E5484D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M110 100L90 100L90 160L20 160" fill="none" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><polygon class="zp" points="120,52 108,80 118,80 110,100 132,70 121,70 130,52" fill="#FFD43B" stroke="#FF8A1F" stroke-width="2"/><text x="60" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#E5484D" text-anchor="middle">live wire</text><text x="60" y="178" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">neutral wire</text><path d="M180 120L180 175" fill="none" stroke="#3FA34D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><path d="M180 120L180 175" fill="none" stroke="#CFEFD3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ew" /><path d="M180 175L180 190" fill="none" stroke="#3FA34D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><rect x="40" y="190" width="320" height="36" rx="4" fill="#C9A877" stroke="#2B2F4A" stroke-width="3"/><rect x="150" y="185" width="60" height="10" rx="2" fill="#7A5C3A" stroke="#2B2F4A" stroke-width="2"/><text x="280" y="213" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">ground (earth)</text><circle cx="310" cy="70" r="14" fill="#F2C29B" stroke="#2B2F4A" stroke-width="3"/><path d="M310 84L310 130" fill="none" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M310 95L252 90" fill="none" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M310 130L296 185" fill="none" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M310 130L328 185" fill="none" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="335" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#3FA34D" text-anchor="start">safe!</text>
</svg>
