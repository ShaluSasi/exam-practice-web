<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M40 36L360 36" fill="none" stroke="#2B2F4A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><path d="M40 214L360 214" fill="none" stroke="#2B2F4A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><text x="200" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">front wall</text><text x="200" y="234" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">back wall (you sit here)</text><circle cx="120" cy="196" r="9" fill="#F2C29B" stroke="#2B2F4A" stroke-width="3"/><path d="M108 207Q120 190 132 207" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M200 190C200 130 220 80 290 55" fill="none" stroke="#0B93D4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><polygon points="294.6,52.5 284.9,65.7 278.3,54.2" fill="#0B93D4" stroke="#0B93D4" stroke-width="1" stroke-linejoin="round"/><circle cx="200" cy="190" r="9" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3"/><text x="200" y="194" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">&#8722;</text><text x="296" y="95" font-family="sans-serif" font-size="13" font-weight="700" fill="#0B93D4" text-anchor="start">beam bends</text><text x="296" y="112" font-family="sans-serif" font-size="13" font-weight="700" fill="#0B93D4" text-anchor="start">to your right</text><text x="185" y="130" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="end">electron beam</text><text x="120" y="180" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">you</text>
