<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A compass needle with its red north-seeking end and white south-seeking end</title>
<style>.flow{stroke-dasharray:7 9;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.nd{transform-box:view-box}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.wb{animation:wb 3s ease-in-out infinite}@keyframes wb{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><marker id="mn" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2B2F4A"/></marker><marker id="mo" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#FF8A1F"/></marker><marker id="mb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0B93D4"/></marker><marker id="mg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3FA34D"/></marker><marker id="mr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#E5484D"/></marker><marker id="mp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7C5CFF"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="110" cy="120" r="82" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3"/><text x="110" y="50" font-family="sans-serif" font-size="15" font-weight="700" fill="#3FA34D" text-anchor="middle">N</text><text x="110" y="200" font-family="sans-serif" font-size="15" font-weight="700" fill="#3FA34D" text-anchor="middle">S</text><text x="38" y="125" font-family="sans-serif" font-size="15" font-weight="700" fill="#3FA34D" text-anchor="middle">W</text><text x="182" y="125" font-family="sans-serif" font-size="15" font-weight="700" fill="#3FA34D" text-anchor="middle">E</text><g class="nd wb" style="transform-origin:110px 120px;"><polygon points="97,120 123,120 110,64" fill="#E5484D" stroke="#2B2F4A" stroke-width="2"/><polygon points="97,120 123,120 110,176" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><circle cx="110" cy="120" r="2.5" fill="#2B2F4A"/></g><rect x="222" y="60" width="22" height="22" rx="4" fill="#E5484D" stroke="#2B2F4A" stroke-width="2"/><text x="252" y="77" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="start">end that points north</text><rect x="222" y="110" width="22" height="22" rx="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><text x="252" y="127" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="start">end that points south</text><text x="222" y="170" font-family="sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="start">A compass needle is a</text><text x="222" y="188" font-family="sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="start">small bar magnet.</text>
</svg>
