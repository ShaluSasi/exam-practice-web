<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Same wire and compass with a small current and a large current: the needle deflects more with the larger current</title>
<style>.flow{stroke-dasharray:7 9;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.nd{transform-box:view-box}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.s1{animation:s1 3.5s ease-in-out infinite}.s2{animation:s2 3.5s ease-in-out infinite}@keyframes s1{0%,15%{transform:rotate(0)}35%,80%{transform:rotate(16deg)}100%{transform:rotate(0)}}@keyframes s2{0%,15%{transform:rotate(0)}35%,80%{transform:rotate(50deg)}100%{transform:rotate(0)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
