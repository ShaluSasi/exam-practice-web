<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M25 60L175 60" fill="none" stroke="#C97B2E" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><path d="M70 40L124.6 40.0" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><polygon points="132.2,40.0 121.0,45.0 121.0,35.0" fill="#FF8A1F" stroke="#FF8A1F" stroke-width="1" stroke-linejoin="round"/><circle cx="100" cy="150" r="38" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3"/><g class="nd s1" style="transform-origin:100px 150px;"><g transform="rotate(90 100 150)"><polygon points="93,150 107,150 100,120" fill="#E5484D" stroke="#2B2F4A" stroke-width="2"/><polygon points="93,150 107,150 100,180" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><circle cx="100" cy="150" r="2.5" fill="#2B2F4A"/></g></g><text x="100" y="213" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle">small current</text><text x="100" y="230" font-family="sans-serif" font-size="12" font-weight="600" fill="#5B6178" text-anchor="middle">1 cell</text><path d="M225 60L375 60" fill="none" stroke="#C97B2E" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><path d="M270 40L317.0 40.0" fill="none" stroke="#FF8A1F" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><polygon points="335.4,40.0 308.4,51.9 308.4,28.1" fill="#FF8A1F" stroke="#FF8A1F" stroke-width="1" stroke-linejoin="round"/><circle cx="300" cy="150" r="38" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3"/><g class="nd s2" style="transform-origin:300px 150px;"><g transform="rotate(90 300 150)"><polygon points="293,150 307,150 300,120" fill="#E5484D" stroke="#2B2F4A" stroke-width="2"/><polygon points="293,150 307,150 300,180" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><circle cx="300" cy="150" r="2.5" fill="#2B2F4A"/></g></g><text x="300" y="213" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle">large current</text><text x="300" y="230" font-family="sans-serif" font-size="12" font-weight="600" fill="#5B6178" text-anchor="middle">3 cells</text><path d="M200 20L200 205" fill="none" stroke="#D5D8E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
