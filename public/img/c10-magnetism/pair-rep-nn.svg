<title>Two north poles facing each other push the magnets apart</title>
<style>.flow{stroke-dasharray:7 9;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.nd{transform-box:view-box}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.mv1{animation:m1 2s ease-in-out infinite}.mv2{animation:m2 2s ease-in-out infinite}@keyframes m1{0%,100%{transform:translateX(0)}50%{transform:translateX(-8px)}}@keyframes m2{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
