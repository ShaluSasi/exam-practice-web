<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A compass needle below a current-carrying wire swings away from north</title>
<style>.flow{stroke-dasharray:7 9;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.nd{transform-box:view-box}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.sw{animation:sw 4s ease-in-out infinite}@keyframes sw{0%,20%{transform:rotate(0)}40%,80%{transform:rotate(-50deg)}100%{transform:rotate(0)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><marker id="mn" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2B2F4A"/></marker><marker id="mo" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#FF8A1F"/></marker><marker id="mb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0B93D4"/></marker><marker id="mg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3FA34D"/></marker><marker id="mr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#E5484D"/></marker><marker id="mp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7C5CFF"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M30 60L370 60" fill="none" stroke="#C97B2E" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" /><path d="M30 60L370 60" fill="none" stroke="#FFE2B8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="flow" /><path d="M150 34L244.2 34.0" fill="none" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><polygon points="252.4,34.0 240.4,39.3 240.4,28.7" fill="#FF8A1F" stroke="#FF8A1F" stroke-width="1" stroke-linejoin="round"/><text x="300" y="39" font-family="sans-serif" font-size="13" font-weight="700" fill="#FF8A1F" text-anchor="middle">current I</text><circle cx="200" cy="150" r="48" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3"/><text x="200" y="97" font-family="sans-serif" font-size="12" font-weight="700" fill="#3FA34D" text-anchor="middle">N</text><text x="200" y="212" font-family="sans-serif" font-size="12" font-weight="700" fill="#3FA34D" text-anchor="middle">S</text><g class="nd sw" style="transform-origin:200px 150px;"><polygon points="191,150 209,150 200,112" fill="#E5484D" stroke="#2B2F4A" stroke-width="2"/><polygon points="191,150 209,150 200,188" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><circle cx="200" cy="150" r="2.5" fill="#2B2F4A"/></g><text x="80" y="125" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">copper wire</text><text x="80" y="143" font-family="sans-serif" font-size="12" font-weight="600" fill="#5B6178" text-anchor="middle">(current ON)</text><text x="320" y="150" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle">compass</text><text x="320" y="168" font-family="sans-serif" font-size="12" font-weight="600" fill="#5B6178" text-anchor="middle">needle swings</text>
</svg>
