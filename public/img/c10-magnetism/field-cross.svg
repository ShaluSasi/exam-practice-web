<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Two magnetic field lines crossing, with a compass needle that would have to point in two directions</title>
<style>.flow{stroke-dasharray:7 9;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.nd{transform-box:view-box}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><marker id="mn" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2B2F4A"/></marker><marker id="mo" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#FF8A1F"/></marker><marker id="mb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0B93D4"/></marker><marker id="mg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3FA34D"/></marker><marker id="mr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#E5484D"/></marker><marker id="mp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7C5CFF"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M40 190C140 190 200 120 360 50" fill="none" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M40 50C140 60 220 130 360 190" fill="none" stroke="#7C5CFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="200" cy="120" r="30" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3"/><g class="nd " style="transform-origin:200px 120px;transform:rotate(-30deg);"><polygon points="195,120 205,120 200,98" fill="#E5484D" stroke="#2B2F4A" stroke-width="2"/><polygon points="195,120 205,120 200,142" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><circle cx="200" cy="120" r="2.5" fill="#2B2F4A"/></g><g opacity=".55"><g class="nd " style="transform-origin:200px 120px;transform:rotate(35deg);"><polygon points="195,120 205,120 200,98" fill="#E5484D" stroke="#2B2F4A" stroke-width="2"/><polygon points="195,120 205,120 200,142" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><circle cx="200" cy="120" r="2.5" fill="#2B2F4A"/></g></g><text x="110" y="215" font-family="sans-serif" font-size="13" font-weight="700" fill="#0B93D4" text-anchor="middle">line 1</text><text x="300" y="215" font-family="sans-serif" font-size="13" font-weight="700" fill="#7C5CFF" text-anchor="middle">line 2</text><text x="200" y="30" font-family="sans-serif" font-size="13" font-weight="700" fill="#E5484D" text-anchor="middle">At the crossing the needle would have to point two ways!</text>
</svg>
