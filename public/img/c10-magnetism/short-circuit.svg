<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A live wire touching a neutral wire makes a spark and a very large current</title>
<style>.flow{stroke-dasharray:7 9;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.nd{transform-box:view-box}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.sp{animation:sp .5s steps(2) infinite;transform-box:fill-box;transform-origin:center}@keyframes sp{0%{transform:scale(1) rotate(0)}100%{transform:scale(1.4) rotate(20deg)}}.fs{stroke-dasharray:7 7;animation:fl 0.35s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><marker id="mn" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2B2F4A"/></marker><marker id="mo" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#FF8A1F"/></marker><marker id="mb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0B93D4"/></marker><marker id="mg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3FA34D"/></marker><marker id="mr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#E5484D"/></marker><marker id="mp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7C5CFF"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="20" y="85" width="40" height="70" rx="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3"/><text x="40" y="125" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">220V</text><path d="M60 100L180 100Q200 100 200 120" fill="none" stroke="#E5484D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><path d="M60 140L180 140Q200 140 200 120" fill="none" stroke="#2B2F4A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><path d="M60 100L180 100Q200 100 200 120" fill="none" stroke="#FFC9CB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="fs" /><path d="M60 140L180 140Q200 140 200 120" fill="none" stroke="#9AA0B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="fs" /><path d="M200 120L215 120" fill="none" stroke="#C97B2E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><rect x="300" y="85" width="70" height="70" rx="6" fill="#E8EAF4" stroke="#2B2F4A" stroke-width="3"/><text x="335" y="125" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">appliance</text><path d="M232 100L300 100" fill="none" stroke="#E5484D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><path d="M232 140L300 140" fill="none" stroke="#2B2F4A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><polygon class="sp" points="200,95 208,112 226,108 212,122 224,138 205,130 194,146 192,128 174,122 192,114" fill="#FFD43B" stroke="#FF8A1F" stroke-width="2"/><text x="200" y="45" font-family="sans-serif" font-size="13" font-weight="700" fill="#E5484D" text-anchor="middle">insulation damaged: live touches neutral</text><text x="200" y="65" font-family="sans-serif" font-size="13" font-weight="700" fill="#E5484D" text-anchor="middle">(short circuit)</text><text x="200" y="200" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle">current suddenly becomes very large</text><text x="200" y="220" font-family="sans-serif" font-size="12" font-weight="600" fill="#5B6178" text-anchor="middle">(abrupt increase)</text>
</svg>
