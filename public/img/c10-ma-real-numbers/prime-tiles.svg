<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Coloured prime tiles 2, 3, 5, 7 and 11 as building blocks</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.pp{transform-box:fill-box;transform-origin:center;animation:pp 2.4s ease-in-out infinite}@keyframes pp{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="24" y="80" width="56" height="56" rx="12" fill="#fff" stroke="#0B93D4" stroke-width="4" class="pp" style="animation-delay:0.00s"/><text x="52" y="118" font-size="24" text-anchor="middle" >2</text><rect x="96" y="80" width="56" height="56" rx="12" fill="#fff" stroke="#3FA34D" stroke-width="4" class="pp" style="animation-delay:0.25s"/><text x="124" y="118" font-size="24" text-anchor="middle" >3</text><rect x="168" y="80" width="56" height="56" rx="12" fill="#fff" stroke="#FF8A1F" stroke-width="4" class="pp" style="animation-delay:0.50s"/><text x="196" y="118" font-size="24" text-anchor="middle" >5</text><rect x="240" y="80" width="56" height="56" rx="12" fill="#fff" stroke="#7C5CFF" stroke-width="4" class="pp" style="animation-delay:0.75s"/><text x="268" y="118" font-size="24" text-anchor="middle" >7</text><rect x="312" y="80" width="56" height="56" rx="12" fill="#fff" stroke="#E5484D" stroke-width="4" class="pp" style="animation-delay:1.00s"/><text x="340" y="118" font-size="24" text-anchor="middle" >11</text><text x="200" y="190" font-size="14" text-anchor="middle" fill="#8A8FB0" class="h" >Multiply prime tiles to build any composite number</text></svg>
