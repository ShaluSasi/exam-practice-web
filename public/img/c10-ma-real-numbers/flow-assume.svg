<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Three boxes: assume 6 minus root 5 is a fraction, isolate root 5, and an unknown result</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="40" y="24" width="320" height="44" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="51" font-size="13" text-anchor="middle" >Assume 6 − √5 = a/b, where a and b are integers, b ≠ 0</text><line x1="200" y1="69" x2="200" y2="79" stroke="#8A8FB0" stroke-width="2.5" stroke-linecap="round" /><polygon points="0,0 -9.0,-4.5 -9.0,4.5" fill="#8A8FB0" transform="translate(200 85) rotate(90.0)"/><rect x="40" y="84" width="320" height="44" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="111" font-size="13" text-anchor="middle" >Rearrange the equation to isolate √5</text><line x1="200" y1="129" x2="200" y2="139" stroke="#8A8FB0" stroke-width="2.5" stroke-linecap="round" /><polygon points="0,0 -9.0,-4.5 -9.0,4.5" fill="#8A8FB0" transform="translate(200 145) rotate(90.0)"/><rect x="40" y="144" width="320" height="44" rx="10" fill="#FFE3C2" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="171" font-size="13" text-anchor="middle" >√5 = ?</text></svg>
