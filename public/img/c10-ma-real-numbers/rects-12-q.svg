<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A rectangle 6 by 36 and a rectangle 12 wide whose height is unknown but whose area is the same</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.pu{animation:pu 2s ease-in-out infinite}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="80" y="30" width="30" height="180" rx="3" fill="#CFE9FA" stroke="#0B93D4" stroke-width="3" class="pu"/><rect x="220" y="30" width="60" height="90" rx="3" fill="#FFE3C2" stroke="#FF8A1F" stroke-width="3" class="pu"/><text x="95" y="226" font-size="14" text-anchor="middle" class="h" >6 × 36</text><text x="250" y="144" font-size="14" text-anchor="middle" class="h" >12 × ?</text><text x="165" y="120" font-size="26" text-anchor="middle" >=</text><text x="280" y="200" font-size="13" text-anchor="middle" fill="#8A8FB0" class="h" >same area</text></svg>
