<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Two riders on a circular track starting together; A takes 24 minutes a round and B takes 36</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.ra{transform-box:view-box;transform-origin:200px 120px;animation:sp 2.667s linear infinite}.rb{transform-box:view-box;transform-origin:200px 120px;animation:sp 4.000s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="200" cy="120" r="88" fill="none" stroke="#C8CCE6" stroke-width="12"/><circle cx="200" cy="120" r="64" fill="none" stroke="#C8CCE6" stroke-width="12"/><line x1="200" y1="24" x2="200" y2="66" stroke="#E5484D" stroke-width="3" stroke-linecap="round" /><text x="200" y="18" font-size="13" text-anchor="middle" fill="#E5484D" class="h" >Start</text><g class="ra"><circle cx="200" cy="32" r="9" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5"/></g><g class="rb"><circle cx="200" cy="56" r="9" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5"/></g><circle cx="30" cy="212" r="7" fill="#0B93D4" /><text x="42" y="217" font-size="13" text-anchor="start" class="h" >Rider A: 24 min</text><circle cx="235" cy="212" r="7" fill="#FF8A1F" /><text x="247" y="217" font-size="13" text-anchor="start" class="h" >Rider B: 36 min</text></svg>
