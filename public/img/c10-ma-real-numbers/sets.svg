<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Number sets: natural numbers inside integers inside rational numbers, with irrational numbers in a separate box; sample numbers sit in each region</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<ellipse cx="148" cy="140" rx="140" ry="92" fill="#E3F2FD" stroke="#0B93D4" stroke-width="3"/><ellipse cx="148" cy="140" rx="96" ry="60" fill="#D8F0DA" stroke="#3FA34D" stroke-width="3"/><ellipse cx="148" cy="140" rx="48" ry="28" fill="#FFE3C2" stroke="#FF8A1F" stroke-width="3"/><rect x="292" y="48" width="100" height="184" rx="14" fill="#E4DDFF" stroke="#7C5CFF" stroke-width="3" /><text x="148" y="226" font-size="13" text-anchor="middle" class="h" >Rational numbers</text><text x="148" y="192" font-size="13" text-anchor="middle" class="h" >Integers</text><text x="148" y="130" font-size="12" text-anchor="middle" class="h" >Natural</text><text x="342" y="70" font-size="13" text-anchor="middle" class="h" >Irrational</text><text x="148" y="70" font-size="17" text-anchor="middle" class="h" >3/4</text><text x="148" y="100" font-size="17" text-anchor="middle" class="h" >−4</text><text x="148" y="157" font-size="17" text-anchor="middle" class="h" >7</text><text x="342" y="145" font-size="18" text-anchor="middle" class="h" >√11</text></svg>
