<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="186.7" y="38" font-size="12" text-anchor="middle" class="h" >power of 2</text><text x="260" y="38" font-size="12" text-anchor="middle" class="h" >power of 3</text><text x="333.3" y="38" font-size="12" text-anchor="middle" class="h" >power of 5</text><text x="20" y="79" font-size="17" text-anchor="start" class="h" >36</text><text x="20" y="96" font-size="12" text-anchor="start" fill="#8A8FB0" class="h" >2² × 3²</text><rect x="156" y="57" width="61.3" height="50" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="186.7" y="89" font-size="22" text-anchor="middle" >2</text><rect x="229.3" y="57" width="61.3" height="50" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="260" y="89" font-size="22" text-anchor="middle" >2</text><rect x="302.7" y="57" width="61.3" height="50" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="333.3" y="89" font-size="22" text-anchor="middle" >0</text><text x="20" y="139" font-size="17" text-anchor="start" class="h" >120</text><text x="20" y="156" font-size="12" text-anchor="start" fill="#8A8FB0" class="h" >2³ × 3 × 5</text><rect x="156" y="117" width="61.3" height="50" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="186.7" y="149" font-size="22" text-anchor="middle" >3</text><rect x="229.3" y="117" width="61.3" height="50" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="260" y="149" font-size="22" text-anchor="middle" >1</text><rect x="302.7" y="117" width="61.3" height="50" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="333.3" y="149" font-size="22" text-anchor="middle" >1</text></svg>
