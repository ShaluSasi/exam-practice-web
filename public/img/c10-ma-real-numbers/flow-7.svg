<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Proof steps for the square root of 7 with the result of substitution hidden</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="40" y="8" width="320" height="36" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="31" font-size="13" text-anchor="middle" >Assume √7 = a/b, with a and b coprime</text><line x1="200" y1="45" x2="200" y2="46" stroke="#8A8FB0" stroke-width="2.5" stroke-linecap="round" /><polygon points="0,0 -9.0,-4.5 -9.0,4.5" fill="#8A8FB0" transform="translate(200 52) rotate(90.0)"/><rect x="40" y="51" width="320" height="36" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="74" font-size="13" text-anchor="middle" >Square both sides: 7b² = a²</text><line x1="200" y1="88" x2="200" y2="89" stroke="#8A8FB0" stroke-width="2.5" stroke-linecap="round" /><polygon points="0,0 -9.0,-4.5 -9.0,4.5" fill="#8A8FB0" transform="translate(200 95) rotate(90.0)"/><rect x="40" y="94" width="320" height="36" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="117" font-size="13" text-anchor="middle" >7 divides a², so 7 divides a: a = 7c</text><line x1="200" y1="131" x2="200" y2="132" stroke="#8A8FB0" stroke-width="2.5" stroke-linecap="round" /><polygon points="0,0 -9.0,-4.5 -9.0,4.5" fill="#8A8FB0" transform="translate(200 138) rotate(90.0)"/><rect x="40" y="137" width="320" height="36" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="160" font-size="13" text-anchor="middle" >Substitute a = 7c into 7b² = a²</text><line x1="200" y1="174" x2="200" y2="175" stroke="#8A8FB0" stroke-width="2.5" stroke-linecap="round" /><polygon points="0,0 -9.0,-4.5 -9.0,4.5" fill="#8A8FB0" transform="translate(200 181) rotate(90.0)"/><rect x="40" y="180" width="320" height="36" rx="10" fill="#FFE3C2" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="203" font-size="13" text-anchor="middle" >The new equation is then simplified to give  ?</text></svg>
