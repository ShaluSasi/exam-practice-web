<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>The expression 2 times 3 times 5 times 7 plus 7, with the factor 7 appearing in both parts</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="30" y="60" width="50" height="50" rx="10" fill="#fff" stroke="#0B93D4" stroke-width="3.5" /><text x="55" y="93" font-size="22" text-anchor="middle" >2</text><text x="87" y="90" font-size="18" text-anchor="middle" >×</text><rect x="95" y="60" width="50" height="50" rx="10" fill="#fff" stroke="#3FA34D" stroke-width="3.5" /><text x="120" y="93" font-size="22" text-anchor="middle" >3</text><text x="152" y="90" font-size="18" text-anchor="middle" >×</text><rect x="160" y="60" width="50" height="50" rx="10" fill="#fff" stroke="#7C5CFF" stroke-width="3.5" /><text x="185" y="93" font-size="22" text-anchor="middle" >5</text><text x="217" y="90" font-size="18" text-anchor="middle" >×</text><rect x="225" y="60" width="50" height="50" rx="10" fill="#fff" stroke="#FF8A1F" stroke-width="3.5" /><text x="250" y="93" font-size="22" text-anchor="middle" >7</text><text x="285" y="90" font-size="24" text-anchor="middle" >+</text><rect x="310" y="60" width="50" height="50" rx="10" fill="#FFE3C2" stroke="#FF8A1F" stroke-width="3.5" class="pu"/><text x="335" y="93" font-size="22" text-anchor="middle" >7</text><path d="M225 124q-5 22 25 22t0 0" fill="none"/><line x1="250" y1="118" x2="250" y2="140" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 3" /><line x1="335" y1="118" x2="335" y2="140" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 3" /><line x1="250" y1="140" x2="335" y2="140" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 3" /><text x="292" y="162" font-size="13" text-anchor="middle" fill="#FF8A1F" class="h" >one number appears in both parts</text><text x="200" y="210" font-size="14" text-anchor="middle" class="h" >Can the whole expression be split into factors?</text></svg>
