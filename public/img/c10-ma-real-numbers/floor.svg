<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A rectangular floor 504 cm long and 360 cm wide, with a square tile shown beside it</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="40" y="20" width="252" height="180" rx="4" fill="#F4E7D0" stroke="#2B2F4A" stroke-width="3.5" /><text x="166" y="222" font-size="14" text-anchor="middle" class="h" >504 cm</text><text x="335" y="108" font-size="14" text-anchor="middle" class="h" >360 cm</text><rect x="320" y="140" width="44" height="44" rx="3" fill="#CFE9FA" stroke="#0B93D4" stroke-width="3.5" class="pu"/><text x="342" y="205" font-size="12" text-anchor="middle" class="h" >square tile</text><text x="166" y="116" font-size="15" text-anchor="middle" class="h" >Floor to be tiled</text></svg>
