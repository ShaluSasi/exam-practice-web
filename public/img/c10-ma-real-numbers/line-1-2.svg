<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A number line from 1 to 2 with ticks every quarter</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<line x1="32" y1="130" x2="358" y2="130" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><polygon points="0,0 -9.0,-4.5 -9.0,4.5" fill="#2B2F4A" transform="translate(362 130) rotate(0.0)"/><line x1="40" y1="124" x2="40" y2="136" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><text x="40" y="154" font-size="13" text-anchor="middle" class="h" >1</text><line x1="104.6" y1="124" x2="104.6" y2="136" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><line x1="169.2" y1="124" x2="169.2" y2="136" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><text x="169.2" y="154" font-size="13" text-anchor="middle" class="h" >1.5</text><line x1="233.8" y1="124" x2="233.8" y2="136" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><line x1="298.3" y1="124" x2="298.3" y2="136" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><text x="298.3" y="154" font-size="13" text-anchor="middle" class="h" >2</text><text x="200" y="60" font-size="13" text-anchor="middle" fill="#8A8FB0" class="h" >Place each number on this line, then read left to right</text></svg>
