<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A road ending at a wall marked contradiction, with a U-turn arrow back to the start</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.dr{stroke-dasharray:10 8;animation:dr 1s linear infinite}@keyframes dr{to{stroke-dashoffset:-18}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<line x1="30" y1="170" x2="236" y2="170" stroke="#2B2F4A" stroke-width="14" stroke-linecap="round" /><line x1="30" y1="170" x2="236" y2="170" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8" class="dr"/><rect x="246" y="110" width="22" height="80" rx="2" fill="#C8CCE6" stroke="#2B2F4A" stroke-width="3" /><text x="257" y="100" font-size="13" text-anchor="middle" class="h" >Wall</text><path d="M226 148Q226 78 150 78L60 78" fill="none" stroke="#E5484D" stroke-width="4" stroke-linecap="round"/><polygon points="0,0 -10.799999999999999,-5.3999999999999995 -10.799999999999999,5.3999999999999995" fill="#E5484D" transform="translate(56 78) rotate(180.0)"/><text x="30" y="205" font-size="13" text-anchor="start" class="h" >Start: assume the opposite</text><text x="130" y="62" font-size="13" text-anchor="middle" fill="#E5484D" class="h" >so the assumption must be false</text><circle cx="40" cy="170" r="9" fill="#FF8A1F" /></svg>
