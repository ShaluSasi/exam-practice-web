<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Table of the powers of 2, 3 and 5 in 72 and 90</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="186.7" y="56" font-size="12" text-anchor="middle" class="h" >power of 2</text><text x="260" y="56" font-size="12" text-anchor="middle" class="h" >power of 3</text><text x="333.3" y="56" font-size="12" text-anchor="middle" class="h" >power of 5</text><text x="20" y="102" font-size="17" text-anchor="start" class="h" >72</text><text x="20" y="119" font-size="12" text-anchor="start" fill="#8A8FB0" class="h" >2³ × 3²</text><rect x="156" y="75" width="61.3" height="60" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="186.7" y="112" font-size="22" text-anchor="middle" >3</text><rect x="229.3" y="75" width="61.3" height="60" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="260" y="112" font-size="22" text-anchor="middle" >2</text><rect x="302.7" y="75" width="61.3" height="60" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="333.3" y="112" font-size="22" text-anchor="middle" >0</text><text x="20" y="172" font-size="17" text-anchor="start" class="h" >90</text><text x="20" y="189" font-size="12" text-anchor="start" fill="#8A8FB0" class="h" >2 × 3² × 5</text><rect x="156" y="145" width="61.3" height="60" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="186.7" y="182" font-size="22" text-anchor="middle" >1</text><rect x="229.3" y="145" width="61.3" height="60" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="260" y="182" font-size="22" text-anchor="middle" >2</text><rect x="302.7" y="145" width="61.3" height="60" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="333.3" y="182" font-size="22" text-anchor="middle" >1</text></svg>
