<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A right triangle with legs 2 and 1 whose hypotenuse is swung down onto the number line</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.sw{stroke-dasharray:90;animation:sw 3s ease-in-out infinite}@keyframes sw{0%{stroke-dashoffset:90}60%,100%{stroke-dashoffset:0}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<line x1="32" y1="190" x2="368" y2="190" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><polygon points="0,0 -9.0,-4.5 -9.0,4.5" fill="#2B2F4A" transform="translate(372 190) rotate(0.0)"/><line x1="40" y1="184" x2="40" y2="196" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><text x="40" y="214" font-size="13" text-anchor="middle" class="h" >0</text><line x1="120" y1="184" x2="120" y2="196" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><text x="120" y="214" font-size="13" text-anchor="middle" class="h" >1</text><line x1="200" y1="184" x2="200" y2="196" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><text x="200" y="214" font-size="13" text-anchor="middle" class="h" >2</text><line x1="280" y1="184" x2="280" y2="196" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><text x="280" y="214" font-size="13" text-anchor="middle" class="h" >3</text><line x1="360" y1="184" x2="360" y2="196" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><text x="360" y="214" font-size="13" text-anchor="middle" class="h" >4</text><polygon points="40,190 200,190 200,110" fill="#FFE3C2" fill-opacity=".7" stroke="#2B2F4A" stroke-width="3"/><path d="M190 190L190 180L200 180" fill="none" stroke="#2B2F4A" stroke-width="2"/><path d="M200 110A178.9 178.9 0 0 1 218.9 190" fill="none" stroke="#E5484D" stroke-width="3" class="sw"/><text x="214" y="154" font-size="14" text-anchor="middle" class="h" >1</text></svg>
