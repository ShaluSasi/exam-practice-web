<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A bar of 23 units cut into blocks of 6 with a piece left over, and a reference block of 6 above</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.pp{transform-box:fill-box;transform-origin:center;animation:pp 2.4s ease-in-out infinite}@keyframes pp{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="30" y="34" width="85" height="30" rx="6" fill="#CFE9FA" stroke="#0B93D4" stroke-width="3" /><text x="72.5" y="54" font-size="14" text-anchor="middle" >b = 6</text><rect x="30" y="104" width="85" height="44" rx="6" fill="#CFE9FA" stroke="#0B93D4" stroke-width="3" class="pp" style="animation-delay:0.0s"/><rect x="115" y="104" width="85" height="44" rx="6" fill="#CFE9FA" stroke="#0B93D4" stroke-width="3" class="pp" style="animation-delay:0.3s"/><rect x="200" y="104" width="85" height="44" rx="6" fill="#CFE9FA" stroke="#0B93D4" stroke-width="3" class="pp" style="animation-delay:0.6s"/><rect x="285" y="104" width="85" height="44" rx="6" fill="none" stroke="#8A8FB0" stroke-width="2" stroke-dasharray="5 4"/><rect x="285" y="104" width="70.8" height="44" rx="6" fill="#FFE3C2" stroke="#FF8A1F" stroke-width="3" /><line x1="30" y1="168" x2="355.8" y2="168" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="30" y1="162" x2="30" y2="174" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="355.8" y1="162" x2="355.8" y2="174" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="192.9" y="192" font-size="15" text-anchor="middle" class="h" >a = 23</text></svg>
