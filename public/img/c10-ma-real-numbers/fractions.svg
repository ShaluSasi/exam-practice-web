<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Fractions 3 over 8, 7 over 16, 1 over 3 and 1 over 6 with their decimal forms</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="20" y="40" width="84" height="150" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="62" y="82" font-size="22" text-anchor="middle" >3</text><line x1="40" y1="96" x2="84" y2="96" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="62" y="126" font-size="22" text-anchor="middle" >8</text><text x="62" y="170" font-size="13" text-anchor="middle" fill="#FF8A1F" >0.375</text><rect x="115" y="40" width="84" height="150" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="157" y="82" font-size="22" text-anchor="middle" >7</text><line x1="135" y1="96" x2="179" y2="96" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="157" y="126" font-size="22" text-anchor="middle" >16</text><text x="157" y="170" font-size="13" text-anchor="middle" fill="#FF8A1F" >0.4375</text><rect x="210" y="40" width="84" height="150" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="252" y="82" font-size="22" text-anchor="middle" >1</text><line x1="230" y1="96" x2="274" y2="96" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="252" y="126" font-size="22" text-anchor="middle" >3</text><text x="252" y="170" font-size="13" text-anchor="middle" fill="#FF8A1F" >0.3333…</text><rect x="305" y="40" width="84" height="150" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="347" y="82" font-size="22" text-anchor="middle" >1</text><line x1="325" y1="96" x2="369" y2="96" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="347" y="126" font-size="22" text-anchor="middle" >6</text><text x="347" y="170" font-size="13" text-anchor="middle" fill="#FF8A1F" >0.16666…</text></svg>
