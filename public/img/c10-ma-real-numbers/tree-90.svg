<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<line x1="200" y1="51" x2="115" y2="91" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><line x1="200" y1="51" x2="285" y2="91" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><line x1="115" y1="121" x2="72.5" y2="161" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><line x1="115" y1="121" x2="157.5" y2="161" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><line x1="285" y1="121" x2="242.5" y2="161" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><line x1="285" y1="121" x2="327.5" y2="161" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><circle cx="200" cy="36" r="17" fill="#fff" stroke="#2B2F4A" stroke-width="3"/><text x="200" y="41" font-size="15" text-anchor="middle" >90</text><circle cx="115" cy="106" r="17" fill="#fff" stroke="#2B2F4A" stroke-width="3"/><text x="115" y="111" font-size="15" text-anchor="middle" >9</text><circle cx="72.5" cy="176" r="17" fill="#D8F0DA" stroke="#3FA34D" stroke-width="3"/><text x="72.5" y="181" font-size="15" text-anchor="middle" >3</text><circle cx="157.5" cy="176" r="17" fill="#D8F0DA" stroke="#3FA34D" stroke-width="3"/><text x="157.5" y="181" font-size="15" text-anchor="middle" >3</text><circle cx="285" cy="106" r="17" fill="#fff" stroke="#2B2F4A" stroke-width="3"/><text x="285" y="111" font-size="15" text-anchor="middle" >10</text><circle cx="242.5" cy="176" r="17" fill="#D8F0DA" stroke="#3FA34D" stroke-width="3"/><text x="242.5" y="181" font-size="15" text-anchor="middle" >2</text><circle cx="327.5" cy="176" r="17" fill="#D8F0DA" stroke="#3FA34D" stroke-width="3"/><text x="327.5" y="181" font-size="15" text-anchor="middle" >5</text></svg>
