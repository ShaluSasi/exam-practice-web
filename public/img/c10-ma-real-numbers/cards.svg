<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Six number cards: 1, 2, 4, 9, 15 and 21</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.pp{transform-box:fill-box;transform-origin:center;animation:pp 2.4s ease-in-out infinite}@keyframes pp{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="50" y="32" width="80" height="76" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="3.5" class="pp" style="animation-delay:0.0s"/><text x="90" y="80" font-size="30" text-anchor="middle" >1</text><rect x="160" y="32" width="80" height="76" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="3.5" class="pp" style="animation-delay:0.3s"/><text x="200" y="80" font-size="30" text-anchor="middle" >2</text><rect x="270" y="32" width="80" height="76" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="3.5" class="pp" style="animation-delay:0.6s"/><text x="310" y="80" font-size="30" text-anchor="middle" >4</text><rect x="50" y="132" width="80" height="76" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="3.5" class="pp" style="animation-delay:0.9s"/><text x="90" y="180" font-size="30" text-anchor="middle" >9</text><rect x="160" y="132" width="80" height="76" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="3.5" class="pp" style="animation-delay:1.2s"/><text x="200" y="180" font-size="30" text-anchor="middle" >15</text><rect x="270" y="132" width="80" height="76" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="3.5" class="pp" style="animation-delay:1.5s"/><text x="310" y="180" font-size="30" text-anchor="middle" >21</text></svg>
