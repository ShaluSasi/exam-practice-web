<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Three overlapping circles for 4, 6 and 10 with the HCF of each pair in the overlaps and 2 in the middle</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="150" cy="92" r="56" fill="#0B93D4" fill-opacity=".18" stroke="#0B93D4" stroke-width="3"/><circle cx="250" cy="92" r="56" fill="#3FA34D" fill-opacity=".18" stroke="#3FA34D" stroke-width="3"/><circle cx="200" cy="168" r="56" fill="#FF8A1F" fill-opacity=".18" stroke="#FF8A1F" stroke-width="3"/><text x="123.2" y="84.4" font-size="20" text-anchor="middle" class="h" >4</text><text x="276.8" y="84.4" font-size="20" text-anchor="middle" class="h" >6</text><text x="200" y="204" font-size="20" text-anchor="middle" class="h" >10</text><text x="200" y="85.6" font-size="16" text-anchor="middle" class="h" >2</text><text x="236.2" y="140.7" font-size="16" text-anchor="middle" class="h" >2</text><text x="163.8" y="140.7" font-size="16" text-anchor="middle" class="h" >2</text><text x="200" y="122.3" font-size="16" text-anchor="middle" class="h" >2</text><text x="60" y="230" font-size="12" text-anchor="start" fill="#8A8FB0" class="h" >Overlaps show HCFs</text></svg>
