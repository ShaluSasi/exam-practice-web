<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<line x1="32" y1="150" x2="348" y2="150" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><polygon points="0,0 -9.0,-4.5 -9.0,4.5" fill="#2B2F4A" transform="translate(352 150) rotate(0.0)"/><line x1="40" y1="144" x2="40" y2="156" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><text x="40" y="174" font-size="13" text-anchor="middle" class="h" >0</text><line x1="106.7" y1="144" x2="106.7" y2="156" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><text x="106.7" y="174" font-size="13" text-anchor="middle" class="h" >1</text><line x1="173.3" y1="144" x2="173.3" y2="156" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><text x="173.3" y="174" font-size="13" text-anchor="middle" class="h" >2</text><line x1="240" y1="144" x2="240" y2="156" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><text x="240" y="174" font-size="13" text-anchor="middle" class="h" >3</text><line x1="306.7" y1="144" x2="306.7" y2="156" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><text x="306.7" y="174" font-size="13" text-anchor="middle" class="h" >4</text><circle cx="57.9" cy="150" r="8" fill="#FF8A1F" /><circle cx="288.8" cy="150" r="8" fill="#FF8A1F" /><circle cx="173.3" cy="150" r="6" fill="#3FA34D" /><path d="M173.3 130Q115.6 80 57.9 130" fill="none" stroke="#7C5CFF" stroke-width="3"/><text x="115.6" y="88" font-size="15" text-anchor="middle" class="h" >√3</text><path d="M173.3 130Q231.1 80 288.8 130" fill="none" stroke="#7C5CFF" stroke-width="3"/><text x="231.1" y="88" font-size="15" text-anchor="middle" class="h" >√3</text><text x="57.9" y="203" font-size="13" text-anchor="middle" fill="#FF8A1F" class="h" >2 − √3</text><text x="288.8" y="203" font-size="13" text-anchor="middle" fill="#FF8A1F" class="h" >2 + √3</text></svg>
