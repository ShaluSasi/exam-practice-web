<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Decimal forms: some end, some repeat, and square roots of non-squares never end and never repeat</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="14" y="26" width="372" height="40" rx="10" fill="#fff" stroke="#3FA34D" stroke-width="2.5" /><text x="30" y="53" font-size="16" text-anchor="start" >1/8 = 0.125</text><text x="375" y="53" font-size="12" text-anchor="end" fill="#3FA34D" >ends</text><rect x="14" y="74" width="372" height="40" rx="10" fill="#fff" stroke="#0B93D4" stroke-width="2.5" /><text x="30" y="101" font-size="16" text-anchor="start" >1/3 = 0.333333…</text><text x="375" y="101" font-size="12" text-anchor="end" fill="#0B93D4" >repeats</text><rect x="14" y="122" width="372" height="40" rx="10" fill="#fff" stroke="#E5484D" stroke-width="2.5" /><text x="30" y="149" font-size="16" text-anchor="start" >√2 = 1.41421356…</text><text x="375" y="149" font-size="12" text-anchor="end" fill="#E5484D" >never ends, never repeats</text><rect x="14" y="170" width="372" height="40" rx="10" fill="#fff" stroke="#E5484D" stroke-width="2.5" /><text x="30" y="197" font-size="16" text-anchor="start" >0.10110111011110…</text><text x="375" y="197" font-size="12" text-anchor="end" fill="#E5484D" >never ends, never repeats</text></svg>
