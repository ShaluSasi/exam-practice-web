<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Prime factors of the bases 4, 6, 15, 20 and 10 shown as coloured bubbles</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="40" y="40" font-size="22" text-anchor="middle" class="h" >4</text><circle cx="40" cy="80" r="15" fill="#0B93D4" /><text x="40" y="86" font-size="15" text-anchor="middle" fill="#fff" >2</text><text x="118" y="40" font-size="22" text-anchor="middle" class="h" >6</text><circle cx="118" cy="80" r="15" fill="#0B93D4" /><text x="118" y="86" font-size="15" text-anchor="middle" fill="#fff" >2</text><circle cx="118" cy="118" r="15" fill="#3FA34D" /><text x="118" y="124" font-size="15" text-anchor="middle" fill="#fff" >3</text><text x="196" y="40" font-size="22" text-anchor="middle" class="h" >15</text><circle cx="196" cy="80" r="15" fill="#3FA34D" /><text x="196" y="86" font-size="15" text-anchor="middle" fill="#fff" >3</text><circle cx="196" cy="118" r="15" fill="#FF8A1F" /><text x="196" y="124" font-size="15" text-anchor="middle" fill="#fff" >5</text><text x="274" y="40" font-size="22" text-anchor="middle" class="h" >20</text><circle cx="274" cy="80" r="15" fill="#0B93D4" /><text x="274" y="86" font-size="15" text-anchor="middle" fill="#fff" >2</text><circle cx="274" cy="118" r="15" fill="#FF8A1F" /><text x="274" y="124" font-size="15" text-anchor="middle" fill="#fff" >5</text><text x="352" y="40" font-size="22" text-anchor="middle" class="h" >10</text><circle cx="352" cy="80" r="15" fill="#0B93D4" /><text x="352" y="86" font-size="15" text-anchor="middle" fill="#fff" >2</text><circle cx="352" cy="118" r="15" fill="#FF8A1F" /><text x="352" y="124" font-size="15" text-anchor="middle" fill="#fff" >5</text><text x="200" y="200" font-size="13" text-anchor="middle" fill="#8A8FB0" class="h" >A number ends with 0 only if both 2 and 5 divide it</text></svg>
