<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A leaf in a test tube of alcohol standing in a beaker of hot water over a flame so the green colour is removed</title><style>.fm{animation:fm 0.6s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@keyframes fm{50%{transform:scaleY(1.2)}}.bu0{animation:bu0 2.4s linear 0.0s infinite}@keyframes bu0{0.0%{transform:translate(0px,0px);opacity:0}8%{opacity:1}49.8%{transform:translate(-5px,-40px)}92%{opacity:1}100.0%{transform:translate(2px,-80px);opacity:0}}.bu1{animation:bu1 2.4s linear -0.7999999999999999s infinite}@keyframes bu1{0.0%{transform:translate(0px,0px);opacity:0}8%{opacity:1}49.8%{transform:translate(-5px,-40px)}92%{opacity:1}100.0%{transform:translate(2px,-80px);opacity:0}}.bu2{animation:bu2 2.4s linear -1.5999999999999999s infinite}@keyframes bu2{0.0%{transform:translate(0px,0px);opacity:0}8%{opacity:1}49.8%{transform:translate(-5px,-40px)}92%{opacity:1}100.0%{transform:translate(2px,-80px);opacity:0}}
