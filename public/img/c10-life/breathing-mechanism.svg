<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Ribs lifting and the diaphragm flattening so the chest cavity enlarges and air is drawn into the lungs</title><style>.rb{animation:rb 4s ease-in-out infinite}@keyframes rb{50%{transform:translateY(-8px)}}.lg{animation:lg 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes lg{50%{transform:scale(1.14)}}.df{animation:df 4s ease-in-out infinite}@keyframes df{50%{transform:translateY(16px)}}.ai0{animation:ai0 4s linear 0.0s infinite}@keyframes ai0{0.0%{transform:translate(0px,0px);opacity:0}8%{opacity:1}46.8%{transform:translate(0px,44px)}92%{opacity:1}100.0%{transform:translate(-30px,84px);opacity:0}}.ai1{animation:ai1 4s linear -1.3333333333333333s infinite}@keyframes ai1{0.0%{transform:translate(0px,0px);opacity:0}8%{opacity:1}46.8%{transform:translate(0px,44px)}92%{opacity:1}100.0%{transform:translate(-30px,84px);opacity:0}}.ai2{animation:ai2 4s linear -2.6666666666666665s infinite}@keyframes ai2{0.0%{transform:translate(0px,0px);opacity:0}8%{opacity:1}46.8%{transform:translate(0px,44px)}92%{opacity:1}100.0%{transform:translate(-30px,84px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="10" y="10" width="380" height="220" rx="12" fill="#FFFFFF" stroke="#E0E3F2" stroke-width="2" /><path d="M130 40 V150 Q130 190 200 190 Q270 190 270 150 V40" fill="none" stroke="#A3A8CC" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><g class="rb"><path d="M200 60 Q140 54 130 74 M200 60 Q260 54 270 74" fill="none" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round"/></g><g class="rb"><path d="M200 85 Q140 79 130 99 M200 85 Q260 79 270 99" fill="none" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round"/></g><g class="rb"><path d="M200 110 Q140 104 130 124 M200 110 Q260 104 270 124" fill="none" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round"/></g><ellipse cx="165" cy="100" rx="28" ry="45" fill="#F7B6B6" stroke="#2B2F4A" stroke-width="3" class="lg"/><ellipse cx="235" cy="100" rx="28" ry="45" fill="#F7B6B6" stroke="#2B2F4A" stroke-width="3" class="lg"/><path d="M120 168 Q200 140 280 168" fill="#E8C46A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="df"/><circle class="ai0" cx="200" cy="16" r="4.5" fill="#6EC1EA" stroke="#2B2F4A" stroke-width="1.5"/><circle class="ai1" cx="200" cy="16" r="4.5" fill="#6EC1EA" stroke="#2B2F4A" stroke-width="1.5"/><circle class="ai2" cx="200" cy="16" r="4.5" fill="#6EC1EA" stroke="#2B2F4A" stroke-width="1.5"/><text x="330" y="70" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2B2F4A">ribs move up</text><text x="335" y="176" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2B2F4A">diaphragm</text><text x="335" y="191" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2B2F4A">flattens</text><text x="70" y="60" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2A7AB0">breathing in</text></svg>