<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Sugar made in a leaf loaded into the phloem using energy and carried to a growing bud or root</title><style>.ph0{animation:ph0 4s linear 0.0s infinite}@keyframes ph0{0.0%{transform:translate(0px,0px);opacity:0}8%{opacity:1}18.9%{transform:translate(0px,40px)}90.9%{transform:translate(152px,40px)}92%{opacity:1}100.0%{transform:translate(159px,58px);opacity:0}}.ph1{animation:ph1 4s linear -1.0s infinite}@keyframes ph1{0.0%{transform:translate(0px,0px);opacity:0}8%{opacity:1}18.9%{transform:translate(0px,40px)}90.9%{transform:translate(152px,40px)}92%{opacity:1}100.0%{transform:translate(159px,58px);opacity:0}}.ph2{animation:ph2 4s linear -2.0s infinite}@keyframes ph2{0.0%{transform:translate(0px,0px);opacity:0}8%{opacity:1}18.9%{transform:translate(0px,40px)}90.9%{transform:translate(152px,40px)}92%{opacity:1}100.0%{transform:translate(159px,58px);opacity:0}}.ph3{animation:ph3 4s linear -3.0s infinite}@keyframes ph3{0.0%{transform:translate(0px,0px);opacity:0}8%{opacity:1}18.9%{transform:translate(0px,40px)}90.9%{transform:translate(152px,40px)}92%{opacity:1}100.0%{transform:translate(159px,58px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="10" y="10" width="380" height="220" rx="14" fill="#E3F2FD" stroke="none" stroke-width="0" /><path d="M70 80 Q40 60 60 40 Q100 30 120 70 Q100 100 70 80 Z" fill="#5CB85C" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="70" y="25" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#2B2F4A">leaf (makes sugar)</text><rect x="95" y="80" width="16" height="110" rx="6" fill="#FFE0B0" stroke="#2B2F4A" stroke-width="3" /><path d="M240 150 Q270 120 300 150 Q270 190 240 150 Z" fill="#E8C46A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="270" y="205" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#2B2F4A">growing bud / root</text><path d="M111 130 H255 V148" fill="none" stroke="#FFE0B0" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" /><path d="M111 130 H255 V148" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".25"/><text x="130" y="224" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#B8433F">ATP (energy) used to load sugar</text><circle class="ph0" cx="103" cy="90" r="5" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.5"/><circle class="ph1" cx="103" cy="90" r="5" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.5"/><circle class="ph2" cx="103" cy="90" r="5" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.5"/><circle class="ph3" cx="103" cy="90" r="5" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.5"/><text x="240" y="60" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#2B2F4A">water enters,</text><text x="240" y="76" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#2B2F4A">pressure rises,</text><text x="240" y="92" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#2B2F4A">sugar moves on</text></svg>