<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Flow chart: glucose to pyruvate in the cytoplasm, then ethanol and carbon dioxide, lactic acid, or carbon dioxide and water</title><style>.g10{animation:g10 1.8s linear 0.0s infinite}@keyframes g10{0.0%{transform:translate(0px,0px);opacity:0}8%{opacity:1}92%{opacity:1}100.0%{transform:translate(0px,28px);opacity:0}}.g11{animation:g11 1.8s linear -0.9s infinite}@keyframes g11{0.0%{transform:translate(0px,0px);opacity:0}8%{opacity:1}92%{opacity:1}100.0%{transform:translate(0px,28px);opacity:0}}.g20{animation:g20 2.2s linear 0.0s infinite}@keyframes g20{0.0%{transform:translate(0px,0px);opacity:0}8%{opacity:1}92%{opacity:1}100.0%{transform:translate(125px,26px);opacity:0}}.g21{animation:g21 2.2s linear -1.1s infinite}@keyframes g21{0.0%{transform:translate(0px,0px);opacity:0}8%{opacity:1}92%{opacity:1}100.0%{transform:translate(125px,26px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="150" y="16" width="100" height="36" rx="10" fill="#FFE9A8" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="32" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2B2F4A">Glucose</text><text x="200" y="46" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#2B2F4A">6-carbon</text><line x1="200" y1="52" x2="200.0" y2="74.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><polygon points="200,78 196.2,71.0 203.8,71.0" fill="#2B2F4A"/><text x="268" y="70" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#2B2F4A">in cytoplasm</text><rect x="150" y="80" width="100" height="36" rx="10" fill="#FFD0A0" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="96" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2B2F4A">Pyruvate</text><text x="200" y="110" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#2B2F4A">3-carbon</text><line x1="200" y1="116" x2="78.91618212349618" y2="141.1854341183128" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><polygon points="75,142 81.1,136.8 82.7,144.3" fill="#2B2F4A"/><rect x="15" y="144" width="120" height="52" rx="10" fill="#D6ECFA" stroke="#2B2F4A" stroke-width="3" /><text x="75" y="166" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2B2F4A">Ethanol + CO2</text><text x="75" y="184" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#4A4F7A">yeast, no oxygen</text><line x1="200" y1="116" x2="200.0" y2="138.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><polygon points="200,142 196.2,135.0 203.8,135.0" fill="#2B2F4A"/><rect x="140" y="144" width="120" height="52" rx="10" fill="#FAD4D2" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="166" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2B2F4A">Lactic acid</text><text x="200" y="184" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#4A4F7A">muscle, little oxygen</text><line x1="200" y1="116" x2="321.0838178765038" y2="141.1854341183128" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><polygon points="325,142 317.3,144.3 318.9,136.8" fill="#2B2F4A"/><rect x="265" y="144" width="120" height="52" rx="10" fill="#CDEFC8" stroke="#2B2F4A" stroke-width="3" /><text x="325" y="166" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2B2F4A">CO2 + water</text><text x="325" y="184" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#4A4F7A">mitochondria, oxygen</text><text x="75" y="216" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#B8433F">anaerobic</text><text x="200" y="216" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#B8433F">anaerobic</text><text x="325" y="216" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#2A7A35">aerobic: much more energy</text><circle class="g10" cx="200" cy="52" r="4" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.5"/><circle class="g11" cx="200" cy="52" r="4" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.5"/><circle class="g20" cx="200" cy="116" r="4" fill="#3FA34D" stroke="#2B2F4A" stroke-width="1.5"/><circle class="g21" cx="200" cy="116" r="4" fill="#3FA34D" stroke="#2B2F4A" stroke-width="1.5"/></svg>