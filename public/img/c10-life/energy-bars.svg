<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A tall bar for the energy released in aerobic respiration and a short bar for anaerobic respiration</title><style>.bar{animation:bar 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@keyframes bar{0%{transform:scaleY(.2)}40%,100%{transform:scaleY(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="10" y="10" width="380" height="220" rx="12" fill="#FFFFFF" stroke="#E0E3F2" stroke-width="2" /><line x1="60" y1="190" x2="360" y2="190" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="60" y1="30" x2="60" y2="190" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><rect x="110" y="50" width="90" height="140" rx="6" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" class="bar"/><rect x="240" y="160" width="90" height="30" rx="6" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" /><text x="155" y="210" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2B2F4A">Aerobic</text><text x="285" y="210" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2B2F4A">Anaerobic</text><text x="30" y="115" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2B2F4A">Energy</text><text x="155" y="42" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2A7A35">much more</text><text x="285" y="152" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#C2610A">less</text></svg>