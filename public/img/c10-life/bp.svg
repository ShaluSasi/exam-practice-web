<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A cuff on the arm connected to a pressure gauge whose needle swings up to the normal reading</title><style>.nd{animation:nd 4s ease-in-out infinite;transform-box:view-box;transform-origin:240px 95px}@keyframes nd{0%{transform:rotate(-110deg)}45%,60%{transform:rotate(35deg)}100%{transform:rotate(-110deg)}}
