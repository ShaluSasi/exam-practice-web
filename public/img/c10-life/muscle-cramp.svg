<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A working muscle where lack of oxygen makes pyruvate turn into lactic acid that builds up</title><style>.mu{animation:mu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes mu{50%{transform:scaleY(1.18)}}.lc0{animation:lc0 2.8s linear 0.0s infinite}@keyframes lc0{0.0%{transform:translate(0px,0px);opacity:0}8%{opacity:1}41.9%{transform:translate(10px,-20px)}92%{opacity:1}100.0%{transform:translate(18px,-50px);opacity:0}}.lc1{animation:lc1 2.8s linear -0.7s infinite}@keyframes lc1{0.0%{transform:translate(0px,0px);opacity:0}8%{opacity:1}41.9%{transform:translate(10px,-20px)}92%{opacity:1}100.0%{transform:translate(18px,-50px);opacity:0}}.lc2{animation:lc2 2.8s linear -1.4s infinite}@keyframes lc2{0.0%{transform:translate(0px,0px);opacity:0}8%{opacity:1}41.9%{transform:translate(10px,-20px)}92%{opacity:1}100.0%{transform:translate(18px,-50px);opacity:0}}.lc3{animation:lc3 2.8s linear -2.0999999999999996s infinite}@keyframes lc3{0.0%{transform:translate(0px,0px);opacity:0}8%{opacity:1}41.9%{transform:translate(10px,-20px)}92%{opacity:1}100.0%{transform:translate(18px,-50px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="10" y="10" width="380" height="220" rx="12" fill="#FFFFFF" stroke="#E0E3F2" stroke-width="2" /><path d="M40 140 Q110 60 200 110 Q300 70 360 120 Q300 170 200 160 Q110 190 40 140 Z" fill="#E8957F" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" class="mu"/><circle class="lc0" cx="150" cy="150" r="4.5" fill="#FF6FA5" stroke="#2B2F4A" stroke-width="1.5"/><circle class="lc1" cx="150" cy="150" r="4.5" fill="#FF6FA5" stroke="#2B2F4A" stroke-width="1.5"/><circle class="lc2" cx="150" cy="150" r="4.5" fill="#FF6FA5" stroke="#2B2F4A" stroke-width="1.5"/><circle class="lc3" cx="150" cy="150" r="4.5" fill="#FF6FA5" stroke="#2B2F4A" stroke-width="1.5"/><text x="200" y="40" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2B2F4A">Sudden hard activity: little oxygen reaches the muscle</text><text x="200" y="205" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#C2185B">glucose  →  pyruvate  →  lactic acid (builds up)</text></svg>