<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Four life processes around a wheel: nutrition, respiration, transportation and excretion</title><style>.sp{animation:sp 8s linear infinite;transform-box:view-box;transform-origin:200px 120px}@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><g class="sp"><circle cx="200" cy="120" r="78" fill="none" stroke="#FF8A1F" stroke-width="4" stroke-dasharray="10 12"/></g><circle cx="200" cy="120" r="48" fill="#FFE9C9" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="116" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2B2F4A">LIFE</text><text x="200" y="132" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2B2F4A">PROCESSES</text><rect x="142" y="16" width="116" height="36" rx="12" fill="#CDEFC8" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="39" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2B2F4A">Nutrition</text><rect x="272" y="102" width="116" height="36" rx="12" fill="#D6ECFA" stroke="#2B2F4A" stroke-width="3" /><text x="330" y="125" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2B2F4A">Respiration</text><rect x="142" y="188" width="116" height="36" rx="12" fill="#FAD4D2" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="211" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2B2F4A">Transportation</text><rect x="12" y="102" width="116" height="36" rx="12" fill="#FBE7A8" stroke="#2B2F4A" stroke-width="3" /><text x="70" y="125" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2B2F4A">Excretion</text></svg>