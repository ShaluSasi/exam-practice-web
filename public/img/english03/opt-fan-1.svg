<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img">
<title>A hand fan</title>
<style>
.k{stroke:#2B2F4A;stroke-width:2px;stroke-linejoin:round;stroke-linecap:round}.k1{stroke:#2B2F4A;stroke-width:1.5px;stroke-linejoin:round;stroke-linecap:round}
.sw{transform-box:fill-box;transform-origin:50% 100%;animation:sw 3.2s ease-in-out infinite}.sw2{transform-box:fill-box;transform-origin:50% 100%;animation:sw 3.2s ease-in-out -1.6s infinite}@keyframes sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
