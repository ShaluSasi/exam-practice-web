<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img">
<title>A five-sentence description of a paper fan</title>
<style>
.k{stroke:#2B2F4A;stroke-width:2px;stroke-linejoin:round;stroke-linecap:round}.k1{stroke:#2B2F4A;stroke-width:1.5px;stroke-linejoin:round;stroke-linecap:round}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="30" y="24" width="740" height="334" rx="14" fill="#FFFFFF" class="k"/><rect x="30" y="24" width="740" height="52" rx="14" fill="#CDEBFA" class="k"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="400" y="58" font-size="22" text-anchor="middle">My Paper Fan: a description</text></g><circle cx="70" cy="114" r="15" fill="#FFF3C4" stroke="#C8925A" stroke-width="2"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="100" y="120" font-size="20">My fan is made of folded chart paper.</text></g><circle cx="70" cy="166" r="15" fill="#FFF3C4" stroke="#C8925A" stroke-width="2"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="100" y="172" font-size="20">It is about 25 cm wide when it is open.</text></g><circle cx="70" cy="218" r="15" fill="#FFF3C4" stroke="#C8925A" stroke-width="2"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="100" y="224" font-size="20">Its handle is a flat ice-cream stick.</text></g><circle cx="70" cy="270" r="15" fill="#FFF3C4" stroke="#C8925A" stroke-width="2"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="100" y="276" font-size="20">It is the prettiest fan anyone has ever made.</text></g><circle cx="70" cy="322" r="15" fill="#FFF3C4" stroke="#C8925A" stroke-width="2"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="100" y="328" font-size="20">It has red and blue stripes along its folds.</text></g><g transform="translate(712 300) scale(0.38)"><g><rect x="-4" y="34" width="8" height="48" rx="4" fill="#C8925A" stroke="#2B2F4A" stroke-width="2"/><circle r="40" fill="#C8372D" class="k"/><g><path d="M-32 -22l8 -8l8 8l8 -8l8 8l8 -8l8 8l8 -8l8 8" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linejoin="round"/><path d="M-32 0l8 -8l8 8l8 -8l8 8l8 -8l8 8l8 -8l8 8" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linejoin="round"/><path d="M-32 22l8 -8l8 8l8 -8l8 8l8 -8l8 8l8 -8l8 8" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linejoin="round"/></g><circle r="40" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 4" transform="scale(0.88)"/></g></g>
</svg>
