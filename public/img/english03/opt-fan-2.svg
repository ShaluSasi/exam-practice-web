<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img">
<title>A hand fan</title>
<style>
.k{stroke:#2B2F4A;stroke-width:2px;stroke-linejoin:round;stroke-linecap:round}.k1{stroke:#2B2F4A;stroke-width:1.5px;stroke-linejoin:round;stroke-linecap:round}
.sw{transform-box:fill-box;transform-origin:50% 100%;animation:sw 3.2s ease-in-out infinite}.sw2{transform-box:fill-box;transform-origin:50% 100%;animation:sw 3.2s ease-in-out -1.6s infinite}@keyframes sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<ellipse cx="100" cy="182" rx="50" ry="6" fill="#EADBC0"/><g transform="translate(100 78) scale(1)"><g class="sw"><rect x="-4" y="34" width="8" height="48" rx="4" fill="#C8925A" stroke="#2B2F4A" stroke-width="2"/><circle r="40" fill="#3A5BA0" class="k"/><circle cx="24" cy="0" r="6" fill="#DDEBF7" stroke="#F6C453" stroke-width="2"/><circle cx="17" cy="17" r="6" fill="#DDEBF7" stroke="#F6C453" stroke-width="2"/><circle cx="0" cy="24" r="6" fill="#DDEBF7" stroke="#F6C453" stroke-width="2"/><circle cx="-17" cy="17" r="6" fill="#DDEBF7" stroke="#F6C453" stroke-width="2"/><circle cx="-24" cy="0" r="6" fill="#DDEBF7" stroke="#F6C453" stroke-width="2"/><circle cx="-17" cy="-17" r="6" fill="#DDEBF7" stroke="#F6C453" stroke-width="2"/><circle cx="0" cy="-24" r="6" fill="#DDEBF7" stroke="#F6C453" stroke-width="2"/><circle cx="17" cy="-17" r="6" fill="#DDEBF7" stroke="#F6C453" stroke-width="2"/><circle r="7" fill="#DDEBF7" stroke="#F6C453" stroke-width="2"/></g></g>
</svg>
