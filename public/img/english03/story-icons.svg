 226Q328 196 348 176" stroke="#6E4626" stroke-width="3" fill="none" stroke-linecap="round"/><path transform="translate(332 192) scale(0.9)" d="M0 9Q-11 2 -9 -5Q-6 -9 -2 -6L0 -11L2 -6Q6 -9 9 -5Q11 2 0 9Z" fill="#3FA34D" stroke="#256B2F" stroke-width="1.4" stroke-linejoin="round"/><g class="fall"><path transform="translate(346 182) scale(0.9)" d="M0 9Q-11 2 -9 -5Q-6 -9 -2 -6L0 -11L2 -6Q6 -9 9 -5Q11 2 0 9Z" fill="#C9A23A" stroke="#256B2F" stroke-width="1.4" stroke-linejoin="round"/></g><g class="fall2"><path transform="translate(360 192) scale(0.8)" d="M0 9Q-11 2 -9 -5Q-6 -9 -2 -6L0 -11L2 -6Q6 -9 9 -5Q11 2 0 9Z" fill="#C9A23A" stroke="#256B2F" stroke-width="1.4" stroke-linejoin="round"/></g>
