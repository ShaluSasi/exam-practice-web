<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img">
<title>Six picture badges for events in a story, arranged in no particular order</title>
<style>
.k{stroke:#2B2F4A;stroke-width:2px;stroke-linejoin:round;stroke-linecap:round}.k1{stroke:#2B2F4A;stroke-width:1.5px;stroke-linejoin:round;stroke-linecap:round}
.st{animation:st 2.4s ease-in-out infinite}@keyframes st{0%,100%{opacity:.2;transform:translateY(2px)}50%{opacity:1;transform:translateY(-3px)}}.fall,.fall2{animation:fall 3.4s ease-in infinite}.fall2{animation-delay:-1.7s}@keyframes fall{0%{transform:translate(0,0);opacity:1}100%{transform:translate(8px,34px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
