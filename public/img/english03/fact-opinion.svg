<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
<title>Two cards: a ruler with a tick for facts, and a thought bubble with a heart for opinions</title>
<style>
.k{stroke:#2B2F4A;stroke-width:2px;stroke-linejoin:round;stroke-linecap:round}.k1{stroke:#2B2F4A;stroke-width:1.5px;stroke-linejoin:round;stroke-linecap:round}
.bob{animation:bob 3s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
