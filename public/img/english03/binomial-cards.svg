<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
<title>Three pairs of word cards joined by 'and'</title>
<style>
.k{stroke:#2B2F4A;stroke-width:2px;stroke-linejoin:round;stroke-linecap:round}.k1{stroke:#2B2F4A;stroke-width:1.5px;stroke-linejoin:round;stroke-linecap:round}
.sn{animation:sn 2.4s ease-in-out infinite}@keyframes sn{0%,100%{transform:translateX(0)}50%{transform:translateX(22px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="60" y="24" width="110" height="44" rx="8" fill="#FCE3EC" class="k"/><circle cx="200" cy="46" r="20" fill="#FFFFFF" class="k"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="200" y="51" font-size="14" text-anchor="middle">and</text></g><g class="sn" style="animation-delay:0s"><rect x="230" y="24" width="110" height="44" rx="8" fill="#FCE3EC" class="k"/></g><path d="M80 46H150" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" opacity=".35"/><rect x="60" y="88" width="110" height="44" rx="8" fill="#E3F2FD" class="k"/><circle cx="200" cy="110" r="20" fill="#FFFFFF" class="k"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="200" y="115" font-size="14" text-anchor="middle">and</text></g><g class="sn" style="animation-delay:-0.8s"><rect x="230" y="88" width="110" height="44" rx="8" fill="#E3F2FD" class="k"/></g><path d="M80 110H150" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" opacity=".35"/><rect x="60" y="152" width="110" height="44" rx="8" fill="#E6F4E1" class="k"/><circle cx="200" cy="174" r="20" fill="#FFFFFF" class="k"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="200" y="179" font-size="14" text-anchor="middle">and</text></g><g class="sn" style="animation-delay:-1.6s"><rect x="230" y="152" width="110" height="44" rx="8" fill="#E6F4E1" class="k"/></g><path d="M80 174H150" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" opacity=".35"/>
</svg>
