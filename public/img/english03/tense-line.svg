<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img">
<title>A timeline from the past to now, with a bridge joining a past moment to the present</title>
<style>
.k{stroke:#2B2F4A;stroke-width:2px;stroke-linejoin:round;stroke-linecap:round}.k1{stroke:#2B2F4A;stroke-width:1.5px;stroke-linejoin:round;stroke-linecap:round}
.br{animation:br 1.6s linear infinite}@keyframes br{to{stroke-dashoffset:-36}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M40 130H350" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><path d="M350 130l-12 -8v16Z" fill="#2B2F4A"/><circle cx="110" cy="130" r="8" fill="#FF8A1F" class="k1"/><circle cx="310" cy="130" r="10" fill="#3FA34D" class="k1"/><path class="br" d="M110 122Q210 20 310 120" stroke="#0B93D4" stroke-width="4" fill="none" stroke-dasharray="10 8" stroke-linecap="round"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="60" y="166" font-size="15" text-anchor="middle">PAST</text><text x="310" y="166" font-size="15" text-anchor="middle">NOW</text></g><path d="M96 104l4 -10l4 10l10 4l-10 4l-4 10l-4 -10l-10 -4Z" fill="#F6C453" stroke="#2B2F4A" stroke-width="1.2"/>
</svg>
