<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img">
<title>A speech bubble with quotation marks and an arrow pointing to a notebook being written in</title>
<style>
.ar{animation:ar 1.6s ease-in-out infinite}@keyframes ar{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
.wr{animation:wr 4s linear infinite}@keyframes wr{0%{stroke-dashoffset:120}60%,100%{stroke-dashoffset:0}}
.pen{animation:pn 4s linear infinite}@keyframes pn{0%{transform:translate(300px,124px)}60%,100%{transform:translate(400px,124px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M30 50h170v100H90l-24 26v-26H30Z" fill="#FDE2E2" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="64" y="118" font-size="54" fill="#E5484D">“</text><text x="150" y="132" font-size="54" fill="#E5484D">”</text></g>
<g class="ar"><path d="M214 110H262" stroke="#0B93D4" stroke-width="6" stroke-linecap="round"/><path d="M252 96L268 110L252 124" stroke="#0B93D4" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
<rect x="286" y="50" width="160" height="164" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5"/><path d="M300 80H430M300 102H430M300 124H430M300 146H430M300 168H430M300 190H430" stroke="#CDEBFA" stroke-width="2"/>
<path class="wr" d="M300 80H420M300 102H410M300 124H400" stroke="#2B2F4A" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="120" />
<g class="pen"><path d="M0 0L30 -30L38 -22L8 8Z" fill="#F6C453" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><path d="M0 0L-4 12L8 8" fill="#C8925A" stroke="#2B2F4A" stroke-width="1.5"/></g>
</svg>
