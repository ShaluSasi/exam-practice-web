.mag{animation:mg 5s ease-in-out infinite}@keyframes mg{0%,100%{transform:translate(300px,150px)}50%{transform:translate(350px,120px)}}
.fp{animation:fp 2.4s ease-in-out infinite}@keyframes fp{0%,100%{opacity:.15}50%{opacity:.6}}
