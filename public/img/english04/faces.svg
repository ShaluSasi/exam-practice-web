<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" role="img">
<title>Five cartoon faces showing different feelings</title>
<style>
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.tw{animation:tw 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes tw{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}.sd{animation:sd 1.8s ease-in infinite}@keyframes sd{0%{transform:translateY(0);opacity:1}100%{transform:translateY(12px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g transform="translate(60 90)"><circle r="38" fill="#FFC9B0" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="-12" cy="-8" r="3.5" fill="#2B2F4A"/><circle cx="12" cy="-8" r="3.5" fill="#2B2F4A"/><g class="pu"><ellipse cx="-20" cy="8" rx="9" ry="6" fill="#E5484D" opacity=".8"/><ellipse cx="20" cy="8" rx="9" ry="6" fill="#E5484D" opacity=".8"/></g><path d="M-8 18Q0 22 8 18" stroke="#2B2F4A" stroke-width="2.5" fill="none" stroke-linecap="round"/></g>
<g transform="translate(160 90)"><circle r="38" fill="#F6C453" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="-12" cy="-8" r="3.5" fill="#2B2F4A"/><circle cx="12" cy="-8" r="3.5" fill="#2B2F4A"/><path d="M-12 20Q-4 14 4 20T16 18" stroke="#2B2F4A" stroke-width="2.5" fill="none" stroke-linecap="round"/><g class="sd"><path d="M28 -22q-6 9 0 12q6-3 0-12Z" fill="#5BB8F0" stroke="#2B2F4A" stroke-width="1.2"/></g></g>
<g transform="translate(260 90)"><circle r="38" fill="#CDE3F5" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="-12" cy="-8" r="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><circle cx="12" cy="-8" r="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><circle cx="-12" cy="-8" r="2.4" fill="#2B2F4A"/><circle cx="12" cy="-8" r="2.4" fill="#2B2F4A"/><ellipse cx="0" cy="18" rx="8" ry="10" fill="#2B2F4A"/></g>
<g transform="translate(360 90)"><circle r="38" fill="#F6C453" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="-12" cy="-8" r="3.5" fill="#2B2F4A"/><circle cx="12" cy="-8" r="3.5" fill="#2B2F4A"/><path d="M-10 18H10" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/><path d="M-20 -22L-6 -16M20 -22L6 -16" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/></g>
<path d="M392 40h56v30h-36l-10 10v-10h-10Z" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><g fill="#2B2F4A"><circle cx="408" cy="55" r="2.5"/><circle cx="420" cy="55" r="2.5"/><circle cx="432" cy="55" r="2.5"/></g>
<g transform="translate(470 90)"><circle r="38" fill="#F6C453" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="-12" cy="-8" r="3.5" fill="#2B2F4A"/><path d="M6 -8Q12 -14 18 -8" stroke="#2B2F4A" stroke-width="2.5" fill="none" stroke-linecap="round"/><g class="tw"><path d="M22 -30l3 7 7 3-7 3-3 7-3-7-7-3 7-3Z" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.2"/></g><path d="M-10 14Q0 22 10 14" stroke="#2B2F4A" stroke-width="2.5" fill="none" stroke-linecap="round"/></g>
