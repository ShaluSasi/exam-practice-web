<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img">
<title>A graphic organiser about caring for the elderly with four question boxes</title>
<style>
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M160 70L240 150M320 70L240 150M160 230L240 150M320 230L240 150" stroke="#A3A8CC" stroke-width="3" stroke-dasharray="6 5"/>
<rect x="18" y="30" width="150" height="62" rx="14" fill="#FDE2E2" stroke="#2B2F4A" stroke-width="2"/><g class="pu"><path d="M36 68C20 58 28 44 36 54C44 44 52 58 36 68Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="1.6"/></g><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="104" y="58" font-size="14" text-anchor="middle">Why should</text><text x="104" y="76" font-size="14" text-anchor="middle">we care?</text></g>
<rect x="312" y="30" width="150" height="62" rx="14" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2"/><path d="M330 44V80" stroke="#2E2E38" stroke-width="4" stroke-linecap="round"/><circle cx="330" cy="42" r="4" fill="#E3B54A"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="398" y="58" font-size="14" text-anchor="middle">Problems</text><text x="398" y="76" font-size="14" text-anchor="middle">they face</text></g>
<rect x="18" y="208" width="150" height="62" rx="14" fill="#FFF3C4" stroke="#2B2F4A" stroke-width="2"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="36" y="248" font-size="24" text-anchor="middle" fill="#FF8A1F">?</text></g><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="104" y="236" font-size="14" text-anchor="middle">Possible</text><text x="104" y="254" font-size="14" text-anchor="middle">reasons</text></g>
<rect x="312" y="208" width="150" height="62" rx="14" fill="#DDF3D8" stroke="#2B2F4A" stroke-width="2"/><path d="M322 246Q330 230 340 246Z" fill="#E2AE84" stroke="#2B2F4A" stroke-width="1.5"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="398" y="236" font-size="14" text-anchor="middle">How can we</text><text x="398" y="254" font-size="14" text-anchor="middle">take care?</text></g>
<circle cx="240" cy="150" r="62" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="240" y="134" font-size="15" text-anchor="middle" fill="#0B6FA4">CARING</text><text x="240" y="154" font-size="15" text-anchor="middle" fill="#0B6FA4">FOR THE</text><text x="240" y="174" font-size="15" text-anchor="middle" fill="#0B6FA4">ELDERLY</text></g>
</svg>
