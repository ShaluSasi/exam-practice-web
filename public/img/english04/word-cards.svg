<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 306" role="img">
<title>Five word cards from the story</title>
<style>
.bob{animation:bob 2.6s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><g class="bob" style="animation-delay:0s"><rect x="40" y="16" width="320" height="48" rx="12" fill="#CDEBFA" stroke="#0B93D4" stroke-width="3"/><circle cx="64" cy="40" r="17" fill="#FFFFFF" stroke="#0B93D4" stroke-width="2" stroke-dasharray="4 3"/><text x="226" y="46" font-size="19" text-anchor="middle">crouch</text></g><g class="bob" style="animation-delay:0.4s"><rect x="40" y="74" width="320" height="48" rx="12" fill="#FFE1B8" stroke="#FF8A1F" stroke-width="3"/><circle cx="64" cy="98" r="17" fill="#FFFFFF" stroke="#FF8A1F" stroke-width="2" stroke-dasharray="4 3"/><text x="226" y="104" font-size="19" text-anchor="middle">darted</text></g><g class="bob" style="animation-delay:0.8s"><rect x="40" y="132" width="320" height="48" rx="12" fill="#D8F0D0" stroke="#3FA34D" stroke-width="3"/><circle cx="64" cy="156" r="17" fill="#FFFFFF" stroke="#3FA34D" stroke-width="2" stroke-dasharray="4 3"/><text x="226" y="162" font-size="19" text-anchor="middle">thudded</text></g><g class="bob" style="animation-delay:1.2000000000000002s"><rect x="40" y="190" width="320" height="48" rx="12" fill="#F9D7E6" stroke="#C2185B" stroke-width="3"/><circle cx="64" cy="214" r="17" fill="#FFFFFF" stroke="#C2185B" stroke-width="2" stroke-dasharray="4 3"/><text x="226" y="220" font-size="19" text-anchor="middle">sprinting</text></g><g class="bob" style="animation-delay:1.6s"><rect x="40" y="248" width="320" height="48" rx="12" fill="#E4DDF7" stroke="#7A3FB0" stroke-width="3"/><circle cx="64" cy="272" r="17" fill="#FFFFFF" stroke="#7A3FB0" stroke-width="2" stroke-dasharray="4 3"/><text x="226" y="278" font-size="19" text-anchor="middle">twirling</text></g></g>
</svg>
