<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" role="img">
<title>Question cards falling into two sorting boxes</title>
<style>
.fall{animation:fa 4s ease-in-out infinite}@keyframes fa{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(16px) rotate(4deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M40 170H210L198 244H52Z" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="125" y="216" font-size="20" text-anchor="middle">Wh-</text></g><path d="M270 170H440L428 244H282Z" fill="#FFF3C4" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="355" y="216" font-size="20" text-anchor="middle">Yes / No</text></g>
<g class="fall" style="animation-delay:0s"><rect x="80" y="30" width="42" height="34" rx="8" fill="#FDE2E2" stroke="#2B2F4A" stroke-width="2"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="101" y="55" font-size="20" text-anchor="middle">?</text></g></g><g class="fall" style="animation-delay:0.8s"><rect x="150" y="60" width="42" height="34" rx="8" fill="#DDF3D8" stroke="#2B2F4A" stroke-width="2"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="171" y="85" font-size="20" text-anchor="middle">?</text></g></g><g class="fall" style="animation-delay:1.6s"><rect x="220" y="24" width="42" height="34" rx="8" fill="#EBDDFB" stroke="#2B2F4A" stroke-width="2"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="241" y="49" font-size="20" text-anchor="middle">?</text></g></g><g class="fall" style="animation-delay:2.4s"><rect x="300" y="56" width="42" height="34" rx="8" fill="#FFE2C7" stroke="#2B2F4A" stroke-width="2"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="321" y="81" font-size="20" text-anchor="middle">?</text></g></g><g class="fall" style="animation-delay:3.2s"><rect x="370" y="30" width="42" height="34" rx="8" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="391" y="55" font-size="20" text-anchor="middle">?</text></g></g>
</svg>
