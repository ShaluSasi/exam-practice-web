<style>
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}@keyframes sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}.bob{animation:bob 2.6s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.nt{animation:nt 3.6s ease-in-out infinite}@keyframes nt{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(14px,-34px);opacity:0}}.spin{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
