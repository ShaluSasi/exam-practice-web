<style>

.cr{animation:cr 3s ease-in-out infinite;transform-origin:100px 70px}@keyframes cr{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.spinT{animation:st 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}@keyframes st{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
.sc{animation:sc 2.4s ease-in-out infinite}@keyframes sc{0%{opacity:0;transform:translateY(6px)}50%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.cl{animation:cl 8s ease-in-out infinite alternate}@keyframes cl{to{transform:translateX(40px)}}
.gz{animation:gz 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes gz{0%,100%{opacity:.15;transform:scale(.8)}50%{opacity:.45;transform:scale(1.3)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
