<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 205" role="img">
<title>A machine with a spinning gear: a number n goes in and an unknown result comes out</title>
<style>.t{font:600 14px system-ui,sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui,sans-serif;fill:#2B2F4A}.b{font:700 18px system-ui,sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.gear{transform-box:fill-box;transform-origin:center;animation:g 5s linear infinite}@keyframes g{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="120" y="40" width="160" height="110" rx="18" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="3"/><g class="gear"><circle cx="200" cy="95" r="26" fill="#F6C453" stroke="#2B2F4A" stroke-width="3"/><rect x="194" y="62" width="12" height="14" rx="2" fill="#F6C453" stroke="#2B2F4A" stroke-width="2.5" transform="rotate(0 200 95)"/><rect x="194" y="62" width="12" height="14" rx="2" fill="#F6C453" stroke="#2B2F4A" stroke-width="2.5" transform="rotate(45 200 95)"/><rect x="194" y="62" width="12" height="14" rx="2" fill="#F6C453" stroke="#2B2F4A" stroke-width="2.5" transform="rotate(90 200 95)"/><rect x="194" y="62" width="12" height="14" rx="2" fill="#F6C453" stroke="#2B2F4A" stroke-width="2.5" transform="rotate(135 200 95)"/><rect x="194" y="62" width="12" height="14" rx="2" fill="#F6C453" stroke="#2B2F4A" stroke-width="2.5" transform="rotate(180 200 95)"/><rect x="194" y="62" width="12" height="14" rx="2" fill="#F6C453" stroke="#2B2F4A" stroke-width="2.5" transform="rotate(225 200 95)"/><rect x="194" y="62" width="12" height="14" rx="2" fill="#F6C453" stroke="#2B2F4A" stroke-width="2.5" transform="rotate(270 200 95)"/><rect x="194" y="62" width="12" height="14" rx="2" fill="#F6C453" stroke="#2B2F4A" stroke-width="2.5" transform="rotate(315 200 95)"/><circle cx="200" cy="95" r="8" fill="#FFF9EE" stroke="#2B2F4A" stroke-width="2.5"/></g><line x1="30.0" y1="95.0" x2="118.0" y2="95.0" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round"/><polygon points="104,85 104,105 120,95" fill="#2B2F4A"/><text x="30.0" y="80.0" class="b">n</text><line x1="282.0" y1="95.0" x2="370.0" y2="95.0" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round"/><polygon points="356,85 356,105 372,95" fill="#2B2F4A"/><text x="335.0" y="80.0" class="b">?</text><text x="200.0" y="178.0" class="s m">a rule that is claimed to give only primes</text>
</svg>
