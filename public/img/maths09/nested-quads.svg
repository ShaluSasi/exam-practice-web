<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>Nested boxes showing four families of four-sided shapes, one inside the next</title>
<style>.t{font:600 14px system-ui,sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui,sans-serif;fill:#2B2F4A}.b{font:700 18px system-ui,sans-serif;fill:#2B2F4A}.m{text-anchor:middle}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="10" y="10" width="380" height="240" rx="14" fill="#FFF3C4" stroke="#2B2F4A" stroke-width="3"/><rect x="30" y="45" width="340" height="195" rx="12" fill="#D9F2DC" stroke="#2B2F4A" stroke-width="3"/><rect x="50" y="80" width="300" height="150" rx="10" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="3"/><rect x="200" y="112" width="140" height="108" rx="8" fill="#FFE2C2" stroke="#2B2F4A" stroke-width="3"/><text x="24.0" y="32.0" class="t">Quadrilaterals</text><text x="44.0" y="66.0" class="t">Parallelograms</text><text x="64.0" y="102.0" class="t">Rectangles</text><text x="214.0" y="134.0" class="t">Squares</text>
</svg>
