<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 185" role="img">
<title>A four-digit number split into its digits, with the digits added up</title>
<style>.t{font:600 14px system-ui,sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui,sans-serif;fill:#2B2F4A}.b{font:700 18px system-ui,sans-serif;fill:#2B2F4A}.m{text-anchor:middle}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="30" y="30" width="48" height="60" rx="10" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="3"/><text x="54" y="73" class="m" style="font:800 32px system-ui,sans-serif;fill:#2B2F4A">4</text><rect x="84" y="30" width="48" height="60" rx="10" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="3"/><text x="108" y="73" class="m" style="font:800 32px system-ui,sans-serif;fill:#2B2F4A">7</text><rect x="138" y="30" width="48" height="60" rx="10" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="3"/><text x="162" y="73" class="m" style="font:800 32px system-ui,sans-serif;fill:#2B2F4A">2</text><rect x="192" y="30" width="48" height="60" rx="10" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="3"/><text x="216" y="73" class="m" style="font:800 32px system-ui,sans-serif;fill:#2B2F4A">5</text><text x="125.0" y="125.0" class="t m">digits: 4 + 7 + 2 + 5</text><text x="125.0" y="155.0" class="b m">= 18</text><rect x="290" y="45" width="90" height="70" rx="14" fill="#FFE2C2" stroke="#2B2F4A" stroke-width="3"/><text x="335.0" y="87.0" class="b m">3 ?</text><path d="M265 70 L285 70" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/><polygon points="283,60 283,80 295,70" fill="#3FA34D"/>
</svg>
