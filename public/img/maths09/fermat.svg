<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 245" role="img">
<title>Values of a number pattern for n from 0 to 4 and a question mark for n equal to 5</title>
<style>.t{font:600 14px system-ui,sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui,sans-serif;fill:#2B2F4A}.b{font:700 18px system-ui,sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.pop{animation:p 2.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes p{50%{transform:scale(1.07)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200.0" y="34.0" class="b m">2<tspan dy='-8' font-size='11'>2</tspan><tspan dy='-5' font-size='9'>n</tspan><tspan dy='13' font-size='14'> + 1</tspan></text><rect x="20" y="70" width="64" height="70" rx="12" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="3"/><text x="52.0" y="92.0" class="s m">n = 0</text><text x="52.0" y="124.0" class="t m">3</text><rect x="92" y="70" width="64" height="70" rx="12" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="3"/><text x="124.0" y="92.0" class="s m">n = 1</text><text x="124.0" y="124.0" class="t m">5</text><rect x="164" y="70" width="64" height="70" rx="12" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="3"/><text x="196.0" y="92.0" class="s m">n = 2</text><text x="196.0" y="124.0" class="t m">17</text><rect x="236" y="70" width="64" height="70" rx="12" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="3"/><text x="268.0" y="92.0" class="s m">n = 3</text><text x="268.0" y="124.0" class="t m">257</text><rect x="308" y="70" width="64" height="70" rx="12" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="3"/><text x="340.0" y="92.0" class="s m">n = 4</text><text x="340.0" y="124.0" class="t m">65537</text><rect x="150" y="165" width="100" height="62" rx="14" fill="#FFE2C2" stroke="#2B2F4A" stroke-width="3" class="pop"/><text x="200.0" y="190.0" class="s m">n = 5</text><text x="200.0" y="215.0" class="b m">?</text>
</svg>
