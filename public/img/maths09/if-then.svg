<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 205" role="img">
<title>A box X with an arrow to a box Y, and a dashed arrow coming back</title>
<style>.t{font:600 14px system-ui,sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui,sans-serif;fill:#2B2F4A}.b{font:700 18px system-ui,sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.fw{animation:f 3s ease-in-out infinite}.bk line{animation:d 1.5s linear infinite}@keyframes f{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}@keyframes d{to{stroke-dashoffset:-22}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="25" y="40" width="90" height="70" rx="14" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="3"/><rect x="285" y="40" width="90" height="70" rx="14" fill="#FFE2C2" stroke="#2B2F4A" stroke-width="3"/><text x="70.0" y="86.0" class="m" style="font:800 34px system-ui,sans-serif;fill:#2B2F4A">X</text><text x="330.0" y="86.0" class="m" style="font:800 34px system-ui,sans-serif;fill:#2B2F4A">Y</text><g class="fw"><line x1="130" y1="75" x2="268" y2="75" stroke="#3FA34D" stroke-width="6" stroke-linecap="round"/><polygon points="270,62 270,88 288,75" fill="#3FA34D" transform="translate(-10 0)"/></g><text x="200.0" y="62.0" class="s m">if X then Y</text><g class="bk"><line x1="270" y1="150" x2="132" y2="150" stroke="#FF8A1F" stroke-width="6" stroke-linecap="round" stroke-dasharray="12 10"/><polygon points="130,137 130,163 112,150" fill="#FF8A1F" transform="translate(10 0)"/></g><text x="200.0" y="185.0" class="s m">if Y then X ?</text>
</svg>
