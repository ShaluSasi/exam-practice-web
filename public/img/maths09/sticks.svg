<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Two thin sticks laid across each other like the diagonals of a four-sided shape</title>
<style>.t{font:600 14px system-ui,sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui,sans-serif;fill:#2B2F4A}.b{font:700 18px system-ui,sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.s2{transform-box:fill-box;transform-origin:center;animation:w 6s ease-in-out infinite}@keyframes w{0%,100%{transform:rotate(25deg)}50%{transform:rotate(-25deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g class="s1"><rect x="60" y="112" width="280" height="16" rx="8" fill="#C8925A" stroke="#2B2F4A" stroke-width="3"/></g><g class="s2" transform="rotate(25 200 120)"><rect x="60" y="112" width="280" height="16" rx="8" fill="#F6C453" stroke="#2B2F4A" stroke-width="3"/></g><circle cx="200" cy="120" r="7" fill="#2B2F4A"/>
</svg>
