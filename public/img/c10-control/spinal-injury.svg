<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Side view of the backbone with a damaged spinal cord; impulses from below and commands from the brain are blocked at the injury</title>
<style>
text{font-family:sans-serif}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes up1{0%{transform:translate(0px,0px);opacity:0}4%{transform:translate(0px,0px);opacity:1}90.0%{transform:translate(0px,-60px)}94%{transform:translate(0px,-60px);opacity:1}98%,100%{transform:translate(0px,-60px);opacity:0}}
.up1{animation:up1 2.4s linear 0s infinite}
@keyframes dn1{0%{transform:translate(0px,0px);opacity:0}4%{transform:translate(0px,0px);opacity:1}90.0%{transform:translate(0px,62px)}94%{transform:translate(0px,62px);opacity:1}98%,100%{transform:translate(0px,62px);opacity:0}}
.dn1{animation:dn1 2.4s linear 0.4s infinite}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<ellipse cx="200" cy="40" rx="48" ry="28" fill="#FFB3C1" stroke="#2B2F4A" stroke-width="3" /><path d="M178 36Q190 26 200 36Q210 26 222 36" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="172" y="72" width="56" height="20" rx="8" fill="#EDE0C8" stroke="#2B2F4A" stroke-width="3" /><rect x="172" y="98" width="56" height="20" rx="8" fill="#EDE0C8" stroke="#2B2F4A" stroke-width="3" /><rect x="172" y="124" width="56" height="20" rx="8" fill="#EDE0C8" stroke="#2B2F4A" stroke-width="3" /><rect x="172" y="150" width="56" height="20" rx="8" fill="#EDE0C8" stroke="#2B2F4A" stroke-width="3" /><rect x="172" y="176" width="56" height="20" rx="8" fill="#EDE0C8" stroke="#2B2F4A" stroke-width="3" /><rect x="172" y="202" width="56" height="20" rx="8" fill="#EDE0C8" stroke="#2B2F4A" stroke-width="3" /><rect x="194" y="70" width="12" height="160" rx="5" fill="#FFD166" stroke="#2B2F4A" stroke-width="2.5" /><path d="M150 132L250 132" stroke="#E5484D" stroke-width="5" stroke-linecap="round" fill="none" /><path d="M158 122L170 142" stroke="#E5484D" stroke-width="5" stroke-linecap="round" fill="none" /><path d="M170 122L158 142" stroke="#E5484D" stroke-width="5" stroke-linecap="round" fill="none" /><text x="320" y="126" font-family="sans-serif" font-size="12" fill="#E5484D" text-anchor="middle" font-weight="bold">Cord damaged here</text><circle cx="214" cy="210" r="6" fill="#0B93D4" stroke="#fff" stroke-width="2" class="up1"/><circle cx="186" cy="50" r="6" fill="#FF8A1F" stroke="#fff" stroke-width="2" class="dn1"/><text x="80" y="70" font-family="sans-serif" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold">Brain</text><text x="90" y="196" font-family="sans-serif" font-size="12" fill="#8A8FA8" text-anchor="middle" font-weight="bold">Body below</text><text x="90" y="212" font-family="sans-serif" font-size="12" fill="#8A8FA8" text-anchor="middle" font-weight="bold">the injury</text><text x="80" y="98" font-family="sans-serif" font-size="11" fill="#FF8A1F" text-anchor="middle" font-weight="bold">Commands</text><text x="318" y="196" font-family="sans-serif" font-size="11" fill="#0B93D4" text-anchor="middle" font-weight="bold">Sensations</text>
</svg>
