<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A nerve impulse racing along a nerve to one connected cell compared with hormone molecules slowly spreading to many cells</title>
<style>
text{font-family:sans-serif}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes nv{0%{transform:translate(0px,0px);opacity:0}4%{transform:translate(0px,0px);opacity:1}90.0%{transform:translate(270px,0px)}94%{transform:translate(270px,0px);opacity:1}98%,100%{transform:translate(270px,0px);opacity:0}}
.nv{animation:nv 1.2s linear 0s infinite}
@keyframes hd{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
.h1{--dx:90px;--dy:-24px;animation:hd 4s linear infinite}.h2{--dx:150px;--dy:0px;animation:hd 4s linear infinite}.h3{--dx:90px;--dy:30px;animation:hd 4s linear infinite}.h4{--dx:220px;--dy:-10px;animation:hd 4s linear infinite}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="24" font-family="sans-serif" font-size="12" fill="#7C5CFF" text-anchor="middle" font-weight="bold">Nerve impulse: fast, only along the nerve</text><circle cx="20" cy="60" r="12" fill="#CFC4FF" stroke="#2B2F4A" stroke-width="3" /><path d="M32 60L300 60" stroke="#7C5CFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><circle cx="316" cy="60" r="13" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" /><text x="316" y="92" font-family="sans-serif" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="bold">Connected cell</text><circle cx="300" cy="24" r="0" fill="none" stroke="none" stroke-width="0" /><circle cx="30" cy="60" r="6" fill="#FF8A1F" stroke="#fff" stroke-width="2" class="nv"/><path d="M10 112L390 112" stroke="#CFCFD8" stroke-width="2" stroke-linecap="round" fill="none" /><text x="200" y="136" font-family="sans-serif" font-size="12" fill="#E5484D" text-anchor="middle" font-weight="bold">Hormone: slower, but reaches cells all over the body</text><circle cx="20" cy="184" r="12" fill="#FFD166" stroke="#2B2F4A" stroke-width="3" /><circle cx="120" cy="160" r="11" fill="#BFE3F7" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="210" cy="200" r="11" fill="#BFE3F7" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="270" cy="172" r="11" fill="#BFE3F7" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="340" cy="196" r="11" fill="#BFE3F7" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="350" cy="150" r="11" fill="#BFE3F7" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="40" cy="184" r="5" fill="#E5484D" stroke="#fff" stroke-width="1.5" class="h1"/><circle cx="40" cy="184" r="5" fill="#E5484D" stroke="#fff" stroke-width="1.5" class="h2"/><circle cx="40" cy="184" r="5" fill="#E5484D" stroke="#fff" stroke-width="1.5" class="h3"/><circle cx="40" cy="184" r="5" fill="#E5484D" stroke="#fff" stroke-width="1.5" class="h4"/><text x="20" y="216" font-family="sans-serif" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="bold">Gland</text>
</svg>
