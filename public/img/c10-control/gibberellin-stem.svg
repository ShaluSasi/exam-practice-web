<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A short stem next to a tall stem that has grown longer under the effect of gibberellins</title>
<style>
text{font-family:sans-serif}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes gg{0%{transform:scaleY(.62)}60%,100%{transform:scaleY(1)}}
.gg{animation:gg 3.5s ease-out infinite;transform-box:fill-box;transform-origin:bottom center}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="60" y="206" width="80" height="22" rx="5" fill="#C97B4A" stroke="#2B2F4A" stroke-width="3" /><rect x="260" y="206" width="80" height="22" rx="5" fill="#C97B4A" stroke="#2B2F4A" stroke-width="3" /><path d="M100 206L100 150" stroke="#5BAF55" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" /><ellipse cx="80" cy="160" rx="16" ry="7" fill="#7CCB6B" stroke="#2B2F4A" stroke-width="2" /><ellipse cx="120" cy="152" rx="16" ry="7" fill="#7CCB6B" stroke="#2B2F4A" stroke-width="2" /><text x="100" y="242" font-family="sans-serif" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="bold"></text><g class="gg"><path d="M300 206L300 60" stroke="#5BAF55" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" /><ellipse cx="278" cy="170" rx="16" ry="7" fill="#7CCB6B" stroke="#2B2F4A" stroke-width="2" /><ellipse cx="322" cy="120" rx="16" ry="7" fill="#7CCB6B" stroke="#2B2F4A" stroke-width="2" /><ellipse cx="280" cy="92" rx="16" ry="7" fill="#7CCB6B" stroke="#2B2F4A" stroke-width="2" /><ellipse cx="300" cy="54" rx="10" ry="8" fill="#7CCB6B" stroke="#2B2F4A" stroke-width="2" /></g><path d="M200 150L230 150" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" fill="none" /><path d="M222.1 154.3L230 150L222.1 145.7" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="200" y="128" font-family="sans-serif" font-size="12" fill="#7C5CFF" text-anchor="middle" font-weight="bold">Gibberellins</text><text x="100" y="30" font-family="sans-serif" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold">Stem growth slow</text><text x="300" y="30" font-family="sans-serif" font-size="12" fill="#3FA34D" text-anchor="middle" font-weight="bold">Stem grows tall</text>
</svg>
