<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A child pinches the nose shut while a sugar cube is eaten; the smell cannot reach the nose, so the taste seems weaker</title>
<style>
text{font-family:sans-serif}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes sw{0%,100%{opacity:.25}50%{opacity:1}}
.sw{animation:sw 1.6s ease-in-out infinite}
@keyframes cr{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.cr{animation:cr 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<ellipse cx="150" cy="118" rx="78" ry="88" fill="#FFE0C2" stroke="#2B2F4A" stroke-width="3" /><path d="M80 80Q150 20 220 80Q200 56 150 54Q100 56 80 80Z" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="#3A3550" /><circle cx="122" cy="100" r="8" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="178" cy="100" r="8" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="123" cy="101" r="4" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1" /><circle cx="177" cy="101" r="4" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1" /><path d="M150 108Q140 130 150 138Q160 132 150 108" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="#F2C49C" /><path d="M118 164Q150 188 182 164Q150 174 118 164Z" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="#B03A4A" /><path d="M146 150L126 112" stroke="#2B2F4A" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none" /><path d="M154 150L174 112" stroke="#2B2F4A" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none" /><path d="M146 150L126 112" stroke="#FFE0C2" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" /><path d="M154 150L174 112" stroke="#FFE0C2" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="250" y="150" width="30" height="30" rx="5" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><path d="M250 150L262 140L292 140L280 150" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#F2F2F2" /><path d="M280 150L292 140L292 170L280 180" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#E6E6E6" /><text x="268" y="200" font-family="sans-serif" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold">Sugar</text><path d="M300 120q6 -6 12 0t12 0" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" class="sw"/><path d="M318 100q6 -6 12 0t12 0" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" class="sw"/><path d="M330 126q6 -6 12 0t12 0" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" class="sw"/><g class="cr"><path d="M236 70L262 96" stroke="#E5484D" stroke-width="6" stroke-linecap="round" fill="none" /><path d="M262 70L236 96" stroke="#E5484D" stroke-width="6" stroke-linecap="round" fill="none" /></g><text x="250" y="56" font-family="sans-serif" font-size="12" fill="#E5484D" text-anchor="middle" font-weight="bold">No smell</text><text x="150" y="232" font-family="sans-serif" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold">Nose blocked: sweet taste is weaker</text>
</svg>
