<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A feedback loop: rising blood sugar makes the pancreas release more insulin, sugar falls, and insulin release is reduced</title>
<style>
text{font-family:sans-serif}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.q0{animation:qb 4s linear 0s infinite}.q1{animation:qb 4s linear 1s infinite}.q2{animation:qb 4s linear 2s infinite}.q3{animation:qb 4s linear 3s infinite}@keyframes qb{0%,24%{opacity:1}25%,100%{opacity:.2}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="30" y="40" width="200" height="48" rx="12" fill="#FFE9C7" stroke="#2B2F4A" stroke-width="3" /><text x="130" y="60" font-family="sans-serif" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold">Blood sugar</text><text x="130" y="78" font-family="sans-serif" font-size="12" fill="#E5484D" text-anchor="middle" font-weight="bold">level rises</text><rect x="250" y="40" width="120" height="48" rx="12" fill="#EFEAFF" stroke="#2B2F4A" stroke-width="3" /><text x="310" y="60" font-family="sans-serif" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold">Pancreas</text><text x="310" y="78" font-family="sans-serif" font-size="12" fill="#7C5CFF" text-anchor="middle" font-weight="bold">detects it</text><rect x="250" y="152" width="120" height="48" rx="12" fill="#DFF3DC" stroke="#2B2F4A" stroke-width="3" /><text x="310" y="172" font-family="sans-serif" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold">More insulin</text><text x="310" y="190" font-family="sans-serif" font-size="12" fill="#3FA34D" text-anchor="middle" font-weight="bold">released</text><rect x="30" y="152" width="200" height="48" rx="12" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" /><text x="130" y="172" font-family="sans-serif" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold">Sugar level falls,</text><text x="130" y="190" font-family="sans-serif" font-size="12" fill="#0B93D4" text-anchor="middle" font-weight="bold">insulin secretion reduced</text><path class="q0" d="M232 64L248 64" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" fill="none" /><path class="q0" d="M240.1 68.3L248 64L240.1 59.7" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path class="q1" d="M310 90L310 150" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" fill="none" /><path class="q1" d="M305.7 142.1L310 150L314.3 142.1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path class="q2" d="M248 176L232 176" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" fill="none" /><path class="q2" d="M239.9 171.7L232 176L239.9 180.3" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path class="q3" d="M130 150L130 90" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" fill="none" /><path class="q3" d="M134.3 97.9L130 90L125.7 97.9" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="200" y="128" font-family="sans-serif" font-size="13" fill="#FF8A1F" text-anchor="middle" font-weight="bold">Feedback</text><text x="200" y="146" font-family="sans-serif" font-size="13" fill="#FF8A1F" text-anchor="middle" font-weight="bold">loop</text>
</svg>
