<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A reflex arc: heat receptor in the skin, sensory neuron, spinal cord, motor neuron and muscle, with an impulse travelling along it</title>
<style>
text{font-family:sans-serif}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes rf{0%{transform:translate(0px,0px);opacity:0}4%{transform:translate(0px,0px);opacity:1}25.7%{transform:translate(60px,-40px)}40.0%{transform:translate(98px,-68px)}53.2%{transform:translate(142px,-68px)}67.9%{transform:translate(182px,-40px)}90.0%{transform:translate(242px,2px)}94%{transform:translate(242px,2px);opacity:1}98%,100%{transform:translate(242px,2px);opacity:0}}
.rf{animation:rf 3.2s linear 0s infinite}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<ellipse cx="205" cy="120" rx="40" ry="38" fill="#E9E4F5" stroke="#2B2F4A" stroke-width="3" /><path d="M205 100Q185 100 178 116Q186 126 205 122Q224 126 232 116Q224 100 205 100M205 140Q188 142 184 154Q196 160 205 150Q214 160 226 154Q222 142 205 140" stroke="#7C5CFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="#CFC4FF" /><path d="M205 82L205 62" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="5 5"/><ellipse cx="205" cy="40" rx="38" ry="22" fill="#FFB3C1" stroke="#2B2F4A" stroke-width="3" /><path d="M185 38Q195 28 205 38Q215 28 225 38" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="24" y="200" width="86" height="26" rx="6" fill="#F6C9A0" stroke="#2B2F4A" stroke-width="3" /><path d="M30 200Q40 176 36 168Q52 178 50 200" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="#FF8A1F" /><path d="M80 190L140 150L178 122" stroke="#0B93D4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><path d="M178 122L222 122" stroke="#7C5CFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><path d="M222 122L262 150L322 192" stroke="#FF8A1F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><circle cx="80" cy="190" r="8" fill="#FFD166" stroke="#2B2F4A" stroke-width="2.5" /><ellipse cx="338" cy="198" rx="24" ry="13" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" /><path d="M318 192Q338 182 358 194" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" /><circle class="rf" cx="80" cy="190" r="7" fill="#FF8A1F" stroke="#fff" stroke-width="2"/><text x="70" y="238" font-family="sans-serif" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="bold">Hot object</text><text x="338" y="226" font-family="sans-serif" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="bold">Muscle</text>
</svg>
