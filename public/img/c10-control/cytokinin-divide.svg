<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Cells dividing again and again in a fruit with seeds, where cytokinins are most concentrated</title>
<style>
text{font-family:sans-serif}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes s1{0%,28%{opacity:1}33%,100%{opacity:0}}
@keyframes s2{0%,30%{opacity:0}35%,62%{opacity:1}67%,100%{opacity:0}}
@keyframes s3{0%,64%{opacity:0}70%,95%{opacity:1}100%{opacity:0}}
.s1{animation:s1 4.5s linear infinite}.s2{animation:s2 4.5s linear infinite}.s3{animation:s3 4.5s linear infinite}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="90" cy="110" r="52" fill="#F28B82" stroke="#2B2F4A" stroke-width="3" /><path d="M90 58Q92 40 108 34" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" /><ellipse cx="114" cy="38" rx="14" ry="7" fill="#7CCB6B" stroke="#2B2F4A" stroke-width="2" /><path d="M90 62L90 158" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="5 4"/><ellipse cx="80" cy="100" rx="4" ry="6" fill="#4B3621" stroke="#2B2F4A" stroke-width="1" /><ellipse cx="100" cy="100" rx="4" ry="6" fill="#4B3621" stroke="#2B2F4A" stroke-width="1" /><ellipse cx="80" cy="125" rx="4" ry="6" fill="#4B3621" stroke="#2B2F4A" stroke-width="1" /><ellipse cx="100" cy="125" rx="4" ry="6" fill="#4B3621" stroke="#2B2F4A" stroke-width="1" /><ellipse cx="90" cy="112" rx="4" ry="6" fill="#4B3621" stroke="#2B2F4A" stroke-width="1" /><text x="90" y="190" font-family="sans-serif" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold">Fruit and seeds</text><text x="90" y="206" font-family="sans-serif" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="bold">(rapid cell division)</text><g class="s1"><circle cx="290" cy="110" r="34" fill="#CFEFC9" stroke="#3FA34D" stroke-width="3" /><circle cx="290" cy="110" r="10" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2" /></g><g class="s2"><circle cx="268" cy="110" r="26" fill="#CFEFC9" stroke="#3FA34D" stroke-width="3" /><circle cx="318" cy="110" r="26" fill="#CFEFC9" stroke="#3FA34D" stroke-width="3" /><circle cx="268" cy="110" r="8" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2" /><circle cx="318" cy="110" r="8" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2" /></g><g class="s3"><circle cx="268" cy="88" r="20" fill="#CFEFC9" stroke="#3FA34D" stroke-width="3" /><circle cx="268" cy="88" r="6" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2" /><circle cx="314" cy="88" r="20" fill="#CFEFC9" stroke="#3FA34D" stroke-width="3" /><circle cx="314" cy="88" r="6" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2" /><circle cx="268" cy="134" r="20" fill="#CFEFC9" stroke="#3FA34D" stroke-width="3" /><circle cx="268" cy="134" r="6" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2" /><circle cx="314" cy="134" r="20" fill="#CFEFC9" stroke="#3FA34D" stroke-width="3" /><circle cx="314" cy="134" r="6" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2" /></g><text x="292" y="190" font-family="sans-serif" font-size="12" fill="#3FA34D" text-anchor="middle" font-weight="bold">Cell division is promoted</text><text x="292" y="206" font-family="sans-serif" font-size="12" fill="#3FA34D" text-anchor="middle" font-weight="bold">by cytokinins</text>
</svg>
