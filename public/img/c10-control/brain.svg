<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Side view of the human brain showing the fore-brain, mid-brain, cerebellum, medulla and the start of the spinal cord</title>
<style>
text{font-family:sans-serif}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes up{0%{transform:translate(0,0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translate(0,-60px);opacity:0}}
.s1{animation:up 2.4s linear infinite}.s2{animation:up 2.4s linear 1.2s infinite}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<ellipse cx="180" cy="92" rx="102" ry="66" fill="#FFC7D1" stroke="#2B2F4A" stroke-width="3" /><path d="M110 70Q130 50 150 70T190 70T230 62" stroke="#E58FA2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" /><path d="M100 100Q125 82 145 100T185 100T235 96" stroke="#E58FA2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" /><path d="M120 130Q145 112 165 130T205 128T245 120" stroke="#E58FA2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" /><path d="M175 40Q170 60 180 80" stroke="#E58FA2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="212" y="150" width="28" height="28" rx="8" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="3" /><ellipse cx="284" cy="150" rx="44" ry="28" fill="#BDE5B8" stroke="#2B2F4A" stroke-width="3" /><path d="M254 140Q284 132 314 140" stroke="#6FB46B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><path d="M254 150Q284 142 314 150" stroke="#6FB46B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><path d="M254 160Q284 152 314 160" stroke="#6FB46B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="212" y="176" width="30" height="44" rx="10" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" /><rect x="214" y="218" width="26" height="22" rx="6" fill="#9AA0C8" stroke="#2B2F4A" stroke-width="3" /><circle cx="150" cy="168" r="6" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" /><text x="60" y="190" font-family="sans-serif" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold">Front</text><text x="350" y="200" font-family="sans-serif" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold">Back</text><circle class="s1" cx="227" cy="232" r="5" fill="#FF8A1F" stroke="#fff" stroke-width="2"/><circle class="s2" cx="227" cy="232" r="5" fill="#FF8A1F" stroke="#fff" stroke-width="2"/>
</svg>
