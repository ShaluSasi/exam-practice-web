<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Adrenaline from the adrenal gland travels in the blood: the heart beats faster, more blood goes to the muscles and less to the gut and skin</title>
<style>
text{font-family:sans-serif}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes d1{0%{transform:translate(0px,0px);opacity:0}4%{transform:translate(0px,0px);opacity:1}34.2%{transform:translate(90px,0px)}70.5%{transform:translate(180px,-60px)}90.0%{transform:translate(238px,-60px)}94%{transform:translate(238px,-60px);opacity:1}98%,100%{transform:translate(238px,-60px);opacity:0}}
.d1{animation:d1 3s linear 0s infinite}
@keyframes d2{0%{transform:translate(0px,0px);opacity:0}4%{transform:translate(0px,0px);opacity:1}36.5%{transform:translate(90px,0px)}90.0%{transform:translate(238px,0px)}94%{transform:translate(238px,0px);opacity:1}98%,100%{transform:translate(238px,0px);opacity:0}}
.d2{animation:d2 3s linear 0.5s infinite}
@keyframes d3{0%{transform:translate(0px,0px);opacity:0}4%{transform:translate(0px,0px);opacity:1}34.2%{transform:translate(90px,0px)}70.5%{transform:translate(180px,60px)}90.0%{transform:translate(238px,60px)}94%{transform:translate(238px,60px);opacity:1}98%,100%{transform:translate(238px,60px);opacity:0}}
.d3{animation:d3 3s linear 1s infinite}
@keyframes hb{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.hb{animation:hb .6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M80 120L170 120" stroke="#E5484D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" /><path d="M170 120L260 60L330 60" stroke="#E5484D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" /><path d="M170 120L330 120" stroke="#E5484D" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" /><path d="M170 120L260 180L330 180" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="20" y="96" width="60" height="48" rx="12" fill="#FFD166" stroke="#2B2F4A" stroke-width="3" /><text x="50" y="118" font-family="sans-serif" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="bold">Adrenal</text><text x="50" y="132" font-family="sans-serif" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="bold">gland</text><path class="hb" d="M356 66c-14-14-26-24-12-34 8-5 14 0 12 8 4-8 12-12 20-6 14 10-2 22-20 32z" fill="#E5484D" stroke="#2B2F4A" stroke-width="3"/><rect x="340" y="100" width="50" height="40" rx="18" fill="#F08A8A" stroke="#2B2F4A" stroke-width="3" /><rect x="340" y="164" width="50" height="32" rx="8" fill="#F6D7B8" stroke="#2B2F4A" stroke-width="3" /><text x="330" y="36" font-family="sans-serif" font-size="12" fill="#2B2F4A" text-anchor="end" font-weight="bold">Heart beats faster</text><text x="330" y="160" font-family="sans-serif" font-size="12" fill="#2B2F4A" text-anchor="end" font-weight="bold">More blood to muscles</text><text x="330" y="208" font-family="sans-serif" font-size="12" fill="#2B2F4A" text-anchor="end" font-weight="bold">Less blood to gut and skin</text><circle cx="80" cy="120" r="7" fill="#FF8A1F" stroke="#fff" stroke-width="2" class="d1"/><circle cx="80" cy="120" r="7" fill="#FF8A1F" stroke="#fff" stroke-width="2" class="d2"/><circle cx="80" cy="120" r="7" fill="#FF8A1F" stroke="#fff" stroke-width="2" class="d3"/><text x="130" y="100" font-family="sans-serif" font-size="11" fill="#E5484D" text-anchor="middle" font-weight="bold">Adrenaline in blood</text>
</svg>
