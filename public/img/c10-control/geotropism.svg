<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A germinating seed with the root growing down towards gravity and the shoot growing upwards</title>
<style>
text{font-family:sans-serif}
@keyframes gu{0%,100%{transform:scale(.93)}50%{transform:scale(1)}}
.gu{animation:gu 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.gd{animation:gu 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 0}
@keyframes ga{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
.ga{animation:ga 1.2s ease-in-out infinite}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="0" y="110" width="400" height="130" fill="#C9A27A"/>
<path d="M0 110L400 110" fill="none" stroke="#8A6A45" stroke-width="3" stroke-linecap="round"/>
<g class="gd" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M200 124Q206 170 192 218M201 152Q186 160 172 176M202 172Q218 180 230 198M197 196Q186 202 178 214" stroke="#8A6A45" stroke-width="7"/>
<path d="M200 124Q206 170 192 218M201 152Q186 160 172 176M202 172Q218 180 230 198M197 196Q186 202 178 214" stroke="#F3E9D8" stroke-width="3.5"/>
</g>
<g class="gu" stroke-linejoin="round">
<path d="M200 114Q196 76 201 42" fill="none" stroke="#3F8F3A" stroke-width="8" stroke-linecap="round"/>
<path d="M200 114Q196 76 201 42" fill="none" stroke="#5BAF55" stroke-width="4.5" stroke-linecap="round"/>
<path d="M201 44C206 22 232 14 256 22C248 44 224 54 201 44Z" fill="#7CCB6B" stroke="#2B2F4A" stroke-width="2.5"/>
<path d="M201 44Q226 38 248 25" fill="none" stroke="#3F8F3A" stroke-width="2" stroke-linecap="round"/>
<path d="M200 56C192 36 168 30 146 38C154 60 178 68 200 56Z" fill="#7CCB6B" stroke="#2B2F4A" stroke-width="2.5"/>
<path d="M200 56Q176 52 154 41" fill="none" stroke="#3F8F3A" stroke-width="2" stroke-linecap="round"/>
</g>
<ellipse cx="200" cy="119" rx="14" ry="9" fill="#E6B77A" stroke="#2B2F4A" stroke-width="2.5"/>
<g class="ga"><path d="M340 130L340 200" fill="none" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round"/><path d="M332 190L340 200L348 190" fill="none" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="340" y="222" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold">Gravity</text>
<text x="70" y="70" font-size="12" fill="#2F7D3A" text-anchor="middle" font-weight="bold">Shoot: grows up</text>
<text x="80" y="200" font-size="12" fill="#4A3218" text-anchor="middle" font-weight="bold">Root: grows down</text>
</svg>
