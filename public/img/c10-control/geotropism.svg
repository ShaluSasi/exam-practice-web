<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A germinating seed with the root growing down towards gravity and the shoot growing upwards</title>
<style>
text{font-family:sans-serif}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes gr{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.gw{stroke-dasharray:100;animation:gr 3s ease-out infinite}
@keyframes ga{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
.ga{animation:ga 1.2s ease-in-out infinite}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="0" y="110" width="400" height="130" rx="0" fill="#C9A27A" stroke="#C9A27A" stroke-width="0" /><path d="M0 110L400 110" stroke="#8A6A45" stroke-width="3" stroke-linecap="round" fill="none" /><path d="M200 126Q206 170 190 214" stroke="#8A6A45" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none" pathLength="100" class="gw"/><path d="M200 126Q206 170 190 214" stroke="#F3E9D8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" pathLength="100" class="gw"/><path d="M200 112Q194 74 206 36" stroke="#5BAF55" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" pathLength="100" class="gw"/><ellipse cx="214" cy="34" rx="12" ry="6" fill="#7CCB6B" stroke="#2B2F4A" stroke-width="2" /><ellipse cx="198" cy="42" rx="12" ry="6" fill="#7CCB6B" stroke="#2B2F4A" stroke-width="2" /><ellipse cx="200" cy="119" rx="12" ry="8" fill="#E6B77A" stroke="#2B2F4A" stroke-width="2.5" /><g class="ga"><path d="M340 130L340 200" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" fill="none" /><path d="M335.7 192.1L340 200L344.3 192.1" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g><text x="340" y="222" font-family="sans-serif" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold">Gravity</text><text x="70" y="70" font-family="sans-serif" font-size="12" fill="#3FA34D" text-anchor="middle" font-weight="bold">Shoot: grows up</text><text x="80" y="200" font-family="sans-serif" font-size="12" fill="#8A6A45" text-anchor="middle" font-weight="bold">Root: grows down</text>
</svg>
