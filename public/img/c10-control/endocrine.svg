<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
<title>A human body outline with the pituitary in the head, thyroid in the neck, adrenal glands above the kidneys, pancreas and ovaries</title>
<style>
text{font-family:sans-serif}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes gl{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.gl{animation:gl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes hr{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(0,-26px);opacity:0}}
.hr1{animation:hr 2s linear infinite}.hr2{animation:hr 2s linear 1s infinite}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
