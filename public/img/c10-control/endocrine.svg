oke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="#FFD166" /><rect x="186" y="146" width="52" height="12" rx="6" fill="#E8B23A" stroke="#2B2F4A" stroke-width="2.5" class="gl"/><ellipse cx="180" cy="184" rx="10" ry="7" fill="#B58AF5" stroke="#2B2F4A" stroke-width="2.5" class="gl"/><ellipse cx="220" cy="184" rx="10" ry="7" fill="#B58AF5" stroke="#2B2F4A" stroke-width="2.5" class="gl"/><path d="M186 186L214 186" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" /><circle cx="300" cy="150" r="5" fill="#E5484D" stroke="#fff" stroke-width="1.5" class="hr1" opacity="0"/><circle cx="100" cy="150" r="5" fill="#E5484D" stroke="#fff" stroke-width="1.5" class="hr2" opacity="0"/><text x="60" y="40" font-family="sans-serif" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold">Endocrine</text><text x="60" y="56" font-family="sans-serif" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold">glands</text>
