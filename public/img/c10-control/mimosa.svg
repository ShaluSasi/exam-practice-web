<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A sensitive plant: touching a leaf makes the leaflets fold and the leaf stalks droop within seconds</title>
<style>
text{font-family:sans-serif}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes ml{0%,20%{transform:rotate(0)}35%,80%{transform:rotate(-48deg)}100%{transform:rotate(0)}}
@keyframes mr{0%,20%{transform:rotate(0)}35%,80%{transform:rotate(48deg)}100%{transform:rotate(0)}}
@keyframes lf{0%,20%{transform:scaleY(1)}35%,80%{transform:scaleY(.25)}100%{transform:scaleY(1)}}
@keyframes fg{0%{opacity:0;transform:translate(10px,10px)}8%,22%{opacity:1;transform:translate(0,0)}28%,100%{opacity:0;transform:translate(10px,10px)}}
.ml{animation:ml 4s ease-in-out infinite;transform-box:view-box;transform-origin:200px 120px}
.mr{animation:mr 4s ease-in-out infinite;transform-box:view-box;transform-origin:200px 120px}
.lf{animation:lf 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.fg{animation:fg 4s ease-in-out infinite}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="160" y="226" width="80" height="14" rx="4" fill="#C97B4A" stroke="#2B2F4A" stroke-width="3" /><path d="M200 226L200 120" stroke="#5BAF55" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" /><g class="ml"><path d="M200 120L90 78" stroke="#5BAF55" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><g class="lf"><ellipse cx="186" cy="105" rx="6" ry="12" fill="#7CCB6B" stroke="#2B2F4A" stroke-width="1.5" /><ellipse cx="186" cy="123" rx="6" ry="12" fill="#7CCB6B" stroke="#2B2F4A" stroke-width="1.5" /></g><g class="lf"><ellipse cx="164" cy="97" rx="6" ry="12" fill="#7CCB6B" stroke="#2B2F4A" stroke-width="1.5" /><ellipse cx="164" cy="115" rx="6" ry="12" fill="#7CCB6B" stroke="#2B2F4A" stroke-width="1.5" /></g><g class="lf"><ellipse cx="142" cy="89" rx="6" ry="12" fill="#7CCB6B" stroke="#2B2F4A" stroke-width="1.5" /><ellipse cx="142" cy="107" rx="6" ry="12" fill="#7CCB6B" stroke="#2B2F4A" stroke-width="1.5" /></g><g class="lf"><ellipse cx="120" cy="81" rx="6" ry="12" fill="#7CCB6B" stroke="#2B2F4A" stroke-width="1.5" /><ellipse cx="120" cy="99" rx="6" ry="12" fill="#7CCB6B" stroke="#2B2F4A" stroke-width="1.5" /></g><g class="lf"><ellipse cx="98" cy="73" rx="6" ry="12" fill="#7CCB6B" stroke="#2B2F4A" stroke-width="1.5" /><ellipse cx="98" cy="91" rx="6" ry="12" fill="#7CCB6B" stroke="#2B2F4A" stroke-width="1.5" /></g></g><g class="mr"><path d="M200 120L310 78" stroke="#5BAF55" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><g class="lf"><ellipse cx="214" cy="105" rx="6" ry="12" fill="#7CCB6B" stroke="#2B2F4A" stroke-width="1.5" /><ellipse cx="214" cy="123" rx="6" ry="12" fill="#7CCB6B" stroke="#2B2F4A" stroke-width="1.5" /></g><g class="lf"><ellipse cx="236" cy="97" rx="6" ry="12" fill="#7CCB6B" stroke="#2B2F4A" stroke-width="1.5" /><ellipse cx="236" cy="115" rx="6" ry="12" fill="#7CCB6B" stroke="#2B2F4A" stroke-width="1.5" /></g><g class="lf"><ellipse cx="258" cy="89" rx="6" ry="12" fill="#7CCB6B" stroke="#2B2F4A" stroke-width="1.5" /><ellipse cx="258" cy="107" rx="6" ry="12" fill="#7CCB6B" stroke="#2B2F4A" stroke-width="1.5" /></g><g class="lf"><ellipse cx="280" cy="81" rx="6" ry="12" fill="#7CCB6B" stroke="#2B2F4A" stroke-width="1.5" /><ellipse cx="280" cy="99" rx="6" ry="12" fill="#7CCB6B" stroke="#2B2F4A" stroke-width="1.5" /></g><g class="lf"><ellipse cx="302" cy="73" rx="6" ry="12" fill="#7CCB6B" stroke="#2B2F4A" stroke-width="1.5" /><ellipse cx="302" cy="91" rx="6" ry="12" fill="#7CCB6B" stroke="#2B2F4A" stroke-width="1.5" /></g></g><g class="fg"><path d="M70 62Q50 50 54 40" stroke="#2B2F4A" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" /><path d="M70 62Q50 50 54 40" stroke="#FFE0C2" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none" /><circle cx="74" cy="66" r="9" fill="#FFE0C2" stroke="#2B2F4A" stroke-width="2.5" /></g><text x="200" y="22" font-family="sans-serif" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold">Touch the tip: leaves fold and droop quickly</text><text x="300" y="200" font-family="sans-serif" font-size="12" fill="#3FA34D" text-anchor="middle" font-weight="bold">No growth involved</text>
</svg>
