<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Before touch the cells at the base of a sensitive plant leaf are swollen with water; after touch water leaves, the cells shrink and the leaf droops</title>
<style>
text{font-family:sans-serif}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes dr{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(0,40px);opacity:0}}
.dr1{animation:dr 2s linear infinite}.dr2{animation:dr 2s linear .6s infinite}.dr3{animation:dr 2s linear 1.2s infinite}
@keyframes ar{0%,100%{opacity:.4}50%{opacity:1}}
.ar{animation:ar 1.5s ease-in-out infinite}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M60 60L60 120" stroke="#5BAF55" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" /><path d="M60 60Q30 30 18 50" stroke="#5BAF55" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" /><ellipse cx="24" cy="46" rx="12" ry="6" fill="#7CCB6B" stroke="#2B2F4A" stroke-width="2" /><ellipse cx="96" cy="46" rx="12" ry="6" fill="#7CCB6B" stroke="#2B2F4A" stroke-width="2" /><path d="M60 60Q90 30 102 50" stroke="#5BAF55" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" /><circle cx="34" cy="150" r="22" fill="#BFE3F7" stroke="#2B2F4A" stroke-width="3" /><circle cx="28" cy="144" r="3" fill="#0B93D4" stroke="#0B93D4" stroke-width="1" /><circle cx="40" cy="154" r="3" fill="#0B93D4" stroke="#0B93D4" stroke-width="1" /><circle cx="86" cy="150" r="22" fill="#BFE3F7" stroke="#2B2F4A" stroke-width="3" /><circle cx="80" cy="144" r="3" fill="#0B93D4" stroke="#0B93D4" stroke-width="1" /><circle cx="92" cy="154" r="3" fill="#0B93D4" stroke="#0B93D4" stroke-width="1" /><text x="60" y="200" font-family="sans-serif" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold">Touch not yet felt:</text><text x="60" y="216" font-family="sans-serif" font-size="12" fill="#0B93D4" text-anchor="middle" font-weight="bold">cells full of water</text><path d="M130 130L170 130" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" fill="none" class="ar" /><path d="M162.1 134.3L170 130L162.1 125.7" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M300 80L300 120" stroke="#5BAF55" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" /><path d="M300 84Q270 110 262 130" stroke="#5BAF55" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" /><path d="M300 84Q330 110 338 130" stroke="#5BAF55" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" /><ellipse cx="260" cy="136" rx="12" ry="6" fill="#7CCB6B" stroke="#2B2F4A" stroke-width="2" transform="rotate(60 260 136)"/><ellipse cx="340" cy="136" rx="12" ry="6" fill="#7CCB6B" stroke="#2B2F4A" stroke-width="2" transform="rotate(-60 340 136)"/><circle cx="276" cy="160" r="11" fill="#BFE3F7" stroke="#2B2F4A" stroke-width="3" /><circle cx="324" cy="160" r="11" fill="#BFE3F7" stroke="#2B2F4A" stroke-width="3" /><circle cx="276" cy="176" r="3.5" fill="#0B93D4" stroke="#fff" stroke-width="1" class="dr1"/><circle cx="324" cy="176" r="3.5" fill="#0B93D4" stroke="#fff" stroke-width="1" class="dr2"/><circle cx="300" cy="176" r="3.5" fill="#0B93D4" stroke="#fff" stroke-width="1" class="dr3"/><text x="300" y="206" font-family="sans-serif" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold">Water leaves cells:</text><text x="300" y="222" font-family="sans-serif" font-size="12" fill="#E5484D" text-anchor="middle" font-weight="bold">they shrink and leaf droops</text>
</svg>
