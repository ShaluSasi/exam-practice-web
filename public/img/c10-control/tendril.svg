<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A pea tendril coiling round a support because the side touching it grows more slowly than the far side</title>
<style>
text{font-family:sans-serif}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes cl{0%,8%{opacity:0}25%,88%{opacity:1}100%{opacity:0}}
.c0{animation:cl 4s ease-out 0.0s infinite}.c1{animation:cl 4s ease-out 0.45s infinite}.c2{animation:cl 4s ease-out 0.9s infinite}.c3{animation:cl 4s ease-out 1.35s infinite}.c4{animation:cl 4s ease-out 1.8s infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="238" y="10" width="26" height="224" rx="6" fill="#B07A4A" stroke="#2B2F4A" stroke-width="3" /><path d="M60 232L60 160" stroke="#5BAF55" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none" /><ellipse cx="40" cy="200" rx="14" ry="6" fill="#7CCB6B" stroke="#2B2F4A" stroke-width="2" /><ellipse cx="82" cy="196" rx="14" ry="6" fill="#7CCB6B" stroke="#2B2F4A" stroke-width="2" /><path d="M60 160C100 150 160 120 232 112" stroke="#5BAF55" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><g class="c0"><path d="M264 120L238 138" stroke="#5BAF55" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><path d="M238 114L264 128" stroke="#2E7D32" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" /></g><g class="c1"><path d="M264 146L238 164" stroke="#5BAF55" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><path d="M238 140L264 154" stroke="#2E7D32" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" /></g><g class="c2"><path d="M264 172L238 190" stroke="#5BAF55" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><path d="M238 166L264 180" stroke="#2E7D32" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" /></g><g class="c3"><path d="M264 198L238 216" stroke="#5BAF55" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><path d="M238 192L264 206" stroke="#2E7D32" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" /></g><g class="c4"><path d="M264 224L238 242" stroke="#5BAF55" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><path d="M238 218L264 232" stroke="#2E7D32" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" /></g><text x="330" y="76" font-family="sans-serif" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold">Side touching the</text><text x="330" y="92" font-family="sans-serif" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold">support grows slowly</text><path d="M300 98L268 120" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" fill="none" /><path d="M272.1 112.0L268 120L277.0 119.1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="330" y="214" font-family="sans-serif" font-size="12" fill="#3FA34D" text-anchor="middle" font-weight="bold">Far side grows faster</text><text x="110" y="100" font-family="sans-serif" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold">Pea plant tendril</text>
</svg>
