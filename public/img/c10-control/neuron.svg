="round" fill="none" /><path d="M330 120L366 148" stroke="#7C5CFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" /><circle cx="368" cy="90" r="8" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="374" cy="120" r="8" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="368" cy="150" r="8" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" /><circle class="imp" cx="30" cy="70" r="7" fill="#FF8A1F" stroke="#fff" stroke-width="2"/>
