<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A neuron with branched dendrites, a cell body with nucleus, a long axon with myelin sheath and axon terminals while an impulse travels along it</title>
<style>
text{font-family:sans-serif}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes imp{0%{transform:translate(0px,0px);opacity:0}4%{transform:translate(0px,0px);opacity:1}20.0%{transform:translate(54px,38px)}33.4%{transform:translate(108px,50px)}79.8%{transform:translate(300px,50px)}90.0%{transform:translate(342px,50px)}94%{transform:translate(342px,50px);opacity:1}98%,100%{transform:translate(342px,50px);opacity:0}}
.imp{animation:imp 3.5s linear 0s infinite}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
