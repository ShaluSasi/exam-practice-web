<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A root growing sideways through soil towards a patch of wet soil</title>
<style>
text{font-family:sans-serif}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes gr{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.gw{stroke-dasharray:100;animation:gr 3.5s ease-out infinite}
@keyframes wd{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(-80px,0);opacity:0}}
.w1{animation:wd 2.4s linear infinite}.w2{animation:wd 2.4s linear .8s infinite}.w3{animation:wd 2.4s linear 1.6s infinite}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="0" y="60" width="400" height="180" rx="0" fill="#C9A27A" stroke="#C9A27A" stroke-width="0" /><path d="M0 60L400 60" stroke="#8A6A45" stroke-width="3" stroke-linecap="round" fill="none" /><path d="M300 150Q310 110 350 120Q390 140 370 190Q330 220 300 190Q290 170 300 150Z" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="#8FD0F2" /><text x="338" y="160" font-family="sans-serif" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold">Wet soil</text><ellipse cx="80" cy="70" rx="12" ry="8" fill="#E6B77A" stroke="#2B2F4A" stroke-width="2.5" /><path d="M80 78C84 120 130 150 270 160" stroke="#8A6A45" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none" pathLength="100" class="gw"/><path d="M80 78C84 120 130 150 270 160" stroke="#F3E9D8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" pathLength="100" class="gw"/><path d="M80 66Q70 40 84 20" stroke="#5BAF55" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" /><circle cx="296" cy="150" r="4" fill="#0B93D4" stroke="#fff" stroke-width="1.5" class="w1"/><circle cx="296" cy="170" r="4" fill="#0B93D4" stroke="#fff" stroke-width="1.5" class="w2"/><circle cx="296" cy="160" r="4" fill="#0B93D4" stroke="#fff" stroke-width="1.5" class="w3"/><text x="120" y="228" font-family="sans-serif" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold">Root grows towards the water</text>
</svg>
