<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A shoot with light shining from the right; auxin made at the tip moves down the shaded left side where cells grow longer</title>
<style>
text{font-family:sans-serif}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes ad{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(0,120px);opacity:0}}
.ad1{animation:ad 3s linear infinite}.ad2{animation:ad 3s linear 1s infinite}.ad3{animation:ad 3s linear 2s infinite}
@keyframes fw{to{stroke-dashoffset:-28}}
.ray{stroke-dasharray:8 6;animation:fw .9s linear infinite}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
