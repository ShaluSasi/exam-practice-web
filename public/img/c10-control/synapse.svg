<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Two neurons at a synapse: chemical messengers leave the axon end, cross the gap and start an impulse in the next neuron's dendrite</title>
<style>
text{font-family:sans-serif}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes ves{0%,20%{transform:translate(0,0);opacity:0}25%{opacity:1}70%{transform:translate(48px,0);opacity:1}85%,100%{transform:translate(48px,0);opacity:0}}
.v1{animation:ves 3s linear infinite}.v2{animation:ves 3s linear .4s infinite}.v3{animation:ves 3s linear .8s infinite}
@keyframes imp2{0%{transform:translate(0,0);opacity:0}5%{opacity:1}40%{transform:translate(110px,0)}95%{opacity:1}100%{transform:translate(110px,0);opacity:0}}
.i1{animation:imp2 3s linear infinite}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M10 120L100 120" stroke="#7C5CFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" /><path d="M100 74Q100 60 120 60L168 60Q178 60 178 74L178 166Q178 180 168 180L120 180Q100 180 100 166Z" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="#FFE3C2" /><path d="M222 60L340 60Q350 60 350 74L350 166Q350 180 340 180L222 180Z" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="#EFEAFF" /><path d="M350 120L395 120" stroke="#7C5CFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" /><circle cx="118" cy="90" r="6" fill="#FFD166" stroke="#2B2F4A" stroke-width="2" /><circle cx="135" cy="125" r="6" fill="#FFD166" stroke="#2B2F4A" stroke-width="2" /><circle cx="125" cy="155" r="6" fill="#FFD166" stroke="#2B2F4A" stroke-width="2" /><circle cx="150" cy="100" r="6" fill="#FFD166" stroke="#2B2F4A" stroke-width="2" /><path d="M222 78Q232 88 222 98" stroke="#3FA34D" stroke-width="4" fill="none"/><path d="M222 110Q232 120 222 130" stroke="#3FA34D" stroke-width="4" fill="none"/><path d="M222 142Q232 152 222 162" stroke="#3FA34D" stroke-width="4" fill="none"/><circle cx="172" cy="100" r="5" fill="#FFD166" stroke="#2B2F4A" stroke-width="2" class="v1"/><circle cx="172" cy="130" r="5" fill="#FFD166" stroke="#2B2F4A" stroke-width="2" class="v2"/><circle cx="172" cy="158" r="5" fill="#FFD166" stroke="#2B2F4A" stroke-width="2" class="v3"/><circle cx="30" cy="120" r="6" fill="#FF8A1F" stroke="#fff" stroke-width="2" class="i1"/><text x="139" y="40" font-family="sans-serif" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold">Axon end</text><text x="200" y="200" font-family="sans-serif" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold">Synapse (gap)</text><text x="286" y="40" font-family="sans-serif" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold">Dendrite of next neuron</text><text x="139" y="222" font-family="sans-serif" font-size="11" fill="#3FA34D" text-anchor="middle" font-weight="bold">Chemicals released</text><text x="300" y="222" font-family="sans-serif" font-size="11" fill="#3FA34D" text-anchor="middle" font-weight="bold">Electrical impulse starts again</text>
</svg>
