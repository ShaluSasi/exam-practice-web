<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A sunflower head slowly turning to follow the sun across the sky from morning to evening</title>
<style>
text{font-family:sans-serif}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes sn{0%{transform:translate(0px,0px);opacity:0}4%{transform:translate(0px,0px);opacity:1}19.7%{transform:translate(40px,-56px)}33.2%{transform:translate(90px,-88px)}47.0%{transform:translate(150px,-98px)}60.8%{transform:translate(210px,-88px)}74.3%{transform:translate(260px,-56px)}90.0%{transform:translate(300px,0px)}94%{transform:translate(300px,0px);opacity:1}98%,100%{transform:translate(300px,0px);opacity:0}}
.sn{animation:sn 8s linear 0s infinite}
@keyframes tl{0%{transform:rotate(-38deg)}100%{transform:rotate(38deg)}}
.tl{animation:tl 8s linear infinite;transform-box:view-box;transform-origin:200px 190px}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M50 140Q200 -40 350 140" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-dasharray="6 6"/><rect x="0" y="222" width="400" height="18" rx="0" fill="#9BCB7A" stroke="#2B2F4A" stroke-width="0" /><path d="M200 222L200 190" stroke="#5BAF55" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" /><g class="tl"><path d="M200 190L200 160" stroke="#5BAF55" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" /><ellipse cx="200.0" cy="120.0" rx="9" ry="5" fill="#FFD166" stroke="#FF8A1F" stroke-width="1.5" transform="rotate(0 200.0 120.0)"/><ellipse cx="215.0" cy="124.01923788646684" rx="9" ry="5" fill="#FFD166" stroke="#FF8A1F" stroke-width="1.5" transform="rotate(30 215.0 124.01923788646684)"/><ellipse cx="225.98076211353316" cy="135.0" rx="9" ry="5" fill="#FFD166" stroke="#FF8A1F" stroke-width="1.5" transform="rotate(60 225.98076211353316 135.0)"/><ellipse cx="230.0" cy="150.0" rx="9" ry="5" fill="#FFD166" stroke="#FF8A1F" stroke-width="1.5" transform="rotate(90 230.0 150.0)"/><ellipse cx="225.98076211353316" cy="165.0" rx="9" ry="5" fill="#FFD166" stroke="#FF8A1F" stroke-width="1.5" transform="rotate(120 225.98076211353316 165.0)"/><ellipse cx="215.0" cy="175.98076211353316" rx="9" ry="5" fill="#FFD166" stroke="#FF8A1F" stroke-width="1.5" transform="rotate(150 215.0 175.98076211353316)"/><ellipse cx="200.0" cy="180.0" rx="9" ry="5" fill="#FFD166" stroke="#FF8A1F" stroke-width="1.5" transform="rotate(180 200.0 180.0)"/><ellipse cx="185.0" cy="175.98076211353316" rx="9" ry="5" fill="#FFD166" stroke="#FF8A1F" stroke-width="1.5" transform="rotate(210 185.0 175.98076211353316)"/><ellipse cx="174.01923788646684" cy="165.0" rx="9" ry="5" fill="#FFD166" stroke="#FF8A1F" stroke-width="1.5" transform="rotate(240 174.01923788646684 165.0)"/><ellipse cx="170.0" cy="150.0" rx="9" ry="5" fill="#FFD166" stroke="#FF8A1F" stroke-width="1.5" transform="rotate(270 170.0 150.0)"/><ellipse cx="174.01923788646684" cy="135.0" rx="9" ry="5" fill="#FFD166" stroke="#FF8A1F" stroke-width="1.5" transform="rotate(300 174.01923788646684 135.0)"/><ellipse cx="185.0" cy="124.01923788646684" rx="9" ry="5" fill="#FFD166" stroke="#FF8A1F" stroke-width="1.5" transform="rotate(330 185.0 124.01923788646684)"/><circle cx="200" cy="150" r="20" fill="#8A5A2B" stroke="#2B2F4A" stroke-width="3" /></g><circle cx="50" cy="140" r="15" fill="#FFD166" stroke="#FF8A1F" stroke-width="3" class="sn"/><text x="60" y="178" font-family="sans-serif" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold">Morning</text><text x="340" y="178" font-family="sans-serif" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold">Evening</text><text x="200" y="16" font-family="sans-serif" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold">Sunflower head follows the sun slowly</text>
</svg>
