<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A nerve impulse reaches a muscle fibre and the muscle cell shortens as its proteins rearrange</title>
<style>
text{font-family:sans-serif}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes mc{0%,40%{transform:scale(1,1)}55%,85%{transform:scale(.62,1.35)}100%{transform:scale(1,1)}}
.mf{animation:mc 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
@keyframes nv{0%{transform:translate(0px,0px);opacity:0}4%{transform:translate(0px,0px);opacity:1}63.5%{transform:translate(90px,0px)}90.0%{transform:translate(90px,40px)}94%{transform:translate(90px,40px);opacity:1}98%,100%{transform:translate(90px,40px);opacity:0}}
.nv{animation:nv 3s linear 0s infinite}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M30 40L120 40Q130 40 130 56L130 80" stroke="#7C5CFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" /><circle cx="130" cy="86" r="10" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" /><g class="mf"><rect x="60" y="110" width="260" height="70" rx="34" fill="#F08A8A" stroke="#2B2F4A" stroke-width="3" /><path d="M90 118L90 172" stroke="#C94F5A" stroke-width="3" stroke-linecap="round" fill="none" /><path d="M114 118L114 172" stroke="#C94F5A" stroke-width="3" stroke-linecap="round" fill="none" /><path d="M138 118L138 172" stroke="#C94F5A" stroke-width="3" stroke-linecap="round" fill="none" /><path d="M162 118L162 172" stroke="#C94F5A" stroke-width="3" stroke-linecap="round" fill="none" /><path d="M186 118L186 172" stroke="#C94F5A" stroke-width="3" stroke-linecap="round" fill="none" /><path d="M210 118L210 172" stroke="#C94F5A" stroke-width="3" stroke-linecap="round" fill="none" /><path d="M234 118L234 172" stroke="#C94F5A" stroke-width="3" stroke-linecap="round" fill="none" /><path d="M258 118L258 172" stroke="#C94F5A" stroke-width="3" stroke-linecap="round" fill="none" /><path d="M282 118L282 172" stroke="#C94F5A" stroke-width="3" stroke-linecap="round" fill="none" /></g><circle cx="40" cy="40" r="6" fill="#FF8A1F" stroke="#fff" stroke-width="2" class="nv"/><text x="250" y="60" font-family="sans-serif" font-size="12" fill="#7C5CFF" text-anchor="middle" font-weight="bold">Nerve impulse arrives</text><text x="190" y="212" font-family="sans-serif" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold">Muscle cell shortens and gets fatter</text><text x="190" y="230" font-family="sans-serif" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="bold">(proteins change shape and arrangement)</text>
</svg>
