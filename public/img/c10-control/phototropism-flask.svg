<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Bean seedlings on a flask inside a box open towards a window: shoots bend towards the light and roots bend away from it</title>
<style>
text{font-family:sans-serif}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes fw{to{stroke-dashoffset:-28}}
.ray{stroke-dasharray:8 6;animation:fw .9s linear infinite}
@keyframes sw{0%,100%{transform:rotate(0)}50%{transform:rotate(2deg)}}
.sh{animation:sw 3s ease-in-out infinite;transform-box:view-box;transform-origin:170px 128px}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
