<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>The brain and spinal cord with cranial nerves and spinal nerves branching out to the body</title>
<style>
text{font-family:sans-serif}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes ps1{0%{transform:translate(0px,0px);opacity:0}4%{transform:translate(0px,0px);opacity:1}57.4%{transform:translate(-40px,70px)}90.0%{transform:translate(-60px,115px)}94%{transform:translate(-60px,115px);opacity:1}98%,100%{transform:translate(-60px,115px);opacity:0}}
.ps1{animation:ps1 2.8s linear 0s infinite}
@keyframes ps2{0%{transform:translate(0px,0px);opacity:0}4%{transform:translate(0px,0px);opacity:1}57.4%{transform:translate(40px,70px)}90.0%{transform:translate(60px,115px)}94%{transform:translate(60px,115px);opacity:1}98%,100%{transform:translate(60px,115px);opacity:0}}
.ps2{animation:ps2 2.8s linear 0.8s infinite}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="200" cy="40" r="24" fill="#FFB3C1" stroke="#2B2F4A" stroke-width="3" /><rect x="194" y="64" width="12" height="130" rx="5" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" /><path d="M200 60L130 90L98 130" stroke="#0B93D4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" /><path d="M200 90L140 110L104 180" stroke="#0B93D4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" /><path d="M200 120L128 140L92 220" stroke="#0B93D4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" /><path d="M200 60L270 90L302 130" stroke="#0B93D4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" /><path d="M200 90L260 110L296 180" stroke="#0B93D4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" /><path d="M200 120L272 140L308 220" stroke="#0B93D4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" /><path d="M186 46L150 30" stroke="#0B93D4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" /><path d="M214 46L250 30" stroke="#0B93D4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" /><circle cx="150" cy="100" r="6" fill="#FFD166" stroke="#fff" stroke-width="2" class="ps1"/><circle cx="250" cy="100" r="6" fill="#FFD166" stroke="#fff" stroke-width="2" class="ps2"/><text x="200" y="14" font-family="sans-serif" font-size="12" fill="#C2425E" text-anchor="middle" font-weight="bold">Brain</text><text x="20" y="50" font-family="sans-serif" font-size="12" fill="#0B93D4" text-anchor="start" font-weight="bold">Cranial nerves</text><text x="20" y="66" font-family="sans-serif" font-size="11" fill="#0B93D4" text-anchor="start" font-weight="bold">(from the brain)</text><text x="380" y="50" font-family="sans-serif" font-size="12" fill="#0B93D4" text-anchor="end" font-weight="bold">Spinal nerves</text><text x="380" y="66" font-family="sans-serif" font-size="11" fill="#0B93D4" text-anchor="end" font-weight="bold">(from the cord)</text><text x="200" y="224" font-family="sans-serif" font-size="12" fill="#C46A00" text-anchor="middle" font-weight="bold">Spinal cord</text>
</svg>
