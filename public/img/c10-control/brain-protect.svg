<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>The brain sits inside a bony skull and a fluid-filled balloon; the spinal cord runs inside the vertebral column</title>
<style>
text{font-family:sans-serif}
.pulse{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes rp{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.rp{animation:rp 2s ease-out infinite;transform-box:fill-box;transform-origin:center}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g transform="translate(-30,0)"><ellipse cx="150" cy="100" rx="100" ry="82" fill="#EDE0C8" stroke="#2B2F4A" stroke-width="3" /><ellipse cx="150" cy="100" rx="86" ry="68" fill="#BFE3F7" stroke="#2B2F4A" stroke-width="2.5" /><ellipse cx="150" cy="100" rx="70" ry="52" fill="#FFC7D1" stroke="#2B2F4A" stroke-width="2.5" /><path d="M110 90Q130 70 150 90T190 88" stroke="#E58FA2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" /><path d="M112 116Q132 98 152 116T192 112" stroke="#E58FA2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" /><rect x="238" y="160" width="40" height="16" rx="6" fill="#EDE0C8" stroke="#2B2F4A" stroke-width="3" /><rect x="241" y="180" width="40" height="16" rx="6" fill="#EDE0C8" stroke="#2B2F4A" stroke-width="3" /><rect x="244" y="200" width="40" height="16" rx="6" fill="#EDE0C8" stroke="#2B2F4A" stroke-width="3" /><rect x="247" y="220" width="40" height="16" rx="6" fill="#EDE0C8" stroke="#2B2F4A" stroke-width="3" /><rect x="254" y="150" width="8" height="84" rx="3" fill="#FFD166" stroke="#2B2F4A" stroke-width="2" /></g><circle class="rp" cx="26" cy="100" r="14" fill="none" stroke="#E5484D" stroke-width="4"/><text x="30" y="140" font-family="sans-serif" font-size="11" fill="#E5484D" text-anchor="middle" font-weight="bold">Shock</text><text x="262" y="50" font-family="sans-serif" font-size="12" fill="#2B2F4A" text-anchor="start" font-weight="bold">Skull (bony box)</text><path d="M258 46L208 76" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" fill="none" /><text x="262" y="96" font-family="sans-serif" font-size="11" fill="#0B93D4" text-anchor="start" font-weight="bold">Fluid-filled balloon</text><path d="M258 92L196 104" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" fill="none" /><text x="190" y="22" font-family="sans-serif" font-size="12" fill="#C2425E" text-anchor="start" font-weight="bold">Brain</text><path d="M186 18L150 60" stroke="#C2425E" stroke-width="2" stroke-linecap="round" fill="none" /><text x="270" y="196" font-family="sans-serif" font-size="11" fill="#2B2F4A" text-anchor="start" font-weight="bold">Vertebral column</text><path d="M266 192L256 184" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" fill="none" /><text x="270" y="226" font-family="sans-serif" font-size="11" fill="#B8860B" text-anchor="start" font-weight="bold">Spinal cord</text><path d="M266 222L236 214" stroke="#B8860B" stroke-width="2" stroke-linecap="round" fill="none" />
</svg>
