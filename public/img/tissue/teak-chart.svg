<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img">
<title>Bar chart of a teak tree's trunk diameter at different ages</title>
<style>
.bar{transform-box:fill-box;transform-origin:center bottom;animation:gr 8s ease-out infinite}
@keyframes gr{0%{transform:scaleY(0)}12%,100%{transform:scaleY(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M62 236H384M62 191H384M62 146H384M62 101H384M62 56H384" stroke="#E6DCC8" stroke-width="1.2"/>
<g fill="#D9A066" stroke="#8C5A35" stroke-width="2"><rect class="bar" style="animation-delay:0.00s" x="75" y="218" width="34" height="18.0" rx="4"/><rect class="bar" style="animation-delay:0.12s" x="131" y="200" width="34" height="36.0" rx="4"/><rect class="bar" style="animation-delay:0.24s" x="187" y="128" width="34" height="108.0" rx="4"/><rect class="bar" style="animation-delay:0.36s" x="243" y="110" width="34" height="126.0" rx="4"/><rect class="bar" style="animation-delay:0.48s" x="299" y="92" width="34" height="144.0" rx="4"/><rect class="bar" style="animation-delay:0.60s" x="355" y="56" width="34" height="180.0" rx="4"/></g>
<path d="M62 50V236H386" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/>
