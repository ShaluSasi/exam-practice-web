<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" role="img">
<title>A bathroom weighing scale reading 50 kg</title>
<style>
.ft{transform-box:fill-box;transform-origin:center;animation:pr 2.4s ease-in-out infinite}
@keyframes pr{0%,100%{transform:scale(1)}50%{transform:scale(.95)}}
.dg{animation:bl 2.4s steps(1) infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.75}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="56" y="34" width="188" height="168" rx="28" fill="#E8EEF5" stroke="#6B7A99" stroke-width="3"/>
<rect x="66" y="44" width="168" height="148" rx="22" fill="#F5F8FC" stroke="#B9C4D6" stroke-width="2"/>
<rect x="104" y="54" width="92" height="40" rx="8" fill="#DFF5E1" stroke="#4E8F2A" stroke-width="2.5"/>
<g class="dg"><text x="150" y="82" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#2B2F4A" text-anchor="middle">50 kg</text></g>
<g class="ft" fill="#CBD5E1" stroke="#8A97AE" stroke-width="2">
<path d="M104 124C96 124 92 136 94 156C96 174 104 182 112 180C120 178 124 168 122 150C120 132 114 124 104 124Z"/>
<path d="M196 124C204 124 208 136 206 156C204 174 196 182 188 180C180 178 176 168 178 150C180 132 186 124 196 124Z"/></g>
<g fill="#CBD5E1" stroke="#8A97AE" stroke-width="1.5"><circle cx="100" cy="114" r="3.5"/><circle cx="108" cy="112" r="3"/><circle cx="115" cy="114" r="2.6"/><circle cx="200" cy="114" r="3.5"/><circle cx="192" cy="112" r="3"/><circle cx="185" cy="114" r="2.6"/></g>
</svg>
