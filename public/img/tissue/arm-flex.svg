<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" role="img">
<title>An arm bending at the elbow</title>
<style>
.fa{transform-box:view-box;transform-origin:110px 160px;animation:fa 4s ease-in-out infinite}
@keyframes fa{0%,10%,100%{transform:rotate(0)}45%,60%{transform:rotate(-58deg)}}
.bi{transform-box:fill-box;transform-origin:center;animation:bi 4s ease-in-out infinite}
@keyframes bi{0%,10%,100%{transform:scale(1,1)}45%,60%{transform:scale(1.35,.9)}}
.ns{animation:ns 4s ease-in infinite}
@keyframes ns{0%{transform:translate(0,0);opacity:0}4%{opacity:1}12%{transform:translate(44px,46px);opacity:1}16%,100%{transform:translate(44px,46px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="80" y="14" width="60" height="164" rx="28" fill="#F7DCC6" stroke="#E0B494" stroke-width="2"/>
