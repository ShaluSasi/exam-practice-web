<g class="fa"><rect x="92" y="142" width="172" height="36" rx="18" fill="#F7DCC6" stroke="#E0B494" stroke-width="2"/><path d="M118 160H250" fill="none" stroke="#B9A27A" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M118 160H250" fill="none" stroke="#F5EBD7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M134 136L146 156" stroke="#C9A43A" stroke-width="7" stroke-linecap="round"/><path d="M134 136L146 156" stroke="#F2D16B" stroke-width="4" stroke-linecap="round"/>
<circle cx="266" cy="161" r="14" fill="#F2C1A0" stroke="#D9967A" stroke-width="2.5"/></g>
<circle cx="110" cy="158" r="9" fill="#F5EBD7" stroke="#B9A27A" stroke-width="3"/>
<ellipse class="bi" cx="128" cy="90" rx="11" ry="46" fill="#E57373" stroke="#B94A4A" stroke-width="3"/>
