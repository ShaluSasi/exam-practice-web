<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img">
<title>A moving joint between two bones</title>
<style>
.mv{animation:mv 3s ease-in-out infinite}
@keyframes mv{0%,100%{transform:translate(-22px,-3px)}25%,75%{transform:translate(0,0)}50%{transform:translate(22px,-3px)}}
.cap{transform-box:fill-box;transform-origin:center;animation:cp 3s ease-in-out infinite}
@keyframes cp{0%,100%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="56" y="104" width="48" height="44" rx="10" fill="#F5EBD7" stroke="#B9A27A" stroke-width="3"/>
<path d="M46 80A34 12 0 0 1 114 80" fill="none" stroke="#B9A27A" stroke-width="12"/><path d="M46 80A34 12 0 0 1 114 80" fill="none" stroke="#F5EBD7" stroke-width="8"/>
<rect x="72" y="46" width="16" height="62" rx="8" fill="#F5EBD7" stroke="#B9A27A" stroke-width="3"/>
<path d="M46 80A34 12 0 0 0 114 80" fill="none" stroke="#B9A27A" stroke-width="12"/><path d="M46 80A34 12 0 0 0 114 80" fill="none" stroke="#F5EBD7" stroke-width="8"/>
<g class="mv"><circle cx="80" cy="92" r="6" fill="#E57373" stroke="#B94A4A" stroke-width="2"/></g>
<path class="cap" d="M50 30Q80 14 110 30" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 5"/>
</svg>
