<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img">
<title>A cross-section disc of a tree trunk showing rings</title>
<style>
.rg{transform-box:fill-box;transform-origin:center;animation:rg 6s ease-out infinite}
@keyframes rg{0%{transform:scale(.3);opacity:0}12%,80%{transform:scale(1);opacity:1}95%,100%{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<defs><radialGradient id="wd"><stop offset="0" stop-color="#F8E4B8"/><stop offset="1" stop-color="#EBC98A"/></radialGradient></defs>
<circle cx="150" cy="150" r="128" fill="#8C5A35" stroke="#5E3A20" stroke-width="3"/>
<circle cx="150" cy="150" r="124" fill="none" stroke="#6E4528" stroke-width="5" stroke-dasharray="4 7"/>
<circle cx="150" cy="150" r="110" fill="url(#wd)" stroke="#A8743E" stroke-width="2"/>
<g fill="none" stroke="#B57B3E" stroke-width="3"><circle class="rg" style="animation-delay:0.0s" cx="150" cy="150" r="16"/><circle class="rg" style="animation-delay:0.5s" cx="150" cy="150" r="34"/><circle class="rg" style="animation-delay:1.0s" cx="150" cy="150" r="54"/><circle class="rg" style="animation-delay:1.5s" cx="150" cy="150" r="72"/><circle class="rg" style="animation-delay:2.0s" cx="150" cy="150" r="82"/><circle class="rg" style="animation-delay:2.5s" cx="150" cy="150" r="104"/></g>
<circle cx="150" cy="150" r="4" fill="#8C5A35"/>
<path d="M150 150L196 92" stroke="#C99A60" stroke-width="1.5" stroke-dasharray="2 4"/>
</svg>
