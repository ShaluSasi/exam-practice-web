<g class="mv"><path d="M88 84H148" fill="none" stroke="#B9A27A" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M88 84H148" fill="none" stroke="#F5EBD7" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M92 70A16 16 0 0 1 92 98" fill="none" stroke="#B9A27A" stroke-width="3"/></g>
<path d="M66 84A12 12 0 0 1 90 84" fill="none" stroke="#7FB6D1" stroke-width="4"/>
</svg>
