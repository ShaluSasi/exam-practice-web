<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" role="img">
<title>A conditional sentence split into word cards, each with a marker slot</title>
<style>
.L{fill:none;stroke-linecap:round;stroke-linejoin:round}.K{stroke:#2B2F4A}.o{stroke:#2B2F4A;stroke-width:2}
.sh{animation:sh 3s ease-in-out infinite}@keyframes sh{50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="12" y="20" width="376" height="134" rx="12" fill="#FFF3C4" stroke="#2B2F4A" stroke-width="2"/><g class="sh" style="animation-delay:0.0s"><rect x="18" y="38" width="66" height="36" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><circle cx="35" cy="56" r="11" fill="#FFF3C4" stroke="#A3A8CC" stroke-width="1.6" stroke-dasharray="3 3"/><text x="65" y="62" font-size="18" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">If</text></g><g class="sh" style="animation-delay:0.3s"><rect x="94" y="38" width="76" height="36" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><circle cx="111" cy="56" r="11" fill="#FFF3C4" stroke="#A3A8CC" stroke-width="1.6" stroke-dasharray="3 3"/><text x="146" y="62" font-size="18" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">you</text></g><g class="sh" style="animation-delay:0.6s"><rect x="180" y="38" width="86" height="36" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><circle cx="197" cy="56" r="11" fill="#FFF3C4" stroke="#A3A8CC" stroke-width="1.6" stroke-dasharray="3 3"/><text x="237" y="62" font-size="18" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">feel</text></g><g class="sh" style="animation-delay:0.9s"><rect x="276" y="38" width="106" height="36" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><circle cx="293" cy="56" r="11" fill="#FFF3C4" stroke="#A3A8CC" stroke-width="1.6" stroke-dasharray="3 3"/><text x="343" y="62" font-size="18" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">tired,</text></g><g class="sh" style="animation-delay:0.0s"><rect x="36" y="96" width="86" height="36" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><circle cx="53" cy="114" r="11" fill="#FFF3C4" stroke="#A3A8CC" stroke-width="1.6" stroke-dasharray="3 3"/><text x="93" y="120" font-size="18" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">take</text></g><g class="sh" style="animation-delay:0.3s"><rect x="132" y="96" width="116" height="36" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><circle cx="149" cy="114" r="11" fill="#FFF3C4" stroke="#A3A8CC" stroke-width="1.6" stroke-dasharray="3 3"/><text x="204" y="120" font-size="18" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">a short</text></g><g class="sh" style="animation-delay:0.6s"><rect x="258" y="96" width="106" height="36" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><circle cx="275" cy="114" r="11" fill="#FFF3C4" stroke="#A3A8CC" stroke-width="1.6" stroke-dasharray="3 3"/><text x="325" y="120" font-size="18" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">break.</text></g>
</svg>
