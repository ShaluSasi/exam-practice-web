.spin{animation:spin 4s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}.rs{animation:rs 4s ease-in-out infinite}@keyframes rs{50%{transform:translateY(-8px)}}.br{animation:br 3s ease-in-out infinite}@keyframes br{50%{transform:translate(10px,-4px)}}
