<g class="nt"><path d="M300 120V92l16 -4v26" stroke="#2B2F4A" stroke-width="2.5" fill="none"/><circle cx="296" cy="120" r="5" fill="#0B93D4"/><circle cx="312" cy="114" r="5" fill="#0B93D4"/></g>
