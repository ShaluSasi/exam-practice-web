<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" role="img">
<title>A tick card, a cross card and a question card</title>
<style>
.L{fill:none;stroke-linecap:round;stroke-linejoin:round}.K{stroke:#2B2F4A}.o{stroke:#2B2F4A;stroke-width:2}
.fp{animation:fp 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes fp{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M16 0H344Q360 0 360 16V200H0V16Q0 0 16 0Z" fill="#EEF3FF"/>
<g transform="rotate(-8 80 100)"><rect x="36" y="50" width="88" height="110" rx="10" fill="#DFF3E2" stroke="#2B2F4A" stroke-width="2"/><path d="M58 106L74 122L102 86" stroke="#3FA34D" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="fp"><rect x="136" y="40" width="88" height="120" rx="10" fill="#FFF3C4" stroke="#2B2F4A" stroke-width="2"/><text x="180" y="118" font-size="54" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">?</text></g>
<g transform="rotate(8 280 100)"><rect x="236" y="50" width="88" height="110" rx="10" fill="#FDE2E2" stroke="#2B2F4A" stroke-width="2"/><path d="M260 84L300 124M300 84L260 124" stroke="#E5484D" stroke-width="9" stroke-linecap="round"/></g>
</svg>
