<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>A vision board with five labelled sections and numbered markers</title>
<style>
.L{fill:none;stroke-linecap:round;stroke-linejoin:round}.K{stroke:#2B2F4A}.o{stroke:#2B2F4A;stroke-width:2}
.tw{animation:tw 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes tw{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}.bob{animation:bob 2.6s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.gl{animation:gl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes gl{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.75}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
