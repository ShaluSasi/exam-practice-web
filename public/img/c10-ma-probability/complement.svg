<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A sample space rectangle with event E inside a circle and the rest outside</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.e{animation:pu 3s ease-in-out infinite}@keyframes pu{50%{opacity:.45}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="30" y="36" width="340" height="170" rx="10" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" /><circle cx="150" cy="121" r="62" fill="#FFD9A8" stroke="#FF8A1F" stroke-width="4" class="e"/><text x="150" y="130" font-size="28" text-anchor="middle" fill="#2B2F4A" >E</text><text x="298" y="118" font-size="22" text-anchor="middle" fill="#2B2F4A" >not E</text><text x="298" y="140" font-size="13" text-anchor="middle" fill="#8A8FB0" >everything else</text><text x="200" y="26" font-size="14" text-anchor="middle" class="h" >All possible outcomes</text><text x="200" y="228" font-size="13" text-anchor="middle" class="h" >E and not E are complementary events</text></svg>
