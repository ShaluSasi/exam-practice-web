<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.cd{animation:cd 3s ease-in infinite}@keyframes cd{0%{transform:translateY(-22px);opacity:0}40%{opacity:1}70%,100%{transform:translateY(0);opacity:0}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
