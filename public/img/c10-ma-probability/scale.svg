<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A probability scale from 0 to 1 with marks at 0, 0.2, 0.5, 0.8 and 1</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.mk{animation:mk 5s ease-in-out infinite alternate}@keyframes mk{to{transform:translateX(320px)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="36" font-size="15" text-anchor="middle" class="h" >Probability scale</text><rect x="40" y="104" width="320" height="12" rx="6" fill="#CDEBFF" stroke="#2B2F4A" stroke-width="2.5"/><line x1="40" y1="98" x2="40" y2="122" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="40" y="148" font-size="15" text-anchor="middle" class="h" >0</text><line x1="104" y1="98" x2="104" y2="122" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="104" y="148" font-size="15" text-anchor="middle" class="h" >0.2</text><line x1="200" y1="98" x2="200" y2="122" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="200" y="148" font-size="15" text-anchor="middle" class="h" >0.5</text><line x1="296" y1="98" x2="296" y2="122" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="296" y="148" font-size="15" text-anchor="middle" class="h" >0.8</text><line x1="360" y1="98" x2="360" y2="122" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="360" y="148" font-size="15" text-anchor="middle" class="h" >1</text><g class="mk"><polygon points="34,84 46,84 40,97" fill="#2B2F4A"/></g><text x="200" y="196" font-size="13" text-anchor="middle" fill="#8A8FB0" class="h" >Every probability lies somewhere on this line</text></svg>
