<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>An arrow from least likely to most likely</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.ar{animation:ar 2.5s ease-in-out infinite alternate}@keyframes ar{to{transform:translateX(18px)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="40" y="100" width="300" height="14" rx="7" fill="#FFD9A8" stroke="#2B2F4A" stroke-width="2.5"/><g class="ar"><polygon points="340,90 360,107 340,124" fill="#2B2F4A"/></g><text x="60" y="150" font-size="14" text-anchor="middle" class="h" >least likely</text><text x="300" y="150" font-size="14" text-anchor="middle" class="h" >most likely</text><text x="200" y="56" font-size="14" text-anchor="middle" class="h" >Order events by how likely they are</text></svg>
