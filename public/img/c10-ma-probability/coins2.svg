<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Two different coins tossed together</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.f0{transform-origin:120px 112px;animation:fh 3s ease-in-out infinite;animation-delay:0.0s}.g0{transform-origin:120px 112px;animation:ft 3s ease-in-out infinite;animation-delay:0.0s}.f1{transform-origin:280px 112px;animation:fh 3s ease-in-out infinite;animation-delay:0.6s}.g1{transform-origin:280px 112px;animation:ft 3s ease-in-out infinite;animation-delay:0.6s}@keyframes fh{0%,10%{transform:scaleX(1)}25%,75%{transform:scaleX(0)}90%,100%{transform:scaleX(1)}}@keyframes ft{0%,25%{transform:scaleX(0);opacity:1}50%{transform:scaleX(1);opacity:1}75%,100%{transform:scaleX(0);opacity:1}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="28" font-size="15" text-anchor="middle" class="h" >Two coins are tossed together</text><g class="f0"><g ><circle cx="120" cy="112" r="44" fill="#FFC83D" stroke="#C98A00" stroke-width="3" /><circle cx="120" cy="112" r="34.3" fill="none" stroke="#C98A00" stroke-width="1.5" /><text x="120" y="126.5" font-size="44" text-anchor="middle" fill="#2B2F4A" >H</text></g></g><g class="g0" opacity="0"><g ><circle cx="120" cy="112" r="44" fill="#FFC83D" stroke="#C98A00" stroke-width="3" /><circle cx="120" cy="112" r="34.3" fill="none" stroke="#C98A00" stroke-width="1.5" /><text x="120" y="126.5" font-size="44" text-anchor="middle" fill="#2B2F4A" >T</text></g></g><g class="f1"><g ><circle cx="280" cy="112" r="44" fill="#FFC83D" stroke="#C98A00" stroke-width="3" /><circle cx="280" cy="112" r="34.3" fill="none" stroke="#C98A00" stroke-width="1.5" /><text x="280" y="126.5" font-size="44" text-anchor="middle" fill="#2B2F4A" >H</text></g></g><g class="g1" opacity="0"><g ><circle cx="280" cy="112" r="44" fill="#FFC83D" stroke="#C98A00" stroke-width="3" /><circle cx="280" cy="112" r="34.3" fill="none" stroke="#C98A00" stroke-width="1.5" /><text x="280" y="126.5" font-size="44" text-anchor="middle" fill="#2B2F4A" >T</text></g></g><text x="120" y="190" font-size="14" text-anchor="middle" class="h" >first coin</text><text x="280" y="190" font-size="14" text-anchor="middle" class="h" >second coin</text><text x="200" y="222" font-size="13" text-anchor="middle" fill="#8A8FB0" class="h" >Each coin lands head or tail, independently</text></svg>
