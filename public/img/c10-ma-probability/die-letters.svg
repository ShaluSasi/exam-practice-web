<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A die whose six faces show the letters A, B, C, D, E, A</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}@keyframes fc6{0%{opacity:1}16.57%{opacity:1}16.67%{opacity:0}100%{opacity:0}}.rl{transform-origin:200px 100px;animation:rl 3s ease-in-out infinite}@keyframes rl{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<ellipse cx="200" cy="168" rx="62" ry="9" fill="#000" opacity=".12"/><g class="rl"><g style="animation:fc6 3.0s linear infinite;animation-delay:0.00s"><rect x="150" y="50" width="100" height="100" rx="18.0" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><text x="200" y="122" font-size="62" text-anchor="middle" fill="#2B2F4A" >A</text></g><g opacity="0" style="animation:fc6 3.0s linear infinite;animation-delay:0.50s"><rect x="150" y="50" width="100" height="100" rx="18.0" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><text x="200" y="122" font-size="62" text-anchor="middle" fill="#2B2F4A" >B</text></g><g opacity="0" style="animation:fc6 3.0s linear infinite;animation-delay:1.00s"><rect x="150" y="50" width="100" height="100" rx="18.0" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><text x="200" y="122" font-size="62" text-anchor="middle" fill="#2B2F4A" >C</text></g><g opacity="0" style="animation:fc6 3.0s linear infinite;animation-delay:1.50s"><rect x="150" y="50" width="100" height="100" rx="18.0" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><text x="200" y="122" font-size="62" text-anchor="middle" fill="#2B2F4A" >D</text></g><g opacity="0" style="animation:fc6 3.0s linear infinite;animation-delay:2.00s"><rect x="150" y="50" width="100" height="100" rx="18.0" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><text x="200" y="122" font-size="62" text-anchor="middle" fill="#2B2F4A" >E</text></g><g opacity="0" style="animation:fc6 3.0s linear infinite;animation-delay:2.50s"><rect x="150" y="50" width="100" height="100" rx="18.0" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><text x="200" y="122" font-size="62" text-anchor="middle" fill="#2B2F4A" >A</text></g></g><rect x="52" y="188" width="36" height="36" rx="7" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><text x="70" y="214" font-size="22" text-anchor="middle" fill="#2B2F4A" >A</text><rect x="102" y="188" width="36" height="36" rx="7" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><text x="120" y="214" font-size="22" text-anchor="middle" fill="#2B2F4A" >B</text><rect x="152" y="188" width="36" height="36" rx="7" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><text x="170" y="214" font-size="22" text-anchor="middle" fill="#2B2F4A" >C</text><rect x="202" y="188" width="36" height="36" rx="7" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><text x="220" y="214" font-size="22" text-anchor="middle" fill="#2B2F4A" >D</text><rect x="252" y="188" width="36" height="36" rx="7" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><text x="270" y="214" font-size="22" text-anchor="middle" fill="#2B2F4A" >E</text><rect x="302" y="188" width="36" height="36" rx="7" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><text x="320" y="214" font-size="22" text-anchor="middle" fill="#2B2F4A" >A</text><text x="200" y="22" font-size="14" text-anchor="middle" class="h" >The six faces of this die</text></svg>
