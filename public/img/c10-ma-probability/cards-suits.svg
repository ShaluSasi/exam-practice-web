<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>The four suits of a pack of 52 playing cards</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.b{animation:bn 2.6s ease-in-out infinite}@keyframes bn{50%{transform:translateY(-6px)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="28" font-size="15" text-anchor="middle" class="h" >A pack of 52 playing cards</text><g class="b" style="animation-delay:0.0s"><rect x="22" y="48" width="72" height="100" rx="8" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><path transform="translate(58 98) scale(2.4)" d="M0,-10 C-15,1 -10,10 -1,4 L-3,10 L3,10 L1,4 C10,10 15,1 0,-10Z" fill="#2B2F4A"/></g><text x="58" y="168" font-size="14" text-anchor="middle" class="h" >Spades</text><text x="58" y="186" font-size="13" text-anchor="middle" fill="#8A8FB0" class="h" >13 cards</text><g class="b" style="animation-delay:0.3s"><rect x="116" y="48" width="72" height="100" rx="8" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><path transform="translate(152 98) scale(2.4)" d="M0,9 C-15,-2 -9,-12 0,-5 C9,-12 15,-2 0,9Z" fill="#E5484D"/></g><text x="152" y="168" font-size="14" text-anchor="middle" class="h" >Hearts</text><text x="152" y="186" font-size="13" text-anchor="middle" fill="#8A8FB0" class="h" >13 cards</text><g class="b" style="animation-delay:0.6s"><rect x="210" y="48" width="72" height="100" rx="8" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><path transform="translate(246 98) scale(2.4)" d="M0,-10 L7,0 L0,10 L-7,0Z" fill="#E5484D"/></g><text x="246" y="168" font-size="14" text-anchor="middle" class="h" >Diamonds</text><text x="246" y="186" font-size="13" text-anchor="middle" fill="#8A8FB0" class="h" >13 cards</text><g class="b" style="animation-delay:0.8999999999999999s"><rect x="304" y="48" width="72" height="100" rx="8" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><g transform="translate(340 98) scale(2.4)" fill="#2B2F4A"><circle cx="0" cy="-5" r="4.8"/><circle cx="-5" cy="2" r="4.8"/><circle cx="5" cy="2" r="4.8"/><path d="M0,0 L-3,10 L3,10Z"/></g></g><text x="340" y="168" font-size="14" text-anchor="middle" class="h" >Clubs</text><text x="340" y="186" font-size="13" text-anchor="middle" fill="#8A8FB0" class="h" >13 cards</text><text x="200" y="218" font-size="13" text-anchor="middle" class="h" >Hearts and diamonds are red; spades and clubs are black</text><text x="200" y="236" font-size="13" text-anchor="middle" class="h" >Kings, queens and jacks are the face cards</text></svg>
