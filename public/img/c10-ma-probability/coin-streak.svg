<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Ten coin tosses giving 7 heads and 3 tails</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.fl{animation:fl 2.5s ease-in-out infinite}@keyframes fl{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.15)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="28" font-size="15" text-anchor="middle" class="h" >A coin is tossed 10 times</text><g class="fl" style="transform-origin:36.0px 80px;animation-delay:0.00s"><g ><circle cx="36" cy="80" r="16" fill="#FFC83D" stroke="#C98A00" stroke-width="3" /><circle cx="36" cy="80" r="12.5" fill="none" stroke="#C98A00" stroke-width="1.5" /><text x="36" y="85.3" font-size="16" text-anchor="middle" fill="#2B2F4A" >H</text></g></g><g class="fl" style="transform-origin:72.5px 80px;animation-delay:0.15s"><g ><circle cx="72.5" cy="80" r="16" fill="#FFC83D" stroke="#C98A00" stroke-width="3" /><circle cx="72.5" cy="80" r="12.5" fill="none" stroke="#C98A00" stroke-width="1.5" /><text x="72.5" y="85.3" font-size="16" text-anchor="middle" fill="#2B2F4A" >H</text></g></g><g class="fl" style="transform-origin:109.0px 80px;animation-delay:0.30s"><g ><circle cx="109" cy="80" r="16" fill="#FFC83D" stroke="#C98A00" stroke-width="3" /><circle cx="109" cy="80" r="12.5" fill="none" stroke="#C98A00" stroke-width="1.5" /><text x="109" y="85.3" font-size="16" text-anchor="middle" fill="#2B2F4A" >T</text></g></g><g class="fl" style="transform-origin:145.5px 80px;animation-delay:0.45s"><g ><circle cx="145.5" cy="80" r="16" fill="#FFC83D" stroke="#C98A00" stroke-width="3" /><circle cx="145.5" cy="80" r="12.5" fill="none" stroke="#C98A00" stroke-width="1.5" /><text x="145.5" y="85.3" font-size="16" text-anchor="middle" fill="#2B2F4A" >H</text></g></g><g class="fl" style="transform-origin:182.0px 80px;animation-delay:0.60s"><g ><circle cx="182" cy="80" r="16" fill="#FFC83D" stroke="#C98A00" stroke-width="3" /><circle cx="182" cy="80" r="12.5" fill="none" stroke="#C98A00" stroke-width="1.5" /><text x="182" y="85.3" font-size="16" text-anchor="middle" fill="#2B2F4A" >H</text></g></g><g class="fl" style="transform-origin:218.5px 80px;animation-delay:0.75s"><g ><circle cx="218.5" cy="80" r="16" fill="#FFC83D" stroke="#C98A00" stroke-width="3" /><circle cx="218.5" cy="80" r="12.5" fill="none" stroke="#C98A00" stroke-width="1.5" /><text x="218.5" y="85.3" font-size="16" text-anchor="middle" fill="#2B2F4A" >T</text></g></g><g class="fl" style="transform-origin:255.0px 80px;animation-delay:0.90s"><g ><circle cx="255" cy="80" r="16" fill="#FFC83D" stroke="#C98A00" stroke-width="3" /><circle cx="255" cy="80" r="12.5" fill="none" stroke="#C98A00" stroke-width="1.5" /><text x="255" y="85.3" font-size="16" text-anchor="middle" fill="#2B2F4A" >H</text></g></g><g class="fl" style="transform-origin:291.5px 80px;animation-delay:1.05s"><g ><circle cx="291.5" cy="80" r="16" fill="#FFC83D" stroke="#C98A00" stroke-width="3" /><circle cx="291.5" cy="80" r="12.5" fill="none" stroke="#C98A00" stroke-width="1.5" /><text x="291.5" y="85.3" font-size="16" text-anchor="middle" fill="#2B2F4A" >H</text></g></g><g class="fl" style="transform-origin:328.0px 80px;animation-delay:1.20s"><g ><circle cx="328" cy="80" r="16" fill="#FFC83D" stroke="#C98A00" stroke-width="3" /><circle cx="328" cy="80" r="12.5" fill="none" stroke="#C98A00" stroke-width="1.5" /><text x="328" y="85.3" font-size="16" text-anchor="middle" fill="#2B2F4A" >T</text></g></g><g class="fl" style="transform-origin:364.5px 80px;animation-delay:1.35s"><g ><circle cx="364.5" cy="80" r="16" fill="#FFC83D" stroke="#C98A00" stroke-width="3" /><circle cx="364.5" cy="80" r="12.5" fill="none" stroke="#C98A00" stroke-width="1.5" /><text x="364.5" y="85.3" font-size="16" text-anchor="middle" fill="#2B2F4A" >H</text></g></g><text x="200" y="140" font-size="15" text-anchor="middle" class="h" >Result: 7 heads, 3 tails</text><rect x="40" y="164" width="320" height="18" rx="6" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><rect x="40" y="164" width="224" height="18" rx="6" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2"/><text x="200" y="210" font-size="13" text-anchor="middle" class="h" >Heads fraction in this experiment: 7 out of 10</text></svg>
