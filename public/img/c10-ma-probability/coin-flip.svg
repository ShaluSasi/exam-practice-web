<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A coin being tossed and landing head or tail</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.tw{transform-origin:200px 110px;animation:tw 3s ease-in-out infinite}@keyframes tw{0%,100%{transform:translateY(0)}50%{transform:translateY(-34px)}}.cH{transform-origin:200px 110px;animation:fH 3s ease-in-out infinite}@keyframes fH{0%,10%{transform:scaleX(1)}25%,75%{transform:scaleX(0)}90%,100%{transform:scaleX(1)}}.cT{transform-origin:200px 110px;animation:fT 3s ease-in-out infinite}@keyframes fT{0%,25%{transform:scaleX(0);opacity:1}50%{transform:scaleX(1);opacity:1}75%,100%{transform:scaleX(0);opacity:1}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<ellipse cx="200" cy="178" rx="46" ry="8" fill="#000" opacity=".12"/><g class="tw"><g class="cH"><g ><circle cx="200" cy="110" r="52" fill="#FFC83D" stroke="#C98A00" stroke-width="3" /><circle cx="200" cy="110" r="40.6" fill="none" stroke="#C98A00" stroke-width="1.5" /><text x="200" y="127.2" font-size="52" text-anchor="middle" fill="#2B2F4A" >H</text></g></g><g class="cT" opacity="0"><g ><circle cx="200" cy="110" r="52" fill="#FFC83D" stroke="#C98A00" stroke-width="3" /><circle cx="200" cy="110" r="40.6" fill="none" stroke="#C98A00" stroke-width="1.5" /><text x="200" y="127.2" font-size="52" text-anchor="middle" fill="#2B2F4A" >T</text></g></g></g><g ><circle cx="58" cy="195" r="22" fill="#FFC83D" stroke="#C98A00" stroke-width="3" /><circle cx="58" cy="195" r="17.2" fill="none" stroke="#C98A00" stroke-width="1.5" /><text x="58" y="202.3" font-size="22" text-anchor="middle" fill="#2B2F4A" >H</text></g><text x="58" y="232" font-size="13" text-anchor="middle" class="h" >Head</text><g ><circle cx="342" cy="195" r="22" fill="#FFC83D" stroke="#C98A00" stroke-width="3" /><circle cx="342" cy="195" r="17.2" fill="none" stroke="#C98A00" stroke-width="1.5" /><text x="342" y="202.3" font-size="22" text-anchor="middle" fill="#2B2F4A" >T</text></g><text x="342" y="232" font-size="13" text-anchor="middle" class="h" >Tail</text><text x="200" y="28" font-size="15" text-anchor="middle" class="h" >A fair coin is tossed once</text></svg>
