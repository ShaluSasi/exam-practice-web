<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="36" font-size="15" text-anchor="middle" class="h" >The faces of one die</text><g class="b" style="animation-delay:0.0s"><rect x="20" y="90" width="52" height="52" rx="9.36" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="46" cy="116" r="3.9" fill="#2B2F4A"/></g><g class="b" style="animation-delay:0.25s"><rect x="80" y="90" width="52" height="52" rx="9.36" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="93.5" cy="103.5" r="3.9" fill="#2B2F4A"/><circle cx="118.5" cy="128.5" r="3.9" fill="#2B2F4A"/></g><g class="b" style="animation-delay:0.5s"><rect x="140" y="90" width="52" height="52" rx="9.36" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="153.5" cy="103.5" r="3.9" fill="#2B2F4A"/><circle cx="166" cy="116" r="3.9" fill="#2B2F4A"/><circle cx="178.5" cy="128.5" r="3.9" fill="#2B2F4A"/></g><g class="b" style="animation-delay:0.75s"><rect x="200" y="90" width="52" height="52" rx="9.36" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="213.5" cy="103.5" r="3.9" fill="#2B2F4A"/><circle cx="238.5" cy="103.5" r="3.9" fill="#2B2F4A"/><circle cx="213.5" cy="128.5" r="3.9" fill="#2B2F4A"/><circle cx="238.5" cy="128.5" r="3.9" fill="#2B2F4A"/></g><g class="b" style="animation-delay:1.0s"><rect x="260" y="90" width="52" height="52" rx="9.36" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="273.5" cy="103.5" r="3.9" fill="#2B2F4A"/><circle cx="298.5" cy="103.5" r="3.9" fill="#2B2F4A"/><circle cx="286" cy="116" r="3.9" fill="#2B2F4A"/><circle cx="273.5" cy="128.5" r="3.9" fill="#2B2F4A"/><circle cx="298.5" cy="128.5" r="3.9" fill="#2B2F4A"/></g><g class="b" style="animation-delay:1.25s"><rect x="320" y="90" width="52" height="52" rx="9.36" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="333.5" cy="103.5" r="3.9" fill="#2B2F4A"/><circle cx="358.5" cy="103.5" r="3.9" fill="#2B2F4A"/><circle cx="333.5" cy="116" r="3.9" fill="#2B2F4A"/><circle cx="358.5" cy="116" r="3.9" fill="#2B2F4A"/><circle cx="333.5" cy="128.5" r="3.9" fill="#2B2F4A"/><circle cx="358.5" cy="128.5" r="3.9" fill="#2B2F4A"/></g><text x="200" y="190" font-size="13" text-anchor="middle" class="h" >Each face is equally likely to land on top</text></svg>
