<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
<title>Comparing ax^2+bx+c with k x^2 - k(alpha+beta)x + k alpha beta</title>
<style>.dr{animation:dr 4s ease-in-out infinite}@keyframes dr{0%{stroke-dasharray:0 1}60%,100%{stroke-dasharray:1 1}}.zp{transform-box:fill-box;transform-origin:center;animation:zp 1.6s ease-in-out infinite}@keyframes zp{50%{transform:scale(1.6)}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sw{transform-box:fill-box;transform-origin:center;animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translateY(-6px)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.fl{stroke-dasharray:7 5;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-12}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="30" y="28" width="80" height="40" rx="10" fill="#FFE9CC" stroke="#FF8A1F" stroke-width="3" /><text x="70" y="55" font-size="17" text-anchor="middle" >ax²</text><rect x="160" y="28" width="80" height="40" rx="10" fill="#FFE9CC" stroke="#FF8A1F" stroke-width="3" /><text x="200" y="55" font-size="17" text-anchor="middle" >bx</text><rect x="285" y="28" width="80" height="40" rx="10" fill="#FFE9CC" stroke="#FF8A1F" stroke-width="3" /><text x="325" y="55" font-size="17" text-anchor="middle" >c</text><rect x="30" y="150" width="80" height="40" rx="10" fill="#E3F2FD" stroke="#0B93D4" stroke-width="3" /><text x="70" y="177" font-size="16" text-anchor="middle" >kx²</text><line x1="70" y1="74" x2="70" y2="142" stroke="#3FA34D" stroke-width="3" stroke-linecap="round" class="fl"/><rect x="130" y="150" width="140" height="40" rx="10" fill="#E3F2FD" stroke="#0B93D4" stroke-width="3" /><text x="200" y="177" font-size="16" text-anchor="middle" >−k(α+β)x</text><line x1="200" y1="74" x2="200" y2="142" stroke="#3FA34D" stroke-width="3" stroke-linecap="round" class="fl"/><rect x="285" y="150" width="80" height="40" rx="10" fill="#E3F2FD" stroke="#0B93D4" stroke-width="3" /><text x="325" y="177" font-size="16" text-anchor="middle" >kαβ</text><line x1="325" y1="74" x2="325" y2="142" stroke="#3FA34D" stroke-width="3" stroke-linecap="round" class="fl"/><text x="70" y="118" font-size="24" text-anchor="middle" fill="#3FA34D" class="h" >=</text><text x="200" y="118" font-size="24" text-anchor="middle" fill="#3FA34D" class="h" >=</text><text x="325" y="118" font-size="24" text-anchor="middle" fill="#3FA34D" class="h" >=</text></svg>
