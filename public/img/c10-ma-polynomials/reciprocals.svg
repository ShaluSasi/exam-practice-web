<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img">
<title>Number line with zeroes 1/2 and 3 and their reciprocals</title>
<style>.dr{animation:dr 4s ease-in-out infinite}@keyframes dr{0%{stroke-dasharray:0 1}60%,100%{stroke-dasharray:1 1}}.zp{transform-box:fill-box;transform-origin:center;animation:zp 1.6s ease-in-out infinite}@keyframes zp{50%{transform:scale(1.6)}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sw{transform-box:fill-box;transform-origin:center;animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translateY(-6px)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.fl{stroke-dasharray:7 5;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-12}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<line x1="20" y1="110" x2="385" y2="110" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><polygon points="0,0 -10,-5 -10,5" fill="#2B2F4A" transform="translate(392 110) rotate(0.0)"/><line x1="36" y1="104" x2="36" y2="116" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="36" y="132" font-size="13" text-anchor="middle" class="h" >0</text><line x1="136" y1="104" x2="136" y2="116" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="136" y="132" font-size="13" text-anchor="middle" class="h" >1</text><line x1="236" y1="104" x2="236" y2="116" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="236" y="132" font-size="13" text-anchor="middle" class="h" >2</text><line x1="336" y1="104" x2="336" y2="116" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="336" y="132" font-size="13" text-anchor="middle" class="h" >3</text><circle cx="86" cy="110" r="7" fill="#0B93D4" stroke="#fff" stroke-width="1.5"/><text x="86" y="152" font-size="14" text-anchor="middle" fill="#0B93D4" class="h" >α</text><circle cx="336" cy="110" r="7" fill="#0B93D4" stroke="#fff" stroke-width="1.5"/><text x="336" y="152" font-size="14" text-anchor="middle" fill="#0B93D4" class="h" >β</text><circle cx="236" cy="110" r="7" fill="#FF8A1F" stroke="#fff" stroke-width="1.5"/><text x="236" y="170" font-size="14" text-anchor="middle" fill="#FF8A1F" class="h" >1/α</text><circle cx="69.3" cy="110" r="7" fill="#FF8A1F" stroke="#fff" stroke-width="1.5"/><text x="69.3" y="170" font-size="14" text-anchor="middle" fill="#FF8A1F" class="h" >1/β</text><path d="M86.0 103A75.0 45.0 0 0 1 236.0 103" fill="none" stroke="#FF8A1F" stroke-width="2.5" class="fl"/><path d="M336.0 103A133.3 80.0 0 0 0 69.3 103" fill="none" stroke="#FF8A1F" stroke-width="2.5" class="fl"/><text x="200" y="192" font-size="13" text-anchor="middle" fill="#8A8FB0" class="h" >each zero hops to its reciprocal</text></svg>
