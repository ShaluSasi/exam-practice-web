<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img">
<title>A function machine that takes x = -2 and gives p(-2)</title>
<style>.dr{animation:dr 4s ease-in-out infinite}@keyframes dr{0%{stroke-dasharray:0 1}60%,100%{stroke-dasharray:1 1}}.zp{transform-box:fill-box;transform-origin:center;animation:zp 1.6s ease-in-out infinite}@keyframes zp{50%{transform:scale(1.6)}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sw{transform-box:fill-box;transform-origin:center;animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translateY(-6px)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.mv{animation:mv 3.5s ease-in-out infinite}@keyframes mv{0%{transform:translateX(0);opacity:1}55%{transform:translateX(66px);opacity:1}70%,100%{transform:translateX(66px);opacity:0}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="120" y="55" width="160" height="90" rx="16" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="4" /><text x="200" y="92" font-size="15" text-anchor="middle" class="h" >p(x) =</text><text x="200" y="120" font-size="18" text-anchor="middle" class="h" >2x² − 5x + 3</text><line x1="30" y1="100" x2="111" y2="100" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><polygon points="0,0 -10,-5 -10,5" fill="#2B2F4A" transform="translate(118 100) rotate(0.0)"/><line x1="282" y1="100" x2="365" y2="100" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><polygon points="0,0 -10,-5 -10,5" fill="#2B2F4A" transform="translate(372 100) rotate(0.0)"/><g class="mv"><rect x="34" y="78" width="52" height="40" rx="10" fill="#FF8A1F"/><text x="60" y="105" text-anchor="middle" font-size="18" fill="#fff">−2</text></g><rect x="296" y="118" width="76" height="36" rx="10" fill="#fff" stroke="#3FA34D" stroke-width="3" /><text x="334" y="142" font-size="14" text-anchor="middle" >p(−2)=?</text><text x="60" y="150" font-size="13" text-anchor="middle" fill="#8A8FB0" class="h" >put x = −2</text><text x="200" y="178" font-size="13" text-anchor="middle" fill="#8A8FB0" class="h" >replace every x by −2</text></svg>
