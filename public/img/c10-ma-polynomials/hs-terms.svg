<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img">
<title>The polynomial 3x^3 - 5x^2 + 2x - 7 split into four term chips</title>
<style>.dr{animation:dr 4s ease-in-out infinite}@keyframes dr{0%{stroke-dasharray:0 1}60%,100%{stroke-dasharray:1 1}}.zp{transform-box:fill-box;transform-origin:center;animation:zp 1.6s ease-in-out infinite}@keyframes zp{50%{transform:scale(1.6)}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sw{transform-box:fill-box;transform-origin:center;animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translateY(-6px)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="38" font-size="15" text-anchor="middle" class="h" >p(x) = sum of terms</text><rect x="19" y="70" width="80" height="60" rx="14" fill="#fff" stroke="#FF8A1F" stroke-width="4" /><text x="59" y="108" font-size="22" text-anchor="middle" >3x³</text><rect x="113" y="70" width="80" height="60" rx="14" fill="#fff" stroke="#0B93D4" stroke-width="4" /><text x="153" y="108" font-size="22" text-anchor="middle" >−5x²</text><rect x="207" y="70" width="80" height="60" rx="14" fill="#fff" stroke="#3FA34D" stroke-width="4" /><text x="247" y="108" font-size="22" text-anchor="middle" >+2x</text><rect x="301" y="70" width="80" height="60" rx="14" fill="#fff" stroke="#7C5CFF" stroke-width="4" /><text x="341" y="108" font-size="22" text-anchor="middle" >−7</text><text x="200" y="168" font-size="13" text-anchor="middle" fill="#8A8FB0" class="h" >Each chip is one term</text></svg>
