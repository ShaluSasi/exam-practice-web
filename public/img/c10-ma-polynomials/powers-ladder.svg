<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img">
<title>Allowed powers of x are whole numbers 0, 1, 2, 3 and so on</title>
<style>.dr{animation:dr 4s ease-in-out infinite}@keyframes dr{0%{stroke-dasharray:0 1}60%,100%{stroke-dasharray:1 1}}.zp{transform-box:fill-box;transform-origin:center;animation:zp 1.6s ease-in-out infinite}@keyframes zp{50%{transform:scale(1.6)}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sw{transform-box:fill-box;transform-origin:center;animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translateY(-6px)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<line x1="20" y1="100" x2="385" y2="100" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><polygon points="0,0 -10,-5 -10,5" fill="#2B2F4A" transform="translate(392 100) rotate(0.0)"/><circle cx="71" cy="100" r="8" fill="#E5484D" stroke="#fff" stroke-width="1.5"/><text x="71" y="78" font-size="15" text-anchor="middle" class="h" >x⁻¹</text><line x1="66" y1="95" x2="76" y2="105" stroke="#fff" stroke-width="2" stroke-linecap="round" /><line x1="66" y1="105" x2="76" y2="95" stroke="#fff" stroke-width="2" stroke-linecap="round" /><circle cx="133" cy="100" r="8" fill="#3FA34D" stroke="#fff" stroke-width="1.5"/><text x="133" y="78" font-size="15" text-anchor="middle" class="h" >x⁰</text><circle cx="164" cy="100" r="8" fill="#E5484D" stroke="#fff" stroke-width="1.5"/><text x="160" y="138" font-size="15" text-anchor="middle" class="h" >x<tspan dy="-6" font-size="10">1/2</tspan></text><line x1="159" y1="95" x2="169" y2="105" stroke="#fff" stroke-width="2" stroke-linecap="round" /><line x1="159" y1="105" x2="169" y2="95" stroke="#fff" stroke-width="2" stroke-linecap="round" /><circle cx="195" cy="100" r="8" fill="#3FA34D" stroke="#fff" stroke-width="1.5"/><text x="195" y="78" font-size="15" text-anchor="middle" class="h" >x¹</text><circle cx="257" cy="100" r="8" fill="#3FA34D" stroke="#fff" stroke-width="1.5"/><text x="257" y="130" font-size="15" text-anchor="middle" class="h" >x²</text><circle cx="319" cy="100" r="8" fill="#3FA34D" stroke="#fff" stroke-width="1.5"/><text x="319" y="78" font-size="15" text-anchor="middle" class="h" >x³</text><text x="200" y="28" font-size="14" text-anchor="middle" fill="#8A8FB0" class="h" >power of x</text><text x="200" y="172" font-size="13" text-anchor="middle" fill="#3FA34D" class="h" >green: whole-number powers</text><text x="200" y="190" font-size="13" text-anchor="middle" fill="#E5484D" class="h" >red: not allowed</text></svg>
