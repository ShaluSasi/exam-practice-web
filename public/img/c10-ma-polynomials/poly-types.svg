<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img">
<title>Steps labelled with degree 0, 1, 2 and 3</title>
<style>.dr{animation:dr 4s ease-in-out infinite}@keyframes dr{0%{stroke-dasharray:0 1}60%,100%{stroke-dasharray:1 1}}.zp{transform-box:fill-box;transform-origin:center;animation:zp 1.6s ease-in-out infinite}@keyframes zp{50%{transform:scale(1.6)}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sw{transform-box:fill-box;transform-origin:center;animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translateY(-6px)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="20" y="130" width="84" height="40" rx="8" fill="#EDEBFF" stroke="#2B2F4A" stroke-width="2.5" /><text x="62" y="152" font-size="13" text-anchor="middle" >degree 0</text><text x="62" y="188" font-size="13" text-anchor="middle" class="h" >constant</text><rect x="112" y="102" width="84" height="68" rx="8" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5" /><text x="154" y="124" font-size="13" text-anchor="middle" >degree 1</text><text x="154" y="188" font-size="13" text-anchor="middle" class="h" >linear</text><rect x="204" y="74" width="84" height="96" rx="8" fill="#FFE9CC" stroke="#2B2F4A" stroke-width="2.5" /><text x="246" y="96" font-size="13" text-anchor="middle" >degree 2</text><text x="246" y="188" font-size="13" text-anchor="middle" class="h" >quadratic</text><rect x="296" y="46" width="84" height="124" rx="8" fill="#DFF1E3" stroke="#2B2F4A" stroke-width="2.5" /><text x="338" y="68" font-size="13" text-anchor="middle" >degree 3</text><text x="338" y="188" font-size="13" text-anchor="middle" class="h" >cubic</text></svg>
