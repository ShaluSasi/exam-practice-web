<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img">
<title>Number line showing the zero 3 and an unknown second zero</title>
<style>.dr{animation:dr 4s ease-in-out infinite}@keyframes dr{0%{stroke-dasharray:0 1}60%,100%{stroke-dasharray:1 1}}.zp{transform-box:fill-box;transform-origin:center;animation:zp 1.6s ease-in-out infinite}@keyframes zp{50%{transform:scale(1.6)}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sw{transform-box:fill-box;transform-origin:center;animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translateY(-6px)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<line x1="20" y1="110" x2="377" y2="110" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><polygon points="0,0 -10,-5 -10,5" fill="#2B2F4A" transform="translate(384 110) rotate(0.0)"/><line x1="20" y1="104" x2="20" y2="116" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="20" y="134" font-size="12" text-anchor="middle" class="h" >−6</text><line x1="50" y1="104" x2="50" y2="116" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="80" y1="104" x2="80" y2="116" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="80" y="134" font-size="12" text-anchor="middle" class="h" >−4</text><line x1="110" y1="104" x2="110" y2="116" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="140" y1="104" x2="140" y2="116" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="140" y="134" font-size="12" text-anchor="middle" class="h" >−2</text><line x1="170" y1="104" x2="170" y2="116" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="200" y1="104" x2="200" y2="116" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="200" y="134" font-size="12" text-anchor="middle" class="h" >0</text><line x1="230" y1="104" x2="230" y2="116" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="260" y1="104" x2="260" y2="116" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="260" y="134" font-size="12" text-anchor="middle" class="h" >2</text><line x1="290" y1="104" x2="290" y2="116" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="290" y="134" font-size="12" text-anchor="middle" class="h" >3</text><line x1="320" y1="104" x2="320" y2="116" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="320" y="134" font-size="12" text-anchor="middle" class="h" >4</text><line x1="350" y1="104" x2="350" y2="116" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="380" y1="104" x2="380" y2="116" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="380" y="134" font-size="12" text-anchor="middle" class="h" >6</text><circle cx="290" cy="110" r="8" fill="#3FA34D" stroke="#fff" stroke-width="1.5" class="zp"/><text x="290" y="86" font-size="14" text-anchor="middle" class="h" >zero 3</text><text x="140" y="92" text-anchor="middle" font-size="26" fill="#FF8A1F" class="pu">?</text><text x="200" y="36" font-size="17" text-anchor="middle" class="h" >p(x) = x² − x − 6</text><text x="200" y="172" font-size="13" text-anchor="middle" fill="#8A8FB0" class="h" >p(3) = 0, so 3 is a zero</text></svg>
