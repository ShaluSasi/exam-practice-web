<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img">
<title>Number line with three zeroes -1, 2 and 3</title>
<style>.dr{animation:dr 4s ease-in-out infinite}@keyframes dr{0%{stroke-dasharray:0 1}60%,100%{stroke-dasharray:1 1}}.zp{transform-box:fill-box;transform-origin:center;animation:zp 1.6s ease-in-out infinite}@keyframes zp{50%{transform:scale(1.6)}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sw{transform-box:fill-box;transform-origin:center;animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translateY(-6px)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<line x1="20" y1="100" x2="377" y2="100" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><polygon points="0,0 -10,-5 -10,5" fill="#2B2F4A" transform="translate(384 100) rotate(0.0)"/><line x1="50" y1="94" x2="50" y2="106" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="50" y="124" font-size="12" text-anchor="middle" class="h" >−3</text><line x1="100" y1="94" x2="100" y2="106" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="100" y="124" font-size="12" text-anchor="middle" class="h" >−2</text><line x1="150" y1="94" x2="150" y2="106" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="150" y="124" font-size="12" text-anchor="middle" class="h" >−1</text><line x1="200" y1="94" x2="200" y2="106" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="200" y="124" font-size="12" text-anchor="middle" class="h" >0</text><line x1="250" y1="94" x2="250" y2="106" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="250" y="124" font-size="12" text-anchor="middle" class="h" >1</text><line x1="300" y1="94" x2="300" y2="106" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="300" y="124" font-size="12" text-anchor="middle" class="h" >2</text><line x1="350" y1="94" x2="350" y2="106" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="350" y="124" font-size="12" text-anchor="middle" class="h" >3</text><circle cx="300" cy="100" r="8" fill="#3FA34D" stroke="#fff" stroke-width="1.5" class="zp"/><text x="300" y="78" font-size="15" text-anchor="middle" class="h" >2</text><circle cx="350" cy="100" r="8" fill="#3FA34D" stroke="#fff" stroke-width="1.5" class="zp"/><text x="350" y="78" font-size="15" text-anchor="middle" class="h" >3</text><circle cx="150" cy="100" r="8" fill="#3FA34D" stroke="#fff" stroke-width="1.5" class="zp"/><text x="150" y="78" font-size="15" text-anchor="middle" class="h" >−1</text><text x="200" y="28" font-size="14" text-anchor="middle" fill="#8A8FB0" class="h" >zeroes of a cubic with leading coefficient 1</text><text x="200" y="160" font-size="13" text-anchor="middle" fill="#2B2F4A" >x³ − (α+β+γ)x² + (αβ+βγ+γα)x − αβγ</text></svg>
