<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img">
<title>The general cubic and quadratic with coefficient chips</title>
<style>.dr{animation:dr 4s ease-in-out infinite}@keyframes dr{0%{stroke-dasharray:0 1}60%,100%{stroke-dasharray:1 1}}.zp{transform-box:fill-box;transform-origin:center;animation:zp 1.6s ease-in-out infinite}@keyframes zp{50%{transform:scale(1.6)}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sw{transform-box:fill-box;transform-origin:center;animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translateY(-6px)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="28" font-size="18" text-anchor="middle" class="h" >ax³ + bx² + cx + d</text><rect x="40" y="50" width="60" height="44" rx="12" fill="#fff" stroke="#FF8A1F" stroke-width="3.5" /><text x="70" y="80" font-size="22" text-anchor="middle" >a</text><rect x="120" y="50" width="60" height="44" rx="12" fill="#fff" stroke="#0B93D4" stroke-width="3.5" /><text x="150" y="80" font-size="22" text-anchor="middle" >b</text><rect x="200" y="50" width="60" height="44" rx="12" fill="#fff" stroke="#3FA34D" stroke-width="3.5" /><text x="230" y="80" font-size="22" text-anchor="middle" >c</text><rect x="280" y="50" width="60" height="44" rx="12" fill="#fff" stroke="#7C5CFF" stroke-width="3.5" /><text x="310" y="80" font-size="22" text-anchor="middle" >d</text><text x="200" y="128" font-size="16" text-anchor="middle" >ax + b   and   ax² + bx + c</text><text x="200" y="168" font-size="13" text-anchor="middle" fill="#8A8FB0" class="h" >each answer uses only a, b, c or d</text></svg>
