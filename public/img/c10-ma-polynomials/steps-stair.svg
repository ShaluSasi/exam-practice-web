<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
<title>Staircase of steps from the polynomial 2x^2 - 8x + 6 up to its zeroes</title>
<style>.dr{animation:dr 4s ease-in-out infinite}@keyframes dr{0%{stroke-dasharray:0 1}60%,100%{stroke-dasharray:1 1}}.zp{transform-box:fill-box;transform-origin:center;animation:zp 1.6s ease-in-out infinite}@keyframes zp{50%{transform:scale(1.6)}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sw{transform-box:fill-box;transform-origin:center;animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translateY(-6px)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="20" y="160" width="70" height="38" rx="6" fill="#FFE9CC" stroke="#2B2F4A" stroke-width="2.5" /><text x="55" y="180" font-size="12" text-anchor="middle" >split</text><rect x="92" y="132" width="70" height="66" rx="6" fill="#FFE9CC" stroke="#2B2F4A" stroke-width="2.5" /><text x="127" y="152" font-size="12" text-anchor="middle" >group</text><rect x="164" y="104" width="70" height="94" rx="6" fill="#FFE9CC" stroke="#2B2F4A" stroke-width="2.5" /><text x="199" y="124" font-size="12" text-anchor="middle" >factor</text><rect x="236" y="76" width="70" height="122" rx="6" fill="#FFE9CC" stroke="#2B2F4A" stroke-width="2.5" /><text x="271" y="96" font-size="11" text-anchor="middle" >x − a = 0</text><rect x="308" y="48" width="70" height="150" rx="6" fill="#DFF1E3" stroke="#2B2F4A" stroke-width="2.5" /><text x="343" y="68" font-size="12" text-anchor="middle" >zeroes</text><text x="60" y="28" font-size="16" text-anchor="start" class="h" >2x² − 8x + 6</text><line x1="176" y1="22" x2="205" y2="22" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" /><polygon points="0,0 -10,-5 -10,5" fill="#FF8A1F" transform="translate(212 22) rotate(0.0)"/><text x="222" y="28" font-size="16" text-anchor="start" fill="#3FA34D" class="h" >x = 1, x = 3</text></svg>
