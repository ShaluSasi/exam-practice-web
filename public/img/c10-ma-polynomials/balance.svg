<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
<title>A balance with the sum of zeroes on one pan and the product on the other</title>
<style>.dr{animation:dr 4s ease-in-out infinite}@keyframes dr{0%{stroke-dasharray:0 1}60%,100%{stroke-dasharray:1 1}}.zp{transform-box:fill-box;transform-origin:center;animation:zp 1.6s ease-in-out infinite}@keyframes zp{50%{transform:scale(1.6)}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sw{transform-box:fill-box;transform-origin:center;animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translateY(-6px)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.bm{transform-box:fill-box;transform-origin:center;animation:bm 4s ease-in-out infinite}@keyframes bm{25%{transform:rotate(-2.5deg)}75%{transform:rotate(2.5deg)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="24" font-size="17" text-anchor="middle" class="h" >kx² + 2x + 3k</text><polygon points="200,100 175,190 225,190" fill="#8A8FB0" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><rect x="150" y="190" width="100" height="10" rx="5" fill="#2B2F4A"/><g class="bm"><line x1="60" y1="100" x2="340" y2="100" stroke="#2B2F4A" stroke-width="6" stroke-linecap="round" /><line x1="60" y1="100" x2="40" y2="150" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><line x1="60" y1="100" x2="90" y2="150" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><line x1="340" y1="100" x2="310" y2="150" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><line x1="340" y1="100" x2="360" y2="150" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><rect x="30" y="150" width="70" height="30" rx="8" fill="#FFE9CC" stroke="#FF8A1F" stroke-width="3" /><text x="65" y="171" font-size="15" text-anchor="middle" >α + β</text><rect x="300" y="150" width="70" height="30" rx="8" fill="#E3F2FD" stroke="#0B93D4" stroke-width="3" /><text x="335" y="171" font-size="15" text-anchor="middle" >αβ</text></g><circle cx="200" cy="100" r="8" fill="#2B2F4A" stroke="#fff" stroke-width="1.5"/><text x="200" y="66" font-size="14" text-anchor="middle" fill="#3FA34D" class="h" >sum = product</text></svg>
