<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
<title>Bars showing the power of x in each term of a polynomial</title>
<style>.dr{animation:dr 4s ease-in-out infinite}@keyframes dr{0%{stroke-dasharray:0 1}60%,100%{stroke-dasharray:1 1}}.zp{transform-box:fill-box;transform-origin:center;animation:zp 1.6s ease-in-out infinite}@keyframes zp{50%{transform:scale(1.6)}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sw{transform-box:fill-box;transform-origin:center;animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translateY(-6px)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<line x1="40" y1="170" x2="40" y2="25" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" /><polygon points="0,0 -10,-5 -10,5" fill="#2B2F4A" transform="translate(40 18) rotate(-90.0)"/><line x1="40" y1="170" x2="385" y2="170" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" /><line x1="36" y1="170" x2="44" y2="170" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="30" y="174" font-size="12" text-anchor="end" class="h" >0</text><line x1="36" y1="150" x2="44" y2="150" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="30" y="154" font-size="12" text-anchor="end" class="h" >1</text><line x1="44" y1="150" x2="385" y2="150" stroke="#E6DFCF" stroke-width="1" stroke-linecap="round" /><line x1="36" y1="130" x2="44" y2="130" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="30" y="134" font-size="12" text-anchor="end" class="h" >2</text><line x1="44" y1="130" x2="385" y2="130" stroke="#E6DFCF" stroke-width="1" stroke-linecap="round" /><line x1="36" y1="110" x2="44" y2="110" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="30" y="114" font-size="12" text-anchor="end" class="h" >3</text><line x1="44" y1="110" x2="385" y2="110" stroke="#E6DFCF" stroke-width="1" stroke-linecap="round" /><line x1="36" y1="90" x2="44" y2="90" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="30" y="94" font-size="12" text-anchor="end" class="h" >4</text><line x1="44" y1="90" x2="385" y2="90" stroke="#E6DFCF" stroke-width="1" stroke-linecap="round" /><line x1="36" y1="70" x2="44" y2="70" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="30" y="74" font-size="12" text-anchor="end" class="h" >5</text><line x1="44" y1="70" x2="385" y2="70" stroke="#E6DFCF" stroke-width="1" stroke-linecap="round" /><line x1="36" y1="50" x2="44" y2="50" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="30" y="54" font-size="12" text-anchor="end" class="h" >6</text><line x1="44" y1="50" x2="385" y2="50" stroke="#E6DFCF" stroke-width="1" stroke-linecap="round" /><text x="70" y="14" font-size="12" text-anchor="middle" fill="#8A8FB0" class="h" >power of x</text><rect x="75" y="110" width="50" height="60" rx="6" fill="#0B93D4"/><text x="100" y="194" font-size="16" text-anchor="middle" class="h" >4x³</text><rect x="153" y="50" width="50" height="120" rx="6" fill="#FF8A1F"/><text x="178" y="194" font-size="16" text-anchor="middle" class="h" >−7x⁶</text><rect x="231" y="130" width="50" height="40" rx="6" fill="#3FA34D"/><text x="256" y="194" font-size="16" text-anchor="middle" class="h" >2x²</text><rect x="309" y="166" width="50" height="4" rx="6" fill="#7C5CFF"/><text x="334" y="194" font-size="16" text-anchor="middle" class="h" >9</text></svg>
