<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
<title>Rearranging 6x^2 - 3 - 7x into standard form</title>
<style>.dr{animation:dr 4s ease-in-out infinite}@keyframes dr{0%{stroke-dasharray:0 1}60%,100%{stroke-dasharray:1 1}}.zp{transform-box:fill-box;transform-origin:center;animation:zp 1.6s ease-in-out infinite}@keyframes zp{50%{transform:scale(1.6)}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sw{transform-box:fill-box;transform-origin:center;animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translateY(-6px)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.pu2{animation:pu 2.4s ease-in-out infinite}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="22" font-size="12" text-anchor="middle" fill="#8A8FB0" class="h" >as given</text><g class=""><rect x="48" y="32" width="84" height="44" rx="12" fill="#FFE9CC" stroke="#2B2F4A" stroke-width="3" /><text x="90" y="61" font-size="18" text-anchor="middle" >6x²</text></g><g class=""><rect x="158" y="32" width="84" height="44" rx="12" fill="#FFE9CC" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="61" font-size="18" text-anchor="middle" >−3</text></g><g class=""><rect x="268" y="32" width="84" height="44" rx="12" fill="#FFE9CC" stroke="#2B2F4A" stroke-width="3" /><text x="310" y="61" font-size="18" text-anchor="middle" >−7x</text></g><line x1="200" y1="82" x2="200" y2="105" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><polygon points="0,0 -10,-5 -10,5" fill="#2B2F4A" transform="translate(200 112) rotate(90.0)"/><text x="260" y="102" font-size="12" text-anchor="start" fill="#8A8FB0" class="h" >rearrange</text><g class="pu2"><rect x="48" y="140" width="84" height="44" rx="12" fill="#DFF1E3" stroke="#2B2F4A" stroke-width="3" /><text x="90" y="169" font-size="18" text-anchor="middle" >6x²</text></g><text x="90" y="132" font-size="16" text-anchor="middle" fill="#3FA34D" class="h" >a</text><g class="pu2"><rect x="158" y="140" width="84" height="44" rx="12" fill="#DFF1E3" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="169" font-size="18" text-anchor="middle" >−7x</text></g><text x="200" y="132" font-size="16" text-anchor="middle" fill="#3FA34D" class="h" >b</text><g class="pu2"><rect x="268" y="140" width="84" height="44" rx="12" fill="#DFF1E3" stroke="#2B2F4A" stroke-width="3" /><text x="310" y="169" font-size="18" text-anchor="middle" >−3</text></g><text x="310" y="132" font-size="16" text-anchor="middle" fill="#3FA34D" class="h" >c</text><text x="200" y="205" font-size="14" text-anchor="middle" fill="#8A8FB0" class="h" >ax² + bx + c</text></svg>
