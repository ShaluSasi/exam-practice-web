<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img">
<title>Building a quadratic from the sum and product of its zeroes</title>
<style>.dr{animation:dr 4s ease-in-out infinite}@keyframes dr{0%{stroke-dasharray:0 1}60%,100%{stroke-dasharray:1 1}}.zp{transform-box:fill-box;transform-origin:center;animation:zp 1.6s ease-in-out infinite}@keyframes zp{50%{transform:scale(1.6)}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sw{transform-box:fill-box;transform-origin:center;animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translateY(-6px)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.sl{animation:sl 3.6s ease-in-out infinite}@keyframes sl{0%{transform:translateX(0)}50%,100%{transform:translateX(55px)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g class="sl"><rect x="14" y="40" width="90" height="40" rx="10" fill="#FFE9CC" stroke="#FF8A1F" stroke-width="3" /><text x="59" y="66" font-size="15" text-anchor="middle" >sum = 3</text><rect x="14" y="110" width="120" height="40" rx="10" fill="#E3F2FD" stroke="#0B93D4" stroke-width="3" /><text x="74" y="136" font-size="15" text-anchor="middle" >product = −10</text></g><rect x="190" y="45" width="200" height="105" rx="16" fill="#fff" stroke="#2B2F4A" stroke-width="4" /><text x="290" y="78" font-size="14" text-anchor="middle" >x² − (sum)x + (product)</text><text x="290" y="108" font-size="12" text-anchor="middle" fill="#8A8FB0" >put the numbers in</text><text x="290" y="138" font-size="15" text-anchor="middle" fill="#FF8A1F" >k·(x² − …x …)</text><text x="200" y="184" font-size="12" text-anchor="middle" fill="#8A8FB0" class="h" >any multiple k of the result also works</text></svg>
