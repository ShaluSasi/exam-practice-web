<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img">
<title>Table of values of p(x) for x from -2 to 4</title>
<style>.dr{animation:dr 4s ease-in-out infinite}@keyframes dr{0%{stroke-dasharray:0 1}60%,100%{stroke-dasharray:1 1}}.zp{transform-box:fill-box;transform-origin:center;animation:zp 1.6s ease-in-out infinite}@keyframes zp{50%{transform:scale(1.6)}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sw{transform-box:fill-box;transform-origin:center;animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translateY(-6px)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.sc{animation:sc 7s steps(1) infinite}@keyframes sc{0%{transform:translateX(0px)}14%{transform:translateX(46px)}28%{transform:translateX(92px)}42%{transform:translateX(138px)}57%{transform:translateX(184px)}71%{transform:translateX(230px)}85%{transform:translateX(276px)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="10" y="40" width="62" height="50" rx="6" fill="#FFE9CC" stroke="#2B2F4A" stroke-width="2.5" /><text x="41" y="71" font-size="16" text-anchor="middle" class="h" >x</text><rect x="10" y="100" width="62" height="50" rx="6" fill="#DFF1E3" stroke="#2B2F4A" stroke-width="2.5" /><text x="41" y="131" font-size="15" text-anchor="middle" class="h" >p(x)</text><rect class="sc" x="72" y="40" width="46" height="110" fill="#FF8A1F" opacity=".18"/><rect x="72" y="40" width="46" height="50" rx="0" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><text x="95" y="71" font-size="17" text-anchor="middle" >−2</text><rect x="72" y="100" width="46" height="50" rx="0" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><text x="95" y="131" font-size="17" text-anchor="middle" >5</text><rect x="118" y="40" width="46" height="50" rx="0" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><text x="141" y="71" font-size="17" text-anchor="middle" >−1</text><rect x="118" y="100" width="46" height="50" rx="0" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><text x="141" y="131" font-size="17" text-anchor="middle" >0</text><rect x="164" y="40" width="46" height="50" rx="0" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><text x="187" y="71" font-size="17" text-anchor="middle" >0</text><rect x="164" y="100" width="46" height="50" rx="0" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><text x="187" y="131" font-size="17" text-anchor="middle" >−3</text><rect x="210" y="40" width="46" height="50" rx="0" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><text x="233" y="71" font-size="17" text-anchor="middle" >1</text><rect x="210" y="100" width="46" height="50" rx="0" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><text x="233" y="131" font-size="17" text-anchor="middle" >−4</text><rect x="256" y="40" width="46" height="50" rx="0" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><text x="279" y="71" font-size="17" text-anchor="middle" >2</text><rect x="256" y="100" width="46" height="50" rx="0" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><text x="279" y="131" font-size="17" text-anchor="middle" >−3</text><rect x="302" y="40" width="46" height="50" rx="0" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><text x="325" y="71" font-size="17" text-anchor="middle" >3</text><rect x="302" y="100" width="46" height="50" rx="0" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><text x="325" y="131" font-size="17" text-anchor="middle" >0</text><rect x="348" y="40" width="46" height="50" rx="0" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><text x="371" y="71" font-size="17" text-anchor="middle" >4</text><rect x="348" y="100" width="46" height="50" rx="0" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><text x="371" y="131" font-size="17" text-anchor="middle" >5</text><text x="200" y="182" font-size="14" text-anchor="middle" fill="#8A8FB0" class="h" >p(x) = x² − 2x − 3</text></svg>
