<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img">
<title>A square of side alpha plus beta cut into alpha squared, beta squared and two alpha-beta rectangles</title>
<style>.dr{animation:dr 4s ease-in-out infinite}@keyframes dr{0%{stroke-dasharray:0 1}60%,100%{stroke-dasharray:1 1}}.zp{transform-box:fill-box;transform-origin:center;animation:zp 1.6s ease-in-out infinite}@keyframes zp{50%{transform:scale(1.6)}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sw{transform-box:fill-box;transform-origin:center;animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translateY(-6px)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="40" y="24" width="130.9" height="130.9" fill="#FFE9CC" stroke="#2B2F4A" stroke-width="2.5"/><rect x="170.9" y="24" width="19.1" height="130.9" fill="#D6ECFA" stroke="#2B2F4A" stroke-width="2.5"/><rect x="40" y="154.9" width="130.9" height="19.1" fill="#D6ECFA" stroke="#2B2F4A" stroke-width="2.5"/><rect x="170.9" y="154.9" width="19.1" height="19.1" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" class="pu"/><text x="105.5" y="95.5" font-size="24" text-anchor="middle" class="h" >α²</text><text x="105.5" y="169.9" font-size="12" text-anchor="middle" class="h" >αβ</text><text x="180.5" y="94.5" font-size="11" text-anchor="middle" class="h" >αβ</text><text x="218" y="172" font-size="15" text-anchor="start" fill="#3FA34D" class="h" >β²</text><line x1="40" y1="16" x2="190" y2="16" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="115" y="12" font-size="12" text-anchor="middle" class="h" >α + β</text><text x="250" y="70" font-size="16" text-anchor="start" class="h" >α + β = 6</text><text x="250" y="100" font-size="16" text-anchor="start" class="h" >αβ = 4</text><text x="250" y="138" font-size="17" text-anchor="start" fill="#FF8A1F" class="h" >α² + β² = ?</text></svg>
