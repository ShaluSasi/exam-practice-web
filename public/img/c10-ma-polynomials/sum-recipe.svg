<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img">
<title>Recipe card: sum of zeroes equals minus b over a</title>
<style>.dr{animation:dr 4s ease-in-out infinite}@keyframes dr{0%{stroke-dasharray:0 1}60%,100%{stroke-dasharray:1 1}}.zp{transform-box:fill-box;transform-origin:center;animation:zp 1.6s ease-in-out infinite}@keyframes zp{50%{transform:scale(1.6)}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sw{transform-box:fill-box;transform-origin:center;animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translateY(-6px)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="70" y="30" width="80" height="44" rx="10" fill="#fff" stroke="#FF8A1F" stroke-width="3.5" /><text x="110" y="59" font-size="19" text-anchor="middle" >ax²</text><rect x="160" y="30" width="80" height="44" rx="10" fill="#fff" stroke="#0B93D4" stroke-width="3.5" /><text x="200" y="59" font-size="19" text-anchor="middle" >+ bx</text><rect x="250" y="30" width="80" height="44" rx="10" fill="#fff" stroke="#3FA34D" stroke-width="3.5" /><text x="290" y="59" font-size="19" text-anchor="middle" >+ c</text><line x1="200" y1="84" x2="200" y2="113" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><polygon points="0,0 -10,-5 -10,5" fill="#2B2F4A" transform="translate(200 120) rotate(90.0)"/><rect x="110" y="124" width="180" height="44" rx="12" fill="#FFE9CC" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="153" font-size="18" text-anchor="middle" >sum = −b ÷ a</text><text x="200" y="188" font-size="12" text-anchor="middle" fill="#8A8FB0" class="h" >use the numbers a and b from the polynomial</text></svg>
