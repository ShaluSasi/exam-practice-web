<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img">
<title>ax^2 + bx + c with arrows to the sum and the product of zeroes</title>
<style>.dr{animation:dr 4s ease-in-out infinite}@keyframes dr{0%{stroke-dasharray:0 1}60%,100%{stroke-dasharray:1 1}}.zp{transform-box:fill-box;transform-origin:center;animation:zp 1.6s ease-in-out infinite}@keyframes zp{50%{transform:scale(1.6)}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sw{transform-box:fill-box;transform-origin:center;animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translateY(-6px)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="120" y="22" width="160" height="44" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="3.5" /><text x="200" y="52" font-size="19" text-anchor="middle" >ax² + bx + c</text><line x1="160" y1="70" x2="105.5" y2="113.6" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" /><polygon points="0,0 -10,-5 -10,5" fill="#FF8A1F" transform="translate(100 118) rotate(141.3)"/><line x1="240" y1="70" x2="294.5" y2="113.6" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" /><polygon points="0,0 -10,-5 -10,5" fill="#0B93D4" transform="translate(300 118) rotate(38.7)"/><rect x="40" y="122" width="130" height="44" rx="12" fill="#FFE9CC" stroke="#FF8A1F" stroke-width="3" /><text x="105" y="150" font-size="14" text-anchor="middle" >sum of zeroes</text><rect x="230" y="122" width="140" height="44" rx="12" fill="#E3F2FD" stroke="#0B93D4" stroke-width="3" /><text x="300" y="150" font-size="14" text-anchor="middle" >product of zeroes</text></svg>
