<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img">
<title>Number line with the zeroes minus root 3 and root 3 equally far from 0</title>
<style>.dr{animation:dr 4s ease-in-out infinite}@keyframes dr{0%{stroke-dasharray:0 1}60%,100%{stroke-dasharray:1 1}}.zp{transform-box:fill-box;transform-origin:center;animation:zp 1.6s ease-in-out infinite}@keyframes zp{50%{transform:scale(1.6)}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sw{transform-box:fill-box;transform-origin:center;animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translateY(-6px)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<line x1="20" y1="100" x2="377" y2="100" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><polygon points="0,0 -10,-5 -10,5" fill="#2B2F4A" transform="translate(384 100) rotate(0.0)"/><line x1="60" y1="94" x2="60" y2="106" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="60" y="124" font-size="12" text-anchor="middle" class="h" >−2</text><line x1="130" y1="94" x2="130" y2="106" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="130" y="124" font-size="12" text-anchor="middle" class="h" >−1</text><line x1="200" y1="94" x2="200" y2="106" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="200" y="124" font-size="12" text-anchor="middle" class="h" >0</text><line x1="270" y1="94" x2="270" y2="106" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="270" y="124" font-size="12" text-anchor="middle" class="h" >1</text><line x1="340" y1="94" x2="340" y2="106" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="340" y="124" font-size="12" text-anchor="middle" class="h" >2</text><circle cx="321.2" cy="100" r="8" fill="#3FA34D" stroke="#fff" stroke-width="1.5" class="zp"/><text x="321.2" y="78" font-size="15" text-anchor="middle" class="h" >√3</text><circle cx="78.8" cy="100" r="8" fill="#3FA34D" stroke="#fff" stroke-width="1.5" class="zp"/><text x="78.8" y="78" font-size="15" text-anchor="middle" class="h" >−√3</text><line x1="200" y1="150" x2="310.2" y2="150" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" /><polygon points="0,0 -10,-5 -10,5" fill="#FF8A1F" transform="translate(317.2 150) rotate(0.0)"/><line x1="200" y1="150" x2="89.8" y2="150" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" /><polygon points="0,0 -10,-5 -10,5" fill="#0B93D4" transform="translate(82.8 150) rotate(180.0)"/><text x="200" y="178" font-size="13" text-anchor="middle" fill="#8A8FB0" class="h" >same distance, opposite sides of 0</text></svg>
