<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A cheque for 20,000 rupees moving money from Salim's account holding 80,000 to a supplier's account holding 15,000</title><style>.cf0{animation:cf0 2.8s linear 0.0s infinite}@keyframes cf0{0.0%{transform:translate(0px,0px);opacity:0}8%{opacity:1}50.0%{transform:translate(40px,0px)}92%{opacity:1}100.0%{transform:translate(80px,0px);opacity:0}}.cf1{animation:cf1 2.8s linear -0.9333333333333332s infinite}@keyframes cf1{0.0%{transform:translate(0px,0px);opacity:0}8%{opacity:1}50.0%{transform:translate(40px,0px)}92%{opacity:1}100.0%{transform:translate(80px,0px);opacity:0}}.cf2{animation:cf2 2.8s linear -1.8666666666666665s infinite}@keyframes cf2{0.0%{transform:translate(0px,0px);opacity:0}8%{opacity:1}50.0%{transform:translate(40px,0px)}92%{opacity:1}100.0%{transform:translate(80px,0px);opacity:0}}
