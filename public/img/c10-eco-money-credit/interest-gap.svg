<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Two bars: an example 4 percent rate paid on deposits and a taller 10 percent rate charged on loans</title><style>.gp{animation:gp 2s ease-in-out infinite}@keyframes gp{50%{opacity:0.3}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><line x1="40" y1="200" x2="360" y2="200" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><rect x="90" y="160" width="70" height="40" rx="4" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" /><text x="125" y="152" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2B2F4A">4%</text><text x="125" y="220" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#2B2F4A">Paid on deposits</text><rect x="240" y="100" width="70" height="100" rx="4" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" /><text x="275" y="92" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2B2F4A">10%</text><text x="275" y="220" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#2B2F4A">Charged on loans</text><text x="200" y="38" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2B2F4A">Example rates per year</text><line x1="175" y1="100" x2="175" y2="160" stroke="#7C5CFF" stroke-width="3" stroke-linecap="round" class="gp"/><text x="200" y="128" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="start" fill="#7C5CFF">gap</text></svg>