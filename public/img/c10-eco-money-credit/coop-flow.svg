<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Members deposit with a cooperative society, which uses the deposits as collateral for a large bank loan and lends to members</title><style>.cp0{animation:cp0 2s linear 0.0s infinite}@keyframes cp0{0.0%{transform:translate(0px,0px);opacity:0}8%{opacity:1}92%{opacity:1}100.0%{transform:translate(41px,0px);opacity:0}}.cp1{animation:cp1 2s linear -1.0s infinite}@keyframes cp1{0.0%{transform:translate(0px,0px);opacity:0}8%{opacity:1}92%{opacity:1}100.0%{transform:translate(41px,0px);opacity:0}}.cq0{animation:cq0 2s linear -0.5s infinite}@keyframes cq0{0.0%{transform:translate(0px,0px);opacity:0}8%{opacity:1}92%{opacity:1}100.0%{transform:translate(-38px,0px);opacity:0}}.cq1{animation:cq1 2s linear -1.5s infinite}@keyframes cq1{0.0%{transform:translate(0px,0px);opacity:0}8%{opacity:1}92%{opacity:1}100.0%{transform:translate(-38px,0px);opacity:0}}
