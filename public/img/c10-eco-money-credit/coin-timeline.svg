<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A timeline of five coins from an early punch-marked coin to a modern coin</title><style>.c0{animation:cg 5s ease-in-out 0s infinite;transform-box:fill-box;transform-origin:center}.c1{animation:cg 5s ease-in-out 1s infinite;transform-box:fill-box;transform-origin:center}.c2{animation:cg 5s ease-in-out 2s infinite;transform-box:fill-box;transform-origin:center}.c3{animation:cg 5s ease-in-out 3s infinite;transform-box:fill-box;transform-origin:center}.c4{animation:cg 5s ease-in-out 4s infinite;transform-box:fill-box;transform-origin:center}@keyframes cg{0%,100%{transform:scale(1)}10%{transform:scale(1.15)}20%{transform:scale(1)}}
