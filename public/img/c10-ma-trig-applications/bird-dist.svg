<path class="pu" d="M256.2 178.4A36 36 0 0 0 249 200" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round"/>
<text x="239.5" y="188.8" font-size="13" text-anchor="middle" fill="#E5484D" class="h" >θ</text>
<g stroke="#7C5CFF" stroke-width="3.2" stroke-linecap="round"><line x1="285" y1="200" x2="285" y2="189.2"/><line x1="281" y1="200" x2="289" y2="200"/></g><circle cx="285" cy="185" r="4.2" fill="#7C5CFF"/>
