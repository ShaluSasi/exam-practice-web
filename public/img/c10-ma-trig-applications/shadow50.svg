<line x1="334" y1="211" x2="334" y2="221" stroke="#E5484D" stroke-width="2" stroke-linecap="round" />
<text x="246.5" y="231" font-size="13" text-anchor="middle" fill="#E5484D" class="h" >50 m</text>
</svg>
