<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A tower whose shadow is 50 m longer when the Sun is at 30 degrees than at 60 degrees</title>
<style>.fl{stroke-dasharray:9 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-15}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.45}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}@keyframes t1{from{transform:translate(0px,0px)}to{transform:translate(87.5px,151.5px)}}.t1{animation:t1 2.6s ease-in-out infinite}@keyframes t2{from{transform:translate(0px,0px)}to{transform:translate(262.4px,151.5px)}}.t2{animation:t2 2.6s ease-in-out infinite}</style>
<rect width="100%" height="100%" rx="16" fill="#E3F2FD"/>
<path d="M0 186H400V224Q400 240 384 240H16Q0 240 0 224Z" fill="#CDEBC5"/>
<line x1="0" y1="186" x2="400" y2="186" stroke="#6BAA5E" stroke-width="3" stroke-linecap="round" />
<polygon points="65.5,186 77.5,186 74.5,34.5 68.5,34.5" fill="#C9D2EC" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/>
<line x1="71.5" y1="34.5" x2="159" y2="186" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" class="fl"/>
<polygon points="0,0 -10,-5 -10,5" fill="#FF8A1F" transform="translate(119.7 117.8) rotate(60.0)"/>
<line x1="71.5" y1="34.5" x2="334" y2="186" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" class="fl"/>
<polygon points="0,0 -10,-5 -10,5" fill="#FF8A1F" transform="translate(215.9 117.8) rotate(30.0)"/>
<line x1="71.5" y1="186" x2="159" y2="186" stroke="#0B93D4" stroke-width="6" stroke-linecap="round" />
<line x1="159" y1="186" x2="334" y2="186" stroke="#E5484D" stroke-width="6" stroke-linecap="round" />
<path d="M159 186L139 151.4A40 40 0 0 0 119 186Z" fill="#0B93D4" fill-opacity=".22"/>
<path d="M334 186L299.3 166A40 40 0 0 0 294 186Z" fill="#E5484D" fill-opacity=".22"/>
<circle class="t1" cx="71.5" cy="34.5" r="4.5" fill="#fff" stroke="#FF8A1F" stroke-width="2.5"/>
<circle class="t2" cx="71.5" cy="34.5" r="4.5" fill="#fff" stroke="#FF8A1F" stroke-width="2.5"/>
<path class="pu" d="M139 151.4A40 40 0 0 0 119 186" fill="none" stroke="#0B93D4" stroke-width="3" stroke-linecap="round"/>
<text x="114" y="164" font-size="13" text-anchor="middle" fill="#0B93D4" class="h" >60°</text>
<path class="pu" d="M299.3 166A40 40 0 0 0 294 186" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round"/>
<text x="283.7" y="176.5" font-size="13" text-anchor="middle" fill="#E5484D" class="h" >30°</text>
<text x="62.5" y="204" font-size="13" text-anchor="middle" class="h" >B</text>
<text x="60.5" y="38.5" font-size="13" text-anchor="middle" class="h" >A</text>
<text x="159" y="206" font-size="13" text-anchor="middle" class="h" >C</text>
<text x="334" y="206" font-size="13" text-anchor="middle" class="h" >D</text>
<line x1="159" y1="216" x2="334" y2="216" stroke="#E5484D" stroke-width="2" stroke-linecap="round" />
