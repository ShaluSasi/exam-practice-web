<line x1="136.6" y1="202" x2="136.6" y2="57.2" stroke="#2B2F4A" stroke-width="7" stroke-linecap="round" />
<line x1="136.6" y1="57.2" x2="245.3" y2="202" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" class="fl"/>
<polygon points="0,0 -10,-5 -10,5" fill="#FF8A1F" transform="translate(196.4 136.8) rotate(53.1)"/>
<line x1="136.6" y1="202" x2="245.3" y2="202" stroke="#6BAA5E" stroke-width="5" stroke-linecap="round" />
<path d="M245.3 202L223.7 173.2A36 36 0 0 0 209.3 202Z" fill="#E5484D" fill-opacity=".22"/>
<circle class="t1" cx="136.6" cy="57.2" r="4.5" fill="#fff" stroke="#FF8A1F" stroke-width="2.5"/>
<path class="pu" d="M223.7 173.2A36 36 0 0 0 209.3 202" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round"/>
<text x="202.3" y="184.5" font-size="13" text-anchor="middle" fill="#E5484D" class="h" >θ</text>
<polyline points="136.6,192 146.6,192 146.6,202" fill="none" stroke="#2B2F4A" stroke-width="2"/>
