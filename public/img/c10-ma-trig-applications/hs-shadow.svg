<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A tower with its shadow 40 m longer when the Sun is at 30 degrees than at 60 degrees</title>
<style>.fl{stroke-dasharray:9 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-15}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.45}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}@keyframes t1{from{transform:translate(0px,0px)}to{transform:translate(86.1px,149.1px)}}.t1{animation:t1 2.6s ease-in-out infinite}@keyframes t2{from{transform:translate(0px,0px)}to{transform:translate(258.2px,149.1px)}}.t2{animation:t2 2.6s ease-in-out infinite}</style>
