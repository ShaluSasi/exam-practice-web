<line x1="129.8" y1="128" x2="51.6" y2="49.8" stroke="#8B5A2B" stroke-width="5" stroke-linecap="round" />
<path d="M129.8 128L108.6 106.8A30 30 0 0 0 99.8 128Z" fill="#E5484D" fill-opacity=".22"/>
