<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A pole with Sun rays at 15, 30, 45 and 60 degrees touching the ground at the tips of four different shadows</title>
<style>.fl{stroke-dasharray:9 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-15}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.45}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#E3F2FD"/>
<path d="M0 160.9H400V224Q400 240 384 240H16Q0 240 0 224Z" fill="#CDEBC5"/>
<line x1="0" y1="160.9" x2="400" y2="160.9" stroke="#6BAA5E" stroke-width="3" stroke-linecap="round" />
<line x1="68.3" y1="160.9" x2="68.3" y2="92.2" stroke="#2B2F4A" stroke-width="7" stroke-linecap="round" />
<line x1="68.3" y1="92.2" x2="324.7" y2="160.9" stroke="#7C5CFF" stroke-width="2.5" stroke-linecap="round" class="fl"/>
<line x1="68.3" y1="92.2" x2="187.3" y2="160.9" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" class="fl"/>
<line x1="68.3" y1="92.2" x2="137" y2="160.9" stroke="#3FA34D" stroke-width="2.5" stroke-linecap="round" class="fl"/>
<line x1="68.3" y1="92.2" x2="108" y2="160.9" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" class="fl"/>
<circle cx="324.7" cy="160.9" r="4" fill="#7C5CFF" stroke="#fff" stroke-width="1.5"/>
<text x="324.7" y="180.9" font-size="13" text-anchor="middle" fill="#7C5CFF" class="h" >15°</text>
<circle cx="187.3" cy="160.9" r="4" fill="#0B93D4" stroke="#fff" stroke-width="1.5"/>
<text x="187.3" y="180.9" font-size="13" text-anchor="middle" fill="#0B93D4" class="h" >30°</text>
<circle cx="137" cy="160.9" r="4" fill="#3FA34D" stroke="#fff" stroke-width="1.5"/>
<text x="137" y="180.9" font-size="13" text-anchor="middle" fill="#3FA34D" class="h" >45°</text>
<circle cx="108" cy="160.9" r="4" fill="#FF8A1F" stroke="#fff" stroke-width="1.5"/>
<text x="108" y="180.9" font-size="13" text-anchor="middle" fill="#FF8A1F" class="h" >60°</text>
</svg>
