<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img">
<title>A 12 m ladder leaning on a wall at 30 degrees to the ground</title>
<style>.fl{stroke-dasharray:9 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-15}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.45}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#E3F2FD"/>
<path d="M0 128H200V134Q200 150 184 150H16Q0 150 0 134Z" fill="#CDEBC5"/>
<line x1="0" y1="128" x2="200" y2="128" stroke="#6BAA5E" stroke-width="3" stroke-linecap="round" />
<rect x="23.9" y="12.8" width="27.7" height="115.2" fill="#FFD9A8" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/>
<line x1="147.4" y1="128" x2="51.6" y2="72.7" stroke="#8B5A2B" stroke-width="5" stroke-linecap="round" />
<path d="M147.4 128L121.4 113A30 30 0 0 0 117.4 128Z" fill="#E5484D" fill-opacity=".22"/>
<path class="pu" d="M121.4 113A30 30 0 0 0 117.4 128" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round"/>
<text x="108.8" y="121.6" font-size="13" text-anchor="middle" fill="#E5484D" class="h" >30°</text>
