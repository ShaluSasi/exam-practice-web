<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A vertical 8 m pole whose shadow is 8 m long when the Sun is at 45 degrees</title>
<style>.fl{stroke-dasharray:9 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-15}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.45}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFFFFF;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}@keyframes t1{from{transform:translate(0px,0px)}to{transform:translate(143.2px,143.2px)}}.t1{animation:t1 2.6s ease-in-out infinite}</style>
<rect width="100%" height="100%" rx="16" fill="#E3F2FD"/>
<path d="M0 200H400V224Q400 240 384 240H16Q0 240 0 224Z" fill="#CDEBC5"/>
<line x1="0" y1="200" x2="400" y2="200" stroke="#6BAA5E" stroke-width="3" stroke-linecap="round" />
<line x1="119.5" y1="200" x2="119.5" y2="56.8" stroke="#2B2F4A" stroke-width="7" stroke-linecap="round" />
<line x1="119.5" y1="200" x2="262.6" y2="200" stroke="#4B5A7A" stroke-width="6" stroke-linecap="round" />
<line x1="119.5" y1="56.8" x2="262.6" y2="200" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" class="fl"/>
<polygon points="0,0 -10,-5 -10,5" fill="#FF8A1F" transform="translate(198.2 135.6) rotate(45.0)"/>
<path d="M262.6 200L234.3 171.7A40 40 0 0 0 222.6 200Z" fill="#E5484D" fill-opacity=".22"/>
<circle class="t1" cx="119.5" cy="56.8" r="4.5" fill="#fff" stroke="#FF8A1F" stroke-width="2.5"/>
<path class="pu" d="M234.3 171.7A40 40 0 0 0 222.6 200" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round"/>
<text x="212.7" y="183.3" font-size="13" text-anchor="middle" fill="#E5484D" class="h" >45°</text>
<text x="131.5" y="128.4" font-size="13" text-anchor="start" class="h" >8 m</text>
<line x1="119.5" y1="218" x2="262.6" y2="218" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" />
<line x1="119.5" y1="213" x2="119.5" y2="223" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" />
<line x1="262.6" y1="213" x2="262.6" y2="223" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" />
<text x="191.1" y="233" font-size="13" text-anchor="middle" fill="#2B2F4A" class="h" >8 m</text>
</svg>
