<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A cylinder of radius 6 cm and height 18 cm, full of water, with a cone on a hemisphere standing inside it</title>
<style>.pu{animation:pu 1.8s ease-in-out infinite}@keyframes pu{50%{opacity:.25}}.as{animation:as 4s ease-in-out infinite}@keyframes as{0%,55%{transform:none}75%{transform:translateY(-16px)}95%,100%{transform:none}}.as2{animation:as2 4s ease-in-out infinite}@keyframes as2{0%,55%{transform:none}75%{transform:translateX(-18px)}95%,100%{transform:none}}.as3{animation:as3 4s ease-in-out infinite}@keyframes as3{0%,55%{transform:none}75%{transform:translateX(18px)}95%,100%{transform:none}}.fl{stroke-dasharray:8 5;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-13}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="83.3" y="20" width="133.3" height="200" fill="#BFE3F7" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><path d="M83.3 153.3A66.7 66.7 0 0 0 216.7 153.3Z" fill="#A8E0AE" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polygon points="83.3,153.3 150,20 216.7,153.3" fill="#FFC183" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><line x1="242.7" y1="20" x2="242.7" y2="220" stroke="#E5484D" stroke-width="2" stroke-linecap="round"/><line x1="237.7" y1="20" x2="247.7" y2="20" stroke="#E5484D" stroke-width="2" stroke-linecap="round"/><line x1="237.7" y1="220" x2="247.7" y2="220" stroke="#E5484D" stroke-width="2" stroke-linecap="round"/><text x="250.7" y="124" font-size="13" text-anchor="start" class="h">18 cm</text><line x1="83.3" y1="153.3" x2="216.7" y2="153.3" stroke="#E5484D" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 3"/><text x="150" y="171.3" font-size="12" text-anchor="middle" class="h">2r = 12 cm</text><line x1="57.3" y1="20" x2="57.3" y2="153.3" stroke="#E5484D" stroke-width="2" stroke-linecap="round"/><line x1="52.3" y1="20" x2="62.3" y2="20" stroke="#E5484D" stroke-width="2" stroke-linecap="round"/><line x1="52.3" y1="153.3" x2="62.3" y2="153.3" stroke="#E5484D" stroke-width="2" stroke-linecap="round"/><text x="49.3" y="90.7" font-size="13" text-anchor="end" class="h">12 cm</text><text x="290" y="120" font-size="11.9" text-anchor="start" class="h">Cone + hemisphere</text><text x="290" y="138" font-size="13" text-anchor="start" class="h">stand in the</text><text x="290" y="156" font-size="13" text-anchor="start" class="h">full cylinder</text></svg>