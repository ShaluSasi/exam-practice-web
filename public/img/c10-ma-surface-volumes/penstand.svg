<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img">
<title>A wooden pen stand: a cuboid 20 cm by 12 cm by 4 cm with six conical holes</title>
<style>.pu{animation:pu 1.8s ease-in-out infinite}@keyframes pu{50%{opacity:.25}}.as{animation:as 4s ease-in-out infinite}@keyframes as{0%,55%{transform:none}75%{transform:translateY(-16px)}95%,100%{transform:none}}.as2{animation:as2 4s ease-in-out infinite}@keyframes as2{0%,55%{transform:none}75%{transform:translateX(-18px)}95%,100%{transform:none}}.as3{animation:as3 4s ease-in-out infinite}@keyframes as3{0%,55%{transform:none}75%{transform:translateX(18px)}95%,100%{transform:none}}.fl{stroke-dasharray:8 5;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-13}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="50" y="150" width="300" height="60" fill="#E2B77A" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><polygon points="50,150 350,150 350,70 50,70" fill="#F2D6A4" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><polygon points="350,150 350,70 350,70" fill="none" stroke="none" stroke-width="0" stroke-linejoin="round" /><ellipse cx="110" cy="126" rx="10.5" ry="4.7" fill="#6B4A2A" stroke="#2B2F4A" stroke-width="2" /><ellipse cx="110" cy="94" rx="10.5" ry="4.7" fill="#6B4A2A" stroke="#2B2F4A" stroke-width="2" /><ellipse cx="200" cy="126" rx="10.5" ry="4.7" fill="#6B4A2A" stroke="#2B2F4A" stroke-width="2" /><ellipse cx="200" cy="94" rx="10.5" ry="4.7" fill="#6B4A2A" stroke="#2B2F4A" stroke-width="2" /><ellipse cx="290" cy="126" rx="10.5" ry="4.7" fill="#6B4A2A" stroke="#2B2F4A" stroke-width="2" /><ellipse cx="290" cy="94" rx="10.5" ry="4.7" fill="#6B4A2A" stroke="#2B2F4A" stroke-width="2" /><line x1="50" y1="228" x2="350" y2="228" stroke="#E5484D" stroke-width="2" stroke-linecap="round" /><text x="200" y="242" font-size="13" text-anchor="middle" class="h" >20 cm</text><line x1="364" y1="150" x2="364" y2="210" stroke="#E5484D" stroke-width="2" stroke-linecap="round" /><line x1="359" y1="150" x2="369" y2="150" stroke="#E5484D" stroke-width="2" stroke-linecap="round" /><line x1="359" y1="210" x2="369" y2="210" stroke="#E5484D" stroke-width="2" stroke-linecap="round" /><text x="372" y="184" font-size="13" text-anchor="start" class="h" >4 cm</text><text x="200" y="62" font-size="13" text-anchor="middle" class="h" >12 cm deep (front to back); 6 conical holes</text><text x="200" y="24" font-size="12" text-anchor="middle" class="h" >each hole: r = 0.7 cm, depth 3 cm</text></svg>
