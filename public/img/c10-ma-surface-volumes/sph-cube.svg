<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
<title>A sphere and a cube made from the same amount of clay</title>
<style>.pu{animation:pu 1.8s ease-in-out infinite}@keyframes pu{50%{opacity:.25}}.as{animation:as 4s ease-in-out infinite}@keyframes as{0%,55%{transform:none}75%{transform:translateY(-16px)}95%,100%{transform:none}}.as2{animation:as2 4s ease-in-out infinite}@keyframes as2{0%,55%{transform:none}75%{transform:translateX(-18px)}95%,100%{transform:none}}.as3{animation:as3 4s ease-in-out infinite}@keyframes as3{0%,55%{transform:none}75%{transform:translateX(18px)}95%,100%{transform:none}}.fl{stroke-dasharray:8 5;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-13}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<line x1="10" y1="200" x2="390" y2="200" stroke="#D9C49A" stroke-width="6" stroke-linecap="round" /><circle cx="110" cy="124" r="60" fill="#A8E0AE" stroke="#2B2F4A" stroke-width="3" /><path d="M50 124A60 18 0 0 0 170 124" fill="none" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 3"/><rect x="230" y="93.3" width="96.7" height="96.7" fill="#D3C9FF" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><polygon points="230,93.3 326.7,93.3 326.7,64.3 230,64.3" fill="#EDE8FF" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><text x="110" y="36" font-size="13" text-anchor="middle" class="h" >sphere</text><text x="278.4" y="36" font-size="13" text-anchor="middle" class="h" >cube</text><text x="200" y="214" font-size="12" text-anchor="middle" class="h" >Both are made from the same amount of clay</text></svg>
