<line x1="10" y1="232" x2="390" y2="232" stroke="#D9C49A" stroke-width="6" stroke-linecap="round" /><path d="M103 130A62 62 0 0 0 227 130Z" fill="#A8E0AE" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M103 130A62 18.6 0 0 0 227 130" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><g class="as"><path d="M103 130L165 30L227 130A62 18.6 0 0 1 103 130Z" fill="#FFC183" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /></g><text x="300" y="72" font-size="13" text-anchor="start" class="h" >volume of cone</text><text x="300" y="90" font-size="13" text-anchor="start" class="h" >+ volume of</text><text x="300" y="108" font-size="13" text-anchor="start" class="h" >hemisphere</text></svg>
