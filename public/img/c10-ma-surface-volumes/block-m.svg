<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>A cube of edge 8 cm with a hemisphere of diameter 6 cm on top</title>
<style>.pu{animation:pu 1.8s ease-in-out infinite}@keyframes pu{50%{opacity:.25}}.as{animation:as 4s ease-in-out infinite}@keyframes as{0%,55%{transform:none}75%{transform:translateY(-16px)}95%,100%{transform:none}}.as2{animation:as2 4s ease-in-out infinite}@keyframes as2{0%,55%{transform:none}75%{transform:translateX(-18px)}95%,100%{transform:none}}.as3{animation:as3 4s ease-in-out infinite}@keyframes as3{0%,55%{transform:none}75%{transform:translateX(18px)}95%,100%{transform:none}}.fl{stroke-dasharray:8 5;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-13}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="50" y="215" width="260" height="20" fill="#D9B77A" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><rect x="120" y="85" width="130" height="130" fill="#D3C9FF" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><polygon points="120,85 250,85 250,46 120,46" fill="#EDE8FF" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><g class="as"><path d="M136.2 65.5A48.8 48.8 0 0 1 233.8 65.5A48.8 14.6 0 0 1 136.2 65.5Z" fill="#A8E0AE" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /></g><line x1="120" y1="195" x2="250" y2="195" stroke="#E5484D" stroke-width="2" stroke-linecap="round" /><line x1="120" y1="190" x2="120" y2="200" stroke="#E5484D" stroke-width="2" stroke-linecap="round" /><line x1="250" y1="190" x2="250" y2="200" stroke="#E5484D" stroke-width="2" stroke-linecap="round" /><text x="185" y="188" font-size="13" text-anchor="middle" class="h" >edge 8 cm</text><line x1="136.2" y1="65.5" x2="233.8" y2="65.5" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" /><text x="241.8" y="69.5" font-size="12" text-anchor="start" class="h" >d = 6 cm</text></svg>
