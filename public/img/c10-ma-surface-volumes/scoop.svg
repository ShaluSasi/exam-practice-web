<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A cylinder of radius 3.5 cm and height 10 cm with a hemispherical hollow scooped from each end</title>
<style>.pu{animation:pu 1.8s ease-in-out infinite}@keyframes pu{50%{opacity:.25}}.as{animation:as 4s ease-in-out infinite}@keyframes as{0%,55%{transform:none}75%{transform:translateY(-16px)}95%,100%{transform:none}}.as2{animation:as2 4s ease-in-out infinite}@keyframes as2{0%,55%{transform:none}75%{transform:translateX(-18px)}95%,100%{transform:none}}.as3{animation:as3 4s ease-in-out infinite}@keyframes as3{0%,55%{transform:none}75%{transform:translateX(18px)}95%,100%{transform:none}}.fl{stroke-dasharray:8 5;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-13}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="83.5" y="25" width="133" height="190" fill="#9CD2F2" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><path d="M83.5 25A66.5 66.5 0 0 0 216.5 25Z" fill="#FFE9CE" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M83.5 215A66.5 66.5 0 0 1 216.5 215Z" fill="#FFE9CE" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="150" y="128" font-size="13" text-anchor="middle" class="h" >solid</text><line x1="150" y1="25" x2="216.5" y2="25" stroke="#E5484D" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 3" /><circle cx="150" cy="25" r="3" fill="#E5484D"/><text x="183.2" y="107.5" font-size="12" text-anchor="middle" class="h" >r = 3.5 cm</text><line x1="242.5" y1="25" x2="242.5" y2="215" stroke="#E5484D" stroke-width="2" stroke-linecap="round" /><line x1="237.5" y1="25" x2="247.5" y2="25" stroke="#E5484D" stroke-width="2" stroke-linecap="round" /><line x1="237.5" y1="215" x2="247.5" y2="215" stroke="#E5484D" stroke-width="2" stroke-linecap="round" /><text x="250.5" y="124" font-size="13" text-anchor="start" class="h" >10 cm</text><text x="300" y="60" font-size="13" text-anchor="start" class="h" >Cut through the</text><text x="300" y="78" font-size="13" text-anchor="start" class="h" >middle: two</text><text x="300" y="96" font-size="13" text-anchor="start" class="h" >hemispherical</text><text x="300" y="114" font-size="13" text-anchor="start" class="h" >hollows</text></svg>
