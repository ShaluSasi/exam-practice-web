<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
<title>Two cubes joined face to face with the touching faces marked in red</title>
<style>.pu{animation:pu 1.8s ease-in-out infinite}@keyframes pu{50%{opacity:.25}}.as{animation:as 4s ease-in-out infinite}@keyframes as{0%,55%{transform:none}75%{transform:translateY(-16px)}95%,100%{transform:none}}.as2{animation:as2 4s ease-in-out infinite}@keyframes as2{0%,55%{transform:none}75%{transform:translateX(-18px)}95%,100%{transform:none}}.as3{animation:as3 4s ease-in-out infinite}@keyframes as3{0%,55%{transform:none}75%{transform:translateX(18px)}95%,100%{transform:none}}.fl{stroke-dasharray:8 5;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-13}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<line x1="10" y1="182" x2="390" y2="182" stroke="#D9C49A" stroke-width="6" stroke-linecap="round" /><rect x="120" y="92" width="78" height="78" fill="#D3C9FF" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><polygon points="120,92 198,92 198,68 120,68" fill="#EDE8FF" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><g class="as3"><rect x="198" y="92" width="78" height="78" fill="#9CD2F2" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><polygon points="198,92 276,92 276,68 198,68" fill="#D5EEFC" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /></g><g class="pu"><line x1="198" y1="170" x2="198" y2="92" stroke="#E5484D" stroke-width="5" stroke-linecap="round" /></g><text x="200" y="36" font-size="13" text-anchor="middle" class="h" >Faces that touch are no longer on the outside</text></svg>
