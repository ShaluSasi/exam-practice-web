<style>.pu{animation:pu 1.8s ease-in-out infinite}@keyframes pu{50%{opacity:.25}}.as{animation:as 4s ease-in-out infinite}@keyframes as{0%,55%{transform:none}75%{transform:translateY(-16px)}95%,100%{transform:none}}.as2{animation:as2 4s ease-in-out infinite}@keyframes as2{0%,55%{transform:none}75%{transform:translateX(-18px)}95%,100%{transform:none}}.as3{animation:as3 4s ease-in-out infinite}@keyframes as3{0%,55%{transform:none}75%{transform:translateX(18px)}95%,100%{transform:none}}.fl{stroke-dasharray:8 5;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-13}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
