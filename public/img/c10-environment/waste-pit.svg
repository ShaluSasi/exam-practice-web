<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Cross-section of a soil pit with buried peel, paper, a medicine strip and cloth, with water drops falling</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#E3F2FD"/><rect x="30" y="50" width="340" height="170" rx="10" fill="#B07A4A" stroke="#2B2F4A" stroke-width="3"/><rect x="30" y="50" width="340" height="20" rx="8" fill="#6DBE6D"/><rect x="70" y="95" width="260" height="110" rx="8" fill="#8D5E36" stroke="#2B2F4A" stroke-width="3" stroke-dasharray="6 5"/><g transform="translate(110 150) scale(0.9)"><g><path d="M-22 -8Q-4 22 22 -12L16 -14Q-2 6 -16 -14Z" fill="#FFD84D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="2" cy="4" r="2" fill="#8B5A2B"/></g></g><g transform="translate(175 150) scale(0.8)"><g><path d="M-14 -22H8L16 -14V22H-14Z" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 -22V-14H16" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -8H8M-8 0H8M-8 8H4" stroke="#9AA3B5" stroke-width="2.5" stroke-linecap="round"/></g></g><g transform="translate(240 150) scale(0.8)"><g><rect x="-14" y="-24" width="28" height="48" rx="5" fill="#D9DEE8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-6" cy="-15" r="4.5" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><circle cx="-6" cy="-5" r="4.5" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><circle cx="-6" cy="5" r="4.5" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><circle cx="-6" cy="15" r="4.5" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><circle cx="6" cy="-15" r="4.5" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><circle cx="6" cy="-5" r="4.5" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><circle cx="6" cy="5" r="4.5" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><circle cx="6" cy="15" r="4.5" fill="#fff" stroke="#2B2F4A" stroke-width="2"/></g></g><g transform="translate(300 152) scale(0.8)"><g><path d="M-10 -20L-24 -10L-17 0L-10 -4V22H10V-4L17 0L24 -10L10 -20Q0 -14 -10 -20Z" fill="#7CC4F2" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><g class="fall" style="animation-delay:0.0s"><path d="M100 38q-4 6 0 10q4 -4 0 -10z" fill="#0B93D4"/></g><g class="fall" style="animation-delay:0.5s"><path d="M190 38q-4 6 0 10q4 -4 0 -10z" fill="#0B93D4"/></g><g class="fall" style="animation-delay:1.0s"><path d="M280 38q-4 6 0 10q4 -4 0 -10z" fill="#0B93D4"/></g><text x="200" y="22" font-size="12" text-anchor="middle">Buried waste kept moist</text></svg>