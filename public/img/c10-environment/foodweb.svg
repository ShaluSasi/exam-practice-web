20M14 22Q16 8 24 -2" fill="none" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/></g></g><g transform="translate(130 200) scale(0.8)"><g class="bob"><path d="M-22 -6Q-30 -18 -38 -14" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 6L18 -12L30 16M-6 10L-9 22M2 10L1 22" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="2" cy="4" rx="18" ry="7" fill="#8BC34A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="4" cy="1" rx="11" ry="3.5" fill="#C5E1A5"/><circle cx="-18" cy="-1" r="7" fill="#8BC34A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-20" cy="-3" r="2" fill="#2B2F4A"/></g></g><g transform="translate(130 90) scale(0.9)"><g class="bob" style="animation-delay:0.4s"><path d="M16 6Q32 4 30 -12" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="2" cy="4" rx="17" ry="11" fill="#B8B8C8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-14" cy="0" r="8" fill="#B8B8C8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-12" cy="-9" r="5" fill="#F7A8B8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-19" cy="-7" r="4" fill="#F7A8B8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-16" cy="-2" r="2" fill="#2B2F4A"/><circle cx="-22" cy="2" r="2" fill="#E5484D"/></g></g><g transform="translate(230 200) scale(0.9)"><g><path d="M-20 10Q-34 18-24 24L-6 20M20 10Q34 18 24 24L6 20" fill="#2E8B3E" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="0" cy="4" rx="22" ry="16" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-11" cy="-13" r="8" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="11" cy="-13" r="8" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-11" cy="-14" r="4.5" fill="#fff"/><circle cx="11" cy="-14" r="4.5" fill="#fff"/><circle cx="-10" cy="-14" r="2.2" fill="#2B2F4A"/><circle cx="12" cy="-14" r="2.2" fill="#2B2F4A"/><path d="M-12 5Q0 14 12 5" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="0" cy="13" rx="10" ry="4" fill="#C5E8B0" opacity=".7"/></g></g><g transform="translate(290 130) scale(0.9)"><g class="bob" style="animation-delay:0.8s"><path d="M-26 16C-20 -6-8 -6-2 6S16 18 22 2" fill="none" stroke="#2B2F4A" stroke-width="11" stroke-linecap="round"/><path d="M-26 16C-20 -6-8 -6-2 6S16 18 22 2" fill="none" stroke="#F2B233" stroke-width="6" stroke-linecap="round"/><circle cx="24" cy="0" r="8" fill="#F2B233" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="26" cy="-3" r="2" fill="#2B2F4A"/><path d="M31 1l7 -2m-7 2l7 4" stroke="#E5484D" stroke-width="2" fill="none" stroke-linecap="round"/></g></g><g transform="translate(350 50) scale(0.9)"><g><path d="M-14 6L-32 16L-28 2Z" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="0" cy="2" rx="16" ry="11" fill="#A0693A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-6 0Q-20 -24 -32 -10Q-18 -6 -6 8Z" fill="#7B4A21" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="14" cy="-8" r="8" fill="#B8814F" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 -9L30 -5L20 -2Z" fill="#FFC93C" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16" cy="-10" r="2" fill="#2B2F4A"/><path d="M-2 12V20M6 12V20" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg>