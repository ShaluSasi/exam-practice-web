<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Four steps going up: grass, grasshopper, frog and snake, numbered 1 to 4</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="20" y="170" width="88" height="60" rx="8" fill="#CDE9B5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(64 150) scale(0.85)"><g class="bob"><path d="M-16 22Q-18 2-24 -14M-6 22Q-8 -6-6 -24M4 22Q6 -2 14 -20M14 22Q16 8 24 -2" fill="none" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/></g></g><text x="64" y="194" font-size="22" text-anchor="middle">1</text><rect x="112" y="130" width="88" height="100" rx="8" fill="#FFE9A8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(156 110) scale(0.85)"><g class="bob" style="animation-delay:0.3s"><path d="M-22 -6Q-30 -18 -38 -14" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 6L18 -12L30 16M-6 10L-9 22M2 10L1 22" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="2" cy="4" rx="18" ry="7" fill="#8BC34A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="4" cy="1" rx="11" ry="3.5" fill="#C5E1A5"/><circle cx="-18" cy="-1" r="7" fill="#8BC34A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-20" cy="-3" r="2" fill="#2B2F4A"/></g></g><text x="156" y="154" font-size="22" text-anchor="middle">2</text><rect x="204" y="90" width="88" height="140" rx="8" fill="#FFD0A0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(248 70) scale(0.85)"><g class="bob" style="animation-delay:0.6s"><path d="M-20 10Q-34 18-24 24L-6 20M20 10Q34 18 24 24L6 20" fill="#2E8B3E" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="0" cy="4" rx="22" ry="16" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-11" cy="-13" r="8" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="11" cy="-13" r="8" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-11" cy="-14" r="4.5" fill="#fff"/><circle cx="11" cy="-14" r="4.5" fill="#fff"/><circle cx="-10" cy="-14" r="2.2" fill="#2B2F4A"/><circle cx="12" cy="-14" r="2.2" fill="#2B2F4A"/><path d="M-12 5Q0 14 12 5" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="0" cy="13" rx="10" ry="4" fill="#C5E8B0" opacity=".7"/></g></g><text x="248" y="114" font-size="22" text-anchor="middle">3</text><rect x="296" y="50" width="88" height="180" rx="8" fill="#F7B7B7" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(340 30) scale(0.85)"><g class="bob" style="animation-delay:0.8999999999999999s"><path d="M-26 16C-20 -6-8 -6-2 6S16 18 22 2" fill="none" stroke="#2B2F4A" stroke-width="11" stroke-linecap="round"/><path d="M-26 16C-20 -6-8 -6-2 6S16 18 22 2" fill="none" stroke="#F2B233" stroke-width="6" stroke-linecap="round"/><circle cx="24" cy="0" r="8" fill="#F2B233" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="26" cy="-3" r="2" fill="#2B2F4A"/><path d="M31 1l7 -2m-7 2l7 4" stroke="#E5484D" stroke-width="2" fill="none" stroke-linecap="round"/></g></g><text x="340" y="74" font-size="22" text-anchor="middle">4</text><text x="200" y="18" font-size="12" text-anchor="middle">Each step is a trophic level</text></svg>