<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A garden with the sun, a rose plant, a butterfly, a frog and grass</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#E3F2FD"/><rect y="190" width="400" height="50" fill="#8D6E4E"/><rect y="182" width="400" height="12" rx="6" fill="#6DBE6D"/><g transform="translate(270 40) scale(0.8)"><g class="drift"><path d="M-26 8Q-34 8 -32 -2Q-30 -10 -20 -8Q-18 -22 -4 -18Q6 -26 16 -14Q30 -14 30 -2Q32 8 22 8Z" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(60 45) scale(1.1)"><g><g class="spin"><line x1="17.0" y1="0.0" x2="24.0" y2="0.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="12.0" y1="12.0" x2="17.0" y2="17.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="0.0" y1="17.0" x2="0.0" y2="24.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="-12.0" y1="12.0" x2="-17.0" y2="17.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="-17.0" y1="0.0" x2="-24.0" y2="0.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="-12.0" y1="-12.0" x2="-17.0" y2="-17.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="-0.0" y1="-17.0" x2="-0.0" y2="-24.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="12.0" y1="-12.0" x2="17.0" y2="-17.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/></g><circle r="12" fill="#FFC93C" stroke="#FF8A1F" stroke-width="3"/></g></g><g transform="translate(135 158) scale(1.2)"><g><path d="M0 24V-4" stroke="#3FA34D" stroke-width="4" stroke-linecap="round"/><path d="M0 14Q-14 8 -16 14Q-8 20 0 14M0 8Q14 2 16 8Q8 14 0 8" fill="#4CB85A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-12" r="11" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-12" r="5" fill="#FF8A8F"/></g></g><g transform="translate(210 85) scale(1)"><g class="bob"><ellipse cx="-11" cy="-5" rx="11" ry="9" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="11" cy="-5" rx="11" ry="9" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="-8" cy="9" rx="7" ry="6" fill="#FFB347" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="8" cy="9" rx="7" ry="6" fill="#FFB347" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-2" y="-12" width="4" height="26" rx="2" fill="#2B2F4A"/><path d="M-1 -12Q-6 -22 -10 -22M1 -12Q6 -22 10 -22" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(285 172) scale(1)"><g><path d="M-20 10Q-34 18-24 24L-6 20M20 10Q34 18 24 24L6 20" fill="#2E8B3E" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="0" cy="4" rx="22" ry="16" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-11" cy="-13" r="8" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="11" cy="-13" r="8" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-11" cy="-14" r="4.5" fill="#fff"/><circle cx="11" cy="-14" r="4.5" fill="#fff"/><circle cx="-10" cy="-14" r="2.2" fill="#2B2F4A"/><circle cx="12" cy="-14" r="2.2" fill="#2B2F4A"/><path d="M-12 5Q0 14 12 5" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="0" cy="13" rx="10" ry="4" fill="#C5E8B0" opacity=".7"/></g></g><g transform="translate(350 168) scale(1.2)"><g><path d="M-16 22Q-18 2-24 -14M-6 22Q-8 -6-6 -24M4 22Q6 -2 14 -20M14 22Q16 8 24 -2" fill="none" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/></g></g></svg>