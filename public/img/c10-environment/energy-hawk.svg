<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Chain grass, mouse, snake, hawk; the energy in the grass is unknown and the hawk has 50 joules</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><g transform="translate(52 135) scale(1.15)"><g><path d="M-16 22Q-18 2-24 -14M-6 22Q-8 -6-6 -24M4 22Q6 -2 14 -20M14 22Q16 8 24 -2" fill="none" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/></g></g><line x1="86" y1="135" x2="116" y2="135" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round" class="fl" marker-end="url(#aho)"/><g transform="translate(150 135) scale(1.0)"><g class="bob" style="animation-delay:0.25s"><path d="M16 6Q32 4 30 -12" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="2" cy="4" rx="17" ry="11" fill="#B8B8C8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-14" cy="0" r="8" fill="#B8B8C8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-12" cy="-9" r="5" fill="#F7A8B8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-19" cy="-7" r="4" fill="#F7A8B8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-16" cy="-2" r="2" fill="#2B2F4A"/><circle cx="-22" cy="2" r="2" fill="#E5484D"/></g></g><line x1="184" y1="135" x2="214" y2="135" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round" class="fl" marker-end="url(#aho)"/><g transform="translate(248 135) scale(1.0)"><g class="bob" style="animation-delay:0.5s"><path d="M-26 16C-20 -6-8 -6-2 6S16 18 22 2" fill="none" stroke="#2B2F4A" stroke-width="11" stroke-linecap="round"/><path d="M-26 16C-20 -6-8 -6-2 6S16 18 22 2" fill="none" stroke="#F2B233" stroke-width="6" stroke-linecap="round"/><circle cx="24" cy="0" r="8" fill="#F2B233" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="26" cy="-3" r="2" fill="#2B2F4A"/><path d="M31 1l7 -2m-7 2l7 4" stroke="#E5484D" stroke-width="2" fill="none" stroke-linecap="round"/></g></g><line x1="282" y1="135" x2="312" y2="135" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round" class="fl" marker-end="url(#aho)"/><g transform="translate(346 135) scale(1.0)"><g class="bob" style="animation-delay:0.75s"><path d="M-14 6L-32 16L-28 2Z" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="0" cy="2" rx="16" ry="11" fill="#A0693A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-6 0Q-20 -24 -32 -10Q-18 -6 -6 8Z" fill="#7B4A21" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="14" cy="-8" r="8" fill="#B8814F" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 -9L30 -5L20 -2Z" fill="#FFC93C" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16" cy="-10" r="2" fill="#2B2F4A"/><path d="M-2 12V20M6 12V20" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="52" y="85" font-size="22" text-anchor="middle" style="fill:#E5484D">? J</text><text x="346" y="80" font-size="22" text-anchor="middle" style="fill:#3FA34D">50 J</text><text x="200" y="205" font-size="12" text-anchor="middle">Four trophic levels</text></svg>