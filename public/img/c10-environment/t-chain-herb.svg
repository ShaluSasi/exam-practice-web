<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>Picture option</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#EAF6E4"/><g transform="translate(32 76) scale(0.6)"><g><path d="M-14 10V24M-6 10V24M8 10V24M16 10V24" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="0" cy="0" rx="22" ry="12" fill="#E8D5B5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-26" cy="-8" r="9" fill="#E8D5B5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-29" cy="-10" r="2" fill="#2B2F4A"/><path d="M-31 -15Q-34 -25 -27 -23M-26 -16Q-26 -26 -20 -24" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-34 -2L-36 6" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 -2Q30 -8 28 -14" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(100 76) scale(0.6)"><g><path d="M-14 10V24M-6 10V24M8 10V24M16 10V24" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="0" cy="0" rx="22" ry="12" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-26" cy="-8" r="9" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-29" cy="-10" r="2" fill="#2B2F4A"/><path d="M-31 -15Q-34 -23 -29 -22M-23 -16Q-22 -24 -18 -22" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-6" cy="-2" r="5" fill="#2B2F4A"/><circle cx="10" cy="4" r="4" fill="#2B2F4A"/><ellipse cx="-33" cy="-5" rx="5" ry="4" fill="#F7A8B8"/><path d="M22 -2Q30 4 27 14" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(168 76) scale(0.5)"><g><path d="M-14 12V28M-4 12V28M10 12V28M20 12V28" stroke="#2B2F4A" stroke-width="7" stroke-linecap="round"/><path d="M-14 12V28M-4 12V28M10 12V28M20 12V28" stroke="#9AA5B8" stroke-width="3" stroke-linecap="round"/><ellipse cx="2" cy="0" rx="26" ry="16" fill="#9AA5B8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-26" cy="-6" r="12" fill="#9AA5B8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-36 0Q-44 16 -35 24" fill="none" stroke="#2B2F4A" stroke-width="9" stroke-linecap="round"/><path d="M-36 0Q-44 16 -35 24" fill="none" stroke="#9AA5B8" stroke-width="4" stroke-linecap="round"/><ellipse cx="-18" cy="-6" rx="7" ry="10" fill="#7D8AA3" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-30" cy="-9" r="2" fill="#2B2F4A"/></g></g><line x1="56" y1="76" x2="74" y2="76" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><line x1="124" y1="76" x2="142" y2="76" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/></svg>