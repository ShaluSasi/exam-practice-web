 stroke="#E5484D" stroke-width="2" fill="none" stroke-linecap="round"/></g></g><g transform="translate(200 90) scale(0.75)"><g><path d="M-20 10Q-34 18-24 24L-6 20M20 10Q34 18 24 24L6 20" fill="#2E8B3E" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="0" cy="4" rx="22" ry="16" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-11" cy="-13" r="8" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="11" cy="-13" r="8" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-11" cy="-14" r="4.5" fill="#fff"/><circle cx="11" cy="-14" r="4.5" fill="#fff"/><circle cx="-10" cy="-14" r="2.2" fill="#2B2F4A"/><circle cx="12" cy="-14" r="2.2" fill="#2B2F4A"/><path d="M-12 5Q0 14 12 5" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="0" cy="13" rx="10" ry="4" fill="#C5E8B0" opacity=".7"/></g></g><g transform="translate(200 134) scale(0.8)"><g><path d="M-22 -6Q-30 -18 -38 -14" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 6L18 -12L30 16M-6 10L-9 22M2 10L1 22" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="2" cy="4" rx="18" ry="7" fill="#8BC34A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="4" cy="1" rx="11" ry="3.5" fill="#C5E1A5"/><circle cx="-18" cy="-1" r="7" fill="#8BC34A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-20" cy="-3" r="2" fill="#2B2F4A"/></g></g><g transform="translate(140 178) scale(0.8)"><g><path d="M-16 22Q-18 2-24 -14M-6 22Q-8 -6-6 -24M4 22Q6 -2 14 -20M14 22Q16 8 24 -2" fill="none" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/></g></g><g transform="translate(200 178) scale(0.9)"><g><path d="M-16 22Q-18 2-24 -14M-6 22Q-8 -6-6 -24M4 22Q6 -2 14 -20M14 22Q16 8 24 -2" fill="none" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/></g></g><g transform="translate(260 178) scale(0.8)"><g><path d="M-16 22Q-18 2-24 -14M-6 22Q-8 -6-6 -24M4 22Q6 -2 14 -20M14 22Q16 8 24 -2" fill="none" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/></g></g><text x="200" y="226" font-size="12" text-anchor="middle">Energy is lost at every step</text></svg>