94C" stroke="#2B2F4A" stroke-width="2"/><ellipse cx="12" cy="-16" rx="3.5" ry="7" fill="#F2C94C" stroke="#2B2F4A" stroke-width="2"/><ellipse cx="0" cy="-8" rx="3.5" ry="7" fill="#F2C94C" stroke="#2B2F4A" stroke-width="2"/></g></g><g transform="translate(268 62) scale(0.4)"><g><path d="M16 0L32 -11L32 11Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="0" cy="0" rx="20" ry="12" fill="#FFA94D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-10" cy="-3" r="3" fill="#fff"/><circle cx="-11" cy="-3" r="1.5" fill="#2B2F4A"/><path d="M-2 -12Q4 -20 10 -10" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg>