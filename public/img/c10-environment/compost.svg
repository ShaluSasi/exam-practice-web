h d="M145 130H255V190H145Z" fill="#6B4423" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="145" y="118" width="110" height="14" rx="6" fill="#8D5E36" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(200 160) scale(0.8)"><g class="pul"><g transform="translate(-8 -8) rotate(-25)"><rect x="-13" y="-6" width="26" height="12" rx="6" fill="#B39DFF" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-4" cy="-1" r="1.6" fill="#2B2F4A"/><circle cx="4" cy="-1" r="1.6" fill="#2B2F4A"/></g><g transform="translate(10 2) rotate(15)"><rect x="-13" y="-6" width="26" height="12" rx="6" fill="#B39DFF" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-4" cy="-1" r="1.6" fill="#2B2F4A"/><circle cx="4" cy="-1" r="1.6" fill="#2B2F4A"/></g><g transform="translate(-6 12) rotate(-5)"><rect x="-13" y="-6" width="26" height="12" rx="6" fill="#B39DFF" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-4" cy="-1" r="1.6" fill="#2B2F4A"/><circle cx="4" cy="-1" r="1.6" fill="#2B2F4A"/></g></g></g><g transform="translate(235 150) scale(0.5)"><g><rect x="-6" y="4" width="12" height="16" rx="4" fill="#FFF3E0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-18 4Q-18 -20 0 -20Q18 -20 18 4Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-7" cy="-8" r="3" fill="#fff"/><circle cx="6" cy="-10" r="2.5" fill="#fff"/></g></g><line x1="262" y1="120" x2="300" y2="120" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round" class="fl" marker-end="url(#aho)"/><g transform="translate(340 110) scale(1.0)"><g class="pul"><rect x="-5" y="6" width="10" height="20" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-12" cy="2" r="11" fill="#4CB85A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="2" r="11" fill="#4CB85A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-8" r="18" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><rect x="305" y="140" width="70" height="22" rx="8" fill="#8D6E4E"/></svg>