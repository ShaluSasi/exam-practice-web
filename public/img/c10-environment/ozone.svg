<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Sun, UV rays, the ozone layer high above, a refrigerator releasing CFCs and a person on the ground</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#E3F2FD"/><path d="M0 198Q200 178 400 198V240H0Z" fill="#A5D6A7"/><g transform="translate(50 40) scale(1)"><g><g class="spin"><line x1="18.0" y1="0.0" x2="25.0" y2="0.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="12.7" y1="12.7" x2="17.7" y2="17.7" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="0.0" y1="18.0" x2="0.0" y2="25.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="-12.7" y1="12.7" x2="-17.7" y2="17.7" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="-18.0" y1="0.0" x2="-25.0" y2="0.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="-12.7" y1="-12.7" x2="-17.7" y2="-17.7" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="-0.0" y1="-18.0" x2="-0.0" y2="-25.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="12.7" y1="-12.7" x2="17.7" y2="-17.7" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/></g><circle r="13" fill="#FFC93C" stroke="#FF8A1F" stroke-width="3"/></g></g><path d="M20 120Q200 60 380 120" fill="none" stroke="#B79CFF" stroke-width="16" stroke-linecap="round"/><path d="M20 120Q200 60 380 120" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="1 10" stroke-linecap="round"/><line x1="95" y1="56" x2="150" y2="90" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round" class="fl" marker-end="url(#aho)"/><line x1="205" y1="36" x2="250" y2="82" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round" class="fl" marker-end="url(#aho)"/><line x1="280" y1="40" x2="318" y2="90" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round" class="fl" marker-end="url(#aho)"/><g class="rise" style="animation-delay:0s"><circle cx="326" cy="146" r="4.5" fill="#E5484D"/></g><g class="rise" style="animation-delay:0.9s"><circle cx="330" cy="146" r="4.5" fill="#E5484D"/></g><g class="rise" style="animation-delay:1.8s"><circle cx="334" cy="146" r="4.5" fill="#E5484D"/></g><g transform="translate(140 172) scale(0.85)"><g><path d="M-6 14V26M6 14V26M-10 -2L-17 10M10 -2L17 10" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-10" y="-8" width="20" height="22" rx="6" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-18" r="8" fill="#F4C9A0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(330 168) scale(0.8)"><g><rect x="-15" y="-26" width="30" height="52" rx="5" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-15 -6H15M-10 -18V-10M-10 4V14" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg>