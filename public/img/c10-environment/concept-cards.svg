f"/><circle cx="6" cy="-10" r="2.5" fill="#fff"/></g></g><circle cx="241.0" cy="80" r="2.6" fill="#E5484D"/><circle cx="249.0" cy="80" r="2.6" fill="#E5484D"/><circle cx="257.0" cy="80" r="2.6" fill="#E5484D"/><circle cx="237.0" cy="110" r="2.6" fill="#E5484D"/><circle cx="245.0" cy="110" r="2.6" fill="#E5484D"/><circle cx="253.0" cy="110" r="2.6" fill="#E5484D"/><circle cx="261.0" cy="110" r="2.6" fill="#E5484D"/><circle cx="237.0" cy="118" r="2.6" fill="#E5484D"/><circle cx="245.0" cy="118" r="2.6" fill="#E5484D"/><circle cx="253.0" cy="118" r="2.6" fill="#E5484D"/><circle cx="261.0" cy="118" r="2.6" fill="#E5484D"/><circle cx="233.0" cy="140" r="2.6" fill="#E5484D"/><circle cx="241.0" cy="140" r="2.6" fill="#E5484D"/><circle cx="249.0" cy="140" r="2.6" fill="#E5484D"/><circle cx="257.0" cy="140" r="2.6" fill="#E5484D"/><circle cx="265.0" cy="140" r="2.6" fill="#E5484D"/><circle cx="233.0" cy="148" r="2.6" fill="#E5484D"/><circle cx="241.0" cy="148" r="2.6" fill="#E5484D"/><circle cx="249.0" cy="148" r="2.6" fill="#E5484D"/><circle cx="257.0" cy="148" r="2.6" fill="#E5484D"/><circle cx="265.0" cy="148" r="2.6" fill="#E5484D"/><circle cx="233.0" cy="156" r="2.6" fill="#E5484D"/><circle cx="241.0" cy="156" r="2.6" fill="#E5484D"/><circle cx="249.0" cy="156" r="2.6" fill="#E5484D"/><circle cx="257.0" cy="156" r="2.6" fill="#E5484D"/><circle cx="265.0" cy="156" r="2.6" fill="#E5484D"/><rect x="318" y="150" width="56" height="20" rx="4" fill="#CDE9B5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="326" y="128" width="40" height="20" rx="4" fill="#FFE9A8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="334" y="106" width="24" height="20" rx="4" fill="#FFD0A0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="338" y="84" width="16" height="20" rx="4" fill="#F7B7B7" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>