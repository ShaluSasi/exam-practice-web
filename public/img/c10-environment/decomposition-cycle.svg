<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Cycle: plant, dead remains, decomposers, nutrients in soil, back to the plant</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><circle cx="200" cy="120" r="78" fill="none" stroke="#C9CFE0" stroke-width="3"/><line x1="222" y1="44" x2="266" y2="92" stroke="#3FA34D" stroke-width="4" stroke-linecap="round" class="fl" marker-end="url(#ahg)"/><line x1="274" y1="148" x2="226" y2="196" stroke="#3FA34D" stroke-width="4" stroke-linecap="round" class="fl" marker-end="url(#ahg)"/><line x1="176" y1="196" x2="130" y2="148" stroke="#3FA34D" stroke-width="4" stroke-linecap="round" class="fl" marker-end="url(#ahg)"/><line x1="126" y1="92" x2="174" y2="44" stroke="#3FA34D" stroke-width="4" stroke-linecap="round" class="fl" marker-end="url(#ahg)"/><g transform="translate(200 38) scale(0.8)"><g><rect x="-5" y="6" width="10" height="20" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-12" cy="2" r="11" fill="#4CB85A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="2" r="11" fill="#4CB85A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-8" r="18" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(278 120) scale(0.8)"><g><path d="M-22 -8Q-4 22 22 -12L16 -14Q-2 6 -16 -14Z" fill="#FFD84D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="2" cy="4" r="2" fill="#8B5A2B"/></g></g><g transform="translate(200 200) scale(0.9)"><g class="pul"><g transform="translate(-8 -8) rotate(-25)"><rect x="-13" y="-6" width="26" height="12" rx="6" fill="#B39DFF" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-4" cy="-1" r="1.6" fill="#2B2F4A"/><circle cx="4" cy="-1" r="1.6" fill="#2B2F4A"/></g><g transform="translate(10 2) rotate(15)"><rect x="-13" y="-6" width="26" height="12" rx="6" fill="#B39DFF" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-4" cy="-1" r="1.6" fill="#2B2F4A"/><circle cx="4" cy="-1" r="1.6" fill="#2B2F4A"/></g><g transform="translate(-6 12) rotate(-5)"><rect x="-13" y="-6" width="26" height="12" rx="6" fill="#B39DFF" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-4" cy="-1" r="1.6" fill="#2B2F4A"/><circle cx="4" cy="-1" r="1.6" fill="#2B2F4A"/></g></g></g><g transform="translate(122 122) scale(0.8)"><g><rect x="-6" y="4" width="12" height="16" rx="4" fill="#FFF3E0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-18 4Q-18 -20 0 -20Q18 -20 18 4Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-7" cy="-8" r="3" fill="#fff"/><circle cx="6" cy="-10" r="2.5" fill="#fff"/></g></g><text x="200" y="125" font-size="12" text-anchor="middle">Nutrient cycle</text></svg>