="0.0" x2="-22.0" y2="0.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="-10.6" y1="-10.6" x2="-15.6" y2="-15.6" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="-0.0" y1="-15.0" x2="-0.0" y2="-22.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="10.6" y1="-10.6" x2="15.6" y2="-15.6" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/></g><circle r="10" fill="#FFC93C" stroke="#FF8A1F" stroke-width="3"/></g></g><g transform="translate(55 130) scale(0.6)"><g><path d="M-30 14Q-24 -22 24 -22Q26 16 -30 14Z" fill="#4CB85A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-30 14Q-6 0 18 -16" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(152 80) scale(0.6)"><g><path d="M-16 22Q-18 2-24 -14M-6 22Q-8 -6-6 -24M4 22Q6 -2 14 -20M14 22Q16 8 24 -2" fill="none" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/></g></g><line x1="130" y1="120" x2="175" y2="120" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" class="fl" marker-end="url(#aho)"/><g transform="translate(152 150) scale(0.6)"><g><path d="M-22 -6Q-30 -18 -38 -14" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 6L18 -12L30 16M-6 10L-9 22M2 10L1 22" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="2" cy="4" rx="18" ry="7" fill="#8BC34A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="4" cy="1" rx="11" ry="3.5" fill="#C5E1A5"/><circle cx="-18" cy="-1" r="7" fill="#8BC34A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-20" cy="-3" r="2" fill="#2B2F4A"/></g></g><g transform="translate(232 120) scale(0.5)"><g><path d="M-16 22Q-18 2-24 -14M-6 22Q-8 -6-6 -24M4 22Q6 -2 14 -20M14 22Q16 8 24 -2" fill="none" stroke="