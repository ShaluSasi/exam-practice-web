<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A pond with sun, rain cloud, fish, water plants, a frog on a stone and a mushroom on the bank</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#E3F2FD"/><rect y="150" width="400" height="90" fill="#8D6E4E"/><ellipse cx="200" cy="170" rx="170" ry="52" fill="#7FD0F6" stroke="#2B2F4A" stroke-width="3"/><g transform="translate(60 40) scale(1)"><g><g class="spin"><line x1="17.0" y1="0.0" x2="24.0" y2="0.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="12.0" y1="12.0" x2="17.0" y2="17.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="0.0" y1="17.0" x2="0.0" y2="24.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="-12.0" y1="12.0" x2="-17.0" y2="17.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="-17.0" y1="0.0" x2="-24.0" y2="0.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="-12.0" y1="-12.0" x2="-17.0" y2="-17.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="-0.0" y1="-17.0" x2="-0.0" y2="-24.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="12.0" y1="-12.0" x2="17.0" y2="-17.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/></g><circle r="12" fill="#FFC93C" stroke="#FF8A1F" stroke-width="3"/></g></g><g transform="translate(300 40) scale(0.9)"><g class="drift"><path d="M-26 8Q-34 8 -32 -2Q-30 -10 -20 -8Q-18 -22 -4 -18Q6 -26 16 -14Q30 -14 30 -2Q32 8 22 8Z" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><g class="fall" style="animation-delay:0.0s"><line x1="282" y1="62" x2="279" y2="72" stroke="#0B93D4" stroke-width="3" stroke-linecap="round"/></g><g class="fall" style="animation-delay:0.5s"><line x1="300" y1="62" x2="297" y2="72" stroke="#0B93D4" stroke-width="3" stroke-linecap="round"/></g><g class="fall" style="animation-delay:1.0s"><line x1="318" y1="62" x2="315" y2="72" stroke="#0B93D4" stroke-width="3" stroke-linecap="round"/></g><g transform="translate(190 170) scale(0.8)"><g class="sw"><path d="M16 0L32 -11L32 11Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="0" cy="0" rx="20" ry="12" fill="#FFA94D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-10" cy="-3" r="3" fill="#fff"/><circle cx="-11" cy="-3" r="1.5" fill="#2B2F4A"/><path d="M-2 -12Q4 -20 10 -10" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(110 175) scale(0.6)"><g class="sway"><path d="M-9 40Q-19 20 -9 0Q1 -20 -9 -40" fill="none" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/><path d="M0 40Q-10 20 0 0Q10 -20 0 -26" fill="none" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/><path d="M9 40Q-1 20 9 0Q19 -20 9 -34" fill="none" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/></g></g><g transform="translate(290 178) scale(0.5)"><g class="sway"><path d="M-9 40Q-19 20 -9 0Q1 -20 -9 -40" fill="none" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/><path d="M0 40Q-10 20 0 0Q10 -20 0 -26" fill="none" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/><path d="M9 40Q-1 20 9 0Q19 -20 9 -34" fill="none" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/></g></g><ellipse cx="120" cy="140" rx="22" ry="9" fill="#9AA3B5" stroke="#2B2F4A" stroke-width="3"/><g transform="translate(120 126) scale(0.7)"><g><path d="M-20 10Q-34 18-24 24L-6 20M20 10Q34 18 24 24L6 20" fill="#2E8B3E" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="0" cy="4" rx="22" ry="16" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-11" cy="-13" r="8" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="11" cy="-13" r="8" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-11" cy="-14" r="4.5" fill="#fff"/><circle cx="11" cy="-14" r="4.5" fill="#fff"/><circle cx="-10" cy="-14" r="2.2" fill="#2B2F4A"/><circle cx="12" cy="-14" r="2.2" fill="#2B2F4A"/><path d="M-12 5Q0 14 12 5" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="0" cy="13" rx="10" ry="4" fill="#C5E8B0" opacity=".7"/></g></g><g transform="translate(360 160) scale(0.8)"><g><rect x="-6" y="4" width="12" height="16" rx="4" fill="#FFF3E0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-18 4Q-18 -20 0 -20Q18 -20 18 4Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-7" cy="-8" r="3" fill="#fff"/><circle cx="6" cy="-10" r="2.5" fill="#fff"/></g></g></svg>