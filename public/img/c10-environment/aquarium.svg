<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Aquarium with a fish, water plants, an air pump stone with bubbles, and microbes on the sand</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="30" y="25" width="340" height="195" rx="12" fill="#CFEFFF" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M33 196Q200 188 367 196V208Q367 217 358 217H42Q33 217 33 208Z" fill="#E9D29A"/><path d="M340 25V178Q340 190 328 192" fill="none" stroke="#6B7390" stroke-width="3"/><g transform="translate(85 150) scale(1)"><g class="sway"><path d="M-9 40Q-19 20 -9 0Q1 -20 -9 -40" fill="none" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/><path d="M0 40Q-10 20 0 0Q10 -20 0 -26" fill="none" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/><path d="M9 40Q-1 20 9 0Q19 -20 9 -34" fill="none" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/></g></g><g transform="translate(60 160) scale(0.8)"><g class="sway"><path d="M-9 40Q-19 20 -9 0Q1 -20 -9 -40" fill="none" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/><path d="M0 40Q-10 20 0 0Q10 -20 0 -26" fill="none" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/><path d="M9 40Q-1 20 9 0Q19 -20 9 -34" fill="none" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/></g></g><g transform="translate(190 95) scale(1)"><g class="sw"><path d="M16 0L32 -11L32 11Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="0" cy="0" rx="20" ry="12" fill="#FFA94D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-10" cy="-3" r="3" fill="#fff"/><circle cx="-11" cy="-3" r="1.5" fill="#2B2F4A"/><path d="M-2 -12Q4 -20 10 -10" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><ellipse cx="320" cy="198" rx="13" ry="6" fill="#B8B8C8" stroke="#2B2F4A" stroke-width="2.5"/><g class="rise" style="animation-delay:0s"><circle cx="318" cy="186" r="3" fill="#fff" stroke="#0B93D4" stroke-width="2"/></g><g class="rise" style="animation-delay:0.8s"><circle cx="321" cy="186" r="4" fill="#fff" stroke="#0B93D4" stroke-width="2"/></g><g class="rise" style="animation-delay:1.6s"><circle cx="324" cy="186" r="5" fill="#fff" stroke="#0B93D4" stroke-width="2"/></g><g transform="translate(190 205) scale(0.7)"><g class="pul"><g transform="translate(-8 -8) rotate(-25)"><rect x="-13" y="-6" width="26" height="12" rx="6" fill="#B39DFF" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-4" cy="-1" r="1.6" fill="#2B2F4A"/><circle cx="4" cy="-1" r="1.6" fill="#2B2F4A"/></g><g transform="translate(10 2) rotate(15)"><rect x="-13" y="-6" width="26" height="12" rx="6" fill="#B39DFF" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-4" cy="-1" r="1.6" fill="#2B2F4A"/><circle cx="4" cy="-1" r="1.6" fill="#2B2F4A"/></g><g transform="translate(-6 12) rotate(-5)"><rect x="-13" y="-6" width="26" height="12" rx="6" fill="#B39DFF" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-4" cy="-1" r="1.6" fill="#2B2F4A"/><circle cx="4" cy="-1" r="1.6" fill="#2B2F4A"/></g></g></g><path d="M240 204l10 -4l8 5l-10 4z" fill="#8B5A2B"/></svg>