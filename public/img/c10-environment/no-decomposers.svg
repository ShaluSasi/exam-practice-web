nsform="translate(10 2) rotate(15)"><rect x="-13" y="-6" width="26" height="12" rx="6" fill="#B39DFF" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-4" cy="-1" r="1.6" fill="#2B2F4A"/><circle cx="4" cy="-1" r="1.6" fill="#2B2F4A"/></g><g transform="translate(-6 12) rotate(-5)"><rect x="-13" y="-6" width="26" height="12" rx="6" fill="#B39DFF" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-4" cy="-1" r="1.6" fill="#2B2F4A"/><circle cx="4" cy="-1" r="1.6" fill="#2B2F4A"/></g></g></g><line x1="118" y1="175" x2="150" y2="175" stroke="#3FA34D" stroke-width="3" stroke-linecap="round" class="fl" marker-end="url(#ahg)"/><g transform="translate(160 150) scale(0.7)"><g class="pul"><rect x="-5" y="6" width="10" height="20" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-12" cy="2" r="11" fill="#4CB85A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="2" r="11" fill="#4CB85A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-8" r="18" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><line x1="100" y1="195" x2="100" y2="182" stroke="#3FA34D" stroke-width="3" stroke-linecap="round" class="fl" marker-end="url(#ahg)"/><path d="M224 165Q240 147 256 165Z" fill="#B5832F" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M264 168Q280 150 296 168Z" fill="#B5832F" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M304 162Q320 144 336 162Z" fill="#B5832F" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M339 168Q355 150 371 168Z" fill="#B5832F" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(300 13