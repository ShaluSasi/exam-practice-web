<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Bin A with banana peel, paper and leaves; Bin B with a plastic bottle, medicine strip and polythene bag</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M20 90H170L158 210H32Z" fill="#CDE9B5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M230 90H380L368 210H242Z" fill="#D9DEE8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="95" y="78" font-size="14" text-anchor="middle">Bin A</text><text x="305" y="78" font-size="14" text-anchor="middle">Bin B</text><g transform="translate(60 140) scale(0.8)"><g class="bob"><path d="M-22 -8Q-4 22 22 -12L16 -14Q-2 6 -16 -14Z" fill="#FFD84D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="2" cy="4" r="2" fill="#8B5A2B"/></g></g><g transform="translate(100 150) scale(0.7)"><g class="bob" style="animation-delay:0.4s"><path d="M-14 -22H8L16 -14V22H-14Z" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 -22V-14H16" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -8H8M-8 0H8M-8 8H4" stroke="#9AA3B5" stroke-width="2.5" stroke-linecap="round"/></g></g><g transform="translate(132 140) scale(0.5)"><g class="bob" style="animation-delay:0.8s"><rect x="-5" y="6" width="10" height="20" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-12" cy="2" r="11" fill="#4CB85A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="2" r="11" fill="#4CB85A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-8" r="18" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(270 140) scale(0.8)"><g class="bob"><rect x="-6" y="-26" width="12" height="8" rx="2" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-6 -18L-14 -6V22Q-14 26 -10 26H10Q14 26 14 22V-6L6 -18Z" fill="#7FD0F6" fill-opacity=".8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-14 4H14" stroke="#fff" stroke-width="3"/></g></g><g transform="translate(312 148) scale(0.7)"><g class="bob" style="animation-delay:0.4s"><rect x="-14" y="-24" width="28" height="48" rx="5" fill="#D9DEE8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-6" cy="-15" r="4.5" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><circle cx="-6" cy="-5" r="4.5" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><circle cx="-6" cy="5" r="4.5" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><circle cx="-6" cy="15" r="4.5" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><circle cx="6" cy="-15" r="4.5" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><circle cx="6" cy="-5" r="4.5" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><circle cx="6" cy="5" r="4.5" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><circle cx="6" cy="15" r="4.5" fill="#fff" stroke="#2B2F4A" stroke-width="2"/></g></g><g transform="translate(348 142) scale(0.7)"><g class="bob" style="animation-delay:0.8s"><path d="M-14 -10H14L18 24H-18Z" fill="#fff" fill-opacity=".85" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-9 -10V-22Q-9 -26 -5 -26M9 -10V-22Q9 -26 5 -26" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg>