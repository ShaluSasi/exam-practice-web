<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Sunlight falling on grass, a tree and wheat that make their own food</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><g transform="translate(50 60) scale(1.2)"><g><g class="spin"><line x1="17.0" y1="0.0" x2="24.0" y2="0.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="12.0" y1="12.0" x2="17.0" y2="17.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="0.0" y1="17.0" x2="0.0" y2="24.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="-12.0" y1="12.0" x2="-17.0" y2="17.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="-17.0" y1="0.0" x2="-24.0" y2="0.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="-12.0" y1="-12.0" x2="-17.0" y2="-17.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="-0.0" y1="-17.0" x2="-0.0" y2="-24.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="12.0" y1="-12.0" x2="17.0" y2="-17.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/></g><circle r="12" fill="#FFC93C" stroke="#FF8A1F" stroke-width="3"/></g></g><line x1="80" y1="70.5" x2="150" y2="95" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" class="fl" marker-end="url(#aho)"/><line x1="80" y1="81.0" x2="150" y2="130" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" class="fl" marker-end="url(#aho)"/><line x1="80" y1="91.5" x2="150" y2="165" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" class="fl" marker-end="url(#aho)"/><g transform="translate(200 70) scale(1.4)"><g><path d="M-16 22Q-18 2-24 -14M-6 22Q-8 -6-6 -24M4 22Q6 -2 14 -20M14 22Q16 8 24 -2" fill="none" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/></g></g><g transform="translate(200 145) scale(1.1)"><g><rect x="-5" y="6" width="10" height="20" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-12" cy="2" r="11" fill="#4CB85A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="2" r="11" fill="#4CB85A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-8" r="18" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(290 100) scale(1.4)"><g><path d="M0 24V-18M-10 24Q-10 2 -12 -12M10 24Q10 2 12 -12" fill="none" stroke="#C9A227" stroke-width="3" stroke-linecap="round"/><ellipse cx="0" cy="-22" rx="3.5" ry="7" fill="#F2C94C" stroke="#2B2F4A" stroke-width="2"/><ellipse cx="-12" cy="-16" rx="3.5" ry="7" fill="#F2C94C" stroke="#2B2F4A" stroke-width="2"/><ellipse cx="12" cy="-16" rx="3.5" ry="7" fill="#F2C94C" stroke="#2B2F4A" stroke-width="2"/><ellipse cx="0" cy="-8" rx="3.5" ry="7" fill="#F2C94C" stroke="#2B2F4A" stroke-width="2"/></g></g><text x="200" y="218" font-size="13" text-anchor="middle">Sunlight + simple substances = food</text></svg>