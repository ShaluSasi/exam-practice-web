<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>UV light splits an oxygen molecule into two oxygen atoms, which join another oxygen molecule to make ozone</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#E3F2FD"/><text x="200" y="22" font-size="12" text-anchor="middle">High in the atmosphere</text><g transform="translate(100 70) scale(0.9)"><g class="bob"><circle cx="-9" cy="0" r="12" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="0" r="12" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-12" cy="-4" r="3.5" fill="#fff" opacity=".7"/><circle cx="6" cy="-4" r="3.5" fill="#fff" opacity=".7"/></g></g><line x1="20" y1="70" x2="62" y2="70" stroke="#FF8A1F" stroke-width="5" stroke-linecap="round" class="fl" marker-end="url(#aho)"/><text x="40" y="58" font-size="13" text-anchor="middle" style="fill:#FF8A1F">UV</text><line x1="140" y1="70" x2="215" y2="70" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" class="fl" marker-end="url(#ah)"/><g transform="translate(270 55) scale(0.9)"><g class="drift"><circle r="12" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-3" cy="-4" r="3.5" fill="#fff" opacity=".7"/></g></g><g transform="translate(330 85) scale(0.9)"><g class="drift" style="animation-delay:1.2s"><circle r="12" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-3" cy="-4" r="3.5" fill="#fff" opacity=".7"/></g></g><g transform="translate(60 170) scale(0.9)"><g><circle r="12" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-3" cy="-4" r="3.5" fill="#fff" opacity=".7"/></g></g><text x="60" y="205" font-size="12" text-anchor="middle">O</text><text x="100" y="175" font-size="22" text-anchor="middle">+</text><g transform="translate(150 170) scale(0.9)"><g><circle cx="-9" cy="0" r="12" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="0" r="12" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-12" cy="-4" r="3.5" fill="#fff" opacity=".7"/><circle cx="6" cy="-4" r="3.5" fill="#fff" opacity=".7"/></g></g><text x="150" y="205" font-size="12" text-anchor="middle">O2</text><line x1="195" y1="170" x2="245" y2="170" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" class="fl" marker-end="url(#ah)"/><g transform="translate(320 170) scale(0.95)"><g class="pul"><circle cx="-16" cy="8" r="12" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16" cy="8" r="12" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-10" r="12" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-19" cy="4" r="3.5" fill="#fff" opacity=".7"/><circle cx="13" cy="4" r="3.5" fill="#fff" opacity=".7"/><circle cx="-3" cy="-14" r="3.5" fill="#fff" opacity=".7"/></g></g><text x="320" y="210" font-size="12" text-anchor="middle">O3</text><text x="100" y="100" font-size="12" text-anchor="middle">O2</text><text x="300" y="120" font-size="12" text-anchor="middle">2 O</text></svg>