<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A beam entering the space between two charged plates inside a tube, with numbered markers</title>
<style>
.beam{animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-20}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="16" y="36" width="368" height="168" rx="40" fill="#E3F2FD" stroke="#5B8DB8" stroke-width="3"/>
<rect x="36" y="98" width="9" height="44" rx="2" fill="#A3A8CC" stroke="#6B7099" stroke-width="2"/>
<path class="beam" d="M48 120H150" stroke="#3FA34D" stroke-width="5" stroke-dasharray="10 10" stroke-linecap="round"/>
<path d="M150 120l-10 -7v14z" fill="#3FA34D"/>
<rect x="165" y="76" width="96" height="10" rx="3" fill="#E5484D" stroke="#A8282C" stroke-width="2"/>
<rect x="165" y="154" width="96" height="10" rx="3" fill="#0B93D4" stroke="#075E88" stroke-width="2"/>
<g font-family="system-ui, sans-serif" font-weight="700" fill="#2B2F4A" font-size="20" text-anchor="middle"><text x="213" y="68">+</text><text x="213" y="186">−</text></g>
<rect x="338" y="52" width="12" height="136" rx="4" fill="#D8F3CF" stroke="#3FA34D" stroke-width="2.5"/>
</svg>
