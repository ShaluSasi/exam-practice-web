<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A small piece of soft metal fizzing and darting on water</title>
<style>
.m{animation:dt 3s ease-in-out infinite}@keyframes dt{0%,100%{transform:translateX(-50px)}50%{transform:translateX(60px)}}.b{animation:up 1.6s linear infinite}@keyframes up{from{transform:translateY(0);opacity:1}to{transform:translateY(-40px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M50 90h300v100q0 30 -30 30h-240q-30 0 -30 -30z" fill="#CDEBFA" stroke="#5B8DB8" stroke-width="3"/>
<path d="M52 120h296" stroke="#7FB8DA" stroke-width="3"/>
<g class="m"><rect x="180" y="108" width="34" height="16" rx="5" fill="#C9CCE3" stroke="#6B7099" stroke-width="2.5"/><path d="M186 112h14" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
<circle class="b" style="animation-delay:0.0s" cx="174" cy="102" r="4" fill="#fff" stroke="#7FB8DA" stroke-width="1.5"/>
<circle class="b" style="animation-delay:0.4s" cx="188" cy="98" r="4" fill="#fff" stroke="#7FB8DA" stroke-width="1.5"/>
<circle class="b" style="animation-delay:0.8s" cx="202" cy="104" r="4" fill="#fff" stroke="#7FB8DA" stroke-width="1.5"/>
<circle class="b" style="animation-delay:1.2s" cx="218" cy="100" r="4" fill="#fff" stroke="#7FB8DA" stroke-width="1.5"/>
<path d="M232 104l8 -8M236 112l12 -2M226 98l2 -12" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round"/></g>
</svg>
