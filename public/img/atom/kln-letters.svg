<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img">
<title>Letters A to N with the first ten faded and K, L, M, N highlighted</title>
<style>
.t{transform-box:fill-box;transform-origin:center bottom;animation:bo 2.4s ease-in-out infinite}@keyframes bo{0%,100%{transform:none}20%{transform:translateY(-8px)}40%{transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
