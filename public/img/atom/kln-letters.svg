<rect x="336" y="34" width="44" height="50" rx="8" fill="none" stroke="#A3A8CC" stroke-width="2.5" stroke-dasharray="4 4"/><text x="358" y="67" font-size="22" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#B7BBD6">G</text>
