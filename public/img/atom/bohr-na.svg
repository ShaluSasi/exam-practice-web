<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>A Bohr diagram of an atom with numbered markers</title>
<style>
.g0{transform-origin:200px 130px;animation:sp 10s linear infinite}
.g1{transform-origin:200px 130px;animation:sp 15s linear infinite}
.g2{transform-origin:200px 130px;animation:sp 20s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="200" cy="130" r="40" fill="none" stroke="#8A90C0" stroke-width="2.5"/>
<circle cx="200" cy="130" r="72" fill="none" stroke="#8A90C0" stroke-width="2.5"/>
<circle cx="200" cy="130" r="104" fill="none" stroke="#8A90C0" stroke-width="2.5"/>
<circle cx="200" cy="130" r="124" fill="none" stroke="#8A90C0" stroke-width="2" stroke-dasharray="6 7" opacity=".7"/>
<circle cx="200" cy="130" r="18" fill="#F8B4B6" stroke="#E5484D" stroke-width="3"/><circle cx="193.7" cy="123.7" r="5.0" fill="#fff" opacity=".7"/>
<g class="g0"><circle cx="160.0" cy="130.0" r="6.5" fill="#0B93D4" stroke="#075E88" stroke-width="2"/><circle cx="240.0" cy="130.0" r="6.5" fill="#0B93D4" stroke="#075E88" stroke-width="2"/></g>
<g class="g1"><circle cx="129.4" cy="115.7" r="6.5" fill="#0B93D4" stroke="#075E88" stroke-width="2"/><circle cx="160.2" cy="70.0" r="6.5" fill="#0B93D4" stroke="#075E88" stroke-width="2"/><circle cx="214.3" cy="59.4" r="6.5" fill="#0B93D4" stroke="#075E88" stroke-width="2"/><circle cx="260.0" cy="90.2" r="6.5" fill="#0B93D4" stroke="#075E88" stroke-width="2"/><circle cx="270.6" cy="144.3" r="6.5" fill="#0B93D4" stroke="#075E88" stroke-width="2"/><circle cx="239.8" cy="190.0" r="6.5" fill="#0B93D4" stroke="#075E88" stroke-width="2"/><circle cx="185.7" cy="200.6" r="6.5" fill="#0B93D4" stroke="#075E88" stroke-width="2"/><circle cx="140.0" cy="169.8" r="6.5" fill="#0B93D4" stroke="#075E88" stroke-width="2"/></g>
<g class="g2"><circle cx="102.3" cy="94.4" r="6.5" fill="#0B93D4" stroke="#075E88" stroke-width="2"/></g>
</svg>
