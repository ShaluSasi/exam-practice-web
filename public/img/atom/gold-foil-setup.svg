<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>A beam of alpha particles aimed at a thin gold foil inside a circular screen, with numbered markers</title>
<style>
.beam{animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="200" cy="130" r="100" fill="none" stroke="#3FA34D" stroke-width="9" opacity=".35"/>
<rect x="18" y="106" width="56" height="48" rx="6" fill="#A3A8CC" stroke="#6B7099" stroke-width="3"/>
<rect x="60" y="124" width="16" height="12" fill="#FFF9EE"/>
<circle cx="42" cy="130" r="8" fill="#E5484D" stroke="#A8282C" stroke-width="2"/>
<path class="beam" d="M76 130H192" stroke="#E5484D" stroke-width="4" stroke-dasharray="8 8" stroke-linecap="round"/>
<rect x="196" y="82" width="8" height="96" rx="2" fill="#F6C453" stroke="#B8892A" stroke-width="2"/>
</svg>
