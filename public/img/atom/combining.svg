<g font-size="18" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A"><text x="70" y="168">H<tspan font-size="13" dy="4">2</tspan><tspan dy="-4">O</tspan></text><text x="200" y="168">NH<tspan font-size="13" dy="4">3</tspan></text><text x="334" y="168">MgCl<tspan font-size="13" dy="4">2</tspan></text></g>
