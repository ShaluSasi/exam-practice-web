<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img">
<title>Ball models of water, ammonia and magnesium chloride</title>
<style>
.mo{transform-box:fill-box;transform-origin:center;animation:bb 3s ease-in-out infinite}@keyframes bb{50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g class="mo"><path d="M70 90L48 112M70 90L92 112" stroke="#6B7099" stroke-width="5"/><circle cx="70" cy="90" r="18" fill="#E5484D" stroke="#A8282C" stroke-width="2.5"/><circle cx="46" cy="114" r="11" fill="#FFFFFF" stroke="#6B7099" stroke-width="2.5"/><circle cx="94" cy="114" r="11" fill="#FFFFFF" stroke="#6B7099" stroke-width="2.5"/></g>
<g class="mo" style="animation-delay:.5s"><path d="M200 84L172 110M200 84L228 110M200 84V124" stroke="#6B7099" stroke-width="5"/><circle cx="200" cy="84" r="18" fill="#0B93D4" stroke="#075E88" stroke-width="2.5"/><circle cx="170" cy="112" r="11" fill="#FFFFFF" stroke="#6B7099" stroke-width="2.5"/><circle cx="230" cy="112" r="11" fill="#FFFFFF" stroke="#6B7099" stroke-width="2.5"/><circle cx="200" cy="128" r="11" fill="#FFFFFF" stroke="#6B7099" stroke-width="2.5"/></g>
