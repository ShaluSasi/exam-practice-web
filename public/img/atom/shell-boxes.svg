<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
<title>Four boxes for the K, L, M and N shells being filled with electrons</title>
<style>
.d{animation:dr 2.6s ease-in infinite}@keyframes dr{0%{transform:translateY(-60px);opacity:0}30%{opacity:1}60%,100%{transform:translateY(0);opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="24" y="140" width="80" height="50" rx="8" fill="#CDEBFA" stroke="#0B93D4" stroke-width="3"/>
<text x="64" y="210" font-size="16" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">K</text>
<text x="64" y="173.0" font-size="22" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#7FB8DA">?</text>
<rect x="116" y="114" width="80" height="76" rx="8" fill="#CDEBFA" stroke="#0B93D4" stroke-width="3"/>
<text x="156" y="210" font-size="16" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">L</text>
<text x="156" y="160.0" font-size="22" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#7FB8DA">?</text>
<rect x="208" y="88" width="80" height="102" rx="8" fill="#CDEBFA" stroke="#0B93D4" stroke-width="3"/>
<text x="248" y="210" font-size="16" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">M</text>
<text x="248" y="147.0" font-size="22" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#7FB8DA">?</text>
<rect x="300" y="62" width="80" height="128" rx="8" fill="#CDEBFA" stroke="#0B93D4" stroke-width="3"/>
<text x="340" y="210" font-size="16" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">N</text>
<text x="340" y="134.0" font-size="22" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#7FB8DA">?</text>
<g class="d"><circle cx="52.0" cy="175.0" r="7" fill="#0B93D4" stroke="#075E88" stroke-width="2"/></g><g class="d" style="animation-delay:.6s"><circle cx="76.0" cy="175.0" r="7" fill="#0B93D4" stroke="#075E88" stroke-width="2"/></g>
<g class="d" style="animation-delay:1.2s"><circle cx="130.0" cy="150.0" r="7" fill="#0B93D4" stroke="#075E88" stroke-width="2"/></g>
</svg>
