<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>Concentric energy levels around a nucleus</title>
<style>
.o0{transform-origin:200px 130px;animation:sp 4s linear infinite}
.o1{transform-origin:200px 130px;animation:sp 6s linear infinite}
.o2{transform-origin:200px 130px;animation:sp 8s linear infinite}
.o3{transform-origin:200px 130px;animation:sp 10s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="200" cy="130" r="35" fill="none" stroke="#8A90C0" stroke-width="2.5"/>
<circle cx="200" cy="130" r="60" fill="none" stroke="#8A90C0" stroke-width="2.5"/>
<circle cx="200" cy="130" r="85" fill="none" stroke="#8A90C0" stroke-width="2.5"/>
<circle cx="200" cy="130" r="110" fill="none" stroke="#8A90C0" stroke-width="2.5"/>
<circle cx="200" cy="130" r="14" fill="#F8B4B6" stroke="#E5484D" stroke-width="3"/><circle cx="195.1" cy="125.1" r="3.9" fill="#fff" opacity=".7"/>
<g class="o0"><circle cx="167.1" cy="118.0" r="6" fill="#0B93D4" stroke="#075E88" stroke-width="2"/></g>
<g class="o1"><circle cx="179.5" cy="186.4" r="6" fill="#0B93D4" stroke="#075E88" stroke-width="2"/></g>
<g class="o2"><circle cx="242.5" cy="56.4" r="6" fill="#0B93D4" stroke="#075E88" stroke-width="2"/></g>
<g class="o3"><circle cx="303.4" cy="167.6" r="6" fill="#0B93D4" stroke="#075E88" stroke-width="2"/></g>
</svg>
