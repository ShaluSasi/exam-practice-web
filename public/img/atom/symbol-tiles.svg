<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" role="img">
<title>Four element tiles with their chemical symbols</title>
<style>
.t{transform-box:fill-box;transform-origin:center;animation:fl 4s ease-in-out infinite}@keyframes fl{0%,70%,100%{transform:none}80%{transform:rotate(-6deg) scale(1.06)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g class="t" style="animation-delay:0.0s"><rect x="22" y="30" width="80" height="100" rx="10" fill="#CDEBFA" stroke="#0B93D4" stroke-width="3"/><text x="32" y="52" font-size="14" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">29</text><text x="62" y="100" font-size="36" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#2B2F4A">Cu</text></g>
<g class="t" style="animation-delay:0.5s"><rect x="114" y="30" width="80" height="100" rx="10" fill="#FCE7B0" stroke="#B8892A" stroke-width="3"/><text x="124" y="52" font-size="14" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">79</text><text x="154" y="100" font-size="36" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#2B2F4A">Au</text></g>
<g class="t" style="animation-delay:1.0s"><rect x="206" y="30" width="80" height="100" rx="10" fill="#E6E7F2" stroke="#6B7099" stroke-width="3"/><text x="216" y="52" font-size="14" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">47</text><text x="246" y="100" font-size="36" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#2B2F4A">Ag</text></g>
<g class="t" style="animation-delay:1.5s"><rect x="298" y="30" width="80" height="100" rx="10" fill="#D8F3CF" stroke="#3FA34D" stroke-width="3"/><text x="308" y="52" font-size="14" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">82</text><text x="338" y="100" font-size="36" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#2B2F4A">Pb</text></g>
</svg>
