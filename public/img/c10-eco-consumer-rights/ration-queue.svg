<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A long queue of people outside a ration shop with a shortage notice</title><style>text{font-family:sans-serif}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1.6s linear infinite}
.slide{animation:slide 3s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.puff{animation:puff 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes grow{0%{transform:scaleX(.25)}60%,100%{transform:scaleX(1)}}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-26px) scale(1.3);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="250" y="40" width="130" height="110" rx="6" fill="#E6D5B8" stroke="#2B2F4A" stroke-width="3" /><text x="315" y="62" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Ration shop</text><line x1="262" y1="85" x2="368" y2="85" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="262" y1="107" x2="368" y2="107" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="262" y1="129" x2="368" y2="129" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><rect x="0" y="180" width="400" height="60" rx="0" fill="#D9B38C" stroke="#2B2F4A" stroke-width="0" /><g class="bob" style="animation-delay:0.0s"><circle cx="60" cy="145.05" r="7.6499999999999995" fill="#F6C9A0" stroke="#2B2F4A" stroke-width="2.5" /><path d="M52.4,142.5 q7.6,-7.6 15.3,0" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="50.65" y="154.4" width="18.7" height="23.8" rx="5.95" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" /><line x1="55.75" y1="178.2" x2="55.75" y2="190.1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="64.25" y1="178.2" x2="64.25" y2="190.1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /></g><g class="bob" style="animation-delay:0.3s"><circle cx="105" cy="145.05" r="7.6499999999999995" fill="#F6C9A0" stroke="#2B2F4A" stroke-width="2.5" /><path d="M97.3,142.5 q7.6,-7.6 15.3,0" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="95.65" y="154.4" width="18.7" height="23.8" rx="5.95" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" /><line x1="100.75" y1="178.2" x2="100.75" y2="190.1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="109.25" y1="178.2" x2="109.25" y2="190.1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /></g><g class="bob" style="animation-delay:0.6s"><circle cx="150" cy="145.05" r="7.6499999999999995" fill="#F6C9A0" stroke="#2B2F4A" stroke-width="2.5" /><path d="M142.3,142.5 q7.6,-7.6 15.3,0" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="140.65" y="154.4" width="18.7" height="23.8" rx="5.95" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.5" /><line x1="145.75" y1="178.2" x2="145.75" y2="190.1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="154.25" y1="178.2" x2="154.25" y2="190.1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /></g><g class="bob" style="animation-delay:0.8999999999999999s"><circle cx="195" cy="145.05" r="7.6499999999999995" fill="#F6C9A0" stroke="#2B2F4A" stroke-width="2.5" /><path d="M187.3,142.5 q7.6,-7.6 15.3,0" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="185.65" y="154.4" width="18.7" height="23.8" rx="5.95" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" /><line x1="190.75" y1="178.2" x2="190.75" y2="190.1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="199.25" y1="178.2" x2="199.25" y2="190.1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /></g><g class="bob" style="animation-delay:1.2s"><circle cx="240" cy="145.05" r="7.6499999999999995" fill="#F6C9A0" stroke="#2B2F4A" stroke-width="2.5" /><path d="M232.3,142.5 q7.6,-7.6 15.3,0" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="230.65" y="154.4" width="18.7" height="23.8" rx="5.95" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" /><line x1="235.75" y1="178.2" x2="235.75" y2="190.1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="244.25" y1="178.2" x2="244.25" y2="190.1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /></g><rect x="26" y="50" width="110" height="40" rx="6" fill="#FFD166" stroke="#2B2F4A" stroke-width="3" /><text x="81" y="66" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Hoarding</text><text x="81" y="82" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Shortage</text></svg>