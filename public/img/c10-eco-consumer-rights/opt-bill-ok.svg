<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A bill listing each item with its price</title><style>text{font-family:sans-serif}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1.6s linear infinite}
.slide{animation:slide 3s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.puff{animation:puff 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes grow{0%{transform:scaleX(.25)}60%,100%{transform:scaleX(1)}}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-26px) scale(1.3);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="62" y="20" width="76" height="92" rx="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><text x="100" y="40" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >BILL</text><text x="72" y="60" font-size="10" font-weight="normal" fill="#2B2F4A" text-anchor="start" >Rice</text><text x="128" y="60" font-size="10" font-weight="normal" fill="#2B2F4A" text-anchor="end" >60</text><text x="72" y="75" font-size="10" font-weight="normal" fill="#2B2F4A" text-anchor="start" >Oil</text><text x="128" y="75" font-size="10" font-weight="normal" fill="#2B2F4A" text-anchor="end" >120</text><text x="72" y="90" font-size="10" font-weight="normal" fill="#2B2F4A" text-anchor="start" >Tea</text><text x="128" y="90" font-size="10" font-weight="normal" fill="#2B2F4A" text-anchor="end" >45</text><line x1="70" y1="98" x2="130" y2="98" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><path d="M157.6,28 l7.8,9.1 l14.3,-18.2" fill="none" stroke="#3FA34D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="100" y="140" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Clear bill</text></svg>