<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A buyer asking the shopkeeper for a bill</title><style>text{font-family:sans-serif}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1.6s linear infinite}
.slide{animation:slide 3s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.puff{animation:puff 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes grow{0%{transform:scaleX(.25)}60%,100%{transform:scaleX(1)}}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-26px) scale(1.3);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><circle cx="52" cy="73.05" r="7.6499999999999995" fill="#F6C9A0" stroke="#2B2F4A" stroke-width="2.5" /><path d="M44.4,70.5 q7.6,-7.6 15.3,0" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="42.65" y="82.4" width="18.7" height="23.8" rx="5.95" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" /><line x1="47.75" y1="106.2" x2="47.75" y2="118.1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="56.25" y1="106.2" x2="56.25" y2="118.1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><rect x="78" y="14" width="100" height="32" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><polygon points="90.0,45.0 102.0,45.0 88.0,58.0" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" /><line x1="91" y1="46" x2="101" y2="46" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" /><text x="128.0" y="34.0" font-size="11" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Bill, please</text><rect x="130" y="70" width="46" height="54" rx="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><line x1="138" y1="86" x2="168" y2="86" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="138" y1="98" x2="168" y2="98" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><path d="M145.2,116 l3.6,4.2 l6.6,-8.4" fill="none" stroke="#3FA34D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="100" y="140" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Asking for a bill</text></svg>