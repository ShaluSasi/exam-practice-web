<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Producers make goods and services; consumers buy the final goods</title><style>text{font-family:sans-serif}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1.6s linear infinite}
.slide{animation:slide 3s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.puff{animation:puff 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes grow{0%{transform:scaleX(.25)}60%,100%{transform:scaleX(1)}}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-26px) scale(1.3);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="18" y="50" width="130" height="130" rx="6" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" /><text x="83" y="72" font-size="15" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Producers</text><rect x="30" y="118" width="56" height="56" rx="6" fill="#E9ECF5" stroke="#2B2F4A" stroke-width="3" /><polygon points="30.0,118.0 58.0,96.0 86.0,118.0" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" /><rect x="92" y="100" width="10" height="30" rx="6" fill="#CBD5E1" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="120" cy="125.7" r="8.1" fill="#F6C9A0" stroke="#2B2F4A" stroke-width="2.5" /><path d="M111.9,123.0 q8.1,-8.1 16.2,0" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="110.1" y="135.6" width="19.8" height="25.2" rx="6.3" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" /><line x1="115.5" y1="160.8" x2="115.5" y2="173.4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="124.5" y1="160.8" x2="124.5" y2="173.4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><rect x="252" y="50" width="130" height="130" rx="6" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" /><text x="317" y="72" font-size="15" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Consumers</text><rect x="268" y="108" width="98" height="64" rx="6" fill="#FFE3C2" stroke="#2B2F4A" stroke-width="3" /><polygon points="262.0,108.0 372.0,108.0 360.0,90.0 274.0,90.0" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" /><circle cx="318" cy="127.7" r="8.1" fill="#F6C9A0" stroke="#2B2F4A" stroke-width="2.5" /><path d="M309.9,125.0 q8.1,-8.1 16.2,0" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="308.1" y="137.6" width="19.8" height="25.2" rx="6.3" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.5" /><line x1="313.5" y1="162.8" x2="313.5" y2="175.4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="322.5" y1="162.8" x2="322.5" y2="175.4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><rect x="336" y="136" width="20" height="22" rx="4" fill="#FFD166" stroke="#2B2F4A" stroke-width="2.5" /><line x1="150" y1="150" x2="241.0" y2="150.0" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 4" class="flow"/><polygon points="250.0,150.0 241.0,155.0 241.0,145.0" fill="#FF8A1F" stroke="#FF8A1F" stroke-width="1" stroke-linejoin="round" /><g class="slide"><rect x="166" y="118" width="28" height="24" rx="4" fill="#E8D3A6" stroke="#2B2F4A" stroke-width="2.5" /><line x1="166" y1="128" x2="194" y2="128" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /></g><text x="200" y="208" font-size="13" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Goods and services reach the buyer</text></svg>