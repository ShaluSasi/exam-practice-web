<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>Prakash talking to an adviser at a help desk</title><style>text{font-family:sans-serif}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1.6s linear infinite}
.slide{animation:slide 3s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.puff{animation:puff 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes grow{0%{transform:scaleX(.25)}60%,100%{transform:scaleX(1)}}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-26px) scale(1.3);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="70" y="56" width="70" height="36" rx="6" fill="#D9B38C" stroke="#2B2F4A" stroke-width="3" /><circle cx="105" cy="32.4" r="7.2" fill="#F6C9A0" stroke="#2B2F4A" stroke-width="2.5" /><path d="M97.8,30.0 q7.2,-7.2 14.4,0" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="96.2" y="41.2" width="17.6" height="22.400000000000002" rx="5.6000000000000005" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" /><line x1="101.0" y1="63.6" x2="101.0" y2="74.8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="109.0" y1="63.6" x2="109.0" y2="74.8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><circle cx="40" cy="74.4" r="7.2" fill="#F6C9A0" stroke="#2B2F4A" stroke-width="2.5" /><path d="M32.8,72.0 q7.2,-7.2 14.4,0" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="31.2" y="83.2" width="17.6" height="22.400000000000002" rx="5.6000000000000005" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" /><line x1="36.0" y1="105.6" x2="36.0" y2="116.8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="44.0" y1="105.6" x2="44.0" y2="116.8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><rect x="112" y="8" width="70" height="26" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><polygon points="124.0,33.0 136.0,33.0 122.0,46.0" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" /><line x1="125" y1="34" x2="135" y2="34" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" /><text x="147.0" y="25.0" font-size="11" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Advice</text><text x="100" y="142" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Asks for advice</text></svg>