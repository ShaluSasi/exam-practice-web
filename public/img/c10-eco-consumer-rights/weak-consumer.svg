<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A small buyer asking for help and a large seller pushing responsibility back</title><style>text{font-family:sans-serif}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1.6s linear infinite}
.slide{animation:slide 3s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.puff{animation:puff 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes grow{0%{transform:scaleX(.25)}60%,100%{transform:scaleX(1)}}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-26px) scale(1.3);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="170" width="400" height="70" rx="0" fill="#D9B38C" stroke="#2B2F4A" stroke-width="0" /><circle cx="95" cy="138.4" r="7.2" fill="#F6C9A0" stroke="#2B2F4A" stroke-width="2.5" /><path d="M87.8,136.0 q7.2,-7.2 14.4,0" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="86.2" y="147.2" width="17.6" height="22.400000000000002" rx="5.6000000000000005" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" /><line x1="91.0" y1="169.6" x2="91.0" y2="180.8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="99.0" y1="169.6" x2="99.0" y2="180.8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><circle cx="300" cy="112.2" r="12.6" fill="#F6C9A0" stroke="#2B2F4A" stroke-width="2.5" /><path d="M287.4,108.0 q12.6,-12.6 25.2,0" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="284.6" y="127.6" width="30.799999999999997" height="39.199999999999996" rx="9.799999999999999" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2.5" /><line x1="293.0" y1="166.8" x2="293.0" y2="186.4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="307.0" y1="166.8" x2="307.0" y2="186.4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><rect x="190" y="30" width="170" height="44" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><polygon points="336.0,73.0 348.0,73.0 350.0,86.0" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" /><line x1="337" y1="74" x2="347" y2="74" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" /><text x="275.0" y="56.0" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Your problem, not mine</text><rect x="22" y="74" width="110" height="38" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><polygon points="34.0,111.0 46.0,111.0 32.0,124.0" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" /><line x1="35" y1="112" x2="45" y2="112" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" /><text x="77.0" y="97.0" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Please help</text><text x="95" y="214" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Single buyer</text><text x="300" y="214" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Seller</text></svg>