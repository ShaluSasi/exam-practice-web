<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Four case folders to be matched with consumer rights</title><style>text{font-family:sans-serif}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1.6s linear infinite}
.slide{animation:slide 3s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.puff{animation:puff 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes grow{0%{transform:scaleX(.25)}60%,100%{transform:scaleX(1)}}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-26px) scale(1.3);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><g class="bob" style="animation-delay:0.0s"><rect x="30" y="54" width="70" height="90" rx="6" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" /><rect x="36" y="76" width="58" height="60" rx="3" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><text x="65" y="69" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle" >Case 1</text><line x1="44" y1="92" x2="86" y2="92" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="44" y1="106" x2="86" y2="106" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /></g><g class="bob" style="animation-delay:0.25s"><rect x="120" y="54" width="70" height="90" rx="6" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" /><rect x="126" y="76" width="58" height="60" rx="3" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><text x="155" y="69" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle" >Case 2</text><line x1="134" y1="92" x2="176" y2="92" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="134" y1="106" x2="176" y2="106" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /></g><g class="bob" style="animation-delay:0.5s"><rect x="210" y="54" width="70" height="90" rx="6" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" /><rect x="216" y="76" width="58" height="60" rx="3" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><text x="245" y="69" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle" >Case 3</text><line x1="224" y1="92" x2="266" y2="92" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="224" y1="106" x2="266" y2="106" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /></g><g class="bob" style="animation-delay:0.75s"><rect x="300" y="54" width="70" height="90" rx="6" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" /><rect x="306" y="76" width="58" height="60" rx="3" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><text x="335" y="69" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle" >Case 4</text><line x1="314" y1="92" x2="356" y2="92" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="314" y1="106" x2="356" y2="106" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /></g><text x="200" y="190" font-size="13" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Which consumer right is involved?</text></svg>