<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A big advertisement banner with a boast, a tin, a magnifying glass with a question mark and a warning sign</title><style>text{font-family:sans-serif}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1.6s linear infinite}
.slide{animation:slide 3s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.puff{animation:puff 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes grow{0%{transform:scaleX(.25)}60%,100%{transform:scaleX(1)}}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-26px) scale(1.3);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="30" y="40" width="150" height="100" rx="6" fill="#E9ECF5" stroke="#2B2F4A" stroke-width="3" /><polygon points="105.0,46.0 113.7,63.4 130.9,54.4 127.7,73.5 146.8,76.4 133.0,90.0 146.8,103.6 127.7,106.5 130.9,125.6 113.7,116.6 105.0,134.0 96.3,116.6 79.1,125.6 82.3,106.5 63.2,103.6 77.0,90.0 63.2,76.4 82.3,73.5 79.1,54.4 96.3,63.4" fill="#FFD166" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" /><text x="105" y="86" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Best for</text><text x="105" y="102" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >babies!</text><rect x="60" y="150" width="70" height="52" rx="6" fill="#A7D3F0" stroke="#2B2F4A" stroke-width="3" /><rect x="70" y="140" width="50" height="14" rx="4" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" /><text x="95" y="182" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Milk</text><g class="pulse"><circle cx="290" cy="100" r="30" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" /><line x1="311" y1="122" x2="336" y2="150" stroke="#2B2F4A" stroke-width="6" stroke-linecap="round" /><text x="290" y="112" font-size="34" font-weight="bold" fill="#E5484D" text-anchor="middle" >?</text></g><polygon points="250.0,190.0 290.0,150.0 330.0,190.0" fill="#FFD166" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><text x="290" y="182" font-size="24" font-weight="bold" fill="#E5484D" text-anchor="middle" >!</text><text x="290" y="218" font-size="13" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Is the claim true?</text></svg>