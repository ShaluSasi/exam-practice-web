 height="16.8" rx="4.2" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" /><line x1="293.0" y1="212.2" x2="293.0" y2="220.6" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="299.0" y1="212.2" x2="299.0" y2="220.6" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /></g><g class="bob" style="animation-delay:1.2000000000000002s"><circle cx="338" cy="188.8" r="5.3999999999999995" fill="#F6C9A0" stroke="#2B2F4A" stroke-width="2.5" /><path d="M332.6,187.0 q5.4,-5.4 10.8,0" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="331.4" y="195.4" width="13.2" height="16.8" rx="4.2" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" /><line x1="335.0" y1="212.2" x2="335.0" y2="220.6" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="341.0" y1="212.2" x2="341.0" y2="220.6" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /></g><text x="200" y="36" font-size="13" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >An umbrella body of consumer groups</text><text x="70" y="160" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="start" >200+ members</text><text x="330" y="160" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="end" >100+ countries</text></svg>