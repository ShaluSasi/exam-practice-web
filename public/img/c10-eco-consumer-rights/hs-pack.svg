<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A food packet with a price in a circle, a strip of small ingredient pictures, a round badge and lines of small print</title><style>text{font-family:sans-serif}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1.6s linear infinite}
.slide{animation:slide 3s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.puff{animation:puff 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes grow{0%{transform:scaleX(.25)}60%,100%{transform:scaleX(1)}}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-26px) scale(1.3);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="110" y="16" width="180" height="208" rx="10" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" /><rect x="110" y="16" width="180" height="34" rx="10" fill="#E56A00" stroke="#2B2F4A" stroke-width="3" /><circle cx="200" cy="33" r="10" fill="#FFD166" stroke="#2B2F4A" stroke-width="2.5" /><g class="pulse"><circle cx="200" cy="33" r="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="0" /></g><circle cx="200" cy="90" r="30" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="98" font-size="22" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >₹45</text><rect x="128" y="134" width="144" height="30" rx="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><path d="M146,152 l5,-12 l5,12z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="172" cy="149" r="6" fill="#FFD166" stroke="#2B2F4A" stroke-width="2" /><path d="M190,152 q6,-14 12,0" fill="none" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="224" cy="148" r="6" fill="#8A5A2B" stroke="#2B2F4A" stroke-width="2" /><path d="M242,152 q8,-10 14,0" fill="none" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="148" cy="195" r="17" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" /><circle cx="148" cy="195" r="12.58" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><path d="M139.5,195 l6.4,7.4 l11.7,-14.9" fill="none" stroke="#3FA34D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><line x1="184" y1="186" x2="258" y2="186" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="184" y1="194" x2="258" y2="194" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="184" y1="202" x2="258" y2="202" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /></svg>