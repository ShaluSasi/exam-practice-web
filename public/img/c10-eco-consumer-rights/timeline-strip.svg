<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A timeline arrow with five unlabeled steps and small icons</title><style>text{font-family:sans-serif}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1.6s linear infinite}
.slide{animation:slide 3s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.puff{animation:puff 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes grow{0%{transform:scaleX(.25)}60%,100%{transform:scaleX(1)}}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-26px) scale(1.3);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><line x1="30" y1="130" x2="361.0" y2="130.0" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><polygon points="370.0,130.0 361.0,135.0 361.0,125.0" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1" stroke-linejoin="round" /><g class="pulse" style="animation-delay:0.0s"><circle cx="60" cy="130" r="9" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" /></g><text x="60" y="164" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Step 1</text><g class="pulse" style="animation-delay:0.4s"><circle cx="130" cy="130" r="9" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" /></g><text x="130" y="164" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Step 2</text><g class="pulse" style="animation-delay:0.8s"><circle cx="200" cy="130" r="9" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" /></g><text x="200" y="164" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Step 3</text><g class="pulse" style="animation-delay:1.2000000000000002s"><circle cx="270" cy="130" r="9" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="3" /></g><text x="270" y="164" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Step 4</text><g class="pulse" style="animation-delay:1.6s"><circle cx="340" cy="130" r="9" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" /></g><text x="340" y="164" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Step 5</text><text x="200" y="214" font-size="13" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Events in the story of consumer rights</text></svg>