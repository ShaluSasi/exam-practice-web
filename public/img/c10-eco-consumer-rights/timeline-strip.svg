<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A timeline arrow with five unlabeled steps and small icons</title><style>text{font-family:sans-serif}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1.6s linear infinite}
.slide{animation:slide 3s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.puff{animation:puff 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes grow{0%{transform:scaleX(.25)}60%,100%{transform:scaleX(1)}}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-26px) scale(1.3);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><line x1="30" y1="130" x2="361.0" y2="130.0" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><polygon points="370.0,130.0 361.0,135.0 361.0,125.0" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1" stroke-linejoin="round" /><path d="M45.0,100 q-4,-16.8 5.4,-22.4 h19.2 q6.6,5.6 5.4,22.4z" fill="#E8D3A6" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><g class="pulse" style="animation-delay:0.0s"><circle cx="60" cy="130" r="9" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" /></g><text x="60" y="164" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Step 1</text><circle cx="130" cy="92" r="12" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" /><line x1="118" y1="92" x2="142" y2="92" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><path d="M130,80 q-8,12 0,24 M130,80 q8,12 0,24" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g class="pulse" style="animation-delay:0.4s"><circle cx="130" cy="130" r="9" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" /></g><text x="130" y="164" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Step 2</text><rect x="186" y="76" width="28" height="34" rx="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><line x1="193" y1="90" x2="207" y2="90" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="193" y1="100" x2="207" y2="100" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><g class="pulse" style="animation-delay:0.8s"><circle cx="200" cy="130" r="9" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" /></g><text x="200" y="164" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Step 3</text><rect x="256" y="78" width="28" height="22" rx="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><text x="270" y="94" font-size="14" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >i</text><g class="pulse" style="animation-delay:1.2000000000000002s"><circle cx="270" cy="130" r="9" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="3" /></g><text x="270" y="164" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Step 4</text><rect x="326.5" y="87.9" width="27.0" height="17.1" rx="4" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5" /><path d="M322.0,105.9 h36.0 l-2.7,4.0 h-30.6z" fill="#E9ECF5" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><g class="pulse" style="animation-delay:1.6s"><circle cx="340" cy="130" r="9" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" /></g><text x="340" y="164" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Step 5</text><text x="200" y="214" font-size="13" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Events in the story of consumer rights</text></svg>