<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Four invented round quality badges: a wheat ear, a gem, a tick and a star</title><style>text{font-family:sans-serif}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1.6s linear infinite}
.slide{animation:slide 3s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.puff{animation:puff 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes grow{0%{transform:scaleX(.25)}60%,100%{transform:scaleX(1)}}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-26px) scale(1.3);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><circle cx="60" cy="90" r="30" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" /><circle cx="60" cy="90" r="22.2" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><line x1="60" y1="105.0" x2="60" y2="75.0" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><ellipse cx="50.6" cy="81.0" rx="7.5" ry="3.8" fill="#FFD166" stroke="#2B2F4A" stroke-width="1.5"/><ellipse cx="69.4" cy="81.0" rx="7.5" ry="3.8" fill="#FFD166" stroke="#2B2F4A" stroke-width="1.5"/><ellipse cx="50.6" cy="90.0" rx="7.5" ry="3.8" fill="#FFD166" stroke="#2B2F4A" stroke-width="1.5"/><ellipse cx="69.4" cy="90.0" rx="7.5" ry="3.8" fill="#FFD166" stroke="#2B2F4A" stroke-width="1.5"/><ellipse cx="50.6" cy="99.0" rx="7.5" ry="3.8" fill="#FFD166" stroke="#2B2F4A" stroke-width="1.5"/><ellipse cx="69.4" cy="99.0" rx="7.5" ry="3.8" fill="#FFD166" stroke="#2B2F4A" stroke-width="1.5"/><circle cx="145" cy="90" r="30" fill="#FFD166" stroke="#2B2F4A" stroke-width="3" /><circle cx="145" cy="90" r="22.2" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><polygon points="133.0,85.5 138.4,76.5 151.6,76.5 157.0,85.5 145.0,103.5" fill="#8EE3F5" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" /><circle cx="230" cy="90" r="30" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" /><circle cx="230" cy="90" r="22.2" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><path d="M215.0,90 l11.2,13.1 l20.6,-26.2" fill="none" stroke="#3FA34D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="315" cy="90" r="30" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" /><circle cx="315" cy="90" r="22.2" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><polygon points="315.0,75.0 318.9,84.7 329.3,85.4 321.3,92.0 323.8,102.1 315.0,96.6 306.2,102.1 308.7,92.0 300.7,85.4 311.1,84.7" fill="#FFD166" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" /><g></g><text x="60" y="142" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Mark 1</text><g></g><text x="145" y="142" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Mark 2</text><g></g><text x="230" y="142" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Mark 3</text><g></g><text x="315" y="142" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Mark 4</text><g transform="translate(200,196) rotate(-25) scale(0.5)"><rect x="-18" y="-9" width="36" height="18" rx="4" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" /><line x1="0" y1="9" x2="0" y2="40" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round" /></g><text x="200" y="224" font-size="13" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Quality marks and agencies</text></svg>