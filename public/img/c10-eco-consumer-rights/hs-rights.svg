<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Six round icons: a shield, a speech bubble with i, branching arrows, a balance, a megaphone and a book with a cap</title><style>text{font-family:sans-serif}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1.6s linear infinite}
.slide{animation:slide 3s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.puff{animation:puff 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes grow{0%{transform:scaleX(.25)}60%,100%{transform:scaleX(1)}}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-26px) scale(1.3);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><circle cx="80" cy="70" r="38" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><circle cx="200" cy="70" r="38" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><circle cx="320" cy="70" r="38" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><circle cx="80" cy="170" r="38" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><circle cx="200" cy="170" r="38" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><circle cx="320" cy="170" r="38" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><path d="M80,44 l22,8 v16 q0,16 -22,26 q-22,-10 -22,-26 v-16z" fill="#CDEBC8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><line x1="80" y1="60" x2="80" y2="82" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><line x1="69" y1="71" x2="91" y2="71" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><circle cx="200" cy="66" r="22" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" /><polygon points="194.0,84.0 206.0,84.0 188.0,98.0" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><text x="200" y="74" font-size="28" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >i</text><line x1="296" y1="70" x2="316" y2="70" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><line x1="316" y1="70" x2="334.8663840980586" y2="55.48739684764723" stroke="#3FA34D" stroke-width="3" stroke-linecap="round" /><polygon points="342.0,50.0 337.9,59.5 331.8,51.5" fill="#3FA34D" stroke="#3FA34D" stroke-width="1" stroke-linejoin="round" /><line x1="316" y1="70" x2="333.0" y2="70.0" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" /><polygon points="342.0,70.0 333.0,75.0 333.0,65.0" fill="#FF8A1F" stroke="#FF8A1F" stroke-width="1" stroke-linejoin="round" /><line x1="316" y1="70" x2="334.8663840980586" y2="84.51260315235277" stroke="#7C5CFF" stroke-width="3" stroke-linecap="round" /><polygon points="342.0,90.0 331.8,88.5 337.9,80.5" fill="#7C5CFF" stroke="#7C5CFF" stroke-width="1" stroke-linejoin="round" /><line x1="80" y1="146" x2="80" y2="192" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><line x1="54" y1="156" x2="106" y2="156" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><path d="M46,172 h16 q-8,12 -16,0z" fill="#FFD166" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M98,172 h16 q-8,12 -16,0z" fill="#FFD166" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><line x1="54" y1="156" x2="54" y2="172" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="106" y1="156" x2="106" y2="172" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="66" y1="192" x2="94" y2="192" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><polygon points="176.0,164.0 196.0,164.0 222.0,148.0 222.0,192.0 196.0,176.0 176.0,176.0" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><line x1="184" y1="176" x2="188" y2="194" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><path d="M294,192 v-30 q13,-6 26,2 q13,-8 26,-2 v30 q-13,-6 -26,2 q-13,-8 -26,-2z" fill="#FFE3C2" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><line x1="320" y1="166" x2="320" y2="194" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><polygon points="302.0,148.0 320.0,138.0 338.0,148.0 320.0,158.0" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" /></svg>