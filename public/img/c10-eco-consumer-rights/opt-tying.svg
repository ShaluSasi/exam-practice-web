<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A seller insisting that two things must be bought together</title><style>text{font-family:sans-serif}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1.6s linear infinite}
.slide{animation:slide 3s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.puff{animation:puff 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes grow{0%{transform:scaleX(.25)}60%,100%{transform:scaleX(1)}}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-26px) scale(1.3);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="30" y="40" width="30" height="52" rx="4" fill="#7FD0E8" stroke="#2B2F4A" stroke-width="3" /><rect x="36" y="30" width="18" height="12" rx="3" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><rect x="70" y="56" width="8" height="36" rx="3" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" /><rect x="66" y="46" width="16" height="12" rx="3" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><line x1="24" y1="100" x2="90" y2="100" stroke="#E5484D" stroke-width="5" stroke-linecap="round" /><circle cx="144" cy="69.7" r="8.1" fill="#F6C9A0" stroke="#2B2F4A" stroke-width="2.5" /><path d="M135.9,67.0 q8.1,-8.1 16.2,0" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="134.1" y="79.6" width="19.8" height="25.2" rx="6.3" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2.5" /><line x1="139.5" y1="104.8" x2="139.5" y2="117.4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="148.5" y1="104.8" x2="148.5" y2="117.4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><rect x="112" y="8" width="82" height="26" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><polygon points="170.0,33.0 182.0,33.0 184.0,46.0" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" /><line x1="171" y1="34" x2="181" y2="34" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" /><text x="153.0" y="25.0" font-size="11" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Buy both!</text><text x="100" y="140" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Must buy both</text></svg>