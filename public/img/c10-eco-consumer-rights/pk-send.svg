<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>Prakash at a post office counter with a slip</title><style>text{font-family:sans-serif}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1.6s linear infinite}
.slide{animation:slide 3s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.puff{animation:puff 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes grow{0%{transform:scaleX(.25)}60%,100%{transform:scaleX(1)}}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-26px) scale(1.3);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="60" y="30" width="80" height="70" rx="6" fill="#E6D5B8" stroke="#2B2F4A" stroke-width="3" /><rect x="70" y="56" width="60" height="8" rx="2" fill="#8A6B4A" stroke="#2B2F4A" stroke-width="0" /><circle cx="48" cy="74.4" r="7.2" fill="#F6C9A0" stroke="#2B2F4A" stroke-width="2.5" /><path d="M40.8,72.0 q7.2,-7.2 14.4,0" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="39.2" y="83.2" width="17.6" height="22.400000000000002" rx="5.6000000000000005" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" /><line x1="44.0" y1="105.6" x2="44.0" y2="116.8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="52.0" y1="105.6" x2="52.0" y2="116.8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><rect x="128" y="66" width="24" height="30" rx="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><line x1="135" y1="80" x2="145" y2="80" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="135" y1="90" x2="145" y2="90" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><text x="100" y="48" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >POST</text><text x="100" y="142" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Sends money order</text></svg>