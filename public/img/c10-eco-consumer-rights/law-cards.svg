<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Four paper documents with coloured headers and a gavel</title><style>text{font-family:sans-serif}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1.6s linear infinite}
.slide{animation:slide 3s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.puff{animation:puff 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes grow{0%{transform:scaleX(.25)}60%,100%{transform:scaleX(1)}}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-26px) scale(1.3);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><g class="bob" style="animation-delay:0.0s"><rect x="24" y="56" width="70" height="96" rx="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><line x1="31" y1="70" x2="87" y2="70" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="31" y1="80" x2="87" y2="80" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="31" y1="90" x2="87" y2="90" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="31" y1="100" x2="87" y2="100" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><rect x="24" y="56" width="70" height="18" rx="4" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" /><text x="59" y="69" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle" >Law 1</text></g><g class="bob" style="animation-delay:0.3s"><rect x="116" y="56" width="70" height="96" rx="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><line x1="123" y1="70" x2="179" y2="70" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="123" y1="80" x2="179" y2="80" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="123" y1="90" x2="179" y2="90" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="123" y1="100" x2="179" y2="100" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><rect x="116" y="56" width="70" height="18" rx="4" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" /><text x="151" y="69" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle" >Law 2</text></g><g class="bob" style="animation-delay:0.6s"><rect x="208" y="56" width="70" height="96" rx="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><line x1="215" y1="70" x2="271" y2="70" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="215" y1="80" x2="271" y2="80" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="215" y1="90" x2="271" y2="90" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="215" y1="100" x2="271" y2="100" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><rect x="208" y="56" width="70" height="18" rx="4" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" /><text x="243" y="69" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle" >Law 3</text></g><g class="bob" style="animation-delay:0.8999999999999999s"><rect x="300" y="56" width="70" height="96" rx="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><line x1="307" y1="70" x2="363" y2="70" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="307" y1="80" x2="363" y2="80" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="307" y1="90" x2="363" y2="90" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="307" y1="100" x2="363" y2="100" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><rect x="300" y="56" width="70" height="18" rx="4" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.5" /><text x="335" y="69" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle" >Law 4</text></g><g transform="translate(40,190) rotate(-25) scale(0.6)"><rect x="-18" y="-9" width="36" height="18" rx="4" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" /><line x1="0" y1="9" x2="0" y2="40" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round" /></g><text x="230" y="200" font-size="13" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Rules that protect consumers</text></svg>