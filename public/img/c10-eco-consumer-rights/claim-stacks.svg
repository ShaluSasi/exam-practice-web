<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Three stacks of coins of increasing height</title><style>text{font-family:sans-serif}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1.6s linear infinite}
.slide{animation:slide 3s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.puff{animation:puff 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes grow{0%{transform:scaleX(.25)}60%,100%{transform:scaleX(1)}}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-26px) scale(1.3);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><circle cx="80" cy="170" r="18" fill="#FFD166" stroke="#2B2F4A" stroke-width="2.5" /><text x="80" y="176.3" font-size="19.8" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >₹</text><circle cx="80" cy="159" r="18" fill="#FFD166" stroke="#2B2F4A" stroke-width="2.5" /><text x="80" y="165.3" font-size="19.8" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >₹</text><text x="80" y="206" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Small claim</text><circle cx="200" cy="170" r="18" fill="#FFD166" stroke="#2B2F4A" stroke-width="2.5" /><text x="200" y="176.3" font-size="19.8" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >₹</text><circle cx="200" cy="159" r="18" fill="#FFD166" stroke="#2B2F4A" stroke-width="2.5" /><text x="200" y="165.3" font-size="19.8" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >₹</text><circle cx="200" cy="148" r="18" fill="#FFD166" stroke="#2B2F4A" stroke-width="2.5" /><text x="200" y="154.3" font-size="19.8" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >₹</text><circle cx="200" cy="137" r="18" fill="#FFD166" stroke="#2B2F4A" stroke-width="2.5" /><text x="200" y="143.3" font-size="19.8" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >₹</text><text x="200" y="206" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Bigger claim</text><circle cx="320" cy="170" r="18" fill="#FFD166" stroke="#2B2F4A" stroke-width="2.5" /><text x="320" y="176.3" font-size="19.8" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >₹</text><circle cx="320" cy="159" r="18" fill="#FFD166" stroke="#2B2F4A" stroke-width="2.5" /><text x="320" y="165.3" font-size="19.8" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >₹</text><circle cx="320" cy="148" r="18" fill="#FFD166" stroke="#2B2F4A" stroke-width="2.5" /><text x="320" y="154.3" font-size="