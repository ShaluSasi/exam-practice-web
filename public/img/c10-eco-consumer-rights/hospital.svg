<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A clinic building with a red cross sign and a patient file</title><style>text{font-family:sans-serif}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1.6s linear infinite}
.slide{animation:slide 3s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.puff{animation:puff 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes grow{0%{transform:scaleX(.25)}60%,100%{transform:scaleX(1)}}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-26px) scale(1.3);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="100" y="56" width="200" height="124" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><rect x="185" y="70" width="30" height="30" rx="4" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" /><rect x="196" y="74" width="8" height="22" rx="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="0" /><rect x="189" y="81" width="22" height="8" rx="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="0" /><rect x="185" y="130" width="30" height="50" rx="4" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" /><rect x="118" y="108" width="36" height="30" rx="4" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" /><rect x="246" y="108" width="36" height="30" rx="4" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" /><circle cx="60" cy="143.7" r="8.1" fill="#F6C9A0" stroke="#2B2F4A" stroke-width="2.5" /><path d="M51.9,141.0 q8.1,-8.1 16.2,0" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="50.1" y="153.6" width="19.8" height="25.2" rx="6.3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" /><line x1="55.5" y1="178.8" x2="55.5" y2="191.4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="64.5" y1="178.8" x2="64.5" y2="191.4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><rect x="310" y="128" width="40" height="50" rx="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><line x1="317" y1="142" x2="343" y2="142" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="317" y1="152" x2="343" y2="152" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="317" y1="162" x2="343" y2="162" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><text x="200" y="206" font-size="13" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >A private clinic</text><text x="200" y="224" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Safety matters most</text></svg>