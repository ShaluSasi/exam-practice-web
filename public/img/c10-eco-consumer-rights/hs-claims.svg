<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A coloured bar split into three claim ranges with markers at 1 crore and 10 crore rupees</title><style>text{font-family:sans-serif}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1.6s linear infinite}
.slide{animation:slide 3s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.puff{animation:puff 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes grow{0%{transform:scaleX(.25)}60%,100%{transform:scaleX(1)}}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-26px) scale(1.3);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="30" y="90" width="100" height="44" rx="0" fill="#CDEBC8" stroke="#2B2F4A" stroke-width="3" /><rect x="130" y="90" width="140" height="44" rx="0" fill="#FFE3A8" stroke="#2B2F4A" stroke-width="3" /><rect x="270" y="90" width="100" height="44" rx="0" fill="#CFE0FF" stroke="#2B2F4A" stroke-width="3" /><line x1="30" y1="150" x2="370" y2="150" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="30" y1="142" x2="30" y2="160" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="30" y="178" font-size="13" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >₹0</text><line x1="130" y1="142" x2="130" y2="160" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="130" y="178" font-size="13" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >₹1 crore</text><line x1="270" y1="142" x2="270" y2="160" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="270" y="178" font-size="13" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >₹10 crore</text><line x1="340" y1="150" x2="363.0" y2="150.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><polygon points="372.0,150.0 363.0,155.0 363.0,145.0" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1" stroke-linejoin="round" /><text x="200" y="56" font-size="14" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Amount claimed by the consumer</text><g class="pulse"><circle cx="80" cy="112" r="7" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><circle cx="200" cy="112" r="7" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><circle cx="320" cy="112" r="7" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /></g><text x="200" y="214" font-size="11" font-weight="normal" fill="#2B2F4A" text-anchor="middle" >Schematic bar (not to scale)</text></svg>