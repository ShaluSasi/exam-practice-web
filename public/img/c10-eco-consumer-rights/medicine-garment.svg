<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A medicine box with a leaflet and a shirt with a care tag</title><style>text{font-family:sans-serif}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1.6s linear infinite}
.slide{animation:slide 3s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.puff{animation:puff 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes grow{0%{transform:scaleX(.25)}60%,100%{transform:scaleX(1)}}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-26px) scale(1.3);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="26" y="56" width="150" height="100" rx="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><rect x="40" y="70" width="122" height="24" rx="5" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" /><text x="101" y="87" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" >Medicine</text><line x1="44" y1="110" x2="150" y2="110" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="44" y1="124" x2="136" y2="124" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="44" y1="138" x2="122" y2="138" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><circle cx="150" cy="140" r="7" fill="#FFD166" stroke="#2B2F4A" stroke-width="2" /><path d="M240,70 l30,-14 q15,18 30,0 l30,14 l-18,26 l-12,-8 v70 h-60 v-70 l-12,8z" fill="#F5B7D2" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="268" y="96" width="30" height="22" rx="3" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><line x1="274" y1="104" x2="292" y2="104" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="274" y1="111" x2="288" y2="111" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><text x="101" y="186" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >On a medicine pack</text><text x="284" y="186" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >On a garment tag</text></svg>