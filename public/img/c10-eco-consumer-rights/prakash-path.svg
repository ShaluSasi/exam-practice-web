<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A winding dashed path from a post office to a distant house with an envelope on the way</title><style>text{font-family:sans-serif}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1.6s linear infinite}
.slide{animation:slide 3s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.puff{animation:puff 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes grow{0%{transform:scaleX(.25)}60%,100%{transform:scaleX(1)}}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-26px) scale(1.3);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M30,170 C110,60 190,200 260,110 S350,90 372,60" fill="none" stroke="#FF8A1F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8" class="flow"/><rect x="18" y="154" width="46" height="30" rx="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><path d="M18,160 l23,12 l23,-12" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="372" cy="60" r="14" fill="#FFD166" stroke="#2B2F4A" stroke-width="3" /><text x="372" y="65" font-size="16" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >?</text><g class="slide"><rect x="150" y="118" width="28" height="20" rx="3" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><path d="M150,122 l14,8 l14,-8" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="200" y="214" font-size="13" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >A money order that never arrived</text></svg>