<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A registration form being filled in</title><style>text{font-family:sans-serif}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1.6s linear infinite}
.slide{animation:slide 3s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.puff{animation:puff 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes grow{0%{transform:scaleX(.25)}60%,100%{transform:scaleX(1)}}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-26px) scale(1.3);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="70" y="18" width="60" height="82" rx="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><line x1="77" y1="32" x2="123" y2="32" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="77" y1="42" x2="123" y2="42" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="77" y1="52" x2="123" y2="52" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="77" y1="62" x2="123" y2="62" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="77" y1="72" x2="123" y2="72" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><rect x="80" y="22" width="40" height="16" rx="0" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="0" /><text x="100" y="35" font-size="11" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >FORM</text><path d="M128,88 l16,-16 l6,6 l-16,16 l-9,3z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><text x="100" y="142" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Files the case</text></svg>