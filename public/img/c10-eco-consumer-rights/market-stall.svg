oke-linecap="round" /><circle cx="0" cy="0" r="4.0" fill="#FFD166" stroke="#2B2F4A" stroke-width="2.5" /><line x1="-32.0" y1="0" x2="-44.8" y2="17.6" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="-32.0" y1="0" x2="-19.2" y2="17.6" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><path d="M-48.0,17.6 h32.0 q0,8.0 -16.0,8.0 q-16.0,0 -16.0,-8.0z" fill="#E9ECF5" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(-32.0,17.6)"><path d="M-8.0,0 q8.0,-13.0 16.0,0z" fill="#F4E7C3" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><line x1="32.0" y1="0" x2="19.2" y2="17.6" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="32.0" y1="0" x2="44.8" y2="17.6" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><path d="M16.0,17.6 h32.0 q0,8.0 -16.0,8.0 q-16.0,0 -16.0,-8.0z" fill="#E9ECF5" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(32.0,17.6)"><rect x="-10" y="-16" width="20" height="16" rx="2" fill="#9AA5B8" stroke="#2B2F4A" stroke-width="2" /></g></g><rect x="280" y="112" width="76" height="48" rx="5" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><text x="318" y="130" font-size="11" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >BILL</text><text x="318" y="146" font-size="11" font-weight="bold" fill="#E5484D" text-anchor="middle" >Fee extra: ₹20</text><rect x="150" y="156" width="44" height="6" rx="2" fill="#8A6B4A" stroke="#2B2F4A" stroke-width="0" /><path d="M120,160 q16,-26 32,0z" fill="#B77A3A" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><text x="200" y="214" font-size="13" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >A busy shop counter</text></svg>