<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A scale held level by a hand pressing under the pan while a tiny heap sits against a 1 kg weight</title><style>text{font-family:sans-serif}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1.6s linear infinite}
.slide{animation:slide 3s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.puff{animation:puff 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes grow{0%{transform:scaleX(.25)}60%,100%{transform:scaleX(1)}}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-26px) scale(1.3);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><polygon points="82.4,108.0 117.6,108.0 109.6,101.6 90.4,101.6" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" /><line x1="100" y1="101.6" x2="100" y2="71.19999999999999" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><g transform="translate(100,71.19999999999999) rotate(0)"><line x1="-32.0" y1="0" x2="32.0" y2="0" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><circle cx="0" cy="0" r="4.0" fill="#FFD166" stroke="#2B2F4A" stroke-width="2.5" /><line x1="-32.0" y1="0" x2="-44.8" y2="17.6" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="-32.0" y1="0" x2="-19.2" y2="17.6" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><path d="M-48.0,17.6 h32.0 q0,8.0 -16.0,8.0 q-16.0,0 -16.0,-8.0z" fill="#E9ECF5" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(-32.0,17.6)"><path d="M-8.0,0 q8.0,-13.0 16.0,0z" fill="#F4E7C3" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><line x1="32.0" y1="0" x2="19.2" y2="17.6" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="32.0" y1="0" x2="44.8" y2="17.6" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><path d="M16.0,17.6 h32.0 q0,8.0 -16.0,8.0 q-16.0,0 -16.0,-8.0z" fill="#E9ECF5" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(32.0,17.6)"><rect x="-10" y="-16" width="20" height="16" rx="2" fill="#9AA5B8" stroke="#2B2F4A" stroke-width="2" /><text x="0" y="-4" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle" >1kg</text></g></g><ellipse cx="60" cy="117" rx="13" ry="8" fill="#F6C9A0" stroke="#2B2F4A" stroke-width="2.5"/><rect x="57" y="97" width="7" height="16" rx="3" fill="#F6C9A0" stroke="#2B2F4A" stroke-width="2.5" /><text x="100" y="140" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Weighing</text></svg>