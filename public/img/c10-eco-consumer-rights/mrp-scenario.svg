<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A packet printed with 40 rupees, a seller asking 45 rupees and a thoughtful buyer</title><style>text{font-family:sans-serif}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1.6s linear infinite}
.slide{animation:slide 3s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.puff{animation:puff 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes grow{0%{transform:scaleX(.25)}60%,100%{transform:scaleX(1)}}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-26px) scale(1.3);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="176" width="400" height="64" rx="0" fill="#D9B38C" stroke="#2B2F4A" stroke-width="0" /><rect x="150" y="108" width="60" height="70" rx="6" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" /><circle cx="180" cy="140" r="20" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><text x="180" y="146" font-size="14" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >₹40</text><text x="180" y="128" font-size="8" font-weight="normal" fill="#2B2F4A" text-anchor="middle" >Printed</text><circle cx="310" cy="127.6" r="10.799999999999999" fill="#F6C9A0" stroke="#2B2F4A" stroke-width="2.5" /><path d="M299.2,124.0 q10.8,-10.8 21.6,0" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="296.8" y="140.8" width="26.4" height="33.6" rx="8.4" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2.5" /><line x1="304.0" y1="174.4" x2="304.0" y2="191.2" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="316.0" y1="174.4" x2="316.0" y2="191.2" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><rect x="222" y="50" width="150" height="44" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><polygon points="348.0,93.0 360.0,93.0 362.0,106.0" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" /><line x1="349" y1="94" x2="359" y2="94" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" /><text x="297.0" y="76.0" font-size="13" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Pay ₹45 for this</text><circle cx="80" cy="138.0" r="9.0" fill="#F6C9A0" stroke="#2B2F4A" stroke-width="2.5" /><path d="M71.0,135.0 q9.0,-9.0 18.0,0" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="69.0" y="149.0" width="22.0" height="28.0" rx="7.0" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" /><line x1="75.0" y1="177.0" x2="75.0" y2="191.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="85.0" y1="177.0" x2="85.0" y2="191.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><rect x="24" y="54" width="100" height="36" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><polygon points="36.0,89.0 48.0,89.0 34.0,102.0" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" /><line x1="37" y1="90" x2="47" y2="90" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" /><text x="74.0" y="76.0" font-size="13" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Hmm...</text></svg>