<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A six-month warranty bar with the television stopping at the three month mark</title><style>text{font-family:sans-serif}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1.6s linear infinite}
.slide{animation:slide 3s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.puff{animation:puff 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes grow{0%{transform:scaleX(.25)}60%,100%{transform:scaleX(1)}}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-26px) scale(1.3);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="30" y="70" width="340" height="34" rx="6" fill="#E9ECF5" stroke="#2B2F4A" stroke-width="3" /><rect x="30" y="70" width="170" height="34" rx="6" fill="#CDEBC8" stroke="#2B2F4A" stroke-width="3" /><rect x="200" y="70" width="170" height="34" rx="6" fill="#FFD9A8" stroke="#2B2F4A" stroke-width="3" /><line x1="30.0" y1="104" x2="30.0" y2="114" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="30.0" y="130" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >0</text><line x1="86.66666666666666" y1="104" x2="86.66666666666666" y2="114" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="86.66666666666666" y="130" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >1</text><line x1="143.33333333333331" y1="104" x2="143.33333333333331" y2="114" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="143.33333333333331" y="130" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >2</text><line x1="200.0" y1="104" x2="200.0" y2="114" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="200.0" y="130" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >3</text><line x1="256.66666666666663" y1="104" x2="256.66666666666663" y2="114" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="256.66666666666663" y="130" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >4</text><line x1="313.3333333333333" y1="104" x2="313.3333333333333" y2="114" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="313.3333333333333" y="130" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >5</text><line x1="370.0" y1="104" x2="370.0" y2="114" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="370.0" y="130" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >6</text><text x="200" y="150" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Months of warranty</text><g class="blink"><rect x="164" y="160" width="72" height="46" rx="5" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" /><line x1="191.6" y1="174.6" x2="208.4" y2="191.4" stroke="#E5484D" stroke-width="4" stroke-linecap="round" /><line x1="208.4" y1="174.6" x2="191.6" y2="191.4" stroke="#E5484D" stroke-width="4" stroke-linecap="round" /></g><text x="115" y="92" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Worked fine</text><text x="285" y="92" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Warranty remaining</text><path d="M200,56 v12" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="200" y="48" font-size="12" font-weight="bold" fill="#E5484D" text-anchor="middle" >TV stops</text></svg>