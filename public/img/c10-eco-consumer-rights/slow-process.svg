<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A stack of papers, a clock and a lawyer with a briefcase</title><style>text{font-family:sans-serif}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1.6s linear infinite}
.slide{animation:slide 3s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.puff{animation:puff 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes grow{0%{transform:scaleX(.25)}60%,100%{transform:scaleX(1)}}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-26px) scale(1.3);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="40" y="120" width="46" height="56" rx="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><line x1="47" y1="134" x2="79" y2="134" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="47" y1="144" x2="79" y2="144" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="47" y1="154" x2="79" y2="154" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><rect x="48" y="106" width="46" height="56" rx="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><line x1="55" y1="120" x2="87" y2="120" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="55" y1="130" x2="87" y2="130" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="55" y1="140" x2="87" y2="140" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><rect x="56" y="92" width="46" height="56" rx="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><line x1="63" y1="106" x2="95" y2="106" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="63" y1="116" x2="95" y2="116" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="63" y1="126" x2="95" y2="126" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><rect x="64" y="78" width="46" height="56" rx="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><line x1="71" y1="92" x2="103" y2="92" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="71" y1="102" x2="103" y2="102" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="71" y1="112" x2="103" y2="112" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><circle cx="180" cy="96" r="32" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="4" /><line x1="180" y1="96" x2="180" y2="74" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><line x1="180" y1="96" x2="196" y2="104" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><g class="pulse"><circle cx="180" cy="96" r="4" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="0" /></g><circle cx="290" cy="133.0" r="9.0" fill="#F6C9A0" stroke="#2B2F4A" stroke-width="2.5" /><path d="M281.0,130.0 q9.0,-9.0 18.0,0" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="279.0" y="144.0" width="22.0" height="28.0" rx="7.0" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2.5" /><line x1="285.0" y1="172.0" x2="285.0" y2="186.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="295.0" y1="172.0" x2="295.0" y2="186.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><rect x="312" y="130" width="34" height="28" rx="3" fill="#6E3F2B" stroke="#2B2F4A" stroke-width="2.5" /><text x="70" y="200" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Paperwork</text><text x="180" y="150" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Time</text></svg>