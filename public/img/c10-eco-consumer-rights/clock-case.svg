<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A wall clock, a bill with warranty and a gavel</title><style>text{font-family:sans-serif}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1.6s linear infinite}
.slide{animation:slide 3s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.puff{animation:puff 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes grow{0%{transform:scaleX(.25)}60%,100%{transform:scaleX(1)}}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-26px) scale(1.3);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><circle cx="110" cy="110" r="52" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="4" /><line x1="110.0" y1="68.0" x2="110.0" y2="62.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="131.0" y1="73.62693304105358" x2="134.0" y2="68.43078061834694" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="146.37306695894642" y1="89.0" x2="151.56921938165306" y2="86.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="152.0" y1="110.0" x2="158.0" y2="110.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="146.37306695894642" y1="131.0" x2="151.56921938165306" y2="134.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="131.0" y1="146.37306695894642" x2="134.0" y2="151.56921938165306" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="110.0" y1="152.0" x2="110.0" y2="158.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="89.00000000000001" y1="146.37306695894642" x2="86.00000000000001" y2="151.56921938165306" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="73.62693304105358" y1="131.00000000000003" x2="68.43078061834694" y2="134.00000000000003" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="68.0" y1="110.00000000000001" x2="62.0" y2="110.00000000000001" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="73.62693304105358" y1="89.0" x2="68.43078061834694" y2="86.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="88.99999999999999" y1="73.62693304105359" x2="85.99999999999997" y2="68.43078061834696" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><g class="sw"><line x1="110" y1="110" x2="110" y2="78" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><line x1="110" y1="110" x2="130" y2="118" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /></g><circle cx="110" cy="110" r="5" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" /><rect x="220" y="56" width="64" height="80" rx="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><line x1="227" y1="70" x2="277" y2="70" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="227" y1="80" x2="277" y2="80" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="227" y1="90" x2="277" y2="90" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="227" y1="100" x2="277" y2="100" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><text x="252" y="74" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Bill</text><text x="252" y="154" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >&amp; warranty</text><g transform="translate(340,110) rotate(-30) scale(0.9)"><rect x="-18" y="-9" width="36" height="18" rx="4" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" /><line x1="0" y1="9" x2="0" y2="40" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round" /></g><text x="110" y="196" font-size="13" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Wall clock</text></svg>