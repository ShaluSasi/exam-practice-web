<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A laptop with a shopping box, two people shaking hands and a gavel</title><style>text{font-family:sans-serif}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1.6s linear infinite}
.slide{animation:slide 3s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.puff{animation:puff 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes grow{0%{transform:scaleX(.25)}60%,100%{transform:scaleX(1)}}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-26px) scale(1.3);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="54.0" y="72.4" width="72.0" height="45.6" rx="4" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5" /><path d="M42.0,120.4 h96.0 l-7.2,10.8 h-81.6z" fill="#E9ECF5" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="62" y="66" width="56" height="10" rx="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="0" /><text x="90" y="98" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Shop</text><g class="bob"><rect x="106" y="112" width="22" height="16" rx="3" fill="#FFD166" stroke="#2B2F4A" stroke-width="2.5" /></g><circle cx="200" cy="123.0" r="9.0" fill="#F6C9A0" stroke="#2B2F4A" stroke-width="2.5" /><path d="M191.0,120.0 q9.0,-9.0 18.0,0" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="189.0" y="134.0" width="22.0" height="28.0" rx="7.0" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" /><line x1="195.0" y1="162.0" x2="195.0" y2="176.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="205.0" y1="162.0" x2="205.0" y2="176.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><circle cx="240" cy="123.0" r="9.0" fill="#F6C9A0" stroke="#2B2F4A" stroke-width="2.5" /><path d="M231.0,120.0 q9.0,-9.0 18.0,0" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="229.0" y="134.0" width="22.0" height="28.0" rx="7.0" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.5" /><line x1="235.0" y1="162.0" x2="235.0" y2="176.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="245.0" y1="162.0" x2="245.0" y2="176.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="212" y1="130" x2="228" y2="130" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><g transform="translate(330,112) rotate(-30) scale(0.9)"><rect x="-18" y="-9" width="36" height="18" rx="4" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" /><line x1="0" y1="9" x2="0" y2="40" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round" /></g><rect x="300" y="140" width="60" height="10" rx="3" fill="#D9B38C" stroke="#2B2F4A" stroke-width="2" /><text x="90" y="190" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Online buying</text><text x="220" y="190" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Neutral helper</text><text x="330" y="190" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Penalty</text></svg>