<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A bar from zero to one crore rupees with a small marked part for 5 lakh</title><style>text{font-family:sans-serif}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1.6s linear infinite}
.slide{animation:slide 3s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.puff{animation:puff 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes grow{0%{transform:scaleX(.25)}60%,100%{transform:scaleX(1)}}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-26px) scale(1.3);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="50" y="100" width="300" height="34" rx="0" fill="#CDEBC8" stroke="#2B2F4A" stroke-width="3" /><rect x="50" y="100" width="15.0" height="34" rx="0" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" /><line x1="50.0" y1="134" x2="50.0" y2="148" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="50.0" y="166" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >0</text><line x1="200.0" y1="134" x2="200.0" y2="148" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="200.0" y="166" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >50 lakh</text><line x1="350.0" y1="134" x2="350.0" y2="148" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="350.0" y="166" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >1 crore</text><g class="bob"><rect x="54" y="36" width="120" height="36" rx="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><text x="114" y="59" font-size="13" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Claim: ₹5,00,000</text></g><line x1="65.0" y1="72" x2="65.0" y2="100" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><text x="200" y="206" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >1 crore = 100 lakh</text></svg>