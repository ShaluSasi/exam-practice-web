<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A rights awareness poster and a television showing an advert about consumer rights</title><style>text{font-family:sans-serif}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1.6s linear infinite}
.slide{animation:slide 3s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.puff{animation:puff 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes grow{0%{transform:scaleX(.25)}60%,100%{transform:scaleX(1)}}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-26px) scale(1.3);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="40" y="38" width="130" height="130" rx="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><text x="105" y="62" font-size="13" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Know your</text><text x="105" y="80" font-size="15" font-weight="bold" fill="#E5484D" text-anchor="middle" >rights</text><path d="M92.2,120 l9.6,11.2 l17.6,-22.4" fill="none" stroke="#3FA34D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="220" y="50" width="130" height="86" rx="8" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="3" /><rect x="228" y="58" width="114" height="64" rx="4" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" /><rect x="266" y="70" width="34" height="42" rx="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><line x1="273" y1="84" x2="293" y2="84" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="273" y1="94" x2="293" y2="94" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="273" y1="104" x2="293" y2="104" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><rect x="250" y="138" width="70" height="10" rx="3" fill="#E9ECF5" stroke="#2B2F4A" stroke-width="2" /><text x="105" y="190" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Poster</text><text x="285" y="170" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Television advert</text></svg>