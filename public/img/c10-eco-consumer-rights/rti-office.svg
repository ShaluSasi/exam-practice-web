<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>An applicant holding a form at a government counter with a pending results board</title><style>text{font-family:sans-serif}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1.6s linear infinite}
.slide{animation:slide 3s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.puff{animation:puff 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes grow{0%{transform:scaleX(.25)}60%,100%{transform:scaleX(1)}}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-26px) scale(1.3);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="150" y="40" width="220" height="124" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><rect x="165" y="54" width="130" height="40" rx="6" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" /><text x="230" y="79" font-size="13" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Results: pending</text><rect x="150" y="120" width="220" height="44" rx="4" fill="#D9B38C" stroke="#2B2F4A" stroke-width="3" /><circle cx="345" cy="88.4" r="7.2" fill="#F6C9A0" stroke="#2B2F4A" stroke-width="2.5" /><path d="M337.8,86.0 q7.2,-7.2 14.4,0" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="336.2" y="97.2" width="17.6" height="22.400000000000002" rx="5.6000000000000005" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2.5" /><line x1="341.0" y1="119.6" x2="341.0" y2="130.8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="349.0" y1="119.6" x2="349.0" y2="130.8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><circle cx="80" cy="135.3" r="9.9" fill="#F6C9A0" stroke="#2B2F4A" stroke-width="2.5" /><path d="M70.1,132.0 q9.9,-9.9 19.8,0" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="67.9" y="147.4" width="24.200000000000003" height="30.800000000000004" rx="7.700000000000001" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" /><line x1="74.5" y1="178.2" x2="74.5" y2="193.6" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="85.5" y1="178.2" x2="85.5" y2="193.6" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><rect x="100" y="128" width="34" height="42" rx="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><line x1="107" y1="142" x2="127" y2="142" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="107" y1="152" x2="127" y2="152" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><rect x="18" y="56" width="100" height="38" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><polygon points="30.0,93.0 42.0,93.0 28.0,106.0" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" /><line x1="31" y1="94" x2="41" y2="94" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" /><text x="68.0" y="79.0" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Why the delay?</text><g class="blink"><circle cx="318" cy="66" r="10" fill="#FFD166" stroke="#2B2F4A" stroke-width="2.5" /><text x="318" y="71" font-size="14" font-weight="bold" fill="#E5484D" text-anchor="middle" >?</text></g><text x="200" y="214" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >A government office counter</text></svg>