<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A poster board, display stand and a printed article viewed by visitors</title><style>text{font-family:sans-serif}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1.6s linear infinite}
.slide{animation:slide 3s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.puff{animation:puff 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes grow{0%{transform:scaleX(.25)}60%,100%{transform:scaleX(1)}}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-26px) scale(1.3);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="28" y="36" width="100" height="110" rx="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><text x="78" y="60" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Exhibition</text><line x1="42" y1="78" x2="114" y2="78" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="42" y1="92" x2="114" y2="92" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="42" y1="106" x2="96" y2="106" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><rect x="150" y="56" width="100" height="90" rx="6" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" /><circle cx="185" cy="100" r="18" fill="#FFD166" stroke="#2B2F4A" stroke-width="2.5" /><rect x="206" y="92" width="30" height="40" rx="4" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" /><rect x="272" y="40" width="90" height="60" rx="6" fill="#E9ECF5" stroke="#2B2F4A" stroke-width="3" /><text x="317" y="60" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Article</text><line x1="284" y1="74" x2="350" y2="74" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="284" y1="86" x2="340" y2="86" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><rect x="0" y="180" width="400" height="60" rx="0" fill="#D9B38C" stroke="#2B2F4A" stroke-width="0" /><circle cx="120" cy="168.4" r="7.2" fill="#F6C9A0" stroke="#2B2F4A" stroke-width="2.5" /><path d="M112.8,166.0 q7.2,-7.2 14.4,0" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="111.2" y="177.2" width="17.6" height="22.400000000000002" rx="5.6000000000000005" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" /><line x1="116.0" y1="199.6" x2="116.0" y2="210.8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="124.0" y1="199.6" x2="124.0" y2="210.8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><circle cx="220" cy="168.4" r="7.2" fill="#F6C9A0" stroke="#2B2F4A" stroke-width="2.5" /><path d="M212.8,166.0 q7.2,-7.2 14.4,0" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="211.2" y="177.2" width="17.6" height="22.400000000000002" rx="5.6000000000000005" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" /><line x1="216.0" y1="199.6" x2="216.0" y2="210.8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="224.0" y1="199.6" x2="224.0" y2="210.8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><circle cx="300" cy="168.4" r="7.2" fill="#F6C9A0" stroke="#2B2F4A" stroke-width="2.5" /><path d="M292.8,166.0 q7.2,-7.2 14.4,0" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="291.2" y="177.2" width="17.6" height="22.400000000000002" rx="5.6000000000000005" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.5" /><line x1="296.0" y1="199.6" x2="296.0" y2="210.8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="304.0" y1="199.6" x2="304.0" y2="210.8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="200" y="224" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Early consumer activity</text></svg>