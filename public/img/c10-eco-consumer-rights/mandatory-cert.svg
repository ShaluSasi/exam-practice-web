<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Goods sliding on a belt through a quality gate with a tick</title><style>text{font-family:sans-serif}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1.6s linear infinite}
.slide{animation:slide 3s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.puff{animation:puff 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes grow{0%{transform:scaleX(.25)}60%,100%{transform:scaleX(1)}}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-26px) scale(1.3);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="20" y="150" width="360" height="20" rx="6" fill="#8A93AA" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="200" font-size="13" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Checked before sale</text><g class="slide"><rect x="46" y="108" width="28" height="42" rx="5" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" /><rect x="52" y="98" width="16" height="12" rx="2" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="0" /></g><g class="slide"><rect x="116" y="108" width="28" height="42" rx="5" fill="#7FD0E8" stroke="#2B2F4A" stroke-width="3" /><rect x="122" y="98" width="16" height="12" rx="2" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="0" /></g><rect x="190" y="60" width="70" height="90" rx="8" fill="#E9ECF5" stroke="#2B2F4A" stroke-width="3" /><rect x="200" y="74" width="50" height="50" rx="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><path d="M213.8,108 l8.4,9.8 l15.4,-19.6" fill="none" stroke="#3FA34D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="225" y="52" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Quality gate</text><path d="M300.0,150 q-4,-24.0 7.2,-32.0 h25.6 q8.8,8.0 7.2,32.0z" fill="#BFC7D6" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></svg>