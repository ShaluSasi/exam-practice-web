<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A grid of one hundred dots with the first three highlighted</title><style>text{font-family:sans-serif}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1.6s linear infinite}
.slide{animation:slide 3s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.puff{animation:puff 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes grow{0%{transform:scaleX(.25)}60%,100%{transform:scaleX(1)}}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-26px) scale(1.3);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><circle cx="26" cy="38" r="6" fill="#C7CEDF" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="46" cy="38" r="6" fill="#C7CEDF" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="66" cy="38" r="6" fill="#C7CEDF" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="86" cy="38" r="6" fill="#C7CEDF" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="106" cy="38" r="6" fill="#C7CEDF" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="126" cy="38" r="6" fill="#C7CEDF" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="146" cy="38" r="6" fill="#C7CEDF" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="166" cy="38" r="6" fill="#C7CEDF" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="186" cy="38" r="6" fill="#C7CEDF" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="206" cy="38" r="6" fill="#C7CEDF" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="26" cy="54" r="6" fill="#C7CEDF" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="46" cy="54" r="6" fill="#C7CEDF" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="66" cy="54" r="6" fill="#C7CEDF" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="86" cy="54" r="6" fill="#C7CEDF" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="106" cy="54" r="6" fill="#C7CEDF" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="126" cy="54" r="6" fill="#C7CEDF" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="146" cy="54" r="6" fill="#C7CEDF" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="166" cy="54" r="6" fill="#C7CEDF" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="186" cy="54" r="6" fill="#C7CEDF" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="206" cy="54" r="6" fill="#C7CEDF" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="26" cy="70" r="6" fill="#C7CEDF" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="46" cy="70" r="6" fill="#C7CEDF" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="66" cy="70" r="6"