<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A calendar page showing 24 December beside a columned building</title><style>text{font-family:sans-serif}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1.6s linear infinite}
.slide{animation:slide 3s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.puff{animation:puff 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes grow{0%{transform:scaleX(.25)}60%,100%{transform:scaleX(1)}}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-26px) scale(1.3);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="60" y="40" width="120" height="140" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><rect x="60" y="40" width="120" height="38" rx="10" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" /><text x="120" y="66" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" >December</text><text x="120" y="140" font-size="52" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >24</text><polygon points="245.8,91.0 290.0,62.4 334.2,91.0" fill="#FFD166" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" /><rect x="245.8" y="91.0" width="88.4" height="7.800000000000001" rx="1" fill="#E9ECF5" stroke="#2B2F4A" stroke-width="2" /><rect x="253.60000000000002" y="98.8" width="10.4" height="49.4" rx="2" fill="#E9ECF5" stroke="#2B2F4A" stroke-width="2" /><rect x="274.40000000000003" y="98.8" width="10.4" height="49.4" rx="2" fill="#E9ECF5" stroke="#2B2F4A" stroke-width="2" /><rect x="295.2" y="98.8" width="10.4" height="49.4" rx="2" fill="#E9ECF5" stroke="#2B2F4A" stroke-width="2" /><rect x="316.0" y="98.8" width="10.4" height="49.4" rx="2" fill="#E9ECF5" stroke="#2B2F4A" stroke-width="2" /><rect x="240.6" y="148.2" width="98.8" height="10.4" rx="2" fill="#E9ECF5" stroke="#2B2F4A" stroke-width="2" /><text x="290" y="186" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Parliament enacts a law</text><g class="pulse"><polygon points="205.0,58.0 207.9,66.0 216.4,66.3 209.8,71.5 212.1,79.7 205.0,75.0 197.9,79.7 200.2,71.5 193.6,66.3 202.1,66.0" fill="#FFD166" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" /></g><line x1="188" y1="110" x2="231.0" y2="110.0" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 4" class="flow"/><polygon points="240.0,110.0 231.0,115.0 231.0,105.0" fill="#FF8A1F" stroke="#FF8A1F" stroke-width="1" stroke-linejoin="round" /><text x="200" y="218" font-size="13" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >National Consumers' Day</text></svg>