<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A coaching institute and a fee note of 61,020 rupees paid as a lump sum for two years</title><style>text{font-family:sans-serif}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.flow{animation:flow 1.6s linear infinite}
.slide{animation:slide 3s ease-in-out infinite}
.grow{animation:grow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.puff{animation:puff 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes flow{to{stroke-dashoffset:-24}}
@keyframes slide{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
@keyframes grow{0%{transform:scaleX(.25)}60%,100%{transform:scaleX(1)}}
@keyframes puff{0%{transform:translateY(0) scale(.6);opacity:.9}100%{transform:translateY(-26px) scale(1.3);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="40" y="60" width="130" height="110" rx="6" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" /><polygon points="30.0,62.0 105.0,28.0 180.0,62.0" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><rect x="88" y="118" width="34" height="52" rx="3" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><rect x="54" y="82" width="26" height="24" rx="3" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><rect x="130" y="82" width="26" height="24" rx="3" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><text x="105" y="196" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Coaching institute</text><line x1="176" y1="110" x2="241.0" y2="110.0" stroke="#3FA34D" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 4" class="flow"/><polygon points="250.0,110.0 241.0,115.0 241.0,105.0" fill="#3FA34D" stroke="#3FA34D" stroke-width="1" stroke-linejoin="round" /><text x="215" y="98" font-size="11" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Fee paid</text><rect x="256" y="70" width="120" height="90" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><text x="316" y="98" font-size="20" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >₹61,020</text><text x="316" y="120" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >for 2 years</text><text x="316" y="142" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >in one lump sum</text></svg>