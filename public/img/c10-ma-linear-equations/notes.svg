<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A fifty rupee note and a hundred rupee note</title>
<style>.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.s{font-size:11px}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g transform="rotate(-6 95 60)"><rect x="40" y="30" width="110" height="60" rx="6" fill="#BFD7F2" stroke="#2B2F4A" stroke-width="3" /><circle cx="95" cy="60" r="18" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><text x="95" y="67" font-size="16" text-anchor="middle" >₹50</text></g><g transform="rotate(5 305 60)"><rect x="250" y="30" width="110" height="60" rx="6" fill="#9BE3A6" stroke="#2B2F4A" stroke-width="3" /><circle cx="305" cy="60" r="18" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><text x="305" y="67" font-size="16" text-anchor="middle" >₹100</text></g><text x="200" y="68" font-size="30" text-anchor="middle" class="h" >+</text><rect x="60" y="120" width="280" height="90" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><text x="200" y="150" font-size="15" text-anchor="middle" class="h" >x notes of ₹50</text><text x="200" y="174" font-size="15" text-anchor="middle" class="h" >+ y notes of ₹100</text><text x="200" y="198" font-size="12" text-anchor="middle" fill="#8A8FB0" class="h" >withdrawn from the bank</text></svg>
