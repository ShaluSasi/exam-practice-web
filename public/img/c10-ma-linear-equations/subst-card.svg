<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Equation x plus 2y equals 7 rewritten for x and substituted into 5x minus 4y equals 7</title>
<style>.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.s{font-size:11px}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.pl{animation:pl 2.6s ease-in-out infinite alternate}@keyframes pl{from{transform:translate(0,-60px)}60%,to{transform:translate(0,0)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="20" y="20" width="360" height="56" rx="10" fill="#fff" stroke="#0B93D4" stroke-width="3" /><text x="200" y="54" font-size="18" text-anchor="middle" class="h" >x + 2y = 7   →   x = 7 − 2y</text><polygon points="0,0 -14.4,-7.2 -14.4,7.2" fill="#FF8A1F" transform="translate(200 104) rotate(90.0)"/><line x1="200" y1="80" x2="200" y2="96" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round" class="pu"/><rect x="20" y="116" width="360" height="56" rx="10" fill="#fff" stroke="#FF8A1F" stroke-width="3" /><text x="138" y="152" font-size="18" text-anchor="end" class="h" >5(</text><text x="240" y="152" font-size="18" text-anchor="start" class="h" >) − 4y = 7</text><g class="pl"><rect x="142" y="130" width="94" height="28" rx="6" fill="#CFE9FA" stroke="#0B93D4" stroke-width="2" /><text x="189" y="150" font-size="14" text-anchor="middle" class="h" >7 − 2y</text></g><text x="200" y="205" font-size="13" text-anchor="middle" class="h" >Put the expression for x</text><text x="200" y="223" font-size="13" text-anchor="middle" class="h" >in place of x in the other equation</text></svg>
