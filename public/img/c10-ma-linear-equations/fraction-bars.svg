<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A fraction becoming 3 over 5 after adding 1 and 2 over 3 after adding 3</title>
<style>.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.s{font-size:11px}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="110" y="40" font-size="20" text-anchor="middle" class="h" >x / y</text><text x="210" y="40" font-size="13" text-anchor="start" class="h" >is the fraction</text><line x1="130" y1="52" x2="130" y2="88" stroke="#7C5CFF" stroke-width="3" stroke-linecap="round" class="pu"/><polygon points="0,0 -11.700000000000001,-5.8500000000000005 -11.700000000000001,5.8500000000000005" fill="#7C5CFF" transform="translate(130 94) rotate(90.0)"/><text x="142" y="76" font-size="13" text-anchor="start" fill="#7C5CFF" class="h" >+1 to both</text><rect x="100" y="100" width="40" height="26" rx="2" fill="#FFB86B" stroke="#2B2F4A" stroke-width="2" /><rect x="140" y="100" width="40" height="26" rx="2" fill="#FFB86B" stroke="#2B2F4A" stroke-width="2" /><rect x="180" y="100" width="40" height="26" rx="2" fill="#FFB86B" stroke="#2B2F4A" stroke-width="2" /><rect x="220" y="100" width="40" height="26" rx="2" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><rect x="260" y="100" width="40" height="26" rx="2" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><text x="92" y="118" font-size="14" text-anchor="end" class="h" >3 / 5</text><line x1="130" y1="134" x2="130" y2="160" stroke="#7C5CFF" stroke-width="3" stroke-linecap="round" class="pu"/><polygon points="0,0 -11.700000000000001,-5.8500000000000005 -11.700000000000001,5.8500000000000005" fill="#7C5CFF" transform="translate(130 166) rotate(90.0)"/><text x="142" y="152" font-size="13" text-anchor="start" fill="#7C5CFF" class="h" >+3 to both</text><rect x="100" y="170" width="40" height="26" rx="2" fill="#9BE3A6" stroke="#2B2F4A" stroke-width="2" /><rect x="140" y="170" width="40" height="26" rx="2" fill="#9BE3A6" stroke="#2B2F4A" stroke-width="2" /><rect x="180" y="170" width="40" height="26" rx="2" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><text x="92" y="188" font-size="14" text-anchor="end" class="h" >2 / 3</text></svg>
