<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A balance with 2x plus y on one pan and 7 on the other</title>
<style>.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.s{font-size:11px}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.bal{transform-origin:200px 70px;animation:bl 4s ease-in-out infinite}@keyframes bl{25%{transform:rotate(3deg)}75%{transform:rotate(-3deg)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<line x1="200" y1="60" x2="200" y2="200" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round" /><rect x="150" y="200" width="100" height="14" rx="4" fill="#2B2F4A" /><g class="bal"><line x1="70" y1="70" x2="330" y2="70" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round" /><line x1="70" y1="70" x2="40" y2="130" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="70" y1="70" x2="100" y2="130" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><polygon points="30,130 110,130 100,146 40,146" fill="#CFE9FA" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><line x1="330" y1="70" x2="300" y2="130" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="330" y1="70" x2="360" y2="130" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><polygon points="290,130 370,130 360,146 300,146" fill="#FFD9A8" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><text x="70" y="118" font-size="14" text-anchor="middle" class="h" >2x + y</text><text x="330" y="118" font-size="16" text-anchor="middle" class="h" >7</text></g><circle cx="200" cy="60" r="8" fill="#FF8A1F" /><text x="200" y="20" font-size="14" text-anchor="middle" class="h" >Both sides stay balanced</text><text x="200" y="234" font-size="12" text-anchor="middle" class="h" >if you do the same to each side</text></svg>
