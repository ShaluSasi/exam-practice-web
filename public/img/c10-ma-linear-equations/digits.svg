<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Digit tiles x and y of a two-digit number swapped when the number is reversed</title>
<style>.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.s{font-size:11px}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.sw{animation:pu 2s ease-in-out infinite}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="150" y="22" font-size="12" text-anchor="start" class="h" >ten's</text><text x="210" y="22" font-size="12" text-anchor="start" class="h" >unit's</text><text x="20" y="66" font-size="13" text-anchor="start" class="h" >number</text><rect x="150" y="30" width="56" height="56" rx="8" fill="#FFF3CF" stroke="#FF8A1F" stroke-width="3" /><text x="178" y="70" font-size="28" text-anchor="middle" class="h" >x</text><rect x="210" y="30" width="56" height="56" rx="8" fill="#CFE9FA" stroke="#0B93D4" stroke-width="3" /><text x="238" y="70" font-size="28" text-anchor="middle" class="h" >y</text><text x="20" y="156" font-size="13" text-anchor="start" class="h" >reversed</text><rect x="150" y="120" width="56" height="56" rx="8" fill="#FFF3CF" stroke="#FF8A1F" stroke-width="3" /><text x="178" y="160" font-size="28" text-anchor="middle" class="h" >y</text><rect x="210" y="120" width="56" height="56" rx="8" fill="#CFE9FA" stroke="#0B93D4" stroke-width="3" /><text x="238" y="160" font-size="28" text-anchor="middle" class="h" >x</text><g class="sw"><line x1="178" y1="92" x2="238" y2="118" stroke="#7C5CFF" stroke-width="3" stroke-linecap="round" /><polygon points="0,0 -9,-4.5 -9,4.5" fill="#7C5CFF" transform="translate(238 118) rotate(27.0)"/></g><text x="330" y="60" font-size="15" text-anchor="middle" class="h" >10x + y</text><text x="330" y="150" font-size="15" text-anchor="middle" class="h" >10y + x</text><text x="200" y="218" font-size="13" text-anchor="middle" class="h" >Reversing swaps the digit places</text></svg>
