<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Adding two equations so the y terms cancel</title>
<style>.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.s{font-size:11px}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="50" y="20" width="300" height="160" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><text x="150" y="56" font-size="22" text-anchor="end" class="h" >4x</text><text x="162" y="56" font-size="22" text-anchor="start" fill="#E5484D" class="h" >+ 3y</text><text x="240" y="56" font-size="22" text-anchor="start" class="h" >= 17</text><text x="150" y="98" font-size="22" text-anchor="end" class="h" >3x</text><text x="162" y="98" font-size="22" text-anchor="start" fill="#E5484D" class="h" >− 3y</text><text x="240" y="98" font-size="22" text-anchor="start" class="h" >= 4</text><line x1="90" y1="112" x2="310" y2="112" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="150" y="150" font-size="22" text-anchor="end" fill="#3FA34D" class="h" >7x</text><text x="162" y="150" font-size="22" text-anchor="start" fill="#E5484D" class="h" >+ 0y</text><text x="240" y="150" font-size="22" text-anchor="start" fill="#3FA34D" class="h" >= 21</text><text x="62" y="150" font-size="12" text-anchor="start" fill="#8A8FB0" class="h" >add</text><text x="200" y="210" font-size="14" text-anchor="middle" class="h" >the y-terms cancel</text></svg>
