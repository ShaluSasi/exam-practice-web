<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A row of twelve day boxes where the first two carry a fixed charge</title>
<style>.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.s{font-size:11px}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.dd{animation:pu 3s ease-in-out infinite}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="26" font-size="14" text-anchor="middle" class="h" >Library book: charge by the day</text><rect x="12" y="50" width="28" height="40" rx="5" fill="#FFD9A8" stroke="#2B2F4A" stroke-width="2" /><text x="26" y="76" font-size="13" text-anchor="middle" class="h" >1</text><rect x="43" y="50" width="28" height="40" rx="5" fill="#FFD9A8" stroke="#2B2F4A" stroke-width="2" /><text x="57" y="76" font-size="13" text-anchor="middle" class="h" >2</text><rect x="74" y="50" width="28" height="40" rx="5" fill="#CFE9FA" stroke="#2B2F4A" stroke-width="2" class="dd" style="animation-delay:0.5s"/><text x="88" y="76" font-size="13" text-anchor="middle" class="h" >3</text><rect x="105" y="50" width="28" height="40" rx="5" fill="#CFE9FA" stroke="#2B2F4A" stroke-width="2" class="dd" style="animation-delay:0.75s"/><text x="119" y="76" font-size="13" text-anchor="middle" class="h" >4</text><rect x="136" y="50" width="28" height="40" rx="5" fill="#CFE9FA" stroke="#2B2F4A" stroke-width="2" class="dd" style="animation-delay:1.0s"/><text x="150" y="76" font-size="13" text-anchor="middle" class="h" >5</text><rect x="167" y="50" width="28" height="40" rx="5" fill="#CFE9FA" stroke="#2B2F4A" stroke-width="2" class="dd" style="animation-delay:1.25s"/><text x="181" y="76" font-size="13" text-anchor="middle" class="h" >6</text><rect x="198" y="50" width="28" height="40" rx="5" fill="#CFE9FA" stroke="#2B2F4A" stroke-width="2" class="dd" style="animation-delay:1.5s"/><text x="212" y="76" font-size="13" text-anchor="middle" class="h" >7</text><rect x="229" y="50" width="28" height="40" rx="5" fill="#CFE9FA" stroke="#2B2F4A" stroke-width="2" class="dd" style="animation-delay:1.75s"/><text x="243" y="76" font-size="13" text-anchor="middle" class="h" >8</text><rect x="260" y="50" width="28" height="40" rx="5" fill="#CFE9FA" stroke="#2B2F4A" stroke-width="2" class="dd" style="animation-delay:2.0s"/><text x="274" y="76" font-size="13" text-anchor="middle" class="h" >9</text><rect x="291" y="50" width="28" height="40" rx="5" fill="#CFE9FA" stroke="#2B2F4A" stroke-width="2" class="dd" style="animation-delay:2.25s"/><text x="305" y="76" font-size="13" text-anchor="middle" class="h" >10</text><rect x="322" y="50" width="28" height="40" rx="5" fill="#CFE9FA" stroke="#2B2F4A" stroke-width="2" class="dd" style="animation-delay:2.5s"/><text x="336" y="76" font-size="13" text-anchor="middle" class="h" >11</text><rect x="353" y="50" width="28" height="40" rx="5" fill="#CFE9FA" stroke="#2B2F4A" stroke-width="2" class="dd" style="animation-delay:2.75s"/><text x="367" y="76" font-size="13" text-anchor="middle" class="h" >12</text><line x1="14" y1="104" x2="70" y2="104" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round" /><text x="42" y="124" font-size="12" text-anchor="middle" fill="#C25E00" class="h" >fixed</text><text x="42" y="140" font-size="12" text-anchor="middle" fill="#C25E00" class="h" >charge</text><line x1="76" y1="104" x2="386" y2="104" stroke="#0B93D4" stroke-width="4" stroke-linecap="round" /><text x="230" y="124" font-size="12" text-anchor="middle" fill="#0B93D4" class="h" >extra charge for each further day</text><rect x="60" y="160" width="280" height="50" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><text x="200" y="182" font-size="14" text-anchor="middle" class="h" >total = fixed + (days − 2) × extra</text><text x="200" y="200" font-size="12" text-anchor="middle" fill="#8A8FB0" class="h" >(for more than 2 days)</text></svg>
