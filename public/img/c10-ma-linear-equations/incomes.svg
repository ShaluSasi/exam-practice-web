<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Two bars showing spending plus an equal saving for two people</title>
<style>.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.s{font-size:11px}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="24" font-size="14" text-anchor="middle" class="h" >Income = spending + saving</text><text x="60" y="70" font-size="13" text-anchor="end" class="h" >Person 1</text><rect x="70" y="50" width="231.4" height="30" rx="4" fill="#BFD7F2" stroke="#2B2F4A" stroke-width="2.5" /><rect x="301.4" y="50" width="38.6" height="30" rx="4" fill="#9BE3A6" stroke="#2B2F4A" stroke-width="2.5" class="pu"/><text x="185.7" y="70" font-size="12" text-anchor="middle" class="h" >spends</text><text x="320.7" y="96" font-size="12" text-anchor="middle" fill="#3FA34D" class="h" >saves</text><text x="60" y="140" font-size="13" text-anchor="end" class="h" >Person 2</text><rect x="70" y="120" width="154.3" height="30" rx="4" fill="#BFD7F2" stroke="#2B2F4A" stroke-width="2.5" /><rect x="224.3" y="120" width="38.6" height="30" rx="4" fill="#9BE3A6" stroke="#2B2F4A" stroke-width="2.5" class="pu"/><text x="147.1" y="140" font-size="12" text-anchor="middle" class="h" >spends</text><text x="243.6" y="166" font-size="12" text-anchor="middle" fill="#3FA34D" class="h" >saves</text><text x="200" y="200" font-size="13" text-anchor="middle" class="h" >Both save the same amount each month</text></svg>
