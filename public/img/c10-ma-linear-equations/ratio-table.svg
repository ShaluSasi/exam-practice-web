<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Table of coefficient ratios for two lines</title>
<style>.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.s{font-size:11px}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="12" y="20" width="376" height="200" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><text x="74" y="46" font-size="14" text-anchor="middle" class="h" >pair</text><text x="170" y="46" font-size="14" text-anchor="middle" class="h" >a₁ / a₂</text><text x="255" y="46" font-size="14" text-anchor="middle" class="h" >b₁ / b₂</text><text x="340" y="46" font-size="14" text-anchor="middle" class="h" >c₁ / c₂</text><line x1="12" y1="58" x2="388" y2="58" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="74" y="100" font-size="12" text-anchor="middle" class="h" >9x − 6y + 15 = 0</text><text x="74" y="120" font-size="12" text-anchor="middle" class="h" >3x − 2y + 7 = 0</text><text x="170" y="112" font-size="16" text-anchor="middle" class="h" >9 / 3</text><text x="255" y="112" font-size="16" text-anchor="middle" class="h" >−6 / −2</text><text x="340" y="112" font-size="16" text-anchor="middle" class="h" >15 / 7</text><line x1="12" y1="150" x2="388" y2="150" stroke="#E6DFCF" stroke-width="1.5" stroke-linecap="round" /><text x="200" y="182" font-size="14" text-anchor="middle" class="h" >Compare the three ratios,</text><text x="200" y="202" font-size="14" text-anchor="middle" class="h" >then decide what the lines do.</text><circle cx="170" cy="108" r="26" fill="none" stroke="#FF8A1F" stroke-width="2.5" class="pu"/><circle cx="255" cy="108" r="30" fill="none" stroke="#FF8A1F" stroke-width="2.5" class="pu"/></svg>
