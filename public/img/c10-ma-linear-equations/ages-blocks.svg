<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Father is five son-blocks old 3 years ago and three son-blocks old 7 years from now</title>
<style>.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.s{font-size:11px}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="26" font-size="14" text-anchor="middle" class="h" >Same two people at two moments</text><text x="20" y="52" font-size="13" text-anchor="start" class="h" >3 years ago</text><text x="70" y="75" font-size="12" text-anchor="end" class="h" >father</text><rect x="80" y="60" width="36" height="22" rx="4" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" /><rect x="120" y="60" width="36" height="22" rx="4" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" /><rect x="160" y="60" width="36" height="22" rx="4" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" /><rect x="200" y="60" width="36" height="22" rx="4" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" /><rect x="240" y="60" width="36" height="22" rx="4" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" /><text x="70" y="105" font-size="12" text-anchor="end" class="h" >son</text><rect x="80" y="90" width="36" height="22" rx="4" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" /><line x1="20" y1="128" x2="380" y2="128" stroke="#8A8FB0" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 6" /><text x="20" y="150" font-size="13" text-anchor="start" class="h" >7 years from now</text><text x="70" y="173" font-size="12" text-anchor="end" class="h" >father</text><rect x="80" y="158" width="36" height="22" rx="4" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" /><rect x="120" y="158" width="36" height="22" rx="4" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" /><rect x="160" y="158" width="36" height="22" rx="4" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" /><text x="70" y="203" font-size="12" text-anchor="end" class="h" >son</text><rect x="80" y="188" width="36" height="22" rx="4" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" /><text x="330" y="100" font-size="13" text-anchor="middle" fill="#7C5CFF" class="h" >+10 years</text><polygon points="0,0 -10.799999999999999,-5.3999999999999995 -10.799999999999999,5.3999999999999995" fill="#7C5CFF" transform="translate(375 108) rotate(90.0)"/><line x1="37