<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Three ways two lines can sit: meeting at a point, coinciding, or parallel</title>
<style>.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.s{font-size:11px}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="10" y="20" width="116" height="150" rx="8" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><line x1="18" y1="95" x2="118" y2="95" stroke="#C9C3B3" stroke-width="1.5" stroke-linecap="round" /><line x1="68" y1="28" x2="68" y2="162" stroke="#C9C3B3" stroke-width="1.5" stroke-linecap="round" /><line x1="24" y1="150" x2="114" y2="42" stroke="#0B93D4" stroke-width="4" stroke-linecap="round" /><line x1="24" y1="50" x2="114" y2="140" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round" /><circle cx="69" cy="96" r="9" fill="none" stroke="#3FA34D" stroke-width="3" class="pu"/><text x="68" y="192" font-size="12" text-anchor="middle" class="h" >Lines meet</text><text x="68" y="210" font-size="12" text-anchor="middle" fill="#8A8FB0" class="h" >one solution</text><rect x="142" y="20" width="116" height="150" rx="8" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><line x1="150" y1="95" x2="250" y2="95" stroke="#C9C3B3" stroke-width="1.5" stroke-linecap="round" /><line x1="200" y1="28" x2="200" y2="162" stroke="#C9C3B3" stroke-width="1.5" stroke-linecap="round" /><line x1="156" y1="140" x2="246" y2="50" stroke="#FF8A1F" stroke-width="7" stroke-linecap="round" /><line x1="156" y1="140" x2="246" y2="50" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 6" /><text x="200" y="192" font-size="12" text-anchor="middle" class="h" >Lines coincide</text><text x="200" y="210" font-size="12" text-anchor="middle" fill="#8A8FB0" class="h" >infinitely many</text><rect x="274" y="20" width="116" height="150" rx="8" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><line x1="282" y1="95" x2="382" y2="95" stroke="#C9C3B3" stroke-width="1.5" stroke-linecap="round" /><line x1="332" y1="28" x2="332" y2="162" stroke="#C9C3B3" stroke-width="1.5" stroke-linecap="round" /><line x1="288" y1="120" x2="378" y2="50" stroke="#0B93D4" stroke-width="4" stroke-linecap="round" /><line x1="288" y1="150" x2="378" y2="80" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round" /><text x="332" y="192" font-size="12" text-anchor="middle" class="h" >Lines are parallel</text><text x="332" y="210" font-size="12" text-anchor="middle" fill="#8A8FB0" class="h" >no solution</text></svg>
