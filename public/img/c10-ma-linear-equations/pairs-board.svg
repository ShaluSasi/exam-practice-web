<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Five labelled slots for pairs of equations</title>
<style>.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.s{font-size:11px}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="26" font-size="14" text-anchor="middle" class="h" >Five pairs of equations</text><rect x="30" y="40" width="340" height="30" rx="8" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><text x="48" y="60" font-size="15" text-anchor="start" fill="#FF8A1F" class="h" >A</text><text x="200" y="60" font-size="15" text-anchor="middle" fill="#8A8FB0" class="h" >. . .</text><rect x="30" y="78" width="340" height="30" rx="8" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><text x="48" y="98" font-size="15" text-anchor="start" fill="#FF8A1F" class="h" >B</text><text x="200" y="98" font-size="15" text-anchor="middle" fill="#8A8FB0" class="h" >. . .</text><rect x="30" y="116" width="340" height="30" rx="8" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><text x="48" y="136" font-size="15" text-anchor="start" fill="#FF8A1F" class="h" >C</text><text x="200" y="136" font-size="15" text-anchor="middle" fill="#8A8FB0" class="h" >. . .</text><rect x="30" y="154" width="340" height="30" rx="8" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><text x="48" y="174" font-size="15" text-anchor="start" fill="#FF8A1F" class="h" >D</text><text x="200" y="174" font-size="15" text-anchor="middle" fill="#8A8FB0" class="h" >. . .</text><rect x="30" y="192" width="340" height="30" rx="8" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><text x="48" y="212" font-size="15" text-anchor="start" fill="#FF8A1F" class="h" >E</text><text x="200" y="212" font-size="15" text-anchor="middle" fill="#8A8FB0" class="h" >. . .</text><text x="200" y="236" font-size="12" text-anchor="middle" fill="#8A8FB0" class="h" >Decide what each pair of lines does</text></svg>
