<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A piece x equals 9 minus y plugged into another equation</title>
<style>.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.s{font-size:11px}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.pl2{animation:pl2 2.8s ease-in-out infinite alternate}@keyframes pl2{from{transform:translate(0,-40px)}60%,to{transform:translate(0,0)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="30" font-size="14" text-anchor="middle" class="h" >Two equations, two unknowns</text><rect x="30" y="44" width="150" height="50" rx="10" fill="#fff" stroke="#0B93D4" stroke-width="3" /><text x="105" y="76" font-size="18" text-anchor="middle" class="h" >x + y = 9</text><rect x="220" y="44" width="150" height="50" rx="10" fill="#fff" stroke="#FF8A1F" stroke-width="3" /><text x="295" y="76" font-size="18" text-anchor="middle" class="h" >2x − y = 3</text><text x="200" y="130" font-size="30" text-anchor="middle" fill="#FF8A1F" class="h" >⇩</text><rect x="60" y="150" width="280" height="56" rx="10" fill="#FFF3CF" stroke="#FF8A1F" stroke-width="3" /><text x="140" y="187" font-size="20" text-anchor="end" class="h" >2(</text><text x="240" y="187" font-size="20" text-anchor="start" class="h" >) − y = 3</text><g class="pl2"><rect x="144" y="164" width="92" height="28" rx="6" fill="#CFE9FA" stroke="#0B93D4" stroke-width="2" /><text x="190" y="184" font-size="14" text-anchor="middle" class="h" >9 − y</text></g></svg>
