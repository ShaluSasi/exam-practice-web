<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A sentence about two numbers turned into two equations</title>
<style>.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.s{font-size:11px}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<polygon points="20,30 190,30 190,96 60,96 40,116 46,96 20,96" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><text x="105" y="56" font-size="12" text-anchor="middle" class="h" >Sum of two numbers</text><text x="105" y="76" font-size="12" text-anchor="middle" class="h" >is 20; difference is 4</text><polygon points="0,0 -13.5,-6.75 -13.5,6.75" fill="#FF8A1F" transform="translate(215 66) rotate(0.0)"/><line x1="196" y1="66" x2="208" y2="66" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round" class="pu"/><rect x="225" y="30" width="160" height="66" rx="10" fill="#FFF3CF" stroke="#FF8A1F" stroke-width="3" /><text x="305" y="58" font-size="17" text-anchor="middle" class="h" >x + y = 20</text><text x="305" y="84" font-size="17" text-anchor="middle" class="h" >x − y = 4</text><text x="200" y="150" font-size="14" text-anchor="middle" class="h" >Name the unknowns,</text><text x="200" y="172" font-size="14" text-anchor="middle" class="h" >turn each sentence into an equation.</text><rect x="30" y="186" width="340" height="36" rx="8" fill="#fff" stroke="#8A8FB0" stroke-width="2" class="pu"/><text x="200" y="210" font-size="14" text-anchor="middle" class="h" >read → name → write → solve → check</text></svg>
