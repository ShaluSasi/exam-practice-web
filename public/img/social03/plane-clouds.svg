<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img">
<title>An aeroplane cruising in clear calm air high above a layer of storm clouds</title>
<style>
.pl{animation:fly 6s linear infinite}@keyframes fly{from{transform:translateX(-150px)}to{transform:translateX(330px)}}
.lt{animation:fl 2s steps(1) infinite}@keyframes fl{0%{opacity:1}20%{opacity:0}100%{opacity:0}}
.rn{animation:rn .9s linear infinite}@keyframes rn{from{transform:translateY(-6px);opacity:1}to{transform:translateY(8px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>

