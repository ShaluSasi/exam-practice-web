<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 250" role="img">
<title>A carbon footprint checklist with four ticked habits and their impact levels</title>
<style>
.fn{animation:fn 1s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes fn{to{transform:rotate(360deg)}}
.tk{stroke-dasharray:24;animation:tk 3s ease-in-out infinite}@keyframes tk{0%{stroke-dashoffset:24}40%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>

<rect x="14" y="14" width="352" height="222" rx="14" fill="#FFFFFF" stroke="#3FA34D" stroke-width="2.5"/>
<g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A"><text x="190" y="40" font-size="14" text-anchor="middle">My Carbon Footprint: my ticks</text>
<g transform="translate(40 72)" stroke="#2B2F4A" stroke-width="1.5"><path d="M-14 4V-2L-9 -8H8L14 -2V4Z" fill="#E5484D"/><circle cx="-8" cy="5" r="3.5" fill="#2B2F4A"/><circle cx="8" cy="5" r="3.5" fill="#2B2F4A"/></g><text x="64" y="76" font-size="12" >Private car, even for short trips</text><rect x="284" y="61" width="66" height="22" rx="8" fill="#FBD3D4"/><text x="317" y="76" font-size="12" text-anchor="middle">High</text><path class="tk" d="M262 72l5 5 9-10" fill="none" stroke="#3FA34D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(40 116)" stroke="#2B2F4A" stroke-width="1.5"><g class="fn"><path d="M0 0L-4 -12H4Z M0 0L12 4L8 10Z M0 0L-12 4L-8 10Z" fill="#A3A8CC"/></g><circle r="3" fill="#2B2F4A"/></g><text x="64" y="120" font-size="12" >Sometimes forget to switch off fans</text><rect x="284" y="105" width="66" height="22" rx="8" fill="#FCE7B5"/><text x="317" y="120" font-size="12" text-anchor="middle">Medium</text><path class="tk" d="M262 116l5 5 9-10" fill="none" stroke="#3FA34D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(40 160)" stroke="#2B2F4A" stroke-width="1.5"><path d="M-10 -8H10L7 10H-7Z" fill="#0B93D4"/><path d="M-10 -8Q0 -18 10 -8" fill="none"/></g><text x="64" y="164" font-size="12" >One bucket of water for a bath</text><rect x="284" y="149" width="66" height="22" rx="8" fill="#CFEBD2"/><text x="317" y="164" font-size="12" text-anchor="middle">Low</text><path class="tk" d="M262 160l5 5 9-10" fill="none" stroke="#3FA34D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(40 204)" stroke="#2B2F4A" stroke-width="1.5"><path d="M-3 -12H3V-8L6 -4V12H-6V-4L-3 -8Z" fill="#CDEBFA"/></g><text x="64" y="208" font-size="12" >Sometimes use plastic bottles</text><rect x="284" y="193" width="66" height="22" rx="8" fill="#FCE7B5"/><text x="317" y="208" font-size="12" text-anchor="middle">Medium</text><path class="tk" d="M262 204l5 5 9-10" fill="none" stroke="#3FA34D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
