<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 230" role="img">
<title>Two thermometers in a cold mountain town showing January and July temperatures</title>
<style>
.sf{animation:sf 3s linear infinite}@keyframes sf{from{transform:translateY(-10px);opacity:0}30%{opacity:1}to{transform:translateY(60px);opacity:0}}
.lv{animation:lv 3s ease-in-out infinite}@keyframes lv{0%,100%{opacity:1}50%{opacity:.75}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>

<rect width="320" height="230" rx="16" fill="#E3F2FD"/>
<path d="M0 170L60 80L110 140L170 60L240 150L280 100L320 150V214Q320 230 304 230H16Q0 230 0 214Z" fill="#C9B79A" stroke="#9A855F" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M60 80L48 98L58 94L64 102L72 96Z M170 60L156 80L166 76L172 84L182 76Z" fill="#FFFFFF" stroke="#9A855F" stroke-width="1.5" stroke-linejoin="round"/>
<g class="sf" fill="#FFFFFF" stroke="#9DB6CC" stroke-width="1.5"><path d="M30 40l5-5 5 5-5 5z"/><path d="M290 30l5-5 5 5-5 5z"/></g>
<path d="M40 150H260" stroke="#2B2F4A" stroke-width="1.5" stroke-dasharray="4 3"/>
<g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A"><text x="30" y="154" font-size="12" text-anchor="end">0</text></g>
<g stroke="#2B2F4A" stroke-width="2"><rect x="93" y="44" width="14" height="150" rx="7" fill="#FFFFFF"/><circle cx="100" cy="200" r="11" fill="#E5484D"/></g>
<rect class="lv" x="97" y="184" width="6" height="16" fill="#E5484D"/>
<g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A"><text x="100" y="226" font-size="13" text-anchor="middle">January</text><rect x="114" y="174" width="56" height="20" rx="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.5"/><text x="142" y="188" font-size="12" text-anchor="middle">−8.5 °C</text></g><g stroke="#2B2F4A" stroke-width="2"><rect x="193" y="44" width="14" height="150" rx="7" fill="#FFFFFF"/><circle cx="200" cy="200" r="11" fill="#E5484D"/></g>
<rect class="lv" x="197" y="81" width="6" height="119" fill="#E5484D"/>
<g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A"><text x="200" y="226" font-size="13" text-anchor="middle">July</text><rect x="214" y="71.2" width="56" height="20" rx="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.5"/><text x="242" y="85.2" font-size="12" text-anchor="middle">17.2 °C</text></g>
</svg>
