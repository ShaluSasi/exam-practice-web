<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" role="img">
<title>A pie chart of the gases in air with a magnified bar for the smallest slice</title>
<style>
.pie{animation:pp 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pp{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>

<g class="pie" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round">
<path d="M130 130L130.0 30.0A100 100 0 1 1 31.8 111.3Z" fill="#9FD3F2"/>
<path d="M130 130L31.8 111.3A100 100 0 0 1 123.7 30.2Z" fill="#F7B6B8"/>
<path d="M130 130L123.7 30.2A100 100 0 0 1 130.0 30.0Z" fill="#F6C453"/>
</g>
<path d="M126.4 26.1L258 40M128.2 26.0L258 222" fill="none" stroke="#2B2F4A" stroke-width="1.5" stroke-dasharray="4 3"/>
<g stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round">
<rect x="258" y="40" width="44" height="120" fill="#F6C453"/>
<rect x="258" y="160" width="44" height="30" fill="#B8E0B5"/>
<rect x="258" y="190" width="44" height="32" fill="#D7C6F0"/>
</g>
<g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A"><text x="280" y="244" font-size="12" text-anchor="middle">zoom</text></g>
</svg>
