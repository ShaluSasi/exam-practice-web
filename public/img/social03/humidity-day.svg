<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img">
<title>Wet clothes dripping on a line on a warm, sticky day while a child sweats</title>
<style>
.sun{animation:sp 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes sp{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}.dp{animation:dp 1.6s ease-in infinite}@keyframes dp{from{transform:translateY(0);opacity:1}to{transform:translateY(30px);opacity:0}}
.vp{animation:vp 2.5s ease-in-out infinite}@keyframes vp{0%{transform:translateY(6px);opacity:0}50%{opacity:.8}100%{transform:translateY(-14px);opacity:0}}
.sw{animation:dp 2s ease-in infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
