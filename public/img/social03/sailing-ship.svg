<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img">
<title>An old sailing ship on the sea with winds that blow one way and then the opposite way</title>
<style>
.wv{animation:wv 3s ease-in-out infinite alternate}@keyframes wv{from{transform:translateX(-6px)}to{transform:translateX(6px)}}.sh{animation:bob 3s ease-in-out infinite alternate}@keyframes bob{from{transform:translateY(0) rotate(-1deg)}to{transform:translateY(4px) rotate(1deg)}}
.s1{animation:s1 6s ease-in-out infinite}.s2{animation:s1 6s ease-in-out infinite 3s;opacity:0}@keyframes s1{0%,45%{opacity:1}55%,95%{opacity:0}100%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>

<defs><marker id="a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0B93D4"/></marker><marker id="b" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#FF8A1F"/></marker></defs>
<rect width="360" height="220" rx="16" fill="#E3F2FD"/>
