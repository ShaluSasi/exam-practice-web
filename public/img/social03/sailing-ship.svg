<path class="wv" d="M10 170q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity=".8"/><path class="wv" d="M20 196q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity=".8"/>
<g class="sh"><path d="M120 140H250L232 162H140Z" fill="#C8925A" stroke="#7A5230" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M185 140V50" stroke="#7A5230" stroke-width="4"/>
<path d="M150 58H220Q228 90 220 122H150Q158 90 150 58Z" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M185 50L205 56L185 62Z" fill="#E5484D"/></g>
<g class="s1" fill="none" stroke="#0B93D4" stroke-width="5" stroke-linecap="round" marker-end="url(#a)"><path d="M20 40H110M20 90H100"/></g>
<g class="s2" fill="none" stroke="#FF8A1F" stroke-width="5" stroke-linecap="round" marker-end="url(#b)"><path d="M340 40H250M340 90H260"/></g>
</svg>
