<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" role="img">
<title>Four small scenes showing the effects of winds of different strengths</title>
<style>
.sw{animation:sw 1.4s ease-in-out infinite alternate}@keyframes sw{from{transform:rotate(-6deg)}to{transform:rotate(8deg)}}
.um{animation:um 1s ease-in-out infinite alternate}@keyframes um{from{transform:translateX(0)}to{transform:translateX(4px)}}
.sm{animation:sm 3s ease-in-out infinite}@keyframes sm{0%,100%{opacity:.5}50%{opacity:1}}
.tl{animation:tl 2s linear infinite}.tl.d{animation-delay:1s}@keyframes tl{from{transform:translate(0,0) rotate(0)}to{transform:translate(30px,10px) rotate(90deg)}}
.gs{animation:sm 1s ease-in-out infinite}
.lv{animation:lv 2s ease-in-out infinite alternate}@keyframes lv{from{transform:translateX(-2px)}to{transform:translateX(3px)}}
.vn{animation:vn 3s ease-in-out infinite alternate}@keyframes vn{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g transform="translate(0 0)"><rect x="6" y="10" width="88" height="140" rx="12" fill="#E3F2FD" stroke="#A3A8CC" stroke-width="2"/><path d="M6 128H94V138Q94 150 82 150H18Q6 150 6 138Z" fill="#9BD08A"/><g class="sw" style="transform-origin:50px 128px"><path d="M50 128V70" stroke="#8A5F33" stroke-width="6" stroke-linecap="round"/><path d="M50 90L80 74M50 80L22 66" stroke="#8A5F33" stroke-width="4" stroke-linecap="round"/><circle cx="80" cy="70" r="11" fill="#7CC47F" stroke="#3FA34D" stroke-width="2"/><circle cx="24" cy="62" r="11" fill="#7CC47F" stroke="#3FA34D" stroke-width="2"/><circle cx="52" cy="60" r="16" fill="#7CC47F" stroke="#3FA34D" stroke-width="2"/></g>
<g class="um"><path d="M26 112Q30 98 40 104Q46 96 54 106" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><path d="M40 104V124" stroke="#2B2F4A" stroke-width="2"/></g></g><g transform="translate(100 0)"><rect x="6" y="10" width="88" height="140" rx="12" fill="#E3F2FD" stroke="#A3A8CC" stroke-width="2"/><path d="M6 128H94V138Q94 150 82 150H18Q6 150 6 138Z" fill="#9BD08A"/><path d="M30 128V96H52V128Z" fill="#F6E3C4" stroke="#2B2F4A" stroke-width="2"/><path d="M26 98L41 84L56 98Z" fill="#C8925A" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><path d="M48 90V78H54V94" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="2"/><g class="sm" fill="#C9CCDD"><circle cx="51" cy="68" r="5"/><circle cx="51" cy="52" r="6"/><circle cx="51" cy="34" r="7"/></g></g><g transform="translate(200 0)"><rect x="6" y="10" width="88" height="140" rx="12" fill="#E3F2FD" stroke="#A3A8CC" stroke-width="2"/><path d="M6 128H94V138Q94 150 82 150H18Q6 150 6 138Z" fill="#9BD08A"/><g transform="rotate(70 50 128)"><path d="M50 128V76" stroke="#8A5F33" stroke-width="6" stroke-linecap="round"/><circle cx="50" cy="66" r="18" fill="#7CC47F" stroke="#3FA34D" stroke-width="2"/></g><path d="M40 130q4-8 10-2q6-8 10 2" fill="none" stroke="#8A5F33" stroke-width="3" stroke-linecap="round"/>
<g class="tl"><rect x="20" y="40" width="16" height="10" rx="2" fill="#E5484D" stroke="#2B2F4A" stroke-width="1.5"/></g><g class="tl d"><rect x="56" y="30" width="14" height="9" rx="2" fill="#C8925A" stroke="#2B2F4A" stroke-width="1.5"/></g>
<g stroke="#6E7396" stroke-width="3" stroke-linecap="round" class="gs"><path d="M14 60H40M10 76H34"/></g></g><g transform="translate(300 0)"><rect x="6" y="10" width="88" height="140" rx="12" fill="#E3F2FD" stroke="#A3A8CC" stroke-width="2"/><path d="M6 128H94V138Q94 150 82 150H18Q6 150 6 138Z" fill="#9BD08A"/><path d="M30 128V74" stroke="#8A5F33" stroke-width="5" stroke-linecap="round"/><circle cx="30" cy="64" r="16" fill="#7CC47F" stroke="#3FA34D" stroke-width="2"/><g class="lv" fill="#3FA34D"><ellipse cx="44" cy="56" rx="5" ry="2.5"/><ellipse cx="18" cy="70" rx="5" ry="2.5"/></g>
<path d="M70 128V70" stroke="#2B2F4A" stroke-width="3"/><g class="vn" style="transform-origin:70px 70px"><path d="M58 70H84L88 66V74L84 70" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><path d="M58 64L64 70L58 76Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="1.5"/></g></g>
</svg>
