<g class="vp" fill="none" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" opacity=".6"><path d="M180 168q-5-6 0-12t0-12M220 168q-5-6 0-12t0-12M255 168q-5-6 0-12t0-12"/></g>
<g fill="none" stroke="#7C8BB0" stroke-width="6" stroke-linecap="round" marker-end="url(#a)"><path class="w" d="M40 136H300"/></g>
