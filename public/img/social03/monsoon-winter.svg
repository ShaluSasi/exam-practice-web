<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" role="img">
<title>A schematic cross-section in winter: a cold landmass, a stretch of sea and a coastal strip, with wind blowing across</title>
<style>
.w{stroke-dasharray:12 7;animation:w 1.2s linear infinite}@keyframes w{to{stroke-dashoffset:-38}}.wv{animation:wv 3s ease-in-out infinite alternate}@keyframes wv{from{transform:translateX(-6px)}to{transform:translateX(6px)}}.vp{animation:vp 2.5s ease-in-out infinite}@keyframes vp{0%{transform:translateY(6px);opacity:0}50%{opacity:.7}100%{transform:translateY(-10px);opacity:0}}
.sf{animation:sf 3s linear infinite}@keyframes sf{from{transform:translateY(-10px);opacity:0}30%{opacity:1}to{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>

<defs><marker id="a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7C8BB0"/></marker></defs>
<rect width="380" height="240" rx="16" fill="#E8EEF7"/>
