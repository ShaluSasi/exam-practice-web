<path d="M150 176H282V240H150Z" fill="#7CC4EE" stroke="#0B93D4" stroke-width="2.5"/>
<path class="wv" d="M160 200q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity=".8"/>
<path d="M276 166H380V224Q380 240 364 240H282V176Z" fill="#9BD08A" stroke="#3FA34D" stroke-width="2.5" stroke-linejoin="round"/>
<g transform="translate(330 168) scale(0.8)" stroke-linejoin="round" stroke-linecap="round"><path d="M0 0Q-4 -20 4 -40" fill="none" stroke="#8A5F33" stroke-width="5"/><g fill="#7CC47F" stroke="#3FA34D" stroke-width="2"><path d="M4 -40Q-14 -48 -24 -36Q-10 -42 4 -40Z"/><path d="M4 -40Q20 -50 32 -38Q16 -42 4 -40Z"/><path d="M4 -40Q2 -58 -10 -60Q2 -50 4 -40Z"/><path d="M4 -40Q16 -56 26 -54Q12 -50 4 -40Z"/></g></g>
<g stroke="#2B2F4A" stroke-width="2"><rect x="25" y="180" width="10" height="40" rx="5" fill="#FFFFFF"/><circle cx="30" cy="224" r="8" fill="#0B93D4"/><rect x="28" y="212" width="4" height="10" fill="#0B93D4" stroke="none"/></g>
