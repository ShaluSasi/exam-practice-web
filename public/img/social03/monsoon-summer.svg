<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" role="img">
<title>A schematic cross-section of sea and land in summer with moist wind blowing inland towards hills</title>
<style>
.sun{animation:sp 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes sp{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}.w{stroke-dasharray:12 7;animation:w 1.2s linear infinite}@keyframes w{to{stroke-dashoffset:-38}}.wv{animation:wv 3s ease-in-out infinite alternate}@keyframes wv{from{transform:translateX(-6px)}to{transform:translateX(6px)}}.rn{animation:rn .9s linear infinite}@keyframes rn{from{transform:translateY(-8px);opacity:1}to{transform:translateY(10px);opacity:0}}.vp{animation:vp 2.5s ease-in-out infinite}@keyframes vp{0%{transform:translateY(6px);opacity:0}50%{opacity:.7}100%{transform:translateY(-10px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>

