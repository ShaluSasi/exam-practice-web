<path d="M0 170H175V240H16Q0 240 0 224Z" fill="#7CC4EE" stroke="#0B93D4" stroke-width="2.5"/>
<path class="wv" d="M14 194q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity=".8"/>
<path d="M168 166H250L300 120L340 90L380 110V224Q380 240 364 240H175V172Z" fill="#9BD08A" stroke="#3FA34D" stroke-width="2.5" stroke-linejoin="round"/>
<g transform="translate(215 168) scale(0.8)" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"><path d="M-14 0V-18H14V0Z" fill="#F6E3C4"/><path d="M-18 -16L0 -32L18 -16Z" fill="#E5484D"/><path d="M-4 0V-10H4V0" fill="#C8925A"/></g><g transform="translate(250 166) scale(0.7)" stroke-linejoin="round"><path d="M-3 0V-18H3V0Z" fill="#C8925A" stroke="#8A5F33" stroke-width="2"/><circle cx="0" cy="-28" r="14" fill="#7CC47F" stroke="#3FA34D" stroke-width="2.5"/></g>
