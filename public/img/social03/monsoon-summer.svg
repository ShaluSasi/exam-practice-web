<g fill="none" stroke="#0B93D4" stroke-width="6" stroke-linecap="round" marker-end="url(#a)"><path class="w" d="M20 130H200Q250 120 290 90"/></g>
<g transform="translate(320 70) scale(0.8)"><path d="M-36 12Q-46 -4 -26 -8Q-22 -26 -2 -22Q10 -34 26 -20Q46 -20 40 0Q52 12 36 14Z" fill="#DDE3EE" stroke="#8C99B5" stroke-width="3.13" stroke-linejoin="round"/></g>
