<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img">
<title>A melting glacier, rising sea water near a house, factory smoke and a rising thermometer</title>
<style>
.dp{animation:dp 1.6s ease-in infinite}@keyframes dp{from{transform:translateY(0);opacity:1}to{transform:translateY(12px);opacity:0}}
.sl{animation:sl 4s ease-in-out infinite alternate}@keyframes sl{from{transform:translateY(4px)}to{transform:translateY(-8px)}}
.sm{animation:sm 3s ease-in-out infinite}@keyframes sm{0%,100%{opacity:.4}50%{opacity:1}}
.th{animation:th 4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom}@keyframes th{from{transform:scaleY(.4)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>

<rect width="360" height="240" rx="16" fill="#E3F2FD"/>
<g stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round">
<path d="M20 150L60 70L90 110L120 60L160 150Z" fill="#FFFFFF" stroke="#9DB6CC"/></g>
<g class="dp" fill="#0B93D4"><circle cx="70" cy="158" r="3"/><circle cx="110" cy="160" r="3"/></g>
<path d="M0 170H360V224Q360 240 344 240H16Q0 240 0 224Z" fill="#7CC4EE" stroke="#0B93D4" stroke-width="2.5"/>
<g class="sl"><path d="M0 176q15-6 30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0t30 0V190H0Z" fill="#5BB2E6"/></g>
<path d="M200 170V120H290V170" fill="#F6E3C4" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M190 122L245 90L300 122Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M236 170V146H254V170" fill="#C8925A" stroke="#2B2F4A" stroke-width="2"/>
<path d="M300 170V96H316V170" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="2"/>
<g class="sm" fill="#8C92B8"><circle cx="308" cy="84" r="8"/><circle cx="318" cy="66" r="10"/><circle cx="330" cy="44" r="12"/></g>
<g stroke="#2B2F4A" stroke-width="2"><rect x="176" y="30" width="14" height="80" rx="7" fill="#FFFFFF"/><circle cx="183" cy="116" r="11" fill="#E5484D"/></g>
<rect class="th" x="180" y="40" width="6" height="74" fill="#E5484D"/>
</svg>
