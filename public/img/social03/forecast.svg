<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img">
<title>A weather satellite, a radar dome, a weather balloon and a laptop showing a forecast</title>
<style>
.sun{animation:sp 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes sp{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}.sat{animation:fl 4s ease-in-out infinite alternate}@keyframes fl{from{transform:translate(0,0)}to{transform:translate(14px,6px)}}
.rd{animation:rd 2s linear infinite;transform-origin:130px 150px}@keyframes rd{0%{transform:rotate(-60deg)}50%{transform:rotate(60deg)}100%{transform:rotate(-60deg)}}
.bl{animation:bl 5s ease-in-out infinite alternate}@keyframes bl{from{transform:translateY(20px)}to{transform:translateY(-10px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>

<rect width="360" height="220" rx="16" fill="#E3F2FD"/>
<path d="M0 180H360V204Q360 220 344 220H16Q0 220 0 204Z" fill="#9BD08A"/>
<g class="sat"><g stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"><rect x="56" y="34" width="20" height="16" fill="#A3A8CC"/><rect x="26" y="36" width="26" height="12" fill="#0B93D4"/><rect x="80" y="36" width="26" height="12" fill="#0B93D4"/></g><path d="M66 50V58" stroke="#2B2F4A" stroke-width="2"/></g>
<g stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"><path d="M110 180V150H150V180Z" fill="#F6E3C4"/><path d="M104 150A26 26 0 0 1 156 150Z" fill="#FFFFFF"/></g>
<g class="rd"><path d="M130 150L130 126" stroke="#E5484D" stroke-width="3" stroke-linecap="round"/></g>
<g class="bl"><circle cx="210" cy="60" r="16" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2"/><path d="M210 76V100" stroke="#2B2F4A" stroke-width="1.5"/><rect x="204" y="100" width="12" height="9" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="1.5"/></g>
<g stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"><rect x="250" y="112" width="90" height="56" rx="6" fill="#2B2F4A"/><rect x="256" y="118" width="78" height="44" fill="#CDEBFA" stroke="none"/><path d="M240 168H350L344 178H246Z" fill="#A3A8CC"/></g>
<g class="sun"><g stroke="#E0A92E" stroke-width="3" stroke-linecap="round"><path d="M295.0 136.0L302.0 136.0"/><path d="M291.2 145.2L296.1 150.1"/><path d="M282.0 149.0L282.0 156.0"/><path d="M272.8 145.2L267.9 150.1"/><path d="M269.0 136.0L262.0 136.0"/><path d="M272.8 126.8L267.9 121.9"/><path d="M282.0 123.0L282.0 116.0"/><path d="M291.2 126.8L296.1 121.9"/></g><circle cx="282" cy="136" r="8" fill="#F6C453" stroke="#E0A92E" stroke-width="2.5"/></g><g transform="translate(306 146) scale(0.4)"><path d="M-36 12Q-46 -4 -26 -8Q-22 -26 -2 -22Q10 -34 26 -20Q46 -20 40 0Q52 12 36 14Z" fill="#FFFFFF" stroke="#9DB6CC" stroke-width="6.25" stroke-linejoin="round"/></g>
</svg>
