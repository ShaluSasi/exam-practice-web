<path d="M0 170H200V204Q200 220 184 220H16Q0 220 0 204Z" fill="#7CC4EE" stroke="#0B93D4" stroke-width="2.5"/>
<path class="wv" d="M12 190q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0q5 -5 10 0t10 0" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity=".8"/>
<path d="M194 168L250 110L300 140L330 118L360 140V204Q360 220 344 220H200Z" fill="#9BD08A" stroke="#3FA34D" stroke-width="2.5" stroke-linejoin="round"/>
<g class="vp" fill="none" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" opacity=".7"><path d="M60 160q-6-7 0-14t0-14t0-14M110 160q-6-7 0-14t0-14t0-14M160 160q-6-7 0-14t0-14t0-14"/></g>
<g class="cl"><g transform="translate(270 52) scale(1.2)"><path d="M-36 12Q-46 -4 -26 -8Q-22 -26 -2 -22Q10 -34 26 -20Q46 -20 40 0Q52 12 36 14Z" fill="#DDE3EE" stroke="#8C99B5" stroke-width="2.08" stroke-linejoin="round"/></g></g>
<g class="rn" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round"><path d="M248 74v8"/><path d="M262 82v8"/><path d="M276 74v8"/><path d="M290 82v8"/></g>
<g fill="none" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" marker-end="url(#a)"><path class="w" d="M150 70Q190 40 222 48"/></g>
</svg>
