<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img">
<title>Water vapour rising from the sea, a cloud forming over hills and drops falling</title>
<style>
.sun{animation:sp 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes sp{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}.w{stroke-dasharray:12 7;animation:w 1.2s linear infinite}@keyframes w{to{stroke-dashoffset:-38}}.wv{animation:wv 3s ease-in-out infinite alternate}@keyframes wv{from{transform:translateX(-6px)}to{transform:translateX(6px)}}.rn{animation:rn .9s linear infinite}@keyframes rn{from{transform:translateY(-8px);opacity:1}to{transform:translateY(10px);opacity:0}}.vp{animation:vp 3s ease-in-out infinite}@keyframes vp{0%{transform:translateY(8px);opacity:0}50%{opacity:.8}100%{transform:translateY(-20px);opacity:0}}
.cl{animation:cl 4s ease-in-out infinite alternate}@keyframes cl{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>

<defs><marker id="a" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0B93D4"/></marker></defs>
<rect width="360" height="220" rx="16" fill="#E3F2FD"/>
