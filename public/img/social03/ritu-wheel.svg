<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img">
<title>A wheel of six seasons, each slice with its own picture, and a pointer stepping round</title>
<style>
.sun{animation:sp 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes sp{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}.rn{animation:rn .9s linear infinite}@keyframes rn{from{transform:translateY(-8px);opacity:1}to{transform:translateY(10px);opacity:0}}.pt{animation:pt 6s steps(6) infinite}@keyframes pt{from{transform:rotate(30deg)}to{transform:rotate(390deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
