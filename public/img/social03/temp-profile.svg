<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img">
<title>A graph of air temperature against height through the atmosphere</title>
<style>

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>

<rect x="60" y="237.0" width="280" height="23.0" fill="#E3F2FD"/><rect x="60" y="164.2" width="280" height="72.8" fill="#D6E0F7"/><rect x="60" y="106.7" width="280" height="57.5" fill="#C3CAEB"/><rect x="60" y="30.0" width="280" height="76.7" fill="#ABB2DE"/>
<g stroke="#2B2F4A" stroke-width="1.2" stroke-dasharray="4 4" opacity=".55"><path d="M60 237.0H340M60 164.2H340M60 106.7H340"/></g>
<path d="M60 22V260H342" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/>
<path id="tl" d="M200.0 260.0L110.0 237.0L190.0 164.2L70.0 106.7L320.0 33.8" fill="none" stroke="#E5484D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle r="6" fill="#F6C453" stroke="#2B2F4A" stroke-width="2"><animateMotion dur="6s" repeatCount="indefinite" path="M200.0 260.0L110.0 237.0L190.0 164.2L70.0 106.7L320.0 33.8"/></circle>
<g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">
<text x="54" y="264" font-size="12" text-anchor="end">0</text><text x="54" y="241" font-size="12" text-anchor="end">12</text><text x="54" y="168.16666666666666" font-size="12" text-anchor="end">50</text><text x="54" y="110.66666666666666" font-size="12" text-anchor="end">80</text><text x="54" y="34" font-size="12" text-anchor="end">120</text>
<text x="200" y="290" font-size="12" text-anchor="middle">Temperature (colder ← → hotter)</text>
<text x="16" y="141" font-size="12" text-anchor="middle" transform="rotate(-90 16 141)">Height (km)</text>
</g>
</svg>
