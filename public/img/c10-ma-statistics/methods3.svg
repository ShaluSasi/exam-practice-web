<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
<title>Three rows of numbers shrinking: class marks, deviations d and step deviations u</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 4.5s ease-out infinite both}@keyframes grow{0%{transform:scaleY(0)}28%,100%{transform:scaleY(1)}}.tr{animation:tr 5s linear infinite both}@keyframes tr{0%{stroke-dasharray:1;stroke-dashoffset:1}60%{stroke-dasharray:1;stroke-dashoffset:0}61%,100%{stroke-dasharray:none;stroke-dashoffset:0}}.rw{animation:rw 5s ease-out infinite both}@keyframes rw{0%{opacity:.1}18%,100%{opacity:1}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.sh{animation:sh 4s ease-in-out infinite both}@keyframes sh{0%,10%{opacity:.35}40%,100%{opacity:1}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="20" y="59" font-size="13" text-anchor="start" fill="#0B93D4" >x</text><g class="sh" style="animation-delay:0.0s"><rect x="173" y="38" width="34" height="30" rx="6" fill="#FFFFFF" stroke="#0B93D4" stroke-width="2.5" /><text x="190" y="59" font-size="13" text-anchor="middle" >20</text></g><g class="sh" style="animation-delay:0.0s"><rect x="213" y="38" width="34" height="30" rx="6" fill="#FFFFFF" stroke="#0B93D4" stroke-width="2.5" /><text x="230" y="59" font-size="13" text-anchor="middle" >30</text></g><g class="sh" style="animation-delay:0.0s"><rect x="253" y="38" width="34" height="30" rx="6" fill="#FFFFFF" stroke="#0B93D4" stroke-width="2.5" /><text x="270" y="59" font-size="13" text-anchor="middle" >40</text></g><g class="sh" style="animation-delay:0.0s"><rect x="293" y="38" width="34" height="30" rx="6" fill="#FFFFFF" stroke="#0B93D4" stroke-width="2.5" /><text x="310" y="59" font-size="13" text-anchor="middle" >50</text></g><g class="sh" style="animation-delay:0.0s"><rect x="333" y="38" width="34" height="30" rx="6" fill="#FFFFFF" stroke="#0B93D4" stroke-width="2.5" /><text x="350" y="59" font-size="13" text-anchor="middle" >60</text></g><text x="20" y="119" font-size="13" text-anchor="start" fill="#3FA34D" >d = x − 40</text><g class="sh" style="animation-delay:0.5s"><rect x="173" y="98" width="34" height="30" rx="6" fill="#FFFFFF" stroke="#3FA34D" stroke-width="2.5" /><text x="190" y="119" font-size="13" text-anchor="middle" >-20</text></g><g class="sh" style="animation-delay:0.5s"><rect x="213" y="98" width="34" height="30" rx="6" fill="#FFFFFF" stroke="#3FA34D" stroke-width="2.5" /><text x="230" y="119" font-size="13" text-anchor="middle" >-10</text></g><g class="sh" style="animation-delay:0.5s"><rect x="253" y="98" width="34" height="30" rx="6" fill="#FFFFFF" stroke="#3FA34D" stroke-width="2.5" /><text x="270" y="119" font-size="13" text-anchor="middle" >0</text></g><g class="sh" style="animation-delay:0.5s"><rect x="293" y="98" width="34" height="30" rx="6" fill="#FFFFFF" stroke="#3FA34D" stroke-width="2.5" /><text x="310" y="119" font-size="13" text-anchor="middle" >10</text></g><g class="sh" style="animation-delay:0.5s"><rect x="333" y="98" width="34" height="30" rx="6" fill="#FFFFFF" stroke="#3FA34D" stroke-width="2.5" /><text x="350" y="119" font-size="13" text-anchor="middle" >20</text></g><text x="20" y="179" font-size="13" text-anchor="start" fill="#7C5CFF" >u = d ÷ 10</text><g class="sh" style="animation-delay:1.0s"><rect x="173" y="158" width="34" height="30" rx="6" fill="#FFFFFF" stroke="#7C5CFF" stroke-width="2.5" /><text x="190" y="179" font-size="13" text-anchor="middle" >-2</text></g><g class="sh" style="animation-delay:1.0s"><rect x="213" y="158" width="34" height="30" rx="6" fill="#FFFFFF" stroke="#7C5CFF" stroke-width="2.5" /><text x="230" y="179" font-size="13" text-anchor="middle" >-1</text></g><g class="sh" style="animation-delay:1.0s"><rect x="253" y="158" width="34" height="30" rx="6" fill="#FFFFFF" stroke="#7C5CFF" stroke-width="2.5" /><text x="270" y="179" font-size="13" text-anchor="middle" >0</text></g><g class="sh" style="animation-delay:1.0s"><rect x="293" y="158" width="34" height="30" rx="6" fill="#FFFFFF" stroke="#7C5CFF" stroke-width="2.5" /><text x="310" y="179" font-size="13" text-anchor="middle" >1</text></g><g class="sh" style="animation-delay:1.0s"><rect x="333" y="158" width="34" height="30" rx="6" fill="#FFFFFF" stroke="#7C5CFF" stroke-width="2.5" /><text x="350" y="179" font-size="13" text-anchor="middle" >2</text></g><text x="200" y="210" font-size="12" text-anchor="middle" >Smaller numbers make the products f × u easy</text></svg>
