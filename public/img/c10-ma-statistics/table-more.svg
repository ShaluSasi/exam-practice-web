<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 212" role="img">
<title>More than cumulative frequency table</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 4.5s ease-out infinite both}@keyframes grow{0%{transform:scaleY(0)}28%,100%{transform:scaleY(1)}}.tr{animation:tr 5s linear infinite both}@keyframes tr{0%{stroke-dasharray:1;stroke-dashoffset:1}60%{stroke-dasharray:1;stroke-dashoffset:0}61%,100%{stroke-dasharray:none;stroke-dashoffset:0}}.rw{animation:rw 5s ease-out infinite both}@keyframes rw{0%{opacity:.1}18%,100%{opacity:1}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="16" y="12" width="368" height="30" rx="6" fill="#2B2F4A" /><text x="108" y="32" font-size="12" text-anchor="middle" fill="#FFFFFF" >Marks</text><text x="292" y="32" font-size="12" text-anchor="middle" fill="#FFFFFF" >Students scoring this or more</text><g class="rw" style="animation-delay:0.00s"><rect x="16" y="42" width="368" height="26" rx="0" fill="#FFFFFF" stroke="#E6E8F2" stroke-width="1" /><text x="108" y="60" font-size="13" text-anchor="middle" >0 or more</text><text x="292" y="60" font-size="13" text-anchor="middle" >60</text></g><g class="rw" style="animation-delay:0.15s"><rect x="16" y="68" width="368" height="26" rx="0" fill="#E3F2FD" stroke="#E6E8F2" stroke-width="1" /><text x="108" y="86" font-size="13" text-anchor="middle" >10 or more</text><text x="292" y="86" font-size="13" text-anchor="middle" >54</text></g><g class="rw" style="animation-delay:0.30s"><rect x="16" y="94" width="368" height="26" rx="0" fill="#FFFFFF" stroke="#E6E8F2" stroke-width="1" /><text x="108" y="112" font-size="13" text-anchor="middle" >20 or more</text><text x="292" y="112" font-size="13" text-anchor="middle" >45</text></g><g class="rw" style="animation-delay:0.45s"><rect x="16" y="120" width="368" height="26" rx="0" fill="#E3F2FD" stroke="#E6E8F2" stroke-width="1" /><text x="108" y="138" font-size="13" text-anchor="middle" >30 or more</text><text x="292" y="138" font-size="13" text-anchor="middle" >32</text></g><g class="rw" style="animation-delay:0.60s"><rect x="16" y="146" width="368" height="26" rx="0" fill="#FFFFFF" stroke="#E6E8F2" stroke-width="1" /><text x="108" y="164" font-size="13" text-anchor="middle" >40 or more</text><text x="292" y="164" font-size="13" text-anchor="middle" >17</text></g><g class="rw" style="animation-delay:0.75s"><rect x="16" y="172" width="368" height="26" rx="0" fill="#E3F2FD" stroke="#E6E8F2" stroke-width="1" /><text x="108" y="190" font-size="13" text-anchor="middle" >50 or more</text><text x="292" y="190" font-size="13" text-anchor="middle" >7</text></g><line x1="16" y1="42" x2="16" y2="198" stroke="#E6E8F2" stroke-width="1" stroke-linecap="round" /></svg>
