<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
<title>Classes stacked in order with the median class orange</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 4.5s ease-out infinite both}@keyframes grow{0%{transform:scaleY(0)}28%,100%{transform:scaleY(1)}}.tr{animation:tr 5s linear infinite both}@keyframes tr{0%{stroke-dasharray:1;stroke-dashoffset:1}60%{stroke-dasharray:1;stroke-dashoffset:0}61%,100%{stroke-dasharray:none;stroke-dashoffset:0}}.rw{animation:rw 5s ease-out infinite both}@keyframes rw{0%{opacity:.1}18%,100%{opacity:1}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<line x1="120" y1="190" x2="120" y2="24" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="120" y1="190" x2="380" y2="190" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><rect x="150" y="130" width="90" height="60" rx="2" fill="#CDEAFB" stroke="#2B2F4A" stroke-width="2.5" class="bar"/><text x="300" y="164" font-size="13" text-anchor="middle" >classes before</text><rect x="150" y="92" width="90" height="38" rx="2" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" class="bar"/><text x="300" y="115" font-size="13" text-anchor="middle" >median class</text><rect x="150" y="42" width="90" height="50" rx="2" fill="#E6DCFF" stroke="#2B2F4A" stroke-width="2.5" class="bar"/><text x="300" y="71" font-size="13" text-anchor="middle" >classes after</text><line x1="150" y1="130" x2="150" y2="130" stroke="#2B2F4A" stroke-width="1" stroke-linecap="round" /><line x1="138" y1="130" x2="262" y2="130" stroke="#3FA34D" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 4" /><line x1="138" y1="92" x2="262" y2="92" stroke="#3FA34D" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 4" /><line x1="250" y1="130" x2="250" y2="92" stroke="#E5484D" stroke-width="3" stroke-linecap="round" /><polygon points="250,92 244,102 256,102" fill="#E5484D"/><polygon points="250,130 244,120 256,120" fill="#E5484D"/><text x="70" y="112" font-size="12" text-anchor="middle" >one class</text><text x="70" y="128" font-size="12" text-anchor="middle" >width</text><line x1="100" y1="130" x2="100" y2="92" stroke="#7C5CFF" stroke-width="2" stroke-linecap="round" /><text x="200" y="210" font-size="12" text-anchor="middle" >Stack of classes in order</text></svg>
