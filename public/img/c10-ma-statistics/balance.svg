<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
<title>Balance with three blocks marked median on one pan and one mode block and two mean blocks on the other</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 4.5s ease-out infinite both}@keyframes grow{0%{transform:scaleY(0)}28%,100%{transform:scaleY(1)}}.tr{animation:tr 5s linear infinite both}@keyframes tr{0%{stroke-dasharray:1;stroke-dashoffset:1}60%{stroke-dasharray:1;stroke-dashoffset:0}61%,100%{stroke-dasharray:none;stroke-dashoffset:0}}.rw{animation:rw 5s ease-out infinite both}@keyframes rw{0%{opacity:.1}18%,100%{opacity:1}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.tilt{transform-box:fill-box;transform-origin:50% 50%;animation:tilt 4s ease-in-out infinite}@keyframes tilt{0%,100%{transform:rotate(0)}25%{transform:rotate(-2.5deg)}75%{transform:rotate(2.5deg)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<polygon points="200,92 176,190 224,190" fill="#8A8FB0" stroke="#2B2F4A" stroke-width="3"/><rect x="150" y="190" width="100" height="12" rx="6" fill="#2B2F4A" /><g class="tilt"><line x1="40" y1="92" x2="360" y2="92" stroke="#2B2F4A" stroke-width="6" stroke-linecap="round" /><rect x="54" y="62" width="30" height="30" rx="4" fill="#CDEAFB" stroke="#2B2F4A" stroke-width="2.5" /><text x="69" y="82" font-size="12" text-anchor="middle" >Md</text><rect x="88" y="62" width="30" height="30" rx="4" fill="#CDEAFB" stroke="#2B2F4A" stroke-width="2.5" /><text x="103" y="82" font-size="12" text-anchor="middle" >Md</text><rect x="122" y="62" width="30" height="30" rx="4" fill="#CDEAFB" stroke="#2B2F4A" stroke-width="2.5" /><text x="137" y="82" font-size="12" text-anchor="middle" >Md</text><rect x="244" y="62" width="38" height="30" rx="4" fill="#FFE7C7" stroke="#2B2F4A" stroke-width="2.5" /><text x="263" y="82" font-size="12" text-anchor="middle" >Mode</text><rect x="290" y="62" width="30" height="30" rx="4" fill="#DDF3DF" stroke="#2B2F4A" stroke-width="2.5" /><text x="305" y="83" font-size="13" text-anchor="middle" >x̅</text><rect x="324" y="62" width="30" height="30" rx="4" fill="#DDF3DF" stroke="#2B2F4A" stroke-width="2.5" /><text x="339" y="83" font-size="13" text-anchor="middle" >x̅</text></g><text x="200" y="130" font-size="12" text-anchor="middle" ></text><text x="200" y="214" font-size="14" text-anchor="middle" >3 × median  =  mode + 2 × mean</text></svg>
