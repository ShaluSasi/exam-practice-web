<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img">
<title>Three measures of central tendency: mean as a balance, mode as the tallest bar, median as the middle</title>
<style>.rk{transform-box:fill-box;transform-origin:50% 100%;animation:rk 3s ease-in-out infinite}@keyframes rk{50%{transform:rotate(-3deg)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 4.5s ease-out infinite both}@keyframes grow{0%{transform:scaleY(0)}28%,100%{transform:scaleY(1)}}.tr{animation:tr 5s linear infinite both}@keyframes tr{0%{stroke-dasharray:1;stroke-dashoffset:1}60%{stroke-dasharray:1;stroke-dashoffset:0}61%,100%{stroke-dasharray:none;stroke-dashoffset:0}}.rw{animation:rw 5s ease-out infinite both}@keyframes rw{0%{opacity:.1}18%,100%{opacity:1}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="18" y="20" width="112" height="150" rx="12" fill="#FFFFFF" stroke="#0B93D4" stroke-width="3" /><text x="74" y="40" font-size="15" text-anchor="middle" fill="#0B93D4" >Mean</text><line x1="40" y1="130" x2="108" y2="130" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><polygon points="74,130 62,152 86,152" fill="#2B2F4A"/><g class="rk"><line x1="36" y1="112" x2="112" y2="112" stroke="#FF8A1F" stroke-width="5" stroke-linecap="round" /><circle cx="46" cy="102" r="8" fill="#0B93D4" /><circle cx="66" cy="102" r="8" fill="#0B93D4" /><circle cx="104" cy="100" r="8" fill="#0B93D4" /></g><rect x="144" y="20" width="112" height="150" rx="12" fill="#FFFFFF" stroke="#FF8A1F" stroke-width="3" /><text x="200" y="40" font-size="15" text-anchor="middle" fill="#FF8A1F" >Mode</text><rect x="154" y="130" width="18" height="30" rx="0" fill="#9AD4F0" stroke="#2B2F4A" stroke-width="2" class="bar" style="animation-delay:0.00s"/><rect x="174" y="98" width="18" height="62" rx="0" fill="#9AD4F0" stroke="#2B2F4A" stroke-width="2" class="bar" style="animation-delay:0.12s"/><rect x="194" y="66" width="18" height="94" rx="0" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" class="bar" style="animation-delay:0.24s"/><rect x="214" y="110" width="18" height="50" rx="0" fill="#9AD4F0" stroke="#2B2F4A" stroke-width="2" class="bar" style="animation-delay:0.36s"/><rect x="234" y="136" width="18" height="24" rx="0" fill="#9AD4F0" stroke="#2B2F4A" stroke-width="2" class="bar" style="animation-delay:0.48s"/><rect x="270" y="20" width="112" height="150" rx="12" fill="#FFFFFF" stroke="#3FA34D" stroke-width="3" /><text x="326" y="40" font-size="15" text-anchor="middle" fill="#3FA34D" >Median</text><circle cx="284" cy="120" r="6" fill="#B7E0BC" stroke="#2B2F4A" stroke-width="2" /><circle cx="300" cy="120" r="6" fill="#B7E0BC" stroke="#2B2F4A" stroke-width="2" /><circle cx="316" cy="120" r="6" fill="#B7E0BC" stroke="#2B2F4A" stroke-width="2" /><circle cx="332" cy="120" r="6" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" /><circle cx="348" cy="120" r="6" fill="#B7E0BC" stroke="#2B2F4A" stroke-width="2" /><circle cx="364" cy="120" r="6" fill="#B7E0BC" stroke="#2B2F4A" stroke-width="2" /><circle cx="380" cy="120" r="6" fill="#B7E0BC" stroke="#2B2F4A" stroke-width="2" /><line x1="332" y1="96" x2="332" y2="108" stroke="#3FA34D" stroke-width="3" stroke-linecap="round" /><polygon points="332,112 326,102 338,102" fill="#3FA34D"/><text x="200" y="190" font-size="12" text-anchor="middle" >Which formula belongs to which tool?</text></svg>
