<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" role="img">
<title>Four unequal class intervals from 12 to 76 side by side</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 4.5s ease-out infinite both}@keyframes grow{0%{transform:scaleY(0)}28%,100%{transform:scaleY(1)}}.tr{animation:tr 5s linear infinite both}@keyframes tr{0%{stroke-dasharray:1;stroke-dashoffset:1}60%{stroke-dasharray:1;stroke-dashoffset:0}61%,100%{stroke-dasharray:none;stroke-dashoffset:0}}.rw{animation:rw 5s ease-out infinite both}@keyframes rw{0%{opacity:.1}18%,100%{opacity:1}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="30" y="50" width="42.5" height="36" rx="4" fill="#CDEAFB" stroke="#2B2F4A" stroke-width="2.5" /><text x="51.2" y="74" font-size="13" text-anchor="middle" >12–20</text><rect x="72.5" y="50" width="85" height="36" rx="4" fill="#FFE7C7" stroke="#2B2F4A" stroke-width="2.5" /><text x="115" y="74" font-size="13" text-anchor="middle" >20–36</text><rect x="157.5" y="50" width="74.4" height="36" rx="4" fill="#DDF3DF" stroke="#2B2F4A" stroke-width="2.5" /><text x="194.7" y="74" font-size="13" text-anchor="middle" >36–50</text><rect x="231.9" y="50" width="138.1" height="36" rx="4" fill="#E6DCFF" stroke="#2B2F4A" stroke-width="2.5" /><text x="300.9" y="74" font-size="13" text-anchor="middle" >50–76</text><line x1="30" y1="86" x2="30" y2="98" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="30" y="116" font-size="12" text-anchor="middle" >12</text><line x1="72.5" y1="86" x2="72.5" y2="98" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="72.5" y="116" font-size="12" text-anchor="middle" >20</text><line x1="157.5" y1="86" x2="157.5" y2="98" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="157.5" y="116" font-size="12" text-anchor="middle" >36</text><line x1="231.9" y1="86" x2="231.9" y2="98" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="231.9" y="116" font-size="12" text-anchor="middle" >50</text><line x1="370" y1="86" x2="370" y2="98" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="370" y="116" font-size="12" text-anchor="middle" >76</text><text x="200" y="30" font-size="13" text-anchor="middle" >Class intervals</text></svg>
