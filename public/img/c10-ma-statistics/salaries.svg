<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Bar chart of monthly pay of six people, one of them much higher than the rest</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 4.5s ease-out infinite both}@keyframes grow{0%{transform:scaleY(0)}28%,100%{transform:scaleY(1)}}.tr{animation:tr 5s linear infinite both}@keyframes tr{0%{stroke-dasharray:1;stroke-dashoffset:1}60%{stroke-dasharray:1;stroke-dashoffset:0}61%,100%{stroke-dasharray:none;stroke-dashoffset:0}}.rw{animation:rw 5s ease-out infinite both}@keyframes rw{0%{opacity:.1}18%,100%{opacity:1}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<line x1="56" y1="190" x2="388" y2="190" stroke="#E6E8F2" stroke-width="1" stroke-linecap="round" /><text x="50" y="194" font-size="12" text-anchor="end" >0</text><line x1="56" y1="152.5" x2="388" y2="152.5" stroke="#E6E8F2" stroke-width="1" stroke-linecap="round" /><text x="50" y="156.5" font-size="12" text-anchor="end" >100</text><line x1="56" y1="115" x2="388" y2="115" stroke="#E6E8F2" stroke-width="1" stroke-linecap="round" /><text x="50" y="119" font-size="12" text-anchor="end" >200</text><line x1="56" y1="77.5" x2="388" y2="77.5" stroke="#E6E8F2" stroke-width="1" stroke-linecap="round" /><text x="50" y="81.5" font-size="12" text-anchor="end" >300</text><line x1="56" y1="40" x2="388" y2="40" stroke="#E6E8F2" stroke-width="1" stroke-linecap="round" /><text x="50" y="44" font-size="12" text-anchor="end" >400</text><line x1="56" y1="34" x2="56" y2="190" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="56" y1="190" x2="390" y2="190" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><rect x="70" y="183.2" width="38" height="6.8" rx="0" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" class="bar" style="animation-delay:0.00s"/><text x="89" y="178.2" font-size="12" text-anchor="middle" >18</text><text x="89" y="206" font-size="11" text-anchor="middle" >Clerk</text><rect x="122" y="182.5" width="38" height="7.5" rx="0" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" class="bar" style="animation-delay:0.15s"/><text x="141" y="177.5" font-size="12" text-anchor="middle" >20</text><text x="141" y="206" font-size="11" text-anchor="middle" >Peon</text><rect x="174" y="181.8" width="38" height="8.2" rx="0" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" class="bar" style="animation-delay:0.30s"/><text x="193" y="176.8" font-size="12" text-anchor="middle" >22</text><text x="193" y="206" font-size="11" text-anchor="middle" >Cook</text><rect x="226" y="182.9" width="38" height="7.1" rx="0" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" class="bar" style="animation-delay:0.45s"/><text x="245" y="177.9" font-size="12" text-anchor="middle" >19</text><text x="245" y="206" font-size="11" text-anchor="middle" >Driver</text><rect x="278" y="182.1" width="38" height="7.9" rx="0" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" class="bar" style="animation-delay:0.60s"/><text x="297" y="177.1" font-size="12" text-anchor="middle" >21</text><text x="297" y="206" font-size="11" text-anchor="middle" >Guard</text><rect x="330" y="40" width="38" height="150" rx="0" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" class="bar" style="animation-delay:0.75s"/><text x="349" y="35" font-size="12" text-anchor="middle" >400</text><text x="349" y="206" font-size="11" text-anchor="middle" >Owner</text><text x="222" y="230" font-size="12" text-anchor="middle" >Monthly pay (₹ thousand)</text></svg>
