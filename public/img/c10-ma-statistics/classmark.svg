<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img">
<title>A class interval from 45 to 65 with arrows from both ends meeting at the middle</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 4.5s ease-out infinite both}@keyframes grow{0%{transform:scaleY(0)}28%,100%{transform:scaleY(1)}}.tr{animation:tr 5s linear infinite both}@keyframes tr{0%{stroke-dasharray:1;stroke-dashoffset:1}60%{stroke-dasharray:1;stroke-dashoffset:0}61%,100%{stroke-dasharray:none;stroke-dashoffset:0}}.rw{animation:rw 5s ease-out infinite both}@keyframes rw{0%{opacity:.1}18%,100%{opacity:1}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.mv{animation:mv 3.5s ease-in-out infinite both}@keyframes mv{0%{transform:translateX(0)}45%,100%{transform:translateX(var(--d))}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="60" y="96" width="280" height="28" rx="6" fill="#CDEAFB" stroke="#2B2F4A" stroke-width="3" /><line x1="60" y1="86" x2="60" y2="134" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="340" y1="86" x2="340" y2="134" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="60" y="156" font-size="15" text-anchor="middle" >45</text><text x="340" y="156" font-size="15" text-anchor="middle" >65</text><text x="60" y="76" font-size="12" text-anchor="middle" >lower limit</text><text x="340" y="76" font-size="12" text-anchor="middle" >upper limit</text><g class="mv" style="--d:130px"><line x1="64" y1="110" x2="100" y2="110" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round" /><polygon points="0,0 -10,-6 -10,6" fill="#FF8A1F" transform="translate(112 110)"/></g><g class="mv" style="--d:-130px"><line x1="300" y1="110" x2="336" y2="110" stroke="#3FA34D" stroke-width="4" stroke-linecap="round" /><polygon points="0,0 10,-6 10,6" fill="#3FA34D" transform="translate(288 110)"/></g><circle cx="200" cy="110" r="9" fill="#7C5CFF" stroke="#FFF9EE" stroke-width="2" class="pu"/><text x="200" y="62" font-size="15" text-anchor="middle" fill="#7C5CFF" >class mark = ?</text><line x1="200" y1="68" x2="200" y2="100" stroke="#7C5CFF" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" /><text x="200" y="190" font-size="12" text-anchor="middle" >A class interval and its middle value</text></svg>
