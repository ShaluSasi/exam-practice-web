<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" role="img">
<title>Three situations: a TV screen for the most watched programme, two bars comparing schools, and a coin stack for incomes with one very big coin</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 4.5s ease-out infinite both}@keyframes grow{0%{transform:scaleY(0)}28%,100%{transform:scaleY(1)}}.tr{animation:tr 5s linear infinite both}@keyframes tr{0%{stroke-dasharray:1;stroke-dashoffset:1}60%{stroke-dasharray:1;stroke-dashoffset:0}61%,100%{stroke-dasharray:none;stroke-dashoffset:0}}.rw{animation:rw 5s ease-out infinite both}@keyframes rw{0%{opacity:.1}18%,100%{opacity:1}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="20" y="40" width="100" height="70" rx="8" fill="#CDEAFB" stroke="#2B2F4A" stroke-width="3" /><rect x="34" y="54" width="72" height="42" rx="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><line x1="52" y1="124" x2="102" y2="124" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="70" y="152" font-size="12" text-anchor="middle" >Programmes</text><text x="70" y="170" font-size="12" text-anchor="middle" >watched</text><rect x="42" y="66" width="16" height="26" rx="2" fill="#FF8A1F" class="bar" style="animation-delay:0.0s"/><rect x="64" y="74" width="16" height="18" rx="2" fill="#8A8FB0" class="bar" style="animation-delay:0.2s"/><rect x="86" y="78" width="16" height="14" rx="2" fill="#8A8FB0" class="bar" style="animation-delay:0.4s"/><rect x="160" y="70" width="28" height="60" rx="2" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" class="bar"/><rect x="200" y="54" width="28" height="76" rx="2" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" class="bar" style="animation-delay:.2s"/><line x1="150" y1="130" x2="240" y2="130" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="195" y="152" font-size="12" text-anchor="middle" >Two schools</text><text x="195" y="170" font-size="12" text-anchor="middle" >compared</text><ellipse cx="320" cy="120" rx="22" ry="7" fill="#FFD36B" stroke="#2B2F4A" stroke-width="2.5"/><ellipse cx="320" cy="110" rx="22" ry="7" fill="#FFD36B" stroke="#2B2F4A" stroke-width="2.5"/><ellipse cx="320" cy="100" rx="22" ry="7" fill="#FFD36B" stroke="#2B2F4A" stroke-width="2.5"/><ellipse cx="320" cy="90" rx="22" ry="7" fill="#FFD36B" stroke="#2B2F4A" stroke-width="2.5"/><ellipse cx="320" cy="80" rx="22" ry="7" fill="#FFD36B" stroke="#2B2F4A" stroke-width="2.5"/><ellipse cx="368" cy="50" rx="26" ry="9" fill="#FFD36B" stroke="#2B2F4A" stroke-width="2.5"/><ellipse cx="368" cy="62" rx="26" ry="9" fill="#FFD36B" stroke="#2B2F4A" stroke-width="2.5"/><ellipse cx="368" cy="74" rx="26" ry="9" fill="#FFD36B" stroke="#2B2F4A" stroke-width="2.5"/><text x="340" y="152" font-size="12" text-anchor="middle" >Incomes</text><text x="340" y="170" font-size="12" text-anchor="middle" >in a town</text></svg>
