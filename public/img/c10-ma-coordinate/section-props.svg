<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img"><title>Segment AB with P dividing it internally in the ratio m1 : m2</title><style>.t{font:600 13px system-ui,sans-serif;fill:#2B2F4A}.s{font:600 11px system-ui,sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}.flow{stroke-dasharray:7 6;animation:flow 1.4s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}.pu{animation:pu 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.35)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="57.0" y="20.0" width="286.0" height="156.0" rx="6" fill="#FFFFFF" opacity=".75"/><line x1="83.0" y1="137.0" x2="161.0" y2="111.0" stroke="#0B93D4" stroke-width="4" stroke-linecap="round"/><line x1="161.0" y1="111.0" x2="317.0" y2="59.0" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round"/><circle cx="83.0" cy="137.0" r="6" fill="#2B2F4A" stroke="#fff" stroke-width="1.5"/><circle cx="317.0" cy="59.0" r="6" fill="#2B2F4A" stroke="#fff" stroke-width="1.5"/><circle cx="161.0" cy="111.0" r="7" fill="#3FA34D" stroke="#fff" stroke-width="1.5" class="pu"/><text x="89.0" y="129.0" text-anchor="end" style="font:600 13px system-ui,sans-serif;fill:#2B2F4A">A(x₁, y₁)</text><text x="309.0" y="51.0" text-anchor="start" style="font:600 13px system-ui,sans-serif;fill:#2B2F4A">B(x₂, y₂)</text><text x="161.0" y="92.0" text-anchor="middle" style="font:600 13px system-ui,sans-serif;fill:#2B2F4A">P(x, y)</text><text x="122.0" y="150.0" text-anchor="middle" style="font:600 13px system-ui,sans-serif;fill:#0B93D4">m₁</text><text x="239.0" y="111.0" text-anchor="middle" style="font:600 13px system-ui,sans-serif;fill:#FF8A1F">m₂</text></svg>