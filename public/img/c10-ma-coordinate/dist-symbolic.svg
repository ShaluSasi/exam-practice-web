<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img"><title>Right triangle with legs x2 minus x1 and y2 minus y1</title><style>.t{font:600 13px system-ui,sans-serif;fill:#2B2F4A}.s{font:600 11px system-ui,sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}.flow{stroke-dasharray:7 6;animation:flow 1.4s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}.pu{animation:pu 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.35)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="83.0" y="20.0" width="234.0" height="156.0" rx="6" fill="#FFFFFF" opacity=".75"/><line x1="109.0" y1="150.0" x2="291.0" y2="150.0" stroke="#0B93D4" stroke-width="3.5" stroke-linecap="round"/><line x1="291.0" y1="150.0" x2="291.0" y2="46.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="109.0" y1="150.0" x2="291.0" y2="46.0" stroke="#3FA34D" stroke-width="3.5" stroke-linecap="round" class="flow"/><path d="M282.0 150.0 L282.0 141.0 L291.0 141.0" fill="none" stroke="#2B2F4A" stroke-width="2"/><circle cx="109.0" cy="150.0" r="5" fill="#2B2F4A" stroke="#fff" stroke-width="1.5"/><circle cx="291.0" cy="46.0" r="5" fill="#2B2F4A" stroke="#fff" stroke-width="1.5"/><circle cx="291.0" cy="150.0" r="5" fill="#2B2F4A" stroke="#fff" stroke-width="1.5"/><text x="113.0" y="142.0" text-anchor="end" style="font:600 13px system-ui,sans-serif;fill:#2B2F4A">P(x₁, y₁)</text><text x="291.0" y="37.0" text-anchor="middle" style="font:600 13px system-ui,sans-serif;fill:#2B2F4A">Q(x₂, y₂)</text><text x="200.0" y="168.0" text-anchor="middle" style="font:600 13px system-ui,sans-serif;fill:#0B93D4">x₂ − x₁</text><text x="301.0" y="103.0" text-anchor="start" style="font:600 13px system-ui,sans-serif;fill:#FF8A1F">y₂ − y₁</text><text x="184.0" y="