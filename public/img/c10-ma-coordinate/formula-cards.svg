<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img"><title>A segment PQ with its mid-point M and an internal division point R</title><style>.t{font:600 13px system-ui,sans-serif;fill:#2B2F4A}.s{font:600 11px system-ui,sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}.flow{stroke-dasharray:7 6;animation:flow 1.4s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}.pu{animation:pu 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.35)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="61.7" y="20.0" width="276.6" height="176.0" rx="6" fill="#FFFFFF" opacity=".75"/><line x1="86.9" y1="170.9" x2="313.1" y2="45.1" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round"/><circle cx="86.9" cy="170.9" r="6" fill="#0B93D4" stroke="#fff" stroke-width="1.5"/><circle cx="313.1" cy="45.1" r="6" fill="#FF8A1F" stroke="#fff" stroke-width="1.5"/><circle cx="200.0" cy="108.0" r="6" fill="#3FA34D" stroke="#fff" stroke-width="1.5" class="pu"/><circle cx="162.3" cy="129.0" r="6" fill="#7C5CFF" stroke="#fff" stroke-width="1.5" class="pu"/><text x="92.9" y="162.9" text-anchor="end" style="font:600 13px system-ui,sans-serif;fill:#2B2F4A">P(x₁, y₁)</text><text x="313.1" y="36.1" text-anchor="middle" style="font:600 13px system-ui,sans-serif;fill:#2B2F4A">Q(x₂, y₂)</text><text x="208.0" y="123.0" text-anchor="start" style="font:600 13px system-ui,sans-serif;fill:#2B2F4A">M</text><text x="170.3" y="144.0" text-anchor="start" style="font:600 13px system-ui,sans-serif;fill:#2B2F4A">R</text></svg>