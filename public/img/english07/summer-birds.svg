<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" role="img">
<title>Birds flying away from a branch into the open sky</title>
<style>
.L{fill:none;stroke-linecap:round;stroke-linejoin:round}.K{stroke:#2B2F4A}.o{stroke:#2B2F4A;stroke-width:2}
.fy{animation:fy 4s ease-in infinite}@keyframes fy{0%{transform:translate(0,0);opacity:1}100%{transform:translate(160px,-90px);opacity:0}}.f2{animation-delay:1.3s}.f3{animation-delay:2.6s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M16 0H344Q360 0 360 16V210H0V16Q0 0 16 0Z" fill="#E3F2FD"/>
<path d="M0 160Q80 150 150 160L200 152" stroke="#7A4E2A" stroke-width="8" fill="none" stroke-linecap="round"/><ellipse cx="80" cy="150" rx="18" ry="8" fill="#8CBF6A" stroke="#4F7F35" stroke-width="2"/><ellipse cx="150" cy="148" rx="14" ry="7" fill="#8CBF6A" stroke="#4F7F35" stroke-width="2"/>
<g class="fy"><g transform="translate(110 140) scale(1.4)"><g><path d="M-12 0Q-6 -8 0 0Q6 -8 12 0" fill="none" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><g class="fy f2"><g transform="translate(140 136) scale(1.3)"><g><path d="M-12 0Q-6 -8 0 0Q6 -8 12 0" fill="none" stroke="#0B93D4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><g class="fy f3"><g transform="translate(90 132) scale(1.2)"><g><path d="M-12 0Q-6 -8 0 0Q6 -8 12 0" fill="none" stroke="#E5484D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g></g></g>
</svg>
