<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" role="img">
<title>A letter that has been read, and a reply being written beside it</title>
<style>
.L{fill:none;stroke-linecap:round;stroke-linejoin:round}.K{stroke:#2B2F4A}.o{stroke:#2B2F4A;stroke-width:2}
.pn{stroke-dasharray:140;animation:pn 3.2s linear infinite}@keyframes pn{0%{stroke-dashoffset:140}80%,100%{stroke-dashoffset:0}}.qp{animation:qp 3.2s linear infinite}@keyframes qp{0%{transform:translateX(0)}80%,100%{transform:translateX(100px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="0" y="0" width="360" height="210" rx="16" fill="#F3E7D3"/>
