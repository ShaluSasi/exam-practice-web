<rect x="190" y="44" width="140" height="140" rx="4" fill="#FFF3C4" stroke="#2B2F4A" stroke-width="2"/><path d="M204 70H300M204 90H310" stroke="#7E84AE" stroke-width="3" stroke-linecap="round"/>
<path class="pn" d="M204 110q10 -8 20 0t20 0t20 0t20 0t20 0" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/>
<g class="qp"><path d="M206 108L224 76L230 80L212 112Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5"/><path d="M206 108l-2 6l6 -3z" fill="#2B2F4A"/></g>
</svg>
