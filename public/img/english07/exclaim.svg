<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 190" role="img">
<title>Three cards for stanzas 4, 5 and 6, each with a big exclamation mark</title>
<style>
.L{fill:none;stroke-linecap:round;stroke-linejoin:round}.K{stroke:#2B2F4A}.o{stroke:#2B2F4A;stroke-width:2}
.ex{animation:ex 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@keyframes ex{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.15)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="0" y="0" width="360" height="190" rx="16" fill="#E8E6F4"/><rect x="30" y="28" width="92" height="134" rx="12" fill="#FFF3C4" stroke="#2B2F4A" stroke-width="2"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="76" y="52" font-size="13" text-anchor="middle">Stanza 4</text></g>
<g class="ex" style="animation-delay:0s"><rect x="68" y="66" width="16" height="56" rx="8" fill="#E5484D" stroke="#2B2F4A" stroke-width="2"/></g><circle cx="76" cy="140" r="9" fill="#E5484D" stroke="#2B2F4A" stroke-width="2"/><rect x="134" y="28" width="92" height="134" rx="12" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="180" y="52" font-size="13" text-anchor="middle">Stanza 5</text></g>
<g class="ex" style="animation-delay:0.4s"><rect x="172" y="66" width="16" height="56" rx="8" fill="#E5484D" stroke="#2B2F4A" stroke-width="2"/></g><circle cx="180" cy="140" r="9" fill="#E5484D" stroke="#2B2F4A" stroke-width="2"/><rect x="238" y="28" width="92" height="134" rx="12" fill="#F9D2D3" stroke="#2B2F4A" stroke-width="2"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="284" y="52" font-size="13" text-anchor="middle">Stanza 6</text></g>
<g class="ex" style="animation-delay:0.8s"><rect x="276" y="66" width="16" height="56" rx="8" fill="#E5484D" stroke="#2B2F4A" stroke-width="2"/></g><circle cx="284" cy="140" r="9" fill="#E5484D" stroke="#2B2F4A" stroke-width="2"/>
</svg>
