<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 190" role="img">
<title>A timeline arrow with an arc joining a past moment to now</title>
<style>
.L{fill:none;stroke-linecap:round;stroke-linejoin:round}.K{stroke:#2B2F4A}.o{stroke:#2B2F4A;stroke-width:2}
.arc{stroke-dasharray:260;animation:arc 3s ease-in-out infinite}@keyframes arc{0%{stroke-dashoffset:260}70%,100%{stroke-dashoffset:0}}.pz{animation:pz 2.4s ease-in-out infinite}@keyframes pz{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="0" y="0" width="380" height="190" rx="16" fill="#E3F2FD"/>
<path d="M30 130H350" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><path d="M350 130l-12 -7v14z" fill="#2B2F4A"/>
<circle cx="110" cy="130" r="8" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2"/><circle class="pz" cx="290" cy="130" r="12" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2"/>
<path class="arc" d="M110 120Q200 20 290 116" fill="none" stroke="#0B93D4" stroke-width="3.5" stroke-linecap="round"/>
<g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="110" y="164" font-size="14" text-anchor="middle">PAST</text><text x="290" y="164" font-size="14" text-anchor="middle">NOW</text></g>
<path d="M282 130l6 6l10 -12" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
