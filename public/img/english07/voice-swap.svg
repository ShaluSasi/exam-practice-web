<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 190" role="img">
<title>A person and a letter swapping places on either side of an arrow</title>
<style>
.L{fill:none;stroke-linecap:round;stroke-linejoin:round}.K{stroke:#2B2F4A}.o{stroke:#2B2F4A;stroke-width:2}
.sa{animation:sa 4s ease-in-out infinite}@keyframes sa{0%,30%{transform:translateX(0)}50%,80%{transform:translateX(200px)}100%{transform:translateX(0)}}.sb{animation:sb 4s ease-in-out infinite}@keyframes sb{0%,30%{transform:translateX(0)}50%,80%{transform:translateX(-200px)}100%{transform:translateX(0)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="0" y="0" width="360" height="190" rx="16" fill="#FFF3DC"/>
<rect x="40" y="60" width="80" height="80" rx="14" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" stroke-dasharray="6 4"/><rect x="240" y="60" width="80" height="80" rx="14" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" stroke-dasharray="6 4"/>
<path d="M136 100H224" stroke="#0B93D4" stroke-width="5" stroke-linecap="round"/><path d="M226 100l-14 -9v18z" fill="#0B93D4"/>
<g class="sa"><circle cx="80" cy="84" r="12" fill="#C68A5E" stroke="#2B2F4A" stroke-width="2"/><path d="M62 128Q62 100 80 100Q98 100 98 128Z" fill="#C9A86A" stroke="#2B2F4A" stroke-width="2"/></g>
<g class="sb"><path d="M255 84H305V116H255Z" fill="#FFF3C4" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><path d="M257 86L280 103L303 86" fill="none" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round"/><rect x="292" y="88" width="9" height="10" fill="#F6C453" stroke="#2B2F4A" stroke-width="1"/></g>
</svg>
