<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 312" role="img">
<title>A short handwritten message on a sheet, with numbered markers in the margin</title>
<style>
.L{fill:none;stroke-linecap:round;stroke-linejoin:round}.K{stroke:#2B2F4A}.o{stroke:#2B2F4A;stroke-width:2}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="18" y="16" width="364" height="282" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><path d="M58 28V286" stroke="#F3C9C9" stroke-width="2"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="70" y="50" font-size="15">12 March 20XX</text><text x="70" y="86" font-size="15">Dear Meena Aunty,</text><text x="70" y="122" font-size="15">We are deeply saddened by the loss</text><text x="70" y="142" font-size="15">of your father. Please accept our</text><text x="70" y="162" font-size="15">heartfelt condolences.</text><text x="70" y="198" font-size="15">We pray that you and the family find</text><text x="70" y="218" font-size="15">the strength to bear this loss.</text><text x="70" y="254" font-size="15">Yours affectionately,</text><text x="70" y="284" font-size="15">Riya (for Mummy and Papa)</text></g>
</svg>
