<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 269" role="img">
<title>Five sentence cards about the post, numbered 1 to 5</title>
<style>
.L{fill:none;stroke-linecap:round;stroke-linejoin:round}.K{stroke:#2B2F4A}.o{stroke:#2B2F4A;stroke-width:2}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="10" y="10" width="400" height="249" rx="12" fill="#FFFFFF" opacity=".55"/><circle cx="36" cy="34" r="12" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2"/><text x="36" y="38.5" font-size="13" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">1</text><rect x="56" y="17" width="348" height="34" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><text x="68" y="39" font-size="15" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">The villagers trust the postman.</text><circle cx="36" cy="81" r="12" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2"/><text x="36" y="85.5" font-size="13" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">2</text><rect x="56" y="64" width="348" height="34" rx="8" fill="#FFF3C4" stroke="#2B2F4A" stroke-width="2"/><text x="68" y="86" font-size="15" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">The bus was carrying the mail.</text><circle cx="36" cy="128" r="12" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2"/><text x="36" y="132.5" font-size="13" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">3</text><rect x="56" y="111" width="348" height="34" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><text x="68" y="133" font-size="15" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">The postman reads the letter aloud.</text><circle cx="36" cy="175" r="12" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2"/><text x="36" y="179.5" font-size="13" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">4</text><rect x="56" y="158" width="348" height="34" rx="8" fill="#FFF3C4" stroke="#2B2F4A" stroke-width="2"/><text x="68" y="180" font-size="15" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">The letters are sorted at the post office.</text><circle cx="36" cy="222" r="12" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2"/><text x="36" y="226.5" font-size="13" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">5</text><rect x="56" y="205" width="348" height="34" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><text x="68" y="227" font-size="15" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">The camels rested under the tree.</text>
</svg>
