<title>Six animal faces in a row: lion, tiger, leopard, bear, hyena and chameleon</title>
<style>.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-5px)}}.bob2{animation:bob2 3s ease-in-out infinite}@keyframes bob2{50%{transform:translateY(4px)}}.drift{animation:dr 6s ease-in-out infinite alternate}@keyframes dr{to{transform:translateX(16px)}}.wv{animation:wv 3s linear infinite}@keyframes wv{to{transform:translateX(-40px)}}.tw{animation:tw 1.6s ease-in-out infinite}@keyframes tw{50%{opacity:.25}}.spin{transform-box:fill-box;transform-origin:center;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.sweep{transform-box:fill-box;transform-origin:center;animation:spin 3s linear infinite}.flap{transform-box:fill-box;transform-origin:50% 100%;animation:fp .9s ease-in-out infinite}@keyframes fp{50%{transform:scaleY(.55)}}.prop{transform-box:fill-box;transform-origin:center;animation:pr .15s linear infinite}@keyframes pr{50%{transform:scaleY(.5)}}.flash{animation:fs 3s steps(1) infinite}@keyframes fs{0%,60%,64%,70%,100%{opacity:0}62%,66%{opacity:1}}.fall{animation:fa 2s ease-in infinite}@keyframes fa{to{transform:translateY(26px);opacity:0}}.rise{animation:ri 2.6s ease-out infinite}@keyframes ri{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-14px);opacity:0}}.blink{animation:tw 1.2s steps(1) infinite}.wave{transform-box:fill-box;transform-origin:20% 90%;animation:wa 1.2s ease-in-out infinite}@keyframes wa{50%{transform:rotate(-18deg)}}.sl{animation:sl 3s linear infinite}@keyframes sl{to{transform:translateX(30px)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
