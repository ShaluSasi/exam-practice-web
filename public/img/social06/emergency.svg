<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" role="img">
<title>A newspaper with blacked-out columns on one side and, after an arrow, a ballot box in front of a rising sun</title>
<style>
.slip{animation:drop 2.6s ease-in infinite}@keyframes drop{0%{transform:translateY(-12px);opacity:0}25%{opacity:1}75%{transform:translateY(10px);opacity:1}100%{transform:translateY(10px);opacity:0}}.sun{animation:rise 4s ease-in-out infinite}@keyframes rise{0%,100%{transform:translateY(4px)}50%{transform:translateY(-4px)}}.flow{stroke-dasharray:8 6;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-14}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="14" y="26" width="96" height="128" rx="4" fill="#FFF" stroke="#2B2F4A" stroke-width="2.5"/><rect x="22" y="34" width="80" height="14" fill="#A3A8CC"/><path d="M24 58h36M24 66h36M66 58h34M66 66h34" stroke="#A3A8CC" stroke-width="3"/><rect x="24" y="74" width="36" height="34" fill="#2B2F4A"/><rect x="66" y="74" width="34" height="18" fill="#2B2F4A"/><path d="M66 100h34M66 108h34M24 116h36M66 116h34" stroke="#A3A8CC" stroke-width="3"/><rect x="24" y="124" width="76" height="22" fill="#2B2F4A"/><path class="flow" d="M116 90H140" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round"/><path d="M138 82L150 90L138 98Z" fill="#FF8A1F"/><g class="sun"><circle cx="190" cy="100" r="30" fill="#FFD27A"/><circle cx="190" cy="100" r="20" fill="#F6C453" stroke="#E0A92E" stroke-width="2"/></g><rect x="150" y="128" width="84" height="40" rx="0" fill="#FFF9EE"/><path d="M0 154H240V164Q240 180 224 180H16Q0 180 0 164Z" fill="#D9C49A"/><rect x="158" y="116" width="64" height="38" rx="4" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="2.5"/><rect x="178" y="113" width="24" height="6" rx="2" fill="#2B2F4A"/><circle cx="190" cy="139" r="4" fill="#F6C453" stroke="#2B2F4A" stroke-width="1.5"/><g class="slip"><rect x="184" y="90" width="12" height="17" fill="#FFF" stroke="#2B2F4A" stroke-width="1.5"/><path d="M187 96h6M187 101h4" stroke="#A3A8CC" stroke-width="1.5"/></g>
