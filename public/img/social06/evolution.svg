<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img">
<title>A winding road climbing a hill past five blank milestones</title>
<style>
.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}.lane{animation:lane 2s linear infinite}@keyframes lane{to{stroke-dashoffset:-20}}.sun{animation:sun 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes sun{50%{transform:scale(1.12)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="0" y="0" width="400" height="200" rx="16" fill="#E3F2FD"/><path d="M0 150Q100 120 200 140T400 110V184Q400 200 384 200H16Q0 200 0 184Z" fill="#CFE8C0"/><circle class="sun" cx="350" cy="36" r="18" fill="#F6C453" stroke="#E0A92E" stroke-width="2.5"/><path d="M20 178L120 152L200 117L290 92L380 48" fill="none" stroke="#D9C49A" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path class="lane" d="M20 178L120 152L200 117L290 92L380 48" fill="none" stroke="#FFF" stroke-width="3" stroke-dasharray="10 10"/><path d="M41 152V130a9 9 0 0 1 18 0V152Z" fill="#FFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><rect x="41" y="136" width="18" height="6" fill="#8E7CC3"/><path d="M121 128V106a9 9 0 0 1 18 0V128Z" fill="#FFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><rect x="121" y="112" width="18" height="6" fill="#E5484D"/><path d="M201 94V72a9 9 0 0 1 18 0V94Z" fill="#FFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><rect x="201" y="78" width="18" height="6" fill="#3BB3A8"/><path d="M281 72V50a9 9 0 0 1 18 0V72Z" fill="#FFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><rect x="281" y="56" width="18" height="6" fill="#0B93D4"/><path d="M356 36V14a9 9 0 0 1 18 0V36Z" fill="#FFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><rect x="356" y="20" width="18" height="6" fill="#F6C453"/><g class="bob"><path d="M22.8 196Q22.8 178 30 178Q37.2 178 37.2 196Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><circle cx="30" cy="173.2" r="5.4" fill="#C68A5E" stroke="#2B2F4A" stroke-width="2"/><path d="M24.6 172.6A5.4 5.4 0 0 1 35.4 172.6Q30 170.2 24.6 172.6Z" fill="#2B2F4A"/></g>
</svg>
