<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img"><title>A 35 mm photograph enlarged to a 45 mm print</title><style>.gr{animation:gr 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}@keyframes gr{0%,100%{transform:scale(1)}50%{transform:scale(var(--k,1.3))}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><g class="gr" style="--k:1.2857"><rect x="40" y="80" width="91.0" height="60.666666666666664" rx="3" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" /><polygon points="49.1,134.6 80.95,98.2 112.8,134.6" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2"/><circle cx="110.98" cy="95.16666666666667" r="7.28" fill="#FFC83D"/></g><rect x="200" y="70" width="117.0" height="78.0" rx="3" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" /><polygon points="211.7,140.2 252.65,93.4 293.6,140.2" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2"/><circle cx="291.26" cy="89.5" r="9.36" fill="#FFC83D"/><text x="85.5" y="166.66666666666666" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle">35 mm film</text><text x="258.5" y="174.0" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle">45 mm print</text><text x="200" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#FF8A1F" text-anchor="middle">every length is enlarged in the ratio 35 : 45</text></svg>