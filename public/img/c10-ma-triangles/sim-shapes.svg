<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img"><title>Pairs of circles, squares and equilateral triangles: small and large of the same shape</title><style>.gr{animation:gr 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes gr{0%,100%{transform:scale(1)}50%{transform:scale(var(--k,1.3))}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><g class="gr" style="--k:1.875"><circle cx="52" cy="105" r="16" fill="#CFE9F7" stroke="#2B2F4A" stroke-width="3"/></g><circle cx="112" cy="95" r="30" fill="#CFE9F7" stroke="#2B2F4A" stroke-width="3"/><g class="gr" style="--k:1.875"><rect x="150" y="103" width="32" height="32" fill="#FFE2C4" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/></g><rect x="196" y="75" width="60" height="60" fill="#FFE2C4" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><g class="gr" style="--k:1.833"><polygon points="280,135 316,135 298.0,103.8" fill="#DDF3E0" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/></g><polygon points="326,135 392,135 359.0,77.8" fill="#DDF3E0" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><text x="82" y="175" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle">Circles</text><text x="203" y="175" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle">Squares</text><text x="330" y="175" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle">Equilateral triangles</text><text x="200" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#FF8A1F" text-anchor="middle">same shape, different size</text></svg>