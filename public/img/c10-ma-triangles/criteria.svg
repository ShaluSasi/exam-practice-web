<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Four ways to show triangles are similar: AA, SSS, SAS and RHS</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="100" y="22" font-family="sans-serif" font-size="16" font-weight="700" fill="#FF8A1F" text-anchor="middle">AA</text><polygon points="25.0,82.0 61.4,82.0 39.0,56.8" fill="#CFE9F7" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><polygon points="110.0,82.0 164.6,82.0 131.0,44.2" fill="#FFE2C4" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><text x="100" y="110" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">two angles equal</text><text x="300" y="22" font-family="sans-serif" font-size="16" font-weight="700" fill="#FF8A1F" text-anchor="middle">SSS</text><polygon points="225.0,82.0 261.4,82.0 239.0,56.8" fill="#CFE9F7" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><polygon points="310.0,82.0 364.6,82.0 331.0,44.2" fill="#FFE2C4" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><text x="300" y="110" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">three sides in proportion</text><text x="100" y="130" font-family="sans-serif" font-size="16" font-weight="700" fill="#FF8A1F" text-anchor="middle">SAS</text><polygon points="25.0,190.0 61.4,190.0 39.0,164.8" fill="#CFE9F7" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><polygon points="110.0,190.0 164.6,190.0 131.0,152.2" fill="#FFE2C4" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><text x="100" y="218" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">one angle equal, including</text><text x="100" y="231" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">sides proportional</text><text x="300" y="130" font-family="sans-serif" font-size="16" font-weight="700" fill="#FF8A1F" text-anchor="middle">RHS</text><polygon points="225.0,190.0 261.4,190.0 225.0,164.8" fill="#CFE9F7" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><polygon points="310.0,190.0 364.6,190.0 310.0,152.2" fill="#FFE2C4" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><text x="300" y="218" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">hypotenuse and one side</text><text x="300" y="231" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">proportional (right triangles)</text></svg>