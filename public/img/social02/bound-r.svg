<g class="b"><rect x="120" y="26" width="106" height="108" rx="6" fill="#D9B07A" stroke="#7A5230" stroke-width="2.5"/><path class="" d="M170 42V107H165L174 118L183 107H178V42Z" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/></g>
<path d="M120 26V134" stroke="#7A5230" stroke-width="3" stroke-dasharray="8 5"/>
</svg>
