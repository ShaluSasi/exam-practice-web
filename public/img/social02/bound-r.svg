<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img">
<title>Two blocks of the Earth's crust seen from above with arrows</title>
<style>
.a{animation:a 2.4s ease-in-out infinite alternate}@keyframes a{to{transform:translateY(-4px)}}
.b{animation:b 2.4s ease-in-out infinite alternate}@keyframes b{to{transform:translateY(4px)}}
.mg{animation:mg 1.6s ease-in-out infinite}@keyframes mg{0%,100%{opacity:.7}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
