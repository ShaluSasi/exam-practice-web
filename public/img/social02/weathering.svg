<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" role="img">
<title>Three rocks being broken down in three different ways</title>
<style>
.a{animation:a 2.6s ease-in-out infinite alternate}@keyframes a{to{transform:translateX(-3px)}}
.b{animation:b 2.6s ease-in-out infinite alternate}@keyframes b{to{transform:translateX(3px)}}
.dr{animation:dr 1.1s linear infinite}@keyframes dr{from{transform:translateY(0);opacity:1}to{transform:translateY(40px);opacity:0}}
.fz{animation:fz 1.6s ease-out infinite}@keyframes fz{from{transform:translateY(0);opacity:1}to{transform:translateY(-14px);opacity:0}}
.fk{animation:fk 2.4s ease-in infinite}@keyframes fk{0%,30%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(10px,34px) rotate(40deg);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
