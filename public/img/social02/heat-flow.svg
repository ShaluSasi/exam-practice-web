<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img">
<title>A bar chart of how much of the Earth's interior heat flow comes from each layer</title>
<style>
.h{animation:h 2.4s ease-in-out infinite}@keyframes h{0%{transform:translateY(0);opacity:0}40%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">
<text x="200" y="24" text-anchor="middle" font-size="13">Share of interior heat flow</text>
<path d="M60 240H385" stroke="#D8DCEA" stroke-width="1.2"/><text x="54" y="244" text-anchor="end" font-size="12">0</text><path d="M60 195H385" stroke="#D8DCEA" stroke-width="1.2"/><text x="54" y="199" text-anchor="end" font-size="12">10</text><path d="M60 150H385" stroke="#D8DCEA" stroke-width="1.2"/><text x="54" y="154" text-anchor="end" font-size="12">20</text><path d="M60 105H385" stroke="#D8DCEA" stroke-width="1.2"/><text x="54" y="109" text-anchor="end" font-size="12">30</text><path d="M60 60H385" stroke="#D8DCEA" stroke-width="1.2"/><text x="54" y="64" text-anchor="end" font-size="12">40</text><path d="M60 50V240H385" fill="none" stroke="#2B2F4A" stroke-width="2"/>
<text x="20" y="150" text-anchor="middle" font-size="12" transform="rotate(-90 20 150)">Share (%)</text>
<rect x="79" y="132" width="52" height="108" rx="4" fill="#C8925A" stroke="#7A5230" stroke-width="2.5"/><text x="105" y="125" text-anchor="middle" font-size="14">24%</text><text x="105" y="257" text-anchor="middle" font-size="12">Crust</text><rect x="159" y="141" width="52" height="99" rx="4" fill="#F6C987" stroke="#C9934A" stroke-width="2.5"/><text x="185" y="134" text-anchor="middle" font-size="14">22%</text><text x="185" y="257" text-anchor="middle" font-size="12">Upper</text><text x="185" y="271" text-anchor="middle" font-size="12">mantle</text><rect x="239" y="96" width="52" height="144" rx="4" fill="#F08C5A" stroke="#B85A2E" stroke-width="2.5"/><text x="265" y="89" text-anchor="middle" font-size="14">32%</text><text x="265" y="257" text-anchor="middle" font-size="12">Lower</text><text x="265" y="271" text-anchor="middle" font-size="12">mantle</text><rect x="319" y="141" width="52" height="99" rx="4" fill="#FF8A1F" stroke="#C8620E" stroke-width="2.5"/><text x="345" y="134" text-anchor="middle" font-size="14">22%</text><text x="345" y="257" text-anchor="middle" font-size="12">Core</text></g>
<g fill="none" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round"><path class="h" d="M366 70q-4 -6 0 -12q4 -6 0 -12"/><path class="h" style="animation-delay:1.2s" d="M376 70q-4 -6 0 -12q4 -6 0 -12"/></g>
</svg>
