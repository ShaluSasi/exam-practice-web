<g class="b"><rect x="122" y="26" width="104" height="108" rx="6" fill="#D9B07A" stroke="#7A5230" stroke-width="2.5"/><path class="" d="M204 76H155V71L144 80L155 89V84H204Z" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/></g>
<path d="M120 26L112 38L126 50L112 62L126 74L112 86L126 98L112 110L126 122L120 134" fill="none" stroke="#7A5230" stroke-width="3" stroke-linejoin="round"/>
