<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
<title>A cut-away of the Earth showing its layers from the surface to the centre</title>
<style>
.as{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}.ma{animation:spin 6s linear infinite reverse;transform-box:fill-box;transform-origin:center}.oc{animation:spin 4s linear infinite;transform-box:fill-box;transform-origin:center}
.ic{animation:glow 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes glow{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}@keyframes spin{to{transform:rotate(360deg)}}
.tw{animation:tw 2.5s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g class="tw" fill="#F6C453"><circle cx="34" cy="40" r="3"/><circle cx="370" cy="36" r="2.5"/><circle cx="360" cy="270" r="3"/><circle cx="40" cy="262" r="2.5"/></g>
<circle cx="200" cy="152" r="140" fill="#C8925A" stroke="#7A5230" stroke-width="2.5" />
<path d="M60 152A140 140 0 0 1 101 53" fill="none" stroke="#3FA34D" stroke-width="3.5"/><path d="M230 15A140 140 0 0 1 321 82" fill="none" stroke="#0B93D4" stroke-width="3.5"/>
<circle cx="200" cy="152" r="131" fill="#A88466" stroke="#7A5230" stroke-width="1.5" />
<circle cx="200" cy="152" r="122" fill="#F08C5A" stroke="#B85A2E" stroke-width="1.5" />
<circle cx="200" cy="152" r="116" fill="none" stroke="#FFC48A" stroke-width="4" class="as" stroke-dasharray="10 8"/>
<circle cx="200" cy="152" r="110" fill="#F6C987" stroke="#C9934A" stroke-width="1.5" />
<circle cx="200" cy="152" r="92" fill="none" stroke="#E9A65A" stroke-width="3" class="ma" stroke-dasharray="16 12" opacity=".8"/>
<circle cx="200" cy="152" r="74" fill="#FF8A1F" stroke="#C8620E" stroke-width="1.5" />
<circle cx="200" cy="152" r="58" fill="none" stroke="#FFB15C" stroke-width="4" class="oc" stroke-dasharray="12 10"/>
<circle cx="200" cy="152" r="42" fill="#FFD84D" stroke="#E5484D" stroke-width="3" class="ic"/>
<circle cx="188" cy="140" r="9" fill="#FFF3B0" opacity=".8"/>
</svg>
