<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 280" role="img">
<title>A mountain landscape with two rivers of ice joining and flowing down a valley</title>
<style>
.ch{animation:ch 2.4s ease-in-out infinite}@keyframes ch{0%,100%{opacity:.35}50%{opacity:1}}
.fl{stroke-dasharray:10 9;animation:fl 1.4s linear infinite}@keyframes fl{to{stroke-dashoffset:-38}}
.wf{stroke-dasharray:5 5;animation:wf .8s linear infinite}@keyframes wf{to{stroke-dashoffset:-20}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs><clipPath id="c"><rect width="420" height="280" rx="16"/></clipPath></defs>
<g clip-path="url(#c)">
<rect width="420" height="280" fill="#DCEFFC"/>
<!-- Mountains: rock with snowy tops -->
<path d="M0 170L30 74L80 34L120 26L160 46L205 18L250 42L300 18L350 36L392 72L420 112V280H0Z" fill="#8F95BC" stroke="#5D6288" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M0 170L30 74L52 92L38 130L44 176L20 214L0 224ZM420 112L392 72L372 100L392 134L380 176L420 210Z" fill="#7A80A8"/>
<path d="M30 74L80 34L120 26L160 46L142 58L118 44L92 56L66 62L46 86ZM250 42L300 18L350 36L392 72L368 66L340 56L312 42L274 58Z" fill="#FFFFFF" opacity=".9"/>
<!-- Valley floor beyond the glacier -->
<path d="M0 240Q100 222 160 234L270 234Q340 222 420 232V280H0Z" fill="#AEDB98"/>
<g fill="#3FA34D"><path d="M34 256l9-22l9 22Z"/><path d="M58 266l9-22l9 22Z"/><path d="M120 262l8-20l8 20Z"/><path d="M300 240l7-18l7 18Z"/></g>
<!-- Cirques: bowls scooped out at the head of each glacier -->
<path d="M66 72Q110 22 154 68Q112 118 66 72Z" fill="#5D6288"/>
<path d="M246 66Q295 14 344 62Q296 116 246 66Z" fill="#5D6288"/>
<!-- The two rivers of ice joining into one tongue -->
<path d="M72 74Q110 40 148 70Q156 112 214 148Q252 118 256 70Q295 36 338 64Q296 134 240 172Q244 200 242 222Q216 240 188 222L188 170Q110 148 72 74Z" fill="#F4FBFF" stroke="#8CC8E8" stroke-width="2"/>
<!-- Crevasses across the ice -->
<g fill="none" stroke="#A8D8F0" stroke-width="2" stroke-linecap="round"><path d="M96 92q10 6 22 4M118 118q12 6 24 2M152 140q10 8 22 8M290 88q12 2 22-6M268 118q12 4 22-4M246 146q8 4 16-2M196 190h14M224 190h12M196 210h14M224 208h12"/></g>
<!-- Which way the ice flows -->
<g class="ch" fill="none" stroke="#3B9BD0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M104 104l8 9l3-12"/><path d="M294 104l-8 9l-3-12"/></g>
<!-- Arete: the knife-edge ridge between the two cirques -->
<path d="M150 68L205 20L252 66" fill="none" stroke="#39395A" stroke-width="4" stroke-linejoin="miter"/>
<!-- Lateral moraines along the valley sides, medial where two join -->
<g fill="none" stroke-linecap="round">
<g stroke="#7A5A3E" stroke-width="7" opacity=".45"><path d="M72 74Q110 148 188 170L188 222"/><path d="M338 64Q296 134 240 172L242 222"/><path d="M214 150L216 232"/></g>
<g stroke="#5E4530" stroke-width="5" stroke-dasharray=".1 7"><path d="M72 74Q110 148 188 170L188 222"/><path d="M338 64Q296 134 240 172L242 222"/><path d="M214 150L216 232"/></g>
</g>
<!-- Terminal moraine: a heap of boulders curving round the end of the ice -->
<path d="M172 226Q214 266 258 226" fill="none" stroke="#8A6A4E" stroke-width="15" stroke-linecap="round"/>
<g fill="#5E4530" stroke="#3E2D1E" stroke-width="1"><circle cx="176" cy="232" r="4"/><circle cx="188" cy="241" r="4.5"/><circle cx="202" cy="247" r="3.5"/><circle cx="216" cy="249" r="5"/><circle cx="230" cy="245" r="4"/><circle cx="243" cy="238" r="4.5"/><circle cx="254" cy="229" r="3.5"/></g>
<!-- Meltwater stream and lake -->
<path d="M252 246Q292 268 334 262" fill="none" stroke="#7CC4EC" stroke-width="6" stroke-linecap="round"/>
<path class="fl" d="M252 246Q292 268 334 262" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
<ellipse cx="366" cy="261" rx="36" ry="11" fill="#7CC4EC" stroke="#3B9BD0" stroke-width="1.5"/>
<!-- Hanging valley: a small side valley left high up, with a waterfall dropping from it -->
<path d="M336 122Q352 110 372 122L374 142Q354 150 338 142Z" fill="#5D6288"/>
<path d="M342 126Q354 118 368 126L368 138Q354 144 344 138Z" fill="#F4FBFF" stroke="#8CC8E8" stroke-width="1.5"/>
<path d="M356 144Q354 180 350 226" fill="none" stroke="#7CC4EC" stroke-width="4"/>
<path class="wf" d="M356 144Q354 180 350 226" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
</g>
</svg>
