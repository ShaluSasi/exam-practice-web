<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" role="img">
<title>A wide landscape with mountains, a desert, a river plain with a town and a sea coast</title>
<style>
.fl{stroke-dasharray:10 8;animation:fl 1.6s linear infinite}@keyframes fl{to{stroke-dashoffset:-36}}
.sh{animation:sh 2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes sh{from{transform:rotate(-4deg)}to{transform:rotate(4deg) translateY(2px)}}
.cm{animation:cm 6s linear infinite alternate}@keyframes cm{to{transform:translateX(30px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
