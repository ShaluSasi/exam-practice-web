.dr{animation:dr 1s linear infinite}@keyframes dr{from{transform:translateY(0)}to{transform:translateY(16px)}}
.wd{stroke-dasharray:16 10;animation:wd 1.4s linear infinite}@keyframes wd{to{stroke-dashoffset:-52}}
