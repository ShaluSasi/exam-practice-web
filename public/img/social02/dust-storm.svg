<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A tall brown cloud of dust rolling over dry, cracked land</title>
<style>
.ds{animation:ds 4s ease-in-out infinite alternate}@keyframes ds{from{transform:translateX(-20px)}to{transform:translateX(20px)}}
.pt{animation:pt 1.5s linear infinite}@keyframes pt{from{transform:translateX(0);opacity:1}to{transform:translateX(50px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
