<path d="M-10 80C200 56 340 74 340 150C340 222 200 240 -10 222" fill="none" stroke="#7CC4EC" stroke-width="40"/>
<path class="fl" d="M-10 80C200 56 340 74 340 150C340 222 200 240 -10 222" fill="none" stroke="#FFFFFF" stroke-width="3"/>
<g transform="translate(50 40) scale(0.8)"><path d="M-3 0V-16H3V0Z" fill="#8A5A34"/><circle cy="-24" r="12" fill="#3FA34D" stroke="#2B7A37" stroke-width="2"/></g><g transform="translate(380 40) scale(0.8)"><path d="M-3 0V-16H3V0Z" fill="#8A5A34"/><circle cy="-24" r="12" fill="#3FA34D" stroke="#2B7A37" stroke-width="2"/></g><g transform="translate(60 160) scale(0.7)"><path d="M-3 0V-16H3V0Z" fill="#8A5A34"/><circle cy="-24" r="12" fill="#3FA34D" stroke="#2B7A37" stroke-width="2"/></g><g transform="translate(380 250) scale(0.7)"><path d="M-3 0V-16H3V0Z" fill="#8A5A34"/><circle cy="-24" r="12" fill="#3FA34D" stroke="#2B7A37" stroke-width="2"/></g></g>
