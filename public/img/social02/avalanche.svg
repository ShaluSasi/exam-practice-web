<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>A steep snowy mountain slope on a sunny day with a large mass of snow breaking away</title>
<style>
.sl{animation:sl 3.5s ease-in infinite}@keyframes sl{0%,15%{transform:translate(0,0);opacity:1}90%{transform:translate(120px,100px);opacity:.9}100%{transform:translate(130px,108px);opacity:0}}
.th{animation:th 3.5s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@keyframes th{0%{transform:scaleY(.4)}60%,100%{transform:scaleY(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
