<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" role="img">
<title>Five tiles showing the agents of gradation</title>
<style>
.fl{stroke-dasharray:10 8;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-36}}
.gl{stroke-dasharray:6 10;animation:fl 4s linear infinite}
.wv{animation:wv 1.8s ease-in-out infinite alternate}@keyframes wv{to{transform:translateX(-8px)}}
.dr{animation:dr 1.4s linear infinite}@keyframes dr{from{transform:translateY(0);opacity:1}to{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
