<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
<title>A globe centred on a large ocean with red dots near its edges</title>
<style>
.d{animation:p 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes p{0%,100%{transform:scale(.7);opacity:.6}50%{transform:scale(1.15);opacity:1}}
.gl{animation:gl 6s ease-in-out infinite alternate}@keyframes gl{to{transform:translateX(4px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<defs><clipPath id="g"><circle cx="200" cy="150" r="130"/></clipPath></defs>
<circle cx="200" cy="150" r="136" fill="#CDEBFA"/>
<circle cx="200" cy="150" r="130" fill="#7CC4EC" stroke="#0B93D4" stroke-width="3"/>
<g clip-path="url(#g)"><g class="gl">
<g fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity=".55"><ellipse cx="200" cy="150" rx="130" ry="34"/><ellipse cx="200" cy="150" rx="130" ry="80"/><ellipse cx="200" cy="150" rx="45" ry="130"/><ellipse cx="200" cy="150" rx="95" ry="130"/><path d="M70 150H330M200 20V280"/></g>
<g fill="#9BD08A" stroke="#3FA34D" stroke-width="2.5" stroke-linejoin="round">
<path d="M50 70Q100 36 140 58Q156 86 132 108Q120 138 96 128Q70 140 58 116Q44 92 50 70Z"/>
<path d="M88 204Q118 188 142 204Q148 230 122 238Q98 240 90 224Z"/>
