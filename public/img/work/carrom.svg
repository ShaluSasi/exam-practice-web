<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>A carrom shot: a striker, a white coin and a black coin lined up towards a pocket</title>
<style>
.s{animation:s 4s ease-out infinite}
.w{animation:w 4s ease-out infinite}
.b{animation:b 4s ease-out infinite}
@keyframes s{0%{transform:translate(0,0)}25%,100%{transform:translate(60px,-30px)}}
@keyframes w{0%,25%{transform:translate(0,0)}50%,100%{transform:translate(60px,-30px)}}
@keyframes b{0%,50%{transform:translate(0,0);opacity:1}80%{transform:translate(62px,-48px);opacity:1}90%,100%{transform:translate(62px,-48px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="40" y="10" width="320" height="240" rx="10" fill="#8A5A2B"/>
<rect x="56" y="26" width="288" height="208" rx="4" fill="#F3E2C3"/>
<g fill="#2B2F4A"><circle cx="70" cy="40" r="12"/><circle cx="330" cy="40" r="12"/><circle cx="70" cy="220" r="12"/><circle cx="330" cy="220" r="12"/></g>
<circle cx="200" cy="130" r="26" fill="none" stroke="#E5484D" stroke-width="2"/>
<path d="M90 200H310" stroke="#2B2F4A" stroke-width="1.5"/>
<g class="b"><circle cx="268" cy="88" r="9" fill="#2B2F4A" stroke="#000000" stroke-width="2"/></g>
<g class="w"><circle cx="190" cy="127" r="9" fill="#FFFFFF" stroke="#A3A8CC" stroke-width="2.5"/></g>
<g class="s"><circle cx="128" cy="178" r="13" fill="#CDEBFA" stroke="#0B6FA0" stroke-width="3"/></g>
</svg>
