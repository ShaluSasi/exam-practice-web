<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>A weightlifter raising a barbell from the floor to above her head</title>
<style>
.lift{animation:lf 4s ease-in-out infinite}
.arms{transform-box:fill-box;transform-origin:bottom;animation:ar 4s ease-in-out infinite}
@keyframes lf{0%,15%{transform:translateY(0)}55%,80%{transform:translateY(-150px)}100%{transform:translateY(0)}}
@keyframes ar{0%,15%{transform:scaleY(.2)}55%,80%{transform:scaleY(1)}100%{transform:scaleY(.2)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="0" y="222" width="400" height="38" fill="#D9C49A"/>
<rect x="110" y="214" width="180" height="10" rx="3" fill="#C8925A"/>
<g stroke-linecap="round" stroke-linejoin="round">
<path d="M192 170L178 216M208 170L222 216" stroke="#2B2F4A" stroke-width="11"/>
<path d="M200 112V172" stroke="#E5484D" stroke-width="32"/>
</g>
<g class="arms"><path d="M182 60V118M218 60V118" stroke="#F2C9A0" stroke-width="8" stroke-linecap="round"/></g>
<circle cx="200" cy="94" r="15" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="2.5"/>
<path d="M186 90Q198 74 214 88" fill="#2B2F4A"/>
<g class="lift">
<rect x="120" y="202" width="160" height="6" rx="3" fill="#5E6390"/>
<rect x="118" y="182" width="16" height="46" rx="4" fill="#2B2F4A"/><rect x="266" y="182" width="16" height="46" rx="4" fill="#2B2F4A"/>
<rect x="136" y="188" width="10" height="34" rx="3" fill="#0B93D4"/><rect x="254" y="188" width="10" height="34" rx="3" fill="#0B93D4"/>
</g>
<path d="M340 205V55" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/>
<path d="M334 63L340 51L346 63M334 197L340 209L346 197" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/>
