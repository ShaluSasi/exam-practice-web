<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>A box being pushed up a ramp onto a step</title>
<style>
.box{animation:up 4s ease-in-out infinite}
@keyframes up{0%,10%{transform:translate(0,0)}80%,100%{transform:translate(152px,-114px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="0" y="210" width="400" height="50" fill="#D9C49A"/>
<rect x="290" y="96" width="100" height="114" fill="#C3C7E0" stroke="#5E6390" stroke-width="3"/>
<path d="M138 210L290 96V210Z" fill="#C8925A" stroke="#8A5A2B" stroke-width="3" stroke-linejoin="round"/>
<g class="box"><g transform="rotate(-36.87 150 200)"><rect x="140" y="172" width="34" height="28" rx="3" fill="#F6C453" stroke="#B98A1F" stroke-width="3"/></g></g>
<g stroke="#2B2F4A" stroke-width="2" stroke-linecap="round">
<path d="M138 232H290M138 226V238M290 226V238"/>
<path d="M310 96V210" stroke-dasharray="4 4"/>
</g>
<g font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#2B2F4A">
<text x="190" y="252">80 cm</text>
<text x="316" y="160">60 cm</text>
</g>
</svg>
