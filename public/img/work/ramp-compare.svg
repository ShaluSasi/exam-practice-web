<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>A toy cart pulled up a steep short plank and a gentle long plank to the same height</title>
<style>
.c1{animation:c1 4s ease-in-out infinite}
.c2{animation:c2 4s ease-in-out infinite}
@keyframes c1{0%,10%{transform:translate(0,0)}80%,100%{transform:translate(60px,-80px)}}
@keyframes c2{0%,10%{transform:translate(0,0)}80%,100%{transform:translate(160px,-80px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="0" y="200" width="400" height="60" fill="#D9C49A"/>
<g fill="#C3C7E0" stroke="#5E6390" stroke-width="3"><rect x="120" y="120" width="50" height="80"/><rect x="330" y="120" width="50" height="80"/></g>
<g stroke="#8A5A2B" stroke-width="8" stroke-linecap="round"><path d="M60 200L120 120"/><path d="M170 200L330 120"/></g>
<g class="c1"><g transform="rotate(-53 66 190)"><rect x="60" y="178" width="24" height="14" rx="3" fill="#E5484D" stroke="#9E2A2E" stroke-width="2.5"/></g></g>
<g class="c2"><g transform="rotate(-26.6 176 190)"><rect x="170" y="180" width="24" height="14" rx="3" fill="#0B93D4" stroke="#075E88" stroke-width="2.5"/></g></g>
<g font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#2B2F4A" text-anchor="middle"><text x="95" y="236">X</text><text x="250" y="236">Y</text></g>
</svg>
