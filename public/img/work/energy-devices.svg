<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>Four everyday devices: a glowing bulb, a solar panel, a microphone and a burning matchstick</title>
<style>
.glow{transform-box:fill-box;transform-origin:center;animation:gl 1.6s ease-in-out infinite}
.fl{transform-box:fill-box;transform-origin:bottom;animation:fl .5s ease-in-out infinite alternate}
.snd{animation:sd 1.5s ease-out infinite}
@keyframes gl{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:.9;transform:scale(1.1)}}
@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.15)}}
@keyframes sd{0%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(14px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle class="glow" cx="60" cy="90" r="40" fill="#F6C453"/>
<circle cx="60" cy="90" r="26" fill="#FFF4C2" stroke="#B98A1F" stroke-width="3"/>
<rect x="50" y="114" width="20" height="22" rx="3" fill="#A3A8CC" stroke="#5E6390" stroke-width="2.5"/>
<path d="M54 92L58 100L62 92L66 100" fill="none" stroke="#FF8A1F" stroke-width="2.5"/>
<path d="M130 150L170 90H250L210 150Z" fill="#0B5FA5" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/>
<path d="M150 120H230M190 90L170 150M223 90L203 150M157 90L137 150" stroke="#7CC4EA" stroke-width="1.5"/>
<path d="M190 150V176M176 176H204" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round"/>
<circle cx="240" cy="44" r="14" fill="#F6C453"/>
<rect x="276" y="60" width="28" height="44" rx="14" fill="#5E6390" stroke="#2B2F4A" stroke-width="3"/>
<path d="M282 72H298M282 82H298M282 92H298" stroke="#A3A8CC" stroke-width="2"/>
<path d="M290 104V150M274 150H306" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round"/>
<g class="snd" fill="none" stroke="#0B93D4" stroke-width="3" stroke-linecap="round"><path d="M262 70Q254 82 262 94M252 64Q240 82 252 100"/></g>
<path d="M350 150L360 70" stroke="#C8925A" stroke-width="6" stroke-linecap="round"/>
<circle cx="360" cy="68" r="6" fill="#9E2A2E"/>
<path class="fl" d="M360 62Q348 46 360 26Q372 46 360 62Z" fill="#FF8A1F" stroke="#E5484D" stroke-width="2"/>
</svg>
