<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>A student running up a flight of stairs with a stopwatch ticking</title>
<style>
.run{animation:rn 3s linear infinite}
.hand{transform-origin:340px 70px;animation:hd 3s steps(12) infinite}
@keyframes rn{from{transform:translate(0,0)}to{transform:translate(200px,-130px)}}
@keyframes hd{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M20 240H80V214H120V188H160V162H200V136H240V110H280V84H380V240Z" fill="#C3C7E0" stroke="#5E6390" stroke-width="3" stroke-linejoin="round"/>
<g class="run">
<path d="M58 222L48 240M64 222L76 236" stroke="#2B2F4A" stroke-width="7" stroke-linecap="round"/>
<path d="M60 188V222" stroke="#3FA34D" stroke-width="18" stroke-linecap="round"/>
<rect x="44" y="190" width="12" height="22" rx="3" fill="#FF8A1F" stroke="#B85C0E" stroke-width="2"/>
<circle cx="62" cy="174" r="11" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="2.5"/>
<path d="M51 170Q60 158 73 168" fill="#2B2F4A"/>
</g>
<circle cx="340" cy="70" r="30" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3"/>
<rect x="334" y="32" width="12" height="8" rx="2" fill="#2B2F4A"/>
<g class="hand"><path d="M340 70V48" stroke="#E5484D" stroke-width="3" stroke-linecap="round"/></g>
<circle cx="340" cy="70" r="3" fill="#2B2F4A"/>
</svg>
