<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>A tall building with a lift shaft on one side and a zig-zag staircase on the other</title>
<style>
.lift{animation:lf 5s ease-in-out infinite}
@keyframes lf{0%,10%{transform:translateY(0)}60%,100%{transform:translateY(-170px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="0" y="236" width="400" height="24" fill="#9CCB86"/>
<rect x="100" y="20" width="200" height="216" fill="#E8EAF6" stroke="#5E6390" stroke-width="3"/>
<rect x="112" y="28" width="56" height="208" fill="#CDEBFA" stroke="#0B6FA0" stroke-width="2"/>
<path d="M140 28V196" stroke="#2B2F4A" stroke-width="1.5"/>
<g class="lift"><rect x="118" y="196" width="44" height="38" rx="3" fill="#F6C453" stroke="#B98A1F" stroke-width="3"/><circle cx="140" cy="208" r="5" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="1.5"/><path d="M140 214V228" stroke="#E5484D" stroke-width="5" stroke-linecap="round"/></g>
<path d="M180 236L290 200L180 164L290 128L180 92L290 56L180 26" fill="none" stroke="#C8925A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<circle r="6" fill="#E5484D" stroke="#9E2A2E" stroke-width="2"><animateMotion dur="5s" repeatCount="indefinite" path="M180 236L290 200L180 164L290 128L180 92L290 56L180 26"/></circle>
<path d="M330 236V26" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/>
<path d="M324 34L330 22L336 34M324 228L330 240L336 228" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/>
<text x="340" y="136" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#2B2F4A">h</text>
