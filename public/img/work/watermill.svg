<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>A traditional hill watermill: a stream, a sloping wooden chute and a mill hut</title>
<style>
.flow{animation:fl 1s linear infinite}
.pad{animation:pd 0.8s linear infinite}
.st{transform-box:fill-box;transform-origin:center;animation:sq 0.8s ease-in-out infinite}
