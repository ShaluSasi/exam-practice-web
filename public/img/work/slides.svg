<g transform="translate(0 -10)"><circle r="8" fill="#F6C453" stroke="#B98A1F" stroke-width="2.5"><animateMotion dur="3s" repeatCount="indefinite" path="M90 62Q150 62 200 140Q240 214 300 216" calcMode="spline" keyTimes="0;1" keyPoints="0;1" keySplines="0.5 0 0.8 0.6"/></circle></g>
<path d="M18 62V216" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/>
<path d="M12 70L18 58L24 70M12 208L18 220L24 208" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/>
<g font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#2B2F4A" text-anchor="middle"><text x="26" y="40">h</text><text x="200" y="244">1</text><text x="300" y="244">2</text><text x="380" y="244">3</text></g>
</svg>
