<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>A girl walking along level ground while holding a box</title>
<style>
.walk{animation:wk 5s linear infinite}
.lg1{transform-origin:150px 158px;animation:lg 0.6s ease-in-out infinite alternate}
.lg2{transform-origin:150px 158px;animation:lg 0.6s ease-in-out infinite alternate-reverse}
@keyframes wk{from{transform:translateX(-60px)}to{transform:translateX(120px)}}
@keyframes lg{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="0" y="0" width="400" height="210" rx="16" fill="#E3F2FD"/>
<rect x="0" y="210" width="400" height="50" fill="#D9C49A"/>
<g class="walk">
<path class="lg1" d="M150 158V206" stroke="#2B2F4A" stroke-width="9" stroke-linecap="round"/>
<path class="lg2" d="M150 158V206" stroke="#2B2F4A" stroke-width="9" stroke-linecap="round"/>
<path d="M150 104V160" stroke="#E5484D" stroke-width="26" stroke-linecap="round"/>
<path d="M156 116L178 120" stroke="#F2C9A0" stroke-width="7" stroke-linecap="round"/>
<rect x="164" y="88" width="44" height="34" rx="4" fill="#C8925A" stroke="#8A5A2B" stroke-width="3"/>
<circle cx="150" cy="80" r="15" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="2.5"/>
<path d="M134 78Q140 60 160 66Q150 64 140 90Z" fill="#2B2F4A"/>
<path d="M186 84V34" stroke="#E5484D" stroke-width="5" stroke-linecap="round"/>
<path d="M176 42L186 26L196 42Z" fill="#E5484D" stroke="#E5484D" stroke-width="3" stroke-linejoin="round"/>
<text x="198" y="44" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#2B2F4A">F</text>
</g>
<path d="M60 236H300" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/>
<path d="M292 226L308 236L292 246Z" fill="#3FA34D" stroke="#3FA34D" stroke-width="3" stroke-linejoin="round"/>
<text x="316" y="241" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#2B2F4A">s</text>
</svg>
