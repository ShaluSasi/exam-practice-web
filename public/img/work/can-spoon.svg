<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>A spoon being used to prise the lid off a paint tin</title>
<style>
.spoon{transform-origin:168px 112px;animation:sp 3s ease-in-out infinite}
.lid{transform-origin:370px 104px;animation:lid 3s ease-in-out infinite}
@keyframes sp{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}
@keyframes lid{0%,100%{transform:rotate(0)}50%{transform:rotate(5deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="0" y="228" width="400" height="32" fill="#D9C49A"/>
<path d="M170 112V218Q170 228 182 228H358Q370 228 370 218V112Z" fill="#CDEBFA" stroke="#0B6FA0" stroke-width="3" stroke-linejoin="round"/>
<rect x="170" y="140" width="200" height="56" fill="#F6C453" stroke="#C9952A" stroke-width="2.5"/>
<circle cx="270" cy="168" r="16" fill="#FF8A1F" stroke="#C9661A" stroke-width="2.5"/>
<path d="M166 112H374" stroke="#0B6FA0" stroke-width="5" stroke-linecap="round"/>
<g class="lid">
<rect x="164" y="96" width="210" height="12" rx="4" fill="#A3A8CC" stroke="#5E6390" stroke-width="3"/>
<rect x="250" y="88" width="40" height="8" rx="3" fill="#A3A8CC" stroke="#5E6390" stroke-width="2.5"/>
</g>
<g class="spoon">
<path d="M42 166L204 98" stroke="#5E6390" stroke-width="9" stroke-linecap="round"/>
<path d="M42 166L204 98" stroke="#D5D8EC" stroke-width="4" stroke-linecap="round"/>
<ellipse cx="34" cy="170" rx="16" ry="10" transform="rotate(-23 34 170)" fill="#D5D8EC" stroke="#5E6390" stroke-width="3"/>
</g>
<path d="M60 92V128" stroke="#E5484D" stroke-width="6" stroke-linecap="round"/>
<path d="M48 122L60 142L72 122Z" fill="#E5484D" stroke="#E5484D" stroke-width="3" stroke-linejoin="round"/>
</svg>
