<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>A jet landing on a ship's deck being slowed by an arresting wire</title>
<style>
.jet{animation:ln 4s cubic-bezier(.1,.6,.3,1) infinite}
.wire{transform-origin:300px 168px;animation:wr 4s cubic-bezier(.1,.6,.3,1) infinite}
@keyframes ln{0%{transform:translateX(-220px)}20%{transform:translateX(-160px)}80%,100%{transform:translateX(0)}}
@keyframes wr{0%,20%{transform:scaleX(.05)}80%,100%{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="0" y="0" width="400" height="180" rx="16" fill="#E3F2FD"/>
<rect x="0" y="180" width="400" height="80" fill="#7CC4EA"/>
<path d="M10 172H390L370 214H40Z" fill="#A3A8CC" stroke="#5E6390" stroke-width="3" stroke-linejoin="round"/>
<path d="M30 176H380" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="14 10"/>
<rect x="320" y="118" width="40" height="54" rx="4" fill="#C3C7E0" stroke="#5E6390" stroke-width="3"/>
<path d="M232 168Q266 160 300 168" class="wire" fill="none" stroke="#2B2F4A" stroke-width="2.5"/>
<g class="jet">
<path d="M160 150L290 150Q300 152 290 158L170 160Z" fill="#E8EAF6" stroke="#5E6390" stroke-width="3" stroke-linejoin="round"/>
<path d="M190 150L230 128L244 128L226 150Z" fill="#C3C7E0" stroke="#5E6390" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M164 150L150 126L166 126L182 150Z" fill="#C3C7E0" stroke="#5E6390" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M262 150Q270 142 282 148" fill="#7CC4EA" stroke="#5E6390" stroke-width="2"/>
<path d="M176 160L180 170M250 158L250 170M172 160L162 168" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/>
<circle cx="180" cy="170" r="3" fill="#2B2F4A"/><circle cx="250" cy="170" r="3" fill="#2B2F4A"/>
</g>
<path d="M320 90H240" stroke="#E5484D" stroke-width="5" stroke-linecap="round"/>
<path d="M248 80L232 90L248 100Z" fill="#E5484D" stroke="#E5484D" stroke-width="3" stroke-linejoin="round"/>
<text x="250" y="72" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#2B2F4A">wire force</text>
</svg>
