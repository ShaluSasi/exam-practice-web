<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>A slingshot (gulel) with its rubber band stretched back holding a pebble</title>
<style>
.bd{animation:bd 3s ease-in-out infinite}
.st{animation:st 3s ease-in-out infinite}
@keyframes bd{0%,100%{d:path("M150 80L150 130L190 80")}50%{d:path("M150 80L60 130L190 80")}}
@keyframes st{0%,100%{transform:translateX(0)}50%{transform:translateX(-90px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M170 240V150M170 150L150 80M170 150L190 80" fill="none" stroke="#C8925A" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M170 240V150M170 150L150 80M170 150L190 80" fill="none" stroke="#8A5A2B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".5"/>
<path class="bd" d="M150 80L60 130L190 80" fill="none" stroke="#E5484D" stroke-width="4" stroke-linejoin="round"/>
<g class="st"><circle cx="150" cy="130" r="10" fill="#A3A8CC" stroke="#5E6390" stroke-width="2.5"/></g>
<path d="M240 130H340" stroke="#3FA34D" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 8"/>
<path d="M334 120L350 130L334 140Z" fill="#3FA34D"/>
</svg>
