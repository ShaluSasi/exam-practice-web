.hands{animation:hd 3s ease-out infinite}
@keyframes bl{0%{transform:translateX(-230px)}45%{transform:translateX(0)}70%,100%{transform:translateX(24px)}}
@keyframes hd{0%,45%{transform:translateX(0)}70%,100%{transform:translateX(24px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
