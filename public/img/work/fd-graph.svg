<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>Force against displacement graph for a block pushed along a floor</title>
<style>
.ar{animation:fd 4s ease-in-out infinite}
@keyframes fd{0%,100%{opacity:.35}50%{opacity:.85}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g stroke="#E3E6F3" stroke-width="1.5"><path d="M135 30V210M210 30V210M285 30V210M360 30V210M60 170H370M60 130H370M60 90H370M60 50H370"/></g>
<path class="ar" d="M60 210L210 50H360V210Z" fill="#F6C453"/>
<path d="M60 210H375M60 210V25" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/>
<path d="M60 210L210 50H360" fill="none" stroke="#E5484D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M360 50V210" stroke="#E5484D" stroke-width="2" stroke-dasharray="5 4"/>
<g font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle">
<text x="60" y="226">0</text><text x="135" y="226">1</text><text x="210" y="226">2</text><text x="285" y="226">3</text><text x="360" y="226">4</text>
<text x="215" y="248">Displacement (m)</text>
<g text-anchor="end"><text x="54" y="174">10</text><text x="54" y="134">20</text><text x="54" y="94">30</text><text x="54" y="54">40</text></g>
<text transform="translate(20 130) rotate(-90)">Force (N)</text>
</g>
</svg>
