<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>Speed-time graph of a car that sees traffic ahead and stops</title>
<style>
.ln{stroke-dasharray:420;animation:dr 5s ease-in-out infinite}
@keyframes dr{0%{stroke-dashoffset:420}50%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g stroke="#E3E6F3" stroke-width="1.5">
<path d="M110 30V210M160 30V210M210 30V210M260 30V210M310 30V210M360 30V210M60 170H370M60 130H370M60 90H370M60 50H370"/>
</g>
<path d="M60 210H375M60 210V25" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/>
<path d="M60 50H160L360 210" fill="none" stroke="#9FD3F0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<path class="ln" d="M60 50H160L360 210" fill="none" stroke="#0B93D4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<g fill="#0B93D4" stroke="#FFFFFF" stroke-width="2"><circle cx="60" cy="50" r="6"/><circle cx="160" cy="50" r="6"/><circle cx="360" cy="210" r="6"/></g>
<g font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle">
<text x="60" y="226">0</text><text x="110" y="226">1</text><text x="160" y="226">2</text><text x="210" y="226">3</text><text x="260" y="226">4</text><text x="310" y="226">5</text><text x="360" y="226">6</text>
<text x="215" y="248">Time (s)</text>
<g text-anchor="end"><text x="54" y="174">5</text><text x="54" y="134">10</text><text x="54" y="94">15</text><text x="54" y="54">20</text></g>
<text transform="translate(20 130) rotate(-90)">Speed (m s⁻¹)</text>
<text x="74" y="40" font-size="15">A</text><text x="166" y="40" font-size="15">B</text><text x="372" y="200" font-size="15">C</text>
</g>
</svg>
