<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>A fast cricket delivery speeding towards the stumps with a speed display</title>
<style>
.ball{animation:fly 2s cubic-bezier(.3,0,.7,1) infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:sp .5s linear infinite}
@keyframes fly{0%{transform:translate(-250px,-40px)}60%{transform:translate(0,0)}100%{transform:translate(0,0);opacity:0}}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="0" y="0" width="400" height="200" rx="16" fill="#E3F2FD"/>
<rect x="0" y="200" width="400" height="60" fill="#9CCB86"/>
<rect x="60" y="196" width="300" height="20" rx="4" fill="#E9D8A6"/>
<g fill="#F3E2C3" stroke="#8A5A2B" stroke-width="2.5"><rect x="326" y="120" width="8" height="84" rx="3"/><rect x="340" y="120" width="8" height="84" rx="3"/><rect x="354" y="120" width="8" height="84" rx="3"/></g>
<path d="M324 118H364" stroke="#C8925A" stroke-width="4" stroke-linecap="round"/>
<g class="ball">
<path d="M260 160H220M262 170H210M260 150H230" stroke="#A3A8CC" stroke-width="3" stroke-linecap="round"/>
<g class="spin"><circle cx="280" cy="160" r="12" fill="#E5484D" stroke="#9E2A2E" stroke-width="2.5"/><path d="M272 152Q280 160 272 168M288 152Q280 160 288 168" fill="none" stroke="#FFFFFF" stroke-width="1.5"/></g>
</g>
<rect x="30" y="28" width="150" height="54" rx="10" fill="#2B2F4A"/>
<text x="105" y="64" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#F6C453" text-anchor="middle">90 km/h</text>
</svg>
