<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img">
<title>A probability scale from 0 to 1</title>
<style>.t{font:600 14px system-ui, sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui, sans-serif;fill:#2B2F4A}.b{font:700 18px system-ui, sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#F7B4B6"/><stop offset=".5" stop-color="#FFE7A3"/><stop offset="1" stop-color="#B8E6B8"/></linearGradient></defs><text x="200" y="32" class="b m">The probability scale</text><rect x="40" y="113" width="320" height="24" rx="12" fill="url(#g)" stroke="#2B2F4A" stroke-width="2.5"/><line x1="40" y1="137" x2="40" y2="149" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/><text x="40" y="169" class="t m">0</text><line x1="120" y1="137" x2="120" y2="149" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/><text x="120" y="169" class="t m">0.25</text><line x1="200" y1="137" x2="200" y2="149" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/><text x="200" y="169" class="t m">0.5</text><line x1="280" y1="137" x2="280" y2="149" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/><text x="280" y="169" class="t m">0.75</text><line x1="360" y1="137" x2="360" y2="149" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/><text x="360" y="169" class="t m">1</text>
</svg>
