<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>A tree diagram for tossing a coin two times</title>
<style>.t{font:600 14px system-ui, sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui, sans-serif;fill:#2B2F4A}.b{font:700 18px system-ui, sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<line x1="40" y1="130" x2="170" y2="70" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/><line x1="40" y1="130" x2="170" y2="190" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/><line x1="170" y1="70" x2="300" y2="40" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/><line x1="170" y1="70" x2="300" y2="100" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/><line x1="170" y1="190" x2="300" y2="160" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/><line x1="170" y1="190" x2="300" y2="220" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/><circle cx="40" cy="130" r="10" fill="#FFE2C4" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="170" cy="70" r="10" fill="#fff" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="170" cy="190" r="10" fill="#fff" stroke="#2B2F4A" stroke-width="2.5"/><text x="104" y="94" class="s m">1/2</text><text x="104" y="172" class="s m">1/2</text><text x="234" y="46" class="s m">1/2</text><text x="234" y="106" class="s m">1/2</text><text x="234" y="166" class="s m">1/2</text><text x="234" y="226" class="s m">1/2</text><text x="170" y="54" class="t m">H</text><text x="170" y="216" class="t m">T</text><circle cx="300" cy="40" r="10" fill="#FFF" stroke="#2B2F4A" stroke-width="2.5"/><text x="330" y="45" class="t">H</text><circle cx="300" cy="100" r="10" fill="#FFF" stroke="#2B2F4A" stroke-width="2.5"/><text x="330" y="105" class="t">T</text><circle cx="300" cy="160" r="10" fill="#FFF" stroke="#2B2F4A" stroke-width="2.5"/><text x="330" y="165" class="t">H</text><circle cx="300" cy="220" r="10" fill="#FFF" stroke="#2B2F4A" stroke-width="2.5"/><text x="330" y="225" class="t">T</text><text x="40" y="158" class="s m">Start</text>
</svg>
