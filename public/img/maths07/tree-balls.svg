<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 276" role="img">
<title>A tree diagram for drawing two balls from a basket without replacement</title>
<style>.t{font:600 14px system-ui, sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui, sans-serif;fill:#2B2F4A}.b{font:700 18px system-ui, sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="210" y="22" class="s m">Two balls drawn one after another, no putting back</text><line x1="40" y1="150" x2="160" y2="80" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/><line x1="40" y1="150" x2="160" y2="220" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/><line x1="160" y1="80" x2="300" y2="45" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/><line x1="160" y1="80" x2="300" y2="115" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/><line x1="160" y1="220" x2="300" y2="185" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/><line x1="160" y1="220" x2="300" y2="255" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/><circle cx="40" cy="150" r="10" fill="#FFE2C4" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="160" cy="80" r="10" fill="#F8B9BB" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="160" cy="220" r="10" fill="#B5E0F7" stroke="#2B2F4A" stroke-width="2.5"/><text x="86" y="104" class="s m">4/9</text><text x="86" y="200" class="s m">5/9</text><text x="224" y="54" class="s m">3/8</text><text x="224" y="112" class="s m">5/8</text><text x="224" y="192" class="s m">4/8</text><text x="224" y="252" class="s m">4/8</text><circle cx="300" cy="45" r="10" fill="#F8B9BB" stroke="#2B2F4A" stroke-width="2.5"/><text x="330" y="50" class="t">RR</text><circle cx="300" cy="115" r="10" fill="#B5E0F7" stroke="#2B2F4A" stroke-width="2.5"/><text x="330" y="120" class="t">RB</text><circle cx="300" cy="185" r="10" fill="#F8B9BB" stroke="#2B2F4A" stroke-width="2.5"/><text x="330" y="190" class="t">BR</text><circle cx="300" cy="255" r="10" fill="#B5E0F7" stroke="#2B2F4A" stroke-width="2.5"/><text x="330" y="260" class="t">BB</text>
</svg>
