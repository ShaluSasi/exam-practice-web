<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 252" role="img">
<title>A dropper above a rectangle with a circle drawn inside it</title>
<style>.t{font:600 14px system-ui, sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui, sans-serif;fill:#2B2F4A}.b{font:700 18px system-ui, sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}@keyframes drop{0%{transform:translateY(0);opacity:1}80%{transform:translateY(84px);opacity:1}100%{transform:translateY(90px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="80" y="76" width="240" height="160" rx="6" fill="#B9B4E8" stroke="#2B2F4A" stroke-width="3"/><circle cx="200" cy="156" r="40" fill="#FFF0C9" stroke="#2B2F4A" stroke-width="3"/><line x1="160" y1="156" x2="240" y2="156" stroke="#2B2F4A" stroke-width="2" stroke-dasharray="5 4"/><text x="200" y="146" class="s m">1 m</text><text x="130" y="66" class="t m">3 m</text><text x="338" y="160" class="t">2 m</text><rect x="190" y="14" width="20" height="30" rx="6" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5"/><path d="M200 44l-5 12h10z" fill="#C8925A" stroke="#2B2F4A" stroke-width="2"/><g style="animation:drop 2.4s ease-in infinite"><path d="M200 56q-7 10-7 15a7 7 0 0 0 14 0q0-5-7-15z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.5"/></g>
