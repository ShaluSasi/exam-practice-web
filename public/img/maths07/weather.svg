<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Two friends discuss whether it will rain</title>
<style>.t{font:600 14px system-ui, sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui, sans-serif;fill:#2B2F4A}.b{font:700 18px system-ui, sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}@keyframes spin{to{transform:rotate(360deg)}}@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(14px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g style="transform-origin:90px 70px;animation:spin 14s linear infinite"><g stroke="#FF8A1F" stroke-width="4" stroke-linecap="round"><line x1="124" y1="70" x2="138" y2="70"/><line x1="114" y1="94" x2="123.9" y2="103.9"/><line x1="90" y1="104" x2="90" y2="118"/><line x1="66" y1="94" x2="56.1" y2="103.9"/><line x1="56" y1="70" x2="42" y2="70"/><line x1="66" y1="46" x2="56.1" y2="36.1"/><line x1="90" y1="36" x2="90" y2="22"/><line x1="114" y1="46" x2="123.9" y2="36.1"/></g></g>
<circle cx="90" cy="70" r="26" fill="#F6C453" stroke="#FF8A1F" stroke-width="3"/>
<g style="animation:drift 6s ease-in-out infinite"><path d="M230 80a26 26 0 0 1 50-10a22 22 0 0 1 36 18a18 18 0 0 1-6 34h-70a22 22 0 0 1-10-42z" fill="#CDEBFA" stroke="#0B93D4" stroke-width="3" stroke-linejoin="round"/></g>
<g stroke="#0B93D4" stroke-width="3" stroke-linecap="round" opacity=".7"><line x1="250" y1="130" x2="244" y2="142"/><line x1="272" y1="130" x2="266" y2="142"/><line x1="294" y1="130" x2="288" y2="142"/></g>
<circle cx="80" cy="190" r="16" fill="#FFD9B0" stroke="#2B2F4A" stroke-width="2.5"/><rect x="62" y="206" width="36" height="26" rx="10" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5"/>
<circle cx="310" cy="190" r="16" fill="#F1C8A5" stroke="#2B2F4A" stroke-width="2.5"/><rect x="292" y="206" width="36" height="26" rx="10" fill="#8E5BD6" stroke="#2B2F4A" stroke-width="2.5"/>
<rect x="104" y="160" width="130" height="40" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><text x="169" y="177" class="s m">Bright sun, so</text><text x="169" y="192" class="s m">rain is unlikely</text>
<rect x="170" y="206" width="116" height="26" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><text x="228" y="224" class="s m">So hot! Maybe rain</text>
</svg>
