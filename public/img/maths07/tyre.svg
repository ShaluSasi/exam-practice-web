<text x="200" y="28" class="t m">Distance before a tyre is replaced (1000 tyres)</text><rect x="24" y="52" width="88" height="56" fill="#E9DDBF" stroke="#2B2F4A" stroke-width="2"/><rect x="24" y="108" width="88" height="56" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><text x="68" y="76" class="s m">Less than</text><text x="68" y="94" class="s m">4000 km</text><text x="68" y="142" class="b m">20</text><rect x="112" y="52" width="88" height="56" fill="#E9DDBF" stroke="#2B2F4A" stroke-width="2"/><rect x="112" y="108" width="88" height="56" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><text x="156" y="76" class="s m">4001 to</text><text x="156" y="94" class="s m">9000 km</text><text x="156" y="142" class="b m">210</text><rect x="200" y="52" width="88" height="56" fill="#E9DDBF" stroke="#2B2F4A" stroke-width="2"/><rect x="200" y="108" width="88" height="56" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><text x="244" y="76" class="s m">9001 to</text><text x="244" y="94" class="s m">14000 km</text><text x="244" y="142" class="b m">325</text><rect x="288" y="52" width="88" height="56" fill="#E9DDBF" stroke="#2B2F4A" stroke-width="2"/><rect x="288" y="108" width="88" height="56" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><text x="332" y="76" class="s m">More than</text><text x="332" y="94" class="s m">14000 km</text><text x="332" y="142" class="b m">445</text><text x="200" y="190" class="s m">Number of tyres in each group</text>
