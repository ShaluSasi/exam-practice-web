<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Three coins being tossed and a list of letter patterns</title>
<style>.t{font:600 14px system-ui, sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui, sans-serif;fill:#2B2F4A}.b{font:700 18px system-ui, sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}@keyframes flip{0%,100%{transform:scaleX(1)}25%{transform:scaleX(.04)}50%{transform:scaleX(1)}75%{transform:scaleX(.04)}}@keyframes hh{0%,24%,75%,100%{opacity:1}25%,74%{opacity:0}}@keyframes tt{0%,24%,75%,100%{opacity:0}25%,74%{opacity:1}}.hh{animation:hh 3s steps(1) infinite}.tt{opacity:0;animation:tt 3s steps(1) infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g style="transform-origin:110px 62px;animation:flip 3s ease-in-out 0s infinite"><circle cx="110" cy="62" r="30" fill="#F6C453" stroke="#B8862B" stroke-width="2.5"/><circle cx="110" cy="62" r="21.6" fill="none" stroke="#B8862B" stroke-width="1.5"/><text x="110" y="71.6" class="b m hh" style="font-size:27px;animation-delay:0s">H</text><text x="110" y="71.6" class="b m tt" style="font-size:27px;animation-delay:0s">T</text></g><g style="transform-origin:200px 62px;animation:flip 3s ease-in-out 0.3s infinite"><circle cx="200" cy="62" r="30" fill="#F6C453" stroke="#B8862B" stroke-width="2.5"/><circle cx="200" cy="62" r="21.6" fill="none" stroke="#B8862B" stroke-width="1.5"/><text x="200" y="71.6" class="b m hh" style="font-size:27px;animation-delay:0.3s">H</text><text x="200" y="71.6" class="b m tt" style="font-size:27px;animation-delay:0.3s">T</text></g><g style="transform-origin:290px 62px;animation:flip 3s ease-in-out 0.6s infinite"><circle cx="290" cy="62" r="30" fill="#F6C453" stroke="#B8862B" stroke-width="2.5"/><circle cx="290" cy="62" r="21.6" fill="none" stroke="#B8862B" stroke-width="1.5"/><text x="290" y="71.6" class="b m hh" style="font-size:27px;animation-delay:0.6s">H</text><text x="290" y="71.6" class="b m tt" style="font-size:27px;animation-delay:0.6s">T</text></g><rect x="34" y="130" width="72" height="30" rx="8" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><text x="70" y="151" class="t m">HHH</text><rect x="122" y="130" width="72" height="30" rx="8" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><text x="158" y="151" class="t m">HHT</text><rect x="210" y="130" width="72" height="30" rx="8" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><text x="246" y="151" class="t m">HTH</text><rect x="298" y="130" width="72" height="30" rx="8" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><text x="334" y="151" class="t m">HTT</text><rect x="34" y="170" width="72" height="30" rx="8" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><text x="70" y="191" class="t m">THH</text><rect x="122" y="170" width="72" height="30" rx="8" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><text x="158" y="191" class="t m">THT</text><rect x="210" y="170" width="72" height="30" rx="8" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><text x="246" y="191" class="t m">TTH</text><rect x="298" y="170" width="72" height="30" rx="8" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><text x="334" y="191" class="t m">TTT</text><text x="200" y="228" class="s m">All 8 results of tossing three coins</text>
</svg>
