<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 190" role="img">
<title>A row of coin tosses followed by a question mark</title>
<style>.t{font:600 14px system-ui, sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui, sans-serif;fill:#2B2F4A}.b{font:700 18px system-ui, sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.4)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="30" class="b m">Seven tosses of a fair coin</text><circle cx="48" cy="100" r="20" fill="#F6C453" stroke="#B8862B" stroke-width="2.5"/><circle cx="48" cy="100" r="14.4" fill="none" stroke="#B8862B" stroke-width="1.5"/><text x="48" y="106.4" class="b m" style="font-size:18px">H</text><circle cx="100" cy="100" r="20" fill="#F6C453" stroke="#B8862B" stroke-width="2.5"/><circle cx="100" cy="100" r="14.4" fill="none" stroke="#B8862B" stroke-width="1.5"/><text x="100" y="106.4" class="b m" style="font-size:18px">H</text><circle cx="152" cy="100" r="20" fill="#F6C453" stroke="#B8862B" stroke-width="2.5"/><circle cx="152" cy="100" r="14.4" fill="none" stroke="#B8862B" stroke-width="1.5"/><text x="152" y="106.4" class="b m" style="font-size:18px">H</text><circle cx="204" cy="100" r="20" fill="#F6C453" stroke="#B8862B" stroke-width="2.5"/><circle cx="204" cy="100" r="14.4" fill="none" stroke="#B8862B" stroke-width="1.5"/><text x="204" y="106.4" class="b m" style="font-size:18px">H</text><circle cx="256" cy="100" r="20" fill="#F6C453" stroke="#B8862B" stroke-width="2.5"/><circle cx="256" cy="100" r="14.4" fill="none" stroke="#B8862B" stroke-width="1.5"/><text x="256" y="106.4" class="b m" style="font-size:18px">H</text><circle cx="308" cy="100" r="20" fill="#F6C453" stroke="#B8862B" stroke-width="2.5"/><circle cx="308" cy="100" r="14.4" fill="none" stroke="#B8862B" stroke-width="1.5"/><text x="308" y="106.4" class="b m" style="font-size:18px">H</text><circle cx="360" cy="100" r="20" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-dasharray="5 4"/><text x="360" y="108" class="b m" style="animation:pulse 2s ease-in-out infinite;transform-origin:360px 100px">?</text><text x="200" y="160" class="t m">H H H H H H and then...</text>
</svg>
