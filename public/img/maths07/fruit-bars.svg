<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>Bar chart of favourite fruits in a class survey</title>
<style>.t{font:600 14px system-ui, sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui, sans-serif;fill:#2B2F4A}.b{font:700 18px system-ui, sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="52" y="20" class="s">Number of students</text><line x1="56" y1="206" x2="384" y2="206" stroke="#E2D8BF" stroke-width="1.5"/><text x="48" y="210" class="s e">0</text><line x1="56" y1="163" x2="384" y2="163" stroke="#E2D8BF" stroke-width="1.5"/><text x="48" y="167" class="s e">5</text><line x1="56" y1="120" x2="384" y2="120" stroke="#E2D8BF" stroke-width="1.5"/><text x="48" y="124" class="s e">10</text><line x1="56" y1="77" x2="384" y2="77" stroke="#E2D8BF" stroke-width="1.5"/><text x="48" y="81" class="s e">15</text><line x1="56" y1="34" x2="384" y2="34" stroke="#E2D8BF" stroke-width="1.5"/><text x="48" y="38" class="s e">20</text><rect x="71" y="34" width="52" height="172" rx="5" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5"><animate attributeName="height" from="0" to="172" dur="0.9s" fill="freeze"/><animate attributeName="y" from="206" to="34" dur="0.9s" fill="freeze"/></rect><text x="97" y="228" class="s m">Mango</text><rect x="153" y="77" width="52" height="129" rx="5" fill="#F08A8D" stroke="#2B2F4A" stroke-width="2.5"><animate attributeName="height" from="0" to="129" dur="0.9s" fill="freeze"/><animate attributeName="y" from="206" to="77" dur="0.9s" fill="freeze"/></rect><text x="179" y="228" class="s m">Apple</text><rect x="235" y="120" width="52" height="86" rx="5" fill="#F6C453" stroke="#2B2F4A" stroke-width="2.5"><animate attributeName="height" from="0" to="86" dur="0.9s" fill="freeze"/><animate attributeName="y" from="206" to="120" dur="0.9s" fill="freeze"/></rect><text x="261" y="228" class="s m">Banana</text><rect x="317" y="163" width="52" height="43" rx="5" fill="#B79BEA" stroke="#2B2F4A" stroke-width="2.5"><animate attributeName="height" from="0" to="43" dur="0.9s" fill="freeze"/><animate attributeName="y" from="206" to="163" dur="0.9s" fill="freeze"/></rect><text x="343" y="228" class="s m">Grapes</text><line x1="56" y1="206" x2="384" y2="206" stroke="#2B2F4A" stroke-width="2.5"/><line x1="56" y1="28" x2="56" y2="206" stroke="#2B2F4A" stroke-width="2.5"/>
