<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>An ammeter, a voltmeter, a resistor and a lamp: four electrical quantities with their own SI units</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><circle cx="70" cy="70" r="24" fill="#FFFFFF" stroke="#0B93D4" stroke-width="3" /><text x="70" y="78.4" font-size="24" font-family="sans-serif" fill="#0B93D4" text-anchor="middle" font-weight="bold" >A</text><text x="70" y="125" font-size="11" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >current</text><circle cx="160" cy="70" r="24" fill="#FFFFFF" stroke="#E5484D" stroke-width="3" /><text x="160" y="78.4" font-size="24" font-family="sans-serif" fill="#E5484D" text-anchor="middle" font-weight="bold" >V</text><text x="160" y="125" font-size="11" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >potential difference</text><rect x="222.0" y="56.0" width="56" height="28" rx="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><text x="250" y="74.2" font-size="12" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" ></text><text x="250" y="125" font-size="11" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >resistance</text><circle cx="340" cy="70" r="22" fill="#FFF3B0" stroke="#2B2F4A" stroke-width="3" /><line x1="325" y1="55" x2="355" y2="85" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><line x1="325" y1="85" x2="355" y2="55" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><text x="340" y="125" font-size="11" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >power</text><rect x="30" y="150" width="340" height="60" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><text x="200" y="177" font-size="14" font-family="sans-serif" fill="#7C5CFF" text-anchor="middle" font-weight="bold" >Each quantity is measured</text><text x="200" y="198" font-size="14" font-family="sans-serif" fill="#7C5CFF" text-anchor="middle" font-weight="bold" >in its own SI unit</text></svg>