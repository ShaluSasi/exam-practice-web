<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A 400 watt refrigerator and an energy meter charging Rs 3 per kilowatt hour</title><style>.dk{animation:dk 3s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes dk{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="40" y="20" width="90" height="160" rx="10" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" /><line x1="40" y1="80" x2="130" y2="80" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="52" y1="38" x2="52" y2="65" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><line x1="52" y1="95" x2="52" y2="135" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><text x="85" y="202" font-size="13" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >Refrigerator 400 W</text><text x="85" y="222" font-size="12" font-family="sans-serif" fill="#0B93D4" text-anchor="middle" font-weight="bold" >8 hours every day</text><rect x="180" y="40" width="190" height="110" rx="12" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><rect x="200" y="52" width="150" height="28" rx="4" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" /><text x="275" y="73" font-size="15" font-family="sans-serif" fill="#8CF29A" text-anchor="middle" font-weight="bold" >0 0 0 0 0 &#160;kWh</text><circle cx="275" cy="115" r="22" fill="#F2F2F2" stroke="#2B2F4A" stroke-width="2.5" /><g class="dk"><rect x="272" y="95" width="6" height="22" fill="#E5484D"/></g><text x="275" y="175" font-size="13" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >Energy meter: 30 days</text><text x="275" y="198" font-size="13" font-family="sans-serif" fill="#3FA34D" text-anchor="middle" font-weight="bold" >Rs 3.00 for each kWh</text></svg>