<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A 12 volt cell connected to an unknown resistor with a milliammeter reading 2.5 milliamperes</title><style>.f400{animation:f400 1.82s linear infinite}@keyframes f400{to{stroke-dashoffset:-40.1}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M60 108 V50 H340 V190 H60 V132" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="f400" d="M60 108 V50 H340 V190 H60 V132" fill="none" stroke="#FFB000" stroke-width="5" stroke-linecap="round" stroke-dasharray="0.1 40"/><rect x="46" y="108.0" width="28" height="24" rx="0" fill="#FFF9EE" stroke="#FFF9EE" stroke-width="0" /><line x1="47" y1="114.0" x2="73" y2="114.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="53" y1="126.0" x2="67" y2="126.0" stroke="#2B2F4A" stroke-width="6" stroke-linecap="round" /><text x="81" y="118.0" font-size="13" font-family="sans-serif" fill="#E5484D" text-anchor="middle" font-weight="bold" >+</text><text x="81" y="127.0" font-size="13" font-family="sans-serif" fill="#0B93D4" text-anchor="middle" font-weight="bold" >&#8722;</text><text x="40" y="125" font-size="13" font-family="sans-serif" fill="#2B2F4A" text-anchor="end" font-weight="bold" >12 V</text><rect x="172.0" y="38.0" width="56" height="24" rx="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="54.55" font-size="13" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >R = ?</text><circle cx="200" cy="190" r="17" fill="#FFFFFF" stroke="#0B93D4" stroke-width="3" /><text x="200" y="194.2" font-size="12" font-family="sans-serif" fill="#0B93D4" text-anchor="middle" font-weight="bold" >mA</text><text x="200" y="226" font-size="13" font-family="sans-serif" fill="#3FA34D" text-anchor="middle" font-weight="bold" >reads 2.5 mA</text></svg>