<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A lamp circuit with an ammeter in series and a voltmeter across the lamp</title><style>.f160{animation:f160 0.73s linear infinite}@keyframes f160{to{stroke-dashoffset:-16.1}}.gl{animation:gl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes gl{0%,100%{opacity:.35}50%{opacity:.85}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M60 108 V50 H340 V190 H60 V132" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="f160" d="M60 108 V50 H340 V190 H60 V132" fill="none" stroke="#FFB000" stroke-width="5" stroke-linecap="round" stroke-dasharray="0.1 16"/><rect x="46" y="108.0" width="28" height="24" rx="0" fill="#FFF9EE" stroke="#FFF9EE" stroke-width="0" /><line x1="47" y1="114.0" x2="73" y2="114.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="53" y1="126.0" x2="67" y2="126.0" stroke="#2B2F4A" stroke-width="6" stroke-linecap="round" /><text x="81" y="118.0" font-size="13" font-family="sans-serif" fill="#E5484D" text-anchor="middle" font-weight="bold" >+</text><text x="81" y="127.0" font-size="13" font-family="sans-serif" fill="#0B93D4" text-anchor="middle" font-weight="bold" >&#8722;</text><circle cx="250" cy="50" r="23" fill="#FFD166" stroke="none" stroke-width="0" class="gl" opacity=".6"/><circle cx="250" cy="50" r="14" fill="#FFF3B0" stroke="#2B2F4A" stroke-width="3" /><line x1="240.48" y1="40.48" x2="259.52" y2="59.52" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><line x1="240.48" y1="59.52" x2="259.52" y2="40.48" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><circle cx="140" cy="50" r="14" fill="#FFFFFF" stroke="#0B93D4" stroke-width="3" /><text x="140" y="55.25" font-size="15" font-family="sans-serif" fill="#0B93D4" text-anchor="middle" font-weight="bold" >A