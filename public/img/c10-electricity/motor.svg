<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>An electric motor with a spinning shaft connected to a 220 volt line drawing 5 amperes</title><style>.rt{animation:rt 1.5s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes rt{to{transform:rotate(360deg)}}.f140{animation:f140 0.64s linear infinite}@keyframes f140{to{stroke-dashoffset:-14.1}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><circle cx="200" cy="105" r="60" fill="#C9CDE8" stroke="#2B2F4A" stroke-width="4" /><g class="rt"><line x1="200" y1="65" x2="200" y2="145" stroke="#2B2F4A" stroke-width="6" stroke-linecap="round" /><line x1="160" y1="105" x2="240" y2="105" stroke="#2B2F4A" stroke-width="6" stroke-linecap="round" /></g><circle cx="200" cy="105" r="10" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1" /><rect x="140" y="160" width="120" height="14" rx="4" fill="#7C80A8" stroke="#2B2F4A" stroke-width="3" /><path d="M70 105 H140" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M260 105 H330" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="f140" d="M70 105 H140" fill="none" stroke="#FFB000" stroke-width="5" stroke-linecap="round" stroke-dasharray="0.1 14"/><path class="f140" d="M260 105 H330" fill="none" stroke="#FFB000" stroke-width="5" stroke-linecap="round" stroke-dasharray="0.1 14"/><text x="62" y="88" font-size="12" font-family="sans-serif" fill="#2B2F4A" text-anchor="start" font-weight="bold" >220 V line</text><text x="300" y="85" font-size="15" font-family="sans-serif" fill="#3FA34D" text-anchor="start" font-weight="bold" >5 A</text><text x="200" y="205" font-size="14" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >An electric motor runs for 2 hours</text></svg>