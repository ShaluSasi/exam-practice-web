<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A battery doing work W to push a charge Q from the negative to the positive terminal</title><style>.cg{animation:cg 3s ease-in-out infinite}@keyframes cg{0%{transform:translateY(80px)}60%,100%{transform:translateY(0)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="150" y="40" width="100" height="150" rx="14" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="70" font-size="28" font-family="sans-serif" fill="#E5484D" text-anchor="middle" font-weight="bold" >+</text><text x="200" y="175" font-size="28" font-family="sans-serif" fill="#0B93D4" text-anchor="middle" font-weight="bold" >&#8722;</text><g class="cg"><circle cx="200" cy="105" r="15" fill="#FFE08A" stroke="#FF8A1F" stroke-width="3" /><text x="200" y="110" font-size="13" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >Q</text></g><path d="M120 160 V60" fill="none" stroke="#3FA34D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M110 74 L120 58 L130 74" fill="none" stroke="#3FA34D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="90" y="112" font-size="13" font-family="sans-serif" fill="#3FA34D" text-anchor="end" font-weight="bold" >work W</text><text x="90" y="130" font-size="13" font-family="sans-serif" fill="#3FA34D" text-anchor="end" font-weight="bold" >done</text><text x="300" y="112" font-size="12" font-family="sans-serif" fill="#2B2F4A" text-anchor="start" font-weight="bold" >moves charge</text><text x="300" y="130" font-size="12" font-family="sans-serif" fill="#2B2F4A" text-anchor="start" font-weight="bold" >Q uphill</text><text x="200" y="224" font-size="12" font-family="sans-serif" fill="#6B6F8D" text-anchor="middle" font-weight="bold" >Battery: chemical action lifts the charge</text></svg>