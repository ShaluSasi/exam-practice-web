<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A straight-line V-I graph through the origin for a nichrome wire</title><style>.dr{stroke-dasharray:200;stroke-dashoffset:200;animation:dr 3s ease-in-out infinite}@keyframes dr{0%{stroke-dashoffset:200}60%,100%{stroke-dashoffset:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><line x1="60" y1="200" x2="60" y2="30" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="60" y1="200" x2="360" y2="200" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M54 42 L60 28 L66 42" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M346 194 L362 200 L346 206" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="40" y="36" font-size="12" font-family="sans-serif" fill="#2B2F4A" text-anchor="end" font-weight="bold" >V (volt)</text><text x="360" y="222" font-size="12" font-family="sans-serif" fill="#2B2F4A" text-anchor="end" font-weight="bold" >I (ampere)</text><text x="52" y="216" font-size="12" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >O</text><path d="M60 200 L300 56" fill="none" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="dr" pathLength="200" /><circle cx="120" cy="164" r="5" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" /><circle cx="180" cy="128" r="5" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" /><circle cx="240" cy="92" r="5" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" /><circle cx="300" cy="56" r="5" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" /></svg>