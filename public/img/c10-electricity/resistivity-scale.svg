<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A scale of resistivity rising from copper, iron and nichrome to glass</title><style>.sl{animation:sl 3s ease-in-out infinite}@keyframes sl{0%,100%{transform:translateX(-6px)}50%{transform:translateX(6px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M30 110 H360" fill="none" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M346 98 L364 110 L346 122" fill="none" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><rect x="30" y="128" width="107" height="14" rx="0" fill="#7FD18B" stroke="#2B2F4A" stroke-width="2" /><rect x="137" y="128" width="106" height="14" rx="0" fill="#F6C453" stroke="#2B2F4A" stroke-width="2" /><rect x="243" y="128" width="107" height="14" rx="0" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" /><text x="40" y="165" font-size="12" font-family="sans-serif" fill="#3FA34D" text-anchor="start" font-weight="bold" >low resistivity</text><text x="350" y="165" font-size="12" font-family="sans-serif" fill="#E5484D" text-anchor="end" font-weight="bold" >high resistivity</text><path d="M50 70 L56.0 80 L68.0 60 L80.0 80 L92.0 60 L104.0 80 L110 70" fill="none" stroke="#D9894F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="80" y="50" font-size="12" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >copper</text><path d="M140 55 L190 85" fill="none" stroke="#7C80A8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><text x="165" y="50" font-size="12" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >iron</text><path d="M215 70 L221.0 80 L233.0 60 L245.0 80 L257.0 60 L269.0 80 L275 70" fill="none" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="245" y="50" font-size="12" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >nichrome</text><rect x="305" y="56" width="36" height="28" rx="4" fill="#BFE3FA" stroke="#2B2F4A" stroke-width="3" /><text x="323" y="50" font-size="12" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >glass</text><text x="200" y="210" font-size="13" font-family="sans-serif" fill="#7C5CFF" text-anchor="middle" font-weight="bold" >Arrange from lowest to highest resistivity</text></svg>