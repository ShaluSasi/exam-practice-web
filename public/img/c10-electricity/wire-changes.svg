<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A uniform wire of length l, area A and resistivity rho with the formula R equals rho l over A</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="50" y="80" width="300" height="40" rx="8" fill="#E8B07A" stroke="#8A5A2B" stroke-width="3" /><line x1="50" y1="140" x2="350" y2="140" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><path d="M50 134 V146 M350 134 V146" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="200" y="162" font-size="13" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >length l</text><text x="200" y="97" font-size="13" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >resistivity &#961;</text><text x="200" y="114" font-size="12" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >cross-section area A</text><text x="200" y="200" font-size="22" font-family="sans-serif" fill="#7C5CFF" text-anchor="middle" font-weight="bold" >R = &#961; l / A</text><text x="200" y="40" font-size="14" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >A uniform metal wire</text></svg>