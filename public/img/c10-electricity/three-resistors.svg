<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Three separate resistors of 2, 3 and 6 ohms</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="55.0" y="47.0" width="50" height="26" rx="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><text x="80" y="64.2" font-size="12" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >2 &#937;</text><rect x="175.0" y="47.0" width="50" height="26" rx="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="64.2" font-size="12" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >3 &#937;</text><rect x="295.0" y="47.0" width="50" height="26" rx="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><text x="320" y="64.2" font-size="12" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >6 &#937;</text><text x="200" y="130" font-size="14" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >Three resistors: 2 &#937;, 3 &#937; and 6 &#937;</text><text x="200" y="165" font-size="13" font-family="sans-serif" fill="#6B6F8D" text-anchor="middle" font-weight="bold" >Connect all three in some way</text><text x="200" y="195" font-size="15" font-family="sans-serif" fill="#7C5CFF" text-anchor="middle" font-weight="bold" >to get a total of 4 &#937;</text></svg>