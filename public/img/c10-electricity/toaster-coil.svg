<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A toaster with glowing nichrome coils and a small bar chart comparing the resistivity of copper and nichrome</title><style>.tc{animation:hw 1.2s ease-in-out infinite}@keyframes hw{0%,100%{opacity:.45}50%{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="40" y="60" width="150" height="90" rx="14" fill="#C9CDE8" stroke="#2B2F4A" stroke-width="3" /><rect x="54" y="48" width="122" height="16" rx="6" fill="#7C80A8" stroke="#2B2F4A" stroke-width="3" /><line x1="80" y1="78" x2="80" y2="138" stroke="#E5484D" stroke-width="4" stroke-linecap="round" class="tc"/><line x1="115" y1="78" x2="115" y2="138" stroke="#E5484D" stroke-width="4" stroke-linecap="round" class="tc"/><line x1="150" y1="78" x2="150" y2="138" stroke="#E5484D" stroke-width="4" stroke-linecap="round" class="tc"/><text x="115" y="180" font-size="12" font-family="sans-serif" fill="#E5484D" text-anchor="middle" font-weight="bold" >glowing coil</text><text x="290" y="40" font-size="12" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >Resistivity (&#937; m)</text><line x1="230" y1="160" x2="370" y2="160" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><rect x="250" y="140" width="30" height="20" rx="4" fill="#D9894F" stroke="#2B2F4A" stroke-width="2" /><rect x="320" y="60" width="30" height="100" rx="4" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" /><text x="265" y="178" font-size="11" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >copper</text><text x="335" y="178" font-size="11" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >nichrome</text><text x="265" y="130" font-size="11" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >1.6&#215;10</text><text x="335" y="54" font-size="11" font-family="