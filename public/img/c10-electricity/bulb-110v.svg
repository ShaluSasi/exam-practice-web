<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A bulb rated 220 volts 100 watts glowing dimmer when used on a 110 volt supply</title><style>.dm{animation:dm 2s ease-in-out infinite}@keyframes dm{0%,100%{opacity:.25}50%{opacity:.6}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><circle cx="100" cy="100" r="40" fill="#FFF3B0" stroke="#2B2F4A" stroke-width="3" /><rect x="80" y="138" width="40" height="28" rx="4" fill="#B8BDDC" stroke="#2B2F4A" stroke-width="3" /><text x="100" y="192" font-size="13" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >Rated</text><text x="100" y="210" font-size="13" font-family="sans-serif" fill="#7C5CFF" text-anchor="middle" font-weight="bold" >220 V, 100 W</text><line x1="65" y1="85" x2="135" y2="115" stroke="#2B2F4A" stroke-width="0" stroke-linecap="round" /><circle cx="290" cy="100" r="40" fill="#FFF3B0" stroke="#2B2F4A" stroke-width="3" /><circle cx="290" cy="100" r="56" fill="#FFD166" stroke="none" stroke-width="0" class="dm" opacity=".3"/><rect x="270" y="138" width="40" height="28" rx="4" fill="#B8BDDC" stroke="#2B2F4A" stroke-width="3" /><text x="290" y="192" font-size="13" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >Used on a</text><text x="290" y="210" font-size="13" font-family="sans-serif" fill="#E5484D" text-anchor="middle" font-weight="bold" >110 V supply</text><path d="M175 100 H215" fill="none" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M205 90 L218 100 L205 110" fill="none" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="200" y="40" font-size="14" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >Half the voltage</text></svg>