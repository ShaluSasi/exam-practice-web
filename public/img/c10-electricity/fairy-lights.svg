<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A string of fairy lights that has gone dark because one bulb has fused</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M30 90 Q70 150 110 100 T190 100 T270 100 T350 100 L372 90" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="70" cy="138" r="12" fill="#E9E6DC" stroke="#2B2F4A" stroke-width="3" /><circle cx="130" cy="122" r="12" fill="#E9E6DC" stroke="#2B2F4A" stroke-width="3" /><circle cx="190" cy="118" r="12" fill="#F4C4C4" stroke="#2B2F4A" stroke-width="3" /><circle cx="250" cy="122" r="12" fill="#E9E6DC" stroke="#2B2F4A" stroke-width="3" /><circle cx="310" cy="118" r="12" fill="#E9E6DC" stroke="#2B2F4A" stroke-width="3" /><line x1="180" y1="108" x2="200" y2="128" stroke="#E5484D" stroke-width="3" stroke-linecap="round" /><line x1="200" y1="108" x2="180" y2="128" stroke="#E5484D" stroke-width="3" stroke-linecap="round" /><text x="190" y="160" font-size="14" font-family="sans-serif" fill="#E5484D" text-anchor="middle" font-weight="bold" >one bulb has fused</text><text x="200" y="200" font-size="15" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >The whole string goes dark!</text><text x="200" y="40" font-size="14" font-family="sans-serif" fill="#7C5CFF" text-anchor="middle" font-weight="bold" >Festival fairy lights</text></svg>