<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A torch with two cells and a bulb sending out a beam of light</title><style>.bm{animation:bm 1.6s ease-in-out infinite}@keyframes bm{0%,100%{opacity:.35}50%{opacity:.8}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="40" y="95" width="170" height="50" rx="14" fill="#7C80A8" stroke="#2B2F4A" stroke-width="3" /><rect x="70" y="105" width="50" height="30" rx="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><rect x="125" y="105" width="50" height="30" rx="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><text x="95" y="125" font-size="11" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >cell</text><text x="150" y="125" font-size="11" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >cell</text><rect x="60" y="85" width="18" height="10" rx="4" fill="#B0B4D0" stroke="#2B2F4A" stroke-width="3" /><path d="M210 95 L260 70 V170 L210 145 Z" fill="#C9CDE8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="262" cy="120" r="14" fill="#FFF3B0" stroke="#2B2F4A" stroke-width="3" /><g class="bm"><path d="M276 108 L360 70 V170 L276 132 Z" fill="#FFE08A" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /></g><text x="100" y="190" font-size="12" font-family="sans-serif" fill="#0B93D4" text-anchor="middle" font-weight="bold" >chemical energy</text><text x="250" y="200" font-size="12" font-family="sans-serif" fill="#FF8A1F" text-anchor="middle" font-weight="bold" >light and heat</text><text x="200" y="40" font-size="14" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >Switch on: a torch</text></svg>