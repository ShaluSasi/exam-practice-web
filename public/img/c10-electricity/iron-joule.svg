<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>An electric iron with heat waves rising from its soleplate; resistance 20 ohm and current 5 amperes</title><style>.hv{animation:hv 2s linear infinite}@keyframes hv{0%{transform:translateY(8px);opacity:0}30%{opacity:1}100%{transform:translateY(-22px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M70 170 L330 170 Q350 170 345 150 Q320 100 250 98 L100 98 Q80 98 80 120 L70 150 Z" fill="#B8BDDC" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M120 98 Q125 62 170 62 H210 Q230 62 230 98" fill="none" stroke="#2B2F4A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><rect x="60" y="170" width="290" height="12" rx="5" fill="#7C80A8" stroke="#2B2F4A" stroke-width="3" /><path d="M130 158 q10 -10 0 -20 q-10 -10 0 -20" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="hv" style="animation-delay:0.0s"/><path d="M200 158 q10 -10 0 -20 q-10 -10 0 -20" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="hv" style="animation-delay:0.6s"/><path d="M270 158 q10 -10 0 -20 q-10 -10 0 -20" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="hv" style="animation-delay:1.2s"/><text x="200" y="205" font-size="14" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >Electric iron: R = 20 &#937;, I = 5 A</text><text x="200" y="228" font-size="13" font-family="sans-serif" fill="#FF8A1F" text-anchor="middle" font-weight="bold" >It is switched on for 30 s</text></svg>