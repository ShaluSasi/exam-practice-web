<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Two wires of the same material, one long and thin and one half as long and twice as thick</title><style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="50" y="50" width="140" height="36" rx="6" fill="#E8B07A" stroke="#8A5A2B" stroke-width="3" /><rect x="210" y="36" width="70" height="64" rx="6" fill="#E8B07A" stroke="#8A5A2B" stroke-width="3" /><text x="120" y="40" font-size="12" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >length l</text><text x="245" y="28" font-size="12" font-family="sans-serif" fill="#FF8A1F" text-anchor="middle" font-weight="bold" >length l/2</text><text x="120" y="108" font-size="12" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >area A</text><text x="245" y="118" font-size="12" font-family="sans-serif" fill="#FF8A1F" text-anchor="middle" font-weight="bold" >area 2A</text><text x="120" y="140" font-size="15" font-family="sans-serif" fill="#0B93D4" text-anchor="middle" font-weight="bold" >Wire 1:  R = 4 &#937;</text><text x="245" y="140" font-size="12" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" ></text><text x="310" y="70" font-size="14" font-family="sans-serif" fill="#FF8A1F" text-anchor="middle" font-weight="bold" >Wire 2</text><text x="310" y="90" font-size="16" font-family="sans-serif" fill="#FF8A1F" text-anchor="middle" font-weight="bold" >R = ?</text><text x="200" y="180" font-size="13" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >Same material, same temperature</text></svg>