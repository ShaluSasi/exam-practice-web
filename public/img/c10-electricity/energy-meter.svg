<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A household energy meter with a spinning disc and a kilowatt hour counter</title><style>.dk{animation:dk 3s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes dk{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="110" y="30" width="180" height="170" rx="16" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><rect x="130" y="46" width="140" height="34" rx="4" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" /><text x="200" y="71" font-size="20" font-family="sans-serif" fill="#8CF29A" text-anchor="middle" font-weight="bold" >0 4 2 7 . 5</text><circle cx="200" cy="135" r="30" fill="#F2F2F2" stroke="#2B2F4A" stroke-width="2.5" /><g class="dk"><rect x="196.500" y="108" width="7" height="30" fill="#E5484D"/></g><text x="200" y="188" font-size="13" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >kWh</text><text x="200" y="224" font-size="13" font-family="sans-serif" fill="#0B93D4" text-anchor="middle" font-weight="bold" >Energy meter: 1 unit = 1 kWh</text></svg>