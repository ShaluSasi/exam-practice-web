<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A thick wire being stretched into a longer thinner wire of the same volume</title><style>.st{transform-box:fill-box;transform-origin:left center;animation:st 4s ease-in-out infinite}@keyframes st{0%,25%{transform:scale(1,1)}60%,100%{transform:scale(2,.5)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><g class="st"><rect x="60" y="85" width="100" height="40" rx="6" fill="#E8B07A" stroke="#8A5A2B" stroke-width="3" /></g><line x1="60" y1="150" x2="160" y2="150" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="110" y="172" font-size="13" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >length l, area A</text><text x="110" y="192" font-size="12" font-family="sans-serif" fill="#6B6F8D" text-anchor="middle" font-weight="bold" >(before)</text><text x="280" y="172" font-size="12" font-family="sans-serif" fill="#FF8A1F" text-anchor="middle" font-weight="bold" >stretched: longer, thinner</text><text x="200" y="40" font-size="13" font-family="sans-serif" fill="#2B2F4A" text-anchor="middle" font-weight="bold" >A copper wire is drawn out to twice its length</text><text x="200" y="62" font-size="12" font-family="sans-serif" fill="#6B6F8D" text-anchor="middle" font-weight="bold" >same amount of metal, same material</text><text x="200" y="226" font-size="13" font-family="sans-serif" fill="#7C5CFF" text-anchor="middle" font-weight="bold" >Length becomes 2l; what happens to the area?</text></svg>