<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A bedroom with a squirming sack on the tiled floor</title><style>.a{transform-box:fill-box;transform-origin:center}.wig{animation:wig 1.2s ease-in-out infinite}@keyframes wig{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}.bob{animation:bob 1.8s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.drip{animation:drip 1.4s ease-in infinite}@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(26px);opacity:0}}.sl{animation:sl 3s ease-in-out infinite}@keyframes sl{0%,100%{transform:translateX(0)}50%{transform:translateX(34px)}}.slr{animation:slr 3s ease-in-out infinite}@keyframes slr{0%,100%{transform:translateX(0)}50%{transform:translateX(-34px)}}.pu{animation:pu 1.6s ease-in-out infinite}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.fd{animation:fd 1.8s ease-in-out infinite}@keyframes fd{0%,100%{opacity:1}50%{opacity:.35}}.up{animation:up 2.4s ease-out infinite}@keyframes up{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-26px);opacity:0}}.sp{animation:sp 2.6s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="150" rx="0" fill="#F3E9D6" /><rect x="0" y="150" width="400" height="90" rx="0" fill="#D9CFB8" /><path d="M0 150V240" fill="none" stroke="#BFB398" stroke-width="1.4"/><path d="M40 150V240" fill="none" stroke="#BFB398" stroke-width="1.4"/><path d="M80 150V240" fill="none" stroke="#BFB398" stroke-width="1.4"/><path d="M120 150V240" fill="none" stroke="#BFB398" stroke-width="1.4"/><path d="M160 150V240" fill="none" stroke="#BFB398" stroke-width="1.4"/><path d="M200 150V240" fill="none" stroke="#BFB398" stroke-width="1.4"/><path d="M240 150V240" fill="none" stroke="#BFB398" stroke-width