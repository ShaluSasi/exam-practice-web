<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A bowl overturned and water splashing everywhere beside an otter</title><style>.a{transform-box:fill-box;transform-origin:center}.wig{animation:wig 1.2s ease-in-out infinite}@keyframes wig{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}.bob{animation:bob 1.8s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.drip{animation:drip 1.4s ease-in infinite}@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(26px);opacity:0}}.sl{animation:sl 3s ease-in-out infinite}@keyframes sl{0%,100%{transform:translateX(0)}50%{transform:translateX(34px)}}.slr{animation:slr 3s ease-in-out infinite}@keyframes slr{0%,100%{transform:translateX(0)}50%{transform:translateX(-34px)}}.pu{animation:pu 1.6s ease-in-out infinite}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.fd{animation:fd 1.8s ease-in-out infinite}@keyframes fd{0%,100%{opacity:1}50%{opacity:.35}}.up{animation:up 2.4s ease-out infinite}@keyframes up{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-26px);opacity:0}}.sp{animation:sp 2.6s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="170" width="400" height="70" rx="0" fill="#E8DCC4" /><path d="M0 190q10 -6 20 0t20 0q10 -6 20 0t20 0q10 -6 20 0t20 0q10 -6 20 0t20 0q10 -6 20 0t20 0q10 -6 20 0t20 0q10 -6 20 0t20 0q10 -6 20 0t20 0q10 -6 20 0t20 0q10 -6 20 0t20 0V250H0Z" fill="#0B93D4" opacity="0.3"/><g transform="translate(140 150) scale(1 1)"><g class="a a"><path d="M-34 -10L34 -10L28 30H-28Z" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-34 -10Q0 -2 34 -10" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></g></g><g transform="translate(140 160) scale(1 1)"><g class="a pu"><path d="M-40 0L-80 14M40 0L88 10M-30 20L-70 40M30 20L70 36" fill="none" stroke="#0B93D4" stroke-width="4" stroke-linecap="round"/></g></g><g transform="translate(290 170) scale(0.9 0.9)"><g class="a wig"><path d="M26 0Q52 10 66 -8Q58 20 26 12Z" fill="#6E4529" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="0" cy="0" rx="32" ry="16" fill="#8B5E3C" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="-2" cy="8" rx="22" ry="7" fill="#C9A27A" /><ellipse cx="-14" cy="15" rx="7" ry="5" fill="#6E4529" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="14" cy="15" rx="7" ry="5" fill="#6E4529" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="-32" cy="-6" r="13" fill="#8B5E3C" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="-42" cy="-2" rx="8" ry="6" fill="#C9A27A" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="-48" cy="-4" r="2.6" fill="#2B2F4A" /><circle cx="-35" cy="-10" r="2.2" fill="#2B2F4A" /><circle cx="-25" cy="-17" r="4" fill="#6E4529" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M-45 0L-60 -3M-45 2L-60 5" fill="none" stroke="#2B2F4A" stroke-width="1.2" stroke-linecap="round"/></g></g><g transform="translate(0 0) scale(1 1)"><g class="a up"><circle cx="250" cy="130" r="4" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="320" cy="125" r="4" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="300" cy="108" r="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></g></g><text x="200" y="34" font-family="sans-serif" font-size="14" font-weight