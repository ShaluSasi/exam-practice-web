<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A car speeding along a road with motion lines</title><style>.a{transform-box:fill-box;transform-origin:center}.wig{animation:wig 1.2s ease-in-out infinite}@keyframes wig{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}.bob{animation:bob 1.8s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.drip{animation:drip 1.4s ease-in infinite}@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(26px);opacity:0}}.sl{animation:sl 3s ease-in-out infinite}@keyframes sl{0%,100%{transform:translateX(0)}50%{transform:translateX(34px)}}.slr{animation:slr 3s ease-in-out infinite}@keyframes slr{0%,100%{transform:translateX(0)}50%{transform:translateX(-34px)}}.pu{animation:pu 1.6s ease-in-out infinite}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.fd{animation:fd 1.8s ease-in-out infinite}@keyframes fd{0%,100%{opacity:1}50%{opacity:.35}}.up{animation:up 2.4s ease-out infinite}@keyframes up{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-26px);opacity:0}}.sp{animation:sp 2.6s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="240" rx="0" fill="#E3F2FD" /><rect x="0" y="170" width="400" height="70" rx="0" fill="#9AA3B2" /><path d="M0 205H400" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="20 14"/><g transform="translate(220 195) scale(1.2 1.2)"><g class="a sl"><path d="M-60 0V-22Q-60 -30 -50 -30H-28L-14 -52H34L48 -30H58Q66 -30 66 -22V0Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-10 -30L2 -48H20V-30Z" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="-34" cy="2" r="12" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="40" cy="2" r="12" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></g></g><g transform="translate(0 0) scale(1 1)"><g class="a fd"><path d="M40 160H100M20 180H80M50 200H110" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/></g></g><text x="200" y="34" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2B2F4A">Ten minutes left; the airport is five miles away</text><g transform="translate(0 0) scale(1 1)"><circle cx="0" cy="0" r="4" fill="#F6C453" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></g></svg>