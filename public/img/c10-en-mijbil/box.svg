<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A small wooden travel box with air holes and a torn lining</title><style>.a{transform-box:fill-box;transform-origin:center}.wig{animation:wig 1.2s ease-in-out infinite}@keyframes wig{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}.bob{animation:bob 1.8s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.drip{animation:drip 1.4s ease-in infinite}@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(26px);opacity:0}}.sl{animation:sl 3s ease-in-out infinite}@keyframes sl{0%,100%{transform:translateX(0)}50%{transform:translateX(34px)}}.slr{animation:slr 3s ease-in-out infinite}@keyframes slr{0%,100%{transform:translateX(0)}50%{transform:translateX(-34px)}}.pu{animation:pu 1.6s ease-in-out infinite}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.fd{animation:fd 1.8s ease-in-out infinite}@keyframes fd{0%,100%{opacity:1}50%{opacity:.35}}.up{animation:up 2.4s ease-out infinite}@keyframes up{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-26px);opacity:0}}.sp{animation:sp 2.6s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="170" width="400" height="70" rx="0" fill="#E8DCC4" /><g transform="translate(130 110) scale(2.0 2.0)"><rect x="0" y="0" width="70" height="56" rx="4" fill="#C58B4E" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M0 14H70" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="14" cy="30" r="2.6" fill="#2B2F4A" /><circle cx="28" cy="30" r="2.6" fill="#2B2F4A" /><circle cx="42" cy="30" r="2.6" fill="#2B2F4A" /><circle cx="56" cy="30" r="2.6" fill="#2B2F4A" /><rect x="24" y="0" width="22" height="10" rx="2" fill="#9A6B38" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M0 0L-10 -18L56 -18L70 0Z" fill="#D9A066" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M10 10Q35 22 60 10" stroke="#E5484D" stroke-width="3" fill="none" stroke-dasharray="5 4"/></g><g transform="translate(0 0) scale(1 1)"><path d="M170 190q-10 6 -26 0M250 200q10 -6 26 0" stroke="#2B2F4A" stroke-width="2.5" fill="none"/></g><text x="200" y="34" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#2B2F4A">A box, 18 inches square, with air holes</text></svg>