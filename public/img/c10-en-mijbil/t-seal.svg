<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A seal</title><style>.a{transform-box:fill-box;transform-origin:center}.wig{animation:wig 1.2s ease-in-out infinite}@keyframes wig{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}.bob{animation:bob 1.8s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.drip{animation:drip 1.4s ease-in infinite}@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(26px);opacity:0}}.sl{animation:sl 3s ease-in-out infinite}@keyframes sl{0%,100%{transform:translateX(0)}50%{transform:translateX(34px)}}.slr{animation:slr 3s ease-in-out infinite}@keyframes slr{0%,100%{transform:translateX(0)}50%{transform:translateX(-34px)}}.pu{animation:pu 1.6s ease-in-out infinite}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.fd{animation:fd 1.8s ease-in-out infinite}@keyframes fd{0%,100%{opacity:1}50%{opacity:.35}}.up{animation:up 2.4s ease-out infinite}@keyframes up{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-26px);opacity:0}}.sp{animation:sp 2.6s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#EAF4FB"/><rect x="0" y="110" width="200" height="40" rx="0" fill="#BFD9A5" /><path d="M0 112q10 -4 20 0t20 0q10 -4 20 0t20 0q10 -4 20 0t20 0q10 -4 20 0t20 0q10 -4 20 0t20 0V172H0Z" fill="#0B93D4" opacity="0.4"/><g transform="translate(100 90) scale(0.9 0.9)"><path d="M-34 0Q-30 -26 -8 -24Q20 -22 36 6Q44 16 56 8Q54 24 34 20Q4 22 -24 18Q-38 14 -34 0Z" fill="#7F95A8" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="0" cy="16" rx="18" ry="6" fill="#9FB3C4" /><circle cx="-22" cy="-14" r="2" fill="#2B2F4A" /><circle cx="-32" cy="-8" r="3" fill="#2B2F4A" /><path d="M-18 6Q-10 20 0 14" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></g></svg>