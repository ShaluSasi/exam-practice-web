<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A hot sunny day</title><style>.a{transform-box:fill-box;transform-origin:center}.wig{animation:wig 1.2s ease-in-out infinite}@keyframes wig{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}.bob{animation:bob 1.8s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.drip{animation:drip 1.4s ease-in infinite}@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(26px);opacity:0}}.sl{animation:sl 3s ease-in-out infinite}@keyframes sl{0%,100%{transform:translateX(0)}50%{transform:translateX(34px)}}.slr{animation:slr 3s ease-in-out infinite}@keyframes slr{0%,100%{transform:translateX(0)}50%{transform:translateX(-34px)}}.pu{animation:pu 1.6s ease-in-out infinite}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.fd{animation:fd 1.8s ease-in-out infinite}@keyframes fd{0%,100%{opacity:1}50%{opacity:.35}}.up{animation:up 2.4s ease-out infinite}@keyframes up{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-26px);opacity:0}}.sp{animation:sp 2.6s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#EAF4FB"/><rect x="0" y="0" width="200" height="150" rx="0" fill="#E3F2FD" /><circle cx="100" cy="70" r="30" fill="#F6C453" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M140 70L156.0 70.0" fill="none" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round"/><path d="M60 70L44.0 70.0" fill="none" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round"/><path d="M100 110L100.0 126.0" fill="none" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round"/><path d="M100 30L100.0 14.0" fill="none" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round"/><path d="M128 98L139.2 109.19999999999999" fill="none" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round"/><path d="M72 98L60.800000000000004 109.19999999999999" fill="none" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round"/><path d="M128 42L139.2 30.800000000000004" fill="none" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round"/><path d="M72 42L60.800000000000004 30.800000000000004" fill="none" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round"/></svg>