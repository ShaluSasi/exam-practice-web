<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A tiny creature covered in pointed plates of mud, like a small dragon</title><style>.a{transform-box:fill-box;transform-origin:center}.wig{animation:wig 1.2s ease-in-out infinite}@keyframes wig{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}.bob{animation:bob 1.8s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.drip{animation:drip 1.4s ease-in infinite}@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(26px);opacity:0}}.sl{animation:sl 3s ease-in-out infinite}@keyframes sl{0%,100%{transform:translateX(0)}50%{transform:translateX(34px)}}.slr{animation:slr 3s ease-in-out infinite}@keyframes slr{0%,100%{transform:translateX(0)}50%{transform:translateX(-34px)}}.pu{animation:pu 1.6s ease-in-out infinite}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.fd{animation:fd 1.8s ease-in-out infinite}@keyframes fd{0%,100%{opacity:1}50%{opacity:.35}}.up{animation:up 2.4s ease-out infinite}@keyframes up{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-26px);opacity:0}}.sp{animation:sp 2.6s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="170" width="400" height="70" rx="0" fill="#D9CFB8" /><text x="200" y="34" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#2B2F4A">The creature that came out of the sack</text><g transform="translate(230 150) scale(2.0 2.0)"><g class="a bob"><ellipse cx="0" cy="0" rx="32" ry="16" fill="#8A7355" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M26 0Q52 10 66 -8Q58 20 26 12Z" fill="#7A6446" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="-32" cy="-6" r="13" fill="#8A7355" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="-42" cy="-2" rx="8" ry="6" fill="#9A845F" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="-48" cy="-4" r="2.6" fill="#2B2F4A" /><circle cx="-35" cy="-10" r="2.2" fill="#2B2F4A" /><path d="M-27 -14L-21 -22L-15 -14" stroke="#2B2F4A" stroke-width="2" fill="#6F5A3A"/><path d="M-19 -14L-13 -22L-7 -14" stroke="#2B2F4A" stroke-width="2" fill="#6F5A3A"/><path d="M-11 -14L-5 -22L1 -14" stroke="#2B2F4A" stroke-width="2" fill="#6F5A3A"/><path d="M-3 -14L3 -22L9 -14" stroke="#2B2F4A" stroke-width="2" fill="#6F5A3A"/><path d="M5 -14L11 -22L17 -14" stroke="#2B2F4A" stroke-width="2" fill="#6F5A3A"/><path d="M13 -14L19 -22L25 -14" stroke="#2B2F4A" stroke-width="2" fill="#6F5A3A"/><path d="M21 -14L27 -22L33 -14" stroke="#2B2F4A" stroke-width="2" fill="#6F5A3A"/></g></g><g transform="translate(0 0) scale(1 1)"><g class="a fd"><path d="M110 84L112 88L116 90L112 92L110 96L108 92L104 90L108 88Z" fill="#F6C453" /><path d="M330 104L332 108L336 110L332 112L330 116L328 112L324 110L328 108Z" fill="#F6C453" /></g></g><path d="M40 150q20 -20 40 0t40 0" stroke="#9A845F" stroke-width="3" fill="none"/></svg>