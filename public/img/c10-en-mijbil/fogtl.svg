<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Fog drifting in over a city and drifting away again</title><style>.a{transform-box:fill-box;transform-origin:center}.wig{animation:wig 1.2s ease-in-out infinite}@keyframes wig{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}.bob{animation:bob 1.8s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.drip{animation:drip 1.4s ease-in infinite}@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(26px);opacity:0}}.sl{animation:sl 3s ease-in-out infinite}@keyframes sl{0%,100%{transform:translateX(0)}50%{transform:translateX(34px)}}.slr{animation:slr 3s ease-in-out infinite}@keyframes slr{0%,100%{transform:translateX(0)}50%{transform:translateX(-34px)}}.pu{animation:pu 1.6s ease-in-out infinite}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.fd{animation:fd 1.8s ease-in-out infinite}@keyframes fd{0%,100%{opacity:1}50%{opacity:.35}}.up{animation:up 2.4s ease-out infinite}@keyframes up{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-26px);opacity:0}}.sp{animation:sp 2.6s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="240" rx="0" fill="#C9D3E0" /><rect x="0" y="170" width="400" height="70" rx="0" fill="#6E8CA8" /><rect x="250" y="112" width="24" height="60" rx="0" fill="#5B6275" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="255" y="122" width="5" height="6" rx="0" fill="#F6C453" /><rect x="255" y="138" width="5" height="6" rx="0" fill="#F6C453" /><rect x="255" y="154" width="5" height="6" rx="0" fill="#F6C453" /><rect x="280" y="82" width="30" height="90" rx="0" fill="#5B6275" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="285" y="92" width="5" height="6" rx="0" fill="#F6C453" /><rect x="285" y="108" width="5" height="6" rx="0" fill="#F6C453" /><rect x="285" y="124" width="5" height="6" rx="0" fill="#F6C453" /><rect x="310" y="122" width="22" height="50" rx="0" fill="#5B6275" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="315" y="132" width="5" height="6" rx="0" fill="#F6C453" /><rect x="315" y="148" width="5" height="6" rx="0" fill="#F6C453" /><rect x="315" y="164" width="5" height="6" rx="0" fill="#F6C453" /><rect x="340" y="96" width="34" height="76" rx="0" fill="#5B6275" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="345" y="106" width="5" height="6" rx="0" fill="#F6C453" /><rect x="345" y="122" width="5" height="6" rx="0" fill="#F6C453" /><rect x="345" y="138" width="5" height="6" rx="0" fill="#F6C453" /><rect x="370" y="128" width="26" height="44" rx="0" fill="#5B6275" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="375" y="138" width="5" height="6" rx="0" fill="#F6C453" /><rect x="375" y="154" width="5" height="6" rx="0" fill="#F6C453" /><rect x="375" y="170" width="5" height="6" rx="0" fill="#F6C453" /><g transform="translate(0 0) scale(1 1)"><g class="a sl"><ellipse cx="100" cy="110" rx="50" ry="22" fill="#F4F6FA" /><ellipse cx="130" cy="96" rx="36" ry="20" fill="#F4F6FA" /></g></g><g transform="translate(0 0) scale(1 1)"><g class="a slr"><ellipse cx="320" cy="90" rx="40" ry="16" fill="#F4F6FA" /><ellipse cx="300" cy="84" rx="30" ry="14" fill="#F4F6FA" /></g></g><text x="200" y="36" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#2B2F4A">comes ... sits ... moves on</text></svg>