<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>An otter sitting far away with its back turned</title><style>.a{transform-box:fill-box;transform-origin:center}.wig{animation:wig 1.2s ease-in-out infinite}@keyframes wig{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}.bob{animation:bob 1.8s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.drip{animation:drip 1.4s ease-in infinite}@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(26px);opacity:0}}.sl{animation:sl 3s ease-in-out infinite}@keyframes sl{0%,100%{transform:translateX(0)}50%{transform:translateX(34px)}}.slr{animation:slr 3s ease-in-out infinite}@keyframes slr{0%,100%{transform:translateX(0)}50%{transform:translateX(-34px)}}.pu{animation:pu 1.6s ease-in-out infinite}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.fd{animation:fd 1.8s ease-in-out infinite}@keyframes fd{0%,100%{opacity:1}50%{opacity:.35}}.up{animation:up 2.4s ease-out infinite}@keyframes up{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-26px);opacity:0}}.sp{animation:sp 2.6s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#EAF4FB"/><rect x="0" y="110" width="200" height="40" rx="0" fill="#BFD9A5" /><g transform="translate(40 128) scale(1.0 1.0)"><rect x="-9" y="-6" width="8" height="24" rx="3" fill="#3A4A7A" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="1" y="-6" width="8" height="24" rx="3" fill="#3A4A7A" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="-13" y="-34" width="26" height="30" rx="9" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M-12 -26L-16 -6M12 -26L16 -6" fill="none" stroke="#FF8A1F" stroke-width="7" stroke-linecap="round"/><circle cx="0" cy="-46" r="11" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="-4" cy="-46" r="1.4" fill="#2B2F4A" /><circle cx="4" cy="-46" r="1.4" fill="#2B2F4A" /><path d="M-3 -41Q0 -39 3 -41" fill="none" stroke="#2B2F4A" stroke-width="1.4" stroke-linecap="round"/><path d="M-11 -48Q-10 -62 0 -60Q11 -62 11 -48Q4 -54 -11 -48Z" fill="#4B3621" /></g><g transform="translate(158 126) scale(0.6 0.6)"><path d="M26 -4Q50 -10 64 6Q50 -4 26 6Z" fill="#6E4529" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="0" cy="0" rx="32" ry="15" fill="#C9A27A" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="0" cy="6" rx="24" ry="6" fill="#E3C9A5" /><circle cx="-32" cy="0" r="12" fill="#8B5E3C" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="-36" cy="-3" r="2" fill="#2B2F4A" /><ellipse cx="-42" cy="3" rx="6" ry="4.5" fill="#C9A27A" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="-47" cy="2" r="2.2" fill="#2B2F4A" /><circle cx="-25" cy="-9" r="3.6" fill="#6E4529" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="-14" cy="-16" rx="5" ry="7" fill="#6E4529" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="14" cy="-16" rx="5" ry="7" fill="#6E4529" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></g></svg>