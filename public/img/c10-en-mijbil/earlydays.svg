<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A five-step timeline of Mij's first days</title><style>.a{transform-box:fill-box;transform-origin:center}.wig{animation:wig 1.2s ease-in-out infinite}@keyframes wig{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}.bob{animation:bob 1.8s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.drip{animation:drip 1.4s ease-in infinite}@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(26px);opacity:0}}.sl{animation:sl 3s ease-in-out infinite}@keyframes sl{0%,100%{transform:translateX(0)}50%{transform:translateX(34px)}}.slr{animation:slr 3s ease-in-out infinite}@keyframes slr{0%,100%{transform:translateX(0)}50%{transform:translateX(-34px)}}.pu{animation:pu 1.6s ease-in-out infinite}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.fd{animation:fd 1.8s ease-in-out infinite}@keyframes fd{0%,100%{opacity:1}50%{opacity:.35}}.up{animation:up 2.4s ease-out infinite}@keyframes up{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-26px);opacity:0}}.sp{animation:sp 2.6s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M30 110H370" fill="none" stroke="#FF8A1F" stroke-width="5" stroke-linecap="round"/><circle cx="44" cy="110" r="14" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="44" y="115" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2B2F4A">1</text><text x="44" y="74" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2B2F4A">Sack</text><text x="44" y="152" font-family="sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#2B2F4A">opens</text><circle cx="122" cy="110" r="14" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="122" y="115" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2B2F4A">2</text><text x="122" y="74" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2B2F4A">Day 1</text><text x="122" y="152" font-family="sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#2B2F4A">aloof</text><circle cx="200" cy="110" r="14" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="200" y="115" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2B2F4A">3</text><text x="200" y="74" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2B2F4A">Night 2</text><text x="200" y="152" font-family="sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#2B2F4A">on the bed</text><circle cx="278" cy="110" r="14" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="278" y="115" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2B2F4A">4</text><text x="278" y="74" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2B2F4A">Bath</text><text x="278" y="152" font-family="sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#2B2F4A">wild with joy</text><circle cx="356" cy="110" r="14" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="356" y="115" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2B2F4A">5</text><text x="356" y="74" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2B2F4A">Day 3</text><text x="356" y="152" font-family="sans-serif" font-size="11" font-weight="500" text-anchor="middle" fill="#2B2F4A">works tap</text><g transform="translate(44 200) scale(1 1)"></g><g transform="translate(200 215) scale(0.5 0.5)"><g class="a sl"><path d="M26 0Q52 10 66 -8Q58 20 26 12Z" fill="#6E4529" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="0" cy="0" rx="32" ry="16" fill="#8B5E3C" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="-2" cy="8" rx="22" ry="7" fill="#C9A27A" /><ellipse cx="-14" cy="15" rx="7" ry="5" fill="#6E4529" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="14" cy="15" rx="7" ry="5" fill="#6E4529" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="-32" cy="-6" r="13" fill="#8B5E3C" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="-42" cy="-2" rx="8" ry="6" fill="#C9A27A" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="-48" cy="-4" r="2.6" fill="#2B2F4A" /><circle cx="-35" cy="-10" r="2.2" fill="#2B2F4A" /><circle cx="-25" cy="-17" r="4" fill="#6E4529" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M-45 0L-60 -3M-45 2L-60 5" fill="none" stroke="#2B2F4A" stroke-width="1.2" stroke-linecap="round"/></g></g></svg>