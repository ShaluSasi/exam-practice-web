<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A poem card with the title Fog and the poet name</title><style>.a{transform-box:fill-box;transform-origin:center}.wig{animation:wig 1.2s ease-in-out infinite}@keyframes wig{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}.bob{animation:bob 1.8s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.drip{animation:drip 1.4s ease-in infinite}@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(26px);opacity:0}}.sl{animation:sl 3s ease-in-out infinite}@keyframes sl{0%,100%{transform:translateX(0)}50%{transform:translateX(34px)}}.slr{animation:slr 3s ease-in-out infinite}@keyframes slr{0%,100%{transform:translateX(0)}50%{transform:translateX(-34px)}}.pu{animation:pu 1.6s ease-in-out infinite}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.fd{animation:fd 1.8s ease-in-out infinite}@keyframes fd{0%,100%{opacity:1}50%{opacity:.35}}.up{animation:up 2.4s ease-out infinite}@keyframes up{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-26px);opacity:0}}.sp{animation:sp 2.6s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#E7ECF3"/><rect x="60" y="20" width="280" height="200" rx="14" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="200" y="70" font-family="sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#2B2F4A">Fog</text><path d="M150 84H250" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="200" y="120" font-family="sans-serif" font-size="14" font-weight="500" text-anchor="middle" fill="#2B2F4A">on little cat feet</text><text x="200" y="142" font-family="sans-serif" font-size="13" font-weight="500" text-anchor="middle" fill="#2B2F4A">looking over harbour and city</text><text x="200" y="198" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#0B93D4">A poem by Carl Sandburg</text><g transform="translate(0 0) scale(1 1)"><g class="a sl"><ellipse cx="60" cy="60" rx="26" ry="10" fill="#DDE3EA" /><ellipse cx="340" cy="180" rx="30" ry="10" fill="#DDE3EA" /></g></g></svg>