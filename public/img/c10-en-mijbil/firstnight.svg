<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>An otter sleeping on the floor far from the bed</title><style>.a{transform-box:fill-box;transform-origin:center}.wig{animation:wig 1.2s ease-in-out infinite}@keyframes wig{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}.bob{animation:bob 1.8s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.drip{animation:drip 1.4s ease-in infinite}@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(26px);opacity:0}}.sl{animation:sl 3s ease-in-out infinite}@keyframes sl{0%,100%{transform:translateX(0)}50%{transform:translateX(34px)}}.slr{animation:slr 3s ease-in-out infinite}@keyframes slr{0%,100%{transform:translateX(0)}50%{transform:translateX(-34px)}}.pu{animation:pu 1.6s ease-in-out infinite}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.fd{animation:fd 1.8s ease-in-out infinite}@keyframes fd{0%,100%{opacity:1}50%{opacity:.35}}.up{animation:up 2.4s ease-out infinite}@keyframes up{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-26px);opacity:0}}.sp{animation:sp 2.6s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="150" rx="0" fill="#F3E9D6" /><rect x="0" y="150" width="400" height="90" rx="0" fill="#D9CFB8" /><rect x="250" y="100" width="130" height="56" rx="8" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="250" y="84" width="130" height="30" rx="8" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="256" y="92" width="34" height="16" rx="6" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><g transform="translate(80 200) scale(0.9 0.9)"><g class="a bob"><path d="M26 0Q52 10 66 -8Q58 20 26 12Z" fill="#6E4529" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="0" cy="0" rx="32" ry="16" fill="#8B5E3C" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="-2" cy="8" rx="22" ry="7" fill="#C9A27A" /><ellipse cx="-14" cy="15" rx="7" ry="5" fill="#6E4529" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="14" cy="15" rx="7" ry="5" fill="#6E4529" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="-32" cy="-6" r="13" fill="#8B5E3C" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="-42" cy="-2" rx="8" ry="6" fill="#C9A27A" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="-48" cy="-4" r="2.6" fill="#2B2F4A" /><circle cx="-35" cy="-10" r="2.2" fill="#2B2F4A" /><circle cx="-25" cy="-17" r="4" fill="#6E4529" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M-45 0L-60 -3M-45 2L-60 5" fill="none" stroke="#2B2F4A" stroke-width="1.2" stroke-linecap="round"/></g></g><g transform="translate(0 0) scale(1 1)"><g class="a up"><text x="76" y="166" font-family="sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#0B93D4">z</text><text x="92" y="152" font-family="sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#0B93D4">Z</text></g></g><path d="M120 215H245" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-dasharray="3 8"/><text x="185" y="236" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#2B2F4A">far from the bed</text></svg>