<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A cat</title><style>.a{transform-box:fill-box;transform-origin:center}.wig{animation:wig 1.2s ease-in-out infinite}@keyframes wig{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}.bob{animation:bob 1.8s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.drip{animation:drip 1.4s ease-in infinite}@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(26px);opacity:0}}.sl{animation:sl 3s ease-in-out infinite}@keyframes sl{0%,100%{transform:translateX(0)}50%{transform:translateX(34px)}}.slr{animation:slr 3s ease-in-out infinite}@keyframes slr{0%,100%{transform:translateX(0)}50%{transform:translateX(-34px)}}.pu{animation:pu 1.6s ease-in-out infinite}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.fd{animation:fd 1.8s ease-in-out infinite}@keyframes fd{0%,100%{opacity:1}50%{opacity:.35}}.up{animation:up 2.4s ease-out infinite}@keyframes up{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-26px);opacity:0}}.sp{animation:sp 2.6s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#EAF4FB"/><rect x="0" y="110" width="200" height="40" rx="0" fill="#BFD9A5" /><g transform="translate(110 92) scale(0.9 0.9)"><path d="M24 4Q50 8 46 -20" fill="none" stroke="#9AA0B5" stroke-width="7" stroke-linecap="round"/><ellipse cx="0" cy="0" rx="26" ry="14" fill="#9AA0B5" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="-18" y="8" width="7" height="14" rx="3" fill="#9AA0B5" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="10" y="8" width="7" height="14" rx="3" fill="#9AA0B5" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M-38 -18L-34 -34L-26 -20Z" fill="#9AA0B5" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M-20 -18L-16 -34L-10 -18Z" fill="#9AA0B5" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="-28" cy="-8" r="14" fill="#9AA0B5" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="-33" cy="-10" r="2" fill="#2B2F4A" /><circle cx="-23" cy="-10" r="2" fill="#2B2F4A" /><path d="M-28 -5L-30 -2M-28 -5L-26 -2" fill="none" stroke="#2B2F4A" stroke-width="1.4"/><path d="M-40 -4L-50 -6M-40 0L-50 2" fill="none" stroke="#2B2F4A" stroke-width="1.2"/></g></svg>