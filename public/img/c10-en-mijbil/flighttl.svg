<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A timeline strip about the journey to the aircraft</title><style>.a{transform-box:fill-box;transform-origin:center}.wig{animation:wig 1.2s ease-in-out infinite}@keyframes wig{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}.bob{animation:bob 1.8s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.drip{animation:drip 1.4s ease-in infinite}@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(26px);opacity:0}}.sl{animation:sl 3s ease-in-out infinite}@keyframes sl{0%,100%{transform:translateX(0)}50%{transform:translateX(34px)}}.slr{animation:slr 3s ease-in-out infinite}@keyframes slr{0%,100%{transform:translateX(0)}50%{transform:translateX(-34px)}}.pu{animation:pu 1.6s ease-in-out infinite}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.fd{animation:fd 1.8s ease-in-out infinite}@keyframes fd{0%,100%{opacity:1}50%{opacity:.35}}.up{animation:up 2.4s ease-out infinite}@keyframes up{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-26px);opacity:0}}.sp{animation:sp 2.6s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M30 110H370" fill="none" stroke="#0B93D4" stroke-width="5" stroke-linecap="round"/><circle cx="48" cy="110" r="15" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="48" y="115" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2B2F4A">1</text><text x="48" y="76" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2B2F4A">Mij in box</text><circle cx="124" cy="110" r="15" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="124" y="115" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2B2F4A">2</text><text x="124" y="76" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2B2F4A">Rushed to plane</text><circle cx="200" cy="110" r="15" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="200" y="115" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2B2F4A">3</text><text x="200" y="76" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2B2F4A">Fish to hostess</text><circle cx="276" cy="110" r="15" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="276" y="115" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2B2F4A">4</text><text x="276" y="76" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2B2F4A">Mij bolts</text><circle cx="352" cy="110" r="15" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="352" y="115" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2B2F4A">5</text><text x="352" y="76" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2B2F4A">Back on knee</text><g transform="translate(200 190) scale(0.7 0.7)"><g class="a slr"><path d="M-70 0Q-70 -18 -40 -18H46Q76 -14 80 0Q76 12 46 12H-40Q-70 12 -70 0Z" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M-70 -2L-86 -30L-66 -30L-52 -14Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M-10 8L-34 38H-14L22 8Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="-40" cy="-5" r="4" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="-20" cy="-5" r="4" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="0" cy="-5" r="4" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="20" cy="-5" r="4" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="40" cy="-5" r="4" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="60" cy="-5" r="4" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M52 -4H78" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></g></g></svg>