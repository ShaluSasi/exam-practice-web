<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A dog</title><style>.a{transform-box:fill-box;transform-origin:center}.wig{animation:wig 1.2s ease-in-out infinite}@keyframes wig{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}.bob{animation:bob 1.8s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.drip{animation:drip 1.4s ease-in infinite}@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(26px);opacity:0}}.sl{animation:sl 3s ease-in-out infinite}@keyframes sl{0%,100%{transform:translateX(0)}50%{transform:translateX(34px)}}.slr{animation:slr 3s ease-in-out infinite}@keyframes slr{0%,100%{transform:translateX(0)}50%{transform:translateX(-34px)}}.pu{animation:pu 1.6s ease-in-out infinite}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.fd{animation:fd 1.8s ease-in-out infinite}@keyframes fd{0%,100%{opacity:1}50%{opacity:.35}}.up{animation:up 2.4s ease-out infinite}@keyframes up{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-26px);opacity:0}}.sp{animation:sp 2.6s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#EAF4FB"/><rect x="0" y="110" width="200" height="40" rx="0" fill="#BFD9A5" /><g transform="translate(110 95) scale(0.9 0.9)"><path d="M26 -2Q40 -12 38 -22" fill="none" stroke="#6E4529" stroke-width="6" stroke-linecap="round"/><ellipse cx="0" cy="0" rx="28" ry="14" fill="#D9A066" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="-20" y="8" width="7" height="16" rx="3" fill="#D9A066" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="12" y="8" width="7" height="16" rx="3" fill="#D9A066" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="-30" cy="-10" r="12" fill="#D9A066" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="-22" cy="-8" rx="4.5" ry="10" fill="#8B5E3C" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="-40" cy="-6" rx="8" ry="6" fill="#EBC48F" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="-46" cy="-8" r="2.5" fill="#2B2F4A" /><circle cx="-33" cy="-13" r="2" fill="#2B2F4A" /></g></svg>