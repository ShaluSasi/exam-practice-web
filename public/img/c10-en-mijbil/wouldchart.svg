<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A chart: actions take would or used to, states take only used to</title><style>.a{transform-box:fill-box;transform-origin:center}.wig{animation:wig 1.2s ease-in-out infinite}@keyframes wig{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}.bob{animation:bob 1.8s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.drip{animation:drip 1.4s ease-in infinite}@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(26px);opacity:0}}.sl{animation:sl 3s ease-in-out infinite}@keyframes sl{0%,100%{transform:translateX(0)}50%{transform:translateX(34px)}}.slr{animation:slr 3s ease-in-out infinite}@keyframes slr{0%,100%{transform:translateX(0)}50%{transform:translateX(-34px)}}.pu{animation:pu 1.6s ease-in-out infinite}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.fd{animation:fd 1.8s ease-in-out infinite}@keyframes fd{0%,100%{opacity:1}50%{opacity:.35}}.up{animation:up 2.4s ease-out infinite}@keyframes up{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-26px);opacity:0}}.sp{animation:sp 2.6s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="20" y="40" width="170" height="150" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="210" y="40" width="170" height="150" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="105" y="68" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#3FA34D">Repeated ACTION</text><text x="295" y="68" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#E5484D">STATE / situation</text><text x="105" y="100" font-family="sans-serif" font-size="12" font-weight="500" text-anchor="middle" fill="#2B2F4A">did something</text><text x="105" y="118" font-family="sans-serif" font-size="12" font-weight="500" text-anchor="middle" fill="#2B2F4A">again and again</text><text x="105" y="150" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2B2F4A">would or used to?</text><text x="295" y="100" font-family="sans-serif" font-size="12" font-weight="500" text-anchor="middle" fill="#2B2F4A">how things were</text><text x="295" y="118" font-family="sans-serif" font-size="12" font-weight="500" text-anchor="middle" fill="#2B2F4A">for a long time</text><text x="295" y="150" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#2B2F4A">would or used to?</text><text x="200" y="24" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#2B2F4A">Habits in the past</text><g transform="translate(100 220) scale(0.45 0.45)"><g class="a sl"><path d="M26 0Q52 10 66 -8Q58 20 26 12Z" fill="#6E4529" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="0" cy="0" rx="32" ry="16" fill="#8B5E3C" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="-2" cy="8" rx="22" ry="7" fill="#C9A27A" /><ellipse cx="-14" cy="15" rx="7" ry="5" fill="#6E4529" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="14" cy="15" rx="7" ry="5" fill="#6E4529" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="-32" cy="-6" r="13" fill="#8B5E3C" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="-42" cy="-2" rx="8" ry="6" fill="#C9A27A" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="-48" cy="-4" r="2.6" fill="#2B2F4A" /><circle cx="-35" cy="-10" r="2.2" fill="#2B2F4A" /><circle cx="-25" cy="-17" r="4" fill="#6E4529" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M-45 0L-60 -3M-45 2L-60 5" fill="none" stroke="#2B2F4A" stroke-width="1.2" stroke-linecap="round"/></g></g></svg>