<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>Soft grey mist creeping over the ground with small paw-like prints</title><style>.a{transform-box:fill-box;transform-origin:center}.wig{animation:wig 1.2s ease-in-out infinite}@keyframes wig{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}.bob{animation:bob 1.8s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.drip{animation:drip 1.4s ease-in infinite}@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(26px);opacity:0}}.sl{animation:sl 3s ease-in-out infinite}@keyframes sl{0%,100%{transform:translateX(0)}50%{transform:translateX(34px)}}.slr{animation:slr 3s ease-in-out infinite}@keyframes slr{0%,100%{transform:translateX(0)}50%{transform:translateX(-34px)}}.pu{animation:pu 1.6s ease-in-out infinite}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.fd{animation:fd 1.8s ease-in-out infinite}@keyframes fd{0%,100%{opacity:1}50%{opacity:.35}}.up{animation:up 2.4s ease-out infinite}@keyframes up{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-26px);opacity:0}}.sp{animation:sp 2.6s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#EAF4FB"/><rect x="0" y="0" width="200" height="150" rx="0" fill="#C9D3E0" /><rect x="0" y="110" width="200" height="40" rx="0" fill="#8FA6BC" /><ellipse cx="100" cy="100" rx="60" ry="18" fill="#F4F6FA" /><ellipse cx="130" cy="88" rx="36" ry="14" fill="#F4F6FA" /><g transform="translate(40 132) scale(1 1)"><ellipse cx="0" cy="0" rx="9" ry="7" fill="#fff" /><circle cx="-6" cy="-9" r="3" fill="#fff" /><circle cx="0" cy="-9" r="3" fill="#fff" /><circle cx="6" cy="-9" r="3" fill="#fff" /></g><g transform="translate(80 132) scale(1 1)"><ellipse cx="0" cy="0" rx="9" ry="7" fill="#fff" /><circle cx="-6" cy="-9" r="3" fill="#fff" /><circle cx="0" cy="-9" r="3" fill="#fff" /><circle cx="6" cy="-9" r="3" fill="#fff" /></g><g transform="translate(120 132) scale(1 1)"><ellipse cx="0" cy="0" rx="9" ry="7" fill="#fff" /><circle cx="-6" cy="-9" r="3" fill="#fff" /><circle cx="0" cy="-9" r="3" fill="#fff" /><circle cx="6" cy="-9" r="3" fill="#fff" /></g></svg>