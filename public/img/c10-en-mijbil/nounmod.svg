<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Phrases from the story with modifiers before nouns</title><style>.a{transform-box:fill-box;transform-origin:center}.wig{animation:wig 1.2s ease-in-out infinite}@keyframes wig{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}.bob{animation:bob 1.8s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.drip{animation:drip 1.4s ease-in infinite}@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(26px);opacity:0}}.sl{animation:sl 3s ease-in-out infinite}@keyframes sl{0%,100%{transform:translateX(0)}50%{transform:translateX(34px)}}.slr{animation:slr 3s ease-in-out infinite}@keyframes slr{0%,100%{transform:translateX(0)}50%{transform:translateX(-34px)}}.pu{animation:pu 1.6s ease-in-out infinite}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.fd{animation:fd 1.8s ease-in-out infinite}@keyframes fd{0%,100%{opacity:1}50%{opacity:.35}}.up{animation:up 2.4s ease-out infinite}@keyframes up{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-26px);opacity:0}}.sp{animation:sp 2.6s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="20" y="30" width="170" height="76" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="105" y="62" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#2B2F4A">an otter fixation</text><rect x="210" y="30" width="170" height="76" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="295" y="62" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#2B2F4A">the iron railings</text><rect x="20" y="130" width="170" height="76" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="105" y="162" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#2B2F4A">the Tigris marshes</text><rect x="210" y="130" width="170" height="76" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="295" y="162" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#2B2F4A">soft velvet fur</text><text x="200" y="225" font-family="sans-serif" font-size="12" font-weight="500" text-anchor="middle" fill="#2B2F4A">Which kind of word modifies the noun?</text></svg>