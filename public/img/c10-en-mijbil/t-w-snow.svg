<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>Snowflakes falling</title><style>.a{transform-box:fill-box;transform-origin:center}.wig{animation:wig 1.2s ease-in-out infinite}@keyframes wig{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}.bob{animation:bob 1.8s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.drip{animation:drip 1.4s ease-in infinite}@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(26px);opacity:0}}.sl{animation:sl 3s ease-in-out infinite}@keyframes sl{0%,100%{transform:translateX(0)}50%{transform:translateX(34px)}}.slr{animation:slr 3s ease-in-out infinite}@keyframes slr{0%,100%{transform:translateX(0)}50%{transform:translateX(-34px)}}.pu{animation:pu 1.6s ease-in-out infinite}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.fd{animation:fd 1.8s ease-in-out infinite}@keyframes fd{0%,100%{opacity:1}50%{opacity:.35}}.up{animation:up 2.4s ease-out infinite}@keyframes up{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-26px);opacity:0}}.sp{animation:sp 2.6s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#EAF4FB"/><rect x="0" y="0" width="200" height="150" rx="0" fill="#B9CBE0" /><g class="a fd" style="animation-delay:0.0s"><path d="M25 30l0 14M18 37l14 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g><g class="a fd" style="animation-delay:0.3s"><path d="M55 60l0 14M48 67l14 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g><g class="a fd" style="animation-delay:0.6s"><path d="M85 90l0 14M78 97l14 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g><g class="a fd" style="animation-delay:0.8999999999999999s"><path d="M115 30l0 14M108 37l14 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g><g class="a fd" style="animation-delay:1.2s"><path d="M145 60l0 14M138 67l14 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g><g class="a fd" style="animation-delay:1.5s"><path d="M175 90l0 14M168 97l14 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g></svg>