<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A telephone and a telegram form</title><style>.a{transform-box:fill-box;transform-origin:center}.wig{animation:wig 1.2s ease-in-out infinite}@keyframes wig{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}.bob{animation:bob 1.8s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}.drip{animation:drip 1.4s ease-in infinite}@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(26px);opacity:0}}.sl{animation:sl 3s ease-in-out infinite}@keyframes sl{0%,100%{transform:translateX(0)}50%{transform:translateX(34px)}}.slr{animation:slr 3s ease-in-out infinite}@keyframes slr{0%,100%{transform:translateX(0)}50%{transform:translateX(-34px)}}.pu{animation:pu 1.6s ease-in-out infinite}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.fd{animation:fd 1.8s ease-in-out infinite}@keyframes fd{0%,100%{opacity:1}50%{opacity:.35}}.up{animation:up 2.4s ease-out infinite}@keyframes up{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-26px);opacity:0}}.sp{animation:sp 2.6s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="170" width="400" height="70" rx="0" fill="#E8DCC4" /><rect x="40" y="120" width="100" height="50" rx="10" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M52 112Q90 84 128 112" stroke="#E5484D" stroke-width="12" stroke-linecap="round" fill="none"/><circle cx="90" cy="145" r="16" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="90" cy="137" r="2" fill="#2B2F4A" /><circle cx="97" cy="141" r="2" fill="#2B2F4A" /><circle cx="97" cy="149" r="2" fill="#2B2F4A" /><circle cx="90" cy="153" r="2" fill="#2B2F4A" /><circle cx="83" cy="149" r="2" fill="#2B2F4A" /><circle cx="83" cy="141" r="2" fill="#2B2F4A" /><g transform="translate(90 92) scale(1 1)"><g class="a fd"><path d="M-10 0q10 -10 20 0M-18 -8q18 -16 36 0" stroke="#E5484D" stroke-width="3" fill="none"/></g></g><rect x="220" y="92" width="140" height="90" rx="6" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><text x="290" y="118" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#2B2F4A">CABLE</text><path d="M236 134H344M236 148H320M236 162H334" fill="none" stroke="#0B93D4" stroke-width="3"/><g transform="translate(0 0) scale(1 1)"><g class="a fd"><path d="M175 135H208" fill="none" stroke="#FF8A1F" stroke-width="4" stroke-dasharray="6 6"/><path d="M208 128L218 135L208 142" stroke="#FF8A1F" stroke-width="4" fill="none"/></g></g><text x="200" y="34" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#2B2F4A">Messages sent from Basra</text></svg>