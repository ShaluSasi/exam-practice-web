<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img"><title>Farms send raw materials to agro-industries and receive pumps, fertilisers and tools</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#E3F2FD"/><g transform="translate(60 100) scale(1.2)"><g><path d="M-10 26V-24" stroke="#8BC34A" stroke-width="7" stroke-linecap="round"/><path d="M-10 -10L4 -22M-10 0L-24 -12" stroke="#3FA34D" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M0 26V-24" stroke="#8BC34A" stroke-width="7" stroke-linecap="round"/><path d="M0 -10L14 -22M0 0L-14 -12" stroke="#3FA34D" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M10 26V-24" stroke="#8BC34A" stroke-width="7" stroke-linecap="round"/><path d="M10 -10L24 -22M10 0L-4 -12" stroke="#3FA34D" stroke-width="3" fill="none" stroke-linecap="round"/></g></g><g transform="translate(110 100) scale(0.7)"><g><rect x="-4" y="4" width="8" height="22" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-6" r="18" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><rect x="20" y="130" width="140" height="50" rx="10" fill="#CDE9B5" stroke="#2B2F4A" stroke-width="3"/><text x="90" y="160" font-size="13" text-anchor="middle">Farms</text><rect x="240" y="130" width="140" height="50" rx="10" fill="#D9DEE8" stroke="#2B2F4A" stroke-width="3"/><text x="310" y="160" font-size="13" text-anchor="middle">Agro-industries</text><g transform="translate(310 90) scale(1.0)"><g><rect x="-30" y="-6" width="60" height="32" fill="#D9DEE8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-30 -6L-14 -20V-6M-14 -6L2 -20V-6" fill="#D9DEE8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="12" y="-30" width="12" height="36" fill="#C65B3A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-22" y="6" width="9" height="9" fill="#FFE08A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-6" y="6" width="9" height="9" fill="#FFE08A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-4" y="16" width="8" height="10" fill="#2B2F4A"/></g></g><g class="rise" style="animation-delay:0.0s"><circle cx="322" cy="52" r="5" fill="#C9CED8"/></g><g class="rise" style="animation-delay:0.8s"><circle cx="325" cy="52" r="6" fill="#C9CED8"/></g><g class="rise" style="animation-delay:1.6s"><circle cx="328" cy="52" r="7" fill="#C9CED8"/></g><line x1="166" y1="142" x2="234" y2="142" stroke="#3FA34D" stroke-width="4" stroke-linecap="round" class="fl" marker-end="url(#ahg)"/><text x="200" y="130" font-size="10.5" text-anchor="middle" style="fill:#3FA34D">raw materials</text><line x1="234" y1="170" x2="166" y2="170" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round" class="fl" marker-end="url(#aho)"/><text x="200" y="192" font-size="10.5" text-anchor="middle" style="fill:#FF8A1F">pumps, fertilisers, pipes, tools</text></svg>