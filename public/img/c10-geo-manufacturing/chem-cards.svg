<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img"><title>Four cards showing chemical industry products</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200.0" y="22" font-size="13" text-anchor="middle">Chemical industry: some products</text><rect x="12.0" y="42.0" width="182.0" height="87.0" rx="10" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3"/><g transform="translate(103.0 71.6) scale(0.7200000000000001)"><g><rect x="-26" y="-14" width="52" height="38" rx="6" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-26 0Q-13 -6 0 0T26 0V24H-26Z" fill="#7FD0F6"/></g></g><text x="103.0" y="108.0" font-size="10.5" text-anchor="middle">Sulphuric acid</text><text x="103.0" y="121.0" font-size="10.5" text-anchor="middle">nitric acid, alkalies</text><rect x="206.0" y="42.0" width="182.0" height="87.0" rx="10" fill="#FFF3D0" stroke="#2B2F4A" stroke-width="3"/><g transform="translate(297.0 71.6) scale(0.7200000000000001)"><g><path d="M-16 -18Q0 -26 16 -18L20 24H-20Z" fill="#FFF3D0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-10 -2H10M-10 8H10" stroke="#FF8A1F" stroke-width="3"/></g></g><text x="297.0" y="108.0" font-size="10.5" text-anchor="middle">Soda ash</text><text x="297.0" y="121.0" font-size="10.5" text-anchor="middle">caustic soda</text><rect x="12.0" y="141.0" width="182.0" height="87.0" rx="10" fill="#EEF0F6" stroke="#2B2F4A" stroke-width="3"/><g transform="translate(103.0 170.6) scale(0.7200000000000001)"><g><rect x="-28" y="-6" width="26" height="32" rx="6" fill="#D9DEE8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="6" y="-14" width="22" height="40" rx="6" fill="#D9DEE8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-2 8H6" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-24" y="-18" width="8" height="12" fill="#C65B3A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="103.0" y="207.0" font-size="10.5" text-anchor="middle">Petrochemicals</text><text x="103.0" y="220.0" font-size="10.5" text-anchor="middle"></text><rect x="206.0" y="141.0" width="182.0" height="87.0" rx="10" fill="#E8F5E9" stroke="#2B2F4A" stroke-width="3"/><g transform="translate(297.0 170.6) scale(0.7200000000000001)"><g><path d="M-18 14Q-20 -16 14 -18Q18 14 -18 14Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-14 12L8 -10" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="297.0" y="207.0" font-size="10.5" text-anchor="middle">Fertilisers</text><text x="297.0" y="220.0" font-size="10.5" text-anchor="middle"></text></svg>