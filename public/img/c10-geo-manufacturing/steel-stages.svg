<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 190" role="img"><title>Cards for the four stages of making steel</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200.0" y="22" font-size="13" text-anchor="middle">Four stages in making steel</text><rect x="8.0" y="38.0" width="90.0" height="144.0" rx="10" fill="#FFE9E9" stroke="#2B2F4A" stroke-width="3"/><g transform="translate(53.0 87.0) scale(0.6400000000000001)"><g><path d="M-14 -34H14L22 10H-22Z" fill="#E0A38A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-22" y="10" width="44" height="18" fill="#B9BCC8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g class="blk"><path d="M-6 28Q0 14 6 28Z" fill="#FF8A1F" stroke="#E5484D" stroke-width="2"/></g><path d="M0 -34V-44" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="53.0" y="161.0" font-size="9.5" text-anchor="middle">Blast furnace</text><text x="53.0" y="174.0" font-size="9.5" text-anchor="middle"></text><rect x="106.0" y="38.0" width="90.0" height="144.0" rx="10" fill="#EEF0F6" stroke="#2B2F4A" stroke-width="3"/><g transform="translate(151.0 87.0) scale(0.6400000000000001)"><g><rect x="-30" y="4" width="18" height="10" rx="2" fill="#C9CED8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-8" y="-6" width="18" height="10" rx="2" fill="#C9CED8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="14" y="4" width="18" height="10" rx="2" fill="#C9CED8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-30 20H34" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="151.0" y="161.0" font-size="9.5" text-anchor="middle">Pig iron</text><text x="151.0" y="174.0" font-size="9.5" text-anchor="middle"></text><rect x="204.0" y="38.0" width="90.0" height="144.0" rx="10" fill="#FFF3D0" stroke="#2B2F4A" stroke-width="3"/><g transform="translate(249.0 87.0) scale(0.6400000000000001)"><g><path d="M-14 -24H14L24 10Q0 30 -24 10Z" fill="#E0A38A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g class="blk"><path d="M-8 -10Q0 -22 8 -10Z" fill="#FF8A1F"/></g><path d="M22 4L36 -4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="249.0" y="161.0" font-size="9.5" text-anchor="middle">Steel making</text><text x="249.0" y="174.0" font-size="9.5" text-anchor="middle"></text><rect x="302.0" y="38.0" width="90.0" height="144.0" rx="10" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3"/><g transform="translate(347.0 87.0) scale(0.6400000000000001)"><g><circle cx="-14" cy="-10" r="12" fill="#C9CED8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-14" cy="14" r="12" fill="#C9CED8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-6" y="-1" width="40" height="5" fill="#9AA5B8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-40 1H-26" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="347.0" y="161.0" font-size="9.5" text-anchor="middle">Shaping metal</text><text x="347.0" y="174.0" font-size="9.5" text-anchor="middle"></text></svg>