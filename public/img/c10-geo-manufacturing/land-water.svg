<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Rain falling on a waste heap and seeping down to groundwater</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#EAF4FF"/><rect y="190" width="400" height="50" fill="#EADBC0"/><path d="M0 180H400" stroke="none"/><g transform="translate(70 168) scale(1.2)"><g><path d="M-34 24Q-24 -14 0 -16Q24 -14 34 24Z" fill="#B59A7A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-14" y="-4" width="10" height="14" rx="2" fill="#7FD0F6" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="6" y="2" width="14" height="8" fill="#C9CED8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-4 14L8 8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(70 218) scale(0.7)"><g class="fall"><path d="M0 -14Q-12 4 -10 10Q-8 18 0 18Q8 18 10 10Q12 4 0 -14Z" fill="#7FD0F6" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><path d="M30 200H110" stroke="#8B5A2B" stroke-width="3" stroke-dasharray="3 5"/><path d="M180 200H400V240H180Z" fill="#7FD0F6"/><text x="290" y="224" font-size="12" text-anchor="middle">Groundwater</text><g transform="translate(250 60) scale(1.3)"><g><path d="M-24 10Q-34 10 -30 0Q-28 -8 -18 -6Q-14 -20 0 -18Q12 -22 18 -8Q32 -8 30 6Q30 12 22 10Z" fill="#B8BEC9" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-14 18V28" stroke="#0B93D4" stroke-width="4" stroke-linecap="round" class="fall"/><path d="M0 18V28" stroke="#0B93D4" stroke-width="4" stroke-linecap="round" class="fall"/><path d="M14 18V28" stroke="#0B93D4" stroke-width="4" stroke-linecap="round" class="fall"/></g></g><line x1="250" y1="100" x2="250" y2="150" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" class="fl" marker-end="url(#ahb)"/><line x1="250" y1="150" x2="250" y2="196" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" class="fl" marker-end="url(#ahb)"/><g transform="translate(330 160) scale(0.9)"><g><path d="M-34 24Q-24 -14 0 -16Q24 -14 34 24Z" fill="#B59A7A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-14" y="-4" width="10" height="14" rx="2" fill="#7FD0F6" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="6" y="2" width="14" height="8" fill="#C9CED8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-4 14L8 8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg>