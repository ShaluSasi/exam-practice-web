<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img"><title>Cards showing properties and uses of aluminium</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200.0" y="22" font-size="13" text-anchor="middle">Aluminium: properties and uses</text><rect x="12.0" y="42.0" width="117.3" height="87.0" rx="10" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3"/><g transform="translate(70.7 71.6) scale(0.68)"><g><rect x="-14" y="-18" width="28" height="38" rx="5" fill="#C9CED8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-14 -8H14M-14 10H14" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-14 -18Q0 -26 14 -18" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="70.7" y="108.0" font-size="10" text-anchor="middle">Light</text><text x="70.7" y="121.0" font-size="10" text-anchor="middle"></text><rect x="141.3" y="42.0" width="117.3" height="87.0" rx="10" fill="#E8F5E9" stroke="#2B2F4A" stroke-width="3"/><g transform="translate(200.0 71.6) scale(0.68)"><g><path d="M0 -14Q-12 4 -10 10Q-8 18 0 18Q8 18 10 10Q12 4 0 -14Z" fill="#7FD0F6" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="200.0" y="108.0" font-size="10" text-anchor="middle">Resists</text><text x="200.0" y="121.0" font-size="10" text-anchor="middle">corrosion</text><rect x="270.7" y="42.0" width="117.3" height="87.0" rx="10" fill="#FFF3D0" stroke="#2B2F4A" stroke-width="3"/><g transform="translate(329.3 71.6) scale(0.68)"><g><path d="M0 -20L6 -6L20 0L6 6L0 20L-6 6L-20 0L-6 -6Z" fill="#FFD84D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="329.3" y="108.0" font-size="10" text-anchor="middle">Good conductor</text><text x="329.3" y="121.0" font-size="10" text-anchor="middle">of heat</text><rect x="12.0" y="141.0" width="117.3" height="87.0" rx="10" fill="#FDE7EF" stroke="#2B2F4A" stroke-width="3"/><g transform="translate(70.7 170.6) scale(0.68)"><g><path d="M-32 14Q-16 -22 0 8T32 -12" fill="none" stroke="#2B2F4A" stroke-width="9" stroke-linecap="round"/><path d="M-32 14Q-16 -22 0 8T32 -12" fill="none" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round"/></g></g><text x="70.7" y="207.0" font-size="10" text-anchor="middle">Malleable</text><text x="70.7" y="220.0" font-size="10" text-anchor="middle"></text><rect x="141.3" y="141.0" width="117.3" height="87.0" rx="10" fill="#EEF0F6" stroke="#2B2F4A" stroke-width="3"/><g transform="translate(200.0 170.6) scale(0.68)"><g><path d="M-34 4L30 -2L36 2L30 6Z" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-4 0L-18 -20H-8L10 -2M-4 4L-16 24H-6L10 4" fill="#C9CED8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="200.0" y="207.0" font-size="10" text-anchor="middle">Strong when</text><text x="200.0" y="220.0" font-size="10" text-anchor="middle">mixed with metals</text><rect x="270.7" y="141.0" width="117.3" height="87.0" rx="10" fill="#FFE9E9" stroke="#2B2F4A" stroke-width="3"/><g transform="translate(329.3 170.6) scale(0.68)"><g><path d="M-20 -8H20L16 22H-16Z" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="0" cy="-8" rx="20" ry="5" fill="#B7794A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-10 -22Q-14 -14 -8 -14M6 -22Q2 -14 8 -14" stroke="#FF8A1F" stroke-width="3" fill="none" class="rise"/></g></g><text x="329.3" y="207.0" font-size="10" text-anchor="middle">Utensils</text><text x="329.3" y="220.0" font-size="10" text-anchor="middle">and wires</text></svg>