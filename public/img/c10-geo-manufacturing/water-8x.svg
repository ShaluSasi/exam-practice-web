<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" role="img"><title>One drop of waste water becomes eight drops of polluted fresh water</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#E3F2FD"/><text x="200" y="20" font-size="12" text-anchor="middle">1 litre of waste water pollutes 8 litres of fresh water</text><g transform="translate(60 70) scale(1.3)"><g><path d="M0 -14Q-12 4 -10 10Q-8 18 0 18Q8 18 10 10Q12 4 0 -14Z" fill="#7FD0F6" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="100" y="78" font-size="26" style="font-weight:700">→</text><g transform="translate(150 56) scale(0.8)"><g class="bob"><path d="M0 -14Q-12 4 -10 10Q-8 18 0 18Q8 18 10 10Q12 4 0 -14Z" fill="#7FD0F6" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(196 56) scale(0.8)"><g class="bob" style="animation-delay:0.15s"><path d="M0 -14Q-12 4 -10 10Q-8 18 0 18Q8 18 10 10Q12 4 0 -14Z" fill="#7FD0F6" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(242 56) scale(0.8)"><g class="bob" style="animation-delay:0.3s"><path d="M0 -14Q-12 4 -10 10Q-8 18 0 18Q8 18 10 10Q12 4 0 -14Z" fill="#7FD0F6" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(288 56) scale(0.8)"><g class="bob" style="animation-delay:0.44999999999999996s"><path d="M0 -14Q-12 4 -10 10Q-8 18 0 18Q8 18 10 10Q12 4 0 -14Z" fill="#7FD0F6" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(150 100) scale(0.8)"><g class="bob" style="animation-delay:0.6s"><path d="M0 -14Q-12 4 -10 10Q-8 18 0 18Q8 18 10 10Q12 4 0 -14Z" fill="#7FD0F6" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(196 100) scale(0.8)"><g class="bob" style="animation-delay:0.75s"><path d="M0 -14Q-12 4 -10 10Q-8 18 0 18Q8 18 10 10Q12 4 0 -14Z" fill="#7FD0F6" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(242 100) scale(0.8)"><g class="bob" style="animation-delay:0.8999999999999999s"><path d="M0 -14Q-12 4 -10 10Q-8 18 0 18Q8 18 10 10Q12 4 0 -14Z" fill="#7FD0F6" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(288 100) scale(0.8)"><g class="bob" style="animation-delay:1.05s"><path d="M0 -14Q-12 4 -10 10Q-8 18 0 18Q8 18 10 10Q12 4 0 -14Z" fill="#7FD0F6" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="200" y="190" font-size="12" text-anchor="middle" style="fill:#E5484D">25 L of waste water → ? L of fresh water polluted</text></svg>