<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Treatment plant: a screen tank, a tank with microbes, a filter and a pipe returning water to the factory</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#EAF4FF"/><rect y="196" width="400" height="44" fill="#EADBC0"/><g transform="translate(38 98) scale(0.9)"><g><rect x="-30" y="-6" width="60" height="32" fill="#D9DEE8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-30 -6L-14 -20V-6M-14 -6L2 -20V-6" fill="#D9DEE8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="12" y="-30" width="12" height="36" fill="#C65B3A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-22" y="6" width="9" height="9" fill="#FFE08A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-6" y="6" width="9" height="9" fill="#FFE08A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-4" y="16" width="8" height="10" fill="#2B2F4A"/></g></g><g class="rise" style="animation-delay:0.0s"><circle cx="52" cy="50" r="5" fill="#C9CED8"/></g><g class="rise" style="animation-delay:0.8s"><circle cx="55" cy="50" r="6" fill="#C9CED8"/></g><g transform="translate(100 168) scale(1.1)"><g><rect x="-26" y="-14" width="52" height="38" rx="6" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -14V24" stroke="#2B2F4A" stroke-width="3"/><path d="M0 -14V24" stroke="#2B2F4A" stroke-width="3"/><path d="M8 -14V24" stroke="#2B2F4A" stroke-width="3"/><path d="M-26 0H-8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(190 168) scale(1.1)"><g><rect x="-26" y="-14" width="52" height="38" rx="6" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-26 0Q-13 -6 0 0T26 0V24H-26Z" fill="#7FD0F6"/></g></g><g transform="translate(190 168) scale(1.0)"><g><ellipse cx="-12" cy="14" rx="7" ry="4" fill="#B39DFF" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="4" cy="8" rx="7" ry="4" fill="#B39DFF" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="14" cy="16" rx="7" ry="4" fill="#B39DFF" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(290 160) scale(1.0)"><g><rect x="-14" y="-30" width="28" height="56" rx="6" fill="#D9DEE8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-14 -14H14" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-14 0H14" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-14 14H14" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><line x1="62" y1="192" x2="76" y2="192" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" class="fl" marker-end="url(#ahb)"/><line x1="126" y1="192" x2="160" y2="192" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" class="fl" marker-end="url(#ahb)"/><line x1="216" y1="192" x2="266" y2="192" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" class="fl" marker-end="url(#ahb)"/><path d="M290 126V70H70V108" fill="none" stroke="#3FA34D" stroke-width="4" stroke-dasharray="7 6" class="fl" marker-end="url(#ahg)"/><g transform="translate(360 150) scale(0.7)"><g><path d="M-24 10Q-34 10 -30 0Q-28 -8 -18 -6Q-14 -20 0 -18Q12 -22 18 -8Q32 -8 30 6Q30 12 22 10Z" fill="#B8BEC9" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-14 18V28" stroke="#0B93D4" stroke-width="4" stroke-linecap="round" class="fall"/><path d="M0 18V28" stroke="#0B93D4" stroke-width="4" stroke-linecap="round" class="fall"/><path d="M14 18V28" stroke="#0B93D4" stroke-width="4" stroke-linecap="round" class="fall"/></g></g></svg>