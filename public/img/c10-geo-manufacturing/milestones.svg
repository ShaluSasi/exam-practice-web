<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img"><title>Four icons for the first textile mill, first jute mill, first cement plant and Partition</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="22" font-size="13" text-anchor="middle">Four milestones (not in order)</text><rect x="8.0" y="32.0" width="90.0" height="160.0" rx="10" fill="#FDE7EF" stroke="#2B2F4A" stroke-width="3"/><g transform="translate(53.0 86.4) scale(0.6400000000000001)"><g><path d="M-16 -22H16V22H-16Z" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-10 -10H10M-10 -2H10M-10 6H4" stroke="#9AA5B8" stroke-width="3"/><path d="M-16 -22L0 0L-8 22" fill="none" stroke="#E5484D" stroke-width="3" stroke-dasharray="4 3"/></g></g><text x="53.0" y="171.0" font-size="9.5" text-anchor="middle">Partition of</text><text x="53.0" y="184.0" font-size="9.5" text-anchor="middle">the country</text><rect x="106.0" y="32.0" width="90.0" height="160.0" rx="10" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3"/><g transform="translate(151.0 86.4) scale(0.6400000000000001)"><g><rect x="-28" y="-22" width="56" height="44" rx="4" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-20 -22V22" stroke="#0B93D4" stroke-width="2.5"/><path d="M-12 -22V22" stroke="#0B93D4" stroke-width="2.5"/><path d="M-4 -22V22" stroke="#0B93D4" stroke-width="2.5"/><path d="M4 -22V22" stroke="#0B93D4" stroke-width="2.5"/><path d="M12 -22V22" stroke="#0B93D4" stroke-width="2.5"/><path d="M20 -22V22" stroke="#0B93D4" stroke-width="2.5"/><g class="sw"><rect x="-26" y="-4" width="52" height="7" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="-26" y="12" width="52" height="8" fill="#F7C6D9" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="151.0" y="171.0" font-size="9.5" text-anchor="middle">First successful</text><text x="151.0" y="184.0" font-size="9.5" text-anchor="middle">textile mill</text><rect x="204.0" y="32.0" width="90.0" height="160.0" rx="10" fill="#EEF0F6" stroke="#2B2F4A" stroke-width="3"/><g transform="translate(249.0 86.4) scale(0.6400000000000001)"><g><rect x="-24" y="-8" width="30" height="30" fill="#F2EFE6" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="2" y="2" width="24" height="20" fill="#E6E2D3" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="249.0" y="171.0" font-size="9.5" text-anchor="middle">First cement</text><text x="249.0" y="184.0" font-size="9.5" text-anchor="middle">plant</text><rect x="302.0" y="32.0" width="90.0" height="160.0" rx="10" fill="#FFF3D0" stroke="#2B2F4A" stroke-width="3"/><g transform="translate(347.0 86.4) scale(0.6400000000000001)"><g><rect x="-22" y="-14" width="44" height="34" rx="4" fill="#D8B979" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-22 -2H22M-22 10H22M-8 -14V20M8 -14V20" stroke="#8B5A2B" stroke-width="2.5"/></g></g><text x="347.0" y="171.0" font-size="9.5" text-anchor="middle">First jute</text><text x="347.0" y="184.0" font-size="9.5" text-anchor="middle">mill</text></svg>