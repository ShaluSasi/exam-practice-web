<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img"><title>Six cards of possible location factors for jute mills</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200.0" y="22" font-size="13" text-anchor="middle">Possible factors for jute mills on a river bank</text><rect x="12.0" y="42.0" width="117.3" height="87.0" rx="10" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3"/><g transform="translate(70.7 71.6) scale(0.6400000000000001)"><g><path d="M0 -14Q-12 4 -10 10Q-8 18 0 18Q8 18 10 10Q12 4 0 -14Z" fill="#7FD0F6" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="70.7" y="108.0" font-size="10" text-anchor="middle">Abundant water</text><text x="70.7" y="121.0" font-size="10" text-anchor="middle">for processing</text><rect x="141.3" y="42.0" width="117.3" height="87.0" rx="10" fill="#E8F5E9" stroke="#2B2F4A" stroke-width="3"/><g transform="translate(200.0 71.6) scale(0.6400000000000001)"><g><path d="M-34 6H34L24 22H-24Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-14" y="-10" width="28" height="16" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-6" y="-22" width="12" height="12" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="200.0" y="108.0" font-size="10" text-anchor="middle">Cheap water</text><text x="200.0" y="121.0" font-size="10" text-anchor="middle">transport</text><rect x="270.7" y="42.0" width="117.3" height="87.0" rx="10" fill="#FFF3D0" stroke="#2B2F4A" stroke-width="3"/><g transform="translate(329.3 71.6) scale(0.6400000000000001)"><g><path d="M-6 14V26M6 14V26M-10 -2L-17 10M10 -2L17 10" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-10" y="-8" width="20" height="22" rx="6" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-18" r="8" fill="#F4C9A0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-9 -22Q0 -32 9 -22Z" fill="#FFD84D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="329.3" y="108.0" font-size="10" text-anchor="middle">Cheap labour</text><text x="329.3" y="121.0" font-size="10" text-anchor="middle"></text><rect x="12.0" y="141.0" width="117.3" height="87.0" rx="10" fill="#FDE7EF" stroke="#2B2F4A" stroke-width="3"/><g transform="translate(70.7 170.6) scale(0.6400000000000001)"><g><rect x="-24" y="-8" width="48" height="30" fill="#FFF3D0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-28 -8L-22 -22H22L28 -8Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-6" y="4" width="12" height="18" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="70.7" y="207.0" font-size="10" text-anchor="middle">Port, banking</text><text x="70.7" y="220.0" font-size="10" text-anchor="middle">and insurance</text><rect x="141.3" y="141.0" width="117.3" height="87.0" rx="10" fill="#FFF3D0" stroke="#2B2F4A" stroke-width="3"/><g transform="translate(200.0 170.6) scale(0.6400000000000001)"><g><rect x="-22" y="-14" width="44" height="34" rx="4" fill="#D8B979" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-22 -2H22M-22 10H22M-8 -14V20M8 -14V20" stroke="#8B5A2B" stroke-width="2.5"/></g></g><text x="200.0" y="207.0" font-size="10" text-anchor="middle">Jute-growing</text><text x="200.0" y="220.0" font-size="10" text-anchor="middle">areas close by</text><rect x="270.7" y="141.0" width="117.3" height="87.0" rx="10" fill="#EEF0F6" stroke="#2B2F4A" stroke-width="3"/><g transform="translate(329.3 170.6) scale(0.6400000000000001)"><g><path d="M-24 22L-16 -8L4 -14L22 4L24 22Z" fill="#A0522D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-6 8L4 -2" stroke="#E0A38A" stroke-width="3"/></g></g><text x="329.3" y="207.0" font-size="10" text-anchor="middle">Iron ore</text><text x="329.3" y="220.0" font-size="10" text-anchor="middle">mines close by</text></svg>