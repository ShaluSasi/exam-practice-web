<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 224" role="img"><title>Five bars rising in height: the value of the product grows at each stage of making clothes</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="20" font-size="12" text-anchor="middle">Value added at each step</text><path d="M50 200H380M50 200V36" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="70" y="172" width="40" height="28" rx="4" fill="#EAF6E4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="height" values="0;28;28" dur="2.4s" keyTimes="0;.5;1" repeatCount="indefinite"/><animate attributeName="y" values="200;172;172" dur="2.4s" keyTimes="0;.5;1" repeatCount="indefinite"/></rect><rect x="132" y="142" width="40" height="58" rx="4" fill="#FDE7EF" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="height" values="0;58;58" dur="2.4s" keyTimes="0;.5;1" repeatCount="indefinite"/><animate attributeName="y" values="200;142;142" dur="2.4s" keyTimes="0;.5;1" repeatCount="indefinite"/></rect><rect x="194" y="112" width="40" height="88" rx="4" fill="#C9E4FF" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="height" values="0;88;88" dur="2.4s" keyTimes="0;.5;1" repeatCount="indefinite"/><animate attributeName="y" values="200;112;112" dur="2.4s" keyTimes="0;.5;1" repeatCount="indefinite"/></rect><rect x="256" y="82" width="40" height="118" rx="4" fill="#B39DFF" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="height" values="0;118;118" dur="2.4s" keyTimes="0;.5;1" repeatCount="indefinite"/><animate attributeName="y" values="200;82;82" dur="2.4s" keyTimes="0;.5;1" repeatCount="indefinite"/></rect><rect x="318" y="52" width="40" height="148" rx="4" fill="#FFD27A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><animate attributeName="height" values="0;148;148" dur="2.4s" keyTimes="0;.5;1" repeatCount="indefinite"/><animate attributeName="y" values="200;52;52" dur="2.4s" keyTimes="0;.5;1" repeatCount="indefinite"/></rect><line x1="60" y1="40" x2="360" y2="40" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round" marker-end="url(#aho)"/></svg>