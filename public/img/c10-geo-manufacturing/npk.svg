<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img"><title>Three fertiliser sacks marked N, P and K</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200.0" y="22" font-size="13" text-anchor="middle">Plant nutrients in fertilisers</text><rect x="12.0" y="42.0" width="117.3" height="166.0" rx="10" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3"/><g transform="translate(70.7 98.4) scale(0.96)"><g><path d="M-16 -18Q0 -26 16 -18L20 24H-20Z" fill="#FFF3D0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-10 -2H10M-10 8H10" stroke="#FF8A1F" stroke-width="3"/><text y="16" font-size="16" text-anchor="middle" style="fill:#2B2F4A">N</text></g></g><text x="70.7" y="187.0" font-size="10" text-anchor="middle">Nitrogenous (urea)</text><text x="70.7" y="200.0" font-size="10" text-anchor="middle"></text><rect x="141.3" y="42.0" width="117.3" height="166.0" rx="10" fill="#FFF3D0" stroke="#2B2F4A" stroke-width="3"/><g transform="translate(200.0 98.4) scale(0.96)"><g><path d="M-16 -18Q0 -26 16 -18L20 24H-20Z" fill="#FFF3D0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-10 -2H10M-10 8H10" stroke="#FF8A1F" stroke-width="3"/><text y="16" font-size="16" text-anchor="middle" style="fill:#2B2F4A">P</text></g></g><text x="200.0" y="187.0" font-size="10" text-anchor="middle">Phosphatic (DAP)</text><text x="200.0" y="200.0" font-size="10" text-anchor="middle"></text><rect x="270.7" y="42.0" width="117.3" height="166.0" rx="10" fill="#FDE7EF" stroke="#2B2F4A" stroke-width="3"/><g transform="translate(329.3 98.4) scale(0.96)"><g><path d="M-16 -18Q0 -26 16 -18L20 24H-20Z" fill="#FFF3D0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-10 -2H10M-10 8H10" stroke="#FF8A1F" stroke-width="3"/><text y="16" font-size="16" text-anchor="middle" style="fill:#2B2F4A">K</text></g></g><text x="329.3" y="187.0" font-size="10" text-anchor="middle">Potash</text><text x="329.3" y="200.0" font-size="10" text-anchor="middle"></text></svg>