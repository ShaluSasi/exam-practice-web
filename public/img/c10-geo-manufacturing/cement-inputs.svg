" stroke-linecap="round" stroke-linejoin="round"/><path d="M-26 -4L-18 -18H34L26 -4" fill="#B8BEC9" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="200.0" y="108.0" font-size="10.5" text-anchor="middle">Silica</text><text x="200.0" y="121.0" font-size="10.5" text-anchor="middle"></text><rect x="270.7" y="42.0" width="117.3" height="87.0" rx="10" fill="#FFF3D0" stroke="#2B2F4A" stroke-width="3"/><g transform="translate(329.3 71.6) scale(0.6400000000000001)"><g><path d="M-16 -18Q0 -26 16 -18L20 24H-20Z" fill="#FFF3D0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-10 -2H10M-10 8H10" stroke="#FF8A1F" stroke-width="3"/></g></g><text x="329.3" y="108.0" font-size="10.5" text-anchor="middle">Gypsum</text><text x="329.3" y="121.0" font-size="10.5" text-anchor="middle"></text><rect x="12.0" y="141.0" width="117.3" height="87.0" rx="10" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3"/><g transform="translate(70.7 170.6) scale(0.6400000000000001)"><g><path d="M-24 22L-16 -8L4 -14L22 4L24 22Z" fill="#3A3F52" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-6 8L4 -2" stroke="#8A90A5" stroke-width="3"/></g></g><text x="70.7" y="207.0" font-size="10.5" text-anchor="middle">Coal</text><text x="70.7" y="220.0" font-size="10.5" text-anchor="middle"></text><rect x="141.3" y="141.0" width="117.3" height="87.0" rx="10" fill="#E8F5E9" stroke="#2B2F4A" stroke-width="3"/><g transform="translate(200.0 170.6) scale(0.6400000000000001)"><g><path d="M-14 28L0 -26L14 28M-9 12H9M-5 -2H5M-22 -14H22" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-22 -14V-8M22 -14V-8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="200.0" y="207.0" font-size="10.5" text-anchor="middle">Electric power</text><text x="200.0" y="220.0" font-size="10.5" text-anchor="middle"></text><rect x="270.7" y="141.0" width="117.3" height="87.0" rx="10" fill="#FDE7EF" stroke="#2B2F4A" stroke-width="3"/><g transform="translate(329.3 170.6) scale(0.6400000000000001)"><g><rect x="-30" y="-14" width="38" height="26" rx="3" fill="#FFD27A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 -6H22L30 4V12H8Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-18" cy="14" r="6" fill="#2B2F4A"/><circle cx="18" cy="14" r="6" fill="#2B2F4A"/></g></g><text x="329.3" y="207.0" font-size="10.5" text-anchor="middle">Transport</text><text x="329.3" y="220.0" font-size="10.5" text-anchor="middle"></text></svg>