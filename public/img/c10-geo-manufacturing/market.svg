<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Three kinds of goods in a festival market and who makes each</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.35}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="20" font-size="14" text-anchor="middle">Who makes what?</text><rect x="12" y="34" width="118" height="190" rx="12" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3"/><g transform="translate(71 100) scale(1.5)"><g class="bob"><path d="M-12 -22L-30 -10L-22 2L-14 -4V24H14V-4L22 2L30 -10L12 -22Q0 -14 -12 -22Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-5 -16L0 -8L5 -16" fill="none" stroke="#fff" stroke-width="2.5"/></g></g><text x="71" y="160" font-size="10.5" text-anchor="middle">Shoes and clothes</text><text x="71" y="176" font-size="11" text-anchor="middle"></text><rect x="22" y="188" width="98" height="26" rx="8" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><text x="71" y="205" font-size="9.5" text-anchor="middle">Large factories</text><rect x="141" y="34" width="118" height="190" rx="12" fill="#FFF3D0" stroke="#2B2F4A" stroke-width="3"/><g transform="translate(200 100) scale(1.5)"><g class="bob" style="animation-delay:0.4s"><path d="M-20 -8H20L16 22H-16Z" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="0" cy="-8" rx="20" ry="5" fill="#B7794A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-10 -22Q-14 -14 -8 -14M6 -22Q2 -14 8 -14" stroke="#FF8A1F" stroke-width="3" fill="none" class="rise"/></g></g><text x="200" y="160" font-size="10.5" text-anchor="middle">Utensils</text><text x="200" y="176" font-size="11" text-anchor="middle"></text><rect x="151" y="188" width="98" height="26" rx="8" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><text x="200" y="205" font-size="9.5" text-anchor="middle">Small units</text><rect x="270" y="34" width="118" height="190" rx="12" fill="#FDE7EF" stroke="#2B2F4A" stroke-width="3"/><g transform="translate(329 100) scale(1.5)"><g class="bob" style="animation-delay:0.8s"><path d="M-20 4Q0 28 20 4Z" fill="#E8A55B" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 4V-8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 -26Q-8 -14 0 -8Q8 -14 0 -26Z" fill="#FF8A1F" stroke="#E5484D" stroke-width="2.5"/></g></g><text x="329" y="160" font-size="10.5" text-anchor="middle">Diyas (earthen lamps)</text><text x="329" y="176" font-size="11" text-anchor="middle"></text><rect x="280" y="188" width="98" height="26" rx="8" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><text x="329" y="205" font-size="9.5" text-anchor="middle">Artisans at home</text></svg>