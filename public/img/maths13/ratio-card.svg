<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 240" role="img"><title>Three cases for the ratios of coefficients</title><style>text{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="260.0" y="30.0" font-size="18" text-anchor="middle">compare the ratios</text><rect x="16.0" y="48.0" width="488.0" height="52.0" rx="12" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><text x="34.0" y="79.0" font-size="17" text-anchor="start">a₁/a₂  ≠  b₁/b₂</text><line x1="430.0" y1="88.0" x2="480.0" y2="58.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><line x1="430.0" y1="58.0" x2="480.0" y2="88.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><rect x="16.0" y="110.0" width="488.0" height="52.0" rx="12" fill="#FDE2C4" stroke="#2B2F4A" stroke-width="2.5"/><text x="34.0" y="141.0" font-size="17" text-anchor="start">a₁/a₂ = b₁/b₂ ≠ c₁/c₂</text><line x1="430.0" y1="124.0" x2="480.0" y2="124.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><line x1="430.0" y1="148.0" x2="480.0" y2="148.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><rect x="16.0" y="172.0" width="488.0" height="52.0" rx="12" fill="#D7F0D9" stroke="#2B2F4A" stroke-width="2.5"/><text x="34.0" y="203.0" font-size="17" text-anchor="start">a₁/a₂ = b₁/b₂ = c₁/c₂</text><line x1="430.0" y1="198.0" x2="480.0" y2="198.0" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round"/></svg>