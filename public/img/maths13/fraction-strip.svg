<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" role="img"><title>A fraction with two clues</title><style>text{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="40.0" y="40.0" width="380.0" height="44.0" rx="8" fill="#FFF" stroke="#2B2F4A" stroke-width="2.5"/><text x="230.0" y="70.0" font-size="18" text-anchor="middle">numerator / denominator</text><rect x="40.0" y="120.0" width="170.0" height="44.0" rx="8" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><text x="125.0" y="148.0" font-size="16" text-anchor="middle">add 1 to both</text><rect x="250.0" y="120.0" width="170.0" height="44.0" rx="8" fill="#FDE2C4" stroke="#2B2F4A" stroke-width="2.5"/><text x="335.0" y="148.0" font-size="15" text-anchor="middle">subtract 1 from both</text><path d="M125 88V116" fill="none" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M335 88V116" fill="none" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="230.0" y="200.0" font-size="14" text-anchor="middle">two different clues about one fraction</text></svg>