<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 190" role="img"><title>Four speech bubbles with everyday statements</title><style>text{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}.bob{animation:bob 3s ease-in-out infinite}.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}@keyframes bob{50%{transform:translateY(-5px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><g class="bob d0"><rect x="20.0" y="24.0" width="210.0" height="54.0" rx="14" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><text x="125.0" y="57.0" font-size="16" text-anchor="middle">two numbers: sum 25</text></g><g class="bob d1"><rect x="250.0" y="24.0" width="210.0" height="54.0" rx="14" fill="#FDE2C4" stroke="#2B2F4A" stroke-width="2.5"/><text x="355.0" y="57.0" font-size="16" text-anchor="middle">their difference is 11</text></g><g class="bob d2"><rect x="20.0" y="94.0" width="210.0" height="54.0" rx="14" fill="#D7F0D9" stroke="#2B2F4A" stroke-width="2.5"/><text x="125.0" y="127.0" font-size="16" text-anchor="middle">2 adults + 3 children</text></g><g class="bob d3"><rect x="250.0" y="94.0" width="210.0" height="54.0" rx="14" fill="#F6C453" stroke="#2B2F4A" stroke-width="2.5"/><text x="355.0" y="127.0" font-size="16" text-anchor="middle">fixed fee + 6 km</text></g><text x="240.0" y="178.0" font-size="14" text-anchor="middle">turn each sentence into an equation</text></svg>