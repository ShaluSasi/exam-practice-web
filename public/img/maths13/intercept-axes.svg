<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" role="img"><title>A line crossing the y-axis at a marked point</title><style>text{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><line x1="40.0" y1="160.0" x2="380.0" y2="160.0" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/><line x1="100.0" y1="190.0" x2="100.0" y2="14.0" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/><text x="390.0" y="164.0" font-size="14" text-anchor="start">x</text><text x="106.0" y="20.0" font-size="14" text-anchor="start">y</text><line x1="100.0" y1="70.0" x2="300.0" y2="160.0" stroke="#0B93D4" stroke-width="3.2" stroke-linecap="round"/><circle cx="100.0" cy="70.0" r="8" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5"/><text x="116.0" y="52.0" font-size="14" text-anchor="start">y-intercept: where the</text><text x="116.0" y="70.0" font-size="14" text-anchor="start">line crosses the y-axis</text></svg>