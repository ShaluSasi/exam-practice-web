<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" role="img"><title>Piles of fifty and hundred rupee notes</title><style>text{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}.bob{animation:bob 3s ease-in-out infinite}.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}@keyframes bob{50%{transform:translateY(-5px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><g class="bob d0"><rect x="40.0" y="50.0" width="150.0" height="74.0" rx="8" fill="#FDE2C4" stroke="#2B2F4A" stroke-width="2.5"/></g><g class="bob d1"><rect x="58.0" y="64.0" width="150.0" height="74.0" rx="8" fill="#FDE2C4" stroke="#2B2F4A" stroke-width="2.5"/></g><g class="bob d2"><rect x="76.0" y="78.0" width="150.0" height="74.0" rx="8" fill="#FDE2C4" stroke="#2B2F4A" stroke-width="2.5"/></g><text x="130.0" y="128.0" font-size="24" text-anchor="middle">₹50</text><g class="bob d0"><rect x="250.0" y="50.0" width="170.0" height="78.0" rx="8" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/></g><g class="bob d1"><rect x="268.0" y="64.0" width="170.0" height="78.0" rx="8" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/></g><g class="bob d2"><rect x="286.0" y="78.0" width="170.0" height="78.0" rx="8" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/></g><text x="355.0" y="128.0" font-size="26" text-anchor="middle">₹100</text><text x="230.0" y="200.0" font-size="15" text-anchor="middle">a mix of two kinds of notes</text></svg>