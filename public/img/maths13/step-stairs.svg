<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 230" role="img"><title>Five steps of a staircase numbered one to five</title><style>text{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}.bob{animation:bob 3s ease-in-out infinite}.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}@keyframes bob{50%{transform:translateY(-5px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><g class="bob d0"><rect x="30.0" y="170.0" width="76.0" height="28.0" rx="6" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><text x="68.0" y="190.0" font-size="18" text-anchor="middle">1</text></g><g class="bob d1"><rect x="110.0" y="142.0" width="76.0" height="56.0" rx="6" fill="#FDE2C4" stroke="#2B2F4A" stroke-width="2.5"/><text x="148.0" y="162.0" font-size="18" text-anchor="middle">2</text></g><g class="bob d2"><rect x="190.0" y="114.0" width="76.0" height="84.0" rx="6" fill="#D7F0D9" stroke="#2B2F4A" stroke-width="2.5"/><text x="228.0" y="134.0" font-size="18" text-anchor="middle">3</text></g><g class="bob d3"><rect x="270.0" y="86.0" width="76.0" height="112.0" rx="6" fill="#F6C453" stroke="#2B2F4A" stroke-width="2.5"/><text x="308.0" y="106.0" font-size="18" text-anchor="middle">4</text></g><g class="bob d0"><rect x="350.0" y="58.0" width="76.0" height="140.0" rx="6" fill="#F9D6D7" stroke="#2B2F4A" stroke-width="2.5"/><text x="388.0" y="78.0" font-size="18" text-anchor="middle">5</text></g><text x="230.0" y="28.0" font-size="16" text-anchor="middle">one step after another</text></svg>