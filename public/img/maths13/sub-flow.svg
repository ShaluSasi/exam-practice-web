<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" role="img"><title>Using one equation to rewrite x and put it into the other</title><style>text{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="20.0" y="24.0" width="180.0" height="50.0" rx="12" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><text x="110.0" y="56.0" font-size="20" text-anchor="middle">x + 2y = 8</text><rect x="260.0" y="24.0" width="180.0" height="50.0" rx="12" fill="#FDE2C4" stroke="#2B2F4A" stroke-width="2.5"/><text x="350.0" y="56.0" font-size="20" text-anchor="middle">3x − y = 3</text><path d="M110 80V112" fill="none" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M102 112l8 12l8 -12z" fill="#0B93D4"/><rect x="20.0" y="130.0" width="180.0" height="46.0" rx="12" fill="#FFF" stroke="#2B2F4A" stroke-width="2.5"/><text x="110.0" y="160.0" font-size="20" text-anchor="middle">x = 8 − 2y</text><path d="M200 153H292" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><path d="M294 145l12 8l-12 8z" fill="#FF8A1F"/><text x="250.0" y="142.0" font-size="13" text-anchor="middle">put it in</text><rect x="312.0" y="130.0" width="128.0" height="46.0" rx="12" fill="#FDE2C4" stroke="#2B2F4A" stroke-width="2.5" stroke-dasharray="5 4"/><text x="376.0" y="160.0" font-size="15" text-anchor="middle">3( ... ) − y = 3</text><text x="230.0" y="206.0" font-size="14" text-anchor="middle">one equation, one unknown</text></svg>