<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img"><title>A timeline with three moments</title><style>text{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><line x1="30.0" y1="120.0" x2="440.0" y2="120.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><path d="M444 112l12 8l-12 8z" fill="#2B2F4A"/><circle cx="90.0" cy="120.0" r="8" fill="#F6C453" stroke="#2B2F4A" stroke-width="2.5"/><text x="90.0" y="150.0" font-size="15" text-anchor="middle">8 years ago</text><circle cx="240.0" cy="120.0" r="8" fill="#F6C453" stroke="#2B2F4A" stroke-width="2.5"/><text x="240.0" y="150.0" font-size="15" text-anchor="middle">now</text><circle cx="390.0" cy="120.0" r="8" fill="#F6C453" stroke="#2B2F4A" stroke-width="2.5"/><text x="390.0" y="150.0" font-size="15" text-anchor="middle">8 years later</text><text x="90.0" y="90.0" font-size="13" text-anchor="middle">Ria is 3 times Tia</text><text x="390.0" y="90.0" font-size="13" text-anchor="middle">Ria is 2 times Tia</text><rect x="210.0" y="174.0" width="60.0" height="26.0" rx="6" fill="#D7F0D9" stroke="#2B2F4A" stroke-width="2"/><text x="240.0" y="193.0" font-size="14" text-anchor="middle">Ria ?</text></svg>