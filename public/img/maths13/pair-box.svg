<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" role="img"><title>An ordered pair with an x-value and a y-value</title><style>text{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="30.0" y="50.0" width="120.0" height="70.0" rx="14" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><text x="90.0" y="96.0" font-size="20" text-anchor="middle">first</text><rect x="290.0" y="50.0" width="120.0" height="70.0" rx="14" fill="#FDE2C4" stroke="#2B2F4A" stroke-width="2.5"/><text x="350.0" y="96.0" font-size="20" text-anchor="middle">second</text><text x="220.0" y="96.0" font-size="26" text-anchor="middle">( ___ , ___ )</text><text x="90.0" y="150.0" font-size="16" text-anchor="middle">x-value</text><text x="350.0" y="150.0" font-size="16" text-anchor="middle">y-value</text><text x="220.0" y="180.0" font-size="15" text-anchor="middle">order matters</text></svg>