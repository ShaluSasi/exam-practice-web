<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" role="img"><title>Two mobile plan cards with a monthly fee and a per-minute charge</title><style>text{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="30" y="30" width="185" height="140" rx="14" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><text x="122.5" y="66" font-size="20" text-anchor="middle">Plan A</text><text x="122.5" y="104" font-size="16" text-anchor="middle">₹50 per month</text><text x="122.5" y="136" font-size="16" text-anchor="middle">+ ₹0.20 per minute</text><rect x="245" y="30" width="185" height="140" rx="14" fill="#FDE2C4" stroke="#2B2F4A" stroke-width="2.5"/><text x="337.5" y="66" font-size="20" text-anchor="middle">Plan B</text><text x="337.5" y="104" font-size="16" text-anchor="middle">₹30 per month</text><text x="337.5" y="136" font-size="16" text-anchor="middle">+ ₹0.30 per minute</text><text x="230" y="202" font-size="14" text-anchor="middle">which plan costs less?</text></svg>
