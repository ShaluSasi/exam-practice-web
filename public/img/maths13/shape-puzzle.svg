<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" role="img"><title>A row and a column of triangles, rectangles and circles</title><style>text{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}.bob{animation:bob 3s ease-in-out infinite}.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}@keyframes bob{50%{transform:translateY(-5px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="150.0" y="28.0" font-size="16" text-anchor="middle">One row</text><text x="380.0" y="28.0" font-size="16" text-anchor="middle">One column</text><rect x="20.0" y="44.0" width="260.0" height="64.0" rx="10" fill="#FFF" stroke="#2B2F4A" stroke-width="2.5"/><g class="bob"><path d="M58 56L78 92.0H38z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.2" stroke-linejoin="round"/></g><g class="bob"><rect x="98.0" y="61.0" width="40.0" height="30.0" rx="4" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.2"/></g><g class="bob"><rect x="158.0" y="61.0" width="40.0" height="30.0" rx="4" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.2"/></g><g class="bob"><path d="M238 56L258 92.0H218z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.2" stroke-linejoin="round"/></g><text x="150.0" y="138.0" font-size="16" text-anchor="middle">adds up to 28</text><rect x="340.0" y="40.0" width="80.0" height="210.0" rx="10" fill="#FFF" stroke="#2B2F4A" stroke-width="2.5"/><g class="bob d1"><path d="M380 53L397 83.6H363z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.2" stroke-linejoin="round"/></g><g class="bob d1"><rect x="363.0" y="105.2" width="34.0" height="25.5" rx="4" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.2"/></g><g class="bob d1"><circle cx="380.0" cy="166.0" r="14.45" fill="#F6C453" stroke="#2B2F4A" stroke-width="2.2"/></g><g class="bob d1"><circle cx="380.0" cy="214.0" r="14.45" fill="#F6C453" stroke="#2B2F4A" stroke-width="2.2"/></g><text x="150.0" y="190.0" font-size="14" text-anchor="middle">triangle = T,  rectangle = R</text><text x="150.0" y="212.0" font-size="14" text-anchor="middle">circle = C</text><text x="300.0" y="140.0" font-size="10" text-anchor="middle"></text><text x="290.0" y="232.0" font-size="12" text-anchor="end">column adds</text><text x="290.0" y="248.0" font-size="12" text-anchor="end">up to 22</text></svg>