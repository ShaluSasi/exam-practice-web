<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 190" role="img"><title>The standard form with its three parts</title><style>text{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}.bob{animation:bob 3s ease-in-out infinite}.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}@keyframes bob{50%{transform:translateY(-5px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="230.0" y="36.0" font-size="28" text-anchor="middle">a x + b y + c = 0</text><g class="bob "><rect x="54.0" y="62.0" width="92.0" height="56.0" rx="12" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><text x="100.0" y="100.0" font-size="30" text-anchor="middle">a</text></g><text x="100.0" y="148.0" font-size="14" text-anchor="middle">coefficient of x</text><g class="bob d1"><rect x="184.0" y="62.0" width="92.0" height="56.0" rx="12" fill="#FDE2C4" stroke="#2B2F4A" stroke-width="2.5"/><text x="230.0" y="100.0" font-size="30" text-anchor="middle">b</text></g><text x="230.0" y="148.0" font-size="14" text-anchor="middle">coefficient of y</text><g class="bob d2"><rect x="314.0" y="62.0" width="92.0" height="56.0" rx="12" fill="#D7F0D9" stroke="#2B2F4A" stroke-width="2.5"/><text x="360.0" y="100.0" font-size="30" text-anchor="middle">c</text></g><text x="360.0" y="148.0" font-size="14" text-anchor="middle">constant</text><text x="230.0" y="176.0" font-size="13" text-anchor="middle">a and b are not both zero</text></svg>