<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 210" role="img"><title>Two equations with unknown constants</title><style>text{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="24.0" y="30.0" width="190.0" height="80.0" rx="14" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><text x="119.0" y="62.0" font-size="22" text-anchor="middle">2mx + 3y = 7</text><text x="119.0" y="94.0" font-size="14" text-anchor="middle">equation 1</text><rect x="246.0" y="30.0" width="190.0" height="80.0" rx="14" fill="#FDE2C4" stroke="#2B2F4A" stroke-width="2.5"/><text x="341.0" y="62.0" font-size="22" text-anchor="middle">4x + ny = −10</text><text x="341.0" y="94.0" font-size="14" text-anchor="middle">equation 2</text><circle cx="230.0" cy="156.0" r="24" fill="#F6C453" stroke="#2B2F4A" stroke-width="3"/><text x="230.0" y="165.0" font-size="24" text-anchor="middle">?</text><text x="230.0" y="198.0" font-size="14" text-anchor="middle">one point lies on both lines</text></svg>