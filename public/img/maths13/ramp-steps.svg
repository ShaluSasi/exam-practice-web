<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 250" role="img"><title>A wheelchair ramp beside steps</title><style>text{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}.bx{animation:sl 4s ease-in-out infinite}@keyframes sl{0%{transform:translate(0,0)}100%{transform:translate(250px,-92px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="206" width="470" height="44" fill="#D9C49A"/><path d="M60 206H400V70z" fill="#CDD2EA" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><rect x="400.0" y="60.0" width="60.0" height="146.0" rx="4" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="2.5"/><line x1="380.0" y1="70.0" x2="380.0" y2="206.0" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 4"/><text x="366.0" y="140.0" font-size="14" text-anchor="middle" transform="rotate(-90 366 136)">18 cm</text><g class="bx"><rect x="70" y="168" width="34" height="28" rx="4" fill="#C8925A" stroke="#2B2F4A" stroke-width="2.5" transform="rotate(-21 87 182)"/></g><text x="230.0" y="36.0" font-size="15" text-anchor="middle">ramp rule: 1 cm up for every 12 cm along</text></svg>