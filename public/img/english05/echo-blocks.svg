<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 180" role="img">
<title>Four bouncing letter blocks that all begin with the same sound</title>
<style>
.L{fill:none;stroke-linecap:round;stroke-linejoin:round}.K{stroke:#2B2F4A}.o{stroke:#2B2F4A;stroke-width:2}
.bn{animation:bn 1.8s ease-in-out infinite}@keyframes bn{0%,100%{transform:translateY(0)}30%{transform:translateY(-16px)}}undefined
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M20 152H320" stroke="#C8925A" stroke-width="6" stroke-linecap="round"/><g class="bn" style="animation-delay:0s"><rect x="40" y="80" width="54" height="54" rx="8" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="67" y="118" font-size="30" text-anchor="middle">m</text></g></g><g class="bn" style="animation-delay:0.25s"><rect x="110" y="80" width="54" height="54" rx="8" fill="#FFE0E0" stroke="#2B2F4A" stroke-width="2.5"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="137" y="118" font-size="30" text-anchor="middle">m</text></g></g><g class="bn" style="animation-delay:0.5s"><rect x="180" y="80" width="54" height="54" rx="8" fill="#E3F7E6" stroke="#2B2F4A" stroke-width="2.5"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="207" y="118" font-size="30" text-anchor="middle">m</text></g></g><g class="bn" style="animation-delay:0.75s"><rect x="250" y="80" width="54" height="54" rx="8" fill="#FFF3C4" stroke="#2B2F4A" stroke-width="2.5"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="277" y="118" font-size="30" text-anchor="middle">m</text></g></g>
<path class="pu" style="animation-delay:0s" d="M150 50q20 -14 40 0" stroke="#FF8A1F" stroke-width="3" fill="none" stroke-linecap="round"/><path class="pu" style="animation-delay:0.4s" d="M164 44q26 -14 52 0" stroke="#FF8A1F" stroke-width="3" fill="none" stroke-linecap="round"/><path class="pu" style="animation-delay:0.8s" d="M178 38q32 -14 64 0" stroke="#FF8A1F" stroke-width="3" fill="none" stroke-linecap="round"/>
