<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" role="img">
<title>Four word chips: could, couldn't, should and would</title>
<style>
.L{fill:none;stroke-linecap:round;stroke-linejoin:round}.K{stroke:#2B2F4A}.o{stroke:#2B2F4A;stroke-width:2}
.pop{animation:pop 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pop{0%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g class="pop" style="animation-delay:0s"><rect x="25" y="46" width="130" height="36" rx="8" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2"/><text x="90" y="69.5" font-size="20" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">could</text></g><g class="pop" style="animation-delay:0.6s"><rect x="205" y="46" width="130" height="36" rx="8" fill="#FFE0E0" stroke="#2B2F4A" stroke-width="2"/><text x="270" y="69.5" font-size="20" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">couldn't</text></g><g class="pop" style="animation-delay:1.2s"><rect x="25" y="110" width="130" height="36" rx="8" fill="#E3F7E6" stroke="#2B2F4A" stroke-width="2"/><text x="90" y="133.5" font-size="20" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">should</text></g><g class="pop" style="animation-delay:1.7999999999999998s"><rect x="205" y="110" width="130" height="36" rx="8" fill="#FFF3C4" stroke="#2B2F4A" stroke-width="2"/><text x="270" y="133.5" font-size="20" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">would</text></g><path d="M165 64H195M165 128H195" stroke="#A3A8CC" stroke-width="2" stroke-dasharray="4 4"/>
</svg>
