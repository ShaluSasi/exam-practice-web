<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200" role="img">
<title>A clock with its hand turning backwards beside repeating calendar pages</title>
<style>
.L{fill:none;stroke-linecap:round;stroke-linejoin:round}.K{stroke:#2B2F4A}.o{stroke:#2B2F4A;stroke-width:2}
.hand{animation:hand 4s linear infinite;transform-origin:120px 100px}@keyframes hand{to{transform:rotate(-360deg)}}.bob{animation:bob 2.6s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
