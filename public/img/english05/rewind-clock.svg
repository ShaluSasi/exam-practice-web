<path class="hand" d="M120 100V58" stroke="#E5484D" stroke-width="4" stroke-linecap="round"/><path d="M120 100L146 112" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round"/><circle cx="120" cy="100" r="5" fill="#2B2F4A"/>
