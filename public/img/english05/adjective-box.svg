<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A box of five adjective word cards, each with an empty circle above it</title>
<style>
.L{fill:none;stroke-linecap:round;stroke-linejoin:round}.K{stroke:#2B2F4A}.o{stroke:#2B2F4A;stroke-width:2}
.sh{animation:sh 3s ease-in-out infinite}@keyframes sh{50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="16" y="14" width="368" height="212" rx="12" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-dasharray="8 5"/><g class="sh" style="animation-delay:0s"><circle cx="70" cy="44" r="16" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" stroke-dasharray="4 3"/><path d="M70 60V70" stroke="#A3A8CC" stroke-width="2"/><rect x="21" y="70" width="98" height="36" rx="8" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2"/><text x="70" y="93.5" font-size="17" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">positive</text></g><g class="sh" style="animation-delay:0.25s"><circle cx="196" cy="44" r="16" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" stroke-dasharray="4 3"/><path d="M196 60V70" stroke="#A3A8CC" stroke-width="2"/><rect x="135" y="70" width="122" height="36" rx="8" fill="#FFE0E0" stroke="#2B2F4A" stroke-width="2"/><text x="196" y="93.5" font-size="17" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">significant</text></g><g class="sh" style="animation-delay:0.5s"><circle cx="326" cy="44" r="16" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" stroke-dasharray="4 3"/><path d="M326 60V70" stroke="#A3A8CC" stroke-width="2"/><rect x="273" y="70" width="106" height="36" rx="8" fill="#E3F7E6" stroke="#2B2F4A" stroke-width="2"/><text x="326" y="93.5" font-size="17" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">youngest</text></g><g class="sh" style="animation-delay:0.75s"><circle cx="154" cy="148" r="16" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" stroke-dasharray="4 3"/><path d="M154 164V174" stroke="#A3A8CC" stroke-width="2"/><rect x="109" y="174" width="90" height="36" rx="8" fill="#FFF3C4" stroke="#2B2F4A" stroke-width="2"/><text x="154" y="197.5" font-size="17" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">noisy</text></g><g class="sh" style="animation-delay:1s"><circle cx="253" cy="148" r="16" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" stroke-dasharray="4 3"/><path d="M253 164V174" stroke="#A3A8CC" stroke-width="2"/><rect x="215" y="174" width="76" height="36" rx="8" fill="#EDE7F6" stroke="#2B2F4A" stroke-width="2"/><text x="253" y="197.5" font-size="17" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">loud</text></g>
