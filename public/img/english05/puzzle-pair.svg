<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 180" role="img">
<title>Two puzzle pieces sliding together to fit</title>
<style>
.L{fill:none;stroke-linecap:round;stroke-linejoin:round}.K{stroke:#2B2F4A}.o{stroke:#2B2F4A;stroke-width:2}
.pl{animation:pl 2.6s ease-in-out infinite}@keyframes pl{0%,100%{transform:translateX(-22px)}45%,70%{transform:translateX(0)}}.pr{animation:pr 2.6s ease-in-out infinite}@keyframes pr{0%,100%{transform:translateX(22px)}45%,70%{transform:translateX(0)}}.tw{animation:tw 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes tw{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
