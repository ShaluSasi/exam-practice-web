<g class="b"><g transform="rotate(0 250 95)"><path d="M250 95V63M250 72l-7 -7M250 72l7 -7" stroke="#0B93D4" stroke-width="4" stroke-linecap="round" fill="none"/></g><g transform="rotate(60 250 95)"><path d="M250 95V63M250 72l-7 -7M250 72l7 -7" stroke="#0B93D4" stroke-width="4" stroke-linecap="round" fill="none"/></g><g transform="rotate(120 250 95)"><path d="M250 95V63M250 72l-7 -7M250 72l7 -7" stroke="#0B93D4" stroke-width="4" stroke-linecap="round" fill="none"/></g><g transform="rotate(180 250 95)"><path d="M250 95V63M250 72l-7 -7M250 72l7 -7" stroke="#0B93D4" stroke-width="4" stroke-linecap="round" fill="none"/></g><g transform="rotate(240 250 95)"><path d="M250 95V63M250 72l-7 -7M250 72l7 -7" stroke="#0B93D4" stroke-width="4" stroke-linecap="round" fill="none"/></g><g transform="rotate(300 250 95)"><path d="M250 95V63M250 72l-7 -7M250 72l7 -7" stroke="#0B93D4" stroke-width="4" stroke-linecap="round" fill="none"/></g><circle cx="250" cy="95" r="6" fill="#CDEBFA" stroke="#0B93D4" stroke-width="2"/></g>
