<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 190" role="img">
<title>A sun and a snowflake taking turns, linked by circling arrows</title>
<style>
.L{fill:none;stroke-linecap:round;stroke-linejoin:round}.K{stroke:#2B2F4A}.o{stroke:#2B2F4A;stroke-width:2}
.a{animation:a 4s ease-in-out infinite}.b{animation:a 4s ease-in-out infinite;animation-delay:-2s}@keyframes a{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.85)}}.a,.b{transform-box:fill-box;transform-origin:center}.rot{animation:rot 8s linear infinite;transform-origin:170px 95px}@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
