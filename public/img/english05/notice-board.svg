<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" role="img">
<title>A cork notice board with a blank notice pinned in the middle</title>
<style>
.L{fill:none;stroke-linecap:round;stroke-linejoin:round}.K{stroke:#2B2F4A}.o{stroke:#2B2F4A;stroke-width:2}
.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:top center}@keyframes sw{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
