<rect x="44" y="50" width="56" height="44" rx="3" fill="#FFF3C4" stroke="#2B2F4A" stroke-width="1.5" transform="rotate(-6 72 72)"/><circle cx="70" cy="52" r="4" fill="#0B93D4"/>
<rect x="250" y="120" width="48" height="56" rx="3" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="1.5" transform="rotate(5 274 148)"/><circle cx="274" cy="122" r="4" fill="#3FA34D"/>
</svg>
