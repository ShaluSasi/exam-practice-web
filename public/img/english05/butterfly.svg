<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" role="img">
<title>A caterpillar, a cocoon and a butterfly in a row</title>
<style>
.L{fill:none;stroke-linecap:round;stroke-linejoin:round}.K{stroke:#2B2F4A}.o{stroke:#2B2F4A;stroke-width:2}
.wl{animation:fl .9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:right center}.wr{animation:fl .9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:left center}@keyframes fl{to{transform:scaleX(.35)}}.bob{animation:bob 2.6s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.cr{animation:cr 2s ease-in-out infinite}@keyframes cr{50%{transform:translateX(5px)}}.tw{animation:tw 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes tw{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
