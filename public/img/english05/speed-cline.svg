<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" role="img">
<title>A word cline arrow from a snail to a speeding shoe, with five empty boxes</title>
<style>
.L{fill:none;stroke-linecap:round;stroke-linejoin:round}.K{stroke:#2B2F4A}.o{stroke:#2B2F4A;stroke-width:2}
.sn{animation:sn 4s linear infinite}@keyframes sn{50%{transform:translateX(4px)}}.zip{animation:zip 1s ease-in-out infinite alternate}@keyframes zip{to{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#CDEBFA"/><stop offset="1" stop-color="#FF8A1F"/></linearGradient></defs>
<path d="M60 70H330L330 58L360 80L330 102V90H60Z" fill="url(#g)" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><rect x="62" y="104" width="46" height="30" rx="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" stroke-dasharray="5 4"/><rect x="120" y="104" width="46" height="30" rx="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" stroke-dasharray="5 4"/><rect x="178" y="104" width="46" height="30" rx="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" stroke-dasharray="5 4"/><rect x="236" y="104" width="46" height="30" rx="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" stroke-dasharray="5 4"/><rect x="294" y="104" width="46" height="30" rx="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" stroke-dasharray="5 4"/>
<g class="sn"><path d="M14 92H52Q56 92 54 86L48 84" fill="#C9CCE3" stroke="#2B2F4A" stroke-width="2"/><circle cx="32" cy="78" r="14" fill="#F6C453" stroke="#2B2F4A" stroke-width="2"/><path d="M32 78m-7 0a7 7 0 1 1 7 7" stroke="#B9851A" stroke-width="2" fill="none"/><path d="M50 84L54 70M46 84L48 70" stroke="#2B2F4A" stroke-width="1.5"/></g>
<g class="zip"><path d="M352 130H392Q394 120 384 118L370 112L362 114Q354 116 352 130Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><path d="M362 114Q350 98 364 98Q372 108 370 112" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.6"/><path d="M332 112H346M336 122H348" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round"/></g>
<g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="36" y="150" font-size="13" text-anchor="middle">slowest</text><text x="372" y="150" font-size="13" text-anchor="middle">fastest</text></g>
</svg>
