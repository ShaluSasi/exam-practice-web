<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 236" role="img">
<title>A reported sentence split into word cards, each with an empty circle above it</title>
<style>
.L{fill:none;stroke-linecap:round;stroke-linejoin:round}.K{stroke:#2B2F4A}.o{stroke:#2B2F4A;stroke-width:2}
.sh{animation:sh 3s ease-in-out infinite}@keyframes sh{50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="14" y="12" width="372" height="212" rx="12" fill="#FFF3C4" stroke="#2B2F4A" stroke-width="2"/><g class="sh" style="animation-delay:0s"><circle cx="81" cy="40" r="16" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" stroke-dasharray="4 3"/><path d="M81 56V66" stroke="#A3A8CC" stroke-width="2"/><rect x="46" y="66" width="70" height="36" rx="8" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2"/><text x="81" y="89.5" font-size="17" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">Siya</text></g><g class="sh" style="animation-delay:0.3s"><circle cx="165" cy="40" r="16" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" stroke-dasharray="4 3"/><path d="M165 56V66" stroke="#A3A8CC" stroke-width="2"/><rect x="132" y="66" width="66" height="36" rx="8" fill="#FFE0E0" stroke="#2B2F4A" stroke-width="2"/><text x="165" y="89.5" font-size="17" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">said</text></g><g class="sh" style="animation-delay:0.6s"><circle cx="247" cy="40" r="16" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" stroke-dasharray="4 3"/><path d="M247 56V66" stroke="#A3A8CC" stroke-width="2"/><rect x="214" y="66" width="66" height="36" rx="8" fill="#E3F7E6" stroke="#2B2F4A" stroke-width="2"/><text x="247" y="89.5" font-size="17" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">that</text></g><g class="sh" style="animation-delay:0.8999999999999999s"><circle cx="325" cy="40" r="16" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" stroke-dasharray="4 3"/><path d="M325 56V66" stroke="#A3A8CC" stroke-width="2"/><rect x="296" y="66" width="58" height="36" rx="8" fill="#FFF3C4" stroke="#2B2F4A" stroke-width="2"/><text x="325" y="89.5" font-size="17" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">she</text></g><g class="sh" style="animation-delay:0s"><circle cx="91" cy="146" r="16" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" stroke-dasharray="4 3"/><path d="M91 162V172" stroke="#A3A8CC" stroke-width="2"/><rect x="26" y="172" width="130" height="36" rx="8" fill="#EDE7F6" stroke="#2B2F4A" stroke-width="2"/><text x="91" y="195.5" font-size="17" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">had watched</text></g><g class="sh" style="animation-delay:0.3s"><circle cx="194" cy="146" r="16" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" stroke-dasharray="4 3"/><path d="M194 162V172" stroke="#A3A8CC" stroke-width="2"/><rect x="172" y="172" width="44" height="36" rx="8" fill="#FFE1B8" stroke="#2B2F4A" stroke-width="2"/><text x="194" y="195.5" font-size="17" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">a</text></g><g class="sh" style="animation-delay:0.6s"><circle cx="303" cy="146" r="16" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" stroke-dasharray="4 3"/><path d="M303 162V172" stroke="#A3A8CC" stroke-width="2"/><rect x="232" y="172" width="142" height="36" rx="8" fill="#D8F0D0" stroke="#2B2F4A" stroke-width="2"/><text x="303" y="195.5" font-size="17" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">documentary</text></g>
</svg>
