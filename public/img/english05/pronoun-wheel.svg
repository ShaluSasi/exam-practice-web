<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 190" role="img">
<title>Pronoun cards I, you, she, he and we circling around a swap symbol</title>
<style>
.L{fill:none;stroke-linecap:round;stroke-linejoin:round}.K{stroke:#2B2F4A}.o{stroke:#2B2F4A;stroke-width:2}
.orb{animation:orb 8s linear infinite;transform-origin:170px 95px}@keyframes orb{to{transform:rotate(360deg)}}.un{animation:un 8s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes un{to{transform:rotate(-360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<ellipse cx="170" cy="95" rx="70" ry="62" fill="none" stroke="#A3A8CC" stroke-width="2" stroke-dasharray="6 6"/><g class="orb"><g class="un"><rect x="211" y="77" width="58" height="36" rx="8" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2"/><text x="240" y="100.5" font-size="18" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">I</text></g><g class="un"><rect x="162.63118960624632" y="135.96550401029953" width="58" height="36" rx="8" fill="#FFE0E0" stroke="#2B2F4A" stroke-width="2"/><text x="191.63118960624632" y="159.46550401029953" font-size="18" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">you</text></g><g class="un"><rect x="84.36881039375368" y="113.44268564213334" width="58" height="36" rx="8" fill="#E3F7E6" stroke="#2B2F4A" stroke-width="2"/><text x="113.36881039375368" y="136.94268564213334" font-size="18" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">she</text></g><g class="un"><rect x="84.36881039375368" y="40.55731435786667" width="58" height="36" rx="8" fill="#FFF3C4" stroke="#2B2F4A" stroke-width="2"/><text x="113.36881039375368" y="64.05731435786667" font-size="18" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">he</text></g><g class="un"><rect x="162.6311896062463" y="18.034495989700474" width="58" height="36" rx="8" fill="#EDE7F6" stroke="#2B2F4A" stroke-width="2"/><text x="191.6311896062463" y="41.534495989700474" font-size="18" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">we</text></g></g>
<circle cx="170" cy="95" r="20" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2"/><path d="M160 90a10 10 0 0 1 18 -2M180 100a10 10 0 0 1 -18 2" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
