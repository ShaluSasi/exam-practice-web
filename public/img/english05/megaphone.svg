<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img">
<title>A megaphone sending out colourful hearts</title>
<style>
.L{fill:none;stroke-linecap:round;stroke-linejoin:round}.K{stroke:#2B2F4A}.o{stroke:#2B2F4A;stroke-width:2}
.ht{animation:ht 2.4s ease-out infinite;opacity:0}@keyframes ht{0%{transform:translate(0,0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translate(110px,-30px) scale(1.1);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="160" cy="100" r="80" fill="#FFE9D2"/>
<g transform="translate(110 108) scale(3)"><path d="M-12 -5H-4L10 -14V14L-4 5H-12Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.3" stroke-linejoin="round"/><path d="M-8 5L-5 14H0L-2 5" fill="#FFB36B" stroke="#2B2F4A" stroke-width="1.2"/></g>
<path class="ht" style="animation-delay:0s" d="M150 90c-6 -8 -16 0 -8 8l8 7 8 -7c8 -8 -2 -16 -8 -8z" fill="#E5484D" stroke="#2B2F4A" stroke-width="1.3"/><path class="ht" style="animation-delay:0.6s" d="M152 110c-6 -8 -16 0 -8 8l8 7 8 -7c8 -8 -2 -16 -8 -8z" fill="#F6C453" stroke="#2B2F4A" stroke-width="1.3"/><path class="ht" style="animation-delay:1.2s" d="M148 100c-6 -8 -16 0 -8 8l8 7 8 -7c8 -8 -2 -16 -8 -8z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="1.3"/><path class="ht" style="animation-delay:1.8s" d="M150 120c-6 -8 -16 0 -8 8l8 7 8 -7c8 -8 -2 -16 -8 -8z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.3"/>
</svg>
