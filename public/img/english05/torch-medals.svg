<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" role="img">
<title>A flaming torch between four medals on ribbons</title>
<style>
.L{fill:none;stroke-linecap:round;stroke-linejoin:round}.K{stroke:#2B2F4A}.o{stroke:#2B2F4A;stroke-width:2}
.fl{animation:fl 1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom center}@keyframes fl{to{transform:scale(.85,1.1) skewX(4deg)}}.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:top center}@keyframes sw{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
