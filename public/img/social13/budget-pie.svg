<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" role="img">
<title>A pie chart of an accessibility budget divided into six parts with percentages</title>
<style>
.pi{transform-box:fill-box;transform-origin:center;animation:pi 4s ease-in-out infinite}@keyframes pi{50%{transform:scale(1.03)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g class="pi"><circle cx="118" cy="136" r="95" fill="#2B2F4A"/><path d="M118 136L118 44A92 92 0 0 1 192.4 190.1Z" fill="#0B93D4" stroke="#FFFFFF" stroke-width="2.5"/><text x="170.5" y="114.3" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#FFFFFF" text-anchor="middle">35%</text><path d="M118 136L192.4 190.1A92 92 0 0 1 63.9 210.4Z" fill="#3FA34D" stroke="#FFFFFF" stroke-width="2.5"/><text x="127.2" y="199.2" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#FFFFFF" text-anchor="middle">25%</text><path d="M118 136L63.9 210.4A92 92 0 0 1 26 136Z" fill="#F6C453" stroke="#FFFFFF" stroke-width="2.5"/><text x="65.5" y="167.7" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#2B2F4A" text-anchor="middle">15%</text><path d="M118 136L26 136A92 92 0 0 1 43.6 81.9Z" fill="#FF8A1F" stroke="#FFFFFF" stroke-width="2.5"/><text x="62" y="122.8" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#FFFFFF" text-anchor="middle">10%</text><path d="M118 136L43.6 81.9A92 92 0 0 1 89.6 48.5Z" fill="#8E7CC3" stroke="#FFFFFF" stroke-width="2.5"/><text x="83.4" y="93.4" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#FFFFFF" text-anchor="middle">10%</text><path d="M118 136L89.6 48.5A92 92 0 0 1 118 44Z" fill="#E5484D" stroke="#FFFFFF" stroke-width="2.5"/></g><text x="240" y="46" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A" text-anchor="start">Total budget: ₹40 lakh</text><rect x="240" y="70" width="16" height="16" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5"/><text x="264" y="83" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#2B2F4A" text-anchor="start">Lifts 35%</text><rect x="240" y="98" width="16" height="16" rx="3" fill="#3FA34D" stroke="#2B2F4A" stroke-width="1.5"/><text x="264" y="111" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#2B2F4A" text-anchor="start">Ramps 25%</text><rect x="240" y="126" width="16" height="16" rx="3" fill="#F6C453" stroke="#2B2F4A" stroke-width="1.5"/><text x="264" y="139" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#2B2F4A" text-anchor="start">Tactile pathways 15%</text><rect x="240" y="154" width="16" height="16" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.5"/><text x="264" y="167" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#2B2F4A" text-anchor="start">Handrails 10%</text><rect x="240" y="182" width="16" height="16" rx="3" fill="#8E7CC3" stroke="#2B2F4A" stroke-width="1.5"/><text x="264" y="195" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#2B2F4A" text-anchor="start">Accessible toilets 10%</text><rect x="240" y="210" width="16" height="16" rx="3" fill="#E5484D" stroke="#2B2F4A" stroke-width="1.5"/><text x="264" y="223" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#2B2F4A" text-anchor="start">Signboards 5%</text>
</svg>
