und" stroke-linejoin="round"/><path d="M-9 14V0Q-9 -6 0 -6Q9 -6 9 0V14Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(190 218) scale(0.85)"><g class="bob"><circle cx="0" cy="-13" r="6.5" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-9 14V0Q-9 -6 0 -6Q9 -6 9 0V14Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(230 205) scale(0.85)"><g class="bob"><circle cx="0" cy="-13" r="6.5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-9 14V0Q-9 -6 0 -6Q9 -6 9 0V14Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(270 218) scale(0.85)"><g class="bob"><circle cx="0" cy="-13" r="6.5" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-9 14V0Q-9 -6 0 -6Q9 -6 9 0V14Z" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(310 205) scale(0.85)"><g class="bob"><circle cx="0" cy="-13" r="6.5" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-9 14V0Q-9 -6 0 -6Q9 -6 9 0V14Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg>