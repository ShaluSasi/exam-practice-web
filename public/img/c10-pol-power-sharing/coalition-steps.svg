<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Two coloured circles apart, then joined, then a ballot box, then a parliament with orange and blue people</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.blk,.drift,.rock{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.1)}}
.spin{animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rspin{transform-box:fill-box;transform-origin:center;animation:rspin 8s linear infinite}
@keyframes rspin{to{transform:rotate(-360deg)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.4}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-5px)}to{transform:translateX(5px)}}
.rock{animation:rock 3s ease-in-out infinite alternate}
@keyframes rock{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7C5CFF"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="22" font-size="13" text-anchor="middle">How parties come to share power</text><circle cx="45" cy="80" r="18" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="85" cy="80" r="18" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="155" cy="80" r="18" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="178" cy="80" r="18" fill="#0B93D4" fill-opacity=".8" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(255 80) scale(0.9)"><path d="M-3 -22L10 -26L12 -12L-1 -10Z" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-8)"/><rect x="-18" y="-8" width="36" height="28" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-9" y="-4" width="18" height="4" rx="2" fill="#2B2F4A"/></g><g transform="translate(345 82) scale(0.75)"><path d="M-14 -8A14 14 0 0 1 14 -8Z" fill="#E6D8FF" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 -22V-29" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-28" y="-8" width="56" height="24" fill="#E6D8FF" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-18 -8V16" stroke="#2B2F4A" stroke-width="2.5"/><path d="M-6 -8V16" stroke="#2B2F4A" stroke-width="2.5"/><path d="M6 -8V16" stroke="#2B2F4A" stroke-width="2.5"/><path d="M18 -8V16" stroke="#2B2F4A" stroke-width="2.5"/><rect x="-33" y="16" width="66" height="7" rx="2" fill="#E6D8FF" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(325 125) scale(0.6)"><circle cx="0" cy="-13" r="6.5" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-9 14V0Q-9 -6 0 -6Q9 -6 9 0V14Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(345 125) scale(0.6)"><circle cx="0" cy="-13" r="6.5" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-9 14V0Q-9 -6 0 -6Q9 -6 9 0V14Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(365 125) scale(0.6)"><circle cx="0" cy="-13" r="6.5" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-9 14V0Q-9 -6 0 -6Q9 -6 9 0V14Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><line x1="108" y1="80" x2="128" y2="80" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" class="fl" marker-end="url(#ah)"/><line x1="200" y1="80" x2="228" y2="80" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" class="fl" marker-end="url(#ah)"/><line x1="282" y1="80" x2="305" y2="80" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" class="fl" marker-end="url(#ah)"/><text x="65" y="125" font-size="11" text-anchor="middle">compete</text><text x="166" y="125" font-size="11" text-anchor="middle">alliance</text><text x="255" y="125" font-size="11" text-anchor="middle">win election</text><text x="345" y="148" font-size="11" text-anchor="middle">share power</text><text x="200" y="195" font-size="12" text-anchor="middle">Several steps, one after the other</text></svg>