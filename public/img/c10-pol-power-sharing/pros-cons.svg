" stroke-linejoin="round"/><path d="M99.2 118L103.2 122.0L109.6 113.2" fill="none" stroke="#3FA34D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M300.5 95.5L309.5 104.5M309.5 95.5L300.5 104.5" stroke="#E5484D" stroke-width="3.5" stroke-linecap="round"/><path d="M325.5 95.5L334.5 104.5M334.5 95.5L325.5 104.5" stroke="#E5484D" stroke-width="3.5" stroke-linecap="round"/><text x="80" y="155" font-size="12" text-anchor="middle">In favour</text><text x="320" y="155" font-size="12" text-anchor="middle">Against</text></svg>