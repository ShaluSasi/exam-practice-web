form-origin:184px 120px;transform-box:view-box"><path d="M227.7 134.2L225.0 140.9L214.7 142.3L210.9 146.9L211.0 157.2L204.9 161.0L195.7 156.1L189.9 157.5L184.0 166.0L176.8 165.4L172.3 156.1L166.7 153.9L157.0 157.2L151.5 152.5L153.3 142.3L150.1 137.3L140.3 134.2L138.6 127.2L146.0 120.0L146.5 114.1L140.3 105.8L143.0 99.1L153.3 97.7L157.1 93.1L157.0 82.8L163.1 79.0L172.3 83.9L178.1 82.5L184.0 74.0L191.2 74.6L195.7 83.9L201.3 86.1L211.0 82.8L216.5 87.5L214.7 97.7L217.9 102.7L227.7 105.8L229.4 112.8L222.0 120.0L221.5 125.9Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="184" cy="120" r="14.0" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g class="spin" style="animation-duration:7.5s;transform-origin:260px 120px;transform-box:view-box"><path d="M295.9 123.1L294.6 130.1L284.8 132.9L281.8 137.5L283.1 147.6L277.3 151.6L268.4 146.7L263.0 147.8L256.9 155.9L249.9 154.6L247.1 144.8L242.5 141.8L232.4 143.1L228.4 137.3L233.3 128.4L232.2 123.0L224.1 116.9L225.4 109.9L235.2 107.1L238.2 102.5L236.9 92.4L242.7 88.4L251.6 93.3L257.0 92.2L263.1 84.1L270.1 85.4L272.9 95.2L277.5 98.2L287.6 96.9L291.6 102.7L286.7 111.6L287.8 117.0Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="260" cy="120" r="10.5" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(330 120) scale(1.2)"><circle cx="0" cy="-13" r="6.5" fill="#B8BED0" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-9 14V0Q-9 -6 0 -6Q9 -6 9 0V14Z" fill="#B8BED0" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="200" y="205" font-size="12" text-anchor="middle">three language communities, one country</text></svg>