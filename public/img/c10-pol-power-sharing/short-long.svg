<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A curve that rises in the short run and then falls in the long run</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.blk,.drift,.rock{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.1)}}
.spin{animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rspin{transform-box:fill-box;transform-origin:center;animation:rspin 8s linear infinite}
@keyframes rspin{to{transform:rotate(-360deg)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.4}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-5px)}to{transform:translateX(5px)}}
.rock{animation:rock 3s ease-in-out infinite alternate}
@keyframes rock{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7C5CFF"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="22" font-size="13" text-anchor="middle">Imposing the majority's will over time</text><path d="M45 190H365M45 190V40" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M60 170L110 120L160 62L210 70L260 110L310 150L350 182" fill="none" stroke="#FF8A1F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="160" cy="62" r="7" fill="#FF8A1F" class="pul"/><path d="M205 36V190" stroke="#9AA3B5" stroke-width="2" stroke-dasharray="5 5"/><text x="125" y="214" font-size="12" text-anchor="middle">short run: looks attractive</text><text x="285" y="214" font-size="12" text-anchor="middle">long run: unity weakens</text></svg>