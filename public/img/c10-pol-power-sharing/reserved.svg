<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A grid of twenty-four assembly seats with six highlighted in green</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.blk,.drift,.rock{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.1)}}
.spin{animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rspin{transform-box:fill-box;transform-origin:center;animation:rspin 8s linear infinite}
@keyframes rspin{to{transform:rotate(-360deg)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.4}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-5px)}to{transform:translateX(5px)}}
.rock{animation:rock 3s ease-in-out infinite alternate}
@keyframes rock{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7C5CFF"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="22" font-size="13" text-anchor="middle">Seats in an assembly</text><circle cx="80" cy="62" r="13" fill="#B8BED0" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="128" cy="62" r="13" fill="#B8BED0" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="176" cy="62" r="13" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="224" cy="62" r="13" fill="#B8BED0" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="272" cy="62" r="13" fill="#B8BED0" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="320" cy="62" r="13" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="80" cy="100" r="13" fill="#B8BED0" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="128" cy="100" r="13" fill="#B8BED0" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="176" cy="100" r="13" fill="#B8BED0" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="224" cy="100" r="13" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="272" cy="100" r="13" fill="#B8BED0" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="320" cy="100" r="13" fill="#B8BED0" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="80" cy="138" r="13" fill="#B8BED0" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="128" cy="138" r="13" fill="#B8BED0" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="176" cy="138" r="13" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="224" cy="138" r="13" fill="#B8BED0" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="272" cy="138" r="13" fill="#B8BED0" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="320" cy="138" r="13" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="80" cy="176" r="13" fill="#B8BED0" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="128" cy="176" r="13" fill="#B8BED0" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="176" cy="176" r="13" fill="#B8BED0" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="224" cy="176" r="13" fill="#B8BED0" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ci