<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
<title>A cricket bat with a price tag, an eight-month calendar and a piggy bank</title>
<style>
.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.o2{stroke:#2B2F4A;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.drop{animation:dr 2.2s ease-in infinite}@keyframes dr{0%{transform:translateY(0);opacity:1}80%{transform:translateY(34px);opacity:1}100%{transform:translateY(34px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="36" font-family="system-ui, sans-serif" font-weight="600" font-size="17" fill="#2B2F4A" text-anchor="middle" >Goal: a new cricket bat</text>
<g transform="translate(80 170) rotate(-20)"><rect x="-16" y="-40" width="32" height="110" rx="10" fill="#E8C98E" class="o"/><rect x="-6" y="-90" width="12" height="52" rx="4" fill="#E5484D" class="o"/><path d="M-10 0V50" stroke="#C8A060" stroke-width="2"/></g>
<g transform="translate(110 92)"><path d="M-41 -13H32L41 0L32 13H-41Z" fill="#FFFFFF" class="o"/><circle cx="-33" cy="0" r="3" fill="#2B2F4A"/><text x="5" y="5" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A" text-anchor="middle" >₹2,400</text></g>
<g transform="translate(210 175)"><rect x="-54" y="-60" width="108" height="120" rx="8" fill="#FFFFFF" class="o"/><rect x="-54" y="-60" width="108" height="24" rx="8" fill="#0B93D4" class="o"/><text x="0" y="-42" font-family="system-ui, sans-serif" font-weight="600" font-size="13"  text-anchor="middle" fill="#FFFFFF">8 months</text>
<rect x="-44" y="-26" width="18" height="26" rx="3" fill="#CDEBFA" class="o2"/><rect x="-21" y="-26" width="18" height="26" rx="3" fill="#CDEBFA" class="o2"/><rect x="2" y="-26" width="18" height="26" rx="3" fill="#CDEBFA" class="o2"/><rect x="25" y="-26" width="18" height="26" rx="3" fill="#CDEBFA" class="o2"/><rect x="-44" y="8" width="18" height="26" rx="3" fill="#CDEBFA" class="o2"/><rect x="-21" y="8" width="18" height="26" rx="3" fill="#CDEBFA" class="o2"/><rect x="2" y="8" width="18" height="26" rx="3" fill="#CDEBFA" class="o2"/><rect x="25" y="8" width="18" height="26" rx="3" fill="#CDEBFA" class="o2"/><text x="0" y="52" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="middle" >₹ ? each month</text></g>
<g transform="translate(330 210) scale(1.3)"><path d="M-14 16V24M12 16V24" stroke="#C97A98" stroke-width="6" stroke-linecap="round"/><ellipse rx="28" ry="20" fill="#F7A8C4" class="o"/><path d="M-12 -18L-6 -28L0 -19" fill="#F7A8C4" class="o"/><ellipse cx="27" cy="2" rx="7" ry="8" fill="#F7A8C4" class="o"/><circle cx="26" cy="0" r="1.3" fill="#2B2F4A"/><circle cx="28" cy="5" r="1.3" fill="#2B2F4A"/><circle cx="12" cy="-6" r="2" fill="#2B2F4A"/><rect x="-10" y="-21" width="16" height="4" rx="2" fill="#2B2F4A"/><path d="M-28 -2Q-38 -6 -34 -14" fill="none" class="o"/></g><g class="drop"><circle cx="326" cy="150" r="10" fill="#F6C453" stroke="#B8860B" stroke-width="2"/><text x="326" y="154.2" font-family="system-ui, sans-serif" font-weight="600" font-size="11.5"  text-anchor="middle" fill="#8A5A00">₹</text></g>
</svg>
