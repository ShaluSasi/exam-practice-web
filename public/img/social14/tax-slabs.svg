<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
<title>A staircase bar chart of income tax rates for seven income slabs</title>
<style>
.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.o2{stroke:#2B2F4A;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.s{animation:s 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@keyframes s{50%{transform:scaleY(.95)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="210" y="30" font-family="system-ui, sans-serif" font-weight="600" font-size="15" fill="#2B2F4A" text-anchor="middle" >Income tax slabs (new regime)</text><path d="M46 240H392M46 240V40" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" fill="none"/><rect class="s" x="55" y="236" width="38" height="4" rx="3" fill="#E3E6F3" stroke="#2B2F4A" stroke-width="2.2"/><text x="74" y="229" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="middle" >Nil</text><text x="74" y="256" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="middle" >0–4</text><rect class="s" x="103" y="212" width="38" height="28" rx="3" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.2"/><text x="122" y="205" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="middle" >5%</text><text x="122" y="256" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="middle" >4–8</text><rect class="s" x="151" y="184" width="38" height="56" rx="3" fill="#BFE3C2" stroke="#2B2F4A" stroke-width="2.2"/><text x="170" y="177" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="middle" >10%</text><text x="170" y="256" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="middle" >8–12</text><rect class="s" x="199" y="156" width="38" height="84" rx="3" fill="#FCE3A0" stroke="#2B2F4A" stroke-width="2.2"/><text x="218" y="149" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="middle" >15%</text><text x="218" y="256" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="middle" >12–16</text><rect class="s" x="247" y="128" width="38" height="112" rx="3" fill="#FFD1A8" stroke="#2B2F4A" stroke-width="2.2"/><text x="266" y="121" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="middle" >20%</text><text x="266" y="256" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="middle" >16–20</text><rect class="s" x="295" y="100" width="38" height="140" rx="3" fill="#FFD1E3" stroke="#2B2F4A" stroke-width="2.2"/><text x="314" y="93" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="middle" >25%</text><text x="314" y="256" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="middle" >20–24</text><rect class="s" x="343" y="72" width="38" height="168" rx="3" fill="#F4B4B6" stroke="#2B2F4A" stroke-width="2.2"/><text x="362" y="65" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="middle" >30%</text><text x="362" y="256" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="middle" >24+</text><text x="220" y="284" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#2B2F4A" text-anchor="middle" >Annual income slab (₹ lakh)</text><text transform="translate(26 150) rotate(-90)" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#2B2F4A" text-anchor="middle">Tax rate</text>
</svg>
