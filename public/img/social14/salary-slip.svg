</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="24" y="36" width="260" height="228" rx="12" fill="#FFFFFF" class="o"/><rect x="24" y="36" width="260" height="38" rx="12" fill="#FCE3A0" class="o"/><text x="154" y="61" font-family="system-ui, sans-serif" font-weight="600" font-size="15" fill="#2B2F4A" text-anchor="middle" >Step 1: Taxable income</text>
