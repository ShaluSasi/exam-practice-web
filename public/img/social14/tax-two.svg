<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
<title>A salary slip on one side and a shop bill on the other</title>
<style>
.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.o2{stroke:#2B2F4A;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.fl{animation:fl 3s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g class="fl"><rect x="24" y="50" width="160" height="210" rx="12" fill="#FFFFFF" class="o"/><rect x="24" y="50" width="160" height="32" rx="12" fill="#CDEBFA" class="o"/><text x="104" y="72" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A" text-anchor="middle" >Salary slip</text><text x="40" y="108" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="start" >Monthly pay</text><text x="168" y="108" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="end" >₹60,000</text><text x="40" y="136" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="start" >Tax cut from pay</text><text x="168" y="136" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="end" >₹ —</text><path d="M40 160H168M40 180H140M40 200H150" stroke="#E3E6F3" stroke-width="6" stroke-linecap="round"/></g>
<path d="M216 50H376V250L360 240L344 250L328 240L312 250L296 240L280 250L264 240L248 250L232 240L216 250Z" fill="#FFFFFF" class="o"/><text x="296" y="76" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A" text-anchor="middle" >Shop bill</text><text x="230" y="108" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="start" >Biscuits</text><text x="362" y="108" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="end" >₹40</text><text x="230" y="132" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="start" >Soap</text><text x="362" y="132" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="end" >₹60</text><text x="230" y="156" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="start" >Tax in price</text><text x="362" y="156" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="end" >₹ —</text><path d="M230 170H362" stroke="#A3A8CC" stroke-width="2"/><text x="230" y="192" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="start" >Total</text><text x="362" y="192" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="end" >₹ —</text>
</svg>
