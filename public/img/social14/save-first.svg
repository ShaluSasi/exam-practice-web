<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
<title>Income flowing first into a piggy bank and then into a shopping bag</title>
<style>
.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.o2{stroke:#2B2F4A;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.mv{animation:mv 3s ease-in-out infinite}@keyframes mv{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(250px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="16" y="70" width="112" height="150" rx="12" fill="#E3F2FD" class="o"/><rect x="144" y="70" width="112" height="150" rx="12" fill="#FFE3EE" class="o"/><rect x="272" y="70" width="112" height="150" rx="12" fill="#FFF3C4" class="o"/>
<g transform="translate(72 132)"><rect x="-34" y="-22" width="68" height="44" rx="8" fill="#8A5A2B" class="o"/><rect x="10" y="-8" width="26" height="16" rx="4" fill="#C8925A" class="o2"/><g transform="translate(-6 -26)"><rect x="-20" y="-9" width="40" height="18" rx="3" fill="#BFE3C2" stroke="#2E7D3A" stroke-width="2"/><circle r="6" fill="none" stroke="#2E7D3A" stroke-width="1.5"/><text x="0" y="4" font-family="system-ui, sans-serif" font-weight="600" font-size="11"  text-anchor="middle" fill="#2E7D3A">₹</text></g></g>
<text x="72" y="186" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A" text-anchor="middle" >Income</text><text x="72" y="206" font-family="system-ui, sans-serif" font-weight="600" font-size="15"  text-anchor="middle" fill="#0B6FA4">₹45,000</text>
<g transform="translate(200 132) scale(1.1)"><path d="M-14 16V24M12 16V24" stroke="#C97A98" stroke-width="6" stroke-linecap="round"/><ellipse rx="28" ry="20" fill="#F7A8C4" class="o"/><path d="M-12 -18L-6 -28L0 -19" fill="#F7A8C4" class="o"/><ellipse cx="27" cy="2" rx="7" ry="8" fill="#F7A8C4" class="o"/><circle cx="26" cy="0" r="1.3" fill="#2B2F4A"/><circle cx="28" cy="5" r="1.3" fill="#2B2F4A"/><circle cx="12" cy="-6" r="2" fill="#2B2F4A"/><rect x="-10" y="-21" width="16" height="4" rx="2" fill="#2B2F4A"/><path d="M-28 -2Q-38 -6 -34 -14" fill="none" class="o"/></g><text x="200" y="186" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A" text-anchor="middle" >Save 20%</text><text x="200" y="206" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A" text-anchor="middle" >first</text>
<g transform="translate(328 132)"><path d="M-26 -16H26L30 26H-30Z" fill="#FF8A1F" class="o"/><path d="M-12 -16Q-12 -32 0 -32Q12 -32 12 -16" fill="none" class="o"/></g><text x="328" y="186" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A" text-anchor="middle" >Left to</text><text x="328" y="206" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A" text-anchor="middle" >spend: ₹ ?</text>
<path d="M130 250L268 250M259.2 254.8L268 250L259.2 245.2" stroke="#A3A8CC" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g class="mv"><circle cx="70" cy="250" r="9" fill="#F6C453" stroke="#B8860B" stroke-width="2"/><text x="70" y="253.78" font-family="system-ui, sans-serif" font-weight="600" font-size="10.35"  text-anchor="middle" fill="#8A5A00">₹</text></g><text x="200" y="46" font-family="system-ui, sans-serif" font-weight="600" font-size="17" fill="#2B2F4A" text-anchor="middle" >Save first, spend later</text>
</svg>
