<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
<title>A bond certificate showing its value, interest rate and maturity</title>
<style>
.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.o2{stroke:#2B2F4A;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.sh{animation:sh 3s ease-in-out infinite}@keyframes sh{50%{opacity:.5}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="30" y="30" width="340" height="240" rx="10" fill="#FFF3C4" class="o"/><rect x="44" y="44" width="312" height="212" rx="6" fill="none" stroke="#C98A12" stroke-width="2.5" stroke-dasharray="8 4"/>
<text x="200" y="84" font-family="system-ui, sans-serif" font-weight="600" font-size="20" fill="#2B2F4A" text-anchor="middle" >BOND CERTIFICATE</text><path d="M110 96H290" stroke="#C98A12" stroke-width="2"/>
<text x="70" y="132" font-family="system-ui, sans-serif" font-weight="600" font-size="15" fill="#2B2F4A" text-anchor="start" >Face value:</text><text x="330" y="132" font-family="system-ui, sans-serif" font-weight="600" font-size="15"  text-anchor="end" fill="#0B6FA4">₹20,000</text><text x="70" y="164" font-family="system-ui, sans-serif" font-weight="600" font-size="15" fill="#2B2F4A" text-anchor="start" >Interest:</text><text x="330" y="164" font-family="system-ui, sans-serif" font-weight="600" font-size="15"  text-anchor="end" fill="#0B6FA4">6% per year</text><text x="70" y="196" font-family="system-ui, sans-serif" font-weight="600" font-size="15" fill="#2B2F4A" text-anchor="start" >Matures after:</text><text x="330" y="196" font-family="system-ui, sans-serif" font-weight="600" font-size="15"  text-anchor="end" fill="#0B6FA4">1 year</text>
<g transform="translate(300 232)"><path d="M-10 6L-16 30L-4 24L2 34L6 8Z" fill="#E5484D" class="o2"/><circle r="18" fill="#F6C453" class="o2"/><circle class="sh" r="10" fill="#FFF3C4"/></g><path d="M70 236H180" stroke="#2B2F4A" stroke-width="2"/>
</svg>
