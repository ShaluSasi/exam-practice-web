<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
<title>A zigzag line graph of a share-market index that rises over many years</title>
<style>
.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.o2{stroke:#2B2F4A;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.ln{stroke-dasharray:900;animation:ln 5s ease-out infinite}@keyframes ln{0%{stroke-dashoffset:900}70%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="210" y="32" font-family="system-ui, sans-serif" font-weight="600" font-size="15" fill="#2B2F4A" text-anchor="middle" >A share-market index (illustrative)</text><path d="M54 210H384M54 170H384M54 130H384M54 90H384" stroke="#E3E6F3" stroke-width="1.5"/><path d="M54 250H388M54 250V50" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
<path class="ln" d="M54.0 226.0L68.5 221.2L83.0 228.4L97.5 223.6L112.0 214.0L126.5 204.4L141.0 187.6L155.5 206.8L170.0 192.4L184.5 182.8L199.0 185.2L213.5 170.8L228.0 178.0L242.5 163.6L257.0 144.4L271.5 154.0L286.0 125.2L300.5 110.8L315.0 118.0L329.5 96.4L344.0 77.2L358.5 86.8L373.0 62.8" stroke="#0B93D4" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="220" y="276" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#2B2F4A" text-anchor="middle" >Years</text><text transform="translate(30 150) rotate(-90)" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#2B2F4A" text-anchor="middle">Index value</text>
</svg>
