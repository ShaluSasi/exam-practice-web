<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
<title>A chalkboard with the compound interest formula and the family's savings figures</title>
<style>
.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.o2{stroke:#2B2F4A;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.sp{animation:sp 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}@keyframes sp{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="20" y="24" width="360" height="200" rx="10" fill="#2F6B4F" stroke="#8A5A2B" stroke-width="8"/>
<text x="200" y="84" font-family="system-ui, sans-serif" font-weight="600" font-size="30" fill="#FFFFFF" text-anchor="middle">A = P(1 + r)<tspan dy="-12" font-size="18">n</tspan></text>
<text x="200" y="130" font-family="system-ui, sans-serif" font-weight="600" font-size="18"  text-anchor="middle" fill="#FFF3C4">P = ₹30,000</text><text x="200" y="160" font-family="system-ui, sans-serif" font-weight="600" font-size="18"  text-anchor="middle" fill="#FFF3C4">r = 8% a year</text><text x="200" y="190" font-family="system-ui, sans-serif" font-weight="600" font-size="18"  text-anchor="middle" fill="#FFF3C4">n = 5 years</text>
<path d="M0 250H400V284Q400 300 384 300H16Q0 300 0 284Z" fill="#E8D9B5"/><g class="sp"><g transform="translate(320 262) scale(1.6)"><path d="M0 16V-8" stroke="#2E7D3A" stroke-width="3" stroke-linecap="round"/><path d="M0 2Q-16 0 -16 -12Q-2 -12 0 2Z" fill="#7BC67E" class="o2"/><path d="M0 -4Q16 -6 16 -18Q2 -18 0 -4Z" fill="#7BC67E" class="o2"/><circle cx="0" cy="-16" r="7" fill="#F6C453" stroke="#B8860B" stroke-width="2"/><text x="0" y="-13.06" font-family="system-ui, sans-serif" font-weight="600" font-size="9"  text-anchor="middle" fill="#8A5A00">₹</text><path d="M-14 16H14" stroke="#8A6A3A" stroke-width="3" stroke-linecap="round"/></g></g><circle cx="80" cy="262" r="12" fill="#F6C453" stroke="#B8860B" stroke-width="2"/><text x="80" y="267.04" font-family="system-ui, sans-serif" font-weight="600" font-size="13.799999999999999"  text-anchor="middle" fill="#8A5A00">₹</text><circle cx="106" cy="262" r="12" fill="#F6C453" stroke="#B8860B" stroke-width="2"/><text x="106" y="267.04" font-family="system-ui, sans-serif" font-weight="600" font-size="13.799999999999999"  text-anchor="middle" fill="#8A5A00">₹</text><circle cx="93" cy="244" r="12" fill="#F6C453" stroke="#B8860B" stroke-width="2"/><text x="93" y="249.04" font-family="system-ui, sans-serif" font-weight="600" font-size="13.799999999999999"  text-anchor="middle" fill="#8A5A00">₹</text>
</svg>
