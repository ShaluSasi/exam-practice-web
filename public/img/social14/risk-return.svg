<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
<title>A graph of return against risk with five lettered points</title>
<style>
.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.o2{stroke:#2B2F4A;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.pt{animation:pt 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pt{50%{transform:scale(1.25)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M60 200H384M60 150H384M60 100H384M60 50H384" stroke="#E3E6F3" stroke-width="1.5"/><path d="M60 254H390M60 254V36" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
<path d="M78 240L360 52" stroke="#3FA34D" stroke-width="3" stroke-dasharray="8 7"/><circle class="pt" cx="100" cy="220" r="10" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2"/><text x="82" y="210" font-family="system-ui, sans-serif" font-weight="600" font-size="15" fill="#2B2F4A" text-anchor="middle" >W</text><circle class="pt" cx="175" cy="178" r="10" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2"/><text x="157" y="168" font-family="system-ui, sans-serif" font-weight="600" font-size="15" fill="#2B2F4A" text-anchor="middle" >X</text><circle class="pt" cx="250" cy="128" r="10" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2"/><text x="232" y="118" font-family="system-ui, sans-serif" font-weight="600" font-size="15" fill="#2B2F4A" text-anchor="middle" >Y</text><circle class="pt" cx="330" cy="76" r="10" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2"/><text x="312" y="66" font-family="system-ui, sans-serif" font-weight="600" font-size="15" fill="#2B2F4A" text-anchor="middle" >Z</text><circle class="pt" cx="315" cy="222" r="10" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="2"/><text x="297" y="212" font-family="system-ui, sans-serif" font-weight="600" font-size="15" fill="#2B2F4A" text-anchor="middle" >V</text>
<text x="66" y="272" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="start" >Low</text><text x="384" y="272" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="end" >High</text><text x="225" y="288" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A" text-anchor="middle" >Risk</text><text x="52" y="250" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="end" >Low</text><text x="52" y="50" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="end" >High</text><text transform="translate(22 150) rotate(-90)" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A" text-anchor="middle">Return</text>
</svg>
