"#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><text x="202" y="183.875" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="middle" >₹3,500</text><text x="202" y="254" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="middle" >Transport</text><rect class="g3" x="240" y="128" width="38" height="110" rx="3" fill="#BFE3C2" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><text x="259" y="122" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="middle" >₹8,000</text><text x="259" y="254" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="middle" >Savings</text><rect class="g4" x="297" y="203.625" width="38" height="34.375" rx="3" fill="#FFD1E3" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><text x="316" y="197.625" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="middle" >₹2,500</text><text x="316" y="254" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="middle" >Eating</text><text x="316" y="268" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="middle" >out</text><rect class="g5" x="354" y="169.25" width="38" height="68.75" rx="3" fill="#D5D8EC" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><text x="373" y="163.25" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="middle" >₹5,000</text><text x="373" y="254" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="middle" >School</text><text x="373" y="268" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="middle" >fees</text>
