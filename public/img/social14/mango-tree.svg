<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
<title>A small sapling and, years later, a big tree full of mangoes dropping into a basket</title>
<style>
.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.o2{stroke:#2B2F4A;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.fall{animation:fa 3s ease-in infinite}@keyframes fa{0%,30%{transform:translateY(0)}80%,100%{transform:translateY(88px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M0 250H400V284Q400 300 384 300H16Q0 300 0 284Z" fill="#CFE8B5"/><g transform="translate(80 250)"><path d="M0 0V-40" stroke="#8A5A2B" stroke-width="5" stroke-linecap="round"/><path d="M0 -30Q-22 -32 -22 -48Q-4 -48 0 -30Z" fill="#7BC67E" class="o2"/><path d="M0 -38Q22 -40 22 -56Q4 -56 0 -38Z" fill="#7BC67E" class="o2"/></g><text x="80" y="280" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A" text-anchor="middle" >Now</text>
<path d="M120 200L180 200M171.2 204.8L180 200L171.2 195.2" stroke="#FF8A1F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M272 250V160M272 196L246 170M272 186L298 164" stroke="#8A5A2B" stroke-width="13" stroke-linecap="round" fill="none"/><path d="M200 140Q190 80 240 64Q270 34 310 60Q356 66 350 120Q358 168 310 176Q270 192 234 176Q196 170 200 140Z" fill="#5FB565" class="o"/>
<ellipse cx="250" cy="110" rx="8" ry="10" fill="#F6C453" stroke="#C98A12" stroke-width="2"/><ellipse cx="290" cy="92" rx="8" ry="10" fill="#F6C453" stroke="#C98A12" stroke-width="2"/><ellipse cx="320" cy="130" rx="8" ry="10" fill="#F6C453" stroke="#C98A12" stroke-width="2"/><ellipse cx="270" cy="145" rx="8" ry="10" fill="#F6C453" stroke="#C98A12" stroke-width="2"/><ellipse cx="230" cy="140" rx="8" ry="10" fill="#F6C453" stroke="#C98A12" stroke-width="2"/><ellipse cx="305" cy="165" rx="8" ry="10" fill="#F6C453" stroke="#C98A12" stroke-width="2"/>
<g class="fall"><ellipse cx="322" cy="160" rx="8" ry="10" fill="#F6C453" stroke="#C98A12" stroke-width="2"/></g>
<g transform="translate(330 260)"><path d="M-30 -14H30L24 14H-24Z" fill="#C8925A" class="o"/><path d="M-27 -2H27" stroke="#8A5A2B" stroke-width="2"/></g><text x="272" y="290" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A" text-anchor="middle" >Years later</text>
</svg>
