<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
<title>A staircase of four numbered steps with a flag at the top</title>
<style>
.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.o2{stroke:#2B2F4A;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.kid{animation:kd 6s steps(1) infinite}@keyframes kd{0%{transform:translate(0,0)}25%{transform:translate(80px,-45px)}50%{transform:translate(160px,-90px)}75%{transform:translate(240px,-135px)}}.fl{animation:fl 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}@keyframes fl{50%{transform:skewY(8deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="40" y="240" width="320" height="45" fill="#CDEBFA" class="o"/><text x="80" y="269" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A" text-anchor="middle" >Step 1</text><rect x="120" y="195" width="240" height="45" fill="#BFE3C2" class="o"/><text x="160" y="224" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A" text-anchor="middle" >Step 2</text><rect x="200" y="150" width="160" height="45" fill="#FCE3A0" class="o"/><text x="240" y="179" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A" text-anchor="middle" >Step 3</text><rect x="280" y="105" width="80" height="45" fill="#FFD1A8" class="o"/><text x="320" y="134" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A" text-anchor="middle" >Step 4</text><path d="M345 105V40" stroke="#2B2F4A" stroke-width="3"/><path class="fl" d="M345 40H380L370 52L380 64H345Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="1.8"/>
<g class="kid"><g transform="translate(80 240) scale(0.9)"><g class=""><path d="M-7 0V-22M7 0V-22" stroke="#2B2F4A" stroke-width="7" stroke-linecap="round"/><path d="M-12 -44L-20 -27M12 -44L20 -27" stroke="#E8B48A" stroke-width="5.5" stroke-linecap="round"/><rect x="-13" y="-50" width="26" height="30" rx="9" fill="#FF8A1F" class="o"/><circle cx="0" cy="-61" r="11" fill="#E8B48A" class="o"/><path d="M-11 -62Q-11 -75 0 -74Q11 -75 11 -62Q5 -69 -11 -62Z" fill="#3A2A20"/><circle cx="-4" cy="-60" r="1.4" fill="#2B2F4A"/><circle cx="4" cy="-60" r="1.4" fill="#2B2F4A"/><path d="M-4 -55Q0 -52 4 -55" fill="none" stroke="#2B2F4A" stroke-width="1.6" stroke-linecap="round"/></g></g></g>
</svg>
