<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" role="img">
<title>Sun, rain cloud, river and tree linked in a never-ending circle</title>
<style>
.sway{animation:sw 4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sw{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}.ring{animation:rg 6s linear infinite}@keyframes rg{to{stroke-dashoffset:-240}}.rain{animation:rn 1s linear infinite}@keyframes rn{from{transform:translateY(0);opacity:1}to{transform:translateY(10px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle class="ring" cx="150" cy="124" r="80" fill="none" stroke="#A3A8CC" stroke-width="4" stroke-dasharray="14 10"/><circle cx="150" cy="44" r="20" fill="#F6C453" stroke="#E0A92E" stroke-width="2.5"/><path d="M212 112Q210 96 226 96Q234 84 248 92Q262 90 260 106Q270 110 262 120H214Z" fill="#FFFFFF" stroke="#9DB6CC" stroke-width="2.5"/><g class="rain" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round"><path d="M222 128v8M236 130v8M250 128v8"/></g><path d="M110 206Q150 192 190 206" fill="none" stroke="#0B93D4" stroke-width="10" stroke-linecap="round"/><g transform="translate(70 150) scale(0.6)" stroke-linejoin="round"><rect x="-6" y="-50" width="12" height="50" fill="#A8743F" stroke="#7A5230" stroke-width="2"/><g class="sway"><circle cx="0" cy="-66" r="28" fill="#7CC36E" stroke="#3FA34D" stroke-width="2.5"/><circle cx="-20" cy="-52" r="16" fill="#8FD07F" stroke="#3FA34D" stroke-width="2.5"/><circle cx="20" cy="-54" r="17" fill="#8FD07F" stroke="#3FA34D" stroke-width="2.5"/></g></g>
</svg>
