<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" role="img">
<title>A tank of water: a wooden log floats while an iron block sinks</title>
<style>
.flo{animation:fl 2.4s ease-in-out infinite alternate}@keyframes fl{to{transform:translateY(4px)}}.sink{animation:sk 4s ease-in infinite}@keyframes sk{0%,10%{transform:translateY(-118px)}80%,100%{transform:translateY(0)}}.bub{animation:bu 4s linear infinite}@keyframes bu{from{transform:translateY(0);opacity:1}to{transform:translateY(-80px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="40" y="40" width="220" height="160" rx="8" fill="#CDEBFA" stroke="#0B93D4" stroke-width="3"/><rect x="40" y="40" width="220" height="30" fill="#FFF9EE" opacity=".6"/><path d="M40 70H260" stroke="#0B93D4" stroke-width="2.5"/><g class="flo"><rect x="66" y="58" width="80" height="20" rx="10" fill="#C8925A" stroke="#8A5A33" stroke-width="2.5"/><circle cx="76" cy="68" r="6" fill="#E3B47F" stroke="#8A5A33" stroke-width="2"/></g><g class="sink"><rect x="186" y="168" width="40" height="26" rx="3" fill="#7E8299" stroke="#2B2F4A" stroke-width="2.5"/></g><g class="bub" fill="none" stroke="#FFFFFF" stroke-width="2"><circle cx="200" cy="150" r="4"/><circle cx="210" cy="120" r="3"/></g>
</svg>
