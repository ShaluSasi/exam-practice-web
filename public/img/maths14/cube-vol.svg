<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img"><title>A cube with its volume written beside it</title><style>.t{font:600 14px system-ui,sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui,sans-serif;fill:#2B2F4A}.b{font:700 17px system-ui,sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M90 110h120v120h-120Z" fill="#9ED6F2" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M90 110l55 -48h120l-55 48Z" fill="#E3F4FD" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M210 110l55 -48v120l-55 48Z" fill="#5DB6E4" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="262" y="120" width="112" height="64" rx="12" fill="#FFF" stroke="#2B2F4A" stroke-width="2.5"/><text x="318" y="146" class="s m" >Volume</text><text x="318" y="170" class="b m" >64 cm³</text><text x="318" y="214" class="s m" >Total surface</text><text x="318" y="234" class="t m" >area = ?</text></svg>