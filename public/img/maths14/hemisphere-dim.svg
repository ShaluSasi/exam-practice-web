<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img"><title>A solid hemisphere with its radius marked as 21 centimetres</title><defs><linearGradient id="g34" x1="0" x2="1"><stop offset="0" stop-color="#E1F4DD"/><stop offset=".4" stop-color="#A9DDA3"/><stop offset="1" stop-color="#6DBB68"/></linearGradient></defs><style>.t{font:600 14px system-ui,sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui,sans-serif;fill:#2B2F4A}.b{font:700 17px system-ui,sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M90 100A110 110 0 0 0 310 100Z" fill="url(#g34)" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="200" cy="100" rx="110" ry="34" fill="#E1F4DD" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><line x1="200" y1="100" x2="310" y2="100" stroke="#E5484D" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="7 5"/><circle cx="200" cy="100" r="4.5" fill="#E5484D"/><text x="350" y="104" class="t m" >r = 21 cm</text><text x="200" y="260" class="s m" >Solid hemisphere</text></svg>