<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img"><title>Two swimming pool designs drawn as cuboids with depth, length and width</title><style>.t{font:600 14px system-ui,sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui,sans-serif;fill:#2B2F4A}.b{font:700 17px system-ui,sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}@keyframes wv{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}.w{animation:wv 3s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="120" y="40" class="b m" >Pool A</text><text x="360" y="40" class="b m" >Pool B</text><path d="M30 100h100v72h-100Z" fill="#9ED6F2" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M30 100l46 -34h100l-46 34Z" fill="#E3F4FD" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M130 100l46 -34v72l-46 34Z" fill="#5DB6E4" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><g class="w"><path d="M40 112h80" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></g><text x="80" y="196" class="s m" >50 ft</text><text x="196" y="125" class="s m" >8 ft</text><text x="150" y="70" class="s m" >20 ft</text><path d="M265 110h170v54h-170Z" fill="#9ED6F2" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M265 110l34 -25h170l-34 25Z" fill="#E3F4FD" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M435 110l34 -25v54l-34 25Z" fill="#5DB6E4" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><g class="w"><path d="M280 122h140" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></g><text x="350" y="188" class="s m" >100 ft</text><text x="258" y="142" class="s" style="text-anchor:end">6 ft</text><text x="430" y="76" class="s m" >15 ft</text></svg>