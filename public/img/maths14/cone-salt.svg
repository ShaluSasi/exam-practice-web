<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img"><title>A cone full of salt being emptied into a cylinder with the same base and height</title><defs><linearGradient id="g25" x1="0" x2="1"><stop offset="0" stop-color="#E3F4FD"/><stop offset=".4" stop-color="#9ED6F2"/><stop offset="1" stop-color="#5DB6E4"/></linearGradient><linearGradient id="g26" x1="0" x2="1"><stop offset="0" stop-color="#FFE7CC"/><stop offset=".4" stop-color="#FFC48A"/><stop offset="1" stop-color="#FF9A3D"/></linearGradient></defs><style>.t{font:600 14px system-ui,sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui,sans-serif;fill:#2B2F4A}.b{font:700 17px system-ui,sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}@keyframes fill{0%{transform:scaleY(.02)}25%,33%{transform:scaleY(.34)}58%,66%{transform:scaleY(.67)}90%,100%{transform:scaleY(1)}}.sl{animation:fill 7s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@keyframes tip{0%,100%{transform:rotate(0)}30%,70%{transform:rotate(-14deg)}}.cn{animation:tip 7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M295 90V240A50 16 0 0 0 395 240V90Z" fill="url(#g25)" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="345" cy="90" rx="50" ry="16" fill="#E3F4FD" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path class="sl" d="M299 90V240A46 14 0 0 0 391 240V90Z" fill="#FFFDF2"/><ellipse cx="345" cy="90" rx="50" ry="16" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><g class="cn"><path d="M70 60L120 210L170 60Z" fill="url(#g26)" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="120" cy="60" rx="50" ry="16" fill="#FFE7CC" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M85 70h70L120 200Z" fill="#FFFDF2" opacity=".9"/></g><text x="120" y="258" class="t m" >Cone</text><text x="345" y="285" class="s m" >Same base, same height</text><path d="M208 150h38m-9 -8l9 8l-9 8" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>