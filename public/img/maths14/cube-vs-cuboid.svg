<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img"><title>A cube and a cuboid made of the same material</title><style>.t{font:600 14px system-ui,sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui,sans-serif;fill:#2B2F4A}.b{font:700 17px system-ui,sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M40 110h90v90h-90Z" fill="#9ED6F2" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M40 110l45 -38h90l-45 38Z" fill="#E3F4FD" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M130 110l45 -38v90l-45 38Z" fill="#5DB6E4" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="85" y="230" class="t m" >Cube A</text><text x="85" y="250" class="s m" >side 6 cm</text><path d="M230 130h135v60h-135Z" fill="#FFC48A" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M230 130l60 -36h135l-60 36Z" fill="#FFE7CC" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M365 130l60 -36v60l-60 36Z" fill="#FF9A3D" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="335" y="230" class="t m" >Cuboid B</text><text x="335" y="250" class="s m" >9 cm × 6 cm × 4 cm</text><text x="240" y="70" class="s m" >Same material</text></svg>