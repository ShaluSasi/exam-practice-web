<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img"><title>A godown shaped like a cuboid and one small cuboidal box</title><style>.t{font:600 14px system-ui,sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui,sans-serif;fill:#2B2F4A}.b{font:700 17px system-ui,sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}.bx{animation:bob 2.4s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M50 100h230v110h-230Z" fill="#FFC48A" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M50 100l100 -60h230l-100 60Z" fill="#FFE7CC" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M280 100l100 -60v110l-100 60Z" fill="#FF9A3D" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><line x1="50" y1="230" x2="280" y2="230" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" /><line x1="50" y1="224" x2="50" y2="236" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" /><line x1="280" y1="224" x2="280" y2="236" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" /><text x="165" y="252" class="t m m" >40 m</text><line x1="28" y1="100" x2="28" y2="210" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" /><line x1="34" y1="100" x2="22" y2="100" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" /><line x1="34" y1="210" x2="22" y2="210" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" /><text x="14" y="160" class="t m m" transform="rotate(-90 14 160)">10 m</text><line x1="292" y1="90" x2="392" y2="30" stroke="#3FA34D" stroke-width="2.5" stroke-linecap="round" /><line x1="288.9" y1="84.9" x2="295.1" y2="95.1" stroke="#3FA34D" stroke-width="2.5" stroke-linecap="round" /><line x1="388.9" y1="24.9" x2="395.1" y2="35.1" stroke="#3FA34D" stroke-width="2.5" stroke-linecap="round" /><text x="333" y="48" class="t m m" transform="rotate(-31 333 48)">25 m</text><g class="bx"><path d="M385 170h60v36h-60Z" fill="#9ED6F2" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M385 170l26 -20h60l-26 20Z" fill="#E3F4FD" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M445 170l26 -20v36l-26 20Z" fill="#5DB6E4" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g><text x="415" y="236" class="s m" >Box</text><text x="415" y="254" class="s m" >2 × 1.25 × 1 m</text></svg>