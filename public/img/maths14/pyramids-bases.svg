<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img"><title>A pyramid with a triangular base and a pyramid with a square base</title><style>.t{font:600 14px system-ui,sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui,sans-serif;fill:#2B2F4A}.b{font:700 17px system-ui,sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}@keyframes pu{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.p1{animation:pu 3s ease-in-out infinite}.p2{animation:pu 3s ease-in-out -1.5s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><g class="p1"><path d="M130 190L40 225M130 190L110 70" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-dasharray="6 5"/><path d="M110 70L170 245L130 190Z" fill="#6DBB68" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M110 70L40 225L170 245Z" fill="#A9DDA3" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g><g class="p2"><path d="M343 159.66L305.8 188.8M343 159.66L454.6 173.3M343 159.66L380.2 83.4" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round"/><path d="M380.2 83.4L417.4 202.44L454.6 173.3Z" fill="#F0C24D" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M380.2 83.4L305.8 188.8L417.4 202.44Z" fill="#F8DC8C" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g><text x="105" y="275" class="s m" >Triangular base</text><text x="340" y="275" class="s m" >Square base</text></svg>