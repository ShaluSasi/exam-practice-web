<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img"><title>Earth, Jupiter and the Sun drawn as circles of different sizes, not to scale</title><defs><radialGradient id="g59" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#E3F4FD"/><stop offset=".5" stop-color="#9ED6F2"/><stop offset="1" stop-color="#5DB6E4"/></radialGradient><radialGradient id="g60" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFF3CF"/><stop offset=".5" stop-color="#F8DC8C"/><stop offset="1" stop-color="#F0C24D"/></radialGradient><radialGradient id="g61" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFE7CC"/><stop offset=".5" stop-color="#FFC48A"/><stop offset="1" stop-color="#FF9A3D"/></radialGradient></defs><style>.t{font:600 14px system-ui,sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui,sans-serif;fill:#2B2F4A}.b{font:700 17px system-ui,sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}@keyframes gw{0%,100%{opacity:.55}50%{opacity:1}}.sn{animation:gw 3s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><circle cx="50" cy="140" r="14" fill="url(#g59)" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><g class="sn"><circle cx="400" cy="140" r="100" fill="url(#g60)" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g><circle cx="170" cy="140" r="46" fill="url(#g61)" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="50" y="190" class="t m" >Earth</text><text x="50" y="208" class="s m" >6370 km</text><text x="170" y="208" class="t m" >Jupiter</text><text x="170" y="226" class="s m" >69,900 km</text><text x="400" y="262" class="t m" >Sun</text><text x="400" y="280" class="s m" >6,95,700 km</text><text x="260" y="40" class="s m" >Radii, not drawn to scale</text></svg>