<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img"><title>A string tied round the middle of a planet and a second, slightly longer string held a little way above the surface</title><defs><radialGradient id="g62" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#E3F4FD"/><stop offset=".5" stop-color="#9ED6F2"/><stop offset="1" stop-color="#5DB6E4"/></radialGradient></defs><style>.t{font:600 14px system-ui,sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui,sans-serif;fill:#2B2F4A}.b{font:700 17px system-ui,sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}@keyframes pr{0%,100%{opacity:.4}50%{opacity:1}}.rg{animation:pr 2.4s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><circle cx="220" cy="150" r="100" fill="url(#g62)" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="220" cy="150" rx="100" ry="26" fill="none" stroke="#2B2F4A" stroke-width="4"/><g class="rg"><ellipse cx="220" cy="150" rx="116" ry="34" fill="none" stroke="#E5484D" stroke-width="3.5" stroke-dasharray="8 5"/></g><line x1="320" y1="150" x2="336" y2="150" stroke="#E5484D" stroke-width="3.5" stroke-linecap="round" /><text x="380" y="146" class="t m" >gap = ?</text><text x="220" y="284" class="s m" >Second string is 1 m longer. Not to scale.</text></svg>