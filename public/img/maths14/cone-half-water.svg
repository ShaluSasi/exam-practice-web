<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img"><title>A cone-shaped cup, point downwards, with water filling it to half its depth</title><style>.t{font:600 14px system-ui,sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui,sans-serif;fill:#2B2F4A}.b{font:700 17px system-ui,sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}@keyframes rp{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.94)}}.wt{animation:rp 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M100 60L200 260L300 60Z" fill="#F4F8FF" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M150 160L200 260L250 160Z" fill="#7CC8F0"/><ellipse class="wt" cx="200" cy="160" rx="50" ry="12" fill="#B6E2F8" stroke="#0B93D4" stroke-width="2.5"/><path d="M100 60L200 260L300 60" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="200" cy="60" rx="100" ry="24" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><line x1="330" y1="60" x2="330" y2="260" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" /><line x1="336" y1="60" x2="324" y2="60" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" /><line x1="336" y1="260" x2="324" y2="260" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" /><text x="335" y="46" class="s m" >full depth</text><line x1="255" y1="160" x2="325" y2="160" stroke="#2B2F4A" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 4"/><path d="M60 160h0" /><text x="60" y="166" class="s m" >water</text></svg>