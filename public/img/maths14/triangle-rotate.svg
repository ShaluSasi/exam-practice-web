<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" role="img"><title>A right triangle turning about one of its sides to form a solid</title><style>.t{font:600 14px system-ui,sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui,sans-serif;fill:#2B2F4A}.b{font:700 17px system-ui,sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}@keyframes tr{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}100%{transform:scaleX(1)}}.tri{animation:tr 5s linear infinite;transform-box:view-box;transform-origin:200px 150px}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M200 50L350 250H50Z" fill="none" stroke="#9AA0C8" stroke-width="2" stroke-dasharray="5 5"/><ellipse cx="200" cy="250" rx="150" ry="30" fill="none" stroke="#9AA0C8" stroke-width="2" stroke-dasharray="5 5"/><g class="tri"><path d="M200 50L350 250H200Z" fill="#FFC48A" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g><line x1="200" y1="40" x2="200" y2="260" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 5"/><text x="178" y="150" class="s" style="text-anchor:end">8 cm</text><text x="275" y="270" class="s m" >6 cm</text><text x="300" y="140" class="s m" >10 cm</text></svg>