<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" role="img"><title>A tall glass holding water with marbles at the bottom and the water levels marked</title><defs><linearGradient id="g56" x1="0" x2="1"><stop offset="0" stop-color="#EEF0FA"/><stop offset=".4" stop-color="#C9CCE4"/><stop offset="1" stop-color="#A3A8CC"/></linearGradient></defs><style>.t{font:600 14px system-ui,sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui,sans-serif;fill:#2B2F4A}.b{font:700 17px system-ui,sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}@keyframes rise{0%,10%{transform:scaleY(1)}70%,100%{transform:scaleY(1.25)}}@keyframes drp{0%{transform:translateY(-60px);opacity:0}15%{opacity:1}60%,100%{transform:translateY(0);opacity:1}}.wa{animation:rise 5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom}.m1{animation:drp 5s ease-in infinite alternate}.m2{animation:drp 5s ease-in -.5s infinite alternate}.m3{animation:drp 5s ease-in -1s infinite alternate}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M118 60V260A32 10 0 0 0 182 260V60Z" fill="url(#g56)" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="150" cy="60" rx="32" ry="10" fill="#EEF0FA" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path class="wa" d="M121 132V260A29 9 0 0 0 179 260V132Z" fill="#7CC8F0" opacity=".9"/><ellipse cx="150" cy="60" rx="32" ry="10" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle class="m1" cx="140" cy="254" r="8" fill="#7A3FD0" stroke="#2B2F4A" stroke-width="1.5"/><circle class="m2" cx="158" cy="252" r="8" fill="#E5484D" stroke="#2B2F4A" stroke-width="1.5"/><circle class="m3" cx="148" cy="240" r="8" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.5"/><line x1="182" y1="100" x2="198" y2="100" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 3"/><line x1="230" y1="60" x2="230" y2="260" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" /><line x1="236" y1="60" x2="224" y2="60" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" /><line x1="236" y1="260" x2="224" y2="260" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" /><text x="262" y="160" class="s m" >25 cm</text><line x1="300" y1="132" x2="300" y2="260" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><line x1="306" y1="132" x2="294" y2="132" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><line x1="306" y1="260" x2="294" y2="260" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><text x="334" y="200" class="s m" >16 cm</text><line x1="360" y1="100" x2="360" y2="260" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" /><line x1="366" y1="100" x2="354" y2="100" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" /><line x1="366" y1="260" x2="354" y2="260" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" /><text x="394" y="180" class="s m" >20 cm</text><text x="150" y="300" class="s m" >Glass radius 4 cm, marble radius 1 cm</text><line x1="198" y1="100" x2="360" y2="100" stroke="#E5484D" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 4"/></svg>