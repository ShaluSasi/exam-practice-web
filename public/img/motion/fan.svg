<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" role="img">
<title>A ceiling fan turning steadily, with a dot on one blade tip</title>
<style>
.t{font:600 13px system-ui, sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui, sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}
.rot{transform-box:view-box;transform-origin:150px 120px;animation:rt 1.6s linear infinite}@keyframes rt{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="0" y="0" width="300" height="24" rx="12" fill="#E6DCC8"/><path d="M150 20V104" stroke="#2B2F4A" stroke-width="5"/><g class="rot"><g transform="rotate(0 150 120)"><path d="M150 114C190 102 260 106 272 120C260 134 190 138 150 126Z" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/></g><g transform="rotate(120 150 120)"><path d="M150 114C190 102 260 106 272 120C260 134 190 138 150 126Z" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/></g><g transform="rotate(240 150 120)"><path d="M150 114C190 102 260 106 272 120C260 134 190 138 150 126Z" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/></g><circle cx="268" cy="120" r="5" fill="#E5484D" stroke="#2B2F4A" stroke-width="1.5"/></g><circle cx="150" cy="120" r="20" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="2.5"/>
</svg>
