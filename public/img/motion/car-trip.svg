.wh{transform-box:fill-box;transform-origin:center;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.go{animation:go 6s ease-in-out infinite}@keyframes go{0%,8%{transform:translateX(0)}45%,55%{transform:translateX(255px)}92%,100%{transform:translateX(0)}}.fl{transform-box:fill-box;transform-origin:center;animation:fl 6s steps(1) infinite}@keyframes fl{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}}
