<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 170" role="img">
<title>A position-time graph</title>
<style>
.t{font:600 13px system-ui, sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui, sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}
.ln{stroke-dasharray:100;animation:dr 6s ease-in-out infinite}@keyframes dr{0%{stroke-dashoffset:100}55%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M44 18V132H205" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/><path d="M44 104H205M44 76H205M44 48H205M84 18V132M124 18V132M164 18V132" stroke="#E6DCC8" stroke-width="1.2"/><text class="s m" x="124" y="152">Time</text><text class="s m" transform="translate(24 76) rotate(-90)">Position</text><path d="M44 76H196" fill="none" stroke="#0B93D4" stroke-opacity=".3" stroke-width="4" stroke-linecap="round"/><path class="ln" pathLength="100" d="M44 76H196" fill="none" stroke="#0B93D4" stroke-width="4" stroke-linecap="round"/>
</svg>
