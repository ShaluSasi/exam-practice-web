<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 160" role="img">
<title>A car with arrows for its velocity and acceleration</title>
<style>
.t{font:600 13px system-ui, sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui, sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}
.wh{transform-box:fill-box;transform-origin:center;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.go{animation:go 3s ease-in-out infinite alternate}@keyframes go{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="0" y="0" width="260" height="110" rx="16" fill="#E3F2FD"/><rect x="0" y="110" width="260" height="50" fill="#6B7280"/><g class="go"><g transform="translate(80 136) scale(0.95)"><path d="M0 -12Q0 -22 9 -22H18L29 -36H56L68 -22H76Q84 -22 84 -13V-7H0Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><path d="M32 -33H41V-24H24ZM45 -33H54L63 -24H45Z" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round"/><circle cx="80" cy="-16" r="2.2" fill="#F6C453"/><circle cx="20" cy="-7" r="8" fill="#2B2F4A"/><g class="wh"><circle cx="20" cy="-7" r="3.6" fill="#A3A8CC"/><path d="M20 -10.6V-3.4" stroke="#2B2F4A" stroke-width="1.5"/></g><circle cx="64" cy="-7" r="8" fill="#2B2F4A"/><g class="wh"><circle cx="64" cy="-7" r="3.6" fill="#A3A8CC"/><path d="M64 -10.6V-3.4" stroke="#2B2F4A" stroke-width="1.5"/></g></g></g><g><path d="M60 40L139 40" stroke="#0B93D4" stroke-width="4" stroke-linecap="round"/><path d="M150 40L139 46L139 34Z" fill="#0B93D4" stroke="#0B93D4" stroke-width="1.5" stroke-linejoin="round"/></g><text class="t" x="160" y="45">velocity</text><text class="t" x="60" y="83">acceleration = 0</text>
</svg>
