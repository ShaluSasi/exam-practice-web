<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img">
<title>A scooter braking to a stop on a straight road</title>
<style>
.t{font:600 13px system-ui, sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui, sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}
.go{animation:go 4s cubic-bezier(.2,.7,.4,1) infinite}@keyframes go{0%{transform:translateX(-230px)}80%,100%{transform:translateX(30px)}}.sk{stroke-dasharray:260;animation:sk 4s cubic-bezier(.2,.7,.4,1) infinite}@keyframes sk{0%{stroke-dashoffset:260}80%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="0" y="0" width="400" height="140" rx="16" fill="#E3F2FD"/><rect x="0" y="140" width="400" height="44" fill="#6B7280"/><path class="sk" d="M40 172H300" stroke="#3B3F4F" stroke-width="5" stroke-linecap="round"/><g class="go"><g transform="translate(250 166)"><circle cx="0" cy="0" r="14" fill="none" stroke="#2B2F4A" stroke-width="5"/><circle cx="62" cy="0" r="14" fill="none" stroke="#2B2F4A" stroke-width="5"/><path d="M0 0L22 -18H46L62 0M14 -22H48Q52 -30 44 -32H20Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><path d="M46 -18L54 -36" stroke="#2B2F4A" stroke-width="3"/><path d="M26 -30L30 -52L40 -54" fill="none" stroke="#0B93D4" stroke-width="7" stroke-linecap="round"/><circle cx="33" cy="-62" r="9" fill="#F6C453" stroke="#2B2F4A" stroke-width="2"/></g></g>
</svg>
