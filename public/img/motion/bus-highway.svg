<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img">
<title>A bus cruising along a straight highway with its speedometer needle steady</title>
<style>
.t{font:600 13px system-ui, sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui, sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}
.wh{transform-box:fill-box;transform-origin:center;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.dash{animation:ds .6s linear infinite}@keyframes ds{to{stroke-dashoffset:32}}.hill{animation:hl 6s linear infinite}@keyframes hl{from{transform:translateX(0)}to{transform:translateX(-40px)}}.nd{transform-box:view-box;transform-origin:335px 60px;transform:rotate(40deg)}
