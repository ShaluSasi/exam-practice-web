<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 300" role="img">
<title>A ball thrown straight up from point O beside a scale marked in centimetres</title>
<style>
.t{font:600 13px system-ui, sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui, sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}
.bl{animation:up 2.4s infinite}@keyframes up{0%{transform:translateY(0);animation-timing-function:cubic-bezier(.3,.6,.6,1)}50%{transform:translateY(-192px);animation-timing-function:cubic-bezier(.4,0,.7,.4)}100%{transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="0" y="262" width="260" height="38" fill="#D9C49A"/><path d="M70 262V32.0" stroke="#2B2F4A" stroke-width="2.5"/><path d="M64 262H76" stroke="#2B2F4A" stroke-width="2"/><text class="s e" x="58" y="266">0 cm</text><path d="M64 230H76" stroke="#2B2F4A" stroke-width="2"/><text class="s e" x="58" y="234">20 cm</text><path d="M64 198H76" stroke="#2B2F4A" stroke-width="2"/><text class="s e" x="58" y="202">40 cm</text><path d="M64 166H76" stroke="#2B2F4A" stroke-width="2"/><text class="s e" x="58" y="170">60 cm</text><path d="M64 134H76" stroke="#2B2F4A" stroke-width="2"/><text class="s e" x="58" y="138">80 cm</text><path d="M64 102H76" stroke="#2B2F4A" stroke-width="2"/><text class="s e" x="58" y="106">100 cm</text><path d="M64 70H76" stroke="#2B2F4A" stroke-width="2"/><text class="s e" x="58" y="74">120 cm</text><path d="M64 38H76" stroke="#2B2F4A" stroke-width="2"/><text class="s e" x="58" y="42">140 cm</text><text class="t" x="80" y="280">O</text><path d="M150 258V70" stroke="#0B93D4" stroke-width="2" stroke-dasharray="4 5"/><g class="bl"><circle cx="150" cy="250" r="11" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5"/><path d="M142 246Q150 252 158 246" fill="none" stroke="#2B2F4A" stroke-width="1.5"/></g><path d="M126 262Q130 244 150 260Q170 244 174 262Z" fill="#F2C59B" stroke="#2B2F4A" stroke-width="2"/>
</svg>
