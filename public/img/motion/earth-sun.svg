<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>The Earth, with a house on it, going round the Sun</title>
<style>
.t{font:600 13px system-ui, sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui, sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}
.orb{transform-box:view-box;transform-origin:200px 130px;animation:rt 10s linear infinite}@keyframes rt{to{transform:rotate(-360deg)}}.glow{transform-box:fill-box;transform-origin:center;animation:gl 2s ease-in-out infinite alternate}@keyframes gl{to{transform:scale(1.06)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="0" y="0" width="400" height="260" rx="16" fill="#1F2547"/><circle cx="30" cy="30" r="1.6" fill="#FFF"/><circle cx="90" cy="220" r="1.6" fill="#FFF"/><circle cx="360" cy="40" r="1.6" fill="#FFF"/><circle cx="330" cy="230" r="1.6" fill="#FFF"/><circle cx="60" cy="140" r="1.6" fill="#FFF"/><circle cx="370" cy="150" r="1.6" fill="#FFF"/><circle cx="200" cy="20" r="1.6" fill="#FFF"/><circle cx="250" cy="245" r="1.6" fill="#FFF"/><circle cx="200" cy="130" r="95" fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="2" stroke-dasharray="5 6"/><circle class="glow" cx="200" cy="130" r="36" fill="#F6C453" stroke="#FF8A1F" stroke-width="4"/><g class="orb"><g transform="translate(295 130)"><circle r="22" fill="#0B93D4" stroke="#FFFFFF" stroke-width="2"/><path d="M-12 -10Q-2 -16 4 -8Q0 2 -10 0Z M2 6Q12 2 16 10Q8 18 2 14Z" fill="#3FA34D"/><g transform="translate(-6 -22)"><rect x="-6" y="-10" width="12" height="10" fill="#FFF" stroke="#2B2F4A" stroke-width="1.5"/><path d="M-8 -10L0 -17L8 -10Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="1.5"/></g></g></g>
</svg>
