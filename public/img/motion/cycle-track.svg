<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img">
<title>A cyclist riding round a circular track of radius R</title>
<style>
.t{font:600 13px system-ui, sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui, sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}
.rot{transform-box:view-box;transform-origin:150px 150px;animation:rt 6s linear infinite}@keyframes rt{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="150" cy="150" r="128" fill="#E8956B" stroke="#B8643C" stroke-width="2"/><circle cx="150" cy="150" r="92" fill="#BFE3A6" stroke="#7FB069" stroke-width="2"/><circle cx="150" cy="150" r="110" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="8 7"/><path d="M150 150H260" stroke="#2B2F4A" stroke-width="2.5" stroke-dasharray="5 4"/><circle cx="150" cy="150" r="4" fill="#2B2F4A"/><text class="t m" x="205" y="142">R</text><g class="rot"><g transform="translate(150 40)"><circle cx="-11" cy="4" r="7" fill="none" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="11" cy="4" r="7" fill="none" stroke="#2B2F4A" stroke-width="2.5"/><path d="M-11 4L-2 -6L11 4M-2 -6L4 -8" stroke="#E5484D" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="-2" cy="-17" r="5" fill="#F2C59B" stroke="#2B2F4A" stroke-width="1.5"/></g></g>
</svg>
