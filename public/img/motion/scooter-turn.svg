<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A girl riding a scooter along a winding road while its speedometer needle stays steady</title>
<style>
.t{font:600 13px system-ui, sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui, sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}
.nd{transform-box:view-box;transform-origin:315px 176px;transform:rotate(20deg);animation:nd .4s ease-in-out infinite alternate}@keyframes nd{from{transform:rotate(19deg)}to{transform:rotate(21deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="0" y="0" width="400" height="240" rx="16" fill="#BFE3A6"/><path d="M20 210C120 210 160 40 300 40C350 40 380 60 390 70" fill="none" stroke="#6B7280" stroke-width="44" stroke-linecap="round"/><path d="M20 210C120 210 160 40 300 40C350 40 380 60 390 70" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="14 12"/><g><g transform="translate(-20 -14)"><circle cx="4" cy="20" r="6" fill="#2B2F4A"/><circle cx="36" cy="20" r="6" fill="#2B2F4A"/><path d="M0 16H40L34 4H14Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="2"/><circle cx="20" cy="-4" r="7" fill="#F6C453" stroke="#2B2F4A" stroke-width="2"/></g><animateMotion dur="5s" repeatCount="indefinite" rotate="auto" path="M20 210C120 210 160 40 300 40C350 40 380 60 390 70"/></g><rect x="250" y="120" width="130" height="104" rx="14" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><circle cx="315" cy="176" r="40" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3"/><path d="M283 188A34.0 34.0 0 1 1 347 188" fill="none" stroke="#CDEBFA" stroke-width="6"/><g class="nd"><path d="M315 176L315 147.2" stroke="#E5484D" stroke-width="3" stroke-linecap="round"/></g><circle cx="315" cy="176" r="4" fill="#2B2F4A"/><text class="s m" x="315" y="200.8">km/h</text>
</svg>
