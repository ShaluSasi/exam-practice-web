<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
<title>Four velocity-time graphs with numbered markers</title>
<style>
.t{font:600 13px system-ui, sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui, sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g transform="translate(20 20)"><rect width="170" height="122" rx="12" fill="#FFFFFF" stroke="#E6DCC8" stroke-width="2"/><path d="M45 14V120H162" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" transform="translate(0 -10)"/><text class="s" x="30" y="24">v</text><text class="s" x="150" y="122">t</text><g transform="translate(-14 -10)"><path d="M60 120L170 40" fill="none" stroke="#FF8A1F" stroke-width="5" stroke-linecap="round"/><circle r="5" fill="#FFF" stroke="#2B2F4A" stroke-width="2"><animateMotion dur="3s" repeatCount="indefinite" path="M60 120L170 40"/></circle></g></g><g transform="translate(210 20)"><rect width="170" height="122" rx="12" fill="#FFFFFF" stroke="#E6DCC8" stroke-width="2"/><path d="M45 14V120H162" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" transform="translate(0 -10)"/><text class="s" x="30" y="24">v</text><text class="s" x="150" y="122">t</text><g transform="translate(-14 -10)"><path d="M60 70H170" fill="none" stroke="#FF8A1F" stroke-width="5" stroke-linecap="round"/><circle r="5" fill="#FFF" stroke="#2B2F4A" stroke-width="2"><animateMotion dur="3s" repeatCount="indefinite" path="M60 70H170"/></circle></g></g><g transform="translate(20 160)"><rect width="170" height="122" rx="12" fill="#FFFFFF" stroke="#E6DCC8" stroke-width="2"/><path d="M45 14V120H162" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" transform="translate(0 -10)"/><text class="s" x="30" y="24">v</text><text class="s" x="150" y="122">t</text><g transform="translate(-14 -10)"><path d="M60 120H170" fill="none" stroke="#FF8A1F" stroke-width="5" stroke-linecap="round"/><circle r="5" fill="#FFF" stroke="#2B2F4A" stroke-width="2"><animateMotion dur="3s" repeatCount="indefinite" path="M60 120H170"/></circle></g></g><g transform="translate(210 160)"><rect width="170" height="122" rx="12" fill="#FFFFFF" stroke="#E6DCC8" stroke-width="2"/><path d="M45 14V120H162" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" transform="translate(0 -10)"/><text class="s" x="30" y="24">v</text><text class="s" x="150" y="122">t</text><g transform="translate(-14 -10)"><path d="M60 40L170 120" fill="none" stroke="#FF8A1F" stroke-width="5" stroke-linecap="round"/><circle r="5" fill="#FFF" stroke="#2B2F4A" stroke-width="2"><animateMotion dur="3s" repeatCount="indefinite" path="M60 40L170 120"/></circle></g></g>
