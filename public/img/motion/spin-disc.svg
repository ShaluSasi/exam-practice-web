<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img">
<title>A spinning cardboard disc with numbers near the edge and letters nearer the centre</title>
<style>
.t{font:600 13px system-ui, sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui, sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}
.rot{transform-box:view-box;transform-origin:150px 150px;animation:rt 5s cubic-bezier(.5,0,.5,1) infinite}@keyframes rt{to{transform:rotate(720deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g class="rot"><circle cx="150" cy="150" r="128" fill="#F3E3C3" stroke="#C8925A" stroke-width="4"/><circle cx="150" cy="150" r="74" fill="none" stroke="#E6CFA4" stroke-width="2"/><text class="t m" style="font-size:17px" x="203" y="64.2">1</text><text class="t m" style="font-size:17px" x="241.8" y="103">2</text><text class="t m" style="font-size:17px" x="256" y="156">3</text><text class="t m" style="font-size:17px" x="241.8" y="209">4</text><text class="t m" style="font-size:17px" x="203" y="247.8">5</text><text class="t m" style="font-size:17px" x="150" y="262">6</text><text class="t m" style="font-size:17px" x="97" y="247.8">7</text><text class="t m" style="font-size:17px" x="58.2" y="209">8</text><text class="t m" style="font-size:17px" x="44" y="156">9</text><text class="t m" style="font-size:17px" x="58.2" y="103">10</text><text class="t m" style="font-size:17px" x="97" y="64.2">11</text><text class="t m" style="font-size:17px" x="150" y="50">12</text><text class="t m" style="font-size:17px;fill:#E5484D" x="150" y="98">A</text><text class="t m" style="font-size:17px;fill:#E5484D" x="200.2" y="127">B</text><text class="t m" style="font-size:17px;fill:#E5484D" x="200.2" y="185">C</text><text class="t m" style="font-size:17px;fill:#E5484D" x="150" y="214">D</text><text class="t m" style="font-size:17px;fill:#E5484D" x="99.8" y="185">E</text><text class="t m" style="font-size:17px;fill:#E5484D" x="99.8" y="127">F</text><circle cx="150" cy="150" r="7" fill="#2B2F4A"/></g>
</svg>
