<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img">
<title>Velocity-time graph for constant acceleration, with the area split into a rectangle and a triangle</title>
<style>
.t{font:600 13px system-ui, sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui, sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}
.r1,.r2{animation:pl 4s ease-in-out infinite}.r2{animation-delay:2s}@keyframes pl{0%,100%{opacity:.5}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M70 230V160H330V230Z" fill="#0B93D4" fill-opacity=".22" class="r1"/><path d="M70 160L330 60V160Z" fill="#FF8A1F" fill-opacity=".35" class="r2"/><path d="M70 30V230H375" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/><path d="M70 160L330 60" stroke="#0B93D4" stroke-width="4" stroke-linecap="round"/><path d="M330 60V230M70 160H330M70 60H330" stroke="#2B2F4A" stroke-width="1.5" stroke-dasharray="4 4"/><text class="t" x="52" y="246">O</text><text class="t" x="52" y="165">A</text><text class="t" x="338" y="56">B</text><text class="t" x="338" y="165">C</text><text class="t" x="326" y="248">D</text><text class="t" x="52" y="65">E</text><text class="t m" x="200" y="250">t</text><text class="t" x="40" y="200">u</text><text class="t" x="344" y="115">v − u</text><text class="t m" x="220" y="268">Time</text><text class="t m" transform="translate(22 130) rotate(-90)">Velocity</text>
</svg>
