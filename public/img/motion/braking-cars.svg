<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
<title>Two identical cars braking, one moving twice as fast as the other, leaving skid marks</title>
<style>
.t{font:600 13px system-ui, sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui, sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}
.wh{transform-box:fill-box;transform-origin:center;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.c1,.c2{animation:br 4s cubic-bezier(.2,.7,.4,1) infinite}@keyframes br{0%{transform:translateX(-60px)}80%,100%{transform:translateX(0)}}.s1,.s2{stroke-dasharray:200;animation:sk 4s cubic-bezier(.2,.7,.4,1) infinite}@keyframes sk{0%{stroke-dashoffset:200}80%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="0" y="0" width="400" height="220" rx="16" fill="#BFE3A6"/><rect x="0" y="40" width="400" height="60" fill="#6B7280"/><rect x="0" y="130" width="400" height="60" fill="#6B7280"/><path d="M0 100H400M0 130H400" stroke="#FFFFFF" stroke-width="3"/><path class="s1" d="M40 82H90" stroke="#2D303D" stroke-width="5" stroke-linecap="round"/><path class="s2" d="M40 172H240" stroke="#2D303D" stroke-width="5" stroke-linecap="round"/><g class="c1"><g transform="translate(90 86) scale(0.75)"><path d="M0 -12Q0 -22 9 -22H18L29 -36H56L68 -22H76Q84 -22 84 -13V-7H0Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><path d="M32 -33H41V-24H24ZM45 -33H54L63 -24H45Z" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round"/><circle cx="80" cy="-16" r="2.2" fill="#F6C453"/><circle cx="20" cy="-7" r="8" fill="#2B2F4A"/><g class="wh"><circle cx="20" cy="-7" r="3.6" fill="#A3A8CC"/><path d="M20 -10.6V-3.4" stroke="#2B2F4A" stroke-width="1.5"/></g><circle cx="64" cy="-7" r="8" fill="#2B2F4A"/><g class="wh"><circle cx="64" cy="-7" r="3.6" fill="#A3A8CC"/><path d="M64 -10.6V-3.4" stroke="#2B2F4A" stroke-width="1.5"/></g></g></g><g class="c2"><g transform="translate(240 176) scale(0.75)"><path d="M0 -12Q0 -22 9 -22H18L29 -36H56L68 -22H76Q84 -22 84 -13V-7H0Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><path d="M32 -33H41V-24H24ZM45 -33H54L63 -24H45Z" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round"/><circle cx="80" cy="-16" r="2.2" fill="#F6C453"/><circle cx="20" cy="-7" r="8" fill="#2B2F4A"/><g class="wh"><circle cx="20" cy="-7" r="3.6" fill="#A3A8CC"/><path d="M20 -10.6V-3.4" stroke="#2B2F4A" stroke-width="1.5"/></g><circle cx="64" cy="-7" r="8" fill="#2B2F4A"/><g class="wh"><circle cx="64" cy="-7" r="3.6" fill="#A3A8CC"/><path d="M64 -10.6V-3.4" stroke="#2B2F4A" stroke-width="1.5"/></g></g></g><text class="t" x="14" y="30">u</text><text class="t" x="14" y="122">2u</text>
</svg>
