<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
<title>A swimmer in a 25 m swimming pool</title>
<style>
.t{font:600 13px system-ui, sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui, sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}
.sw{animation:sw 8s ease-in-out infinite}@keyframes sw{0%{transform:translateX(0)}45%{transform:translateX(270px) scaleX(1)}50%{transform:translateX(270px)}100%{transform:translateX(0)}}.arm{transform-box:fill-box;transform-origin:left bottom;animation:ar .6s ease-in-out infinite alternate}@keyframes ar{to{transform:rotate(-25deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="20" y="50" width="360" height="150" rx="10" fill="#7CC6EE" stroke="#2B2F4A" stroke-width="3"/><path d="M24 87H376" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="6 5"/><path d="M24 125H376" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="6 5"/><path d="M24 163H376" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="6 5"/><rect x="12" y="50" width="12" height="150" fill="#A3A8CC"/><rect x="376" y="50" width="12" height="150" fill="#A3A8CC"/><g><path d="M200 28L369 28" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><path d="M380 28L369 34L369 21.9Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round"/></g><g><path d="M200 28L31 28" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><path d="M20 28L31 21.9L31 34Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round"/></g><rect x="176" y="18" width="48" height="20" rx="6" fill="#FFF9EE"/><text class="t m" x="200" y="33">25 m</text><g class="sw"><ellipse cx="62" cy="108" rx="22" ry="7" fill="#5AB0DE"/><circle cx="80" cy="106" r="8" fill="#F2C59B" stroke="#2B2F4A" stroke-width="2"/><path d="M80 98A8 8 0 0 1 88 105H74Z" fill="#E5484D"/><path class="arm" d="M70 104Q78 92 92 100" fill="none" stroke="#F2C59B" stroke-width="5" stroke-linecap="round"/></g>
</svg>
