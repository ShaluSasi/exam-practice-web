<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
<title>A car speeding up from rest while a stopwatch runs</title>
<style>
.t{font:600 13px system-ui, sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui, sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}
.wh{transform-box:fill-box;transform-origin:center;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.go{animation:go 4s ease-in infinite}@keyframes go{0%{transform:translateX(0)}90%,100%{transform:translateX(280px)}}.nd{transform-box:view-box;transform-origin:300px 78px;animation:nd 4s ease-in infinite}@keyframes nd{0%{transform:rotate(-125deg)}90%,100%{transform:rotate(100deg)}}.sw{transform-box:view-box;transform-origin:0 0;animation:s2 4s linear infinite}@keyframes s2{90%,100%{transform:rotate(330deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="0" y="0" width="400" height="160" rx="16" fill="#E3F2FD"/><rect x="0" y="160" width="400" height="40" fill="#6B7280"/><path class="dash" d="M0 180.0H400" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="18 14"/><g class="go"><g transform="translate(20 186) scale(1.0)"><path d="M0 -12Q0 -22 9 -22H18L29 -36H56L68 -22H76Q84 -22 84 -13V-7H0Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><path d="M32 -33H41V-24H24ZM45 -33H54L63 -24H45Z" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round"/><circle cx="80" cy="-16" r="2.2" fill="#F6C453"/><circle cx="20" cy="-7" r="8" fill="#2B2F4A"/><g class="wh"><circle cx="20" cy="-7" r="3.6" fill="#A3A8CC"/><path d="M20 -10.6V-3.4" stroke="#2B2F4A" stroke-width="1.5"/></g><circle cx="64" cy="-7" r="8" fill="#2B2F4A"/><g class="wh"><circle cx="64" cy="-7" r="3.6" fill="#A3A8CC"/><path d="M64 -10.6V-3.4" stroke="#2B2F4A" stroke-width="1.5"/></g></g></g><circle cx="300" cy="78" r="52" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3"/><path d="M258.4 93.6A44.199999999999996 44.199999999999996 0 1 1 341.6 93.6" fill="none" stroke="#CDEBFA" stroke-width="6"/><g class="nd"><path d="M300 78L300 40.6" stroke="#E5484D" stroke-width="3" stroke-linecap="round"/></g><circle cx="300" cy="78" r="4" fill="#2B2F4A"/><text class="s m" x="300" y="110.2">km/h</text><g transform="translate(150 70)"><circle r="30" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3"/><rect x="-6" y="-42" width="12" height="9" rx="2" fill="#2B2F4A"/><g class="sw"><path d="M0 0V-22" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round"/></g><circle r="3" fill="#2B2F4A"/></g>
</svg>
