<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A tiger behind thick bars looking up at the stars</title><style>text{font-family:sans-serif}.a{transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes drift{0%{transform:translateX(-14px)}100%{transform:translateX(14px)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}@keyframes fall{0%{transform:translateY(-10px);opacity:0}15%{opacity:1}100%{transform:translateY(80px) rotate(90deg);opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.15)}}@keyframes dash{to{stroke-dashoffset:-24}}@keyframes grow{0%,100%{transform:scale(.85)}50%{transform:scale(1.1)}}@keyframes tilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}@keyframes walk{0%{transform:translateX(0)}100%{transform:translateX(60px)}}.bob{animation:bob 3s ease-in-out infinite}.drift{animation:drift 5s ease-in-out infinite alternate}.pulse{animation:pulse 2.4s ease-in-out infinite}.sway{animation:sway 3s ease-in-out infinite}.tw{animation:tw 2s ease-in-out infinite}.fall{animation:fall 3.5s linear infinite}.spin{animation:spin 1.2s linear infinite}.rise{animation:rise 2.6s ease-out infinite}.flick{animation:flick .8s ease-in-out infinite}.dash{animation:dash 1s linear infinite}.grow{animation:grow 3s ease-in-out infinite}.tilt{animation:tilt 4s ease-in-out infinite}.walk{animation:walk 6s linear infinite alternate}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect width="400" height="240" fill="#1F2A5A"/><g class="a tw" style="animation-delay:-0.0s"><path d="M280,40 l4,10 10,1 -8,6 3,10 -9,-6 -9,6 3,-10 -8,-6 10,-1z" fill="#FFC83D"/></g><g class="a tw" style="animation-delay:-0.5s"><path d="M330,80 l4,10 10,1 -8,6 3,10 -9,-6 -9,6 3,-10 -8,-6 10,-1z" fill="#FFC83D"/></g><g class="a tw" style="animation-delay:-1.0s"><path d="M230,80 l4,10 10,1 -8,6 3,10 -9,-6 -9,6 3,-10 -8,-6 10,-1z" fill="#FFC83D"/></g><g class="a tw" style="animation-delay:-1.5s"><path d="M340,30 l4,10 10,1 -8,6 3,10 -9,-6 -9,6 3,-10 -8,-6 10,-1z" fill="#FFC83D"/></g><rect y="190" width="400" height="50" fill="#6E7080"/><g transform="translate(120 188) scale(1.2 1.2)"><g class="a sway" style="transform-origin:top left"><path d="M-36,-30 q-22,-4 -24,20 q0,10 6,10" stroke="#FF8A1F" stroke-width="7" fill="none" stroke-linecap="round"/></g><ellipse cx="0" cy="-26" rx="38" ry="20" fill="#FF8A1F"/><path d="M-18,-34 l3,22" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round"/><path d="M-8,-34 l3,22" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round"/><path d="M2,-34 l3,22" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round"/><path d="M12,-34 l3,22" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round"/><path d="M22,-34 l3,22" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round"/><rect x="-30" y="-12" width="9" height="22" rx="4" fill="#FF8A1F"/><rect x="-14" y="-12" width="9" height="22" rx="4" fill="#FF8A1F"/><rect x="14" y="-12" width="9" height="22" rx="4" fill="#FF8A1F"/><rect x="28" y="-12" width="9" height="22" rx="4" fill="#FF8A1F"/><circle cx="40" cy="-38" r="16" fill="#FF8A1F"/><path d="M30,-50 l-2,-10 9,5z M48,-52 l6,-9 3,10z" fill="#FF8A1F"/><circle cx="46" cy="-40" r="2.5" fill="#2B2F4A"/><ellipse cx="52" cy="-32" rx="5" ry="3.5" fill="#FFE0C0"/><path d="M36,-30 l8,4" stroke="#2B2F4A" stroke-width="2"/></g><rect x="30" y="40" width="8" height="160" fill="#1A1C2C"/><rect x="70" y="40" width="8" height="160" fill="#1A1C2C"/><rect x="110" y="40" width="8" height="160" fill="#1A1C2C"/><rect x="150" y="40" width="8"