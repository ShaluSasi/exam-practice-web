<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A see-saw balancing a light block that says not fear-free against a heavier block that says but triumph over it</title><style>text{font-family:sans-serif}.a{transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes drift{0%{transform:translateX(-14px)}100%{transform:translateX(14px)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}@keyframes fall{0%{transform:translateY(-10px);opacity:0}15%{opacity:1}100%{transform:translateY(80px) rotate(90deg);opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.15)}}@keyframes dash{to{stroke-dashoffset:-24}}@keyframes grow{0%,100%{transform:scale(.85)}50%{transform:scale(1.1)}}@keyframes tilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}@keyframes walk{0%{transform:translateX(0)}100%{transform:translateX(60px)}}.bob{animation:bob 3s ease-in-out infinite}.drift{animation:drift 5s ease-in-out infinite alternate}.pulse{animation:pulse 2.4s ease-in-out infinite}.sway{animation:sway 3s ease-in-out infinite}.tw{animation:tw 2s ease-in-out infinite}.fall{animation:fall 3.5s linear infinite}.spin{animation:spin 1.2s linear infinite}.rise{animation:rise 2.6s ease-out infinite}.flick{animation:flick .8s ease-in-out infinite}.dash{animation:dash 1s linear infinite}.grow{animation:grow 3s ease-in-out infinite}.tilt{animation:tilt 4s ease-in-out infinite}.walk{animation:walk 6s linear infinite alternate}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect width="400" height="240" fill="#F3F8EE"/><path d="M185,200 L200,150 L215,200Z" fill="#2B2F4A"/><g class="a tilt" style="transform-origin:200px 150px"><line x1="50" y1="150" x2="350" y2="150" stroke="#2B2F4A" stroke-width="7" stroke-linecap="round"/><rect x="60" y="100" width="120" height="44" rx="10" fill="#E7E9F4" stroke="#2B2F4A" stroke-width="2"/><text x="120" y="126" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="bold">not fear-free</text><rect x="220" y="90" width="120" height="54" rx="10" fill="#FFE9CC" stroke="#FF8A1F" stroke-width="3"/><text x="280" y="122" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="bold">but triumph over it</text></g><text x="200" y="40" font-size="20" fill="#2B2F4A" text-anchor="middle" font-weight="bold">not ... but ...</text></svg>