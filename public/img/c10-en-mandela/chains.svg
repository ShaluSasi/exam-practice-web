<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Five anonymous figures linked in a line by a single chain</title><style>text{font-family:sans-serif}.a{transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes drift{0%{transform:translateX(-14px)}100%{transform:translateX(14px)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}@keyframes fall{0%{transform:translateY(-10px);opacity:0}15%{opacity:1}100%{transform:translateY(80px) rotate(90deg);opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.15)}}@keyframes dash{to{stroke-dashoffset:-24}}@keyframes grow{0%,100%{transform:scale(.85)}50%{transform:scale(1.1)}}@keyframes tilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}@keyframes walk{0%{transform:translateX(0)}100%{transform:translateX(60px)}}.bob{animation:bob 3s ease-in-out infinite}.drift{animation:drift 5s ease-in-out infinite alternate}.pulse{animation:pulse 2.4s ease-in-out infinite}.sway{animation:sway 3s ease-in-out infinite}.tw{animation:tw 2s ease-in-out infinite}.fall{animation:fall 3.5s linear infinite}.spin{animation:spin 1.2s linear infinite}.rise{animation:rise 2.6s ease-out infinite}.flick{animation:flick .8s ease-in-out infinite}.dash{animation:dash 1s linear infinite}.grow{animation:grow 3s ease-in-out infinite}.tilt{animation:tilt 4s ease-in-out infinite}.walk{animation:walk 6s linear infinite alternate}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect width="400" height="240" fill="#EEF2FA"/><rect y="195" width="400" height="45" fill="#D6DCEB"/><g transform="translate(50 195) scale(1.3)"><rect x="-9" y="-30" width="18" height="30" rx="8" fill="#FF8A1F"/><circle cx="0" cy="-38" r="8" fill="#8C88A6"/></g><path d="M62,150 Q88,170 113,150" stroke="#2B2F4A" stroke-width="6" fill="none"/><path d="M62,150 Q88,170 113,150" stroke="#fff" stroke-width="2" fill="none" stroke-dasharray="5 7" class="dash"/><g transform="translate(125 195) scale(1.3)"><rect x="-9" y="-30" width="18" height="30" rx="8" fill="#0B93D4"/><circle cx="0" cy="-38" r="8" fill="#8C88A6"/></g><path d="M137,150 Q163,170 188,150" stroke="#2B2F4A" stroke-width="6" fill="none"/><path d="M137,150 Q163,170 188,150" stroke="#fff" stroke-width="2" fill="none" stroke-dasharray="5 7" class="dash"/><g transform="translate(200 195) scale(1.3)"><rect x="-9" y="-30" width="18" height="30" rx="8" fill="#3FA34D"/><circle cx="0" cy="-38" r="8" fill="#8C88A6"/></g><path d="M212,150 Q238,170 263,150" stroke="#2B2F4A" stroke-width="6" fill="none"/><path d="M212,150 Q238,170 263,150" stroke="#fff" stroke-width="2" fill="none" stroke-dasharray="5 7" class="dash"/><g transform="translate(275 195) scale(1.3)"><rect x="-9" y="-30" width="18" height="30" rx="8" fill="#7C5CFF"/><circle cx="0" cy="-38" r="8" fill="#8C88A6"/></g><path d="M287,150 Q313,170 338,150" stroke="#2B2F4A" stroke-width="6" fill="none"/><path d="M287,150 Q313,170 338,150" stroke="#fff" stroke-width="2" fill="none" stroke-dasharray="5 7" class="dash"/><g transform="translate(350 195) scale(1.3)"><rect x="-9" y="-30" width="18" height="30" rx="8" fill="#E5484D"/><circle cx="0" cy="-38" r="8" fill="#8C88A6"/></g><text x="200" y="60" font-size="18" fill="#2B2F4A" text-anchor="middle" font-weight="bold">one chain, one people</text></svg>