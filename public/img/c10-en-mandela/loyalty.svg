<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Anonymous uniformed officers with medals saluting while jets fly overhead</title><style>text{font-family:sans-serif}.a{transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes drift{0%{transform:translateX(-14px)}100%{transform:translateX(14px)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}@keyframes fall{0%{transform:translateY(-10px);opacity:0}15%{opacity:1}100%{transform:translateY(80px) rotate(90deg);opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.15)}}@keyframes dash{to{stroke-dashoffset:-24}}@keyframes grow{0%,100%{transform:scale(.85)}50%{transform:scale(1.1)}}@keyframes tilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}@keyframes walk{0%{transform:translateX(0)}100%{transform:translateX(60px)}}.bob{animation:bob 3s ease-in-out infinite}.drift{animation:drift 5s ease-in-out infinite alternate}.pulse{animation:pulse 2.4s ease-in-out infinite}.sway{animation:sway 3s ease-in-out infinite}.tw{animation:tw 2s ease-in-out infinite}.fall{animation:fall 3.5s linear infinite}.spin{animation:spin 1.2s linear infinite}.rise{animation:rise 2.6s ease-out infinite}.flick{animation:flick .8s ease-in-out infinite}.dash{animation:dash 1s linear infinite}.grow{animation:grow 3s ease-in-out infinite}.tilt{animation:tilt 4s ease-in-out infinite}.walk{animation:walk 6s linear infinite alternate}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect width="400" height="240" fill="#CFE9FB"/><rect y="190" width="400" height="50" fill="#EFD9AE"/><g class="a drift"><g transform="translate(190 36) rotate(0) scale(0.8)"><path d="M0,-14 L3,-4 L16,6 L16,9 L3,5 L3,12 L7,15 L7,17 L0,15 L-7,17 L-7,15 L-3,12 L-3,5 L-16,9 L-16,6 L-3,-4Z" fill="#2B2F4A"/></g><g transform="translate(165 55) rotate(0) scale(0.8)"><path d="M0,-14 L3,-4 L16,6 L16,9 L3,5 L3,12 L7,15 L7,17 L0,15 L-7,17 L-7,15 L-3,12 L-3,5 L-16,9 L-16,6 L-3,-4Z" fill="#2B2F4A"/></g><g transform="translate(215 55) rotate(0) scale(0.8)"><path d="M0,-14 L3,-4 L16,6 L16,9 L3,5 L3,12 L7,15 L7,17 L0,15 L-7,17 L-7,15 L-3,12 L-3,5 L-16,9 L-16,6 L-3,-4Z" fill="#2B2F4A"/></g></g><g transform="translate(60 195) scale(1.2)"><rect x="-9" y="-30" width="18" height="30" rx="8" fill="#4A5A3A"/><circle cx="0" cy="-38" r="8" fill="#8C88A6"/><path d="M-9,-47 h18 v-5 h-18z" fill="#3A4A2A"/><circle cx="-3" cy="-20" r="2.5" fill="#FFC83D"/><circle cx="3" cy="-14" r="2.5" fill="#FFC83D"/><path d="M9,-24 L16,-34 L6,-42" stroke="#4A5A3A" stroke-width="4" fill="none" stroke-linecap="round"/></g><g transform="translate(115 195) scale(1.2)"><rect x="-9" y="-30" width="18" height="30" rx="8" fill="#4A5A3A"/><circle cx="0" cy="-38" r="8" fill="#8C88A6"/><path d="M-9,-47 h18 v-5 h-18z" fill="#3A4A2A"/><circle cx="-3" cy="-20" r="2.5" fill="#FFC83D"/><circle cx="3" cy="-14" r="2.5" fill="#FFC83D"/><path d="M9,-24 L16,-34 L6,-42" stroke="#4A5A3A" stroke-width="4" fill="none" stroke-linecap="round"/></g><g transform="translate(170 195) scale(1.2)"><rect x="-9" y="-30" width="18" height="30" rx="8" fill="#4A5A3A"/><circle cx="0" cy="-38" r="8" fill="#8C88A6"/><path d="M-9,-47 h18 v-5 h-18z" fill="#3A4A2A"/><circle cx="-3" cy="-20" r="2.5" fill="#FFC83D"/><circle cx="3" cy="-14" r="2.5" fill="#FFC83D"/><path d="M9,-24 L16,-34 L6,-42" stroke="#4A5A3A" stroke-width="4" fill="none" stroke-linecap="round"/></g><g transform="translate(225 195) scale(1.2)"><rect x="-9" y="-30" width="18" height="30" rx="8" fill="#4A5A3A"/><circle cx="0" cy="-38" r="8" fill="#8C