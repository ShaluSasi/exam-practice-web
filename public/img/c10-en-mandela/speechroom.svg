<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A classroom with a whiteboard, note cards on a desk, a stopwatch, a speaker at a podium and an audience</title><style>text{font-family:sans-serif}.a{transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes drift{0%{transform:translateX(-14px)}100%{transform:translateX(14px)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}@keyframes fall{0%{transform:translateY(-10px);opacity:0}15%{opacity:1}100%{transform:translateY(80px) rotate(90deg);opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.15)}}@keyframes dash{to{stroke-dashoffset:-24}}@keyframes grow{0%,100%{transform:scale(.85)}50%{transform:scale(1.1)}}@keyframes tilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}@keyframes walk{0%{transform:translateX(0)}100%{transform:translateX(60px)}}.bob{animation:bob 3s ease-in-out infinite}.drift{animation:drift 5s ease-in-out infinite alternate}.pulse{animation:pulse 2.4s ease-in-out infinite}.sway{animation:sway 3s ease-in-out infinite}.tw{animation:tw 2s ease-in-out infinite}.fall{animation:fall 3.5s linear infinite}.spin{animation:spin 1.2s linear infinite}.rise{animation:rise 2.6s ease-out infinite}.flick{animation:flick .8s ease-in-out infinite}.dash{animation:dash 1s linear infinite}.grow{animation:grow 3s ease-in-out infinite}.tilt{animation:tilt 4s ease-in-out infinite}.walk{animation:walk 6s linear infinite alternate}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect width="400" height="240" fill="#FDF1DA"/><rect y="200" width="400" height="40" fill="#EAD7B0"/><rect x="30" y="28" width="90" height="62" rx="6" fill="#fff" stroke="#2B2F4A" stroke-width="3"/><rect x="42" y="42" width="60" height="5" rx="2" fill="#0B93D4"/><rect x="42" y="56" width="46" height="5" rx="2" fill="#B9BED6"/><rect x="42" y="70" width="54" height="5" rx="2" fill="#B9BED6"/><g class="a pulse"><circle cx="330" cy="62" r="26" fill="#fff" stroke="#2B2F4A" stroke-width="4"/><rect x="324" y="28" width="12" height="7" rx="2" fill="#2B2F4A"/><line x1="330" y1="62" x2="330" y2="44" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><g class="a spin" style="animation-duration:6s"><line x1="330" y1="62" x2="345" y2="68" stroke="#E5484D" stroke-width="3" stroke-linecap="round"/></g></g><rect x="30" y="150" width="110" height="10" rx="3" fill="#8B5A2B"/><g transform="rotate(-8 60 145)"><rect x="40" y="118" width="42" height="30" rx="3" fill="#FFF3A8" stroke="#B8A23A" stroke-width="2"/></g><g transform="rotate(6 100 145)"><rect x="82" y="116" width="42" height="30" rx="3" fill="#CDEBFF" stroke="#0B93D4" stroke-width="2"/></g><line x1="48" y1="128" x2="74" y2="128" stroke="#8A8FA8" stroke-width="2"/><line x1="48" y1="136" x2="74" y2="136" stroke="#8A8FA8" stroke-width="2"/><line x1="90" y1="126" x2="116" y2="126" stroke="#8A8FA8" stroke-width="2"/><line x1="90" y1="134" x2="116" y2="134" stroke="#8A8FA8" stroke-width="2"/><g transform="translate(235 150) scale(1.4)"><g class="a bob"><rect x="-9" y="-30" width="18" height="30" rx="8" fill="#3FA34D"/><circle cx="0" cy="-38" r="8" fill="#8C88A6"/></g></g><g transform="translate(235 172) scale(1.2)"><path d="M-22,0 L-16,-34 L16,-34 L22,0Z" fill="#8B5A2B"/><rect x="-18" y="-38" width="36" height="6" rx="2" fill="#6B4220"/><line x1="0" y1="-38" x2="0" y2="-54" stroke="#2B2F4A" stroke-width="3"/><circle cx="0" cy="-57" r="4" fill="#2B2F4A"/></g><g transform="translate(80.0 232) scale(1.0)"><rect x="-9" y="-28" width="18" height="28" rx="8" fill=