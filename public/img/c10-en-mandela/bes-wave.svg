<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A person waving at a small crowd far away</title><style>text{font-family:sans-serif}.a{transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes drift{0%{transform:translateX(-14px)}100%{transform:translateX(14px)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}@keyframes fall{0%{transform:translateY(-10px);opacity:0}15%{opacity:1}100%{transform:translateY(80px) rotate(90deg);opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.15)}}@keyframes dash{to{stroke-dashoffset:-24}}@keyframes grow{0%,100%{transform:scale(.85)}50%{transform:scale(1.1)}}@keyframes tilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}@keyframes walk{0%{transform:translateX(0)}100%{transform:translateX(60px)}}.bob{animation:bob 3s ease-in-out infinite}.drift{animation:drift 5s ease-in-out infinite alternate}.pulse{animation:pulse 2.4s ease-in-out infinite}.sway{animation:sway 3s ease-in-out infinite}.tw{animation:tw 2s ease-in-out infinite}.fall{animation:fall 3.5s linear infinite}.spin{animation:spin 1.2s linear infinite}.rise{animation:rise 2.6s ease-out infinite}.flick{animation:flick .8s ease-in-out infinite}.dash{animation:dash 1s linear infinite}.grow{animation:grow 3s ease-in-out infinite}.tilt{animation:tilt 4s ease-in-out infinite}.walk{animation:walk 6s linear infinite alternate}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><g transform="translate(100 78) scale(1.55)"><g transform="translate(-26 18) scale(1.5)"><rect x="-6" y="-20" width="12" height="20" rx="5" fill="#FF8A1F"/><circle cx="0" cy="-26" r="6" fill="#8C88A6"/></g><path d="M-18,-10 l12,-14" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round"/><g transform="translate(26 4) scale(0.35)"><rect x="-6" y="-20" width="12" height="20" rx="5" fill="#2B2F4A"/><circle cx="0" cy="-26" r="6" fill="#8C88A6"/></g><g transform="translate(34 9) scale(0.35)"><rect x="-6" y="-20" width="12" height="20" rx="5" fill="#2B2F4A"/><circle cx="0" cy="-26" r="6" fill="#8C88A6"/></g><g transform="translate(42 4) scale(0.35)"><rect x="-6" y="-20" width="12" height="20" rx="5" fill="#2B2F4A"/><circle cx="0" cy="-26" r="6" fill="#8C88A6"/></g><g transform="translate(50 9) scale(0.35)"><rect x="-6" y="-20" width="12" height="20" rx="5" fill="#2B2F4A"/><circle cx="0" cy="-26" r="6" fill="#8C88A6"/></g><line x1="-2" y1="26" x2="50" y2="26" stroke="#B9BED6" stroke-width="2" stroke-dasharray="4 4"/></g></svg>