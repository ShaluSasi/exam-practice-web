<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Five stanza cards in a row, dark blue for the zoo and green for the jungle</title><style>text{font-family:sans-serif}.a{transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes drift{0%{transform:translateX(-14px)}100%{transform:translateX(14px)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}@keyframes fall{0%{transform:translateY(-10px);opacity:0}15%{opacity:1}100%{transform:translateY(80px) rotate(90deg);opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.15)}}@keyframes dash{to{stroke-dashoffset:-24}}@keyframes grow{0%,100%{transform:scale(.85)}50%{transform:scale(1.1)}}@keyframes tilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}@keyframes walk{0%{transform:translateX(0)}100%{transform:translateX(60px)}}.bob{animation:bob 3s ease-in-out infinite}.drift{animation:drift 5s ease-in-out infinite alternate}.pulse{animation:pulse 2.4s ease-in-out infinite}.sway{animation:sway 3s ease-in-out infinite}.tw{animation:tw 2s ease-in-out infinite}.fall{animation:fall 3.5s linear infinite}.spin{animation:spin 1.2s linear infinite}.rise{animation:rise 2.6s ease-out infinite}.flick{animation:flick .8s ease-in-out infinite}.dash{animation:dash 1s linear infinite}.grow{animation:grow 3s ease-in-out infinite}.tilt{animation:tilt 4s ease-in-out infinite}.walk{animation:walk 6s linear infinite alternate}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect width="400" height="240" fill="#F4F1FB"/><rect x="12" y="40" width="68" height="150" rx="10" fill="#1F2A5A"/><text x="46" y="85" font-size="30" fill="#fff" text-anchor="middle" font-weight="bold">1</text><text x="46" y="140" font-size="13" fill="#fff" text-anchor="middle" font-weight="normal">cage</text><rect x="88" y="40" width="68" height="150" rx="10" fill="#7DB35A"/><text x="122" y="85" font-size="30" fill="#fff" text-anchor="middle" font-weight="bold">2</text><text x="122" y="140" font-size="13" fill="#fff" text-anchor="middle" font-weight="normal">grass</text><rect x="164" y="40" width="68" height="150" rx="10" fill="#7DB35A"/><text x="198" y="85" font-size="30" fill="#fff" text-anchor="middle" font-weight="bold">3</text><text x="198" y="140" font-size="13" fill="#fff" text-anchor="middle" font-weight="normal">village</text><rect x="240" y="40" width="68" height="150" rx="10" fill="#1F2A5A"/><text x="274" y="85" font-size="30" fill="#fff" text-anchor="middle" font-weight="bold">4</text><text x="274" y="140" font-size="13" fill="#fff" text-anchor="middle" font-weight="normal">cell</text><rect x="316" y="40" width="68" height="150" rx="10" fill="#1F2A5A"/><text x="350" y="85" font-size="30" fill="#fff" text-anchor="middle" font-weight="bold">5</text><text x="350" y="140" font-size="13" fill="#fff" text-anchor="middle" font-weight="normal">stars</text><path d="M30,215 H370" stroke="#2B2F4A" stroke-width="3" stroke-dasharray="8 6" class="dash"/><path d="M370,215 l-10,-6 v12z" fill="#2B2F4A"/></svg>