<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A row of identical anonymous figures in different colours under a card showing that a plural name means people of that kind</title><style>text{font-family:sans-serif}.a{transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes drift{0%{transform:translateX(-14px)}100%{transform:translateX(14px)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}@keyframes fall{0%{transform:translateY(-10px);opacity:0}15%{opacity:1}100%{transform:translateY(80px) rotate(90deg);opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.15)}}@keyframes dash{to{stroke-dashoffset:-24}}@keyframes grow{0%,100%{transform:scale(.85)}50%{transform:scale(1.1)}}@keyframes tilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}@keyframes walk{0%{transform:translateX(0)}100%{transform:translateX(60px)}}.bob{animation:bob 3s ease-in-out infinite}.drift{animation:drift 5s ease-in-out infinite alternate}.pulse{animation:pulse 2.4s ease-in-out infinite}.sway{animation:sway 3s ease-in-out infinite}.tw{animation:tw 2s ease-in-out infinite}.fall{animation:fall 3.5s linear infinite}.spin{animation:spin 1.2s linear infinite}.rise{animation:rise 2.6s ease-out infinite}.flick{animation:flick .8s ease-in-out infinite}.dash{animation:dash 1s linear infinite}.grow{animation:grow 3s ease-in-out infinite}.tilt{animation:tilt 4s ease-in-out infinite}.walk{animation:walk 6s linear infinite alternate}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect width="400" height="240" fill="#F4F1FB"/><g class="a bob" style="animation-delay:-0.0s"><g transform="translate(60 150) scale(2.2)"><rect x="-6" y="-20" width="12" height="20" rx="5" fill="#FF8A1F"/><circle cx="0" cy="-26" r="6" fill="#8C88A6"/></g></g><g class="a bob" style="animation-delay:-0.5s"><g transform="translate(130 150) scale(2.2)"><rect x="-6" y="-20" width="12" height="20" rx="5" fill="#0B93D4"/><circle cx="0" cy="-26" r="6" fill="#8C88A6"/></g></g><g class="a bob" style="animation-delay:-1.0s"><g transform="translate(200 150) scale(2.2)"><rect x="-6" y="-20" width="12" height="20" rx="5" fill="#3FA34D"/><circle cx="0" cy="-26" r="6" fill="#8C88A6"/></g></g><g class="a bob" style="animation-delay:-1.5s"><g transform="translate(270 150) scale(2.2)"><rect x="-6" y="-20" width="12" height="20" rx="5" fill="#7C5CFF"/><circle cx="0" cy="-26" r="6" fill="#8C88A6"/></g></g><g class="a bob" style="animation-delay:-2.0s"><g transform="translate(340 150) scale(2.2)"><rect x="-6" y="-20" width="12" height="20" rx="5" fill="#E5484D"/><circle cx="0" cy="-26" r="6" fill="#8C88A6"/></g></g><rect x="100" y="28" width="200" height="40" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="3"/><text x="200" y="55" font-size="14" fill="#2B2F4A" text-anchor="middle" font-weight="bold">the ... s = people of that kind</text><path d="M170,70 l-10,20 M230,70 l10,20" stroke="#2B2F4A" stroke-width="3"/></svg>