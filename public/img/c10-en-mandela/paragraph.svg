<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A page of writing with a badge showing 100 to 150 words</title><style>text{font-family:sans-serif}.a{transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes drift{0%{transform:translateX(-14px)}100%{transform:translateX(14px)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}@keyframes fall{0%{transform:translateY(-10px);opacity:0}15%{opacity:1}100%{transform:translateY(80px) rotate(90deg);opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.15)}}@keyframes dash{to{stroke-dashoffset:-24}}@keyframes grow{0%,100%{transform:scale(.85)}50%{transform:scale(1.1)}}@keyframes tilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}@keyframes walk{0%{transform:translateX(0)}100%{transform:translateX(60px)}}.bob{animation:bob 3s ease-in-out infinite}.drift{animation:drift 5s ease-in-out infinite alternate}.pulse{animation:pulse 2.4s ease-in-out infinite}.sway{animation:sway 3s ease-in-out infinite}.tw{animation:tw 2s ease-in-out infinite}.fall{animation:fall 3.5s linear infinite}.spin{animation:spin 1.2s linear infinite}.rise{animation:rise 2.6s ease-out infinite}.flick{animation:flick .8s ease-in-out infinite}.dash{animation:dash 1s linear infinite}.grow{animation:grow 3s ease-in-out infinite}.tilt{animation:tilt 4s ease-in-out infinite}.walk{animation:walk 6s linear infinite alternate}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="110" y="12" width="180" height="216" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="3"/><rect x="124" y="32" width="152" height="7" rx="3" fill="#B9BED6"/><rect x="124" y="56" width="130" height="7" rx="3" fill="#B9BED6"/><rect x="124" y="72" width="152" height="7" rx="3" fill="#B9BED6"/><rect x="124" y="88" width="152" height="7" rx="3" fill="#B9BED6"/><rect x="124" y="104" width="130" height="7" rx="3" fill="#B9BED6"/><rect x="124" y="120" width="152" height="7" rx="3" fill="#B9BED6"/><rect x="124" y="136" width="152" height="7" rx="3" fill="#B9BED6"/><rect x="124" y="160" width="130" height="7" rx="3" fill="#B9BED6"/><rect x="124" y="184" width="152" height="7" rx="3" fill="#B9BED6"/><g class="a pulse"><circle cx="322" cy="60" r="20" fill="#FF8A1F"/><text x="322" y="66" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">100</text></g><text x="322" y="95" font-size="11" fill="#2B2F4A" text-anchor="middle">to 150 words</text></svg>