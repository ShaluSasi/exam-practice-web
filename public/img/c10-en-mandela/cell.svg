<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A prison cell at night: a prisoner on a bed, a candle on a table, a barred window and a guard</title><style>text{font-family:sans-serif}.a{transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes drift{0%{transform:translateX(-14px)}100%{transform:translateX(14px)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}@keyframes fall{0%{transform:translateY(-10px);opacity:0}15%{opacity:1}100%{transform:translateY(80px) rotate(90deg);opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.15)}}@keyframes dash{to{stroke-dashoffset:-24}}@keyframes grow{0%,100%{transform:scale(.85)}50%{transform:scale(1.1)}}@keyframes tilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}@keyframes walk{0%{transform:translateX(0)}100%{transform:translateX(60px)}}.bob{animation:bob 3s ease-in-out infinite}.drift{animation:drift 5s ease-in-out infinite alternate}.pulse{animation:pulse 2.4s ease-in-out infinite}.sway{animation:sway 3s ease-in-out infinite}.tw{animation:tw 2s ease-in-out infinite}.fall{animation:fall 3.5s linear infinite}.spin{animation:spin 1.2s linear infinite}.rise{animation:rise 2.6s ease-out infinite}.flick{animation:flick .8s ease-in-out infinite}.dash{animation:dash 1s linear infinite}.grow{animation:grow 3s ease-in-out infinite}.tilt{animation:tilt 4s ease-in-out infinite}.walk{animation:walk 6s linear infinite alternate}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect width="400" height="240" fill="#3A4070"/><rect y="190" width="400" height="50" fill="#2A2E52"/><rect x="285" y="40" width="70" height="90" rx="30" fill="#BFE3FA"/><line x1="302" y1="42" x2="302" y2="130" stroke="#222640" stroke-width="5"/><line x1="320" y1="42" x2="320" y2="130" stroke="#222640" stroke-width="5"/><line x1="338" y1="42" x2="338" y2="130" stroke="#222640" stroke-width="5"/><rect x="285" y="80" width="70" height="5" fill="#222640"/><rect x="30" y="170" width="100" height="14" rx="4" fill="#6B4220"/><rect x="38" y="184" width="6" height="16" fill="#6B4220"/><rect x="116" y="184" width="6" height="16" fill="#6B4220"/><g transform="translate(75 170) scale(1.1)"><rect x="-9" y="-30" width="18" height="30" rx="8" fill="#9AA0D0"/><circle cx="0" cy="-38" r="8" fill="#6E7399"/></g><rect x="170" y="172" width="60" height="8" rx="3" fill="#8B5A2B"/><rect x="180" y="180" width="6" height="30" fill="#8B5A2B"/><rect x="214" y="180" width="6" height="30" fill="#8B5A2B"/><rect x="196" y="156" width="8" height="16" rx="2" fill="#F3E3C3"/><circle cx="200" cy="138" r="24" fill="#FFC83D" opacity=".25" class="a pulse"/><g class="a flick" style="transform-origin:bottom center"><path d="M200,154 Q192,142 200,126 Q208,142 200,154Z" fill="#FFC83D"/><path d="M200,154 Q196,146 200,139 Q204,146 200,154Z" fill="#fff"/></g><g transform="translate(340 215) scale(1.2)"><rect x="-10" y="-34" width="20" height="34" rx="6" fill="#222640"/><circle cx="0" cy="-42" r="9" fill="#6E7399"/><path d="M-10,-48 h20 v-5 h-20z" fill="#222640"/></g></svg>