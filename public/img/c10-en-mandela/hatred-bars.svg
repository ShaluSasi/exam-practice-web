<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A figure behind bars holding a chain that is tied to another figure outside, so both are held</title><style>text{font-family:sans-serif}.a{transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes drift{0%{transform:translateX(-14px)}100%{transform:translateX(14px)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}@keyframes fall{0%{transform:translateY(-10px);opacity:0}15%{opacity:1}100%{transform:translateY(80px) rotate(90deg);opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.15)}}@keyframes dash{to{stroke-dashoffset:-24}}@keyframes grow{0%,100%{transform:scale(.85)}50%{transform:scale(1.1)}}@keyframes tilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}@keyframes walk{0%{transform:translateX(0)}100%{transform:translateX(60px)}}.bob{animation:bob 3s ease-in-out infinite}.drift{animation:drift 5s ease-in-out infinite alternate}.pulse{animation:pulse 2.4s ease-in-out infinite}.sway{animation:sway 3s ease-in-out infinite}.tw{animation:tw 2s ease-in-out infinite}.fall{animation:fall 3.5s linear infinite}.spin{animation:spin 1.2s linear infinite}.rise{animation:rise 2.6s ease-out infinite}.flick{animation:flick .8s ease-in-out infinite}.dash{animation:dash 1s linear infinite}.grow{animation:grow 3s ease-in-out infinite}.tilt{animation:tilt 4s ease-in-out infinite}.walk{animation:walk 6s linear infinite alternate}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect width="400" height="240" fill="#F3EEF8"/><rect y="195" width="400" height="45" fill="#DDD3EA"/><g transform="translate(90 195) scale(1.5)"><rect x="-9" y="-30" width="18" height="30" rx="8" fill="#0B93D4"/><circle cx="0" cy="-38" r="8" fill="#8C88A6"/></g><g class="a sway" style="animation-duration:2s"><path d="M110,150 Q170,170 240,150" stroke="#2B2F4A" stroke-width="5" fill="none"/></g><rect x="240" y="70" width="120" height="130" rx="4" fill="none" stroke="#6E7399" stroke-width="3"/><line x1="262" y1="70" x2="262" y2="200" stroke="#6E7399" stroke-width="6"/><line x1="284" y1="70" x2="284" y2="200" stroke="#6E7399" stroke-width="6"/><line x1="306" y1="70" x2="306" y2="200" stroke="#6E7399" stroke-width="6"/><line x1="328" y1="70" x2="328" y2="200" stroke="#6E7399" stroke-width="6"/><g transform="translate(300 195) scale(1.5)"><rect x="-9" y="-30" width="18" height="30" rx="8" fill="#FF8A1F"/><circle cx="0" cy="-38" r="8" fill="#8C88A6"/></g><g class="a bob"><path d="M258,100 q8,-16 24,-8" stroke="#2B2F4A" stroke-width="0"/></g></svg>