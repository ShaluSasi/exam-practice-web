<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A village scene at night: a hut, a stream, a bull, a fire roasting corn and stars</title><style>text{font-family:sans-serif}.a{transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes drift{0%{transform:translateX(-14px)}100%{transform:translateX(14px)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}@keyframes fall{0%{transform:translateY(-10px);opacity:0}15%{opacity:1}100%{transform:translateY(80px) rotate(90deg);opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.15)}}@keyframes dash{to{stroke-dashoffset:-24}}@keyframes grow{0%,100%{transform:scale(.85)}50%{transform:scale(1.1)}}@keyframes tilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}@keyframes walk{0%{transform:translateX(0)}100%{transform:translateX(60px)}}.bob{animation:bob 3s ease-in-out infinite}.drift{animation:drift 5s ease-in-out infinite alternate}.pulse{animation:pulse 2.4s ease-in-out infinite}.sway{animation:sway 3s ease-in-out infinite}.tw{animation:tw 2s ease-in-out infinite}.fall{animation:fall 3.5s linear infinite}.spin{animation:spin 1.2s linear infinite}.rise{animation:rise 2.6s ease-out infinite}.flick{animation:flick .8s ease-in-out infinite}.dash{animation:dash 1s linear infinite}.grow{animation:grow 3s ease-in-out infinite}.tilt{animation:tilt 4s ease-in-out infinite}.walk{animation:walk 6s linear infinite alternate}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect width="400" height="240" fill="#2F3A7A"/><rect y="120" width="400" height="120" fill="#4C8A45"/><g class="a tw" style="animation-delay:-0s"><path d="M170,25 l2,6 6,1 -5,4 2,6 -5,-4 -5,4 2,-6 -5,-4 6,-1z" fill="#FFC83D"/></g><g class="a tw" style="animation-delay:-0.6s"><path d="M210,45 l2,6 6,1 -5,4 2,6 -5,-4 -5,4 2,-6 -5,-4 6,-1z" fill="#FFC83D"/></g><g class="a tw" style="animation-delay:-1.2s"><path d="M245,22 l2,6 6,1 -5,4 2,6 -5,-4 -5,4 2,-6 -5,-4 6,-1z" fill="#FFC83D"/></g><g class="a tw" style="animation-delay:-0.3s"><path d="M120,50 l2,6 6,1 -5,4 2,6 -5,-4 -5,4 2,-6 -5,-4 6,-1z" fill="#FFC83D"/></g><g class="a tw" style="animation-delay:-1.6s"><path d="M290,50 l2,6 6,1 -5,4 2,6 -5,-4 -5,4 2,-6 -5,-4 6,-1z" fill="#FFC83D"/></g><circle cx="355" cy="35" r="14" fill="#FFF3C4"/><rect x="40" y="130" width="60" height="38" fill="#C98A4B"/><path d="M30,132 L70,92 L110,132Z" fill="#E0B25A" stroke="#B38437" stroke-width="3"/><rect x="62" y="145" width="16" height="23" rx="6" fill="#6B4220"/><path d="M0,205 Q60,185 130,205 T260,205 T400,200 L400,240 L0,240Z" fill="#0B93D4"/><path class="dash" d="M20,222 q20,-8 40,0 M120,226 q20,-8 40,0 M250,222 q20,-8 40,0" stroke="#fff" stroke-width="3" fill="none" stroke-dasharray="12 8"/><g class="a flick" style="transform-origin:bottom center"><path d="M190,170 Q180,148 200,128 Q205,150 220,142 Q226,160 214,172Z" fill="#FF8A1F"/><path d="M197,170 Q192,156 202,148 Q208,160 212,170Z" fill="#FFC83D"/></g><ellipse cx="205" cy="176" rx="26" ry="6" fill="#5A3A1C"/><ellipse cx="183" cy="162" rx="5" ry="10" fill="#FFC83D" transform="rotate(-30 183 162)"/><ellipse cx="228" cy="162" rx="5" ry="10" fill="#FFC83D" transform="rotate(30 228 162)"/><g><ellipse cx="320" cy="162" rx="36" ry="20" fill="#8B5A2B"/><circle cx="288" cy="150" r="14" fill="#8B5A2B"/><path d="M280,138 q-8,-8 -4,-14 M296,138 q8,-8 4,-14" stroke="#F3E3C3" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="298" y="176" width="7" height="20" rx="3" fill="#6B4220"/><rect x="334" y="176" width="7" height="20" rx="3" fill="#6B4220"/><g class="a sway" style="transform-origin:top center"><path d="M356,156 q12,10 4,26" stroke="#6B4220" stroke-width="4" fill="none" stroke-linecap="round"/></g></g></svg>