<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A lone dark figure walking at dusk away from a small home with a lit window</title><style>text{font-family:sans-serif}.a{transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes drift{0%{transform:translateX(-14px)}100%{transform:translateX(14px)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}@keyframes fall{0%{transform:translateY(-10px);opacity:0}15%{opacity:1}100%{transform:translateY(80px) rotate(90deg);opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.15)}}@keyframes dash{to{stroke-dashoffset:-24}}@keyframes grow{0%,100%{transform:scale(.85)}50%{transform:scale(1.1)}}@keyframes tilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}@keyframes walk{0%{transform:translateX(0)}100%{transform:translateX(60px)}}.bob{animation:bob 3s ease-in-out infinite}.drift{animation:drift 5s ease-in-out infinite alternate}.pulse{animation:pulse 2.4s ease-in-out infinite}.sway{animation:sway 3s ease-in-out infinite}.tw{animation:tw 2s ease-in-out infinite}.fall{animation:fall 3.5s linear infinite}.spin{animation:spin 1.2s linear infinite}.rise{animation:rise 2.6s ease-out infinite}.flick{animation:flick .8s ease-in-out infinite}.dash{animation:dash 1s linear infinite}.grow{animation:grow 3s ease-in-out infinite}.tilt{animation:tilt 4s ease-in-out infinite}.walk{animation:walk 6s linear infinite alternate}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect width="400" height="240" rx="16" fill="#4A3F6B"/><rect y="120" width="400" height="120" fill="#C9724F"/><rect y="170" width="400" height="70" fill="#E8955A"/><circle cx="320" cy="60" r="16" fill="#FFF3C4"/><path d="M0,190 Q100,170 200,190 T400,185 V240 H0Z" fill="#2A2438"/><g class="a tw"><rect x="40" y="150" width="34" height="30" fill="#3A3048"/><rect x="52" y="160" width="10" height="12" fill="#FFC83D"/></g><path d="M34,150 L57,132 L80,150Z" fill="#3A3048"/><g class="a walk" style="animation-duration:7s"><g transform="translate(170 195) scale(1.2)"><rect x="-9" y="-30" width="18" height="30" rx="8" fill="#10121F"/><circle cx="0" cy="-38" r="8" fill="#10121F"/></g></g><path d="M0,215 Q200,190 400,215" stroke="#4A3C5A" stroke-width="5" fill="none"/></svg>