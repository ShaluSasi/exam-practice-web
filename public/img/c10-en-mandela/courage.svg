<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A small figure stepping forward towards a huge dark shadow with eyes, showing courage in the face of fear</title><style>text{font-family:sans-serif}.a{transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes drift{0%{transform:translateX(-14px)}100%{transform:translateX(14px)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}@keyframes fall{0%{transform:translateY(-10px);opacity:0}15%{opacity:1}100%{transform:translateY(80px) rotate(90deg);opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.15)}}@keyframes dash{to{stroke-dashoffset:-24}}@keyframes grow{0%,100%{transform:scale(.85)}50%{transform:scale(1.1)}}@keyframes tilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}@keyframes walk{0%{transform:translateX(0)}100%{transform:translateX(60px)}}.bob{animation:bob 3s ease-in-out infinite}.drift{animation:drift 5s ease-in-out infinite alternate}.pulse{animation:pulse 2.4s ease-in-out infinite}.sway{animation:sway 3s ease-in-out infinite}.tw{animation:tw 2s ease-in-out infinite}.fall{animation:fall 3.5s linear infinite}.spin{animation:spin 1.2s linear infinite}.rise{animation:rise 2.6s ease-out infinite}.flick{animation:flick .8s ease-in-out infinite}.dash{animation:dash 1s linear infinite}.grow{animation:grow 3s ease-in-out infinite}.tilt{animation:tilt 4s ease-in-out infinite}.walk{animation:walk 6s linear infinite alternate}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect width="400" height="240" fill="#F1EDF9"/><rect y="190" width="400" height="50" fill="#DCD3EE"/><g class="a pulse" style="transform-origin:right center"><path d="M250,190 Q240,90 300,70 Q360,90 350,190Z" fill="#4A4F7A" opacity=".85"/><circle cx="285" cy="115" r="8" fill="#fff"/><circle cx="318" cy="115" r="8" fill="#fff"/><circle cx="285" cy="115" r="3" fill="#2B2F4A"/><circle cx="318" cy="115" r="3" fill="#2B2F4A"/></g><g class="a walk" style="animation-duration:4s"><g transform="translate(80 190) scale(1.4)"><rect x="-9" y="-30" width="18" height="30" rx="8" fill="#FF8A1F"/><circle cx="0" cy="-38" r="8" fill="#8C88A6"/></g><path d="M72,128 q-4,6 0,10 M92,126 q4,6 0,10" stroke="#0B93D4" stroke-width="3" fill="none"/></g></svg>