<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Four lines of a stanza on cards, with the second and fourth cards highlighted and joined by a curved line</title><style>text{font-family:sans-serif}.a{transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes drift{0%{transform:translateX(-14px)}100%{transform:translateX(14px)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}@keyframes fall{0%{transform:translateY(-10px);opacity:0}15%{opacity:1}100%{transform:translateY(80px) rotate(90deg);opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.15)}}@keyframes dash{to{stroke-dashoffset:-24}}@keyframes grow{0%,100%{transform:scale(.85)}50%{transform:scale(1.1)}}@keyframes tilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}@keyframes walk{0%{transform:translateX(0)}100%{transform:translateX(60px)}}.bob{animation:bob 3s ease-in-out infinite}.drift{animation:drift 5s ease-in-out infinite alternate}.pulse{animation:pulse 2.4s ease-in-out infinite}.sway{animation:sway 3s ease-in-out infinite}.tw{animation:tw 2s ease-in-out infinite}.fall{animation:fall 3.5s linear infinite}.spin{animation:spin 1.2s linear infinite}.rise{animation:rise 2.6s ease-out infinite}.flick{animation:flick .8s ease-in-out infinite}.dash{animation:dash 1s linear infinite}.grow{animation:grow 3s ease-in-out infinite}.tilt{animation:tilt 4s ease-in-out infinite}.walk{animation:walk 6s linear infinite alternate}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect width="400" height="240" fill="#FDF1DA"/><rect x="40" y="28" width="320" height="34" rx="8" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><text x="200" y="50" font-size="15" fill="#2B2F4A" text-anchor="middle" font-weight="normal">He stalks in his vivid stripes</text><rect x="40" y="68" width="320" height="34" rx="8" fill="#FFE0B8" stroke="#2B2F4A" stroke-width="2"/><text x="200" y="90" font-size="15" fill="#2B2F4A" text-anchor="middle" font-weight="normal">The few steps of his cage,</text><rect x="40" y="108" width="320" height="34" rx="8" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><text x="200" y="130" font-size="15" fill="#2B2F4A" text-anchor="middle" font-weight="normal">On pads of velvet quiet,</text><rect x="40" y="148" width="320" height="34" rx="8" fill="#FFE0B8" stroke="#2B2F4A" stroke-width="2"/><text x="200" y="170" font-size="15" fill="#2B2F4A" text-anchor="middle" font-weight="normal">In his quiet rage.</text><path d="M372,66 q16,20 0,40" stroke="#FF8A1F" stroke-width="3" fill="none" class="dash" stroke-dasharray="6 5"/></svg>