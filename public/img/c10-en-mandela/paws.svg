<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Paw prints crossing the ground</title><style>text{font-family:sans-serif}.a{transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes drift{0%{transform:translateX(-14px)}100%{transform:translateX(14px)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}@keyframes fall{0%{transform:translateY(-10px);opacity:0}15%{opacity:1}100%{transform:translateY(80px) rotate(90deg);opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.15)}}@keyframes dash{to{stroke-dashoffset:-24}}@keyframes grow{0%,100%{transform:scale(.85)}50%{transform:scale(1.1)}}@keyframes tilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}@keyframes walk{0%{transform:translateX(0)}100%{transform:translateX(60px)}}.bob{animation:bob 3s ease-in-out infinite}.drift{animation:drift 5s ease-in-out infinite alternate}.pulse{animation:pulse 2.4s ease-in-out infinite}.sway{animation:sway 3s ease-in-out infinite}.tw{animation:tw 2s ease-in-out infinite}.fall{animation:fall 3.5s linear infinite}.spin{animation:spin 1.2s linear infinite}.rise{animation:rise 2.6s ease-out infinite}.flick{animation:flick .8s ease-in-out infinite}.dash{animation:dash 1s linear infinite}.grow{animation:grow 3s ease-in-out infinite}.tilt{animation:tilt 4s ease-in-out infinite}.walk{animation:walk 6s linear infinite alternate}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect width="400" height="240" fill="#F1EDF9"/><rect y="170" width="400" height="70" fill="#CDB89A"/><g class="a pulse" style="animation-delay:-0.0s"><ellipse cx="90" cy="195" rx="16" ry="13" fill="#6B4220"/><circle cx="76" cy="176" r="5" fill="#6B4220"/><circle cx="85" cy="167" r="5" fill="#6B4220"/><circle cx="96" cy="167" r="5" fill="#6B4220"/><circle cx="105" cy="176" r="5" fill="#6B4220"/></g><g class="a pulse" style="animation-delay:-0.5s"><ellipse cx="160" cy="189" rx="16" ry="13" fill="#6B4220"/><circle cx="146" cy="170" r="5" fill="#6B4220"/><circle cx="155" cy="161" r="5" fill="#6B4220"/><circle cx="166" cy="161" r="5" fill="#6B4220"/><circle cx="175" cy="170" r="5" fill="#6B4220"/></g><g class="a pulse" style="animation-delay:-1.0s"><ellipse cx="230" cy="183" rx="16" ry="13" fill="#6B4220"/><circle cx="216" cy="164" r="5" fill="#6B4220"/><circle cx="225" cy="155" r="5" fill="#6B4220"/><circle cx="236" cy="155" r="5" fill="#6B4220"/><circle cx="245" cy="164" r="5" fill="#6B4220"/></g><g class="a pulse" style="animation-delay:-1.5s"><ellipse cx="300" cy="177" rx="16" ry="13" fill="#6B4220"/><circle cx="286" cy="158" r="5" fill="#6B4220"/><circle cx="295" cy="149" r="5" fill="#6B4220"/><circle cx="306" cy="149" r="5" fill="#6B4220"/><circle cx="315" cy="158" r="5" fill="#6B4220"/></g></svg>