<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Four steps rising like a staircase: a child, a book, a briefcase and a crowd, standing for growing ideas of freedom</title><style>text{font-family:sans-serif}.a{transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes drift{0%{transform:translateX(-14px)}100%{transform:translateX(14px)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}@keyframes fall{0%{transform:translateY(-10px);opacity:0}15%{opacity:1}100%{transform:translateY(80px) rotate(90deg);opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.15)}}@keyframes dash{to{stroke-dashoffset:-24}}@keyframes grow{0%,100%{transform:scale(.85)}50%{transform:scale(1.1)}}@keyframes tilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}@keyframes walk{0%{transform:translateX(0)}100%{transform:translateX(60px)}}.bob{animation:bob 3s ease-in-out infinite}.drift{animation:drift 5s ease-in-out infinite alternate}.pulse{animation:pulse 2.4s ease-in-out infinite}.sway{animation:sway 3s ease-in-out infinite}.tw{animation:tw 2s ease-in-out infinite}.fall{animation:fall 3.5s linear infinite}.spin{animation:spin 1.2s linear infinite}.rise{animation:rise 2.6s ease-out infinite}.flick{animation:flick .8s ease-in-out infinite}.dash{animation:dash 1s linear infinite}.grow{animation:grow 3s ease-in-out infinite}.tilt{animation:tilt 4s ease-in-out infinite}.walk{animation:walk 6s linear infinite alternate}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect width="400" height="240" fill="#F2F6FF"/><rect x="20" y="170" width="90" height="55" fill="#CFE9FB" stroke="#2B2F4A" stroke-width="3"/><rect x="110" y="135" width="90" height="90" fill="#BFD8F5" stroke="#2B2F4A" stroke-width="3"/><rect x="200" y="100" width="90" height="125" fill="#AECBF0" stroke="#2B2F4A" stroke-width="3"/><rect x="290" y="65" width="90" height="160" fill="#9DBDEB" stroke="#2B2F4A" stroke-width="3"/><g transform="translate(60 170) scale(1)"><g class="a bob"><rect x="-9" y="-30" width="18" height="30" rx="8" fill="#FF8A1F"/><circle cx="0" cy="-38" r="8" fill="#8C88A6"/></g></g><g class="a bob" style="animation-delay:-1s"><rect x="132" y="97" width="26" height="20" rx="3" fill="#fff" stroke="#2B2F4A" stroke-width="3"/></g><g class="a bob" style="animation-delay:-.5s"><rect x="222" y="62" width="30" height="22" rx="4" fill="#8B5A2B"/><rect x="230" y="55" width="14" height="8" rx="2" fill="none" stroke="#8B5A2B" stroke-width="3"/></g><g transform="translate(305.0 65) scale(0.7)"><rect x="-9" y="-28" width="18" height="28" rx="8" fill="#2B2F4A"/><circle cx="0" cy="-36" r="8" fill="#2B2F4A"/></g><g transform="translate(325.0 65) scale(0.7)"><rect x="-9" y="-28" width="18" height="28" rx="8" fill="#2B2F4A"/><circle cx="0" cy="-36" r="8" fill="#2B2F4A"/></g><g transform="translate(345.0 65) scale(0.7)"><rect x="-9" y="-28" width="18" height="28" rx="8" fill="#2B2F4A"/><circle cx="0" cy="-36" r="8" fill="#2B2F4A"/></g><g transform="translate(365.0 65) scale(0.7)"><rect x="-9" y="-28" width="18" height="28" rx="8" fill="#2B2F4A"/><circle cx="0" cy="-36" r="8" fill="#2B2F4A"/></g><text x="65" y="215" font-size="18" fill="#2B2F4A" text-anchor="middle" font-weight="bold">1</text><text x="155" y="215" font-size="18" fill="#2B2F4A" text-anchor="middle" font-weight="bold">2</text><text x="245" y="215" font-size="18" fill="#2B2F4A" text-anchor="middle" font-weight="bold">3</text><text x="335" y="215" font-size="18" fill="#2B2F4A" text-anchor="middle" font-weight="bold">4</text></svg>