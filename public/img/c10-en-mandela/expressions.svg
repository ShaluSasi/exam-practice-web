e-width="3"/><g transform="translate(201 176) scale(.9)"><g class="a tw"><path d="M0,-26 l6,18 18,6 -18,6 -6,18 -6,-18 -18,-6 18,-6z" fill="#FFC83D"/></g></g><rect x="270" y="126" width="118" height="100" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="3"/><g transform="translate(329 176) scale(.9)"><rect x="-40" y="-26" width="80" height="54" fill="#8A5A7A"/><path d="M-40,12 a40,40 0 0 1 80,0Z" fill="#FF8A1F"/><rect x="-40" y="12" width="80" height="16" fill="#2B2F4A"/></g></svg>