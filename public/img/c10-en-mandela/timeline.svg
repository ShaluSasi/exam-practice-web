<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A timeline arrow from the early 1900s to the 1990s with unlabelled question-mark markers along it</title><style>text{font-family:sans-serif}.a{transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes drift{0%{transform:translateX(-14px)}100%{transform:translateX(14px)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}@keyframes fall{0%{transform:translateY(-10px);opacity:0}15%{opacity:1}100%{transform:translateY(80px) rotate(90deg);opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.15)}}@keyframes dash{to{stroke-dashoffset:-24}}@keyframes grow{0%,100%{transform:scale(.85)}50%{transform:scale(1.1)}}@keyframes tilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}@keyframes walk{0%{transform:translateX(0)}100%{transform:translateX(60px)}}.bob{animation:bob 3s ease-in-out infinite}.drift{animation:drift 5s ease-in-out infinite alternate}.pulse{animation:pulse 2.4s ease-in-out infinite}.sway{animation:sway 3s ease-in-out infinite}.tw{animation:tw 2s ease-in-out infinite}.fall{animation:fall 3.5s linear infinite}.spin{animation:spin 1.2s linear infinite}.rise{animation:rise 2.6s ease-out infinite}.flick{animation:flick .8s ease-in-out infinite}.dash{animation:dash 1s linear infinite}.grow{animation:grow 3s ease-in-out infinite}.tilt{animation:tilt 4s ease-in-out infinite}.walk{animation:walk 6s linear infinite alternate}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect width="400" height="240" fill="#F4F1E8"/><path d="M30,150 H370" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round"/><path d="M370,150 l-12,-8 v16z" fill="#2B2F4A"/><g class="a bob" style="animation-delay:-0.0s"><circle cx="80" cy="150" r="11" fill="#FF8A1F"/><rect x="58" y="78" width="44" height="44" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="3"/><text x="80" y="110" font-size="24" fill="#2B2F4A" text-anchor="middle" font-weight="bold">?</text></g><g class="a bob" style="animation-delay:-0.6s"><circle cx="140" cy="150" r="11" fill="#FF8A1F"/><rect x="118" y="78" width="44" height="44" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="3"/><text x="140" y="110" font-size="24" fill="#2B2F4A" text-anchor="middle" font-weight="bold">?</text></g><g class="a bob" style="animation-delay:-1.2s"><circle cx="200" cy="150" r="11" fill="#FF8A1F"/><rect x="178" y="78" width="44" height="44" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="3"/><text x="200" y="110" font-size="24" fill="#2B2F4A" text-anchor="middle" font-weight="bold">?</text></g><g class="a bob" style="animation-delay:-1.7999999999999998s"><circle cx="260" cy="150" r="11" fill="#FF8A1F"/><rect x="238" y="78" width="44" height="44" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="3"/><text x="260" y="110" font-size="24" fill="#2B2F4A" text-anchor="middle" font-weight="bold">?</text></g><g class="a bob" style="animation-delay:-2.4s"><circle cx="320" cy="150" r="11" fill="#FF8A1F"/><rect x="298" y="78" width="44" height="44" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="3"/><text x="320" y="110" font-size="24" fill="#2B2F4A" text-anchor="middle" font-weight="bold">?</text></g><text x="60" y="186" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold">early 1900s</text><text x="340" y="186" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold">1990s</text></svg>