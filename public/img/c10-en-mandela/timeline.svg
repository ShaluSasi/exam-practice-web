<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A timeline arrow from the early 1900s to the 1990s showing a wall built, a birth and the wall gone</title><style>text{font-family:sans-serif}.a{transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes drift{0%{transform:translateX(-14px)}100%{transform:translateX(14px)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}@keyframes fall{0%{transform:translateY(-10px);opacity:0}15%{opacity:1}100%{transform:translateY(80px) rotate(90deg);opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.15)}}@keyframes dash{to{stroke-dashoffset:-24}}@keyframes grow{0%,100%{transform:scale(.85)}50%{transform:scale(1.1)}}@keyframes tilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}@keyframes walk{0%{transform:translateX(0)}100%{transform:translateX(60px)}}.bob{animation:bob 3s ease-in-out infinite}.drift{animation:drift 5s ease-in-out infinite alternate}.pulse{animation:pulse 2.4s ease-in-out infinite}.sway{animation:sway 3s ease-in-out infinite}.tw{animation:tw 2s ease-in-out infinite}.fall{animation:fall 3.5s linear infinite}.spin{animation:spin 1.2s linear infinite}.rise{animation:rise 2.6s ease-out infinite}.flick{animation:flick .8s ease-in-out infinite}.dash{animation:dash 1s linear infinite}.grow{animation:grow 3s ease-in-out infinite}.tilt{animation:tilt 4s ease-in-out infinite}.walk{animation:walk 6s linear infinite alternate}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect width="400" height="240" fill="#F4F1E8"/><path d="M30,150 H370" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round"/><path d="M370,150 l-12,-8 v16z" fill="#2B2F4A"/><circle cx="70" cy="150" r="9" fill="#FF8A1F"/><text x="70" y="182" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold">early 1900s</text><circle cx="200" cy="150" r="9" fill="#FF8A1F"/><text x="200" y="182" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold">after his birth</text><circle cx="330" cy="150" r="9" fill="#FF8A1F"/><text x="330" y="182" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold">1990s</text><rect x="50" y="134" width="22" height="14" fill="#8A8FA8" stroke="#2B2F4A" stroke-width="2"/><rect x="72" y="120" width="22" height="14" fill="#8A8FA8" stroke="#2B2F4A" stroke-width="2"/><rect x="50" y="106" width="22" height="14" fill="#8A8FA8" stroke="#2B2F4A" stroke-width="2"/><rect x="72" y="92" width="22" height="14" fill="#8A8FA8" stroke="#2B2F4A" stroke-width="2"/><g class="a pulse"><rect x="170" y="100" width="60" height="38" rx="8" fill="#fff" stroke="#2B2F4A" stroke-width="3"/></g><g transform="translate(200 138) scale(0.8)"><rect x="-9" y="-30" width="18" height="30" rx="8" fill="#3FA34D"/><circle cx="0" cy="-38" r="8" fill="#8C88A6"/></g><path d="M310,138 q8,-30 20,-6 q12,-26 20,6" fill="none" stroke="#3FA34D" stroke-width="4"/><g class="a bob"><path d="M312,140 l14,-24 l14,24z" fill="#FFC83D"/></g><text x="70" y="62" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="bold">wall built</text><text x="200" y="80" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="bold">Mandela born</text><text x="330" y="80" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="bold">wall gone</text></svg>