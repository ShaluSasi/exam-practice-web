<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A deep pit with a figure at the bottom and a tall tower with a figure on top joined by an arrow</title><style>text{font-family:sans-serif}.a{transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes drift{0%{transform:translateX(-14px)}100%{transform:translateX(14px)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}@keyframes fall{0%{transform:translateY(-10px);opacity:0}15%{opacity:1}100%{transform:translateY(80px) rotate(90deg);opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.15)}}@keyframes dash{to{stroke-dashoffset:-24}}@keyframes grow{0%,100%{transform:scale(.85)}50%{transform:scale(1.1)}}@keyframes tilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}@keyframes walk{0%{transform:translateX(0)}100%{transform:translateX(60px)}}.bob{animation:bob 3s ease-in-out infinite}.drift{animation:drift 5s ease-in-out infinite alternate}.pulse{animation:pulse 2.4s ease-in-out infinite}.sway{animation:sway 3s ease-in-out infinite}.tw{animation:tw 2s ease-in-out infinite}.fall{animation:fall 3.5s linear infinite}.spin{animation:spin 1.2s linear infinite}.rise{animation:rise 2.6s ease-out infinite}.flick{animation:flick .8s ease-in-out infinite}.dash{animation:dash 1s linear infinite}.grow{animation:grow 3s ease-in-out infinite}.tilt{animation:tilt 4s ease-in-out infinite}.walk{animation:walk 6s linear infinite alternate}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect width="400" height="240" fill="#EAF2FB"/><rect y="170" width="400" height="70" fill="#8B6A45"/><path d="M40,170 L60,225 H140 L160,170Z" fill="#4A3524"/><g transform="translate(100 222) scale(1.0)"><rect x="-9" y="-30" width="18" height="30" rx="8" fill="#9AA0D0"/><circle cx="0" cy="-38" r="8" fill="#8C88A6"/></g><path d="M300,170 V70 h40 V170Z" fill="#8A8FA8" stroke="#2B2F4A" stroke-width="3"/><g class="a bob"><g transform="translate(320 70) scale(1.0)"><rect x="-9" y="-30" width="18" height="30" rx="8" fill="#FF8A1F"/><circle cx="0" cy="-38" r="8" fill="#8C88A6"/></g></g><g class="a pulse"><path d="M308,50 l4,10 10,1 -8,6 3,10 -9,-6 -9,6 3,-10 -8,-6 10,-1z" fill="#FFC83D" transform="translate(8 -14) scale(.9)"/></g><path d="M150,150 Q220,60 295,100" stroke="#FF8A1F" stroke-width="4" fill="none" stroke-dasharray="10 8" class="dash"/><path d="M296,100 l-12,-8 -2,12z" fill="#FF8A1F"/><text x="100" y="160" font-size="14" fill="#2B2F4A" text-anchor="middle" font-weight="bold">depths</text><text x="320" y="190" font-size="14" fill="#fff" text-anchor="middle" font-weight="bold">heights</text></svg>