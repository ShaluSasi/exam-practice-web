<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Three pictures: a broken chain, two equal figures and a rising sun, standing for the ideals in the speech</title><style>text{font-family:sans-serif}.a{transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes drift{0%{transform:translateX(-14px)}100%{transform:translateX(14px)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}@keyframes fall{0%{transform:translateY(-10px);opacity:0}15%{opacity:1}100%{transform:translateY(80px) rotate(90deg);opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.15)}}@keyframes dash{to{stroke-dashoffset:-24}}@keyframes grow{0%,100%{transform:scale(.85)}50%{transform:scale(1.1)}}@keyframes tilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}@keyframes walk{0%{transform:translateX(0)}100%{transform:translateX(60px)}}.bob{animation:bob 3s ease-in-out infinite}.drift{animation:drift 5s ease-in-out infinite alternate}.pulse{animation:pulse 2.4s ease-in-out infinite}.sway{animation:sway 3s ease-in-out infinite}.tw{animation:tw 2s ease-in-out infinite}.fall{animation:fall 3.5s linear infinite}.spin{animation:spin 1.2s linear infinite}.rise{animation:rise 2.6s ease-out infinite}.flick{animation:flick .8s ease-in-out infinite}.dash{animation:dash 1s linear infinite}.grow{animation:grow 3s ease-in-out infinite}.tilt{animation:tilt 4s ease-in-out infinite}.walk{animation:walk 6s linear infinite alternate}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="14" y="28" width="108" height="150" rx="14" fill="#fff" stroke="#2B2F4A" stroke-width="3"/><rect x="146" y="28" width="108" height="150" rx="14" fill="#fff" stroke="#2B2F4A" stroke-width="3"/><rect x="278" y="28" width="108" height="150" rx="14" fill="#fff" stroke="#2B2F4A" stroke-width="3"/><g transform="translate(68 103)"><ellipse cx="-20" cy="0" rx="16" ry="10" fill="none" stroke="#2B2F4A" stroke-width="6"/><ellipse cx="20" cy="0" rx="16" ry="10" fill="none" stroke="#2B2F4A" stroke-width="6" stroke-dasharray="60 8"/><g class="a tw"><path d="M-4,-20 l4,12 M4,-20 l-4,12 M0,-24 v10" stroke="#E5484D" stroke-width="3"/></g></g><g transform="translate(185 120) scale(1.5)"><g class="a bob"><rect x="-9" y="-30" width="18" height="30" rx="8" fill="#FF8A1F"/><circle cx="0" cy="-38" r="8" fill="#8C88A6"/></g></g><g transform="translate(215 120) scale(1.5)"><g class="a bob" style="animation-delay:-1s"><rect x="-9" y="-30" width="18" height="30" rx="8" fill="#0B93D4"/><circle cx="0" cy="-38" r="8" fill="#8C88A6"/></g></g><line x1="165" y1="140" x2="235" y2="140" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/><line x1="165" y1="150" x2="235" y2="150" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/><path d="M290,140 h84" stroke="#2B2F4A" stroke-width="4"/><g class="a pulse"><path d="M304,140 a28,28 0 0 1 56,0Z" fill="#FFC83D"/></g><line x1="332" y1="102" x2="302" y2="92" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" class="a tw"/><line x1="332" y1="102" x2="332" y2="84" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" class="a tw"/><line x1="332" y1="102" x2="362" y2="92" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" class="a tw"/></svg>