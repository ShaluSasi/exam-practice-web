<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A balance scale with a small group of figures on one pan and a large crowd on the other</title><style>text{font-family:sans-serif}.a{transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes drift{0%{transform:translateX(-14px)}100%{transform:translateX(14px)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}@keyframes fall{0%{transform:translateY(-10px);opacity:0}15%{opacity:1}100%{transform:translateY(80px) rotate(90deg);opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.15)}}@keyframes dash{to{stroke-dashoffset:-24}}@keyframes grow{0%,100%{transform:scale(.85)}50%{transform:scale(1.1)}}@keyframes tilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}@keyframes walk{0%{transform:translateX(0)}100%{transform:translateX(60px)}}.bob{animation:bob 3s ease-in-out infinite}.drift{animation:drift 5s ease-in-out infinite alternate}.pulse{animation:pulse 2.4s ease-in-out infinite}.sway{animation:sway 3s ease-in-out infinite}.tw{animation:tw 2s ease-in-out infinite}.fall{animation:fall 3.5s linear infinite}.spin{animation:spin 1.2s linear infinite}.rise{animation:rise 2.6s ease-out infinite}.flick{animation:flick .8s ease-in-out infinite}.dash{animation:dash 1s linear infinite}.grow{animation:grow 3s ease-in-out infinite}.tilt{animation:tilt 4s ease-in-out infinite}.walk{animation:walk 6s linear infinite alternate}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect width="400" height="240" fill="#F1F7EC"/><rect x="190" y="70" width="20" height="150" rx="6" fill="#2B2F4A"/><rect x="150" y="214" width="100" height="14" rx="6" fill="#2B2F4A"/><g class="a tilt" style="transform-origin:200px 76px"><line x1="60" y1="76" x2="340" y2="76" stroke="#2B2F4A" stroke-width="6" stroke-linecap="round"/><line x1="60" y1="76" x2="40" y2="120" stroke="#2B2F4A" stroke-width="3"/><line x1="60" y1="76" x2="100" y2="120" stroke="#2B2F4A" stroke-width="3"/><path d="M30,120 H110 Q70,150 30,120Z" fill="#FF8A1F"/><path d="M52,115 v-12 l18,-14 l18,14 v12z" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><g transform="translate(60 114) scale(0.5)"><rect x="-9" y="-30" width="18" height="30" rx="8" fill="#0B93D4"/><circle cx="0" cy="-38" r="8" fill="#8C88A6"/></g><g transform="translate(80 114) scale(0.45)"><rect x="-9" y="-30" width="18" height="30" rx="8" fill="#3FA34D"/><circle cx="0" cy="-38" r="8" fill="#8C88A6"/></g><line x1="340" y1="76" x2="300" y2="120" stroke="#2B2F4A" stroke-width="3"/><line x1="340" y1="76" x2="380" y2="120" stroke="#2B2F4A" stroke-width="3"/><path d="M290,120 H390 Q340,150 290,120Z" fill="#0B93D4"/><g transform="translate(300 118) scale(0.4)"><rect x="-9" y="-30" width="18" height="30" rx="8" fill="#FF8A1F"/><circle cx="0" cy="-38" r="8" fill="#8C88A6"/></g><g transform="translate(316 118) scale(0.4)"><rect x="-9" y="-30" width="18" height="30" rx="8" fill="#3FA34D"/><circle cx="0" cy="-38" r="8" fill="#8C88A6"/></g><g transform="translate(332 118) scale(0.4)"><rect x="-9" y="-30" width="18" height="30" rx="8" fill="#7C5CFF"/><circle cx="0" cy="-38" r="8" fill="#8C88A6"/></g><g transform="translate(348 118) scale(0.4)"><rect x="-9" y="-30" width="18" height="30" rx="8" fill="#E5484D"/><circle cx="0" cy="-38" r="8" fill="#8C88A6"/></g><g transform="translate(364 118) scale(0.4)"><rect x="-9" y="-30" width="18" height="30" rx="8" fill="#2B2F4A"/><circle cx="0" cy="-38" r="8" fill="#8C88A6"/></g></g></svg>