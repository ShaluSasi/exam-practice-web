<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A bright morning with the sun rising behind a sandstone building and an autumn tree shedding orange leaves</title><style>text{font-family:sans-serif}.a{transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes drift{0%{transform:translateX(-14px)}100%{transform:translateX(14px)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}@keyframes fall{0%{transform:translateY(-10px);opacity:0}15%{opacity:1}100%{transform:translateY(80px) rotate(90deg);opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-40px);opacity:0}}@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.15)}}@keyframes dash{to{stroke-dashoffset:-24}}@keyframes grow{0%,100%{transform:scale(.85)}50%{transform:scale(1.1)}}@keyframes tilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}@keyframes walk{0%{transform:translateX(0)}100%{transform:translateX(60px)}}.bob{animation:bob 3s ease-in-out infinite}.drift{animation:drift 5s ease-in-out infinite alternate}.pulse{animation:pulse 2.4s ease-in-out infinite}.sway{animation:sway 3s ease-in-out infinite}.tw{animation:tw 2s ease-in-out infinite}.fall{animation:fall 3.5s linear infinite}.spin{animation:spin 1.2s linear infinite}.rise{animation:rise 2.6s ease-out infinite}.flick{animation:flick .8s ease-in-out infinite}.dash{animation:dash 1s linear infinite}.grow{animation:grow 3s ease-in-out infinite}.tilt{animation:tilt 4s ease-in-out infinite}.walk{animation:walk 6s linear infinite alternate}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect width="400" height="240" rx="16" fill="#BFE3F5"/><rect y="110" width="400" height="130" fill="#FFE9B0"/><g class="a pulse"><circle cx="150" cy="140" r="34" fill="#FFC83D" opacity=".5"/></g><circle cx="150" cy="140" r="24" fill="#FF8A1F"/><rect x="60" y="150" width="190" height="50" fill="#E8C48B" stroke="#D9A86A" stroke-width="3"/><rect x="72" y="156" width="8" height="44" fill="#D9A86A"/><rect x="96" y="156" width="8" height="44" fill="#D9A86A"/><rect x="120" y="156" width="8" height="44" fill="#D9A86A"/><rect x="144" y="156" width="8" height="44" fill="#D9A86A"/><rect x="168" y="156" width="8" height="44" fill="#D9A86A"/><rect x="192" y="156" width="8" height="44" fill="#D9A86A"/><rect x="216" y="156" width="8" height="44" fill="#D9A86A"/><rect x="240" y="156" width="8" height="44" fill="#D9A86A"/><path d="M52,150 L155,128 L258,150Z" fill="#D9A86A"/><rect y="200" width="400" height="40" fill="#C9A66B"/><g transform="translate(330 205)"><rect x="-5" y="-60" width="10" height="60" fill="#8B5A2B"/><circle cx="0" cy="-75" r="30" fill="#FF8A1F"/><circle cx="-22" cy="-55" r="18" fill="#E0701B"/><circle cx="22" cy="-55" r="18" fill="#E8A13A"/></g><g class="a fall" style="animation-delay:-0.0s"><ellipse cx="300" cy="120" rx="6" ry="3" fill="#FF8A1F"/></g><g class="a fall" style="animation-delay:-0.9s"><ellipse cx="335" cy="120" rx="6" ry="3" fill="#FF8A1F"/></g><g class="a fall" style="animation-delay:-1.8s"><ellipse cx="360" cy="120" rx="6" ry="3" fill="#FF8A1F"/></g><g class="a fall" style="animation-delay:-2.7s"><ellipse cx="320" cy="120" rx="6" ry="3" fill="#FF8A1F"/></g><rect x="20" y="18" width="96" height="34" rx="8" fill="#fff" stroke="#2B2F4A" stroke-width="3"/><text x="68" y="41" font-size="18" fill="#2B2F4A" text-anchor="middle" font-weight="bold">10 May</text></svg>