<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Ground cross-section: rain recharges groundwater while a pump draws it out and the water table falls</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift,.gr{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-26px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:.9}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.3}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
.gr{transform-origin:50% 100%;animation:gr 3s ease-in-out infinite}
@keyframes gr{50%{transform:scaleY(.93)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#E3F2FD"/><rect x="0" y="96" width="400" height="144" rx="0" fill="#E8D5B5"  /><path d="M0 150H400V240H0Z" fill="#7FD0F6" opacity=".6"/><path d="M0 150H400" stroke="#0B93D4" stroke-width="3" stroke-dasharray="8 5"/><text x="330" y="146" font-size="11" text-anchor="middle" style="fill:#0B93D4">water table</text><rect x="0" y="80" width="400" height="18" rx="0" fill="#CDE9B5"  /><g transform="translate(80 36) scale(1.2)"><g><path d="M-26 8Q-34 8 -32 -2Q-30 -10 -20 -8Q-18 -22 -4 -18Q6 -26 16 -14Q30 -14 30 -2Q32 8 22 8Z" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="-14" y1="14" x2="-17" y2="24" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" class="fall" style="animation-delay:0s"/><line x1="0" y1="14" x2="-3" y2="24" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" class="fall" style="animation-delay:0.5s"/><line x1="14" y1="14" x2="11" y2="24" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" class="fall" style="animation-delay:1s"/></g></g><g transform="translate(350 36) scale(0.7)"><g><g class="spin"><line x1="17.0" y1="0.0" x2="24.0" y2="0.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="12.0" y1="12.0" x2="17.0" y2="17.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="0.0" y1="17.0" x2="0.0" y2="24.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="-12.0" y1="12.0" x2="-17.0" y2="17.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="-17.0" y1="0.0" x2="-24.0" y2="0.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="-12.0" y1="-12.0" x2="-17.0" y2="-17.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="-0.0" y1="-17.0" x2="-0.0" y2="-24.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><line x1="12.0" y1="-12.0" x2="17.0" y2="-17.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/></g><circle r="12" fill="#FFC93C" stroke="#FF8A1F" stroke-width="3"/></g></g><rect x="196" y="84" width="14" height="120" fill="#6B7390" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(203 66) scale(0.9)"><g><rect x="-12" y="4" width="24" height="22" fill="#C9CFE0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-4 4V-20H14Q18 -20 18 -14V-8" fill="none" stroke="#2B2F4A" stroke-width="6" stroke-linecap="round"/><g class="fall"><path d="M18 -4Q14 4 18 8Q22 4 18 -4Z" fill="#7FD0F6" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><line x1="92" y1="108" x2="92" y2="140" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" class="fl" marker-end="url(#ahb)"/><text x="112" y="128" font-size="11" text-anchor="start" style="fill:#0B93D4">recharge</text><g class="bob"><path d="M300 140V190M290 180L300 192L310 180" fill="none" stroke="#E5484D" stroke-width="4" stroke-linecap="round"/></g><text x="300" y="214" font-size="11" text-anchor="middle" style="fill:#E5484D">water level falls</text></svg>