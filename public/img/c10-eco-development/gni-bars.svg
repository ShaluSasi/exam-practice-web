<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Bar chart of GNI per capita for Sri Lanka, India, Bangladesh, Pakistan, Myanmar and Nepal</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift,.gr{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-26px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:.9}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.3}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
.gr{transform-origin:50% 100%;animation:gr 3s ease-in-out infinite}
@keyframes gr{50%{transform:scaleY(.93)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="20" font-size="12" text-anchor="middle">GNI per capita (2021 PPP $), 2023</text><rect x="24" y="56.00" width="40" height="130.00" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="44.0" y="51.0" font-size="10" text-anchor="middle">12,616</text><text x="44.0" y="201" font-size="11" text-anchor="middle">Sri Lanka</text><rect x="84" y="92.78" width="40" height="93.22" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="104.0" y="87.77631578947368" font-size="10" text-anchor="middle">9,047</text><text x="104.0" y="201" font-size="11" text-anchor="middle">India</text><rect x="144" y="98.43" width="40" height="87.57" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="164.0" y="93.43341788205454" font-size="10" text-anchor="middle">8,498</text><text x="164.0" y="201" font-size="11" text-anchor="middle">Bangl.</text><rect x="204" y="129.32" width="40" height="56.68" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="224.0" y="124.31563094483195" font-size="10" text-anchor="middle">5,501</text><text x="224.0" y="201" font-size="11" text-anchor="middle">Pakistan</text><rect x="264" y="135.31" width="40" height="50.69" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="284.0" y="130.31277742549145" font-size="10" text-anchor="middle">4,919</text><text x="284.0" y="201" font-size="11" text-anchor="middle">Myanmar</text><rect x="324" y="137.30" width="40" height="48.70" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="344.0" y="132.3015218769816" font-size="10" text-anchor="middle">4,726</text><text x="344.0" y="201" font-size="11" text-anchor="middle">Nepal</text><path d="M16 186H384" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="222" font-size="11" text-anchor="middle">Countries ranked by income per person</text></svg>