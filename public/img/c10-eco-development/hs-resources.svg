troke="#FF8A1F" stroke-width="3"/></g></g><g transform="translate(350 62) scale(1.1)"><g><path d="M-26 8Q-34 8 -32 -2Q-30 -10 -20 -8Q-18 -22 -4 -18Q6 -26 16 -14Q30 -14 30 -2Q32 8 22 8Z" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="-14" y1="14" x2="-17" y2="24" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" class="fall" style="animation-delay:0s"/><line x1="0" y1="14" x2="-3" y2="24" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" class="fall" style="animation-delay:0.5s"/><line x1="14" y1="14" x2="11" y2="24" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" class="fall" style="animation-delay:1s"/></g></g><ellipse cx="60" cy="226" rx="44" ry="10" fill="#2B2F4A"/><path d="M150 214Q215 232 300 214V240H150Z" fill="#7FD0F6" opacity=".8"/><g transform="translate(60 150) scale(0.95)"><g><path d="M-14 26L0 -30L14 26M-10 14H10M-6 0H6M-3 -14H3" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-22" y="22" width="44" height="6" fill="#6B7390" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 -30V-38" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g class="bob"><path d="M-20 -22L-6 -22L-6 -14Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><path d="M112 184V164M106 184V170M118 184V170" stroke="#C9A227" stroke-width="3" stroke-linecap="round"/><circle cx="112" cy="160" r="4" fill="#F2C94C"/><path d="M132 184V164M126 184V170M138 184V170" stroke="#C9A227" stroke-width="3" stroke-linecap="round"/><circle cx="132" cy="160" r="4" fill="#F2C94C"/><path d="M152 184V164M146 184V170M158 184V170" stroke="#C9A227" stroke-width="3" stroke-linecap="round"/><circle cx="152" cy="160" r="4" fill="#F2C94C"/><g transform="translate(215 160) scale(1.1)"><g><rect x="-12" y="4" width="24" height="22" fill="#C9CFE0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-4 4V-20H14Q18 -20 18 -14V-8" fill="none" stroke="#2B2F4A" stroke-width="6" stroke-linecap="round"/><g class="fall"><path d="M18 -4Q14 4 18 8Q22 4 18 -4Z" fill="#7FD0F6" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><g transform="translate(290 156) scale(1.1)"><g><rect x="-4" y="6" width="8" height="18" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-4" r="16" fill="#4CB85A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-9" cy="4" r="9" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="4" r="9" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(318 160) scale(0.9)"><g><rect x="-4" y="6" width="8" height="18" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-4" r="16" fill="#4CB85A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-9" cy="4" r="9" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="4" r="9" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg>