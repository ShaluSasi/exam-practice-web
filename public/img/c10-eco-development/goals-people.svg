ranslate(322 164) scale(0.9)"><g class="bob"><path d="M4 -22L-12 4H-1L-5 24L13 -4H2Z" fill="#FFC93C" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="295" y="220" font-size="11" text-anchor="middle">Industrialist</text></svg>