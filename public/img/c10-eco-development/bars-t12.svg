<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Two bar charts: Country A has five similar incomes, Country B has four small incomes and one very large</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift,.gr{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-26px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:.9}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.3}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
.gr{transform-origin:50% 100%;animation:gr 3s ease-in-out infinite}
@keyframes gr{50%{transform:scaleY(.93)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="20" font-size="12" text-anchor="middle">Monthly income of 5 citizens (₹, k = thousand)</text><rect x="24" y="170.27" width="24" height="25.73" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="36.0" y="165.27083333333334" font-size="11" text-anchor="middle">9.5k</text><text x="36.0" y="211" font-size="11" text-anchor="middle">I</text><rect x="56" y="167.56" width="24" height="28.44" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="68.0" y="162.5625" font-size="11" text-anchor="middle">10.5k</text><text x="68.0" y="211" font-size="11" text-anchor="middle">II</text><rect x="88" y="169.46" width="24" height="26.54" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="100.0" y="164.45833333333334" font-size="11" text-anchor="middle">9.8k</text><text x="100.0" y="211" font-size="11" text-anchor="middle">III</text><rect x="120" y="168.92" width="24" height="27.08" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="132.0" y="163.91666666666666" font-size="11" text-anchor="middle">10k</text><text x="132.0" y="211" font-size="11" text-anchor="middle">IV</text><rect x="152" y="168.38" width="24" height="27.62" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="164.0" y="163.375" font-size="11" text-anchor="middle">10.2k</text><text x="164.0" y="211" font-size="11" text-anchor="middle">V</text><path d="M16 196H184" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="214" y="194.65" width="24" height="1.35" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="226.0" y="189.64583333333334" font-size="11" text-anchor="middle">0.5k</text><text x="226.0" y="211" font-size="11" text-anchor="middle">I</text><rect x="246" y="194.65" width="24" height="1.35" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="258.0" y="189.64583333333334" font-size="11" text-anchor="middle">0.5k</text><text x="258.0" y="211" font-size="11" text-anchor="middle">II</text><rect x="278" y="194.65" width="24" height="1.35" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="290.0" y="189.64583333333334" font-size="11" text-anchor="middle">0.5k</text><text x="290.0" y="211" font-size="11" text-anchor="middle">III</text><rect x="310" y="194.65" width="24" height="1.35" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="322.0" y="189.64583333333334" font-size="11" text-anchor="middle">0.5k</text><text x="322.0" y="211" font-size="11" text-anchor="middle">IV</text><rect x="342" y="66.00" width="24" height="130.00" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="354.0" y="61.0" font-size="11" text-anchor="middle">48k</text><text x="354.0" y="211" font-size="11" text-anchor="middle">V</text><path d="M206 196H374" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="234" font-size="13" text-anchor="middle">Country A</text><text x="300" y="234" font-size="13" text-anchor="middle">Country B</text></svg>