<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A girl being measured against a wall scale with a weighing machine and the BMI formula</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift,.gr{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-26px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:.9}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.3}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
.gr{transform-origin:50% 100%;animation:gr 3s ease-in-out infinite}
@keyframes gr{50%{transform:scaleY(.93)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#E3F2FD"/><rect x="0" y="200" width="400" height="40" rx="0" fill="#CDE9B5"  /><rect x="262" y="28" width="18" height="172" rx="4" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M262 40H276" stroke="#2B2F4A" stroke-width="2"/><path d="M262 56H270" stroke="#2B2F4A" stroke-width="2"/><path d="M262 72H276" stroke="#2B2F4A" stroke-width="2"/><path d="M262 88H270" stroke="#2B2F4A" stroke-width="2"/><path d="M262 104H276" stroke="#2B2F4A" stroke-width="2"/><path d="M262 120H270" stroke="#2B2F4A" stroke-width="2"/><path d="M262 136H276" stroke="#2B2F4A" stroke-width="2"/><path d="M262 152H270" stroke="#2B2F4A" stroke-width="2"/><path d="M262 168H276" stroke="#2B2F4A" stroke-width="2"/><path d="M262 184H270" stroke="#2B2F4A" stroke-width="2"/><g transform="translate(220 172) scale(1.55)"><g><path d="M-5 14V26M5 14V26" stroke="#3B4268" stroke-width="5" stroke-linecap="round"/><path d="M-9 -10H9L13 16H-13Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-19" r="8" fill="#E0B088" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-9 -20Q-9 -34 0 -34Q9 -34 9 -20L11 -6" fill="none" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round"/></g></g><g class="bob"><rect x="190" y="110" width="92" height="8" rx="3" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2"/></g><rect x="36" y="168" width="64" height="26" rx="8" fill="#C9CFE0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="68" cy="181" r="9" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><path d="M68 181L74 176" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="160" font-size="11" text-anchor="middle">weight (kg)</text><text x="40" y="50" font-size="18" text-anchor="middle">BMI</text><text x="70" y="50" font-size="18" text-anchor="middle">=</text><text x="140" y="42" font-size="13" text-anchor="middle">weight (kg)</text><path d="M84 49H196" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="66" font-size="13" text-anchor="middle">height² (m²)</text></svg>