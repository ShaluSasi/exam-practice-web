<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Table of GNI per capita, life expectancy, mean years of schooling and HDI rank for six South Asian countries</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift,.gr{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-26px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:.9}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.3}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
.gr{transform-origin:50% 100%;animation:gr 3s ease-in-out infinite}
@keyframes gr{50%{transform:scaleY(.93)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="18" font-size="13" text-anchor="middle">India and its neighbours, 2023</text><rect x="8" y="26" width="384" height="40" fill="#E6E0FF" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="18" y="42" font-size="11" text-anchor="start">Country</text><text x="130" y="42" font-size="11" text-anchor="middle">GNI per capita</text><text x="130" y="56" font-size="10" text-anchor="middle">(2021 PPP $)</text><text x="204" y="42" font-size="11" text-anchor="middle">Life expect.</text><text x="204" y="56" font-size="10" text-anchor="middle">at birth</text><text x="276" y="42" font-size="11" text-anchor="middle">Mean years of</text><text x="276" y="56" font-size="10" text-anchor="middle">schooling</text><text x="352" y="42" font-size="11" text-anchor="middle">HDI rank</text><text x="352" y="56" font-size="10" text-anchor="middle">(of 193)</text><rect x="8" y="69" width="384" height="24" fill="#F6F4FF" /><text x="18" y="84" font-size="12" text-anchor="start">Sri Lanka</text><text x="130" y="84" font-size="12" text-anchor="middle">12,616</text><text x="204" y="84" font-size="12" text-anchor="middle">77.5</text><text x="276" y="84" font-size="12" text-anchor="middle">10.8</text><text x="352" y="84" font-size="12" text-anchor="middle">89</text><rect x="8" y="93" width="384" height="24" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="18" y="108" font-size="12" text-anchor="start">India</text><text x="130" y="108" font-size="12" text-anchor="middle">9,047</text><text x="204" y="108" font-size="12" text-anchor="middle">72</text><text x="276" y="108" font-size="12" text-anchor="middle">6.9</text><text x="352" y="108" font-size="12" text-anchor="middle">130</text><rect x="8" y="117" width="384" height="24" fill="#F6F4FF" /><text x="18" y="132" font-size="12" text-anchor="start">Myanmar</text><text x="130" y="132" font-size="12" text-anchor="middle">4,919</text><text x="204" y="132" font-size="12" text-anchor="middle">66.9</text><text x="276" y="132" font-size="12" text-anchor="middle">6.4</text><text x="352" y="132" font-size="12" text-anchor="middle">150</text><rect x="8" y="141" width="384" height="24" fill="#fff" /><text x="18" y="156" font-size="12" text-anchor="start">Pakistan</text><text x="130" y="156" font-size="12" text-anchor="middle">5,501</text><text x="204" y="156" font-size="12" text-anchor="middle">67.6</text><text x="276" y="156" font-size="12" text-anchor="middle">4.3</text><text x="352" y="156" font-size="12" text-anchor="middle">168</text><rect x="8" y="165" width="384" height="24" fill="#F6F4FF" /><text x="18" y="180" font-size="12" text-anchor="start">Nepal</text><text x="130" y="180" font-size="12" text-anchor="middle">4,726</text><text x="204" y="180" font-size="12" text-anchor="middle">70.4</text><text x="276" y="180" font-size="12" text-anchor="middle">4.5</text><text x="352" y="180" font-size="12" text-anchor="middle">145</text><rect x="8" y="189" width="384" height="24" fill="#fff" /><text x="18" y="204" font-size="12" text-anchor="start">Bangladesh</text><text x="130" y="204" font-size="12" text-anchor="middle">8,498</text><text x="204" y="204" font-size="12" text-anchor="middle">74.7</text><text x="276" y="204" font-size="12" text-anchor="middle">6.8</text><text x="352" y="204" font-size="12" text-anchor="middle">130</text><text x="200" y="232" font-size="10" text-anchor="middle">HDI = Human Development Index; PPP = purchasing power parity</text></svg>