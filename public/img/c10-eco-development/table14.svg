nt-size="10" text-anchor="middle">per 1,000</text><rect x="148" y="83.40" width="26" height="106.60" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="161.0" y="78.4" font-size="11" text-anchor="middle">82</text><text x="161.0" y="205" font-size="12" text-anchor="middle">H</text><rect x="184" y="67.80" width="26" height="122.20" rx="3" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="197.0" y="62.80000000000001" font-size="11" text-anchor="middle">94</text><text x="197.0" y="205" font-size="12" text-anchor="middle">K</text><rect x="220" y="109.40" width="26" height="80.60" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="233.0" y="104.4" font-size="11" text-anchor="middle">62</text><text x="233.0" y="205" font-size="12" text-anchor="middle">B</text><path d="M140 190H256" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="198" y="24" font-size="11" text-anchor="middle">Literacy rate %</text><rect x="278" y="95.10" width="26" height="94.90" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="291.0" y="90.10000000000001" font-size="11" text-anchor="middle">73</text><text x="291.0" y="205" font-size="12" text-anchor="middle">H</text><rect x="314" y="67.80" width="26" height="122.20" rx="3" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="327.0" y="62.80000000000001" font-size="11" text-anchor="middle">94</text><text x="327.0" y="205" font-size="12" text-anchor="middle">K</text><rect x="350" y="100.30" width="26" height="89.70" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="363.0" y="95.30000000000001" font-size="11" text-anchor="middle">69</text><text x="363.0" y="205" font-size="12" text-anchor="middle">B</text><path d="M270 190H386" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="328" y="24" font-size="11" text-anchor="middle">Net attendance</text><text x="328" y="38" font-size="10" text-anchor="middle">per 100</text><text x="200" y="222" font-size="12" text-anchor="middle">H = Haryana   K = Kerala   B = Bihar</text></svg>