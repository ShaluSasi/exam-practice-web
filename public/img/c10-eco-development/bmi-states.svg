<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Grouped bars of adults with low BMI in Kerala, Karnataka, Madhya Pradesh and all states, males and females</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift,.gr{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-26px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:.9}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.3}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
.gr{transform-origin:50% 100%;animation:gr 3s ease-in-out infinite}
@keyframes gr{50%{transform:scaleY(.93)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="20" font-size="12" text-anchor="middle">Adults 15-49 with BMI below 18.5 (%), 2019-21</text><rect x="28" y="155.17" width="26" height="36.83" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="41.0" y="150.16666666666666" font-size="11" text-anchor="middle">8.5</text><text x="41.0" y="207" font-size="11" text-anchor="middle"></text><rect x="58" y="148.67" width="26" height="43.33" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="71.0" y="143.66666666666669" font-size="11" text-anchor="middle">10</text><text x="71.0" y="207" font-size="11" text-anchor="middle"></text><path d="M20 192H88" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="56" y="208" font-size="11" text-anchor="middle">Kerala</text><rect x="118" y="118.33" width="26" height="73.67" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="131.0" y="113.33333333333333" font-size="11" text-anchor="middle">17</text><text x="131.0" y="207" font-size="11" text-anchor="middle"></text><rect x="148" y="101.00" width="26" height="91.00" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="161.0" y="96.0" font-size="11" text-anchor="middle">21</text><text x="161.0" y="207" font-size="11" text-anchor="middle"></text><path d="M110 192H178" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="146" y="208" font-size="11" text-anchor="middle">Karnataka</text><rect x="208" y="70.67" width="26" height="121.33" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="221.0" y="65.66666666666667" font-size="11" text-anchor="middle">28</text><text x="221.0" y="207" font-size="11" text-anchor="middle"></text><rect x="238" y="70.67" width="26" height="121.33" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="251.0" y="65.66666666666667" font-size="11" text-anchor="middle">28</text><text x="251.0" y="207" font-size="11" text-anchor="middle"></text><path d="M200 192H268" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="236" y="208" font-size="11" text-anchor="middle">M. Pradesh</text><rect x="298" y="105.33" width="26" height="86.67" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="311.0" y="100.33333333333334" font-size="11" text-anchor="middle">20</text><text x="311.0" y="207" font-size="11" text-anchor="middle"></text><rect x="328" y="92.33" width="26" height="99.67" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="341.0" y="87.33333333333333" font-size="11" text-anchor="middle">23</text><text x="341.0" y="207" font-size="11" text-anchor="middle"></text><path d="M290 192H358" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="326" y="208" font-size="11" text-anchor="middle">All states</text><path d="M20 192H380" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="262" y="30" width="12" height="12" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="280" y="40" font-size="11" text-anchor="start">Male</text><rect x="318" y="30" width="12" height="12" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="336" y="40" font-size="11" text-anchor="start">Female</text></svg>