nejoin="round"/></g></g><g transform="translate(174 66) scale(0.5)"><g><path d="M-6 12V26M6 12V26" stroke="#3B4268" stroke-width="6" stroke-linecap="round"/><rect x="-10" y="-10" width="20" height="24" rx="6" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-19" r="8" fill="#E0B088" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -22Q0 -34 8 -22Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(198 66) scale(0.5)"><g><path d="M-5 14V26M5 14V26" stroke="#3B4268" stroke-width="5" stroke-linecap="round"/><path d="M-9 -10H9L13 16H-13Z" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-19" r="8" fill="#E0B088" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-9 -20Q-9 -34 0 -34Q9 -34 9 -20L11 -6" fill="none" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round"/></g></g><g transform="translate(222 66) scale(0.5)"><g><path d="M-6 12V26M6 12V26" stroke="#3B4268" stroke-width="6" stroke-linecap="round"/><rect x="-10" y="-10" width="20" height="24" rx="6" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-19" r="8" fill="#E0B088" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -22Q0 -34 8 -22Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(60 150) scale(1.3)"><g class="bob"><path d="M-16 -10Q-7 -14 0 -8Q7 -14 16 -10V14Q7 10 0 16Q-7 10 -16 14Z" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M0 -8V16" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-12 -2Q-7 -4 -3 0M-12 5Q-7 3 -3 7" fill="none" stroke="#0B93D4" stroke-width="2"/></g></g><g transform="translate(330 150) scale(1.2)"><g class="pul"><path d="M0 14C-22 -2 -14 -18 -4 -14Q0 -12 0 -8Q0 -12 4 -14C14 -18 22 -2 0 14Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(330 70) scale(1.3)"><g class="bob"><circle r="13" fill="#FFC93C" stroke="#FF8A1F" stroke-width="2.5"/><text y="4.9" font-size="15.6" text-anchor="middle" style="fill:#2B2F4A">₹</text></g></g><line x1="88" y1="140" x2="114" y2="120" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" class="fl" marker-end="url(#ah)"/><line x1="300" y1="140" x2="256" y2="120" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" class="fl" marker-end="url(#ah)"/><line x1="300" y1="76" x2="256" y2="90" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" class="fl" marker-end="url(#ah)"/><text x="200" y="220" font-size="12" text-anchor="middle">A report that compares countries</text></svg>