 width="30" height="18" fill="#E6E9F2" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="6" y="-22" width="14" height="28" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-22" y="-8" width="6" height="6" fill="#7FD0F6"/><rect x="-12" y="-8" width="6" height="6" fill="#7FD0F6"/><path d="M-44 6H44" stroke="#E5484D" stroke-width="5"/></g></g></g><g transform="translate(190 100) scale(0.8)"><g><rect x="-10" y="-14" width="20" height="28" rx="5" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-10 -5H10M-10 5H10" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><line x1="100" y1="190" x2="290" y2="190" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round" class="fl" marker-end="url(#aho)"/><rect x="310" y="120" width="80" height="32" rx="0" fill="#E8D5B5"  /><g transform="translate(336 112) scale(0.8)"><g><rect x="-20" y="-13" width="40" height="26" fill="#FFE0B2" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-24 -13L0 -29L24 -13Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-5" y="0" width="10" height="13" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(370 114) scale(0.5)"><g><rect x="-30" y="-10" width="60" height="34" fill="#C9CFE0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="14" y="-34" width="10" height="26" fill="#9AA3B5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-24" y="0" width="9" height="9" fill="#FFE082" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-10" y="0" width="9" height="9" fill="#FFE082" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="4" y="0" width="9" height="9" fill="#FFE082" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g class="rise"><circle cx="19" cy="-40" r="6" fill="#fff" opacity=".9"/></g><g class="rise" style="animation-delay:1.2s"><circle cx="22" cy="-42" r="5" fill="#fff" opacity=".9"/></g></g></g><text x="60" y="224" font-size="11" text-anchor="middle">Oil fields abroad</text><text x="340" y="224" font-size="11" text-anchor="middle">Country with little oil</text></svg>