<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Total income divided by total population gives average income, also called per capita income</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift,.gr{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-26px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:.9}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.3}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
.gr{transform-origin:50% 100%;animation:gr 3s ease-in-out infinite}
@keyframes gr{50%{transform:scaleY(.93)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="12" y="36" width="116" height="96" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(40 66) scale(0.9)"><g class="bob"><circle r="11" fill="#FFC93C" stroke="#FF8A1F" stroke-width="2.5"/><text y="4.2" font-size="13.2" text-anchor="middle" style="fill:#2B2F4A">₹</text></g></g><g transform="translate(70 66) scale(0.9)"><g><circle r="11" fill="#FFC93C" stroke="#FF8A1F" stroke-width="2.5"/><text y="4.2" font-size="13.2" text-anchor="middle" style="fill:#2B2F4A">₹</text></g></g><g transform="translate(100 66) scale(0.9)"><g><circle r="11" fill="#FFC93C" stroke="#FF8A1F" stroke-width="2.5"/><text y="4.2" font-size="13.2" text-anchor="middle" style="fill:#2B2F4A">₹</text></g></g><g transform="translate(40 94) scale(0.9)"><g><circle r="11" fill="#FFC93C" stroke="#FF8A1F" stroke-width="2.5"/><text y="4.2" font-size="13.2" text-anchor="middle" style="fill:#2B2F4A">₹</text></g></g><g transform="translate(70 94) scale(0.9)"><g><circle r="11" fill="#FFC93C" stroke="#FF8A1F" stroke-width="2.5"/><text y="4.2" font-size="13.2" text-anchor="middle" style="fill:#2B2F4A">₹</text></g></g><g transform="translate(100 94) scale(0.9)"><g><circle r="11" fill="#FFC93C" stroke="#FF8A1F" stroke-width="2.5"/><text y="4.2" font-size="13.2" text-anchor="middle" style="fill:#2B2F4A">₹</text></g></g><text x="70" y="152" font-size="12" text-anchor="middle">Total income</text><text x="70" y="168" font-size="12" text-anchor="middle">of the country</text><text x="150" y="90" font-size="36" text-anchor="middle">÷</text><rect x="172" y="36" width="116" height="96" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(196 62) scale(0.42)"><g><path d="M-6 12V26M6 12V26" stroke="#3B4268" stroke-width="6" stroke-linecap="round"/><rect x="-10" y="-10" width="20" height="24" rx="6" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-19" r="8" fill="#E0B088" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -22Q0 -34 8 -22Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(222 62) scale(0.42)"><g><path d="M-6 12V26M6 12V26" stroke="#3B4268" stroke-width="6" stroke-linecap="round"/><rect x="-10" y="-10" width="20" height="24" rx="6" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-19" r="8" fill="#E0B088" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -22Q0 -34 8 -22Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(248 62) scale(0.42)"><g><path d="M-6 12V26M6 12V26" stroke="#3B4268" stroke-width="6" stroke-linecap="round"/><rect x="-10" y="-10" width="20" height="24" rx="6" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-19" r="8" fill="#E0B088" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -22Q0 -34 8 -22Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(196 92) scale(0.42)"><g><path d="M-6 12V26M6 12V26" stroke="#3B4268" stroke-width="6" stroke-linecap="round"/><rect x="-10" y="-10" width="20" height="24" rx="6" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-19" r="8" fill="#E0B088" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -22Q0 -34 8 -22Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(222 92) scale(0.42)"><g><path d="M-6 12V26M6 12V26" stroke="#3B4268" stroke-width="6" stroke-linecap="round"/><rect x="-10" y="-10" width="20" height="24" rx="6" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-19" r="8" fill="#E0B088" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -22Q0 -34 8 -22Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(248 92) scale(0.42)"><g><path d="M-6 12V26M6 12V26" stroke="#3B4268" stroke-width="6" stroke-linecap="round"/><rect x="-10" y="-10" width="20" height="24" rx="6" fill="#2E8B57" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-19" r="8" fill="#E0B088" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -22Q0 -34 8 -22Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="230" y="152" font-size="12" text-anchor="middle">Total population</text><text x="306" y="90" font-size="36" text-anchor="middle">=</text><g transform="translate(354 78) scale(1.9)"><g class="pul"><circle r="14" fill="#FFC93C" stroke="#FF8A1F" stroke-width="2.5"/><text y="5.3" font-size="16.8" text-anchor="middle" style="fill:#2B2F4A">₹</text></g></g><text x="354" y="134" font-size="12" text-anchor="middle">Average income</text><text x="354" y="150" font-size="11" text-anchor="middle">(per capita income)</text><line x1="70" y1="190" x2="330" y2="190" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" class="fl" marker-end="url(#aho)"/><text x="200" y="220" font-size="12" text-anchor="middle">Used to compare countries of different sizes</text></svg>