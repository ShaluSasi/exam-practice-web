<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Grouped bars for rural males and females in Uttar Pradesh: literacy, child literacy and school attendance</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift,.gr{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-26px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:.9}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.3}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
.gr{transform-origin:50% 100%;animation:gr 3s ease-in-out infinite}
@keyframes gr{50%{transform:scaleY(.93)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="20" font-size="12" text-anchor="middle">Rural population of Uttar Pradesh (%)</text><rect x="40" y="83.60" width="36" height="106.40" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="58.0" y="78.6" font-size="12" text-anchor="middle">76</text><text x="58.0" y="205" font-size="11" text-anchor="middle"></text><rect x="82" y="114.40" width="36" height="75.60" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="100.0" y="109.39999999999999" font-size="12" text-anchor="middle">54</text><text x="100.0" y="205" font-size="11" text-anchor="middle"></text><text x="79" y="206" font-size="11" text-anchor="middle">Literacy,</text><text x="79" y="220" font-size="11" text-anchor="middle">all ages</text><rect x="152" y="64.00" width="36" height="126.00" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="170.0" y="59.0" font-size="12" text-anchor="middle">90</text><text x="170.0" y="205" font-size="11" text-anchor="middle"></text><rect x="194" y="68.20" width="36" height="121.80" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="212.0" y="63.2" font-size="12" text-anchor="middle">87</text><text x="212.0" y="205" font-size="11" text-anchor="middle"></text><text x="191" y="206" font-size="11" text-anchor="middle">Literacy,</text><text x="191" y="220" font-size="11" text-anchor="middle">age 10-14</text><rect x="264" y="71.00" width="36" height="119.00" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="282.0" y="66.0" font-size="12" text-anchor="middle">85</text><text x="282.0" y="205" font-size="11" text-anchor="middle"></text><rect x="306" y="75.20" width="36" height="114.80" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="324.0" y="70.2" font-size="12" text-anchor="middle">82</text><text x="324.0" y="205" font-size="11" text-anchor="middle"></text><text x="303" y="206" font-size="11" text-anchor="middle">Attending</text><text x="303" y="220" font-size="11" text-anchor="middle">school, 10-14</text><path d="M32 190H376" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="262" y="30" width="12" height="12" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="280" y="40" font-size="11" text-anchor="start">Male</text><rect x="318" y="30" width="12" height="12" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="336" y="40" font-size="11" text-anchor="start">Female</text></svg>