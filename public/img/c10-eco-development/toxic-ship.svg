-10 -5H10M-10 5H10" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(85 104) scale(0.9)"><g><rect x="-10" y="-14" width="20" height="28" rx="5" fill="#7A8B3A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-10 -5H10M-10 5H10" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><rect x="268" y="90" width="24" height="50" fill="#C9CFE0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="274" y="98" width="5" height="6" fill="#FFE082"/><rect x="283" y="98" width="5" height="6" fill="#FFE082"/><rect x="274" y="112" width="5" height="6" fill="#FFE082"/><rect x="283" y="112" width="5" height="6" fill="#FFE082"/><rect x="300" y="64" width="24" height="76" fill="#C9CFE0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="306" y="72" width="5" height="6" fill="#FFE082"/><rect x="315" y="72" width="5" height="6" fill="#FFE082"/><rect x="306" y="86" width="5" height="6" fill="#FFE082"/><rect x="315" y="86" width="5" height="6" fill="#FFE082"/><rect x="306" y="100" width="5" height="6" fill="#FFE082"/><rect x="315" y="100" width="5" height="6" fill="#FFE082"/><rect x="306" y="114" width="5" height="6" fill="#FFE082"/><rect x="315" y="114" width="5" height="6" fill="#FFE082"/><rect x="332" y="80" width="24" height="60" fill="#C9CFE0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="338" y="88" width="5" height="6" fill="#FFE082"/><rect x="347" y="88" width="5" height="6" fill="#FFE082"/><rect x="338" y="102" width="5" height="6" fill="#FFE082"/><rect x="347" y="102" width="5" height="6" fill="#FFE082"/><rect x="338" y="116" width="5" height="6" fill="#FFE082"/><rect x="347" y="116" width="5" height="6" fill="#FFE082"/><rect x="364" y="50" width="24" height="90" fill="#C9CFE0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="370" y="58" width="5" height="6" fill="#FFE082"/><rect x="379" y="58" width="5" height="6" fill="#FFE082"/><rect x="370" y="72" width="5" height="6" fill="#FFE082"/><rect x="379" y="72" width="5" height="6" fill="#FFE082"/><rect x="370" y="86" width="5" height="6" fill="#FFE082"/><rect x="379" y="86" width="5" height="6" fill="#FFE082"/><rect x="370" y="100" width="5" height="6" fill="#FFE082"/><rect x="379" y="100" width="5" height="6" fill="#FFE082"/><rect x="370" y="114" width="5" height="6" fill="#FFE082"/><rect x="379" y="114" width="5" height="6" fill="#FFE082"/><circle cx="250" cy="96" r="12" fill="#A5D67A" opacity=".75" class="rise" style="animation-delay:0s"/><circle cx="275" cy="96" r="12" fill="#A5D67A" opacity=".75" class="rise" style="animation-delay:0.8s"/><circle cx="300" cy="96" r="12" fill="#A5D67A" opacity=".75" class="rise" style="animation-delay:1.6s"/><text x="120" y="218" font-size="13" text-anchor="middle">500 tonnes of toxic waste</text><text x="120" y="234" font-size="11" text-anchor="middle">dumped near a city</text></svg>