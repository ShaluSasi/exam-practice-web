<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Regular work, better wages and decent crop prices all pointing to more income</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift,.gr{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-26px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:.9}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.3}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
.gr{transform-origin:50% 100%;animation:gr 3s ease-in-out infinite}
@keyframes gr{50%{transform:scaleY(.93)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><g transform="translate(60 52) scale(1.5)"><g class="spin"><circle r="10" fill="#C9CFE0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle r="4" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><rect x="-3" y="-17" width="6" height="7" fill="#C9CFE0" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(0)"/><rect x="-3" y="-17" width="6" height="7" fill="#C9CFE0" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(45)"/><rect x="-3" y="-17" width="6" height="7" fill="#C9CFE0" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(90)"/><rect x="-3" y="-17" width="6" height="7" fill="#C9CFE0" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(135)"/><rect x="-3" y="-17" width="6" height="7" fill="#C9CFE0" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(180)"/><rect x="-3" y="-17" width="6" height="7" fill="#C9CFE0" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(225)"/><rect x="-3" y="-17" width="6" height="7" fill="#C9CFE0" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(270)"/><rect x="-3" y="-17" width="6" height="7" fill="#C9CFE0" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(315)"/></g></g><g transform="translate(188 64) scale(1.1)"><g><circle r="11" fill="#FFC93C" stroke="#FF8A1F" stroke-width="2.5"/><text y="4.2" font-size="13.2" text-anchor="middle" style="fill:#2B2F4A">₹</text></g></g><g transform="translate(212 64) scale(1.1)"><g><circle r="11" fill="#FFC93C" stroke="#FF8A1F" stroke-width="2.5"/><text y="4.2" font-size="13.2" text-anchor="middle" style="fill:#2B2F4A">₹</text></g></g><g transform="translate(200 48) scale(1.1)"><g><circle r="11" fill="#FFC93C" stroke="#FF8A1F" stroke-width="2.5"/><text y="4.2" font-size="13.2" text-anchor="middle" style="fill:#2B2F4A">₹</text></g></g><g transform="translate(330 52) scale(1.1)"><g><path d="M0 22V-14M-9 22Q-9 4 -11 -8M9 22Q9 4 11 -8" fill="none" stroke="#C9A227" stroke-width="3" stroke-linecap="round"/><ellipse cx="0" cy="-18" rx="3.5" ry="7" fill="#F2C94C" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="-11" cy="-12" rx="3.5" ry="7" fill="#F2C94C" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="11" cy="-12" rx="3.5" ry="7" fill="#F2C94C" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="0" cy="-6" rx="3.5" ry="7" fill="#F2C94C" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(358 40) scale(0.9)"><g class="bob"><circle r="10" fill="#FFC93C" stroke="#FF8A1F" stroke-width="2.5"/><text y="3.8" font-size="12.0" text-anchor="middle" style="fill:#2B2F4A">₹</text></g></g><text x="60" y="100" font-size="11" text-anchor="middle">Regular work</text><text x="200" y="100" font-size="11" text-anchor="middle">Better wages</text><text x="340" y="100" font-size="11" text-anchor="middle">Decent price for crops</text><line x1="60" y1="112" x2="165.0" y2="148" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" class="fl" marker-end="url(#aho)"/><line x1="200" y1="112" x2="200.0" y2="148" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" class="fl" marker-end="url(#aho)"/><line x1="340" y1="112" x2="235.0" y2="148" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" class="fl" marker-end="url(#aho)"/><g transform="translate(200 188) scale(2.2)"><g class="pul"><circle r="14" fill="#FFC93C" stroke="#FF8A1F" stroke-width="2.5"/><text y="5.3" font-size="16.8" text-anchor="middle" style="fill:#2B2F4A">₹</text></g></g><text x="200" y="232" font-size="13" text-anchor="middle">More income</text></svg>