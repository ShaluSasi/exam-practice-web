><g><rect x="-32" y="-12" width="64" height="38" fill="#E9D8B4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-36 -12H36L30 -26H-30Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-22" y="0" width="22" height="26" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="6" y="-2" width="20" height="14" fill="#FFF3E0" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="10" y="12" width="12" height="14" rx="3" fill="#C9A227" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-24 -19H24" stroke="#fff" stroke-width="2.5"/></g></g><g transform="translate(292 172) scale(1.1)"><g><rect x="-12" y="4" width="24" height="22" fill="#C9CFE0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-4 4V-20H14Q18 -20 18 -14V-8" fill="none" stroke="#2B2F4A" stroke-width="6" stroke-linecap="round"/><g class="fall"><path d="M18 -4Q14 4 18 8Q22 4 18 -4Z" fill="#7FD0F6" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><g transform="translate(360 176) scale(1)"><g><rect x="-22" y="-14" width="44" height="28" fill="#FFE0B2" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-26 -14L0 -30L26 -14Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-5" y="1" width="10" height="13" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(40 196) scale(0.55)"><g class="sw"><path d="M-6 12V26M6 12V26" stroke="#3B4268" stroke-width="6" stroke-linecap="round"/><rect x="-10" y="-10" width="20" height="24" rx="6" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-19" r="8" fill="#F4C9A0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -22Q0 -34 8 -22Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(238 202) scale(0.5)"><g><path d="M-6 12V26M6 12V26" stroke="#3B4268" stroke-width="6" stroke-linecap="round"/><rect x="-10" y="-10" width="20" height="24" rx="6" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-19" r="8" fill="#E0B088" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -22Q0 -34 8 -22Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(255 202) scale(0.5)"><g><path d="M-6 12V26M6 12V26" stroke="#3B4268" stroke-width="6" stroke-linecap="round"/><rect x="-10" y="-10" width="20" height="24" rx="6" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-19" r="8" fill="#F4C9A0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -22Q0 -34 8 -22Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg>