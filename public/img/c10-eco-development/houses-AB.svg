fill="#FFC93C" stroke="#FF8A1F" stroke-width="2.5"/><text y="3.8" font-size="12.0" text-anchor="middle" style="fill:#2B2F4A">₹</text></g></g><text x="300" y="200" font-size="13" text-anchor="middle">Country B</text><text x="300" y="218" font-size="11" text-anchor="middle">Rich and poor</text></svg>