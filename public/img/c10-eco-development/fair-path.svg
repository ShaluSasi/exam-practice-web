) scale(0.36)"><g><path d="M-6 12V26M6 12V26" stroke="#3B4268" stroke-width="6" stroke-linecap="round"/><rect x="-10" y="-10" width="20" height="24" rx="6" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-19" r="8" fill="#E0B088" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -22Q0 -34 8 -22Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(94 128) scale(0.36)"><g><path d="M-6 12V26M6 12V26" stroke="#3B4268" stroke-width="6" stroke-linecap="round"/><rect x="-10" y="-10" width="20" height="24" rx="6" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-19" r="8" fill="#E0B088" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -22Q0 -34 8 -22Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(108 132) scale(0.36)"><g><path d="M-6 12V26M6 12V26" stroke="#3B4268" stroke-width="6" stroke-linecap="round"/><rect x="-10" y="-10" width="20" height="24" rx="6" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-19" r="8" fill="#E0B088" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -22Q0 -34 8 -22Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g></g></g><text x="200" y="224" font-size="12" text-anchor="middle">Would the idea benefit many people or only a small group?</text></svg>