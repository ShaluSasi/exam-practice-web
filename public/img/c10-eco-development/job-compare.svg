<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Two job cards: lower pay with regular employment, and high pay without security or family time</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift,.gr{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-26px);opacity:0}}
.fall{animation:fall 1.6s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:.9}100%{transform:translateY(24px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 4s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.3}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
.gr{transform-origin:50% 100%;animation:gr 3s ease-in-out infinite}
@keyframes gr{50%{transform:scaleY(.93)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#E3F2FD"/><rect x="14" y="20" width="178" height="190" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="208" y="20" width="178" height="190" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="103" y="44" font-size="14" text-anchor="middle">Job A</text><text x="297" y="44" font-size="14" text-anchor="middle">Job B</text><g transform="translate(70 92) scale(1)"><g><circle r="12" fill="#FFC93C" stroke="#FF8A1F" stroke-width="2.5"/><text y="4.6" font-size="14.4" text-anchor="middle" style="fill:#2B2F4A">₹</text></g></g><g transform="translate(100 92) scale(1)"><g><circle r="12" fill="#FFC93C" stroke="#FF8A1F" stroke-width="2.5"/><text y="4.6" font-size="14.4" text-anchor="middle" style="fill:#2B2F4A">₹</text></g></g><g transform="translate(103 140) scale(1.1)"><g class="pul"><path d="M0 -22L18 -14V2Q18 16 0 24Q-18 16 -18 2V-14Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 2L-2 8L9 -6" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/></g></g><text x="103" y="182" font-size="12" text-anchor="middle">Less pay,</text><text x="103" y="198" font-size="12" text-anchor="middle">regular employment</text><g transform="translate(240 92) scale(1)"><g><circle r="12" fill="#FFC93C" stroke="#FF8A1F" stroke-width="2.5"/><text y="4.6" font-size="14.4" text-anchor="middle" style="fill:#2B2F4A">₹</text></g></g><g transform="translate(258 88) scale(1)"><g><circle r="12" fill="#FFC93C" stroke="#FF8A1F" stroke-width="2.5"/><text y="4.6" font-size="14.4" text-anchor="middle" style="fill:#2B2F4A">₹</text></g></g><g transform="translate(276 92) scale(1)"><g><circle r="12" fill="#FFC93C" stroke="#FF8A1F" stroke-width="2.5"/><text y="4.6" font-size="14.4" text-anchor="middle" style="fill:#2B2F4A">₹</text></g></g><g transform="translate(294 88) scale(1)"><g><circle r="12" fill="#FFC93C" stroke="#FF8A1F" stroke-width="2.5"/><text y="4.6" font-size="14.4" text-anchor="middle" style="fill:#2B2F4A">₹</text></g></g><g transform="translate(330 92) scale(1)"><g><circle r="12" fill="#FFC93C" stroke="#FF8A1F" stroke-width="2.5"/><text y="4.6" font-size="14.4" text-anchor="middle" style="fill:#2B2F4A">₹</text></g></g><g transform="translate(270 140) scale(1.1)"><g class="blk"><path d="M0 -22L18 -14V2Q18 16 0 24Q-18 16 -18 2V-14Z" fill="#F5B7B8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-8 -4L8 12M8 -4L-8 12" stroke="#E5484D" stroke-width="4" stroke-linecap="round"/></g></g><circle cx="326" cy="140" r="18" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M326 140V128M326 140L336 146" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="297" y="182" font-size="11" text-anchor="middle">High pay, no job security,</text><text x="297" y="198" font-size="12" text-anchor="middle">no time for family</text></svg>