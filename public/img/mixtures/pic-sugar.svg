<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img">
<title>A glass of liquid being stirred with a spoon</title>
<style>
.cube{animation:cb 4s ease-in infinite}
@keyframes cb{0%{transform:translateY(-40px);opacity:1}45%{transform:translateY(40px);opacity:1}75%,100%{transform:translateY(60px);opacity:0}}
.sp{transform-origin:100px 40px;animation:sp 2s ease-in-out infinite alternate}
@keyframes sp{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M53 70L62 176Q63 182 69 182H131Q137 182 138 176L147 70Z" fill="#DFF1FB"/>
<g class="cube"><rect x="88" y="70" width="14" height="14" rx="2" fill="#FFFFFF" stroke="#A3A8CC" stroke-width="2"/></g>
<g class="sp"><path d="M100 22V150" stroke="#A3A8CC" stroke-width="5" stroke-linecap="round"/><ellipse cx="100" cy="156" rx="7" ry="10" fill="#A3A8CC"/></g>
<path d="M50 40L62 176Q63 182 69 182H131Q137 182 138 176L150 40" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M60 56L68 160" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity=".8"/>
</svg>
