<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" role="img">
<title>A smoking chimney, a foggy street and a rocket launch</title>
<style>
.sm circle{animation:sm 4s ease-out infinite}
.sm circle:nth-child(2){animation-delay:-1.3s}.sm circle:nth-child(3){animation-delay:-2.6s}
@keyframes sm{0%{transform:translate(0,0) scale(.6);opacity:.9}100%{transform:translate(26px,-90px) scale(1.6);opacity:0}}
.sm circle{transform-box:fill-box;transform-origin:center}
.fg{animation:fg 5s ease-in-out infinite alternate}
@keyframes fg{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.rk{animation:rk 1.5s ease-in-out infinite alternate}
@keyframes rk{from{transform:translateY(4px)}to{transform:translateY(-4px)}}
.fl{transform-box:fill-box;transform-origin:50% 0;animation:fl .3s ease-in-out infinite alternate}
@keyframes fl{from{transform:scaleY(.8)}to{transform:scaleY(1.15)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="15" y="15" width="124" height="190" rx="10" fill="#E3F2FD"/>
<rect x="148" y="15" width="124" height="190" rx="10" fill="#DDE2EA"/>
<rect x="281" y="15" width="124" height="190" rx="10" fill="#1F2A4A"/>
<rect x="15" y="170" width="124" height="35" fill="#D9C49A"/>
<rect x="40" y="120" width="60" height="52" fill="#C0634A" stroke="#7E3A28" stroke-width="2"/>
<rect x="76" y="80" width="16" height="42" fill="#A3A8CC" stroke="#6E7396" stroke-width="2"/>
<g class="sm" fill="#8C8FA8"><circle cx="84" cy="74" r="10"/><circle cx="84" cy="74" r="12"/><circle cx="84" cy="74" r="9"/></g>
<rect x="148" y="172" width="124" height="33" fill="#9BA1B0"/>
<path d="M190 172V92Q190 84 198 84H214" fill="none" stroke="#2B2F4A" stroke-width="4"/>
<circle cx="216" cy="90" r="7" fill="#F6C453"/>
<path d="M216 96L196 172H240Z" fill="#FFF3C4" opacity=".55"/>
<g class="fg" fill="#FFFFFF" opacity=".75"><ellipse cx="190" cy="120" rx="50" ry="10"/><ellipse cx="236" cy="146" rx="44" ry="9"/><ellipse cx="186" cy="160" rx="40" ry="8"/><ellipse cx="230" cy="100" rx="36" ry="7"/></g>
<g fill="#FFFFFF"><circle cx="300" cy="40" r="1.5"/><circle cx="388" cy="56" r="1.5"/><circle cx="330" cy="70" r="1.2"/><circle cx="380" cy="30" r="1.2"/></g>
<g class="rk">
<path d="M343 40Q358 58 358 92V138H328V92Q328 58 343 40Z" fill="#FFFFFF" stroke="#A3A8CC" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="343" cy="80" r="7" fill="#7CC4EA" stroke="#0B93D4" stroke-width="2"/>
<path d="M328 112L316 140H328ZM358 112L370 140H358Z" fill="#E5484D"/>
<path class="fl" d="M330 140H356L343 180Z" fill="#FF8A1F"/>
</g>
</svg>
