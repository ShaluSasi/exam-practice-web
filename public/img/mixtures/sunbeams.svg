<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>Beams of sunlight slanting through gaps in a dense tree canopy</title>
<style>
.bm{animation:bm 3.5s ease-in-out infinite}
.bm:nth-of-type(2){animation-delay:1.2s}
@keyframes bm{0%,100%{opacity:.35}50%{opacity:.7}}
.du circle{animation:du 4s ease-in-out infinite alternate}
.du circle:nth-child(2n){animation-delay:-2s}
@keyframes du{from{transform:translate(-3px,-4px)}to{transform:translate(3px,5px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M16 16H384V244H16Z" fill="#3E5C44"/>
<rect x="16" y="210" width="368" height="34" fill="#7A6A3A"/>
<g fill="#5A3D24"><rect x="60" y="80" width="18" height="140"/><rect x="190" y="70" width="22" height="150"/><rect x="320" y="84" width="18" height="136"/></g>
<path class="bm" d="M110 40L136 40L232 230L180 230Z" fill="#FFE9A3"/>
<path class="bm" d="M250 40L270 40L350 230L306 230Z" fill="#FFE9A3"/>
<path d="M16 16H384V70Q350 90 320 64Q290 84 268 56Q252 46 246 60Q220 88 190 60Q160 84 140 54Q124 44 108 60Q80 90 50 64Q30 80 16 70Z" fill="#1F4D2B"/>
<g fill="#2E6B3C"><circle cx="40" cy="40" r="26"/><circle cx="84" cy="50" r="24"/><circle cx="170" cy="44" r="28"/><circle cx="220" cy="38" r="24"/><circle cx="300" cy="44" r="26"/><circle cx="350" cy="36" r="26"/></g>
<g class="du" fill="#FFFFFF"><circle cx="150" cy="100" r="1.8"/><circle cx="170" cy="140" r="1.5"/><circle cx="190" cy="180" r="1.8"/><circle cx="160" cy="160" r="1.4"/><circle cx="200" cy="200" r="1.6"/><circle cx="280" cy="100" r="1.6"/><circle cx="300" cy="150" r="1.8"/><circle cx="320" cy="190" r="1.5"/><circle cx="290" cy="130" r="1.4"/></g>
<g fill="#FFE9A3" opacity=".6"><ellipse cx="206" cy="230" rx="30" ry="5"/><ellipse cx="328" cy="230" rx="24" ry="5"/></g>
</svg>
