<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" role="img">
<title>Top view of a spinning centrifuge rotor holding four tubes</title>
<style>
.rot{transform-box:fill-box;transform-origin:center;animation:rot 1.6s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.led{animation:led 1s steps(2) infinite}
@keyframes led{50%{fill:#3FA34D}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="30" y="20" width="260" height="226" rx="26" fill="#E3E6F3" stroke="#6E7396" stroke-width="2.5"/>
<circle cx="160" cy="120" r="92" fill="#A3A8CC" stroke="#6E7396" stroke-width="2.5"/>
<circle cx="160" cy="120" r="84" fill="#5E6488"/>
<g class="rot">
<circle cx="160" cy="120" r="76" fill="none" stroke="#5E6488" stroke-width="1"/>
<circle cx="160" cy="120" r="30" fill="#CDD1E6" stroke="#2B2F4A" stroke-width="2.5"/>
<g stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round">
<g><rect x="186" y="113" width="56" height="14" rx="7" fill="#F6D77A"/><rect x="224" y="114.5" width="16" height="11" rx="5" fill="#B8323D" stroke="none"/></g>
<g transform="rotate(90 160 120)"><rect x="186" y="113" width="56" height="14" rx="7" fill="#F6D77A"/><rect x="224" y="114.5" width="16" height="11" rx="5" fill="#B8323D" stroke="none"/></g>
<g transform="rotate(180 160 120)"><rect x="186" y="113" width="56" height="14" rx="7" fill="#F6D77A"/><rect x="224" y="114.5" width="16" height="11" rx="5" fill="#B8323D" stroke="none"/></g>
<g transform="rotate(270 160 120)"><rect x="186" y="113" width="56" height="14" rx="7" fill="#F6D77A"/><rect x="224" y="114.5" width="16" height="11" rx="5" fill="#B8323D" stroke="none"/></g>
</g>
<circle cx="160" cy="120" r="8" fill="#2B2F4A"/>
<path d="M140 98A30 30 0 0 1 182 100" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".7"/>
</g>
<rect x="90" y="220" width="140" height="18" rx="6" fill="#2B2F4A"/>
<circle class="led" cx="104" cy="229" r="4" fill="#F6C453"/>
<rect x="118" y="224" width="60" height="10" rx="3" fill="#7CC4EA"/>
<circle cx="200" cy="229" r="5" fill="#E5484D"/><circle cx="216" cy="229" r="5" fill="#A3A8CC"/>
</svg>
