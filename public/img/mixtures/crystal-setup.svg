<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img">
<title>A beaker of blue solution being heated in a water bath and stirred</title>
<style>
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .8s ease-in-out infinite alternate}
@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.1)}}
.rod{transform-origin:180px 175px;animation:rd 2s ease-in-out infinite alternate}
@keyframes rd{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.st{animation:st 3s ease-out infinite}
@keyframes st{0%{transform:translateY(0);opacity:0}30%{opacity:.8}100%{transform:translateY(-40px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
