<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340" role="img">
<title>A fractionating column separating crude oil into fractions</title>
<defs><linearGradient id="tw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CDEBFA"/><stop offset="1" stop-color="#FFD2A6"/></linearGradient></defs>
<style>
.up circle{animation:up 3s linear infinite}
.up circle:nth-child(2){animation-delay:-1s}.up circle:nth-child(3){animation-delay:-2s}
@keyframes up{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-230px);opacity:0}}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .7s ease-in-out infinite alternate}
@keyframes fl{from{transform:scaleY(.8)}to{transform:scaleY(1.1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
