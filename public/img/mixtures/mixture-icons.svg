<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" role="img">
<title>Muddy water, milk, a drop of blood and a brass bell</title>
<style>
.mud circle{animation:md 3s ease-in-out infinite alternate}
@keyframes md{from{transform:translateY(-4px)}to{transform:translateY(6px)}}
.drop{transform-box:fill-box;transform-origin:50% 100%;animation:dr 2s ease-in-out infinite}
@keyframes dr{0%,100%{transform:scale(1)}50%{transform:scale(1.06,.95)}}
.bell{transform-origin:380px 40px;animation:bl 1.6s ease-in-out infinite alternate}
@keyframes bl{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M28 60L36 150Q37 156 43 156H87Q93 156 94 150L102 60Z" fill="#C9AE7E"/>
<g class="mud" fill="#8A6A3A"><circle cx="46" cy="90" r="2.5"/><circle cx="70" cy="110" r="3"/><circle cx="88" cy="84" r="2.5"/><circle cx="56" cy="130" r="3"/><circle cx="82" cy="138" r="2.5"/></g>
<path d="M24 40L36 150Q37 156 43 156H87Q93 156 94 150L106 40" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M138 60L146 150Q147 156 153 156H197Q203 156 204 150L212 60Z" fill="#FBF8F0"/>
<path d="M134 40L146 150Q147 156 153 156H197Q203 156 204 150L216 40" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M146 70L152 140" stroke="#E3E6F3" stroke-width="5" stroke-linecap="round"/>
<path class="drop" d="M280 40C260 76 252 96 252 114A28 28 0 0 0 308 114C308 96 300 76 280 40Z" fill="#C62F3A" stroke="#8A1B25" stroke-width="3" stroke-linejoin="round"/>
<path d="M266 104Q264 120 274 130" stroke="#F08A92" stroke-width="5" fill="none" stroke-linecap="round"/>
<g class="bell">
<path d="M380 36V48" stroke="#2B2F4A" stroke-width="3"/>
<path d="M380 48C360 48 358 70 356 96Q354 116 346 126H414Q406 116 404 96C402 70 400 48 380 48Z" fill="#F2C14E" stroke="#A67C14" stroke-width="2.5" stroke-linejoin="round"/>
<circle cx="380" cy="134" r="7" fill="#D9A21F" stroke="#A67C14" stroke-width="2.5"/>
</g>
<g font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="middle"><text x="65" y="182">Muddy water</text><text x="175" y="182">Milk</text><text x="280" y="182">Blood</text><text x="380" y="182">Brass</text></g>
</svg>
