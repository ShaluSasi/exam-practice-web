<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" role="img">
<title>Smoke, a glass of milk, a bottle of vinegar and a brass bell</title>
<style>
.puff{animation:pf 3s ease-in-out infinite alternate}
@keyframes pf{from{transform:translateY(4px)}to{transform:translateY(-6px)}}
.bell{transform-origin:380px 40px;animation:bl 1.6s ease-in-out infinite alternate}
@keyframes bl{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
