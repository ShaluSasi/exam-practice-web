<style>
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .7s ease-in-out infinite alternate}
@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.bb circle{animation:bb 1.8s ease-in infinite}
.bb circle:nth-child(2){animation-delay:.6s}.bb circle:nth-child(3){animation-delay:1.2s}
@keyframes bb{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-30px);opacity:0}}
.vap{animation:va 1.2s linear infinite}
@keyframes va{to{stroke-dashoffset:-24}}
.wat{animation:wa 1.4s linear infinite}
@keyframes wa{to{stroke-dashoffset:-36}}
.drip{animation:dp 1.5s ease-in infinite}
@keyframes dp{0%{transform:translateY(0);opacity:1}85%{opacity:1}100%{transform:translateY(58px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
