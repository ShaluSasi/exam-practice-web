<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 236" role="img">
<title>Table of solubilities of four salts at different temperatures</title>
<style>
.hg{animation:hg 4s ease-in-out infinite alternate}
@keyframes hg{from{transform:translateX(0)}to{transform:translateX(230px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="14" y="44" width="432" height="180" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/>
<path d="M24 44H436Q446 44 446 54V78H14V54Q14 44 24 44Z" fill="#CDEBFA"/>
