<text x="193" y="101">21</text><text x="239" y="101">32</text><text x="285" y="101">45</text><text x="331" y="101">62</text><text x="377" y="101">106</text><text x="423" y="101">167</text>
<text x="193" y="137">36</text><text x="239" y="137">36</text><text x="285" y="137">36.3</text><text x="331" y="137">36.5</text><text x="377" y="137">37</text><text x="423" y="137">37</text>
