<path d="M216 44V224M262 44V224M308 44V224M354 44V224M400 44V224" stroke="#D5D8EA" stroke-width="1.5"/>
<g font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#2B2F4A">
<text x="230" y="30" text-anchor="middle" font-size="14">Solubility (g per 100 g of water)</text>
<text x="26" y="66">Salt  /  Temperature</text>
<g text-anchor="middle"><text x="193" y="66">10 °C</text><text x="239" y="66">20 °C</text><text x="285" y="66">30 °C</text><text x="331" y="66">40 °C</text><text x="377" y="66">60 °C</text><text x="423" y="66">80 °C</text></g>
<text x="24" y="101">Potassium nitrate</text><text x="24" y="137">Sodium chloride</text><text x="24" y="173">Potassium chloride</text><text x="24" y="209">Ammonium chloride</text>
