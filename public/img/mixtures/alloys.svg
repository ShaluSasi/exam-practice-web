<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" role="img">
<title>A brass bell, a bronze medal and a stainless steel tumbler</title>
<style>
.bell{transform-origin:70px 34px;animation:bl 1.6s ease-in-out infinite alternate}
@keyframes bl{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}
.md{transform-origin:210px 30px;animation:md 3s ease-in-out infinite alternate}
@keyframes md{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sh{animation:sh 2.5s ease-in-out infinite}
@keyframes sh{0%,100%{opacity:.2}50%{opacity:.95}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M30 30H110" stroke="#C8925A" stroke-width="6" stroke-linecap="round"/>
<g class="bell">
<path d="M70 30V44" stroke="#2B2F4A" stroke-width="3"/>
<path d="M70 44C46 44 44 70 42 100Q40 124 30 136H110Q100 124 98 100C96 70 94 44 70 44Z" fill="#F2C14E" stroke="#A67C14" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M56 60C52 80 52 104 48 124" stroke="#FFF0B8" stroke-width="5" stroke-linecap="round" fill="none"/>
<circle cx="70" cy="146" r="9" fill="#D9A21F" stroke="#A67C14" stroke-width="2.5"/>
</g>
<g class="md">
<path d="M196 20L210 70L224 20" fill="none" stroke="#E5484D" stroke-width="8" stroke-linejoin="round"/>
<circle cx="210" cy="110" r="40" fill="#B0703A" stroke="#7A4A22" stroke-width="3"/>
<circle cx="210" cy="110" r="29" fill="none" stroke="#D49A62" stroke-width="3"/>
<path d="M210 92L215 104H228L218 112L222 125L210 117L198 125L202 112L192 104H205Z" fill="#D49A62"/>
</g>
<path d="M310 48H390L380 160Q379 168 371 168H329Q321 168 320 160Z" fill="#D5D8EA" stroke="#6E7396" stroke-width="2.5" stroke-linejoin="round"/>
<ellipse cx="350" cy="48" rx="40" ry="7" fill="#EEF0F8" stroke="#6E7396" stroke-width="2.5"/>
<path class="sh" d="M326 64L334 150" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
<g font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#2B2F4A" text-anchor="middle"><text x="70" y="196">Brass</text><text x="210" y="196">Bronze</text><text x="350" y="196">Stainless steel</text></g>
</svg>
