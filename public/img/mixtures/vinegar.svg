<path d="M180 40V226Q180 231 185 231H225Q230 231 230 226V40M174 40H236" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M164 232H246" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round"/>
<g stroke="#2B2F4A" stroke-width="1.8" stroke-linecap="round"><path d="M180 60H192M180 80H188M180 100H192M180 120H188M180 140H192M180 160H188M180 180H192M180 200H188M180 220H192"/></g>
