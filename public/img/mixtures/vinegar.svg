<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" role="img">
<title>A bottle of vinegar next to a measuring cylinder</title>
<style>
.lv{animation:lv 3s ease-in-out infinite alternate}
@keyframes lv{from{transform:translateY(6px)}to{transform:translateY(-6px)}}
.bb circle{animation:bb 2.4s ease-in infinite}
.bb circle:nth-child(2){animation-delay:1.2s}
@keyframes bb{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-60px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="72" y="26" width="26" height="18" rx="3" fill="#3FA34D" stroke="#2A7034" stroke-width="2"/>
