<rect x="56" y="130" width="58" height="62" rx="6" fill="#FFFFFF" stroke="#3FA34D" stroke-width="2"/>
<g font-family="system-ui, sans-serif" font-weight="700" fill="#2A7034" text-anchor="middle"><text x="85" y="154" font-size="12">Vinegar</text><text x="85" y="176" font-size="12">5% v/v</text></g>
<g class="bb" fill="#FFFFFF" stroke="#D9CFA8" stroke-width="1"><circle cx="66" cy="222" r="3"/><circle cx="104" cy="220" r="2.5"/></g>
<path d="M181 120H229V226Q229 230 225 230H185Q181 230 181 226Z" fill="#EEF7FC"/>
<g class="lv"><path d="M182 132H228V226H182Z" fill="#E9F5D8"/><path d="M182 132H228" stroke="#3FA34D" stroke-width="2"/></g>
