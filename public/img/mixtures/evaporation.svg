<title>A salt solution being heated in a china dish</title>
<style>
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .7s ease-in-out infinite alternate}
@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.st path{animation:st 3s ease-out infinite}
