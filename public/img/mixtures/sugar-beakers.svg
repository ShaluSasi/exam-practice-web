<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img">
<title>Three beakers of water labelled P, Q and R with heaps of sugar beside them</title>
<style>
.tw circle{animation:tw 2.4s ease-in-out infinite}
