<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" role="img">
<title>Three beakers of muddy water treated with powdered alum</title>
<style>
.pw circle{animation:pw 1.8s ease-in infinite}
.pw circle:nth-child(2){animation-delay:.5s}.pw circle:nth-child(3){animation-delay:1s}.pw circle:nth-child(4){animation-delay:1.4s}
@keyframes pw{0%{transform:translateY(0);opacity:1}100%{transform:translateY(46px);opacity:0}}
.cl{animation:cl 4s ease-in-out infinite alternate}
@keyframes cl{from{transform:translateY(-6px)}to{transform:translateY(14px)}}
.ar{animation:ar 1.5s ease-in-out infinite alternate}
@keyframes ar{from{transform:translateX(-3px)}to{transform:translateX(3px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
