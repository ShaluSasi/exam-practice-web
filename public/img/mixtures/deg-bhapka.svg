<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>A traditional set-up with a copper pot on a fire joined by a bamboo pipe to a receiver pot in water</title>
<style>
.fl path{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}
.fl path:nth-child(2){animation-delay:.3s}
