.vp{animation:vp 1.2s linear infinite}
@keyframes vp{to{stroke-dashoffset:-20}}
.rp{animation:rp 3s ease-in-out infinite alternate}
@keyframes rp{from{transform:translateX(-4px)}to{transform:translateX(4px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
