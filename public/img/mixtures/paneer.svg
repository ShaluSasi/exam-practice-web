<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img">
<title>Lemon juice being squeezed into a pan of hot milk</title>
<style>
.dr circle{animation:dr 1.5s ease-in infinite}
.dr circle:nth-child(2){animation-delay:.75s}
@keyframes dr{0%{transform:translateY(0);opacity:1}100%{transform:translateY(52px);opacity:0}}
.cu path{transform-box:fill-box;transform-origin:center;animation:cu 2.6s ease-in-out infinite alternate}
@keyframes cu{from{transform:scale(.9)}to{transform:scale(1.08)}}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .7s ease-in-out infinite alternate}
@keyframes fl{from{transform:scaleY(.8)}to{transform:scaleY(1.1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
