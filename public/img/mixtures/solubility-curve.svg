<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" role="img">
<title>Solubility curves of two compounds A and B in water</title>
<style>
.mv{animation:mv 1.5s linear infinite}
@keyframes mv{to{stroke-dashoffset:-18}}
.pt circle{transform-box:fill-box;transform-origin:center;animation:pt 3s ease-in-out infinite}
@keyframes pt{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g stroke="#E3E6F3" stroke-width="1.5"><path d="M100 30V270M140 30V270M180 30V270M220 30V270M260 30V270M300 30V270M340 30V270M380 30V270M60 240H385M60 210H385M60 180H385M60 150H385M60 120H385M60 90H385M60 60H385M60 30H385"/></g>
<path class="mv" d="M60 125.4H220V270M60 97.8H300V270" fill="none" stroke="#FF8A1F" stroke-width="2" stroke-dasharray="6 3"/>
<path d="M60 270H392M60 270V22" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/>
<polyline points="100,156 140,147.6 180,138 220,125.4 260,112.8 300,97.8 340,78 380,52.8" fill="none" stroke="#E5484D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="100,234 140,230.4 180,226.8 220,222 260,217.2 300,212.4 340,207.6 380,202.8" fill="none" stroke="#0B93D4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<g class="pt" fill="#E5484D"><circle cx="100" cy="156" r="3.5"/><circle cx="140" cy="147.6" r="3.5"/><circle cx="180" cy="138" r="3.5"/><circle cx="220" cy="125.4" r="3.5"/><circle cx="260" cy="112.8" r="3.5"/><circle cx="300" cy="97.8" r="3.5"/><circle cx="340" cy="78" r="3.5"/><circle cx="380" cy="52.8" r="3.5"/></g>
<g class="pt" fill="#0B93D4"><circle cx="100" cy="234" r="3.5"/><circle cx="140" cy="230.4" r="3.5"/><circle cx="180" cy="226.8" r="3.5"/><circle cx="220" cy="222" r="3.5"/><circle cx="260" cy="217.2" r="3.5"/><circle cx="300" cy="212.4" r="3.5"/><circle cx="340" cy="207.6" r="3.5"/><circle cx="380" cy="202.8" r="3.5"/></g>
<g font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle">
<text x="100" y="286">10</text><text x="140" y="286">20</text><text x="180" y="286">30</text><text x="220" y="286">40</text><text x="260" y="286">50</text><text x="300" y="286">60</text><text x="340" y="286">70</text><text x="380" y="286">80</text>
<text x="222" y="308">Temperature (°C)</text>
<g text-anchor="end"><text x="54" y="274">0</text><text x="54" y="214">100</text><text x="54" y="154">200</text><text x="54" y="94">300</text><text x="54" y="34">400</text></g>
<text transform="translate(18 150) rotate(-90)">Solubility (g per 100 g water)</text>
<g fill="#C25E00" text-anchor="start"><text x="66" y="120">241</text><text x="66" y="92">287</text></g>
<g font-size="15"><text x="398" y="57" fill="#E5484D">B</text><text x="398" y="207" fill="#0B93D4">A</text></g>
</g>
</svg>
