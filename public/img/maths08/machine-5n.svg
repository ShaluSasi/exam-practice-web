<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 180" role="img"><title>A function machine turning a position number into a term</title><style>.t{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}.gear{transform-box:fill-box;transform-origin:center;animation:sp 5s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="20" y="60" width="70" height="60" rx="12" fill="#FFF3CF" stroke="#F6C453" stroke-width="3" /><text class="t" x="55" y="98" font-size="28" text-anchor="middle" >n</text><line x1="92" y1="90" x2="162" y2="90" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M159 84 L168 90 L159 96" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="170" y="30" width="180" height="120" rx="18" fill="#CDEBFA" stroke="#0B93D4" stroke-width="4" /><text class="t" x="260" y="98" font-size="28" text-anchor="middle" >5n − 2</text><g class="gear"><circle cx="205" cy="55" r="9" fill="#fff" stroke="#0B93D4" stroke-width="2" /></g><line x1="352" y1="90" x2="422" y2="90" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M419 84 L428 90 L419 96" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="430" y="60" width="70" height="60" rx="12" fill="#D3EFD6" stroke="#3FA34D" stroke-width="3" /><text class="t" x="465" y="98" font-size="15" text-anchor="middle" >term</text></svg>