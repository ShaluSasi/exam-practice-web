<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 190" role="img"><title>Steps that go down by the same amount each time</title><style>.t{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="20" y="40" width="90" height="130" rx="6" fill="#CDEBFA" stroke="#0B93D4" stroke-width="3" /><text class="t" x="65" y="70" font-size="24" text-anchor="middle" >21</text><rect x="120" y="62" width="90" height="108" rx="6" fill="#CDEBFA" stroke="#0B93D4" stroke-width="3" /><text class="t" x="165" y="92" font-size="24" text-anchor="middle" >18</text><rect x="220" y="84" width="90" height="86" rx="6" fill="#CDEBFA" stroke="#0B93D4" stroke-width="3" /><text class="t" x="265" y="114" font-size="24" text-anchor="middle" >15</text><rect x="320" y="106" width="90" height="64" rx="6" fill="#CDEBFA" stroke="#0B93D4" stroke-width="3" /><text class="t" x="365" y="136" font-size="24" text-anchor="middle" >12</text><text class="t" x="450" y="150" font-size="30" text-anchor="middle" >…</text><line x1="10" y1="172" x2="480" y2="172" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /></svg>