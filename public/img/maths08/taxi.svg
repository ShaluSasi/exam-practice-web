<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" role="img"><title>A taxi on a road with a fare board</title><style>.t{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}.car{animation:dr 6s ease-in-out infinite alternate}@keyframes dr{from{transform:translateX(0)}to{transform:translateX(60px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="150" width="520" height="50" rx="0" fill="#D9C49A" stroke="#D9C49A" stroke-width="0" /><line x1="0" y1="175" x2="520" y2="175" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 12"/><line x1="40" y1="150" x2="40" y2="140" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text class="t" x="40" y="138" font-size="12" text-anchor="middle" >start</text><line x1="140" y1="150" x2="140" y2="140" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text class="t" x="140" y="138" font-size="12" text-anchor="middle" >1 km</text><line x1="240" y1="150" x2="240" y2="140" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text class="t" x="240" y="138" font-size="12" text-anchor="middle" >2 km</text><line x1="340" y1="150" x2="340" y2="140" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text class="t" x="340" y="138" font-size="12" text-anchor="middle" >3 km</text><line x1="440" y1="150" x2="440" y2="140" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text class="t" x="440" y="138" font-size="12" text-anchor="middle" >4 km</text><g class="car"><rect x="30" y="92" width="130" height="40" rx="12" fill="#F6C453" stroke="#2B2F4A" stroke-width="3"/><path d="M55 92 L72 66 L125 66 L142 92 Z" fill="#F6C453" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><path d="M66 90 L79 71 L96 71 L96 90 Z M102 90 L102 71 L121 71 L134 90 Z" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2"/><rect x="78" y="56" width="40" height="10" rx="4" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><circle cx="58" cy="134" r="14" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" /><circle cx="132" cy="134" r="14" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" /><circle cx="58" cy="134" r="5" fill="#A3A8CC" stroke="#A3A8CC" stroke-width="2" /><circle cx="132" cy="134" r="5" fill="#A3A8CC" stroke="#A3A8CC" stroke-width="2" /></g><rect x="250" y="20" width="250" height="70" rx="14" fill="#fff" stroke="#FF8A1F" stroke-width="3" /><text class="t" x="375" y="48" font-size="17" text-anchor="middle" >Booking fee ₹200</text><text class="t" x="375" y="76" font-size="17" text-anchor="middle" >plus ₹40 for every km</text></svg>