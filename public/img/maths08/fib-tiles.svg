<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 205" role="img"><title>Short and long tiles arranged to fill one, two and three beats</title><style>.t{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}.fb{animation:fd 4s ease-in-out infinite}@keyframes fd{0%,100%{opacity:1}50%{opacity:.6}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><g class="fb" style="animation-delay:0.0s"><rect x="20" y="30" width="22" height="22" rx="6" fill="#CDEBFA" stroke="#0B93D4" stroke-width="2" /></g><text class="t" x="60" y="160" font-size="14" text-anchor="middle" >1 beat</text><g class="fb" style="animation-delay:0.0s"><rect x="110" y="30" width="22" height="22" rx="6" fill="#CDEBFA" stroke="#0B93D4" stroke-width="2" /><rect x="136" y="30" width="22" height="22" rx="6" fill="#CDEBFA" stroke="#0B93D4" stroke-width="2" /></g><g class="fb" style="animation-delay:0.3s"><rect x="110" y="66" width="48" height="22" rx="6" fill="#FFE0BF" stroke="#FF8A1F" stroke-width="2" /></g><text class="t" x="150" y="160" font-size="14" text-anchor="middle" >2 beats</text><g class="fb" style="animation-delay:0.0s"><rect x="260" y="30" width="22" height="22" rx="6" fill="#CDEBFA" stroke="#0B93D4" stroke-width="2" /><rect x="286" y="30" width="22" height="22" rx="6" fill="#CDEBFA" stroke="#0B93D4" stroke-width="2" /><rect x="312" y="30" width="22" height="22" rx="6" fill="#CDEBFA" stroke="#0B93D4" stroke-width="2" /></g><g class="fb" style="animation-delay:0.3s"><rect x="260" y="66" width="22" height="22" rx="6" fill="#CDEBFA" stroke="#0B93D4" stroke-width="2" /><rect x="286" y="66" width="48" height="22" rx="6" fill="#FFE0BF" stroke="#FF8A1F" stroke-width="2" /></g><g class="fb" style="animation-delay:0.6s"><rect x="260" y="102" width="48" height="22" rx="6" fill="#FFE0BF" stroke="#FF8A1F" stroke-width="2" /><rect x="312" y="102" width="22" height="22" rx="6" fill="#CDEBFA" stroke="#0B93D4" stroke-width="2" /></g><text class="t" x="300" y="160" font-size="14" text-anchor="middle" >3 beats</text><text class="t" x="250" y="190" font-size="13" text-anchor="middle" >Short = 1 beat (blue), long = 2 beats (orange)</text></svg>