<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" role="img"><title>A card for the previous term feeding a rule that gives the next term</title><style>.t{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="30" y="50" width="110" height="56" rx="12" fill="#CDEBFA" stroke="#0B93D4" stroke-width="3" /><text class="t" x="85" y="86" font-size="20" text-anchor="middle" >t₍ₙ₋₁₎</text><line x1="145" y1="78" x2="239" y2="78" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" /><path d="M236 72 L245 78 L236 84" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text class="t" x="195.0" y="66" font-size="13" text-anchor="middle" fill="#FF8A1F" >rule</text><rect x="250" y="50" width="110" height="56" rx="12" fill="#D3EFD6" stroke="#3FA34D" stroke-width="3" /><text class="t" x="305" y="86" font-size="22" text-anchor="middle" >tₙ</text><path d="M85 46 C85 5 305 5 305 46" fill="none" stroke="#A3A8CC" stroke-width="3" stroke-dasharray="6 5"/><text class="t" x="195" y="24" font-size="12" text-anchor="middle" fill="#2B2F4A" >use the previous term</text><rect x="30" y="125" width="330" height="28" rx="8" fill="#fff" stroke="#E3DFD0" stroke-width="2" /><text class="t" x="195" y="145" font-size="13" text-anchor="middle" >start with the given first term, then repeat</text></svg>