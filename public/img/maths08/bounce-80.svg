<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" role="img"><title>A ball dropped from a height that bounces lower each time</title><style>.t{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}.ball{animation:bn 6s ease-in-out infinite}@keyframes bn{0%{transform:translate(0,0)}25%{transform:translate(120px,180px)}32%{transform:translate(150px,72.0px)}39%{transform:translate(180px,180px)}46%{transform:translate(210px,115.2px)}53%{transform:translate(240px,180px)}60%{transform:translate(270px,141.1px)}67%{transform:translate(300px,180px)}100%{transform:translate(300px,180px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="220" width="520" height="40" rx="0" fill="#D9C49A" stroke="#D9C49A" stroke-width="0" /><line x1="40" y1="30" x2="40" y2="220" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="32" y1="30" x2="48" y2="30" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="32" y1="220" x2="48" y2="220" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text class="t" x="130" y="128" font-size="15" text-anchor="middle" >dropped from 80 m</text><text class="t" x="385" y="50" font-size="13" text-anchor="middle" >rises to 60% of the previous height</text><text class="t" x="385" y="72" font-size="13" text-anchor="middle" >after every bounce</text><g class="ball"><circle cx="150" cy="40" r="14" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" /></g></svg>