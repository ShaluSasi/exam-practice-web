<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 150" role="img"><title>A bar split into two parts of consecutive numbers</title><style>.t{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="30" y="70" width="470" height="40" rx="6" fill="#EEE" stroke="#A3A8CC" stroke-width="2" /><rect x="30" y="70" width="227.16666666666666" height="40" rx="6" fill="#E1E3F0" stroke="#A3A8CC" stroke-width="2" /><rect x="257.16666666666663" y="70" width="242.83333333333334" height="40" rx="6" fill="#D3EFD6" stroke="#3FA34D" stroke-width="2" /><text class="t" x="143.58333333333331" y="96" font-size="16" text-anchor="middle" >1 to 29</text><text class="t" x="378.5833333333333" y="96" font-size="16" text-anchor="middle" >30 to 60</text><text class="t" x="30" y="135" font-size="14" text-anchor="middle" >1</text><text class="t" x="257.16666666666663" y="135" font-size="14" text-anchor="middle" >29|30</text><text class="t" x="500" y="135" font-size="14" text-anchor="middle" >60</text><text class="t" x="265" y="40" font-size="14" text-anchor="middle" >A long run of counting numbers split in two</text></svg>