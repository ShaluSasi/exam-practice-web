<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 205" role="img"><title>A staircase of yearly salary increments with a climbing figure</title><style>.t{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}.hop{animation:hp 6s ease-in-out infinite}@keyframes hp{0%{transform:translate(0,0)}100%{transform:translate(375px,-110px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="30" y="160" width="75" height="30" rx="4" fill="#D3EFD6" stroke="#3FA34D" stroke-width="3" /><rect x="105" y="138" width="75" height="52" rx="4" fill="#D3EFD6" stroke="#3FA34D" stroke-width="3" /><rect x="180" y="116" width="75" height="74" rx="4" fill="#D3EFD6" stroke="#3FA34D" stroke-width="3" /><rect x="255" y="94" width="75" height="96" rx="4" fill="#D3EFD6" stroke="#3FA34D" stroke-width="3" /><rect x="330" y="72" width="75" height="118" rx="4" fill="#D3EFD6" stroke="#3FA34D" stroke-width="3" /><rect x="405" y="50" width="75" height="140" rx="4" fill="#D3EFD6" stroke="#3FA34D" stroke-width="3" /><text class="t" x="67" y="175" font-size="13" text-anchor="middle" >Year 1</text><text class="t" x="142" y="153" font-size="13" text-anchor="middle" >Year 2</text><text class="t" x="120" y="34" font-size="16" text-anchor="middle" >starts at ₹5,00,000</text><text class="t" x="120" y="58" font-size="16" text-anchor="middle" fill="#FF8A1F" >+ ₹20,000 every year</text><g class="hop"><circle cx="67" cy="125" r="12" fill="#F6C453" stroke="#2B2F4A" stroke-width="3" /><rect x="57" y="137" width="20" height="20" rx="5" fill="#CDEBFA" stroke="#0B93D4" stroke-width="2" /></g></svg>