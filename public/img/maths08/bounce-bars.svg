<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 355" role="img"><title>Bar chart of heights reached by a bouncing ball with numbered axes</title><style>.t{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}.bar{transform-box:fill-box;transform-origin:bottom;animation:gb 4s ease-out infinite}@keyframes gb{0%{transform:scaleY(0)}40%,100%{transform:scaleY(1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><line x1="50" y1="300" x2="520" y2="300" stroke="#E3DFD0" stroke-width="1.5" stroke-linecap="round" /><text class="t" x="42" y="305" font-size="13" text-anchor="end" >0</text><line x1="50" y1="260" x2="520" y2="260" stroke="#E3DFD0" stroke-width="1.5" stroke-linecap="round" /><text class="t" x="42" y="265" font-size="13" text-anchor="end" >5</text><line x1="50" y1="220" x2="520" y2="220" stroke="#E3DFD0" stroke-width="1.5" stroke-linecap="round" /><text class="t" x="42" y="225" font-size="13" text-anchor="end" >10</text><line x1="50" y1="180" x2="520" y2="180" stroke="#E3DFD0" stroke-width="1.5" stroke-linecap="round" /><text class="t" x="42" y="185" font-size="13" text-anchor="end" >15</text><line x1="50" y1="140" x2="520" y2="140" stroke="#E3DFD0" stroke-width="1.5" stroke-linecap="round" /><text class="t" x="42" y="145" font-size="13" text-anchor="end" >20</text><line x1="50" y1="100" x2="520" y2="100" stroke="#E3DFD0" stroke-width="1.5" stroke-linecap="round" /><text class="t" x="42" y="105" font-size="13" text-anchor="end" >25</text><line x1="50" y1="60" x2="520" y2="60" stroke="#E3DFD0" stroke-width="1.5" stroke-linecap="round" /><text class="t" x="42" y="65" font-size="13" text-anchor="end" >30</text><line x1="50" y1="300" x2="520" y2="300" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="50" y1="300" x2="50" y2="52" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><rect class="bar" x="70" y="108.0" width="40" height="192.0" rx="5" fill="#FF8A1F" stroke="#B85E00" stroke-width="2" style="animation-delay:0.00s"/><text class="t" x="90" y="320" font-size="14" text-anchor="middle" >0</text><rect class="bar" x="127" y="156.0" width="40" height="144.0" rx="5" fill="#FF8A1F" stroke="#B85E00" stroke-width="2" style="animation-delay:0.15s"/><text class="t" x="147" y="320" font-size="14" text-anchor="middle" >1</text><rect class="bar" x="184" y="192.0" width="40" height="108.0" rx="5" fill="#FF8A1F" stroke="#B85E00" stroke-width="2" style="animation-delay:0.30s"/><text class="t" x="204" y="320" font-size="14" text-anchor="middle" >2</text><rect class="bar" x="241" y="219.0" width="40" height="81.0" rx="5" fill="#FF8A1F" stroke="#B85E00" stroke-width="2" style="animation-delay:0.45s"/><text class="t" x="261" y="320" font-size="14" text-anchor="middle" >3</text><rect class="bar" x="298" y="239.2" width="40" height="60.8" rx="5" fill="#FF8A1F" stroke="#B85E00" stroke-width="2" style="animation-delay:0.60s"/><text class="t" x="318" y="320" font-size="14" text-anchor="middle" >4</text><rect class="bar" x="355" y="254.4" width="40" height="45.6" rx="5" fill="#FF8A1F" stroke="#B85E00" stroke-width="2" style="animation-delay:0.75s"/><text class="t" x="375" y="320" font-size="14" text-anchor="middle" >5</text><rect class="bar" x="412" y="265.8" width="40" height="34.2" rx="5" fill="#FF8A1F" stroke="#B85E00" stroke-width="2" style="animation-delay:0.90s"/><text class="t" x="432" y="320" font-size="14" text-anchor="middle" >6</text><rect class="bar" x="469" y="274.4" width="40" height="25.6" rx="5" fill="#FF8A1F" stroke="#B85E00" stroke-width="2" style="animation-delay:1.05s"/><text class="t" x="489" y="320" font-size="14" text-anchor="middle" >7</text><text class="t" x="285" y="344" font-size="14" text-anchor="middle" >Bounce number (0 = the drop)</text><text class="t" x="12" y="150" font-size="14" text-anchor="middle" transform="rotate(-90 12 150)">Height (ft)</text></svg>