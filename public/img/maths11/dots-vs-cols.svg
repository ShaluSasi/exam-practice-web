<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" role="img"><title>Counting dots compared with adding columns</title><style>text{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}@keyframes dd{0%,100%{opacity:.25}50%{opacity:1}}.d{animation:dd 3s ease-in-out infinite}@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}.pl{animation:pl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2B2F4A"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="140" y="30" font-size="16" text-anchor="middle">Count the dots</text><text x="420" y="30" font-size="16" text-anchor="middle">Add column by column</text><pattern id="dp" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="4.5" fill="#FF8A1F"/></pattern><rect x="33" y="53" width="84" height="42" fill="url(#dp)"/><text x="230" y="82" font-size="22" text-anchor="middle">→</text><rect class="d" x="33" y="113" width="196" height="112" fill="url(#dp)"/><rect x="300" y="70" width="48" height="60" rx="8" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><rect x="356" y="70" width="48" height="60" rx="8" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><rect x="412" y="70" width="48" height="60" rx="8" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><rect x="468" y="70" width="48" height="60" rx="8" fill="#CFEFD2" stroke="#2B2F4A" stroke-width="2.5" class="pl"/><text x="420" y="170" font-size="13" text-anchor="middle">one more digit = one more column</text><text x="140" y="250" font-size="13" text-anchor="middle">one more digit = many more dots</text></svg>