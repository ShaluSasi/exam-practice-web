<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 150" role="img"><title>A row of number chips with an empty dashed circle under each</title><style>text{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.bob{animation:bob 3s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2B2F4A"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="290" y="24" font-size="14" text-anchor="middle">divisors of 36, in increasing order</text><g class="bob" style="animation-delay:0.0s"><rect x="29.0" y="42.0" width="46" height="40" rx="9" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><text x="52" y="67.76" font-size="16" text-anchor="middle">1</text></g><circle cx="52" cy="122" r="11" fill="none" stroke="#9AA0C4" stroke-width="2" stroke-dasharray="4 3"/><g class="bob" style="animation-delay:0.2s"><rect x="89.0" y="42.0" width="46" height="40" rx="9" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><text x="112" y="67.76" font-size="16" text-anchor="middle">2</text></g><circle cx="112" cy="122" r="11" fill="none" stroke="#9AA0C4" stroke-width="2" stroke-dasharray="4 3"/><g class="bob" style="animation-delay:0.4s"><rect x="149.0" y="42.0" width="46" height="40" rx="9" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><text x="172" y="67.76" font-size="16" text-anchor="middle">3</text></g><circle cx="172" cy="122" r="11" fill="none" stroke="#9AA0C4" stroke-width="2" stroke-dasharray="4 3"/><g class="bob" style="animation-delay:0.6s"><rect x="209.0" y="42.0" width="46" height="40" rx="9" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><text x="232" y="67.76" font-size="16" text-anchor="middle">4</text></g><circle cx="232" cy="122" r="11" fill="none" stroke="#9AA0C4" stroke-width="2" stroke-dasharray="4 3"/><g class="bob" style="animation-delay:0.8s"><rect x="269.0" y="42.0" width="46" height="40" rx="9" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><text x="292" y="67.76" font-size="16" text-anchor="middle">6</text></g><circle cx="292" cy="122" r="11" fill="none" stroke="#9AA0C4" stroke-width="2" stroke-dasharray="4 3"/><g class="bob" style="animation-delay:1.0s"><rect x="329.0" y="42.0" width="46" height="40" rx="9" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><text x="352" y="67.76" font-size="16" text-anchor="middle">9</text></g><circle cx="352" cy="122" r="11" fill="none" stroke="#9AA0C4" stroke-width="2" stroke-dasharray="4 3"/><g class="bob" style="animation-delay:1.2s"><rect x="389.0" y="42.0" width="46" height="40" rx="9" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><text x="412" y="67.76" font-size="16" text-anchor="middle">12</text></g><circle cx="412" cy="122" r="11" fill="none" stroke="#9AA0C4" stroke-width="2" stroke-dasharray="4 3"/><g class="bob" style="animation-delay:1.4s"><rect x="449.0" y="42.0" width="46" height="40" rx="9" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><text x="472" y="67.76" font-size="16" text-anchor="middle">18</text></g><circle cx="472" cy="122" r="11" fill="none" stroke="#9AA0C4" stroke-width="2" stroke-dasharray="4 3"/><g class="bob" style="animation-delay:1.6s"><rect x="509.0" y="42.0" width="46" height="40" rx="9" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><text x="532" y="67.76" font-size="16" text-anchor="middle">36</text></g><circle cx="532" cy="122" r="11" fill="none" stroke="#9AA0C4" stroke-width="2" stroke-dasharray="4 3"/></svg>