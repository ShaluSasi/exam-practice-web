<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" role="img"><title>One column of the addition algorithm</title><style>text{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}@keyframes bn{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.bn{animation:bn 2s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2B2F4A"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="20" y="50" width="100" height="80" rx="12" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><text x="70" y="82" font-size="16" text-anchor="middle">digit</text><text x="70" y="108" font-size="15" text-anchor="middle">0 to 9</text><rect x="160" y="50" width="100" height="80" rx="12" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><text x="210" y="82" font-size="16" text-anchor="middle">digit</text><text x="210" y="108" font-size="15" text-anchor="middle">0 to 9</text><rect x="300" y="50" width="100" height="80" rx="12" fill="#FFE9B8" stroke="#2B2F4A" stroke-width="2.5"/><text x="350" y="82" font-size="16" text-anchor="middle">carry</text><text x="350" y="108" font-size="15" text-anchor="middle">0 or 1</text><text x="140" y="100" font-size="28" text-anchor="middle">+</text><text x="280" y="100" font-size="28" text-anchor="middle">+</text><text x="425" y="100" font-size="28" text-anchor="middle">=</text><rect x="450" y="55" width="80" height="70" rx="12" fill="#fff" stroke="#8E94B8" stroke-width="2.5" stroke-dasharray="5 4" class="bn"/><text x="490" y="103" font-size="34" text-anchor="middle" class="bn">?</text><text x="300" y="170" font-size="14" text-anchor="middle">one column in Step 3</text></svg>