<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 190" role="img"><title>A gcd problem passing through a gear to become a smaller problem</title><style>text{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}@keyframes g2{to{transform:rotate(360deg)}}.gr2{animation:g2 6s linear infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2B2F4A"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="20" y="50" width="150" height="70" rx="12" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><text x="95" y="92" font-size="20" text-anchor="middle">gcd(m, n)</text><path d="M180,85 H250" fill="none" stroke="#2B2F4A" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah)"/><g transform="translate(290,85)"><g class="gr2"><rect x="-5" y="-30" width="10" height="14" rx="2" transform="rotate(0)" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="2"/><rect x="-5" y="-30" width="10" height="14" rx="2" transform="rotate(45)" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="2"/><rect x="-5" y="-30" width="10" height="14" rx="2" transform="rotate(90)" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="2"/><rect x="-5" y="-30" width="10" height="14" rx="2" transform="rotate(135)" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="2"/><rect x="-5" y="-30" width="10" height="14" rx="2" transform="rotate(180)" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="2"/><rect x="-5" y="-30" width="10" height="14" rx="2" transform="rotate(225)" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="2"/><rect x="-5" y="-30" width="10" height="14" rx="2" transform="rotate(270)" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="2"/><rect x="-5" y="-30" width="10" height="14" rx="2" transform="rotate(315)" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="2"/><circle r="22" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="2.5"/><circle r="8" fill="#FFF9EE" stroke="#2B2F4A" stroke-width="2"/></g></g><path d="M330,85 H400" fill="none" stroke="#2B2F4A" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#ah)"/><rect x="410" y="50" width="130" height="70" rx="12" fill="#FFE9B8" stroke="#2B2F4A" stroke-width="2.5"/><text x="475" y="92" font-size="20" text-anchor="middle">gcd(n, ?)</text><text x="290" y="165" font-size="14" text-anchor="middle">one reduction step</text></svg>