<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" role="img"><title>A list drawn as a bracket that grows one item at a time</title><style>text{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}@keyframes gr{0%{opacity:0;transform:translateX(30px)}15%,85%{opacity:1;transform:translateX(0)}100%{opacity:0}}.gr{animation:gr 5.5s ease-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2B2F4A"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M60,40 h-16 v70 h16 M500,40 h16 v70 h-16" fill="none" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect class="gr" style="animation-delay:0.0s" x="80" y="55" width="52" height="40" rx="9" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><rect class="gr" style="animation-delay:0.7s" x="150" y="55" width="52" height="40" rx="9" fill="#FFE9B8" stroke="#2B2F4A" stroke-width="2.5"/><rect class="gr" style="animation-delay:1.4s" x="220" y="55" width="52" height="40" rx="9" fill="#CFEFD2" stroke="#2B2F4A" stroke-width="2.5"/><rect class="gr" style="animation-delay:2.1s" x="290" y="55" width="52" height="40" rx="9" fill="#FFD9D4" stroke="#2B2F4A" stroke-width="2.5"/><rect class="gr" style="animation-delay:2.8s" x="360" y="55" width="52" height="40" rx="9" fill="#E6DAFB" stroke="#2B2F4A" stroke-width="2.5"/><rect class="gr" style="animation-delay:3.5s" x="430" y="55" width="52" height="40" rx="9" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><text x="280" y="140" font-size="14" text-anchor="middle">each new item is added at the end of the list</text></svg>