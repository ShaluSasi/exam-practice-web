<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" role="img"><title>A number waiting to be placed in the columns below another number</title><style>text{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}@keyframes fl{0%,100%{transform:translateX(0)}50%{transform:translateX(-26px)}}.fl{animation:fl 3s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2B2F4A"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="90" y="100" font-size="38" text-anchor="middle">1</text><text x="150" y="100" font-size="38" text-anchor="middle">2</text><text x="210" y="100" font-size="38" text-anchor="middle">.</text><text x="270" y="100" font-size="38" text-anchor="middle">7</text><text x="330" y="100" font-size="38" text-anchor="middle">5</text><rect x="64" y="140" width="52" height="46" rx="8" fill="#fff" stroke="#8E94B8" stroke-width="2" stroke-dasharray="4 3"/><rect x="124" y="140" width="52" height="46" rx="8" fill="#fff" stroke="#8E94B8" stroke-width="2" stroke-dasharray="4 3"/><rect x="184" y="140" width="52" height="46" rx="8" fill="#fff" stroke="#8E94B8" stroke-width="2" stroke-dasharray="4 3"/><rect x="244" y="140" width="52" height="46" rx="8" fill="#fff" stroke="#8E94B8" stroke-width="2" stroke-dasharray="4 3"/><rect x="304" y="140" width="52" height="46" rx="8" fill="#fff" stroke="#8E94B8" stroke-width="2" stroke-dasharray="4 3"/><g class="fl"><rect x="400" y="110" width="110" height="64" rx="12" fill="#FFE9B8" stroke="#2B2F4A" stroke-width="2.5"/><text x="455" y="152" font-size="30" text-anchor="middle">8.5</text></g><text x="40" y="160" font-size="34" text-anchor="middle">+</text><text x="455" y="100" font-size="13" text-anchor="middle">to be placed</text></svg>