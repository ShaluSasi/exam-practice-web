<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>US overseas loans, first half of the year ($ million)</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box}@keyframes bob{50%{transform:translateY(-4px)}}.fl{stroke-dasharray:8 7;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-15}}.mv{animation:mv 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes mv{to{transform:translateX(26px)}}.gr{animation:gr 2.6s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes gr{0%{transform:scaleY(.15)}60%,100%{transform:scaleY(1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="24" font-size="14" text-anchor="middle" >US overseas loans, first half of the year ($ million)</text>
<line x1="44" y1="182" x2="384" y2="182" stroke="#D8D2C4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/><text x="39" y="186" font-size="11" text-anchor="end" >0</text>
<line x1="44" y1="152.4" x2="384" y2="152.4" stroke="#D8D2C4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/><text x="39" y="156.4" font-size="11" text-anchor="end" >250</text>
<line x1="44" y1="122.9" x2="384" y2="122.9" stroke="#D8D2C4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/><text x="39" y="126.9" font-size="11" text-anchor="end" >500</text>
<line x1="44" y1="93.3" x2="384" y2="93.3" stroke="#D8D2C4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/><text x="39" y="97.3" font-size="11" text-anchor="end" >750</text>
<line x1="44" y1="63.7" x2="384" y2="63.7" stroke="#D8D2C4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/><text x="39" y="67.7" font-size="11" text-anchor="end" >1000</text>
<rect x="78" y="63.7" width="102" height="118.3" rx="4" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" class="gr" style="animation-delay:0.0s"/>
<text x="129" y="58.7" font-size="12" text-anchor="middle" class="h" >1,000</text>
<text x="129" y="198" font-size="11" text-anchor="middle" >1928</text>
<rect x="248" y="152.4" width="102" height="29.6" rx="4" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" class="gr" style="animation-delay:0.2s"/>
<text x="299" y="147.4" font-size="12" text-anchor="middle" class="h" >250</text>
<text x="299" y="198" font-size="11" text-anchor="middle" >1929</text>
<line x1="38" y1="182" x2="388" y2="182" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/>
<text x="200" y="233" font-size="11" text-anchor="middle" >1928 taken as exactly $1 billion (text: "over")</text>
</svg>
