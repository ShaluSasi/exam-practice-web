<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" role="img">
<title>Abstract trade routes: Indus valley to West Asia, and cowries from the Maldives</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box}@keyframes bob{50%{transform:translateY(-4px)}}.fl{stroke-dasharray:8 7;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-15}}.mv{animation:mv 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes mv{to{transform:translateX(26px)}}.gr{animation:gr 2.6s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes gr{0%{transform:scaleY(.15)}60%,100%{transform:scaleY(1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="22" font-size="14" text-anchor="middle" >Early sea links (abstract route diagram)</text>
<rect x="14" y="40" width="120" height="54" rx="10" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5" /><text x="74" y="64.2" font-size="12" text-anchor="middle" >Indus valley</text><text x="74" y="78.2" font-size="12" text-anchor="middle" >civilisations</text><g transform="translate(40 66) scale(0.6)"><rect x="-14" y="-6" width="28" height="20" fill="#FFF9EE" stroke="#2B2F4A" stroke-width="2.5"/><path d="M-18 -6 L0 -20 L18 -6Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><rect x="-4" y="3" width="8" height="11" fill="#2B2F4A"/></g>
<rect x="266" y="40" width="120" height="54" rx="10" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5" /><text x="326" y="64.2" font-size="12" text-anchor="middle" >Present-day</text><text x="326" y="78.2" font-size="12" text-anchor="middle" >West Asia</text>
<path d="M140 78Q150 72 160 78T180 78Q190 72 200 78T220 78Q230 72 240 78T260 78" fill="none" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round"/><line x1="140" y1="66" x2="251" y2="66" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round" class="fl"/><polygon points="0,0 -10,-5 -10,5" fill="#FF8A1F" transform="translate(260 66) rotate(0.0)"/><g class="bob"><g transform="translate(200 56) scale(0.6)"><path d="M-30 6 L30 6 L22 22 L-22 22Z" fill="#B97A3A" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><line x1="0" y1="6" x2="0" y2="-32" stroke="#2B2F4A" stroke-width="3"/><path d="M3 -30 L24 2 L3 2Z" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><path d="M-3 -24 L-20 2 L-3 2Z" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/></g></g>
<text x="200" y="108" font-size="12" text-anchor="middle" class="h" >about 3000 BCE</text>
<rect x="14" y="140" width="100" height="54" rx="10" fill="#E6DFCF" stroke="#2B2F4A" stroke-width="2.5" /><text x="64" y="171.2" font-size="12" text-anchor="middle" >Maldives</text><g transform="translate(40 178) scale(0.7) rotate(-20)"><ellipse cx="0" cy="0" rx="18" ry="12" fill="#F6EBD6" stroke="#2B2F4A" stroke-width="2.5"/><path d="M-12 0 Q0 -3 12 0" fill="none" stroke="#2B2F4A" stroke-width="2.5"/><line x1="-9" y1="-3" x2="-9" y2="3" stroke="#2B2F4A" stroke-width="1.6" stroke-linecap="round"/><line x1="-4.5" y1="-3" x2="-4.5" y2="3" stroke="#2B2F4A" stroke-width="1.6" stroke-linecap="round"/><line x1="0" y1="-3" x2="0" y2="3" stroke="#2B2F4A" stroke-width="1.6" stroke-linecap="round"/><line x1="4.5" y1="-3" x2="4.5" y2="3" stroke="#2B2F4A" stroke-width="1.6" stroke-linecap="round"/><line x1="9" y1="-3" x2="9" y2="3" stroke="#2B2F4A" stroke-width="1.6" stroke-linecap="round"/></g><g transform="translate(84 178) scale(0.7) rotate(-20)"><ellipse cx="0" cy="0" rx="18" ry="12" fill="#F6EBD6" stroke="#2B2F4A" stroke-width="2.5"/><path d="M-12 0 Q0 -3 12 0" fill="none" stroke="#2B2F4A" stroke-width="2.5"/><line x1="-9" y1="-3" x2="-9" y2="3" stroke="#2B2F4A" stroke-width="1.6" stroke-linecap="round"/><line x1="-4.5" y1="-3" x2="-4.5" y2="3" stroke="#2B2F4A" stroke-width="1.6" stroke-linecap="round"/><line x1="0" y1="-3" x2="0" y2="3" stroke="#2B2F4A" stroke-width="1.6" stroke-linecap="round"/><line x1="4.5" y1="-3" x2="4.5" y2="3" stroke="#2B2F4A" stroke-width="1.6" stroke-linecap="round"/><line x1="9" y1="-3" x2="9" y2="3" stroke="#2B2F4A" stroke-width="1.6" stroke-linecap="round"/></g>
<rect x="286" y="124" width="100" height="40" rx="10" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5" /><text x="336" y="148.2" font-size="12" text-anchor="middle" >China</text><rect x="286" y="176" width="100" height="40" rx="10" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5" /><text x="336" y="200.2" font-size="12" text-anchor="middle" >East Africa</text>
<line x1="118" y1="160" x2="273" y2="144.9" stroke="#7C5CFF" stroke-width="3" stroke-linecap="round" class="fl"/><polygon points="0,0 -10,-5 -10,5" fill="#7C5CFF" transform="translate(282 144) rotate(-5.6)"/><line x1="118" y1="176" x2="273.1" y2="193" stroke="#7C5CFF" stroke-width="3" stroke-linecap="round" class="fl"/><polygon points="0,0 -10,-5 -10,5" fill="#7C5CFF" transform="translate(282 194) rotate(6.3)"/><circle cx="200" cy="160" r="7" fill="#F6EBD6" stroke="#2B2F4A" stroke-width="2.2" />
<text x="200" y="214" font-size="12" text-anchor="middle" >cowries used as money</text>
</svg>
