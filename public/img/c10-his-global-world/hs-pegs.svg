<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Fixed exchange rates drawn as chains linking a rupee, a dollar and gold</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box}@keyframes bob{50%{transform:translateY(-4px)}}.fl{stroke-dasharray:8 7;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-15}}.mv{animation:mv 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes mv{to{transform:translateX(26px)}}.gr{animation:gr 2.6s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes gr{0%{transform:scaleY(.15)}60%,100%{transform:scaleY(1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="30" font-size="15" text-anchor="middle" >A fixed-rate system</text>
<rect x="8" y="56" width="384" height="150" rx="14" fill="#F2F6FB" />
<circle cx="52" cy="130" r="28" fill="#D9E4EE" stroke="#2B2F4A" stroke-width="2.2" /><text x="52" y="140.6" text-anchor="middle" font-size="32.2" style="font-weight:800;font-family:sans-serif" fill="#2B2F4A">Rs</text>
<rect x="104" y="118" width="40" height="24" rx="12" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><rect x="124" y="118" width="40" height="24" rx="12" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" />
<rect x="160" y="100" width="76" height="60" rx="6" fill="#CDE9B8" stroke="#2B2F4A" stroke-width="2.5" /><text x="198" y="140" font-size="30" text-anchor="middle" >$</text>
<rect x="254" y="118" width="40" height="24" rx="12" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><rect x="274" y="118" width="40" height="24" rx="12" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" />
<g transform="translate(352 130) scale(1.5)"><path d="M-22 8 L22 8 L16 -8 L-16 -8Z" fill="#F2B705" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><path d="M-10 -2 L10 -2" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/></g>
</svg>
