<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 190" role="img">
<title>One bar split into 60 per cent primary products and 40 per cent other goods</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box}@keyframes bob{50%{transform:translateY(-4px)}}.fl{stroke-dasharray:8 7;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-15}}.mv{animation:mv 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes mv{to{transform:translateX(26px)}}.gr{animation:gr 2.6s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes gr{0%{transform:scaleY(.15)}60%,100%{transform:scaleY(1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="26" font-size="14" text-anchor="middle" >Make-up of world trade, 1820 to 1914</text>
<rect x="30" y="56" width="204" height="50" rx="6" fill="#CDE9B8" stroke="#2B2F4A" stroke-width="2.5" /><rect x="234" y="56" width="136" height="50" rx="6" fill="#FFD9A8" stroke="#2B2F4A" stroke-width="2.5" />
<text x="132" y="86" font-size="18" text-anchor="middle" >60%</text><text x="302" y="86" font-size="18" text-anchor="middle" >40%</text>
<text x="132" y="130" font-size="12" text-anchor="middle" >Primary products</text><text x="132" y="146" font-size="11" text-anchor="middle" >wheat, cotton, coal</text><text x="302" y="130" font-size="12" text-anchor="middle" >Everything else</text>
<g transform="translate(60 170) scale(0.6)"><line x1="0" y1="14" x2="0" y2="-14" stroke="#3FA34D" stroke-width="3" stroke-linecap="round"/><ellipse cx="-5" cy="-10" rx="3" ry="5" fill="#F2B705" stroke="#2B2F4A" stroke-width="1.6" transform="rotate(-25 -5 -10)"/><ellipse cx="5" cy="-10" rx="3" ry="5" fill="#F2B705" stroke="#2B2F4A" stroke-width="1.6" transform="rotate(25 5 -10)"/><ellipse cx="-5" cy="-4" rx="3" ry="5" fill="#F2B705" stroke="#2B2F4A" stroke-width="1.6" transform="rotate(-25 -5 -4)"/><ellipse cx="5" cy="-4" rx="3" ry="5" fill="#F2B705" stroke="#2B2F4A" stroke-width="1.6" transform="rotate(25 5 -4)"/><ellipse cx="-5" cy="2" rx="3" ry="5" fill="#F2B705" stroke="#2B2F4A" stroke-width="1.6" transform="rotate(-25 -5 2)"/><ellipse cx="5" cy="2" rx="3" ry="5" fill="#F2B705" stroke="#2B2F4A" stroke-width="1.6" transform="rotate(25 5 2)"/></g><g transform="translate(110 172) scale(0.6)"><path d="M-16 10 L-12 -4 L-2 -10 L8 -6 L16 10Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><path d="M-8 -2 L-2 -6 M4 0 L10 4" stroke="#8A8FB0" stroke-width="2" stroke-linecap="round"/></g><g transform="translate(160 170) scale(0.6)"><circle cx="-7" cy="3" r="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.2" /><circle cx="7" cy="3" r="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.2" /><circle cx="0" cy="-6" r="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.2" /><path d="M-9 12 L0 4 L9 12Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2"/></g>
</svg>
