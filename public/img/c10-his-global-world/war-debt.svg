<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" role="img">
<title>Money moving from a bank in the US to Britain during the war</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box}@keyframes bob{50%{transform:translateY(-4px)}}.fl{stroke-dasharray:8 7;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-15}}.mv{animation:mv 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes mv{to{transform:translateX(26px)}}.gr{animation:gr 2.6s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes gr{0%{transform:scaleY(.15)}60%,100%{transform:scaleY(1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="14" y="66" width="110" height="60" rx="10" fill="#FFE3C4" stroke="#2B2F4A" stroke-width="2.5" /><text x="69" y="93.5" font-size="13" text-anchor="middle" >Britain</text><text x="69" y="107.5" font-size="13" text-anchor="middle" >at war</text><rect x="276" y="66" width="110" height="60" rx="10" fill="#E6F4D8" stroke="#2B2F4A" stroke-width="2.5" /><text x="331" y="93.5" font-size="13" text-anchor="middle" >US banks</text><text x="331" y="107.5" font-size="13" text-anchor="middle" >and public</text>
<line x1="272" y1="96" x2="141" y2="96" stroke="#3FA34D" stroke-width="4" stroke-linecap="round" class="fl"/><polygon points="0,0 -10,-5 -10,5" fill="#3FA34D" transform="translate(132 96) rotate(180.0)"/><circle cx="206" cy="70" r="9" fill="#F2B705" stroke="#2B2F4A" stroke-width="2.2" /><circle cx="200" cy="75" r="9" fill="#F2B705" stroke="#2B2F4A" stroke-width="2.2" /><circle cx="194" cy="80" r="9" fill="#F2B705" stroke="#2B2F4A" stroke-width="2.2" /><text x="200" y="128" font-size="13" text-anchor="middle" class="h" >loans</text>
<g transform="translate(50 172) scale(0.6)"><rect x="-26" y="-8" width="52" height="24" fill="#8A8FB0" stroke="#2B2F4A" stroke-width="2.5"/><path d="M-26 -8 L-14 -18 L-14 -8 L-2 -18 L-2 -8 L10 -18 L10 -8Z" fill="#8A8FB0" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><rect x="14" y="-26" width="9" height="20" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="18" cy="-32" r="5" fill="#E6DFCF" class="pu"/><rect x="-18" y="2" width="8" height="8" fill="#F2B705"/><rect x="-4" y="2" width="8" height="8" fill="#F2B705"/></g><g transform="translate(336 170) scale(0.8)"><path d="M-26 -8 L0 -24 L26 -8Z" fill="#F2B705" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><rect x="-20" y="-5" width="7" height="20" fill="#FFF9EE" stroke="#2B2F4A" stroke-width="2"/><rect x="-7" y="-5" width="7" height="20" fill="#FFF9EE" stroke="#2B2F4A" stroke-width="2"/><rect x="6" y="-5" width="7" height="20" fill="#FFF9EE" stroke="#2B2F4A" stroke-width="2"/><rect x="19" y="-5" width="7" height="20" fill="#FFF9EE" stroke="#2B2F4A" stroke-width="2"/><rect x="-28" y="15" width="56" height="6" fill="#8A8FB0" stroke="#2B2F4A" stroke-width="2.5"/></g>
<text x="200" y="192" font-size="12" text-anchor="middle" >war needs money</text>
</svg>
