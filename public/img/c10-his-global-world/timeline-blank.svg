<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" role="img">
<title>A blank timeline with six marks</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box}@keyframes bob{50%{transform:translateY(-4px)}}.fl{stroke-dasharray:8 7;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-15}}.mv{animation:mv 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes mv{to{transform:translateX(26px)}}.gr{animation:gr 2.6s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes gr{0%{transform:scaleY(.15)}60%,100%{transform:scaleY(1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<line x1="20" y1="80" x2="375" y2="80" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round"/><polygon points="0,0 -10,-5 -10,5" fill="#2B2F4A" transform="translate(384 80) rotate(0.0)"/>
<circle cx="50" cy="80" r="8" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" /><text x="50" y="116" font-size="14" text-anchor="middle" >1</text>
<circle cx="110" cy="80" r="8" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" /><text x="110" y="116" font-size="14" text-anchor="middle" >2</text>
<circle cx="170" cy="80" r="8" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" /><text x="170" y="116" font-size="14" text-anchor="middle" >3</text>
<circle cx="230" cy="80" r="8" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" /><text x="230" y="116" font-size="14" text-anchor="middle" >4</text>
<circle cx="290" cy="80" r="8" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" /><text x="290" y="116" font-size="14" text-anchor="middle" >5</text>
<circle cx="350" cy="80" r="8" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" /><text x="350" y="116" font-size="14" text-anchor="middle" >6</text>
<text x="200" y="32" font-size="13" text-anchor="middle" >six events, oldest to newest</text>
</svg>
