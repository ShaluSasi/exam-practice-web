<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
<title>A conference table with a sheet divided by straight ruler lines</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box}@keyframes bob{50%{transform:translateY(-4px)}}.fl{stroke-dasharray:8 7;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-15}}.mv{animation:mv 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes mv{to{transform:translateX(26px)}}.gr{animation:gr 2.6s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes gr{0%{transform:scaleY(.15)}60%,100%{transform:scaleY(1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="30" y="120" width="340" height="24" rx="10" fill="#B97A3A" stroke="#2B2F4A" stroke-width="2.5" /><line x1="60" y1="144" x2="60" y2="200" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round"/><line x1="340" y1="144" x2="340" y2="200" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round"/>
<rect x="110" y="50" width="180" height="76" rx="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" />
<line x1="110" y1="88" x2="290" y2="88" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/><line x1="170" y1="50" x2="170" y2="126" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/><line x1="230" y1="50" x2="230" y2="126" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/><line x1="110" y1="66" x2="170" y2="66" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/><line x1="230" y1="106" x2="290" y2="106" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/>
<rect x="60" y="100" width="120" height="10" rx="2" fill="#F2B705" stroke="#2B2F4A" stroke-width="2" transform="rotate(-12 120 105)"/>
<g transform="translate(70 108) scale(0.9)"><circle cx="0" cy="-16" r="6" fill="#FFF9EE" stroke="#2B2F4A" stroke-width="2.5"/><path d="M-8 12 Q-9 -6 0 -8 Q9 -6 8 12Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/></g>
<g transform="translate(120 108) scale(0.9)"><circle cx="0" cy="-16" r="6" fill="#FFF9EE" stroke="#2B2F4A" stroke-width="2.5"/><path d="M-8 12 Q-9 -6 0 -8 Q9 -6 8 12Z" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/></g>
<g transform="translate(280 108) scale(0.9)"><circle cx="0" cy="-16" r="6" fill="#FFF9EE" stroke="#2B2F4A" stroke-width="2.5"/><path d="M-8 12 Q-9 -6 0 -8 Q9 -6 8 12Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/></g>
<g transform="translate(330 108) scale(0.9)"><circle cx="0" cy="-16" r="6" fill="#FFF9EE" stroke="#2B2F4A" stroke-width="2.5"/><path d="M-8 12 Q-9 -6 0 -8 Q9 -6 8 12Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/></g>
<text x="200" y="28" font-size="14" text-anchor="middle" >Powers meeting at a table</text>
</svg>
