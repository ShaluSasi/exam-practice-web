<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img">
<title>A contract paper next to a ship sailing back</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box}@keyframes bob{50%{transform:translateY(-4px)}}.fl{stroke-dasharray:8 7;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-15}}.mv{animation:mv 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes mv{to{transform:translateX(26px)}}.gr{animation:gr 2.6s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes gr{0%{transform:scaleY(.15)}60%,100%{transform:scaleY(1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g transform="translate(90 92) scale(3.0)"><rect x="-15" y="-19" width="30" height="38" rx="3" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5"/><line x1="-9" y1="-10" x2="9" y2="-10" stroke="#8A8FB0" stroke-width="2" stroke-linecap="round"/><line x1="-9" y1="-2" x2="9" y2="-2" stroke="#8A8FB0" stroke-width="2" stroke-linecap="round"/><line x1="-9" y1="6" x2="9" y2="6" stroke="#8A8FB0" stroke-width="2" stroke-linecap="round"/><line x1="-9" y1="14" x2="9" y2="14" stroke="#8A8FB0" stroke-width="2" stroke-linecap="round"/></g><text x="90" y="168" font-size="13" text-anchor="middle" >Agreement</text>
<rect x="190" y="130" width="200" height="52" rx="10" fill="#D8EEF9" /><path d="M196 152Q206 146 216 152T236 152Q246 146 256 152T276 152Q286 146 296 152T316 152Q326 146 336 152T356 152Q366 146 376 152T396 152" fill="none" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round"/><g class="bob"><g transform="translate(300 108) scale(1.1)"><path d="M-30 6 L30 6 L22 22 L-22 22Z" fill="#B97A3A" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><line x1="0" y1="6" x2="0" y2="-32" stroke="#2B2F4A" stroke-width="3"/><path d="M3 -30 L24 2 L3 2Z" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><path d="M-3 -24 L-20 2 L-3 2Z" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/></g></g>
