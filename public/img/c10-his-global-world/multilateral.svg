<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" role="img">
<title>Three cards with thick and thin arrows showing who sells more to whom</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box}@keyframes bob{50%{transform:translateY(-4px)}}.fl{stroke-dasharray:8 7;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-15}}.mv{animation:mv 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes mv{to{transform:translateX(26px)}}.gr{animation:gr 2.6s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes gr{0%{transform:scaleY(.15)}60%,100%{transform:scaleY(1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="20" font-size="12" text-anchor="middle" >Illustrative: thicker arrow = more goods sold</text>
<rect x="150" y="34" width="100" height="44" rx="10" fill="#FFF1CC" stroke="#2B2F4A" stroke-width="2.5" /><text x="200" y="60.5" font-size="13" text-anchor="middle" >Britain</text><rect x="14" y="160" width="110" height="44" rx="10" fill="#E6F4D8" stroke="#2B2F4A" stroke-width="2.5" /><text x="69" y="186.6" font-size="13" text-anchor="middle" >India</text><rect x="276" y="160" width="110" height="44" rx="10" fill="#FFE3C4" stroke="#2B2F4A" stroke-width="2.5" /><text x="331" y="186.2" font-size="12" text-anchor="middle" >Other countries</text>
<line x1="160" y1="80" x2="96.1" y2="149.4" stroke="#0B93D4" stroke-width="7" stroke-linecap="round" class="fl"/><polygon points="0,0 -10,-5 -10,5" fill="#0B93D4" transform="translate(90 156) rotate(132.6)"/><line x1="110" y1="156" x2="171.9" y2="88.6" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" class="fl"/><polygon points="0,0 -10,-5 -10,5" fill="#0B93D4" transform="translate(178 82) rotate(-47.4)"/><line x1="300" y1="156" x2="238.2" y2="90.5" stroke="#3FA34D" stroke-width="7" stroke-linecap="round" class="fl"/><polygon points="0,0 -10,-5 -10,5" fill="#3FA34D" transform="translate(232 84) rotate(-133.4)"/><line x1="214" y1="82" x2="275.9" y2="149.4" stroke="#3FA34D" stroke-width="2.5" stroke-linecap="round" class="fl"/><polygon points="0,0 -10,-5 -10,5" fill="#3FA34D" transform="translate(282 156) rotate(47.4)"/>
<text x="78" y="112" font-size="11" text-anchor="end" >sells a lot</text><text x="321" y="112" font-size="11" text-anchor="start" >buys a lot</text>
</svg>
