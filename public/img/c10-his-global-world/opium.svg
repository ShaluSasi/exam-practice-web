<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
<title>Three cards, Britain, India and China, joined by dotted links</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box}@keyframes bob{50%{transform:translateY(-4px)}}.fl{stroke-dasharray:8 7;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-15}}.mv{animation:mv 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes mv{to{transform:translateX(26px)}}.gr{animation:gr 2.6s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes gr{0%{transform:scaleY(.15)}60%,100%{transform:scaleY(1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="150" y="14" width="100" height="46" rx="10" fill="#FFF1CC" stroke="#2B2F4A" stroke-width="2.5" /><text x="200" y="41.5" font-size="13" text-anchor="middle" >Britain</text><rect x="24" y="150" width="100" height="46" rx="10" fill="#E6F4D8" stroke="#2B2F4A" stroke-width="2.5" /><text x="74" y="177.6" font-size="13" text-anchor="middle" >India</text><rect x="276" y="150" width="100" height="46" rx="10" fill="#FFE3C4" stroke="#2B2F4A" stroke-width="2.5" /><text x="326" y="177.6" font-size="13" text-anchor="middle" >China</text>
<line x1="180" y1="62" x2="90" y2="148" stroke="#8A8FB0" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 7"/><line x1="220" y1="62" x2="310" y2="148" stroke="#8A8FB0" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 7"/><line x1="130" y1="174" x2="270" y2="174" stroke="#8A8FB0" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 7"/>
<g transform="translate(40 48) scale(0.6)"><rect x="-26" y="-8" width="52" height="24" fill="#8A8FB0" stroke="#2B2F4A" stroke-width="2.5"/><path d="M-26 -8 L-14 -18 L-14 -8 L-2 -18 L-2 -8 L10 -18 L10 -8Z" fill="#8A8FB0" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><rect x="14" y="-26" width="9" height="20" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="18" cy="-32" r="5" fill="#E6DFCF" class="pu"/><rect x="-18" y="2" width="8" height="8" fill="#F2B705"/><rect x="-4" y="2" width="8" height="8" fill="#F2B705"/></g><g transform="translate(344 130) scale(0.6)"><path d="M-12 -14 Q-16 8 -11 14 L11 14 Q16 8 12 -14 Z" fill="#D9A441" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><path d="M-9 -14 L-6 -20 L6 -20 L9 -14" fill="#D9A441" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/></g><g transform="translate(76 130) scale(0.7)"><line x1="0" y1="14" x2="0" y2="-14" stroke="#3FA34D" stroke-width="3" stroke-linecap="round"/><ellipse cx="-5" cy="-10" rx="3" ry="5" fill="#F2B705" stroke="#2B2F4A" stroke-width="1.6" transform="rotate(-25 -5 -10)"/><ellipse cx="5" cy="-10" rx="3" ry="5" fill="#F2B705" stroke="#2B2F4A" stroke-width="1.6" transform="rotate(25 5 -10)"/><ellipse cx="-5" cy="-4" rx="3" ry="5" fill="#F2B705" stroke="#2B2F4A" stroke-width="1.6" transform="rotate(-25 -5 -4)"/><ellipse cx="5" cy="-4" rx="3" ry="5" fill="#F2B705" stroke="#2B2F4A" stroke-width="1.6" transform="rotate(25 5 -4)"/><ellipse cx="-5" cy="2" rx="3" ry="5" fill="#F2B705" stroke="#2B2F4A" stroke-width="1.6" transform="rotate(-25 -5 2)"/><ellipse cx="5" cy="2" rx="3" ry="5" fill="#F2B705" stroke="#2B2F4A" stroke-width="1.6" transform="rotate(25 5 2)"/></g>
</svg>
