<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" role="img">
<title>A line from the east through the west coast to the southern tip with a cow moving along it</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box}@keyframes bob{50%{transform:translateY(-4px)}}.fl{stroke-dasharray:8 7;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-15}}.mv{animation:mv 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes mv{to{transform:translateX(26px)}}.gr{animation:gr 2.6s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes gr{0%{transform:scaleY(.15)}60%,100%{transform:scaleY(1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="24" font-size="14" text-anchor="middle" >Spread of the cattle plague (abstract)</text>
<line x1="40" y1="100" x2="360" y2="100" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 7"/>
<circle cx="40" cy="100" r="9" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" /><text x="40" y="132" font-size="12" text-anchor="middle" >East</text>
<circle cx="200" cy="100" r="9" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" /><text x="200" y="132" font-size="12" text-anchor="middle" >West coast</text>
<circle cx="360" cy="100" r="9" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" /><text x="360" y="132" font-size="12" text-anchor="middle" >Southern tip</text>
<g class="mv" style="animation-duration:4s"><g transform="translate(70 72) scale(0.9)" opacity="1"><rect x="-16" y="-8" width="30" height="16" rx="7" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5"/><rect x="12" y="-12" width="11" height="12" rx="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5"/><line x1="-10" y1="8" x2="-10" y2="17" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><line x1="8" y1="8" x2="8" y2="17" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><path d="M14 -12 L12 -17 M20 -12 L22 -17" stroke="#2B2F4A" stroke-width="2.4" stroke-linecap="round"/><circle cx="-5" cy="-1" r="4" fill="#2B2F4A"/></g></g>
</svg>
