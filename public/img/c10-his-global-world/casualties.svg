<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>First World War: deaths and injuries (millions)</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box}@keyframes bob{50%{transform:translateY(-4px)}}.fl{stroke-dasharray:8 7;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-15}}.mv{animation:mv 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes mv{to{transform:translateX(26px)}}.gr{animation:gr 2.6s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes gr{0%{transform:scaleY(.15)}60%,100%{transform:scaleY(1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="24" font-size="14" text-anchor="middle" >First World War: deaths and injuries (millions)</text>
<line x1="44" y1="196" x2="384" y2="196" stroke="#D8D2C4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/><text x="39" y="200" font-size="11" text-anchor="end" >0</text>
<line x1="44" y1="164.8" x2="384" y2="164.8" stroke="#D8D2C4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/><text x="39" y="168.8" font-size="11" text-anchor="end" >5</text>
<line x1="44" y1="133.5" x2="384" y2="133.5" stroke="#D8D2C4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/><text x="39" y="137.5" font-size="11" text-anchor="end" >10</text>
<line x1="44" y1="102.2" x2="384" y2="102.2" stroke="#D8D2C4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/><text x="39" y="106.2" font-size="11" text-anchor="end" >15</text>
<line x1="44" y1="71" x2="384" y2="71" stroke="#D8D2C4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/><text x="39" y="75" font-size="11" text-anchor="end" >20</text>
<rect x="78" y="139.8" width="102" height="56.2" rx="4" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" class="gr" style="animation-delay:0.0s"/>
<text x="129" y="134.8" font-size="12" text-anchor="middle" class="h" >9 million</text>
<text x="129" y="212" font-size="11" text-anchor="middle" >Dead</text>
<rect x="248" y="71" width="102" height="125" rx="4" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" class="gr" style="animation-delay:0.2s"/>
<text x="299" y="66" font-size="12" text-anchor="middle" class="h" >20 million</text>
<text x="299" y="212" font-size="11" text-anchor="middle" >Injured</text>
<line x1="38" y1="196" x2="388" y2="196" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/>
</svg>
