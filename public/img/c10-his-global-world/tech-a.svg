<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img">
<title>Steamer with a snowflake: refrigerated ship</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box}@keyframes bob{50%{transform:translateY(-4px)}}.fl{stroke-dasharray:8 7;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-15}}.mv{animation:mv 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes mv{to{transform:translateX(26px)}}.gr{animation:gr 2.6s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes gr{0%{transform:scaleY(.15)}60%,100%{transform:scaleY(1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="8" y="96" width="184" height="46" rx="10" fill="#D8EEF9" /><path d="M14 112Q24 106 34 112T54 112Q64 106 74 112T94 112Q104 106 114 112T134 112Q144 106 154 112T174 112Q184 106 194 112T214 112" fill="none" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round"/><g class="bob"><g transform="translate(100 78) scale(1.35)"><path d="M-36 4 L36 4 L26 22 L-26 22Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><rect x="-18" y="-10" width="30" height="14" rx="3" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5"/><rect x="-4" y="-26" width="10" height="16" rx="2" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="10" cy="-32" r="5" fill="#E6DFCF" class="pu"/><circle cx="18" cy="-40" r="4" fill="#E6DFCF" class="pu"/></g></g><g transform="translate(100 76) scale(1.2)"><line x1="-11" y1="0" x2="11" y2="0" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" transform="rotate(0)"/><line x1="-11" y1="0" x2="11" y2="0" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" transform="rotate(60)"/><line x1="-11" y1="0" x2="11" y2="0" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" transform="rotate(120)"/></g>
