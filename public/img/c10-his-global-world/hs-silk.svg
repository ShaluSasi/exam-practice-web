<circle cx="341" cy="113" r="13.5" fill="#F2B705" stroke="#2B2F4A" stroke-width="2.2" /><circle cx="332" cy="120.5" r="13.5" fill="#F2B705" stroke="#2B2F4A" stroke-width="2.2" /><circle cx="323" cy="128" r="13.5" fill="#F2B705" stroke="#2B2F4A" stroke-width="2.2" /><g transform="translate(332 90) scale(1.0)"><path d="M-22 8 L22 8 L16 -8 L-16 -8Z" fill="#F2B705" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><path d="M-10 -2 L10 -2" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/></g>
<line x1="100" y1="62" x2="200" y2="100" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6"/><line x1="200" y1="100" x2="290" y2="100" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 6"/><text x="240" y="92" font-size="11" text-anchor="middle" >land route</text>
<line x1="100" y1="188" x2="200" y2="190" stroke="#0B93D4" stroke-width="3" stroke-linecap="round"/><line x1="200" y1="190" x2="290" y2="150" stroke="#0B93D4" stroke-width="3" stroke-linecap="round"/><path d="M130 206Q140 200 150 206T170 206Q180 200 190 206T210 206Q220 200 230 206T250 206Q260 200 270 206T290 206" fill="none" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round"/><text x="190" y="226" font-size="11" text-anchor="middle" >sea route</text>
