<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" role="img">
<title>Three panels: a tax bill, land passed to one heir and a fenced compound</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box}@keyframes bob{50%{transform:translateY(-4px)}}.fl{stroke-dasharray:8 7;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-15}}.mv{animation:mv 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes mv{to{transform:translateX(26px)}}.gr{animation:gr 2.6s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes gr{0%{transform:scaleY(.15)}60%,100%{transform:scaleY(1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="8" y="14" width="124" height="160" rx="12" fill="#EAF4FB" />
<rect x="138" y="14" width="124" height="160" rx="12" fill="#EAF4FB" />
<rect x="268" y="14" width="124" height="160" rx="12" fill="#EAF4FB" />
<g transform="translate(70 80) scale(1.5)"><rect x="-15" y="-19" width="30" height="38" rx="3" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5"/><line x1="-9" y1="-10" x2="9" y2="-10" stroke="#8A8FB0" stroke-width="2" stroke-linecap="round"/><line x1="-9" y1="-2" x2="9" y2="-2" stroke="#8A8FB0" stroke-width="2" stroke-linecap="round"/><line x1="-9" y1="6" x2="9" y2="6" stroke="#8A8FB0" stroke-width="2" stroke-linecap="round"/></g><text x="70" y="130" font-size="14" text-anchor="middle" >TAX</text><circle cx="70" cy="156" r="8" fill="#F2B705" stroke="#2B2F4A" stroke-width="2.2" />
<rect x="160" y="56" width="80" height="50" rx="4" fill="#E6F4D8" stroke="#2B2F4A" stroke-width="2.5" /><g transform="translate(200 92) scale(1)"><circle cx="0" cy="-16" r="6" fill="#FFF9EE" stroke="#2B2F4A" stroke-width="2.5"/><path d="M-8 12 Q-9 -6 0 -8 Q9 -6 8 12Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/></g><text x="200" y="130" font-size="13" text-anchor="middle" >ONE heir</text>
<line x1="160" y1="80" x2="240" y2="80" stroke="#3FA34D" stroke-width="1.5" stroke-linecap="round"/>
<rect x="284" y="56" width="92" height="74" rx="4" fill="#E6D9B8" stroke="#2B2F4A" stroke-width="2.5" stroke-dasharray="8 4"/><g transform="translate(310 100) scale(0.9)"><circle cx="0" cy="-16" r="6" fill="#FFF9EE" stroke="#2B2F4A" stroke-width="2.5"/><path d="M-8 12 Q-9 -6 0 -8 Q9 -6 8 12Z" fill="#8A8FB0" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/></g><g transform="translate(345 100) scale(0.9)"><circle cx="0" cy="-16" r="6" fill="#FFF9EE" stroke="#2B2F4A" stroke-width="2.5"/><path d="M-8 12 Q-9 -6 0 -8 Q9 -6 8 12Z" fill="#8A8FB0" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/></g><text x="330" y="152" font-size="13" text-anchor="middle" >compound</text>
<text x="200" y="198" font-size="12" text-anchor="middle" >ways of pushing people into paid work</text>
</svg>
