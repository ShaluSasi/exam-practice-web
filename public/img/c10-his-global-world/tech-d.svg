<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img">
<title>Railway wagon on tracks</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box}@keyframes bob{50%{transform:translateY(-4px)}}.fl{stroke-dasharray:8 7;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-15}}.mv{animation:mv 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes mv{to{transform:translateX(26px)}}.gr{animation:gr 2.6s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes gr{0%{transform:scaleY(.15)}60%,100%{transform:scaleY(1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<line x1="12" y1="112" x2="188" y2="112" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><line x1="19" y1="108" x2="19" y2="117" stroke="#B97A3A" stroke-width="3" stroke-linecap="round"/><line x1="33" y1="108" x2="33" y2="117" stroke="#B97A3A" stroke-width="3" stroke-linecap="round"/><line x1="47" y1="108" x2="47" y2="117" stroke="#B97A3A" stroke-width="3" stroke-linecap="round"/><line x1="61" y1="108" x2="61" y2="117" stroke="#B97A3A" stroke-width="3" stroke-linecap="round"/><line x1="75" y1="108" x2="75" y2="117" stroke="#B97A3A" stroke-width="3" stroke-linecap="round"/><line x1="89" y1="108" x2="89" y2="117" stroke="#B97A3A" stroke-width="3" stroke-linecap="round"/><line x1="103" y1="108" x2="103" y2="117" stroke="#B97A3A" stroke-width="3" stroke-linecap="round"/><line x1="117" y1="108" x2="117" y2="117" stroke="#B97A3A" stroke-width="3" stroke-linecap="round"/><line x1="131" y1="108" x2="131" y2="117" stroke="#B97A3A" stroke-width="3" stroke-linecap="round"/><line x1="145" y1="108" x2="145" y2="117" stroke="#B97A3A" stroke-width="3" stroke-linecap="round"/><line x1="159" y1="108" x2="159" y2="117" stroke="#B97A3A" stroke-width="3" stroke-linecap="round"/><line x1="173" y1="108" x2="173" y2="117" stroke="#B97A3A" stroke-width="3" stroke-linecap="round"/><g transform="translate(100 84) scale(1.6)"><rect x="-24" y="-12" width="48" height="20" rx="3" fill="#B97A3A" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="-14" cy="12" r="6" fill="#8A8FB0" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="14" cy="12" r="6" fill="#8A8FB0" stroke="#2B2F4A" stroke-width="2.5" /></g>
</svg>
