<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
<title>Three cards showing trade centre moving west</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box}@keyframes bob{50%{transform:translateY(-4px)}}.fl{stroke-dasharray:8 7;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-15}}.mv{animation:mv 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes mv{to{transform:translateX(26px)}}.gr{animation:gr 2.6s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes gr{0%{transform:scaleY(.15)}60%,100%{transform:scaleY(1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="24" font-size="14" text-anchor="middle" >Centre of world trade (abstract)</text>
<rect x="14" y="56" width="100" height="54" rx="10" fill="#FFE3C4" stroke="#2B2F4A" stroke-width="2.5" /><text x="64" y="80.2" font-size="12" text-anchor="middle" >China,</text><text x="64" y="94.2" font-size="12" text-anchor="middle" >India</text><rect x="150" y="134" width="100" height="54" rx="10" fill="#E6F4D8" stroke="#2B2F4A" stroke-width="2.5" /><text x="200" y="158.2" font-size="12" text-anchor="middle" >The</text><text x="200" y="172.2" font-size="12" text-anchor="middle" >Americas</text><rect x="286" y="56" width="100" height="54" rx="10" fill="#FFF1CC" stroke="#2B2F4A" stroke-width="2.5" /><text x="336" y="87.2" font-size="12" text-anchor="middle" >Europe</text>
<line x1="120" y1="84" x2="271" y2="84" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round" class="fl"/><polygon points="0,0 -10,-5 -10,5" fill="#FF8A1F" transform="translate(280 84) rotate(0.0)"/><line x1="256" y1="160" x2="322.2" y2="122.4" stroke="#3FA34D" stroke-width="3.5" stroke-linecap="round" class="fl"/><polygon points="0,0 -10,-5 -10,5" fill="#3FA34D" transform="translate(330 118) rotate(-29.6)"/>
<text x="200" y="74" font-size="12" text-anchor="middle" class="h" >centre moves west</text>
</svg>
