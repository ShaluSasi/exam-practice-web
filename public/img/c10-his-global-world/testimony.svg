<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img">
<title>A labourer carrying a heavy load and a pay slip with deductions</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box}@keyframes bob{50%{transform:translateY(-4px)}}.fl{stroke-dasharray:8 7;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-15}}.mv{animation:mv 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes mv{to{transform:translateX(26px)}}.gr{animation:gr 2.6s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes gr{0%{transform:scaleY(.15)}60%,100%{transform:scaleY(1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="8" y="150" width="384" height="42" rx="10" fill="#E6D9B8" />
<g transform="translate(80 126) scale(1.5)"><circle cx="0" cy="-16" r="6" fill="#FFF9EE" stroke="#2B2F4A" stroke-width="2.5"/><path d="M-8 12 Q-9 -6 0 -8 Q9 -6 8 12Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/></g><rect x="100" y="74" width="44" height="34" rx="4" fill="#B97A3A" stroke="#2B2F4A" stroke-width="2.5" /><rect x="112" y="56" width="44" height="34" rx="4" fill="#B97A3A" stroke="#2B2F4A" stroke-width="2.5" /><line x1="94" y1="100" x2="104" y2="100" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/>
<rect x="220" y="30" width="150" height="124" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><text x="295" y="56" font-size="14" text-anchor="middle" >Wages</text>
<line x1="236" y1="76" x2="354" y2="76" stroke="#8A8FB0" stroke-width="2" stroke-linecap="round"/><text x="256" y="100" font-size="14" text-anchor="middle" fill="#E5484D" >− − −</text><text x="295" y="126" font-size="12" text-anchor="middle" >deductions</text>
</svg>
