<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 190" role="img">
<title>A time bar showing the silk routes lasting from before the Christian Era to almost the fifteenth century</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box}@keyframes bob{50%{transform:translateY(-4px)}}.fl{stroke-dasharray:8 7;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-15}}.mv{animation:mv 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes mv{to{transform:translateX(26px)}}.gr{animation:gr 2.6s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes gr{0%{transform:scaleY(.15)}60%,100%{transform:scaleY(1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="24" font-size="14" text-anchor="middle" >The silk routes through time</text>
<rect x="30" y="80" width="340" height="26" rx="13" fill="#FFD9A8" stroke="#2B2F4A" stroke-width="2.5" />
<line x1="34" y1="93" x2="357" y2="93" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" class="fl"/><polygon points="0,0 -10,-5 -10,5" fill="#FF8A1F" transform="translate(366 93) rotate(0.0)"/>
<text x="30" y="130" font-size="12" text-anchor="start" >before the</text><text x="30" y="145" font-size="12" text-anchor="start" >Christian Era</text>
<text x="370" y="130" font-size="12" text-anchor="end" >almost till the</text><text x="370" y="145" font-size="12" text-anchor="end" >fifteenth century</text>
<g transform="translate(80 54) scale(0.8)"><rect x="-16" y="-11" width="32" height="22" rx="4" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5"/><line x1="-6" y1="-11" x2="-6" y2="11" stroke="#2B2F4A" stroke-width="2"/><line x1="6" y1="-11" x2="6" y2="11" stroke="#2B2F4A" stroke-width="2"/><path d="M-16 -2 Q-8 -8 0 -2 T16 -2" fill="none" stroke="#FFFFFF" stroke-width="2"/></g><g transform="translate(150 54) scale(0.7)"><path d="M-8 -16 L8 -16 L7 -8 Q18 0 10 14 L-10 14 Q-18 0 -7 -8Z" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><path d="M-11 0 Q0 5 11 0" fill="none" stroke="#0B93D4" stroke-width="2.5"/></g><g transform="translate(220 54) scale(0.7)"><path d="M-12 -14 Q-16 8 -11 14 L11 14 Q16 8 12 -14 Z" fill="#D9A441" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><path d="M-9 -14 L-6 -20 L6 -20 L9 -14" fill="#D9A441" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/></g><circle cx="305.4" cy="49" r="8.1" fill="#F2B705" stroke="#2B2F4A" stroke-width="2.2" /><circle cx="300" cy="53.5" r="8.1" fill="#F2B705" stroke="#2B2F4A" stroke-width="2.2" /><circle cx="294.6" cy="58" r="8.1" fill="#F2B705" stroke="#2B2F4A" stroke-width="2.2" /><g transform="translate(350 56) scale(0.7)"><path d="M-18 14 L-18 4 Q0 -22 18 4 L18 14Z" fill="#FFF9EE" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><line x1="0" y1="-12" x2="0" y2="-22" stroke="#2B2F4A" stroke-width="3"/><rect x="-5" y="4" width="10" height="10" rx="5" fill="#2B2F4A"/></g>
</svg>
