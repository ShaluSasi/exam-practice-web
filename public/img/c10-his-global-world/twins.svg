<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img">
<title>A conference hotel and two pillars standing side by side</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box}@keyframes bob{50%{transform:translateY(-4px)}}.fl{stroke-dasharray:8 7;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-15}}.mv{animation:mv 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes mv{to{transform:translateX(26px)}}.gr{animation:gr 2.6s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes gr{0%{transform:scaleY(.15)}60%,100%{transform:scaleY(1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="110" y="90" width="180" height="80" rx="4" fill="#FFF1CC" stroke="#2B2F4A" stroke-width="2.5" /><polygon points="100,90 200,40 300,90" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" />
<rect x="125" y="106" width="20" height="26" rx="2" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" />
<rect x="163" y="106" width="20" height="26" rx="2" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" />
<rect x="201" y="106" width="20" height="26" rx="2" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" />
<rect x="239" y="106" width="20" height="26" rx="2" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" />
<rect x="277" y="106" width="20" height="26" rx="2" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" />
<rect x="186" y="140" width="28" height="30" rx="3" fill="#2B2F4A" />
<rect x="20" y="80" width="40" height="90" rx="4" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" /><rect x="340" y="80" width="40" height="90" rx="4" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="40" cy="62" r="12" fill="#F2B705" stroke="#2B2F4A" stroke-width="2.2" /><circle cx="360" cy="62" r="12" fill="#F2B705" stroke="#2B2F4A" stroke-width="2.2" />
<text x="200" y="192" font-size="12" text-anchor="middle" >a conference in July 1944</text>
</svg>
