<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img">
<title>Cotton in India’s exports (per cent share)</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box}@keyframes bob{50%{transform:translateY(-4px)}}.fl{stroke-dasharray:8 7;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-15}}.mv{animation:mv 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes mv{to{transform:translateX(26px)}}.gr{animation:gr 2.6s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes gr{0%{transform:scaleY(.15)}60%,100%{transform:scaleY(1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="24" font-size="14" text-anchor="middle" >Cotton in India’s exports (per cent share)</text>
<line x1="44" y1="206" x2="384" y2="206" stroke="#D8D2C4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/><text x="39" y="210" font-size="11" text-anchor="end" >0</text>
<line x1="44" y1="167.9" x2="384" y2="167.9" stroke="#D8D2C4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/><text x="39" y="171.9" font-size="11" text-anchor="end" >10</text>
<line x1="44" y1="129.8" x2="384" y2="129.8" stroke="#D8D2C4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/><text x="39" y="133.8" font-size="11" text-anchor="end" >20</text>
<line x1="44" y1="91.7" x2="384" y2="91.7" stroke="#D8D2C4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/><text x="39" y="95.7" font-size="11" text-anchor="end" >30</text>
<line x1="44" y1="53.6" x2="384" y2="53.6" stroke="#D8D2C4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/><text x="39" y="57.6" font-size="11" text-anchor="end" >40</text>
<rect x="57.6" y="91.7" width="40.8" height="114.3" rx="4" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" class="gr" style="animation-delay:0.0s"/>
<text x="78" y="86.7" font-size="12" text-anchor="middle" class="h" >30%</text>
<text x="78" y="222" font-size="11" text-anchor="middle" >Cloth</text><text x="78" y="235" font-size="11" text-anchor="middle" >1800</text>
<rect x="125.6" y="148.9" width="40.8" height="57.1" rx="4" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" class="gr" style="animation-delay:0.2s"/>
<text x="146" y="143.9" font-size="12" text-anchor="middle" class="h" >15%</text>
<text x="146" y="222" font-size="11" text-anchor="middle" >Cloth</text><text x="146" y="235" font-size="11" text-anchor="middle" >1815</text>
<rect x="193.6" y="194.6" width="40.8" height="11.4" rx="4" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" class="gr" style="animation-delay:0.4s"/>
<text x="214" y="189.6" font-size="12" text-anchor="middle" class="h" >under 3%</text>
<text x="214" y="222" font-size="11" text-anchor="middle" >Cloth</text><text x="214" y="235" font-size="11" text-anchor="middle" >1870s</text>
<rect x="261.6" y="187" width="40.8" height="19" rx="4" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" class="gr" style="animation-delay:0.6s"/>
<text x="282" y="182" font-size="12" text-anchor="middle" class="h" >5%</text>
<text x="282" y="222" font-size="11" text-anchor="middle" >Raw cotton</text><text x="282" y="235" font-size="11" text-anchor="middle" >1812</text>
<rect x="329.6" y="72.7" width="40.8" height="133.3" rx="4" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" class="gr" style="animation-delay:0.8s"/>
<text x="350" y="67.7" font-size="12" text-anchor="middle" class="h" >35%</text>
<text x="350" y="222" font-size="11" text-anchor="middle" >Raw cotton</text><text x="350" y="235" font-size="11" text-anchor="middle" >1871</text>
<line x1="38" y1="206" x2="388" y2="206" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/>
</svg>
