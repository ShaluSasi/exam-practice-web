<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img">
<title>India after 1928 (1928 level = 100)</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box}@keyframes bob{50%{transform:translateY(-4px)}}.fl{stroke-dasharray:8 7;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-15}}.mv{animation:mv 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes mv{to{transform:translateX(26px)}}.gr{animation:gr 2.6s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes gr{0%{transform:scaleY(.15)}60%,100%{transform:scaleY(1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="24" font-size="14" text-anchor="middle" >India after 1928 (1928 level = 100)</text>
<line x1="44" y1="192" x2="384" y2="192" stroke="#D8D2C4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/><text x="39" y="196" font-size="11" text-anchor="end" >0</text>
<line x1="44" y1="130.1" x2="384" y2="130.1" stroke="#D8D2C4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/><text x="39" y="134.1" font-size="11" text-anchor="end" >50</text>
<line x1="44" y1="68.3" x2="384" y2="68.3" stroke="#D8D2C4" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 4"/><text x="39" y="72.3" font-size="11" text-anchor="end" >100</text>
<rect x="61" y="130.1" width="51" height="61.9" rx="4" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" class="gr" style="animation-delay:0.0s"/>
<text x="86.5" y="125.1" font-size="12" text-anchor="middle" class="h" >about 50</text>
<text x="86.5" y="208" font-size="11" text-anchor="middle" >Exports</text><text x="86.5" y="221" font-size="11" text-anchor="middle" >1934</text>
<rect x="146" y="130.1" width="51" height="61.9" rx="4" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" class="gr" style="animation-delay:0.2s"/>
<text x="171.5" y="125.1" font-size="12" text-anchor="middle" class="h" >about 50</text>
<text x="171.5" y="208" font-size="11" text-anchor="middle" >Imports</text><text x="171.5" y="221" font-size="11" text-anchor="middle" >1934</text>
<rect x="231" y="130.1" width="51" height="61.9" rx="4" fill="#F2B705" stroke="#2B2F4A" stroke-width="2.5" class="gr" style="animation-delay:0.4s"/>
<text x="256.5" y="125.1" font-size="12" text-anchor="middle" class="h" >50</text>
<text x="256.5" y="208" font-size="11" text-anchor="middle" >Wheat</text><text x="256.5" y="221" font-size="11" text-anchor="middle" >price 1934</text>
<rect x="316" y="142.5" width="51" height="49.5" rx="4" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" class="gr" style="animation-delay:0.6s"/>
<text x="341.5" y="137.5" font-size="12" text-anchor="middle" class="h" >below 40</text>
<text x="341.5" y="208" font-size="11" text-anchor="middle" >Raw jute</text><text x="341.5" y="221" font-size="11" text-anchor="middle" >price</text>
<line x1="38" y1="192" x2="388" y2="192" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/>
<text x="200" y="243" font-size="11" text-anchor="middle" >Wheat prices fell 50%; raw jute prices fell over 60%</text>
</svg>
