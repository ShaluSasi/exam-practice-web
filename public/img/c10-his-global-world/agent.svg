<rect x="8" y="172" width="384" height="28" rx="8" fill="#E6D9B8" />
<rect x="196" y="40" width="190" height="64" rx="8" fill="#EFE6D5" stroke="#2B2F4A" stroke-width="2" opacity=".75" stroke-dasharray="6 5"/><text x="291" y="66" font-size="12" text-anchor="middle" >What they were not told</text><text x="291" y="84" font-size="11" text-anchor="middle" >sea voyage, harsh work</text>
