<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
<title>A group of countries with four demands: resources, aid, fair prices, market access</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box}@keyframes bob{50%{transform:translateY(-4px)}}.fl{stroke-dasharray:8 7;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-15}}.mv{animation:mv 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes mv{to{transform:translateX(26px)}}.gr{animation:gr 2.6s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes gr{0%{transform:scaleY(.15)}60%,100%{transform:scaleY(1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="200" cy="110" r="38" fill="#FFE3C4" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="116" font-size="18" text-anchor="middle" >G-77</text>
<g transform="translate(70 56)"><g transform="translate(0 0) scale(1.1)"><path d="M-16 10 L-12 -4 L-2 -10 L8 -6 L16 10Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><path d="M-8 -2 L-2 -6 M4 0 L10 4" stroke="#8A8FB0" stroke-width="2" stroke-linecap="round"/></g></g><line x1="106" y1="76" x2="168" y2="90" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 5"/>
<g transform="translate(330 56)"><circle cx="7.2" cy="-6" r="10.8" fill="#F2B705" stroke="#2B2F4A" stroke-width="2.2" /><circle cx="0" cy="0" r="10.8" fill="#F2B705" stroke="#2B2F4A" stroke-width="2.2" /><circle cx="-7.2" cy="6" r="10.8" fill="#F2B705" stroke="#2B2F4A" stroke-width="2.2" /></g><line x1="294" y1="76" x2="232" y2="90" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 5"/>
<g transform="translate(70 166)"><g transform="translate(0 0) scale(1.0)"><rect x="-16" y="-11" width="32" height="22" rx="4" fill="#F2B705" stroke="#2B2F4A" stroke-width="2.5"/><line x1="-6" y1="-11" x2="-6" y2="11" stroke="#2B2F4A" stroke-width="2"/><line x1="6" y1="-11" x2="6" y2="11" stroke="#2B2F4A" stroke-width="2"/><path d="M-16 -2 Q-8 -8 0 -2 T16 -2" fill="none" stroke="#FFFFFF" stroke-width="2"/></g></g><line x1="106" y1="146" x2="168" y2="130" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 5"/>
<g transform="translate(330 166)"><g class="bob"><g transform="translate(0 0) scale(0.8)"><path d="M-36 4 L36 4 L26 22 L-26 22Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><rect x="-18" y="-10" width="30" height="14" rx="3" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5"/><rect x="-4" y="-26" width="10" height="16" rx="2" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="10" cy="-32" r="5" fill="#E6DFCF" class="pu"/><circle cx="18" cy="-40" r="4" fill="#E6DFCF" class="pu"/></g></g></g><line x1="294" y1="146" x2="232" y2="130" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 5"/>
<text x="200" y="208" font-size="12" text-anchor="middle" >a group of developing countries</text>
</svg>
