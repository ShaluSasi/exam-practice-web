<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" role="img">
<title>Money bags moving from India to Britain with a pension envelope, an interest slip and a remittance</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box}@keyframes bob{50%{transform:translateY(-4px)}}.fl{stroke-dasharray:8 7;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-15}}.mv{animation:mv 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes mv{to{transform:translateX(26px)}}.gr{animation:gr 2.6s ease-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes gr{0%{transform:scaleY(.15)}60%,100%{transform:scaleY(1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="14" y="70" width="100" height="50" rx="10" fill="#E6F4D8" stroke="#2B2F4A" stroke-width="2.5" /><text x="64" y="99.5" font-size="13" text-anchor="middle" >India</text><rect x="286" y="70" width="100" height="50" rx="10" fill="#FFF1CC" stroke="#2B2F4A" stroke-width="2.5" /><text x="336" y="99.5" font-size="13" text-anchor="middle" >Britain</text>
<line x1="120" y1="95" x2="271" y2="95" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round" class="fl"/><polygon points="0,0 -10,-5 -10,5" fill="#FF8A1F" transform="translate(280 95) rotate(0.0)"/><g transform="translate(200 62) scale(0.9)"><path d="M-12 -14 Q-16 8 -11 14 L11 14 Q16 8 12 -14 Z" fill="#F2B705" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><path d="M-9 -14 L-6 -20 L6 -20 L9 -14" fill="#F2B705" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><text x="0" y="8" text-anchor="middle" font-size="14" fill="#FFFFFF" style="font-weight:800;font-family:sans-serif">$</text></g>
<g transform="translate(80 168) scale(0.9)"><rect x="-15" y="-19" width="30" height="38" rx="3" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5"/><line x1="-9" y1="-10" x2="9" y2="-10" stroke="#8A8FB0" stroke-width="2" stroke-linecap="round"/><line x1="-9" y1="-2" x2="9" y2="-2" stroke="#8A8FB0" stroke-width="2" stroke-linecap="round"/></g><g transform="translate(200 168) scale(0.9)"><rect x="-15" y="-19" width="30" height="38" rx="3" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5"/><line x1="-9" y1="-10" x2="9" y2="-10" stroke="#8A8FB0" stroke-width="2" stroke-linecap="round"/><line x1="-9" y1="-2" x2="9" y2="-2" stroke="#8A8FB0" stroke-width="2" stroke-linecap="round"/></g><g transform="translate(320 168) scale(0.9)"><rect x="-15" y="-19" width="30" height="38" rx="3" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5"/><line x1="-9" y1="-10" x2="9" y2="-10" stroke="#8A8FB0" stroke-width="2" stroke-linecap="round"/><line x1="-9" y1="-2" x2="9" y2="-2" stroke="#8A8FB0" stroke-width="2" stroke-linecap="round"/></g>
<text x="80" y="200" font-size="11" text-anchor="middle" >pensions</text><text x="200" y="200" font-size="11" text-anchor="middle" >interest</text><text x="320" y="200" font-size="11" text-anchor="middle" >remittances</text>
</svg>
