<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Range bars of annual rainfall needed by wheat, sugarcane, rice and rubber</title><style>text{font-family:sans-serif;fill:#2B2F4A}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.88,1.14)}}.bu{animation:bu 2.4s linear infinite}@keyframes bu{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-52px);opacity:0}}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.45}to{opacity:1}}.wv{animation:wv 2s ease-in-out infinite}@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.sw{transform-box:fill-box;transform-origin:50% 100%;animation:sw 3s ease-in-out infinite alternate}@keyframes sw{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}.rn{animation:rn 1.1s linear infinite}@keyframes rn{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(22px);opacity:0}}.fw{stroke-dasharray:8 8;animation:fw 1s linear infinite}@keyframes fw{to{stroke-dashoffset:-16}}.gr{transform-box:fill-box;transform-origin:0 50%;animation:gr 3s ease-out infinite alternate}@keyframes gr{from{transform:scaleX(.15)}to{transform:scaleX(1)}}.gu{transform-box:fill-box;transform-origin:50% 100%;animation:gu 3s ease-out infinite alternate}@keyframes gu{from{transform:scaleY(.2)}to{transform:scaleY(1)}}.mv{animation:mv 3s ease-in-out infinite alternate}@keyframes mv{from{transform:translateX(0)}to{transform:translateX(18px)}}.sm{animation:sm 2.6s linear infinite}@keyframes sm{0%{transform:translateY(0) scale(.6);opacity:.8}100%{transform:translateY(-34px) scale(1.4);opacity:0}}</style><clipPath id="cl"><rect width="400" height="240" rx="16"/></clipPath><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><g clip-path="url(#cl)"><text x="200" y="24" font-size="14" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Annual rainfall needed (cm)</text><line x1="96.0" y1="40" x2="96.0" y2="206" stroke="#E5E7F0" stroke-width="1" stroke-linecap="round" /><text x="96.0" y="222" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >0</text><line x1="146.0" y1="40" x2="146.0" y2="206" stroke="#E5E7F0" stroke-width="1" stroke-linecap="round" /><text x="146.0" y="222" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >50</text><line x1="196.0" y1="40" x2="196.0" y2="206" stroke="#E5E7F0" stroke-width="1" stroke-linecap="round" /><text x="196.0" y="222" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >100</text><line x1="246.0" y1="40" x2="246.0" y2="206" stroke="#E5E7F0" stroke-width="1" stroke-linecap="round" /><text x="246.0" y="222" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >150</text><line x1="296.0" y1="40" x2="296.0" y2="206" stroke="#E5E7F0" stroke-width="1" stroke-linecap="round" /><text x="296.0" y="222" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >200</text><line x1="346.0" y1="40" x2="346.0" y2="206" stroke="#E5E7F0" stroke-width="1" stroke-linecap="round" /><text x="346.0" y="222" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >250</text><line x1="96" y1="206" x2="346.0" y2="206" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="48" y="63" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Wheat</text><rect x="146.0" y="45" width="25.0" height="26" rx="5" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" class="gr" style="animation-delay:0.0s"/><text x="48" y="105" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Sugarcane</text><rect x="171.0" y="87" width="25.0" height="26" rx="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" class="gr" style="animation-delay:0.2s"/><text x="48" y="147" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Rice</text><rect x="196.0" y="129" width="50.0" height="26" rx="5" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" class="gr" style="animation-delay:0.4s"/><path d="M250.0 142 h12 m-5 -6 l6 6 l-6 6" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="221.0" y="147" font-size="11" fill="#fff" text-anchor="middle" font-weight="700" >above 100</text><text x="48" y="189" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Rubber</text><rect x="296.0" y="171" width="50.0" height="26" rx="5" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2" class="gr" style="animation-delay:0.6000000000000001s"/><path d="M350.0 184 h12 m-5 -6 l6 6 l-6 6" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="321.0" y="189" font-size="11" fill="#fff" text-anchor="middle" font-weight="700" >above 200</text></g></svg>