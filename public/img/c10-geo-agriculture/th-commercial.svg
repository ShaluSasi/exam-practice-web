<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A tractor with sacks of fertiliser and high yielding variety seeds</title><style>text{font-family:sans-serif;fill:#2B2F4A}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.88,1.14)}}.bu{animation:bu 2.4s linear infinite}@keyframes bu{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-52px);opacity:0}}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.45}to{opacity:1}}.wv{animation:wv 2s ease-in-out infinite}@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.sw{transform-box:fill-box;transform-origin:50% 100%;animation:sw 3s ease-in-out infinite alternate}@keyframes sw{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}.rn{animation:rn 1.1s linear infinite}@keyframes rn{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(22px);opacity:0}}.fw{stroke-dasharray:8 8;animation:fw 1s linear infinite}@keyframes fw{to{stroke-dashoffset:-16}}.gr{transform-box:fill-box;transform-origin:0 50%;animation:gr 3s ease-out infinite alternate}@keyframes gr{from{transform:scaleX(.15)}to{transform:scaleX(1)}}.gu{transform-box:fill-box;transform-origin:50% 100%;animation:gu 3s ease-out infinite alternate}@keyframes gu{from{transform:scaleY(.2)}to{transform:scaleY(1)}}.mv{animation:mv 3s ease-in-out infinite alternate}@keyframes mv{from{transform:translateX(0)}to{transform:translateX(18px)}}.sm{animation:sm 2.6s linear infinite}@keyframes sm{0%{transform:translateY(0) scale(.6);opacity:.8}100%{transform:translateY(-34px) scale(1.4);opacity:0}}</style><clipPath id="cl"><rect width="200" height="150" rx="16"/></clipPath><rect width="100%" height="100%" rx="16" fill="#E3F2FD"/><g clip-path="url(#cl)"><rect x="0" y="96" width="200" height="54" fill="#A9D25A"/><path d="M0 96 H200" stroke="#2F8F46" stroke-width="3"/><rect x="20" y="76" width="70" height="26" rx="6" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" /><rect x="26" y="60" width="28" height="18" rx="4" fill="#FFD9A8" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="36" cy="106" r="15" fill="#2B2F4A" stroke="none" stroke-width="2" /><circle cx="36" cy="106" r="7" fill="#9AA0B5" stroke="none" stroke-width="2" /><circle cx="78" cy="110" r="10" fill="#2B2F4A" stroke="none" stroke-width="2" /><circle cx="78" cy="110" r="4" fill="#9AA0B5" stroke="none" stroke-width="2" /><rect x="110" y="92" width="34" height="38" rx="5" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><text x="127" y="114" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >NPK</text><rect x="150" y="100" width="34" height="30" rx="5" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><text x="167" y="119" font-size="10" fill="#2B2F4A" text-anchor="middle" font-weight="700" >HYV</text><path d="M0 140 H200" fill="none" stroke="#8B5A2B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></g></svg>