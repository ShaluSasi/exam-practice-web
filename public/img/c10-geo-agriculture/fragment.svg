<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>One plot divided between sons, then again between grandsons</title><style>text{font-family:sans-serif;fill:#2B2F4A}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.88,1.14)}}.bu{animation:bu 2.4s linear infinite}@keyframes bu{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-52px);opacity:0}}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.45}to{opacity:1}}.wv{animation:wv 2s ease-in-out infinite}@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.sw{transform-box:fill-box;transform-origin:50% 100%;animation:sw 3s ease-in-out infinite alternate}@keyframes sw{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}.rn{animation:rn 1.1s linear infinite}@keyframes rn{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(22px);opacity:0}}.fw{stroke-dasharray:8 8;animation:fw 1s linear infinite}@keyframes fw{to{stroke-dashoffset:-16}}.gr{transform-box:fill-box;transform-origin:0 50%;animation:gr 3s ease-out infinite alternate}@keyframes gr{from{transform:scaleX(.15)}to{transform:scaleX(1)}}.gu{transform-box:fill-box;transform-origin:50% 100%;animation:gu 3s ease-out infinite alternate}@keyframes gu{from{transform:scaleY(.2)}to{transform:scaleY(1)}}.mv{animation:mv 3s ease-in-out infinite alternate}@keyframes mv{from{transform:translateX(0)}to{transform:translateX(18px)}}.sm{animation:sm 2.6s linear infinite}@keyframes sm{0%{transform:translateY(0) scale(.6);opacity:.8}100%{transform:translateY(-34px) scale(1.4);opacity:0}}</style><clipPath id="cl"><rect width="400" height="240" rx="16"/></clipPath><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><g clip-path="url(#cl)"><rect x="20" y="40" width="110" height="90" rx="6" fill="#8DC768" stroke="#3FA34D" stroke-width="3" /><text x="75" y="28" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Grandfather</text><rect x="160" y="40" width="110" height="90" rx="6" fill="#8DC768" stroke="#3FA34D" stroke-width="3" /><line x1="215" y1="40" x2="215" y2="130" stroke="#3FA34D" stroke-width="3" stroke-linecap="round" /><text x="215" y="28" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Sons</text><rect x="290" y="40" width="100" height="90" rx="6" fill="#8DC768" stroke="#3FA34D" stroke-width="3" /><line x1="340" y1="40" x2="340" y2="130" stroke="#3FA34D" stroke-width="3" stroke-linecap="round" /><line x1="290" y1="85" x2="390" y2="85" stroke="#3FA34D" stroke-width="3" stroke-linecap="round" /><text x="340" y="28" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Grandsons</text><line x1="132" y1="85" x2="158" y2="85" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M150.1 89.3 L158 85 L150.1 80.7" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><line x1="272" y1="85" x2="288" y2="85" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M280.1 89.3 L288 85 L280.1 80.7" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="200" y="170" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Right of inheritance divides the land</text><text x="200" y="190" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >among successive generations</text><text x="200" y="216" font-size="12" fill="#E5484D" text-anchor="middle" font-weight="700" >Each share is smaller and may be uneconomical</text></g></svg>