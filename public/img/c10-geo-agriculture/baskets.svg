<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Two season cards: kharif with monsoon rain and rabi with winter sun</title><style>text{font-family:sans-serif;fill:#2B2F4A}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.88,1.14)}}.bu{animation:bu 2.4s linear infinite}@keyframes bu{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-52px);opacity:0}}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.45}to{opacity:1}}.wv{animation:wv 2s ease-in-out infinite}@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.sw{transform-box:fill-box;transform-origin:50% 100%;animation:sw 3s ease-in-out infinite alternate}@keyframes sw{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}.rn{animation:rn 1.1s linear infinite}@keyframes rn{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(22px);opacity:0}}.fw{stroke-dasharray:8 8;animation:fw 1s linear infinite}@keyframes fw{to{stroke-dashoffset:-16}}.gr{transform-box:fill-box;transform-origin:0 50%;animation:gr 3s ease-out infinite alternate}@keyframes gr{from{transform:scaleX(.15)}to{transform:scaleX(1)}}.gu{transform-box:fill-box;transform-origin:50% 100%;animation:gu 3s ease-out infinite alternate}@keyframes gu{from{transform:scaleY(.2)}to{transform:scaleY(1)}}.mv{animation:mv 3s ease-in-out infinite alternate}@keyframes mv{from{transform:translateX(0)}to{transform:translateX(18px)}}.sm{animation:sm 2.6s linear infinite}@keyframes sm{0%{transform:translateY(0) scale(.6);opacity:.8}100%{transform:translateY(-34px) scale(1.4);opacity:0}}</style><clipPath id="cl"><rect width="400" height="240" rx="16"/></clipPath><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><g clip-path="url(#cl)"><rect x="20" y="40" width="180" height="150" rx="14" fill="#fff" stroke="#0B93D4" stroke-width="3" /><rect x="20" y="40" width="180" height="32" rx="14" fill="#0B93D4" stroke="#0B93D4" stroke-width="3" /><text x="110" y="63" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >Kharif season</text><g transform="translate(110,112) scale(1.1)"><ellipse cx="0" cy="0" rx="26" ry="12" fill="#CFD8E3" stroke="#2B2F4A" stroke-width="2"/><circle cx="-10" cy="-8" r="11" fill="#CFD8E3" stroke="#2B2F4A" stroke-width="2"/><circle cx="8" cy="-11" r="13" fill="#CFD8E3" stroke="#2B2F4A" stroke-width="2"/><ellipse cx="0" cy="3" rx="24" ry="9" fill="#CFD8E3"/></g><line x1="80" y1="126" x2="77" y2="135" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" class="rn" style="animation-delay:0.00s"/><line x1="100" y1="126" x2="97" y2="135" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" class="rn" style="animation-delay:0.18s"/><line x1="120" y1="126" x2="117" y2="135" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" class="rn" style="animation-delay:0.36s"/><line x1="140" y1="126" x2="137" y2="135" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" class="rn" style="animation-delay:0.54s"/><text x="110" y="172" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >sown with the monsoon</text><rect x="216" y="40" width="180" height="150" rx="14" fill="#fff" stroke="#FF8A1F" stroke-width="3" /><rect x="216" y="40" width="180" height="32" rx="14" fill="#FF8A1F" stroke="#FF8A1F" stroke-width="3" /><text x="306" y="63" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >Rabi season</text><line x1="325.0" y1="112.0" x2="331.0" y2="112.0" stroke="#FFC83D" stroke-width="3" stroke-linecap="round" /><line x1="319.4350288425444" y1="125.4350288425444" x2="323.6776695296637" y2="129.6776695296637" stroke="#FFC83D" stroke-width="3" stroke-linecap="round" /><line x1="306.0" y1="131.0" x2="306.0" y2="137.0" stroke="#FFC83D" stroke-width="3" stroke-linecap="round" /><line x1="292.5649711574556" y1="125.4350288425444" x2="288.32233047033634" y2="129.6776695296637" stroke="#FFC83D" stroke-width="3" stroke-linecap="round" /><line x1="287.0" y1="112.0" x2="281.0" y2="112.0" stroke="#FFC83D" stroke-width="3" stroke-linecap="round" /><line x1="292.5649711574556" y1="98.5649711574556" x2="288.3223304703363" y2="94.32233047033631" stroke="#FFC83D" stroke-width="3" stroke-linecap="round" /><line x1="306.0" y1="93.0" x2="306.0" y2="87.0" stroke="#FFC83D" stroke-width="3" stroke-linecap="round" /><line x1="319.4350288425444" y1="98.56497115745559" x2="323.67766952966366" y2="94.32233047033631" stroke="#FFC83D" stroke-width="3" stroke-linecap="round" /><circle cx="306" cy="112" r="15" fill="#FFC83D" stroke="#FF8A1F" stroke-width="2" /><text x="306" y="172" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >sown in winter</text><text x="200" y="216" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Which crops belong to which season?</text></g></svg>