<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Two ring charts: oilseeds cover 12 percent of cropped area; groundnut is about half of major oilseeds</title><style>text{font-family:sans-serif;fill:#2B2F4A}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.88,1.14)}}.bu{animation:bu 2.4s linear infinite}@keyframes bu{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-52px);opacity:0}}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.45}to{opacity:1}}.wv{animation:wv 2s ease-in-out infinite}@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.sw{transform-box:fill-box;transform-origin:50% 100%;animation:sw 3s ease-in-out infinite alternate}@keyframes sw{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}.rn{animation:rn 1.1s linear infinite}@keyframes rn{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(22px);opacity:0}}.fw{stroke-dasharray:8 8;animation:fw 1s linear infinite}@keyframes fw{to{stroke-dashoffset:-16}}.gr{transform-box:fill-box;transform-origin:0 50%;animation:gr 3s ease-out infinite alternate}@keyframes gr{from{transform:scaleX(.15)}to{transform:scaleX(1)}}.gu{transform-box:fill-box;transform-origin:50% 100%;animation:gu 3s ease-out infinite alternate}@keyframes gu{from{transform:scaleY(.2)}to{transform:scaleY(1)}}.mv{animation:mv 3s ease-in-out infinite alternate}@keyframes mv{from{transform:translateX(0)}to{transform:translateX(18px)}}.sm{animation:sm 2.6s linear infinite}@keyframes sm{0%{transform:translateY(0) scale(.6);opacity:.8}100%{transform:translateY(-34px) scale(1.4);opacity:0}}</style><clipPath id="cl"><rect width="400" height="240" rx="16"/></clipPath><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><g clip-path="url(#cl)"><text x="200" y="24" font-size="14" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Oilseeds in India</text><circle cx="100" cy="130" r="52" fill="none" stroke="#E5E7F0" stroke-width="30"/><circle cx="100" cy="130" r="52" fill="none" stroke="#FF8A1F" stroke-width="30" stroke-dasharray="39.21 326.73" transform="rotate(-90 100 130)"/><text x="100" y="135" font-size="18" fill="#2B2F4A" text-anchor="middle" font-weight="700" >12%</text><text x="100" y="206" font-size="11.5" fill="#2B2F4A" text-anchor="middle" font-weight="700" >of total cropped area</text><text x="100" y="222" font-size="11.5" fill="#2B2F4A" text-anchor="middle" font-weight="700" >grows oilseeds</text><circle cx="300" cy="130" r="52" fill="none" stroke="#E5E7F0" stroke-width="30"/><circle cx="300" cy="130" r="52" fill="none" stroke="#3FA34D" stroke-width="30" stroke-dasharray="163.36 326.73" transform="rotate(-90 300 130)"/><text x="300" y="135" font-size="16" fill="#2B2F4A" text-anchor="middle" font-weight="700" >about ½</text><text x="300" y="206" font-size="11.5" fill="#2B2F4A" text-anchor="middle" font-weight="700" >of major oilseeds</text><text x="300" y="222" font-size="11.5" fill="#2B2F4A" text-anchor="middle" font-weight="700" >is groundnut</text></g></svg>