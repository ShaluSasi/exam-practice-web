<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Bar chart of months taken by cotton (6 to 8) and sugarcane (about 12) with a marker at 7 months</title><style>text{font-family:sans-serif;fill:#2B2F4A}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.88,1.14)}}.bu{animation:bu 2.4s linear infinite}@keyframes bu{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-52px);opacity:0}}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.45}to{opacity:1}}.wv{animation:wv 2s ease-in-out infinite}@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.sw{transform-box:fill-box;transform-origin:50% 100%;animation:sw 3s ease-in-out infinite alternate}@keyframes sw{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}.rn{animation:rn 1.1s linear infinite}@keyframes rn{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(22px);opacity:0}}.fw{stroke-dasharray:8 8;animation:fw 1s linear infinite}@keyframes fw{to{stroke-dashoffset:-16}}.gr{transform-box:fill-box;transform-origin:0 50%;animation:gr 3s ease-out infinite alternate}@keyframes gr{from{transform:scaleX(.15)}to{transform:scaleX(1)}}.gu{transform-box:fill-box;transform-origin:50% 100%;animation:gu 3s ease-out infinite alternate}@keyframes gu{from{transform:scaleY(.2)}to{transform:scaleY(1)}}.mv{animation:mv 3s ease-in-out infinite alternate}@keyframes mv{from{transform:translateX(0)}to{transform:translateX(18px)}}.sm{animation:sm 2.6s linear infinite}@keyframes sm{0%{transform:translateY(0) scale(.6);opacity:.8}100%{transform:translateY(-34px) scale(1.4);opacity:0}}</style><clipPath id="cl"><rect width="400" height="240" rx="16"/></clipPath><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><g clip-path="url(#cl)"><text x="200" y="24" font-size="14" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Months a crop occupies the field</text><line x1="90" y1="44" x2="90" y2="178" stroke="#E5E7F0" stroke-width="1" stroke-linecap="round" /><text x="90" y="196" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >0</text><line x1="134" y1="44" x2="134" y2="178" stroke="#E5E7F0" stroke-width="1" stroke-linecap="round" /><text x="134" y="196" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >2</text><line x1="178" y1="44" x2="178" y2="178" stroke="#E5E7F0" stroke-width="1" stroke-linecap="round" /><text x="178" y="196" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >4</text><line x1="222" y1="44" x2="222" y2="178" stroke="#E5E7F0" stroke-width="1" stroke-linecap="round" /><text x="222" y="196" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >6</text><line x1="266" y1="44" x2="266" y2="178" stroke="#E5E7F0" stroke-width="1" stroke-linecap="round" /><text x="266" y="196" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >8</text><line x1="310" y1="44" x2="310" y2="178" stroke="#E5E7F0" stroke-width="1" stroke-linecap="round" /><text x="310" y="196" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >10</text><line x1="354" y1="44" x2="354" y2="178" stroke="#E5E7F0" stroke-width="1" stroke-linecap="round" /><text x="354" y="196" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >12</text><text x="200" y="216" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >months</text><text x="40" y="84" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Cotton</text><rect x="90" y="68" width="132" height="30" rx="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" /><rect x="222" y="68" width="44" height="30" rx="5" fill="#B8E0BC" stroke="#2B2F4A" stroke-width="2" /><text x="304" y="88" font-size="11" fill="#2B2F4A" text-anchor="start" font-weight="700" >6 to 8 months</text><text x="36" y="140" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Sugarcane</text><rect x="90" y="124" width="264" height="30" rx="5" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" /><text x="310" y="144" font-size="11" fill="#fff" text-anchor="middle" font-weight="700" >almost a year</text><line x1="244" y1="50" x2="244" y2="176" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5"/><text x="244" y="44" font-size="11" fill="#E5484D" text-anchor="middle" font-weight="700" >210 days</text></g></svg>