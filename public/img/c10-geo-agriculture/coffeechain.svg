<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Three boxes in a chain: Yemen, Baba Budan Hills and Nilgiri with a coffee branch</title><style>text{font-family:sans-serif;fill:#2B2F4A}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.88,1.14)}}.bu{animation:bu 2.4s linear infinite}@keyframes bu{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-52px);opacity:0}}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.45}to{opacity:1}}.wv{animation:wv 2s ease-in-out infinite}@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.sw{transform-box:fill-box;transform-origin:50% 100%;animation:sw 3s ease-in-out infinite alternate}@keyframes sw{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}.rn{animation:rn 1.1s linear infinite}@keyframes rn{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(22px);opacity:0}}.fw{stroke-dasharray:8 8;animation:fw 1s linear infinite}@keyframes fw{to{stroke-dashoffset:-16}}.gr{transform-box:fill-box;transform-origin:0 50%;animation:gr 3s ease-out infinite alternate}@keyframes gr{from{transform:scaleX(.15)}to{transform:scaleX(1)}}.gu{transform-box:fill-box;transform-origin:50% 100%;animation:gu 3s ease-out infinite alternate}@keyframes gu{from{transform:scaleY(.2)}to{transform:scaleY(1)}}.mv{animation:mv 3s ease-in-out infinite alternate}@keyframes mv{from{transform:translateX(0)}to{transform:translateX(18px)}}.sm{animation:sm 2.6s linear infinite}@keyframes sm{0%{transform:translateY(0) scale(.6);opacity:.8}100%{transform:translateY(-34px) scale(1.4);opacity:0}}</style><clipPath id="cl"><rect width="400" height="240" rx="16"/></clipPath><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><g clip-path="url(#cl)"><text x="200" y="26" font-size="14" fill="#2B2F4A" text-anchor="middle" font-weight="700" >The journey of Arabica coffee</text><rect x="2" y="82" width="116" height="84" rx="14" fill="#fff" stroke="#FF8A1F" stroke-width="3" /><text x="60" y="110" font-size="12.5" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Yemen</text><text x="60" y="134" font-size="10.5" fill="#2B2F4A" text-anchor="middle" font-weight="700" >beans brought</text><text x="60" y="148" font-size="10.5" fill="#2B2F4A" text-anchor="middle" font-weight="700" >from</text><rect x="142" y="82" width="116" height="84" rx="14" fill="#fff" stroke="#3FA34D" stroke-width="3" /><text x="200" y="110" font-size="12.5" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Baba Budan Hills</text><text x="200" y="134" font-size="10.5" fill="#2B2F4A" text-anchor="middle" font-weight="700" >cultivation began</text><text x="200" y="148" font-size="10.5" fill="#2B2F4A" text-anchor="middle" font-weight="700" >here</text><rect x="282" y="82" width="116" height="84" rx="14" fill="#fff" stroke="#0B93D4" stroke-width="3" /><text x="340" y="110" font-size="12.5" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Nilgiri</text><text x="340" y="134" font-size="10.5" fill="#2B2F4A" text-anchor="middle" font-weight="700" >cultivation confined</text><text x="340" y="148" font-size="10.5" fill="#2B2F4A" text-anchor="middle" font-weight="700" >here today</text><line x1="120" y1="124" x2="140" y2="124" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M132.1 128.3 L140 124 L132.1 119.7" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><line x1="262" y1="124" x2="282" y2="124" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M274.1 128.3 L282 124 L274.1 119.7" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><g class="sw" style="animation-delay:0s"><line x1="200" y1="210" x2="200" y2="178.0" stroke="#7B5B3A" stroke-width=