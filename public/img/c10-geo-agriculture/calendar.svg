<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Calendar chart of rabi, kharif and zaid seasons across twelve months</title><style>text{font-family:sans-serif;fill:#2B2F4A}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.88,1.14)}}.bu{animation:bu 2.4s linear infinite}@keyframes bu{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-52px);opacity:0}}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.45}to{opacity:1}}.wv{animation:wv 2s ease-in-out infinite}@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.sw{transform-box:fill-box;transform-origin:50% 100%;animation:sw 3s ease-in-out infinite alternate}@keyframes sw{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}.rn{animation:rn 1.1s linear infinite}@keyframes rn{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(22px);opacity:0}}.fw{stroke-dasharray:8 8;animation:fw 1s linear infinite}@keyframes fw{to{stroke-dashoffset:-16}}.gr{transform-box:fill-box;transform-origin:0 50%;animation:gr 3s ease-out infinite alternate}@keyframes gr{from{transform:scaleX(.15)}to{transform:scaleX(1)}}.gu{transform-box:fill-box;transform-origin:50% 100%;animation:gu 3s ease-out infinite alternate}@keyframes gu{from{transform:scaleY(.2)}to{transform:scaleY(1)}}.mv{animation:mv 3s ease-in-out infinite alternate}@keyframes mv{from{transform:translateX(0)}to{transform:translateX(18px)}}.sm{animation:sm 2.6s linear infinite}@keyframes sm{0%{transform:translateY(0) scale(.6);opacity:.8}100%{transform:translateY(-34px) scale(1.4);opacity:0}}</style><clipPath id="cl"><rect width="400" height="240" rx="16"/></clipPath><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><g clip-path="url(#cl)"><text x="83.0" y="52" font-size="12" fi