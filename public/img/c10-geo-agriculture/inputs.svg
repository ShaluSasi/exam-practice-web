<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Four modern inputs used in commercial farming</title><style>text{font-family:sans-serif;fill:#2B2F4A}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.88,1.14)}}.bu{animation:bu 2.4s linear infinite}@keyframes bu{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-52px);opacity:0}}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.45}to{opacity:1}}.wv{animation:wv 2s ease-in-out infinite}@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.sw{transform-box:fill-box;transform-origin:50% 100%;animation:sw 3s ease-in-out infinite alternate}@keyframes sw{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}.rn{animation:rn 1.1s linear infinite}@keyframes rn{0%{transform:translateY(-6px);opacity:0}30%{opacity:1}100%{transform:translateY(22px);opacity:0}}.fw{stroke-dasharray:8 8;animation:fw 1s linear infinite}@keyframes fw{to{stroke-dashoffset:-16}}.gr{transform-box:fill-box;transform-origin:0 50%;animation:gr 3s ease-out infinite alternate}@keyframes gr{from{transform:scaleX(.15)}to{transform:scaleX(1)}}.gu{transform-box:fill-box;transform-origin:50% 100%;animation:gu 3s ease-out infinite alternate}@keyframes gu{from{transform:scaleY(.2)}to{transform:scaleY(1)}}.mv{animation:mv 3s ease-in-out infinite alternate}@keyframes mv{from{transform:translateX(0)}to{transform:translateX(18px)}}.sm{animation:sm 2.6s linear infinite}@keyframes sm{0%{transform:translateY(0) scale(.6);opacity:.8}100%{transform:translateY(-34px) scale(1.4);opacity:0}}</style><clipPath id="cl"><rect width="400" height="240" rx="16"/></clipPath><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><g clip-path="url(#cl)"><text x="200" y="26" font-size="14" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Modern inputs in commercial farming</text><rect x="20" y="44" width="170" height="76" rx="12" fill="#fff" stroke="#3FA34D" stroke-width="3" /><circle cx="50" cy="82" r="18" fill="#3FA34D" stroke="none" stroke-width="2" /><text x="50" y="87" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >A</text><text x="132" y="87" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >HYV seeds</text><rect x="210" y="44" width="170" height="76" rx="12" fill="#fff" stroke="#0B93D4" stroke-width="3" /><circle cx="240" cy="82" r="18" fill="#0B93D4" stroke="none" stroke-width="2" /><text x="240" y="87" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >N</text><text x="322" y="87" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Chemical fertilisers</text><rect x="20" y="132" width="170" height="76" rx="12" fill="#fff" stroke="#FF8A1F" stroke-width="3" /><circle cx="50" cy="170" r="18" fill="#FF8A1F" stroke="none" stroke-width="2" /><text x="50" y="175" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >I</text><text x="132" y="175" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Insecticides</text><rect x="210" y="132" width="170" height="76" rx="12" fill="#fff" stroke="#E5484D" stroke-width="3" /><circle cx="240" cy="170" r="18" fill="#E5484D" stroke="none" stroke-width="2" /><text x="240" y="175" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >P</text><text x="322" y="175" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Pesticides</text><text x="200" y="230" font-size="12" fill="#3FA34D" text-anchor="middle" font-weight="700" >Goal: higher productivity</text></g></svg>