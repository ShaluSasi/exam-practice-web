<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Camera and eye both form a real inverted image on a light-sensitive surface</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="100" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#2B2F4A" text-anchor="middle">Camera</text><text x="300" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#2B2F4A" text-anchor="middle">Human eye</text><rect x="62" y="66" width="128" height="108" rx="8" fill="#EDEFF7" stroke="#2B2F4A" stroke-width="3"/><rect x="176" y="82" width="14" height="76" rx="3" fill="#FFE3C2" stroke="#FF8A1F" stroke-width="3"/><ellipse cx="80" cy="120" rx="5" ry="26" fill="#BFE3F7" stroke="#0B93D4" stroke-width="3"/><line x1="14" y1="120" x2="14" y2="94" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/><polygon points="14,92 17.9,100.1 10.1,100.1" fill="#3FA34D"/><polyline points="14,94 183,160.6" fill="none" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polygon points="183,160.6 174,161.2 176.9,154" fill="#FF8A1F"/><polyline points="14,94 80,94 183,160.6" fill="none" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="fl"/><line x1="185" y1="120" x2="185" y2="160.6" stroke="#E5484D" stroke-width="5" stroke-linecap="round"/><text x="126" y="192" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle">lens + film</text><circle cx="318" cy="120" r="50" fill="#F7FBFF" stroke="#2B2F4A" stroke-width="3"/><path d="M274 96 Q256 120 274 144" fill="none" stroke="#0B93D4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="282" cy="120" rx="5" ry="22" fill="#BFE3F7" stroke="#0B93D4" stroke-width="3"/><path d="M344 84 A46 46 0 0 1 344 156" fill="none" stroke="#E5484D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="214" y1="120" x2="214" y2="100" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/><polygon points="214,98 217.9,106.1 210.1,106.1" fill="#3FA34D"/><polyline points="214,100 364,144.1" fill="none" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polygon points="364,144.1 355.1,145.6 357.3,138.1" fill="#FF8A1F"/><polyline points="214,100 282,100 364,144.1" fill="none" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="fl"/><line x1="364" y1="120" x2="364" y2="144.1" stroke="#E5484D" stroke-width="5" stroke-linecap="round"/><text x="300" y="192" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle">cornea + lens + retina</text><text x="200" y="222" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#E5484D" text-anchor="middle">Image is real and inverted</text><line x1="200" y1="40" x2="200" y2="205" stroke="#D9D4C7" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5"/>
</svg>
