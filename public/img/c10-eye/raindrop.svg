<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Sunlight entering a raindrop, splitting into colours, reflecting inside and leaving the drop</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="250" cy="100" r="64" fill="#E3F2FD" stroke="#0B93D4" stroke-width="3.5"/><polyline points="30,45.1 217,45.1" fill="none" stroke="#8A90A8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polygon points="217,45.1 208.9,49.1 208.9,41.2" fill="#8A90A8"/><line x1="30" y1="45.1" x2="217" y2="45.1" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/><polyline points="217,45.1 309,75.3 266,162" fill="none" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polyline points="266,162 222.5,206.2" fill="none" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polygon points="222.5,206.2 225.4,197.6 231,203.1" fill="#E5484D"/><polyline points="217,45.1 309.8,77.3 261.8,162.9" fill="none" stroke="#3FA34D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polyline points="261.8,162.9 215.5,204.1" fill="none" stroke="#3FA34D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polygon points="215.5,204.1 218.9,195.8 224.1,201.6" fill="#3FA34D"/><polyline points="217,45.1 310.9,80.4 255.1,163.8" fill="none" stroke="#8B2BE2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polyline points="255.1,163.8 204.7,199.9" fill="none" stroke="#8B2BE2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polygon points="204.7,199.9 209,192 213.6,198.3" fill="#8B2BE2"/><text x="80" y="33.1" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#B07A00" text-anchor="middle">Sunlight</text>
</svg>
