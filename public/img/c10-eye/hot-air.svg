<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 245" role="img">
<title>Light from an object wavering as it passes through the hot air rising above a flame</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}.fk{animation:fk .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom}@keyframes fk{to{transform:scaleY(1.2)}}.sh{animation:sh 1.4s ease-in-out infinite alternate}@keyframes sh{from{transform:translateX(-3px)}to{transform:translateX(3px)}}.gh{animation:gh 1.2s ease-in-out infinite alternate}@keyframes gh{from{transform:translate(-5px,-6px)}to{transform:translate(5px,6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
