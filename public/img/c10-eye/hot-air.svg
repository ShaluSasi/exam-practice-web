stroke-width="2.5" stroke-linejoin="round" opacity="0.35" class="gh"/><polyline points="100,98 160,98 180,90 200,106 220,92 240,104 262,98 322,98" fill="none" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="fl" opacity="0.9"/><polygon points="322,98 313.9,101.9 313.9,94.1" fill="#FF8A1F"/><ellipse cx="346" cy="98" rx="16" ry="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="346" cy="98" r="5" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1"/><text x="70" y="138" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle">Object</text><text x="346" y="126" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle">Observer</text><text x="210" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle">Hotter air: less dense, slightly lower refractive index</text><text x="210" y="234" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#9AA0B5" text-anchor="middle">Hot air keeps rising, so the apparent position wavers</text>
</svg>
