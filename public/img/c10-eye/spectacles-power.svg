<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 215" role="img">
<title>A concave lens of power -5.5 D and a convex lens of power +1.5 D</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M90 46 Q100 61.4 110 46 L110 134 Q100 118.6 90 134 Z" fill="#BFE3F7" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="160" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0B93D4" text-anchor="middle">Concave lens</text><text x="100" y="180" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#E5484D" text-anchor="middle">P = −5.5 D</text><text x="100" y="198" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#9AA0B5" text-anchor="middle">for distant vision</text><ellipse cx="300" cy="90" rx="14" ry="44" fill="#BFE3F7" stroke="#0B93D4" stroke-width="3"/><text x="300" y="160" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#0B93D4" text-anchor="middle">Convex lens</text><text x="300" y="180" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#3FA34D" text-anchor="middle">P = +1.5 D</text><text x="300" y="198" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#9AA0B5" text-anchor="middle">for near vision</text><text x="200" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="middle">One person, two lenses</text><polyline points="30,70 86,70 160,58" fill="none" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polygon points="160,58 152.6,63.2 151.4,55.4" fill="#FF8A1F"/><polyline points="30,110 86,110 160,122" fill="none" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polygon points="160,122 151.4,124.6 152.6,116.8" fill="#FF8A1F"/><polyline points="230,56 286,56 350,90" fill="none" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polygon points="350,90 341,89.7 344.7,82.7" fill="#FF8A1F"/><polyline points="230,124 286,124 350,90" fill="none" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polygon points="350,90 344.7,97.3 341,90.3" fill="#FF8A1F"/>
</svg>
