<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 215" role="img">
<title>Eye lens thin for distant objects and thick for near objects</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="100" y="22" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#2B2F4A" text-anchor="middle">Looking at a distant tree</text><text x="300" y="22" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#2B2F4A" text-anchor="middle">Looking at a nearby book</text><line x1="200" y1="34" x2="200" y2="215" stroke="#D9D4C7" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5"/><ellipse cx="80" cy="118" rx="6" ry="30" fill="#BFE3F7" stroke="#0B93D4" stroke-width="3"/><ellipse cx="80" cy="74" rx="20" ry="5" fill="#F29AB5" stroke="#C2557A" stroke-width="2"/><ellipse cx="80" cy="162" rx="20" ry="5" fill="#F29AB5" stroke="#C2557A" stroke-width="2"/><line x1="176" y1="80" x2="176" y2="156" stroke="#E5484D" stroke-width="5" stroke-linecap="round"/><polyline points="8,102 80,102 174,118" fill="none" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polygon points="174,118 165.4,120.5 166.7,112.8" fill="#FF8A1F"/><polyline points="8,134 80,134 174,118" fill="none" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polygon points="174,118 166.7,123.2 165.4,115.5" fill="#FF8A1F"/><polyline points="8,118 80,118 174,118" fill="none" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polygon points="174,118 165.9,121.9 165.9,114.1" fill="#FF8A1F"/><text x="100" y="186" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#7C5CFF" text-anchor="middle">Muscles relaxed</text><text x="100" y="202" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#2B2F4A" text-anchor="middle">Thin lens, long focal length</text><ellipse cx="284" cy="118" rx="14" ry="30" fill="#BFE3F7" stroke="#0B93D4" stroke-width="3"/><ellipse cx="284" cy="76" rx="11" ry="10" fill="#F29AB5" stroke="#C2557A" stroke-width="2"/><ellipse cx="284" cy="160" rx="11" ry="10" fill="#F29AB5" stroke="#C2557A" stroke-width="2"/><line x1="376" y1="80" x2="376" y2="156" stroke="#E5484D" stroke-width="5" stroke-linecap="round"/><rect x="212" y="109" width="22" height="18" rx="2" fill="#FFD7A8" stroke="#2B2F4A" stroke-width="2.5"/><line x1="223" y1="109" x2="223" y2="127" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><line x1="216" y1="114" x2="220" y2="114" stroke="#2B2F4A" stroke-width="1.5" stroke-linecap="round"/><line x1="226" y1="114" x2="230" y2="114" stroke="#2B2F4A" stroke-width="1.5" stroke-linecap="round"/><polyline points="240,118 284,100 374,118" fill="none" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polygon points="374,118 365.3,120.2 366.8,112.6" fill="#FF8A1F"/><polyline points="240,118 284,136 374,118" fill="none" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polygon points="374,118 366.8,123.4 365.3,115.8" fill="#FF8A1F"/><polyline points="240,118 284,118 374,118" fill="none" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polygon points="374,118 365.9,121.9 365.9,114.1" fill="#FF8A1F"/><text x="300" y="186" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#7C5CFF" text-anchor="middle">Muscles contract</text><text x="300" y="202" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#2B2F4A" text-anchor="middle">Thick lens, short focal length</text>
</svg>
