<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" role="img">
<title>A bi-focal lens: the upper part is used for a distant tree and the lower part for a book</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="200" cy="100" r="66" fill="#E9F6FE" stroke="#0B93D4" stroke-width="4"/><line x1="137" y1="100" x2="263" y2="100" stroke="#0B93D4" stroke-width="3" stroke-linecap="round"/><rect x="56.7" y="50.6" width="6.6" height="17.6" rx="1" fill="#8A5A2B" stroke="#6B4220" stroke-width="1.5"/><circle cx="60" cy="39.6" r="14.3" fill="#6CC070" stroke="#3FA34D" stroke-width="2"/><polyline points="88,52 130,64" fill="none" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polygon points="130,64 121.1,65.5 123.3,58" fill="#FF8A1F"/><rect x="320" y="112" width="30" height="22" rx="2" fill="#FFD7A8" stroke="#2B2F4A" stroke-width="2.5"/><line x1="335" y1="112" x2="335" y2="134" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><line x1="324" y1="117" x2="332" y2="117" stroke="#2B2F4A" stroke-width="1.5" stroke-linecap="round"/><line x1="338" y1="117" x2="346" y2="117" stroke="#2B2F4A" stroke-width="1.5" stroke-linecap="round"/><polyline points="312,140 270,132" fill="none" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polygon points="270,132 278.7,129.7 277.2,137.4" fill="#FF8A1F"/><text x="200" y="196" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#2B2F4A" text-anchor="middle">Bi-focal lens</text>
</svg>
