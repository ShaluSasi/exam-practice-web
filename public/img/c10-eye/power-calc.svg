<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" role="img">
<title>A myopic eye whose far point is 80 cm in front of it</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="52" cy="96" r="28" fill="#F7FBFF" stroke="#2B2F4A" stroke-width="3"/><ellipse cx="38" cy="96" rx="3" ry="12" fill="#BFE3F7" stroke="#0B93D4" stroke-width="2"/><circle cx="48" cy="96" r="6" fill="#1B1D2E" stroke="#1B1D2E" stroke-width="1"/><rect x="82" y="64" width="20" height="64" rx="4" fill="#F7FBFF" stroke="#0B93D4" stroke-width="2.5" stroke-dasharray="5 4"/><text x="92" y="102" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0B93D4" text-anchor="middle">?</text><line x1="110" y1="150" x2="380" y2="150" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><line x1="300" y1="138" x2="300" y2="162" stroke="#E5484D" stroke-width="4" stroke-linecap="round"/><text x="300" y="180" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#E5484D" text-anchor="middle">Far point</text><text x="300" y="196" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#E5484D" text-anchor="middle">80 cm</text><rect x="300" y="84" width="76" height="24" rx="4" fill="#FFD9D9" stroke="none" stroke-width="0" opacity="0.8"/><text x="338" y="101" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#E5484D" text-anchor="middle">blurred</text><rect x="112" y="84" width="188" height="24" rx="4" fill="#D5F0D9" stroke="none" stroke-width="0" opacity="0.9"/><text x="206" y="101" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#3FA34D" text-anchor="middle">clear vision</text><polyline points="118,74 292,74" fill="none" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="fl" opacity="0.9"/><polygon points="292,74 283.9,77.9 283.9,70.1" fill="#FF8A1F"/><text x="200" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="middle">A myopic person cannot see beyond 80 cm</text><text x="200" y="48" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#9AA0B5" text-anchor="middle">Which lens makes distant objects look as if they are at 80 cm?</text>
</svg>
