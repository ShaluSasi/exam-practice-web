<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img">
<title>bifocal lens</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="100" cy="62" r="44" fill="#E9F6FE" stroke="#0B93D4" stroke-width="3.5"/><line x1="58" y1="62" x2="142" y2="62" stroke="#0B93D4" stroke-width="3" stroke-linecap="round"/><text x="100" y="50" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#0B93D4" text-anchor="middle">concave</text><text x="100" y="82" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#0B93D4" text-anchor="middle">convex</text><text x="100" y="132" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle">Bi-focal lens</text>
</svg>
