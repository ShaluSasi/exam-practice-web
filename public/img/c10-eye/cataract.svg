<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 215" role="img">
<title>A normal eye with a clear lens beside an eye with a cloudy cataract lens</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="105" cy="100" r="56" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3"/><circle cx="105" cy="100" r="40" fill="#8A5A2B" stroke="#6B4220" stroke-width="3"/><circle cx="105" cy="100" r="22" fill="#1B1D2E" stroke="#1B1D2E" stroke-width="1"/><circle cx="98" cy="94" r="4" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><text x="105" y="186" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#3FA34D" text-anchor="middle">Clear lens</text><text x="105" y="204" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#9AA0B5" text-anchor="middle">light passes through</text><circle cx="295" cy="100" r="56" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3"/><circle cx="295" cy="100" r="40" fill="#8A5A2B" stroke="#6B4220" stroke-width="3"/><circle cx="295" cy="100" r="22" fill="#E8E6DF" stroke="#BDB9AD" stroke-width="2"/><circle cx="289" cy="96" r="12" fill="#FFFFFF" stroke="none" stroke-width="0" opacity="0.8" class="bl"/><circle cx="302" cy="106" r="9" fill="#F4F2EB" stroke="none" stroke-width="0" opacity="0.9"/><text x="295" y="186" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#E5484D" text-anchor="middle">Cloudy lens</text><text x="295" y="204" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#9AA0B5" text-anchor="middle">light is blocked</text><text x="200" y="18" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#9AA0B5" text-anchor="middle">Pupil seen from the front</text>
</svg>
