<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
<title>A glass slab gives a parallel emergent ray while a prism bends the ray</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="100" y="22" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#2B2F4A" text-anchor="middle">Glass slab</text><text x="300" y="22" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#2B2F4A" text-anchor="middle">Triangular prism</text><rect x="70" y="55" width="70" height="110" rx="2" fill="#E6F4FC" stroke="#0B93D4" stroke-width="4"/><polyline points="10,72 70,97" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polyline points="70,97 140,116" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polyline points="140,116 190,137" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polygon points="190,137 181,137.5 184,130.3" fill="#FF8A1F"/><line x1="70" y1="97" x2="140" y2="126.4" stroke="#FF8A1F" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.6"/><line x1="140" y1="126.4" x2="190" y2="147.4" stroke="#FF8A1F" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.6"/><text x="100" y="190" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#3FA34D" text-anchor="middle">Emergent ray is parallel</text><text x="100" y="206" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#3FA34D" text-anchor="middle">to the incident ray</text><polygon points="300,48 244,162 356,162" fill="#E6F4FC" stroke="#0B93D4" stroke-width="4" stroke-linejoin="round"/><polyline points="214,128 272,105" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polyline points="272,105 328,105" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polyline points="328,105 386,128" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polygon points="386,128 377,128.7 379.9,121.4" fill="#FF8A1F"/><line x1="214" y1="128" x2="384" y2="128" stroke="#9AA0B5" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4"/><text x="300" y="190" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#E5484D" text-anchor="middle">Emergent ray is bent</text><text x="300" y="206" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#E5484D" text-anchor="middle">towards the base</text><line x1="200" y1="34" x2="200" y2="215" stroke="#D9D4C7" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5"/>
</svg>
