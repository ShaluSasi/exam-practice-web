<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img">
<title>Thick eye lens with relaxed ciliary muscles</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<ellipse cx="100" cy="70" rx="17" ry="34" fill="#BFE3F7" stroke="#0B93D4" stroke-width="3"/><ellipse cx="100" cy="28" rx="30" ry="6" fill="#F29AB5" stroke="#C2557A" stroke-width="2.5"/><ellipse cx="100" cy="112" rx="30" ry="6" fill="#F29AB5" stroke="#C2557A" stroke-width="2.5"/><text x="100" y="143" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#2B2F4A" text-anchor="middle">Thick lens, muscles relaxed</text>
</svg>
