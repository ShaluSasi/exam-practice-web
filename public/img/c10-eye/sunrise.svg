<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>At sunrise atmospheric refraction lifts the Sun's apparent position above its actual position</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="0" y="0" width="400" height="178" fill="#FFE9C9"/><text x="30" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#B07A00" text-anchor="start">Earth's atmosphere</text><rect x="0" y="178" width="400" height="62" fill="#4F9B53"/><line x1="0" y1="178" x2="400" y2="178" stroke="#2F6E34" stroke-width="3" stroke-linecap="round"/><circle cx="78" cy="196" r="20" fill="#FFD60A" stroke="#FFFFFF" stroke-width="2.5" fill-opacity="0.35" stroke-dasharray="4 3"/><polyline points="78,196 170,160 262,154 345,168" fill="none" stroke="#E06A00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polygon points="345,168 336.4,170.5 337.7,162.8" fill="#E06A00"/><line x1="345" y1="168" x2="105" y2="127.4" stroke="#E06A00" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5" opacity="0.7"/><ellipse cx="105" cy="127" rx="24" ry="18" fill="#FFD60A" stroke="#F2A900" stroke-width="3" class="pu"/><circle cx="345" cy="160" r="6" fill="#FFD7A8" stroke="#2B2F4A" stroke-width="2"/><path d="M337 178 L345 166 L353 178Z" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="345" y="205" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Observer</text><text x="108" y="225" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#FFFFFF" text-anchor="start">Actual Sun, just below the horizon</text>
</svg>
