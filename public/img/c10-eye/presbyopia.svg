<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img">
<title>A book that must be held farther away as the eye ages</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}.mv{animation:mv 4s ease-in-out infinite alternate}@keyframes mv{from{transform:translateX(-130px)}to{transform:translateX(0)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="54" cy="100" r="30" fill="#F7FBFF" stroke="#2B2F4A" stroke-width="3"/><ellipse cx="40" cy="100" rx="3" ry="13" fill="#BFE3F7" stroke="#0B93D4" stroke-width="2"/><circle cx="50" cy="100" r="6" fill="#1B1D2E" stroke="#1B1D2E" stroke-width="1"/><line x1="84" y1="160" x2="380" y2="160" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><line x1="138" y1="150" x2="138" y2="170" stroke="#3FA34D" stroke-width="3" stroke-linecap="round"/><text x="138" y="188" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#3FA34D" text-anchor="middle">25 cm</text><line x1="268" y1="150" x2="268" y2="170" stroke="#E5484D" stroke-width="3" stroke-linecap="round"/><text x="268" y="188" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#E5484D" text-anchor="middle">about 60 cm</text><g class="mv"><rect x="256" y="88" width="28" height="22" rx="2" fill="#FFD7A8" stroke="#2B2F4A" stroke-width="2.5"/><line x1="270" y1="88" x2="270" y2="110" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><line x1="260" y1="93" x2="267" y2="93" stroke="#2B2F4A" stroke-width="1.5" stroke-linecap="round"/><line x1="273" y1="93" x2="280" y2="93" stroke="#2B2F4A" stroke-width="1.5" stroke-linecap="round"/></g><rect x="126" y="88" width="28" height="22" rx="2" fill="#FFD7A8" stroke="#9AA0B5" stroke-width="2.5"/><line x1="140" y1="88" x2="140" y2="110" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round"/><line x1="130" y1="93" x2="137" y2="93" stroke="#9AA0B5" stroke-width="1.5" stroke-linecap="round"/><line x1="143" y1="93" x2="150" y2="93" stroke="#9AA0B5" stroke-width="1.5" stroke-linecap="round"/><polyline points="88,100 118,100" fill="none" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="fl" opacity="0.7"/><polygon points="118,100 109.9,103.9 109.9,96.1" fill="#FF8A1F"/><text x="200" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#2B2F4A" text-anchor="middle">With age the near point recedes</text><text x="54" y="150" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle">Older eye</text><text x="200" y="212" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#7C5CFF" text-anchor="middle">Ciliary muscles weaken, lens loses flexibility</text>
</svg>
