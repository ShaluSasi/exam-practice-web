<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Starlight bending towards the normal in the atmosphere so the star seems higher than it really is</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#1E2340"/>
<rect x="0" y="70" width="400" height="33.5" fill="#8EC9F0" opacity="0.12"/><rect x="0" y="103" width="400" height="33.5" fill="#8EC9F0" opacity="0.2"/><rect x="0" y="136" width="400" height="33.5" fill="#8EC9F0" opacity="0.3"/><rect x="0" y="169" width="400" height="33.5" fill="#8EC9F0" opacity="0.42"/><rect x="0" y="202.5" width="400" height="38" fill="#4F9B53"/><polyline points="162.7,30 216,70 260,103 296.7,136 326.7,169 350.3,202" fill="none" stroke="#FFD60A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polygon points="350.3,202 342.4,197.7 348.8,193.1" fill="#FFD60A"/><line x1="350.3" y1="202" x2="227.4" y2="30" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5" opacity="0.7"/><polygon points="162.7,19 165.4,26.3 173.1,26.6 167.1,31.4 169.1,38.9 162.7,34.6 156.2,38.9 158.3,31.4 152.2,26.6 160,26.3" fill="#FFD60A" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/><polygon points="227.4,19 230.2,26.3 237.9,26.6 231.8,31.4 233.9,38.9 227.4,34.6 221,38.9 223,31.4 217,26.6 224.7,26.3" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="3 3" class="bl"/><circle cx="350" cy="192" r="6" fill="#FFD7A8" stroke="#FFFFFF" stroke-width="2"/><path d="M342 204 L350 196 L358 204Z" fill="#E5484D" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="88" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="start">Earth's atmosphere</text><text x="30" y="126" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#CFE8FA" text-anchor="start">denser lower down</text><text x="300" y="228" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Observer</text>
</svg>
