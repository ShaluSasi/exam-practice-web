<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 222" role="img">
<title>Three eyes: normal, myopic and hypermetropic, showing where the image forms</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="78" cy="100" r="40" fill="#F7FBFF" stroke="#2B2F4A" stroke-width="2.5"/><path d="M45 80 Q26 100 45 120" fill="none" stroke="#0B93D4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="53" cy="100" rx="4.5" ry="20" fill="#BFE3F7" stroke="#0B93D4" stroke-width="2.5"/><path d="M98 65.6 A37 37 0 0 1 98 134.4" fill="none" stroke="#E5484D" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0,91 53,91 114,100" fill="none" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polygon points="114,100 105.4,102.7 106.6,94.9" fill="#FF8A1F"/><polyline points="0,109 53,109 114,100" fill="none" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polygon points="114,100 106.6,105.1 105.4,97.3" fill="#FF8A1F"/><text x="78" y="170" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#2B2F4A" text-anchor="middle">Normal eye</text><text x="78" y="187" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#9AA0B5" text-anchor="middle">image on retina</text><circle cx="214" cy="100" r="40" fill="#F7FBFF" stroke="#2B2F4A" stroke-width="2.5"/><path d="M181 80 Q162 100 181 120" fill="none" stroke="#0B93D4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="189" cy="100" rx="4.5" ry="20" fill="#BFE3F7" stroke="#0B93D4" stroke-width="2.5"/><path d="M234 65.6 A37 37 0 0 1 234 134.4" fill="none" stroke="#E5484D" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="136,91 189,91 250,108.5" fill="none" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polygon points="250,108.5 241.1,110 243.3,102.5" fill="#FF8A1F"/><polyline points="136,109 189,109 250,91.5" fill="none" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polygon points="250,91.5 243.3,97.5 241.1,90" fill="#FF8A1F"/><text x="214" y="170" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#2B2F4A" text-anchor="middle">Myopia</text><text x="214" y="187" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#9AA0B5" text-anchor="middle">image in front of retina</text><circle cx="340" cy="100" r="40" fill="#F7FBFF" stroke="#2B2F4A" stroke-width="2.5"/><path d="M307 80 Q288 100 307 120" fill="none" stroke="#0B93D4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="315" cy="100" rx="4.5" ry="20" fill="#BFE3F7" stroke="#0B93D4" stroke-width="2.5"/><path d="M360 65.6 A37 37 0 0 1 360 134.4" fill="none" stroke="#E5484D" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="262,100 315,94 376,98.3" fill="none" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polygon points="376,98.3 367.6,101.6 368.2,93.8" fill="#FF8A1F"/><polyline points="376,98.3 402.5,100" fill="none" stroke="#FF8A1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3" opacity="0.5"/><polyline points="262,100 315,106 376,101.7" fill="none" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polygon points="376,101.7 368.2,106.2 367.6,98.4" fill="#FF8A1F"/><polyline points="376,101.7 402.5,100" fill="none" stroke="#FF8A1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3" opacity="0.5"/><text x="340" y="170" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#2B2F4A" text-anchor="middle">Hypermetropia</text><text x="340" y="187" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#9AA0B5" text-anchor="middle">image behind retina</text><text x="214" y="212" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#9AA0B5" text-anchor="middle">Normal and myopic: distant object   |   Hypermetropic: near object</text>
</svg>
