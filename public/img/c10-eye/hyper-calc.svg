<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" role="img">
<title>A hypermetropic eye with near point at 1 m and a book held at 25 cm</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="36" cy="56" r="24" fill="#F7FBFF" stroke="#2B2F4A" stroke-width="3"/><ellipse cx="22" cy="56" rx="3" ry="10" fill="#BFE3F7" stroke="#0B93D4" stroke-width="2"/><circle cx="32" cy="56" r="5" fill="#1B1D2E" stroke="#1B1D2E" stroke-width="1"/><ellipse cx="82" cy="56" rx="8" ry="22" fill="#BFE3F7" stroke="#0B93D4" stroke-width="3"/><line x1="56" y1="150" x2="380" y2="150" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><line x1="100" y1="138" x2="100" y2="162" stroke="#3FA34D" stroke-width="4" stroke-linecap="round"/><text x="100" y="180" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#3FA34D" text-anchor="middle">N′: 25 cm</text><text x="100" y="196" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#9AA0B5" text-anchor="middle">normal near point</text><line x1="292" y1="138" x2="292" y2="162" stroke="#E5484D" stroke-width="4" stroke-linecap="round"/><text x="292" y="180" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#E5484D" text-anchor="middle">N: 1 m</text><text x="292" y="196" font-family="system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#9AA0B5" text-anchor="middle">near point of this eye</text><rect x="89" y="110" width="22" height="18" rx="2" fill="#FFD7A8" stroke="#2B2F4A" stroke-width="2.5"/><line x1="100" y1="110" x2="100" y2="128" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><line x1="93" y1="115" x2="97" y2="115" stroke="#2B2F4A" stroke-width="1.5" stroke-linecap="round"/><line x1="103" y1="115" x2="107" y2="115" stroke="#2B2F4A" stroke-width="1.5" stroke-linecap="round"/><rect x="281" y="110" width="22" height="18" rx="2" fill="#F3EEE6" stroke="#9AA0B5" stroke-width="2.5"/><line x1="292" y1="110" x2="292" y2="128" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round"/><line x1="285" y1="115" x2="289" y2="115" stroke="#9AA0B5" stroke-width="1.5" stroke-linecap="round"/><line x1="295" y1="115" x2="299" y2="115" stroke="#9AA0B5" stroke-width="1.5" stroke-linecap="round"/><text x="100" y="102" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#3FA34D" text-anchor="middle">book here</text><text x="292" y="102" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#E5484D" text-anchor="middle">image must appear here</text><polyline points="116,120 276,120" fill="none" stroke="#7C5CFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" opacity="0.8"/><polygon points="276,120 267.9,123.9 267.9,116.1" fill="#7C5CFF"/><text x="200" y="24" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#2B2F4A" text-anchor="middle">Spectacle lens: object at 25 cm, virtual image at 1 m</text>
</svg>
