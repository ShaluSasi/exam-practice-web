<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A worker fully busy at a machine</title><style>.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.t{font-family:system-ui,sans-serif;fill:#2B2F4A}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.drive{animation:drive 4s ease-in-out infinite alternate}@keyframes drive{0%{transform:translateX(0)}100%{transform:translateX(26px)}}.flow{stroke-dasharray:7 6;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}.puff{animation:puff 2.8s ease-in infinite;transform-box:fill-box;transform-origin:center}@keyframes puff{0%{transform:translate(0,0) scale(.6);opacity:.9}100%{transform:translate(6px,-22px) scale(1.3);opacity:0}}.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFFFFF"/><g transform="translate(60 74) scale(1.6)" ><g ><path d="M-10 22V2Q-10 -8 0 -8Q10 -8 10 2V22Z" fill="#3FA34D" class="o" /><circle cx="0" cy="-16" r="7" fill="#F6C79B" class="o" /><path d="M-7 -20Q0 -30 7 -20Z" fill="#FFD23F" class="o" /></g></g><g transform="translate(140 76) scale(1.6)" ><circle cx="0" cy="0" r="14" fill="#9AA3AE" class="o" /><circle cx="0" cy="0" r="5" fill="#FFFFFF" class="o" /><path d="M0 14L0.0 18.900000000000002" fill="none" class="o" stroke-width="6"/><path d="M0 -14L0.0 -18.900000000000002" fill="none" class="o" stroke-width="6"/><path d="M14 0L18.900000000000002 0.0" fill="none" class="o" stroke-width="6"/><path d="M-14 0L-18.900000000000002 0.0" fill="none" class="o" stroke-width="6"/></g><text x="100" y="134" class="t" font-size="11" font-weight="500" text-anchor="middle" fill="#2B2F4A" >fully employed</text></svg>