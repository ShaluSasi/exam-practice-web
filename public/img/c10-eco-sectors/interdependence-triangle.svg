<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Primary, secondary and tertiary sectors depend on one another</title><style>.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.t{font-family:system-ui,sans-serif;fill:#2B2F4A}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.drive{animation:drive 4s ease-in-out infinite alternate}@keyframes drive{0%{transform:translateX(0)}100%{transform:translateX(26px)}}.flow{stroke-dasharray:7 6;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}.puff{animation:puff 2.8s ease-in infinite;transform-box:fill-box;transform-origin:center}@keyframes puff{0%{transform:translate(0,0) scale(.6);opacity:.9}100%{transform:translate(6px,-22px) scale(1.3);opacity:0}}.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M236.0 80.0L296.0 144.0" class="flow" fill="none" stroke="#0B93D4" stroke-width="3.5" stroke-linecap="round"/><path d="M287.5 141.2L296.0 144.0L293.7 135.3" fill="none" stroke="#0B93D4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M284.0 190.0L130.0 190.0" class="flow" fill="none" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/><path d="M137.9 185.7L130.0 190.0L137.9 194.3" fill="none" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M96.0 146.0L168.0 80.0" class="flow" fill="none" stroke="#3FA34D" stroke-width="3.5" stroke-linecap="round"/><path d="M165.1 88.5L168.0 80.0L159.3 82.2" fill="none" stroke="#3FA34D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="150" y="12" width="100" height="90" rx="12" fill="#FFFFFF" stroke="#E2D6BC" stroke-width="2"/><g transform="translate(200 50) scale(0.9)" ><path d="M-28 24H28" fill="none" class="o" /><rect x="-30" y="16" width="60" height="10" rx="3" fill="#A9743F" class="o" /><path d="M0 16V-6M-8 6L-12 -4M8 6L12 -2" fill="none" class="o" stroke="#3FA34D"/><circle cx="-12" cy="-10" r="8" fill="#FFFFFF" class="o" /><circle cx="0" cy="-16" r="8" fill="#FFFFFF" class="o" /><circle cx="12" cy="-8" r="8" fill="#FFFFFF" class="o" /></g><text x="200" y="92" class="t" font-size="12" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Primary</text><rect x="270" y="130" width="110" height="100" rx="12" fill="#FFFFFF" stroke="#E2D6BC" stroke-width="2"/><g transform="translate(325 168) scale(0.9)" ><rect x="10" y="-22" width="10" height="34" rx="2" fill="#B5654A" class="o" /><path d="M-28 24V-4L-12 -12V-4L2 -12V-4L16 -12V24Z" fill="#E8B04A" class="o" /><rect x="-22" y="6" width="10" height="18" rx="2" fill="#FFFFFF" class="o" /><rect x="-4" y="4" width="10" height="10" rx="2" fill="#E3F2FD" class="o" /><circle class="puff" cx="14" cy="-20" r="5" fill="#C9CED6" style="animation-delay:0s"/><circle class="puff" cx="14" cy="-20" r="5" fill="#C9CED6" style="animation-delay:1.4s"/></g><text x="325" y="220" class="t" font-size="12" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Secondary</text><rect x="20" y="130" width="110" height="100" rx="12" fill="#FFFFFF" stroke="#E2D6BC" stroke-width="2"/><g transform="translate(75 168) scale(0.9)" ><rect x="-30" y="-14" width="38" height="26" rx="3" fill="#FF8A1F" class="o" /><path d="M8 -6H20L30 4V12H8Z" fill="#FFFFFF" class="o" /><g class="bob"><circle cx="-18" cy="14" r="7" fill="#2B2F4A" class="o" /><circle cx="18" cy="14" r="7" fill="#2B2F4A" class="o" /></g><circle cx="-18" cy="14" r="2.5" fill="