<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Hospitals, transport, eating out and tourism, IT services</title><style>.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.t{font-family:system-ui,sans-serif;fill:#2B2F4A}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.drive{animation:drive 4s ease-in-out infinite alternate}@keyframes drive{0%{transform:translateX(0)}100%{transform:translateX(26px)}}.flow{stroke-dasharray:7 6;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}.puff{animation:puff 2.8s ease-in infinite;transform-box:fill-box;transform-origin:center}@keyframes puff{0%{transform:translate(0,0) scale(.6);opacity:.9}100%{transform:translate(6px,-22px) scale(1.3);opacity:0}}.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="16.0" y="16.0" width="180.0" height="100.0" rx="12" fill="#FFFFFF" stroke="#E2D6BC" stroke-width="2"/><g transform="translate(106.0 58.0) scale(0.95)" ><rect x="-26" y="-16" width="52" height="38" rx="3" fill="#FFFFFF" class="o" /><rect x="-4" y="-12" width="8" height="20" rx="1" fill="#E5484D" class="o" /><rect x="-10" y="-6" width="20" height="8" rx="1" fill="#E5484D" class="o" /><rect x="-6" y="12" width="12" height="10" rx="1" fill="#B9DDF2" class="o" /></g><text x="106.0" y="106.0" class="t" font-size="12" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Basic services</text><rect x="204.0" y="16.0" width="180.0" height="100.0" rx="12" fill="#FFFFFF" stroke="#E2D6BC" stroke-width="2"/><g transform="translate(294.0 58.0) scale(0.85)" ><rect x="-30" y="-14" width="38" height="26" rx="3" fill="#FF8A1F" class="o" /><path d="M8 -6H20L30 4V12H8Z" fill="#FFFFFF" class="o" /><g class="bob"><circle cx="-18" cy="14" r="7" fill="#2B2F4A" class="o" /><circle cx="18" cy="14" r="7" fill="#2B2F4A" class="o" /></g><circle cx="-18" cy="14" r="2.5" fill="#FFFFFF" class="o" /><circle cx="18" cy="14" r="2.5" fill="#FFFFFF" class="o" /></g><text x="294.0" y="106.0" class="t" font-size="12" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Trade and transport</text><rect x="16.0" y="124.0" width="180.0" height="100.0" rx="12" fill="#FFFFFF" stroke="#E2D6BC" stroke-width="2"/><g transform="translate(106.0 166.0) scale(1.0)" ><rect x="-22" y="-10" width="44" height="30" rx="5" fill="#FFFFFF" class="o" /><path d="M-10 -10V-18H10V-10" fill="none" class="o" /></g><text x="106.0" y="214.0" class="t" font-size="12" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Tourism, eating out</text><rect x="204.0" y="124.0" width="180.0" height="100.0" rx="12" fill="#FFFFFF" stroke="#E2D6BC" stroke-width="2"/><g transform="translate(294.0 166.0) scale(1.0)" ><rect x="-24" y="-20" width="48" height="30" rx="4" fill="#2B2F4A" class="o" /><rect x="-20" y="-16" width="40" height="22" rx="2" fill="#E3F2FD" class="o" /><path d="M-30 14H30L24 10H-24Z" fill="#C9CED6" class="o" /></g><text x="294.0" y="214.0" class="t" font-size="12" font-weight="600" text-anchor="middle" fill="#2B2F4A" >IT services</text></svg>