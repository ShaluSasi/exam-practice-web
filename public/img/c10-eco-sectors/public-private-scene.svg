<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Five places: a train, a post box, a dam, a steel works and a ration shop</title><style>.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.t{font-family:system-ui,sans-serif;fill:#2B2F4A}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.drive{animation:drive 4s ease-in-out infinite alternate}@keyframes drive{0%{transform:translateX(0)}100%{transform:translateX(26px)}}.flow{stroke-dasharray:7 6;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}.puff{animation:puff 2.8s ease-in infinite;transform-box:fill-box;transform-origin:center}@keyframes puff{0%{transform:translate(0,0) scale(.6);opacity:.9}100%{transform:translate(6px,-22px) scale(1.3);opacity:0}}.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="12" y="20" width="116" height="100" rx="12" fill="#FFFFFF" stroke="#E2D6BC" stroke-width="2"/><g transform="translate(70 72) scale(0.9)" ><rect x="-30" y="-20" width="54" height="32" rx="6" fill="#0B93D4" class="o" /><rect x="-24" y="-14" width="12" height="12" rx="2" fill="#FFFFFF" class="o" /><rect x="-8" y="-14" width="12" height="12" rx="2" fill="#FFFFFF" class="o" /><path d="M24 -6H34V12H24Z" fill="#FF8A1F" class="o" /><circle cx="-18" cy="16" r="6" fill="#2B2F4A" class="o" /><circle cx="-2" cy="16" r="6" fill="#2B2F4A" class="o" /><circle cx="16" cy="16" r="6" fill="#2B2F4A" class="o" /><path d="M-34 24H38" fill="none" class="o" /></g><rect x="142" y="20" width="116" height="100" rx="12" fill="#FFFFFF" stroke="#E2D6BC" stroke-width="2"/><g transform="translate(200 72) scale(1.0)" ><rect x="-14" y="-22" width="28" height="44" rx="6" fill="#E5484D" class="o" /><rect x="-8" y="-10" width="16" height="4" rx="1" fill="#2B2F4A" class="o" /><rect x="-4" y="22" width="8" height="6" rx="1" fill="#9AA3AE" class="o" /></g><rect x="272" y="20" width="116" height="100" rx="12" fill="#FFFFFF" stroke="#E2D6BC" stroke-width="2"/><g transform="translate(330 72) scale(1.0)" ><path d="M-30 24V-14H0L14 24Z" fill="#B9B4A8" class="o" /><path d="M14 24L0 -14H30V24Z" fill="#6EC1E4" class="o" /><path class="flow" d="M10 -4Q16 6 14 18" fill="none" stroke="#FFFFFF" stroke-width="3"/></g><rect x="77" y="120" width="116" height="100" rx="12" fill="#FFFFFF" stroke="#E2D6BC" stroke-width="2"/><g transform="translate(135 172) scale(1.05)" ><rect x="-28" y="-4" width="56" height="28" rx="3" fill="#8E99A8" class="o" /><rect x="-20" y="-26" width="10" height="22" rx="2" fill="#6B7482" class="o" /><rect x="0" y="-20" width="10" height="16" rx="2" fill="#6B7482" class="o" /><path d="M14 24V8H26V24" fill="#FF8A1F" class="o" /><circle class="puff" cx="-15" cy="-30" r="5" fill="#C9CED6"/></g><rect x="207" y="120" width="116" height="100" rx="12" fill="#FFFFFF" stroke="#E2D6BC" stroke-width="2"/><g transform="translate(265 172) scale(1.0)" ><rect x="-26" y="2" width="52" height="24" rx="2" fill="#FFFFFF" class="o" /><path d="M-30 -12H30L26 2H-26Z" fill="#FF8A1F" class="o" /><rect x="-8" y="8" width="16" height="18" rx="2" fill="#B9DDF2" class="o" /><path d="M-18 -12V2M-6 -12V2M6 -12V2M18 -12V2" fill="none" class="o" stroke="#FFFFFF" stroke-width="2"/></g></svg>