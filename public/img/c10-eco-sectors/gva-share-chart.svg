<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>GVA of the three sectors in 2021-22, in lakh crore rupees</title><style>.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.t{font-family:system-ui,sans-serif;fill:#2B2F4A}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.drive{animation:drive 4s ease-in-out infinite alternate}@keyframes drive{0%{transform:translateX(0)}100%{transform:translateX(26px)}}.flow{stroke-dasharray:7 6;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}.puff{animation:puff 2.8s ease-in infinite;transform-box:fill-box;transform-origin:center}@keyframes puff{0%{transform:translate(0,0) scale(.6);opacity:.9}100%{transform:translate(6px,-22px) scale(1.3);opacity:0}}.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M70 190.0H370" stroke="#D6CDB8" stroke-width="1"/><text x="64" y="194.0" class="t" font-size="10" text-anchor="end">0</text><path d="M70 150.0H370" stroke="#D6CDB8" stroke-width="1"/><text x="64" y="154.0" class="t" font-size="10" text-anchor="end">20</text><path d="M70 110.0H370" stroke="#D6CDB8" stroke-width="1"/><text x="64" y="114.0" class="t" font-size="10" text-anchor="end">40</text><path d="M70 70.0H370" stroke="#D6CDB8" stroke-width="1"/><text x="64" y="74.0" class="t" font-size="10" text-anchor="end">60</text><path d="M70 30.0H370" stroke="#D6CDB8" stroke-width="1"/><text x="64" y="34.0" class="t" font-size="10" text-anchor="end">80</text><rect x="100" y="140.4" width="60" height="49.6" rx="3" fill="#3399CC" stroke="#FFFFFF" stroke-width="1.5"/><text x="130" y="134.4" class="t" font-size="11" font-weight="700" text-anchor="middle">24.79</text><text x="130" y="206" class="t" font-size="12" font-weight="600" text-anchor="middle">Primary</text><rect x="195" y="108.5" width="60" height="81.5" rx="3" fill="#E5484D" stroke="#FFFFFF" stroke-width="1.5"/><text x="225" y="102.5" class="t" font-size="11" font-weight="700" text-anchor="middle">40.73</text><text x="225" y="206" class="t" font-size="12" font-weight="600" text-anchor="middle">Secondary</text><rect x="290" y="43.5" width="60" height="146.5" rx="3" fill="#8FBF3F" stroke="#FFFFFF" stroke-width="1.5"/><text x="320" y="37.5" class="t" font-size="11" font-weight="700" text-anchor="middle">73.25</text><text x="320" y="206" class="t" font-size="12" font-weight="600" text-anchor="middle">Tertiary</text><path d="M70 30V190H370" fill="none" stroke="#2B2F4A" stroke-width="2"/><text x="200" y="20" class="t" font-size="11" font-weight="600" text-anchor="middle">GVA 2021-22 (₹ lakh crore)</text><text x="200" y="228" class="t" font-size="10" text-anchor="middle" fill="#6B6F85">1 lakh crore = 1,00,000 crore</text></svg>