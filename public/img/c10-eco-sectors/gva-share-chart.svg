<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Stacked bars of the share of each sector in GVA for 2001-02 and 2021-22</title><style>.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.t{font-family:system-ui,sans-serif;fill:#2B2F4A}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.drive{animation:drive 4s ease-in-out infinite alternate}@keyframes drive{0%{transform:translateX(0)}100%{transform:translateX(26px)}}.flow{stroke-dasharray:7 6;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}.puff{animation:puff 2.8s ease-in infinite;transform-box:fill-box;transform-origin:center}@keyframes puff{0%{transform:translate(0,0) scale(.6);opacity:.9}100%{transform:translate(6px,-22px) scale(1.3);opacity:0}}.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M60 190.0H340" stroke="#D6CDB8" stroke-width="1"/><text x="54" y="194.0" class="t" font-size="10" font-weight="400" text-anchor="end" fill="#2B2F4A" >0</text><path d="M60 158.0H340" stroke="#D6CDB8" stroke-width="1"/><text x="54" y="162.0" class="t" font-size="10" font-weight="400" text-anchor="end" fill="#2B2F4A" >20</text><path d="M60 126.0H340" stroke="#D6CDB8" stroke-width="1"/><text x="54" y="130.0" class="t" font-size="10" font-weight="400" text-anchor="end" fill="#2B2F4A" >40</text><path d="M60 94.0H340" stroke="#D6CDB8" stroke-width="1"/><text x="54" y="98.0" class="t" font-size="10" font-weight="400" text-anchor="end" fill="#2B2F4A" >60</text><path d="M60 62.0H340" stroke="#D6CDB8" stroke-width="1"/><text x="54" y="66.0" class="t" font-size="10" font-weight="400" text-anchor="end" fill="#2B2F4A" >80</text><path d="M60 30.0H340" stroke="#D6CDB8" stroke-width="1"/><text x="54" y="34.0" class="t" font-size="10" font-weight="400" text-anchor="end" fill="#2B2F4A" >100</text><rect x="100.0" y="140.7" width="80.0" height="49.3" fill="#3399CC" stroke="#FFFFFF" stroke-width="1.5"/><text x="140.0" y="169.4" class="t" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF" >30.8</text><rect x="100.0" y="102.0" width="80.0" height="38.7" fill="#E5484D" stroke="#FFFFFF" stroke-width="1.5"/><text x="140.0" y="125.4" class="t" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF" >24.2</text><rect x="100.0" y="30.0" width="80.0" height="72.0" fill="#8FBF3F" stroke="#FFFFFF" stroke-width="1.5"/><text x="140.0" y="70.0" class="t" font-size="12" font-weight="700" text-anchor="middle" fill="#2B2F4A" >45.0</text><text x="140.0" y="206" class="t" font-size="12" font-weight="600" text-anchor="middle" fill="#2B2F4A" >2001-02</text><rect x="220.0" y="161.4" width="80.0" height="28.6" fill="#3399CC" stroke="#FFFFFF" stroke-width="1.5"/><text x="260.0" y="179.7" class="t" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF" >17.9</text><rect x="220.0" y="114.5" width="80.0" height="46.9" fill="#E5484D" stroke="#FFFFFF" stroke-width="1.5"/><text x="260.0" y="141.9" class="t" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF" >29.3</text><rect x="220.0" y="30.0" width="80.0" height="84.5" fill="#8FBF3F" stroke="#FFFFFF" stroke-width="1.5"/><text x="260.0" y="76.2" class="t" font-size="12" font-weight="700" text-anchor="middle" fill="#2B2F4A" >52.8</text><text x="260.0" y="206" class="t" font-size="12" font-weight="600" text-anchor="middle" fill="#2B2F4A" >2021-22</text><path d="M60 30V190 H340" fill="none" stroke="#2B2F4A" stroke-width=