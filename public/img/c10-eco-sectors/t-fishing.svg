<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A fish swimming in blue water</title><style>.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.t{font-family:system-ui,sans-serif;fill:#2B2F4A}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.drive{animation:drive 4s ease-in-out infinite alternate}@keyframes drive{0%{transform:translateX(0)}100%{transform:translateX(26px)}}.flow{stroke-dasharray:7 6;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}.puff{animation:puff 2.8s ease-in infinite;transform-box:fill-box;transform-origin:center}@keyframes puff{0%{transform:translate(0,0) scale(.6);opacity:.9}100%{transform:translate(6px,-22px) scale(1.3);opacity:0}}.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFFFFF"/><rect x="0" y="40" width="200" height="110" fill="#BFE3F6"/><g transform="translate(100 90) scale(2)" ><circle cx="0" cy="0" r="0" fill="none" class="o" /><ellipse cx="-4" cy="0" rx="20" ry="11" fill="#6EC1E4" class="o"/><path d="M16 0L30 -10V10Z" fill="#6EC1E4" class="o" /><circle cx="-14" cy="-3" r="2" fill="#2B2F4A" class="o" /><path d="M-2 -10Q4 -18 10 -8" fill="none" class="o" /></g><path d="M0 50Q25 40 50 50T100 50T150 50T200 50" fill="none" stroke="#FFFFFF" stroke-width="3"/></svg>