<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Canal, road with storage, bank credit, schools and hospitals</title><style>.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.t{font-family:system-ui,sans-serif;fill:#2B2F4A}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.drive{animation:drive 4s ease-in-out infinite alternate}@keyframes drive{0%{transform:translateX(0)}100%{transform:translateX(26px)}}.flow{stroke-dasharray:7 6;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}.puff{animation:puff 2.8s ease-in infinite;transform-box:fill-box;transform-origin:center}@keyframes puff{0%{transform:translate(0,0) scale(.6);opacity:.9}100%{transform:translate(6px,-22px) scale(1.3);opacity:0}}.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="16.0" y="16.0" width="117.33333333333333" height="100.0" rx="12" fill="#FFFFFF" stroke="#E2D6BC" stroke-width="2"/><g transform="translate(74.66666666666666 58.0) scale(0.95)" ><path d="M-30 24V-14H0L14 24Z" fill="#B9B4A8" class="o" /><path d="M14 24L0 -14H30V24Z" fill="#6EC1E4" class="o" /><path class="flow" d="M10 -4Q16 6 14 18" fill="none" stroke="#FFFFFF" stroke-width="3"/></g><text x="74.66666666666666" y="106.0" class="t" font-size="12" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Canals and dams</text><rect x="141.33333333333331" y="16.0" width="117.33333333333333" height="100.0" rx="12" fill="#FFFFFF" stroke="#