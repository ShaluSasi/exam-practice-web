<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A lorry carrying goods along a road</title><style>.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.t{font-family:system-ui,sans-serif;fill:#2B2F4A}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.drive{animation:drive 4s ease-in-out infinite alternate}@keyframes drive{0%{transform:translateX(0)}100%{transform:translateX(26px)}}.flow{stroke-dasharray:7 6;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}.puff{animation:puff 2.8s ease-in infinite;transform-box:fill-box;transform-origin:center}@keyframes puff{0%{transform:translate(0,0) scale(.6);opacity:.9}100%{transform:translate(6px,-22px) scale(1.3);opacity:0}}.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFFFFF"/><rect x="0" y="104" width="200" height="18" rx="0" fill="#8E99A8" class="o" stroke-width="0"/><path d="M0 113 H200" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="14 10"/><g transform="translate(100 76) scale(1.6)" ><rect x="-30" y="-14" width="38" height="26" rx="3" fill="#FF8A1F" class="o" /><path d="M8 -6H20L30 4V12H8Z" fill="#FFFFFF" class="o" /><g class="bob"><circle cx="-18" cy="14" r="7" fill="#2B2F4A" class="o" /><circle cx="18" cy="14" r="7" fill="#2B2F4A" class="o" /></g><circle cx="-18" cy="14" r="2.5" fill="#FFFFFF" class="o" /><circle cx="18" cy="14" r="2.5" fill="#FFFFFF" class="o" /></g></svg>