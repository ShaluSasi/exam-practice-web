<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Farmers hold back sugarcane so the sugar mill has none</title><style>.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.t{font-family:system-ui,sans-serif;fill:#2B2F4A}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.drive{animation:drive 4s ease-in-out infinite alternate}@keyframes drive{0%{transform:translateX(0)}100%{transform:translateX(26px)}}.flow{stroke-dasharray:7 6;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}.puff{animation:puff 2.8s ease-in infinite;transform-box:fill-box;transform-origin:center}@keyframes puff{0%{transform:translate(0,0) scale(.6);opacity:.9}100%{transform:translate(6px,-22px) scale(1.3);opacity:0}}.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="200" width="400" height="40" fill="#CFE8B8"/><g transform="translate(60 160) scale(1.5)" ><rect x="-26" y="0" width="52" height="24" rx="4" fill="#FFFFFF" class="o" /><rect x="-18" y="-16" width="16" height="16" rx="3" fill="#FFFFFF" class="o" /><rect x="2" y="-16" width="16" height="16" rx="3" fill="#FFFFFF" class="o" /><rect x="-8" y="-32" width="16" height="16" rx="3" fill="#FFFFFF" class="o" /><path d="M-24 -22L-30 -34" fill="none" class="o" stroke="#3FA34D"/></g><g transform="translate(70 90) scale(1)" ><g ><path d="M-10 22V2Q-10 -8 0 -8Q10 -8 10 2V22Z" fill="#FF8A1F" class="o" /><circle cx="0" cy="-16" r="7" fill="#F6C79B" class="o" /><path d="M-7 -21Q0 -29 7 -21L7 -17L-7 -17Z" fill="#E5484D" class="o" /></g></g><g transform="translate(310 150) scale(2.0)" ><rect x="10" y="-22" width="10" height="34" rx="2" fill="#B5654A" class="o" /><path d="M-28 24V-4L-12 -12V-4L2 -12V-4L16 -12V24Z" fill="#E8B04A" class="o" /><rect x="-22" y="6" width="10" height="18" rx="2" fill="#FFFFFF" class="o" /><rect x="-4" y="4" width="10" height="10" rx="2" fill="#E3F2FD" class="o" /></g><path d="M120 150H250" stroke="#E5484D" stroke-width="5" stroke-dasharray="10 8" class="flow"/><g class="o" stroke="#E5484D" stroke-width="6"><path d="M170 130L200 170M200 130L170 170"/></g><text x="60" y="215" class="t" font-size="12" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Farmers stop selling</text><text x="310" y="215" class="t" font-size="12" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Sugar mill has no cane</text></svg>