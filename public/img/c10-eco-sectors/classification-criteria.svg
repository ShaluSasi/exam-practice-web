<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 130" role="img"><title>Three ways to classify: nature of activity, employment conditions, ownership</title><style>.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.t{font-family:system-ui,sans-serif;fill:#2B2F4A}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.drive{animation:drive 4s ease-in-out infinite alternate}@keyframes drive{0%{transform:translateX(0)}100%{transform:translateX(26px)}}.flow{stroke-dasharray:7 6;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}.puff{animation:puff 2.8s ease-in infinite;transform-box:fill-box;transform-origin:center}@keyframes puff{0%{transform:translate(0,0) scale(.6);opacity:.9}100%{transform:translate(6px,-22px) scale(1.3);opacity:0}}.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="16.0" y="16.0" width="117.33333333333333" height="98.0" rx="12" fill="#FFFFFF" stroke="#E2D6BC" stroke-width="2"/><g transform="translate(74.66666666666666 57.0) scale(1.0)" ><g transform="translate(0 0) scale(0.8)" ><path d="M-28 24H28" fill="none" class="o" /><rect x="-30" y="16" width="60" height="10" rx="3" fill="#A9743F" class="o" /><path d="M0 16V-6M-8 6L-12 -4M8 6L12 -2" fill="none" class="o" stroke="#3FA34D"/><circle cx="-12" cy="-10" r="8" fill="#FFFFFF" class="o" /><circle cx="0" cy="-16" r="8" fill="#FFFFFF" class="o" /><circle cx="12" cy="-8" r="8" fill="#FFFFFF" class="o" /></g></g><text x="74.66666666666666" y="104.0" class="t" font-size="12" font-weight="600" text-anchor="middle" fill="#2B2F4A" >What is done</text><rect x="141.33333333333331" y="16.0" width="117.33333333333333" height="98.0" rx="12" fill="#FFFFFF" stroke="#E2D6BC" stroke-width="2"/><g transform="translate(199.99999999999997 57.0) scale(1.0)" ><rect x="-20" y="-26" width="40" height="52" rx="3" fill="#FFFFFF" class="o" /><path d="M-12 -14H12M-12 -4H12M-12 6H4" fill="none" class="o" stroke="#9AA3AE"/></g><text x="199.99999999999997" y="104.0" class="t" font-size="12" font-weight="600" text-anchor="middle" fill="#2B2F4A" >How people work</text><rect x="266.66666666666663" y="16.0" width="117.33333333333333" height="98.0" rx="12" fill="#FFFFFF" stroke="#E2D6BC" stroke-width="2"/><g transform="translate(325.3333333333333 57.0) scale(1.0)" ><path d="M-24 -4L0 -24L24 -4V22H-24Z" fill="#FFD9A0" class="o" /><rect x="-6" y="6" width="12" height="16" rx="2" fill="#B5654A" class="o" /><path d="M-28 -4L0 -28L28 -4" fill="none" class="o" /></g><text x="325.3333333333333" y="104.0" class="t" font-size="12" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Who owns assets</text></svg>