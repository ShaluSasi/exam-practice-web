<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Taxes paying for schools, hospitals and dams</title><style>.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.t{font-family:system-ui,sans-serif;fill:#2B2F4A}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.drive{animation:drive 4s ease-in-out infinite alternate}@keyframes drive{0%{transform:translateX(0)}100%{transform:translateX(26px)}}.flow{stroke-dasharray:7 6;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}.puff{animation:puff 2.8s ease-in infinite;transform-box:fill-box;transform-origin:center}@keyframes puff{0%{transform:translate(0,0) scale(.6);opacity:.9}100%{transform:translate(6px,-22px) scale(1.3);opacity:0}}.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="14" y="14" width="372" height="212" rx="12" fill="#FFFFFF" stroke="#E2D6BC" stroke-width="2"/><g transform="translate(70 90) scale(1.5)" ><circle cx="0" cy="0" r="18" fill="#FFD23F" class="o" /><text x="0" y="6" class="t" font-size="18" font-weight="700" text-anchor="middle" fill="#2B2F4A" >₹</text></g><text x="70" y="140" class="t" font-size="13" font-weight="700" text-anchor="middle" fill="#2B2F4A" >Taxes</text><path d="M110.0 90.0L160.0 90.0" class="flow" fill="none" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round"/><path d="M152.1 94.3L160.0 90.0L152.1 85.7" fill="none" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(215 86) scale(1.0)" ><rect x="-26" y="-10" width="52" height="32" rx="3" fill="#FFFFFF" class="o" /><path d="M-30 -10L0 -28L30 -10Z" fill="#FF8A1F" class="o" /><rect x="-6" y="6" width="12" height="16" rx="2" fill="#B5654A" class="o" /><rect x="-20" y="-2" width="8" height="8" rx="1" fill="#E3F2FD" class="o" /><rect x="12" y="-2" width="8" height="8" rx="1" fill="#E3F2FD" class="o" /></g><g transform="translate(285 86) scale(1.0)" ><rect x="-26" y="-16" width="52" height="38" rx="3" fill="#FFFFFF" class="o" /><rect x="-4" y="-12" width="8" height="20" rx="1" fill="#E5484D" class="o" /><rect x="-10" y="-6" width="20" height="8" rx="1" fill="#E5484D" class="o" /><rect x="-6" y="12" width="12" height="10" rx="1" fill="#B9DDF2" class="o" /></g><g transform="translate(350 90) scale(0.7)" ><path d="M-30 24V-14H0L14 24Z" fill="#B9B4A8" class="o" /><path d="M14 24L0 -14H30V24Z" fill="#6EC1E4" class="o" /><path class="flow" d="M10 -4Q16 6 14 18" fill="none" stroke="#FFFFFF" stroke-width="3"/></g><text x="285" y="140" class="t" font-size="13" font-weight="700" text-anchor="middle" fill="#2B2F4A" >Services for everyone</text><text x="200" y="200" class="t" font-size="12" font-weight="500" text-anchor="middle" fill="#2B2F4A" >The aim of the public sector is not just profit</text></svg>