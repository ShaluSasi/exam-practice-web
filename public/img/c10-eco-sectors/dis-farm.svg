<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>Five people sharing the work of a tiny plot</title><style>.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.t{font-family:system-ui,sans-serif;fill:#2B2F4A}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.drive{animation:drive 4s ease-in-out infinite alternate}@keyframes drive{0%{transform:translateX(0)}100%{transform:translateX(26px)}}.flow{stroke-dasharray:7 6;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}.puff{animation:puff 2.8s ease-in infinite;transform-box:fill-box;transform-origin:center}@keyframes puff{0%{transform:translate(0,0) scale(.6);opacity:.9}100%{transform:translate(6px,-22px) scale(1.3);opacity:0}}.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFFFFF"/><rect x="14" y="40" width="172" height="70" rx="6" fill="#E6D2A0" class="o" /><g transform="translate(32 82) scale(0.75)" ><g ><path d="M-10 22V2Q-10 -8 0 -8Q10 -8 10 2V22Z" fill="#FF8A1F" class="o" /><circle cx="0" cy="-16" r="7" fill="#F6C79B" class="o" /><path d="M-7 -21Q0 -29 7 -21L7 -17L-7 -17Z" fill="#E5484D" class="o" /></g></g><g transform="translate(66 82) scale(0.75)" ><g ><path d="M-10 22V2Q-10 -8 0 -8Q10 -8 10 2V22Z" fill="#7C5CFF" class="o" /><circle cx="0" cy="-16" r="7" fill="#F6C79B" class="o" /><path d="M-7 -21Q0 -29 7 -21L7 -17L-7 -17Z" fill="#E5484D" class="o" /></g></g><g transform="translate(100 82) scale(0.75)" ><g ><path d="M-10 22V2Q-10 -8 0 -8Q10 -8 10 2V22Z" fill="#3FA34D" class="o" /><circle cx="0" cy="-16" r="7" fill="#F6C79B" class="o" /><path d="M-7 -21Q0 -29 7 -21L7 -17L-7 -17Z" fill="#E5484D" class="o" /></g></g><g transform="translate(134 82) scale(0.75)" ><g ><path d="M-10 22V2Q-10 -8 0 -8Q10 -8 10 2V22Z" fill="#0B93D4" class="o" /><circle cx="0" cy="-16" r="7" fill="#F6C79B" class="o" /><path d="M-7 -21Q0 -29 7 -21L7 -17L-7 -17Z" fill="#E5484D" class="o" /></g></g><g transform="translate(168 82) scale(0.75)" ><g ><path d="M-10 22V2Q-10 -8 0 -8Q10 -8 10 2V22Z" fill="#E5484D" class="o" /><circle cx="0" cy="-16" r="7" fill="#F6C79B" class="o" /><path d="M-7 -21Q0 -29 7 -21L7 -17L-7 -17Z" fill="#E5484D" class="o" /></g></g><text x="100" y="132" class="t" font-size="11" font-weight="500" text-anchor="middle" fill="#2B2F4A" >all busy, each a little</text></svg>