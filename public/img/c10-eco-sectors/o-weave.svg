<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A loom weaving cloth</title><style>.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.t{font-family:system-ui,sans-serif;fill:#2B2F4A}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.drive{animation:drive 4s ease-in-out infinite alternate}@keyframes drive{0%{transform:translateX(0)}100%{transform:translateX(26px)}}.flow{stroke-dasharray:7 6;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}.puff{animation:puff 2.8s ease-in infinite;transform-box:fill-box;transform-origin:center}@keyframes puff{0%{transform:translate(0,0) scale(.6);opacity:.9}100%{transform:translate(6px,-22px) scale(1.3);opacity:0}}.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFFFFF"/><g transform="translate(100 76) scale(1.9)" ><rect x="-26" y="-20" width="52" height="40" rx="3" fill="#B77B4A" class="o" /><path d="M-18 -16V16" fill="none" class="o" stroke="#FFD23F" stroke-width="2"/><path d="M-12 -16V16" fill="none" class="o" stroke="#FFD23F" stroke-width="2"/><path d="M-6 -16V16" fill="none" class="o" stroke="#FFD23F" stroke-width="2"/><path d="M0 -16V16" fill="none" class="o" stroke="#FFD23F" stroke-width="2"/><path d="M6 -16V16" fill="none" class="o" stroke="#FFD23F" stroke-width="2"/><path d="M12 -16V16" fill="none" class="o" stroke="#FFD23F" stroke-width="2"/><path d="M18 -16V16" fill="none" class="o" stroke="#FFD23F" stroke-width="2"/><path d="M-26 0H26" fill="none" class="o" stroke="#E5484D" stroke-width="3"/></g></svg>