<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Three sector blocks leading to Gross Value Added after adjusting for taxes and subsidies</title><style>.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.t{font-family:system-ui,sans-serif;fill:#2B2F4A}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.drive{animation:drive 4s ease-in-out infinite alternate}@keyframes drive{0%{transform:translateX(0)}100%{transform:translateX(26px)}}.flow{stroke-dasharray:7 6;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}.puff{animation:puff 2.8s ease-in infinite;transform-box:fill-box;transform-origin:center}@keyframes puff{0%{transform:translate(0,0) scale(.6);opacity:.9}100%{transform:translate(6px,-22px) scale(1.3);opacity:0}}.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="24" y="40" width="60" height="120" rx="6" fill="#3399CC" class="o" /><rect x="96" y="70" width="60" height="90" rx="6" fill="#E5484D" class="o" /><rect x="168" y="20" width="60" height="140" rx="6" fill="#8FBF3F" class="o" /><text x="54" y="182" class="t" font-size="11" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Primary</text><text x="126" y="182" class="t" font-size="11" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Secondary</text><text x="198" y="182" class="t" font-size="11" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Tertiary</text><path d="M236.0 90.0L276.0 90.0" class="flow" fill="none" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round"/><path d="M268.1 94.3L276.0 90.0L268.1 85.7" fill="none" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="280" y="50" width="100" height="80" rx="12" fill="#FFF1D6" class="o" /><text x="330" y="86" class="t" font-size="26" font-weight="800" text-anchor="middle" fill="#FF8A1F" >GVA</text><text x="330" y="106" class="t" font-size="11" font-weight="500" text-anchor="middle" fill="#2B2F4A" >after taxes and</text><text x="330" y="120" class="t" font-size="11" font-weight="500" text-anchor="middle" fill="#2B2F4A" >subsidies adjusted</text><text x="200" y="218" class="t" font-size="13" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Contribution of each sector to the economy</text></svg>