<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A village with a family plot, a well, a dam, a cold store, a mill and a mini-truck</title><style>.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.t{font-family:system-ui,sans-serif;fill:#2B2F4A}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.drive{animation:drive 4s ease-in-out infinite alternate}@keyframes drive{0%{transform:translateX(0)}100%{transform:translateX(26px)}}.flow{stroke-dasharray:7 6;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}.puff{animation:puff 2.8s ease-in infinite;transform-box:fill-box;transform-origin:center}@keyframes puff{0%{transform:translate(0,0) scale(.6);opacity:.9}100%{transform:translate(6px,-22px) scale(1.3);opacity:0}}.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="150" width="400" height="90" fill="#D9EBC3"/><g transform="translate(40 36) scale(0.9)" ><circle cx="0" cy="0" r="11" fill="#FFD23F" class="o" /><path d="M0 14L0 22" fill="none" class="o" stroke="#FFD23F"/><path d="M0 -14L0 -22" fill="none" class="o" stroke="#FFD23F"/><path d="M14 0L22 0" fill="none" class="o" stroke="#FFD23F"/><path d="M-14 0L-22 0" fill="none" class="o" stroke="#FFD23F"/></g><rect x="10" y="120" width="120" height="60" rx="6" fill="#E6D2A0" class="o" /><g transform="translate(70 150) scale(0.9)" ><g ><path d="M-10 22V2Q-10 -8 0 -8Q10 -8 10 2V22Z" fill="#FF8A1F" class="o" /><circle cx="0" cy="-16" r="7" fill="#F6C79B" class="o" /><path d="M-7 -21Q0 -29 7 -21L7 -17L-7 -17Z" fill="#E5484D" class="o" /></g></g><g transform="translate(92 190) scale(1.0)" ><rect x="-20" y="-4" width="40" height="28" rx="4" fill="#B9B4A8" class="o" /><path d="M-20 -4Q0 -14 20 -4" fill="#6EC1E4" class="o" /><path d="M-18 -4V-26M18 -4V-26M-22 -26L0 -38L22 -26Z" fill="none" class="o" /><path d="M0 -30V-10" fill="none" class="o" /><rect x="-5" y="-12" width="10" height="8" rx="2" fill="#8A5A2B" class="o" /></g><g transform="translate(200 60) scale(1.0)" ><path d="M-30 24V-14H0L14 24Z" fill="#B9B4A8" class="o" /><path d="M14 24L0 -14H30V24Z" fill="#6EC1E4" class="o" /><path class="flow" d="M10 -4Q16 6 14 18" fill="none" stroke="#FFFFFF" stroke-width="3"/></g><g transform="translate(335 66) scale(1.1)" ><rect x="-26" y="-14" width="52" height="38" rx="4" fill="#DFF1FA" class="o" /><rect x="-22" y="-22" width="44" height="10" rx="3" fill="#9AA3AE" class="o" /><path d="M0 -6V18M-9 -1L9 13M-9 13L9 -1" fill="none" class="o" stroke="#0B93D4" stroke-width="3"/></g><g transform="translate(190 176) scale(1.0)" ><rect x="10" y="-22" width="10" height="34" rx="2" fill="#B5654A" class="o" /><path d="M-28 24V-4L-12 -12V-4L2 -12V-4L16 -12V24Z" fill="#E8B04A" class="o" /><rect x="-22" y="6" width="10" height="18" rx="2" fill="#FFFFFF" class="o" /><rect x="-4" y="4" width="10" height="10" rx="2" fill="#E3F2FD" class="o" /><circle class="puff" cx="14" cy="-20" r="5" fill="#C9CED6" style="animation-delay:0s"/><circle class="puff" cx="14" cy="-20" r="5" fill="#C9CED6" style="animation-delay:1.4s"/></g><rect x="0" y="206" width="400" height="18" rx="0" fill="#8E99A8" class="o" stroke-width="0"/><path d="M0 215 H400" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="14 10"/><g class="drive"><g transform="translate(290 182) scale(0.75)" ><rect x="-30" y="-14" width="38" height="26" rx="3" fill="#FF8A1F" class="o" /><path d="M8 -6H20L30 4V12H8Z" fill="#FFFFFF" class="o" /><g class="bob"><circ