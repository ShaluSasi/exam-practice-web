<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 130" role="img"><title>Four cards: registered office, small street unit, railway, private company</title><style>.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.t{font-family:system-ui,sans-serif;fill:#2B2F4A}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.drive{animation:drive 4s ease-in-out infinite alternate}@keyframes drive{0%{transform:translateX(0)}100%{transform:translateX(26px)}}.flow{stroke-dasharray:7 6;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}.puff{animation:puff 2.8s ease-in infinite;transform-box:fill-box;transform-origin:center}@keyframes puff{0%{transform:translate(0,0) scale(.6);opacity:.9}100%{transform:translate(6px,-22px) scale(1.3);opacity:0}}.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="16.0" y="16.0" width="86.0" height="98.0" rx="12" fill="#FFFFFF" stroke="#E2D6BC" stroke-width="2"/><g transform="translate(59.0 57.0) scale(1.0)"><g transform="translate(0 0) scale(0.9)"><rect x="-20" y="-26" width="40" height="52" rx="3" fill="#FFFFFF" class="o"/><path d="M-12 -14H12M-12 -4H12M-12 6H4" fill="none" class="o" stroke="#9AA3AE"/></g></g><text x="59.0" y="98.0" class="t" font-size="9.5" font-weight="600" text-anchor="middle" fill="#2B2F4A">Registered,<tspan x="59.0" dy="11">rule-bound</tspan></text><rect x="110.0" y="16.0" width="86.0" height="98.0" rx="12" fill="#FFFFFF" stroke="#E2D6BC" stroke-width="2"/><g transform="translate(153.0 57.0) scale(1.0)"><path d="M-26 -18H-14L-8 10H18L24 -8H-12" fill="none" class="o"/><circle cx="-6" cy="20" r="5" fill="#2B2F4A" class="o"/><circle cx="14" cy="20" r="5" fill="#2B2F4A" class="o"/></g><text x="153.0" y="98.0" class="t" font-size="9.5" font-weight="600" text-anchor="middle" fill="#2B2F4A">Small, scattered<tspan x="153.0" dy="11">units</tspan></text><rect x="204.0" y="16.0" width="86.0" height="98.0" rx="12" fill="#FFFFFF" stroke="#E2D6BC" stroke-width="2"/><g transform="translate(247.0 57.0) scale(0.85)"><rect x="-30" y="-20" width="54" height="32" rx="6" fill="#0B93D4" class="o"/><rect x="-24" y="-14" width="12" height="12" rx="2" fill="#FFFFFF" class="o"/><rect x="-8" y="-14" width="12" height="12" rx="2" fill="#FFFFFF" class="o"/><path d="M24 -6H34V12H24Z" fill="#FF8A1F" class="o"/><circle cx="-18" cy="16" r="6" fill="#2B2F4A" class="o"/><circle cx="-2" cy="16" r="6" fill="#2B2F4A" class="o"/><circle cx="16" cy="16" r="6" fill="#2B2F4A" class="o"/><path d="M-34 24H38" fill="none" class="o"/></g><text x="247.0" y="98.0" class="t" font-size="9.5" font-weight="600" text-anchor="middle" fill="#2B2F4A">Owned by<tspan x="247.0" dy="11">government</tspan></text><rect x="298.0" y="16.0" width="86.0" height="98.0" rx="12" fill="#FFFFFF" stroke="#E2D6BC" stroke-width="2"/><g transform="translate(341.0 57.0) scale(1.0)"><circle cx="0" cy="0" r="18" fill="#FFD23F" class="o"/><text x="0" y="6" class="t" font-size="18" font-weight="700" text-anchor="middle" fill="#2B2F4A">₹</text></g><text x="341.0" y="104.0" class="t" font-size="12" font-weight="600" text-anchor="middle" fill="#2B2F4A">Run for profit</text></svg>