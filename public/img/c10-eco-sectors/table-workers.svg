<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 244" role="img"><title>Table of workers in millions: organised and unorganised by sector, with unknown cells</title><style>.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.t{font-family:system-ui,sans-serif;fill:#2B2F4A}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.drive{animation:drive 4s ease-in-out infinite alternate}@keyframes drive{0%{transform:translateX(0)}100%{transform:translateX(26px)}}.flow{stroke-dasharray:7 6;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}.puff{animation:puff 2.8s ease-in infinite;transform-box:fill-box;transform-origin:center}@keyframes puff{0%{transform:translate(0,0) scale(.6);opacity:.9}100%{transform:translate(6px,-22px) scale(1.3);opacity:0}}.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="18" y="14" width="366" height="32" rx="6" fill="#7C5CFF" class="o" stroke-width="1.5"/><text x="60" y="35" class="t" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF" >Sector</text><text x="160" y="35" class="t" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF" >Organised</text><text x="250" y="35" class="t" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF" >Unorganised</text><text x="340" y="35" class="t" font-size="12" font-weight="700" text-anchor="middle" fill="#FFFFFF" >Total</text><rect x="18" y="50" width="366" height="34" rx="0" fill="#FFFFFF" class="o" stroke-width="1"/><text x="60" y="72" class="t" font-size="13" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Primary</text><text x="160" y="72" class="t" font-size="13" font-weight="600" text-anchor="middle" fill="#2B2F4A" >1</text><text x="250" y="72" class="t" font-size="13" font-weight="800" text-anchor="middle" fill="#E5484D" >?</text><text x="340" y="72" class="t" font-size="13" font-weight="600" text-anchor="middle" fill="#2B2F4A" >232</text><rect x="18" y="84" width="366" height="34" rx="0" fill="#F2ECFF" class="o" stroke-width="1"/><text x="60" y="106" class="t" font-size="13" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Secondary</text><text x="160" y="106" class="t" font-size="13" font-weight="600" text-anchor="middle" fill="#2B2F4A" >41</text><text x="250" y="106" class="t" font-size="13" font-weight="600" text-anchor="middle" fill="#2B2F4A" >74</text><text x="340" y="106" class="t" font-size="13" font-weight="600" text-anchor="middle" fill="#2B2F4A" >115</text><rect x="18" y="118" width="366" height="34" rx="0" fill="#FFFFFF" class="o" stroke-width="1"/><text x="60" y="140" class="t" font-size="13" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Tertiary</text><text x="160" y="140" class="t" font-size="13" font-weight="600" text-anchor="middle" fill="#2B2F4A" >40</text><text x="250" y="140" class="t" font-size="13" font-weight="600" text-anchor="middle" fill="#2B2F4A" >88</text><text x="340" y="140" class="t" font-size="13" font-weight="600" text-anchor="middle" fill="#2B2F4A" >128</text><rect x="18" y="152" width="366" height="34" rx="0" fill="#F2ECFF" class="o" stroke-width="1"/><text x="60" y="174" class="t" font-size="13" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Total</text><text x="160" y="174" class="t" font-size="13" font-weight="600" text-anchor="middle" fill="#2B2F4A" >82</text><text x="250" y="174" class="t" font-size="13" font-weight="800" text-anchor="middle" fill="#E5484D" >?</text><text x="340" y="174" class="t" font-size="13" font-weight="600" text-anchor="middle" fill="#2B2F4A" >475</text><text x="200" y="232" class="t" font-size="12" font-weight="500" text-anchor="middle" fill="#2B2F4A" >Workers in India, late 1990s (millions)</text></svg>