<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>Stalks of wheat</title><style>.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.t{font-family:system-ui,sans-serif;fill:#2B2F4A}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.drive{animation:drive 4s ease-in-out infinite alternate}@keyframes drive{0%{transform:translateX(0)}100%{transform:translateX(26px)}}.flow{stroke-dasharray:7 6;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}.puff{animation:puff 2.8s ease-in infinite;transform-box:fill-box;transform-origin:center}@keyframes puff{0%{transform:translate(0,0) scale(.6);opacity:.9}100%{transform:translate(6px,-22px) scale(1.3);opacity:0}}.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFFFFF"/><g transform="translate(100 76) scale(2.3)" ><path d="M0 26V-18" fill="none" class="o" stroke="#C99A2E"/><path d="M0 -6 Q-8 -10 -9 -16 M0 -6 Q8 -10 9 -16" fill="none" class="o" stroke="#C99A2E" stroke-width="3"/><path d="M0 4 Q-8 0 -9 -6 M0 4 Q8 0 9 -6" fill="none" class="o" stroke="#C99A2E" stroke-width="3"/><path d="M0 14 Q-8 10 -9 4 M0 14 Q8 10 9 4" fill="none" class="o" stroke="#C99A2E" stroke-width="3"/></g><g transform="translate(55 90) scale(1.4)" ><path d="M0 26V-18" fill="none" class="o" stroke="#C99A2E"/><path d="M0 -6 Q-8 -10 -9 -16 M0 -6 Q8 -10 9 -16" fill="none" class="o" stroke="#C99A2E" stroke-width="3"/><path d="M0 4 Q-8 0 -9 -6 M0 4 Q8 0 9 -6" fill="none" class="o" stroke="#C99A2E" stroke-width="3"/><path d="M0 14 Q-8 10 -9 4 M0 14 Q8 10 9 4" fill="none" class="o" stroke="#C99A2E" stroke-width="3"/></g><g transform="translate(145 90) scale(1.4)" ><path d="M0 26V-18" fill="none" class="o" stroke="#C99A2E"/><path d="M0 -6 Q-8 -10 -9 -16 M0 -6 Q8 -10 9 -16" fill="none" class="o" stroke="#C99A2E" stroke-width="3"/><path d="M0 4 Q-8 0 -9 -6 M0 4 Q8 0 9 -6" fill="none" class="o" stroke="#C99A2E" stroke-width="3"/><path d="M0 14 Q-8 10 -9 4 M0 14 Q8 10 9 4" fill="none" class="o" stroke="#C99A2E" stroke-width="3"/></g></svg>