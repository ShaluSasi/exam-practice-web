<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A train at a platform</title><style>.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.t{font-family:system-ui,sans-serif;fill:#2B2F4A}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.drive{animation:drive 4s ease-in-out infinite alternate}@keyframes drive{0%{transform:translateX(0)}100%{transform:translateX(26px)}}.flow{stroke-dasharray:7 6;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}.puff{animation:puff 2.8s ease-in infinite;transform-box:fill-box;transform-origin:center}@keyframes puff{0%{transform:translate(0,0) scale(.6);opacity:.9}100%{transform:translate(6px,-22px) scale(1.3);opacity:0}}.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFFFFF"/><rect x="0" y="112" width="200" height="18" rx="0" fill="#8E99A8" class="o" stroke-width="0"/><path d="M0 121 H200" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="14 10"/><g transform="translate(100 78) scale(1.8)" ><rect x="-30" y="-20" width="54" height="32" rx="6" fill="#0B93D4" class="o" /><rect x="-24" y="-14" width="12" height="12" rx="2" fill="#FFFFFF" class="o" /><rect x="-8" y="-14" width="12" height="12" rx="2" fill="#FFFFFF" class="o" /><path d="M24 -6H34V12H24Z" fill="#FF8A1F" class="o" /><circle cx="-18" cy="16" r="6" fill="#2B2F4A" class="o" /><circle cx="-2" cy="16" r="6" fill="#2B2F4A" class="o" /><circle cx="16" cy="16" r="6" fill="#2B2F4A" class="o" /><path d="M-34 24H38" fill="none" class="o" /></g></svg>