<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Bars showing industrial output rose over nine times and jobs about three times, service output 14 times and jobs about five times</title><style>.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.t{font-family:system-ui,sans-serif;fill:#2B2F4A}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.drive{animation:drive 4s ease-in-out infinite alternate}@keyframes drive{0%{transform:translateX(0)}100%{transform:translateX(26px)}}.flow{stroke-dasharray:7 6;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}.puff{animation:puff 2.8s ease-in infinite;transform-box:fill-box;transform-origin:center}@keyframes puff{0%{transform:translate(0,0) scale(.6);opacity:.9}100%{transform:translate(6px,-22px) scale(1.3);opacity:0}}.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M50 184.0H360" stroke="#D6CDB8"/><text x="44" y="188.0" class="t" font-size="10" font-weight="400" text-anchor="end" fill="#2B2F4A" >0</text><path d="M50 144.0H360" stroke="#D6CDB8"/><text x="44" y="148.0" class="t" font-size="10" font-weight="400" text-anchor="end" fill="#2B2F4A" >4</text><path d="M50 104.0H360" stroke="#D6CDB8"/><text x="44" y="108.0" class="t" font-size="10" font-weight="400" text-anchor="end" fill="#2B2F4A" >8</text><path d="M50 64.0H360" stroke="#D6CDB8"/><text x="44" y="68.0" class="t" font-size="10" font-weight="400" text-anchor="end" fill="#2B2F4A" >12</text><path d="M50 24.0H360" stroke="#D6CDB8"/><text x="44" y="28.0" class="t" font-size="10" font-weight="400" text-anchor="end" fill="#2B2F4A" >16</text><rect x="68" y="94.0" width="52" height="90.0" rx="3" fill="#FF8A1F" class="o" stroke-width="2"/><text x="94.0" y="89.0" class="t" font-size="11" font-weight="700" text-anchor="middle" fill="#2B2F4A" >over 9×</text><text x="94.0" y="199" class="t" font-size="11" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Industry</text><text x="94.0" y="212" class="t" font-size="11" font-weight="600" text-anchor="middle" fill="#2B2F4A" >output</text><rect x="142" y="154.0" width="52" height="30.0" rx="3" fill="#0B93D4" class="o" stroke-width="2"/><text x="168.0" y="149.0" class="t" font-size="11" font-weight="700" text-anchor="middle" fill="#2B2F4A" >about 3×</text><text x="168.0" y="199" class="t" font-size="11" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Industry</text><text x="168.0" y="212" class="t" font-size="11" font-weight="600" text-anchor="middle" fill="#2B2F4A" >jobs</text><rect x="230" y="44.0" width="52" height="140.0" rx="3" fill="#FF8A1F" class="o" stroke-width="2"/><text x="256.0" y="39.0" class="t" font-size="11" font-weight="700" text-anchor="middle" fill="#2B2F4A" >14×</text><text x="256.0" y="199" class="t" font-size="11" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Service</text><text x="256.0" y="212" class="t" font-size="11" font-weight="600" text-anchor="middle" fill="#2B2F4A" >output</text><rect x="304" y="134.0" width="52" height="50.0" rx="3" fill="#0B93D4" class="o" stroke-width="2"/><text x="330.0" y="129.0" class="t" font-size="11" font-weight="700" text-anchor="middle" fill="#2B2F4A" >about 5×</text><text x="330.0" y="199" class="t" font-size="11" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Service</text><text x="330.0" y="212" class="t" font-size="11" font-weight="600" text-anchor="middle" fill="#2B2F4A" >jobs</text><path d="M50 24V184 H360" fill="none" stroke="#2B2F4A" stroke-width="2"/></svg>