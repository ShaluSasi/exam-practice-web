<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Two bars for a city: workers 26.7 percent organised and 73.3 unorganised; income 53.3 and 46.7</title><style>.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.t{font-family:system-ui,sans-serif;fill:#2B2F4A}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.drive{animation:drive 4s ease-in-out infinite alternate}@keyframes drive{0%{transform:translateX(0)}100%{transform:translateX(26px)}}.flow{stroke-dasharray:7 6;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}.puff{animation:puff 2.8s ease-in infinite;transform-box:fill-box;transform-origin:center}@keyframes puff{0%{transform:translate(0,0) scale(.6);opacity:.9}100%{transform:translate(6px,-22px) scale(1.3);opacity:0}}.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M60 184.0H340" stroke="#D6CDB8"/><text x="54" y="188.0" class="t" font-size="10" font-weight="400" text-anchor="end" fill="#2B2F4A" >0</text><path d="M60 144.0H340" stroke="#D6CDB8"/><text x="54" y="148.0" class="t" font-size="10" font-weight="400" text-anchor="end" fill="#2B2F4A" >25</text><path d="M60 104.0H340" stroke="#D6CDB8"/><text x="54" y="108.0" class="t" font-size="10" font-weight="400" text-anchor="end" fill="#2B2F4A" >50</text><path d="M60 64.0H340" stroke="#D6CDB8"/><text x="54" y="68.0" class="t" font-size="10" font-weight="400" text-anchor="end" fill="#2B2F4A" >75</text><path d="M60 24.0H340" stroke="#D6CDB8"/><text x="54" y="28.0" class="t" font-size="10" font-weight="400" text-anchor="end" fill="#2B2F4A" >100</text><rect x="100" y="141.3" width="80" height="42.7" fill="#0B93D4" stroke="#FFFFFF" stroke-width="1.5"/><text x="140" y="167.64" class="t" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF" >26.7%</text><rect x="100" y="24.0" width="80" height="117.3" fill="#FF8A1F" stroke="#FFFFFF" stroke-width="1.5"/><text x="140" y="87.64" class="t" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF" >73.3%</text><text x="140" y="200" class="t" font-size="12" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Workers</text><rect x="240" y="98.7" width="80" height="85.3" fill="#0B93D4" stroke="#FFFFFF" stroke-width="1.5"/><text x="280" y="146.36" class="t" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF" >53.3%</text><rect x="240" y="24.0" width="80" height="74.7" fill="#FF8A1F" stroke="#FFFFFF" stroke-width="1.5"/><text x="280" y="66.36" class="t" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF" >46.7%</text><text x="280" y="200" class="t" font-size="12" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Income</text><path d="M60 24V184 H340" fill="none" stroke="#2B2F4A" stroke-width="2"/><rect x="110" y="214" width="12" height="12" rx="2" fill="#0B93D4" class="o" stroke-width="1"/><text x="127" y="224" class="t" font-size="11" font-weight="500" text-anchor="start" fill="#2B2F4A" >Organised</text><rect x="210" y="214" width="12" height="12" rx="2" fill="#FF8A1F" class="o" stroke-width="1"/><text x="227" y="224" class="t" font-size="11" font-weight="500" text-anchor="start" fill="#2B2F4A" >Unorganised</text><text x="30" y="16" class="t" font-size="11" font-weight="600" text-anchor="middle" fill="#2B2F4A" >%</text></svg>