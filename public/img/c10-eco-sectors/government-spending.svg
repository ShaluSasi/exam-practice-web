<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A dam, a road and piles of coins showing very large spending</title><style>.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.t{font-family:system-ui,sans-serif;fill:#2B2F4A}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.drive{animation:drive 4s ease-in-out infinite alternate}@keyframes drive{0%{transform:translateX(0)}100%{transform:translateX(26px)}}.flow{stroke-dasharray:7 6;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}.puff{animation:puff 2.8s ease-in infinite;transform-box:fill-box;transform-origin:center}@keyframes puff{0%{transform:translate(0,0) scale(.6);opacity:.9}100%{transform:translate(6px,-22px) scale(1.3);opacity:0}}.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="190" width="400" height="50" fill="#CFE8B8"/><g transform="translate(90 150) scale(1.6)" ><path d="M-30 24V-14H0L14 24Z" fill="#B9B4A8" class="o" /><path d="M14 24L0 -14H30V24Z" fill="#6EC1E4" class="o" /><path class="flow" d="M10 -4Q16 6 14 18" fill="none" stroke="#FFFFFF" stroke-width="3"/></g><rect x="0" y="190" width="400" height="18" rx="0" fill="#8E99A8" class="o" stroke-width="0"/><path d="M0 199 H400" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="14 10"/><g class="drive"><g transform="translate(250 178) scale(1.0)" ><rect x="-30" y="-14" width="38" height="26" rx="3" fill="#FF8A1F" class="o" /><path d="M8 -6H20L30 4V12H8Z" fill="#FFFFFF" class="o" /><g class="bob"><circle cx="-18" cy="14" r="7" fill="#2B2F4A" class="o" /><circle cx="18" cy="14" r="7" fill="#2B2F4A" class="o" /></g><circle cx="-18" cy="14" r="2.5" fill="#FFFFFF" class="o" /><circle cx="18" cy="14" r="2.5" fill="#FFFFFF" class="o" /></g></g><g transform="translate(330 120) scale(1.6)" ><circle cx="0" cy="0" r="18" fill="#FFD23F" class="o" /><text x="0" y="6" class="t" font-size="18" font-weight="700" text-anchor="middle" fill="#2B2F4A" >₹</text></g><g transform="translate(345 85) scale(1.1)" ><circle cx="0" cy="0" r="18" fill="#FFD23F" class="o" /><text x="0" y="6" class="t" font-size="18" font-weight="700" text-anchor="middle" fill="#2B2F4A" >₹</text></g><g transform="translate(310 85) scale(0.9)" ><circle cx="0" cy="0" r="18" fill="#FFD23F" class="o" /><text x="0" y="6" class="t" font-size="18" font-weight="700" text-anchor="middle" fill="#2B2F4A" >₹</text></g><text x="330" y="160" class="t" font-size="12" font-weight="700" text-anchor="middle" fill="#2B2F4A" >Very large sums</text><text x="200" y="222" class="t" font-size="12" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Roads, bridges, dams, railways, harbours, electricity</text></svg>