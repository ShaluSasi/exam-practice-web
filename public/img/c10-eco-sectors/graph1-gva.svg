<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 244" role="img"><title>Stacked bars of production by the three sectors in 1977-78 and 2017-18; the tertiary part is largest in 2017-18</title><style>.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.t{font-family:system-ui,sans-serif;fill:#2B2F4A}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.drive{animation:drive 4s ease-in-out infinite alternate}@keyframes drive{0%{transform:translateX(0)}100%{transform:translateX(26px)}}.flow{stroke-dasharray:7 6;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}.puff{animation:puff 2.8s ease-in infinite;transform-box:fill-box;transform-origin:center}@keyframes puff{0%{transform:translate(0,0) scale(.6);opacity:.9}100%{transform:translate(6px,-22px) scale(1.3);opacity:0}}.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M78 196.0H368" stroke="#D6CDB8" stroke-width="1"/><text x="72" y="200.0" class="t" font-size="10" font-weight="400" text-anchor="end" fill="#2B2F4A" >0</text><path d="M78 171.7H368" stroke="#D6CDB8" stroke-width="1"/><text x="72" y="175.71428571428572" class="t" font-size="10" font-weight="400" text-anchor="end" fill="#2B2F4A" >2,000,000</text><path d="M78 147.4H368" stroke="#D6CDB8" stroke-width="1"/><text x="72" y="151.42857142857144" class="t" font-size="10" font-weight="400" text-anchor="end" fill="#2B2F4A" >4,000,000</text><path d="M78 123.1H368" stroke="#D6CDB8" stroke-width="1"/><text x="72" y="127.14285714285714" class="t" font-size="10" font-weight="400" text-anchor="end" fill="#2B2F4A" >6,000,000</text><path d="M78 98.9H368" stroke="#D6CDB8" stroke-width="1"/><text x="72" y="102.85714285714286" class="t" font-size="10" font-weight="400" text-anchor="end" fill="#2B2F4A" >8,000,000</text><path d="M78 74.6H368" stroke="#D6CDB8" stroke-width="1"/><text x="72" y="78.57142857142857" class="t" font-size="10" font-weight="400" text-anchor="end" fill="#2B2F4A" >10,000,000</text><path d="M78 50.3H368" stroke="#D6CDB8" stroke-width="1"/><text x="72" y="54.28571428571428" class="t" font-size="10" font-weight="400" text-anchor="end" fill="#2B2F4A" >12,000,000</text><path d="M78 26.0H368" stroke="#D6CDB8" stroke-width="1"/><text x="72" y="30.0" class="t" font-size="10" font-weight="400" text-anchor="end" fill="#2B2F4A" >14,000,000</text><rect x="119.4" y="187.7" width="82.9" height="8.3" fill="#3399CC" stroke="#FFFFFF" stroke-width="1.5"/><rect x="119.4" y="184.5" width="82.9" height="3.3" fill="#E5484D" stroke="#FFFFFF" stroke-width="1.5"/><rect x="119.4" y="177.8" width="82.9" height="6.7" fill="#8FBF3F" stroke="#FFFFFF" stroke-width="1.5"/><text x="160.9" y="212" class="t" font-size="12" font-weight="600" text-anchor="middle" fill="#2B2F4A" >1977-78</text><rect x="243.7" y="170.5" width="82.9" height="25.5" fill="#3399CC" stroke="#FFFFFF" stroke-width="1.5"/><rect x="243.7" y="128.6" width="82.9" height="41.9" fill="#E5484D" stroke="#FFFFFF" stroke-width="1.5"/><rect x="243.7" y="50.3" width="82.9" height="78.3" fill="#8FBF3F" stroke="#FFFFFF" stroke-width="1.5"/><text x="285.1" y="212" class="t" font-size="12" font-weight="600" text-anchor="middle" fill="#2B2F4A" >2017-18</text><path d="M78 26V196 H368" fill="none" stroke="#2B2F4A" stroke-width="2"/><text x="8" y="120" class="t" font-size="10" font-weight="600" text-anchor="middle" fill="#2B2F4A" transform="rotate(-90 8 120)">Rs. in crores</text><rect x="88" y="223" width="12" height="12" rx="2" fill="#3399CC" class="o" stroke-width="1"/><text x="105" y="234" class="t" font-size="11" font-weight="500" text-anchor="start" fill="#2B2F4A" >Primary</text><rect x="176" y="223" width="12" height="12" rx="2" fill="#E5484D" class="o" stroke-width="1"/><text x="193" y="234" class="t" font-size="11" font-weight="500" text-anchor="start" fill="#2B2F4A" >Secondary</text><rect x="264" y="223" width="12" height="12" rx="2" fill="#8FBF3F" class="o" stroke-width="1"/><text x="281" y="234" class="t" font-size="11" font-weight="500" text-anchor="start" fill="#2B2F4A" >Tertiary</text></svg>