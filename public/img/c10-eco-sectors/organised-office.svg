<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>An office worker with an appointment letter, a paid Sunday holiday and provident fund</title><style>.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.t{font-family:system-ui,sans-serif;fill:#2B2F4A}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.drive{animation:drive 4s ease-in-out infinite alternate}@keyframes drive{0%{transform:translateX(0)}100%{transform:translateX(26px)}}.flow{stroke-dasharray:7 6;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}.puff{animation:puff 2.8s ease-in infinite;transform-box:fill-box;transform-origin:center}@keyframes puff{0%{transform:translate(0,0) scale(.6);opacity:.9}100%{transform:translate(6px,-22px) scale(1.3);opacity:0}}.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="14" y="14" width="372" height="212" rx="14" fill="#FFFFFF" class="o" stroke-width="2"/><g transform="translate(80 110) scale(1.5)" ><rect x="-20" y="-26" width="40" height="52" rx="3" fill="#FFFFFF" class="o" /><path d="M-12 -14H12M-12 -4H12M-12 6H4" fill="none" class="o" stroke="#9AA3AE"/></g><text x="80" y="170" class="t" font-size="12" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Appointment letter</text><g transform="translate(200 110) scale(1.4)" ><rect x="-26" y="-26" width="52" height="52" rx="6" fill="#F1ECDD" class="o" /><rect x="-26" y="-26" width="52" height="14" rx="6" fill="#E5484D" class="o" /><text x="0" y="10" class="t" font-size="20" font-weight="800" text-anchor="middle" fill="#2B2F4A" >Sun</text></g><text x="200" y="170" class="t" font-size="12" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Paid holiday</text><g transform="translate(320 105) scale(1.3)" ><circle cx="0" cy="0" r="18" fill="#FFD23F" class="o" /><text x="0" y="6" class="t" font-size="18" font-weight="700" text-anchor="middle" fill="#2B2F4A" >₹</text></g><text x="320" y="170" class="t" font-size="12" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Provident fund</text><text x="200" y="205" class="t" font-size="13" font-weight="700" text-anchor="middle" fill="#2B2F4A" >Kanta, who works in an office</text></svg>