<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A calendar showing one hundred days and a rural worker with a spade</title><style>.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.t{font-family:system-ui,sans-serif;fill:#2B2F4A}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.drive{animation:drive 4s ease-in-out infinite alternate}@keyframes drive{0%{transform:translateX(0)}100%{transform:translateX(26px)}}.flow{stroke-dasharray:7 6;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}.puff{animation:puff 2.8s ease-in infinite;transform-box:fill-box;transform-origin:center}@keyframes puff{0%{transform:translate(0,0) scale(.6);opacity:.9}100%{transform:translate(6px,-22px) scale(1.3);opacity:0}}.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="14" y="14" width="372" height="212" rx="12" fill="#FFFFFF" stroke="#E2D6BC" stroke-width="2"/><g transform="translate(90 100) scale(1.9)" ><rect x="-26" y="-26" width="52" height="52" rx="6" fill="#F1ECDD" class="o" /><rect x="-26" y="-26" width="52" height="14" rx="6" fill="#E5484D" class="o" /><text x="0" y="10" class="t" font-size="20" font-weight="800" text-anchor="middle" fill="#2B2F4A" >100</text><text x="0" y="22" class="t" font-size="9" font-weight="500" text-anchor="middle" fill="#2B2F4A" >days</text></g><g transform="translate(250 110) scale(2.0)" ><g ><path d="M-10 22V2Q-10 -8 0 -8Q10 -8 10 2V22Z" fill="#FF8A1F" class="o" /><circle cx="0" cy="-16" r="7" fill="#F6C79B" class="o" /><path d="M-7 -21Q0 -29 7 -21L7 -17L-7 -17Z" fill="#E5484D" class="o" /></g></g><path d="M290 150L330 190" fill="none" class="o" stroke-width="5"/><path d="M322 180Q342 186 336 200" fill="#9AA3AE" class="o" /><text x="200" y="215" class="t" font-size="12" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Work guaranteed in a year in rural areas</text></svg>