<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Share of the three sectors in employment: 71, 11, 18 in 1977-78 and 44, 25, 31 in 2017-18</title><style>.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.t{font-family:system-ui,sans-serif;fill:#2B2F4A}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.drive{animation:drive 4s ease-in-out infinite alternate}@keyframes drive{0%{transform:translateX(0)}100%{transform:translateX(26px)}}.flow{stroke-dasharray:7 6;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}.puff{animation:puff 2.8s ease-in infinite;transform-box:fill-box;transform-origin:center}@keyframes puff{0%{transform:translate(0,0) scale(.6);opacity:.9}100%{transform:translate(6px,-22px) scale(1.3);opacity:0}}.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M50 192.0H350" stroke="#D6CDB8" stroke-width="1"/><text x="44" y="196.0" class="t" font-size="10" font-weight="400" text-anchor="end" fill="#2B2F4A" >0</text><path d="M50 158.0H350" stroke="#D6CDB8" stroke-width="1"/><text x="44" y="162.0" class="t" font-size="10" font-weight="400" text-anchor="end" fill="#2B2F4A" >20</text><path d="M50 124.0H350" stroke="#D6CDB8" stroke-width="1"/><text x="44" y="128.0" class="t" font-size="10" font-weight="400" text-anchor="end" fill="#2B2F4A" >40</text><path d="M50 90.0H350" stroke="#D6CDB8" stroke-width="1"/><text x="44" y="94.0" class="t" font-size="10" font-wei