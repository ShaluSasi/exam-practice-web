<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A lorry, a bank and a phone</title><style>.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.t{font-family:system-ui,sans-serif;fill:#2B2F4A}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.drive{animation:drive 4s ease-in-out infinite alternate}@keyframes drive{0%{transform:translateX(0)}100%{transform:translateX(26px)}}.flow{stroke-dasharray:7 6;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}.puff{animation:puff 2.8s ease-in infinite;transform-box:fill-box;transform-origin:center}@keyframes puff{0%{transform:translate(0,0) scale(.6);opacity:.9}100%{transform:translate(6px,-22px) scale(1.3);opacity:0}}.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFFFFF"/><g transform="translate(40 80) scale(0.8)" ><rect x="-30" y="-14" width="38" height="26" rx="3" fill="#FF8A1F" class="o" /><path d="M8 -6H20L30 4V12H8Z" fill="#FFFFFF" class="o" /><g class="bob"><circle cx="-18" cy="14" r="7" fill="#2B2F4A" class="o" /><circle cx="18" cy="14" r="7" fill="#2B2F4A" class="o" /></g><circle cx="-18" cy="14" r="2.5" fill="#FFFFFF" class="o" /><circle cx="18" cy="14" r="2.5" fill="#FFFFFF" class="o" /></g><g transform="translate(105 78) scale(0.9)" ><path d="M-30 -8L0 -26L30 -8Z" fill="#FFD23F" class="o" /><rect x="-22" y="-6" width="8" height="26" rx="1" fill="#FFFFFF" class="o" /><rect x="-8" y="-6" width="8" height="26" rx="1" fill="#FFFFFF" class="o" /><rect x="6" y="-6" width="8" height="26" rx="1" fill="#FFFFFF" class="o" /><rect x="20" y="-6" width="8" height="26" rx="1" fill="#FFFFFF" class="o" /><rect x="-32" y="20" width="64" height="8" rx="2" fill="#C9CED6" class="o" /></g><g transform="translate(165 78) scale(0.8)" ><rect x="-14" y="-26" width="28" height="52" rx="7" fill="#2B2F4A" class="o" fill-opacity="1"/><rect x="-10" y="-20" width="20" height="34" rx="2" fill="#E3F2FD" class="o" /><circle cx="0" cy="20" r="2.5" fill="#FFFFFF" class="o" /></g></svg>