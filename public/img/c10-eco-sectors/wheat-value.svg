<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Ten thousand kilograms of wheat sold at twenty rupees per kilogram</title><style>.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.t{font-family:system-ui,sans-serif;fill:#2B2F4A}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.drive{animation:drive 4s ease-in-out infinite alternate}@keyframes drive{0%{transform:translateX(0)}100%{transform:translateX(26px)}}.flow{stroke-dasharray:7 6;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}.puff{animation:puff 2.8s ease-in infinite;transform-box:fill-box;transform-origin:center}@keyframes puff{0%{transform:translate(0,0) scale(.6);opacity:.9}100%{transform:translate(6px,-22px) scale(1.3);opacity:0}}.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="14" y="14" width="372" height="212" rx="12" fill="#FFFFFF" stroke="#E2D6BC" stroke-width="2"/><g transform="translate(80 110) scale(1.7)" ><path d="M-18 22Q-24 0 -12 -16L-6 -22H6L12 -16Q24 0 18 22Z" fill="#E8D5A3" class="o" /><text x="0" y="10" class="t" font-size="12" font-weight="700" text-anchor="middle" fill="#2B2F4A" >wheat</text></g><g transform="translate(135 130) scale(1.3)" ><path d="M-18 22Q-24 0 -12 -16L-6 -22H6L12 -16Q24 0 18 22Z" fill="#E8D5A3" class="o" /><text x="0" y="10" class="t" font-size="12" font-weight="700" text-anchor="middle" fill="#2B2F4A" >wheat</text></g><text x="260" y="70" class="t" font-size="17" font-weight="700" text-anchor="middle" fill="#2B2F4A" >10,000 kg of wheat</text><text x="260" y="100" class="t" font-size="16" font-weight="600" text-anchor="middle" fill="#2B2F4A" >sold at ₹20 per kg</text><g transform="translate(260 150) scale(1.2)" ><circle cx="0" cy="0" r="18" fill="#FFD23F" class="o" /><text x="0" y="6" class="t" font-size="18" font-weight="700" text-anchor="middle" fill="#2B2F4A" >₹</text></g><g class="bob"><text x="330" y="165" class="t" font-size="38" font-weight="800" fill="#FF8A1F" text-anchor="middle">?</text></g><text x="260" y="205" class="t" font-size="14" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Value of the wheat = ?</text></svg>