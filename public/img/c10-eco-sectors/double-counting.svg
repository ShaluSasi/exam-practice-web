<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Wheat, flour and biscuits with their prices; the final price already includes the earlier stages</title><style>.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.t{font-family:system-ui,sans-serif;fill:#2B2F4A}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.drive{animation:drive 4s ease-in-out infinite alternate}@keyframes drive{0%{transform:translateX(0)}100%{transform:translateX(26px)}}.flow{stroke-dasharray:7 6;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}.puff{animation:puff 2.8s ease-in infinite;transform-box:fill-box;transform-origin:center}@keyframes puff{0%{transform:translate(0,0) scale(.6);opacity:.9}100%{transform:translate(6px,-22px) scale(1.3);opacity:0}}.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><g transform="translate(55 100) scale(1.3)" ><path d="M-18 22Q-24 0 -12 -16L-6 -22H6L12 -16Q24 0 18 22Z" fill="#E8D5A3" class="o" /><text x="0" y="10" class="t" font-size="12" font-weight="700" text-anchor="middle" fill="#2B2F4A" >wheat</text></g><g transform="translate(200 100) scale(1.3)" ><path d="M-18 22Q-24 0 -12 -16L-6 -22H6L12 -16Q24 0 18 22Z" fill="#E8D5A3" class="o" /><text x="0" y="10" class="t" font-size="12" font-weight="700" text-anchor="middle" fill="#2B2F4A" >flour</text></g><g transform="translate(345 98) scale(1.4)" ><rect x="-18" y="-22" width="36" height="44" rx="4" fill="#FFFFFF" class="o" /><circle cx="0" cy="-6" r="9" fill="#C98B4D" class="o" /><circle cx="0" cy="12" r="6" fill="#C98B4D" class="o" /><path d="M-14 -16H14" fill="none" class="o" stroke="#E5484D"/></g><path d="M95.0 100.0L160.0 100.0" class="flow" fill="none" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round"/><path d="M152.1 104.3L160.0 100.0L152.1 95.7" fill="none" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M240.0 100.0L305.0 100.0" class="flow" fill="none" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round"/><path d="M297.1 104.3L305.0 100.0L297.1 95.7" fill="none" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="55" y="148" class="t" font-size="13" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Wheat ₹20/kg</text><text x="200" y="148" class="t" font-size="13" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Flour ₹25/kg</text><text x="345" y="148" class="t" font-size="13" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Biscuits ₹80</text><rect x="40" y="170" width="320" height="50" rx="10" fill="#FFF1D6" class="o" stroke-width="2"/><text x="200" y="192" class="t" font-size="13" font-weight="600" text-anchor="middle" fill="#2B2F4A" >The ₹80 already includes the flour,</text><text x="200" y="210" class="t" font-size="13" font-weight="600" text-anchor="middle" fill="#2B2F4A" >so counting each stage again repeats value</text></svg>