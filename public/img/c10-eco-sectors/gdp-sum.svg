<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Production of the three sectors adds up to GDP</title><style>.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.t{font-family:system-ui,sans-serif;fill:#2B2F4A}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.drive{animation:drive 4s ease-in-out infinite alternate}@keyframes drive{0%{transform:translateX(0)}100%{transform:translateX(26px)}}.flow{stroke-dasharray:7 6;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}.puff{animation:puff 2.8s ease-in infinite;transform-box:fill-box;transform-origin:center}@keyframes puff{0%{transform:translate(0,0) scale(.6);opacity:.9}100%{transform:translate(6px,-22px) scale(1.3);opacity:0}}.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><g transform="translate(60 28) scale(0.7)" ><path d="M-28 24H28" fill="none" class="o" /><rect x="-30" y="16" width="60" height="10" rx="3" fill="#A9743F" class="o" /><path d="M0 16V-6M-8 6L-12 -4M8 6L12 -2" fill="none" class="o" stroke="#3FA34D"/><circle cx="-12" cy="-10" r="8" fill="#FFFFFF" class="o" /><circle cx="0" cy="-16" r="8" fill="#FFFFFF" class="o" /><circle cx="12" cy="-8" r="8" fill="#FFFFFF" class="o" /></g><g transform="translate(60 108) scale(0.7)" ><rect x="10" y="-22" width="10" height="34" rx="2" fill="#B5654A" class="o" /><path d="M-28 24V-4L-12 -12V-4L2 -12V-4L16 -12V24Z" fill="#E8B04A" class="o" /><rect x="-22" y="6" width="10" height="18" rx="2" fill="#FFFFFF" class="o" /><rect x="-4" y="4" width="10" height="10" rx="2" fill="#E3F2FD" class="o" /></g><g transform="translate(60 188) scale(0.45)" ><path d="M-30 -8L0 -26L30 -8Z" fill="#FFD23F" class="o" /><rect x="-22" y="-6" width="8" height="26" rx="1" fill="#FFFFFF" class="o" /><rect x="-8" y="-6" width="8" height="26" rx="1" fill="#FFFFFF" class="o" /><rect x="6" y="-6" width="8" height="26" rx="1" fill="#FFFFFF" class="o" /><rect x="20" y="-6" width="8" height="26" rx="1" fill="#FFFFFF" class="o" /><rect x="-32" y="20" width="64" height="8" rx="2" fill="#C9CED6" class="o" /></g><path d="M105 30Q160 30 170 108M105 110Q150 110 170 118M105 188Q160 188 175 128" fill="none" class="flow" stroke="#2B2F4A" stroke-width="3"/><rect x="190" y="70" width="190" height="100" rx="14" fill="#FFF1D6" class="o" /><text x="285" y="108" class="t" font-size="30" font-weight="800" text-anchor="middle" fill="#FF8A1F" >GDP</text><text x="285" y="134" class="t" font-size="12" font-weight="500" text-anchor="middle" fill="#2B2F4A" >value of all final goods</text><text x="285" y="150" class="t" font-size="12" font-weight="500" text-anchor="middle" fill="#2B2F4A" >and services in one year</text><text x="60" y="62" class="t" font-size="11" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Primary</text><text x="60" y="142" class="t" font-size="11" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Secondary</text><text x="60" y="222" class="t" font-size="11" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Tertiary</text></svg>