<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Paid leave, provident fund, pension, overtime pay, notice-free dismissal and no fixed hours</title><style>.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.t{font-family:system-ui,sans-serif;fill:#2B2F4A}.bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.drive{animation:drive 4s ease-in-out infinite alternate}@keyframes drive{0%{transform:translateX(0)}100%{transform:translateX(26px)}}.flow{stroke-dasharray:7 6;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-13}}.puff{animation:puff 2.8s ease-in infinite;transform-box:fill-box;transform-origin:center}@keyframes puff{0%{transform:translate(0,0) scale(.6);opacity:.9}100%{transform:translate(6px,-22px) scale(1.3);opacity:0}}.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="16.0" y="16.0" width="117.33333333333333" height="100.0" rx="12" fill="#FFFFFF" stroke="#E2D6BC" stroke-width="2"/><g transform="translate(74.66666666666666 58.0) scale(0.9)" ><rect x="-26" y="-26" width="52" height="52" rx="6" fill="#F1ECDD" class="o" /><rect x="-26" y="-26" width="52" height="14" rx="6" fill="#E5484D" class="o" /><text x="0" y="10" class="t" font-size="13" font-weight="800" text-anchor="middle" fill="#2B2F4A" >Leave</text></g><text x="74.66666666666666" y="106.0" class="t" font-size="12" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Paid leave</text><rect x="141.33333333333331" y="16.0" width="117.33333333333333" height="100.0" rx="12" fill="#FFFFFF" stroke="#E2D6BC" stroke-width="2"/><g transform="translate(199.99999999999997 58.0) scale(1.1)" ><circle cx="0" cy="0" r="18" fill="#FFD23F" class="o" /><text x="0" y="6" class="t" font-size="18" font-weight="700" text-anchor="middle" fill="#2B2F4A" >₹</text></g><text x="199.99999999999997" y="106.0" class="t" font-size="12" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Provident fund</text><rect x="266.66666666666663" y="16.0" width="117.33333333333333" height="100.0" rx="12" fill="#FFFFFF" stroke="#E2D6BC" stroke-width="2"/><g transform="translate(325.3333333333333 58.0) scale(1.0)" ><g ><path d="M-10 22V2Q-10 -8 0 -8Q10 -8 10 2V22Z" fill="#9AA3AE" class="o" /><circle cx="0" cy="-16" r="7" fill="#F6C79B" class="o" /></g></g><text x="325.3333333333333" y="106.0" class="t" font-size="12" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Pension</text><rect x="16.0" y="124.0" width="117.33333333333333" height="100.0" rx="12" fill="#FFFFFF" stroke="#E2D6BC" stroke-width="2"/><g transform="translate(74.66666666666666 166.0) scale(1.0)" ><g transform="translate(0 0) scale(1)" ><circle cx="0" cy="0" r="18" fill="#FFD23F" class="o" /><text x="0" y="6" class="t" font-size="18" font-weight="700" text-anchor="middle" fill="#2B2F4A" >₹</text></g><text x="0" y="-26" class="t" font-size="14" font-weight="800" text-anchor="middle" fill="#E5484D" >2×</text></g><text x="74.66666666666666" y="214.0" class="t" font-size="12" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Overtime pay</text><rect x="141.33333333333331" y="124.0" width="117.33333333333333" height="100.0" rx="12" fill="#FFFFFF" stroke="#E2D6BC" stroke-width="2"/><g transform="translate(199.99999999999997 166.0) scale(1.0)" ><g ><path d="M-10 22V2Q-10 -8 0 -8Q10 -8 10 2V22Z" fill="#9AA3AE" class="o" /><circle cx="0" cy="-16" r="7" fill="#F6C79B" class="o" /></g></g><text x="199.99999999999997" y="214.0" class="t" font-size="12" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Told to leave any time</text><rect x="266.66666666666663" y="124.0" width="117.33333333333333" height="100.0" rx="12" fill="#FFFFFF" stroke="#E2D6BC" stroke-width="2"/><g transform="translate(325.3333333333333 166.0) scale(1.0)" ><rect x="-24" y="-18" width="48" height="36" rx="18" fill="#FFFFFF" class="o" /><path d="M0 0V-12M0 0L8 4" fill="none" class="o" stroke-width="3"/></g><text x="325.3333333333333" y="214.0" class="t" font-size="12" font-weight="600" text-anchor="middle" fill="#2B2F4A" >Hours not fixed</text></svg>