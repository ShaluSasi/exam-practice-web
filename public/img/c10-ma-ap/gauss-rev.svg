<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Sum written forward and in reverse</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="26" font-size="14" text-anchor="middle" >Add the sum to itself written backwards</text><text x="84" y="70" font-size="13" text-anchor="middle" >a</text><text x="84" y="110" font-size="13" text-anchor="middle" fill="#0B93D4" >a+(n−1)d</text><rect x="46" y="130" width="76" height="28" rx="6" fill="#FFD9A8" stroke="#FF8A1F" stroke-width="2.5" class="pu" style="animation-delay:0.00s"/><text x="84" y="149" font-size="12" text-anchor="middle" >2a+(n−1)d</text><text x="172" y="70" font-size="13" text-anchor="middle" >a+d</text><text x="172" y="110" font-size="13" text-anchor="middle" fill="#0B93D4" >a+(n−2)d</text><rect x="134" y="130" width="76" height="28" rx="6" fill="#FFD9A8" stroke="#FF8A1F" stroke-width="2.5" class="pu" style="animation-delay:0.30s"/><text x="172" y="149" font-size="12" text-anchor="middle" >2a+(n−1)d</text><text x="252" y="70" font-size="13" text-anchor="middle" >. . .</text><text x="252" y="110" font-size="13" text-anchor="middle" fill="#0B93D4" >. . .</text><text x="252" y="149" font-size="12" text-anchor="middle" >. . .</text><text x="346" y="70" font-size="13" text-anchor="middle" >a+(n−1)d</text><text x="346" y="110" font-size="13" text-anchor="middle" fill="#0B93D4" >a</text><rect x="308" y="130" width="76" height="28" rx="6" fill="#FFD9A8" stroke="#FF8A1F" stroke-width="2.5" class="pu" style="animation-delay:0.90s"/><text x="346" y="149" font-size="12" text-anchor="middle" >2a+(n−1)d</text><text x="24" y="70" font-size="15" text-anchor="start" >S</text><text x="24" y="110" font-size="15" text-anchor="start" fill="#0B93D4" >S</text><text x="10" y="149" font-size="13" text-anchor="start" >2S</text><text x="200" y="200" font-size="13" text-anchor="middle" >n columns, each with the same total</text></svg>
