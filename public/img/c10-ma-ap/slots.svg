<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Four terms of an AP</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="26" font-size="14" text-anchor="middle" >Four terms of an AP</text><rect x="12" y="81.6" width="27" height="42" rx="8" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5" /><text x="25.5" y="108.6" font-size="12" text-anchor="middle" >a1</text><rect x="50.8" y="81.6" width="27" height="42" rx="8" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5" /><text x="64.3" y="108.6" font-size="12" text-anchor="middle" >a2</text><rect x="89.6" y="81.6" width="27" height="42" rx="8" fill="#FFD9A8" stroke="#2B2F4A" stroke-width="2.5" /><text x="103.1" y="108.6" font-size="12" text-anchor="middle" >a3</text><rect x="128.3" y="81.6" width="27" height="42" rx="8" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5" /><text x="141.8" y="108.6" font-size="12" text-anchor="middle" >a4</text><rect x="167.1" y="81.6" width="27" height="42" rx="8" fill="#C8EBCB" stroke="#2B2F4A" stroke-width="2.5" /><text x="180.6" y="108.6" font-size="12" text-anchor="middle" >a5</text><rect x="205.9" y="81.6" width="27" height="42" rx="8" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5" /><text x="219.4" y="108.6" font-size="12" text-anchor="middle" >a6</text><rect x="244.7" y="81.6" width="27" height="42" rx="8" fill="#FFD9A8" stroke="#2B2F4A" stroke-width="2.5" /><text x="258.2" y="108.6" font-size="12" text-anchor="middle" >a7</text><rect x="283.4" y="81.6" width="27" height="42" rx="8" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5" /><text x="296.9" y="108.6" font-size="12" text-anchor="middle" >a8</text><rect x="322.2" y="81.6" width="27" height="42" rx="8" fill="#C8EBCB" stroke="#2B2F4A" stroke-width="2.5" /><text x="335.7" y="108.6" font-size="12" text-anchor="middle" >a9</text><rect x="361" y="81.6" width="27" height="42" rx="8" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5" /><text x="374.5" y="108.6" font-size="12" text-anchor="middle" >a10</text><text x="200" y="228" font-size="12" text-anchor="middle" >a3 + a7 = 30 (orange)    a5 + a9 = 46 (green)</text></svg>
