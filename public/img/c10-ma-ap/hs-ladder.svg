<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Rungs of a ladder</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="24" font-size="14" text-anchor="middle" >Rungs of a ladder</text><line x1="86.8" y1="207.2" x2="109.7" y2="34.8" stroke="#B97A3A" stroke-width="7" stroke-linecap="round" /><line x1="273.2" y1="207.2" x2="250.3" y2="34.8" stroke="#B97A3A" stroke-width="7" stroke-linecap="round" /><line x1="88" y1="198" x2="272" y2="198" stroke="#D9A05B" stroke-width="6" stroke-linecap="round" class="pu" style="animation-delay:0.00s"/><text x="288" y="202" font-size="13" text-anchor="start" class="h" >45 cm</text><line x1="92.1" y1="167.2" x2="267.9" y2="167.2" stroke="#D9A05B" stroke-width="6" stroke-linecap="round" class="pu" style="animation-delay:0.25s"/><line x1="96.2" y1="136.4" x2="263.8" y2="136.4" stroke="#D9A05B" stroke-width="6" stroke-linecap="round" class="pu" style="animation-delay:0.50s"/><line x1="100.3" y1="105.6" x2="259.7" y2="105.6" stroke="#D9A05B" stroke-width="6" stroke-linecap="round" class="pu" style="animation-delay:0.75s"/><line x1="104.4" y1="74.8" x2="255.6" y2="74.8" stroke="#D9A05B" stroke-width="6" stroke-linecap="round" class="pu" style="animation-delay:1.00s"/><line x1="108.4" y1="44" x2="251.6" y2="44" stroke="#D9A05B" stroke-width="6" stroke-linecap="round" class="pu" style="animation-delay:1.25s"/><text x="200" y="228" font-size="12" text-anchor="middle" >Each rung is 2 cm shorter than the one below it</text></svg>
