30s"/><rect x="336" y="100" width="16" height="70" rx="3" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" class="pu" style="animation-delay:0.60s"/><rect x="360" y="80" width="16" height="90" rx="3" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" class="pu" style="animation-delay:0.90s"/><text x="332" y="218" font-size="13" text-anchor="middle" class="h" >Money box</text></svg>
