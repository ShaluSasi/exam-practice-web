<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A term counted from the end</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="28" font-size="14" text-anchor="middle" >A term counted from the end</text><rect x="10" y="60" width="116" height="110" rx="10" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5" /><text x="22" y="80" font-size="13" text-anchor="start" fill="#FF8A1F" >1</text><text x="68" y="104" font-size="11" text-anchor="middle" >Find d and the</text><text x="68" y="120" font-size="11" text-anchor="middle" >last term l</text><g class="pu" style="animation-delay:0.00s"><line x1="128" y1="115" x2="135" y2="115" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" /><polygon points="0,0 -9,-4.5 -9,4.5" fill="#FF8A1F" transform="translate(141 115) rotate(0.0)"/></g><rect x="142" y="60" width="116" height="110" rx="10" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5" /><text x="154" y="80" font-size="13" text-anchor="start" fill="#FF8A1F" >2</text><text x="200" y="104" font-size="11" text-anchor="middle" >Use l = a+(n−1)d</text><text x="200" y="120" font-size="11" text-anchor="middle" >to get n</text><g class="pu" style="animation-delay:0.30s"><line x1="260" y1="115" x2="267" y2="115" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" /><polygon points="0,0 -9,-4.5 -9,4.5" fill="#FF8A1F" transform="translate(273 115) rotate(0.0)"/></g><rect x="274" y="60" width="116" height="110" rx="10" fill="#E8F7EA" stroke="#2B2F4A" stroke-width="2.5" /><text x="286" y="80" font-size="13" text-anchor="start" fill="#FF8A1F" >3</text><text x="332" y="104" font-size="11" text-anchor="middle" >Position from start</text><text x="332" y="120" font-size="11" text-anchor="middle" >= n − k + 1, then</text><text x="332" y="136" font-size="11" text-anchor="middle" >use the a_n formula</text></svg>
