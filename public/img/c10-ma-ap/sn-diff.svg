<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>S10 and S9</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="26" font-size="14" text-anchor="middle" >Two running totals</text><rect x="74" y="82.7" width="72" height="122.3" rx="4" fill="#BFE3F6" stroke="#2B2F4A" stroke-width="2.5" /><text x="110" y="223" font-size="14" text-anchor="middle" >S9</text><rect x="214" y="55" width="72" height="150" rx="4" fill="#BFE3F6" stroke="#2B2F4A" stroke-width="2.5" /><text x="250" y="223" font-size="14" text-anchor="middle" >S10</text><rect x="214" y="55" width="72" height="27.7" rx="4" fill="#FFD9A8" stroke="#FF8A1F" stroke-width="2.5" class="pu"/><text x="250" y="73.8" font-size="15" text-anchor="middle" >?</text><line x1="150" y1="82.7" x2="214" y2="82.7" stroke="#8A8FB0" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4" /></svg>
