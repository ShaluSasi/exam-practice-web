<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>hs-spiral</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M208 100A18 18 0 0 0 172 100" fill="none" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round" class="pu" style="animation-delay:0.30s"/><path d="M172 100A36 36 0 0 0 244 100" fill="none" stroke="#0B93D4" stroke-width="3.5" stroke-linecap="round" class="pu" style="animation-delay:0.60s"/><path d="M244 100A54 54 0 0 0 136 100" fill="none" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round" class="pu" style="animation-delay:0.90s"/><path d="M136 100A72 72 0 0 0 280 100" fill="none" stroke="#0B93D4" stroke-width="3.5" stroke-linecap="round" class="pu" style="animation-delay:1.20s"/><path d="M280 100A90 90 0 0 0 100 100" fill="none" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round" class="pu" style="animation-delay:1.50s"/><path d="M100 100A108 108 0 0 0 316 100" fill="none" stroke="#0B93D4" stroke-width="3.5" stroke-linecap="round" class="pu" style="animation-delay:1.80s"/><circle cx="190" cy="100" r="4" fill="#2B2F4A" /><circle cx="208" cy="100" r="4" fill="#2B2F4A" /><text x="182" y="118" font-size="13" text-anchor="end" class="h" >A</text><text x="216" y="118" font-size="13" text-anchor="start" class="h" >B</text><text x="200" y="230" font-size="12" text-anchor="middle" >Semicircles with centres alternately at A and B</text></svg>
