<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A bamboo ladder</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="24" font-size="14" text-anchor="middle" >A bamboo ladder</text><line x1="86.7" y1="207.2" x2="110.8" y2="34.8" stroke="#B97A3A" stroke-width="7" stroke-linecap="round" /><line x1="273.3" y1="207.2" x2="249.2" y2="34.8" stroke="#B97A3A" stroke-width="7" stroke-linecap="round" /><line x1="88" y1="198" x2="272" y2="198" stroke="#D9A05B" stroke-width="6" stroke-linecap="round" class="pu" style="animation-delay:0.00s"/><text x="288" y="202" font-size="13" text-anchor="start" class="h" >60 cm</text><line x1="91.1" y1="176" x2="268.9" y2="176" stroke="#D9A05B" stroke-width="6" stroke-linecap="round" class="pu" style="animation-delay:0.25s"/><line x1="94.1" y1="154" x2="265.9" y2="154" stroke="#D9A05B" stroke-width="6" stroke-linecap="round" class="pu" style="animation-delay:0.50s"/><line x1="97.2" y1="132" x2="262.8" y2="132" stroke="#D9A05B" stroke-width="6" stroke-linecap="round" class="pu" style="animation-delay:0.75s"/><line x1="100.3" y1="110" x2="259.7" y2="110" stroke="#D9A05B" stroke-width="6" stroke-linecap="round" class="pu" style="animation-delay:1.00s"/><line x1="103.3" y1="88" x2="256.7" y2="88" stroke="#D9A05B" stroke-width="6" stroke-linecap="round" class="pu" style="animation-delay:1.25s"/><line x1="106.4" y1="66" x2="253.6" y2="66" stroke="#D9A05B" stroke-width="6" stroke-linecap="round" class="pu" style="animation-delay:1.50s"/><line x1="109.5" y1="44" x2="250.5" y2="44" stroke="#D9A05B" stroke-width="6" stroke-linecap="round" class="pu" style="animation-delay:1.75s"/><text x="200" y="228" font-size="12" text-anchor="middle" >Each rung is 2 cm shorter than the rung below</text></svg>
