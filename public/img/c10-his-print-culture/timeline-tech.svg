<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A timeline with five printing machines or symbols: a wooden screw press, a metal press, a cylinder press, six colour dots and a lightning bolt</title><style>text{font-family:sans-serif;fill:#2B2F4A}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.4}to{opacity:1}}.bob{animation:bob 2s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}.sl{animation:sl 2.4s ease-in-out infinite alternate}@keyframes sl{to{transform:translateX(26px)}}.gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr 2.8s ease-out infinite alternate}@keyframes gr{from{transform:scaleY(.15)}to{transform:scaleY(1)}}.fly{animation:fly 3s linear infinite}@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(70px,-14px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><line x1="20" y1="140" x2="380" y2="140" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><circle cx="40" cy="140" r="7" fill="#F6C453" stroke="#2B2F4A" stroke-width="3" /><text x="40" y="168" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >1430s</text><circle cx="120" cy="140" r="7" fill="#F6C453" stroke="#2B2F4A" stroke-width="3" /><text x="120" y="168" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >late 1700s</text><circle cx="200" cy="140" r="7" fill="#F6C453" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="168" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >mid-1800s</text><circle cx="280" cy="140" r="7" fill="#F6C453" stroke="#2B2F4A" stroke-width="3" /><text x="280" y="168" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >late 1800s</text><circle cx="360" cy="140" r="7" fill="#F6C453" stroke="#2B2F4A" stroke-width="3" /><text x="360" y="168" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >1900s</text><rect x="26" y="86" width="28" height="6" rx="1" fill="#C98F5A" stroke="#2B2F4A" stroke-width="2" /><rect x="38" y="64" width="4" height="22" rx="1" fill="#9AA0B5" stroke="#2B2F4A" stroke-width="2" /><line x1="28" y1="62" x2="52" y2="62" stroke="#8A5A33" stroke-width="3" stroke-linecap="round" /><rect x="30" y="92" width="20" height="10" rx="1" fill="#555" stroke="#2B2F4A" stroke-width="2" /><rect x="104" y="100" width="32" height="10" rx="1" fill="#8E96AE" stroke="#2B2F4A" stroke-width="2" /><rect x="106" y="66" width="6" height="34" rx="1" fill="#8E96AE" stroke="#2B2F4A" stroke-width="2" /><rect x="128" y="66" width="6" height="34" rx="1" fill="#8E96AE" stroke="#2B2F4A" stroke-width="2" /><rect x="104" y="62" width="32" height="8" rx="1" fill="#8E96AE" stroke="#2B2F4A" stroke-width="2" /><rect x="114" y="86" width="12" height="8" rx="1" fill="#555" stroke="#2B2F4A" stroke-width="2" /><circle cx="200" cy="84" r="18" fill="#C9D6F2" stroke="#2B2F4A" stroke-width="3" /><circle cx="200" cy="84" r="5" fill="#2B2F4A" stroke="none" stroke-width="2" /><rect x="172" y="106" width="56" height="8" rx="1" fill="#C9D6F2" stroke="#2B2F4A" stroke-width="2" /><g class="sl" style="animation-duration:2s;transform:translateX(-4px)" ><rect x="184" y="74" width="32" height="14" rx="1" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /></g><circle cx="262" cy="76" r="7" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" /><circle cx="280" cy="76" r="7" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" /><circle cx="298" cy="76" r="7" fill="#F6C453" stroke="#2B2F4A" stroke-width="2" /><circle cx="262" cy="94" r="7" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" /><circle cx="280" cy="94" r="7" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2" /><circle cx="298" cy="94" r="7" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" /><path d="M366 60 l-18 30 h14 l-6 24 l24 -34 h-14z" fill="#F6C453" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="200" y="30" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Changes in printing technology</text><text x="200" y="210" font-size="11" fill="#9AA0B5" text-anchor="middle" font-weight="700" >time moves right</text></svg>