<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A book with a dust jacket, a cheap paperback and a stack of coins</title><style>text{font-family:sans-serif;fill:#2B2F4A}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.4}to{opacity:1}}.bob{animation:bob 2s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}.sl{animation:sl 2.4s ease-in-out infinite alternate}@keyframes sl{to{transform:translateX(26px)}}.gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr 2.8s ease-out infinite alternate}@keyframes gr{from{transform:scaleY(.15)}to{transform:scaleY(1)}}.fly{animation:fly 3s linear infinite}@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(70px,-14px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="190" width="400" height="50" rx="0" fill="#E6CFA2" stroke="none" stroke-width="0" /><rect x="60" y="60" width="70" height="100" rx="3" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" /><rect x="52" y="54" width="16" height="112" rx="3" fill="#B93036" stroke="#2B2F4A" stroke-width="3" /><rect x="70" y="76" width="50" height="24" rx="2" fill="#FFF9EE" stroke="#2B2F4A" stroke-width="2" /><rect x="160" y="70" width="64" height="90" rx="3" fill="#E8D5A8" stroke="#2B2F4A" stroke-width="3" /><rect x="168" y="84" width="48" height="30" rx="2" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" /><circle cx="290" cy="170" r="22" fill="#E0C070" stroke="#2B2F4A" stroke-width="3" opacity="1"/><circle cx="290" cy="160" r="22" fill="#E0C070" stroke="#2B2F4A" stroke-width="3" opacity="1"/><circle cx="290" cy="150" r="22" fill="#E0C070" stroke="#2B2F4A" stroke-width="3" opacity="1"/><circle cx="290" cy="140" r="22" fill="#E0C070" stroke="#2B2F4A" stroke-width="3" opacity="1"/></svg>