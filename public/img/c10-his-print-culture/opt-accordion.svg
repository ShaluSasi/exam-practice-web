<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A folded accordion book</title><style>text{font-family:sans-serif;fill:#2B2F4A}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.4}to{opacity:1}}.bob{animation:bob 2s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}.sl{animation:sl 2.4s ease-in-out infinite alternate}@keyframes sl{to{transform:translateX(26px)}}.gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr 2.8s ease-out infinite alternate}@keyframes gr{from{transform:scaleY(.15)}to{transform:scaleY(1)}}.fly{animation:fly 3s linear infinite}@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(70px,-14px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M30 110 L55 50 L55 64 L30 124 Z" fill="#F3E3C3" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><line x1="38.5" y1="84" x2="46.5" y2="90" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><path d="M55 50 L80 110 L80 124 L55 64 Z" fill="#FFF" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><line x1="63.5" y1="84" x2="71.5" y2="90" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><path d="M80 110 L105 50 L105 64 L80 124 Z" fill="#F3E3C3" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><line x1="88.5" y1="84" x2="96.5" y2="90" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><path d="M105 50 L130 110 L130 124 L105 64 Z" fill="#FFF" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><line x1="113.5" y1="84" x2="121.5" y2="90" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><path d="M130 110 L155 50 L155 64 L130 124 Z" fill="#F3E3C3" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><line x1="138.5" y1="84" x2="146.5" y2="90" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><path d="M155 50 L170 110 L170 124 L155 64 Z" fill="#FFF" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><line x1="158.5" y1="84" x2="166.5" y2="90" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /></svg>