<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Paper being rubbed against an inked woodblock</title><style>text{font-family:sans-serif;fill:#2B2F4A}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.4}to{opacity:1}}.bob{animation:bob 2s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}.sl{animation:sl 2.4s ease-in-out infinite alternate}@keyframes sl{to{transform:translateX(26px)}}.gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr 2.8s ease-out infinite alternate}@keyframes gr{from{transform:scaleY(.15)}to{transform:scaleY(1)}}.fly{animation:fly 3s linear infinite}@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(70px,-14px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="40" y="170" width="320" height="22" rx="4" fill="#C98F5A" stroke="#2B2F4A" stroke-width="3" /><rect x="60" y="192" width="14" height="36" rx="2" fill="#8A5A33" stroke="#2B2F4A" stroke-width="3" /><rect x="326" y="192" width="14" height="36" rx="2" fill="#8A5A33" stroke="#2B2F4A" stroke-width="3" /><rect x="110" y="146" width="150" height="26" rx="4" fill="#C98F5A" stroke="#2B2F4A" stroke-width="3" /><rect x="118" y="138" width="8" height="10" rx="1" fill="#222" stroke="none" stroke-width="0" /><rect x="133" y="138" width="8" height="10" rx="1" fill="#222" stroke="none" stroke-width="0" /><rect x="148" y="138" width="8" height="10" rx="1" fill="#222" stroke="none" stroke-width="0" /><rect x="163" y="138" width="8" height="10" rx="1" fill="#222" stroke="none" stroke-width="0" /><rect x="178" y="138" width="8" height="10" rx="1" fill="#222" stroke="none" stroke-width="0" /><rect x="193" y="138" width="8" height="10" rx="1" fill="#222" stroke="none" stroke-width="0" /><rect x="208" y="138" width="8" height="10" rx="1" fill="#222" stroke="none" stroke-width="0" /><rect x="223" y="138" width="8" height="10" rx="1" fill="#222" stroke="none" stroke-width="0" /><rect x="238" y="138" width="8" height="10" rx="1" fill="#222" stroke="none" stroke-width="0" /><g class="bob" style="" ><rect x="100" y="122" width="170" height="18" rx="2" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><line x1="120" y1="131" x2="250" y2="131" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /></g><g class="sl" style="animation-duration:2.2s;transform:translateX(-14px)" ><rect x="150" y="92" width="70" height="22" rx="10" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" /><line x1="160" y1="103" x2="210" y2="103" stroke="#fff" stroke-width="2" stroke-linecap="round" /></g><rect x="30" y="138" width="40" height="32" rx="6" fill="#333" stroke="#2B2F4A" stroke-width="3" /><path d="M50 138 L58 112" fill="none" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="290" y="132" width="56" height="38" rx="2" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><line x1="298.4" y1="141.5" x2="337.6" y2="141.5" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="298.4" y1="151" x2="337.6" y2="151" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="298.4" y1="160.5" x2="337.6" y2="160.5" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><text x="200" y="22" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Paper rubbed on the inked woodblock</text><text x="200" y="40" font-size="12" fill="#9AA0B5" text-anchor="middle" font-weight="700" >AD 594 onwards</text></svg>