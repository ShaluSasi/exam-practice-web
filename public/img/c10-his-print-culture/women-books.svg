<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A row of books on a shelf and a quill pen</title><style>text{font-family:sans-serif;fill:#2B2F4A}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.4}to{opacity:1}}.bob{animation:bob 2s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}.sl{animation:sl 2.4s ease-in-out infinite alternate}@keyframes sl{to{transform:translateX(26px)}}.gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr 2.8s ease-out infinite alternate}@keyframes gr{from{transform:scaleY(.15)}to{transform:scaleY(1)}}.fly{animation:fly 3s linear infinite}@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(70px,-14px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="190" width="400" height="50" rx="0" fill="#E6CFA2" stroke="none" stroke-width="0" /><rect x="40" y="150" width="320" height="14" rx="3" fill="#C98F5A" stroke="#2B2F4A" stroke-width="3" /><rect x="60" y="92" width="48" height="58" rx="3" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" /><line x1="68.64" y1="95" x2="68.64" y2="147" stroke="#fff" stroke-width="2" stroke-linecap="round" /><line x1="74.4" y1="109.4" x2="98.4" y2="109.4" stroke="#FFF" stroke-width="2" stroke-linecap="round" /><line x1="74.4" y1="123.9" x2="98.4" y2="123.9" stroke="#FFF" stroke-width="2" stroke-linecap="round" /><rect x="120" y="92" width="48" height="58" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" /><line x1="128.64" y1="95" x2="128.64" y2="147" stroke="#fff" stroke-width="2" stroke-linecap="round" /><line x1="134.4" y1="109.4" x2="158.4" y2="109.4" stroke="#FFF" stroke-width="2" stroke-linecap="round" /><line x1="134.4" y1="123.9" x2="158.4" y2="123.9" stroke="#FFF" stroke-width="2" stroke-linecap="round" /><rect x="180" y="92" width="48" heig