<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A weekly newspaper with a Gazette heading, advertisements and a speech bubble about gossip</title><style>text{font-family:sans-serif;fill:#2B2F4A}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.4}to{opacity:1}}.bob{animation:bob 2s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}.sl{animation:sl 2.4s ease-in-out infinite alternate}@keyframes sl{to{transform:translateX(26px)}}.gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr 2.8s ease-out infinite alternate}@keyframes gr{from{transform:scaleY(.15)}to{transform:scaleY(1)}}.fly{animation:fly 3s linear infinite}@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(70px,-14px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="110" y="16" width="180" height="208" rx="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><rect x="120" y="26" width="160" height="30" rx="2" fill="#2B2F4A" stroke="none" stroke-width="0" /><text x="200" y="48" font-size="18" fill="#fff" text-anchor="middle" font-weight="700" >GAZETTE</text><text x="200" y="70" font-size="11" fill="#9AA0B5" text-anchor="middle" font-weight="700" >weekly</text><line x1="124" y1="82" x2="196" y2="82" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="124" y1="98" x2="196" y2="98" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="124" y1="114" x2="196" y2="114" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="124" y1="130" x2="196" y2="130" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="124" y1="146" x2="196" y2="146" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="124" y1="162" x2="196" y2="162" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="124" y1="178" x2="196" y2="178" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="124" y1="194" x2="196" y2="194" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="204" y1="82" x2="276" y2="82" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="204" y1="98" x2="276" y2="98" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="204" y1="114" x2="276" y2="114" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="204" y1="130" x2="276" y2="130" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="204" y1="146" x2="276" y2="146" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="204" y1="162" x2="276" y2="162" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="204" y1="178" x2="276" y2="178" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="204" y1="194" x2="276" y2="194" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><rect x="124" y="150" width="70" height="38" rx="2" fill="#FFE9C4" stroke="#2B2F4A" stroke-width="2" /><text x="159" y="174" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >ADS</text><g class="bob" style="" ><path d="M310 90 h60 a8 8 0 0 1 8 8 v26 a8 8 0 0 1 -8 8 h-30 l-12 12 v-12 h-18 a8 8 0 0 1 -8 -8 v-26 a8 8 0 0 1 8 -8z" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="340" y="116" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >gossip</text></g><rect x="30" y="130" width="50" height="40" rx="3" fill="#E8D9B5" stroke="#2B2F4A" stroke-width="3" /><line x1="36" y1="142" x2="74" y2="142" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="36" y1="152" x2="74" y2="152" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="36" y1="162" x2="74" y2="162" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /></svg>