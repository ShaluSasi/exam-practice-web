<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A teacher speaking from memory while seated pupils write on palm leaves</title><style>text{font-family:sans-serif;fill:#2B2F4A}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.4}to{opacity:1}}.bob{animation:bob 2s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}.sl{animation:sl 2.4s ease-in-out infinite alternate}@keyframes sl{to{transform:translateX(26px)}}.gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr 2.8s ease-out infinite alternate}@keyframes gr{from{transform:scaleY(.15)}to{transform:scaleY(1)}}.fly{animation:fly 3s linear infinite}@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(70px,-14px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="150" width="400" height="90" rx="0" fill="#E0C896" stroke="none" stroke-width="0" /><line x1="83" y1="130.4" x2="83" y2="150" stroke="#2B2F4A" stroke-width="4.199999999999999" stroke-linecap="round" /><line x1="97" y1="130.4" x2="97" y2="150" stroke="#2B2F4A" stroke-width="4.199999999999999" stroke-linecap="round" /><rect x="76" y="91.2" width="28" height="40.6" rx="11.2" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2" /><circle cx="90" cy="77.2" r="12.6" fill="#F2C79B" stroke="#2B2F4A" stroke-width="2" /><path d="M77.4 75.8 a12.6 12.6 0 0 1 25.2 0 Z" fill="#2B2F4A" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="60" y="134" width="70" height="10" rx="2" fill="#C98F5A" stroke="#2B2F4A" stroke-width="2" /><g class="pu" style="animation-delay:0.0s" ><path d="M140 70 q10 12 0 24" fill="none" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g class="pu" style="animation-delay:0.4s" ><path d="M154 70 q10 12 0 24" fill="none" strok