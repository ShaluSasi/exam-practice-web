<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A luxury handwritten book on vellum with gold</title><style>text{font-family:sans-serif;fill:#2B2F4A}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.4}to{opacity:1}}.bob{animation:bob 2s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}.sl{animation:sl 2.4s ease-in-out infinite alternate}@keyframes sl{to{transform:translateX(26px)}}.gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr 2.8s ease-out infinite alternate}@keyframes gr{from{transform:scaleY(.15)}to{transform:scaleY(1)}}.fly{animation:fly 3s linear infinite}@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(70px,-14px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="40" y="26" width="120" height="100" rx="4" fill="#FFF1C9" stroke="#2B2F4A" stroke-width="3" /><rect x="48" y="34" width="104" height="84" rx="2" fill="none" stroke="#F6C453" stroke-width="3" /><rect x="54" y="40" width="20" height="20" rx="2" fill="#F6C453" stroke="#2B2F4A" stroke-width="2" /><line x1="82" y1="46" x2="144" y2="46" stroke="#7a5a1a" stroke-width="2" stroke-linecap="round" /><line x1="82" y1="56" x2="144" y2="56" stroke="#7a5a1a" stroke-width="2" stroke-linecap="round" /><line x1="82" y1="66" x2="144" y2="66" stroke="#7a5a1a" stroke-width="2" stroke-linecap="round" /><line x1="82" y1="76" x2="144" y2="76" stroke="#7a5a1a" stroke-width="2" stroke-linecap="round" /><line x1="82" y1="86" x2="144" y2="86" stroke="#7a5a1a" stroke-width="2" stroke-linecap="round" /><line x1="82" y1="96" x2="144" y2="96" stroke="#7a5a1a" stroke-width="2" stroke-linecap="round" /><line x1="82" y1="106" x2="144" y2="106" stroke="#7a5a1a" stroke-width="2" stroke-linecap="round" /><line x1="54" y1="70" x2="144" y2="70" stroke="#7a5a1a" stroke-width="2" stroke-linecap="round" /><line x1="54" y1="80" x2="144" y2="80" stroke="#7a5a1a" stroke-width="2" stroke-linecap="round" /><line x1="54" y1="90" x2="144" y2="90" stroke="#7a5a1a" stroke-width="2" stroke-linecap="round" /><line x1="54" y1="100" x2="144" y2="100" stroke="#7a5a1a" stroke-width="2" stroke-linecap="round" /></svg>