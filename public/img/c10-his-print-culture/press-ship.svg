<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A sailing ship carrying a printing press towards a coastal building</title><style>text{font-family:sans-serif;fill:#2B2F4A}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.4}to{opacity:1}}.bob{animation:bob 2s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}.sl{animation:sl 2.4s ease-in-out infinite alternate}@keyframes sl{to{transform:translateX(26px)}}.gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr 2.8s ease-out infinite alternate}@keyframes gr{from{transform:scaleY(.15)}to{transform:scaleY(1)}}.fly{animation:fly 3s linear infinite}@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(70px,-14px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="150" width="400" height="90" rx="0" fill="#BFE3F5" stroke="none" stroke-width="0" /><g class="pu" style="" ><path d="M60 150 q12 -8 24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0" fill="none" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g class="bob" style="" ><path d="M110 140 L290 140 L260 182 L140 182Z" fill="#8A5A33" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><line x1="200" y1="140" x2="200" y2="40" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><path d="M204 44 L204 128 L270 128Z" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M196 50 L196 128 L150 128Z" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="168" y="112" width="30" height="28" rx="3" fill="#C98F5A" stroke="#2B2F4A" stroke-width="3" /><rect x="176" y="96" width="6" height="16" rx="1" fill="#9AA0B5" stroke="#2B2F4A" stroke-width="2" /><line x1="170" y1="96" x2="188" y2="96" stroke="#8A5A33" stroke-width="4" stroke-linecap="round" /></g><text x="200" y="26" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >A printing press arrives by sea</text><rect x="330" y="120" width="60" height="60" rx="3" fill="#E8D9B5" stroke="#2B2F4A" stroke-width="3" /><path d="M324 120 L360 92 L396 120Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></svg>