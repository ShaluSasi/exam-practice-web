<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A drawing on thin paper, a carved woodblock, a chisel and a finished print</title><style>text{font-family:sans-serif;fill:#2B2F4A}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.4}to{opacity:1}}.bob{animation:bob 2s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}.sl{animation:sl 2.4s ease-in-out infinite alternate}@keyframes sl{to{transform:translateX(26px)}}.gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr 2.8s ease-out infinite alternate}@keyframes gr{from{transform:scaleY(.15)}to{transform:scaleY(1)}}.fly{animation:fly 3s linear infinite}@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(70px,-14px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="30" y="50" width="80" height="100" rx="2" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><line x1="42" y1="66.6667" x2="98" y2="66.6667" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="42" y1="83.3333" x2="98" y2="83.3333" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="42" y1="100" x2="98" y2="100" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="42" y1="116.667" x2="98" y2="116.667" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="42" y1="133.333" x2="98" y2="133.333" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><path d="M44 120 q14 -30 30 0" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="60" cy="80" r="8" fill="none" stroke="#E5484D" stroke-width="2" /><rect x="150" y="60" width="90" height="80" rx="4" fill="#C98F5A" stroke="#2B2F4A" stroke-width="3" /><path d="M160 120 q14 -30 30 0" fill="none" stroke="#4a2c12" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="176" cy="90" r="8" fill="none" stroke="#4a2c12" stroke-width="3" /><path d="M270 100 l50 -30" fill="none" stroke="#2B2F4A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><path d="M318 72 l12 -8 l-4 14z" fill="#9AA0B5" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="266" y="104" width="22" height="10" rx="3" fill="#C98F5A" stroke="#2B2F4A" stroke-width="2" /><rect x="280" y="130" width="90" height="80" rx="2" fill="#FFF4DD" stroke="#2B2F4A" stroke-width="2" /><line x1="293.5" y1="150" x2="356.5" y2="150" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="293.5" y1="170" x2="356.5" y2="170" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="293.5" y1="190" x2="356.5" y2="190" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><path d="M295 190 q14 -30 30 0" fill="none" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="312" cy="160" r="8" fill="none" stroke="#0B93D4" stroke-width="2" /><text x="70" y="176" font-size="11" fill="#9AA0B5" text-anchor="middle" font-weight="700" >drawing</text><text x="195" y="164" font-size="11" fill="#9AA0B5" text-anchor="middle" font-weight="700" >carved block</text><text x="295" y="60" font-size="11" fill="#9AA0B5" text-anchor="middle" font-weight="700" >chisel</text><text x="325" y="226" font-size="11" fill="#9AA0B5" text-anchor="middle" font-weight="700" >print</text></svg>