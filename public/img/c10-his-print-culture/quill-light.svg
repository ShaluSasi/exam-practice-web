<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A printing press sending rays of light while a crown on a stool wobbles</title><style>text{font-family:sans-serif;fill:#2B2F4A}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.4}to{opacity:1}}.bob{animation:bob 2s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}.sl{animation:sl 2.4s ease-in-out infinite alternate}@keyframes sl{to{transform:translateX(26px)}}.gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr 2.8s ease-out infinite alternate}@keyframes gr{from{transform:scaleY(.15)}to{transform:scaleY(1)}}.fly{animation:fly 3s linear infinite}@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(70px,-14px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="190" width="400" height="50" rx="0" fill="#E6CFA2" stroke="none" stroke-width="0" /><rect x="40" y="120" width="110" height="70" rx="4" fill="#C98F5A" stroke="#2B2F4A" stroke-width="3" /><rect x="70" y="50" width="10" height="70" rx="2" fill="#9AA0B5" stroke="#2B2F4A" stroke-width="2" /><line x1="52" y1="52" x2="98" y2="52" stroke="#8A5A33" stroke-width="5" stroke-linecap="round" /><rect x="60" y="100" width="40" height="10" rx="2" fill="#9AA0B5" stroke="#2B2F4A" stroke-width="2" /><g class="pu" style="animation-delay:0.0s" ><line x1="160" y1="110" x2="300.413" y2="33.2919" stroke="#F6C453" stroke-width="4" stroke-linecap="round" /></g><g class="pu" style="animation-delay:0.2s" ><line x1="160" y1="110" x2="315.026" y2="70.4154" stroke="#F6C453" stroke-width="4" stroke-linecap="round" /></g><g class="pu" style="animation-delay:0.4s" ><line x1="160" y1="110" x2="320" y2="110" stroke="#F6C453" stroke-width="4" stroke-linecap="round" /></g><g class="pu" style="animation-delay:0.6s" ><line x1="160" y1="110" x2="315.026" y2="149.585" stroke="#F6C453" stroke-width="4" stroke-linecap="round" /></g><g class="pu" style="animation-delay:0.8s" ><line x1="160" y1="110" x2="300.413" y2="186.708" stroke="#F6C453" stroke-width="4" stroke-linecap="round" /></g><rect x="300" y="150" width="60" height="40" rx="4" fill="#8E96AE" stroke="#2B2F4A" stroke-width="3" /><g class="bob" style="" ><path d="M310 150 l6 -26 l10 14 l10 -18 l10 18 l10 -14 l4 26z" fill="#F6C453" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g></svg>