<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A newspaper with a column being cut out by scissors while an eye watches</title><style>text{font-family:sans-serif;fill:#2B2F4A}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.4}to{opacity:1}}.bob{animation:bob 2s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}.sl{animation:sl 2.4s ease-in-out infinite alternate}@keyframes sl{to{transform:translateX(26px)}}.gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr 2.8s ease-out infinite alternate}@keyframes gr{from{transform:scaleY(.15)}to{transform:scaleY(1)}}.fly{animation:fly 3s linear infinite}@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(70px,-14px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="190" width="400" height="50" rx="0" fill="#E6CFA2" stroke="none" stroke-width="0" /><rect x="120" y="24" width="160" height="170" rx="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><rect x="130" y="34" width="140" height="26" rx="2" fill="#2B2F4A" stroke="none" stroke-width="0" /><line x1="134" y1="74" x2="196" y2="74" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="134" y1="90" x2="196" y2="90" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="134" y1="106" x2="196" y2="106" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="134" y1="122" x2="196" y2="122" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="134" y1="138" x2="196" y2="138" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="134" y1="154" x2="196" y2="154" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="134" y1="170" x2="196" y2="170" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="204" y1="74" x2="266" y2="74" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="204" y1="90" x2="266" y2="90" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="204" y1="106" x2="266" y2="106" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="204" y1="122" x2="266" y2="122" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="204" y1="138" x2="266" y2="138" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="204" y1="154" x2="266" y2="154" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="204" y1="170" x2="266" y2="170" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><rect x="204" y="106" width="66" height="34" rx="2" fill="#FFE0E0" stroke="none" stroke-width="0" /><g class="sl" style="animation-duration:1.6s;transform:translateX(-16px)" ><path d="M310 90 L230 120 M310 150 L230 120" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="316" cy="88" r="9" fill="none" stroke="#2B2F4A" stroke-width="4" /><circle cx="316" cy="152" r="9" fill="none" stroke="#2B2F4A" stroke-width="4" /></g><path d="M60 150 a30 30 0 1 0 0.1 0Z" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="60" cy="150" r="12" fill="#2B2F4A" stroke="none" stroke-width="2" /><circle cx="60" cy="150" r="5" fill="#fff" stroke="none" stroke-width="2" /><text x="60" y="200" font-size="11" fill="#9AA0B5" text-anchor="middle" font-weight="700" >watched</text></svg>