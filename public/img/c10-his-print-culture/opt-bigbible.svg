<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A huge heavy decorated Bible</title><style>text{font-family:sans-serif;fill:#2B2F4A}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.4}to{opacity:1}}.bob{animation:bob 2s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}.sl{animation:sl 2.4s ease-in-out infinite alternate}@keyframes sl{to{transform:translateX(26px)}}.gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr 2.8s ease-out infinite alternate}@keyframes gr{from{transform:scaleY(.15)}to{transform:scaleY(1)}}.fly{animation:fly 3s linear infinite}@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(70px,-14px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="26" y="24" width="148" height="100" rx="6" fill="#6B3A1E" stroke="#2B2F4A" stroke-width="3" /><rect x="36" y="34" width="128" height="80" rx="4" fill="none" stroke="#F6C453" stroke-width="3" /><line x1="100" y1="34" x2="100" y2="114" stroke="#F6C453" stroke-width="3" stroke-linecap="round" /><circle cx="100" cy="74" r="10" fill="#F6C453" stroke="#2B2F4A" stroke-width="2" /><line x1="36" y1="128" x2="164" y2="128" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /></svg>