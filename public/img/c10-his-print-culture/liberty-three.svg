<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Three circles: a speech bubble, a newspaper and a group of people</title><style>text{font-family:sans-serif;fill:#2B2F4A}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.4}to{opacity:1}}.bob{animation:bob 2s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}.sl{animation:sl 2.4s ease-in-out infinite alternate}@keyframes sl{to{transform:translateX(26px)}}.gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr 2.8s ease-out infinite alternate}@keyframes gr{from{transform:scaleY(.15)}to{transform:scaleY(1)}}.fly{animation:fly 3s linear infinite}@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(70px,-14px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><circle cx="70" cy="100" r="52" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="70" y="196" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >speech</text><circle cx="200" cy="100" r="52" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="196" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >press</text><circle cx="330" cy="100" r="52" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="330" y="196" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >association</text><path d="M42 84 h56 a6 6 0 0 1 6 6 v26 a6 6 0 0 1 -6 6 h-26 l-10 10 v-10 h-20 a6 6 0 0 1 -6 -6 v-26 a6 6 0 0 1 6 -6z" fill="#F6C453" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="172" y="70" width="56" height="60" rx="2" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><rect x="176" y="74" width="48" height="9.6" rx="1" fill="#2B2F4A" stroke="none" stroke-width="0" /><line x1="175.92" y1="88" x2="198.32" y2="88" stroke="#9AA0B5" 