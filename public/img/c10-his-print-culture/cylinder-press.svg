<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A power-driven cylinder press with a sheet of paper moving between rollers</title><style>text{font-family:sans-serif;fill:#2B2F4A}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.4}to{opacity:1}}.bob{animation:bob 2s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}.sl{animation:sl 2.4s ease-in-out infinite alternate}@keyframes sl{to{transform:translateX(26px)}}.gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr 2.8s ease-out infinite alternate}@keyframes gr{from{transform:scaleY(.15)}to{transform:scaleY(1)}}.fly{animation:fly 3s linear infinite}@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(70px,-14px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="200" width="400" height="40" rx="0" fill="#E6CFA2" stroke="none" stroke-width="0" /><rect x="70" y="170" width="260" height="30" rx="4" fill="#C98F5A" stroke="#2B2F4A" stroke-width="3" /><g class="" style="" ><circle cx="150" cy="130" r="40" fill="#C9D6F2" stroke="#2B2F4A" stroke-width="4" /><line x1="150" y1="90" x2="150" y2="170" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="110" y1="130" x2="190" y2="130" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /></g><g class="" style="" ><circle cx="250" cy="100" r="28" fill="#8E96AE" stroke="#2B2F4A" stroke-width="4" /><circle cx="250" cy="100" r="6" fill="#2B2F4A" stroke="none" stroke-width="2" /></g><g class="sl" style="animation-duration:2.2s" ><rect x="120" y="84" width="150" height="6" rx="1" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /></g><rect x="278" y="150" width="40" height="20" rx="1" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><text x="200" y="40" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Power-driven press: sheets flow through fast</text></svg>