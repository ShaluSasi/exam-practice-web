<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A woodblock workshop with an ink pot, a carved block, a carving tool, sheets drying on a line and a folded book</title><style>text{font-family:sans-serif;fill:#2B2F4A}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.4}to{opacity:1}}.bob{animation:bob 2s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}.sl{animation:sl 2.4s ease-in-out infinite alternate}@keyframes sl{to{transform:translateX(26px)}}.gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr 2.8s ease-out infinite alternate}@keyframes gr{from{transform:scaleY(.15)}to{transform:scaleY(1)}}.fly{animation:fly 3s linear infinite}@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(70px,-14px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><line x1="20" y1="40" x2="380" y2="40" stroke="#8A5A33" stroke-width="3" stroke-linecap="round" /><g class="bob" style="" ><rect x="296" y="40" width="28" height="60" rx="2" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><line x1="302" y1="56" x2="318" y2="56" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="302" y1="68" x2="318" y2="68" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="302" y1="80" x2="318" y2="80" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /></g><g class="bob" style="animation-delay:.6s" ><rect x="336" y="40" width="28" height="60" rx="2" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><line x1="342" y1="56" x2="358" y2="56" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="342" y1="68" x2="358" y2="68" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /></g><rect x="20" y="172" width="360" height="24" rx="4" fill="#C98F5A" stroke="#2B2F4A" stroke-width="3" /><rect x="40" y="19