<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A tiny pocket-size paper booklet beside a penny coin</title><style>text{font-family:sans-serif;fill:#2B2F4A}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.4}to{opacity:1}}.bob{animation:bob 2s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}.sl{animation:sl 2.4s ease-in-out infinite alternate}@keyframes sl{to{transform:translateX(26px)}}.gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr 2.8s ease-out infinite alternate}@keyframes gr{from{transform:scaleY(.15)}to{transform:scaleY(1)}}.fly{animation:fly 3s linear infinite}@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(70px,-14px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="70" y="50" width="50" height="66" rx="3" fill="#E8D5A8" stroke="#2B2F4A" stroke-width="3" /><line x1="78" y1="66" x2="112" y2="66" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="78" y1="78" x2="112" y2="78" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="78" y1="90" x2="112" y2="90" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><circle cx="150" cy="100" r="16" fill="#C98F5A" stroke="#2B2F4A" stroke-width="3" /><text x="150" y="106" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >1d</text></svg>