<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Bar chart of sheets printed per hour: 250 for the Gutenberg press and 8,000 for Hoe's cylindrical press, drawn to scale</title><style>text{font-family:sans-serif;fill:#2B2F4A}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.4}to{opacity:1}}.bob{animation:bob 2s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}.sl{animation:sl 2.4s ease-in-out infinite alternate}@keyframes sl{to{transform:translateX(26px)}}.gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr 2.8s ease-out infinite alternate}@keyframes gr{from{transform:scaleY(.15)}to{transform:scaleY(1)}}.fly{animation:fly 3s linear infinite}@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(70px,-14px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><line x1="60" y1="200" x2="370" y2="200" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="60" y1="200" x2="60" y2="36" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><rect x="100" y="195.312" width="70" height="4.6875" rx="1" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" /><text x="135" y="189.3125" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >250</text><g class="gr" style="" ><rect x="240" y="50" width="70" height="150" rx="2" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" /></g><text x="275" y="30" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >8,000</text><text x="135" y="220" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Gutenberg press</text><text x="275" y="220" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Hoe cylindrical press</text><text x="210" y="14" font-size="12" fill="#9AA0B5" text-anchor="middle" font-weight="700" >Sheets printed per hour</text></svg>