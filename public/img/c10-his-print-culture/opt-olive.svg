<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>An olive press: a big screw pressing down on a basket of olives</title><style>text{font-family:sans-serif;fill:#2B2F4A}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.4}to{opacity:1}}.bob{animation:bob 2s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}.sl{animation:sl 2.4s ease-in-out infinite alternate}@keyframes sl{to{transform:translateX(26px)}}.gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr 2.8s ease-out infinite alternate}@keyframes gr{from{transform:scaleY(.15)}to{transform:scaleY(1)}}.fly{animation:fly 3s linear infinite}@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(70px,-14px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="30" y="120" width="140" height="12" rx="3" fill="#8A5A33" stroke="#2B2F4A" stroke-width="3" /><rect x="60" y="86" width="80" height="34" rx="3" fill="#C9B27A" stroke="#2B2F4A" stroke-width="3" /><rect x="54" y="98" width="92" height="6" rx="2" fill="#8A5A33" stroke="#2B2F4A" stroke-width="2" /><rect x="94" y="26" width="12" height="60" rx="2" fill="#9AA0B5" stroke="#2B2F4A" stroke-width="3" /><line x1="66" y1="28" x2="134" y2="28" stroke="#8A5A33" stroke-width="6" stroke-linecap="round" /><rect x="46" y="16" width="108" height="8" rx="2" fill="#C98F5A" stroke="#2B2F4A" stroke-width="2" /><circle cx="66" cy="28" r="5" fill="#FF8A1F" stroke="none" stroke-width="2" /><circle cx="134" cy="28" r="5" fill="#FF8A1F" stroke="none" stroke-width="2" /><circle cx="70" cy="112" r="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="90" cy="112" r="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="110" cy="112" r="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="130" cy="112" r="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="1.5" /></svg>