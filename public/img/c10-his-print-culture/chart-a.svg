<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A two-bar chart of book copies in millions for 1450-99 and the 1500s</title><style>text{font-family:sans-serif;fill:#2B2F4A}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.4}to{opacity:1}}.bob{animation:bob 2s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}.sl{animation:sl 2.4s ease-in-out infinite alternate}@keyframes sl{to{transform:translateX(26px)}}.gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr 2.8s ease-out infinite alternate}@keyframes gr{from{transform:scaleY(.15)}to{transform:scaleY(1)}}.fly{animation:fly 3s linear infinite}@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(70px,-14px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><line x1="30" y1="126" x2="176" y2="126" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="30" y1="126" x2="30" y2="18" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><rect x="54" y="117.6" width="34" height="8.4" rx="2" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" /><rect x="114" y="42" width="34" height="84" rx="2" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" /><text x="71" y="141" font-size="10" fill="#9AA0B5" text-anchor="middle" font-weight="700" >1450-99</text><text x="131" y="141" font-size="10" fill="#9AA0B5" text-anchor="middle" font-weight="700" >1500s</text><text x="110" y="11" font-size="10" fill="#9AA0B5" text-anchor="middle" font-weight="700" >copies (millions)</text></svg>