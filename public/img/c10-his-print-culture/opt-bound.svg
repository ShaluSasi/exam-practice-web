<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A bound book with a stitched spine</title><style>text{font-family:sans-serif;fill:#2B2F4A}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.4}to{opacity:1}}.bob{animation:bob 2s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}.sl{animation:sl 2.4s ease-in-out infinite alternate}@keyframes sl{to{transform:translateX(26px)}}.gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr 2.8s ease-out infinite alternate}@keyframes gr{from{transform:scaleY(.15)}to{transform:scaleY(1)}}.fly{animation:fly 3s linear infinite}@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(70px,-14px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="40" y="30" width="120" height="92" rx="6" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" /><rect x="40" y="30" width="16" height="92" rx="4" fill="#B93036" stroke="#2B2F4A" stroke-width="3" /><line x1="56" y1="42" x2="56" y2="48" stroke="#fff" stroke-width="3" stroke-linecap="round" /><line x1="56" y1="60" x2="56" y2="66" stroke="#fff" stroke-width="3" stroke-linecap="round" /><line x1="56" y1="78" x2="56" y2="84" stroke="#fff" stroke-width="3" stroke-linecap="round" /><line x1="56" y1="96" x2="56" y2="102" stroke="#fff" stroke-width="3" stroke-linecap="round" /><rect x="78" y="48" width="60" height="24" rx="3" fill="#FFF9EE" stroke="#2B2F4A" stroke-width="2" /></svg>