<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A mill with a chimney, workers walking towards a small library building with books in the window</title><style>text{font-family:sans-serif;fill:#2B2F4A}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.4}to{opacity:1}}.bob{animation:bob 2s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}.sl{animation:sl 2.4s ease-in-out infinite alternate}@keyframes sl{to{transform:translateX(26px)}}.gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr 2.8s ease-out infinite alternate}@keyframes gr{from{transform:scaleY(.15)}to{transform:scaleY(1)}}.fly{animation:fly 3s linear infinite}@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(70px,-14px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="190" width="400" height="50" rx="0" fill="#E6CFA2" stroke="none" stroke-width="0" /><rect x="30" y="90" width="110" height="100" rx="3" fill="#C9B7A0" stroke="#2B2F4A" stroke-width="3" /><rect x="50" y="40" width="22" height="50" rx="3" fill="#8E96AE" stroke="#2B2F4A" stroke-width="3" /><g class="bob" style="" ><circle cx="62" cy="34" r="8" fill="#D5D8E2" stroke="none" stroke-width="0" /><circle cx="72" cy="24" r="6" fill="#D5D8E2" stroke="none" stroke-width="0" /></g><rect x="44" y="108" width="18" height="22" rx="2" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" /><rect x="74" y="108" width="18" height="22" rx="2" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" /><rect x="104" y="108" width="18" height="22" rx="2" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" /><rect x="250" y="100" width="120" height="90" rx="3" fill="#F2E4C6" stroke="#2B2F4A" stroke-width="3" /><path d="M242 100 L310 62 L378 100Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" st