<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>Palm-leaf strips tied with a string</title><style>text{font-family:sans-serif;fill:#2B2F4A}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.4}to{opacity:1}}.bob{animation:bob 2s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}.sl{animation:sl 2.4s ease-in-out infinite alternate}@keyframes sl{to{transform:translateX(26px)}}.gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr 2.8s ease-out infinite alternate}@keyframes gr{from{transform:scaleY(.15)}to{transform:scaleY(1)}}.fly{animation:fly 3s linear infinite}@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(70px,-14px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="30" y="30" width="140" height="14" rx="6" fill="#D8C27A" stroke="#2B2F4A" stroke-width="2" /><line x1="60" y1="37" x2="150" y2="37" stroke="#8F7A2E" stroke-width="2" stroke-linecap="round" /><rect x="30" y="48" width="140" height="14" rx="6" fill="#D8C27A" stroke="#2B2F4A" stroke-width="2" /><line x1="60" y1="55" x2="150" y2="55" stroke="#8F7A2E" stroke-width="2" stroke-linecap="round" /><rect x="30" y="66" width="140" height="14" rx="6" fill="#D8C27A" stroke="#2B2F4A" stroke-width="2" /><line x1="60" y1="73" x2="150" y2="73" stroke="#8F7A2E" stroke-width="2" stroke-linecap="round" /><rect x="30" y="84" width="140" height="14" rx="6" fill="#D8C27A" stroke="#2B2F4A" stroke-width="2" /><line x1="60" y1="91" x2="150" y2="91" stroke="#8F7A2E" stroke-width="2" stroke-linecap="round" /><rect x="30" y="102" width="140" height="14" rx="6" fill="#D8C27A" stroke="#2B2F4A" stroke-width="2" /><line x1="60" y1="109" x2="150" y2="109" stroke="#8F7A2E" stroke-width="2" stroke-linecap="round" /><line x1="52" y1="24" x2="52" y2="128" stroke="#E5484D" stroke-width="3" stroke-linecap="round" /><circle cx="52" cy="76" r="5" fill="#F6C453" stroke="#2B2F4A" stroke-width="2" /></svg>