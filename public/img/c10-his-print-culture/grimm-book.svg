<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>An open book of folk tales with scissors cutting out some lines</title><style>text{font-family:sans-serif;fill:#2B2F4A}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.4}to{opacity:1}}.bob{animation:bob 2s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}.sl{animation:sl 2.4s ease-in-out infinite alternate}@keyframes sl{to{transform:translateX(26px)}}.gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr 2.8s ease-out infinite alternate}@keyframes gr{from{transform:scaleY(.15)}to{transform:scaleY(1)}}.fly{animation:fly 3s linear infinite}@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(70px,-14px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="190" width="400" height="50" rx="0" fill="#E6CFA2" stroke="none" stroke-width="0" /><rect x="60" y="50" width="130" height="110" rx="4" fill="#FFF7E0" stroke="#2B2F4A" stroke-width="3" /><rect x="210" y="50" width="130" height="110" rx="4" fill="#FFF7E0" stroke="#2B2F4A" stroke-width="3" /><line x1="200" y1="50" x2="200" y2="160" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M80 140 v-50 l12 -14 l12 14 v50Z" fill="#9AA0B5" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M110 140 v-40 l10 -12 l10 12 v40Z" fill="#9AA0B5" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="160" cy="80" r="10" fill="#F6C453" stroke="#2B2F4A" stroke-width="2" /><line x1="224" y1="72" x2="324" y2="72" stroke="#7a5a1a" stroke-width="2" stroke-linecap="round" /><line x1="224" y1="86" x2="324" y2="86" stroke="#7a5a1a" stroke-width="2" stroke-linecap="round" /><line x1="224" y1="100" x2="324" y2="100" stroke="#7a5a1a" stroke-width="2" stroke-linecap="round" /><line x1="224" y1="114" x2="324" y2="114" stroke="#7a5a1a" stroke-width="2" stroke-linecap="round" /><line x1="224" y1="128" x2="324" y2="128" stroke="#7a5a1a" stroke-width="2" stroke-linecap="round" /><line x1="224" y1="142" x2="324" y2="142" stroke="#7a5a1a" stroke-width="2" stroke-linecap="round" /><line x1="224" y1="100" x2="324" y2="100" stroke="#E5484D" stroke-width="4" stroke-linecap="round" /><line x1="224" y1="114" x2="324" y2="114" stroke="#E5484D" stroke-width="4" stroke-linecap="round" /><g class="sl" style="animation-duration:1.8s;transform:translateX(-20px)" ><path d="M340 90 L300 108 M340 126 L300 108" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="344" cy="90" r="6" fill="none" stroke="#2B2F4A" stroke-width="3" /><circle cx="344" cy="126" r="6" fill="none" stroke="#2B2F4A" stroke-width="3" /></g><text x="200" y="32" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Old folk tales were collected and edited</text></svg>