<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Four cards: an almanac, a chapbook with a penny, a small blue-covered book and a periodical</title><style>text{font-family:sans-serif;fill:#2B2F4A}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.4}to{opacity:1}}.bob{animation:bob 2s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}.sl{animation:sl 2.4s ease-in-out infinite alternate}@keyframes sl{to{transform:translateX(26px)}}.gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr 2.8s ease-out infinite alternate}@keyframes gr{from{transform:scaleY(.15)}to{transform:scaleY(1)}}.fly{animation:fly 3s linear infinite}@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(70px,-14px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="8" y="10" width="188" height="104" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="102" y="106" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Almanac</text><rect x="204" y="10" width="188" height="104" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="298" y="106" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Chapbook</text><rect x="8" y="126" width="188" height="104" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="102" y="222" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Bibliotheque Bleue</text><rect x="204" y="126" width="188" height="104" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="298" y="222" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Periodical</text><rect x="56" y="24" width="66" height="52" rx="3" fill="#FFF1C9" stroke="#2B2F4A" stroke-width="3" /><circle cx="76" cy="44" r="9" fill="#F6C453" stroke="#2B2F4A" stroke-