<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A palm-leaf manuscript between wooden covers and an illustrated handmade-paper manuscript</title><style>text{font-family:sans-serif;fill:#2B2F4A}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.4}to{opacity:1}}.bob{animation:bob 2s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}.sl{animation:sl 2.4s ease-in-out infinite alternate}@keyframes sl{to{transform:translateX(26px)}}.gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr 2.8s ease-out infinite alternate}@keyframes gr{from{transform:scaleY(.15)}to{transform:scaleY(1)}}.fly{animation:fly 3s linear infinite}@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(70px,-14px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="190" width="400" height="50" rx="0" fill="#E6CFA2" stroke="none" stroke-width="0" /><rect x="30" y="60" width="150" height="12" rx="3" fill="#8A5A33" stroke="#2B2F4A" stroke-width="3" /><rect x="36" y="74" width="138" height="10" rx="4" fill="#D8C27A" stroke="#2B2F4A" stroke-width="2" /><line x1="56" y1="79" x2="150" y2="79" stroke="#8F7A2E" stroke-width="2" stroke-linecap="round" /><rect x="36" y="88" width="138" height="10" rx="4" fill="#D8C27A" stroke="#2B2F4A" stroke-width="2" /><line x1="56" y1="93" x2="150" y2="93" stroke="#8F7A2E" stroke-width="2" stroke-linecap="round" /><rect x="36" y="102" width="138" height="10" rx="4" fill="#D8C27A" stroke="#2B2F4A" stroke-width="2" /><line x1="56" y1="107" x2="150" y2="107" stroke="#8F7A2E" stroke-width="2" stroke-linecap="round" /><rect x="36" y="116" width="138" height="10" rx="4" fill="#D8C27A" stroke="#2B2F4A" stroke-width="2" /><line x1="56" y1="121" x2="150" y2="121" stroke="#8F7A2E" stroke-width="2" stroke-linecap="round" /><rect x="3