<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A caravan of camels carrying paper and silk between a pagoda on one side and a tower with books on the other</title><style>text{font-family:sans-serif;fill:#2B2F4A}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.4}to{opacity:1}}.bob{animation:bob 2s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}.sl{animation:sl 2.4s ease-in-out infinite alternate}@keyframes sl{to{transform:translateX(26px)}}.gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr 2.8s ease-out infinite alternate}@keyframes gr{from{transform:scaleY(.15)}to{transform:scaleY(1)}}.fly{animation:fly 3s linear infinite}@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(70px,-14px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="20" y="60" width="70" height="110" rx="4" fill="#FFD9D2" stroke="#2B2F4A" stroke-width="3" /><path d="M14 60 L55 30 L96 60Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="44" y="120" width="22" height="50" rx="2" fill="#8A5A33" stroke="#2B2F4A" stroke-width="2" /><rect x="310" y="70" width="70" height="100" rx="4" fill="#D6E4FF" stroke="#2B2F4A" stroke-width="3" /><rect x="318" y="56" width="12" height="16" rx="1" fill="#D6E4FF" stroke="#2B2F4A" stroke-width="2" /><rect x="338" y="56" width="12" height="16" rx="1" fill="#D6E4FF" stroke="#2B2F4A" stroke-width="2" /><rect x="358" y="56" width="12" height="16" rx="1" fill="#D6E4FF" stroke="#2B2F4A" stroke-width="2" /><rect x="336" y="126" width="22" height="44" rx="2" fill="#8A5A33" stroke="#2B2F4A" stroke-width="2" /><line x1="95" y1="176" x2="308" y2="176" stroke="#C9A56B" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 8"/><g class="sl" style="animation-duration:3s" ><g transform="translate(120,158)"><line x1="10" y1="0" x2="10" y2="22" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><line x1="22" y1="0" x2="22" y2="22" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><line x1="48" y1="0" x2="48" y2="22" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><line x1="60" y1="0" x2="60" y2="22" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><ellipse cx="36" cy="-6" rx="30" ry="14" fill="#D9A35F" stroke="#2B2F4A" stroke-width="2.5"/><path d="M12 -14 q6 -16 12 0 M34 -16 q6 -16 12 0" fill="#D9A35F" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M62 -12 q10 -14 8 -30" fill="none" stroke="#2B2F4A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><path d="M62 -12 q10 -14 8 -30" fill="none" stroke="#D9A35F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="74" cy="-44" rx="9" ry="5" fill="#D9A35F" stroke="#2B2F4A" stroke-width="2"/><rect x="16" y="-30" width="16" height="14" rx="2" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><rect x="38" y="-32" width="14" height="16" rx="2" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" /></g></g><text x="55" y="196" font-size="11" fill="#9AA0B5" text-anchor="middle" font-weight="700" >paper, silk, spices</text><text x="345" y="196" font-size="11" fill="#9AA0B5" text-anchor="middle" font-weight="700" >books and scribes</text><text x="200" y="30" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Goods and ideas travelled west along the silk route</text></svg>