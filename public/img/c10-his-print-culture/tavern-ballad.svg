<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A singer holding an illustrated ballad sheet in a tavern while others listen</title><style>text{font-family:sans-serif;fill:#2B2F4A}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.4}to{opacity:1}}.bob{animation:bob 2s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}.sl{animation:sl 2.4s ease-in-out infinite alternate}@keyframes sl{to{transform:translateX(26px)}}.gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr 2.8s ease-out infinite alternate}@keyframes gr{from{transform:scaleY(.15)}to{transform:scaleY(1)}}.fly{animation:fly 3s linear infinite}@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(70px,-14px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="150" width="400" height="90" rx="0" fill="#E6CFA2" stroke="none" stroke-width="0" /><rect x="40" y="150" width="320" height="16" rx="4" fill="#C98F5A" stroke="#2B2F4A" stroke-width="3" /><line x1="60" y1="166" x2="60" y2="222" stroke="#8A5A33" stroke-width="5" stroke-linecap="round" /><line x1="340" y1="166" x2="340" y2="222" stroke="#8A5A33" stroke-width="5" stroke-linecap="round" /><line x1="104.5" y1="134.6" x2="104.5" y2="150" stroke="#2B2F4A" stroke-width="3.3000000000000003" stroke-linecap="round" /><line x1="115.5" y1="134.6" x2="115.5" y2="150" stroke="#2B2F4A" stroke-width="3.3000000000000003" stroke-linecap="round" /><rect x="99" y="103.8" width="22" height="31.9" rx="8.8" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" /><circle cx="110" cy="92.8" r="9.9" fill="#F2C79B" stroke="#2B2F4A" stroke-width="2" /><path d="M100.1 91.7 a9.9 9.9 0 0 1 19.8 0 Z" fill="#2B2F4A" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /><line x1="294.5" y1="134.6" x2="294.5" y2="15