<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A water wheel</title><style>text{font-family:sans-serif;fill:#2B2F4A}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.4}to{opacity:1}}.bob{animation:bob 2s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}.sl{animation:sl 2.4s ease-in-out infinite alternate}@keyframes sl{to{transform:translateX(26px)}}.gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr 2.8s ease-out infinite alternate}@keyframes gr{from{transform:scaleY(.15)}to{transform:scaleY(1)}}.fly{animation:fly 3s linear infinite}@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(70px,-14px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><circle cx="100" cy="70" r="44" fill="none" stroke="#2B2F4A" stroke-width="4" /><circle cx="100" cy="70" r="6" fill="#2B2F4A" stroke="none" stroke-width="2" /><line x1="100" y1="70" x2="144" y2="70" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><rect x="138" y="64" width="12" height="12" rx="1" fill="#C98F5A" stroke="#2B2F4A" stroke-width="2" /><line x1="100" y1="70" x2="131.113" y2="101.113" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><rect x="125.113" y="95.1127" width="12" height="12" rx="1" fill="#C98F5A" stroke="#2B2F4A" stroke-width="2" /><line x1="100" y1="70" x2="100" y2="114" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><rect x="94" y="108" width="12" height="12" rx="1" fill="#C98F5A" stroke="#2B2F4A" stroke-width="2" /><line x1="100" y1="70" x2="68.8873" y2="101.113" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><rect x="62.8873" y="95.1127" width="12" height="12" rx="1" fill="#C98F5A" stroke="#2B2F4A" stroke-width="2" /><line x1="100" y1="70" x2="56" y2="70" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><rect x="50" y="64" width="12" height="12" rx="1" fill="#C98F5A" stroke="#2B2F4A" stroke-width="2" /><line x1="100" y1="70" x2="68.8873" y2="38.8873" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><rect x="62.8873" y="32.8873" width="12" height="12" rx="1" fill="#C98F5A" stroke="#2B2F4A" stroke-width="2" /><line x1="100" y1="70" x2="100" y2="26" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><rect x="94" y="20" width="12" height="12" rx="1" fill="#C98F5A" stroke="#2B2F4A" stroke-width="2" /><line x1="100" y1="70" x2="131.113" y2="38.8873" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><rect x="125.113" y="32.8873" width="12" height="12" rx="1" fill="#C98F5A" stroke="#2B2F4A" stroke-width="2" /><path d="M20 126 q20 -10 40 0 t40 0 t40 0 t40 0" fill="none" stroke="#0B93D4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></svg>