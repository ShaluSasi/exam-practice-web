<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A rolled scroll</title><style>text{font-family:sans-serif;fill:#2B2F4A}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.4}to{opacity:1}}.bob{animation:bob 2s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}.sl{animation:sl 2.4s ease-in-out infinite alternate}@keyframes sl{to{transform:translateX(26px)}}.gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr 2.8s ease-out infinite alternate}@keyframes gr{from{transform:scaleY(.15)}to{transform:scaleY(1)}}.fly{animation:fly 3s linear infinite}@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(70px,-14px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="40" y="40" width="120" height="70" rx="3" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><rect x="32" y="34" width="10" height="82" rx="4" fill="#C98F5A" stroke="#2B2F4A" stroke-width="3" /><rect x="158" y="34" width="10" height="82" rx="4" fill="#C98F5A" stroke="#2B2F4A" stroke-width="3" /><line x1="58" y1="56" x2="142" y2="56" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="58" y1="70" x2="142" y2="70" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="58" y1="84" x2="142" y2="84" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="58" y1="98" x2="142" y2="98" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /></svg>