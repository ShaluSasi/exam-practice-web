<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A printed sheet posted on a church door while many copies travel to towns</title><style>text{font-family:sans-serif;fill:#2B2F4A}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.4}to{opacity:1}}.bob{animation:bob 2s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}.sl{animation:sl 2.4s ease-in-out infinite alternate}@keyframes sl{to{transform:translateX(26px)}}.gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr 2.8s ease-out infinite alternate}@keyframes gr{from{transform:scaleY(.15)}to{transform:scaleY(1)}}.fly{animation:fly 3s linear infinite}@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(70px,-14px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="170" width="400" height="70" rx="0" fill="#D9E8C8" stroke="none" stroke-width="0" /><rect x="24" y="30" width="110" height="150" rx="4" fill="#C9C1B0" stroke="#2B2F4A" stroke-width="3" /><path d="M44 180 V90 a35 35 0 0 1 70 0 V180Z" fill="#8A5A33" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><line x1="79" y1="60" x2="79" y2="180" stroke="#5a3a1b" stroke-width="2" stroke-linecap="round" /><rect x="60" y="96" width="38" height="48" rx="2" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><line x1="66" y1="108" x2="92" y2="108" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="66" y1="118" x2="92" y2="118" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="66" y1="128" x2="92" y2="128" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><g class="fly" style="animation-delay:0.0s" ><rect x="150" y="160" width="30" height="24" rx="2" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><line x1="154.5" y1="168" x2="175.5" y2="168" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="154.5" y1="176" x2="175.5" y2="176" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /></g><g class="fly" style="animation-delay:0.8s" ><rect x="150" y="142" width="30" height="24" rx="2" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><line x1="154.5" y1="150" x2="175.5" y2="150" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="154.5" y1="158" x2="175.5" y2="158" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /></g><g class="fly" style="animation-delay:1.5s" ><rect x="150" y="124" width="30" height="24" rx="2" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><line x1="154.5" y1="132" x2="175.5" y2="132" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="154.5" y1="140" x2="175.5" y2="140" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /></g><g class="fly" style="animation-delay:2.2s" ><rect x="150" y="106" width="30" height="24" rx="2" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><line x1="154.5" y1="114" x2="175.5" y2="114" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /><line x1="154.5" y1="122" x2="175.5" y2="122" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" /></g><rect x="280" y="110" width="40" height="60" rx="3" fill="#E8D9B5" stroke="#2B2F4A" stroke-width="3" /><path d="M274 110 L300 84 L326 110Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="350" y="120" width="34" height="50" rx="3" fill="#D6E4FF" stroke="#2B2F4A" stroke-width="3" /><path d="M345 120 L367 96 L389 120Z" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="200" y="22" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >One posted sheet becomes thousands of copies</text></svg>