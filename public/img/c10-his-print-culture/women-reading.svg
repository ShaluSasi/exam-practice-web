<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A woman reading a small book quietly in a kitchen beside a cooking pot with the door slightly open</title><style>text{font-family:sans-serif;fill:#2B2F4A}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.4}to{opacity:1}}.bob{animation:bob 2s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}.sl{animation:sl 2.4s ease-in-out infinite alternate}@keyframes sl{to{transform:translateX(26px)}}.gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr 2.8s ease-out infinite alternate}@keyframes gr{from{transform:scaleY(.15)}to{transform:scaleY(1)}}.fly{animation:fly 3s linear infinite}@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(70px,-14px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.wv{animation:wv 2.4s ease-in-out infinite}@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-14px);opacity:0}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="240" rx="0" fill="#F4E7CC" stroke="none" stroke-width="0" /><rect x="0" y="180" width="400" height="60" rx="0" fill="#D9BE8C" stroke="none" stroke-width="0" /><rect x="250" y="100" width="110" height="80" rx="6" fill="#6B6F85" stroke="#2B2F4A" stroke-width="4" /><rect x="266" y="120" width="40" height="60" rx="3" fill="#2B2B2B" stroke="#2B2F4A" stroke-width="3" /><rect x="320" y="126" width="30" height="50" rx="3" fill="#2B2B2B" stroke="#2B2F4A" stroke-width="3" /><g class="wv" style="" ><path d="M285 112 q-6 -14 4 -26 q10 -12 0 -26" fill="none" stroke="#9AA0B5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M300 112 q-6 -14 4 -26" fill="none" stroke="#9AA0B5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="250" y="86" width="50" height="14" rx="4" fill="#B9BFCC