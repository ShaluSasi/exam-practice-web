<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A printing press wrapped in a chain with a padlock</title><style>text{font-family:sans-serif;fill:#2B2F4A}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.4}to{opacity:1}}.bob{animation:bob 2s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}.sl{animation:sl 2.4s ease-in-out infinite alternate}@keyframes sl{to{transform:translateX(26px)}}.gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr 2.8s ease-out infinite alternate}@keyframes gr{from{transform:scaleY(.15)}to{transform:scaleY(1)}}.fly{animation:fly 3s linear infinite}@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(70px,-14px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="190" width="400" height="50" rx="0" fill="#E6CFA2" stroke="none" stroke-width="0" /><rect x="100" y="150" width="160" height="30" rx="4" fill="#C98F5A" stroke="#2B2F4A" stroke-width="3" /><rect x="112" y="60" width="10" height="90" rx="2" fill="#9AA0B5" stroke="#2B2F4A" stroke-width="2" /><rect x="238" y="60" width="10" height="90" rx="2" fill="#9AA0B5" stroke="#2B2F4A" stroke-width="2" /><rect x="112" y="52" width="136" height="14" rx="2" fill="#C98F5A" stroke="#2B2F4A" stroke-width="2" /><rect x="172" y="34" width="10" height="40" rx="2" fill="#9AA0B5" stroke="#2B2F4A" stroke-width="2" /><rect x="146" y="110" width="64" height="14" rx="2" fill="#9AA0B5" stroke="#2B2F4A" stroke-width="2" /><path d="M96 70 Q180 130 264 70" fill="none" stroke="#2B2F4A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="14 6"/><g class="bob" style="" ><rect x="166" y="112" width="28" height="24" rx="4" fill="#F6C453" stroke="#2B2F4A" stroke-width="3" /><path d="M172 112 v-10 a8 8 0 0 1 16 0 v10" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="200" y="26" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >A press chained and locked</text></svg>