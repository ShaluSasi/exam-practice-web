<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A loom with threads and a shuttle</title><style>text{font-family:sans-serif;fill:#2B2F4A}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.4}to{opacity:1}}.bob{animation:bob 2s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}.sl{animation:sl 2.4s ease-in-out infinite alternate}@keyframes sl{to{transform:translateX(26px)}}.gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr 2.8s ease-out infinite alternate}@keyframes gr{from{transform:scaleY(.15)}to{transform:scaleY(1)}}.fly{animation:fly 3s linear infinite}@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(70px,-14px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="30" y="24" width="140" height="102" rx="3" fill="none" stroke="#2B2F4A" stroke-width="4" /><line x1="46" y1="24" x2="46" y2="126" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="60" y1="24" x2="60" y2="126" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="74" y1="24" x2="74" y2="126" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="88" y1="24" x2="88" y2="126" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="102" y1="24" x2="102" y2="126" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="116" y1="24" x2="116" y2="126" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="130" y1="24" x2="130" y2="126" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="144" y1="24" x2="144" y2="126" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><line x1="158" y1="24" x2="158" y2="126" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><rect x="40" y="70" width="120" height="10" rx="2" fill="#C98F5A" stroke="#2B2F4A" stroke-width="2" /><rect x="40" y="94" width="120" height="10" rx="2" fill="#C98F5A" stroke="#2B2F4A" stroke-width="2" /><path d="M70 62 l24 6 l-24 6z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>