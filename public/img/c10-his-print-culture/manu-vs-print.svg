<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A scribe copying one book by hand beside a stack of many printed books</title><style>text{font-family:sans-serif;fill:#2B2F4A}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.4}to{opacity:1}}.bob{animation:bob 2s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-6px)}}.sl{animation:sl 2.4s ease-in-out infinite alternate}@keyframes sl{to{transform:translateX(26px)}}.gr{transform-box:fill-box;transform-origin:50% 100%;animation:gr 2.8s ease-out infinite alternate}@keyframes gr{from{transform:scaleY(.15)}to{transform:scaleY(1)}}.fly{animation:fly 3s linear infinite}@keyframes fly{0%{transform:translate(0,0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(70px,-14px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="14" y="14" width="182" height="212" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><rect x="204" y="14" width="182" height="212" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="105" y="40" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Copied by hand</text><text x="295" y="40" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Printed on a press</text><line x1="54.5" y1="144.6" x2="54.5" y2="160" stroke="#2B2F4A" stroke-width="3.3000000000000003" stroke-linecap="round" /><line x1="65.5" y1="144.6" x2="65.5" y2="160" stroke="#2B2F4A" stroke-width="3.3000000000000003" stroke-linecap="round" /><rect x="49" y="113.8" width="22" height="31.9" rx="8.8" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2" /><circle cx="60" cy="102.8" r="9.9" fill="#F2C79B" stroke="#2B2F4A" stroke-width="2" /><path d="M50.1 101.7 a9.9 9.9 0 0 1 19.8 0 Z" fill="#2B2F4A" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /><rect x="86" y="130" width