<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>Students acting a scene on a school stage between red curtains, with a teacher guiding from the side</title>
<style>
.cl{animation:cl 5s ease-in-out infinite}
.cr{animation:cr 5s ease-in-out infinite}
@keyframes cl{0%,100%{transform:translateX(0)}40%,60%{transform:translateX(-24px)}}
@keyframes cr{0%,100%{transform:translateX(0)}40%,60%{transform:translateX(24px)}}
.spot{animation:sp 3s ease-in-out infinite}
@keyframes sp{0%,100%{opacity:.25}50%{opacity:.5}}
.arm{animation:arm 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:0 100%}
@keyframes arm{0%,100%{transform:rotate(0)}50%{transform:rotate(-20deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
