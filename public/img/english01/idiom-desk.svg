<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>A student studying at a desk late at night by an oil lamp, with a clock, books and a thought bubble</title>
<style>
.flame{animation:fl 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.3) rotate(5deg)}}
.hand{animation:hd 6s linear infinite;transform-origin:330px 60px}
@keyframes hd{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.th{animation:th 3s ease-in-out infinite}
@keyframes th{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
