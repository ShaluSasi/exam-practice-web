<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img">
<title>A checklist card with tick and cross buttons</title>
<style>
.pop{animation:pop 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.pop2{animation-delay:1.5s}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
<rect x="40" y="24" width="210" height="152" rx="10" fill="#fff"/>
<rect x="110" y="14" width="70" height="20" rx="6" fill="#A3A8CC"/>
<rect x="56" y="50" width="16" height="16" rx="3" fill="#CDEBFA"/><rect x="56" y="84" width="16" height="16" rx="3" fill="#CDEBFA"/><rect x="56" y="118" width="16" height="16" rx="3" fill="#CDEBFA"/><rect x="56" y="148" width="16" height="16" rx="3" fill="#CDEBFA"/>
</g>
<g stroke="#A3A8CC" stroke-width="5" stroke-linecap="round"><path d="M84 58H230M84 92H214M84 126H226M84 156H200"/></g>
<g class="pop" stroke="#2B2F4A" stroke-width="2.5"><circle cx="300" cy="66" r="30" fill="#3FA34D"/><path d="M286 66L297 77L316 56" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="pop pop2" stroke="#2B2F4A" stroke-width="2.5"><circle cx="340" cy="140" r="30" fill="#E5484D"/><path d="M328 128L352 152M352 128L328 152" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/></g>
</svg>
