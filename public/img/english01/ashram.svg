<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>A quiet hermitage hut under a large banyan tree, with palm-leaf manuscripts and a lamp at its doorway</title>
<style>
.flame{animation:fl 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.3)}}
.leaf{animation:lf 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes lf{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.glow{animation:gw 4s ease-in-out infinite}
@keyframes gw{0%,100%{opacity:.25}50%{opacity:.55}}
.bird{animation:bd 9s linear infinite}
@keyframes bd{from{transform:translateX(0)}to{transform:translateX(-440px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M16 0H384Q400 0 400 16V180H0V16Q0 0 16 0Z" fill="#FFE9D2"/>
<circle class="glow" cx="300" cy="150" r="80" fill="#FFF3C4"/>
