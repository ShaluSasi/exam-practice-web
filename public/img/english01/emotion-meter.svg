<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" role="img">
<title>A row of five cartoon faces showing different feelings</title>
<style>
.tear{animation:tr 2.2s ease-in infinite}
@keyframes tr{0%{transform:translateY(0);opacity:1}100%{transform:translateY(16px);opacity:0}}
.z{animation:zz 3s ease-in-out infinite}
@keyframes zz{0%,100%{opacity:.2}50%{opacity:1}}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="14" y="128" width="372" height="12" rx="6" fill="#E3F2FD" stroke="#A3A8CC" stroke-width="2"/>
<g stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
<g class="bob"><circle cx="50" cy="80" r="30" fill="#F6C453"/>
<path d="M38 74Q41 70 44 74M56 74Q59 70 62 74" fill="none"/>
<path d="M36 88Q50 104 64 88Z" fill="#fff"/></g>
<circle cx="125" cy="80" r="30" fill="#CDEBFA"/>
<path d="M112 72L120 76M138 72L130 76" fill="none"/>
<circle cx="116" cy="80" r="2.5" fill="#2B2F4A"/><circle cx="134" cy="80" r="2.5" fill="#2B2F4A"/>
<path d="M114 98Q125 90 136 98" fill="none"/>
<path class="tear" d="M116 86Q113 92 116 95Q119 92 116 86Z" fill="#0B93D4" stroke-width="1"/>
<circle cx="200" cy="80" r="30" fill="#F7A3A5"/>
<path d="M186 70L196 76M214 70L204 76" fill="none" stroke-width="3"/>
<circle cx="192" cy="80" r="2.5" fill="#2B2F4A"/><circle cx="208" cy="80" r="2.5" fill="#2B2F4A"/>
<path d="M188 96H212" fill="none"/>
<g class="bob"><circle cx="275" cy="80" r="30" fill="#FFD9A8"/>
<path d="M262 66Q266 62 270 66M280 66Q284 62 288 66" fill="none"/>
<circle cx="266" cy="76" r="5" fill="#fff"/><circle cx="284" cy="76" r="5" fill="#fff"/>
<circle cx="266" cy="76" r="2" fill="#2B2F4A"/><circle cx="284" cy="76" r="2" fill="#2B2F4A"/>
<ellipse cx="275" cy="95" rx="6" ry="8" fill="#7A3B2E"/></g>
<circle cx="350" cy="80" r="30" fill="#D7CCF0"/>
<path d="M337 80Q341 84 345 80M355 80Q359 84 363 80" fill="none"/>
<path d="M343 96Q350 99 357 96" fill="none"/>
</g>
<g class="z" font-family="system-ui, sans-serif" font-weight="700" fill="#6E7396"><text x="372" y="50" font-size="14">z</text><text x="382" y="38" font-size="12">z</text></g>
</svg>
