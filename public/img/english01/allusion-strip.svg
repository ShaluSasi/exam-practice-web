<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 316" role="img">
<title>Five word cards from the poem</title>
<style>
.c{animation:fl 4s ease-in-out infinite}.c0{animation-delay:0.0s}.c1{animation-delay:0.5s}.c2{animation-delay:1.0s}.c3{animation-delay:1.5s}.c4{animation-delay:2.0s}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g font-family="system-ui, sans-serif" font-weight="700" fill="#2B2F4A">
<g class="c c0"><rect x="40" y="16" width="320" height="48" rx="12" fill="#CDEBFA" stroke="#0B93D4" stroke-width="3"/><circle cx="62" cy="40" r="14" fill="#fff" stroke="#0B93D4" stroke-width="2" stroke-dasharray="4 3"/><text x="220" y="46" text-anchor="middle" font-size="18">Himavant</text></g>
<g class="c c1"><rect x="40" y="74" width="320" height="48" rx="12" fill="#FFE1B8" stroke="#FF8A1F" stroke-width="3"/><circle cx="62" cy="98" r="14" fill="#fff" stroke="#FF8A1F" stroke-width="2" stroke-dasharray="4 3"/><text x="220" y="104" text-anchor="middle" font-size="18">Upanishads</text></g>
<g class="c c2"><rect x="40" y="132" width="320" height="48" rx="12" fill="#D8F0D0" stroke="#3FA34D" stroke-width="3"/><circle cx="62" cy="156" r="14" fill="#fff" stroke="#3FA34D" stroke-width="2" stroke-dasharray="4 3"/><text x="220" y="162" text-anchor="middle" font-size="18">Ganga</text></g>
<g class="c c3"><rect x="40" y="190" width="320" height="48" rx="12" fill="#F9D7E6" stroke="#C2185B" stroke-width="3"/><circle cx="62" cy="214" r="14" fill="#fff" stroke="#C2185B" stroke-width="2" stroke-dasharray="4 3"/><text x="220" y="220" text-anchor="middle" font-size="18">dhamma</text></g>
<g class="c c4"><rect x="40" y="248" width="320" height="48" rx="12" fill="#E4DDF7" stroke="#7A3FB0" stroke-width="3"/><circle cx="62" cy="272" r="14" fill="#fff" stroke="#7A3FB0" stroke-width="2" stroke-dasharray="4 3"/><text x="220" y="278" text-anchor="middle" font-size="18">Brahma-knowledge</text></g>
</g>
</svg>
