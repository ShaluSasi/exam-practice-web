<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>Children playing a game in a courtyard: one counts with eyes covered while others hide behind a tree and a wall</title>
<style>
.peek{animation:pk 3s ease-in-out infinite}
@keyframes pk{0%,30%,100%{transform:translateX(0)}50%,70%{transform:translateX(14px)}}
.peek2{animation:pk2 3.6s ease-in-out infinite}
@keyframes pk2{0%,40%,100%{transform:translateY(0)}60%,80%{transform:translateY(-14px)}}
.leaf{animation:lf 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes lf{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
