<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img">
<title>A timeline with an earlier past action, a later past action and now</title>
<style>
.dot{animation:mv 4s ease-in-out infinite}
@keyframes mv{0%{transform:translateX(0)}100%{transform:translateX(300px)}}
.p1{animation:p 4s ease-in-out infinite}
.p2{animation:p 4s ease-in-out infinite 1.3s}
@keyframes p{0%,100%{transform:scale(1)}20%{transform:scale(1.2)}}
.p1,.p2{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M40 110H360" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round"/>
<path d="M350 100L364 110L350 120" fill="none" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="dot" cx="50" cy="110" r="6" fill="#FF8A1F"/>
<g stroke="#2B2F4A" stroke-width="2.5">
<circle class="p1" cx="120" cy="110" r="16" fill="#7A3FB0"/>
<circle class="p2" cx="230" cy="110" r="16" fill="#0B93D4"/>
<rect x="318" y="94" width="10" height="32" rx="3" fill="#3FA34D"/>
</g>
<g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" text-anchor="middle" font-size="14">
<text x="120" y="70">earlier past</text><text x="120" y="152">1st action</text>
<text x="230" y="70">later past</text><text x="230" y="152">2nd action</text>
<text x="323" y="70">now</text>
</g>
</svg>
