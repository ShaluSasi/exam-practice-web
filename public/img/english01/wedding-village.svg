.note{animation:nt 3s ease-in-out infinite}
@keyframes nt{0%{opacity:0;transform:translate(0,0)}50%{opacity:1}100%{opacity:0;transform:translate(10px,-24px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
