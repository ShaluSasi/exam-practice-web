<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>A landscape with snowy mountains, a winding river, golden fields under the sun, a bundle of palm-leaf manuscripts and a stringed instrument</title>
<style>
.flow{stroke-dasharray:10 12;animation:fw 1.6s linear infinite}
@keyframes fw{to{stroke-dashoffset:-44}}
.rays{animation:rot 12s linear infinite;transform-origin:350px 44px}
@keyframes rot{to{transform:rotate(360deg)}}
.note{animation:nt 3s ease-in-out infinite}
.n2{animation-delay:1.5s}
@keyframes nt{0%{opacity:0;transform:translate(0,0)}40%{opacity:1}100%{opacity:0;transform:translate(14px,-30px)}}
.sway{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sw{0%,100%{transform:skewX(-4deg)}50%{transform:skewX(4deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
