<style>
.flame{animation:fl 1.5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.3) rotate(-4deg)}}
.chalk{animation:wr 2.4s ease-in-out infinite}
@keyframes wr{0%,100%{transform:translate(0,0)}25%{transform:translate(8px,-3px)}50%{transform:translate(16px,2px)}75%{transform:translate(6px,4px)}}
.line{stroke-dasharray:70;animation:dr 2.4s linear infinite}
@keyframes dr{from{stroke-dashoffset:70}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
