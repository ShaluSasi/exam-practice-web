<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>A grandmother sitting beside a girl on an open terrace on a full-moon summer night</title>
<style>
.tw{animation:tw 2.5s ease-in-out infinite}
.tw2{animation:tw 3.4s ease-in-out infinite .8s}
@keyframes tw{0%,100%{opacity:.3}50%{opacity:1}}
.glow{animation:gl 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes gl{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.hand{animation:hd 3s ease-in-out infinite}
@keyframes hd{0%,100%{transform:translateX(0)}50%{transform:translateX(-4px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
