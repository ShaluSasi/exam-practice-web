.voice{animation:vo 2.4s ease-in-out infinite}
@keyframes vo{0%{opacity:0;transform:translateX(0)}40%{opacity:1}100%{opacity:0;transform:translateX(16px)}}
.steam{animation:st 3s ease-in-out infinite}
@keyframes st{0%{opacity:0;transform:translateY(6px)}50%{opacity:.8}100%{opacity:0;transform:translateY(-10px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
