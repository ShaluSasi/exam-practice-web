<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 236" role="img">
<title>A sentence split into six word cards, read left to right and top to bottom</title>
<style>
.c{animation:fl 4s ease-in-out infinite}.c0{animation-delay:0.0s}.c1{animation-delay:0.5s}.c2{animation-delay:1.0s}.c3{animation-delay:1.5s}.c4{animation-delay:2.0s}.c5{animation-delay:2.5s}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M194 43H204M194 107H204M194 171H204" stroke="#A3A8CC" stroke-width="3" stroke-linecap="round"/>
<g font-family="system-ui, sans-serif" font-weight="700" fill="#2B2F4A">
<g class="c c0"><rect x="14" y="18" width="180" height="50" rx="12" fill="#CDEBFA" stroke="#0B93D4" stroke-width="3"/><circle cx="36" cy="43" r="14" fill="#fff" stroke="#0B93D4" stroke-width="2" stroke-dasharray="4 3"/><text x="124" y="49" text-anchor="middle" font-size="18">When Asha</text></g>
<g class="c c1"><rect x="206" y="18" width="180" height="50" rx="12" fill="#FFE1B8" stroke="#FF8A1F" stroke-width="3"/><circle cx="228" cy="43" r="14" fill="#fff" stroke="#FF8A1F" stroke-width="2" stroke-dasharray="4 3"/><text x="316" y="49" text-anchor="middle" font-size="18">reached</text></g>
<g class="c c2"><rect x="14" y="82" width="180" height="50" rx="12" fill="#D8F0D0" stroke="#3FA34D" stroke-width="3"/><circle cx="36" cy="107" r="14" fill="#fff" stroke="#3FA34D" stroke-width="2" stroke-dasharray="4 3"/><text x="124" y="113" text-anchor="middle" font-size="18">the station,</text></g>
<g class="c c3"><rect x="206" y="82" width="180" height="50" rx="12" fill="#F9D7E6" stroke="#C2185B" stroke-width="3"/><circle cx="228" cy="107" r="14" fill="#fff" stroke="#C2185B" stroke-width="2" stroke-dasharray="4 3"/><text x="316" y="113" text-anchor="middle" font-size="18">the train</text></g>
<g class="c c4"><rect x="14" y="146" width="180" height="50" rx="12" fill="#E4DDF7" stroke="#7A3FB0" stroke-width="3"/><circle cx="36" cy="171" r="14" fill="#fff" stroke="#7A3FB0" stroke-width="2" stroke-dasharray="4 3"/><text x="124" y="177" text-anchor="middle" font-size="18">had left</text></g>
<g class="c c5"><rect x="206" y="146" width="180" height="50" rx="12" fill="#FFF3C4" stroke="#C9961A" stroke-width="3"/><circle cx="228" cy="171" r="14" fill="#fff" stroke="#C9961A" stroke-width="2" stroke-dasharray="4 3"/><text x="316" y="177" text-anchor="middle" font-size="18">for Pune.</text></g>
</g>
</svg>
