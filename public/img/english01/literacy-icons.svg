<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>Four kinds of literacy shown as tiles: coins and a growth chart, a mobile phone, a dance bell anklet and drum, and an alphabet book</title>
<style>
.bar{animation:gr 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes gr{0%,100%{transform:scaleY(.7)}50%{transform:scaleY(1)}}
.ring{animation:rg 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes rg{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.sig{animation:sg 2s ease-in-out infinite}
@keyframes sg{0%,100%{opacity:.2}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
