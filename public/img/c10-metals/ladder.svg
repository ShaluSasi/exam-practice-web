<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" role="img"><title>The reactivity series from potassium to gold</title><style>text{font-family:sans-serif}.rise{transform-box:fill-box;animation:rise 2.4s linear infinite}@keyframes rise{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-34px);opacity:0}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.88,1.15)}}.arr{animation:pulse 2s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="120" y="27" width="160" height="18" rx="6" fill="#fff" stroke="#E5484D" stroke-width="2.5"/><text x="142" y="40" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="800" >K</text><text x="160" y="40" font-size="11" fill="#2B2F4A" text-anchor="start" font-weight="600" >Potassium</text><rect x="120" y="49" width="160" height="18" rx="6" fill="#fff" stroke="#E5484D" stroke-width="2.5"/><text x="142" y="62" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="800" >Na</text><text x="160" y="62" font-size="11" fill="#2B2F4A" text-anchor="start" font-weight="600" >Sodium</text><rect x="120" y="71" width="160" height="18" rx="6" fill="#fff" stroke="#FF8A1F" stroke-width="2.5"/><text x="142" y="84" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="800" >Ca</text><text x="160" y="84" font-size="11" fill="#2B2F4A" text-anchor="start" font-weight="600" >Calcium</text><rect x="120" y="93" width="160" height="18" rx="6" fill="#fff" stroke="#FF8A1F" stroke-width="2.5"/><text x="142" y="106" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="800" >Mg</text><text x="160" y="106" font-size="11" fill="#2B2F4A" text-anchor="start" font-weight="600" >Magnesium</text><rect x="120" y="115" width="160" height="18" rx="6" fill="#fff" stroke="#F2B705" stroke-width="2.5"/><text x="142" y="128" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="800" >Al</text><text x="160" y="128" font-size="11" fill="#2B2F4A" text-anchor="start" font-weight="600" >Aluminium</text><rect x="120" y="137" width="160" height="18" rx="6" fill="#fff" stroke="#F2B705" stroke-width="2.5"/><text x="142" y="150" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="800" >Zn</text><text x="160" y="150" font-size="11" fill="#2B2F4A" text-anchor="start" font-weight="600" >Zinc</text><rect x="120" y="159" width="160" height="18" rx="6" fill="#fff" stroke="#3FA34D" stroke-width="2.5"/><text x="142" y="172" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="800" >Fe</text><text x="160" y="172" font-size="11" fill="#2B2F4A" text-anchor="start" font-weight="600" >Iron</text><rect x="120" y="181" width="160" height="18" rx="6" fill="#fff" stroke="#3FA34D" stroke-width="2.5"/><text x="142" y="194" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="800" >Pb</text><text x="160" y="194" font-size="11" fill="#2B2F4A" text-anchor="start" font-weight="600" >Lead</text><rect x="120" y="203" width="160" height="18" rx="6" fill="#EEF0F8" stroke="#8A90C0" stroke-width="2.5" stroke-dasharray="5 4"/><text x="142" y="216" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="800" >H</text><text x="160" y="216" font-size="11" fill="#2B2F4A" text-anchor="start" font-weight="600" >[Hydrogen]</text><rect x="120" y="225" width="160" height="18" rx="6" fill="#fff" stroke="#0B93D4" stroke-width="2.5"/><text x="142" y="238" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="800" >Cu</text><text x="160" y="238" font-size="11" fill="#2B2F4A" text-anchor="start" font-weight="600" >Copper</text><rect x="120" y="247" width="160" height="18" rx="6" fill="#fff" stroke="#0B93D4" stroke-width="2.5"/><text x="142" y="260" font-