<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Magnesium, copper, iron filings and gold heated in a flame</title><style>text{font-family:sans-serif}.rise{transform-box:fill-box;animation:rise 2.4s linear infinite}@keyframes rise{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-34px);opacity:0}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.88,1.15)}}.sp{animation:pulse .9s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="25" y="60" width="70" height="120" rx="12" fill="#fff" stroke="#CFD3E8" stroke-width="2.5" /><text x="60" y="206" font-size="14" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Mg</text><rect x="115" y="60" width="70" height="120" rx="12" fill="#fff" stroke="#CFD3E8" stroke-width="2.5" /><text x="150" y="206" font-size="14" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Cu</text><rect x="205" y="60" width="70" height="120" rx="12" fill="#fff" stroke="#CFD3E8" stroke-width="2.5" /><text x="240" y="206" font-size="14" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Fe</text><rect x="295" y="60" width="70" height="120" rx="12" fill="#fff" stroke="#CFD3E8" stroke-width="2.5" /><text x="330" y="206" font-size="14" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Au</text><path d="M25 130 L95 130" fill="none" stroke="#8A90C0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><path class="fl" d="M60 124 C44 100 56 92 60 66 C70 92 84 104 60 124Z" fill="#F4FBFF" stroke="#A8D8FF" stroke-width="3"/><path class="fl" d="M60 120 C52 106 58 100 60 86 C64 100 70 108 60 120Z" fill="#fff"/><rect x="115" y="124" width="70" height="14" rx="6" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" /><rect x="115" y="124" width="70" height="6" rx="4" fill="#E89A5C" stroke="none" stroke-width="0" /><g class="sp"><circle cx="228" cy="110" r="3" fill="#FFD23F"/><circle cx="250" cy="96" r="3" fill="#FFD23F"/><circle cx="238" cy="124" r="3" fill="#FF8A1F"/><circle cx="256" cy="116" r="3" fill="#FFD23F"/></g><rect x="222" y="136" width="36" height="8" rx="3" fill="#6F768F" stroke="#2B2F4A" stroke-width="2" /><rect x="295" y="124" width="70" height="14" rx="6" fill="#F2B705" stroke="#B8860B" stroke-width="2.5" /></svg>