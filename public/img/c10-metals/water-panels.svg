<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Three set-ups: cold water, hot water and steam</title><style>text{font-family:sans-serif}.rise{transform-box:fill-box;animation:rise 2.4s linear infinite}@keyframes rise{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-34px);opacity:0}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.88,1.15)}}.stm{animation:pulse 1.6s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="30" y="100.0" width="90" height="70.0" fill="#9FD6F2" opacity=".85"/><path d="M26 70 L30 70 V170 H120 V70 L124 70" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="75" cy="150" r="8" fill="#8E96AD" stroke="#5B6384" stroke-width="2.5" /><circle class="rise" cx="60" cy="150" r="2.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="animation-duration:2.6s;animation-delay:-0.0s"/><circle class="rise" cx="75" cy="150" r="2.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="animation-duration:2.6s;animation-delay:-0.87s"/><circle class="rise" cx="90" cy="150" r="2.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="animation-duration:2.6s;animation-delay:-1.73s"/><text x="75" y="196" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Cold water</text><rect x="155" y="100.0" width="90" height="70.0" fill="#9FD6F2" opacity=".85"/><path d="M151 70 L155 70 V170 H245 V70 L249 70" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="200" cy="150" r="8" fill="#8E96AD" stroke="#5B6384" stroke-width="2.5" /><circle class="rise" cx="185" cy="150" r="2.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="animation-duration:1.8s;animation-delay:-0.0s"/><circle class="rise" cx="200" cy="150" r="2.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="animation-duration:1.8s;animation-delay:-0.6s"/><circle class="rise" cx="215" cy="150" r="2.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="animation-duration:1.8s;animation-delay:-1.2s"/><path d="M170 182 H230 L224 204 H176 Z" fill="#8A90C0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fl" d="M200 180 C190 168 196 162 200 154 C206 162 212 170 200 180Z" fill="#FF8A1F" stroke="#E5484D" stroke-width="2"/><text x="200" y="224" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Hot water</text><path d="M300 78 H360 L372 150 C376 176 354 184 330 184 C306 184 284 176 288 150 Z" fill="#CFE8FF" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M296 152 H364 C366 170 352 178 330 178 C308 178 294 170 296 152Z" fill="#9FD6F2" opacity=".85"/><rect x="308" y="128" width="44" height="8" rx="3" fill="#8E96AD" stroke="#5B6384" stroke-width="2" /><g class="stm"><circle cx="318" cy="112" r="4" fill="#fff" stroke="#0B93D4" stroke-width="1.5"/><circle cx="332" cy="104" r="4" fill="#fff" stroke="#0B93D4" stroke-width="1.5"/><circle cx="346" cy="112" r="4" fill="#fff" stroke="#0B93D4" stroke-width="1.5"/></g><text x="330" y="208" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Steam</text><text x="200" y="28" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Testing metals with water in three ways</text></svg>