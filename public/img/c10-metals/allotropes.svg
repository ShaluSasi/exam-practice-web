<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Diamond and graphite, two forms of carbon</title><style>text{font-family:sans-serif}.rise{transform-box:fill-box;animation:rise 2.4s linear infinite}@keyframes rise{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-34px);opacity:0}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.88,1.15)}}.el{animation:elm 2s linear infinite}@keyframes elm{from{transform:translateX(0);opacity:1}to{transform:translateX(100px);opacity:.2}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><line x1="100" y1="120" x2="60" y2="80" stroke="#5B6384" stroke-width="4" stroke-linecap="round" /><line x1="100" y1="120" x2="140" y2="80" stroke="#5B6384" stroke-width="4" stroke-linecap="round" /><line x1="100" y1="120" x2="60" y2="160" stroke="#5B6384" stroke-width="4" stroke-linecap="round" /><line x1="100" y1="120" x2="140" y2="160" stroke="#5B6384" stroke-width="4" stroke-linecap="round" /><line x1="60" y1="80" x2="20" y2="120" stroke="#5B6384" stroke-width="4" stroke-linecap="round" /><line x1="60" y1="160" x2="20" y2="120" stroke="#5B6384" stroke-width="4" stroke-linecap="round" /><line x1="140" y1="80" x2="180" y2="120" stroke="#5B6384" stroke-width="4" stroke-linecap="round" /><line x1="140" y1="160" x2="180" y2="120" stroke="#5B6384" stroke-width="4" stroke-linecap="round" /><circle cx="100" cy="120" r="10" fill="#CFE8FF" stroke="#2B2F4A" stroke-width="3" /><circle cx="60" cy="80" r="10" fill="#CFE8FF" stroke="#2B2F4A" stroke-width="3" /><circle cx="140" cy="80" r="10" fill="#CFE8FF" stroke="#2B2F4A" stroke-width="3" /><circle cx="60" cy="160" r="10" fill="#CFE8FF" stroke="#2B2F4A" stroke-width="3" /><circle cx="140" cy="160" r="10" fill="#CFE8FF" stroke="#2B2F4A" stroke-width="3" /><circle cx="20" cy="120" r="10" fill="#CFE8FF" stroke="#2B2F4A" stroke-width="3" /><circle cx="180" cy="120" r="10" fill="#CFE8FF" stroke="#2B2F4A" stroke-width="3" /><text x="100" y="200" font-size="14" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Diamond</text><polygon points="279.1,106.0 260.0,117.0 240.9,106.0 240.9,84.0 260.0,73.0 279.1,84.0" fill="#E8EAF2" stroke="#555B73" stroke-width="3" stroke-linejoin="round"/><polygon points="317.1,106.0 298.0,117.0 278.9,106.0 278.9,84.0 298.0,73.0 317.1,84.0" fill="#E8EAF2" stroke="#555B73" stroke-width="3" stroke-linejoin="round"/><polygon points="298.1,139.0 279.0,150.0 259.9,139.0 259.9,117.0 279.0,106.0 298.1,117.0" fill="#E8EAF2" stroke="#555B73" stroke-width="3" stroke-linejoin="round"/><polygon points="336.1,139.0 317.0,150.0 297.9,139.0 297.9,117.0 317.0,106.0 336.1,117.0" fill="#E8EAF2" stroke="#555B73" stroke-width="3" stroke-linejoin="round"/><polygon points="260.1,139.0 241.0,150.0 221.9,139.0 221.9,117.0 241.0,106.0 260.1,117.0" fill="#E8EAF2" stroke="#555B73" stroke-width="3" stroke-linejoin="round"/><polygon points="279.1,172.0 260.0,183.0 240.9,172.0 240.9,150.0 260.0,139.0 279.1,150.0" fill="#E8EAF2" stroke="#555B73" stroke-width="3" stroke-linejoin="round"/><polygon points="317.1,172.0 298.0,183.0 278.9,172.0 278.9,150.0 298.0,139.0 317.1,150.0" fill="#E8EAF2" stroke="#555B73" stroke-width="3" stroke-linejoin="round"/><circle class="el" cx="245" cy="95" r="4.5" fill="#FF8A1F" stroke="#E5484D" stroke-width="1.5" style="animation-delay:-0.0s"/><circle class="el" cx="245" cy="128" r="4.5" fill="#FF8A1F" stroke="#E5484D" stroke-width="1.5" style="animation-delay:-0.5s"/><circle class="el" cx="245" cy="161" r="4.5" fill="#FF8A1F" stroke="#E5484D" stroke-width="1.5" style="animation-delay:-1.0s"/><text x="310" y="225" font-size="10" fill="#5B6384" text-anchor="middle" font-weight="600" >Electrons move freely along the la