<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>An ore lump separated into gangue and the metal compound</title><style>text{font-family:sans-serif}.rise{transform-box:fill-box;animation:rise 2.4s linear infinite}@keyframes rise{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-34px);opacity:0}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.88,1.15)}}.fall{animation:fl2 1.8s linear infinite}@keyframes fl2{0%{transform:translateY(0);opacity:1}100%{transform:translateY(20px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M30 150 Q20 100 70 80 Q120 70 135 120 Q145 170 90 180 Q45 185 30 150Z" fill="#8A7A68" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="60" cy="110" r="6" fill="#F2B705" stroke="#8A6D00" stroke-width="2" /><circle cx="95" cy="100" r="6" fill="#F2B705" stroke="#8A6D00" stroke-width="2" /><circle cx="85" cy="140" r="6" fill="#F2B705" stroke="#8A6D00" stroke-width="2" /><circle cx="112" cy="128" r="6" fill="#F2B705" stroke="#8A6D00" stroke-width="2" /><circle cx="52" cy="148" r="6" fill="#F2B705" stroke="#8A6D00" stroke-width="2" /><circle cx="72" cy="122" r="4" fill="#C9B79A" stroke="#6B5A44" stroke-width="1.5" /><circle cx="104" cy="150" r="4" fill="#C9B79A" stroke="#6B5A44" stroke-width="1.5" /><circle cx="48" cy="128" r="4" fill="#C9B79A" stroke="#6B5A44" stroke-width="1.5" /><text x="80" y="208" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Ore from the mine</text><path d="M160 130 h50 m-9 -9 l9 9 -9 9" fill="none" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M235 175 Q250 120 275 120 Q300 120 315 175Z" fill="#C9B79A" stroke="#6B5A44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="275" y="208" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Soil and sand</text><path d="M322 175 Q335 135 352 135 Q369 135 379 175Z" fill="#8A7A68" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="344" cy="160" r="4.5" fill="#F2B705" stroke="#8A6D00" stroke-width="1.5" /><circle cx="357" cy="150" r="4.5" fill="#F2B705" stroke="#8A6D00" stroke-width="1.5" /><circle cx="365" cy="166" r="4.5" fill="#F2B705" stroke="#8A6D00" stroke-width="1.5" /><text x="352" y="208" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Ore grains</text><g class="fall"><circle cx="270" cy="100" r="3" fill="#8A7A68"/><circle cx="282" cy="92" r="3" fill="#8A7A68"/></g></svg>