<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Two furnaces heating a sulphide ore with lots of air and a carbonate ore with little air</title><style>text{font-family:sans-serif}.rise{transform-box:fill-box;animation:rise 2.4s linear infinite}@keyframes rise{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-34px);opacity:0}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.88,1.15)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M28 175 V95 Q28 70 58 70 H163 Q193 70 193 95 V175 Z" fill="#9AA0B8" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="63" y="140" width="95" height="28" rx="6" fill="#F7D9A8" stroke="#8A6D4B" stroke-width="2.5" /><text x="110" y="159" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >ZnS</text><path class="fl" d="M110 138 C96 122 102 112 110 98 C120 112 126 124 110 138Z" fill="#FF8A1F" stroke="#E5484D" stroke-width="2"/><path d="M4 100 h20 m-6 -6 l6 6 -6 6" fill="none" stroke="#0B93D4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M4 122 h20 m-6 -6 l6 6 -6 6" fill="none" stroke="#0B93D4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M4 144 h20 m-6 -6 l6 6 -6 6" fill="none" stroke="#0B93D4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M110 66 v-30 m-6 8 l6 -8 6 8" fill="none" stroke="#3FA34D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="pulse"/><text x="140" y="44" font-size="13" fill="#3FA34D" text-anchor="middle" font-weight="700" >SO₂</text><text x="110" y="205" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Furnace 1</text><path d="M218 175 V95 Q218 70 248 70 H353 Q383 70 383 95 V175 Z" fill="#9AA0B8" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="253" y="140" width="95" height="28" rx="6" fill="#F7D9A8" stroke="#8A6D4B" stroke-width="2.5" /><text x="300" y="159" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >ZnCO₃</text><path class="fl" d="M300 138 C286 122 292 112 300 98 C310 112 316 124 300 138Z" fill="#FF8A1F" stroke="#E5484D" stroke-width="2"/><path d="M194 120 h20 m-6 -6 l6 6 -6 6" fill="none" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M300 66 v-30 m-6 8 l6 -8 6 8" fill="none" stroke="#3FA34D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="pulse"/><text x="330" y="44" font-size="13" fill="#3FA34D" text-anchor="middle" font-weight="700" >CO₂</text><text x="300" y="205" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Furnace 2</text><text x="100" y="100" font-size="1" fill="#2B2F4A" text-anchor="middle" font-weight="700" ></text></svg>