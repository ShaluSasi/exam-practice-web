<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A piece of sodium racing on water with hydrogen burning above it</title><style>text{font-family:sans-serif}.rise{transform-box:fill-box;animation:rise 2.4s linear infinite}@keyframes rise{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-34px);opacity:0}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.88,1.15)}}.skate{animation:sk 2.4s ease-in-out infinite alternate}@keyframes sk{from{transform:translateX(-30px)}to{transform:translateX(40px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="110" y="123.0" width="180" height="77.0" fill="#9FD6F2" opacity=".85"/><path d="M106 90 L110 90 V200 H290 V90 L294 90" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g class="skate"><circle cx="180" cy="128" r="14" fill="#D9DDEA" stroke="#8A90C0" stroke-width="3"/></g><g class="skate"><path class="fl" d="M180 112 C162 90 176 80 180 56 C190 80 206 92 180 112Z" fill="#FF8A1F" stroke="#E5484D" stroke-width="3"/></g><circle class="rise" cx="160" cy="170" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="animation-duration:1.6s;animation-delay:-0.0s"/><circle class="rise" cx="180" cy="170" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="animation-duration:1.6s;animation-delay:-0.4s"/><circle class="rise" cx="200" cy="170" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="animation-duration:1.6s;animation-delay:-0.8s"/><circle class="rise" cx="220" cy="170" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="animation-duration:1.6s;animation-delay:-1.2s"/><path d="M230 70 q6 -8 0 -16 q-6 -8 0 -16" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="pulse"/><path d="M246 70 q6 -8 0 -16 q-6 -8 0 -16" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="pulse"/></svg>