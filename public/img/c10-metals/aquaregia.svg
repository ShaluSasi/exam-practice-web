<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Two acids mixed in a beaker where a gold ring is dissolving</title><style>text{font-family:sans-serif}.rise{transform-box:fill-box;animation:rise 2.4s linear infinite}@keyframes rise{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-34px);opacity:0}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.88,1.15)}}.ring{animation:rg 3s ease-in-out infinite}@keyframes rg{0%{opacity:1}100%{opacity:.25}}.fl2{animation:fw 1s linear infinite}@keyframes fw{to{stroke-dashoffset:-10}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M70 30 h30 v28 q14 10 14 30 v50 h-58 v-50 q0 -20 14 -30z" fill="#FFE3E3" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="85" y="148" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >conc. HCl</text><rect x="35" y="172" width="100" height="12" rx="3" fill="#FF8A8A" stroke="#2B2F4A" stroke-width="2" /><rect x="35" y="172" width="100" height="0" rx="6" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="85" y="206" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >3 parts</text><path d="M300 30 h24 v22 q10 8 10 22 v34 h-44 v-34 q0 -14 10 -22z" fill="#FFF3B0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="312" y="126" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >conc. HNO₃</text><rect x="290" y="172" width="33" height="12" rx="3" fill="#F2D24B" stroke="#2B2F4A" stroke-width="2" /><text x="306" y="206" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >1 part</text><rect x="165" y="141.5" width="90" height="58.5" fill="#FFE6B8" opacity=".85"/><path d="M161 110 L165 110 V200 H255 V110 L259 110" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="210" cy="170" r="16" fill="none" stroke="#F2B705" stroke-width="6" class="ring"/><path d="M105 70 Q150 70 195 100" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5" class="fl2"/><path d="M295 70 Q250 70 225 100" fill="none" stroke="#E0A800" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5" class="fl2"/><circle class="rise" cx="190" cy="165" r="2.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="animation-duration:2.0s;animation-delay:-0.0s"/><circle class="rise" cx="210" cy="165" r="2.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="animation-duration:2.0s;animation-delay:-0.67s"/><circle class="rise" cx="230" cy="165" r="2.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="animation-duration:2.0s;animation-delay:-1.33s"/></svg>