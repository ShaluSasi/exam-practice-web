<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Sulphur burning under an inverted test tube and dry and moist litmus strips</title><style>text{font-family:sans-serif}.rise{transform-box:fill-box;animation:rise 2.4s linear infinite}@keyframes rise{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-34px);opacity:0}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.88,1.15)}}.gas{animation:pulse 2s ease-in-out infinite}.blu{animation:bl 4s ease-in-out infinite}@keyframes bl{0%,30%{opacity:1}60%,100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><line x1="30" y1="180" x2="100" y2="180" stroke="#8A90C0" stroke-width="6" stroke-linecap="round" /><circle cx="104" cy="180" r="6" fill="#8A90C0" stroke="#555B73" stroke-width="2" /><rect x="60" y="168" width="26" height="10" rx="3" fill="#F2D24B" stroke="#B8860B" stroke-width="2" /><path class="fl" d="M73 166 C64 154 70 148 73 138 C78 148 84 156 73 166Z" fill="#3B8BEB" stroke="#1D4E9C" stroke-width="2"/><path d="M50 40 V120 A23 23 0 0 0 96 120 V40" fill="#FFF8D6" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="rotate(0)"/><g class="gas"><circle cx="64" cy="95" r="5" fill="#F7E58A" opacity=".8"/><circle cx="80" cy="80" r="6" fill="#F7E58A" opacity=".8"/><circle cx="70" cy="62" r="5" fill="#F7E58A" opacity=".8"/></g><text x="80" y="214" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Gas from burning sulphur</text><rect x="185" y="60" width="70" height="26" rx="4" fill="#6BA8F2" stroke="#2B2F4A" stroke-width="3" /><text x="220" y="48" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Dry litmus</text><rect x="295" y="60" width="70" height="26" rx="4" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" class="red"/><rect x="295" y="60" width="70" height="26" rx="4" fill="#6BA8F2" stroke="#2B2F4A" stroke-width="3" class="blu"/><text x="330" y="48" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Moist litmus</text><path d="M330 98 q-6 12 0 16 q6 -4 0 -16" fill="#9FD6F2" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="220" y="120" font-size="12" fill="#5B6384" text-anchor="middle" font-weight="600" >stays blue</text><text x="330" y="138" font-size="12" fill="#5B6384" text-anchor="middle" font-weight="600" >changes colour</text></svg>