<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Apparatus for the reaction of a metal with steam</title><style>text{font-family:sans-serif}.rise{transform-box:fill-box;animation:rise 2.4s linear infinite}@keyframes rise{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-34px);opacity:0}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.88,1.15)}}.st{animation:stm 1.6s linear infinite}@keyframes stm{from{transform:translateX(0)}to{transform:translateX(150px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M52 108 V128 C20 150 22 200 65 200 C108 200 110 150 78 128 V108" fill="#CFE8FF" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M30 168 H100 C104 180 94 196 65 196 C36 196 26 180 30 168Z" fill="#7CC4F0" opacity=".85"/><circle class="rise" cx="50" cy="185" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="animation-duration:2.2s;animation-delay:-0.0s"/><circle class="rise" cx="66" cy="185" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="animation-duration:2.2s;animation-delay:-0.73s"/><circle class="rise" cx="82" cy="185" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="animation-duration:2.2s;animation-delay:-1.47s"/><path d="M65 108 V98 H100" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="100" y="92" width="190" height="16" rx="6" fill="#E8F4FF" stroke="#2B2F4A" stroke-width="3" /><g class="st"><circle cx="112" cy="100" r="3.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5"/><circle cx="125" cy="100" r="3.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5"/><circle cx="138" cy="100" r="3.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5"/></g><rect x="172" y="94" width="52" height="12" rx="3" fill="#7B8196" stroke="#2B2F4A" stroke-width="2" /><path d="M188 150 L212 150 L208 180 L192 180 Z" fill="#8A90C0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fl" d="M200 148 C188 132 196 124 200 112 C206 124 214 134 200 148Z" fill="#0B93D4" stroke="#075E88" stroke-width="2"/><rect x="306" y="196" width="90" height="30" rx="4" fill="#7CC4F0" stroke="#2B2F4A" stroke-width="3" opacity=".9"/><path d="M290 100 H300 V215 H360 V170" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M335 120 V190 H388 V120" fill="#E8F4FF" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill-opacity=".6"/><circle class="rise" cx="352" cy="212" r="2.6" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="animation-duration:2.0s;animation-delay:-0.0s"/><circle class="rise" cx="362" cy="212" r="2.6" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="animation-duration:2.0s;animation-delay:-0.67s"/><circle class="rise" cx="372" cy="212" r="2.6" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="animation-duration:2.0s;animation-delay:-1.33s"/><text x="362" y="160" font-size="13" fill="#0B93D4" text-anchor="middle" font-weight="800" class="pulse">H₂</text><text x="200" y="60" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="600" >Steam passes over the heated metal</text></svg>