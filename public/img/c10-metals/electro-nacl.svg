<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Electrolysis of molten sodium chloride</title><style>text{font-family:sans-serif}.rise{transform-box:fill-box;animation:rise 2.4s linear infinite}@keyframes rise{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-34px);opacity:0}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.88,1.15)}}.ion{animation:ia 2.4s linear infinite}@keyframes ia{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(70px);opacity:0}}.ion2{animation:ib 2.4s linear infinite}@keyframes ib{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(-70px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="90" y="127.5" width="220" height="82.5" fill="#FFC58A" opacity=".85"/><path d="M86 100 L90 100 V210 H310 V100 L314 100" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M180 52 H130 V90" fill="none" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M220 52 H270 V90" fill="none" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="180" y="40" width="40" height="24" rx="5" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><line x1="194" y1="46" x2="194" y2="58" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><line x1="206" y1="50" x2="206" y2="54" stroke="#2B2F4A" stroke-width="6" stroke-linecap="round" /><text x="172" y="38" font-size="14" fill="#E5484D" text-anchor="middle" font-weight="700" >+</text><text x="228" y="38" font-size="16" fill="#0B93D4" text-anchor="middle" font-weig