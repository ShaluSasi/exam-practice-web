<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>Atoms of two kinds spread far apart</title><style>text{font-family:sans-serif}.rise{transform-box:fill-box;animation:rise 2.4s linear infinite}@keyframes rise{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-34px);opacity:0}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.88,1.15)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><circle cx="30" cy="28" r="11" fill="#BFD7F2" stroke="#0B6FA0" stroke-width="2.5" /><circle cx="120" cy="40" r="11" fill="#BFD7F2" stroke="#0B6FA0" stroke-width="2.5" /><circle cx="165" cy="26" r="11" fill="#BFD7F2" stroke="#0B6FA0" stroke-width="2.5" /><circle cx="60" cy="95" r="11" fill="#BFD7F2" stroke="#0B6FA0" stroke-width="2.5" /><circle cx="150" cy="110" r="11" fill="#BFD7F2" stroke="#0B6FA0" stroke-width="2.5" /><circle cx="95" cy="70" r="11" fill="#BFD7F2" stroke="#0B6FA0" stroke-width="2.5" /><circle cx="30" cy="120" r="11" fill="#BFD7F2" stroke="#0B6FA0" stroke-width="2.5" /><circle cx="80" cy="25" r="8" fill="#FFD08A" stroke="#B8660B" stroke-width="2.5" /><circle cx="170" cy="70" r="8" fill="#FFD08A" stroke="#B8660B" stroke-width="2.5" /><circle cx="105" cy="120" r="8" fill="#FFD08A" stroke="#B8660B" stroke-width="2.5" /><circle cx="45" cy="60" r="8" fill="#FFD08A" stroke="#B8660B" stroke-width="2.5" /></svg>