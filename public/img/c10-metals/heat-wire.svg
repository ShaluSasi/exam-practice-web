<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A metal wire heated at one end with a pin stuck on the far end with wax</title><style>text{font-family:sans-serif}.rise{transform-box:fill-box;animation:rise 2.4s linear infinite}@keyframes rise{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-34px);opacity:0}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.88,1.15)}}.pin{animation:pin 4s ease-in infinite}@keyframes pin{0%,60%{transform:translateY(0);opacity:1}85%{transform:translateY(40px);opacity:1}100%{transform:translateY(46px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="30" y="205" width="150" height="10" rx="3" fill="#8A90C0" stroke="#2B2F4A" stroke-width="3" /><line x1="60" y1="70" x2="60" y2="205" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round" /><rect x="52" y="98" width="48" height="16" rx="3" fill="#8A90C0" stroke="#2B2F4A" stroke-width="3" /><rect x="100" y="100" width="215" height="10" rx="5" fill="#C97B3A" stroke="#8A4B1C" stroke-width="2.5" /><rect x="100" y="101" width="55" height="8" fill="#FF5A30" opacity="0.85"/><rect x="155" y="101" width="55" height="8" fill="#FF5A30" opacity="0.55"/><rect x="210" y="101" width="55" height="8" fill="#FF5A30" opacity="0.3"/><rect x="95" y="175" width="55" height="32" rx="6" fill="#CFE8FF" stroke="#2B2F4A" stroke-width="3" /><line x1="122" y1="175" x2="122" y2="165" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><path class="fl" d="M122 165 C108 145 118 130 122 112 C128 130 138 148 122 165Z" fill="#FF8A1F" stroke="#E5484D" stroke-width="2"/><circle cx="300" cy="116" r="7" fill="#F5E6A8" stroke="#C9A227" stroke-width="2.5" /><g class="pin"><line x1="300" y1="118" x2="300" y2="150" stroke="#5B6384" stroke-width="3.5"/><circle cx="300" cy="118" r="4" fill="#E5484D"/></g></svg>