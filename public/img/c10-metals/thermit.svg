<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Welding a railway track with molten iron from the thermit reaction</title><style>text{font-family:sans-serif}.rise{transform-box:fill-box;animation:rise 2.4s linear infinite}@keyframes rise{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-34px);opacity:0}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.88,1.15)}}.hot{animation:pulse 1s ease-in-out infinite}.stream{stroke-dasharray:6 5;animation:st .5s linear infinite}@keyframes st{to{stroke-dashoffset:-11}}.spark{transform-box:fill-box;animation:pulse 1.2s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="20" y="200" width="360" height="26" rx="6" fill="#C9CFDD" stroke="#8A90C0" stroke-width="2.5" /><rect x="40" y="150" width="135" height="24" rx="3" fill="#7B8196" stroke="#2B2F4A" stroke-width="3" /><rect x="93.5" y="174" width="28" height="26" rx="2" fill="#7B8196" stroke="#2B2F4A" stroke-width="3" /><rect x="225" y="150" width="135" height="24" rx="3" fill="#7B8196" stroke="#2B2F4A" stroke-width="3" /><rect x="278.5" y="174" width="28" height="26" rx="2" fill="#7B8196" stroke="#2B2F4A" stroke-width="3" /><rect x="175" y="150" width="50" height="24" rx="3" fill="#FFB36B" stroke="#E5484D" stroke-width="2.5" class="hot"/><path d="M160 30 H240 L222 98 H178 Z" fill="#9AA0B8" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M170 40 H230 L218 70 H182 Z" fill="#FF8A1F" stroke="#E5484D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hot"/><line x1="200" y1="98" x2="200" y2="150" stroke="#FF8A1F" stroke-width="7" stroke-linecap="round" class="stream"/><path class="spark" d="M176 120 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#FFD23F" style="animation-delay:-0.0s"/><path class="spark" d="M222 112 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#FFD23F" style="animation-delay:-0.4s"/><path class="spark" d="M168 90 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#FFD23F" style="animation-delay:-0.8s"/><path class="spark" d="M236 132 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#FFD23F" style="animation-delay:-1.2000000000000002s"/></svg>