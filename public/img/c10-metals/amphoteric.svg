<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Aluminium oxide reacting with an acid on one side and a base on the other</title><style>text{font-family:sans-serif}.rise{transform-box:fill-box;animation:rise 2.4s linear infinite}@keyframes rise{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-34px);opacity:0}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.88,1.15)}}.flow{animation:fw 1s linear infinite}@keyframes fw{to{stroke-dashoffset:-14}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="150" y="90" width="100" height="50" rx="10" fill="#E8EAF2" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="121" font-size="18" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Al₂O₃</text><text x="200" y="28" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Aluminium oxide meets an acid and a base</text><path d="M150 115 H70" fill="none" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" class="flow"/><path d="M80 105 L66 115 L80 125" fill="none" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M250 115 H330" fill="none" stroke="#7C5CFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" class="flow"/><path d="M320 105 L334 115 L320 125" fill="none" stroke="#7C5CFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="10" y="50" width="110" height="34" rx="8" fill="#FFE3E3" stroke="#E5484D" stroke-width="3" /><text x="65" y="72" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >HCl (acid)</text><rect x="280" y="50" width="110" height="34" rx="8" fill="#E8E3FF" stroke="#7C5CFF" stroke-width="3" /><text x="335" y="72" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >NaOH (base)</text><text x="50" y="160" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >AlCl₃ + H₂O</text><text x="350" y="160" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >NaAlO₂ + H₂O</text><text x="50" y="180" font-size="11" fill="#5B6384" text-anchor="middle" font-weight="600" >salt and water</text><text x="350" y="180" font-size="11" fill="#5B6384" text-anchor="middle" font-weight="600" >salt and water</text></svg>