<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A simple circuit with a battery, bulb, switch and a metal sample between terminals A and B</title><style>text{font-family:sans-serif}.rise{transform-box:fill-box;animation:rise 2.4s linear infinite}@keyframes rise{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-34px);opacity:0}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.88,1.15)}}.cur{animation:cur 1.5s linear infinite}@keyframes cur{to{stroke-dashoffset:-24}}.glow{animation:pulse 1.2s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M60 50 H170" fill="none" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M230 50 H340 V90" fill="none" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M340 130 V190 H255" fill="none" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M145 190 H60 V140" fill="none" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M60 100 V50" fill="none" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path class="cur" d="M60 50 H340 V190 H60 Z" fill="none" stroke="#FF8A1F" stroke-width="4" stroke-dasharray="2 22" stroke-linecap="round"/><rect x="44" y="100" width="32" height="40" rx="5" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><line x1="52" y1="112" x2="68" y2="112" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><line x1="56" y1="124" x2="64" y2="124" stroke="#2B2F4A" stroke-width="6" stroke-linecap="round" /><text x="32" y="112" font-size="14" fill="#E5484D" text-anchor="middle" font-weight="700" >+</text><text x="32" y="134" font-size="16" fill="#0B93D4" text-anchor="middle" font-weight="700" >−</text><circle cx="200" cy="50" r="20" fill="#FFF3B0" stroke="#F2B705" stroke-width="3" class="glow"/><path d="M190 52 Q195 42 200 52 Q205 42 210 52" fill="none" stroke="#FF8A1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><line x1="194" y1="70" x2="206" y2="70" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><circle cx="340" cy="92" r="4" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1" /><circle cx="340" cy="128" r="4" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1" /><line x1="340" y1="128" x2="340" y2="92" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><circle cx="145" cy="190" r="5" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><circle cx="255" cy="190" r="5" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><rect x="150" y="181" width="100" height="18" rx="4" fill="#C9CFDD" stroke="#5B6384" stroke-width="3" /><text x="145" y="216" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >A</text><text x="255" y="216" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >B</text></svg>