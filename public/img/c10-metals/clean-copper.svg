<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A green tarnished copper pot, a lemon and a shiny clean copper pot</title><style>text{font-family:sans-serif}.rise{transform-box:fill-box;animation:rise 2.4s linear infinite}@keyframes rise{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-34px);opacity:0}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.88,1.15)}}.sh{animation:pulse 1.6s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M25 70 H95 L103 130 H17 Z" fill="#6FA58A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M95 84 q22 0 22 14 q0 14 -18 14" fill="none" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="60" y="170" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Dull and green</text><circle cx="40" cy="95" r="4" fill="#A9D1B6" stroke="none" stroke-width="0" /><circle cx="70" cy="120" r="4" fill="#A9D1B6" stroke="none" stroke-width="0" /><circle cx="55" cy="140" r="4" fill="#A9D1B6" stroke="none" stroke-width="0" /><circle cx="200" cy="110" r="36" fill="#FFE066" stroke="#C9A200" stroke-width="3.5" /><circle cx="200" cy="110" r="26" fill="#FFF3A8" stroke="none" stroke-width="0" /><line x1="200" y1="110" x2="226.0" y2="110.0" stroke="#E8C830" stroke-width="2" stroke-linecap="round" /><line x1="200" y1="110" x2="218.38477631085024" y2="128.38477631085024" stroke="#E8C830" stroke-width="2" stroke-linecap="round" /><line x1="200" y1="110" x2="200.0" y2="136.0" stroke="#E8C830" stroke-width="2" stroke-linecap="round" /><line x1="200" y1="110" x2="181.61522368914976" y2="128.38477631085024"