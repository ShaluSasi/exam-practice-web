<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>Bohr diagram of an atom with 8 protons</title><style>text{font-family:sans-serif}.rise{transform-box:fill-box;animation:rise 2.4s linear infinite}@keyframes rise{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-34px);opacity:0}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.88,1.15)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><circle cx="100" cy="75" r="16.5" fill="#F8B4B6" stroke="#E5484D" stroke-width="2.5" /><text x="100" y="78" font-size="10" fill="#2B2F4A" text-anchor="middle" font-weight="700" >8+</text><circle cx="100" cy="75" r="30.0" fill="none" stroke="#8A90C0" stroke-width="2" /><circle cx="130.0" cy="75.0" r="3.4" fill="#0B93D4" stroke="#075E88" stroke-width="1.2" /><circle cx="70.0" cy="75.0" r="3.4" fill="#0B93D4" stroke="#075E88" stroke-width="1.2" /><circle cx="100" cy="75" r="45.0" fill="none" stroke="#8A90C0" stroke-width="2" /><circle cx="145.0" cy="75.0" r="3.4" fill="#0B93D4" stroke="#075E88" stroke-width="1.2" /><circle cx="122.5" cy="114.0" r="3.4" fill="#0B93D4" stroke="#075E88" stroke-width="1.2" /><circle cx="77.5" cy="114.0" r="3.4" fill="#0B93D4" stroke="#075E88" stroke-width="1.2" /><circle cx="55.0" cy="75.0" r="3.4" fill="#0B93D4" stroke="#075E88" stroke-width="1.2" /><circle cx="77.5" cy="36.0" r="3.4" fill="#0B93D4" stroke="#075E88" stroke-width="1.2" /><circle cx="122.5" cy="36.0" r="3.4" fill="#0B93D4" stroke="#075E88" stroke-width="1.2" /></svg>