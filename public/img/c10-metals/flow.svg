<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Four steps from ore to pure metal drawn as pictures</title><style>text{font-family:sans-serif}.rise{transform-box:fill-box;animation:rise 2.4s linear infinite}@keyframes rise{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-34px);opacity:0}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.88,1.15)}}.fall{animation:fall 1.5s linear infinite}@keyframes fall{0%{transform:translateY(0);opacity:1}100%{transform:translateY(28px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="15" y="55" width="85" height="120" rx="14" fill="#fff" stroke="#CFD3E8" stroke-width="2.5" /><text x="57" y="198" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Step 1</text><rect x="110" y="55" width="85" height="120" rx="14" fill="#fff" stroke="#CFD3E8" stroke-width="2.5" /><text x="152" y="198" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Step 2</text><rect x="205" y="55" width="85" height="120" rx="14" fill="#fff" stroke="#CFD3E8" stroke-width="2.5" /><text x="247" y="198" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Step 3</text><rect x="300" y="55" width="85" height="120" rx="14" fill="#fff" stroke="#CFD3E8" stroke-width="2.5" /><text x="342" y="198" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Step 4</text><path d="M35 140 Q55 90 82 128" fill="none" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><line x1="60" y1="112" x2="50" y2="150" stroke="#8A5A2B" stroke-width="6" stroke-linecap="round" /><path d="M30 150 L45 138 L58 152 L40 160Z" fill="#C9A227" stroke="#8A6D00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M120 95 H175 L168 125 H127 Z" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><line x1="127" y1="125" x2="168" y2="125" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><circle class="fall" cx="135" cy="132" r="3" fill="#8A6D4B" style="animation-delay:-0.0s"/><circle class="fall" cx="147" cy="132" r="3" fill="#8A6D4B" style="animation-delay:-0.5s"/><circle class="fall" cx="159" cy="132" r="3" fill="#8A6D4B" style="animation-delay:-1.0s"/><circle cx="140" cy="110" r="5" fill="#F2B705" stroke="#8A6D00" stroke-width="1.5" /><circle cx="158" cy="108" r="5" fill="#F2B705" stroke="#8A6D00" stroke-width="1.5" /><path d="M220 150 V100 Q220 70 247 70 Q275 70 275 100 V150 Z" fill="#9AA0B8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="fl" d="M247 148 C236 128 244 120 247 106 C252 120 260 130 247 148Z" fill="#FF8A1F" stroke="#E5484D" stroke-width="2"/><rect x="312" y="110" width="62" height="48" rx="4" fill="#7FC8F0" stroke="#2B2F4A" stroke-width="3" /><rect x="325" y="80" width="10" height="60" rx="2" fill="#C97B3A" stroke="#2B2F4A" stroke-width="2" /><rect x="352" y="80" width="6" height="60" rx="2" fill="#E89A5C" stroke="#2B2F4A" stroke-width="2" /><path d="M97 115 h12 m-5 -7 l7 7 -7 7" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M192 115 h12 m-5 -7 l7 7 -7 7" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M287 115 h12 m-5 -7 l7 7 -7 7" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="200" y="30" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Getting a pure metal from its ore</text></svg>