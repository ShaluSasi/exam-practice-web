<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Mercury, iodine, graphite and sodium</title><style>text{font-family:sans-serif}.rise{transform-box:fill-box;animation:rise 2.4s linear infinite}@keyframes rise{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-34px);opacity:0}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.88,1.15)}}.wob{transform-box:fill-box;transform-origin:center;animation:wob 2.4s ease-in-out infinite}@keyframes wob{0%,100%{transform:scale(1,1)}50%{transform:scale(1.08,.9)}}.spk{animation:pulse 1.6s ease-in-out infinite}.knife{animation:cut 3s ease-in-out infinite}@keyframes cut{0%,100%{transform:translateY(-10px)}55%{transform:translateY(8px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="10" y="12" width="185" height="102" rx="12" fill="#fff" stroke="#CFD3E8" stroke-width="2.5" /><text x="102" y="106" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Mercury</text><rect x="205" y="12" width="185" height="102" rx="12" fill="#fff" stroke="#CFD3E8" stroke-width="2.5" /><text x="297" y="106" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Iodine</text><rect x="10" y="126" width="185" height="102" rx="12" fill="#fff" stroke="#CFD3E8" stroke-width="2.5" /><text x="102" y="220" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Graphite</text><rect x="205" y="126" width="185" height="102" rx="12" fill="#fff" stroke="#CFD3E8" stroke-width="2.5" /><text x="297" y="220" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Sodium</text><path d="M30 80 Q102 100 174 80 L164 66 H40 Z" fill="#E8EBF5" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><ellipse class="wob" cx="102" cy="62" rx="26" ry="9" fill="#C9CFDD" stroke="#5B6384" stroke-width="2.5"/><ellipse cx="94" cy="59" rx="8" ry="2.5" fill="#fff" opacity=".8"/><polygon points="270,36 290.8,56.8 283.0,82.8 254.4,80.2 249.2,56.8" fill="#5B4A8C" stroke="#2B2F4A" stroke-width="2.5"/><polygon points="300,30 316.0,46.0 310.0,66.0 288.0,64.0 284.0,46.0" fill="#5B4A8C" stroke="#2B2F4A" stroke-width="2.5"/><polygon points="322,46 339.6,63.6 333.0,85.6 308.8,83.4 304.4,63.6" fill="#5B4A8C" stroke="#2B2F4A" stroke-width="2.5"/><polygon points="345,38 357.8,50.8 353.0,66.8 335.4,65.2 332.2,50.8" fill="#5B4A8C" stroke="#2B2F4A" stroke-width="2.5"/><g class="spk"><path d="M283 36 l3 6 6 3 -6 3 -3 6 -3 -6 -6 -3 6 -3z" fill="#fff"/><path d="M338 70 l2 4 4 2 -4 2 -2 4 -2 -4 -4 -2 4 -2z" fill="#fff"/></g><path d="M32 190 L110 150" fill="none" stroke="#555B73" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><path d="M110 150 L128 140" fill="none" stroke="#2B2F4A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><circle cx="160" cy="160" r="16" fill="#FFF3B0" stroke="#F2B705" stroke-width="3" class="pulse"/><line x1="160" y1="176" x2="160" y2="186" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M150 160 Q155 150 160 160 Q165 150 170 160" fill="none" stroke="#FF8A1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="240" y="180" width="70" height="28" rx="4" fill="#D9DDEA" stroke="#8A90C0" stroke-width="3" /><g class="knife"><path d="M330 148 L326 192 L342 192 Z" fill="#CFD3E8" stroke="#5B6384" stroke-width="2"/><rect x="324" y="136" width="20" height="14" rx="4" fill="#7C5CFF"/></g></svg>