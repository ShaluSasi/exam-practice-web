<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A zinc-coated iron sheet with a scratch showing the iron underneath</title><style>text{font-family:sans-serif}.rise{transform-box:fill-box;animation:rise 2.4s linear infinite}@keyframes rise{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-34px);opacity:0}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.88,1.15)}}.drop{animation:pulse 2.4s ease-in-out infinite}.zc{animation:zc 2.4s ease-in-out infinite}@keyframes zc{0%,100%{opacity:.2}50%{opacity:1}}.eflow{animation:ef 1s linear infinite}@keyframes ef{to{stroke-dashoffset:-9}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="60" y="140" width="280" height="60" rx="6" fill="#8E96AD" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="176" font-size="14" fill="#fff" text-anchor="middle" font-weight="700" >Iron</text><rect x="60" y="114" width="100" height="26" rx="4" fill="#D6E4F0" stroke="#2B2F4A" stroke-width="3" /><rect x="240" y="114" width="100" height="26" rx="4" fill="#D6E4F0" stroke="#2B2F4A" stroke-width="3" /><text x="110" y="132" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Zinc</text><text x="290" y="132" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Zinc</text><path d="M165 100 Q200 70 235 100 Q238 120 200 118 Q162 120 165 100Z" fill="#9FD6F2" stroke="#0B93D4" stroke-width="2.5" class="drop"/><text x="200" y="56" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Scratch: moisture reaches the iron</text><circle class="zc" cx="150" cy="118" r="3" fill="#fff" stroke="#5B6384" stroke-width="1.2" style="animation-delay:-0.0s"/><circle class="zc" cx="158" cy="118" r="3" fill="#fff" stroke="#5B6384" stroke-width="1.2" style="animation-delay:-0.6s"/><circle class="zc" cx="246" cy="118" r="3" fill="#fff" stroke="#5B6384" stroke-width="1.2" style="animation-delay:-1.2s"/><circle class="zc" cx="254" cy="118" r="3" fill="#fff" stroke="#5B6384" stroke-width="1.2" style="animation-delay:-1.7999999999999998s"/><path d="M158 150 H242" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 6" class="eflow"/></svg>