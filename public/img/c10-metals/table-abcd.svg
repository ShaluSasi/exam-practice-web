<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A table of four unknown metals A to D added to four salt solutions</title><style>text{font-family:sans-serif}.rise{transform-box:fill-box;animation:rise 2.4s linear infinite}@keyframes rise{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-34px);opacity:0}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.88,1.15)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="22" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Metal added to each salt solution</text><rect x="70" y="34" width="76" height="28" rx="6" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5" /><text x="108" y="53" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >ZnSO₄</text><rect x="150" y="34" width="76" height="28" rx="6" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5" /><text x="188" y="53" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >FeSO₄</text><rect x="230" y="34" width="76" height="28" rx="6" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5" /><text x="268" y="53" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >CuSO₄</text><rect x="310" y="34" width="76" height="28" rx="6" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5" /><text x="348" y="53" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >AgNO₃</text><rect x="10" y="68" width="56" height="32" rx="6" fill="#FFF3B0" stroke="#2B2F4A" stroke-width="2.5" /><text x="38" y="89" font-size="14" fill="#2B2F4A" text-anchor="middle" font-weight="700" >A</text><rect x="70" y="68" width="76" height="32" rx="6" fill="#D7F2DA" stroke="#3FA34D" str