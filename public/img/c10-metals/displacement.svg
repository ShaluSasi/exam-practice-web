<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A copper wire in iron sulphate and an iron nail in copper sulphate</title><style>text{font-family:sans-serif}.rise{transform-box:fill-box;animation:rise 2.4s linear infinite}@keyframes rise{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-34px);opacity:0}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.88,1.15)}}.dep{animation:pulse 2.2s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M70 85.0 H130 V160.0 A30.0 30.0 0 0 1 70 160.0 Z" fill="#CFE8B8" opacity=".85"/><path d="M70 40 V160.0 A30.0 30.0 0 0 0 130 160.0 V40" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><line x1="88" y1="30" x2="108" y2="150" stroke="#C97B3A" stroke-width="6" stroke-linecap="round" /><text x="100" y="214" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Copper wire in</text><text x="100" y="229" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >iron(II) sulphate</text><path d="M270 85.0 H330 V160.0 A30.0 30.0 0 0 1 270 160.0 Z" fill="#6EB8E8" opacity=".85"/><path d="M270 40 V160.0 A30.0 30.0 0 0 0 330 160.0 V40" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><line x1="288" y1="30" x2="308" y2="150" stroke="#8E96AD" stroke-width="6" stroke-linecap="round" /><path d="M296 110 L304 140 L310 136 L302 108Z" fill="#B5651D" opacity=".9"/><circle class="dep" cx="292" cy="120" r="3" fill="#B5651D" style="animation-delay:-0.0s"/><circle class="dep" cx="308" cy="130" r="3" fill="#B5651D" style="animation-delay:-0.7s"/><circle class="dep" cx="302" cy="100" r="3" fill="#B5651D" style="animation-delay:-1.4s"/><text x="300" y="214" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Iron nail in</text><text x="300" y="229" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >copper(II) sulphate</text></svg>