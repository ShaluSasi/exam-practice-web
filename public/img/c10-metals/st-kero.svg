<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A jar of yellow kerosene oil with sodium resting at the bottom</title><style>text{font-family:sans-serif}.rise{transform-box:fill-box;animation:rise 2.4s linear infinite}@keyframes rise{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-34px);opacity:0}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.88,1.15)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="55" y="30" width="90" height="100" rx="10" fill="#F8E9A1" stroke="#2B2F4A" stroke-width="3" /><circle cx="80" cy="114" r="11" fill="#D9DDEA" stroke="#8A90C0" stroke-width="3" /><circle cx="106" cy="118" r="9" fill="#D9DDEA" stroke="#8A90C0" stroke-width="3" /></svg>