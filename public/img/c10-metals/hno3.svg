<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A test tube of nitric acid with a metal piece and brown fumes rising</title><style>text{font-family:sans-serif}.rise{transform-box:fill-box;animation:rise 2.4s linear infinite}@keyframes rise{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-34px);opacity:0}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.88,1.15)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M150 135.0 H220 V165.0 A35.0 35.0 0 0 1 150 165.0 Z" fill="#F0E4A8" opacity=".85"/><path d="M150 70 V165.0 A35.0 35.0 0 0 0 220 165.0 V70" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><rect x="166" y="170" width="38" height="16" rx="4" fill="#C97B3A" stroke="#8A4B1C" stroke-width="2" /><circle class="rise" cx="160" cy="110" r="9" fill="#C0602A" opacity=".75" style="animation-delay:-0.0s;animation-duration:2.4s"/><circle class="rise" cx="185" cy="110" r="9" fill="#C0602A" opacity=".75" style="animation-delay:-0.8s;animation-duration:2.4s"/><circle class="rise" cx="208" cy="110" r="9" fill="#C0602A" opacity=".75" style="animation-delay:-1.6s;animation-duration:2.4s"/><text x="185" y="28" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Metal in dilute nitric acid</text><text x="185" y="222" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Brown fumes rise, not H₂</text></svg>