<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>Sodium burning on an open dish</title><style>text{font-family:sans-serif}.rise{transform-box:fill-box;animation:rise 2.4s linear infinite}@keyframes rise{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-34px);opacity:0}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.88,1.15)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="50" y="115" width="100" height="14" rx="6" fill="#C9CFDD" stroke="#8A90C0" stroke-width="3" /><circle cx="100" cy="105" r="11" fill="#D9DDEA" stroke="#8A90C0" stroke-width="3" /><path class="fl" d="M100 94 C86 76 94 68 100 50 C108 68 118 78 100 94Z" fill="#FF8A1F" stroke="#E5484D" stroke-width="2.5"/></svg>