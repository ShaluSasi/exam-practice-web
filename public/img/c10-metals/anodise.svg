<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Anodising an aluminium article and the thicker oxide layer it gives</title><style>text{font-family:sans-serif}.rise{transform-box:fill-box;animation:rise 2.4s linear infinite}@keyframes rise{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-34px);opacity:0}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.88,1.15)}}.th{animation:pulse 2.4s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="100" y="22" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Anodising bath</text><text x="300" y="22" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Oxide layer, magnified</text><rect x="30" y="96.0" width="140" height="84.0" fill="#E3F2FD" opacity=".85"/><path d="M26 60 L30 60 V180 H170 V60 L174 60" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="52" y="50" width="16" height="100" rx="3" fill="#B9BFCF" stroke="#2B2F4A" stroke-width="3" /><rect x="132" y="50" width="10" height="100" rx="3" fill="#555B73" stroke="#2B2F4A" stroke-width="3" /><path d="M60 50 V36 H100" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M140 50 V36 H108" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="98" y="26" width="12" height="20" rx="3" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><text x="46" y="40" font-size="14" fill="#E5484D" text-anchor="middle" font-weight="700" >+</text><text x="150" y="40" font-size="16" fill="#0B93D4" text-anchor="middle" font-weight="700" >−</text><circle class="rise" cx="76" cy="130" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="animation-duration:2.0s;animation-delay:-0.0s"/><circle class="rise" cx="84" cy="130" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="animation-duration:2.0s;animation-delay:-0.67s"/><circle class="rise" cx="92" cy="130" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="animation-duration:2.0s;animation-delay:-1.33s"/><text x="100" y="200" font-size="11" fill="#5B6384" text-anchor="middle" font-weight="600" >dilute sulphuric acid</text><text x="235" y="86" font-size="11" fill="#5B6384" text-anchor="middle" font-weight="700" >Before</text><text x="335" y="86" font-size="11" fill="#5B6384" text-anchor="middle" font-weight="700" >After</text><rect x="200" y="150" width="70" height="40" rx="3" fill="#B9BFCF" stroke="#2B2F4A" stroke-width="3" /><rect x="200" y="142" width="70" height="8" rx="2" fill="#9FD6F2" stroke="#0B93D4" stroke-width="2" /><rect x="300" y="150" width="70" height="40" rx="3" fill="#B9BFCF" stroke="#2B2F4A" stroke-width="3" /><rect x="300" y="118" width="70" height="32" rx="3" fill="#C9A8F0" stroke="#7C5CFF" stroke-width="2.5" class="th"/><text x="235" y="208" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >thin</text><text x="335" y="208" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >thick (can be dyed)</text></svg>