<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Malleable and ductile metals</title><style>text{font-family:sans-serif}.rise{transform-box:fill-box;animation:rise 2.4s linear infinite}@keyframes rise{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-34px);opacity:0}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.88,1.15)}}.ham{animation:hit 1.6s ease-in infinite}@keyframes hit{0%,100%{transform:translateY(-12px)}45%{transform:translateY(32px)}60%{transform:translateY(32px)}}.mv{animation:mv 1.8s linear infinite}@keyframes mv{0%{transform:translateX(30px);opacity:0}30%{opacity:1}100%{transform:translateX(-4px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="100" y="24" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Hammered into a sheet</text><text x="300" y="24" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Drawn into a wire</text><rect x="40" y="150" width="120" height="22" rx="3" fill="#8A90C0" stroke="#2B2F4A" stroke-width="3" /><rect x="52" y="138" width="96" height="12" rx="3" fill="#F2B705" stroke="#B8860B" stroke-width="2.5" /><g class="ham"><rect x="86" y="62" width="28" height="22" rx="4" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="3"/><line x1="100" y1="84" x2="100" y2="104" stroke="#8A5A2B" stroke-width="7" stroke-linecap="round"/></g><rect x="250" y="95" width="22" height="70" rx="3" fill="#8A90C0" stroke="#2B2F4A" stroke-width="3" /><circle cx="261" cy="130" r="6" fill="#FFF9EE" stroke="#2B2F4A" stroke-width="2.5" /><rect x="190" y="118" width="60" height="24" rx="6" fill="#F2B705" stroke="#B8860B" stroke-width="2.5" /><rect x="272" y="127" width="110" height="6" rx="3" fill="#F2B705" stroke="#B8860B" stroke-width="1.5"/><g class="mv"><path d="M300 120 l-8 7 8 7" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round"/></g><text x="200" y="205" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="600" >Both let metals be shaped as we need</text></svg>