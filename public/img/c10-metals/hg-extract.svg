<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Cinnabar heated to mercury oxide and then to mercury</title><style>text{font-family:sans-serif}.rise{transform-box:fill-box;animation:rise 2.4s linear infinite}@keyframes rise{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-34px);opacity:0}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.88,1.15)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="10" y="70" width="100" height="80" rx="14" fill="#fff" stroke="#CFD3E8" stroke-width="2.5" /><circle cx="60" cy="104" r="18" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" /><text x="60" y="138" font-size="15" fill="#2B2F4A" text-anchor="middle" font-weight="700" >HgS</text><text x="60" y="166" font-size="11" fill="#5B6384" text-anchor="middle" font-weight="600" >cinnabar</text><rect x="150" y="70" width="100" height="80" rx="14" fill="#fff" stroke="#CFD3E8" stroke-width="2.5" /><circle cx="200" cy="104" r="18" fill="#F08A5D" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="138" font-size="15" fill="#2B2F4A" text-anchor="middle" font-weight="700" >HgO</text><text x="200" y="166" font-size="11" fill="#5B6384" text-anchor="middle" font-weight="600" >+ SO₂</text><rect x="290" y="70" width="100" height="80" rx="14" fill="#fff" stroke="#CFD3E8" stroke-width="2.5" /><circle cx="340" cy="104" r="18" fill="#C9CFDD" stroke="#2B2F4A" stroke-width="3" /><text x="340" y="138" font-size="15" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Hg</text><text x="340" y="166" font-size="11" fill="#5B6384" text-anchor="middle" font-weight="600" >+ O₂</text><path d="M112 110 h22 m-7 -7 l7 7 -7 7" fill="none" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><text x="123" y="95" font-size="10" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Heat in air</text><path d="M252 110 h22 m-7 -7 l7 7 -7 7" fill="none" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><text x="263" y="95" font-size="10" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Heat</text><path class="fl" d="M60 60 C52 48 58 42 60 34 C65 44 70 50 60 60Z" fill="#FF8A1F"/><text x="200" y="26" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Mercury from its ore</text></svg>