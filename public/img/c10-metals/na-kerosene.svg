<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Sodium kept safely under kerosene and sodium burning in open air</title><style>text{font-family:sans-serif}.rise{transform-box:fill-box;animation:rise 2.4s linear infinite}@keyframes rise{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-34px);opacity:0}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.88,1.15)}}.fl{animation-duration:.5s}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="40" y="60" width="110" height="130" rx="10" fill="#F8E9A1" stroke="#2B2F4A" stroke-width="3" /><rect x="60" y="44" width="70" height="18" rx="5" fill="#C9CFDD" stroke="#2B2F4A" stroke-width="3" /><circle cx="80" cy="172" r="12" fill="#D9DDEA" stroke="#8A90C0" stroke-width="3" /><circle cx="108" cy="176" r="10" fill="#D9DDEA" stroke="#8A90C0" stroke-width="3" /><text x="95" y="215" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Under kerosene</text><rect x="240" y="170" width="100" height="16" rx="6" fill="#C9CFDD" stroke="#8A90C0" stroke-width="3" /><circle cx="290" cy="162" r="12" fill="#D9DDEA" stroke="#8A90C0" stroke-width="3" /><path class="fl" d="M290 150 C268 120 284 108 290 80 C300 108 318 122 290 150Z" fill="#FF8A1F" stroke="#E5484D" stroke-width="3"/><path class="fl" d="M290 148 C280 130 288 124 290 112 C296 126 304 132 290 148Z" fill="#FFD23F"/><text x="290" y="215" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Left in the open air</text></svg>