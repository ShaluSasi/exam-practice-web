<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>Colourless solution with gas bubbles</title><style>text{font-family:sans-serif}.rise{transform-box:fill-box;animation:rise 2.4s linear infinite}@keyframes rise{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-34px);opacity:0}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.88,1.15)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M75 56.699999999999996 H125 V111.0 A25.0 25.0 0 0 1 75 111.0 Z" fill="#F4F6FF" opacity=".85"/><path d="M75 14 V111.0 A25.0 25.0 0 0 0 125 111.0 V14" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><line x1="88" y1="8" x2="108" y2="112" stroke="#8E96AD" stroke-width="6" stroke-linecap="round" /><circle class="rise" cx="90" cy="100" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="animation-duration:2.0s;animation-delay:-0.0s"/><circle class="rise" cx="100" cy="100" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="animation-duration:2.0s;animation-delay:-0.67s"/><circle class="rise" cx="110" cy="100" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="animation-duration:2.0s;animation-delay:-1.33s"/></svg>