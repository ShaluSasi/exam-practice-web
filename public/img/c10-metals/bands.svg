<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" role="img"><title>Metals in the activity series grouped by how they are extracted</title><style>text{font-family:sans-serif}.rise{transform-box:fill-box;animation:rise 2.4s linear infinite}@keyframes rise{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-34px);opacity:0}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.88,1.15)}}.arr{animation:pulse 2s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="20" y="18" width="50" height="17" rx="5" fill="#FFD6D6" stroke="#2B2F4A" stroke-width="2" /><text x="45" y="31" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >K</text><rect x="20" y="38" width="50" height="17" rx="5" fill="#FFD6D6" stroke="#2B2F4A" stroke-width="2" /><text x="45" y="51" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Na</text><rect x="20" y="58" width="50" height="17" rx="5" fill="#FFD6D6" stroke="#2B2F4A" stroke-width="2" /><text x="45" y="71" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Ca</text><rect x="20" y="78" width="50" height="17" rx="5" fill="#FFD6D6" stroke="#2B2F4A" stroke-width="2" /><text x="45" y="91" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Mg</text><rect x="20" y="98" width="50" height="17" rx="5" fill="#FFD6D6" stroke="#2B2F4A" stroke-width="2" /><text x="45" y="111" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Al</text><rect x="20" y="118" width="50" height="17" rx="5" fill="#FFE9C2" stroke="#2B2F4A" stroke-width="2" /><text x="45" y="131" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Zn</text><rect x="20" y="138" width="50" height="17" rx="5" fill="#FFE9C2" stroke="#2B2F4A" stroke-width="2" /><text x="45" y="151" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Fe</text><rect x="20" y="158" width="50" height="17" rx="5" fill="#FFE9C2" stroke="#2B2F4A" stroke-width="2" /><text x="45" y="171" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Pb</text><rect x="20" y="178" width="50" height="17" rx="5" fill="#D7F2DA" stroke="#2B2F4A" stroke-width="2" /><text x="45" y="191" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Cu</text><rect x="20" y="198" width="50" height="17" rx="5" fill="#D7F2DA" stroke="#2B2F4A" stroke-width="2" /><text x="45" y="211" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Hg</text><rect x="20" y="218" width="50" height="17" rx="5" fill="#D7F2DA" stroke="#2B2F4A" stroke-width="2" /><text x="45" y="231" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Ag</text><rect x="20" y="238" width="50" height="17" rx="5" fill="#D7F2DA" stroke="#2B2F4A" stroke-width="2" /><text x="45" y="251" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Au</text><path d="M80 20 V98" fill="none" stroke="#E5484D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="90" y="58" font-size="11" fill="#2B2F4A" text-anchor="start" font-weight="700" >Electrolysis of molten</text><text x="90" y="72" font-size="11" fill="#2B2F4A" text-anchor="start" font-weight="700" >compounds</text><path d="M80 118 V174" fill="none" stroke="#E08A00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="90" y="141" font-size="11" fill="#2B2F4A" text-anchor="start" font-weight="700" >Reduction by carbon</text><text x="90" y="155" font-size="11" fill="#2B2F4A" text-anchor="start" font-weight="700" >after roasting or calcining</text><path d="M80 182 V256" fill="none" stroke="#3FA34D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="90" y="210" font-size="11" fill="#2B2F4A" text-anchor="start" font-weight="700" >Heating alone, or</text><text x="90" y="224" font-size="11" fill="#2B2F4A" text-anchor="start" font-weight="700" >found free in nature</text><text x="300" y="30" font-size="11" fill="#E5484D" text-anchor="middle" font-weight="700" >More reactive</text><text x="300" y="248" font-size="11" fill="#3FA34D" text-anchor="middle" font-weight="700" >Less reactive</text><g class="arr"><path d="M370 40 V230 M362 220 L370 232 L378 220" fill="none" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g></svg>