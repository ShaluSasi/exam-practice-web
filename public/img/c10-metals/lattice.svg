<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img"><title>A crystal lattice of positive and negative ions with the top layers sliding</title><style>text{font-family:sans-serif}.rise{transform-box:fill-box;animation:rise 2.4s linear infinite}@keyframes rise{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-34px);opacity:0}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.88,1.15)}}.shift{animation:sh 4s ease-in-out infinite}@keyframes sh{0%,35%{transform:translateX(0)}55%,100%{transform:translateX(44px)}}.rep{animation:pulse 2s ease-in-out infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><g class="shift"><circle cx="100" cy="60" r="10" fill="#9FD6F2" stroke="#0B6FA0" stroke-width="2.5" /><text x="100" y="64" font-size="12" fill="#0B6FA0" text-anchor="middle" font-weight="700" >+</text><circle cx="144" cy="60" r="14" fill="#BFE6B0" stroke="#2E7D32" stroke-width="2.5" /><text x="144" y="64" font-size="14" fill="#2E7D32" text-anchor="middle" font-weight="700" >−</text><circle cx="188" cy="60" r="10" fill="#9FD6F2" stroke="#0B6FA0" stroke-width="2.5" /><text x="188" y="64" font-size="12" fill="#0B6FA0" text-anchor="middle" font-weight="700" >+</text><circle cx="232" cy="60" r="14" fill="#BFE6B0" stroke="#2E7D32" stroke-width="2.5" /><text x="232" y="64" font-size="14" fill="#2E7D32" text-anchor="middle" font-weight="700" >−</text><circle cx="276" cy="60" r="10" fill="#9FD6F2" stroke="#0B6FA0" stroke-width="2.5" /><text x="276" y="64" font-size="12" fill="#0B6FA0" text-anchor="middle" font-weight="700" >+</text><circle cx="320" cy="60" r="14" fill="#BFE6B0" stroke="#2E7D32" stroke-width="2.5" /><text x="320" y="64" font-size="14" fill="