<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>Two kinds of atom in two separate layers</title><style>text{font-family:sans-serif}.rise{transform-box:fill-box;animation:rise 2.4s linear infinite}@keyframes rise{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-34px);opacity:0}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.88,1.15)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><circle cx="40" cy="30" r="12" fill="#BFD7F2" stroke="#0B6FA0" stroke-width="2.5" /><circle cx="70" cy="30" r="12" fill="#BFD7F2" stroke="#0B6FA0" stroke-width="2.5" /><circle cx="100" cy="30" r="12" fill="#BFD7F2" stroke="#0B6FA0" stroke-width="2.5" /><circle cx="130" cy="30" r="12" fill="#BFD7F2" stroke="#0B6FA0" stroke-width="2.5" /><circle cx="160" cy="30" r="12" fill="#BFD7F2" stroke="#0B6FA0" stroke-width="2.5" /><circle cx="40" cy="58" r="12" fill="#BFD7F2" stroke="#0B6FA0" stroke-width="2.5" /><circle cx="70" cy="58" r="12" fill="#BFD7F2" stroke="#0B6FA0" stroke-width="2.5" /><circle cx="100" cy="58" r="12" fill="#BFD7F2" stroke="#0B6FA0" stroke-width="2.5" /><circle cx="130" cy="58" r="12" fill="#BFD7F2" stroke="#0B6FA0" stroke-width="2.5" /><circle cx="160" cy="58" r="12" fill="#BFD7F2" stroke="#0B6FA0" stroke-width="2.5" /><circle cx="40" cy="86" r="12" fill="#FFD08A" stroke="#B8660B" stroke-width="2.5" /><circle cx="70" cy="86" r="12" fill="#FFD08A" stroke="#B8660B" stroke-width="2.5" /><circle cx="100" cy="86" r="12" fill="#FFD08A" stroke="#B8660B" stroke-width="2.5" /><circle cx="130" cy="86" r="12" fill="#FFD08A" stroke="#B8660B" stroke-width="2.5" /><circle cx="160" cy="86" r="12" fill="#FFD08A" stroke="#B8660B" stroke-width="2.5" /><