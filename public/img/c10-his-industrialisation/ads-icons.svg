<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Four round icons: a printed label, a calendar, a crown and a newspaper</title><style>.spin{animation:spin 3s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinf{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-22px);opacity:0}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.slide{animation:slide 2s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(0)}to{transform:translateX(40px)}}
.grow{animation:grow 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{0%{transform:scaleY(1)}12%{transform:scaleY(.15)}55%{transform:scaleY(1)}100%{transform:scaleY(1)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.walk{animation:walk 4s linear infinite alternate}@keyframes walk{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.sw{animation:sw 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0%}@keyframes sw{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="24" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Ways to sell new goods</text><circle cx="60" cy="110" r="38" fill="#FFF" stroke="#2B2F4A" stroke-width="2.5" /><rect x="38" y="92" width="44" height="34" rx="3" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><text x="60" y="106" font-family="sans-serif" font-size="9" font-weight="700" fill="#2B2F4A" text-anchor="middle" >MADE IN</text><text x="60" y="118" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle" >...</text><circle cx="150" cy="110" r="38" fill="#FFF" stroke="#2B2F4A" stroke-width="2.5" /><rect x="130" y="88" width="40" height="44" rx="3" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><rect x="130" y="88" width="40" height="12" rx="3" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" /><circle cx="150" cy="116" r="7" fill="#FFD23F" stroke="#FF8A1F" stroke-width="2" /><circle cx="240" cy="110" r="38" fill="#FFF" stroke="#2B2F4A" stroke-width="2.5" /><path d="M218 124 L222 98 L232 112 L240 94 L248 112 L258 98 L262 124Z" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="330" cy="110" r="38" fill="#FFF" stroke="#2B2F4A" stroke-width="2.5" /><rect x="310" y="92" width="40" height="34" rx="3" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><rect x="314" y="96" width="32" height="6" rx="0" fill="#2B2F4A" /><path d="M314 108 L346 108" stroke="#C9CED6" stroke-width="2" stroke-linecap="round" fill="none" /><path d="M314 116 L346 116" stroke="#C9CED6" stroke-width="2" stroke-linecap="round" fill="none" /></svg>