<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Four round icons: a trainee, a gear, a price tag and a closed door, standing for what guilds did</title><style>.spin{animation:spin 3s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinf{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-22px);opacity:0}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.slide{animation:slide 2s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(0)}to{transform:translateX(40px)}}
.grow{animation:grow 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{0%{transform:scaleY(1)}12%{transform:scaleY(.15)}55%{transform:scaleY(1)}100%{transform:scaleY(1)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.walk{animation:walk 4s linear infinite alternate}@keyframes walk{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.sw{animation:sw 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0%}@keyframes sw{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="24" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle" >What a guild did</text><circle cx="60" cy="100" r="38" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><g transform="translate(60 122) scale(0.55 0.55)"><rect x="-8" y="-16" width="6" height="16" rx="2" fill="#4A4E69" /><rect x="2" y="-16" width="6" height="16" rx="2" fill="#4A4E69" /><ellipse cx="-5" cy="0" rx="6" ry="2.5" fill="#2B2F4A"/><ellipse cx="5" cy="0" rx="6" ry="2.5" fill="#2B2F4A"/><path d="M-9 -40 L-13 -24" stroke="#F2B48C" stroke-width="4.5" stroke-linecap="round"/><path d="M9 -40 L13 -24" stroke="#F2B48C" stroke-width="4.5" stroke-linecap="round"/><path d="M-11 -16 L-9 -42 Q0 -46 9 -42 L11 -16 Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><circle cx="0" cy="-54" r="11" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2" /><path d="M-11 -54 Q-12 -68 0 -67 Q12 -68 11 -54 Q6 -61 0 -61 Q-6 -61 -11 -54Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1.5"/><circle cx="-4" cy="-55" r="1.6" fill="#2B2F4A"/><circle cx="4" cy="-55" r="1.6" fill="#2B2F4A"/><path d="M-3.5 -49 Q0 -46 3.5 -49" fill="none" stroke="#2B2F4A" stroke-width="1.6" stroke-linecap="round"/></g><text x="60" y="168" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Trained</text><circle cx="152" cy="100" r="38" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><g transform="translate(152 100)"><g class="spin"><rect x="-3" y="-18" width="6" height="8" fill="#9AA0B4" stroke="#2B2F4A" stroke-width="1.5" transform="rotate(0)"/><rect x="-3" y="-18" width="6" height="8" fill="#9AA0B4" stroke="#2B2F4A" stroke-width="1.5" transform="rotate(45)"/><rect x="-3" y="-18" width="6" height="8" fill="#9AA0B4" stroke="#2B2F4A" stroke-width="1.5" transform="rotate(90)"/><rect x="-3" y="-18" width="6" height="8" fill="#9AA0B4" stroke="#2B2F4A" stroke-width="1.5" transform="rotate(135)"/><rect x="-3" y="-18" width="6" height="8" fill="#9AA0B4" stroke="#2B2F4A" stroke-width="1.5" transform="rotate(180)"/><rect x="-3" y="-18" width="6" height="8" fill="#9AA0B4" stroke="#2B2F4A" stroke-width="1.5" transform="rotate(225)"/><rect x="-3" y="-18" width="6" height="8" fill="#9AA0B4" stroke="#2B2F4A" stroke-width="1.5" transform="rotate(270)"/><rect x="-3" y="-18" width="6" height="8" fill="#9AA0B4" stroke="#2B2F4A" stroke-width="1.5" transform="rotate(315)"/><circle cx="0" cy="0" r="14" fill="#9AA0B4" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="0" cy="0" r="4.8999999999999995" fill="#E7E9F0" stroke="#2B2F4A" stroke-width="2" /></g></g><text x="152" y="168" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Controlled</text><text x="152" y="181" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >production</text><circle cx="244" cy="100" r="38" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><rect x="228" y="88" width="32" height="22" rx="3" fill="#FFF" stroke="#2B2F4A" stroke-width="2" /><text x="244" y="106" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Rs</text><text x="244" y="168" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Set rules</text><text x="244" y="181" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >on prices</text><circle cx="336" cy="100" r="38" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><rect x="324" y="88" width="24" height="26" rx="3" fill="#6B4A2A" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="341" cy="102" r="2" fill="#FFD23F" /><text x="336" y="168" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Kept new</text><text x="336" y="181" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >people out</text></svg>