<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A row of twelve months with the cold months shaded, and four tags: gas works, breweries, printers, ship repairs</title><style>.spin{animation:spin 3s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinf{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-22px);opacity:0}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.slide{animation:slide 2s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(0)}to{transform:translateX(40px)}}
.grow{animation:grow 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{0%{transform:scaleY(1)}12%{transform:scaleY(.15)}55%{transform:scaleY(1)}100%{transform:scaleY(1)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.walk{animation:walk 4s linear infinite alternate}@keyframes walk{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.sw{animation:sw 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0%}@keyframes sw{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Work that rose and fell with the seasons</text><rect x="22" y="70" width="26" height="36" rx="4" fill="#BFE0F5" stroke="#2B2F4A" stroke-width="2" /><text x="35" y="94" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >J</text><rect x="51" y="70" width="26" height="36" rx="4" fill="#BFE0F5" stroke="#2B2F4A" stroke-width="2" /><text x="64" y="94" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >F</text><rect x="80" y="70" width="26" height="36" rx="4" fill="#F7EBD2" stroke="#2B2F4A" stroke-width="2" /><text x="93" y="94" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >M</text><rect x="109" y="70" width="26" height="36" rx="4" fill="#F7EBD2" stroke="#2B2F4A" stroke-width="2" /><text x="122" y="94" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >A</text><rect x="138" y="70" width="26" height="36" rx="4" fill="#F7EBD2" stroke="#2B2F4A" stroke-width="2" /><text x="151" y="94" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >M</text><rect x="167" y="70" width="26" height="36" rx="4" fill="#F7EBD2" stroke="#2B2F4A" stroke-width="2" /><text x="180" y="94" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >J</text><rect x="196" y="70" width="26" height="36" rx="4" fill="#F7EBD2" stroke="#2B2F4A" stroke-width="2" /><text x="209" y="94" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >J</text><rect x="225" y="70" width="26" height="36" rx="4" fill="#F7EBD2" stroke="#2B2F4A" stroke-width="2" /><text x="238" y="94" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >A</text><rect x="254" y="70" width="26" height="36" rx="4" fill="#F7EBD2" stroke="#2B2F4A" stroke-width="2" /><text x="267" y="94" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >S</text><rect x="283" y="70" width="26" height="36" rx="4" fill="#F7EBD2" stroke="#2B2F4A" stroke-width="2" /><text x="296" y="94" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >O</text><rect x="312" y="70" width="26" height="36" rx="4" fill="#BFE0F5" stroke="#2B2F4A" stroke-width="2" /><text x="325" y="94" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >N</text><rect x="341" y="70" width="26" height="36" rx="4" fill="#BFE0F5" stroke="#2B2F4A" stroke-width="2" /><text x="354" y="94" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >D</text><text x="200" y="128" font-family="sans-serif" font-size="12" font-weight="700" fill="#0B93D4" text-anchor="middle" >cold months: more hands needed</text><rect x="30" y="150" width="80" height="34" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><text x="70" y="172" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >gas works</text><rect x="120" y="150" width="80" height="34" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><text x="160" y="172" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >breweries</text><rect x="210" y="150" width="80" height="34" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><text x="250" y="172" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >printers</text><rect x="300" y="150" width="80" height="34" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><text x="340" y="172" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >ship repairs</text></svg>