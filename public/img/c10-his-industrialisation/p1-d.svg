<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A handloom with a shuttle</title><style>.spin{animation:spin 3s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinf{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-22px);opacity:0}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.slide{animation:slide 2s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(0)}to{transform:translateX(40px)}}
.grow{animation:grow 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{0%{transform:scaleY(1)}12%{transform:scaleY(.15)}55%{transform:scaleY(1)}100%{transform:scaleY(1)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.walk{animation:walk 4s linear infinite alternate}@keyframes walk{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.sw{animation:sw 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0%}@keyframes sw{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><g transform="translate(100 126) scale(1.5 1.5)"><rect x="-40" y="-60" width="80" height="60" rx="2" fill="none" stroke="#2B2F4A" stroke-width="3" /><path d="M-30 -56 L-30 -34" stroke="#8A8F9E" stroke-width="1.8" stroke-linecap="round" fill="none" /><path d="M-20 -56 L-20 -34" stroke="#8A8F9E" stroke-width="1.8" stroke-linecap="round" fill="none" /><path d="M-10 -56 L-10 -34" stroke="#8A8F9E" stroke-width="1.8" stroke-linecap="round" fill="none" /><path d="M0 -56 L0 -34" stroke="#8A8F9E" stroke-width="1.8" stroke-linecap="round" fill="none" /><path d="M10 -56 L10 -34" stroke="#8A8F9E" stroke-width="1.8" stroke-linecap="round" fill="none" /><path d="M20 -56 L20 -34" stroke="#8A8F9E" stroke-width="1.8" stroke-linecap="round" fill="none" /><path d="M30 -56 L30 -34" stroke="#8A8F9E" stroke-width="1.8" stroke-linecap="round" fill="none" /><rect x="-36" y="-30" width="72" height="10" rx="2" fill="#E9B96E" stroke="#2B2F4A" stroke-width="2" /><rect x="-44" y="-12" width="88" height="12" rx="3" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2.5" /><g class="slide"><rect x="-30" y="-48" width="16" height="6" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.8"/></g></g></svg>