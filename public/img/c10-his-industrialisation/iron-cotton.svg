<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Bar chart of Britain exports in 1873: iron and steel about 77 million pounds, cotton goods a bar half as high marked with a question mark</title><style>.spin{animation:spin 3s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinf{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-22px);opacity:0}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.slide{animation:slide 2s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(0)}to{transform:translateX(40px)}}
.grow{animation:grow 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{0%{transform:scaleY(1)}12%{transform:scaleY(.15)}55%{transform:scaleY(1)}100%{transform:scaleY(1)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.walk{animation:walk 4s linear infinite alternate}@keyframes walk{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.sw{animation:sw 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0%}@keyframes sw{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Britain's exports in 1873 (million pounds)</text><path d="M56 190 L356 190" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" fill="none" /><path d="M56 190 L56 44" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" fill="none" /><path d="M56 190.0 L356 190.0" stroke="#D5D9E0" stroke-width="1.2" stroke-linecap="round" fill="none" /><text x="50" y="194.0" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="end" >0</text><path d="M56 158.88888888888889 L356 158.88888888888889" stroke="#D5D9E0" stroke-width="1.2" stroke-linecap="round" fill="none" /><text x="50" y="162.88888888888889" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="end" >20</text><path d="M56 127.77777777777777 L356 127.77777777777777" stroke="#D5D9E0" stroke-width="1.2" stroke-linecap="round" fill="none" /><text x="50" y="131.77777777777777" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="end" >40</text><path d="M56 96.66666666666667 L356 96.66666666666667" stroke="#D5D9E0" stroke-width="1.2" stroke-linecap="round" fill="none" /><text x="50" y="100.66666666666667" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="end" >60</text><path d="M56 65.55555555555556 L356 65.55555555555556" stroke="#D5D9E0" stroke-width="1.2" stroke-linecap="round" fill="none" /><text x="50" y="69.55555555555556" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="end" >80</text><g class="grow" style="animation-delay:0.0s"><rect x="91.0" y="70.22222222222223" width="80" height="119.77777777777777" rx="4" fill="#7A7F91" stroke="#2B2F4A" stroke-width="2.5" /></g><text x="131.0" y="64.22222222222223" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >about 77</text><text x="131.0" y="206" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Iron and</text><text x="131.0" y="219" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >steel</text><g class="grow" style="animation-delay:0.15s"><rect x="241.0" y="130.11111111111111" width="80" height="59.888888888888886" rx="4" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" /></g><text x="281.0" y="124.11111111111111" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >?</text><text x="281.0" y="206" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Cotton</text><text x="281.0" y="219" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >goods</text></svg>