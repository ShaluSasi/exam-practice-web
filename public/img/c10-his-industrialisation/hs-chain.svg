<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Six pictured stages of making cloth in the proto-industrial system, joined by arrows</title><style>.spin{animation:spin 3s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinf{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-22px);opacity:0}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.slide{animation:slide 2s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(0)}to{transform:translateX(40px)}}
.grow{animation:grow 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{0%{transform:scaleY(1)}12%{transform:scaleY(.15)}55%{transform:scaleY(1)}100%{transform:scaleY(1)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.walk{animation:walk 4s linear infinite alternate}@keyframes walk{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.sw{animation:sw 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0%}@keyframes sw{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M16 0 H384 Q400 0 400 16 V240 H0 V16 Q0 0 16 0Z" fill="#F6EFD9"/><text x="200" y="32" font-family="sans-serif" font-size="15" font-weight="700" fill="#2B2F4A" text-anchor="middle" >One cloth, six stages</text><text x="200" y="52" font-family="sans-serif" font-size="12" font-weight="600" fill="#6B6F86" text-anchor="middle" >follow the arrows</text><circle cx="36" cy="118" r="25" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><path d="M63 118 L73 118" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" fill="none" /><path d="M65.1 122.3 L73 118 L65.1 113.7" stroke="#FF8A1F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="100" cy="118" r="25" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><path d="M127 118 L137 118" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" fill="none" /><path d="M129.1 122.3 L137 118 L129.1 113.7" stroke="#FF8A1F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="164" cy="118" r="25" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><path d="M191 118 L201 118" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" fill="none" /><path d="M193.1 122.3 L201 118 L193.1 113.7" stroke="#FF8A1F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="228" cy="118" r="25" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><path d="M255 118 L265 118" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" fill="none" /><path d="M257.1 122.3 L265 118 L257.1 113.7" stroke="#FF8A1F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="292" cy="118" r="25" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><path d="M319 118 L329 118" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" fill="none" /><path d="M321.1 122.3 L329 118 L321.1 113.7"