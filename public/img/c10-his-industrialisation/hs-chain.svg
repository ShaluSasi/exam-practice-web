oke-width="2" /><rect x="-44" y="-12" width="88" height="12" rx="3" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2.5" /><g class="slide"><rect x="-30" y="-48" width="16" height="6" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.8"/></g></g><path d="M212 108 h32 v8 h-32 v8 h32 v8 h-32" fill="none" stroke="#0B93D4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(292 132) scale(0.85 0.85)"><rect x="-20" y="-26" width="40" height="26" rx="4" fill="#7A7F91" stroke="#2B2F4A" stroke-width="2.5" /><ellipse cx="0" cy="-26" rx="20" ry="6" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5"/></g><rect x="341" y="106" width="30" height="22" rx="2" fill="#D9D3C0" stroke="#2B2F4A" stroke-width="2" /><path d="M338 106 L356 94 L374 106 Z" fill="#B5651D" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="352" y="116" width="8" height="12" rx="1" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="1.5" /><g class="walk"><circle cx="120" cy="175" r="7" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" /></g><text x="200" y="205" font-family="sans-serif" font-size="12" font-weight="600" fill="#6B6F86" text-anchor="middle" >countryside work, then finishing in the city</text></svg>