<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Four round icons: an engine, a worker, a mill and a loom</title><style>.spin{animation:spin 3s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinf{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-22px);opacity:0}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.slide{animation:slide 2s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(0)}to{transform:translateX(40px)}}
.grow{animation:grow 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{0%{transform:scaleY(1)}12%{transform:scaleY(.15)}55%{transform:scaleY(1)}100%{transform:scaleY(1)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.walk{animation:walk 4s linear infinite alternate}@keyframes walk{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.sw{animation:sw 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0%}@keyframes sw{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="24" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Numbers from the chapter</text><circle cx="60" cy="110" r="38" fill="#FFF" stroke="#2B2F4A" stroke-width="2.5" /><rect x="38" y="100" width="44" height="22" rx="8" fill="#9AA0B4" stroke="#2B2F4A" stroke-width="2.5" /><rect x="82" y="108" width="12" height="6" rx="0" fill="#2B2F4A" /><circle cx="150" cy="110" r="38" fill="#FFF" stroke="#2B2F4A" stroke-width="2.5" /><g transform="translate(150 138) scale(0.7 0.7)"><rect x="-8" y="-16" width="6" height="16" rx="2" fill="#4A4E69" /><rect x="2" y="-16" width="6" height="16" rx="2" fill="#4A4E69" /><ellipse cx="-5" cy="0" rx="6" ry="2.5" fill="#2B2F4A"/><ellipse cx="5" cy="0" rx="6" ry="2.5" fill="#2B2F4A"/><path d="M-9 -40 L-13 -24" stroke="#F2B48C" stroke-width="4.5" stroke-linecap="round"/><path d="M9 -40 L13 -24" stroke="#F2B48C" stroke-width="4.5" stroke-linecap="round"/><path d="M-11 -16 L-9 -42 Q0 -46 9 -42 L11 -16 Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><circle cx="0" cy="-54" r="11" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2" /><path d="M-11 -58 Q0 -72 11 -58 Z" fill="#555B6E" stroke="#2B2F4A" stroke-width="2"/><path d="M-11 -58 H15" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/><circle cx="-4" cy="-55" r="1.6" fill="#2B2F4A"/><circle cx="4" cy="-55" r="1.6" fill="#2B2F4A"/><path d="M-3.5 -49 Q0 -46 3.5 -49" fill="none" stroke="#2B2F4A" stroke-width="1.6" stroke-linecap="round"/></g><circle cx="240" cy="110" r="38" fill="#FFF" stroke="#2B2F4A" stroke-width="2.5" /><g transform="translate(238 130) scale(0.4 0.4)"><rect x="-60" y="-60" width="120" height="60" rx="2" fill="#C0694A" stroke="#2B2F4A" stroke-width="2.5" /><path d="M-60 -60 L-40 -78 L-20 -60 L0 -78 L20 -60 L40 -78 L60 -60" fill="#C0694A" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="-51" y="-44" width="14" height="16" rx="2" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2" /><rect x="-21" y="-44" width="14" height="16" rx="2" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2" /><rect x="9" y="-44" width="14" height="16" rx="2" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2" /><rect x="30" y="-26" width="18" height="26" rx="2" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2" /><rect x="36" y="-130" width="12" height="60" rx="1" fill="#A5533C" stroke="#2B2F4A" stroke-width="2.5" /><rect x="34" y="-134" width="16" height="6" rx="0" fill="#2B2F4A" /></g><circle cx="330" cy="110" r="38" fill="#FFF" stroke="#2B2F4A" stroke-width="2.5" /><g transform="translate(330 128) scale(0.6 0.6)"><rect x="-40" y="-60" width="80" height="60" rx="2" fill="none" stroke="#2B2F4A" stroke-width="3" /><path d="M-30 -56 L-30 -34" stroke="#8A8F9E" stroke-width="1.8" stroke-linecap="round" fill="none" /><path d="M-20 -56 L-20 -34" stroke="#8A8F9E" stroke-width="1.8" stroke-linecap="round" fill="none" /><path d="M-10 -56 L-10 -34" stroke="#8A8F9E" stroke-width="1.8" stroke-linecap="round" fill="none" /><path d="M0 -56 L0 -34" stroke="#8A8F9E" stroke-width="1.8" stroke-linecap="round" fill="none" /><path d="M10 -56 L10 -34" stroke="#8A8F9E" stroke-width="1.8" stroke-linecap="round" fill="none" /><path d="M20 -56 L20 -34" stroke="#8A8F9E" stroke-width="1.8" stroke-linecap="round" fill="none" /><path d="M30 -56 L30 -34" stroke="#8A8F9E" stroke-width="1.8" stroke-linecap="round" fill="none" /><rect x="-36" y="-30" width="72" height="10" rx="2" fill="#E9B96E" stroke="#2B2F4A" stroke-width="2" /><rect x="-44" y="-12" width="88" height="12" rx="3" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2.5" /><g class="slide"><rect x="-30" y="-48" width="16" height="6" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.8"/></g></g></svg>