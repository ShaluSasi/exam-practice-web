<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A flow chart: raw cotton from the US stops reaching British mills, so cotton from India is sent instead and its price rises</title><style>.spin{animation:spin 3s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinf{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-22px);opacity:0}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.slide{animation:slide 2s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(0)}to{transform:translateX(40px)}}
.grow{animation:grow 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{0%{transform:scaleY(1)}12%{transform:scaleY(.15)}55%{transform:scaleY(1)}100%{transform:scaleY(1)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.walk{animation:walk 4s linear infinite alternate}@keyframes walk{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.sw{animation:sw 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0%}@keyframes sw{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >When US cotton supplies stopped</text><rect x="14" y="60" width="100" height="50" rx="8" fill="#F7EBD2" stroke="#2B2F4A" stroke-width="2.5" /><text x="64" y="82" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Raw cotton</text><text x="64" y="98" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >from the US</text><rect x="150" y="60" width="100" height="50" rx="8" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5" /><text x="200" y="82" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >British</text><text x="200" y="98" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >mills</text><rect x="286" y="60" width="100" height="50" rx="8" fill="#F7EBD2" stroke="#2B2F4A" stroke-width="2.5" /><text x="336" y="82" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Raw cotton</text><text x="336" y="98" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >from India</text><path d="M116 85 L148 85" stroke="#C9CED6" stroke-width="4" stroke-linecap="round" fill="none" /><path d="M140.1 89.3 L148 85 L140.1 80.7" stroke="#C9CED6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M122 70 L142 100" stroke="#E5484D" stroke-width="5" stroke-linecap="round" fill="none" /><path d="M142 70 L122 100" stroke="#E5484D" stroke-width="5" stroke-linecap="round" fill="none" /><path d="M284 85 L252 85" stroke="#3FA34D" stroke-width="4" stroke-linecap="round" fill="none" class="dash"/><path d="M259.9 80.7 L252 85 L259.9 89.3" stroke="#3FA34D" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="286" y="150" width="100" height="60" rx="8" fill="#FFF" stroke="#2B2F4A" stroke-width="2.5" /><text x="336" y="172" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Price of raw</text><text x="336" y="188" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >cotton in India</text><g class="bob"><path d="M336 150 L336 126" stroke="#E5484D" stroke-width="5" stroke-linecap="round" fill="none" /><path d="M340.3 133.9 L336 126 L331.7 133.9" stroke="#E5484D" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(100 214) scale(0.8 0.8)"><rect x="-8" y="-16" width="6" height="16" rx="2" fill="#4A4E69" /><rect x="2" y="-16" width="6" height="16" rx="2" fill="#4A4E69" /><ellipse cx="-5" cy="0" rx="6" ry="2.5" fill="#2B2F4A"/><ellipse cx="5" cy="0" rx="6" ry="2.5" fill="#2B2F4A"/><path d="M-9 -40 L-13 -24" stroke="#F2B48C" stroke-width="4.5" stroke-linecap="round"/><path d="M9 -40 L13 -24" stroke="#F2B48C" stroke-width="4.5" stroke-linecap="round"/><path d="M-11 -16 L-9 -42 Q0 -46 9 -42 L11 -16 Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><circle cx="0" cy="-54" r="11" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2" /><path d="M-11 -54 Q-12 -68 0 -67 Q12 -68 11 -54 Q6 -61 0 -61 Q-6 -61 -11 -54Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1.5"/><circle cx="-4" cy="-55" r="1.6" fill="#2B2F4A"/><circle cx="4" cy="-55" r="1.6" fill="#2B2F4A"/><path d="M-3.5 -49 Q0 -46 3.5 -49" fill="none" stroke="#2B2F4A" stroke-width="1.6" stroke-linecap="round"/></g><text x="100" y="230" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Indian weavers</text><path d="M282 184 L140 200" stroke="#E5484D" stroke-width="3" stroke-linecap="round" fill="none" /><path d="M147.4 194.8 L140 200 L148.3 203.4" stroke="#E5484D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="212" y="176" font-family="sans-serif" font-size="11" font-weight="700" fill="#E5484D" text-anchor="middle" >weavers pay the higher price</text></svg>