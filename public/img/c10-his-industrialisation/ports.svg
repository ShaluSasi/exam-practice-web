<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Three quays with ships of different sizes</title><style>.spin{animation:spin 3s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinf{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-22px);opacity:0}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.slide{animation:slide 2s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(0)}to{transform:translateX(40px)}}
.grow{animation:grow 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{0%{transform:scaleY(1)}12%{transform:scaleY(.15)}55%{transform:scaleY(1)}100%{transform:scaleY(1)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.walk{animation:walk 4s linear infinite alternate}@keyframes walk{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.sw{animation:sw 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0%}@keyframes sw{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="24" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Old ports and new ports</text><rect x="40" y="150" width="100" height="14" rx="3" fill="#B8B4A2" stroke="#2B2F4A" stroke-width="2.5" /><g transform="translate(90 148) scale(0.4 0.4)"><g class="bob"><path d="M-50 -14 H50 L38 6 H-38 Z" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 -14 L0 -70" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" fill="none" /><path d="M0 -66 L36 -26 H0 Z" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M-4 -60 L-36 -26 H-4 Z" fill="#F1F1F1" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><rect x="150" y="150" width="100" height="14" rx="3" fill="#B8B4A2" stroke="#2B2F4A" stroke-width="2.5" /><g transform="translate(200 148) scale(0.6400000000000001 0.6400000000000001)"><g class="bob"><path d="M-50 -14 H50 L38 6 H-38 Z" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 -14 L0 -70" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" fill="none" /><path d="M0 -66 L36 -26 H0 Z" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M-4 -60 L-36 -26 H-4 Z" fill="#F1F1F1" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><rect x="260" y="150" width="100" height="14" rx="3" fill="#B8B4A2" stroke="#2B2F4A" stroke-width="2.5" /><g transform="translate(310 148) scale(0.8 0.8)"><g class="bob"><path d="M-50 -14 H50 L38 6 H-38 Z" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 -14 L0 -70" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" fill="none" /><path d="M0 -66 L36 -26 H0 Z" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M-4 -60 L-36 -26 H-4 Z" fill="#F1F1F1" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></g></svg>