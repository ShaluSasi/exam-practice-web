<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A ship carrying bales; a note says only raw materials may be exported and no factory cloth may go to Europe</title><style>.spin{animation:spin 3s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinf{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-22px);opacity:0}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.slide{animation:slide 2s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(0)}to{transform:translateX(40px)}}
.grow{animation:grow 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{0%{transform:scaleY(1)}12%{transform:scaleY(.15)}55%{transform:scaleY(1)}100%{transform:scaleY(1)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.walk{animation:walk 4s linear infinite alternate}@keyframes walk{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.sw{animation:sw 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0%}@keyframes sw{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M16 0 H384 Q400 0 400 16 V150 H0 V16 Q0 0 16 0Z" fill="#E3F2FD"/><rect x="0" y="150" width="400" height="90" rx="0" fill="#9FD0F0" /><path d="M0 165 q12 -8 25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0" fill="none" stroke="#7FB9E6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 205 q12 -8 25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0 t25 0" fill="none" stroke="#7FB9E6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(90 184) scale(1.0 1.0)"><g class="bob"><path d="M-50 -14 H50 L38 6 H-38 Z" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 -14 L0 -70" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" fill="none" /><path d="M0 -66 L36 -26 H0 Z" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M-4 -60 L-36 -26 H-4 Z" fill="#F1F1F1" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><rect x="69.0" y="152" width="22" height="16" rx="4" fill="#E8D8A8" stroke="#2B2F4A" stroke-width="2.5" /><path d="M74.5 152 L74.5 168" stroke="#8B5A2B" stroke-width="2.5" stroke-linecap="round" fill="none" /><path d="M85.5 152 L85.5 168" stroke="#8B5A2B" stroke-width="2.5" stroke-linecap="round" fill="none" /><rect x="104" y="160" width="22" height="16" rx="2" fill="#7A7F91" stroke="#2B2F4A" stroke-width="2" /><rect x="220" y="70" width="150" height="90" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><text x="295" y="96" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Exports allowed:</text><text x="295" y="114" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >raw cotton, opium,</text><text x="295" y="130" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >wheat, indigo</text><text x="295" y="150" font-family="sans-serif" font-size="11" font-weight="600" fill="#6B6F86" text-anchor="middle" >(raw materials)</text><rect x="28" y="30" width="120" height="26" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><text x="88" y="48" font-family="sans-serif" font-size="12" font-weight="700" fill="#E5484D" text-anchor="middle" >No factory cloth</text><text x="88" y="70" font-family="sans-serif" font-size="12" font-weight="700" fill="#E5484D" text-anchor="middle" >to Europe</text></svg>