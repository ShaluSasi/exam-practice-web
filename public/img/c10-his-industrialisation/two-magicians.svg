<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Two panels: a turbaned figure with a lamp and a palace above; a mechanic with a spanner and a bridge, towers and buildings below</title><style>.spin{animation:spin 3s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinf{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-22px);opacity:0}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.slide{animation:slide 2s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(0)}to{transform:translateX(40px)}}
.grow{animation:grow 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{0%{transform:scaleY(1)}12%{transform:scaleY(.15)}55%{transform:scaleY(1)}100%{transform:scaleY(1)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.walk{animation:walk 4s linear infinite alternate}@keyframes walk{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.sw{animation:sw 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0%}@keyframes sw{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="12" y="12" width="376" height="104" rx="10" fill="#EAD9F7" stroke="#2B2F4A" stroke-width="2" /><rect x="12" y="124" width="376" height="104" rx="10" fill="#D8EEF8" stroke="#2B2F4A" stroke-width="2" /><rect x="230" y="52" width="100" height="52" rx="2" fill="#F5E1B5" stroke="#2B2F4A" stroke-width="2.5" /><path d="M240 52 Q280 8 320 52Z" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="270" y="74" width="20" height="30" rx="8" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2" /><path d="M92 100 Q100 88 120 92 L140 86 Q146 92 138 98 Q130 108 108 108 Z" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M92 100 Q80 98 80 90" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><g class="bob"><path d="M118 88 Q112 72 124 62 Q136 52 126 38" stroke="#B0A0E0" stroke-width="5" fill="none" stroke-linecap="round"/></g><g transform="translate(50 106) scale(0.9 0.9)"><rect x="-8" y="-16" width="6" height="16" rx="2" fill="#4A4E69" /><rect x="2" y="-16" width="6" height="16" rx="2" fill="#4A4E69" /><ellipse cx="-5" cy="0" rx="6" ry="2.5" fill="#2B2F4A"/><ellipse cx="5" cy="0" rx="6" ry="2.5" fill="#2B2F4A"/><path d="M-9 -40 L-14 -28" stroke="#F2B48C" stroke-width="4.5" stroke-linecap="round"/><path d="M9 -40 L14 -40" stroke="#F2B48C" stroke-width="4.5" stroke-linecap="round"/><path d="M-11 -16 L-9 -42 Q0 -46 9 -42 L11 -16 Z" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><circle cx="0" cy="-54" r="11" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2" /><path d="M-12 -57 Q0 -74 12 -57 Q0 -62 -12 -57Z" fill="#F4F4F4" stroke="#2B2F4A" stroke-width="2"/><circle cx="-4" cy="-55" r="1.6" fill="#2B2F4A"/><circle cx="4" cy="-55" r="1.6" fill="#2B2F4A"/><path d="M-3