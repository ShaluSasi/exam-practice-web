<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A mill with arrows to five circles showing jute bags, uniform cloth, tents, boots and saddles</title><style>.spin{animation:spin 3s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinf{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-22px);opacity:0}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.slide{animation:slide 2s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(0)}to{transform:translateX(40px)}}
.grow{animation:grow 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{0%{transform:scaleY(1)}12%{transform:scaleY(.15)}55%{transform:scaleY(1)}100%{transform:scaleY(1)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.walk{animation:walk 4s linear infinite alternate}@keyframes walk{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.sw{animation:sw 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0%}@keyframes sw{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Orders pour into Indian factories</text><g transform="translate(70 170) scale(0.7 0.7)"><rect x="-60" y="-60" width="120" height="60" rx="2" fill="#C0694A" stroke="#2B2F4A" stroke-width="2.5" /><path d="M-60 -60 L-40 -78 L-20 -60 L0 -78 L20 -60 L40 -78 L60 -60" fill="#C0694A" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="-51" y="-44" width="14" height="16" rx="2" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2" /><rect x="-21" y="-44" width="14" height="16" rx="2" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2" /><rect x="9" y="-44" width="14" height="16" rx="2" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2" /><rect x="30" y="-26" width="18" height="26" rx="2" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2" /><rect x="36" y="-130" width="12" height="60" rx="1" fill="#A5533C" stroke="#2B2F4A" stroke-width="2.5" /><rect x="34" y="-134" width="16" height="6" rx="0" fill="#2B2F4A" /><g class="rise" style="animation-delay:0.0s"><circle cx="42" cy="-138" r="6" fill="#D5D9E0" /></g><g class="rise" style="animation-delay:0.9s"><circle cx="46" cy="-148" r="7" fill="#D5D9E0" /></g><g class="rise" style="animation-delay:1.8s"><circle cx="50" cy="-158" r="8" fill="#D5D9E0" /></g></g><circle cx="160" cy="84" r="30" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><rect x="146" y="66" width="28" height="32" rx="5" fill="#C9A875" stroke="#2B2F4A" stroke-width="2.5" /><path d="M146 74 L174 74" stroke="#8B5A2B" stroke-width="2" stroke-linecap="round" fill="none" /><text x="160" y="130" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Jute bags</text><circle cx="240" cy="84" r="30" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><path d="M224 68 l8 -4 l8 5 l8 -5 l8 4 l-4 12 l-4 -2 v18 h-16 v-18 l-4 2Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="240" y="130" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Uniform cloth</text><circle cx="320" cy="84" r="30" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><path d="M302 98 L320 66 L338 98 Z" fill="#E8D8A8" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><text x="320" y="130" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Tents</text><circle cx="200" cy="160" r="30" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><path d="M186 146 v20 h30 q0 -8 -10 -10 l-8 -4 v-6Z" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><text x="200" y="206" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Boots</text><circle cx="280" cy="160" r="30" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><path d="M262 160 Q280 138 298 160 Q280 168 262 160Z" fill="#7B4A2A" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><text x="280" y="206" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Saddles</text><path d="M110 120 L128 100" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" fill="none" /><path d="M125.9 108.8 L128 100 L119.5 103.0" stroke="#FF8A1F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>