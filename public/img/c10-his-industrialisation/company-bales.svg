"#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 -14 L0 -70" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" fill="none" /><path d="M0 -66 L36 -26 H0 Z" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M-4 -60 L-36 -26 H-4 Z" fill="#F1F1F1" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><rect x="210.0" y="152" width="24" height="16" rx="4" fill="#F4EAD0" stroke="#2B2F4A" stroke-width="2.5" /><path d="M216.0 152 L216.0 168" stroke="#8B5A2B" stroke-width="2.5" stroke-linecap="round" fill="none" /><path d="M228.0 152 L228.0 168" stroke="#8B5A2B" stroke-width="2.5" stroke-linecap="round" fill="none" /><rect x="238.0" y="152" width="24" height="16" rx="4" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" /><path d="M244.0 152 L244.0 168" stroke="#8B5A2B" stroke-width="2.5" stroke-linecap="round" fill="none" /><path d="M256.0 152 L256.0 168" stroke="#8B5A2B" stroke-width="2.5" stroke-linecap="round" fill="none" /><path d="M130 120 L170 150" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" fill="none" class="dash"/><path d="M161.1 148.7 L170 150 L166.3 141.8" stroke="#FF8A1F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="290" y="34" width="100" height="54" rx="10" fill="#FFF" stroke="#2B2F4A" stroke-width="2" /><text x="340.0" y="50.85" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Fine Indian</text><text x="340.0" y="64.85" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle" >cloth sells well</text><text x="340.0" y="78.85" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle" >in Europe</text></svg>