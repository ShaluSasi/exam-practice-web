<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A large hall of machines under one roof</title><style>.spin{animation:spin 3s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinf{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-22px);opacity:0}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.slide{animation:slide 2s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(0)}to{transform:translateX(40px)}}
.grow{animation:grow 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{0%{transform:scaleY(1)}12%{transform:scaleY(.15)}55%{transform:scaleY(1)}100%{transform:scaleY(1)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.walk{animation:walk 4s linear infinite alternate}@keyframes walk{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.sw{animation:sw 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0%}@keyframes sw{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="14" y="40" width="172" height="84" rx="6" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="3" /><rect x="24" y="92" width="32" height="24" rx="3" fill="#7A7F91" stroke="#2B2F4A" stroke-width="2" /><g transform="translate(40 66)"><g class="spin"><circle cx="0" cy="0" r="8" fill="#E8C58A" stroke="#2B2F4A" stroke-width="3" /><path d="M0 0 L5.0 0.0" stroke="#2B2F4A" stroke-width="2"/><path d="M0 0 L2.5 4.3" stroke="#2B2F4A" stroke-width="2"/><path d="M0 0 L-2.5 4.3" stroke="#2B2F4A" stroke-width="2"/><path d="M0 0 L-5.0 0.0" stroke="#2B2F4A" stroke-width="2"/><path d="M0 0 L-2.5 -4.3" stroke="#2B2F4A" stroke-width="2"/><path d="M0 0 L2.5 -4.3" stroke="#2B2F4A" stroke-width="2"/><circle cx="0" cy="0" r="4" fill="#2B2F4A" /></g></g><rect x="64" y="92" width="32" height="24" rx="3" fill="#7A7F91" stroke="#2B2F4A" stroke-width="2" /><g transform="translate(80 66)"><g class="spin"><circle cx="0" cy="0" r="8" fill="#E8C58A" stroke="#2B2F4A" stroke-width="3" /><path d="M0 0 L5.0 0.0" stroke="#2B2F4A" stroke-width="2"/><path d="M0 0 L2.5 4.3" stroke="#2B2F4A" stroke-width="2"/><path d="M0 0 L-2.5 4.3" stroke="#2B2F4A" stroke-width="2"/><path d="M0 0 L-5.0 0.0" stroke="#2B2F4A" stroke-width="2"/><path d="M0 0 L-2.5 -4.3" stroke="#2B2F4A" stroke-width="2"/><path d="M0 0 L2.5 -4.3" stroke="#2B2F4A" stroke-width="2"/><circle cx="0" cy="0" r="4" fill="#2B2F4A" /></g></g><rect x="104" y="92" width="32" height="24" rx="3" fill="#7A7F91" stroke="#2B2F4A" stroke-width="2" /><g transform="translate(120 66)"><g class="spin"><circle cx="0" cy="0" r="8" fill="#E8C58A" stroke="#2B2F4A" stroke-width="3" /><path d="M0 0 L5.0 0.0" stroke="#2B2F4A" stroke-width="2"/><path d="M0 0 L2.5 4.3" stroke="#2B2F4A" stroke-width="2"/><path d="M0 0 L-2.5 4.3" stroke="#2B2F4A" stroke-width="2"/><path d="M0 0 L-5.0 0.0" stroke="#2B2F4A" stroke-width="2"/><path d="M0 0 L-2.5 -4.3" stroke="#2B2F4A" stroke-width="2"/><path d="M0 0 L2.5 -4.3" stroke="#2B2F4A" stroke-width="2"/><circle cx="0" cy="0" r="4" fill="#2B2F4A" /></g></g><rect x="144" y="92" width="32" height="24" rx="3" fill="#7A7F91" stroke="#2B2F4A" stroke-width="2" /><g transform="translate(160 66)"><g class="spin"><circle cx="0" cy="0" r="8" fill="#E8C58A" stroke="#2B2F4A" stroke-width="3" /><path d="M0 0 L5.0 0.0" stroke="#2B2F4A" stroke-width="2"/><path d="M0 0 L2.5 4.3" stroke="#2B2F4A" stroke-width="2"/><path d="M0 0 L-2.5 4.3" stroke="#2B2F4A" stroke-width="2"/><path d="M0 0 L-5.0 0.0" stroke="#2B2F4A" stroke-width="2"/><path d="M0 0 L-2.5 -4.3" stroke="#2B2F4A" stroke-width="2"/><path d="M0 0 L2.5 -4.3" stroke="#2B2F4A" stroke-width="2"/><circle cx="0" cy="0" r="4" fill="#2B2F4A" /></g></g><path d="M20 66 L180 66" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" fill="none" /></svg>