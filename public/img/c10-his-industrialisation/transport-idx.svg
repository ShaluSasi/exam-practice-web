<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Bar chart of transport workers: 100 at the start of the 1840s, 200 at the end of the decade, and a question mark in place of the value thirty years later</title><style>.spin{animation:spin 3s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinf{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-22px);opacity:0}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.slide{animation:slide 2s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(0)}to{transform:translateX(40px)}}
.grow{animation:grow 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{0%{transform:scaleY(1)}12%{transform:scaleY(.15)}55%{transform:scaleY(1)}100%{transform:scaleY(1)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.walk{animation:walk 4s linear infinite alternate}@keyframes walk{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.sw{animation:sw 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0%}@keyframes sw{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Workers in the transport industry (start of 1840s = 100)</text><path d="M56 190 L356 190" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" fill="none" /><path d="M56 190 L56 44" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" fill="none" /><path d="M56 190.0 L356 190.0" stroke="#D5D9E0" stroke-width="1.2" stroke-linecap="round" fill="none" /><text x="50" y="194.0" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="end" >0</text><path d="M56 156.66666666666666 L356 156.66666666666666" stroke="#D5D9E0" stroke-width="1.2" stroke-linecap="round" fill="none" /><text x="50" y="160.66666666666666" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="end" >100</text><path d="M56 123.33333333333333 L356 123.33333333333333" stroke="#D5D9E0" stroke-width="1.2" stroke-linecap="round" fill="none" /><text x="50" y="127.33333333333333" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="end" >200</text><g class="grow" style="animation-delay:0.0s"><rect x="76.0" y="156.66666666666666" width="60" height="33.333333333333336" rx="4" fill="#C9CED6" stroke="#2B2F4A" stroke-width="2.5" /></g><text x="106.0" y="150.66666666666666" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >100</text><text x="106.0" y="206" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >start of</text><text x="106.0" y="219" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >1840s</text><g class="grow" style="animation-delay:0.15s"><rect x="176.0" y="123.33333333333333" width="60" height="66.66666666666667" rx="4" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" /></g><text x="206.0" y="117.33333333333333" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >200</text><text x="206.0" y="206" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >end of</text><text x="206.0" y="219" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >1840s</text><g class="pulse"><circle cx="306" cy="140" r="26" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-dasharray="6 5"/></g><text x="306" y="148" font-family="sans-serif" font-weight="700" fill="#2B2F4A" text-anchor="middle" font-size="24">?</text><text x="306.0" y="206" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >30 years</text><text x="306.0" y="219" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >later</text><path d="M130 100 L190 100" stroke="#E5484D" stroke-width="3" stroke-linecap="round" fill="none" /><path d="M182.1 104.3 L190 100 L182.1 95.7" stroke="#E5484D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="160" y="92" font-family="sans-serif" font-size="11" font-weight="700" fill="#E5484D" text-anchor="middle" >doubled</text><path d="M225 86 L266 86" stroke="#E5484D" stroke-width="3" stroke-linecap="round" fill="none" /><path d="M258.1 90.3 L266 86 L258.1 81.7" stroke="#E5484D" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="246" y="66" font-family="sans-serif" font-size="11" font-weight="700" fill="#E5484D" text-anchor="middle" >doubled</text><text x="246" y="78" font-family="sans-serif" font-size="11" font-weight="700" fill="#E5484D" text-anchor="middle" >again</text></svg>