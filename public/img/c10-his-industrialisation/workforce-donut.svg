<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A ring chart: less than 20 percent of workers in advanced industries, the rest elsewhere</title><style>.spin{animation:spin 3s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinf{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-22px);opacity:0}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.slide{animation:slide 2s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(0)}to{transform:translateX(40px)}}
.grow{animation:grow 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{0%{transform:scaleY(1)}12%{transform:scaleY(.15)}55%{transform:scaleY(1)}100%{transform:scaleY(1)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.walk{animation:walk 4s linear infinite alternate}@keyframes walk{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.sw{animation:sw 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0%}@keyframes sw{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Britain: workforce at the end of the 1800s</text><path d="M130.00 70.00 A60 60 0 0 1 187.06 111.46" fill="none" stroke="#FF8A1F" stroke-width="28"/><path d="M187.06 111.46 A60 60 0 1 1 130.00 70.00" fill="none" stroke="#BFC5D6" stroke-width="28"/><circle cx="130" cy="130" r="74.0" fill="none" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="130" cy="130" r="46.0" fill="none" stroke="#2B2F4A" stroke-width="2.5" /><text x="130" y="126" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >less than</text><text x="130" y="142" font-family="sans-serif" font-size="16" font-weight="700" fill="#2B2F4A" text-anchor="middle" >20%</text><rect x="230" y="90" width="16" height="16" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" /><text x="254" y="103" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="start" >Advanced industries</text><text x="254" y="119" font-family="sans-serif" font-size="11" font-weight="600" fill="#6B6F86" text-anchor="start" >(machines, steam power)</text><rect x="230" y="142" width="16" height="16" rx="3" fill="#BFC5D6" stroke="#2B2F4A" stroke-width="2" /><text x="254" y="155" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="start" >All the rest</text><text x="254" y="171" font-family="sans-serif" font-size="11" font-weight="600" fill="#6B6F86" text-anchor="start" >(craft, domestic, other)</text></svg>