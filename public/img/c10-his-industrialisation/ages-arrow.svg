<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A long arrow with five dots, standing for events in time order</title><style>.spin{animation:spin 3s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinf{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-22px);opacity:0}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.slide{animation:slide 2s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(0)}to{transform:translateX(40px)}}
.grow{animation:grow 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{0%{transform:scaleY(1)}12%{transform:scaleY(.15)}55%{transform:scaleY(1)}100%{transform:scaleY(1)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.walk{animation:walk 4s linear infinite alternate}@keyframes walk{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.sw{animation:sw 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0%}@keyframes sw{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="24" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Time moves this way</text><path d="M24 120 L380 120" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" fill="none" /><path d="M372.1 124.3 L380 120 L372.1 115.7" stroke="#2B2F4A" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="56" cy="120" r="9" fill="#C9CED6" stroke="#2B2F4A" stroke-width="2.5" /><text x="56" y="152" font-family="sans-serif" font-size="11" font-weight="600" fill="#6B6F86" text-anchor="middle" >event 1</text><circle cx="124" cy="120" r="9" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" /><text x="124" y="152" font-family="sans-serif" font-size="11" font-weight="600" fill="#6B6F86" text-anchor="middle" >event 2</text><circle cx="192" cy="120" r="9" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" /><text x="192" y="152" font-family="sans-serif" font-size="11" font-weight="600" fill="#6B6F86" text-anchor="middle" >event 3</text><circle cx="260" cy="120" r="9" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" /><text x="260" y="152" font-family="sans-serif" font-size="11" font-weight="600" fill="#6B6F86" text-anchor="middle" >event 4</text><circle cx="328" cy="120" r="9" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.5" /><text x="328" y="152" font-family="sans-serif" font-size="11" font-weight="600" fill="#6B6F86" text-anchor="middle" >event 5</text></svg>