<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Flow chart: Indian mills make coarse yarn that goes to handloom weavers and to China, not fine cloth to rival Manchester</title><style>.spin{animation:spin 3s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinf{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-22px);opacity:0}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.slide{animation:slide 2s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(0)}to{transform:translateX(40px)}}
.grow{animation:grow 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{0%{transform:scaleY(1)}12%{transform:scaleY(.15)}55%{transform:scaleY(1)}100%{transform:scaleY(1)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.walk{animation:walk 4s linear infinite alternate}@keyframes walk{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.sw{animation:sw 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0%}@keyframes sw{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >What the early Indian mills made</text><g transform="translate(60 150) scale(0.7 0.7)"><rect x="-60" y="-60" width="120" height="60" rx="2" fill="#C0694A" stroke="#2B2F4A" stroke-width="2.5" /><path d="M-60 -60 L-40 -78 L-20 -60 L0 -78 L20 -60 L40 -78 L60 -60" fill="#C0694A" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="-51" y="-44" width="14" height="16" rx="2" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2" /><rect x="-21" y="-44" width="14" height="16" rx="2" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2" /><rect x="9" y="-44" width="14" height="16" rx="2" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2" /><rect x="30" y="-26" width="18" height="26" rx="2" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2" /><rect x="36" y="-130" width="12" height="60" rx="1" fill="#A5533C" stroke="#2B2F4A" stroke-width="2.5" /><rect x="34" y="-134" width="16" height="6" rx="0" fill="#2B2F4A" /><g class="rise" style="animation-delay:0.0s"><circle cx="42" cy="-138" r="6" fill="#D5D9E0" /></g><g class="rise" style="animation-delay:0.9s"><circle cx="46" cy="-148" r="7" fill="#D5D9E0" /></g><g class="rise" style="animation-delay:1.8s"><circle cx="50" cy="-158" r="8" fill="#D5D9E0" /></g></g><text x="60" y="172" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Indian mill</text><rect x="125" y="70" width="100" height="40" rx="8" fill="#F7EBD2" stroke="#2B2F4A" stroke-width="2.5" /><text x="175" y="95" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Coarse yarn</text><path d="M112 100 L124 95" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" fill="none" /><path d="M118.4 102.0 L124 95 L115.0 94.1" stroke="#FF8A1F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M226 86 L262 66" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" fill="none" /><path d="M257.2 73.6 L262 66 L253.0 66.1" stroke="#FF8A1F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M226 98 L262 128" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" fill="none" /><path d="M253.2 126.3 L262 128 L258.7 119.6" stroke="#FF8A1F" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(310 100) scale(0.7 0.7)"><rect x="-40" y="-60" width="80" height="60" rx="2" fill="none" stroke="#2B2F4A" stroke-width="3" /><path d="M-30 -56 L-30 -34" stroke="#8A8F9E" stroke-width="1.8" stroke-linecap="round" fill="none" /><path d="M-20 -56 L-20 -34" stroke="#8A8F9E" stroke-width="1.8" stroke-linecap="round" fill="none" /><path d="M-10 -56 L-10 -34" stroke="#8A8F9E" stroke-width="1.8" stroke-linecap="round" fill="none" /><path d="M0 -56 L0 -34" stroke="#8A8F9E" stroke-width="1.8" stroke-linecap="round" fill="none" /><path d="M10 -56 L10 -34" stroke="#8A8F9E" stroke-width="1.8" stroke-linecap="round" fill="none" /><path d="M20 -56 L20 -34" stroke="#8A8F9E" stroke-width="1.8" stroke-linecap="round" fill="none" /><path d="M30 -56 L30 -34" stroke="#8A8F9E" stroke-width="1.8" stroke-linecap="round" fill="none" /><rect x="-36" y="-30" width="72" height="10" rx="2" fill="#E9B96E" stroke="#2B2F4A" stroke-width="2" /><rect x="-44" y="-12" width="88" height="12" rx="3" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2.5" /><g class="slide"><rect x="-30" y="-48" width="16" height="6" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.8"/></g></g><text x="310" y="112" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Indian handloom weavers</text><g transform="translate(325 170) scale(0.5 0.5)"><g class="bob"><path d="M-50 -14 H50 L38 6 H-38 Z" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 -14 L0 -70" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" fill="none" /><path d="M0 -66 L36 -26 H0 Z" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M-4 -60 L-36 -26 H-4 Z" fill="#F1F1F1" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></g><text x="325" y="184" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >export to China</text><rect x="110" y="150" width="140" height="40" rx="8" fill="#EFEFEF" stroke="#2B2F4A" stroke-width="2" stroke-dasharray="6 4"/><text x="180" y="168" font-family="sans-serif" font-size="11" font-weight="600" fill="#6B6F86" text-anchor="middle" >Fine cloth to rival</text><text x="180" y="183" font-family="sans-serif" font-size="11" font-weight="600" fill="#6B6F86" text-anchor="middle" >Manchester: avoided</text></svg>