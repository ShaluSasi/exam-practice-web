<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Two baskets of loaves: six loaves before a price rise and three after, with the same wage coin between them</title><style>.spin{animation:spin 3s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinf{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-22px);opacity:0}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.slide{animation:slide 2s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(0)}to{transform:translateX(40px)}}
.grow{animation:grow 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{0%{transform:scaleY(1)}12%{transform:scaleY(.15)}55%{transform:scaleY(1)}100%{transform:scaleY(1)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.walk{animation:walk 4s linear infinite alternate}@keyframes walk{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.sw{animation:sw 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0%}@keyframes sw{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >The same wage buys less when prices rise</text><path d="M55 120 L65 175 H135 L145 120 Z" fill="#E9B96E" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M55 120 Q100 70 145 120" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="70" cy="108" r="12" fill="#F4D08A" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="100" cy="108" r="12" fill="#F4D08A" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="130" cy="108" r="12" fill="#F4D08A" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="70" cy="84" r="12" fill="#F4D08A" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="100" cy="84" r="12" fill="#F4D08A" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="130" cy="84" r="12" fill="#F4D08A" stroke="#2B2F4A" stroke-width="2.5" /><text x="100" y="198" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Before prices rise</text><path d="M255 120 L265 175 H335 L345 120 Z" fill="#E9B96E" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M255 120 Q300 70 345 120" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="270" cy="108" r="12" fill="#F4D08A" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="300" cy="108" r="12" fill="#F4D08A" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="330" cy="108" r="12" fill="#F4D08A" stroke="#2B2F4A" stroke-width="2.5" /><text x="300" y="198" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >After prices rise</text><circle cx="200" cy="120" r="16" fill="#FFD23F" stroke="#B8860B" stroke-width="2" /><text x="200" y="125.6" font-family="sans-serif" font-size="14.4" font-weight="700" fill="#8A6500" text-anchor="middle" >W</text><text x="200" y="152" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >same wage</text><path d="M176 120 L150 120" stroke="#B8860B" stroke-width="3" stroke-linecap="round" fill="none" /><path d="M157.9 115.7 L150 120 L157.9 124.3" stroke="#B8860B" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M224 120 L250 120" stroke="#B8860B" stroke-width="3" stroke-linecap="round" fill="none" /><path d="M242.1 124.3 L250 120 L242.1 115.7" stroke="#B8860B" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>