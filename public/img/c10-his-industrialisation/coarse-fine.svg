<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Two line graphs: demand for coarse cloth jumps up and down; demand for fine cloth is a steady line</title><style>.spin{animation:spin 3s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinf{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-22px);opacity:0}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.slide{animation:slide 2s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(0)}to{transform:translateX(40px)}}
.grow{animation:grow 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{0%{transform:scaleY(1)}12%{transform:scaleY(.15)}55%{transform:scaleY(1)}100%{transform:scaleY(1)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.walk{animation:walk 4s linear infinite alternate}@keyframes walk{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.sw{animation:sw 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0%}@keyframes sw{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="10" y="10" width="186" height="220" rx="12" fill="#FFF" stroke="#2B2F4A" stroke-width="2.5" /><rect x="204" y="10" width="186" height="220" rx="12" fill="#FFF" stroke="#2B2F4A" stroke-width="2.5" /><text x="103" y="34" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Coarse cloth</text><text x="297" y="34" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Fine cloth</text><text x="103" y="50" font-family="sans-serif" font-size="11" font-weight="600" fill="#6B6F86" text-anchor="middle" >bought by the poor</text><text x="297" y="50" font-family="sans-serif" font-size="11" font-weight="600" fill="#6B6F86" text-anchor="middle" >bought by the well-to-do</text><path d="M30 190 L180 190" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" fill="none" /><path d="M30 190 L30 70" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" fill="none" /><path d="M224 190 L374 190" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" fill="none" /><path d="M224 190 L224 70" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" fill="none" /><path d="M30 130 L55 100 L80 170 L105 90 L130 175 L155 110 L180 140" fill="none" stroke="#E5484D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M224 120 L374 116" fill="none" stroke="#3FA34D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="103" y="214" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle" >demand swings sharply</text><text x="297" y="214" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle" >demand stays steady</text></svg>