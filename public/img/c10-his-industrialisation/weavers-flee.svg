<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A weaver leaves a village home with a bundle and walks toward another village, leaving a loom behind</title><style>.spin{animation:spin 3s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinf{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-22px);opacity:0}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.slide{animation:slide 2s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(0)}to{transform:translateX(40px)}}
.grow{animation:grow 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{0%{transform:scaleY(1)}12%{transform:scaleY(.15)}55%{transform:scaleY(1)}100%{transform:scaleY(1)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.walk{animation:walk 4s linear infinite alternate}@keyframes walk{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.sw{animation:sw 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0%}@keyframes sw{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M16 0 H384 Q400 0 400 16 V160 H0 V16 Q0 0 16 0Z" fill="#E3F2FD"/><path d="M0 160 H400 V224 Q400 240 384 240 H16 Q0 240 0 224 Z" fill="#C9E6A8"/><g transform="translate(60 170) scale(1.0 1.0)"><rect x="-24" y="-30" width="48" height="30" rx="2" fill="#E8C58A" stroke="#2B2F4A" stroke-width="2.5" /><path d="M-30 -30 L0 -56 L30 -30 Z" fill="#B5651D" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="-6" y="-18" width="12" height="18" rx="2" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2" /></g><path d="M110 150 L200 150" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round" fill="none" class="dash"/><path d="M192.1 154.3 L200 150 L192.1 145.7" stroke="#FF8A1F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(130 208) scale(0.95 0.95)"><rect x="-8" y="-16" width="6" height="16" rx="2" fill="#4A4E69" /><rect x="2" y="-16" width="6" height="16" rx="2" fill="#4A4E69" /><ellipse cx="-5" cy="0" rx="6" ry="2.5" fill="#2B2F4A"/><ellipse cx="5" cy="0" rx="6" ry="2.5" fill="#2B2F4A"/><path d="M-9 -40 L-14 -26" stroke="#F2B48C" stroke-width="4.5" stroke-linecap="round"/><path d="M9 -40 L16 -36" stroke="#F2B48C" stroke-width="4.5" stroke-linecap="round"/><path d="M-11 -16 L-9 -42 Q0 -46 9 -42 L11 -16 Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><circle cx="0" cy="-54" r="11" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2" /><path d="M-11 -54 Q-12 -68 0 -67 Q12 -68 11 -54 Q6 -61 0 -61 Q-6 -61 -11 -54Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1.5"/><circle cx="-4" cy="-55" r="1.6" fill="#2B2F4A"/><circle cx="4" cy="-55" r="1.6" fill="#2B2F4A"/><path d="M-3.5 -49 Q0 -46 3.5 -49" fill="none" stroke="#2B2F4A" stroke-width="1.6" stroke-linecap="round"/><rect x="14" y="-52" width="18" height="16" rx="3" fill="#E8C