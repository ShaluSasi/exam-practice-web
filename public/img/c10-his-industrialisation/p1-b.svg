<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A frame of many spindles driven by one wheel</title><style>.spin{animation:spin 3s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinf{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-22px);opacity:0}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.slide{animation:slide 2s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(0)}to{transform:translateX(40px)}}
.grow{animation:grow 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{0%{transform:scaleY(1)}12%{transform:scaleY(.15)}55%{transform:scaleY(1)}100%{transform:scaleY(1)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.walk{animation:walk 4s linear infinite alternate}@keyframes walk{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.sw{animation:sw 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0%}@keyframes sw{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="14" y="112" width="130" height="10" rx="3" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2.5" /><path d="M26.0 112 L26.0 76" stroke="#8A8F9E" stroke-width="3" stroke-linecap="round" fill="none" /><circle cx="26.0" cy="74" r="3" fill="#8A8F9E" stroke="#2B2F4A" stroke-width="1.5" /><path d="M40.85714285714286 112 L40.85714285714286 76" stroke="#8A8F9E" stroke-width="3" stroke-linecap="round" fill="none" /><circle cx="40.85714285714286" cy="74" r="3" fill="#8A8F9E" stroke="#2B2F4A" stroke-width="1.5" /><path d="M55.714285714285715 112 L55.714285714285715 76" stroke="#8A8F9E" stroke-width="3" stroke-linecap="round" fill="none" /><circle cx="55.714285714285715" cy="74" r="3" fill="#8A8F9E" stroke="#2B2F4A" stroke-width="1.5" /><path d="M70.57142857142857 112 L70.57142857142857 76" stroke="#8A8F9E" stroke-width="3" stroke-linecap="round" fill="none" /><circle cx="70.57142857142857" cy="74" r="3" fill="#8A8F9E" stroke="#2B2F4A" stroke-width="1.5" /><path d="M85.42857142857143 112 L85.42857142857143 76" stroke="#8A8F9E" stroke-width="3" stroke-linecap="round" fill="none" /><circle cx="85.42857142857143" cy="74" r="3" fill="#8A8F9E" stroke="#2B2F4A" stroke-width="1.5" /><path d="M100.28571428571429 112 L100.28571428571429 76" stroke="#8A8F9E" stroke-width="3" stroke-linecap="round" fill="none" /><circle cx="100.28571428571429" cy="74" r="3" fill="#8A8F9E" stroke="#2B2F4A" stroke-width="1.5" /><path d="M115.14285714285714 112 L115.14285714285714 76" stroke="#8A8F9E" stroke-width="3" stroke-linecap="round" fill="none" /><circle cx="115.14285714285714" cy="74" r="3" fill="#8A8F9E" stroke="#2B2F4A" stroke-width="1.5" /><path d="M130.0 112 L130.0 76" stroke="#8A8F9E" stroke-width="3" stroke-linecap="round" fill="none" /><circle cx="130.0" cy="74" r="3" fill="#8A8F9E" stroke="#2B2F4A" stroke-width="1.5" /><g transform="translate(166 92)"><g 