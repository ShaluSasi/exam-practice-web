<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A single stacked bar of 321 steam engines split into cotton 80, wool 9 and a remaining part marked with a question mark</title><style>.spin{animation:spin 3s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinf{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:.9}to{transform:translateY(-22px);opacity:0}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.slide{animation:slide 2s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(0)}to{transform:translateX(40px)}}
.grow{animation:grow 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{0%{transform:scaleY(1)}12%{transform:scaleY(.15)}55%{transform:scaleY(1)}100%{transform:scaleY(1)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.walk{animation:walk 4s linear infinite alternate}@keyframes walk{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
.sw{animation:sw 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0%}@keyframes sw{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Steam engines in England, early 1800s</text><path d="M70 205 L340 205" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" fill="none" /><g class="grow"><rect x="120" y="162.63239875389408" width="90" height="42.36760124610591" rx="2" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" /></g><g class="grow"><rect x="120" y="157.86604361370718" width="90" height="4.766355140186915" rx="2" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" /></g><g class="grow"><rect x="120" y="35.00000000000003" width="90" height="122.86604361370715" rx="2" fill="#E9E3D2" stroke="#2B2F4A" stroke-width="2.5" /></g><text x="165.0" y="223" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Total: 321</text><text x="235" y="187.81619937694705" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="start" >Cotton industries: 80</text><text x="235" y="164.2492211838006" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="start" >Wool industries: 9</text><text x="165.0" y="101.43302180685359" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >? (mining, canal</text><text x="165.0" y="115.43302180685359" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >and iron works)</text></svg>