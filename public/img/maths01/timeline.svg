<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" role="img">
<title>A timeline arrow from earlier to later with five empty slots</title>
<style>
text{font-family:system-ui, sans-serif;font-weight:600;fill:#2B2F4A}.h{stroke:#FFF9EE;stroke-width:3px;paint-order:stroke}
.s{animation:pop 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.s0{animation-delay:0s}.s1{animation-delay:0.4s}.s2{animation-delay:0.8s}.s3{animation-delay:1.2000000000000002s}.s4{animation-delay:1.6s}@keyframes pop{0%,30%,100%{transform:scale(1)}15%{transform:scale(1.2)}}.sun{animation:sun 6s ease-in-out infinite}@keyframes sun{0%,100%{transform:translateX(-170px)}50%{transform:translateX(170px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M40 120H440" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round"/><path d="M452 120l-16 -10v20z" fill="#2B2F4A"/><g class="s s0"><circle cx="70" cy="120" r="20" fill="#FFF" stroke="#0B93D4" stroke-width="3" stroke-dasharray="5 4"/><text x="70" y="126" font-size="16" text-anchor="middle" style="fill:#0B93D4">?</text></g><rect x="48" y="152" width="44" height="30" rx="5" fill="#F7E7C4" stroke="#B9935A" stroke-width="2"/><path d="M56 162h28M56 172h18" stroke="#9C7A4A" stroke-width="2.5" stroke-linecap="round"/><g class="s s1"><circle cx="155" cy="120" r="20" fill="#FFF" stroke="#0B93D4" stroke-width="3" stroke-dasharray="5 4"/><text x="155" y="126" font-size="16" text-anchor="middle" style="fill:#0B93D4">?</text></g><rect x="133" y="152" width="44" height="30" rx="5" fill="#F7E7C4" stroke="#B9935A" stroke-width="2"/><path d="M141 162h28M141 172h18" stroke="#9C7A4A" stroke-width="2.5" stroke-linecap="round"/><g class="s s2"><circle cx="240" cy="120" r="20" fill="#FFF" stroke="#0B93D4" stroke-width="3" stroke-dasharray="5 4"/><text x="240" y="126" font-size="16" text-anchor="middle" style="fill:#0B93D4">?</text></g><rect x="218" y="152" width="44" height="30" rx="5" fill="#F7E7C4" stroke="#B9935A" stroke-width="2"/><path d="M226 162h28M226 172h18" stroke="#9C7A4A" stroke-width="2.5" stroke-linecap="round"/><g class="s s3"><circle cx="325" cy="120" r="20" fill="#FFF" stroke="#0B93D4" stroke-width="3" stroke-dasharray="5 4"/><text x="325" y="126" font-size="16" text-anchor="middle" style="fill:#0B93D4">?</text></g><rect x="303" y="152" width="44" height="30" rx="5" fill="#F7E7C4" stroke="#B9935A" stroke-width="2"/><path d="M311 162h28M311 172h18" stroke="#9C7A4A" stroke-width="2.5" stroke-linecap="round"/><g class="s s4"><circle cx="410" cy="120" r="20" fill="#FFF" stroke="#0B93D4" stroke-width="3" stroke-dasharray="5 4"/><text x="410" y="126" font-size="16" text-anchor="middle" style="fill:#0B93D4">?</text></g><rect x="388" y="152" width="44" height="30" rx="5" fill="#F7E7C4" stroke="#B9935A" stroke-width="2"/><path d="M396 162h28M396 172h18" stroke="#9C7A4A" stroke-width="2.5" stroke-linecap="round"/><text class="h" x="40" y="80" font-size="14">earlier</text><text class="h" x="440" y="80" font-size="14" text-anchor="end">later</text><g class="sun"><circle cx="240" cy="50" r="16" fill="#F6C453" stroke="#FF8A1F" stroke-width="3"/></g>
</svg>
