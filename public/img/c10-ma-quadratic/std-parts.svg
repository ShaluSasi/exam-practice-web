<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>The standard form a x squared plus b x plus c equals zero with the letters coloured</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="14" y="20" width="372" height="150" rx="12" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><text x="62" y="112" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#FF8A1F" text-anchor="middle">a</text><text x="98" y="112" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#2B2F4A" text-anchor="middle">x²</text><text x="150" y="112" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#2B2F4A" text-anchor="middle">+</text><text x="192" y="112" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#0B93D4" text-anchor="middle">b</text><text x="224" y="112" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#2B2F4A" text-anchor="middle">x</text><text x="262" y="112" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#2B2F4A" text-anchor="middle">+</text><text x="300" y="112" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#3FA34D" text-anchor="middle">c</text><text x="350" y="112" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#2B2F4A" text-anchor="middle">= 0</text><text x="200" y="148" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#5B6180" text-anchor="middle">standard form of a quadratic equation</text><text x="200" y="208" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#2B2F4A" text-anchor="middle">Three letters, one condition on a</text>
</svg>
