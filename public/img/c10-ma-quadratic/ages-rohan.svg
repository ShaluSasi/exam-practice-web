<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Bars showing Rohan and his mother now and three years later</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="22" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle">Rohan and his mother</text><text x="14" y="62" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="start">Now</text><rect x="100" y="52" width="36.4" height="22" rx="6" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5"/><text x="144.4" y="68" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#FF8A1F" text-anchor="start">Rohan x</text><rect x="100" y="82" width="171.6" height="22" rx="6" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5"/><text x="106" y="98" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#FFFFFF" text-anchor="start">Mother  x + 26</text><text x="14" y="152" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="start">3 years later</text><rect x="100" y="142" width="52" height="22" rx="6" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5"/><text x="160" y="158" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#FF8A1F" text-anchor="start">Rohan x + 3</text><rect x="100" y="172" width="187.2" height="22" rx="6" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5"/><text x="106" y="188" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#FFFFFF" text-anchor="start">Mother  x + 29</text><rect x="136.4" y="142" width="15.6" height="22" rx="6" fill="#FFD08A" stroke="#2B2F4A" stroke-width="2.5" class="bl"/><rect x="271.6" y="172" width="15.6" height="22" rx="6" fill="#9ED7F2" stroke="#2B2F4A" stroke-width="2.5" class="bl"/><text x="200" y="224" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle">Everyone is 3 years older; the gap between them stays the same</text>
</svg>
