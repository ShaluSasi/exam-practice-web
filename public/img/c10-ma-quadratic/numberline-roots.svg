e="#2B2F4A" stroke-width="2" stroke-linecap="round"/><text x="272" y="126" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="middle">2</text><line x1="308" y1="94" x2="308" y2="106" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><text x="308" y="126" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="middle">3</text><line x1="344" y1="94" x2="344" y2="106" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><text x="344" y="126" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="middle">4</text><line x1="380" y1="94" x2="380" y2="106" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><text x="380" y="126" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="middle">5</text><circle cx="20" cy="100" r="8" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.5" class="pu"/><circle cx="92" cy="100" r="8" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" class="pu"/><circle cx="236" cy="100" r="8" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" class="pu"/><circle cx="272" cy="100" r="8" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" class="pu"/><circle cx="308" cy="100" r="8" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" class="pu"/><text x="200" y="40" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle">Roots of four equations on one number line</text><text x="200" y="176" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#5B6180" text-anchor="middle">Each coloured dot is a root of one of the equations</text>
</svg>
