<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A rectangular plot with breadth x and length x plus 7</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="70" y="50" width="260" height="100" rx="4" fill="#FFE8C2" stroke="#2B2F4A" stroke-width="4"/><text x="200" y="108" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#2B2F4A" text-anchor="middle">area 120 m²</text><text x="200" y="170" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#0B93D4" text-anchor="middle">(x + 7) m</text><text x="60" y="105" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#FF8A1F" text-anchor="end">x m</text><text x="200" y="214" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#2B2F4A" text-anchor="middle">A rectangular plot: length is 7 m more than breadth</text>
</svg>
