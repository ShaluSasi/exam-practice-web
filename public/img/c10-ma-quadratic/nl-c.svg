<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img">
<title>A number line from minus 6 to 6 with two marked points</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<polyline points="12,75 190,75" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polygon points="190,75 181.9,78.9 181.9,71.1" fill="#2B2F4A"/><polygon points="12,75 18.3,72 18.3,78" fill="#2B2F4A"/><polygon points="190,75 183.7,78 183.7,72" fill="#2B2F4A"/><line x1="12" y1="71" x2="12" y2="79" stroke="#2B2F4A" stroke-width="1.5" stroke-linecap="round"/><text x="12" y="98" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle">−6</text><line x1="26.7" y1="71" x2="26.7" y2="79" stroke="#2B2F4A" stroke-width="1.5" stroke-linecap="round"/><line x1="41.3" y1="71" x2="41.3" y2="79" stroke="#2B2F4A" stroke-width="1.5" stroke-linecap="round"/><text x="41.3" y="98" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle">−4</text><line x1="56" y1="71" x2="56" y2="79" stroke="#2B2F4A" stroke-width="1.5" stroke-linecap="round"/><line x1="70.7" y1="71" x2="70.7" y2="79" stroke="#2B2F4A" stroke-width="1.5" stroke-linecap="round"/><text x="70.7" y="98" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle">−2</text><line x1="85.3" y1="71" x2="85.3" y2="79" stroke="#2B2F4A" stroke-width="1.5" stroke-linecap="round"/><line x1="100" y1="71" x2="100" y2="79" stroke="#2B2F4A" stroke-width="1.5" stroke-linecap="round"/><text x="100" y="98" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle">0</text><line x1="114.7" y1="71" x2="114.7" y2="79" stroke="#2B2F4A" stroke-width="1.5" stroke-linecap="round"/><line x1="129.3" y1="71" x2="129.3" y2="79" stroke="#2B2F4A" stroke-width="1.5" stroke-linecap="round"/><text x="129.3" y="98" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle">2</text><line x1="144" y1="71" x2="144" y2="79" stroke="#2B2F4A" stroke-width="1.5" stroke-linecap="round"/><line x1="158.7" y1="71" x2="158.7" y2="79" stroke="#2B2F4A" stroke-width="1.5" stroke-linecap="round"/><text x="158.7" y="98" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle">4</text><line x1="173.3" y1="71" x2="173.3" y2="79" stroke="#2B2F4A" stroke-width="1.5" stroke-linecap="round"/><line x1="188" y1="71" x2="188" y2="79" stroke="#2B2F4A" stroke-width="1.5" stroke-linecap="round"/><text x="188" y="98" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle">6</text><circle cx="56" cy="75" r="7" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="41.3" cy="75" r="7" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5"/><text x="100" y="130" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#5B6180" text-anchor="middle">roots marked</text>
