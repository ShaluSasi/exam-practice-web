<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A machine turning an input x into the value p of x; if the output is zero, x is a root</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="120" y="60" width="160" height="90" rx="14" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3"/><text x="200" y="98" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#2B2F4A" text-anchor="middle">p(x) = x² + bx + c</text><text x="200" y="128" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#5B6180" text-anchor="middle">the machine</text><polyline points="30,105 116,105" fill="none" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polygon points="116,105 107.9,108.9 107.9,101.1" fill="#FF8A1F"/><polyline points="284,105 370,105" fill="none" stroke="#0B93D4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polygon points="370,105 361.9,108.9 361.9,101.1" fill="#0B93D4"/><text x="60" y="90" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FF8A1F" text-anchor="middle">input x</text><text x="332" y="90" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0B93D4" text-anchor="middle">output p(x)</text><rect x="100" y="176" width="200" height="36" rx="10" fill="#E8F7EA" stroke="#3FA34D" stroke-width="2.5"/><text x="200" y="199" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#3FA34D" text-anchor="middle">output 0  ⇒  x is a root</text>
</svg>
