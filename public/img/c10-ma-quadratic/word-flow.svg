<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Four boxes: word problem, equation, roots, answer in words</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle">From a story to an answer</text><rect x="14" y="70" width="86" height="64" rx="10" fill="#CFE9F8" stroke="#2B2F4A" stroke-width="3"/><text x="57" y="98" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">Word</text><text x="57" y="116" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">problem</text><polyline points="102,102 112,102" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="112,102 103.9,105.9 103.9,98.1" fill="#2B2F4A"/><rect x="112" y="70" width="86" height="64" rx="10" fill="#FFE3B8" stroke="#2B2F4A" stroke-width="3"/><text x="155" y="98" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">Equation</text><text x="155" y="116" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">in x</text><polyline points="200,102 210,102" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="210,102 201.9,105.9 201.9,98.1" fill="#2B2F4A"/><rect x="210" y="70" width="86" height="64" rx="10" fill="#D9F2DC" stroke="#2B2F4A" stroke-width="3"/><text x="253" y="98" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">Roots</text><polyline points="298,102 308,102" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="308,102 299.9,105.9 299.9,98.1" fill="#2B2F4A"/><rect x="308" y="70" width="86" height="64" rx="10" fill="#E6DEFF" stroke="#2B2F4A" stroke-width="3"/><text x="351" y="98" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">Answer</text><text x="351" y="116" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">in words</text><text x="200" y="176" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#5B6180" text-anchor="middle">Check every root against the story</text><text x="200" y="204" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#2B2F4A" text-anchor="middle">A length can never be negative</text>
</svg>
