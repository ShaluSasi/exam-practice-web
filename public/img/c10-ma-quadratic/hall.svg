<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Rectangular prayer hall with its breadth marked x metres</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFFFFF"/>
<rect x="50" y="46" width="300" height="144" rx="4" fill="#FFE8C2" stroke="#2B2F4A" stroke-width="4"/><line x1="54" y1="58" x2="346" y2="58" stroke="#F3CF93" stroke-width="1.2" stroke-linecap="round"/><line x1="54" y1="70" x2="346" y2="70" stroke="#F3CF93" stroke-width="1.2" stroke-linecap="round"/><line x1="54" y1="82" x2="346" y2="82" stroke="#F3CF93" stroke-width="1.2" stroke-linecap="round"/><line x1="54" y1="94" x2="346" y2="94" stroke="#F3CF93" stroke-width="1.2" stroke-linecap="round"/><line x1="54" y1="106" x2="346" y2="106" stroke="#F3CF93" stroke-width="1.2" stroke-linecap="round"/><line x1="54" y1="118" x2="346" y2="118" stroke="#F3CF93" stroke-width="1.2" stroke-linecap="round"/><line x1="54" y1="130" x2="346" y2="130" stroke="#F3CF93" stroke-width="1.2" stroke-linecap="round"/><line x1="54" y1="142" x2="346" y2="142" stroke="#F3CF93" stroke-width="1.2" stroke-linecap="round"/><line x1="54" y1="154" x2="346" y2="154" stroke="#F3CF93" stroke-width="1.2" stroke-linecap="round"/><line x1="54" y1="166" x2="346" y2="166" stroke="#F3CF93" stroke-width="1.2" stroke-linecap="round"/><line x1="54" y1="178" x2="346" y2="178" stroke="#F3CF93" stroke-width="1.2" stroke-linecap="round"/><rect x="346" y="120" width="8" height="34" rx="2" fill="#8A5A2B" stroke="#2B2F4A" stroke-width="2"/><text x="28" y="123" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#FF8A1F" text-anchor="middle">x m</text><g class="pu"><text x="200" y="128" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#2B2F4A" text-anchor="middle">300 m²</text></g><text x="200" y="214" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#2B2F4A" text-anchor="middle">Floor plan of the prayer hall (carpet area 300 m²)</text><text x="200" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#5B6180" text-anchor="middle">Length is one metre more than twice the breadth</text>
</svg>
