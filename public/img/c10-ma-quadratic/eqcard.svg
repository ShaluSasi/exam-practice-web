<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>An equation card showing 2x squared plus x minus 300 equals 0</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="14" y="16" width="372" height="208" rx="16" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3"/><text x="200" y="52" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#2B2F4A" text-anchor="middle">Prayer hall: area = 300 m²</text><text x="75" y="130" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#2B2F4A" text-anchor="middle">2x²</text><text x="165" y="130" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#2B2F4A" text-anchor="middle">+ x</text><text x="265" y="130" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#2B2F4A" text-anchor="middle">− 300</text><text x="345" y="130" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="#0B93D4" text-anchor="middle">= 0</text><line x1="40" y1="160" x2="360" y2="160" stroke="#E1E6F2" stroke-width="2" stroke-linecap="round"/><text x="200" y="196" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#5B6180" text-anchor="middle">Written with the highest power first</text>
</svg>
