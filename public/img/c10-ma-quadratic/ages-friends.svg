<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Two bars adding to 30 years and the same bars three years earlier</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle">Two friends, ages add up to 30</text><rect x="40" y="44" width="160" height="30" rx="8" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3"/><text x="120" y="65" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">x</text><rect x="200" y="44" width="160" height="30" rx="8" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3"/><text x="280" y="65" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">30 − x</text><text x="200" y="96" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#5B6180" text-anchor="middle" class="bl">↓  3 years ago  ↓</text><rect x="40" y="108" width="142" height="30" rx="8" fill="#FFD08A" stroke="#2B2F4A" stroke-width="3"/><text x="111" y="129" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#2B2F4A" text-anchor="middle">x − 3</text><rect x="200" y="108" width="142" height="30" rx="8" fill="#9ED7F2" stroke="#2B2F4A" stroke-width="3"/><text x="290" y="129" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#2B2F4A" text-anchor="middle">27 − x</text><rect x="60" y="160" width="280" height="48" rx="12" fill="#FFF3D6" stroke="#FF8A1F" stroke-width="2"/><text x="200" y="190" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">(x − 3)(27 − x) = 143 (3 years ago)</text><text x="200" y="226" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#5B6180" text-anchor="middle">Each friend loses the same 3 years</text>
</svg>
