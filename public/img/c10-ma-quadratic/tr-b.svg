<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img">
<title>A right triangle with legs 11 cm and 4 cm drawn to scale</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<polygon points="50,118 160,118 50,78" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><polyline points="59,118 59,109 50,109" fill="none" stroke="#E5484D" stroke-width="2"/><text x="105" y="138" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#FF8A1F" text-anchor="middle">11 cm</text><text x="44" y="102" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0B93D4" text-anchor="end">4 cm</text>
</svg>
