<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Six cards naming mathematicians and cultures that studied quadratic equations</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="22" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle">How quadratic equations travelled</text><rect x="14" y="40" width="118" height="80" rx="10" fill="#FFE3B8" stroke="#2B2F4A" stroke-width="3"/><circle cx="30" cy="58" r="8" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1"/><text x="30" y="62" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="76" y="84" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#2B2F4A" text-anchor="middle">Babylonians</text><text x="73" y="104" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#5B6180" text-anchor="middle">sum and product</text><rect x="140" y="40" width="118" height="80" rx="10" fill="#CFE9F8" stroke="#2B2F4A" stroke-width="3"/><circle cx="156" cy="58" r="8" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1"/><text x="156" y="62" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="202" y="84" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#2B2F4A" text-anchor="middle">Euclid</text><text x="199" y="104" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#5B6180" text-anchor="middle">geometry</text><rect x="266" y="40" width="118" height="80" rx="10" fill="#D9F2DC" stroke="#2B2F4A" stroke-width="3"/><circle cx="282" cy="58" r="8" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1"/><text x="282" y="62" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><text x="328" y="84" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#2B2F4A" text-anchor="middle">Brahmagupta</text><text x="325" y="104" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#5B6180" text-anchor="middle">explicit formula</text><rect x="14" y="132" width="118" height="80" rx="10" fill="#E6DEFF" stroke="#2B2F4A" stroke-width="3"/><circle cx="30" cy="150" r="8" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1"/><text x="30" y="154" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><text x="76" y="176" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#2B2F4A" text-anchor="middle">Al-Khwarizmi</text><text x="73" y="196" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#5B6180" text-anchor="middle">types of equations</text><rect x="140" y="132" width="118" height="80" rx="10" fill="#FFD7D9" stroke="#2B2F4A" stroke-width="3"/><circle cx="156" cy="150" r="8" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1"/><text x="156" y="154" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><text x="202" y="176" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#2B2F4A" text-anchor="middle">Sridharacharya</text><text x="199" y="196" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#5B6180" text-anchor="middle">the formula</text><rect x="266" y="132" width="118" height="80" rx="10" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="3"/><circle cx="282" cy="150" r="8" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1"/><text x="282" y="154" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">6</text><text x="328" y="176" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#2B2F4A" text-anchor="middle">Abraham bar Hiyya</text><text x="325" y="196" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#5B6180" text-anchor="middle">Liber embadorum</text><text x="200" y="232" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#5B6180" text-anchor="middle">Shown in no particular order of importance</text>
</svg>
