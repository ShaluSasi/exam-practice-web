<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>The polynomial x squared minus 6x plus 9 written as two identical factors</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="30" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#2B2F4A" text-anchor="middle">x² − 6x + 9</text><rect x="40" y="70" width="130" height="56" rx="10" fill="#CFE9F8" stroke="#2B2F4A" stroke-width="3"/><text x="105" y="106" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#2B2F4A" text-anchor="middle">(x − 3)</text><text x="200" y="108" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#2B2F4A" text-anchor="middle">×</text><rect x="230" y="70" width="130" height="56" rx="10" fill="#CFE9F8" stroke="#2B2F4A" stroke-width="3"/><text x="295" y="106" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#2B2F4A" text-anchor="middle">(x − 3)</text><text x="200" y="168" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#5B6180" text-anchor="middle">Two identical factors</text><text x="200" y="204" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#0B93D4" text-anchor="middle">= 0</text>
</svg>
