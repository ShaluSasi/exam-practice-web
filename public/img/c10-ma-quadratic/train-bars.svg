<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Two bars showing journey times at two speeds; the slower bar is longer</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}.g1,.g2,.g3{transform-box:fill-box;transform-origin:left;animation:gr 4s ease-out infinite}.g3{animation-delay:.4s}@keyframes gr{0%{transform:scaleX(.05)}40%,100%{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFFFFF"/>
<text x="200" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle">Same 480 km journey, two speeds</text><rect x="40" y="56" width="240" height="40" rx="8" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" class="g1"/><text x="160" y="82" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">at x km/h</text><rect x="40" y="126" width="240" height="40" rx="8" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" class="g2"/><rect x="280" y="126" width="60" height="40" rx="8" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" class="g3"/><text x="160" y="152" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">at (x − 8) km/h</text><line x1="40" y1="190" x2="340" y2="190" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/><line x1="40" y1="186" x2="40" y2="194" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><text x="40" y="208" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#2B2F4A" text-anchor="middle">0</text><line x1="100" y1="186" x2="100" y2="194" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><text x="100" y="208" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#2B2F4A" text-anchor="middle">3</text><line x1="160" y1="186" x2="160" y2="194" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><text x="160" y="208" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#2B2F4A" text-anchor="middle">6</text><line x1="220" y1="186" x2="220" y2="194" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><text x="220" y="208" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#2B2F4A" text-anchor="middle">9</text><line x1="280" y1="186" x2="280" y2="194" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><text x="280" y="208" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#2B2F4A" text-anchor="middle">12</text><line x1="340" y1="186" x2="340" y2="194" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><text x="340" y="208" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#2B2F4A" text-anchor="middle">15</text><text x="200" y="226" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#2B2F4A" text-anchor="middle">time taken (hours)</text>
</svg>
