<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Four small pictures: two neighbouring numbers, a rectangular plot, two numbers, a right triangle</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="14" y="14" width="182" height="104" rx="12" fill="#CFE9F8" stroke="#2B2F4A" stroke-width="3"/><rect x="204" y="14" width="182" height="104" rx="12" fill="#FFE3B8" stroke="#2B2F4A" stroke-width="3"/><rect x="14" y="124" width="182" height="104" rx="12" fill="#D9F2DC" stroke="#2B2F4A" stroke-width="3"/><rect x="204" y="124" width="182" height="104" rx="12" fill="#E6DEFF" stroke="#2B2F4A" stroke-width="3"/><rect x="40" y="44" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5"/><text x="60" y="72" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#2B2F4A" text-anchor="middle">n</text><rect x="100" y="44" width="40" height="40" rx="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5"/><text x="120" y="72" font-family="system-ui, sans-serif" font-size="17" font-weight="800" fill="#2B2F4A" text-anchor="middle">n+1</text><text x="105" y="106" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">two neighbours</text><rect x="232" y="38" width="120" height="48" rx="3" fill="#FFE8C2" stroke="#2B2F4A" stroke-width="3"/><text x="292" y="66" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#2B2F4A" text-anchor="middle">area</text><text x="292" y="106" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">a plot</text><circle cx="52" cy="160" r="20" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5"/><text x="52" y="166" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#2B2F4A" text-anchor="middle">x</text><circle cx="110" cy="160" r="20" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5"/><text x="110" y="166" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#2B2F4A" text-anchor="middle">y</text><text x="105" y="214" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">two numbers</text><polygon points="236,194 330,194 236,144" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><text x="292" y="214" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">a triangle</text><polyline points="244,194 244,186 236,186" fill="none" stroke="#E5484D" stroke-width="2"/>
</svg>
