<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A balance with an x squared block on each pan</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle">x(x + 3) + 5   and   (x + 1)(x − 1)</text><path d="M200 70 L200 170" fill="none" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="40" y1="80" x2="360" y2="80" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round"/><polygon points="180,190 220,190 200,168" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><line x1="30" y1="80" x2="30" y2="96" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><line x1="170" y1="80" x2="170" y2="96" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><path d="M20 96 Q100 140 180 96" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="106" width="54" height="54" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" class="bl"/><text x="67" y="122" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">x²</text><rect x="102" y="106" width="26" height="26" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2"/><text x="115" y="122" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">3x</text><rect x="136" y="100" width="12" height="22" rx="3" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2"/><text x="142" y="118" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><line x1="230" y1="80" x2="230" y2="96" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><line x1="370" y1="80" x2="370" y2="96" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><path d="M220 96 Q300 140 380 96" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="240" y="106" width="54" height="54" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" class="bl"/><text x="267" y="122" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">x²</text><rect x="302" y="100" width="12" height="22" rx="3" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2"/><text x="308" y="118" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle">−1</text><text x="200" y="216" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#2B2F4A" text-anchor="middle">The x² blocks are on both sides and cancel</text>
</svg>
