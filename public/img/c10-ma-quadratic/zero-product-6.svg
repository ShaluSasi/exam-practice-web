<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Two factor boxes multiplied together giving 6</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle">Product of two factors is 6</text><rect x="30" y="70" width="110" height="56" rx="10" fill="#CFE9F8" stroke="#2B2F4A" stroke-width="3"/><text x="85" y="106" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#2B2F4A" text-anchor="middle">(x − 2)</text><text x="165" y="108" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#2B2F4A" text-anchor="middle">×</text><rect x="190" y="70" width="110" height="56" rx="10" fill="#FFE3B8" stroke="#2B2F4A" stroke-width="3"/><text x="245" y="106" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#2B2F4A" text-anchor="middle">(x − 3)</text><text x="325" y="108" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#2B2F4A" text-anchor="start">= 6</text><text x="200" y="170" font-family="system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#5B6180" text-anchor="middle">Think about which numbers multiply to 6</text>
</svg>
