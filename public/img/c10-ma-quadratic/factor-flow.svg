<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>From the equation to two factors to two roots</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle">Solving by factorisation</text><rect x="100" y="44" width="200" height="40" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3"/><text x="200" y="71" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#2B2F4A" text-anchor="middle">2x² + 7x + 3 = 0</text><polyline points="200,86 200,102" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="200,102 196.1,93.9 203.9,93.9" fill="#2B2F4A"/><rect x="100" y="104" width="200" height="40" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3"/><text x="200" y="131" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#2B2F4A" text-anchor="middle">( ? )( ? ) = 0</text><polyline points="200,146 200,162" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="200,162 196.1,153.9 203.9,153.9" fill="#2B2F4A"/><rect x="100" y="164" width="200" height="40" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3"/><text x="200" y="191" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#2B2F4A" text-anchor="middle">x = ?   or   x = ?</text>
</svg>
