<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A right-angled triangle with the right angle at the bottom-left corner</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<polygon points="80,172 320,172 80,72" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="3.5" stroke-linejoin="round"/><g class="pu"><polyline points="94,172 94,158 80,158" fill="none" stroke="#E5484D" stroke-width="2"/></g><text x="200" y="194" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#FF8A1F" text-anchor="middle">x cm</text><text x="68" y="126" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#0B93D4" text-anchor="end">(x − 7) cm</text><text x="200" y="228" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#2B2F4A" text-anchor="middle">A right-angled triangle</text>
</svg>
