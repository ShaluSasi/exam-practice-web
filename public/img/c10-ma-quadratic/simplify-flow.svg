<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Four boxes: expand, collect on one side, combine like terms, check the highest power</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle">Is it quadratic? Simplify first</text><rect x="14" y="70" width="86" height="70" rx="10" fill="#CFE9F8" stroke="#2B2F4A" stroke-width="3"/><text x="57" y="100" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#2B2F4A" text-anchor="middle">Expand</text><text x="57" y="118" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#2B2F4A" text-anchor="middle">brackets</text><polyline points="102,105 112,105" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="112,105 103.9,108.9 103.9,101.1" fill="#2B2F4A"/><rect x="112" y="70" width="86" height="70" rx="10" fill="#FFE3B8" stroke="#2B2F4A" stroke-width="3"/><text x="155" y="100" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#2B2F4A" text-anchor="middle">Collect on</text><text x="155" y="118" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#2B2F4A" text-anchor="middle">one side</text><polyline points="200,105 210,105" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="210,105 201.9,108.9 201.9,101.1" fill="#2B2F4A"/><rect x="210" y="70" width="86" height="70" rx="10" fill="#D9F2DC" stroke="#2B2F4A" stroke-width="3"/><text x="253" y="100" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#2B2F4A" text-anchor="middle">Combine</text><text x="253" y="118" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#2B2F4A" text-anchor="middle">like terms</text><polyline points="298,105 308,105" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><polygon points="308,105 299.9,108.9 299.9,101.1" fill="#2B2F4A"/><rect x="308" y="70" width="86" height="70" rx="10" fill="#E6DEFF" stroke="#2B2F4A" stroke-width="3"/><text x="351" y="100" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#2B2F4A" text-anchor="middle">Highest</text><text x="351" y="118" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#2B2F4A" text-anchor="middle">power of x?</text><text x="200" y="186" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#5B6180" text-anchor="middle">x² + 3x + 5  =  x² − 1</text><text x="200" y="214" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#2B2F4A" text-anchor="middle">Cancelling terms can change the degree</text>
</svg>
