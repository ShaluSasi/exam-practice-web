<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>The quadratic formula x equals minus b plus or minus the square root of an expression, all over 2a</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="14" y="20" width="372" height="168" rx="12" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><rect x="14" y="20" width="372" height="168" rx="14" fill="none" stroke="#2B2F4A" stroke-width="3"/><text x="52" y="120" font-family="system-ui, sans-serif" font-size="28" font-weight="700" fill="#2B2F4A" text-anchor="middle">x =</text><text x="150" y="92" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#2B2F4A" text-anchor="middle">−b ±</text><polyline points="200,90.5 205,89 210,108 214,74 334,74" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="274" y="96" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#2B2F4A" text-anchor="middle">b² − 4ac</text><line x1="100" y1="112" x2="340" y2="112" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><text x="220" y="150" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#2B2F4A" text-anchor="middle">2a</text><text x="200" y="214" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#2B2F4A" text-anchor="middle">The quadratic formula (a ≠ 0)</text>
</svg>
