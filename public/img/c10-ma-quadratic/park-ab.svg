<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A circular park with gates A and B at the ends of a diameter and a pole P on the boundary</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="200" cy="124" r="100" fill="#DDF2DF" stroke="#3FA34D" stroke-width="4"/><rect x="93" y="113" width="14" height="22" rx="3" fill="#FFD7A8" stroke="#2B2F4A" stroke-width="2.5"/><text x="76" y="129" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#2B2F4A" text-anchor="middle">A</text><rect x="293" y="113" width="14" height="22" rx="3" fill="#FFD7A8" stroke="#2B2F4A" stroke-width="2.5"/><text x="324" y="129" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#2B2F4A" text-anchor="middle">B</text><line x1="100" y1="124" x2="300" y2="124" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round"/><line x1="100" y1="124" x2="228" y2="28" stroke="#7C5CFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 5" class="fl"/><line x1="228" y1="28" x2="300" y2="124" stroke="#7C5CFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 5" class="fl"/><line x1="228" y1="28" x2="228" y2="8" stroke="#8A5A2B" stroke-width="3" stroke-linecap="round"/><polygon points="228,8 242,13 228,18" fill="#E5484D"/><circle cx="228" cy="28" r="5" fill="#2B2F4A"/><text x="212" y="24" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#2B2F4A" text-anchor="middle">P</text><circle cx="200" cy="124" r="3.5" fill="#2B2F4A"/><g class="pu"><polyline points="219.2,34.6 225.8,43.4 234.6,36.8" fill="none" stroke="#E5484D" stroke-width="2"/></g><text x="200" y="236" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#2B2F4A" text-anchor="middle">Circular park with gates A and B at the ends of a diameter</text>
</svg>
