<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A two by two area model with 3x squared and 8 in opposite corners and two unknown middle cells</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle">Splitting the middle term of 3x² + 14x + 8</text><rect x="70" y="44" width="98" height="56" rx="6" fill="#CFE9F8" stroke="#2B2F4A" stroke-width="3"/><text x="119" y="80" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#2B2F4A" text-anchor="middle">3x²</text><rect x="170" y="44" width="98" height="56" rx="6" fill="#FFE3B8" stroke="#2B2F4A" stroke-width="3"/><text x="219" y="80" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#2B2F4A" text-anchor="middle" class="bl">? x</text><rect x="70" y="104" width="98" height="56" rx="6" fill="#FFE3B8" stroke="#2B2F4A" stroke-width="3"/><text x="119" y="140" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#2B2F4A" text-anchor="middle" class="bl">? x</text><rect x="170" y="104" width="98" height="56" rx="6" fill="#CFE9F8" stroke="#2B2F4A" stroke-width="3"/><text x="219" y="140" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#2B2F4A" text-anchor="middle">8</text><text x="200" y="188" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle">? x + ? x = 14x     and     ? × ? = 3 × 8</text><text x="200" y="214" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#5B6180" text-anchor="middle">The two middle cells must make the whole middle term</text>
</svg>
