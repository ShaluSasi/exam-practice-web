<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A bar of total 27 split into two parts that slide</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}@keyframes lf{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.76)}}.lf{transform-box:fill-box;transform-origin:left;animation:lf 4s ease-in-out infinite}@keyframes lt{0%,100%{transform:translateX(0)}50%{transform:translateX(-16px)}}.lt{animation:lt 4s ease-in-out infinite}@keyframes rt{0%,100%{transform:translateX(0)}50%{transform:translateX(-16px)}}.rt{animation:rt 4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle">Two numbers with sum 27</text><rect x="65" y="60" width="270" height="44" rx="6" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3"/><g class="lf"><rect x="65" y="60" width="135.0" height="44" rx="6" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3"/></g><g class="lt"><text x="132.5" y="89" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">x</text></g><g class="rt"><text x="267.5" y="89" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" text-anchor="middle">27 − x</text></g><line x1="65" y1="124" x2="335" y2="124" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/><line x1="65" y1="118" x2="65" y2="130" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/><line x1="335" y1="118" x2="335" y2="130" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/><text x="200" y="146" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">total 27</text><rect x="90" y="164" width="220" height="44" rx="12" fill="#FFF3D6" stroke="#FF8A1F" stroke-width="2"/><text x="200" y="192" font-family="system-ui, sans-serif" font-size="17" font-weight="800" fill="#2B2F4A" text-anchor="middle">x (27 − x) = 182</text>
</svg>
