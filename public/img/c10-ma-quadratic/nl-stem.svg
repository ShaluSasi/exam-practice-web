<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>The equation x squared minus x minus 12 equals 0 above an empty number line</title>
<style>.fl{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.pu{animation:pu 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.12)}}.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="100" y="24" width="200" height="64" rx="12" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><text x="200" y="66" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#2B2F4A" text-anchor="middle">x² − x − 12 = 0</text><polyline points="30,130 372,130" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polygon points="372,130 363.9,133.9 363.9,126.1" fill="#2B2F4A"/><polygon points="30,130 36.3,127 36.3,133" fill="#2B2F4A"/><line x1="30" y1="124" x2="30" y2="136" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><text x="30" y="154" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle">−6</text><line x1="86.7" y1="124" x2="86.7" y2="136" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><text x="86.7" y="154" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle">−4</text><line x1="143.3" y1="124" x2="143.3" y2="136" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><text x="143.3" y="154" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle">−2</text><line x1="200" y1="124" x2="200" y2="136" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><text x="200" y="154" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle">0</text><line x1="256.7" y1="124" x2="256.7" y2="136" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><text x="256.7" y="154" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle">2</text><line x1="313.3" y1="124" x2="313.3" y2="136" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><text x="313.3" y="154" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle">4</text><line x1="370" y1="124" x2="370" y2="136" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><text x="370" y="154" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle">6</text><text x="200" y="196" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">Where do the roots sit on the number line?</text>
</svg>
