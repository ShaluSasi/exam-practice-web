<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A daydreaming girl with a thought bubble holding a mermaid tail, footprints and a tower</title><style>
.bob{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-4px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(5deg)}}
.flick{animation:flick 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{50%{transform:scale(1.15,.88);opacity:.85}}
.wig{animation:wig .5s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes wig{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.pop{animation:pop 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1.08);opacity:1}}
.rise{animation:rise 3.5s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-26px);opacity:0}}
.swim{animation:swim 5s ease-in-out infinite alternate}
@keyframes swim{to{transform:translateX(16px)}}
.write{animation:write 2s ease-in-out infinite}
@keyframes write{50%{transform:translate(10px,3px)}}
.spin{animation:spin 8s linear infinite;transform-box:view-box}
@keyframes spin{to{transform:rotate(360deg)}}
.ripple{animation:ripple 3s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ripple{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.5);opacity:0}}
.nod{animation:nod 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes nod{50%{transform:rotate(-6deg)}}
.drop{animation:drop 2s ease-in infinite}
@keyframes drop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="200" width="400" height="40" fill="#F3E3C3"/><line x1="0" y1="200" x2="400" y2="200" stroke="#D9C49A" stroke-width="2" stroke-linecap="round" /><g transform="translate(80,200) scale(1.3)" ><path d="M-8 0 L-8 18 M8 0 L8 18" fill="none" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="-13" y="-34" width="26" height="36" rx="9" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3"/><line x1="-13" y1="-26" x2="-22" y2="-12" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="13" y1="-26" x2="22" y2="-12" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><circle cx="0" cy="-48" r="14" fill="#FFD9B3" stroke="#2B2F4A" stroke-width="3" /><path d="M-14 -50 Q-12 -64 0 -63 Q12 -64 14 -50 Q6 -56 -14 -50 Z" fill="#4A3B2A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M-8 -49 Q-5 -46 -2 -49" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M2 -49 Q5 -46 8 -49" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M-4 -42 Q0 -39 4 -42" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><circle cx="125" cy="118" r="5" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><circle cx="145" cy="98" r="8" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><ellipse cx="270" cy="85" rx="115" ry="66" fill="#fff" stroke="#2B2F4A" stroke-width="3.5"/><g transform="translate(205,60)" class="bob" ><path d="M0 0 Q-14 18 0 28 Q14 18 0 0 Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5"/><path d="M0 28 L-12 40 M0 28 L12 40" stroke="#2B2F4A" stroke-width="3"/></g><g transform="translate(262,68)" class="pulse" ><ellipse cx="0" cy="0" rx="6" ry="10" fill="#C9A06A"/><ellipse cx="18" cy="14" rx="6" ry="10" fill="#C9A06A"/></g><rect x="318" y="78" width="22" height="40" rx="2" fill="#C9C2D9" stroke="#2B2F4A" stroke-width="2.5" /><path d="M313 80 L329 56 L345 80 Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/></svg>