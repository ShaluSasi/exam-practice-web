<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A pond with a mother duck, a swan, three ducklings, reeds and a lily pad</title><style>
.bob{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-4px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(5deg)}}
.flick{animation:flick 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{50%{transform:scale(1.15,.88);opacity:.85}}
.wig{animation:wig .5s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes wig{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.pop{animation:pop 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1.08);opacity:1}}
.rise{animation:rise 3.5s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-26px);opacity:0}}
.swim{animation:swim 5s ease-in-out infinite alternate}
@keyframes swim{to{transform:translateX(16px)}}
.write{animation:write 2s ease-in-out infinite}
@keyframes write{50%{transform:translate(10px,3px)}}
.spin{animation:spin 8s linear infinite;transform-box:view-box}
@keyframes spin{to{transform:rotate(360deg)}}
.ripple{animation:ripple 3s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ripple{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.5);opacity:0}}
.nod{animation:nod 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes nod{50%{transform:rotate(-6deg)}}
.drop{animation:drop 2s ease-in infinite}
@keyframes drop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="240" rx="0" fill="#E3F2FD" stroke="none" stroke-width="0" /><ellipse cx="200" cy="170" rx="195" ry="70" fill="#8FD3F4" stroke="#0B93D4" stroke-width="3"/><ellipse class="ripple" cx="120" cy="196" rx="26" ry="7" fill="none" stroke="#fff" stroke-width="2.5" style="animation-delay:0s"/><ellipse class="ripple" cx="260" cy="196" rx="26" ry="7" fill="none" stroke="#fff" stroke-width="2.5" style="animation-delay:1.2s"/><ellipse class="ripple" cx="330" cy="196" rx="26" ry="7" fill="none" stroke="#fff" stroke-width="2.5" style="animation-delay:2.2s"/><path d="M22 168 Q26 110 20 70" fill="none" stroke="#3FA34D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="sway"/><ellipse cx="20" cy="68" rx="4" ry="12" fill="#B9763C" stroke="#2B2F4A" stroke-width="2"/><path d="M38 168 Q42 110 36 70" fill="none" stroke="#3FA34D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="sway"/><ellipse cx="36" cy="68" rx="4" ry="12" fill="#B9763C" stroke="#2B2F4A" stroke-width="2"/><path d="M54 168 Q58 110 52 70" fill="none" stroke="#3FA34D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="sway"/><ellipse cx="52" cy="68" rx="4" ry="12" fill="#B9763C" stroke="#2B2F4A" stroke-width="2"/><ellipse cx="338" cy="196" rx="24" ry="9" fill="#5BBF6A" stroke="#2B2F4A" stroke-width="3"/><circle cx="342" cy="190" r="6" fill="#F7C9D4" stroke="#2B2F4A" stroke-width="2"/><g class="bob" ><g transform="translate(120,140) scale(1.15,1.15)" ><ellipse cx="0" cy="0" rx="22" ry="14" fill="#E0A94B" stroke="#2B2F4A" stroke-width="3"/><circle cx="18" cy="-14" r="10" fill="#E0A94B" stroke="#2B2F4A" stroke-width="3" /><path d="M26 -14 L36 -11 L26 -8 Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><circle cx="20" cy="-16" r="1.6" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="0" /><path d="M-12 -2 Q-2 6 8 -2" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g></g><g class="bob" ><g transform="translate(250,138) scale(1.1)" ><ellipse cx="0" cy="0" rx="30" ry="16" fill="#fff" stroke="#2B2F4A" stroke-width="3"/><path d="M18 -6 Q38 -10 32 -34 Q30 -48 40 -50" fill="none" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M18 -6 Q38 -10 32 -34 Q30 -48 40 -50" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="41" cy="-50" r="7" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><path d="M47 -50 L57 -47 L47 -45 Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><circle cx="42" cy="-52" r="1.5" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="0" /><path d="M-18 -2 Q-4 8 12 -2" fill="none" stroke="#B8BCD0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g></g><g class="swim" ><g transform="translate(172,178) scale(0.55,0.55)" ><ellipse cx="0" cy="0" rx="22" ry="14" fill="#FFD23F" stroke="#2B2F4A" stroke-width="3"/><circle cx="18" cy="-14" r="10" fill="#FFD23F" stroke="#2B2F4A" stroke-width="3" /><path d="M26 -14 L36 -11 L26 -8 Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><circle cx="20" cy="-16" r="1.6" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="0" /><path d="M-12 -2 Q-2 6 8 -2" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(198,188) scale(0.55,0.55)" ><ellipse cx="0" cy="0" rx="22" ry="14" fill="#FFD23F" stroke="#2B2F4A" stroke-width="3"/><circle cx="18" cy="-14" r="10" fill="#FFD23F" stroke="#2B2F4A" stroke-width="3" /><path d="M26 -14 L36 -11 L26 -8 Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><circle cx="20" cy="-16" r="1.6" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="0" /><path d="M-12 -2 Q-2 6 8 -2" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(224,182) scale(0.55,0.55)" ><ellipse cx="0" cy="0" rx="22" ry="14" fill="#FFD23F" stroke="#2B2F4A" stroke-width="3"/><circle cx="18" cy="-14" r="10" fill="#FFD23F" stroke="#2B2F4A" stroke-width="3" /><path d="M26 -14 L36 -11 L26 -8 Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><circle cx="20" cy="-16" r="1.6" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="0" /><path d="M-12 -2 Q-2 6 8 -2" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g></g></svg>