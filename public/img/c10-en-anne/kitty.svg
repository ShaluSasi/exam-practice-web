<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>An open diary with a friendly smiling face, as if the diary were a friend</title><style>
.bob{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-4px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(5deg)}}
.flick{animation:flick 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{50%{transform:scale(1.15,.88);opacity:.85}}
.wig{animation:wig .5s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes wig{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.pop{animation:pop 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1.08);opacity:1}}
.rise{animation:rise 3.5s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-26px);opacity:0}}
.swim{animation:swim 5s ease-in-out infinite alternate}
@keyframes swim{to{transform:translateX(16px)}}
.write{animation:write 2s ease-in-out infinite}
@keyframes write{50%{transform:translate(10px,3px)}}
.spin{animation:spin 8s linear infinite;transform-box:view-box}
@keyframes spin{to{transform:rotate(360deg)}}
.ripple{animation:ripple 3s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ripple{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.5);opacity:0}}
.nod{animation:nod 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes nod{50%{transform:rotate(-6deg)}}
.drop{animation:drop 2s ease-in infinite}
@keyframes drop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="90" y="60" width="220" height="130" rx="5" fill="#fff" stroke="#2B2F4A" stroke-width="3"/><line x1="200.0" y1="60" x2="200.0" y2="190" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><circle cx="200" cy="125" r="34" fill="#FFE9C7" stroke="#2B2F4A" stroke-width="3" /><circle cx="195" cy="120" r="1.8" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="0" /><circle cx="205" cy="120" r="1.8" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="0" /><path d="M195 126 Q200 132 205 126" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path class="pop" transform="translate(130,110) scale(1.4)" d="M0 8 C-14 -4 -8 -14 0 -6 C8 -14 14 -4 0 8 Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><path class="pop" transform="translate(270,110) scale(1.4)" d="M0 8 C-14 -4 -8 -14 0 -6 C8 -14 14 -4 0 8 Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><g class="bob" ><text x="200" y="48" font-family="sans-serif" font-size="20" font-weight="bold" fill="#7C5CFF" text-anchor="middle" >Dearest Kitty,</text></g><g class="rise" ><path transform="translate(70,80) scale(0.8)" d="M0 8 C-14 -4 -8 -14 0 -6 C8 -14 14 -4 0 8 Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/></g><g class="rise" ><path transform="translate(330,80) scale(0.8)" d="M0 8 C-14 -4 -8 -14 0 -6 C8 -14 14 -4 0 8 Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/></g><g class="rise" ><path transform="translate(60,180) scale(0.8)" d="M0 8 C-14 -4 -8 -14 0 -6 C8 -14 14 -4 0 8 Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/></g></svg>