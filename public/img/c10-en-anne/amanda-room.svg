<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A tidy bedroom with a bed, desk, homework books, chocolate, mirror and shoes</title><style>
.bob{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-4px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(5deg)}}
.flick{animation:flick 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{50%{transform:scale(1.15,.88);opacity:.85}}
.wig{animation:wig .5s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes wig{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.pop{animation:pop 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1.08);opacity:1}}
.rise{animation:rise 3.5s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-26px);opacity:0}}
.swim{animation:swim 5s ease-in-out infinite alternate}
@keyframes swim{to{transform:translateX(16px)}}
.write{animation:write 2s ease-in-out infinite}
@keyframes write{50%{transform:translate(10px,3px)}}
.spin{animation:spin 8s linear infinite;transform-box:view-box}
@keyframes spin{to{transform:rotate(360deg)}}
.ripple{animation:ripple 3s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ripple{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.5);opacity:0}}
.nod{animation:nod 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes nod{50%{transform:rotate(-6deg)}}
.drop{animation:drop 2s ease-in infinite}
@keyframes drop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="190" rx="0" fill="#F3ECFF" stroke="none" stroke-width="0" /><rect x="0" y="190" width="400" height="50" fill="#EAD9B5"/><line x1="0" y1="190" x2="400" y2="190" stroke="#D9C49A" stroke-width="2" stroke-linecap="round" /><rect x="30" y="110" width="110" height="60" rx="6" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><rect x="30" y="100" width="110" height="20" rx="8" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" /><rect x="210" y="110" width="100" height="12" rx="3" fill="#B9763C" stroke="#2B2F4A" stroke-width="3" /><line x1="220" y1="122" x2="220" y2="172" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><line x1="300" y1="122" x2="300" y2="172" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><rect x="226" y="90" width="48" height="20" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" /><line x1="231" y1="94" x2="231" y2="106" stroke="#fff" stroke-width="2" stroke-linecap="round" /><rect x="232" y="74" width="40" height="16" rx="3" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="3" /><line x1="237" y1="78" x2="237" y2="86" stroke="#fff" stroke-width="2" stroke-linecap="round" /><rect x="284" y="96" width="22" height="14" rx="2" fill="#7A4A2A" stroke="#2B2F4A" stroke-width="2.5" /><rect x="284" y="96" width="22" height="5" rx="0" fill="#FFD23F" stroke="#2B2F4A" stroke-width="0" /><rect x="330" y="30" width="50" height="70" rx="4" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><circle cx="355" cy="62" r="16" fill="#DDF1FB" stroke="#2B2F4A" stroke-width="2" /><path d="M150 196 q0 -16 10 -16 l12 0 l0 16 Z" fill="#2B2F4A"/><path d="M176 196 q0 -16 10 -16 l12 0 l0 16 Z" fill="#2B2F4A"/><g class="rise" ><path transform="translate(190,40) scale(1.0)" d="M0 8 C-14 -4 -8 -14 0 -6 C8 -14 14 -4 0 8 Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/></g></svg>