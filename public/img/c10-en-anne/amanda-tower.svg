<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A tall tower with a window, a long golden braid, a bird and a cloud</title><style>
.bob{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-4px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(5deg)}}
.flick{animation:flick 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{50%{transform:scale(1.15,.88);opacity:.85}}
.wig{animation:wig .5s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes wig{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.pop{animation:pop 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1.08);opacity:1}}
.rise{animation:rise 3.5s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-26px);opacity:0}}
.swim{animation:swim 5s ease-in-out infinite alternate}
@keyframes swim{to{transform:translateX(16px)}}
.write{animation:write 2s ease-in-out infinite}
@keyframes write{50%{transform:translate(10px,3px)}}
.spin{animation:spin 8s linear infinite;transform-box:view-box}
@keyframes spin{to{transform:rotate(360deg)}}
.ripple{animation:ripple 3s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ripple{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.5);opacity:0}}
.nod{animation:nod 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes nod{50%{transform:rotate(-6deg)}}
.drop{animation:drop 2s ease-in infinite}
@keyframes drop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="240" rx="0" fill="#E3F2FD" stroke="none" stroke-width="0" /><rect x="0" y="214" width="400" height="26" rx="0" fill="#8FD18A" stroke="none" stroke-width="0" /><g transform="translate(75,55)" class="swim" ><ellipse cx="0" cy="0" rx="34" ry="14" fill="#fff"/><ellipse cx="22" cy="-8" rx="22" ry="12" fill="#fff"/></g><rect x="150" y="70" width="100" height="148" rx="4" fill="#C9C2D9" stroke="#2B2F4A" stroke-width="4" /><line x1="158" y1="110" x2="178" y2="110" stroke="#9A93B3" stroke-width="3" stroke-linecap="round" /><line x1="200" y1="140" x2="220" y2="140" stroke="#9A93B3" stroke-width="3" stroke-linecap="round" /><line x1="170" y1="180" x2="190" y2="180" stroke="#9A93B3" stroke-width="3" stroke-linecap="round" /><line x1="216" y1="190" x2="236" y2="190" stroke="#9A93B3" stroke-width="3" stroke-linecap="round" /><line x1="222" y1="112" x2="242" y2="112" stroke="#9A93B3" stroke-width="3" stroke-linecap="round" /><path d="M140 74 L200 20 L260 74 Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="4" stroke-linejoin="round"/><rect x="184" y="78" width="32" height="34" rx="14" fill="#2B3A67" stroke="#2B2F4A" stroke-width="3" /><path d="M214 100 Q280 140 250 215" fill="none" stroke="#FFD23F" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" class="sway"/><path d="M214 100 Q280 140 250 215" fill="none" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><g transform="translate(310,70) scale(1.4)" class="bob" ><path d="M0 0 q10 -10 20 0 q-10 -4 -20 0 Z" fill="#2B2F4A"/><path d="M20 0 q10 -10 20 0 q-10 -4 -20 0 Z" fill="#2B2F4A"/></g></svg>