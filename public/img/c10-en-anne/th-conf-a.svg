<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>Two friends sharing a secret quietly</title><style>
.bob{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-4px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(5deg)}}
.flick{animation:flick 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{50%{transform:scale(1.15,.88);opacity:.85}}
.wig{animation:wig .5s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes wig{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.pop{animation:pop 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1.08);opacity:1}}
.rise{animation:rise 3.5s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-26px);opacity:0}}
.swim{animation:swim 5s ease-in-out infinite alternate}
@keyframes swim{to{transform:translateX(16px)}}
.write{animation:write 2s ease-in-out infinite}
@keyframes write{50%{transform:translate(10px,3px)}}
.spin{animation:spin 8s linear infinite;transform-box:view-box}
@keyframes spin{to{transform:rotate(360deg)}}
.ripple{animation:ripple 3s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ripple{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.5);opacity:0}}
.nod{animation:nod 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes nod{50%{transform:rotate(-6deg)}}
.drop{animation:drop 2s ease-in infinite}
@keyframes drop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="118" width="200" height="32" rx="0" fill="#F3E3C3" stroke="none" stroke-width="0" /><g transform="translate(60,128) scale(0.9)" ><path d="M-8 0 L-8 18 M8 0 L8 18" fill="none" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="-13" y="-34" width="26" height="36" rx="9" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3"/><line x1="-13" y1="-26" x2="-22" y2="-12" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="13" y1="-26" x2="26" y2="-44" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><circle cx="0" cy="-48" r="14" fill="#FFD9B3" stroke="#2B2F4A" stroke-width="3" /><path d="M-14 -50 Q-12 -64 0 -63 Q12 -64 14 -50 Q6 -56 -14 -50 Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="-5" cy="-49" r="1.8" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="0" /><circle cx="5" cy="-49" r="1.8" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="0" /><circle cx="1" cy="-41" r="1.8" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="0" /></g><g transform="translate(140,128) scale(0.9)" ><path d="M-8 0 L-8 18 M8 0 L8 18" fill="none" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="-13" y="-34" width="26" height="36" rx="9" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3"/><line x1="-13" y1="-26" x2="-22" y2="-12" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="13" y1="-26" x2="22" y2="-12" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><circle cx="0" cy="-48" r="14" fill="#FFD9B3" stroke="#2B2F4A" stroke-width="3" /><path d="M-14 -50 Q-12 -64 0 -63 Q12 -64 14 -50 Q6 -56 -14 -50 Z" fill="#4A3B2A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="-5" cy="-49" r="1.8" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="0" /><circle cx="5" cy="-49" r="1.8" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="0" /><path d="M-5 -43 Q0 -37 5 -43" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M82 76 q8 -2 14 6" fill="none" stroke="#7C5CFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="pulse"/><g class="rise" ><path transform="translate(100,40) scale(0.8)" d="M0 8 C-14 -4 -8 -14 0 -6 C8 -14 14 -4 0 8 Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/></g></svg>