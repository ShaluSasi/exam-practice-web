<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Teachers around a table deciding who moves up to the next form and who is kept back</title><style>
.bob{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-4px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(5deg)}}
.flick{animation:flick 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{50%{transform:scale(1.15,.88);opacity:.85}}
.wig{animation:wig .5s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes wig{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.pop{animation:pop 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1.08);opacity:1}}
.rise{animation:rise 3.5s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-26px);opacity:0}}
.swim{animation:swim 5s ease-in-out infinite alternate}
@keyframes swim{to{transform:translateX(16px)}}
.write{animation:write 2s ease-in-out infinite}
@keyframes write{50%{transform:translate(10px,3px)}}
.spin{animation:spin 8s linear infinite;transform-box:view-box}
@keyframes spin{to{transform:rotate(360deg)}}
.ripple{animation:ripple 3s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ripple{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.5);opacity:0}}
.nod{animation:nod 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes nod{50%{transform:rotate(-6deg)}}
.drop{animation:drop 2s ease-in infinite}
@keyframes drop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="130" y="100" width="140" height="14" rx="4" fill="#B9763C" stroke="#2B2F4A" stroke-width="3" /><line x1="150" y1="114" x2="150" y2="160" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round" /><line x1="250" y1="114" x2="250" y2="160" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round" /><g transform="translate(150,98) scale(0.55)" ><path d="M-8 0 L-8 18 M8 0 L8 18" fill="none" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="-13" y="-34" width="26" height="36" rx="9" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="3"/><line x1="-13" y1="-26" x2="-22" y2="-12" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="13" y1="-26" x2="22" y2="-12" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><circle cx="0" cy="-48" r="14" fill="#FFD9B3" stroke="#2B2F4A" stroke-width="3" /><path d="M-14 -50 Q-12 -64 0 -63 Q12 -64 14 -50 Q6 -56 -14 -50 Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="-5" cy="-49" r="1.8" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="0" /><circle cx="5" cy="-49" r="1.8" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="0" /><line x1="-4" y1="-41" x2="4" y2="-41" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /></g><g transform="translate(200,98) scale(0.55)" ><path d="M-8 0 L-8 18 M8 0 L8 18" fill="none" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="-13" y="-34" width="26" height="36" rx="9" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3"/><line x1="-13" y1="-26" x2="-22" y2="-12" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="13" y1="-26" x2="22" y2="-12" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><circle cx="0" cy="-48" r="14" fill="#FFD9B3" stroke="#2B2F4A" stroke-width="3" /><path d="M-14 -50 Q-12 -64 0 -63 Q12 -64 14 -50 Q6 -56 -14 -50 Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="-5" cy="-49" r="1.8" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="0" /><circle cx="5" cy="-49" r="1.8" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="0" /><line x1="-4" y1="-41" x2="4" y2="-41" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /></g><g transform="translate(250,98) scale(0.55)" ><path d="M-8 0 L-8 18 M8 0 L8 18" fill="none" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="-13" y="-34" width="26" height="36" rx="9" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3"/><line x1="-13" y1="-26" x2="-22" y2="-12" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="13" y1="-26" x2="22" y2="-12" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><circle cx="0" cy="-48" r="14" fill="#FFD9B3" stroke="#2B2F4A" stroke-width="3" /><path d="M-14 -50 Q-12 -64 0 -63 Q12 -64 14 -50 Q6 -56 -14 -50 Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="-5" cy="-49" r="1.8" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="0" /><circle cx="5" cy="-49" r="1.8" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="0" /><line x1="-4" y1="-41" x2="4" y2="-41" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /></g><rect x="172" y="90" width="28" height="10" rx="2" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><path d="M12 200 L12 170 L42 170 L42 150 L72 150 L72 130 L102 130 L102 110 L108 110 L108 200 Z" fill="#CDEBD2" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><g class="bob" ><path d="M60 100 L60 64 M46 80 L60 64 L74 80" fill="none" stroke="#3FA34D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="60" y="50" font-family="sans-serif" font-size="13" font-weight="bold" fill="#3FA34D" text-anchor="middle" >Next form</text><rect x="300" y="150" width="90" height="50" rx="8" fill="#FBD5D6" stroke="#2B2F4A" stroke-width="3" /><g class="pulse" ><path d="M330 120 a18 18 0 1 1 22 4 M352 124 l-3 -10 M352 124 l-10 2" fill="none" stroke="#E5484D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></g><text x="345" y="224" font-family="sans-serif" font-size="13" font-weight="bold" fill="#E5484D" text-anchor="middle" >Kept back</text><text x="200" y="36" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Teachers decide</text><text x="200" y="54" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >who moves up?</text></svg>