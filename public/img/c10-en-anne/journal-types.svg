<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Four book tiles labelled journal, diary, log and memoir</title><style>
.bob{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-4px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(5deg)}}
.flick{animation:flick 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{50%{transform:scale(1.15,.88);opacity:.85}}
.wig{animation:wig .5s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes wig{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.pop{animation:pop 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1.08);opacity:1}}
.rise{animation:rise 3.5s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-26px);opacity:0}}
.swim{animation:swim 5s ease-in-out infinite alternate}
@keyframes swim{to{transform:translateX(16px)}}
.write{animation:write 2s ease-in-out infinite}
@keyframes write{50%{transform:translate(10px,3px)}}
.spin{animation:spin 8s linear infinite;transform-box:view-box}
@keyframes spin{to{transform:rotate(360deg)}}
.ripple{animation:ripple 3s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ripple{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.5);opacity:0}}
.nod{animation:nod 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes nod{50%{transform:rotate(-6deg)}}
.drop{animation:drop 2s ease-in infinite}
@keyframes drop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="14" y="40" width="84" height="140" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><rect x="28" y="56" width="56" height="70" rx="5" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" /><path d="M38 110 q10 -30 20 -10 t16 -20" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="56" y="152" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Journal</text><text x="56" y="170" font-family="sans-serif" font-size="10.5" font-weight="normal" fill="#555B7A" text-anchor="middle" >a trip, daily</text><rect x="108" y="40" width="84" height="140" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><rect x="122" y="56" width="56" height="70" rx="5" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="3" /><rect x="158" y="82" width="12" height="14" rx="2" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2" /><path transform="translate(144,92) scale(0.9)" d="M0 8 C-14 -4 -8 -14 0 -6 C8 -14 14 -4 0 8 Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><text x="150" y="152" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Diary</text><text x="150" y="170" font-family="sans-serif" font-size="10.5" font-weight="normal" fill="#555B7A" text-anchor="middle" >private, day by day</text><rect x="202" y="40" width="84" height="140" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><rect x="216" y="56" width="56" height="70" rx="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" /><line x1="226" y1="72" x2="262" y2="72" stroke="#fff" stroke-width="3" stroke-linecap="round" /><line x1="226" y1="88" x2="262" y2="88" stroke="#fff" stroke-width="3" stroke-linecap="round" /><line x1="226" y1="104" x2="262" y2="104" stroke="#fff" stroke-width="3" stroke-linecap="round" /><text x="244" y="152" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Log</text><text x="244" y="170" font-family="sans-serif" font-size="10.5" font-weight="normal" fill="#555B7A" text-anchor="middle" >times and dates</text><rect x="296" y="40" width="84" height="140" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><rect x="310" y="56" width="56" height="70" rx="5" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" /><path d="M338 70 l5 11 12 1 -9 8 3 12 -11 -6 -11 6 3 -12 -9 -8 12 -1 Z" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2"/><text x="338" y="152" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Memoir</text><text x="338" y="170" font-family="sans-serif" font-size="10.5" font-weight="normal" fill="#555B7A" text-anchor="middle" >life story</text><g class="bob" ><text x="200" y="24" font-family="sans-serif" font-size="15" font-weight="bold" fill="#7C5CFF" text-anchor="middle" >Four kinds of written record</text></g></svg>