<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>An emerald sea with a mermaid, a fish, a starfish, a shell and seaweed</title><style>
.bob{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-4px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(5deg)}}
.flick{animation:flick 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{50%{transform:scale(1.15,.88);opacity:.85}}
.wig{animation:wig .5s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes wig{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.pop{animation:pop 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1.08);opacity:1}}
.rise{animation:rise 3.5s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-26px);opacity:0}}
.swim{animation:swim 5s ease-in-out infinite alternate}
@keyframes swim{to{transform:translateX(16px)}}
.write{animation:write 2s ease-in-out infinite}
@keyframes write{50%{transform:translate(10px,3px)}}
.spin{animation:spin 8s linear infinite;transform-box:view-box}
@keyframes spin{to{transform:rotate(360deg)}}
.ripple{animation:ripple 3s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ripple{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.5);opacity:0}}
.nod{animation:nod 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes nod{50%{transform:rotate(-6deg)}}
.drop{animation:drop 2s ease-in infinite}
@keyframes drop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="240" rx="0" fill="#9BE3C8" stroke="none" stroke-width="0" /><path d="M0 28 q25 -12 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".7" class="swim"/><path d="M0 38 q25 -12 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".7" class="swim"/><path d="M0 48 q25 -12 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".7" class="swim"/><path d="M350 220 q-14 -30 0 -50 q14 -26 0 -52" fill="none" stroke="#3FA34D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" class="sway"/><path d="M372 220 q-14 -30 0 -50 q14 -26 0 -52" fill="none" stroke="#3FA34D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" class="sway"/><path d="M60 180 l7 14 15 2 -11 11 3 15 -14 -8 -14 8 3 -15 -11 -11 15 -2 Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><path d="M300 222 Q330 170 360 222 Z" fill="#F7C9D4" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><path d="M330 222 L330 188 M315 222 L320 195 M345 222 L340 195" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(85,145)" class="swim" ><ellipse cx="0" cy="0" rx="20" ry="11" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3"/><path d="M18 0 L32 -10 L32 10 Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><circle cx="-9" cy="-3" r="2" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="0" /></g><g transform="translate(200,95)" class="bob" ><path d="M-14 20 Q-20 60 0 70 Q20 60 14 20 Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3"/><path d="M0 70 Q-24 78 -34 98 Q-10 96 0 80 Q10 96 34 98 Q24 78 0 70 Z" fill="#2E8240" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><rect x="-14" y="-8" width="28" height="32" rx="10" fill="#FFD9B3" stroke="#2B2F4A" stroke-width="3"/><path d="M-14 4 Q-10 22 0 22 Q10 22 14 4 Z" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2"/><circle cx="0" cy="-22" r="14" fill="#FFD9B3" stroke="#2B2F4A" stroke-width="3" /><path d="M-16 -22 Q-20 -46 0 -40 Q20 -46 16 -22 Q14 0 18 14 M-16 -22 Q-18 0 -20 14" fill="none" stroke="#FF8A1F" stroke-width="7" stroke-linecap="round"/><path d="M-8 -23 Q-5 -20 -2 -23" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M2 -23 Q5 -20 8 -23" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M-4 -16 Q0 -13 4 -16" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><circle class="rise" cx="250" cy="150" r="5" fill="#fff" stroke="#0B93D4" stroke-width="2" style="animation-delay:0s"/><circle class="rise" cx="262" cy="130" r="5" fill="#fff" stroke="#0B93D4" stroke-width="2" style="animation-delay:1.2s"/><circle class="rise" cx="150" cy="110" r="5" fill="#fff" stroke="#0B93D4" stroke-width="2" style="animation-delay:0.6s"/></svg>