<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A desk with an open diary, pen, lamp, cat, window and clock</title><style>
.bob{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-4px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(5deg)}}
.flick{animation:flick 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{50%{transform:scale(1.15,.88);opacity:.85}}
.wig{animation:wig .5s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes wig{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.pop{animation:pop 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1.08);opacity:1}}
.rise{animation:rise 3.5s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-26px);opacity:0}}
.swim{animation:swim 5s ease-in-out infinite alternate}
@keyframes swim{to{transform:translateX(16px)}}
.write{animation:write 2s ease-in-out infinite}
@keyframes write{50%{transform:translate(10px,3px)}}
.spin{animation:spin 8s linear infinite;transform-box:view-box}
@keyframes spin{to{transform:rotate(360deg)}}
.ripple{animation:ripple 3s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ripple{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.5);opacity:0}}
.nod{animation:nod 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes nod{50%{transform:rotate(-6deg)}}
.drop{animation:drop 2s ease-in infinite}
@keyframes drop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="150" rx="0" fill="#FCEFD2" stroke="none" stroke-width="0" /><rect x="35" y="28" width="90" height="80" rx="4" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="4" /><line x1="80.0" y1="28" x2="80.0" y2="108" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="35" y1="68.0" x2="125" y2="68.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><ellipse cx="60.2" cy="50.400000000000006" rx="12" ry="6" fill="#fff" class="swim"/><circle cx="240" cy="52" r="18" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><line x1="240" y1="52" x2="240" y2="40" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><g class="spin" style="transform-origin:240px 52px"><line x1="240" y1="52" x2="251" y2="52" stroke="#E5484D" stroke-width="2" stroke-linecap="round" /></g><rect x="18" y="150" width="364" height="18" rx="4" fill="#B9763C" stroke="#2B2F4A" stroke-width="3" /><line x1="40" y1="168" x2="40" y2="228" stroke="#2B2F4A" stroke-width="6" stroke-linecap="round" /><line x1="360" y1="168" x2="360" y2="228" stroke="#2B2F4A" stroke-width="6" stroke-linecap="round" /><g transform="translate(112,150) scale(1.0)" ><path class="sway" d="M26 4 Q50 -4 44 -26" fill="none" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round"/><ellipse cx="6" cy="-8" rx="26" ry="16" fill="#F2A65A" stroke="#2B2F4A" stroke-width="3"/><circle cx="-16" cy="-28" r="13" fill="#F2A65A" stroke="#2B2F4A" stroke-width="3" /><path d="M-27 -36 L-26 -50 L-17 -40 M-15 -40 L-6 -50 L-4 -35" fill="#F2A65A" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><circle cx="-20" cy="-29" r="1.8" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="0" /><circle cx="-12" cy="-29" r="1.8" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="0" /><path d="M-18 -22 Q-16 -19 -14 -22" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><ellipse class="pop" cx="324" cy="82" rx="38" ry="26" fill="#FFD23F" opacity=".35"/><rect x="316" y="140" width="36" height="8" rx="3" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" /><line x1="334" y1="140" x2="334" y2="100" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><line x1="334" y1="100" x2="324" y2="70" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><path d="M304 88 L344 88 L334 64 L314 64 Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><rect x="168" y="122" width="84" height="30" rx="5" fill="#fff" stroke="#2B2F4A" stroke-width="3"/><line x1="210.0" y1="122" x2="210.0" y2="152" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="176" y1="134" x2="204.0" y2="134" stroke="#B8BCD0" stroke-width="2" stroke-linecap="round" /><line x1="216.0" y1="134" x2="244" y2="134" stroke="#B8BCD0" stroke-width="2" stroke-linecap="round" /><line x1="176" y1="143" x2="204.0" y2="143" stroke="#B8BCD0" stroke-width="2" stroke-linecap="round" /><line x1="216.0" y1="143" x2="244" y2="143" stroke="#B8BCD0" stroke-width="2" stroke-linecap="round" /><line x1="176" y1="152" x2="204.0" y2="152" stroke="#B8BCD0" stroke-width="2" stroke-linecap="round" /><line x1="216.0" y1="152" x2="244" y2="152" stroke="#B8BCD0" stroke-width="2" stroke-linecap="round" /><line x1="176" y1="161" x2="204.0" y2="161" stroke="#B8BCD0" stroke-width="2" stroke-linecap="round" /><line x1="216.0" y1="161" x2="244" y2="161" stroke="#B8BCD0" stroke-width="2" stroke-linecap="round" /><g class="write" ><g transform="translate(278,136) rotate(-60) scale(0.8)" ><rect x="-4" y="-34" width="8" height="52" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" /><path d="M-4 18 L4 18 L0 30 Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><rect x="-4" y="-34" width="8" height="10" rx="3" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" /></g></g><g class="rise" ><path transform="translate(206,98) scale(0.8)" d="M0 8 C-14 -4 -8 -14 0 -6 C8 -14 14 -4 0 