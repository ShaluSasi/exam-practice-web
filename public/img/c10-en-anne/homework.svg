<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>An evening desk with notebook, fountain pen, school bag, lamp and a stack of books</title><style>
.bob{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-4px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(5deg)}}
.flick{animation:flick 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{50%{transform:scale(1.15,.88);opacity:.85}}
.wig{animation:wig .5s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes wig{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.pop{animation:pop 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1.08);opacity:1}}
.rise{animation:rise 3.5s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-26px);opacity:0}}
.swim{animation:swim 5s ease-in-out infinite alternate}
@keyframes swim{to{transform:translateX(16px)}}
.write{animation:write 2s ease-in-out infinite}
@keyframes write{50%{transform:translate(10px,3px)}}
.spin{animation:spin 8s linear infinite;transform-box:view-box}
@keyframes spin{to{transform:rotate(360deg)}}
.ripple{animation:ripple 3s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ripple{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.5);opacity:0}}
.nod{animation:nod 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes nod{50%{transform:rotate(-6deg)}}
.drop{animation:drop 2s ease-in infinite}
@keyframes drop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="240" rx="0" fill="#FCEFD2" stroke="none" stroke-width="0" /><ellipse class="pop" cx="199" cy="26" rx="38" ry="26" fill="#FFD23F" opacity=".35"/><rect x="191" y="84" width="36" height="8" rx="3" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" /><line x1="209" y1="84" x2="209" y2="44" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><line x1="209" y1="44" x2="199" y2="14" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><path d="M179 32 L219 32 L209 8 L189 8 Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><rect x="0" y="150" width="400" height="90" rx="0" fill="#B9763C" stroke="none" stroke-width="0" /><line x1="0" y1="150" x2="400" y2="150" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M115 205 L135 160 L270 160 L255 205 Z" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><line x1="140" y1="172" x2="255" y2="172" stroke="#B8BCD0" stroke-width="2" stroke-linecap="round" /><line x1="136" y1="182" x2="250" y2="182" stroke="#B8BCD0" stroke-width="2" stroke-linecap="round" /><line x1="132" y1="192" x2="246" y2="192" stroke="#B8BCD0" stroke-width="2" stroke-linecap="round" /><g class="write" ><g transform="translate(310,175) rotate(62) scale(0.95)" ><rect x="-4" y="-34" width="8" height="52" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" /><path d="M-4 18 L4 18 L0 30 Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><rect x="-4" y="-34" width="8" height="10" rx="3" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" /></g></g><rect x="24" y="108" width="66" height="62" rx="14" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" /><rect x="34" y="134" width="46" height="24" rx="6" fill="#2E8240" stroke="#2B2F4A" stroke-width="2.5" /><path d="M40 108 Q57 86 74 108" fill="none" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="57" cy="146" r="3" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2" /><rect x="318" y="196" width="70" height="16" rx="3" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="3" /><line x1="323" y1="200" x2="323" y2="208" stroke="#fff" stroke-width="2" stroke-linecap="round" /><rect x="324" y="180" width="62" height="16" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" /><line x1="329" y1="184" x2="329" y2="192" stroke="#fff" stroke-width="2" stroke-linecap="round" /><rect x="330" y="164" width="54" height="16" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" /><line x1="335" y1="168" x2="335" y2="176" stroke="#fff" stroke-width="2" stroke-linecap="round" /></svg>