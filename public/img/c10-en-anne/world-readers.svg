<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A book in the centre with many small books around it, showing it is read widely</title><style>
.bob{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-4px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(5deg)}}
.flick{animation:flick 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{50%{transform:scale(1.15,.88);opacity:.85}}
.wig{animation:wig .5s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes wig{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.pop{animation:pop 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1.08);opacity:1}}
.rise{animation:rise 3.5s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-26px);opacity:0}}
.swim{animation:swim 5s ease-in-out infinite alternate}
@keyframes swim{to{transform:translateX(16px)}}
.write{animation:write 2s ease-in-out infinite}
@keyframes write{50%{transform:translate(10px,3px)}}
.spin{animation:spin 8s linear infinite;transform-box:view-box}
@keyframes spin{to{transform:rotate(360deg)}}
.ripple{animation:ripple 3s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ripple{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.5);opacity:0}}
.nod{animation:nod 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes nod{50%{transform:rotate(-6deg)}}
.drop{animation:drop 2s ease-in infinite}
@keyframes drop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><g class="pop" ><rect x="160" y="90" width="80" height="62" rx="6" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="4" /><path transform="translate(200,124) scale(1.2)" d="M0 8 C-14 -4 -8 -14 0 -6 C8 -14 14 -4 0 8 Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/></g><g transform="translate(330,120)" class="bob" style="animation-delay:0.0s"><rect x="-14" y="-10" width="28" height="20" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" /><line x1="0" y1="-10" x2="0" y2="10" stroke="#fff" stroke-width="2" stroke-linecap="round" /></g><line x1="248.0" y1="120.0" x2="312.0" y2="120.0" stroke="#B8BCD0" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 5"/><g transform="translate(305,173)" class="bob" style="animation-delay:0.25s"><rect x="-14" y="-10" width="28" height="20" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" /><line x1="0" y1="-10" x2="0" y2="10" stroke="#fff" stroke-width="2" stroke-linecap="round" /></g><line x1="238.8328157299975" y1="143.51141009169893" x2="290.60990336999413" y2="164.67167917422796" stroke="#B8BCD0" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 5"/><g transform="translate(240,206)" class="bob" style="animation-delay:0.5s"><rect x="-14" y="-10" width="28" height="20" rx="3" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" /><line x1="0" y1="-10" x2="0" y2="10" stroke="#fff" stroke-width="2" stroke-linecap="round" /></g><line x1="214.8328157299975" y1="158.04226065180615" x2="234.6099033699941" y2="192.28029523843168" stroke="#B8BCD0" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 5"/><g transform="translate(160,206)" class="bob" style="animation-delay:0.75s"><rect x="-14" y="-10" width="28" height="20" rx="3" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" /><line x1="0" y1="-10" x2="0" y2="10" stroke="#fff" stroke-width="2" stroke-linecap="round" /></g><line x1="185.16718427000254" y1="158