<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A stack of three numbered essay sheets and a pen</title><style>
.bob{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-4px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(5deg)}}
.flick{animation:flick 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{50%{transform:scale(1.15,.88);opacity:.85}}
.wig{animation:wig .5s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes wig{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.pop{animation:pop 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1.08);opacity:1}}
.rise{animation:rise 3.5s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-26px);opacity:0}}
.swim{animation:swim 5s ease-in-out infinite alternate}
@keyframes swim{to{transform:translateX(16px)}}
.write{animation:write 2s ease-in-out infinite}
@keyframes write{50%{transform:translate(10px,3px)}}
.spin{animation:spin 8s linear infinite;transform-box:view-box}
@keyframes spin{to{transform:rotate(360deg)}}
.ripple{animation:ripple 3s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ripple{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.5);opacity:0}}
.nod{animation:nod 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes nod{50%{transform:rotate(-6deg)}}
.drop{animation:drop 2s ease-in infinite}
@keyframes drop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><g transform="translate(130,120) rotate(-6)" ><rect x="0" y="0" width="150" height="110" rx="6" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><line x1="14" y1="24" x2="130" y2="24" stroke="#B8BCD0" stroke-width="3" stroke-linecap="round" /><line x1="14" y1="44" x2="120" y2="44" stroke="#B8BCD0" stroke-width="2" stroke-linecap="round" /><line x1="14" y1="62" x2="126" y2="62" stroke="#B8BCD0" stroke-width="2" stroke-linecap="round" /><line x1="14" y1="80" x2="100" y2="80" stroke="#B8BCD0" stroke-width="2" stroke-linecap="round" /><circle cx="124" cy="90" r="12" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" /><text x="124" y="95" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle" >1</text></g><g transform="translate(150,100) rotate(3)" ><rect x="0" y="0" width="150" height="110" rx="6" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><line x1="14" y1="24" x2="130" y2="24" stroke="#B8BCD0" stroke-width="3" stroke-linecap="round" /><line x1="14" y1="44" x2="120" y2="44" stroke="#B8BCD0" stroke-width="2" stroke-linecap="round" /><line x1="14" y1="62" x2="126" y2="62" stroke="#B8BCD0" stroke-width="2" stroke-linecap="round" /><line x1="14" y1="80" x2="100" y2="80" stroke="#B8BCD0" stroke-width="2" stroke-linecap="round" /><circle cx="124" cy="90" r="12" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" /><text x="124" y="95" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle" >2</text></g><g transform="translate(170,78) rotate(-2)" ><rect x="0" y="0" width="150" height="110" rx="6" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><line x1="14" y1="24" x2="130" y2="24" stroke="#B8BCD0" stroke-width="3" stroke-linecap="round" /><line x1="14" y1="44" x2="120" y2="44" stroke="#B8BCD0" stroke-width="2" stroke-linecap="round" /><line x1="14" y1="62" x2="126" y2="62" stroke="#B8BCD0" stroke-width="2" stroke-linecap="round" /><line x1="14" y1="80" x2="100" y2="80" stroke="#B8BCD0" stroke-width="2" stroke-linecap="round" /><circle cx="124" cy="90" r="12" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" /><text x="124" y="95" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle" >3</text></g><g class="write" ><g transform="translate(90,150) rotate(-50) scale(1.0)" ><rect x="-4" y="-34" width="8" height="52" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" /><path d="M-4 18 L4 18 L0 30 Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><rect x="-4" y="-34" width="8" height="10" rx="3" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" /></g></g><text x="200" y="36" font-family="sans-serif" font-size="15" font-weight="bold" fill="#7C5CFF" text-anchor="middle" >Three essays for Mr Keesing</text></svg>