<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Night rooftops with a distant glow of fire seen from a window, 1666</title><style>
.bob{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-4px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(5deg)}}
.flick{animation:flick 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{50%{transform:scale(1.15,.88);opacity:.85}}
.wig{animation:wig .5s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes wig{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.pop{animation:pop 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1.08);opacity:1}}
.rise{animation:rise 3.5s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-26px);opacity:0}}
.swim{animation:swim 5s ease-in-out infinite alternate}
@keyframes swim{to{transform:translateX(16px)}}
.write{animation:write 2s ease-in-out infinite}
@keyframes write{50%{transform:translate(10px,3px)}}
.spin{animation:spin 8s linear infinite;transform-box:view-box}
@keyframes spin{to{transform:rotate(360deg)}}
.ripple{animation:ripple 3s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ripple{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.5);opacity:0}}
.nod{animation:nod 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes nod{50%{transform:rotate(-6deg)}}
.drop{animation:drop 2s ease-in infinite}
@keyframes drop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="240" rx="0" fill="#2B3A67" stroke="none" stroke-width="0" /><path class="pop" d="M330 30 a14 14 0 1 0 10 20 a11 11 0 1 1 -10 -20 Z" fill="#FFD23F"/><ellipse class="pulse" cx="170" cy="150" rx="140" ry="60" fill="#FF8A1F" opacity=".45"/><rect x="10" y="150" width="60" height="90" rx="0" fill="#3B3F5C" stroke="#2B2F4A" stroke-width="3" /><path d="M6 150 L40.0 128 L74 150 Z" fill="#53577A" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><rect x="70" y="135" width="55" height="105" rx="0" fill="#3B3F5C" stroke="#2B2F4A" stroke-width="3" /><path d="M66 135 L97.5 113 L129 135 Z" fill="#53577A" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><rect x="125" y="150" width="50" height="90" rx="0" fill="#3B3F5C" stroke="#2B2F4A" stroke-width="3" /><path d="M121 150 L150.0 128 L179 150 Z" fill="#53577A" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><rect x="175" y="125" width="60" height="115" rx="0" fill="#3B3F5C" stroke="#2B2F4A" stroke-width="3" /><path d="M171 125 L205.0 103 L239 125 Z" fill="#53577A" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><rect x="235" y="145" width="55" height="95" rx="0" fill="#3B3F5C" stroke="#2B2F4A" stroke-width="3" /><path d="M231 145 L262.5 123 L294 145 Z" fill="#53577A" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><rect x="290" y="130" width="60" height="110" rx="0" fill="#3B3F5C" stroke="#2B2F4A" stroke-width="3" /><path d="M286 130 L320.0 108 L354 130 Z" fill="#53577A" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><rect x="350" y="150" width="45" height="90" rx="0" fill="#3B3F5C" stroke="#2B2F4A" stroke-width="3" /><path d="M346 150 L372.5 128 L399 150 Z" fill="#53577A" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><path class="flick" d="M100 118 q-10 -14 0 -30 q4 12 12 6 q6 12 -4 24 Z" fill="#FFD23F" stroke="#FF8A1F" stroke-width="2.5" style="animation-delay:0.0s"/><path class="flick" d="M190 98 q-10 -14 0 -30 q4 12 12 6 q6 12 -4 24 Z" fill="#FFD23F" stroke="#FF8A1F" stroke-width="2.5" style="animation-delay:0.3s"/><path class="flick" d="M260 118 q-10 -14 0 -30 q4 12 12 6 q6 12 -4 24 Z" fill="#FFD23F" stroke="#FF8A1F" stroke-width="2.5" style="animation-delay:0.6s"/><rect x="14" y="190" width="372" height="12" rx="0" fill="#53577A" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="226" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle" >London, 2 September 1666</text></svg>