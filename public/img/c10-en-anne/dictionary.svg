<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>An open dictionary with a magnifying glass over an entry</title><style>
.bob{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-4px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(5deg)}}
.flick{animation:flick 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{50%{transform:scale(1.15,.88);opacity:.85}}
.wig{animation:wig .5s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes wig{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.pop{animation:pop 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1.08);opacity:1}}
.rise{animation:rise 3.5s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-26px);opacity:0}}
.swim{animation:swim 5s ease-in-out infinite alternate}
@keyframes swim{to{transform:translateX(16px)}}
.write{animation:write 2s ease-in-out infinite}
@keyframes write{50%{transform:translate(10px,3px)}}
.spin{animation:spin 8s linear infinite;transform-box:view-box}
@keyframes spin{to{transform:rotate(360deg)}}
.ripple{animation:ripple 3s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ripple{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.5);opacity:0}}
.nod{animation:nod 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes nod{50%{transform:rotate(-6deg)}}
.drop{animation:drop 2s ease-in infinite}
@keyframes drop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="60" y="40" width="280" height="160" rx="5" fill="#fff" stroke="#2B2F4A" stroke-width="3"/><line x1="200.0" y1="40" x2="200.0" y2="200" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="80" y="70" font-family="sans-serif" font-size="20" font-weight="bold" fill="#7C5CFF" text-anchor="start" >c....</text><text x="150" y="70" font-family="sans-serif" font-size="11" font-weight="normal" fill="#777" text-anchor="start" >verb</text><line x1="80" y1="82" x2="190" y2="82" stroke="#B8BCD0" stroke-width="2" stroke-linecap="round" /><line x1="80" y1="96" x2="180" y2="96" stroke="#B8BCD0" stroke-width="2" stroke-linecap="round" /><text x="80" y="122" font-family="sans-serif" font-size="11" font-weight="bold" fill="#E5484D" text-anchor="start" >IDM</text><text x="110" y="122" font-family="sans-serif" font-size="13" font-weight="bold" fill="#2B2F4A" text-anchor="start" >... my eye</text><line x1="80" y1="134" x2="190" y2="134" stroke="#B8BCD0" stroke-width="2" stroke-linecap="round" /><line x1="80" y1="148" x2="170" y2="148" stroke="#B8BCD0" stroke-width="2" stroke-linecap="round" /><text x="220" y="70" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0B93D4" text-anchor="start" >eye</text><line x1="220" y1="82" x2="322" y2="82" stroke="#B8BCD0" stroke-width="2" stroke-linecap="round" /><line x1="220" y1="96" x2="310" y2="96" stroke="#B8BCD0" stroke-width="2" stroke-linecap="round" /><g transform="translate(130,108)" class="write" ><circle cx="0" cy="0" r="18" fill="none" stroke="#2B2F4A" stroke-width="4" /><line x1="13" y1="13" x2="28" y2="28" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round" /></g></svg>