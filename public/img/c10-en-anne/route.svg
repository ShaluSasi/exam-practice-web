<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A simple route sketch from Frankfurt to Aachen and Holland</title><style>
.bob{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-4px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(5deg)}}
.flick{animation:flick 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{50%{transform:scale(1.15,.88);opacity:.85}}
.wig{animation:wig .5s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes wig{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.pop{animation:pop 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1.08);opacity:1}}
.rise{animation:rise 3.5s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-26px);opacity:0}}
.swim{animation:swim 5s ease-in-out infinite alternate}
@keyframes swim{to{transform:translateX(16px)}}
.write{animation:write 2s ease-in-out infinite}
@keyframes write{50%{transform:translate(10px,3px)}}
.spin{animation:spin 8s linear infinite;transform-box:view-box}
@keyframes spin{to{transform:rotate(360deg)}}
.ripple{animation:ripple 3s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ripple{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.5);opacity:0}}
.nod{animation:nod 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes nod{50%{transform:rotate(-6deg)}}
.drop{animation:drop 2s ease-in infinite}
@keyframes drop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M60 150 L200 90 L340 150" fill="none" stroke="#B8BCD0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 8"/><rect x="38" y="140" width="44" height="32" rx="3" fill="#FFE9C7" stroke="#2B2F4A" stroke-width="3" /><path d="M32 140 L60 118 L88 140 Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><rect x="54" y="156" width="12" height="16" rx="2" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2" /><text x="60" y="205" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Frankfurt</text><rect x="178" y="80" width="44" height="32" rx="3" fill="#E0F0FF" stroke="#2B2F4A" stroke-width="3" /><path d="M172 80 L200 58 L228 80 Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><rect x="194" y="96" width="12" height="16" rx="2" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2" /><text x="200" y="50" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Aachen (Grandma)</text><rect x="318" y="140" width="44" height="32" rx="3" fill="#E6F7E0" stroke="#2B2F4A" stroke-width="3" /><path d="M312 140 L340 118 L368 140 Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><rect x="334" y="156" width="12" height="16" rx="2" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2" /><text x="340" y="205" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Holland</text><g transform="translate(60,150)" ><circle cx="0" cy="0" r="8" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" /></g><style>.mv{animation:mv 6s ease-in-out infinite}@keyframes mv{0%{transform:translate(0,0)}50%{transform:translate(140px,-60px)}100%{transform:translate(280px,0)}}@media (prefers-reduced-motion: reduce){.mv{animation:none!important}}</style><g class="mv"><circle cx="60" cy="150" r="8" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3"/></g></svg>