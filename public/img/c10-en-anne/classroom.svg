"190" y="150" width="60" height="12" rx="3" fill="#B9763C" stroke="#2B2F4A" stroke-width="3" /><line x1="198" y1="162" x2="198" y2="190" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><line x1="242" y1="162" x2="242" y2="190" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><rect x="270" y="150" width="60" height="12" rx="3" fill="#B9763C" stroke="#2B2F4A" stroke-width="3" /><line x1="278" y1="162" x2="278" y2="190" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><line x1="322" y1="162" x2="322" y2="190" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><rect x="30" y="180" width="38" height="36" rx="8" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" /><rect x="36" y="190" width="26" height="14" rx="4" fill="#2E8240" stroke="#2B2F4A" stroke-width="2.5" /><path d="M38 180 Q49 166 60 180" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="330" y="140" width="62" height="14" rx="3" fill="#B9763C" stroke="#2B2F4A" stroke-width="3" /><line x1="338" y1="154" x2="338" y2="196" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><line x1="384" y1="154" x2="384" y2="196" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><rect x="345" y="124" width="26" height="16" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" /><line x1="350" y1="128" x2="350" y2="136" stroke="#fff" stroke-width="2" stroke-linecap="round" /></svg>