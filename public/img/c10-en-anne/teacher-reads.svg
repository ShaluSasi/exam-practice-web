" style="animation-delay:0.8s"><g transform="translate(200,196) scale(1.05)" ><path d="M-8 0 L-8 18 M8 0 L8 18" fill="none" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="-13" y="-34" width="26" height="36" rx="9" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3"/><line x1="-13" y1="-26" x2="-22" y2="-12" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="13" y1="-26" x2="22" y2="-12" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><circle cx="0" cy="-48" r="14" fill="#FFD9B3" stroke="#2B2F4A" stroke-width="3" /><path d="M-14 -50 Q-12 -64 0 -63 Q12 -64 14 -50 Q6 -56 -14 -50 Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M-8 -49 Q-5 -52 -2 -49" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M2 -49 Q5 -52 8 -49" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M-6 -44 Q0 -34 6 -44 Z" fill="#fff" stroke="#2B2F4A" stroke-width="2"/></g></g><rect x="174" y="160" width="52" height="10" rx="3" fill="#B9763C" stroke="#2B2F4A" stroke-width="2.5" /><rect x="230" y="26" width="100" height="34" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><path d="M310 59 L316 69 L324 59" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><rect x="311" y="56" width="12" height="6" fill="#fff"/><text x="280.0" y="47.5" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Ha ha ha!</text></svg>