<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A checklist of four diary-writing tips</title><style>
.bob{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-4px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(5deg)}}
.flick{animation:flick 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{50%{transform:scale(1.15,.88);opacity:.85}}
.wig{animation:wig .5s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes wig{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.pop{animation:pop 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1.08);opacity:1}}
.rise{animation:rise 3.5s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-26px);opacity:0}}
.swim{animation:swim 5s ease-in-out infinite alternate}
@keyframes swim{to{transform:translateX(16px)}}
.write{animation:write 2s ease-in-out infinite}
@keyframes write{50%{transform:translate(10px,3px)}}
.spin{animation:spin 8s linear infinite;transform-box:view-box}
@keyframes spin{to{transform:rotate(360deg)}}
.ripple{animation:ripple 3s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ripple{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.5);opacity:0}}
.nod{animation:nod 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes nod{50%{transform:rotate(-6deg)}}
.drop{animation:drop 2s ease-in infinite}
@keyframes drop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="50" y="20" width="300" height="200" rx="14" fill="#fff" stroke="#2B2F4A" stroke-width="4" /><circle cx="84" cy="57" r="13" fill="#E6F7E0" stroke="#3FA34D" stroke-width="3" /><path d="M77 57 L83 63 L92 50" fill="none" stroke="#3FA34D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" class="pulse"/><text x="112" y="62" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2B2F4A" text-anchor="start" >Write as if for someone else</text><circle cx="84" cy="99" r="13" fill="#E6F7E0" stroke="#3FA34D" stroke-width="3" /><path d="M77 99 L83 105 L92 92" fill="none" stroke="#3FA34D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" class="pulse"/><text x="112" y="104" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2B2F4A" text-anchor="start" >Convince the reader</text><circle cx="84" cy="141" r="13" fill="#E6F7E0" stroke="#3FA34D" stroke-width="3" /><path d="M77 141 L83 147 L92 134" fill="none" stroke="#3FA34D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" class="pulse"/><text x="112" y="146" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2B2F4A" text-anchor="start" >Use words that paint pictures</text><circle cx="84" cy="183" r="13" fill="#E6F7E0" stroke="#3FA34D" stroke-width="3" /><path d="M77 183 L83 189 L92 176" fill="none" stroke="#3FA34D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" class="pulse"/><text x="112" y="188" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2B2F4A" text-anchor="start" >Be brief</text><g class="write" ><g transform="translate(330,200) rotate(-45) scale(0.6)" ><rect x="-4" y="-34" width="8" height="52" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" /><path d="M-4 18 L4 18 L0 30 Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><rect x="-4" y="-34" width="8" height="10" rx="3" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" /></g></g></svg>