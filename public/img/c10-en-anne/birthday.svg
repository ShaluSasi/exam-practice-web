troke-width="1.5" style="animation-delay:0.0s"/><rect x="183.0" y="108" width="6" height="20" rx="2" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" /><ellipse class="flick" cx="186.0" cy="101" rx="4" ry="6" fill="#FFD23F" stroke="#FF8A1F" stroke-width="1.5" style="animation-delay:0.2s"/><rect x="197.0" y="108" width="6" height="20" rx="2" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" /><ellipse class="flick" cx="200.0" cy="101" rx="4" ry="6" fill="#FFD23F" stroke="#FF8A1F" stroke-width="1.5" style="animation-delay:0.4s"/><rect x="211.0" y="108" width="6" height="20" rx="2" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2" /><ellipse class="flick" cx="214.0" cy="101" rx="4" ry="6" fill="#FFD23F" stroke="#FF8A1F" stroke-width="1.5" style="animation-delay:0.6000000000000001s"/><rect x="225.0" y="108" width="6" height="20" rx="2" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" /><ellipse class="flick" cx="228.0" cy="101" rx="4" ry="6" fill="#FFD23F" stroke="#FF8A1F" stroke-width="1.5" style="animation-delay:0.8s"/><rect x="168" y="162" width="64" height="8" rx="3" fill="#E4E4EE" stroke="#2B2F4A" stroke-width="3" /><rect x="298" y="128" width="54" height="40" rx="4" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="3" /><rect x="320" y="128" width="10" height="40" rx="0" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2.5" /><rect x="298" y="142" width="54" height="8" rx="0" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2.5" /><path d="M325 128 Q310 108 322 110 Q326 112 325 128 Q340 108 328 110" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></svg>