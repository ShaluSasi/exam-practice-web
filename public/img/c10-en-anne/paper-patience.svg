<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A calm, smiling sheet of paper beside an impatient person and a clock</title><style>
.bob{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-4px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(5deg)}}
.flick{animation:flick 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{50%{transform:scale(1.15,.88);opacity:.85}}
.wig{animation:wig .5s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes wig{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.pop{animation:pop 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1.08);opacity:1}}
.rise{animation:rise 3.5s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-26px);opacity:0}}
.swim{animation:swim 5s ease-in-out infinite alternate}
@keyframes swim{to{transform:translateX(16px)}}
.write{animation:write 2s ease-in-out infinite}
@keyframes write{50%{transform:translate(10px,3px)}}
.spin{animation:spin 8s linear infinite;transform-box:view-box}
@keyframes spin{to{transform:rotate(360deg)}}
.ripple{animation:ripple 3s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ripple{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.5);opacity:0}}
.nod{animation:nod 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes nod{50%{transform:rotate(-6deg)}}
.drop{animation:drop 2s ease-in infinite}
@keyframes drop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><g class="bob"><rect x="40" y="50" width="120" height="150" rx="8" fill="#fff" stroke="#2B2F4A" stroke-width="4" /><line x1="58" y1="90" x2="142" y2="90" stroke="#B8BCD0" stroke-width="3" stroke-linecap="round" /><line x1="58" y1="112" x2="130" y2="112" stroke="#B8BCD0" stroke-width="3" stroke-linecap="round" /><line x1="58" y1="134" x2="140" y2="134" stroke="#B8BCD0" stroke-width="3" stroke-linecap="round" /></g><circle cx="95" cy="72" r="1.8" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="0" /><circle cx="105" cy="72" r="1.8" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="0" /><path d="M95 78 Q100 84 105 78" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="100" cy="178" r="0.1" fill="none" stroke="none" stroke-width="0" /><g transform="translate(300,210) scale(1.3)" ><path d="M-8 0 L-8 18 M8 0 L8 18" fill="none" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="-13" y="-34" width="26" height="36" rx="9" fill="#E5484D" stroke="#2B2F4A" stroke-width="3"/><line x1="-13" y1="-26" x2="-22" y2="-12" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="13" y1="-26" x2="22" y2="-12" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><circle cx="0" cy="-48" r="14" fill="#FFD9B3" stroke="#2B2F4A" stroke-width="3" /><path d="M-14 -50 Q-12 -64 0 -63 Q12 -64 14 -50 Q6 -56 -14 -50 Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="-5" cy="-49" r="1.8" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="0" /><circle cx="5" cy="-49" r="1.8" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="0" /><line x1="-8" y1="-54" x2="-2" y2="-51" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="8" y1="-54" x2="2" y2="-51" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="-4" y1="-41" x2="4" y2="-41" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /></g><g class="wig" ><path d="M330 110 l10 -6 M334 126 l12 0" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><circle cx="230" cy="70" r="22" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><line x1="230" y1="70" x2="230" y2="54" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><g class="spin" style="transform-origin:230px 70px"><line x1="230" y1="70" x2="245" y2="70" stroke="#E5484D" stroke-width="2" stroke-linecap="round" /></g><rect x="250" y="20" width="120" height="30" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><path d="M258 49 L264 59 L272 49" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><rect x="259" y="46" width="12" height="6" fill="#fff"/><text x="310.0" y="39.5" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Hurry up!</text><text x="100" y="222" font-family="sans-serif" font-size="13" font-weight="bold" fill="#3FA34D" text-anchor="middle" >calm paper</text></svg>