<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A timeline of events in Anne's early life from 1926 to the start of the diary</title><style>
.bob{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-4px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(5deg)}}
.flick{animation:flick 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{50%{transform:scale(1.15,.88);opacity:.85}}
.wig{animation:wig .5s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes wig{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.pop{animation:pop 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1.08);opacity:1}}
.rise{animation:rise 3.5s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-26px);opacity:0}}
.swim{animation:swim 5s ease-in-out infinite alternate}
@keyframes swim{to{transform:translateX(16px)}}
.write{animation:write 2s ease-in-out infinite}
@keyframes write{50%{transform:translate(10px,3px)}}
.spin{animation:spin 8s linear infinite;transform-box:view-box}
@keyframes spin{to{transform:rotate(360deg)}}
.ripple{animation:ripple 3s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ripple{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.5);opacity:0}}
.nod{animation:nod 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes nod{50%{transform:rotate(-6deg)}}
.drop{animation:drop 2s ease-in infinite}
@keyframes drop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><line x1="30" y1="130" x2="370" y2="130" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round" /><circle cx="50" cy="130" r="7" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" /><line x1="50" y1="130" x2="50" y2="118" stroke="#B8BCD0" stroke-width="2" stroke-linecap="round" /><text x="50" y="96" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >1926</text><text x="50" y="112" font-family="sans-serif" font-size="11" font-weight="normal" fill="#555B7A" text-anchor="middle" >Margot born</text><circle cx="110" cy="130" r="7" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" /><line x1="110" y1="130" x2="110" y2="154" stroke="#B8BCD0" stroke-width="2" stroke-linecap="round" /><text x="110" y="178" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >1929</text><text x="110" y="190" font-family="sans-serif" font-size="11" font-weight="normal" fill="#555B7A" text-anchor="middle" >Anne born</text><circle cx="170" cy="130" r="7" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" /><line x1="170" y1="130" x2="170" y2="118" stroke="#B8BCD0" stroke-width="2" stroke-linecap="round" /><text x="170" y="96" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >1933</text><text x="170" y="112" font-family="sans-serif" font-size="11" font-weight="normal" fill="#555B7A" text-anchor="middle" >Father to Holland</text><circle cx="230" cy="130" r="7" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="3" /><line x1="230" y1="130" x2="230" y2="154" stroke="#B8BCD0" stroke-width="2" stroke-linecap="round" /><text x="230" y="178" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >1941</text><text x="230" y="190" font-family="sans-serif" font-size="11" font-weight="normal" fill="#555B7A" text-anchor="middle" >Grandma ill</text><circle cx="290" cy="130" r="7" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" /><line x1="290" y1="130" x2="290" y2="118" stroke="#B8BCD0" stroke-width="2" stroke-linecap="round" /><text x="290" y="96" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Jan 1942</text><text x="290" y="112" font-family="sans-serif" font-size="11" font-weight="normal" fill="#555B7A" text-anchor="middle" >Grandma dies</text><circle cx="350" cy="130" r="7" fill="#FFD23F" stroke="#2B2F4A" stroke-width="3" /><line x1="350" y1="130" x2="350" y2="154" stroke="#B8BCD0" stroke-width="2" stroke-linecap="round" /><text x="350" y="178" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >20 Jun 1942</text><text x="350" y="190" font-family="sans-serif" font-size="11" font-weight="normal" fill="#555B7A" text-anchor="middle" >Diary begins</text><g class="bob" ><text x="200" y="36" font-family="sans-serif" font-size="16" font-weight="bold" fill="#7C5CFF" text-anchor="middle" >Anne's life sketch</text></g></svg>