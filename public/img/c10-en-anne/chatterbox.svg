round" /><circle cx="-5" cy="-49" r="1.8" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="0" /><circle cx="5" cy="-49" r="1.8" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="0" /><line x1="-4" y1="-41" x2="4" y2="-41" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /></g><g class="rise" style="animation-delay:0.0s"><rect x="40" y="40" width="76" height="30" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><path d="M48 69 L54 79 L62 69" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><rect x="49" y="66" width="12" height="6" fill="#fff"/><text x="78.0" y="59.5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Quack!</text></g><g class="rise" style="animation-delay:0.8s"><rect x="110" y="28" width="76" height="30" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><path d="M118 57 L124 67 L132 57" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><rect x="119" y="54" width="12" height="6" fill="#fff"/><text x="148.0" y="47.5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Quack!</text></g><g class="rise" style="animation-delay:1.6s"><rect x="180" y="52" width="76" height="30" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><path d="M188 81 L194 91 L202 81" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><rect x="189" y="78" width="12" height="6" fill="#fff"/><text x="218.0" y="71.5" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2B2F4A" text-anchor="middle" >Quack!</text></g><rect x="268" y="70" width="54" height="30" rx="4" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><line x1="276" y1="80" x2="314" y2="80" stroke="#B8BCD0" stroke-width="2" stroke-linecap="round" /><line x1="276" y1="90" x2="304" y2="90" stroke="#B8BCD0" stroke-width="2" stroke-linecap="round" /></svg>