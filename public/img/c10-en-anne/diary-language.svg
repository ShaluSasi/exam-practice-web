<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A diary page showing typical diary language: dropped subjects, fragments, short forms and speech-like phrases</title><style>
.bob{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-4px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(5deg)}}
.flick{animation:flick 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{50%{transform:scale(1.15,.88);opacity:.85}}
.wig{animation:wig .5s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes wig{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.pop{animation:pop 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1.08);opacity:1}}
.rise{animation:rise 3.5s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-26px);opacity:0}}
.swim{animation:swim 5s ease-in-out infinite alternate}
@keyframes swim{to{transform:translateX(16px)}}
.write{animation:write 2s ease-in-out infinite}
@keyframes write{50%{transform:translate(10px,3px)}}
.spin{animation:spin 8s linear infinite;transform-box:view-box}
@keyframes spin{to{transform:rotate(360deg)}}
.ripple{animation:ripple 3s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ripple{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.5);opacity:0}}
.nod{animation:nod 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes nod{50%{transform:rotate(-6deg)}}
.drop{animation:drop 2s ease-in infinite}
@keyframes drop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="40" y="14" width="320" height="212" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="4" /><text x="60" y="54" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2B2F4A" text-anchor="start" >Got up late.</text><rect x="250" y="34" width="94" height="28" rx="8" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5" /><text x="297" y="53" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0B93D4" text-anchor="middle" >no subject</text><line x1="60" y1="66" x2="230" y2="66" stroke="#CFE3F5" stroke-width="2" stroke-linecap="round" /><text x="60" y="100" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2B2F4A" text-anchor="start" >...too bad, boring</text><rect x="250" y="80" width="94" height="28" rx="8" fill="#FFE9C7" stroke="#2B2F4A" stroke-width="2.5" /><text x="297" y="99" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FF8A1F" text-anchor="middle" >fragment</text><line x1="60" y1="112" x2="230" y2="112" stroke="#CFE3F5" stroke-width="2" stroke-linecap="round" /><text x="60" y="146" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2B2F4A" text-anchor="start" >can't, didn't, I've</text><rect x="250" y="126" width="94" height="28" rx="8" fill="#E6F7E0" stroke="#2B2F4A" stroke-width="2.5" /><text x="297" y="145" font-family="sans-serif" font-size="12" font-weight="bold" fill="#3FA34D" text-anchor="middle" >short forms</text><line x1="60" y1="158" x2="230" y2="158" stroke="#CFE3F5" stroke-width="2" stroke-linecap="round" /><text x="60" y="192" font-family="sans-serif" font-size="17" font-weight="bold" fill="#2B2F4A" text-anchor="start" >What a day!</text><rect x="250" y="172" width="94" height="28" rx="8" fill="#EFE9FF" stroke="#2B2F4A" stroke-width="2.5" /><text x="297" y="191" font-family="sans-serif" font-size="12" font-weight="bold" fill="#7C5CFF" text-anchor="middle" >speech-like</text><line x1="60" y1="204" x2="230" y2="204" stroke="#CFE3F5" stroke-width="2" stroke-linecap="round" /><g class="write" ><g transform="translate(332,208) rotate(-40) scale(0.6)" ><rect x="-4" y="-34" width="8" height="52" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" /><path d="M-4 18 L4 18 L0 30 Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><rect x="-4" y="-34" width="8" height="10" rx="3" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" /></g></g></svg>