<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A handwritten diary page with a pen</title><style>
.bob{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-4px)}}
.sway{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{50%{transform:rotate(5deg)}}
.flick{animation:flick 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{50%{transform:scale(1.15,.88);opacity:.85}}
.wig{animation:wig .5s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes wig{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.pop{animation:pop 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%,100%{transform:scale(.92);opacity:.7}50%{transform:scale(1.08);opacity:1}}
.rise{animation:rise 3.5s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-26px);opacity:0}}
.swim{animation:swim 5s ease-in-out infinite alternate}
@keyframes swim{to{transform:translateX(16px)}}
.write{animation:write 2s ease-in-out infinite}
@keyframes write{50%{transform:translate(10px,3px)}}
.spin{animation:spin 8s linear infinite;transform-box:view-box}
@keyframes spin{to{transform:rotate(360deg)}}
.ripple{animation:ripple 3s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ripple{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.5);opacity:0}}
.nod{animation:nod 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes nod{50%{transform:rotate(-6deg)}}
.drop{animation:drop 2s ease-in infinite}
@keyframes drop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(14px);opacity:0}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="70" y="14" width="260" height="212" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="4" /><line x1="88" y1="70" x2="312" y2="70" stroke="#CFE3F5" stroke-width="2" stroke-linecap="round" /><line x1="88" y1="84" x2="312" y2="84" stroke="#CFE3F5" stroke-width="2" stroke-linecap="round" /><line x1="88" y1="98" x2="312" y2="98" stroke="#CFE3F5" stroke-width="2" stroke-linecap="round" /><line x1="88" y1="112" x2="312" y2="112" stroke="#CFE3F5" stroke-width="2" stroke-linecap="round" /><line x1="88" y1="126" x2="312" y2="126" stroke="#CFE3F5" stroke-width="2" stroke-linecap="round" /><line x1="88" y1="140" x2="312" y2="140" stroke="#CFE3F5" stroke-width="2" stroke-linecap="round" /><line x1="88" y1="154" x2="312" y2="154" stroke="#CFE3F5" stroke-width="2" stroke-linecap="round" /><line x1="88" y1="168" x2="312" y2="168" stroke="#CFE3F5" stroke-width="2" stroke-linecap="round" /><line x1="88" y1="182" x2="312" y2="182" stroke="#CFE3F5" stroke-width="2" stroke-linecap="round" /><line x1="88" y1="196" x2="312" y2="196" stroke="#CFE3F5" stroke-width="2" stroke-linecap="round" /><path d="M92 84 q10 -6 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 M92 112 q10 -6 20 0 t20 0 t20 0 t20 0 t20 0 M92 140 q10 -6 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0" fill="none" stroke="#6C7399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><g class="write" ><g transform="translate(344,140) rotate(-40) scale(0.7)" ><rect x="-4" y="-34" width="8" height="52" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" /><path d="M-4 18 L4 18 L0 30 Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><rect x="-4" y="-34" width="8" height="10" rx="3" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" /></g></g></svg>