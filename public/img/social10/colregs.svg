<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" role="img">
<title>Two ships seen from above on paths that cross, each showing coloured side lights</title>
<style>
.a{animation:a 5s ease-in-out infinite alternate}@keyframes a{from{transform:translateY(30px)}to{transform:translateY(-20px)}}
.b{animation:b 5s ease-in-out infinite alternate}@keyframes b{from{transform:translateX(40px)}to{transform:translateX(-30px)}}
.bl{animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="8" y="8" width="464" height="244" rx="12" fill="#5BB5E8"/>
<path d="M150 250V20M470 120H20" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="8 8" opacity=".7"/>
<circle cx="150" cy="120" r="20" fill="none" stroke="#F6C453" stroke-width="3" stroke-dasharray="5 5"/>
<g class="a"><g transform="translate(150 200)"><path d="M0 -40Q12 -24 12 0V30H-12V0Q-12 -24 0 -40Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><rect x="-7" y="4" width="14" height="14" rx="2" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.5"/><circle cx="-12" cy="-6" r="4" fill="#E5484D" stroke="#2B2F4A" stroke-width="1"/><circle cx="12" cy="-6" r="4" fill="#3FA34D" stroke="#2B2F4A" stroke-width="1"/></g></g>
<g class="b"><g transform="translate(330 120) rotate(-90)"><path d="M0 -40Q12 -24 12 0V30H-12V0Q-12 -24 0 -40Z" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><rect x="-7" y="4" width="14" height="14" rx="2" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.5"/><circle cx="-12" cy="-6" r="4" fill="#E5484D" stroke="#2B2F4A" stroke-width="1"/><circle cx="12" cy="-6" r="4" fill="#3FA34D" stroke="#2B2F4A" stroke-width="1"/></g></g>
<g class="bl"><circle cx="440" cy="40" r="8" fill="#F6C453"/></g>
<path d="M410 40H426M454 40H470M440 10V26M440 54V70" stroke="#F6C453" stroke-width="3" stroke-linecap="round"/>
</svg>
