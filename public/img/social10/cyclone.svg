<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" role="img">
<title>A huge spinning storm cloud seen from above over a warm sea</title>
<style>
.cy{animation:spin 6s linear infinite reverse;transform-box:view-box;transform-origin:200px 112px}@keyframes spin{to{transform:rotate(360deg)}}
.ht{animation:ht 2s ease-in-out infinite}@keyframes ht{0%{transform:translateY(6px);opacity:0}50%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<defs><linearGradient id="ws" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5BB5E8"/><stop offset="1" stop-color="#F6A35C"/></linearGradient></defs>
<rect x="8" y="8" width="384" height="264" rx="12" fill="url(#ws)"/>
<circle cx="200" cy="112" r="100" fill="#FFFFFF" opacity=".18"/><g class="cy"><path d="M200 112m0 -14Q270 82 292 132Q270 192 210 198" transform="rotate(0 200 112)" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity=".8"/><path d="M200 112m0 -14Q270 82 292 132Q270 192 210 198" transform="rotate(72 200 112)" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity=".8"/><path d="M200 112m0 -14Q270 82 292 132Q270 192 210 198" transform="rotate(144 200 112)" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity=".8"/><path d="M200 112m0 -14Q270 82 292 132Q270 192 210 198" transform="rotate(216 200 112)" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity=".8"/><path d="M200 112m0 -14Q270 82 292 132Q270 192 210 198" transform="rotate(288 200 112)" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity=".8"/><circle cx="200" cy="112" r="50" fill="#FFFFFF" opacity=".75"/></g>
<circle cx="200" cy="112" r="12" fill="#3E8FC9" stroke="#FFFFFF" stroke-width="3"/>
<g class="ht" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round"><path d="M60 262Q54 252 60 242Q66 232 60 222"/><path d="M330 262Q324 252 330 242Q336 232 330 222"/><path d="M110 262Q104 252 110 242Q116 232 110 222"/><path d="M290 262Q284 252 290 242Q296 232 290 222"/></g>
</svg>
