<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" role="img">
<title>A coast and sea fitted with instruments: a satellite, a buoy, a sensor on the sea floor, a tide gauge, a seismic station and a warning centre</title>
<style>
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.bob{animation:bob 2.6s ease-in-out infinite}.sg{animation:sg 1.6s linear infinite}@keyframes sg{from{stroke-dashoffset:0}to{stroke-dashoffset:-24}}
.rg{animation:rg 2s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes rg{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
.ph{animation:ph 1.2s ease-in-out infinite}@keyframes ph{50%{opacity:.3}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
