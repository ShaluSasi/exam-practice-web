<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" role="img">
<title>Two cold, high-latitude coasts side by side, labelled Coast X and Coast Y</title>
<style>
@keyframes fl{to{stroke-dashoffset:-40}}.fl{stroke-dasharray:14 6;animation:fl 1.6s linear infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.bob{animation:bob 2.6s ease-in-out infinite}.ib{animation:ib 3s ease-in-out infinite}@keyframes ib{50%{transform:translateY(3px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
