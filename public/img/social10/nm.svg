<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" role="img">
<title>A globe with a tiny arc of latitude enlarged into a measured distance at sea</title>
<style>
.sl{animation:sl 4s ease-in-out infinite}@keyframes sl{0%,10%{transform:translateX(0)}90%,100%{transform:translateX(150px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="120" cy="140" r="100" fill="#9FD3F0" stroke="#0B6FA4" stroke-width="3"/>
<path d="M20 140H220" stroke="#2B2F4A" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M40 80Q120 90 200 80M40 200Q120 210 200 200" fill="none" stroke="#FFFFFF" stroke-width="2"/>
<path d="M120 140L200.9 81.2M120 140L191.9 70.5" stroke="#2B2F4A" stroke-width="1.5" stroke-dasharray="3 4"/>
<path d="M200.9 81.2A100 100 0 0 0 191.9 70.5" fill="none" stroke="#E5484D" stroke-width="7" stroke-linecap="round"/>
<path d="M200.9 81.2L262 150M191.9 70.5L262 92" stroke="#E5484D" stroke-width="1.5" stroke-dasharray="4 4"/>
<rect x="262" y="70" width="200" height="110" rx="12" fill="#CDEBFA" stroke="#0B6FA4" stroke-width="2.5"/>
<path d="M285 150H435M285 142V158M435 142V158" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/>
<g class="sl"><g transform="translate(285 126) scale(0.5)" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"><path d="M-30 0H30L38 -10V-14H-38V-10Z" fill="#FF8A1F"/><rect x="-24" y="-26" width="14" height="12" fill="#F6C453"/><rect x="-8" y="-26" width="14" height="12" fill="#0B93D4"/><rect x="14" y="-32" width="12" height="18" fill="#FFFFFF"/></g></g>
<text x="362" y="174" text-anchor="middle" font-size="13" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">1 nautical mile = 1,852 m</text>
<text x="362" y="62" text-anchor="middle" font-size="13" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">1 minute of latitude</text>
</svg>
