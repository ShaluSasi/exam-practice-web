<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" role="img">
<title>The Sun, the Earth with its oceans, and four possible positions of the Moon on its orbit</title>
<style>
.ray{animation:ray 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes ray{0%,100%{transform:scale(1);opacity:.7}50%{transform:scale(1.12);opacity:1}}
.bl{animation:bl 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bl{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.08)}}
.tw{animation:tw 2.5s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="6" y="6" width="468" height="248" rx="12" fill="#26294A"/>
