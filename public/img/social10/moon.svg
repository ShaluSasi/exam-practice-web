<g class="ray"><circle cx="55" cy="130" r="54" fill="#F6C453" opacity=".35"/></g>
<circle cx="55" cy="130" r="40" fill="#F6C453" stroke="#E0A030" stroke-width="3"/>
<circle cx="290" cy="130" r="105" fill="none" stroke="#A3A8CC" stroke-width="2" stroke-dasharray="6 7"/>
<g class="bl"><ellipse cx="290" cy="130" rx="46" ry="35" fill="#7FD0FF" opacity=".55" stroke="#BFE6FA" stroke-width="2"/></g>
<circle cx="290" cy="130" r="30" fill="#0B93D4" stroke="#BFE6FA" stroke-width="2.5"/>
