<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 260" role="img">
<title>A cross-section of the sea with a jolt on the sea floor and a wave heading towards a coast</title>
<style>
.tw{animation:tw 4s ease-in infinite}@keyframes tw{0%{transform:translateX(0) scaleY(.5);opacity:.2}80%{opacity:1}100%{transform:translateX(220px) scaleY(1.4);opacity:1}}
.qk{animation:qk .5s linear infinite alternate}@keyframes qk{to{transform:translate(2px,-2px)}}
.bs{animation:bs 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bs{50%{transform:scale(1.25)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
