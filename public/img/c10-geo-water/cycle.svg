<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Water cycle: sun heats the sea, vapour rises to form clouds, rain falls on land, runs off into rivers and soaks into groundwater</title><style>.fl{stroke-dasharray:7 7;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.rn{animation:rn 1.2s linear infinite}@keyframes rn{0%{transform:translateY(-6px);opacity:1}100%{transform:translateY(16px);opacity:0}}.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.4s ease-in-out infinite}@keyframes pu{50%{transform:scale(1.14)}}.sp{transform-box:fill-box;transform-origin:center;animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.rs{transform-box:fill-box;transform-origin:bottom;animation:rs 3s ease-in-out infinite}@keyframes rs{0%{transform:scaleY(.6)}60%,100%{transform:scaleY(1)}}.dn{animation:dn 3s ease-in-out infinite}@keyframes dn{0%{transform:translateY(0)}70%,100%{transform:translateY(22px)}}.up{animation:up 3s ease-in-out infinite}@keyframes up{0%{transform:translateY(0)}70%,100%{transform:translateY(-14px)}}.sw{animation:sw 2.5s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="0" y="0" width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="240" rx="16" fill="#E3F2FD"/><path d="M0 175 L150 175 L150 240 L0 240 Z" fill="#7FC8F0" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 182 q8.125 -5 16.25 0 t16.25 0 q8.125 -5 16.25 0 t16.25 0 q8.125 -5 16.25 0 t16.25 0 q8.125 -5 16.25 0 t16.25 0" fill="none" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polygon points="150,172 205,152 260,135 330,138 400,150 400,240 150,240" fill="#9AD27B" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><rect x="150" y="198" width="250" height="42" rx="0" fill="#D9B38C"/><rect x="165" y="214" width="235" height="17" rx="8" fill="#7FC8F0"/><path d="M172 224 q9.166666666666666 -5 18.333333333333332 0 t18.333333333333332 0 q9.166666666666666 -5 18.333333333333332 0 t18.333333333333332 0 q9.166666666666666 -5 18.333333333333332 0 t18.333333333333332 0 q9.166666666666666 -5 18.333333333333332 0 t18.333333333333332 0 q9.166666666666666 -5 18.333333333333332 0 t18.333333333333332 0 q9.166666666666666 -5 18.333333333333332 0 t18.333333333333332 0" fill="none" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(45,40)"><g class="sp"><line x1="0" y1="-20" x2="0" y2="-27" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" transform="rotate(0)"/><line x1="0" y1="-20" x2="0" y2="-27" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" transform="rotate(45)"/><line x1="0" y1="-20" x2="0" y2="-27" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" transform="rotate(90)"/><line x1="0" y1="-20" x2="0" y2="-27" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" transform="rotate(135)"/><line x1="0" y1="-20" x2="0" y2="-27" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" transform="rotate(180)"/><line x1="0" y1="-20" x2="0" y2="-27" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" transform="rotate(225)"/><line x1="0" y1="-20" x2="0" y2="-27" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" transform="rotate(270)"/><line x1="0" y1="-20" x2="0" y2="-27" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" transform="rotate(315)"/></g><circle cx="0" cy="0" r="14" fill="#FFD25A" stroke="#FF8A1F" stroke-width="3"/></g><g transform="translate(240,45) scale(1.5)"><circle cx="-13" cy="2" r="10" fill="#fff" stroke="#8FA6C0" stroke-width="4"/><circle cx="0" cy="-6" r="14" fill="#fff" stroke="#8FA6C0" stroke-width="4"/><circle cx="14" cy="2" r="11" fill="#fff" stroke="#8FA6C0" stroke-width="4"/><rect x="-23" y