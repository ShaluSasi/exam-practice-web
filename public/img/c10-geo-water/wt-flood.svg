<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>Groundwater reaching the surface and flooding the land</title><style>.fl{stroke-dasharray:7 7;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.rn{animation:rn 1.2s linear infinite}@keyframes rn{0%{transform:translateY(-6px);opacity:1}100%{transform:translateY(16px);opacity:0}}.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.4s ease-in-out infinite}@keyframes pu{50%{transform:scale(1.14)}}.sp{transform-box:fill-box;transform-origin:center;animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.rs{transform-box:fill-box;transform-origin:bottom;animation:rs 3s ease-in-out infinite}@keyframes rs{0%{transform:scaleY(.6)}60%,100%{transform:scaleY(1)}}.dn{animation:dn 3s ease-in-out infinite}@keyframes dn{0%{transform:translateY(0)}70%,100%{transform:translateY(22px)}}.up{animation:up 3s ease-in-out infinite}@keyframes up{0%{transform:translateY(0)}70%,100%{transform:translateY(-14px)}}.sw{animation:sw 2.5s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="0" y="0" width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="200" height="150" rx="12" fill="#E3F2FD"/><rect x="0" y="30" width="200" height="120" rx="0" fill="#C9A27A"/><rect x="0" y="30" width="200" height="8" rx="0" fill="#9AD27B"/><rect x="0" y="33" width="200" height="117" rx="0" fill="#7FC8F0"/><path d="M0 35 q6.25 -5 12.5 0 t12.5 0 q6.25 -5 12.5 0 t12.5 0 q6.25 -5 12.5 0 t12.5 0 q6.25 -5 12.5 0 t12.5 0 q6.25 -5 12.5 0 t12.5 0 q6.25 -5 12.5 0 t12.5 0 q6.25 -5 12.5 0 t12.5 0 q6.25 -5 12.5 0 t12.5 0" fill="none" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="0" y1="33" x2="200" y2="33" stroke="#2B2F4A" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5 4"/><rect x="96" y="38" width="8" height="100" rx="2" fill="#8E8E9E" stroke="#2B2F4A" stroke-width="1"/><rect x="86" y="18" width="28" height="20" rx="3" fill="#E5484D" stroke="#2B2F4A" stroke-width="3"/><ellipse cx="60" cy="30" rx="40" ry="7" fill="#7FC8F0" stroke="#0B93D4" stroke-width="2"/><ellipse cx="150" cy="30" rx="34" ry="6" fill="#7FC8F0" stroke="#0B93D4" stroke-width="2"/></svg>