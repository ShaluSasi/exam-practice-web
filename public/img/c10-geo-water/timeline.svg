<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A time arrow with four water structures: a flood-water channel, a dam, a large lake and a masonry tank</title><style>.fl{stroke-dasharray:7 7;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.rn{animation:rn 1.2s linear infinite}@keyframes rn{0%{transform:translateY(-6px);opacity:1}100%{transform:translateY(16px);opacity:0}}.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.4s ease-in-out infinite}@keyframes pu{50%{transform:scale(1.14)}}.sp{transform-box:fill-box;transform-origin:center;animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.rs{transform-box:fill-box;transform-origin:bottom;animation:rs 3s ease-in-out infinite}@keyframes rs{0%{transform:scaleY(.6)}60%,100%{transform:scaleY(1)}}.dn{animation:dn 3s ease-in-out infinite}@keyframes dn{0%{transform:translateY(0)}70%,100%{transform:translateY(22px)}}.up{animation:up 3s ease-in-out infinite}@keyframes up{0%{transform:translateY(0)}70%,100%{transform:translateY(-14px)}}.sw{animation:sw 2.5s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="0" y="0" width="100%" height="100%" rx="16" fill="#FFF9EE"/><line x1="24" y1="130" x2="372" y2="130" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round"/><polygon points="384,130 370,122 370,138" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1" stroke-linejoin="round"/><text x="40" y="28" font-size="12" fill="#FF8A1F" text-anchor="middle" font-weight="bold" font-family="sans-serif">Earlier</text><text x="360" y="28" font-size="12" fill="#FF8A1F" text-anchor="middle" font-weight="bold" font-family="sans-serif">Later</text><circle cx="70" cy="130" r="7" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2"/><circle cx="160" cy="130" r="7" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2"/><circle cx="250" cy="130" r="7" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2"/><circle cx="340" cy="130" r="7" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2"/><rect x="46" y="70" width="48" height="30" rx="2" fill="#C8A24A" stroke="#2B2F4A" stroke-width="3"/><rect x="52" y="78" width="36" height="14" rx="0" fill="#7FC8F0"/><path d="M52 86 q9 -6 18 0 t18 0" fill="none" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polygon points="140,100 148,70 172,70 180,100" fill="#B8B8C8" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><rect x="120" y="82" width="22" height="18" rx="0" fill="#7FC8F0"/><rect x="176" y="88" width="22" height="12" rx="0" fill="#7FC8F0"/><ellipse cx="250" cy="88" rx="30" ry="14" fill="#7FC8F0" stroke="#2B2F4A" stroke-width="2"/><path d="M228 88 q3.6666666666666665 -5 7.333333333333333 0 t7.333333333333333 0 q3.6666666666666665 -5 7.333333333333333 0 t7.333333333333333 0 q3.6666666666666665 -5 7.333333333333333 0 t7.333333333333333 0" fill="none" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(222,78) scale(0.5)"><rect x="-3" y="0" width="6" height="16" rx="1" fill="#C9A27A" stroke="#2B2F4A" stroke-width="2"/><circle cx="0" cy="-8" r="13" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2"/></g><g transform="translate(280,76) scale(0.5)"><rect x="-3" y="0" width="6" height="16" rx="1" fill="#C9A27A" stroke="#2B2F4A" stroke-width="2"/><circle cx="0" cy="-8" r="13" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2"/></g><rect x="322" y="76" width="36" height="24" rx="3" fill="#7FC8F0" stroke="#2B2F4A" stroke-width="3"/><line x1="322" y1="84" x2="358" y2="84" stroke="#2B2F4A" stroke-width="1.5" stroke-linecap="round"/><line x1="322" y1="92" x2="358" y2="92" stroke="#2B2F4A" stroke-width="1.5" stroke-linecap="round"/><rect x="316" y="100" width="48" height="8" rx="2" fill="#B8B8C8" stroke="#2B2F4A" stroke-width="2"/><text x="200" y="175" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="normal" font-family="sans-serif">Water structures built in different periods</text><text x="200" y="189" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="normal" font-family="sans-serif">of ancient and medieval India</text></svg>