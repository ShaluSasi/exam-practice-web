<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Left: canals bringing water to every field. Right: drip pipes giving water drop by drop to plant roots</title><style>.fl{stroke-dasharray:7 7;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.rn{animation:rn 1.2s linear infinite}@keyframes rn{0%{transform:translateY(-6px);opacity:1}100%{transform:translateY(16px);opacity:0}}.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.4s ease-in-out infinite}@keyframes pu{50%{transform:scale(1.14)}}.sp{transform-box:fill-box;transform-origin:center;animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.rs{transform-box:fill-box;transform-origin:bottom;animation:rs 3s ease-in-out infinite}@keyframes rs{0%{transform:scaleY(.6)}60%,100%{transform:scaleY(1)}}.dn{animation:dn 3s ease-in-out infinite}@keyframes dn{0%{transform:translateY(0)}70%,100%{transform:translateY(22px)}}.up{animation:up 3s ease-in-out infinite}@keyframes up{0%{transform:translateY(0)}70%,100%{transform:translateY(-14px)}}.sw{animation:sw 2.5s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="0" y="0" width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="240" rx="16" fill="#E3F2FD"/><rect x="0" y="150" width="400" height="90" rx="0" fill="#9AD27B"/><rect x="10" y="100" width="180" height="12" rx="2" fill="#7FC8F0" stroke="#2B2F4A" stroke-width="3"/><path d="M14 106 L186 106" fill="none" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="fl"/><rect x="14" y="160" width="38" height="60" rx="2" fill="#8BC34A" stroke="#2B2F4A" stroke-width="3"/><line x1="33" y1="112" x2="33" y2="160" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" class="fl"/><rect x="58" y="160" width="38" height="60" rx="2" fill="#8BC34A" stroke="#2B2F4A" stroke-width="3"/><line x1="77" y1="112" x2="77" y2="160" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" class="fl"/><rect x="102" y="160" width="38" height="60" rx="2" fill="#8BC34A" stroke="#2B2F4A" stroke-width="3"/><line x1="121" y1="112" x2="121" y2="160" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" class="fl"/><rect x="146" y="160" width="38" height="60" rx="2" fill="#8BC34A" stroke="#2B2F4A" stroke-width="3"/><line x1="165" y1="112" x2="165" y2="160" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" class="fl"/><text x="100" y="90" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">Water reaches every farm</text><rect x="215" y="20" width="2" height="200" rx="0" fill="#D8DCEA"/><rect x="240" y="150" width="150" height="60" rx="0" fill="#8BC34A"/><line x1="250" y1="130" x2="380" y2="130" stroke="#5A5A72" stroke-width="5" stroke-linecap="round"/><g transform="translate(275,180) scale(1.2)"><line x1="0" y1="14" x2="0" y2="-2" stroke="#3FA34D" stroke-width="3" stroke-linecap="round"/><ellipse cx="-6" cy="-3" rx="6" ry="3.5" fill="#9AD27B" stroke="#3FA34D" stroke-width="2" transform="rotate(-30 -6 -3)"/><ellipse cx="6" cy="-6" rx="6" ry="3.5" fill="#9AD27B" stroke="#3FA34D" stroke-width="2" transform="rotate(30 6 -6)"/></g><g class="rn" style="animation-delay:0.0s"><g transform="translate(275,144) scale(0.5)"><path d="M0 -11 C6 -3 10 2 10 6 A10 10 0 0 1 -10 6 C-10 2 -6 -3 0 -11 Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><line x1="275" y1="130" x2="275" y2="135" stroke="#5A5A72" stroke-width="4" stroke-linecap="round"/><g transform="translate(320,180) scale(1.2)"><line x1="0" y1="14" x2="0" y2="-2" stroke="#3FA34D" stroke-width="3" stroke-linecap="round"/><ellipse cx="-6" cy="-3" rx="6" ry="3.5" fill="#9AD27B" stroke="#3FA34D" stroke-width="2" transform="rotate(-30 -6 -3)"/><ellipse cx="6" cy="-6" rx="6" ry="3.5" fill="#9AD27B" stroke="#3FA34D" stroke-width="2" transform="rotate(30 6 -6)"/></g><g class="rn" style="animation-delay:0.3s"><g transform="translate(320,144) scale(0.5)"><path d="M0 -11 C6 -3 10 2 10 6 A10 10 0 0 1 -10 6 C-10 2 -6 -3 0 -11 Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><line x1="320" y1="130" x2="320" y2="135" stroke="#5A5A72" stroke-width="4" stroke-linecap="round"/><g transform="translate(365,180) scale(1.2)"><line x1="0" y1="14" x2="0" y2="-2" stroke="#3FA34D" stroke-width="3" stroke-linecap="round"/><ellipse cx="-6" cy="-3" rx="6" ry="3.5" fill="#9AD27B" stroke="#3FA34D" stroke-width="2" transform="rotate(-30 -6 -3)"/><ellipse cx="6" cy="-6" rx="6" ry="3.5" fill="#9AD27B" stroke="#3FA34D" stroke-width="2" transform="rotate(30 6 -6)"/></g><g class="rn" style="animation-delay:0.6s"><g transform="translate(365,144) scale(0.5)"><path d="M0 -11 C6 -3 10 2 10 6 A10 10 0 0 1 -10 6 C-10 2 -6 -3 0 -11 Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><line x1="365" y1="130" x2="365" y2="135" stroke="#5A5A72" stroke-width="4" stroke-linecap="round"/><text x="315" y="108" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">Every drop gives more crop</text></svg>