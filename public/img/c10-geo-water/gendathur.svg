<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Flow of figures for rooftop harvesting at Gendathur: 1,000 mm rain, 80 per cent collected, about 10 fillings, about 50,000 litres per house</title><style>.fl{stroke-dasharray:7 7;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.rn{animation:rn 1.2s linear infinite}@keyframes rn{0%{transform:translateY(-6px);opacity:1}100%{transform:translateY(16px);opacity:0}}.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.4s ease-in-out infinite}@keyframes pu{50%{transform:scale(1.14)}}.sp{transform-box:fill-box;transform-origin:center;animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.rs{transform-box:fill-box;transform-origin:bottom;animation:rs 3s ease-in-out infinite}@keyframes rs{0%{transform:scaleY(.6)}60%,100%{transform:scaleY(1)}}.dn{animation:dn 3s ease-in-out infinite}@keyframes dn{0%{transform:translateY(0)}70%,100%{transform:translateY(22px)}}.up{animation:up 3s ease-in-out infinite}@keyframes up{0%{transform:translateY(0)}70%,100%{transform:translateY(-14px)}}.sw{animation:sw 2.5s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="0" y="0" width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="8" y="60" width="90" height="70" rx="12" fill="#fff" stroke="#D8DCEA" stroke-width="2"/><text x="53" y="92" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">1,000 mm</text><text x="53" y="112" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="normal" font-family="sans-serif">rain a year</text><line x1="98" y1="95" x2="103.0" y2="95.0" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round"/><polygon points="106,95 97.9,98.9 97.9,91.1" fill="#FF8A1F" stroke="#FF8A1F" stroke-width="1" stroke-linejoin="round"/><rect x="106" y="60" width="90" height="70" rx="12" fill="#fff" stroke="#D8DCEA" stroke-width="2"/><text x="151" y="92" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">80%</text><text x="151" y="112" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="normal" font-family="sans-serif">collected</text><line x1="196" y1="95" x2="201.0" y2="95.0" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round"/><polygon points="204,95 195.9,98.9 195.9,91.1" fill="#FF8A1F" stroke="#FF8A1F" stroke-width="1" stroke-linejoin="round"/><rect x="204" y="60" width="90" height="70" rx="12" fill="#fff" stroke="#D8DCEA" stroke-width="2"/><text x="249" y="92" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">About 10</text><text x="249" y="112" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="normal" font-family="sans-serif">fillings</text><line x1="294" y1="95" x2="299.0" y2="95.0" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round"/><polygon points="302,95 293.9,98.9 293.9,91.1" fill="#FF8A1F" stroke="#FF8A1F" stroke-width="1" stroke-linejoin="round"/><rect x="302" y="60" width="90" height="70" rx="12" fill="#fff" stroke="#D8DCEA" stroke-width="2"/><text x="347" y="92" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">~50,000 L</text><text x="347" y="112" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="normal" font-family="sans-serif">per house</text><g transform="translate(60,36) scale(0.8)"><circle cx="-13" cy="2" r="10" fill="#fff" stroke="#8FA6C0" stroke-width="4"/><circle cx="0" cy="-6" r="14" fill="#fff" stroke="#8FA6C0" stroke-width="4"/><circle cx="14" cy="2" r="11" fill="#fff" stroke="#8FA6C0" stroke-width="4"/><rect x="-23" y="2" width="48" height="11" rx="5" fill="#fff" stroke="#8FA6C0" stroke-width="4"/><circle cx="-13" cy="2" r="10" fill="#fff"/><circle cx="0" cy="-6" r="14" fill="#fff"/><circle cx="14" cy="2" r="11" fill="#fff"/><rect x="-23" y="2" width="48" height="11" rx="5" fill="#fff"/></g><text x="200" y="20" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">Rooftop harvesting in a Karnataka village</text><g transform="translate(26,190) scale(0.7)"><rect x="-18" y="-2" width="36" height="24" rx="2" fill="#FFE8C2" stroke="#2B2F4A" stroke-width="2"/><polygon points="-23,-2 0,-20 23,-2" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><rect x="-4" y="8" width="8" height="14" rx="1" fill="#8A5A2B" stroke="#2B2F4A" stroke-width="2"/></g><g transform="translate(70,190) scale(0.7)"><rect x="-18" y="-2" width="36" height="24" rx="2" fill="#FFE8C2" stroke="#2B2F4A" stroke-width="2"/><polygon points="-23,-2 0,-20 23,-2" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><rect x="-4" y="8" width="8" height="14" rx="1" fill="#8A5A2B" stroke="#2B2F4A" stroke-width="2"/></g><g transform="translate(114,190) scale(0.7)"><rect x="-18" y="-2" width="36" height="24" rx="2" fill="#FFE8C2" stroke="#2B2F4A" stroke-width="2"/><polygon points="-23,-2 0,-20 23,-2" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><rect x="-4" y="8" width="8" height="14" rx="1" fill="#8A5A2B" stroke="#2B2F4A" stroke-width="2"/></g><g transform="translate(158,190) scale(0.7)"><rect x="-18" y="-2" width="36" height="24" rx="2" fill="#FFE8C2" stroke="#2B2F4A" stroke-width="2"/><polygon points="-23,-2 0,-20 23,-2" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><rect x="-4" y="8" width="8" height="14" rx="1" fill="#8A5A2B" stroke="#2B2F4A" stroke-width="2"/></g><g transform="translate(202,190) scale(0.7)"><rect x="-18" y="-2" width="36" height="24" rx="2" fill="#FFE8C2" stroke="#2B2F4A" stroke-width="2"/><polygon points="-23,-2 0,-20 23,-2" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><rect x="-4" 