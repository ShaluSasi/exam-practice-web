<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>Underground water level higher, with an upward arrow</title><style>.fl{stroke-dasharray:7 7;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.rn{animation:rn 1.2s linear infinite}@keyframes rn{0%{transform:translateY(-6px);opacity:1}100%{transform:translateY(16px);opacity:0}}.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.4s ease-in-out infinite}@keyframes pu{50%{transform:scale(1.14)}}.sp{transform-box:fill-box;transform-origin:center;animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.rs{transform-box:fill-box;transform-origin:bottom;animation:rs 3s ease-in-out infinite}@keyframes rs{0%{transform:scaleY(.6)}60%,100%{transform:scaleY(1)}}.dn{animation:dn 3s ease-in-out infinite}@keyframes dn{0%{transform:translateY(0)}70%,100%{transform:translateY(22px)}}.up{animation:up 3s ease-in-out infinite}@keyframes up{0%{transform:translateY(0)}70%,100%{transform:translateY(-14px)}}.sw{animation:sw 2.5s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="0" y="0" width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="200" height="150" rx="12" fill="#E3F2FD"/><rect x="0" y="30" width="200" height="120" rx="0" fill="#C9A27A"/><rect x="0" y="30" width="200" height="8" rx="0" fill="#9AD27B"/><rect x="0" y="62" width="200" height="88" rx="0" fill="#7FC8F0"/><path d="M0 64 q6.25 -5 12.5 0 t12.5 0 q6.25 -5 12.5 0 t12.5 0 q6.25 -5 12.5 0 t12.5 0 q6.25 -5 12.5 0 t12.5 0 q6.25 -5 12.5 0 t12.5 0 q6.25 -5 12.5 0 t12.5 0 q6.25 -5 12.5 0 t12.5 0 q6.25 -5 12.5 0 t12.5 0" fill="none" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="0" y1="62" x2="200" y2="62" stroke="#2B2F4A" stroke-width="1.5" 