<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Water from a bamboo pipe narrowing from 18 to 20 litres at the entry to 20 to 80 drops a minute at the plant</title><style>.fl{stroke-dasharray:7 7;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.rn{animation:rn 1.2s linear infinite}@keyframes rn{0%{transform:translateY(-6px);opacity:1}100%{transform:translateY(16px);opacity:0}}.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.4s ease-in-out infinite}@keyframes pu{50%{transform:scale(1.14)}}.sp{transform-box:fill-box;transform-origin:center;animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.rs{transform-box:fill-box;transform-origin:bottom;animation:rs 3s ease-in-out infinite}@keyframes rs{0%{transform:scaleY(.6)}60%,100%{transform:scaleY(1)}}.dn{animation:dn 3s ease-in-out infinite}@keyframes dn{0%{transform:translateY(0)}70%,100%{transform:translateY(22px)}}.up{animation:up 3s ease-in-out infinite}@keyframes up{0%{transform:translateY(0)}70%,100%{transform:translateY(-14px)}}.sw{animation:sw 2.5s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="0" y="0" width="100%" height="100%" rx="16" fill="#FFF9EE"/><g transform="translate(60,100) scale(3)"><path d="M0 -11 C6 -3 10 2 10 6 A10 10 0 0 1 -10 6 C-10 2 -6 -3 0 -11 Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="60" y="168" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">18 to 20 litres enter</text><text x="60" y="184" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">the bamboo pipe</text><polygon points="100,82 290,108 290,122 100,142" fill="#C8A24A" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><polygon points="104,90 286,112 286,118 104,134" fill="#7FC8F0" stroke-linejoin="round"/><path d="M110 112 L280 114" fill="none" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="fl"/><text x="195" y="66" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">Carried by gravity over hundreds of metres</text><g transform="translate(340,190) scale(1.8)"><line x1="0" y1="14" x2="0" y2="-2" stroke="#3FA34D" stroke-width="3" stroke-linecap="round"/><ellipse cx="-6" cy="-3" rx="6" ry="3.5" fill="#9AD27B" stroke="#3FA34D" stroke-width="2" transform="rotate(-30 -6 -3)"/><ellipse cx="6" cy="-6" rx="6" ry="3.5" fill="#9AD27B" stroke="#3FA34D" stroke-width="2" transform="rotate(30 6 -6)"/></g><g class="rn" style="animation-delay:0.0s"><g transform="translate(334,140) scale(0.35)"><path d="M0 -11 C6 -3 10 2 10 6 A10 10 0 0 1 -10 6 C-10 2 -6 -3 0 -11 Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><g class="rn" style="animation-delay:0.4s"><g transform="translate(346,146) scale(0.35)"><path d="M0 -11 C6 -3 10 2 10 6 A10 10 0 0 1 -10 6 C-10 2 -6 -3 0 -11 Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="300" y="226" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">20 to 80 drops a minute</text></svg>