<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A leaking tap with water running to waste down a drain</title><style>.fl{stroke-dasharray:7 7;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.rn{animation:rn 1.2s linear infinite}@keyframes rn{0%{transform:translateY(-6px);opacity:1}100%{transform:translateY(16px);opacity:0}}.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.4s ease-in-out infinite}@keyframes pu{50%{transform:scale(1.14)}}.sp{transform-box:fill-box;transform-origin:center;animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.rs{transform-box:fill-box;transform-origin:bottom;animation:rs 3s ease-in-out infinite}@keyframes rs{0%{transform:scaleY(.6)}60%,100%{transform:scaleY(1)}}.dn{animation:dn 3s ease-in-out infinite}@keyframes dn{0%{transform:translateY(0)}70%,100%{transform:translateY(22px)}}.up{animation:up 3s ease-in-out infinite}@keyframes up{0%{transform:translateY(0)}70%,100%{transform:translateY(-14px)}}.sw{animation:sw 2.5s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="0" y="0" width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="200" height="150" rx="12" fill="#E3F2FD"/><rect x="0" y="125" width="200" height="25" rx="0" fill="#9AA0B8"/><g transform="translate(90,60) scale(2.2)"><rect x="-14" y="-10" width="28" height="8" rx="3" fill="#B8BCCB" stroke="#2B2F4A" stroke-width="2"/><rect x="8" y="-10" width="8" height="18" rx="2" fill="#B8BCCB" stroke="#2B2F4A" stroke-width="2"/><rect x="-4" y="-18" width="8" height="8" rx="2" fill="#E5484D" stroke="#2B2F4A" stroke-width="2"/><g class="rn"><g transform="translate(12,14) scale(0.5)"><path d="M0 -11 C6 -3 10 2 10 6 A10 10 0 0 1 -10 6 C-10 2 -6 -3 0 -11 Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><ellipse cx="100" cy="130" rx="40" ry="8" fill="#7FC8F0" stroke="#0B93D4" stroke-width="2"/><line x1="100" y1="85" x2="100" y2="125" stroke="#0B93D4" stroke-width="4" stroke-linecap="round" class="fl"/><line x1="150" y1="135" x2="187.0" y2="135.0" stroke="#E5484D" stroke-width="3" stroke-linecap="round"/><polygon points="190,135 181.9,138.9 181.9,131.1" fill="#E5484D" stroke="#E5484D" stroke-width="1" stroke-linejoin="round"/></svg>