<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A house whose roof pipe feeds an underground tank</title><style>.fl{stroke-dasharray:7 7;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.rn{animation:rn 1.2s linear infinite}@keyframes rn{0%{transform:translateY(-6px);opacity:1}100%{transform:translateY(16px);opacity:0}}.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.4s ease-in-out infinite}@keyframes pu{50%{transform:scale(1.14)}}.sp{transform-box:fill-box;transform-origin:center;animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.rs{transform-box:fill-box;transform-origin:bottom;animation:rs 3s ease-in-out infinite}@keyframes rs{0%{transform:scaleY(.6)}60%,100%{transform:scaleY(1)}}.dn{animation:dn 3s ease-in-out infinite}@keyframes dn{0%{transform:translateY(0)}70%,100%{transform:translateY(22px)}}.up{animation:up 3s ease-in-out infinite}@keyframes up{0%{transform:translateY(0)}70%,100%{transform:translateY(-14px)}}.sw{animation:sw 2.5s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="0" y="0" width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="200" height="150" rx="12" fill="#E3F2FD"/><rect x="0" y="100" width="200" height="50" rx="0" fill="#C9A27A"/><rect x="0" y="96" width="200" height="6" rx="0" fill="#9AD27B"/><g transform="translate(60,70) scale(1.4)"><rect x="-18" y="-2" width="36" height="24" rx="2" fill="#FFE8C2" stroke="#2B2F4A" stroke-width="2"/><polygon points="-23,-2 0,-20 23,-2" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><rect x="-4" y="8" width="8" height="14" rx="1" fill="#8A5A2B" stroke="#2B2F4A" stroke-width="2"/></g><path d="M92 54 L110 54 L110 112" fill="none" stroke="#E8E8F0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="100" y="112" width="90" height="32" rx="3" fill="#fff" stroke="#2B2F4A" stroke-width="5"/><rect x="104" y="124" width="82" height="18" rx="0" fill="#7FC8F0"/><g transform="translate(60,18) scale(0.8)"><circle cx="-13" cy="2" r="10" fill="#fff" stroke="#8FA6C0" stroke-width="4"/><circle cx="0" cy="-6" r="14" fill="#fff" stroke="#8FA6C0" stroke-width="4"/><circle cx="14" cy="2" r="11" fill="#fff" stroke="#8FA6C0" stroke-width="4"/><rect x="-23" y="2" width="48" height="11" rx="5" fill="#fff" stroke="#8FA6C0" stroke-width="4"/><circle cx="-13" cy="2" r="10" fill="#fff"/><circle cx="0" cy="-6" r="14" fill="#fff"/><circle cx="14" cy="2" r="11" fill="#fff"/><rect x="-23" y="2" width="48" height="11" rx="5" fill="#fff"/></g></svg>