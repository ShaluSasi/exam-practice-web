<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Sediment piles up on the reservoir floor behind a dam while the river below carries little silt</title><style>.fl{stroke-dasharray:7 7;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.rn{animation:rn 1.2s linear infinite}@keyframes rn{0%{transform:translateY(-6px);opacity:1}100%{transform:translateY(16px);opacity:0}}.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.4s ease-in-out infinite}@keyframes pu{50%{transform:scale(1.14)}}.sp{transform-box:fill-box;transform-origin:center;animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.rs{transform-box:fill-box;transform-origin:bottom;animation:rs 3s ease-in-out infinite}@keyframes rs{0%{transform:scaleY(.6)}60%,100%{transform:scaleY(1)}}.dn{animation:dn 3s ease-in-out infinite}@keyframes dn{0%{transform:translateY(0)}70%,100%{transform:translateY(22px)}}.up{animation:up 3s ease-in-out infinite}@keyframes up{0%{transform:translateY(0)}70%,100%{transform:translateY(-14px)}}.sw{animation:sw 2.5s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="0" y="0" width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="240" rx="16" fill="#E3F2FD"/><rect x="0" y="190" width="400" height="50" rx="0" fill="#C9A27A"/><rect x="10" y="90" width="180" height="100" rx="0" fill="#7FC8F0"/><rect x="250" y="160" width="140" height="30" rx="0" fill="#7FC8F0"/><g class="rs"><polygon points="10,190 10,150 80,140 190,120 190,190" fill="#8B6B3E" stroke-linejoin="round"/></g><g class="sw"><circle cx="30" cy="100" r="3.5" fill="#8B6B3E"/></g><g class="sw"><circle cx="50" cy="108" r="3.5" fill="#8B6B3E"/></g><g class="sw"><circle cx="70" cy="116" r="3.5" fill="#8B6B3E"/></g><g class="sw"><circle cx="90" cy="100" r="3.5" fill="#8B6B3E"/></g><g class="sw"><circle cx="110" cy="108" r="3.5" fill="#8B6B3E"/></g><g class="sw"><circle cx="130" cy="116" r="3.5" fill="#8B6B3E"/></g><g class="sw"><circle cx="150" cy="100" r="3.5" fill="#8B6B3E"/></g><polygon points="185,90 230,90 250,190 170,190" fill="#B8B8C8" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><text x="98" y="176" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold" font-family="sans-serif">Sediment settles</text><text x="98" y="70" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">Reservoir</text><text x="320" y="150" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">Clear water, little silt</text><path d="M255 175 L385 175" fill="none" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="fl"/></svg>