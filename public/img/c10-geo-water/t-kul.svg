<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A diversion channel on a hillside leading to a round village tank</title><style>.fl{stroke-dasharray:7 7;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.rn{animation:rn 1.2s linear infinite}@keyframes rn{0%{transform:translateY(-6px);opacity:1}100%{transform:translateY(16px);opacity:0}}.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.4s ease-in-out infinite}@keyframes pu{50%{transform:scale(1.14)}}.sp{transform-box:fill-box;transform-origin:center;animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.rs{transform-box:fill-box;transform-origin:bottom;animation:rs 3s ease-in-out infinite}@keyframes rs{0%{transform:scaleY(.6)}60%,100%{transform:scaleY(1)}}.dn{animation:dn 3s ease-in-out infinite}@keyframes dn{0%{transform:translateY(0)}70%,100%{transform:translateY(22px)}}.up{animation:up 3s ease-in-out infinite}@keyframes up{0%{transform:translateY(0)}70%,100%{transform:translateY(-14px)}}.sw{animation:sw 2.5s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="0" y="0" width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="200" height="150" rx="12" fill="#E3F2FD"/><polygon points="0,40 60,60 120,100 200,110 200,150 0,150" fill="#9AD27B" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><path d="M20 36 L70 66 L120 98 L150 108" fill="none" stroke="#7FC8F0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 36 L70 66 L120 98 L150 108" fill="none" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="fl"/><ellipse cx="165" cy="122" rx="22" ry="12" fill="#7FC8F0" stroke="#2B2F4A" stroke-width="2"/><g transform="translate(60,110) scale(0.6)"><rect x="-18" y="-2" width="36" height="24" rx="2" fill="#FFE8C2" stroke="#2B2F4A" stroke-width="2"/><polygon points="-23,-2 0,-20 23,-2" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><rect x="-4" y="8" width="8" height="14" rx="1" fill="#8A5A2B" stroke="#2B2F4A" stroke-width="2"/></g><g transform="translate(95,118) scale(0.5)"><rect x="-18" y="-2" width="36" height="24" rx="2" fill="#FFE8C2" stroke="#2B2F4A" stroke-width="2"/><polygon points="-23,-2 0,-20 23,-2" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><rect x="-4" y="8" width="8" height="14" rx="1" fill="#8A5A2B" stroke="#2B2F4A" stroke-width="2"/></g></svg>