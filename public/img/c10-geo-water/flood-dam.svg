<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Heavy rain fills a reservoir that is full of silt; water spills over the dam and floods the houses downstream</title><style>.fl{stroke-dasharray:7 7;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.rn{animation:rn 1.2s linear infinite}@keyframes rn{0%{transform:translateY(-6px);opacity:1}100%{transform:translateY(16px);opacity:0}}.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.4s ease-in-out infinite}@keyframes pu{50%{transform:scale(1.14)}}.sp{transform-box:fill-box;transform-origin:center;animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.rs{transform-box:fill-box;transform-origin:bottom;animation:rs 3s ease-in-out infinite}@keyframes rs{0%{transform:scaleY(.6)}60%,100%{transform:scaleY(1)}}.dn{animation:dn 3s ease-in-out infinite}@keyframes dn{0%{transform:translateY(0)}70%,100%{transform:translateY(22px)}}.up{animation:up 3s ease-in-out infinite}@keyframes up{0%{transform:translateY(0)}70%,100%{transform:translateY(-14px)}}.sw{animation:sw 2.5s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="0" y="0" width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="240" rx="16" fill="#CFD8E8"/><g transform="translate(80,30) scale(1.8)"><circle cx="-13" cy="2" r="10" fill="#8FA0BC" stroke="#6B7C99" stroke-width="4"/><circle cx="0" cy="-6" r="14" fill="#8FA0BC" stroke="#6B7C99" stroke-width="4"/><circle cx="14" cy="2" r="11" fill="#8FA0BC" stroke="#6B7C99" stroke-width="4"/><rect x="-23" y="2" width="48" height="11" rx="5" fill="#8FA0BC" stroke="#6B7C99" stroke-width="4"/><circle cx="-13" cy="2" r="10" fill="#8FA0BC"/><circle cx="0" cy="-6" r="14" fill="#8FA0BC"/><circle cx="14" cy="2" r="11" fill="#8FA0B