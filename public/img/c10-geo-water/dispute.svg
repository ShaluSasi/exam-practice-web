<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>An abstract diagram: a dam upstream diverts a big share of river water to a project, leaving less flow for two downstream states</title><style>.fl{stroke-dasharray:7 7;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.rn{animation:rn 1.2s linear infinite}@keyframes rn{0%{transform:translateY(-6px);opacity:1}100%{transform:translateY(16px);opacity:0}}.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.4s ease-in-out infinite}@keyframes pu{50%{transform:scale(1.14)}}.sp{transform-box:fill-box;transform-origin:center;animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.rs{transform-box:fill-box;transform-origin:bottom;animation:rs 3s ease-in-out infinite}@keyframes rs{0%{transform:scaleY(.6)}60%,100%{transform:scaleY(1)}}.dn{animation:dn 3s ease-in-out infinite}@keyframes dn{0%{transform:translateY(0)}70%,100%{transform:translateY(22px)}}.up{animation:up 3s ease-in-out infinite}@keyframes up{0%{transform:translateY(0)}70%,100%{transform:translateY(-14px)}}.sw{animation:sw 2.5s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="0" y="0" width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="14" y="14" width="130" height="50" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="3"/><text x="79" y="36" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">Upstream state</text><text x="79" y="52" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="normal" font-family="sans-serif">builds a project</text><rect x="14" y="100" width="24" height="60" rx="2" fill="#8E8E9E" stroke="#2B2F4A" stroke-width="3"/><path d="M0 130 L14 130" fill="none" stroke="#0B93D4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M38 118 C80 118 120 120 190 150 S 300 180 380 160" fill="none" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="fl"/><path d="M38 108 C110 70 200 70 280 74" fill="none" stroke="#FF8A1F" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" class="fl"/><text x="262" y="46" font-size="11" fill="#FF8A1F" text-anchor="middle" font-weight="bold" font-family="sans-serif">Water diverted for the project</text><rect x="264" y="62" width="120" height="26" rx="8" fill="#FFE8C2" stroke="#2B2F4A" stroke-width="2"/><text x="324" y="80" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">Project / canal</text><rect x="130" y="196" width="120" height="34" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="3"/><text x="190" y="217" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">Downstream state A</text><rect x="270" y="196" width="120" height="34" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="3"/><text x="330" y="217" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">Downstream state B</text><text x="110" y="144" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">Big flow</text><text x="300" y="148" font-size="11" fill="#E5484D" text-anchor="middle" font-weight="bold" font-family="sans-serif">Less flow downstream</text></svg>