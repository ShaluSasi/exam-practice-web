<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Four village and town scenes: an underground tank, a house with a rule tick, a rainy rooftop, and a village of tanks</title><style>.fl{stroke-dasharray:7 7;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.rn{animation:rn 1.2s linear infinite}@keyframes rn{0%{transform:translateY(-6px);opacity:1}100%{transform:translateY(16px);opacity:0}}.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.4s ease-in-out infinite}@keyframes pu{50%{transform:scale(1.14)}}.sp{transform-box:fill-box;transform-origin:center;animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.rs{transform-box:fill-box;transform-origin:bottom;animation:rs 3s ease-in-out infinite}@keyframes rs{0%{transform:scaleY(.6)}60%,100%{transform:scaleY(1)}}.dn{animation:dn 3s ease-in-out infinite}@keyframes dn{0%{transform:translateY(0)}70%,100%{transform:translateY(22px)}}.up{animation:up 3s ease-in-out infinite}@keyframes up{0%{transform:translateY(0)}70%,100%{transform:translateY(-14px)}}.sw{animation:sw 2.5s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="0" y="0" width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="8" y="14" width="92" height="210" rx="12" fill="#fff" stroke="#D8DCEA" stroke-width="2"/><rect x="18" y="100" width="72" height="50" rx="3" fill="#fff" stroke="#2B2F4A" stroke-width="5"/><rect x="22" y="122" width="64" height="24" rx="0" fill="#7FC8F0"/><rect x="44" y="80" width="20" height="20" rx="2" fill="#C9A27A" stroke="#2B2F4A" stroke-width="2"/><rect x="106" y="14" width="92" height="210" rx="12" fill="#fff" stroke="#D8DCEA" stroke-width="2"/><g transform="translate(152,90) scale(1.3)"><rect x="-18" y="-2" width="36" height="24" rx="2" fill="#FFE8C2" stroke