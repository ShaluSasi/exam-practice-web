<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Left: tap water brought by a perennial canal. Right: old underground tanks, now used less but still kept</title><style>.fl{stroke-dasharray:7 7;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.rn{animation:rn 1.2s linear infinite}@keyframes rn{0%{transform:translateY(-6px);opacity:1}100%{transform:translateY(16px);opacity:0}}.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.4s ease-in-out infinite}@keyframes pu{50%{transform:scale(1.14)}}.sp{transform-box:fill-box;transform-origin:center;animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.rs{transform-box:fill-box;transform-origin:bottom;animation:rs 3s ease-in-out infinite}@keyframes rs{0%{transform:scaleY(.6)}60%,100%{transform:scaleY(1)}}.dn{animation:dn 3s ease-in-out infinite}@keyframes dn{0%{transform:translateY(0)}70%,100%{transform:translateY(22px)}}.up{animation:up 3s ease-in-out infinite}@keyframes up{0%{transform:translateY(0)}70%,100%{transform:translateY(-14px)}}.sw{animation:sw 2.5s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="0" y="0" width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="8" y="10" width="188" height="220" rx="12" fill="#fff" stroke="#D8DCEA" stroke-width="2"/><text x="102" y="32" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">Canal water</text><rect x="20" y="60" width="164" height="22" rx="2" fill="#7FC8F0" stroke="#2B2F4A" stroke-width="4"/><path d="M26 71 L178 71" fill="none" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="fl"/><g transform="translate(60,140) scale(1.7)"><rect x="-14" y="-10" width="28" height="8" rx="3" fill="#B8BCCB" stroke="#2B2F4A" stroke-width="2"/><rect x="8" y="-10" width="8" height="18" rx="2" fill="#B8BCCB" stroke="#2B2F4A" stroke-width="2"/><rect x="-4" y="-18" width="8" height="8" rx="2" fill="#E5484D" stroke="#2B2F4A" stroke-width="2"/><g class="rn"><g transform="translate(12,14) scale(0.5)"><path d="M0 -11 C6 -3 10 2 10 6 A10 10 0 0 1 -10 6 C-10 2 -6 -3 0 -11 Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><g transform="translate(130,130) scale(1.4)"><rect x="-18" y="-2" width="36" height="24" rx="2" fill="#FFE8C2" stroke="#2B2F4A" stroke-width="2"/><polygon points="-23,-2 0,-20 23,-2" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><rect x="-4" y="8" width="8" height="14" rx="1" fill="#8A5A2B" stroke="#2B2F4A" stroke-width="2"/></g><text x="102" y="200" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="normal" font-family="sans-serif">Water through the year</text><rect x="204" y="10" width="188" height="220" rx="12" fill="#fff" stroke="#D8DCEA" stroke-width="2"/><text x="298" y="32" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">Old tankas</text><g transform="translate(298,100) scale(1.5)"><rect x="-18" y="-2" width="36" height="24" rx="2" fill="#FFE8C2" stroke="#2B2F4A" stroke-width="2"/><polygon points="-23,-2 0,-20 23,-2" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><rect x="-4" y="8" width="8" height="14" rx="1" fill="#8A5A2B" stroke="#2B2F4A" stroke-width="2"/></g><rect x="240" y="140" width="116" height="40" rx="4" fill="#F4F4F8" stroke="#B8BCCB" stroke-width="3" stroke-dasharray="6 5"/><rect x="244" y="160" width="108" height="18" rx="3" fill="#CFE8F7"/><text x="298" y="205" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="normal" font-family="sans-serif">Used less, some still kept</text></svg>