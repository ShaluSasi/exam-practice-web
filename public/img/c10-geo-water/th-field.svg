<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A farm field being irrigated by a sprinkler</title><style>.fl{stroke-dasharray:7 7;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.rn{animation:rn 1.2s linear infinite}@keyframes rn{0%{transform:translateY(-6px);opacity:1}100%{transform:translateY(16px);opacity:0}}.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.4s ease-in-out infinite}@keyframes pu{50%{transform:scale(1.14)}}.sp{transform-box:fill-box;transform-origin:center;animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.rs{transform-box:fill-box;transform-origin:bottom;animation:rs 3s ease-in-out infinite}@keyframes rs{0%{transform:scaleY(.6)}60%,100%{transform:scaleY(1)}}.dn{animation:dn 3s ease-in-out infinite}@keyframes dn{0%{transform:translateY(0)}70%,100%{transform:translateY(22px)}}.up{animation:up 3s ease-in-out infinite}@keyframes up{0%{transform:translateY(0)}70%,100%{transform:translateY(-14px)}}.sw{animation:sw 2.5s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="0" y="0" width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="200" height="150" rx="12" fill="#E3F2FD"/><rect x="0" y="95" width="200" height="55" rx="0" fill="#8BC34A"/><line x1="10" y1="98" x2="10" y2="146" stroke="#3FA34D" stroke-width="2" stroke-linecap="round"/><line x1="28" y1="98" x2="28" y2="146" stroke="#3FA34D" stroke-width="2" stroke-linecap="round"/><line x1="46" y1="98" x2="46" y2="146" stroke="#3FA34D" stroke-width="2" stroke-linecap="round"/><line x1="64" y1="98" x2="64" y2="146" stroke="#3FA34D" stroke-width="2" stroke-linecap="round"/><line x1="82" y1="98" x2="82" y2="146" stroke="#3FA34D" stroke-width="2" stroke-linecap="round"/><line x1="100" y1="98" x2="100" y2