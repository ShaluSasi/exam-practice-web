<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Four traditional water structures: stone rubble dam, reservoir, embankment and canal</title><style>.fl{stroke-dasharray:7 7;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.rn{animation:rn 1.2s linear infinite}@keyframes rn{0%{transform:translateY(-6px);opacity:1}100%{transform:translateY(16px);opacity:0}}.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.4s ease-in-out infinite}@keyframes pu{50%{transform:scale(1.14)}}.sp{transform-box:fill-box;transform-origin:center;animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.rs{transform-box:fill-box;transform-origin:bottom;animation:rs 3s ease-in-out infinite}@keyframes rs{0%{transform:scaleY(.6)}60%,100%{transform:scaleY(1)}}.dn{animation:dn 3s ease-in-out infinite}@keyframes dn{0%{transform:translateY(0)}70%,100%{transform:translateY(22px)}}.up{animation:up 3s ease-in-out infinite}@keyframes up{0%{transform:translateY(0)}70%,100%{transform:translateY(-14px)}}.sw{animation:sw 2.5s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="0" y="0" width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="6" y="14" width="92" height="190" rx="12" fill="#fff" stroke="#D8DCEA" stroke-width="2"/><polygon points="16,110 34,70 70,70 88,110" fill="#B8B8C8" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><circle cx="32" cy="100" r="5" fill="#9AA0B8" stroke="#2B2F4A" stroke-width="1.5"/><circle cx="44" cy="100" r="5" fill="#9AA0B8" stroke="#2B2F4A" stroke-width="1.5"/><circle cx="56" cy="100" r="5" fill="#9AA0B8" stroke="#2B2F4A" stroke-width="1.5"/><circle cx="32" cy="86" r="5" fill="#9AA0B8" stroke="#2B2F4A" stroke-width="1.5"/><circle cx="44" cy="86" r="5" fill="#9AA0B8" stroke="#2B2F4A" stroke-width="1.5"/><text x="52" y="150" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">Stone rubble</text><text x="52" y="166" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">dam</text><rect x="104" y="14" width="92" height="190" rx="12" fill="#fff" stroke="#D8DCEA" stroke-width="2"/><ellipse cx="150" cy="90" rx="38" ry="22" fill="#7FC8F0" stroke="#2B2F4A" stroke-width="2"/><path d="M120 90 q5.0 -5 10.0 0 t10.0 0 q5.0 -5 10.0 0 t10.0 0 q5.0 -5 10.0 0 t10.0 0" fill="none" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(116,66) scale(0.5)"><rect x="-3" y="0" width="6" height="16" rx="1" fill="#C9A27A" stroke="#2B2F4A" stroke-width="2"/><circle cx="0" cy="-8" r="13" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2"/></g><text x="150" y="150" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">Reservoir</text><text x="150" y="166" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">or lake</text><rect x="202" y="14" width="92" height="190" rx="12" fill="#fff" stroke="#D8DCEA" stroke-width="2"/><polygon points="208,110 226,76 270,76 288,110" fill="#A9783A" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><rect x="204" y="86" width="20" height="24" rx="0" fill="#7FC8F0"/><rect x="204" y="106" width="90" height="8" rx="0" fill="#9AD27B"/><text x="248" y="150" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">Embankment</text><rect x="300" y="14" width="92" height="190" rx="12" fill="#fff" stroke="#D8DCEA" stroke-width="2"/><rect x="308" y="78" width="76" height="16" rx="2" fill="#7FC8F0" stroke="#2B2F4A" stroke-width="3"/><line x1="314" y1="86" x2="377.0" y2="86.0" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" class="fl"/><polygon points="380,86 371.9,89.9 371.9,82.1" fill="#0B93D4" stroke="#0B93D4" stroke-width="1" stroke-linejoin="round"/><g transform="translate(320,120) scale(0.7)"><line x1="0" y1="14" x2="0" y2="-2" stroke="#3FA34D" stroke-width="3" stroke-linecap="round"/><ellipse cx="-6" cy="-3" rx="6" ry="3.5" fill="#9AD27B" stroke="#3FA34D" stroke-width="2" transform="rotate(-30 -6 -3)"/><ellipse cx="6" cy="-6" rx="6" ry="3.5" fill="#9AD27B" stroke="#3FA34D" stroke-width="2" transform="rotate(30 6 -6)"/></g><g transform="translate(342,120) scale(0.7)"><line x1="0" y1="14" x2="0" y2="-2" stroke="#3FA34D" stroke-width="3" stroke-linecap="round"/><ellipse cx="-6" cy="-3" rx="6" ry="3.5" fill="#9AD27B" stroke="#3FA34D" stroke-width="2" transform="rotate(-30 -6 -3)"/><ellipse cx="6" cy="-6" rx="6" ry="3.5" fill="#9AD27B" stroke="#3FA34D" stroke-width="2" transform="rotate(30 6 -6)"/></g><g transform="translate(364,120) scale(0.7)"><line x1="0" y1="14" x2="0" y2="-2" stroke="#3FA34D" stroke-width="3" stroke-linecap="round"/><ellipse cx="-6" cy="-3" rx="6" ry="3.5" fill="#9AD27B" stroke="#3FA34D" stroke-width="2" transform="rotate(-30 -6 -3)"/><ellipse cx="6" cy="-6" rx="6" ry="3.5" fill="#9AD27B" stroke="#3FA34D" stroke-width="2" transform="rotate(30 6 -6)"/></g><text x="346" y="150" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">Canal</text><text x="346" y="166" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">for irrigation</text></svg>