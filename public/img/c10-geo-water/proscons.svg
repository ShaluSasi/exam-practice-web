<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A balance scale weighing the benefits of multi-purpose projects against concerns about them</title><style>.fl{stroke-dasharray:7 7;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.rn{animation:rn 1.2s linear infinite}@keyframes rn{0%{transform:translateY(-6px);opacity:1}100%{transform:translateY(16px);opacity:0}}.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.4s ease-in-out infinite}@keyframes pu{50%{transform:scale(1.14)}}.sp{transform-box:fill-box;transform-origin:center;animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.rs{transform-box:fill-box;transform-origin:bottom;animation:rs 3s ease-in-out infinite}@keyframes rs{0%{transform:scaleY(.6)}60%,100%{transform:scaleY(1)}}.dn{animation:dn 3s ease-in-out infinite}@keyframes dn{0%{transform:translateY(0)}70%,100%{transform:translateY(22px)}}.up{animation:up 3s ease-in-out infinite}@keyframes up{0%{transform:translateY(0)}70%,100%{transform:translateY(-14px)}}.sw{animation:sw 2.5s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="0" y="0" width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M200 70 L200 200" fill="none" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="150" y="200" width="100" height="14" rx="2" fill="#8E8E9E" stroke="#2B2F4A" stroke-width="4"/><line x1="80" y1="80" x2="320" y2="70" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round"/><circle cx="200" cy="75" r="8" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2"/><path d="M80 80 L50 140 L110 140 Z" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M320 70 L290 130 L350 130 Z" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="36" y="140" width="90" height="12" rx="2" fill="#B8BCCB" stroke="#2B2F4A" stroke-width="5"/><rect x="276" y="130" width="90" height="12" rx="2" fill="#B8BCCB" stroke="#2B2F4A" stroke-width="5"/><text x="80" y="36" font-size="13" fill="#3FA34D" text-anchor="middle" font-weight="bold" font-family="sans-serif">Benefits</text><text x="320" y="28" font-size="13" fill="#E5484D" text-anchor="middle" font-weight="bold" font-family="sans-serif">Concerns</text><g transform="translate(55,122) scale(0.7)"><polygon points="2,-14 -8,3 -1,3 -4,15 9,-3 1,-3" fill="#FFD25A" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/></g><g transform="translate(80,124) scale(0.8)"><path d="M0 -11 C6 -3 10 2 10 6 A10 10 0 0 1 -10 6 C-10 2 -6 -3 0 -11 Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(105,126) scale(0.8)"><line x1="0" y1="14" x2="0" y2="-2" stroke="#3FA34D" stroke-width="3" stroke-linecap="round"/><ellipse cx="-6" cy="-3" rx="6" ry="3.5" fill="#9AD27B" stroke="#3FA34D" stroke-width="2" transform="rotate(-30 -6 -3)"/><ellipse cx="6" cy="-6" rx="6" ry="3.5" fill="#9AD27B" stroke="#3FA34D" stroke-width="2" transform="rotate(30 6 -6)"/></g><text x="80" y="172" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="normal" font-family="sans-serif">Power, irrigation,</text><text x="80" y="186" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="normal" font-family="sans-serif">flood control</text><text x="320" y="162" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="normal" font-family="sans-serif">Displacement, silt,</text><text x="320" y="176" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="normal" font-family="sans-serif">damaged habitats</text><g transform="translate(300,112) scale(0.55)"><rect x="-18" y="-2" width="36" height="24" rx="2" fill="#FFE8C2" stroke="#2B2F4A" stroke-width="2"/><polygon points="-23,-2 0,-20 23,-2" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><rect x="-4" y="8" width="8" height="14" rx="1" fill="#8A5A2B" stroke="#2B2F4A" stroke-width="2"/></g><line x1="318" y1="112" x2="338" y2="112" stroke="#E5484D" stroke-width="3" stroke-linecap="round"/><circle cx="344" cy="112" r="3" fill="#E5484D"/></svg>