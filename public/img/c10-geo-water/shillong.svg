<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Stacked bar of a household's water need with the rooftop-harvesting share of 15 to 25 per cent, beside heavy rain at Cherrapunjee</title><style>.fl{stroke-dasharray:7 7;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.rn{animation:rn 1.2s linear infinite}@keyframes rn{0%{transform:translateY(-6px);opacity:1}100%{transform:translateY(16px);opacity:0}}.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.4s ease-in-out infinite}@keyframes pu{50%{transform:scale(1.14)}}.sp{transform-box:fill-box;transform-origin:center;animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.rs{transform-box:fill-box;transform-origin:bottom;animation:rs 3s ease-in-out infinite}@keyframes rs{0%{transform:scaleY(.6)}60%,100%{transform:scaleY(1)}}.dn{animation:dn 3s ease-in-out infinite}@keyframes dn{0%{transform:translateY(0)}70%,100%{transform:translateY(22px)}}.up{animation:up 3s ease-in-out infinite}@keyframes up{0%{transform:translateY(0)}70%,100%{transform:translateY(-14px)}}.sw{animation:sw 2.5s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="0" y="0" width="100%" height="100%" rx="16" fill="#FFF9EE"/><g transform="translate(80,60) scale(1.8)"><circle cx="-13" cy="2" r="10" fill="#fff" stroke="#8FA6C0" stroke-width="4"/><circle cx="0" cy="-6" r="14" fill="#fff" stroke="#8FA6C0" stroke-width="4"/><circle cx="14" cy="2" r="11" fill="#fff" stroke="#8FA6C0" stroke-width="4"/><rect x="-23" y="2" width="48" height="11" rx="5" fill="#fff" stroke="#8FA6C0" stroke-width="4"/><circle cx="-13" cy="2" r="10" fill="#fff"/><circle cx="0" cy="-6" r="14" fill="#fff"/><circle cx="14" cy="2" r="11" fill="#fff"/><rect x="-23" y="2" width="48" height="11" rx="5" fill="#fff"/></g><line x1="40" y1="92" x2="36" y2="106" stroke="#0B93D4" stroke-width="3" stroke-linecap="round"/><line x1="54" y1="92" x2="50" y2="106" stroke="#0B93D4" stroke-width="3" stroke-linecap="round"/><line x1="68" y1="92" x2="64" y2="106" stroke="#0B93D4" stroke-width="3" stroke-linecap="round"/><line x1="82" y1="92" x2="78" y2="106" stroke="#0B93D4" stroke-width="3" stroke-linecap="round"/><line x1="96" y1="92" x2="92" y2="106" stroke="#0B93D4" stroke-width="3" stroke-linecap="round"/><line x1="110" y1="92" x2="106" y2="106" stroke="#0B93D4" stroke-width="3" stroke-linecap="round"/><line x1="124" y1="92" x2="120" y2="106" stroke="#0B93D4" stroke-width="3" stroke-linecap="round"/><text x="80" y="140" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="normal" font-family="sans-serif">Cherrapunjee and Mawsynram,</text><text x="80" y="154" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="normal" font-family="sans-serif">55 km from Shillong, get the</text><text x="80" y="168" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="normal" font-family="sans-serif">highest rainfall in the world</text><g transform="translate(60,196) scale(0.9)"><rect x="-18" y="-2" width="36" height="24" rx="2" fill="#FFE8C2" stroke="#2B2F4A" stroke-width="2"/><polygon points="-23,-2 0,-20 23,-2" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><rect x="-4" y="8" width="8" height="14" rx="1" fill="#8A5A2B" stroke="#2B2F4A" stroke-width="2"/></g><text x="60" y="234" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">Shillong</text><rect x="250" y="40" width="56" height="165" rx="3" fill="#E8EAF2" stroke="#2B2F4A" stroke-width="3"/><rect x="250" y="180.25" width="56" height="24.75" rx="3" fill="#3FA34D" stroke="#2B2F4A" stroke-width="0"/><rect x="250" y="163.75" width="56" height="16.5" rx="2" fill="#9AD27B" stroke="#2B2F4A" stroke-width="0"/><text x="340" y="184.25" font-size="12" fill="#2B2F4A" text-anchor="start" font-weight="bold" font-family="sans-serif">15%</text><text x="340" y="167.75" font-size="12" fill="#2B2F4A" text-anchor="start" font-weight="bold" font-family="sans-serif">25%</text><text x="278" y="28" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">Household water need = 100%</text><text x="278" y="224" font-size="11" fill="#3FA34D" text-anchor="middle" font-weight="bold" font-family="sans-serif">Rooftop share: 15 to 25 per cent</text></svg>