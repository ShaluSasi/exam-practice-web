<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A house with a tap</title><style>.fl{stroke-dasharray:7 7;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.rn{animation:rn 1.2s linear infinite}@keyframes rn{0%{transform:translateY(-6px);opacity:1}100%{transform:translateY(16px);opacity:0}}.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.4s ease-in-out infinite}@keyframes pu{50%{transform:scale(1.14)}}.sp{transform-box:fill-box;transform-origin:center;animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.rs{transform-box:fill-box;transform-origin:bottom;animation:rs 3s ease-in-out infinite}@keyframes rs{0%{transform:scaleY(.6)}60%,100%{transform:scaleY(1)}}.dn{animation:dn 3s ease-in-out infinite}@keyframes dn{0%{transform:translateY(0)}70%,100%{transform:translateY(22px)}}.up{animation:up 3s ease-in-out infinite}@keyframes up{0%{transform:translateY(0)}70%,100%{transform:translateY(-14px)}}.sw{animation:sw 2.5s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="0" y="0" width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="200" height="150" rx="12" fill="#E3F2FD"/><g transform="translate(80,80) scale(2.2)"><rect x="-18" y="-2" width="36" height="24" rx="2" fill="#FFE8C2" stroke="#2B2F4A" stroke-width="2"/><polygon points="-23,-2 0,-20 23,-2" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><rect x="-4" y="8" width="8" height="14" rx="1" fill="#8A5A2B" stroke="#2B2F4A" stroke-width="2"/></g><g transform="translate(150,100) scale(1.4)"><rect x="-14" y="-10" width="28" height="8" rx="3" fill="#B8BCCB" stroke="#2B2F4A" stroke-width="2"/><rect x="8" y="-10" width="8" height="18" rx="2" fill="#B8BCCB" stroke="#2B2F4A" stroke-width="2"/><rect x=