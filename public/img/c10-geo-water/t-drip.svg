<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>Drip pipe giving water drop by drop at the roots of plants</title><style>.fl{stroke-dasharray:7 7;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.rn{animation:rn 1.2s linear infinite}@keyframes rn{0%{transform:translateY(-6px);opacity:1}100%{transform:translateY(16px);opacity:0}}.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.4s ease-in-out infinite}@keyframes pu{50%{transform:scale(1.14)}}.sp{transform-box:fill-box;transform-origin:center;animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.rs{transform-box:fill-box;transform-origin:bottom;animation:rs 3s ease-in-out infinite}@keyframes rs{0%{transform:scaleY(.6)}60%,100%{transform:scaleY(1)}}.dn{animation:dn 3s ease-in-out infinite}@keyframes dn{0%{transform:translateY(0)}70%,100%{transform:translateY(22px)}}.up{animation:up 3s ease-in-out infinite}@keyframes up{0%{transform:translateY(0)}70%,100%{transform:translateY(-14px)}}.sw{animation:sw 2.5s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="0" y="0" width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="200" height="150" rx="12" fill="#E3F2FD"/><rect x="0" y="100" width="200" height="50" rx="0" fill="#8BC34A"/><line x1="10" y1="70" x2="190" y2="70" stroke="#5A5A72" stroke-width="5" stroke-linecap="round"/><g transform="translate(40,100) scale(1.1)"><line x1="0" y1="14" x2="0" y2="-2" stroke="#3FA34D" stroke-width="3" stroke-linecap="round"/><ellipse cx="-6" cy="-3" rx="6" ry="3.5" fill="#9AD27B" stroke="#3FA34D" stroke-width="2" transform="rotate(-30 -6 -3)"/><ellipse cx="6" cy="-6" rx="6" ry="3.5" fill="#9AD27B" stroke="#3FA34D" stroke-width="2" transform="rotate(30 6 -6)"/></g><line x1="40" y1="70" x2="40" y2="82" stroke="#5A5A72" stroke-width="3" stroke-linecap="round"/><g class="rn"><g transform="translate(40,90) scale(0.5)"><path d="M0 -11 C6 -3 10 2 10 6 A10 10 0 0 1 -10 6 C-10 2 -6 -3 0 -11 Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(100,100) scale(1.1)"><line x1="0" y1="14" x2="0" y2="-2" stroke="#3FA34D" stroke-width="3" stroke-linecap="round"/><ellipse cx="-6" cy="-3" rx="6" ry="3.5" fill="#9AD27B" stroke="#3FA34D" stroke-width="2" transform="rotate(-30 -6 -3)"/><ellipse cx="6" cy="-6" rx="6" ry="3.5" fill="#9AD27B" stroke="#3FA34D" stroke-width="2" transform="rotate(30 6 -6)"/></g><line x1="100" y1="70" x2="100" y2="82" stroke="#5A5A72" stroke-width="3" stroke-linecap="round"/><g class="rn"><g transform="translate(100,90) scale(0.5)"><path d="M0 -11 C6 -3 10 2 10 6 A10 10 0 0 1 -10 6 C-10 2 -6 -3 0 -11 Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(160,100) scale(1.1)"><line x1="0" y1="14" x2="0" y2="-2" stroke="#3FA34D" stroke-width="3" stroke-linecap="round"/><ellipse cx="-6" cy="-3" rx="6" ry="3.5" fill="#9AD27B" stroke="#3FA34D" stroke-width="2" transform="rotate(-30 -6 -3)"/><ellipse cx="6" cy="-6" rx="6" ry="3.5" fill="#9AD27B" stroke="#3FA34D" stroke-width="2" transform="rotate(30 6 -6)"/></g><line x1="160" y1="70" x2="160" y2="82" stroke="#5A5A72" stroke-width="3" stroke-linecap="round"/><g class="rn"><g transform="translate(160,90) scale(0.5)"><path d="M0 -11 C6 -3 10 2 10 6 A10 10 0 0 1 -10 6 C-10 2 -6 -3 0 -11 Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg>