<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Four cards: health, food security, livelihoods and ecosystems depend on water</title><style>.fl{stroke-dasharray:7 7;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.rn{animation:rn 1.2s linear infinite}@keyframes rn{0%{transform:translateY(-6px);opacity:1}100%{transform:translateY(16px);opacity:0}}.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.4s ease-in-out infinite}@keyframes pu{50%{transform:scale(1.14)}}.sp{transform-box:fill-box;transform-origin:center;animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.rs{transform-box:fill-box;transform-origin:bottom;animation:rs 3s ease-in-out infinite}@keyframes rs{0%{transform:scaleY(.6)}60%,100%{transform:scaleY(1)}}.dn{animation:dn 3s ease-in-out infinite}@keyframes dn{0%{transform:translateY(0)}70%,100%{transform:translateY(22px)}}.up{animation:up 3s ease-in-out infinite}@keyframes up{0%{transform:translateY(0)}70%,100%{transform:translateY(-14px)}}.sw{animation:sw 2.5s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="0" y="0" width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="8" y="8" width="190" height="109" rx="12" fill="#fff" stroke="#D8DCEA" stroke-width="2"/><rect x="91" y="52" width="24" height="8" rx="2" fill="#E5484D" stroke="#2B2F4A" stroke-width="2"/><rect x="99" y="44" width="8" height="24" rx="2" fill="#E5484D" stroke="#2B2F4A" stroke-width="2"/><text x="103" y="100" font-size="14" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">Health</text><rect x="202" y="8" width="190" height="109" rx="12" fill="#fff" stroke="#D8DCEA" stroke-width="2"/><g transform="translate(297,56) scale(1.3)"><line x1="0" y1="14" x2="0" y2="-12" stroke="#B8860B" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="5" cy="-10" rx="3.5" ry="6" fill="#FFD25A" stroke="#B8860B" stroke-width="1.5"/><ellipse cx="-5" cy="-4" rx="3.5" ry="6" fill="#FFD25A" stroke="#B8860B" stroke-width="1.5"/><ellipse cx="5" cy="2" rx="3.5" ry="6" fill="#FFD25A" stroke="#B8860B" stroke-width="1.5"/><ellipse cx="-5" cy="8" rx="3.5" ry="6" fill="#FFD25A" stroke="#B8860B" stroke-width="1.5"/></g><text x="297" y="100" font-size="14" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">Food security</text><rect x="8" y="125" width="190" height="109" rx="12" fill="#fff" stroke="#D8DCEA" stroke-width="2"/><g transform="translate(103,173) scale(1.1)"><circle cx="0" cy="-14" r="6" fill="#F6C9A0" stroke="#2B2F4A" stroke-width="2"/><path d="M-8 20 L-8 0 Q0 -6 8 0 L8 20 Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="-4" y1="20" x2="-4" y2="28" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><line x1="4" y1="20" x2="4" y2="28" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/></g><text x="103" y="217" font-size="14" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">Livelihoods</text><rect x="202" y="125" width="190" height="109" rx="12" fill="#fff" stroke="#D8DCEA" stroke-width="2"/><g transform="translate(297,169) scale(1.3)"><rect x="-3" y="0" width="6" height="16" rx="1" fill="#C9A27A" stroke="#2B2F4A" stroke-width="2"/><circle cx="0" cy="-8" r="13" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2"/></g><text x="297" y="217" font-size="14" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">Ecosystems</text></svg>