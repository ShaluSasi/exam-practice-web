<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Three dams drawn in section: made of timber, of earth and of stone masonry</title><style>.fl{stroke-dasharray:7 7;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.rn{animation:rn 1.2s linear infinite}@keyframes rn{0%{transform:translateY(-6px);opacity:1}100%{transform:translateY(16px);opacity:0}}.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.4s ease-in-out infinite}@keyframes pu{50%{transform:scale(1.14)}}.sp{transform-box:fill-box;transform-origin:center;animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.rs{transform-box:fill-box;transform-origin:bottom;animation:rs 3s ease-in-out infinite}@keyframes rs{0%{transform:scaleY(.6)}60%,100%{transform:scaleY(1)}}.dn{animation:dn 3s ease-in-out infinite}@keyframes dn{0%{transform:translateY(0)}70%,100%{transform:translateY(22px)}}.up{animation:up 3s ease-in-out infinite}@keyframes up{0%{transform:translateY(0)}70%,100%{transform:translateY(-14px)}}.sw{animation:sw 2.5s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="0" y="0" width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="8" y="16" width="124" height="190" rx="12" fill="#fff" stroke="#D8DCEA" stroke-width="2"/><rect x="14" y="150" width="112" height="24" rx="0" fill="#C9A27A"/><rect x="14" y="100" width="40" height="50" rx="0" fill="#7FC8F0"/><rect x="54" y="80" width="22" height="70" rx="2" fill="#A9783A" stroke="#2B2F4A" stroke-width="2"/><line x1="59" y1="82" x2="59" y2="148" stroke="#7A5A12" stroke-width="1.5" stroke-linecap="round"/><line x1="65" y1="82" x2="65" y2="148" stroke="#7A5A12" stroke-width="1.5" stroke-linecap="round"/><line x1="71" y1="82" x2="71" y2="148" stroke="#7A5A12" stroke-width="1.5" stroke-linecap="round"/><text x="70" y="194" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">Timber dam</text><rect x="138" y="16" width="124" height="190" rx="12" fill="#fff" stroke="#D8DCEA" stroke-width="2"/><rect x="144" y="150" width="112" height="24" rx="0" fill="#C9A27A"/><rect x="144" y="100" width="40" height="50" rx="0" fill="#7FC8F0"/><polygon points="178,150 194,84 214,84 246,150" fill="#8D6E3F" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><rect x="194" y="82" width="20" height="4" rx="0" fill="#9AD27B"/><text x="200" y="194" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">Embankment dam</text><rect x="268" y="16" width="124" height="190" rx="12" fill="#fff" stroke="#D8DCEA" stroke-width="2"/><rect x="274" y="150" width="112" height="24" rx="0" fill="#C9A27A"/><rect x="274" y="100" width="40" height="50" rx="0" fill="#7FC8F0"/><polygon points="314,150 318,80 338,80 352,150" fill="#B8B8C8" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><line x1="316" y1="94" x2="348" y2="94" stroke="#2B2F4A" stroke-width="1.2" stroke-linecap="round"/><line x1="316" y1="108" x2="348" y2="108" stroke="#2B2F4A" stroke-width="1.2" stroke-linecap="round"/><line x1="316" y1="122" x2="348" y2="122" stroke="#2B2F4A" stroke-width="1.2" stroke-linecap="round"/><line x1="316" y1="136" x2="348" y2="136" stroke="#2B2F4A" stroke-width="1.2" stroke-linecap="round"/><text x="330" y="194" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">Masonry dam</text></svg>