<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Bar chart of area irrigated by the Sardar Sarovar project: Gujarat 18.45, Rajasthan 2.46 and Maharashtra 0.375 lakh hectare</title><style>.fl{stroke-dasharray:7 7;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.rn{animation:rn 1.2s linear infinite}@keyframes rn{0%{transform:translateY(-6px);opacity:1}100%{transform:translateY(16px);opacity:0}}.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.4s ease-in-out infinite}@keyframes pu{50%{transform:scale(1.14)}}.sp{transform-box:fill-box;transform-origin:center;animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.rs{transform-box:fill-box;transform-origin:bottom;animation:rs 3s ease-in-out infinite}@keyframes rs{0%{transform:scaleY(.6)}60%,100%{transform:scaleY(1)}}.dn{animation:dn 3s ease-in-out infinite}@keyframes dn{0%{transform:translateY(0)}70%,100%{transform:translateY(22px)}}.up{animation:up 3s ease-in-out infinite}@keyframes up{0%{transform:translateY(0)}70%,100%{transform:translateY(-14px)}}.sw{animation:sw 2.5s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="0" y="0" width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="215" y="20" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">Area irrigated by the project (lakh hectare)</text><line x1="70" y1="195.0" x2="380" y2="195.0" stroke="#E1E4EE" stroke-width="1.5" stroke-linecap="round"/><text x="62" y="199.0" font-size="11" fill="#2B2F4A" text-anchor="end" font-weight="normal" font-family="sans-serif">0</text><line x1="70" y1="160.0" x2="380" y2="160.0" stroke="#E1E4EE" stroke-width="1.5" stroke-linecap="round"/><text x="62" y="164.0" font-size="11" fill="#2B2F4A" text-anchor="end" font-weight="normal" font-family="sans-serif">5</text><line x1="70" y1="125.0" x2="380" y2="125.0" stroke="#E1E4EE" stroke-width="1.5" stroke-linecap="round"/><text x="62" y="129.0" font-size="11" fill="#2B2F4A" text-anchor="end" font-weight="normal" font-family="sans-serif">10</text><line x1="70" y1="90.0" x2="380" y2="90.0" stroke="#E1E4EE" stroke-width="1.5" stroke-linecap="round"/><text x="62" y="94.0" font-size="11" fill="#2B2F4A" text-anchor="end" font-weight="normal" font-family="sans-serif">15</text><line x1="70" y1="55.0" x2="380" y2="55.0" stroke="#E1E4EE" stroke-width="1.5" stroke-linecap="round"/><text x="62" y="59.0" font-size="11" fill="#2B2F4A" text-anchor="end" font-weight="normal" font-family="sans-serif">20</text><line x1="70" y1="195" x2="380" y2="195" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><line x1="70" y1="195" x2="70" y2="47" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><rect x="100" y="65.85" width="56" height="129.15" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2"/><text x="128" y="59.849999999999994" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">18.45</text><text x="128" y="213" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">Gujarat</text><rect x="195" y="177.78" width="56" height="17.22" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2"/><text x="223" y="171.78" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">2.46</text><text x="223" y="213" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">Rajasthan</text><rect x="290" y="192.375" width="56" height="2.625" rx="3" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2"/><text x="318" y="186.375" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">0.375</text><text x="318" y="213" font-size="11" fill="#2B2F4A" text-anchor="