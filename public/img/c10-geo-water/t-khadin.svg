<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A farm field with a raised earth bund holding rainwater so that it soaks the soil</title><style>.fl{stroke-dasharray:7 7;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.rn{animation:rn 1.2s linear infinite}@keyframes rn{0%{transform:translateY(-6px);opacity:1}100%{transform:translateY(16px);opacity:0}}.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.4s ease-in-out infinite}@keyframes pu{50%{transform:scale(1.14)}}.sp{transform-box:fill-box;transform-origin:center;animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.rs{transform-box:fill-box;transform-origin:bottom;animation:rs 3s ease-in-out infinite}@keyframes rs{0%{transform:scaleY(.6)}60%,100%{transform:scaleY(1)}}.dn{animation:dn 3s ease-in-out infinite}@keyframes dn{0%{transform:translateY(0)}70%,100%{transform:translateY(22px)}}.up{animation:up 3s ease-in-out infinite}@keyframes up{0%{transform:translateY(0)}70%,100%{transform:translateY(-14px)}}.sw{animation:sw 2.5s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="0" y="0" width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="200" height="150" rx="12" fill="#E3F2FD"/><rect x="0" y="90" width="200" height="60" rx="0" fill="#C9E7A0"/><rect x="0" y="78" width="200" height="14" rx="2" fill="#8D6E3F" stroke="#2B2F4A" stroke-width="3"/><rect x="0" y="94" width="200" height="30" rx="0" fill="#7FC8F0"/><g transform="translate(100,35) scale(1.2)"><circle cx="-13" cy="2" r="10" fill="#fff" stroke="#8FA6C0" stroke-width="4"/><circle cx="0" cy="-6" r="14" fill="#fff" stroke="#8FA6C0" stroke-width="4"/><circle cx="14" cy="2" r="11" fill="#fff" stroke="#8FA6C0" stroke-width="4"/><rect x="-23" y="2" width="48" height="11" rx="5" fill="#fff" stroke="#8FA6C0" stroke-width="4"/><circle cx="-13" cy="2" r="10" fill="#fff"/><circle cx="0" cy="-6" r="14" fill="#fff"/><circle cx="14" cy="2" r="11" fill="#fff"/><rect x="-23" y="2" width="48" height="11" rx="5" fill="#fff"/></g><line x1="80" y1="60" x2="77" y2="70" stroke="#0B93D4" stroke-width="3" stroke-linecap="round"/><line x1="94" y1="60" x2="91" y2="70" stroke="#0B93D4" stroke-width="3" stroke-linecap="round"/><line x1="108" y1="60" x2="105" y2="70" stroke="#0B93D4" stroke-width="3" stroke-linecap="round"/><line x1="122" y1="60" x2="119" y2="70" stroke="#0B93D4" stroke-width="3" stroke-linecap="round"/><g transform="translate(30,136) scale(0.8)"><line x1="0" y1="14" x2="0" y2="-2" stroke="#3FA34D" stroke-width="3" stroke-linecap="round"/><ellipse cx="-6" cy="-3" rx="6" ry="3.5" fill="#9AD27B" stroke="#3FA34D" stroke-width="2" transform="rotate(-30 -6 -3)"/><ellipse cx="6" cy="-6" rx="6" ry="3.5" fill="#9AD27B" stroke="#3FA34D" stroke-width="2" transform="rotate(30 6 -6)"/></g><g transform="translate(70,136) scale(0.8)"><line x1="0" y1="14" x2="0" y2="-2" stroke="#3FA34D" stroke-width="3" stroke-linecap="round"/><ellipse cx="-6" cy="-3" rx="6" ry="3.5" fill="#9AD27B" stroke="#3FA34D" stroke-width="2" transform="rotate(-30 -6 -3)"/><ellipse cx="6" cy="-6" rx="6" ry="3.5" fill="#9AD27B" stroke="#3FA34D" stroke-width="2" transform="rotate(30 6 -6)"/></g><g transform="translate(110,136) scale(0.8)"><line x1="0" y1="14" x2="0" y2="-2" stroke="#3FA34D" stroke-width="3" stroke-linecap="round"/><ellipse cx="-6" cy="-3" rx="6" ry="3.5" fill="#9AD27B" stroke="#3FA34D" stroke-width="2" transform="rotate(-30 -6 -3)"/><ellipse cx="6" cy="-6" rx="6" ry="3.5" fill="#9AD27B" stroke="#3FA34D" stroke-width="2" transform="rotate(30 6 -6)"/></g><g transform="translate(150,136) scale(0.8)"><line x1="0" y1="14" x2="0" y2="-2" stroke="#3FA34D" stroke-width="3" stroke-linecap="round"/><ellipse cx="-6" cy="-3" rx="6" ry="3.5" fill="#9AD27B" stroke="#3FA34D" s