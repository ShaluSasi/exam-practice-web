<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Left: dusty first rain is not collected. Right: later showers flow through the pipe into the tanka</title><style>.fl{stroke-dasharray:7 7;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.rn{animation:rn 1.2s linear infinite}@keyframes rn{0%{transform:translateY(-6px);opacity:1}100%{transform:translateY(16px);opacity:0}}.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.4s ease-in-out infinite}@keyframes pu{50%{transform:scale(1.14)}}.sp{transform-box:fill-box;transform-origin:center;animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.rs{transform-box:fill-box;transform-origin:bottom;animation:rs 3s ease-in-out infinite}@keyframes rs{0%{transform:scaleY(.6)}60%,100%{transform:scaleY(1)}}.dn{animation:dn 3s ease-in-out infinite}@keyframes dn{0%{transform:translateY(0)}70%,100%{transform:translateY(22px)}}.up{animation:up 3s ease-in-out infinite}@keyframes up{0%{transform:translateY(0)}70%,100%{transform:translateY(-14px)}}.sw{animation:sw 2.5s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="0" y="0" width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="8" y="10" width="188" height="220" rx="12" fill="#fff" stroke="#D8DCEA" stroke-width="2"/><text x="102" y="32" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">First spell of rain</text><g transform="translate(102,56)"><circle cx="-13" cy="2" r="10" fill="#fff" stroke="#8FA6C0" stroke-width="4"/><circle cx="0" cy="-6" r="14" fill="#fff" stroke="#8FA6C0" stroke-width="4"/><circle cx="14" cy="2" r="11" fill="#fff" stroke="#8FA6C0" stroke-width="4"/><rect x="-23" y="2" width="48" height="11" rx="5" fill="#fff" stroke="#8FA6C0" stroke-width="4"/><circle cx="-13" cy="2" r="10" fill="#fff"/><circle cx="0" cy="-6" r="14" fill="#fff"/><circle cx="14" cy="2" r="11" fill="#fff"/><rect x="-23" y="2" width="48" height="11" rx="5" fill="#fff"/></g><line x1="68" y1="78" x2="65" y2="90" stroke="#0B93D4" stroke-width="3" stroke-linecap="round"/><line x1="84" y1="78" x2="81" y2="90" stroke="#0B93D4" stroke-width="3" stroke-linecap="round"/><line x1="100" y1="78" x2="97" y2="90" stroke="#0B93D4" stroke-width="3" stroke-linecap="round"/><line x1="116" y1="78" x2="113" y2="90" stroke="#0B93D4" stroke-width="3" stroke-linecap="round"/><line x1="132" y1="78" x2="129" y2="90" stroke="#0B93D4" stroke-width="3" stroke-linecap="round"/><polygon points="48,112 102,92 156,112" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><rect x="58" y="112" width="88" height="32" rx="2" fill="#FFE8C2" stroke="#2B2F4A" stroke-width="2"/><line x1="158" y1="108" x2="168" y2="112" stroke="#E8E8F0" stroke-width="6" stroke-linecap="round"/><line x1="168" y1="112" x2="168" y2="160" stroke="#E8E8F0" stroke-width="6" stroke-linecap="round"/><rect x="28" y="182" width="148" height="36" rx="2" fill="#fff" stroke="#2B2F4A" stroke-width="4"/><path d="M168 160 L184 170" fill="none" stroke="#8B6B3E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g class="rn" style="animation-delay:0.0s"><g transform="translate(182,180) scale(0.4)"><path d="M0 -11 C6 -3 10 2 10 6 A10 10 0 0 1 -10 6 C-10 2 -6 -3 0 -11 Z" fill="#8B6B3E" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><g class="rn" style="animation-delay:0.3s"><g transform="translate(182,186) scale(0.4)"><path d="M0 -11 C6 -3 10 2 10 6 A10 10 0 0 1 -10 6 C-10 2 -6 -3 0 -11 Z" fill="#8B6B3E" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="98" y="163" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="normal" font-family="sans-serif">Dusty water is let go</tex