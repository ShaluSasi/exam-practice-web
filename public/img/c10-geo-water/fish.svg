<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A dam wall blocks fish swimming upstream to their spawning area</title><style>.fl{stroke-dasharray:7 7;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}.rn{animation:rn 1.2s linear infinite}@keyframes rn{0%{transform:translateY(-6px);opacity:1}100%{transform:translateY(16px);opacity:0}}.pu{transform-box:fill-box;transform-origin:center;animation:pu 2.4s ease-in-out infinite}@keyframes pu{50%{transform:scale(1.14)}}.sp{transform-box:fill-box;transform-origin:center;animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.rs{transform-box:fill-box;transform-origin:bottom;animation:rs 3s ease-in-out infinite}@keyframes rs{0%{transform:scaleY(.6)}60%,100%{transform:scaleY(1)}}.dn{animation:dn 3s ease-in-out infinite}@keyframes dn{0%{transform:translateY(0)}70%,100%{transform:translateY(22px)}}.up{animation:up 3s ease-in-out infinite}@keyframes up{0%{transform:translateY(0)}70%,100%{transform:translateY(-14px)}}.sw{animation:sw 2.5s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect x="0" y="0" width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="240" rx="16" fill="#E3F2FD"/><rect x="0" y="190" width="400" height="50" rx="0" fill="#C9A27A"/><rect x="10" y="90" width="180" height="100" rx="0" fill="#7FC8F0"/><rect x="230" y="150" width="160" height="40" rx="0" fill="#7FC8F0"/><polygon points="185,90 230,90 250,190 170,190" fill="#B8B8C8" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><g class="sw"><g transform="translate(300,170)"><ellipse cx="0" cy="0" rx="14" ry="7" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2"/><polygon points="12,0 22,-7 22,7" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><circle cx="-6" cy="-2" r="1.8" fill="#2B2F4A"/></g><g transform="translate(340,176)"><ellipse cx="0" cy="0" rx="14" ry="7" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2"/><polygon points="12,0 22,-7 22,7" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><circle cx="-6" cy="-2" r="1.8" fill="#2B2F4A"/></g></g><line x1="285" y1="165" x2="263.0" y2="165.0" stroke="#E5484D" stroke-width="3" stroke-linecap="round"/><polygon points="260,165 268.1,161.1 268.1,168.9" fill="#E5484D" stroke="#E5484D" stroke-width="1" stroke-linejoin="round"/><text x="300" y="140" font-size="11" fill="#E5484D" text-anchor="middle" font-weight="bold" font-family="sans-serif">No way upstream</text><circle cx="40" cy="176" r="3" fill="#F6E3A1" stroke="#B8860B" stroke-width="1.5"/><circle cx="54" cy="173" r="3" fill="#F6E3A1" stroke="#B8860B" stroke-width="1.5"/><circle cx="68" cy="176" r="3" fill="#F6E3A1" stroke="#B8860B" stroke-width="1.5"/><circle cx="82" cy="173" r="3" fill="#F6E3A1" stroke="#B8860B" stroke-width="1.5"/><circle cx="96" cy="176" r="3" fill="#F6E3A1" stroke="#B8860B" stroke-width="1.5"/><text x="100" y="120" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="bold" font-family="sans-serif">Spawning area</text></svg>