"15" fill="#2B2F4A" text-anchor="middle" >40</text><rect x="40" y="236" width="320" height="34" rx="6" fill="#F4EEE1" stroke="#E2D6BC" stroke-width="1.5"/><text x="95" y="259" font-family="system-ui, sans-serif" font-weight="600" font-size="15" fill="#2B2F4A" text-anchor="middle" >E</text><text x="207" y="259" font-family="system-ui, sans-serif" font-weight="600" font-size="15" fill="#2B2F4A" text-anchor="middle" >100</text><text x="310" y="259" font-family="system-ui, sans-serif" font-weight="600" font-size="15" fill="#2B2F4A" text-anchor="middle" >0</text>
<path d="M150 40V272M260 40V272" stroke="#E2D6BC" stroke-width="1.5"/>
