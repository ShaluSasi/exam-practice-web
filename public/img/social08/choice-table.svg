<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
<title>A table of five combinations of barley and wheat a farmer can grow</title>
<style>
.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.hl{animation:hl 3s ease-in-out infinite}@keyframes hl{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="40" y="40" width="320" height="40" rx="8" fill="#F6C453" class="o"/>
