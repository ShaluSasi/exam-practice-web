<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
<title>A bar showing a family's monthly income split into three parts</title>
<style>
.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.sv{animation:sv 1.8s ease-in-out infinite}@keyframes sv{50%{opacity:.45}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="50" font-family="system-ui, sans-serif" font-weight="600" font-size="18" fill="#2B2F4A" text-anchor="middle" >Monthly income: ₹40,000</text>
<rect x="30" y="90" width="187" height="70" fill="#0B93D4" class="o"/><rect x="217" y="90" width="68" height="70" fill="#FF8A1F" class="o"/><g class="sv"><rect x="285" y="90" width="85" height="70" fill="#3FA34D" class="o"/></g>
<text x="123" y="132" font-family="system-ui, sans-serif" font-weight="600" font-size="20"  text-anchor="middle" fill="#FFFFFF">55%</text><text x="251" y="132" font-family="system-ui, sans-serif" font-weight="600" font-size="18"  text-anchor="middle" fill="#FFFFFF">20%</text><text x="327" y="133" font-family="system-ui, sans-serif" font-weight="600" font-size="24"  text-anchor="middle" fill="#FFFFFF">?</text>
<text x="123" y="186" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A" text-anchor="middle" >Essentials</text><text x="251" y="186" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#2B2F4A" text-anchor="middle" >Non-essentials</text><text x="327" y="186" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A" text-anchor="middle" >Savings</text>
<g transform="translate(80 250)"><path d="M-22 -26Q0 -34 22 -26L26 26H-26Z" fill="#F4EEE1" class="o"/><path d="M-14 -4H14" stroke="#C8925A" stroke-width="3"/></g><g transform="translate(130 250)"><rect x="-14" y="-20" width="28" height="44" rx="5" fill="#FFFFFF" class="o"/><rect x="-16" y="-30" width="32" height="12" rx="3" fill="#3FA34D" class="o"/><path d="M0 -6V14M-10 4H10" stroke="#0B93D4" stroke-width="4"/></g><g transform="translate(251 250)"><path d="M-24 -20Q0 34 24 -20" fill="none" stroke="#B8860B" stroke-width="4"/><circle cy="12" r="9" fill="#E5484D" stroke="#B8860B" stroke-width="3"/></g>
<g transform="translate(327 250)"><ellipse rx="30" ry="22" fill="#F7A8C4" class="o"/><rect x="-8" y="-24" width="16" height="4" rx="2" fill="#2B2F4A"/><circle cx="22" cy="-4" r="7" fill="#F7A8C4" class="o"/></g>
</svg>
