<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
<title>A road through a lifting barrier towards busy factories, shops and cargo containers</title>
<style>
.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.gate{animation:gate 3s ease-in-out infinite;transform-box:view-box;transform-origin:150px 170px}@keyframes gate{0%,20%{transform:rotate(0)}50%,80%{transform:rotate(-70deg)}100%{transform:rotate(0)}}
.tk{animation:tk 4s linear infinite}@keyframes tk{from{transform:translateX(-60px)}to{transform:translateX(320px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
