<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
<title>A clock showing one hour, with maths sums on one side and pages of a book on the other</title>
<style>
.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.h{animation:h 4s linear infinite;transform-box:view-box;transform-origin:200px 110px}@keyframes h{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="200" cy="110" r="60" fill="#FFFFFF" class="o"/><circle cx="200.0" cy="60.0" r="2.5" fill="#2B2F4A"/><circle cx="225.0" cy="66.7" r="2.5" fill="#2B2F4A"/><circle cx="243.3" cy="85.0" r="2.5" fill="#2B2F4A"/><circle cx="250.0" cy="110.0" r="2.5" fill="#2B2F4A"/><circle cx="243.3" cy="135.0" r="2.5" fill="#2B2F4A"/><circle cx="225.0" cy="153.3" r="2.5" fill="#2B2F4A"/><circle cx="200.0" cy="160.0" r="2.5" fill="#2B2F4A"/><circle cx="175.0" cy="153.3" r="2.5" fill="#2B2F4A"/><circle cx="156.7" cy="135.0" r="2.5" fill="#2B2F4A"/><circle cx="150.0" cy="110.0" r="2.5" fill="#2B2F4A"/><circle cx="156.7" cy="85.0" r="2.5" fill="#2B2F4A"/><circle cx="175.0" cy="66.7" r="2.5" fill="#2B2F4A"/>
<path d="M200 110V80" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round"/><path class="h" d="M200 110V66" stroke="#E5484D" stroke-width="3" stroke-linecap="round"/>
<text x="200" y="196" font-family="system-ui, sans-serif" font-weight="600" font-size="16" fill="#2B2F4A" text-anchor="middle" >1 hour</text>
<g transform="translate(76 226)"><rect x="-56" y="-46" width="112" height="84" rx="6" fill="#FFFFFF" class="o"/><text x="0" y="-22" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#2B2F4A" text-anchor="middle" >12 + 7 = ?</text><text x="0" y="-2" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#2B2F4A" text-anchor="middle" >8 × 6 = ?</text><text x="0" y="18" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#2B2F4A" text-anchor="middle" >45 ÷ 5 = ?</text></g>
<text x="76" y="292" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A" text-anchor="middle" >12 sums</text>
<g transform="translate(324 226)"><path d="M-56 -40Q-28 -48 0 -36Q28 -48 56 -40V36Q28 28 0 40Q-28 28 -56 36Z" fill="#CDEBFA" class="o"/><path d="M0 -36V40" class="o"/><path d="M-46 -24H-10M-46 -10H-10M-46 4H-10M10 -24H46M10 -10H46M10 4H46" stroke="#0B93D4" stroke-width="2"/></g>
<text x="324" y="292" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A" text-anchor="middle" >30 pages</text>
<text x="134" y="140" font-family="system-ui, sans-serif" font-weight="600" font-size="18" fill="#2B2F4A" text-anchor="middle" >or</text><text x="268" y="140" font-family="system-ui, sans-serif" font-weight="600" font-size="18" fill="#2B2F4A" text-anchor="middle" >or</text>
</svg>
