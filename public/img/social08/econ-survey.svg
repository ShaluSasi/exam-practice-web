<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
<title>A thick report called Economic Survey in front of a semicircular assembly hall</title>
<style>
.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.bar{animation:bar 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.b2{animation-delay:.4s}.b3{animation-delay:.8s}@keyframes bar{50%{transform:scaleY(.6)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M40 190A160 120 0 0 1 360 190Z" fill="#E8DDEF" stroke="#7B61A8" stroke-width="2.5"/>
<g fill="none" stroke="#B9A6D1" stroke-width="6" stroke-linecap="round"><path d="M80 186A120 88 0 0 1 320 186"/><path d="M116 186A84 60 0 0 1 284 186"/></g>
<rect x="30" y="190" width="340" height="12" fill="#D9C49A"/>
<g transform="translate(200 200)"><rect x="-80" y="-106" width="160" height="196" rx="8" fill="#0B93D4" class="o"/><rect x="-80" y="-106" width="16" height="196" fill="#0A75AA"/><text x="8" y="-72" font-family="system-ui, sans-serif" font-weight="600" font-size="18"  text-anchor="middle" fill="#FFFFFF">Economic</text><text x="8" y="-50" font-family="system-ui, sans-serif" font-weight="600" font-size="18"  text-anchor="middle" fill="#FFFFFF">Survey</text>
<rect x="-46" y="-34" width="108" height="80" rx="6" fill="#FFFFFF"/><g fill="#F6C453" stroke="#2B2F4A" stroke-width="1.5"><rect class="bar" x="-34" y="0" width="16" height="36"/><rect class="bar b2" x="-8" y="-14" width="16" height="50"/><rect class="bar b3" x="18" y="-24" width="16" height="60"/></g><path d="M-38 36H56" stroke="#2B2F4A" stroke-width="2"/></g>
</svg>
