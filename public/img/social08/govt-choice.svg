<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
<title>A government budget bag between a highway and a hospital, each with its cost</title>
<style>
.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.cr{animation:cr 3s linear infinite}@keyframes cr{from{transform:translateY(40px)}to{transform:translateY(-60px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g transform="translate(200 120)"><path d="M-40 -30Q-56 0 -46 34Q0 52 46 34Q56 0 40 -30Z" fill="#F6C453" stroke="#B8860B" stroke-width="3" stroke-linejoin="round"/><path d="M-22 -30L-30 -50H30L22 -30Z" fill="#F6C453" stroke="#B8860B" stroke-width="3" stroke-linejoin="round"/><text x="0" y="12" font-family="system-ui, sans-serif" font-weight="600" font-size="16" fill="#2B2F4A" text-anchor="middle" >₹1,000</text><text x="0" y="30" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#2B2F4A" text-anchor="middle" >crore</text></g>
<path d="M30 280L72 140H118L160 280Z" fill="#7E8299"/><g class="cr"><rect x="84" y="210" width="22" height="34" rx="5" fill="#E5484D" class="o"/></g><path d="M95 150V170M95 190V210M95 230V250M95 266V280" stroke="#FFFFFF" stroke-width="3"/>
<g transform="translate(95 116)"><path d="M-64 -12H56L64 0L56 12H-64Z" fill="#FFFFFF" class="o"/><circle cx="-56" cy="0" r="3" fill="#2B2F4A"/><text x="4" y="5" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#2B2F4A" text-anchor="middle" >₹200 crore each</text></g>
<rect x="262" y="160" width="110" height="118" rx="6" fill="#FFFFFF" class="o"/><rect x="298" y="134" width="38" height="30" rx="4" fill="#FFFFFF" class="o"/><text x="317" y="156" font-family="system-ui, sans-serif" font-weight="600" font-size="20"  text-anchor="middle" fill="#E5484D">H</text>
<g fill="#CDEBFA" class="o"><rect x="274" y="176" width="22" height="20"/><rect x="306" y="176" width="22" height="20"/><rect x="338" y="176" width="22" height="20"/><rect x="274" y="210" width="22" height="20"/><rect x="338" y="210" width="22" height="20"/></g><rect x="304" y="236" width="26" height="42" fill="#A3A8CC" class="o"/>
<g transform="translate(317 116)"><path d="M-60 -12H52L60 0L52 12H-60Z" fill="#FFFFFF" class="o"/><circle cx="-52" cy="0" r="3" fill="#2B2F4A"/><text x="4" y="5" font-family="system-ui, sans-serif" font-weight="600" font-size="13" fill="#2B2F4A" text-anchor="middle" >₹50 crore each</text></g>
</svg>
