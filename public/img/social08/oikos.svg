<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
<title>An old scroll with the Greek word oikonomia written on it</title>
<style>
.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.fd{animation:fd 3s ease-in-out infinite}@keyframes fd{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g class="fd"><rect x="70" y="70" width="260" height="150" fill="#F4E2C4" stroke="#8A5A2E" stroke-width="3"/><rect x="56" y="58" width="22" height="174" rx="11" fill="#C8925A" stroke="#8A5A2E" stroke-width="3"/><rect x="322" y="58" width="22" height="174" rx="11" fill="#C8925A" stroke="#8A5A2E" stroke-width="3"/>
<text x="200" y="132" font-family="system-ui, sans-serif" font-weight="600" font-size="32" fill="#2B2F4A" text-anchor="middle" font-style="italic">oikonomia</text>
<text x="200" y="180" font-family="system-ui, sans-serif" font-weight="600" font-size="20" fill="#2B2F4A" text-anchor="middle" >oikos  +  nemein</text><text x="200" y="206" font-family="system-ui, sans-serif" font-weight="600" font-size="18"  text-anchor="middle" fill="#E5484D">?       ?</text></g>
</svg>
