<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" role="img">
<title>A machine with gears and a spanner</title>
<style>
.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.g{animation:g 4s linear infinite;transform-box:fill-box;transform-origin:center}.g2{animation-direction:reverse}@keyframes g{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="30" y="96" width="140" height="44" rx="6" fill="#A3A8CC" class="o"/><rect x="44" y="108" width="30" height="18" rx="3" fill="#CDEBFA" class="o"/>
<g class="g"><circle cx="80" cy="62" r="26" fill="#F6C453" stroke="#B8860B" stroke-width="10" stroke-dasharray="8 6"/><circle cx="80" cy="62" r="8" fill="#FFF9EE" class="o"/></g>
<g class="g g2"><circle cx="128" cy="70" r="18" fill="#FF8A1F" stroke="#C25E0A" stroke-width="8" stroke-dasharray="6 5"/><circle cx="128" cy="70" r="6" fill="#FFF9EE" class="o"/></g>
<path d="M150 120L178 92" stroke="#7E8299" stroke-width="7" stroke-linecap="round"/><circle cx="180" cy="90" r="7" fill="none" stroke="#7E8299" stroke-width="5"/>
</svg>
