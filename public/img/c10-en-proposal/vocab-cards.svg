<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Four word cards floating above a magnifying glass</title>
<style>
.fb{transform-box:fill-box}.fl{animation:fl 2.4s ease-in-out infinite alternate}@keyframes fl{from{transform:translateY(0)}to{transform:translateY(-5px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g class="fl" style="animation-delay:0.0s"><rect x="20" y="60" width="80" height="110" rx="10" fill="#D7EEFB" stroke="#2B2F4A" stroke-width="3" /><text x="60" y="124" font-size="26" fill="#2B2F4A" text-anchor="middle" font-weight="800" font-family="system-ui, sans-serif" >Aa</text><line x1="34" y1="146" x2="86" y2="146" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /></g><g class="fl" style="animation-delay:0.3s"><rect x="112" y="60" width="80" height="110" rx="10" fill="#FFE4C2" stroke="#2B2F4A" stroke-width="3" /><text x="152" y="124" font-size="26" fill="#2B2F4A" text-anchor="middle" font-weight="800" font-family="system-ui, sans-serif" >Bb</text><line x1="126" y1="146" x2="178" y2="146" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /></g><g class="fl" style="animation-delay:0.6s"><rect x="204" y="60" width="80" height="110" rx="10" fill="#DFF3D6" stroke="#2B2F4A" stroke-width="3" /><text x="244" y="124" font-size="26" fill="#2B2F4A" text-anchor="middle" font-weight="800" font-family="system-ui, sans-serif" >Cc</text><line x1="218" y1="146" x2="270" y2="146" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /></g><g class="fl" style="animation-delay:0.8999999999999999s"><rect x="296" y="60" width="80" height="110" rx="10" fill="#EADFFF" stroke="#2B2F4A" stroke-width="3" /><text x="336" y="124" font-size="26" fill="#2B2F4A" text-anchor="middle" font-weight="800" font-family="system-ui, sans-serif" >Dd</text><line x1="310" y1="146" x2="362" y2="146" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /></g><circle cx="330" cy="196" r="24" fill="none" stroke="#2B2F4A" stroke-width="5" /><line x1="347" y1="213" x2="366" y2="232" stroke="#2B2F4A" stroke-width="7" stroke-linecap="round" />
</svg>
