<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A page from a play script with speaker names, spoken lines, bracketed directions and the word CURTAIN</title>
<style>
.fb{transform-box:fill-box}.hl{animation:hl 2.4s ease-in-out infinite alternate}@keyframes hl{from{opacity:.25}to{opacity:.8}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="14" y="12" width="372" height="216" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="34" font-size="11" fill="#7A7F9A" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif" letter-spacing="2">EXCERPT FROM A PLAY SCRIPT</text><text x="26" y="58" font-size="13" fill="#2B2F4A" text-anchor="start" font-weight="800" font-family="system-ui, sans-serif" >NATALYA :</text><text x="112" y="58" font-size="13" fill="#2B2F4A" text-anchor="start" font-weight="500" font-family="system-ui, sans-serif" >What sort of a hunter are you?</text><text x="200" y="104" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="500" font-family="system-ui, sans-serif" font-style="italic">[Lomov staggers out.]</text><text x="26" y="150" font-size="13" fill="#2B2F4A" text-anchor="start" font-weight="800" font-family="system-ui, sans-serif" >CHUBUKOV :</text><text x="124" y="150" font-size="13" fill="#2B2F4A" text-anchor="start" font-weight="500" font-family="system-ui, sans-serif" font-style="italic">[aside]</text><text x="176" y="150" font-size="13" fill="#2B2F4A" text-anchor="start" font-weight="500" font-family="system-ui, sans-serif" >He's come to borrow money.</text><text x="200" y="204" font-size="15" fill="#2B2F4A" text-anchor="middle" font-weight="800" font-family="system-ui, sans-serif" letter-spacing="4">CURTAIN</text><g class="hl"><rect x="14" y="214" width="372" height="6" rx="3" fill="#FFD23F" /></g><line x1="26" y1="66" x2="374" y2="66" stroke="#E3E5EE" stroke-width="1.5" stroke-linecap="round" /><line x1="26" y1="112" x2="374" y2="112" stroke="#E3E5EE" stroke-width="1.5" stroke-linecap="round" /><line x1="26" y1="158" x2="374" y2="158" stroke="#E3E5EE" stroke-width="1.5" stroke-linecap="round" /><line x1="26" y1="180" x2="374" y2="180" stroke="#E3E5EE" stroke-width="1.5" stroke-linecap="round" />
</svg>
