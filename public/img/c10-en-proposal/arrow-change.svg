<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A speech bubble with quoted words and an arrow leading to another bubble that begins He said</title>
<style>
.fb{transform-box:fill-box}.ar{animation:ar 1.5s ease-in-out infinite}@keyframes ar{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g><rect x="20" y="50" width="130" height="90" rx="12" fill="#FFE4C2" stroke="#2B2F4A" stroke-width="2.5" /><path d="M31 139L28 152L45 139" fill="#FFE4C2" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="32" y="136" width="12" height="5" rx="0" fill="#FFE4C2" /><text x="85.0" y="100.25" font-size="15" fill="#2B2F4A" text-anchor="middle" font-weight="600" font-family="system-ui, sans-serif" >"I will go"</text></g><g><rect x="250" y="50" width="130" height="90" rx="12" fill="#D7EEFB" stroke="#2B2F4A" stroke-width="2.5" /><path d="M355 139L372 152L369 139" fill="#D7EEFB" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="356" y="136" width="12" height="5" rx="0" fill="#D7EEFB" /><text x="315.0" y="100.25" font-size="15" fill="#2B2F4A" text-anchor="middle" font-weight="600" font-family="system-ui, sans-serif" >He said...</text></g><g class="ar"><path d="M164 96L232 96" fill="none" stroke="#FF8A1F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><path d="M218 80L234 96L218 112" fill="none" stroke="#FF8A1F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></g><text x="200" y="200" font-size="13" fill="#7A7F9A" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif" >Direct speech  to  Reported speech</text>
</svg>
