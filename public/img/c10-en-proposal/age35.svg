<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A big birthday calendar page showing 35 with a candle, beside a cosy armchair for a quiet life</title>
<style>
.fb{transform-box:fill-box}.fl{animation:fl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom}@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.8,1.2)}}.zz{animation:zz 2.4s ease-in-out infinite}@keyframes zz{0%,100%{opacity:.2;transform:translateY(0)}50%{opacity:1;transform:translateY(-6px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="40" y="28" width="150" height="170" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><rect x="40" y="28" width="150" height="36" rx="10" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" /><rect x="40" y="50" width="150" height="14" rx="0" fill="#E5484D" /><circle cx="70" cy="28" r="5" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><circle cx="160" cy="28" r="5" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><text x="115" y="54" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="800" font-family="system-ui, sans-serif" letter-spacing="2">BIRTHDAY</text><text x="115" y="140" font-size="64" fill="#2B2F4A" text-anchor="middle" font-weight="800" font-family="system-ui, sans-serif" >35</text><rect x="105" y="150" width="20" height="30" rx="4" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" /><g class="fl"><path d="M115 134Q108 144 115 148Q122 144 115 134Z" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(300 190) scale(1.4)" ><rect x="-26" y="-50" width="52" height="52" rx="12" fill="#C0504D" stroke="#2B2F4A" stroke-width="2.5" /><rect x="-34" y="-26" width="14" height="38" rx="6" fill="#C0504D" stroke="#2B2F4A" stroke-width="2.5" /><rect x="20" y="-26" width="14" height="38" rx="6" fill="#C0504D" stroke="#2B2F4A" stroke-width="2.5" /><rect x="-22" y="-14" width="44" height="18" rx="6" fill="#D96A66" stroke="#2B2F4A" stroke-width="2" /><rect x="-30" y="12" width="6" height="8" rx="0" fill="#6B4421" stroke="#2B2F4A" stroke-width="1.5" /><rect x="24" y="12" width="6" height="8" rx="0" fill="#6B4421" stroke="#2B2F4A" stroke-width="1.5" /></g><g class="zz"><text x="300" y="90" font-size="22" fill="#2B2F4A" text-anchor="middle" font-weight="800" font-family="system-ui, sans-serif" >Zz</text></g><g><path d="M280 108Q300 96 320 108" fill="none" stroke="#B8B8C4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></g>
</svg>
