<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A long word broken into four syllable blocks that bounce one after another</title>
<style>
.fb{transform-box:fill-box}.s0{animation:sb 2.4s ease-in-out 0.0s infinite}.s1{animation:sb 2.4s ease-in-out 0.4s infinite}.s2{animation:sb 2.4s ease-in-out 0.8s infinite}.s3{animation:sb 2.4s ease-in-out 1.2000000000000002s infinite}@keyframes sb{0%,100%{transform:translateY(0)}20%{transform:translateY(-8px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g class="s0"><rect x="22" y="80" width="82" height="70" rx="12" fill="#D7EEFB" stroke="#2B2F4A" stroke-width="3" /><text x="63" y="124" font-size="24" fill="#2B2F4A" text-anchor="middle" font-weight="800" font-family="system-ui, sans-serif" >em</text></g><g class="s1"><rect x="112" y="80" width="82" height="70" rx="12" fill="#FFE4C2" stroke="#2B2F4A" stroke-width="3" /><text x="153" y="124" font-size="24" fill="#2B2F4A" text-anchor="middle" font-weight="800" font-family="system-ui, sans-serif" >bez</text></g><g class="s2"><rect x="202" y="80" width="82" height="70" rx="12" fill="#DFF3D6" stroke="#2B2F4A" stroke-width="3" /><text x="243" y="124" font-size="24" fill="#2B2F4A" text-anchor="middle" font-weight="800" font-family="system-ui, sans-serif" >zle</text></g><g class="s3"><rect x="292" y="80" width="82" height="70" rx="12" fill="#EADFFF" stroke="#2B2F4A" stroke-width="3" /><text x="333" y="124" font-size="24" fill="#2B2F4A" text-anchor="middle" font-weight="800" font-family="system-ui, sans-serif" >ment</text></g><text x="200" y="52" font-size="14" fill="#7A7F9A" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif" >How many beats?  Which one is loudest?</text><path d="M30 184Q200 214 370 184" fill="none" stroke="#B8B8C4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
</svg>
