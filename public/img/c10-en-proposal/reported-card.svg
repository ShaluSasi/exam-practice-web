<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A direct-speech sentence above an arrow pointing to the same sentence in reported speech, split into two coloured boxes</title>
<style>
.fb{transform-box:fill-box}.ar{animation:ar 1.6s ease-in-out infinite}@keyframes ar{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="20" y="10" width="360" height="66" rx="12" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="27" font-size="11" fill="#7A7F9A" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif" >Direct speech</text><text x="200" y="47" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="600" font-family="system-ui, sans-serif" >NATALYA : "Why haven&apos;t you been here</text><text x="200" y="65" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="600" font-family="system-ui, sans-serif" >for such a long time?"</text><g class="ar"><path d="M200 78L200 106" fill="none" stroke="#FF8A1F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M190 98L200 108L210 98" fill="none" stroke="#FF8A1F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="20" y="126" width="360" height="90" rx="12" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="144" font-size="11" fill="#7A7F9A" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif" >Reported speech</text><rect x="30" y="154" width="146" height="52" rx="10" fill="#D7EEFB" stroke="#2B2F4A" stroke-width="2.5" /><text x="103" y="176" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif" >Natalya Stepanovna</text><text x="103" y="195" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" font-family="system-ui, sans-serif" >asked</text><rect x="186" y="154" width="184" height="52" rx="10" fill="#FFE4C2" stroke="#2B2F4A" stroke-width="2.5" /><text x="278" y="174" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="600" font-family="system-ui, sans-serif" >why he hadn&apos;t been there</text><text x="278" y="191" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="600" font-family="system-ui, sans-serif" >for such a long time.</text>
</svg>
