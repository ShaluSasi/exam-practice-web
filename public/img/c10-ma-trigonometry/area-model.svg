<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A square with side sin A plus cosec A cut into four rectangles: two squares and two rectangles each worth 1</title>
<style>.fl{stroke-dasharray:10 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.pu{animation:pu 2.2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sc{animation:sc 3s ease-in-out infinite}@keyframes sc{0%,100%{transform:scale(1)}50%{transform:scale(.55)}}.gr{animation:gr 3s ease-in-out infinite}@keyframes gr{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.6)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:14px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="40" y="38" width="63" height="63" fill="#FFE3C2" stroke="#2B2F4A" stroke-width="2.5"/><text x="71.5" y="74.4" font-size="14" text-anchor="middle" class="h" >sin²A</text><rect x="103" y="38" width="126" height="63" fill="#F3EEFF" stroke="#2B2F4A" stroke-width="2.5"/><text x="166" y="74.4" font-size="14" text-anchor="middle" class="h" >1</text><rect x="40" y="101" width="63" height="126" fill="#F3EEFF" stroke="#2B2F4A" stroke-width="2.5"/><text x="71.5" y="168.9" font-size="14" text-anchor="middle" class="h" >1</text><rect x="103" y="101" width="126" height="126" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5"/><text x="166" y="168.9" font-size="14" text-anchor="middle" class="h" >cosec²A</text><text x="71.5" y="28.6" font-size="13" text-anchor="middle" class="h" >sin A</text><text x="166" y="28.6" font-size="13" text-anchor="middle" class="h" >cosec A</text><text x="250" y="94.9" font-size="14" text-anchor="start" class="h" >(sin A + cosec A)²</text><text x="250" y="122.5" font-size="13" text-anchor="start" fill="#7C5CFF" class="h" >sin A × cosec A = 1</text><text x="250" y="150.2" font-size="12" text-anchor="start" fill="#8A8FB0" class="h" >(each purple</text><text x="250" y="166.2" font-size="12" text-anchor="start" fill="#8A8FB0" class="h" >rectangle)</text></svg>
