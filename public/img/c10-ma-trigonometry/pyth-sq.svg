<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Right triangle ABC with the relation AB squared plus BC squared equals AC squared and three ways to divide it</title>
<style>.fl{stroke-dasharray:10 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.pu{animation:pu 2.2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sc{animation:sc 3s ease-in-out infinite}@keyframes sc{0%,100%{transform:scale(1)}50%{transform:scale(.55)}}.gr{animation:gr 3s ease-in-out infinite}@keyframes gr{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.6)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:14px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<polygon points="25,179.4 190,179.4 190,55.6" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><polyline points="179,179.4 179,168.4 190,168.4" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><text x="290" y="65.2" font-size="15" text-anchor="middle" class="h" >AB² + BC² = AC²</text><text x="290" y="104.9" font-size="14" text-anchor="middle" fill="#7C5CFF" class="h" >divide by AC²</text><text x="290" y="134.9" font-size="14" text-anchor="middle" fill="#0B93D4" class="h" >divide by AB²</text><text x="290" y="164.9" font-size="14" text-anchor="middle" fill="#3FA34D" class="h" >divide by BC²</text><circle cx="25" cy="179.4" r="4" fill="#2B2F4A"/><circle cx="190" cy="179.4" r="4" fill="#2B2F4A"/><circle cx="190" cy="55.6" r="4" fill="#2B2F4A"/><text x="11" y="189.9" font-size="15" text-anchor="middle" class="h" >A</text><text x="202" y="193.6" font-size="15" text-anchor="middle" class="h" >B</text><text x="198.3" y="48.4" font-size="15" text-anchor="middle" class="h" >C</text></svg>
