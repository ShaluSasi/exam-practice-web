<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Two set squares: a 45-45-90 triangle with sides 1, 1, root 2 and a 30-60-90 triangle with sides 1, root 3, 2</title>
<style>.fl{stroke-dasharray:10 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.pu{animation:pu 2.2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sc{animation:sc 3s ease-in-out infinite}@keyframes sc{0%,100%{transform:scale(1)}50%{transform:scale(.55)}}.gr{animation:gr 3s ease-in-out infinite}@keyframes gr{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.6)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:14px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<polygon points="25,190 135,190 135,80" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><polyline points="125,190 125,180 135,180" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><path class="pu" d="M51 190A26 26 0 0 0 43.4 171.6" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round"/><text x="62" y="178.9" font-size="12" text-anchor="middle" fill="#FF8A1F" class="h" >45°</text><path d="M135 102A22 22 0 0 1 119.4 95.6" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round"/><text x="120.5" y="119.3" font-size="12" text-anchor="middle" fill="#FF8A1F" class="h" >45°</text><text x="80" y="212.9" font-size="14" text-anchor="middle" class="h" >1</text><text x="150" y="139.9" font-size="14" text-anchor="middle" class="h" >1</text><text x="66" y="124.9" font-size="14" text-anchor="middle" class="h" >√2</text><polygon points="205,190 343.6,190 343.6,110" fill="#E5F6E3" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><polyline points="333.6,190 333.6,180 343.6,180" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><path class="pu" d="M245 190A40 40 0 0 0 239.6 170" fill="none" stroke="#3FA34D" stroke-width="3" stroke-linecap="round"/><text x="259.1" y="179.7" font-size="12" text-anchor="middle" fill="#3FA34D" class="h" >30°</text><path d="M343.6 134A24 24 0 0 1 322.8 122" fill="none" stroke="#3FA34D" stroke-width="3" stroke-linecap="round"/><text x="324.6" y="147.1" font-size="12" text-anchor="middle" fill="#3FA34D" class="h" >60°</text><text x="274.3" y="212.9" font-size="14" text-anchor="middle" class="h" >√3</text><text x="357.6" y="154.9" font-size="14" text-anchor="middle" class="h" >1</text><text x="255" y="132.9" font-size="14" text-anchor="middle" class="h" >2</text><text x="200" y="32.9" font-size="14" text-anchor="middle" class="h" >Sides of the two set squares</text></svg>
