<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Two bars for A = B = 30 degrees: sin of the sum is 0.87, but the sum of the sines is 1</title>
<style>.fl{stroke-dasharray:10 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.pu{animation:pu 2.2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sc{animation:sc 3s ease-in-out infinite}@keyframes sc{0%,100%{transform:scale(1)}50%{transform:scale(.55)}}.gr{animation:gr 3s ease-in-out infinite}@keyframes gr{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.6)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:14px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.gb{transform-box:fill-box;transform-origin:50% 100%;animation:gr 3s ease-in-out infinite}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<line x1="60" y1="200" x2="340" y2="200" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><rect class="gb" x="95" y="78.8" width="70" height="121.2" rx="6" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3"/><rect class="gb" x="235" y="60" width="70" height="140" rx="6" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3"/><text x="130" y="70" font-size="15" text-anchor="middle" class="h" >0.87</text><text x="270" y="51.3" font-size="15" text-anchor="middle" class="h" >1</text><text x="130" y="224.9" font-size="14" text-anchor="middle" class="h" >sin(A + B)</text><text x="270" y="224.9" font-size="14" text-anchor="middle" class="h" >sin A + sin B</text><text x="200" y="22.9" font-size="14" text-anchor="middle" class="h" >A = B = 30°</text></svg>
