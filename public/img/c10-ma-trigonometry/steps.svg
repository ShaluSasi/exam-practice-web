<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A staircase of five steps climbing from the left-hand side of an identity to the right-hand side</title>
<style>.fl{stroke-dasharray:10 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.pu{animation:pu 2.2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sc{animation:sc 3s ease-in-out infinite}@keyframes sc{0%,100%{transform:scale(1)}50%{transform:scale(.55)}}.gr{animation:gr 3s ease-in-out infinite}@keyframes gr{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.6)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:14px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.cl{animation:cl 4s ease-in-out infinite}@keyframes cl{0%,100%{transform:translate(0,0)}50%{transform:translate(224px,-112px)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="40" y="174" width="56" height="36" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5"/><rect x="96" y="146" width="56" height="64" fill="#E5F6E3" stroke="#2B2F4A" stroke-width="2.5"/><rect x="152" y="118" width="56" height="92" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5"/><rect x="208" y="90" width="56" height="120" fill="#E5F6E3" stroke="#2B2F4A" stroke-width="2.5"/><rect x="264" y="62" width="56" height="148" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5"/><text x="68" y="195.2" font-size="15" text-anchor="middle" class="h" >LHS</text><text x="292" y="83.2" font-size="15" text-anchor="middle" class="h" >RHS</text><circle class="cl" cx="68" cy="150" r="9" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5"/></svg>
