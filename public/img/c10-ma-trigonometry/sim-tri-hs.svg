<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Right triangle ABC; P is on AC and Q is on AC extended, with perpendiculars PM and QN to line AB</title>
<style>.fl{stroke-dasharray:10 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.pu{animation:pu 2.2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sc{animation:sc 3s ease-in-out infinite}@keyframes sc{0%,100%{transform:scale(1)}50%{transform:scale(.55)}}.gr{animation:gr 3s ease-in-out infinite}@keyframes gr{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.6)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:14px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<polygon points="30,205 270,205 270,40" fill="#F3EEFF" stroke="#7C5CFF" stroke-width="2.5" stroke-linejoin="round" /><polygon points="30,205 190,205 190,95" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><polygon points="30,205 110,205 110,150" fill="#FFE3C2" stroke="#FF8A1F" stroke-width="3" stroke-linejoin="round" /><polyline points="181,205 181,196 190,196" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><polyline points="101,205 101,196 110,196" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><polyline points="261,205 261,196 270,196" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><circle cx="30" cy="205" r="4" fill="#2B2F4A"/><circle cx="190" cy="205" r="4" fill="#2B2F4A"/><circle cx="190" cy="95" r="4" fill="#2B2F4A"/><circle cx="110" cy="150" r="4" fill="#2B2F4A"/><circle cx="270" cy="40" r="4" fill="#2B2F4A"/><circle cx="110" cy="205" r="4" fill="#2B2F4A"/><circle cx="270" cy="205" r="4" fill="#2B2F4A"/><text x="16" y="214.2" font-size="15" text-anchor="middle" class="h" >A</text><text x="196" y="226.2" font-size="15" text-anchor="middle" class="h" >B</text><text x="176" y="96.2" font-size="15" text-anchor="middle" class="h" >C</text><text x="96" y="153.2" font-size="15" text-anchor="middle" class="h" >P</text><text x="256" y="41.2" font-size="15" text-anchor="middle" class="h" >Q</text><text x="107" y="227.2" font-size="15" text-anchor="middle" class="h" >M</text><text x="274" y="227.2" font-size="15" text-anchor="middle" class="h" >N</text></svg>
