<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Left: a right triangle with a very small angle A, so BC is tiny and AC is almost AB. Right: angle A close to 90 degrees, so AB is tiny and AC is almost BC</title>
<style>.fl{stroke-dasharray:10 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.pu{animation:pu 2.2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sc{animation:sc 3s ease-in-out infinite}@keyframes sc{0%,100%{transform:scale(1)}50%{transform:scale(.55)}}.gr{animation:gr 3s ease-in-out infinite}@keyframes gr{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.6)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:14px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<polygon points="20,150 170,150 170,118.1" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><polyline points="161,150 161,141 170,141" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><path class="pu" d="M60 150A40 40 0 0 0 59.1 141.7" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round"/><line x1="170" y1="150" x2="170" y2="118.1" stroke="#E5484D" stroke-width="4" stroke-linecap="round" class="pu"/><text x="18" y="169.9" font-size="14" text-anchor="middle" class="h" >A</text><text x="180" y="168.9" font-size="14" text-anchor="middle" class="h" >B</text><text x="180" y="117" font-size="14" text-anchor="middle" class="h" >C</text><text x="95" y="196.6" font-size="13" text-anchor="middle" class="h" >A very small:</text><text x="95" y="214.6" font-size="13" text-anchor="middle" class="h" >BC ≈ 0, AC ≈ AB</text><polygon points="250,190 281.9,190 281.9,40" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><polyline points="272.9,190 272.9,181 281.9,181" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><path class="pu" d="M278 190A28 28 0 0 0 255.8 162.6" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round"/><line x1="250" y1="190" x2="281.9" y2="190" stroke="#E5484D" stroke-width="4" stroke-linecap="round" class="pu"/><text x="242" y="208.9" font-size="14" text-anchor="middle" class="h" >A</text><text x="293.9" y="208.9" font-size="14" text-anchor="middle" class="h" >B</text><text x="293.9" y="40.9" font-size="14" text-anchor="middle" class="h" >C</text><text x="200" y="222.3" font-size="1" text-anchor="middle" class="h" ></text><text x="330" y="94.5" font-size="13" text-anchor="middle" class="h" >A close</text><text x="330" y="111.5" font-size="13" text-anchor="middle" class="h" >to 90°:</text><text x="330" y="128.6" font-size="13" text-anchor="middle" class="h" >AB ≈ 0</text><text x="330" y="145.6" font-size="13" text-anchor="middle" class="h" >AC ≈ BC</text></svg>
