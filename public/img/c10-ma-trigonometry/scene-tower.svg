<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A student looking up at the top of a tall tower: the line of sight, the tower and the ground form a right triangle</title>
<style>.fl{stroke-dasharray:10 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.pu{animation:pu 2.2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sc{animation:sc 3s ease-in-out infinite}@keyframes sc{0%,100%{transform:scale(1)}50%{transform:scale(.55)}}.gr{animation:gr 3s ease-in-out infinite}@keyframes gr{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.6)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:14px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="0" y="200" width="400" height="40" fill="#CDEBC6"/><rect x="288" y="40" width="34" height="160" fill="#E9B98C" stroke="#2B2F4A" stroke-width="3"/><polygon points="288,40 322,40 305,18" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><line x1="296" y1="80" x2="314" y2="80" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="296" y1="120" x2="314" y2="120" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="296" y1="160" x2="314" y2="160" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><circle cx="92" cy="152" r="11" fill="#FFD9B5" stroke="#2B2F4A" stroke-width="3"/><line x1="92" y1="163" x2="92" y2="198" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round"/><line x1="92" y1="198" x2="82" y2="214" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round"/><line x1="92" y1="198" x2="102" y2="214" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round"/><line x1="100" y1="152" x2="305" y2="40" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" class="fl"/><line x1="92" y1="200" x2="305" y2="200" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5" /><line x1="305" y1="200" x2="305" y2="40" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5" /><polyline points="293,200 293,188 305,188" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><text x="200" y="226.6" font-size="13" text-anchor="middle" class="h" >distance from the tower</text><text x="250" y="116.5" font-size="13" text-anchor="middle" fill="#FF8A1F" class="h" >line of sight</text></svg>
