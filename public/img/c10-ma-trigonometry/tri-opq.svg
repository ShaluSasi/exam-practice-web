<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Right triangle OPQ, right-angled at P, with OP = 11 cm and OQ one centimetre longer than PQ</title>
<style>.fl{stroke-dasharray:10 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.pu{animation:pu 2.2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sc{animation:sc 3s ease-in-out infinite}@keyframes sc{0%,100%{transform:scale(1)}50%{transform:scale(.55)}}.gr{animation:gr 3s ease-in-out infinite}@keyframes gr{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.6)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:14px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<polygon points="30,146.6 320,146.6 320,93.4" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><polyline points="309,146.6 309,135.6 320,135.6" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><path class="pu" d="M56 146.6A26 26 0 0 0 55.6 141.9" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round"/><text x="175" y="166.2" font-size="14" text-anchor="middle" class="h">PQ = ?</text><text x="366.2" y="124.9" font-size="11.0" text-anchor="middle" class="h">OP = 11 cm</text><text x="171" y="102.9" font-size="14" text-anchor="middle" class="h">OQ = PQ + 1</text><circle cx="30" cy="146.6" r="4" fill="#2B2F4A"/><circle cx="320" cy="146.6" r="4" fill="#2B2F4A"/><circle cx="320" cy="93.4" r="4" fill="#2B2F4A"/><text x="15.1" y="153.2" font-size="15" text-anchor="middle" class="h">Q</text><text x="334.8" y="154.5" font-size="15" text-anchor="middle" class="h">P</text><text x="334.1" y="93.5" font-size="15" text-anchor="middle" class="h">O</text></svg>