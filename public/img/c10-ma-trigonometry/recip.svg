<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Right triangle with sides named opposite, adjacent and hypotenuse, and the six ratios as reciprocal pairs</title>
<style>.fl{stroke-dasharray:10 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.pu{animation:pu 2.2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sc{animation:sc 3s ease-in-out infinite}@keyframes sc{0%,100%{transform:scale(1)}50%{transform:scale(.55)}}.gr{animation:gr 3s ease-in-out infinite}@keyframes gr{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.6)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:14px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<polygon points="25,174.4 170,174.4 170,65.6" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><polyline points="159,174.4 159,163.4 170,163.4" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><path class="pu" d="M51 174.4A26 26 0 0 0 45.8 158.8" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round"/><text x="62.9" y="166.3" font-size="13" text-anchor="middle" fill="#FF8A1F" class="h" >A</text><line x1="170" y1="174.4" x2="170" y2="65.6" stroke="#3FA34D" stroke-width="4" stroke-linecap="round" /><line x1="25" y1="174.4" x2="170" y2="65.6" stroke="#E5484D" stroke-width="4" stroke-linecap="round" /><line x1="25" y1="174.4" x2="170" y2="174.4" stroke="#0B93D4" stroke-width="4" stroke-linecap="round" /><text x="206.1" y="124.5" font-size="13" text-anchor="middle" fill="#3FA34D" class="h" >opposite</text><text x="76.8" y="96.9" font-size="13" text-anchor="middle" fill="#E5484D" class="h" >hypotenuse</text><text x="97.5" y="193.1" font-size="13" text-anchor="middle" fill="#0B93D4" class="h" >adjacent</text><circle cx="25" cy="174.4" r="4" fill="#2B2F4A"/><circle cx="170" cy="174.4" r="4" fill="#2B2F4A"/><circle cx="170" cy="65.6" r="4" fill="#2B2F4A"/><text x="262" y="56.5" font-size="13" text-anchor="start" fill="#2B2F4A" class="h" >sin A = opp/hyp</text><text x="262" y="84.5" font-size="13" text-anchor="start" fill="#2B2F4A" class="h" >cos A = adj/hyp</text><text x="262" y="112.5" font-size="13" text-anchor="start" fill="#2B2F4A" class="h" >tan A = opp/adj</text><text x="262" y="140.6" font-size="13" text-anchor="start" fill="#7C5CFF" class="h" >cosec A = 1/sin A</text><text x="262" y="168.6" font-size="13" text-anchor="start" fill="#7C5CFF" class="h" >sec A = 1/cos A</text><text x="262" y="196.6" font-size="13" text-anchor="start" fill="#7C5CFF" class="h" >cot A = 1/tan A</text></svg>
