<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A quarter circle showing the two angles A minus B and A plus B measured from the base line</title>
<style>.fl{stroke-dasharray:10 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.pu{animation:pu 2.2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sc{animation:sc 3s ease-in-out infinite}@keyframes sc{0%,100%{transform:scale(1)}50%{transform:scale(.55)}}.gr{animation:gr 3s ease-in-out infinite}@keyframes gr{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.6)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:14px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.sw{transform-origin:40px 210px;animation:sw 6s ease-in-out infinite}@keyframes sw{0%{transform:rotate(0)}100%{transform:rotate(-90deg)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M40 210L215 210A175 175 0 0 0 40 35Z" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><line x1="40" y1="210" x2="215" y2="210" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="237" y="212.9" font-size="14" text-anchor="middle" class="h" >0°</text><line x1="40" y1="210" x2="191.6" y2="122.5" stroke="#3FA34D" stroke-width="3" stroke-linecap="round" /><text x="210.6" y="116.4" font-size="14" text-anchor="middle" class="h" >A − B</text><line x1="40" y1="210" x2="40" y2="35" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" /><text x="40" y="25.9" font-size="14" text-anchor="middle" class="h" >A + B</text><circle cx="40" cy="210" r="4" fill="#2B2F4A"/><text x="300" y="64.5" font-size="13" text-anchor="middle" class="h" >0° &lt; A + B ≤ 90°</text><text x="300" y="84.5" font-size="13" text-anchor="middle" class="h" >and A > B</text></svg>
