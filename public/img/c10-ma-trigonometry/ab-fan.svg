<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A quarter circle with two rays from the centre making unknown angles A and B with the base line</title>
<style>.fl{stroke-dasharray:10 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.pu{animation:pu 2.2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sc{animation:sc 3s ease-in-out infinite}@keyframes sc{0%,100%{transform:scale(1)}50%{transform:scale(.55)}}.gr{animation:gr 3s ease-in-out infinite}@keyframes gr{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.6)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:14px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.sw{transform-origin:40px 210px;animation:sw 6s ease-in-out infinite}@keyframes sw{0%{transform:rotate(0)}100%{transform:rotate(-90deg)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M40 210L215 210A175 175 0 0 0 40 35Z" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><line x1="40" y1="210" x2="215" y2="210" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="40" y1="210" x2="202.3" y2="144.4" stroke="#3FA34D" stroke-width="3" stroke-linecap="round" /><line x1="40" y1="210" x2="140.4" y2="66.7" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" /><path d="M110 210A70 70 0 0 0 104.9 183.8" fill="none" stroke="#3FA34D" stroke-width="3" stroke-linecap="round"/><path d="M85 210A45 45 0 0 0 65.8 173.1" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round"/><text x="121" y="198" font-size="15" text-anchor="middle" class="h" fill="#3FA34D">B</text><text x="82" y="168" font-size="15" text-anchor="middle" class="h">A</text><circle cx="40" cy="210" r="4" fill="#2B2F4A"/><text x="300" y="64.5" font-size="13" text-anchor="middle" class="h" >0° &lt; A + B ≤ 90°</text><text x="300" y="84.5" font-size="13" text-anchor="middle" class="h" >and A &gt; B</text><text x="300" y="124.5" font-size="13" text-anchor="middle" class="h" >A = ?   B = ?</text></svg>