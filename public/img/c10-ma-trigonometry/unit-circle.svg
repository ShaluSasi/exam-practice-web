<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A quarter circle of radius 1 with a point P on it; the vertical and horizontal segments from P form a right triangle with the radius OP</title>
<style>.fl{stroke-dasharray:10 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.pu{animation:pu 2.2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sc{animation:sc 3s ease-in-out infinite}@keyframes sc{0%,100%{transform:scale(1)}50%{transform:scale(.55)}}.gr{animation:gr 3s ease-in-out infinite}@keyframes gr{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.6)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:14px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M50 215L220 215A170 170 0 0 0 50 45Z" fill="#F3F9FF" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><polygon points="50,215 180.2,215 180.2,105.7" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="0.1" stroke-linejoin="round" /><line x1="50" y1="215" x2="180.2" y2="105.7" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><line x1="180.2" y1="215" x2="180.2" y2="105.7" stroke="#3FA34D" stroke-width="4" stroke-linecap="round" /><line x1="50" y1="215" x2="180.2" y2="215" stroke="#0B93D4" stroke-width="4" stroke-linecap="round" /><polyline points="169.2,215 169.2,204 180.2,204" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><path class="pu" d="M86 215A36 36 0 0 0 77.6 191.9" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round"/><text x="97" y="203.1" font-size="15" text-anchor="middle" fill="#FF8A1F" class="h" >θ</text><circle cx="50" cy="215" r="4" fill="#2B2F4A"/><circle cx="180.2" cy="105.7" r="4" fill="#2B2F4A"/><circle cx="180.2" cy="215" r="4" fill="#2B2F4A"/><text x="36" y="224.2" font-size="15" text-anchor="middle" class="h" >O</text><text x="192.2" y="103" font-size="15" text-anchor="middle" class="h" >P</text><text x="182.2" y="236.2" font-size="15" text-anchor="middle" class="h" >M</text><text x="310" y="94.9" font-size="14" text-anchor="middle" class="h" >Unit circle:</text><text x="310" y="116.9" font-size="14" text-anchor="middle" class="h" >OP = 1</text></svg>
