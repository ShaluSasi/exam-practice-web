<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Table of the values of sin, cos and tan for the angles 0, 30, 45, 60 and 90 degrees</title>
<style>.fl{stroke-dasharray:10 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.pu{animation:pu 2.2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sc{animation:sc 3s ease-in-out infinite}@keyframes sc{0%,100%{transform:scale(1)}50%{transform:scale(.55)}}.gr{animation:gr 3s ease-in-out infinite}@keyframes gr{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.6)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:14px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.hd{animation:pu 2.2s ease-in-out infinite}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="20" y="20" width="372" height="192" rx="8" fill="#fff" stroke="#2B2F4A" stroke-width="2.5"/><rect x="20" y="20" width="372" height="48" rx="8" fill="#FFE3C2" stroke="#2B2F4A" stroke-width="2.5"/><rect x="20" y="68" width="62" height="144" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2"/><line x1="20" y1="68" x2="392" y2="68" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="20" y1="116" x2="392" y2="116" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="20" y1="164" x2="392" y2="164" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="82" y1="20" x2="82" y2="212" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="144" y1="20" x2="144" y2="212" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="206" y1="20" x2="206" y2="212" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="268" y1="20" x2="268" y2="212" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="330" y1="20" x2="330" y2="212" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="51" y="49.2" font-size="15" text-anchor="middle" class="h" >∠A</text><text x="113" y="49.2" font-size="15" text-anchor="middle" class="h" >0°</text><text x="175" y="49.2" font-size="15" text-anchor="middle" class="h" >30°</text><text x="237" y="49.2" font-size="15" text-anchor="middle" class="h" >45°</text><text x="299" y="49.2" font-size="15" text-anchor="middle" class="h" >60°</text><text x="361" y="49.2" font-size="15" text-anchor="middle" class="h" >90°</text><text x="51" y="96.9" font-size="14" text-anchor="middle" class="h" >sin A</text><text x="113" y="97.2" font-size="15" text-anchor="middle" class="h" >0</text><text x="175" y="97.2" font-size="15" text-anchor="middle" class="h" >1/2</text><text x="237" y="97.2" font-size="15" text-anchor="middle" class="h" >1/√2</text><text x="299" y="97.2" font-size="15" text-anchor="middle" class="h" >√3/2</text><text x="361" y="97.2" font-size="15" text-anchor="middle" class="h" >1</text><text x="51" y="144.9" font-size="14" text-anchor="middle" class="h" >cos A</text><text x="113" y="145.2" font-size="15" text-anchor="middle" class="h" >1</text><text x="175" y="145.2" font-size="15" text-anchor="middle" class="h" >√3/2</text><text x="237" y="145.2" font-size="15" text-anchor="middle" class="h" >1/√2</text><text x="299" y="145.2" font-size="15" text-anchor="middle" class="h" >1/2</text><text x="361" y="145.2" font-size="15" text-anchor="middle" class="h" >0</text><text x="51" y="192.9" font-size="14" text-anchor="middle" class="h" >tan A</text><text x="113" y="193.2" font-size="15" text-anchor="middle" class="h" >0</text><text x="175" y="193.2" font-size="15" text-anchor="middle" class="h" >1/√3</text><text x="237" y="193.2" font-size="15" text-anchor="middle" class="h" >1</text><text x="299" y="193.2" font-size="15" text-anchor="middle" class="h" >√3</text><text x="361" y="192.2" font-size="12" text-anchor="middle" class="h" >undefined</text></svg>
