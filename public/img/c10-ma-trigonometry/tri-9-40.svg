<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Tall thin right triangle ABC: AB = 9 cm, BC = 40 cm, AC = 41 cm</title>
<style>.fl{stroke-dasharray:10 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.pu{animation:pu 2.2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sc{animation:sc 3s ease-in-out infinite}@keyframes sc{0%,100%{transform:scale(1)}50%{transform:scale(.55)}}.gr{animation:gr 3s ease-in-out infinite}@keyframes gr{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.6)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:14px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<polygon points="178.3,215 221.7,215 221.7,22" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><polyline points="210.7,215 210.7,204 221.7,204" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><path class="pu" d="M221.7 48A26 26 0 0 1 216 47.4" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round"/><text x="200" y="234.6" font-size="14" text-anchor="middle" class="h" >9 cm</text><text x="248.3" y="123.4" font-size="14" text-anchor="middle" class="h" >40 cm</text><text x="172.9" y="117.3" font-size="14" text-anchor="middle" class="h" >41 cm</text><circle cx="178.3" cy="215" r="4" fill="#2B2F4A"/><circle cx="221.7" cy="215" r="4" fill="#2B2F4A"/><circle cx="221.7" cy="22" r="4" fill="#2B2F4A"/><text x="172.1" y="233.9" font-size="15" text-anchor="middle" class="h" >A</text><text x="225" y="234.9" font-size="15" text-anchor="middle" class="h" >B</text><text x="223.4" y="12.3" font-size="15" text-anchor="middle" class="h" >C</text></svg>
