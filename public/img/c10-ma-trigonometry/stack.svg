<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Stacked bars of sin squared and cos squared for several angles: each stack has the same total height of 1</title>
<style>.fl{stroke-dasharray:10 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.pu{animation:pu 2.2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sc{animation:sc 3s ease-in-out infinite}@keyframes sc{0%,100%{transform:scale(1)}50%{transform:scale(.55)}}.gr{animation:gr 3s ease-in-out infinite}@keyframes gr{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.6)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:14px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<line x1="40" y1="195" x2="370" y2="195" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="40" y1="55" x2="365" y2="55" stroke="#E5484D" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5" class="pu"/><text x="30" y="59.9" font-size="14" text-anchor="middle" class="h" >1</text><rect x="62" y="55" width="40" height="140" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5"/><text x="82" y="217.6" font-size="13" text-anchor="middle" class="h" >0°</text><rect x="124" y="90" width="40" height="105" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5"/><rect x="124" y="55" width="40" height="35" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5"/><text x="144" y="217.6" font-size="13" text-anchor="middle" class="h" >30°</text><rect x="186" y="125" width="40" height="70" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5"/><rect x="186" y="55" width="40" height="70" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5"/><text x="206" y="217.6" font-size="13" text-anchor="middle" class="h" >45°</text><rect x="248" y="160" width="40" height="35" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5"/><rect x="248" y="55" width="40" height="105" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5"/><text x="268" y="217.6" font-size="13" text-anchor="middle" class="h" >60°</text><rect x="310" y="55" width="40" height="140" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5"/><text x="330" y="217.6" font-size="13" text-anchor="middle" class="h" >90°</text><rect x="60" y="14" width="14" height="14" fill="#FF8A1F"/><text x="80" y="26.6" font-size="13" text-anchor="start" class="h" >sin²A</text><rect x="150" y="14" width="14" height="14" fill="#0B93D4"/><text x="170" y="26.6" font-size="13" text-anchor="start" class="h" >cos²A</text><text x="290" y="26.6" font-size="13" text-anchor="start" fill="#E5484D" class="h" >total = 1</text></svg>
