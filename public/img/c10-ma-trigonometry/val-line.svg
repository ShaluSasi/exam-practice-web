<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A number line from 0 to 2 with ticks every half; a marker slides from left to right</title>
<style>.fl{stroke-dasharray:10 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.pu{animation:pu 2.2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sc{animation:sc 3s ease-in-out infinite}@keyframes sc{0%,100%{transform:scale(1)}50%{transform:scale(.55)}}.gr{animation:gr 3s ease-in-out infinite}@keyframes gr{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.6)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:14px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.mv{animation:mv 5s ease-in-out infinite}@keyframes mv{0%,100%{transform:translateX(0)}50%{transform:translateX(300px)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<line x1="30" y1="130" x2="370" y2="130" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><line x1="50" y1="121" x2="50" y2="139" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="50" y="163.2" font-size="15" text-anchor="middle" class="h" >0</text><line x1="125" y1="121" x2="125" y2="139" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="125" y="163.2" font-size="15" text-anchor="middle" class="h" >0.5</text><line x1="200" y1="121" x2="200" y2="139" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="200" y="163.2" font-size="15" text-anchor="middle" class="h" >1</text><line x1="275" y1="121" x2="275" y2="139" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="275" y="163.2" font-size="15" text-anchor="middle" class="h" >1.5</text><line x1="350" y1="121" x2="350" y2="139" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="350" y="163.2" font-size="15" text-anchor="middle" class="h" >2</text><polygon class="mv" points="50,118 41,100 59,100" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2"/><text x="50" y="194.6" font-size="13" text-anchor="middle" fill="#8A8FB0" class="h" >smaller</text><text x="350" y="194.6" font-size="13" text-anchor="middle" fill="#8A8FB0" class="h" >larger</text><text x="200" y="45.2" font-size="15" text-anchor="middle" class="h" >Place the values from left to right</text></svg>
