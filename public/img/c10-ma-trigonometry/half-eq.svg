<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>An equilateral triangle of side 2a cut along its altitude into two identical 30-60-90 triangles</title>
<style>.fl{stroke-dasharray:10 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.pu{animation:pu 2.2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sc{animation:sc 3s ease-in-out infinite}@keyframes sc{0%,100%{transform:scale(1)}50%{transform:scale(.55)}}.gr{animation:gr 3s ease-in-out infinite}@keyframes gr{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.6)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:14px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.sp{animation:sp 4s ease-in-out infinite}@keyframes sp{0%,35%{transform:translateX(0)}65%,100%{transform:translateX(16px)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
