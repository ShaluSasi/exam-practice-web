<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A quarter circle with rays at 0, 30, 45, 60 and 90 degrees from the base, and a ray sweeping up</title>
<style>.fl{stroke-dasharray:10 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.pu{animation:pu 2.2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sc{animation:sc 3s ease-in-out infinite}@keyframes sc{0%,100%{transform:scale(1)}50%{transform:scale(.55)}}.gr{animation:gr 3s ease-in-out infinite}@keyframes gr{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.6)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:14px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.sw{transform-origin:40px 210px;animation:sw 6s ease-in-out infinite}@keyframes sw{0%{transform:rotate(0)}100%{transform:rotate(-90deg)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M40 210L215 210A175 175 0 0 0 40 35Z" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><line x1="40" y1="210" x2="215" y2="210" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="237" y="212.9" font-size="14" text-anchor="middle" class="h" >0°</text><line x1="40" y1="210" x2="191.6" y2="122.5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="210.6" y="116.4" font-size="14" text-anchor="middle" class="h" >30°</text><line x1="40" y1="210" x2="163.7" y2="86.3" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="179.3" y="75.6" font-size="14" text-anchor="middle" class="h" >45°</text><line x1="40" y1="210" x2="127.5" y2="58.4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="138.5" y="44.3" font-size="14" text-anchor="middle" class="h" >60°</text><line x1="40" y1="210" x2="40" y2="35" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="40" y="25.9" font-size="14" text-anchor="middle" class="h" >90°</text><circle cx="40" cy="210" r="4" fill="#2B2F4A"/><g class="sw"><line x1="40" y1="210" x2="195" y2="210" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" /></g></svg>
