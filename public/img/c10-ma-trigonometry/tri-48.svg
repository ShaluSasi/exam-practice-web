<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Right triangle PQR, right-angled at Q, with PQ = 4 cm and PR = 8 cm</title>
<style>.fl{stroke-dasharray:10 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.pu{animation:pu 2.2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sc{animation:sc 3s ease-in-out infinite}@keyframes sc{0%,100%{transform:scale(1)}50%{transform:scale(.55)}}.gr{animation:gr 3s ease-in-out infinite}@keyframes gr{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.6)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:14px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<polygon points="145.7,212 254.3,212 254.3,24" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><polyline points="243.3,212 243.3,201 254.3,201" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><text x="200" y="231.6" font-size="14" text-anchor="middle" class="h" >PQ = 4 cm</text><text x="164.1" y="102.2" font-size="14" text-anchor="middle" class="h" >PR = 8 cm</text><circle cx="145.7" cy="212" r="4" fill="#2B2F4A"/><circle cx="254.3" cy="212" r="4" fill="#2B2F4A"/><circle cx="254.3" cy="24" r="4" fill="#2B2F4A"/><text x="134.4" y="227.1" font-size="15" text-anchor="middle" class="h" >P</text><text x="261.8" y="230.2" font-size="15" text-anchor="middle" class="h" >Q</text><text x="258.4" y="14.8" font-size="15" text-anchor="middle" class="h" >R</text></svg>
