<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Equilateral triangle ABC of side 10 cm with altitude AD to the base BC</title>
<style>.fl{stroke-dasharray:10 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.pu{animation:pu 2.2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sc{animation:sc 3s ease-in-out infinite}@keyframes sc{0%,100%{transform:scale(1)}50%{transform:scale(.55)}}.gr{animation:gr 3s ease-in-out infinite}@keyframes gr{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.6)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:14px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<polygon points="200,31.8 100,205 300,205" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><line x1="200" y1="31.8" x2="200" y2="205" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 5" /><polyline points="189,205 189,194 200,194" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><circle cx="200" cy="31.8" r="4" fill="#2B2F4A"/><circle cx="100" cy="205" r="4" fill="#2B2F4A"/><circle cx="300" cy="205" r="4" fill="#2B2F4A"/><circle cx="200" cy="205" r="4" fill="#2B2F4A"/><text x="200" y="17.2" font-size="15" text-anchor="middle" class="h" >A</text><text x="88" y="223.2" font-size="15" text-anchor="middle" class="h" >B</text><text x="312" y="223.2" font-size="15" text-anchor="middle" class="h" >C</text><text x="200" y="229.2" font-size="15" text-anchor="middle" class="h" >D</text><text x="125.9" y="109.4" font-size="14" text-anchor="middle" class="h" >10 cm</text><text x="208" y="156.9" font-size="14" text-anchor="start" fill="#FF8A1F" class="h" >AD = ?</text></svg>
