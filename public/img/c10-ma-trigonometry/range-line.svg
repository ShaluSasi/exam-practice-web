<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A number line: sin A and cos A stay between 0 and 1, sec A and cosec A are 1 or more; a red cross marks 4/3</title>
<style>.fl{stroke-dasharray:10 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.pu{animation:pu 2.2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sc{animation:sc 3s ease-in-out infinite}@keyframes sc{0%,100%{transform:scale(1)}50%{transform:scale(.55)}}.gr{animation:gr 3s ease-in-out infinite}@keyframes gr{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.6)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:14px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="50" y="96" width="100" height="26" rx="6" fill="#CDEBC6" stroke="#3FA34D" stroke-width="2.5"/><text x="100" y="113.2" font-size="12" text-anchor="middle" class="h" >sin A, cos A</text><rect x="150" y="138" width="230" height="26" rx="6" fill="#DCEEFB" stroke="#0B93D4" stroke-width="2.5"/><text x="270" y="155.2" font-size="12" text-anchor="middle" class="h" >sec A, cosec A</text><line x1="36" y1="130" x2="386" y2="130" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="50" y1="122" x2="50" y2="138" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="50" y="184.9" font-size="14" text-anchor="middle" class="h" >0</text><line x1="150" y1="122" x2="150" y2="138" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="150" y="184.9" font-size="14" text-anchor="middle" class="h" >1</text><line x1="250" y1="122" x2="250" y2="138" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="250" y="184.9" font-size="14" text-anchor="middle" class="h" >2</text><line x1="350" y1="122" x2="350" y2="138" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="350" y="184.9" font-size="14" text-anchor="middle" class="h" >3</text><g class="pu"><line x1="176.3" y1="116" x2="190.3" y2="102" stroke="#E5484D" stroke-width="4" stroke-linecap="round" /><line x1="176.3" y1="102" x2="190.3" y2="116" stroke="#E5484D" stroke-width="4" stroke-linecap="round" /></g><text x="183.3" y="92.9" font-size="14" text-anchor="middle" fill="#E5484D" class="h" >4/3</text></svg>
