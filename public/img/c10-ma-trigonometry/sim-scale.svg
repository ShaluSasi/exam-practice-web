<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Three similar right triangles sharing the angle at A: the ratio opposite over hypotenuse is the same in each</title>
<style>.fl{stroke-dasharray:10 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.pu{animation:pu 2.2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sc{animation:sc 3s ease-in-out infinite}@keyframes sc{0%,100%{transform:scale(1)}50%{transform:scale(.55)}}.gr{animation:gr 3s ease-in-out infinite}@keyframes gr{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.6)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:14px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.s3{transform-origin:30px 170px}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<polygon points="30,175 270,175 270,55" fill="#F3EEFF" stroke="#7C5CFF" stroke-width="2.5" stroke-linejoin="round" /><polygon points="30,175 190,175 190,95" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><g class="sc s3"><polygon points="30,175 110,175 110,135" fill="#FFE3C2" stroke="#FF8A1F" stroke-width="3" stroke-linejoin="round" /></g><path d="M60 175A30 30 0 0 0 56.8 161.6" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round"/><circle cx="30" cy="175" r="4" fill="#2B2F4A"/><circle cx="190" cy="175" r="4" fill="#2B2F4A"/><circle cx="190" cy="95" r="4" fill="#2B2F4A"/><circle cx="110" cy="135" r="4" fill="#2B2F4A"/><circle cx="270" cy="55" r="4" fill="#2B2F4A"/><text x="26" y="198.2" font-size="15" text-anchor="middle" class="h" >A</text><text x="278" y="50.2" font-size="15" text-anchor="middle" class="h" >Q</text><text x="200" y="212.9" font-size="14" text-anchor="middle" class="h" >BC / AC  =  PM / AP  =  QN / AQ  =  sin A</text><text x="200" y="232.2" font-size="12" text-anchor="middle" fill="#8A8FB0" class="h" >the angle at A is the same in all three</text></svg>
