<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A balance with sec squared A on the left pan and 1 plus tan squared A on the right pan, level</title>
<style>.fl{stroke-dasharray:10 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.pu{animation:pu 2.2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sc{animation:sc 3s ease-in-out infinite}@keyframes sc{0%,100%{transform:scale(1)}50%{transform:scale(.55)}}.gr{animation:gr 3s ease-in-out infinite}@keyframes gr{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.6)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:14px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.wb{transform-origin:200px 70px;animation:wb 3s ease-in-out infinite}@keyframes wb{0%,100%{transform:rotate(0)}30%{transform:rotate(2.5deg)}70%{transform:rotate(-2.5deg)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<line x1="200" y1="70" x2="200" y2="205" stroke="#2B2F4A" stroke-width="6" stroke-linecap="round" /><line x1="150" y1="208" x2="250" y2="208" stroke="#2B2F4A" stroke-width="8" stroke-linecap="round" /><g class="wb"><line x1="70" y1="70" x2="330" y2="70" stroke="#2B2F4A" stroke-width="6" stroke-linecap="round" /><line x1="70" y1="70" x2="60" y2="150" stroke="#8A8FB0" stroke-width="2" stroke-linecap="round" /><line x1="130" y1="70" x2="140" y2="150" stroke="#8A8FB0" stroke-width="2" stroke-linecap="round" /><path d="M52 150H148Q140 188 100 188Q60 188 52 150Z" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3"/><text x="100" y="172.9" font-size="14" text-anchor="middle" class="h" >sec²A</text><line x1="270" y1="70" x2="260" y2="150" stroke="#8A8FB0" stroke-width="2" stroke-linecap="round" /><line x1="330" y1="70" x2="340" y2="150" stroke="#8A8FB0" stroke-width="2" stroke-linecap="round" /><path d="M252 150H348Q340 188 300 188Q260 188 252 150Z" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3"/><text x="300" y="172.9" font-size="14" text-anchor="middle" class="h" >1 + tan²A</text></g><circle cx="200" cy="70" r="7" fill="#FF8A1F"/><text x="200" y="26.9" font-size="14" text-anchor="middle" class="h" >always balanced</text></svg>
