<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Right triangle ABC with AB = 9, BC = 12, AC = 15 and a smaller similar triangle APM with AP = 10 cm</title>
<style>.fl{stroke-dasharray:10 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.pu{animation:pu 2.2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.sc{animation:sc 3s ease-in-out infinite}@keyframes sc{0%,100%{transform:scale(1)}50%{transform:scale(.55)}}.gr{animation:gr 3s ease-in-out infinite}@keyframes gr{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.6)}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:14px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.s2{transform-origin:122.6px 215px}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<polygon points="122.6,215 267.4,215 267.4,22" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><g class="sc s2"><polygon points="122.6,215 219.1,215 219.1,86.3" fill="#FFE3C2" stroke="#FF8A1F" stroke-width="3" stroke-linejoin="round" /></g><polyline points="256.4,215 256.4,204 267.4,204" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><polyline points="210.1,215 210.1,206 219.1,206" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><circle cx="122.6" cy="215" r="4" fill="#2B2F4A"/><circle cx="267.4" cy="215" r="4" fill="#2B2F4A"/><circle cx="267.4" cy="22" r="4" fill="#2B2F4A"/><circle cx="219.1" cy="86.3" r="4" fill="#2B2F4A"/><circle cx="219.1" cy="215" r="4" fill="#2B2F4A"/><text x="110.1" y="228.6" font-size="15" text-anchor="middle" class="h" >A</text><text x="276.4" y="232.2" font-size="15" text-anchor="middle" class="h" >B</text><text x="272.6" y="13.2" font-size="15" text-anchor="middle" class="h" >C</text><text x="205.1" y="83.6" font-size="15" text-anchor="middle" class="h" >P</text><text x="216.1" y="236.2" font-size="15" text-anchor="middle" class="h" >M</text><text x="290.7" y="107.5" font-size="13" text-anchor="middle" class="h" >BC = 12</text><text x="130.9" y="147.2" font-size="13" text-anchor="middle" fill="#FF8A1F" class="h" >AP = 10</text></svg>
