<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Two money plant cuttings in water: the one with a node and leaf grows roots, the one cut between nodes does not</title>
<style>.rt{transform-box:fill-box;transform-origin:top center;animation:r 3.5s ease-in-out infinite}@keyframes r{0%{transform:scale(.2)}70%,100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="55" y="110" width="90" height="100" rx="10" fill="#EAF6FD" stroke="#0B93D4" stroke-width="3" /><rect x="58" y="140" width="84" height="67" rx="8" fill="#BFE3F5" stroke="none" stroke-width="0" /><rect x="255" y="110" width="90" height="100" rx="10" fill="#EAF6FD" stroke="#0B93D4" stroke-width="3" /><rect x="258" y="140" width="84" height="67" rx="8" fill="#BFE3F5" stroke="none" stroke-width="0" /><line x1="100" y1="40" x2="100" y2="190" stroke="#3FA34D" stroke-width="5" stroke-linecap="round" /><circle cx="100" cy="85" r="6" fill="#8A5A2B" stroke="#2B2F4A" stroke-width="2" /><g transform="translate(100 80) rotate(-60) scale(0.8)"><path d="M0 0C-16 -12 -30 8 0 30C30 8 16 -12 0 0Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(100 80) rotate(60) scale(0.8)"><path d="M0 0C-16 -12 -30 8 0 30C30 8 16 -12 0 0Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round" /></g><g class="rt"><path d="M100 190q-14 8 -22 18M100 190q0 12 0 18M100 190q14 8 22 18" fill="none" stroke="#F4EBD9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><line x1="300" y1="60" x2="300" y2="190" stroke="#3FA34D" stroke-width="5" stroke-linecap="round" /><text x="100" y="232" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >A: has a node with a leaf</text><text x="300" y="232" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >B: only the part between nodes</text><text x="100" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#3FA34D" text-anchor="middle" >Roots grow!</text><text x="300" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#E5484D" text-anchor="middle" >No new growth</text>
</svg>
