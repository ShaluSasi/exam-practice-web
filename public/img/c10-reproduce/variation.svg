<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Heat-resistant bacteria survive when the water warms up and the other bacteria die</title>
<style>.die{animation:d 4s ease-in-out infinite}.born{animation:bo 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center;}@keyframes d{0%,25%{opacity:1}60%,100%{opacity:.08}}@keyframes bo{0%,40%{opacity:0;transform:scale(.2)}70%,100%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="14" y="30" width="170" height="150" rx="6" fill="#E3F2FD" stroke="#0B93D4" stroke-width="3" /><text x="99" y="22" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Cool water</text><g ><ellipse cx="45" cy="65" rx="13" ry="7" fill="#9AD5E8" stroke="#2B2F4A" stroke-width="2.5" transform="rotate(0 45 65)"/></g><g ><ellipse cx="90" cy="60" rx="13" ry="7" fill="#9AD5E8" stroke="#2B2F4A" stroke-width="2.5" transform="rotate(25 90 60)"/></g><g ><ellipse cx="140" cy="75" rx="13" ry="7" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" transform="rotate(50 140 75)"/></g><g ><ellipse cx="60" cy="105" rx="13" ry="7" fill="#9AD5E8" stroke="#2B2F4A" stroke-width="2.5" transform="rotate(75 60 105)"/></g><g ><ellipse cx="110" cy="110" rx="13" ry="7" fill="#9AD5E8" stroke="#2B2F4A" stroke-width="2.5" transform="rotate(100 110 110)"/></g><g ><ellipse cx="155" cy="120" rx="13" ry="7" fill="#9AD5E8" stroke="#2B2F4A" stroke-width="2.5" transform="rotate(125 155 120)"/></g><g ><ellipse cx="50" cy="150" rx="13" ry="7" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" transform="rotate(150 50 150)"/></g><g ><ellipse cx="95" cy="155" rx="13" ry="7" fill="#9AD5E8" stroke="#2B2F4A" stroke-width="2.5" transform="rotate(175 95 155)"/></g><g ><ellipse cx="145" cy="160" rx="13" ry="7" fill="#9AD5E8" stroke="#2B2F4A" stroke-width="2.5" transform="rotate(200 145 160)"/></g><rect x="216" y="30" width="170" height="150" rx="6" fill="#FFE3D0" stroke="#E5484D" stroke-width="3" /><text x="301" y="22" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Water heated up</text><g class="die"><ellipse cx="250" cy="65" rx="13" ry="7" fill="#9AD5E8" stroke="#2B2F4A" stroke-width="2.5" transform="rotate(0 250 65)"/></g><g class="die"><ellipse cx="300" cy="60" rx="13" ry="7" fill="#9AD5E8" stroke="#2B2F4A" stroke-width="2.5" transform="rotate(25 300 60)"/></g><g ><ellipse cx="350" cy="75" rx="13" ry="7" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" transform="rotate(50 350 75)"/></g><g class="die"><ellipse cx="265" cy="105" rx="13" ry="7" fill="#9AD5E8" stroke="#2B2F4A" stroke-width="2.5" transform="rotate(75 265 105)"/></g><g class="die"><ellipse cx="320" cy="110" rx="13" ry="7" fill="#9AD5E8" stroke="#2B2F4A" stroke-width="2.5" transform="rotate(100 320 110)"/></g><g class="die"><ellipse cx="355" cy="125" rx="13" ry="7" fill="#9AD5E8" stroke="#2B2F4A" stroke-width="2.5" transform="rotate(125 355 125)"/></g><g ><ellipse cx="255" cy="150" rx="13" ry="7" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" transform="rotate(150 255 150)"/></g><g class="die"><ellipse cx="305" cy="155" rx="13" ry="7" fill="#9AD5E8" stroke="#2B2F4A" stroke-width="2.5" transform="rotate(175 305 155)"/></g><g class="die"><ellipse cx="350" cy="160" rx="13" ry="7" fill="#9AD5E8" stroke="#2B2F4A" stroke-width="2.5" transform="rotate(200 350 160)"/></g><g class="born"><ellipse cx="335" cy="95" rx="13" ry="7" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" transform="rotate(10 335 95)"/></g><g class="born"><ellipse cx="280" cy="135" rx="13" ry="7" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" transform="rotate(-20 280 135)"/></g><line x1="188" y1="105" x2="212" y2="105" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M205.0 108.8L212 105L205.0 101.2" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><g ><ellipse cx="30" cy="214" rx="13" ry="7" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" transform="rotate(0 30 214)"/></g><text x="52" y="219" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="start" >= heat-resistant variant</text><g ><ellipse cx="250" cy="214" rx="13" ry="7" fill="#9AD5E8" stroke="#2B2F4A" stroke-width="2.5" transform="rotate(0 250 214)"/></g><text x="272" y="219" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="start" >= not resistant</text>
</svg>
