<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Asexual reproduction from one parent gives copies; sexual reproduction from two parents gives new combinations</title>
<style>.o{transform-box:fill-box;transform-origin:center;animation:o 3s ease-in-out infinite}@keyframes o{0%{transform:scale(.4)}50%,100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="100" y="24" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle" >One parent</text><circle cx="100" cy="70" r="26" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" /><line x1="100" y1="100" x2="100" y2="125" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M96.2 118.0L100 125L103.8 118.0" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><g class="o" style="animation-delay:0.0s"><circle cx="50" cy="160" r="20" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" /></g><g class="o" style="animation-delay:0.3s"><circle cx="100" cy="160" r="20" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" /></g><g class="o" style="animation-delay:0.6s"><circle cx="150" cy="160" r="20" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" /></g><text x="100" y="210" font-family="sans-serif" font-size="11" font-weight="400" fill="#2B2F4A" text-anchor="middle" >Identical copies</text><line x1="200" y1="20" x2="200" y2="215" stroke="#C8C8D8" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5"/><text x="300" y="24" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Two parents</text><circle cx="260" cy="70" r="24" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" /><circle cx="340" cy="70" r="24" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" /><line x1="285" y1="95" x2="300" y2="125" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M293.4 120.4L300 125L300.3 117.0" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><line x1="315" y1="95" x2="300" y2="125" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M299.7 117.0L300 125L306.6 120.4" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><g class="o" style="animation-delay:0.0s"><circle cx="250" cy="160" r="20" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="3" /></g><g class="o" style="animation-delay:0.3s"><circle cx="300" cy="160" r="20" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" /></g><g class="o" style="animation-delay:0.6s"><circle cx="350" cy="160" r="20" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" /></g><text x="300" y="210" font-family="sans-serif" font-size="11" font-weight="400" fill="#2B2F4A" text-anchor="middle" >New combinations</text>
</svg>
