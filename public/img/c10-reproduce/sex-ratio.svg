e="#3A2A20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="292" y="110" width="16" height="18" rx="4" fill="#F7A8C4" stroke="#2B2F4A" stroke-width="2.5" /></g></g><text x="60" y="200" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Boys</text><text x="340" y="200" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Girls</text><text x="200" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >The sex ratio must stay balanced</text>
