chor="middle" >With an eye</text><text x="335" y="30" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >No eye</text><text x="335" y="90" font-family="sans-serif" font-size="11" font-weight="400" fill="#2B2F4A" text-anchor="middle" >nothing grows</text><text x="215" y="48" font-family="sans-serif" font-size="11" font-weight="400" fill="#2B2F4A" text-anchor="middle" >shoot + roots</text>
