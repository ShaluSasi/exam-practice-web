<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Menstrual cycle: the uterine lining thickens each month and breaks down as menstruation if the egg is not fertilised</title>
<style>.mk{animation:m 6s linear infinite}@keyframes m{0%{transform:translateX(0)}100%{transform:translateX(330px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<line x1="30" y1="185" x2="375" y2="185" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="200" y="226" font-family="sans-serif" font-size="12" font-weight="400" fill="#2B2F4A" text-anchor="middle" >About one month</text><path d="M30 185V168H85Q150 160 230 118Q290 98 320 110L335 185Z" fill="#F7A8A8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="40" cy="150" r="4" fill="#E5484D" stroke="#E5484D" stroke-width="1" /><circle cx="52" cy="150" r="4" fill="#E5484D" stroke="#E5484D" stroke-width="1" /><circle cx="64" cy="150" r="4" fill="#E5484D" stroke="#E5484D" stroke-width="1" /><circle cx="76" cy="150" r="4" fill="#E5484D" stroke="#E5484D" stroke-width="1" /><text x="75" y="138" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Menstruation</text><text x="75" y="124" font-family="sans-serif" font-size="11" font-weight="400" fill="#2B2F4A" text-anchor="middle" >(2 to 8 days)</text><circle cx="190" cy="60" r="12" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><line x1="190" y1="76" x2="190" y2="108" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><path d="M186.2 101.0L190 108L193.8 101.0" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="190" y="38" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Egg released</text><text x="310" y="86" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Lining thick and spongy</text><text x="310" y="72" font-family="sans-serif" font-size="11" font-weight="400" fill="#2B2F4A" text-anchor="middle" >if egg is not fertilised</text><line x1="320" y1="92" x2="320" y2="104" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><path d="M316.2 97.0L320 104L323.8 97.0" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><line class="mk" x1="30" y1="40" x2="30" y2="185" stroke="#7C5CFF" stroke-width="3" stroke-dasharray="5 4"/>
</svg>
