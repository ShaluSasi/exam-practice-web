<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>After fertilisation the ovule becomes a seed and the ovary becomes a fruit while petals fall off</title>
<style>.ov{transform-box:fill-box;transform-origin:center;animation:o 3.5s ease-in-out infinite}@keyframes o{0%{transform:scale(.8)}70%,100%{transform:scale(1.1)}}.pf{animation:f 3.5s ease-in infinite}@keyframes f{0%{opacity:1;transform:translateY(0)}80%,100%{opacity:0;transform:translateY(40px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M40 150Q50 100 75 90Q100 100 110 150Z" fill="#F7A8C4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="75" cy="150" rx="24" ry="28" fill="#BFE5B8" stroke="#2B2F4A" stroke-width="3" /><circle cx="75" cy="150" r="7" fill="#FFFFFF" stroke="#7C5CFF" stroke-width="2.5" /><line x1="75" y1="122" x2="75" y2="96" stroke="#6BBF59" stroke-width="6" stroke-linecap="round" /><text x="75" y="205" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Flower</text><line x1="125" y1="150" x2="150" y2="150" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M143.0 153.8L150 150L143.0 146.2" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="138" y="172" font-family="sans-serif" font-size="10" font-weight="700" fill="#2B2F4A" text-anchor="middle" >fertilisation</text><g class="pf"><path d="M160 100q-10 20 -4 36" fill="none" stroke="#F7A8C4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><path d="M240 100q10 20 4 36" fill="none" stroke="#F7A8C4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /></g><g class="ov"><ellipse cx="200" cy="150" rx="28" ry="32" fill="#BFE5B8" stroke="#2B2F4A" stroke-width="3" /><circle cx="200" cy="150" r="8" fill="#FFFFFF" stroke="#7C5CFF" stroke-width="2.5" /></g><text x="200" y="205" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Petals fall, ovary swells</text><line x1="240" y1="150" x2="268" y2="150" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M261.0 153.8L268 150L261.0 146.2" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="330" cy="148" r="40" fill="#F28B6E" stroke="#2B2F4A" stroke-width="3" /><line x1="330" y1="108" x2="330" y2="92" stroke="#9A6A3A" stroke-width="4" stroke-linecap="round" /><g transform="translate(332 96) rotate(70) scale(0.5)"><path d="M0 0C-16 -12 -30 8 0 30C30 8 16 -12 0 0Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="5.0" stroke-linecap="round" stroke-linejoin="round" /></g><ellipse cx="330" cy="150" rx="12" ry="16" fill="#FFF3E0" stroke="#2B2F4A" stroke-width="2" /><circle cx="330" cy="150" r="5" fill="#9A6A3A" stroke="#2B2F4A" stroke-width="1.5" /><text x="330" y="205" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Fruit with seed</text><text x="100" y="40" font-family="sans-serif" font-size="12" font-weight="700" fill="#7C5CFF" text-anchor="middle" >Before fertilisation</text><text x="300" y="40" font-family="sans-serif" font-size="12" font-weight="700" fill="#E5484D" text-anchor="middle" >After fertilisation</text>
</svg>
