<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img">
<title>One cell dividing into many small daughter cells at the same time</title>
<style>.s{transform-box:fill-box;transform-origin:center;animation:s 3s ease-in-out infinite}@keyframes s{0%,15%{transform:scale(.3)}55%,100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="55" cy="75" r="36" fill="#C9E8F5" stroke="#2B2F4A" stroke-width="3"/>
<circle cx="55" cy="55" r="5" fill="#7C5CFF"/><circle cx="72" cy="65" r="5" fill="#7C5CFF"/><circle cx="72" cy="85" r="5" fill="#7C5CFF"/><circle cx="55" cy="95" r="5" fill="#7C5CFF"/><circle cx="38" cy="85" r="5" fill="#7C5CFF"/><circle cx="38" cy="65" r="5" fill="#7C5CFF"/><circle cx="55" cy="75" r="5" fill="#7C5CFF"/>
<line x1="98" y1="75" x2="118" y2="75" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><path d="M112 70L118 75L112 80" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/>
<g class="s"><circle cx="150" cy="45" r="11" fill="#C9E8F5" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="150" cy="45" r="4" fill="#7C5CFF"/></g>
<g class="s"><circle cx="176" cy="60" r="11" fill="#C9E8F5" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="176" cy="60" r="4" fill="#7C5CFF"/></g>
<g class="s"><circle cx="176" cy="90" r="11" fill="#C9E8F5" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="176" cy="90" r="4" fill="#7C5CFF"/></g>
<g class="s"><circle cx="150" cy="105" r="11" fill="#C9E8F5" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="150" cy="105" r="4" fill="#7C5CFF"/></g>
<g class="s"><circle cx="128" cy="90" r="11" fill="#C9E8F5" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="128" cy="90" r="4" fill="#7C5CFF"/></g>
<g class="s"><circle cx="128" cy="60" r="11" fill="#C9E8F5" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="128" cy="60" r="4" fill="#7C5CFF"/></g>
<g class="s"><circle cx="152" cy="75" r="11" fill="#C9E8F5" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="152" cy="75" r="4" fill="#7C5CFF"/></g>
</svg>
