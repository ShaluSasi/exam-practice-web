<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Leishmania cell with a whip-like tail dividing lengthwise into two cells</title>
<style>.a{animation:a 3s ease-in-out infinite}.b{animation:b 3s ease-in-out infinite}@keyframes a{0%,100%{transform:translateX(3px)}50%{transform:translateX(-4px)}}@keyframes b{0%,100%{transform:translateX(-3px)}50%{transform:translateX(4px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<ellipse cx="60" cy="120" rx="22" ry="44" fill="#C9E8F5" stroke="#2B2F4A" stroke-width="3" /><circle cx="60" cy="128" r="8" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2" /><path d="M60 76q-12 -14 0 -26t6 -22" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="60" y="200" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Whip-like tail</text><line x1="100" y1="110" x2="130" y2="110" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M123.0 113.8L130 110L123.0 106.2" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="185" cy="120" rx="34" ry="44" fill="#C9E8F5" stroke="#2B2F4A" stroke-width="3" /><path d="M185 76Q185 120 185 164" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><circle cx="172" cy="128" r="7" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2" /><circle cx="198" cy="128" r="7" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2" /><path d="M172 80q-12 -14 0 -26t6 -22" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M198 80q12 -14 0 -26t-6 -22" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="185" y="200" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Splits along its length</text><line x1="235" y1="110" x2="265" y2="110" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M258.0 113.8L265 110L258.0 106.2" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><g class="a"><ellipse cx="300" cy="120" rx="20" ry="44" fill="#C9E8F5" stroke="#2B2F4A" stroke-width="3" /><circle cx="300" cy="128" r="8" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2" /><path d="M300 76q-12 -14 0 -26t6 -22" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g class="b"><ellipse cx="350" cy="120" rx="20" ry="44" fill="#C9E8F5" stroke="#2B2F4A" stroke-width="3" /><circle cx="350" cy="128" r="8" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2" /><path d="M350 76q-12 -14 0 -26t6 -22" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="325" y="200" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Two cells</text><text x="200" y="228" font-family="sans-serif" font-size="12" font-weight="400" fill="#2B2F4A" text-anchor="middle" >Binary fission with a definite orientation</text>
</svg>
