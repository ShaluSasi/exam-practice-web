<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
<title>Two hydrogen atoms moving together until their shells overlap</title>
<style>
.gl{animation:gl 4s ease-in-out infinite}.gr{animation:gr 4s ease-in-out infinite}@keyframes gl{0%,100%{transform:translateX(-50px)}45%,85%{transform:translateX(0)}}@keyframes gr{0%,100%{transform:translateX(50px)}45%,85%{transform:translateX(0)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g class="gl"><circle cx="160" cy="110" r="56" fill="none" stroke="#8C91B5" stroke-width="2"/><circle cx="160" cy="110" r="18" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5"/><text x="160" y="114.3" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="middle" >1p</text><circle cx="214.3" cy="96.5" r="6" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5" /></g><g class="gr"><circle cx="240" cy="110" r="56" fill="none" stroke="#8C91B5" stroke-width="2"/><circle cx="240" cy="110" r="18" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5"/><text x="240" y="114.3" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#2B2F4A" text-anchor="middle" >1p</text><circle cx="185.7" cy="96.5" r="6" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.5" /></g>
</svg>
