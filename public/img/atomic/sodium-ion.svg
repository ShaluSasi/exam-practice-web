<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>An atom's outermost electron flying away from it</title>
<style>
.fly{animation:fly 4s ease-in infinite}@keyframes fly{0%,30%{transform:translate(0,0);opacity:1}90%{transform:translate(120px,-30px);opacity:1}100%{transform:translate(120px,-30px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="150" cy="120" r="28" fill="none" stroke="#8C91B5" stroke-width="2"/><circle cx="150" cy="120" r="54" fill="none" stroke="#8C91B5" stroke-width="2"/><circle cx="150" cy="120" r="86" fill="none" stroke="#8C91B5" stroke-width="2"/><circle cx="150" cy="120" r="22" fill="#F6C453" stroke="#2B2F4A" stroke-width="2.5"/><text x="150" y="118.0" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#2B2F4A" text-anchor="middle" >11p</text><text x="150" y="130.0" font-family="system-ui, sans-serif" font-weight="600" font-size="11" fill="#2B2F4A" text-anchor="middle" >12n</text><circle cx="150.0" cy="92.0" r="6" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="150.0" cy="148.0" r="6" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="170.7" cy="70.1" r="6" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="199.9" cy="99.3" r="6" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="199.9" cy="140.7" r="6" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="170.7" cy="169.9" r="6" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="129.3" cy="169.9" r="6" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="100.1" cy="140.7" r="6" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="100.1" cy="99.3" r="6" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="129.3" cy="70.1" r="6" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5" /><g class="fly"><circle cx="236.0" cy="120.0" r="6" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.5" /><text x="254" y="104" font-family="system-ui, sans-serif" font-weight="600" font-size="15" fill="#2B2F4A" text-anchor="middle" >e⁻</text></g>
</svg>
