<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
<title>Four floating particles: an atom and three ions</title>
<style>
.f1{animation:fl 4s ease-in-out infinite}.f2{animation:fl 4s ease-in-out infinite -1s}.f3{animation:fl 4s ease-in-out infinite -2s}.f4{animation:fl 4s ease-in-out infinite -3s}@keyframes fl{0%,100%{transform:translateY(-8px)}50%{transform:translateY(8px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g class="f1"><circle cx="70" cy="110" r="38" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><text x="70" y="120" font-family="system-ui, sans-serif" font-weight="600" font-size="26" fill="#2B2F4A" text-anchor="middle" ><tspan dy="0">Na</tspan></text></g><g class="f2"><circle cx="160" cy="110" r="38" fill="#FFE1C4" stroke="#2B2F4A" stroke-width="2.5"/><text x="160" y="120" font-family="system-ui, sans-serif" font-weight="600" font-size="26" fill="#2B2F4A" text-anchor="middle" ><tspan dy="0">Al</tspan><tspan dy="-11" font-size="17">3+</tspan></text></g><g class="f3"><circle cx="250" cy="110" r="38" fill="#DFF5C8" stroke="#2B2F4A" stroke-width="2.5"/><text x="250" y="120" font-family="system-ui, sans-serif" font-weight="600" font-size="26" fill="#2B2F4A" text-anchor="middle" ><tspan dy="0">Cl</tspan><tspan dy="-11" font-size="17">−</tspan></text></g><g class="f4"><circle cx="340" cy="110" r="38" fill="#FFE1C4" stroke="#2B2F4A" stroke-width="2.5"/><text x="340" y="120" font-family="system-ui, sans-serif" font-weight="600" font-size="26" fill="#2B2F4A" text-anchor="middle" ><tspan dy="0">Li</tspan><tspan dy="-11" font-size="17">+</tspan></text></g>
</svg>
