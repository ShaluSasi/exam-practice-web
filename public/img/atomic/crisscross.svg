<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>The criss-cross method: the charge numbers of two ions cross over to become subscripts</title>
<style>
.dash{stroke-dasharray:160;animation:d 3s ease-in-out infinite}@keyframes d{0%{stroke-dashoffset:160}60%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="130" y="80" font-family="system-ui, sans-serif" font-weight="600" font-size="44" fill="#2B2F4A" text-anchor="middle" >M</text><text x="270" y="80" font-family="system-ui, sans-serif" font-weight="600" font-size="44" fill="#2B2F4A" text-anchor="middle" >X</text><text x="130" y="130" font-family="system-ui, sans-serif" font-weight="600" font-size="22" fill="#E5484D" text-anchor="middle" font-style="italic">a+</text><text x="270" y="130" font-family="system-ui, sans-serif" font-weight="600" font-size="22" fill="#0B93D4" text-anchor="middle" font-style="italic">b−</text><path class="dash" d="M136 138Q200 170 262 196" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round"/><path class="dash" d="M264 138Q200 170 140 196" fill="none" stroke="#0B93D4" stroke-width="3" stroke-linecap="round"/><text x="200" y="218" font-family="system-ui, sans-serif" font-weight="600" font-size="34" fill="#2B2F4A" text-anchor="middle">M<tspan dy="8" font-size="22" fill="#0B93D4" font-style="italic">b</tspan><tspan dy="-8">X</tspan><tspan dy="8" font-size="22" fill="#E5484D" font-style="italic">a</tspan></text>
</svg>
