<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>A turning wheel on a road and a paper circle with fold creases</title>
<style>.t{font:600 14px system-ui, sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui, sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}.wh{transform-box:view-box;transform-origin:125px 140px;animation:sp 3s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.fold{transform-box:view-box;transform-origin:300px 120px;animation:fd 5s ease-in-out infinite}@keyframes fd{0%,100%{transform:rotate(0)}50%{transform:rotate(60deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="0" y="222" width="400" height="38" fill="#D9C49A"/>
<path d="M0 222H400" stroke="#B89A66" stroke-width="3"/>
<circle cx="125" cy="140" r="80" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="3"/>
<g class="wh"><circle cx="125" cy="140" r="66" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="2.5"/><line x1="125" y1="140" x2="191" y2="140" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><line x1="125" y1="140" x2="171.7" y2="93.3" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><line x1="125" y1="140" x2="125" y2="74" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><line x1="125" y1="140" x2="78.3" y2="93.3" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><line x1="125" y1="140" x2="59" y2="140" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><line x1="125" y1="140" x2="78.3" y2="186.7" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><line x1="125" y1="140" x2="125" y2="206" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><line x1="125" y1="140" x2="171.7" y2="186.7" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><circle cx="125" cy="67" r="6" fill="#E5484D"/></g>
<circle cx="125" cy="140" r="9" fill="#F6C453" stroke="#2B2F4A" stroke-width="2"/>
<circle cx="300" cy="120" r="70" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5"/>
<g class="fold"><line x1="234.2" y1="96.1" x2="365.8" y2="143.9" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 5"/></g>
<line x1="300" y1="50" x2="300" y2="190" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="360.6" y1="85" x2="239.4" y2="155" stroke="#3FA34D" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 5"/>
<circle cx="300" cy="120" r="4" fill="#2B2F4A"/>
</svg>
