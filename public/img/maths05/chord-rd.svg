<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>Circle with centre O, radius r, and a chord AB at distance d from the centre</title>
<style>.t{font:600 14px system-ui, sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui, sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="200" cy="128" r="110" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5"/>
<polygon points="200,128 200,194 288,194" fill="#FFE2C4" stroke="none" stroke-width="0" stroke-linejoin="round"/>
<line x1="112" y1="194" x2="288" y2="194" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/>
<line x1="200" y1="128" x2="200" y2="194" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 4"/>
<line x1="200" y1="128" x2="288" y2="194" stroke="#3FA34D" stroke-width="3" stroke-linecap="round"/>
<path d="M210 194L210 184L200 184" fill="none" stroke="#2B2F4A" stroke-width="2"/>
<text x="254" y="155" class="t">r</text>
<text x="192" y="166" class="t e">d</text>
<text x="156" y="216" class="t m">chord AB</text>
<circle cx="200" cy="128" r="4" fill="#2B2F4A"/>
<circle cx="112" cy="194" r="4" fill="#2B2F4A"/>
<circle cx="288" cy="194" r="4" fill="#2B2F4A"/>
<circle cx="200" cy="194" r="4" fill="#2B2F4A"/>
<text x="188" y="122" class="t m">O</text>
<text x="98" y="198" class="t m">A</text>
<text x="302" y="198" class="t m">B</text>
<text x="214" y="214" class="t m">M</text>
</svg>
