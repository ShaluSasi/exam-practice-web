<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="200" cy="120" r="115" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5"/>
<line x1="89.6" y1="152.2" x2="310.4" y2="152.2" stroke="#E5484D" stroke-width="3.5" stroke-linecap="round"/>
<line x1="167.8" y1="230.4" x2="232.2" y2="230.4" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/>
<line x1="200" y1="152.2" x2="200" y2="230.4" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 4"/>
<line x1="200" y1="120" x2="310.4" y2="152.2" stroke="#3FA34D" stroke-width="2.5" stroke-linecap="round"/>
