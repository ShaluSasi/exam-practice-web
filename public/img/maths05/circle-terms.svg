<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" role="img">
<title>Four points K, L, M, N on one circle with centre O, joined to form a quadrilateral</title>
<style>.t{font:600 14px system-ui, sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui, sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="200" cy="135" r="105" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5"/>
<polygon points="109.1,82.5 114,195.2 235.9,233.7 286,74.8" fill="#FFE2C4" stroke="#FF8A1F" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="6 5"/>
<circle cx="109.1" cy="82.5" r="5" fill="#E5484D"/>
<text x="95.2" y="79.5" class="t m">K</text>
<circle cx="114" cy="195.2" r="5" fill="#E5484D"/>
<text x="100.9" y="209.4" class="t m">L</text>
<circle cx="235.9" cy="233.7" r="5" fill="#E5484D"/>
<text x="241.4" y="253.7" class="t m">M</text>
<circle cx="286" cy="74.8" r="5" fill="#E5484D"/>
<text x="299.1" y="70.6" class="t m">N</text>
<circle cx="200" cy="135" r="4" fill="#2B2F4A"/>
<text x="200" y="125" class="t m">O</text>
</svg>
