<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
<title>Two parallel chords of 10 cm and 24 cm on opposite sides of the centre of a circle of radius 13 cm</title>
<style>.t{font:600 14px system-ui, sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui, sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="200" cy="150" r="130" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5"/>
<line x1="150" y1="30" x2="250" y2="30" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/>
<line x1="80" y1="200" x2="320" y2="200" stroke="#E5484D" stroke-width="3.5" stroke-linecap="round"/>
<line x1="200" y1="30" x2="200" y2="200" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5"/>
<line x1="200" y1="150" x2="320" y2="200" stroke="#3FA34D" stroke-width="2.5" stroke-linecap="round"/>
<text x="166" y="48" class="t m">10 cm</text>
<text x="200" y="222" class="t m">24 cm</text>
<text x="270" y="165" class="t m">13 cm</text>
<text x="212" y="120" class="t m">?</text>
