<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img">
<title>A circle with centre O; radii OA and OB of 9 cm make a 60° angle, and chord AB joins their ends</title>
<style>.t{font:600 14px system-ui, sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui, sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="200" cy="120" r="105" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5"/>
<path d="M200 120L147.5 210.9L252.5 210.9Z" fill="#FFE2C4" stroke="none"/>
<line x1="200" y1="120" x2="147.5" y2="210.9" stroke="#0B93D4" stroke-width="3" stroke-linecap="round"/>
<line x1="200" y1="120" x2="252.5" y2="210.9" stroke="#0B93D4" stroke-width="3" stroke-linecap="round"/>
<line x1="147.5" y1="210.9" x2="252.5" y2="210.9" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/>
<path d="M212 140.8A24 24 0 0 1 188 140.8" fill="none" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round"/>
<text x="200" y="164" class="s m">60°</text>
<text x="161.7" y="165.5" class="t e">9 cm</text>
<circle cx="200" cy="120" r="4" fill="#2B2F4A"/>
<circle cx="147.5" cy="210.9" r="4" fill="#2B2F4A"/>
<circle cx="252.5" cy="210.9" r="4" fill="#2B2F4A"/>
<text x="200" y="110" class="t m">O</text>
<text x="139.5" y="229.8" class="t m">A</text>
<text x="260.5" y="229.8" class="t m">B</text>
</svg>
