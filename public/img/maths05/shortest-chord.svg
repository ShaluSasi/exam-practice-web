<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>A chord turning about a fixed point P inside a circle with centre O</title>
<style>.t{font:600 14px system-ui, sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui, sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}.rot{transform-box:view-box;transform-origin:255px 110px;animation:sp 8s linear infinite}@keyframes sp{to{transform:rotate(180deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<defs><clipPath id="cc"><circle cx="200" cy="135" r="110"/></clipPath></defs>
<circle cx="200" cy="135" r="110" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5"/>
<g clip-path="url(#cc)"><g class="rot"><line x1="-5" y1="110" x2="515" y2="110" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/></g></g>
<line x1="200" y1="135" x2="255" y2="110" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="200" cy="135" r="4" fill="#2B2F4A"/>
<circle cx="255" cy="110" r="5" fill="#E5484D"/>
<text x="188" y="151" class="t m">O</text>
<text x="261" y="100" class="t m">P</text>
</svg>
