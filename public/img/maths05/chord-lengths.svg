<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
<title>A circle of radius 5 cm with four parallel chords labelled 6 cm, 10 cm, 9.6 cm and 8 cm</title>
<style>.t{font:600 14px system-ui, sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui, sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="200" cy="150" r="125" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5"/>
<line x1="125" y1="50" x2="275" y2="50" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round"/>
<text x="160" y="68" class="t m">6 cm</text>
<line x1="75" y1="150" x2="325" y2="150" stroke="#E5484D" stroke-width="3.5" stroke-linecap="round"/>
<text x="112" y="143" class="t m">10 cm</text>
<line x1="80" y1="185" x2="320" y2="185" stroke="#3FA34D" stroke-width="3.5" stroke-linecap="round"/>
<text x="128" y="178" class="t m">9.6 cm</text>
<line x1="100" y1="225" x2="300" y2="225" stroke="#7B61C9" stroke-width="3.5" stroke-linecap="round"/>
<text x="140" y="218" class="t m">8 cm</text>
<line x1="200" y1="150" x2="104.2" y2="69.7" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/>
<text x="157.3" y="99.8" class="s">5 cm</text>
<circle cx="200" cy="150" r="4" fill="#2B2F4A"/>
<text x="196" y="170" class="t m">O</text>
</svg>
