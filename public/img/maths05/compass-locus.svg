<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>A centre O with many points the same distance r away, and an arm sweeping round</title>
<style>.t{font:600 14px system-ui, sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui, sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}.arm{transform-box:view-box;transform-origin:200px 135px;animation:ar 4s linear infinite}@keyframes ar{to{transform:rotate(-360deg)}}.draw{stroke-dasharray:100;animation:dw 4s linear infinite}@keyframes dw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
