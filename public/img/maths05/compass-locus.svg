<circle cx="116.6" cy="96.1" r="5" fill="#0B93D4"/>
<line x1="200" y1="135" x2="113.5" y2="166.5" stroke="#A3A8CC" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4"/>
<circle cx="113.5" cy="166.5" r="5" fill="#0B93D4"/>
<line x1="200" y1="135" x2="161.1" y2="218.4" stroke="#A3A8CC" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 4"/>
