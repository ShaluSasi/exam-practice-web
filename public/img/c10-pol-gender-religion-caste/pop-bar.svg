<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img">
<title>One long bar split into four parts of 16.6, 41, 8.6 and 33.8 per cent of the population</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.gy{transform-box:fill-box;transform-origin:50% 100%;animation:gy 1.1s ease-out both}@keyframes gy{from{transform:scaleY(.05)}to{transform:scaleY(1)}}.gx{transform-box:fill-box;transform-origin:0% 50%;animation:gx 1.1s ease-out both}@keyframes gx{from{transform:scaleX(.05)}to{transform:scaleX(1)}}.fl{stroke-dasharray:7 6;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-13}}.sw{transform-box:fill-box;transform-origin:50% 50%;animation:sw 3s ease-in-out infinite}@keyframes sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="20" y="70" width="59.8" height="60" rx="4" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" class="gx"/><text x="49.9" y="105" font-size="14" text-anchor="middle" class="h" >16.6</text><rect x="79.8" y="70" width="147.6" height="60" rx="4" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" class="gx"/><text x="153.6" y="105" font-size="14" text-anchor="middle" class="h" >41</text><rect x="227.4" y="70" width="31" height="60" rx="4" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" class="gx"/><text x="242.8" y="105" font-size="14" text-anchor="middle" class="h" >8.6</text><rect x="258.3" y="70" width="121.7" height="60" rx="4" fill="#CFCFCF" stroke="#2B2F4A" stroke-width="3" class="gx"/><text x="319.2" y="105" font-size="14" text-anchor="middle" class="h" >33.8</text><line x1="20" y1="130" x2="20" y2="138" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><text x="20" y="154" font-size="11" text-anchor="middle" >0%</text><line x1="110" y1="130" x2="110" y2="138" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><text x="110" y="154" font-size="11" text-anchor="middle" >25%</text><line x1="200" y1="130" x2="200" y2="138" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><text x="200" y="154" font-size="11" text-anchor="middle" >50%</text><line x1="290" y1="130" x2="290" y2="138" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><text x="290" y="154" font-size="11" text-anchor="middle" >75%</text><line x1="380" y1="130" x2="380" y2="138" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><text x="380" y="154" font-size="11" text-anchor="middle" >100%</text><text x="200" y="40" font-size="13" text-anchor="middle" >share of the country's population (%)</text></svg>
