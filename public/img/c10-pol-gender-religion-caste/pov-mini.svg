<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" role="img">
<title>Four bars of rural poverty percentages for Scheduled Tribes, Scheduled Castes, Other Backward Classes and Hindu Upper Castes</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.gy{transform-box:fill-box;transform-origin:50% 100%;animation:gy 1.1s ease-out both}@keyframes gy{from{transform:scaleY(.05)}to{transform:scaleY(1)}}.gx{transform-box:fill-box;transform-origin:0% 50%;animation:gx 1.1s ease-out both}@keyframes gx{from{transform:scaleX(.05)}to{transform:scaleX(1)}}.fl{stroke-dasharray:7 6;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-13}}.sw{transform-box:fill-box;transform-origin:50% 50%;animation:sw 3s ease-in-out infinite}@keyframes sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="40" y="43.4" width="56" height="146.6" rx="4" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" class="gy"/><text x="68" y="37.4" font-size="13" text-anchor="middle" class="h" >45.8%</text><text x="68" y="207" font-size="12" text-anchor="middle" class="h" >ST</text><rect x="128" y="75.1" width="56" height="114.9" rx="4" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" class="gy"/><text x="156" y="69.1" font-size="13" text-anchor="middle" class="h" >35.9%</text><text x="156" y="207" font-size="12" text-anchor="middle" class="h" >SC</text><rect x="216" y="103.6" width="56" height="86.4" rx="4" fill="#FFD25A" stroke="#2B2F4A" stroke-width="2.5" class="gy"/><text x="244" y="97.6" font-size="13" text-anchor="middle" class="h" >27.0%</text><text x="244" y="207" font-size="12" text-anchor="middle" class="h" >OBC</text><rect x="304" y="152.6" width="56" height="37.4" rx="4" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" class="gy"/><text x="332" y="146.6" font-size="13" text-anchor="middle" class="h" >11.7%</text><text x="332" y="207" font-size="12" text-anchor="middle" class="h" >Hindu UC</text><line x1="24" y1="190" x2="390" y2="190" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="200" y="20" font-size="12" text-anchor="middle" >living below the poverty line, rural (%)</text></svg>
