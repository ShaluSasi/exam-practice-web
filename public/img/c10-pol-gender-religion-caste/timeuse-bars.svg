<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
<title>Grouped bars comparing daily time men and women spend on five activities</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.gy{transform-box:fill-box;transform-origin:50% 100%;animation:gy 1.1s ease-out both}@keyframes gy{from{transform:scaleY(.05)}to{transform:scaleY(1)}}.gx{transform-box:fill-box;transform-origin:0% 50%;animation:gx 1.1s ease-out both}@keyframes gx{from{transform:scaleX(.05)}to{transform:scaleX(1)}}.fl{stroke-dasharray:7 6;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-13}}.sw{transform-box:fill-box;transform-origin:50% 50%;animation:sw 3s ease-in-out infinite}@keyframes sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="112" y="8" width="12" height="12" rx="2" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" /><text x="130" y="19" font-size="12" text-anchor="start" class="h" >Men</text><rect x="180" y="8" width="12" height="12" rx="2" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" /><text x="198" y="19" font-size="12" text-anchor="start" class="h" >Women</text><line x1="124" y1="34" x2="124" y2="288" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="118" y="64" font-size="12" text-anchor="end" >Income work</text><rect x="125" y="44" width="117.7" height="16" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" class="gx"/><rect x="125" y="63" width="52.3" height="16" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" class="gx"/><text x="118" y="114" font-size="12" text-anchor="end" >Household work</text><rect x="125" y="94" width="9.8" height="16" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" class="gx"/><rect x="125" y="113" width="98.1" height="16" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" class="gx"/><text x="118" y="164" font-size="12" text-anchor="end" >Talk, gossip</text><rect x="125" y="144" width="27.8" height="16" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" class="gx"/><rect x="125" y="163" width="26.2" height="16" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" class="gx"/><text x="118" y="214" font-size="12" text-anchor="end" >No work / leisure</text><rect x="125" y="194" width="71.9" height="16" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" class="gx"/><rect x="125" y="213" width="75.2" height="16" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" class="gx"/><text x="118" y="264" font-size="12" text-anchor="end" >Sleep, self-care</text><rect x="125" y="244" width="243.6" height="16" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" class="gx"/><rect x="125" y="263" width="219" height="16" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" class="gx"/><text x="125" y="296" font-size="11" text-anchor="start" >0 h</text><text x="380" y="296" font-size="11" text-anchor="end" >13 h</text></svg>
