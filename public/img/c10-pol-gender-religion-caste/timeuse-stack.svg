<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Two bars each showing how 24 hours of a day are split between five activities for men and for women</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.gy{transform-box:fill-box;transform-origin:50% 100%;animation:gy 1.1s ease-out both}@keyframes gy{from{transform:scaleY(.05)}to{transform:scaleY(1)}}.gx{transform-box:fill-box;transform-origin:0% 50%;animation:gx 1.1s ease-out both}@keyframes gx{from{transform:scaleX(.05)}to{transform:scaleX(1)}}.fl{stroke-dasharray:7 6;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-13}}.sw{transform-box:fill-box;transform-origin:50% 50%;animation:sw 3s ease-in-out infinite}@keyframes sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="54" y="76" font-size="14" text-anchor="end" class="h" >Men</text><rect x="60" y="50" width="80" height="40" rx="2" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" class="gx"/><text x="100" y="75" font-size="12" text-anchor="middle" fill="#2B2F4A" >6:00</text><rect x="140" y="50" width="6.7" height="40" rx="2" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" class="gx"/><rect x="146.7" y="50" width="18.9" height="40" rx="2" fill="#FFD25A" stroke="#2B2F4A" stroke-width="2" class="gx"/><rect x="165.6" y="50" width="48.9" height="40" rx="2" fill="#2FB5A8" stroke="#2B2F4A" stroke-width="2" class="gx"/><text x="190" y="75" font-size="12" text-anchor="middle" fill="#2B2F4A" >3:40</text><rect x="214.4" y="50" width="165.6" height="40" rx="2" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" class="gx"/><text x="297.2" y="75" font-size="12" text-anchor="middle" fill="#FFF" >12:25</text><text x="54" y="146" font-size="14" text-anchor="end" class="h" >Women</text><rect x="60" y="120" width="35.6" height="40" rx="2" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" class="gx"/><text x="77.8" y="145" font-size="12" text-anchor="middle" fill="#2B2F4A" >2:40</text><rect x="95.6" y="120" width="66.7" height="40" rx="2" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" class="gx"/><text x="128.9" y="145" font-size="12" text-anchor="middle" fill="#FFF" >5:00</text><rect x="162.2" y="120" width="17.8" height="40" rx="2" fill="#FFD25A" stroke="#2B2F4A" stroke-width="2" class="gx"/><rect x="180" y="120" width="51.1" height="40" rx="2" fill="#2FB5A8" stroke="#2B2F4A" stroke-width="2" class="gx"/><text x="205.6" y="145" font-size="12" text-anchor="middle" fill="#2B2F4A" >3:50</text><rect x="231.1" y="120" width="148.9" height="40" rx="2" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" class="gx"/><text x="305.6" y="145" font-size="12" text-anchor="middle" fill="#FFF" >11:10</text><text x="60" y="36" font-size="11" text-anchor="start" class="h" >0 h</text><text x="380" y="36" font-size="11" text-anchor="end" class="h" >24 h</text><rect x="20" y="167" width="14" height="14" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" /><text x="40" y="179" font-size="12" text-anchor="start" class="h" >Income work</text><rect x="150" y="167" width="14" height="14" rx="3" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" /><text x="170" y="179" font-size="12" text-anchor="start" class="h" >Household work</text><rect x="280" y="167" width="14" height="14" rx="3" fill="#FFD25A" stroke="#2B2F4A" stroke-width="2" /><text x="300" y="179" font-size="12" text-anchor="start" class="h" >Talk, gossip</text><rect x="20" y="193" width="14" height="14" rx="3" fill="#2FB5A8" stroke="#2B2F4A" stroke-width="2" /><text x="40" y="205" font-size="12" text-anchor="start" class="h" >Leisure</text><rect x="150" y="193" width="14" height="14" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" /><text x="170" y="205" font-size="12" text-anchor="start" class="h" >Sleep, self-care</text></svg>
