<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" role="img">
<title>A 24-hour dial with a sun on one side and a moon on the other and a hand that turns once a day</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.gy{transform-box:fill-box;transform-origin:50% 100%;animation:gy 1.1s ease-out both}@keyframes gy{from{transform:scaleY(.05)}to{transform:scaleY(1)}}.gx{transform-box:fill-box;transform-origin:0% 50%;animation:gx 1.1s ease-out both}@keyframes gx{from{transform:scaleX(.05)}to{transform:scaleX(1)}}.fl{stroke-dasharray:7 6;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-13}}.sw{transform-box:fill-box;transform-origin:50% 50%;animation:sw 3s ease-in-out infinite}@keyframes sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}@keyframes sp{to{transform:rotate(360deg)}}.sp{transform-box:view-box;transform-origin:200px 118px;animation:sp 12s linear infinite}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
