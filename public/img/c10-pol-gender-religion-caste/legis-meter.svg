<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
<title>Two bars on a scale from 0 to 100 per cent: one near 14 and the other below 5, with a mark at one-third</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.gy{transform-box:fill-box;transform-origin:50% 100%;animation:gy 1.1s ease-out both}@keyframes gy{from{transform:scaleY(.05)}to{transform:scaleY(1)}}.gx{transform-box:fill-box;transform-origin:0% 50%;animation:gx 1.1s ease-out both}@keyframes gx{from{transform:scaleX(.05)}to{transform:scaleX(1)}}.fl{stroke-dasharray:7 6;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-13}}.sw{transform-box:fill-box;transform-origin:50% 50%;animation:sw 3s ease-in-out infinite}@keyframes sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="40" y="60" width="330" height="22" rx="6" fill="#EEE" stroke="#2B2F4A" stroke-width="2.5" /><rect x="40" y="120" width="330" height="22" rx="6" fill="#EEE" stroke="#2B2F4A" stroke-width="2.5" /><rect x="40" y="60" width="47.4" height="22" rx="6" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" class="gx"/><rect x="40" y="120" width="16.5" height="22" rx="6" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" class="gx"/><text x="40" y="52" font-size="12" text-anchor="start" class="h" >Lok Sabha (2019)</text><text x="40" y="112" font-size="12" text-anchor="start" class="h" >State assemblies</text><text x="95.4" y="76" font-size="13" text-anchor="start" class="h" >14.36</text><text x="64.5" y="136" font-size="13" text-anchor="start" class="h" >less than 5</text><line x1="150" y1="50" x2="150" y2="156" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5" /><text x="150" y="172" font-size="12" text-anchor="middle" class="h" >one-third</text><text x="40" y="200" font-size="11" text-anchor="middle" >0%</text><text x="205" y="200" font-size="11" text-anchor="middle" >50%</text><text x="370" y="200" font-size="11" text-anchor="middle" >100%</text></svg>
