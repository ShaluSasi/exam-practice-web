<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 350" role="img">
<title>Paired bars for nine caste and community groups showing the percentage living below the poverty line in rural and urban areas</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.gy{transform-box:fill-box;transform-origin:50% 100%;animation:gy 1.1s ease-out both}@keyframes gy{from{transform:scaleY(.05)}to{transform:scaleY(1)}}.gx{transform-box:fill-box;transform-origin:0% 50%;animation:gx 1.1s ease-out both}@keyframes gx{from{transform:scaleX(.05)}to{transform:scaleX(1)}}.fl{stroke-dasharray:7 6;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-13}}.sw{transform-box:fill-box;transform-origin:50% 50%;animation:sw 3s ease-in-out infinite}@keyframes sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
