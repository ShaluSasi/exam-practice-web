<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img">
<title>Two marks on a rupee scale: 327 rupees per person per month for rural areas and 454 rupees for urban areas</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.gy{transform-box:fill-box;transform-origin:50% 100%;animation:gy 1.1s ease-out both}@keyframes gy{from{transform:scaleY(.05)}to{transform:scaleY(1)}}.gx{transform-box:fill-box;transform-origin:0% 50%;animation:gx 1.1s ease-out both}@keyframes gx{from{transform:scaleX(.05)}to{transform:scaleX(1)}}.fl{stroke-dasharray:7 6;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-13}}.sw{transform-box:fill-box;transform-origin:50% 50%;animation:sw 3s ease-in-out infinite}@keyframes sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="30" y="90" width="340" height="22" rx="6" fill="#EEE" stroke="#2B2F4A" stroke-width="2.5" /><rect x="30" y="90" width="222.4" height="22" rx="6" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" class="gx"/><rect x="30" y="140" width="340" height="22" rx="6" fill="#EEE" stroke="#2B2F4A" stroke-width="2.5" /><rect x="30" y="140" width="308.7" height="22" rx="6" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" class="gx"/><text x="30" y="80" font-size="13" text-anchor="start" class="h" >Rural: ₹327</text><text x="30" y="130" font-size="13" text-anchor="start" class="h" >Urban: ₹454</text><text x="200" y="28" font-size="13" text-anchor="middle" class="h" >Spending per person per month</text><text x="200" y="46" font-size="12" text-anchor="middle" class="h" >that marks the poverty line</text><text x="30" y="186" font-size="11" text-anchor="middle" >₹0</text><text x="200" y="186" font-size="11" text-anchor="middle" >₹250</text><text x="370" y="186" font-size="11" text-anchor="middle" >₹500</text></svg>
