<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" role="img">
<title>Pie chart of the population share of the main religious communities in India in 2011 with a legend of the values</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.gy{transform-box:fill-box;transform-origin:50% 100%;animation:gy 1.1s ease-out both}@keyframes gy{from{transform:scaleY(.05)}to{transform:scaleY(1)}}.gx{transform-box:fill-box;transform-origin:0% 50%;animation:gx 1.1s ease-out both}@keyframes gx{from{transform:scaleX(.05)}to{transform:scaleX(1)}}.fl{stroke-dasharray:7 6;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-13}}.sw{transform-box:fill-box;transform-origin:50% 50%;animation:sw 3s ease-in-out infinite}@keyframes sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g class="pu"><path d="M110 112 L110.0 24.0 A88 88 0 1 1 26.0 85.9Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round"/><path d="M110 112 L26.0 85.9 A88 88 0 0 1 77.6 30.2Z" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round"/><path d="M110 112 L77.6 30.2 A88 88 0 0 1 89.7 26.4Z" fill="#FFD25A" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round"/><path d="M110 112 L89.7 26.4 A88 88 0 0 1 99.0 24.7Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round"/><path d="M110 112 L99.0 24.7 A88 88 0 0 1 110.0 24.0Z" fill="#8A8FB0" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round"/></g><rect x="228" y="44" width="16" height="16" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" /><text x="252" y="57" font-size="14" text-anchor="start" >Hindu  79.8</text><rect x="228" y="70" width="16" height="16" rx="3" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2" /><text x="252" y="83" font-size="14" text-anchor="start" >Muslim  14.2</text><rect x="228" y="96" width="16" height="16" rx="3" fill="#FFD25A" stroke="#2B2F4A" stroke-width="2" /><text x="252" y="109" font-size="14" text-anchor="start" >Christian  2.3</text><rect x="228" y="122" width="16" height="16" rx="3" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" /><text x="252" y="135" font-size="14" text-anchor="start" >Sikh  1.7</text><rect x="228" y="148" width="16" height="16" rx="3" fill="#8A8FB0" stroke="#2B2F4A" stroke-width="2" /><text x="252" y="161" font-size="14" text-anchor="start" >Others  2.0</text><text x="228" y="30" font-size="12" text-anchor="start" >Share of population, 2011 (%)</text><text x="228" y="200" font-size="11" text-anchor="start" >Others = Buddhist, Jain, other</text><text x="228" y="214" font-size="11" text-anchor="start" >religions, religion not stated</text></svg>
