<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A dog running away, a kitten sliding down, a girl crying out and a mouse dashing into a hole</title><style>.bob{animation:bob 1.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.drift{animation:drift 5s ease-in-out infinite alternate}@keyframes drift{from{transform:translateX(0)}to{transform:translateX(14px)}}
.driftl{animation:driftl 5s ease-in-out infinite alternate}@keyframes driftl{from{transform:translateX(0)}to{transform:translateX(-14px)}}
.spin{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinslow{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.35}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-22px);opacity:0}}
.sway{animation:sway 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.wave{animation:wave 1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0% 100%}@keyframes wave{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.scroll{animation:scroll 4s linear infinite}@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-60px)}}
.run{animation:run 4s linear infinite}@keyframes run{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.fall{animation:fall 2.4s linear infinite}@keyframes fall{from{transform:translateY(-6px);opacity:1}to{transform:translateY(16px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M16 0 H384 Q400 0 400 16 V170 H0 V16 Q0 0 16 0Z" fill="#FDE7C8"/><rect x="0" y="170" width="400" height="70" rx="0" fill="#C9A27A" /><g class="driftl"><g transform="translate(110 206) scale(-1.4 1.4)"><path d="M-18 -18 Q-28 -26 -22 -32" fill="none" stroke="#E0A400" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="0" cy="-16" rx="18" ry="11" fill="#F2C230" stroke="#2B2F4A" stroke-width="2"/><rect x="-12" y="-8" width="5" height="8" rx="2" fill="#E0A400" stroke="#2B2F4A" stroke-width="1.5" /><rect x="-4" y="-8" width="5" height="8" rx="2" fill="#E0A400" stroke="#2B2F4A" stroke-width="1.5" /><rect x="6" y="-8" width="5" height="8" rx="2" fill="#E0A400" stroke="#2B2F4A" stroke-width="1.5" /><rect x="12" y="-8" width="5" height="8" rx="2" fill="#E0A400" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="18" cy="-26" r="10" fill="#F2C230" stroke="#2B2F4A" stroke-width="2"/><ellipse cx="12" cy="-27" rx="4" ry="8" fill="#B8860B" stroke="#2B2F4A" stroke-width="1.5"/><circle cx="21" cy="-28" r="1.6" fill="#2B2F4A"/><circle cx="27" cy="-25" r="2.4" fill="#2B2F4A"/></g></g><path d="M170 190 H200 M175 200 H205" fill="none" stroke="#C9CED6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(50 230) scale(1.2 1.2)"><path d="M-14 -10 Q-26 -14 -22 -28" fill="none" stroke="#222" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="0" cy="-12" rx="15" ry="11" fill="#2B2B2B" stroke="#2B2F4A" stroke-width="2"/><circle cx="12" cy="-22" r="9" fill="#2B2B2B" stroke="#2B2F4A" stroke-width="2"/><path d="M6 -29 l0 -8 l6 5z M18 -29 l0 -8 l-6 5z" fill="#2B2B2B" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><circle cx="9" cy="-23" r="1.8" fill="#FFD23F"/><circle cx="15" cy="-23" r="1.8" fill="#FFD23F"/></g><path d="M22 160 q10 20 26 40" fill="none" stroke="#C9CED6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><g transform="translate(250 218) scale(1.2 1.2)"><rect x="-8" y="-16" width="6" height="16" rx="2" fill="#F2B48C"/><rect x="2" y="-16" width="6" height="16" rx="2" fill="#F2B48C"/><ellipse cx="-5" cy="0" rx="6" ry="2.5" fill="#2B2F4A"/><ellipse cx="5" cy="0" rx="6" ry="2.5" fill="#2B2F4A"/><path d="M-9 -40 L-18 -52" stroke="#F2B48C" stroke-width="4.5" stroke-linecap="round"/><path d="M9 -40 L18 -52" stroke="#F2B48C" stroke-width="4.5" stroke-linecap="round"/><path d="M-15 -13 L-8 -42 Q0 -46 8 -42 L15 -13 Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><circle cx="0" cy="-54" r="11" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2"/><path d="M-11 -54 Q-12 -68 0 -67 Q12 -68 11 -54 Q6 -61 0 -61 Q-6 -61 -11 -54Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1.5"/><circle cx="-4" cy="-55" r="1.7" fill="#2B2F4A"/><circle cx="4" cy="-55" r="1.7" fill="#2B2F4A"/><ellipse cx="0" cy="-46" rx="4" ry="4.5" fill="#A33"/></g><circle cx="328" cy="226" r="12" fill="#2B2B2B" stroke="#2B2F4A" stroke-width="2.5" /><g transform="translate(300 226) scale(0.8 0.8)"><path d="M-10 -4 Q-22 -2 -20 -12" fill="none" stroke="#8A8F98" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="0" cy="-6" rx="10" ry="7" fill="#A9AEB8" stroke="#2B2F4A" stroke-width="2"/><circle cx="9" cy="-9" r="5" fill="#A9AEB8" stroke="#2B2F4A" stroke-width="2"/><circle cx="6" cy="-15" r="3.5" fill="#F4A6A6" stroke="#2B2F4A" stroke-width="1.5"/><circle cx="11" cy="-10" r="1.2" fill="#2B2F4A"/></g></svg>