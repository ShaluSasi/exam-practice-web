<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A small girl raising her hand and shouting to stop a bus as it slows down</title><style>.bob{animation:bob 1.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.drift{animation:drift 5s ease-in-out infinite alternate}@keyframes drift{from{transform:translateX(0)}to{transform:translateX(14px)}}
.driftl{animation:driftl 5s ease-in-out infinite alternate}@keyframes driftl{from{transform:translateX(0)}to{transform:translateX(-14px)}}
.spin{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinslow{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.35}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-22px);opacity:0}}
.sway{animation:sway 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.wave{animation:wave 1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0% 100%}@keyframes wave{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.scroll{animation:scroll 4s linear infinite}@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-60px)}}
.run{animation:run 4s linear infinite}@keyframes run{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.fall{animation:fall 2.4s linear infinite}@keyframes fall{from{transform:translateY(-6px);opacity:1}to{transform:translateY(16px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M16 0 H384 Q400 0 400 16 V176 H0 V16 Q0 0 16 0Z" fill="#DDEBF7"/><rect x="0" y="176" width="400" height="64" rx="0" fill="#8A8F98" /><path d="M0 214 H400" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="dash"/><g class="drift"><g transform="translate(282 200) scale(-1.2 1.2)"><rect x="-85" y="-62" width="170" height="54" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><rect x="-85" y="-30" width="170" height="8" rx="0" fill="#3FA34D" /><path d="M-85 -30 H85 M-85 -22 H85" fill="none" stroke="#2B2F4A" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><rect x="-77" y="-55" width="22" height="18" rx="3" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.6" /><rect x="-50" y="-55" width="22" height="18" rx="3" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.6" /><rect x="-23" y="-55" width="22" height="18" rx="3" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.6" /><rect x="4" y="-55" width="22" height="18" rx="3" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.6" /><rect x="31" y="-55" width="22" height="18" rx="3" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.6" /><rect x="58" y="-55" width="22" height="18" rx="3" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.6" /><circle cx="82" cy="-14" r="4" fill="#FFD23F" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="-48" cy="-8" r="11" fill="#333" stroke="#2B2F4A" stroke-width="2" /><g class="spin"><circle cx="-48" cy="-8" r="5" fill="#DDD"/><path d="M-53 -8 H-43 M-48 -13 V-3" stroke="#777" stroke-width="1.5"/></g><circle cx="50" cy="-8" r="11" fill="#333" stroke="#2B2F4A" stroke-width="2" /><g class="spin"><circle cx="50" cy="-8" r="5" fill="#DDD"/><path d="M45 -8 H55 M50 -13 V-3" stroke="#777" stroke-width="1.5"/></g></g></g><path d="M392 130 H370 M396 150 H372" fill="none" stroke="#C9CED6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(80 212) scale(1.25 1.25)"><g class="bob"><rect x="-8" y="-16" width="6" height="16" rx="2" fill="#F2B48C"/><rect x="2" y="-16" width="6" height="16" rx="2" fill="#F2B48C"/><ellipse cx="-5" cy="0" rx="6" ry="2.5" fill="#2B2F4A"/><ellipse cx="5" cy="0" rx="6" ry="2.5" fill="#2B2F4A"/><path d="M-9 -40 L-14 -24" stroke="#F2B48C" stroke-width="4.5" stroke-linecap="round"/><path d="M9 -40 L20 -70" stroke="#F2B48C" stroke-width="4.5" stroke-linecap="round"/><path d="M-15 -13 L-8 -42 Q0 -46 8 -42 L15 -13 Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><circle cx="0" cy="-54" r="11" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2"/><path d="M-11 -54 Q-12 -68 0 -67 Q12 -68 11 -54 Q6 -61 0 -61 Q-6 -61 -11 -54Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1.5"/><path d="M-11 -54 Q-15 -46 -13 -38 M11 -54 Q15 -46 13 -38" stroke="#2B2F4A" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="-13" cy="-38" r="2.4" fill="#E5484D"/><circle cx="13" cy="-38" r="2.4" fill="#E5484D"/><circle cx="-4" cy="-55" r="1.7" fill="#2B2F4A"/><circle cx="4" cy="-55" r="1.7" fill="#2B2F4A"/><ellipse cx="0" cy="-46" rx="4" ry="4.5" fill="#A33"/></g></g><rect x="30" y="18" width="160" height="38" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><path d="M176 55 L182 68 L162 55" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="161" y="53" width="16" height="4" fill="#FFFFFF"/><text x="110.0" y="42.6" font-family="sans-serif" font-size="16" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Stop the bus!</text></svg>