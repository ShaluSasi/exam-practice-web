<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Three adjectives turning into adverbs: quick to quickly, gentle to gently, happy to happily</title><style>.bob{animation:bob 1.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.drift{animation:drift 5s ease-in-out infinite alternate}@keyframes drift{from{transform:translateX(0)}to{transform:translateX(14px)}}
.driftl{animation:driftl 5s ease-in-out infinite alternate}@keyframes driftl{from{transform:translateX(0)}to{transform:translateX(-14px)}}
.spin{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinslow{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.35}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-22px);opacity:0}}
.sway{animation:sway 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.wave{animation:wave 1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0% 100%}@keyframes wave{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.scroll{animation:scroll 4s linear infinite}@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-60px)}}
.run{animation:run 4s linear infinite}@keyframes run{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.fall{animation:fall 2.4s linear infinite}@keyframes fall{from{transform:translateY(-6px);opacity:1}to{transform:translateY(16px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M16 0 H384 Q400 0 400 16 V240 H0 V16 Q0 0 16 0Z" fill="#F6F1E4"/><rect x="30" y="34" width="100" height="40" rx="10" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" /><text x="80" y="60" font-family="sans-serif" font-size="16" font-weight="600" fill="#2B2F4A" text-anchor="middle" >quick</text><path d="M138 54 H250" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M244 47 L254 54 L244 61" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="262" y="34" width="110" height="40" rx="10" fill="#FFF3C4" stroke="#2B2F4A" stroke-width="2" /><text x="317" y="60" font-family="sans-serif" font-size="16" font-weight="600" fill="#2B2F4A" text-anchor="middle" >quickly</text><rect x="30" y="96" width="100" height="40" rx="10" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" /><text x="80" y="122" font-family="sans-serif" font-size="16" font-weight="600" fill="#2B2F4A" text-anchor="middle" >gentle</text><path d="M138 116 H250" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M244 109 L254 116 L244 123" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="262" y="96" width="110" height="40" rx="10" fill="#FFF3C4" stroke="#2B2F4A" stroke-width="2" /><text x="317" y="122" font-family="sans-serif" font-size="16" font-weight="600" fill="#2B2F4A" text-anchor="middle" >gently</text><rect x="30" y="158" width="100" height="40" rx="10" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" /><text x="80" y="184" font-family="sans-serif" font-size="16" font-weight="600" fill="#2B2F4A" text-anchor="middle" >happy</text><path d="M138 178 H250" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M244 171 L254 178 L244 185" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="262" y="158" width="110" height="40" rx="10" fill="#FFF3C4" stroke="#2B2F4A" stroke-width="2" /><text x="317" y="184" font-family="sans-serif" font-size="16" font-weight="600" fill="#2B2F4A" text-anchor="middle" >happily</text></svg>