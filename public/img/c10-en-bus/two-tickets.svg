<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Two thirty-paise tickets, one for going to town and one for coming back, with two coins</title><style>.bob{animation:bob 1.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.drift{animation:drift 5s ease-in-out infinite alternate}@keyframes drift{from{transform:translateX(0)}to{transform:translateX(14px)}}
.driftl{animation:driftl 5s ease-in-out infinite alternate}@keyframes driftl{from{transform:translateX(0)}to{transform:translateX(-14px)}}
.spin{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinslow{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.35}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-22px);opacity:0}}
.sway{animation:sway 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.wave{animation:wave 1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0% 100%}@keyframes wave{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.scroll{animation:scroll 4s linear infinite}@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-60px)}}
.run{animation:run 4s linear infinite}@keyframes run{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.fall{animation:fall 2.4s linear infinite}@keyframes fall{from{transform:translateY(-6px);opacity:1}to{transform:translateY(16px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M16 0 H384 Q400 0 400 16 V240 H0 V16 Q0 0 16 0Z" fill="#F6F1E4"/><g transform="translate(0 0) scale(1 1)"><g transform="translate(110 70) rotate(-4)"><rect x="-60.0" y="-32.0" width="120" height="64" rx="3" fill="#FFF3C4" stroke="#2B2F4A" stroke-width="2" /><path d="M-51.0 -32.0 V32.0" fill="none" stroke="#2B2F4A" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text x="43.0" y="5" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >30p</text></g><text x="110" y="125" font-family="sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="middle" >village to town</text><path d="M190 70 H260" fill="none" stroke="#0B93D4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" class="dash"/><path d="M262 62 L276 70 L262 78" fill="none" stroke="#0B93D4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(0 0) scale(1 1)"><g transform="translate(290 170) rotate(3)"><rect x="-60.0" y="-32.0" width="120" height="64" rx="3" fill="#FFF3C4" stroke="#2B2F4A" stroke-width="2" /><path d="M-51.0 -32.0 V32.0" fill="none" stroke="#2B2F4A" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><text x="43.0" y="5" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >30p</text></g><text x="290" y="225" font-family="sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="middle" >town to village</text><path d="M210 170 H140" fill="none" stroke="#3FA34D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" class="dash"/><path d="M138 162 L124 170 L138 178" fill="none" stroke="#3FA34D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g><circle cx="48" cy="170" r="18" fill="#FFD23F" stroke="#B8860B" stroke-width="2" /><text x="48" y="176.3" font-family="sans-serif" font-size="16.2" font-weight="700" fill="#8A6500" text-anchor="middle" >30</text><circle cx="48" cy="206" r="18" fill="#FFD23F" stroke="#B8860B" stroke-width="2" /><text x="48" y="212.3" font-family="sans-serif" font-size="16.2" font-weight="700" fill="#8A6500" text-anchor="middle" >30</text></svg>