<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A girl looking at a bus, with a flame of dreams and hopes lighting up in her thoughts</title><style>.bob{animation:bob 1.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.drift{animation:drift 5s ease-in-out infinite alternate}@keyframes drift{from{transform:translateX(0)}to{transform:translateX(14px)}}
.driftl{animation:driftl 5s ease-in-out infinite alternate}@keyframes driftl{from{transform:translateX(0)}to{transform:translateX(-14px)}}
.spin{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinslow{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.35}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-22px);opacity:0}}
.sway{animation:sway 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.wave{animation:wave 1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0% 100%}@keyframes wave{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.scroll{animation:scroll 4s linear infinite}@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-60px)}}
.run{animation:run 4s linear infinite}@keyframes run{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.fall{animation:fall 2.4s linear infinite}@keyframes fall{from{transform:translateY(-6px);opacity:1}to{transform:translateY(16px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M16 0 H384 Q400 0 400 16 V240 H0 V16 Q0 0 16 0Z" fill="#FDE7C8"/><g transform="translate(120 224) scale(1.5 1.5)"><rect x="-8" y="-16" width="6" height="16" rx="2" fill="#F2B48C"/><rect x="2" y="-16" width="6" height="16" rx="2" fill="#F2B48C"/><ellipse cx="-5" cy="0" rx="6" ry="2.5" fill="#2B2F4A"/><ellipse cx="5" cy="0" rx="6" ry="2.5" fill="#2B2F4A"/><path d="M-9 -40 L-14 -24" stroke="#F2B48C" stroke-width="4.5" stroke-linecap="round"/><path d="M9 -40 L14 -24" stroke="#F2B48C" stroke-width="4.5" stroke-linecap="round"/><path d="M-15 -13 L-8 -42 Q0 -46 8 -42 L15 -13 Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><circle cx="0" cy="-54" r="11" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2"/><path d="M-11 -54 Q-12 -68 0 -67 Q12 -68 11 -54 Q6 -61 0 -61 Q-6 -61 -11 -54Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1.5"/><path d="M-11 -54 Q-15 -46 -13 -38 M11 -54 Q15 -46 13 -38" stroke="#2B2F4A" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="-13" cy="-38" r="2.4" fill="#E5484D"/><circle cx="13" cy="-38" r="2.4" fill="#E5484D"/><circle cx="-3" cy="-57" r="1.7" fill="#2B2F4A"/><circle cx="5" cy="-57" r="1.7" fill="#2B2F4A"/><path d="M-7 -61 L-2 -63 M8 -61 L3 -63" stroke="#2B2F4A" stroke-width="1.6" stroke-linecap="round"/><path d="M-4 -46 Q0 -50 4 -46" fill="none" stroke="#2B2F4A" stroke-width="1.8" stroke-linecap="round"/></g><rect x="190" y="16" width="190" height="108" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><path d="M204 123 L198 136 L218 123" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="203" y="121" width="16" height="4" fill="#FFFFFF"/><text x="285.0" y="74.2" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" ></text><g class="pulse"><path d="M285 104 Q256 84 272 56 Q278 70 288 62 Q286 44 300 34 Q304 56 318 66 Q326 82 298 104Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M288 100 Q276 88 290 76 Q296 88 302 90Z" fill="#FFD23F" /></g><rect x="214" y="112" width="40" height="5" rx="2" fill="#D9B77C" stroke="#2B2F4A" stroke-width="2" /><circle cx="214" cy="114" r="5" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" /><g class="blink"><path d="M330 40 l4 -8 l4 8 l8 4 l-8 4 l-4 8 l-4 -8 l-8 -4z" fill="#FFD23F" stroke="#FF8A1F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M350 90 l3 -6 l3 6 l6 3 l-6 3 l-3 6 l-3 -6 l-6 -3z" fill="#FFD23F" stroke="#FF8A1F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g></svg>