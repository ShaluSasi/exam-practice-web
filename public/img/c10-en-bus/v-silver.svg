<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Shining overhead bars in a bus compared to a pile of silver coins</title><style>.bob{animation:bob 1.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.drift{animation:drift 5s ease-in-out infinite alternate}@keyframes drift{from{transform:translateX(0)}to{transform:translateX(14px)}}
.driftl{animation:driftl 5s ease-in-out infinite alternate}@keyframes driftl{from{transform:translateX(0)}to{transform:translateX(-14px)}}
.spin{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinslow{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.35}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-22px);opacity:0}}
.sway{animation:sway 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.wave{animation:wave 1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0% 100%}@keyframes wave{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.scroll{animation:scroll 4s linear infinite}@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-60px)}}
.run{animation:run 4s linear infinite}@keyframes run{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.fall{animation:fall 2.4s linear infinite}@keyframes fall{from{transform:translateY(-6px);opacity:1}to{transform:translateY(16px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M16 0 H384 Q400 0 400 16 V240 H0 V16 Q0 0 16 0Z" fill="#F6EBD0"/><path d="M14 60 H386" fill="none" stroke="#9AA3B2" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" /><path d="M14 56 H386" fill="none" stroke="#F4F7FB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><g class="blink"><path d="M70 49 l3 6 l6 3 l-6 3 l-3 6 l-3 -6 l-6 -3 l6 -3z" fill="#fff" stroke="#2B2F4A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M180 47 l3 6 l6 3 l-6 3 l-3 6 l-3 -6 l-6 -3 l6 -3z" fill="#fff" stroke="#2B2F4A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M300 53 l3 6 l6 3 l-6 3 l-3 6 l-3 -6 l-6 -3 l6 -3z" fill="#fff" stroke="#2B2F4A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M90 66 V84" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="90" cy="94" r="10" fill="none" stroke="#2B2F4A" stroke-width="3" /><path d="M310 66 V84" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="310" cy="94" r="10" fill="none" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="150" font-family="sans-serif" font-size="22" font-weight="600" fill="#FF8A1F" text-anchor="middle" >like</text><circle cx="130" cy="196" r="17" fill="#E4E8EE" stroke="#2B2F4A" stroke-width="2.5" /><path d="M122 190 q8 -6 14 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="170" cy="196" r="17" fill="#E4E8EE" stroke="#2B2F4A" stroke-width="2.5" /><path d="M162 190 q8 -6 14 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="210" cy="196" r="17" fill="#E4E8EE" stroke="#2B2F4A" stroke-width="2.5" /><path d="M202 190 q8 -6 14 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="250" cy="196" r="17" fill="#E4E8EE" stroke="#2B2F4A" stroke-width="2.5" /><path d="M242 190 q8 -6 14 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="150" cy="172" r="17" fill="#E4E8EE" stroke="#2B2F4A" stroke-width="2.5" /><path d="M142 166 q8 -6 14 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="190" cy="172" r="17" fill="#E4E8EE" stroke="#2B2F4A" stroke-width="2.5" /><path d="M182 166 q8 -6 14 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="230" cy="172" r="17" fill="#E4E8EE" stroke="#2B2F4A" stroke-width="2.5" /><path d="M222 166 q8 -6 14 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></svg>