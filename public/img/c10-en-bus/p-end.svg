<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A cheerful dragon with a nice safe cage nearby while the others boast about how brave they would have been</title><style>.bob{animation:bob 1.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.drift{animation:drift 5s ease-in-out infinite alternate}@keyframes drift{from{transform:translateX(0)}to{transform:translateX(14px)}}
.driftl{animation:driftl 5s ease-in-out infinite alternate}@keyframes driftl{from{transform:translateX(0)}to{transform:translateX(-14px)}}
.spin{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinslow{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.35}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-22px);opacity:0}}
.sway{animation:sway 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.wave{animation:wave 1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0% 100%}@keyframes wave{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.scroll{animation:scroll 4s linear infinite}@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-60px)}}
.run{animation:run 4s linear infinite}@keyframes run{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.fall{animation:fall 2.4s linear infinite}@keyframes fall{from{transform:translateY(-6px);opacity:1}to{transform:translateY(16px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M16 0 H384 Q400 0 400 16 V240 H0 V16 Q0 0 16 0Z" fill="#E3F2FD"/><rect x="0" y="190" width="400" height="50" rx="0" fill="#C9E4A8" /><rect x="300" y="120" width="76" height="70" rx="4" fill="none" stroke="#2B2F4A" stroke-width="3" /><path d="M318 120 V190" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M338 120 V190" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M358 120 V190" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M300 120 H376" fill="none" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(160 206) scale(1.4 1.4)"><path d="M-34 -26 Q-60 -20 -62 -40 Q-52 -34 -44 -40" fill="#4CAF50" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M-62 -40 l-8 -8 l2 12z" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M-26 -50 l4 -12 l4 12z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><path d="M-12 -50 l4 -12 l4 12z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><path d="M2 -50 l4 -12 l4 12z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><path d="M16 -50 l4 -12 l4 12z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><ellipse cx="0" cy="-30" rx="36" ry="22" fill="#4CAF50" stroke="#2B2F4A" stroke-width="2.5"/><ellipse cx="0" cy="-22" rx="26" ry="13" fill="#B7E4B9"/><path d="M-19 -36 q5 -5 10 0" fill="none" stroke="#2E7D32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M-5 -36 q5 -5 10 0" fill="none" stroke="#2E7D32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M9 -36 q5 -5 10 0" fill="none" stroke="#2E7D32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="-22" y="-12" width="12" height="12" rx="3" fill="#4CAF50" stroke="#2B2F4A" stroke-width="2" /><rect x="12" y="-12" width="12" height="12" rx="3" fill="#4CAF50" stroke="#2B2F4A" stroke-width="2" /><path d="M-24 0 l2 7 l2 -7z" fill="#fff" stroke="#2B2F4A" stroke-width="1.5"/><path d="M-19 0 l2 7 l2 -7z" fill="#fff" stroke="#2B2F4A" stroke-width="1.5"/><path d="M-14 0 l2 7 l2 -7z" fill="#fff" stroke="#2B2F4A" stroke-width="1.5"/><path d="M10 0 l2 7 l2 -7z" fill="#fff" stroke="#2B2F4A" stroke-width="1.5"/><path d="M15 0 l2 7 l2 -7z" fill="#fff" stroke="#2B2F4A" stroke-width="1.5"/><path d="M20 0 l2 7 l2 -7z" fill="#fff" stroke="#2B2F4A" stroke-width="1.5"/><circle cx="36" cy="-46" r="15" fill="#4CAF50" stroke="#2B2F4A" stroke-width="2.5"/><ellipse cx="46" cy="-40" rx="10" ry="8" fill="#4CAF50" stroke="#2B2F4A" stroke-width="2.5"/><rect x="40" y="-66" width="6" height="12" rx="1" fill="#8A8F98" stroke="#2B2F4A" stroke-width="2" /><g class="rise"><circle cx="43" cy="-70" r="4" fill="#E4E8EE" /></g><path d="M38 -36 Q46 -30 56 -36" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M42 -35 l2 5 l2 -5z" fill="#fff" stroke="#2B2F4A" stroke-width="1"/><path d="M48 -35 l2 5 l2 -5z" fill="#fff" stroke="#2B2F4A" stroke-width="1"/><path d="M53 -35 l2 5 l2 -5z" fill="#fff" stroke="#2B2F4A" stroke-width="1"/><circle cx="33" cy="-50" r="3.5" fill="#fff" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="34" cy="-50" r="1.5" fill="#2B2F4A" /><path d="M27 -60 l8 3" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="20" y="14" width="120" height="44" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><path d="M126 57 L132 70 L112 57" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="111" y="55" width="16" height="4" fill="#FFFFFF"/><text x="80.0" y="40.2" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Twice as brave!</text><rect x="150" y="10" width="110" height="44" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><path d="M164 53 L158 66 L178 53" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="163" y="51" width="16" height="4" fill="#FFFFFF"/><text x="205.0" y="36.2" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Three times!</text></svg>