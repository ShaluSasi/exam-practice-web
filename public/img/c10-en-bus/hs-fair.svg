<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A village fair: a merry-go-round, balloons, a jar of peppermints, a toy car on a table, and a girl</title><style>.bob{animation:bob 1.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.drift{animation:drift 5s ease-in-out infinite alternate}@keyframes drift{from{transform:translateX(0)}to{transform:translateX(14px)}}
.driftl{animation:driftl 5s ease-in-out infinite alternate}@keyframes driftl{from{transform:translateX(0)}to{transform:translateX(-14px)}}
.spin{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinslow{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.35}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-22px);opacity:0}}
.sway{animation:sway 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.wave{animation:wave 1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0% 100%}@keyframes wave{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.scroll{animation:scroll 4s linear infinite}@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-60px)}}
.run{animation:run 4s linear infinite}@keyframes run{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.fall{animation:fall 2.4s linear infinite}@keyframes fall{from{transform:translateY(-6px);opacity:1}to{transform:translateY(16px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M16 0 H384 Q400 0 400 16 V200 H0 V16 Q0 0 16 0Z" fill="#FDE7C8"/><path d="M0 196 H400 V224 Q400 240 384 240 H16 Q0 240 0 224 Z" fill="#C9E4A8"/><ellipse cx="140" cy="160" rx="62" ry="14" fill="#B5835A" stroke="#2B2F4A" stroke-width="2.5"/><rect x="136" y="70" width="8" height="90" rx="2" fill="#8A8F98" stroke="#2B2F4A" stroke-width="2" /><g class="bob" style="animation-delay:0.0s"><path d="M98 90 V140" fill="none" stroke="#C9CED6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="98" cy="136" rx="9" ry="6" fill="#E5484D" stroke="#2B2F4A" stroke-width="2"/><circle cx="106" cy="130" r="4" fill="#E5484D" stroke="#2B2F4A" stroke-width="2"/></g><g class="bob" style="animation-delay:-0.3s"><path d="M126 90 V140" fill="none" stroke="#C9CED6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="126" cy="136" rx="9" ry="6" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2"/><circle cx="134" cy="130" r="4" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2"/></g><g class="bob" style="animation-delay:-0.6s"><path d="M154 90 V140" fill="none" stroke="#C9CED6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="154" cy="136" rx="9" ry="6" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2"/><circle cx="162" cy="130" r="4" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2"/></g><g class="bob" style="animation-delay:-0.8999999999999999s"><path d="M182 90 V140" fill="none" stroke="#C9CED6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="182" cy="136" rx="9" ry="6" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2"/><circle cx="190" cy="130" r="4" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2"/></g><path d="M72 80 Q140 30 208 80 Q196 86 186 80 Q176 88 164 80 Q152 88 140 80 Q128 88 116 80 Q104 88 94 80 Q84 86 72 80Z" fill="#7C5CFF" stroke="#2B