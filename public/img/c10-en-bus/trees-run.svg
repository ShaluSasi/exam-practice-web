<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Cartoon trees with legs and arms running towards a bus, as they seem to from a moving window</title><style>.bob{animation:bob 1.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.drift{animation:drift 5s ease-in-out infinite alternate}@keyframes drift{from{transform:translateX(0)}to{transform:translateX(14px)}}
.driftl{animation:driftl 5s ease-in-out infinite alternate}@keyframes driftl{from{transform:translateX(0)}to{transform:translateX(-14px)}}
.spin{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinslow{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.35}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-22px);opacity:0}}
.sway{animation:sway 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.wave{animation:wave 1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0% 100%}@keyframes wave{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.scroll{animation:scroll 4s linear infinite}@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-60px)}}
.run{animation:run 4s linear infinite}@keyframes run{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.fall{animation:fall 2.4s linear infinite}@keyframes fall{from{transform:translateY(-6px);opacity:1}to{transform:translateY(16px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M16 0 H384 Q400 0 400 16 V150 H0 V16 Q0 0 16 0Z" fill="#DDEBF7"/><path d="M0 150 H400 V224 Q400 240 384 240 H16 Q0 240 0 224 Z" fill="#C9E4A8"/><rect x="0" y="170" width="400" height="46" rx="0" fill="#8A8F98" /><g class="run"><g transform="translate(40 168)"><path d="M0 0 L-10 22 M0 0 L10 22" fill="none" stroke="#8B5A2B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(40 168) scale(1.15 1.15)"><rect x="-4" y="-30" width="8" height="30" rx="0" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2" /><circle cx="0" cy="-42" r="18" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.2" /><circle cx="-12" cy="-34" r="11" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.2" /><circle cx="12" cy="-34" r="11" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.2" /></g><path d="M26 120 l-16 -8 M54 120 l16 -8" fill="none" stroke="#8B5A2B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(100 168)"><path d="M0 0 L-10 22 M0 0 L10 22" fill="none" stroke="#8B5A2B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(100 168) scale(1.15 1.15)"><rect x="-4" y="-30" width="8" height="30" rx="0" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2" /><circle cx="0" cy="-42" r="18" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.2" /><circle cx="-12" cy="-34" r="11" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.2" /><circle cx="12" cy="-34" r="11" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.2" /></g><path d="M86 120 l-16 -8 M114 120 l16 -8" fill="none" stroke="#8B5A2B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(160 168)"><path d="M0 0 L-10 22 M0 0 L10 22" fill="none" stroke="#8B5A2B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(160 168) scale(1.15 1.15)"><rect x="-4" y="-30" width="8" height="30" rx="0" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2" /><circle cx="0" cy="-42" r="18" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.2" /><circle cx="-12" cy="-34" r="11" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.2" /><circle cx="12" cy="-34" r="11" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.2" /></g><path d="M146 120 l-16 -8 M174 120 l16 -8" fill="none" stroke="#8B5A2B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(305 210) scale(-1.0 1.0)"><rect x="-85" y="-62" width="170" height="54" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><rect x="-85" y="-30" width="170" height="8" rx="0" fill="#3FA34D" /><path d="M-85 -30 H85 M-85 -22 H85" fill="none" stroke="#2B2F4A" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><rect x="-77" y="-55" width="22" height="18" rx="3" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.6" /><rect x="-50" y="-55" width="22" height="18" rx="3" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.6" /><rect x="-23" y="-55" width="22" height="18" rx="3" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.6" /><rect x="4" y="-55" width="22" height="18" rx="3" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.6" /><rect x="31" y="-55" width="22" height="18" rx="3" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.6" /><rect x="58" y="-55" width="22" height="18" rx="3" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.6" /><circle cx="82" cy="-14" r="4" fill="#FFD23F" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="-48" cy="-8" r="11" fill="#333" stroke="#2B2F4A" stroke-width="2" /><g class="spin"><circle cx="-48" cy="-8" r="5" fill="#DDD"/><path d="M-53 -8 H-43 M-48 -13 V-3" stroke="#777" stroke-width="1.5"/></g><circle cx="50" cy="-8" r="11" fill="#333" stroke="#2B2F4A" stroke-width="2" /><g class="spin"><circle cx="50" cy="-8" r="5" fill="#DDD"/><path d="M45 -8 H55 M50 -13 V-3" stroke="#777" stroke-width=