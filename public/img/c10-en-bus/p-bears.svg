<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A girl showing off her muscles beside a barrel crammed with bears</title><style>.bob{animation:bob 1.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.drift{animation:drift 5s ease-in-out infinite alternate}@keyframes drift{from{transform:translateX(0)}to{transform:translateX(14px)}}
.driftl{animation:driftl 5s ease-in-out infinite alternate}@keyframes driftl{from{transform:translateX(0)}to{transform:translateX(-14px)}}
.spin{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinslow{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.35}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-22px);opacity:0}}
.sway{animation:sway 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.wave{animation:wave 1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0% 100%}@keyframes wave{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.scroll{animation:scroll 4s linear infinite}@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-60px)}}
.run{animation:run 4s linear infinite}@keyframes run{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.fall{animation:fall 2.4s linear infinite}@keyframes fall{from{transform:translateY(-6px);opacity:1}to{transform:translateY(16px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M16 0 H384 Q400 0 400 16 V240 H0 V16 Q0 0 16 0Z" fill="#E3F2FD"/><rect x="0" y="190" width="400" height="50" rx="0" fill="#C9E4A8" /><rect x="240" y="130" width="100" height="70" rx="10" fill="#B5835A" stroke="#2B2F4A" stroke-width="2.5" /><path d="M240 150 H340 M240 180 H340" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="262" cy="120" r="17" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="250" cy="106" r="6" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2" /><circle cx="274" cy="106" r="6" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2" /><circle cx="257" cy="118" r="2" fill="#2B2F4A" /><circle cx="267" cy="118" r="2" fill="#2B2F4A" /><circle cx="262" cy="126" r="4" fill="#D9A07A" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="290" cy="120" r="17" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="278" cy="106" r="6" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2" /><circle cx="302" cy="106" r="6" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2" /><circle cx="285" cy="118" r="2" fill="#2B2F4A" /><circle cx="295" cy="118" r="2" fill="#2B2F4A" /><circle cx="290" cy="126" r="4" fill="#D9A07A" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="318" cy="120" r="17" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="306" cy="106" r="6" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2" /><circle cx="330" cy="106" r="6" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2" /><circle cx="313" cy="118" r="2" fill="#2B2F4A" /><circle cx="323" cy="118" r="2" fill="#2B2F4A" /><circle cx="318" cy="126" r="4" fill="#D9A07A" stroke="#2B2F4A" stroke-width="1.5" /><g transform="translate(110 214) scale(1.5 1.5)"><rect x="-8" y="-16" width="6" height="16" rx="2" fill="#F2B48C"/><rect x="2" y="-16" width="6" height="16" rx="2" fill="#F2B48C"/><ellipse cx="-5" cy="0" rx="6" ry="2.5" fill="#2B2F4A"/><ellipse cx="5" cy="0" rx="6" ry="2.5" fill="#2B2F4A"/><path d="M-9 -40 L-26 -52" stroke="#F2B48C" stroke-width="4.5" stroke-linecap="round"/><path d="M9 -40 L26 -52" stroke="#F2B48C" stroke-width="4.5" stroke-linecap="round"/><path d="M-15 -13 L-8 -42 Q0 -46 8 -42 L15 -13 Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><circle cx="0" cy="-54" r="11" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2"/><path d="M-11 -54 Q-12 -68 0 -67 Q12 -68 11 -54 Q6 -61 0 -61 Q-6 -61 -11 -54Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1.5"/><circle cx="-4" cy="-55" r="1.7" fill="#2B2F4A"/><circle cx="4" cy="-55" r="1.7" fill="#2B2F4A"/><path d="M-7 -60 L-2 -58 M7 -60 L2 -58" stroke="#2B2F4A" stroke-width="1.8" stroke-linecap="round"/><path d="M-3 -47 H3" stroke="#2B2F4A" stroke-width="1.8" stroke-linecap="round"/></g></svg>