<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A winding road sketch from a village to a town with a small bus on it</title><style>.bob{animation:bob 1.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.drift{animation:drift 5s ease-in-out infinite alternate}@keyframes drift{from{transform:translateX(0)}to{transform:translateX(14px)}}
.driftl{animation:driftl 5s ease-in-out infinite alternate}@keyframes driftl{from{transform:translateX(0)}to{transform:translateX(-14px)}}
.spin{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinslow{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.35}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-22px);opacity:0}}
.sway{animation:sway 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.wave{animation:wave 1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0% 100%}@keyframes wave{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.scroll{animation:scroll 4s linear infinite}@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-60px)}}
.run{animation:run 4s linear infinite}@keyframes run{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.fall{animation:fall 2.4s linear infinite}@keyframes fall{from{transform:translateY(-6px);opacity:1}to{transform:translateY(16px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M16 0 H384 Q400 0 400 16 V240 H0 V16 Q0 0 16 0Z" fill="#E8F3E0"/><path d="M60 150 C130 70 190 220 260 120 S330 120 340 110" fill="none" stroke="#8A8F98" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" /><path d="M60 150 C130 70 190 220 260 120 S330 120 340 110" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="dash"/><rect x="24" y="126" width="44" height="34" rx="0" fill="#F3D9A4" stroke="#2B2F4A" stroke-width="2.5" /><path d="M18 128 L46 104 L74 128Z" fill="#B5523B" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="40" y="138" width="12" height="22" rx="0" fill="#4A3A33" stroke="#2B2F4A" stroke-width="2" /><text x="46" y="184" font-family="sans-serif" font-size="14" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Village</text><rect x="338" y="90" width="22" height="50" rx="0" fill="#C5CAD6" stroke="#2B2F4A" stroke-width="2.5" /><rect x="362" y="76" width="22" height="64" rx="0" fill="#AAB2C5" stroke="#2B2F4A" stroke-width="2.5" /><rect x="340" y="100" width="6" height="6" rx="0" fill="#FFD23F" /><text x="358" y="162" font-family="sans-serif" font-size="14" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Town</text><g class="drift"><g transform="translate(150 100) scale(0.38 0.38)"><rect x="-85" y="-62" width="170" height="54" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><rect x="-85" y="-30" width="170" height="8" rx="0" fill="#3FA34D" /><path d="M-85 -30 H85 M-85 -22 H85" fill="none" stroke="#2B2F4A" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><rect x="-77" y="-55" width="22" height="18" rx="3" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.6" /><rect x="-50" y="-55" width="22" height="18" rx="3" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.6" /><rect x="-23" y="-55" width="22" height="18" rx="3" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.6" /><rect x="4" y="-55" width="22" height="18" rx="3" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.6" /><rect x="31" y="-55" width="22" height="18" rx="3" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.6" /><rect x="58" y="-55" width="22" height="18" rx="3" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.6" /><circle cx="82" cy="-14" r="4" fill="#FFD23F" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="-48" cy="-8" r="11" fill="#333" stroke="#2B2F4A" stroke-width="2" /><g class="spin"><circle cx="-48" cy="-8" r="5" fill="#DDD"/><path d="M-53 -8 H-43 M-48 -13 V-3" stroke="#777" stroke-width="1.5"/></g><circle cx="50" cy="-8" r="11" fill="#333" stroke="#2B2F4A" stroke-width="2" /><g class="spin"><circle cx="50" cy="-8" r="5" fill="#DDD"/><path d="M45 -8 H55 M50 -13 V-3" stroke="#777" stroke-width="1.5"/></g></g></g><text x="200" y="226" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >6 miles  |  45 minutes  |  30 paise each way</text></svg>