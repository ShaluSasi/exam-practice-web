<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Four lines of the first stanza with their last words: house, mouse, wagon, dragon</title><style>.bob{animation:bob 1.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.drift{animation:drift 5s ease-in-out infinite alternate}@keyframes drift{from{transform:translateX(0)}to{transform:translateX(14px)}}
.driftl{animation:driftl 5s ease-in-out infinite alternate}@keyframes driftl{from{transform:translateX(0)}to{transform:translateX(-14px)}}
.spin{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinslow{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.35}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-22px);opacity:0}}
.sway{animation:sway 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.wave{animation:wave 1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0% 100%}@keyframes wave{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.scroll{animation:scroll 4s linear infinite}@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-60px)}}
.run{animation:run 4s linear infinite}@keyframes run{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.fall{animation:fall 2.4s linear infinite}@keyframes fall{from{transform:translateY(-6px);opacity:1}to{transform:translateY(16px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="30" y="22" width="230" height="40" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><text x="50" y="48" font-family="sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="start" >Line 1</text><rect x="200" y="28" width="52" height="28" rx="8" fill="#FFF3C4" stroke="#2B2F4A" stroke-width="2" /><text x="226" y="47" font-family="sans-serif" font-size="14" font-weight="600" fill="#2B2F4A" text-anchor="middle" >house</text><rect x="30" y="74" width="230" height="40" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><text x="50" y="100" font-family="sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="start" >Line 2</text><rect x="200" y="80" width="52" height="28" rx="8" fill="#FFF3C4" stroke="#2B2F4A" stroke-width="2" /><text x="226" y="99" font-family="sans-serif" font-size="14" font-weight="600" fill="#2B2F4A" text-anchor="middle" >mouse</text><rect x="30" y="126" width="230" height="40" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><text x="50" y="152" font-family="sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="start" >Line 3</text><rect x="200" y="132" width="52" height="28" rx="8" fill="#FFF3C4" stroke="#2B2F4A" stroke-width="2" /><text x="226" y="151" font-family="sans-serif" font-size="14" font-weight="600" fill="#2B2F4A" text-anchor="middle" >wagon</text><rect x="30" y="178" width="230" height="40" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><text x="50" y="204" font-family="sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="start" >Line 4</text><rect x="200" y="184" width="52" height="28" rx="8" fill="#FFF3C4" stroke="#2B2F4A" stroke-width="2" /><text x="226" y="203" font-family="sans-serif" font-size="14" font-weight="600" fill="#2B2F4A" text-anchor="middle" >dragon</text><text x="330" y="120" font-family="sans-serif" font-size="18" font-weight="600" fill="#FF8A1F" text-anchor="middle" >Last</text><text x="330" y="142" font-family="sans-serif" font-size="18" font-weight="600" fill="#FF8A1F" text-anchor="middle" >words</text></svg>