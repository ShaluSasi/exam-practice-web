<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A bus driver honking behind a frightened young cow that runs along the road ahead of the bus</title><style>.bob{animation:bob 1.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.drift{animation:drift 5s ease-in-out infinite alternate}@keyframes drift{from{transform:translateX(0)}to{transform:translateX(14px)}}
.driftl{animation:driftl 5s ease-in-out infinite alternate}@keyframes driftl{from{transform:translateX(0)}to{transform:translateX(-14px)}}
.spin{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinslow{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.35}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-22px);opacity:0}}
.sway{animation:sway 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.wave{animation:wave 1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0% 100%}@keyframes wave{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.scroll{animation:scroll 4s linear infinite}@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-60px)}}
.run{animation:run 4s linear infinite}@keyframes run{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.fall{animation:fall 2.4s linear infinite}@keyframes fall{from{transform:translateY(-6px);opacity:1}to{transform:translateY(16px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M16 0 H384 Q400 0 400 16 V150 H0 V16 Q0 0 16 0Z" fill="#DDEBF7"/><path d="M0 150 H400 V224 Q400 240 384 240 H16 Q0 240 0 224 Z" fill="#C9E4A8"/><rect x="0" y="150" width="400" height="60" rx="0" fill="#8A8F98" /><path d="M0 180 H400" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="dash"/><g class="drift"><g transform="translate(110 200) scale(1.1 1.1)"><rect x="-85" y="-62" width="170" height="54" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><rect x="-85" y="-30" width="170" height="8" rx="0" fill="#3FA34D" /><path d="M-85 -30 H85 M-85 -22 H85" fill="none" stroke="#2B2F4A" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><rect x="-77" y="-55" width="22" height="18" rx="3" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.6" /><rect x="-50" y="-55" width="22" height="18" rx="3" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.6" /><rect x="-23" y="-55" width="22" height="18" rx="3" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.6" /><rect x="4" y="-55" width="22" height="18" rx="3" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.6" /><rect x="31" y="-55" width="22" height="18" rx="3" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.6" /><rect x="58" y="-55" width="22" height="18" rx="3" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.6" /><circle cx="82" cy="-14" r="4" fill="#FFD23F" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="-48" cy="-8" r="11" fill="#333" stroke="#2B2F4A" stroke-width="2" /><g class="spin"><circle cx="-48" cy="-8" r="5" fill="#DDD"/><path d="M-53 -8 H-43 M-48 -13 V-3" stroke="#777" stroke-width="1.5"/></g><circle cx="50" cy="-8" r="11" fill="#333" stroke="#2B2F4A" stroke-width="2" /><g class="spin"><circle cx="50" cy="-8" r="5" fill="#DDD"/><path d="M45 -8 H55 M50 -13 V-3" stroke="#777" stroke-width="1.5"/></g></g></g><g class="drift"><g transform="translate(290 196) scale(1.25 1.25)"><g class="bob"><rect x="-18" y="-16" width="5" height="16" rx="2" fill="#A86B3C" stroke="#2B2F4A" stroke-width="1.5"/><rect x="-10" y="-16" width="5" height="16" rx="2" fill="#A86B3C" stroke="#2B2F4A" stroke-width="1.5"/><rect x="8" y="-16" width="5" height="16" rx="2" fill="#A86B3C" stroke="#2B2F4A" stroke-width="1.5"/><rect x="16" y="-16" width="5" height="16" rx="2" fill="#A86B3C" stroke="#2B2F4A" stroke-width="1.5"/><path d="M-24 -30 Q-36 -40 -31 -52" fill="none" stroke="#A86B3C" stroke-width="3.5" stroke-linecap="round"/><circle cx="-31" cy="-52" r="3" fill="#2B2F4A"/><ellipse cx="0" cy="-24" rx="25" ry="13" fill="#C98B5A" stroke="#2B2F4A" stroke-width="2.2"/><ellipse cx="-6" cy="-26" rx="9" ry="6" fill="#FFF" opacity=".9"/><ellipse cx="28" cy="-33" rx="11" ry="9" fill="#C98B5A" stroke="#2B2F4A" stroke-width="2.2"/><ellipse cx="35" cy="-30" rx="5" ry="4" fill="#F4A6A6" stroke="#2B2F4A" stroke-width="1.2"/><circle cx="26" cy="-37" r="1.8" fill="#2B2F4A"/><path d="M22 -42 L19 -47 M30 -42 L32 -47" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="20" cy="-39" rx="4" ry="2.5" fill="#A86B3C" stroke="#2B2F4A" stroke-width="1.2"/></g></g></g><path d="M232 130 q10 8 0 16 M246 124 q14 14 0 28" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="240" y="112" font-family="sans-serif" font-size="13" font-weight="600" fill="#FF8A1F" text-anchor="middle" >Honk! Honk!</text><path d="M330 128 H356 M334 142 H366" fill="none" stroke="#C9CED6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></svg>