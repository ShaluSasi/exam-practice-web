<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A wide, busy public road with buses, cars and shops on either side</title><style>.bob{animation:bob 1.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.drift{animation:drift 5s ease-in-out infinite alternate}@keyframes drift{from{transform:translateX(0)}to{transform:translateX(14px)}}
.driftl{animation:driftl 5s ease-in-out infinite alternate}@keyframes driftl{from{transform:translateX(0)}to{transform:translateX(-14px)}}
.spin{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinslow{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.35}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-22px);opacity:0}}
.sway{animation:sway 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.wave{animation:wave 1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0% 100%}@keyframes wave{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.scroll{animation:scroll 4s linear infinite}@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-60px)}}
.run{animation:run 4s linear infinite}@keyframes run{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.fall{animation:fall 2.4s linear infinite}@keyframes fall{from{transform:translateY(-6px);opacity:1}to{transform:translateY(16px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M16 0 H384 Q400 0 400 16 V100 H0 V16 Q0 0 16 0Z" fill="#DDEBF7"/><rect x="0" y="100" width="400" height="140" rx="0" fill="#8A8F98" /><rect x="10" y="30" width="90" height="80" rx="0" fill="#F3D9A4" stroke="#2B2F4A" stroke-width="2.5" /><path d="M6 30 H104 L98 52 H12Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="300" y="30" width="90" height="80" rx="0" fill="#F3D9A4" stroke="#2B2F4A" stroke-width="2.5" /><path d="M296 30 H394 L388 52 H302Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 170 H400" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="dash"/><g class="drift"><g transform="translate(120 150) scale(0.8 0.8)"><rect x="-85" y="-62" width="170" height="54" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><rect x="-85" y="-30" width="170" height="8" rx="0" fill="#3FA34D" /><path d="M-85 -30 H85 M-85 -22 H85" fill="none" stroke="#2B2F4A" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><rect x="-77" y="-55" width="22" height="18" rx="3" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.6" /><rect x="-50" y="-55" width="22" height="18" rx="3" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.6" /><rect x="-23" y="-55" width="22" height="18" rx="3" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.6" /><rect x="4" y="-55" width="22" height="18" rx="3" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.6" /><rect x="31" y="-55" width="22" height="18" rx="3" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.6" /><rect x="58" y="-55" width="22" height="18" rx="3" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.6" /><circle cx="82" cy="-14" r="4" fill="#FFD23F" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="-48" cy="-8" r="11" fill