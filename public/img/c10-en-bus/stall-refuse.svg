<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A conductor offering a cold drink at a stall while the girl shakes her head</title><style>.bob{animation:bob 1.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.drift{animation:drift 5s ease-in-out infinite alternate}@keyframes drift{from{transform:translateX(0)}to{transform:translateX(14px)}}
.driftl{animation:driftl 5s ease-in-out infinite alternate}@keyframes driftl{from{transform:translateX(0)}to{transform:translateX(-14px)}}
.spin{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinslow{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.35}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-22px);opacity:0}}
.sway{animation:sway 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.wave{animation:wave 1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0% 100%}@keyframes wave{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.scroll{animation:scroll 4s linear infinite}@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-60px)}}
.run{animation:run 4s linear infinite}@keyframes run{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.fall{animation:fall 2.4s linear infinite}@keyframes fall{from{transform:translateY(-6px);opacity:1}to{transform:translateY(16px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M16 0 H384 Q400 0 400 16 V170 H0 V16 Q0 0 16 0Z" fill="#DDEBF7"/><rect x="0" y="170" width="400" height="70" rx="0" fill="#8A8F98" /><rect x="280" y="92" width="104" height="78" rx="0" fill="#EAD7B5" stroke="#2B2F4A" stroke-width="2.5" /><path d="M272 70 H392 L384 96 H280Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M296 70 L294 96 M320 70 V96 M344 70 V96 M368 70 L370 96" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="280" y="140" width="104" height="30" rx="0" fill="#B5835A" stroke="#2B2F4A" stroke-width="2.5" /><rect x="296" y="116" width="12" height="24" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.8" /><rect x="324" y="116" width="12" height="24" rx="3" fill="#E5484D" stroke="#2B2F4A" stroke-width="1.8" /><rect x="352" y="116" width="12" height="24" rx="3" fill="#FFD23F" stroke="#2B2F4A" stroke-width="1.8" /><g transform="translate(238 214) scale(1.1 1.1)"><rect x="-8" y="-16" width="6" height="16" rx="2" fill="#4A4E69"/><rect x="2" y="-16" width="6" height="16" rx="2" fill="#4A4E69"/><ellipse cx="-5" cy="0" rx="6" ry="2.5" fill="#2B2F4A"/><ellipse cx="5" cy="0" rx="6" ry="2.5" fill="#2B2F4A"/><path d="M-9 -40 L-14 -26" stroke="#F2B48C" stroke-width="4.5" stroke-linecap="round"/><path d="M9 -40 L20 -44" stroke="#F2B48C" stroke-width="4.5" stroke-linecap="round"/><path d="M-11 -16 L-9 -42 Q0 -46 9 -42 L11 -16 Z" fill="#B8A55A" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><circle cx="0" cy="-54" r="11" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2"/><path d="M-12 -60 Q0 -76 12 -60 Z" fill="#6C7A89" stroke="#2B2F4A" stroke-width="2"/><path d="M-12 -60 H17" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/><circle cx="-4" cy="-55" r="1.7" fill="#2B2F4A"/><circle cx="4" cy="-55" r="1.7" fill="#2B2F4A"/><path d="M-4 -49 Q0 -45 4 -49" fill="none" stroke="#2B2F4A" stroke-width="1.8" stroke-linecap="round"/><rect x="18" y="-52" width="8" height="18" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.8" /></g><g class="wave"><g transform="translate(110 214) scale(1.1 1.1)"><rect x="-8" y="-16" width="6" height="16" rx="2" fill="#F2B48C"/><rect x="2" y="-16" width="6" height="16" rx="2" fill="#F2B48C"/><ellipse cx="-5" cy="0" rx="6" ry="2.5" fill="#2B2F4A"/><ellipse cx="5" cy="0" rx="6" ry="2.5" fill="#2B2F4A"/><path d="M-9 -40 L-16 -44" stroke="#F2B48C" stroke-width="4.5" stroke-linecap="round"/><path d="M9 -40 L14 -24" stroke="#F2B48C" stroke-width="4.5" stroke-linecap="round"/><path d="M-15 -13 L-8 -42 Q0 -46 8 -42 L15 -13 Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><circle cx="0" cy="-54" r="11" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2"/><path d="M-11 -54 Q-12 -68 0 -67 Q12 -68 11 -54 Q6 -61 0 -61 Q-6 -61 -11 -54Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1.5"/><path d="M-11 -54 Q-15 -46 -13 -38 M11 -54 Q15 -46 13 -38" stroke="#2B2F4A" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="-13" cy="-38" r="2.4" fill="#E5484D"/><circle cx="13" cy="-38" r="2.4" fill="#E5484D"/><circle cx="-4" cy="-55" r="1.7" fill="#2B2F4A"/><circle cx="4" cy="-55" r="1.7" fill="#2B2F4A"/><path d="M-7 -60 L-2 -58 M7 -60 L2 -58" stroke="#2B2F4A" stroke-width="1.8" stroke-linecap="round"/><path d="M-3 -47 H3" stroke="#2B2F4A" stroke-width="1.8" stroke-linecap="round"/></g></g><rect x="30" y="22" width="150" height="44" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><path d="M44 65 L38 78 L58 65" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="43" y="63" width="16" height="4" fill="#FFFFFF"/><text x="105.0" y="48.2" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >"No, no. Please, no."</text></svg>