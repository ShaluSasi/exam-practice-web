<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>An elderly woman asks long questions and a girl gives a very short reply</title><style>.bob{animation:bob 1.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.drift{animation:drift 5s ease-in-out infinite alternate}@keyframes drift{from{transform:translateX(0)}to{transform:translateX(14px)}}
.driftl{animation:driftl 5s ease-in-out infinite alternate}@keyframes driftl{from{transform:translateX(0)}to{transform:translateX(-14px)}}
.spin{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinslow{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.35}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-22px);opacity:0}}
.sway{animation:sway 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.wave{animation:wave 1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0% 100%}@keyframes wave{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.scroll{animation:scroll 4s linear infinite}@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-60px)}}
.run{animation:run 4s linear infinite}@keyframes run{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.fall{animation:fall 2.4s linear infinite}@keyframes fall{from{transform:translateY(-6px);opacity:1}to{transform:translateY(16px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M16 0 H384 Q400 0 400 16 V240 H0 V16 Q0 0 16 0Z" fill="#F6EBD0"/><g transform="translate(110 226) scale(1.4 1.4)"><rect x="-8" y="-16" width="6" height="16" rx="2" fill="#4A4E69"/><rect x="2" y="-16" width="6" height="16" rx="2" fill="#4A4E69"/><ellipse cx="-5" cy="0" rx="6" ry="2.5" fill="#2B2F4A"/><ellipse cx="5" cy="0" rx="6" ry="2.5" fill="#2B2F4A"/><path d="M-9 -40 L-14 -24" stroke="#C98E68" stroke-width="4.5" stroke-linecap="round"/><path d="M9 -40 L24 -40" stroke="#C98E68" stroke-width="4.5" stroke-linecap="round"/><path d="M-15 -13 L-8 -42 Q0 -46 8 -42 L15 -13 Z" fill="#9B59B6" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><circle cx="0" cy="-54" r="11" fill="#C98E68" stroke="#2B2F4A" stroke-width="2"/><path d="M-11 -54 Q-11 -68 0 -67 Q11 -68 11 -54 Q6 -61 0 -61 Q-6 -61 -11 -54Z" fill="#DDD" stroke="#2B2F4A" stroke-width="1.5"/><circle cx="0" cy="-70" r="5" fill="#DDD" stroke="#2B2F4A" stroke-width="1.5"/><circle cx="-11" cy="-49" r="3.4" fill="#FFD23F" stroke="#2B2F4A" stroke-width="1.5"/><circle cx="11" cy="-49" r="3.4" fill="#FFD23F" stroke="#2B2F4A" stroke-width="1.5"/><circle cx="-4" cy="-55" r="1.7" fill="#2B2F4A"/><circle cx="4" cy="-55" r="1.7" fill="#2B2F4A"/><ellipse cx="0" cy="-47" rx="3.5" ry="3" fill="#A33"/></g><rect x="20" y="16" width="210" height="52" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><path d="M34 67 L28 80 L48 67" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="33" y="65" width="16" height="4" fill="#FFFFFF"/><text x="125.0" y="38.7" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Are you all alone, dear?</text><text x="125.0" y="53.7" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Is it proper? Where are you going?</text><g transform="translate(300 226) scale(-1.4 1.4)"><rect x="-8" y="-16" width="6" height="16" rx="2" fill="#F2B48C"/><rect x="2" y="-16" width="6" height="16" rx="2" fill="#F2B48C"/><ellipse cx="-5" cy="0" rx="6" ry="2.5" fill="#2B2F4A"/><ellipse cx="5" cy="0" rx="6" ry="2.5" fill="#2B2F4A"/><path d="M-9 -40 L-14 -24" stroke="#F2B48C" stroke-width="4.5" stroke-linecap="round"/><path d="M9 -40 L14 -24" stroke="#F2B48C" stroke-width="4.5" stroke-linecap="round"/><path d="M-15 -13 L-8 -42 Q0 -46 8 -42 L15 -13 Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><circle cx="0" cy="-54" r="11" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2"/><path d="M-11 -54 Q-12 -68 0 -67 Q12 -68 11 -54 Q6 -61 0 -61 Q-6 -61 -11 -54Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1.5"/><path d="M-11 -54 Q-15 -46 -13 -38 M11 -54 Q15 -46 13 -38" stroke="#2B2F4A" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="-13" cy="-38" r="2.4" fill="#E5484D"/><circle cx="13" cy="-38" r="2.4" fill="#E5484D"/><circle cx="-4" cy="-55" r="1.7" fill="#2B2F4A"/><circle cx="4" cy="-55" r="1.7" fill="#2B2F4A"/><path d="M-3 -47 H3" stroke="#2B2F4A" stroke-width="1.8" stroke-linecap="round"/></g><rect x="290" y="84" width="70" height="30" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><path d="M304 113 L298 126 L318 113" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="303" y="111" width="16" height="4" fill="#FFFFFF"/><text x="325.0" y="103.9" font-family="sans-serif" font-size="14" font-weight="600" fill="#2B2F4A" text-anchor="middle" >"Yes."</text></svg>