M312.5 39.7 L311.5 38.0" stroke="#2B2F4A" stroke-width="1.2"/><path d="M330 70 L348.8 67.5" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M330 70 L300.4 70.0" fill="none" stroke="#2B2F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><circle cx="330" cy="70" r="1.8" fill="#2B2F4A" /><text x="330" y="140" font-family="sans-serif" font-size="16" font-weight="600" fill="#FF8A1F" text-anchor="middle" >2:45</text><text x="330" y="160" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Back home</text><path d="M112 70 H156 M244 70 H288" fill="none" stroke="#0B93D4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="dash"/><rect x="60" y="182" width="280" height="40" rx="10" fill="#FFF3C4" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="100" cy="202" r="12" fill="#FFD23F" stroke="#B8860B" stroke-width="2" /><text x="100" y="206.2" font-family="sans-serif" font-size="10.8" font-weight="700" fill="#8A6500" text-anchor="middle" >30</text><text x="122" y="208" font-family="sans-serif" font-size="16" font-weight="600" fill="#2B2F4A" text-anchor="middle" >+</text><circle cx="146" cy="202" r="12" fill="#FFD23F" stroke="#B8860B" stroke-width="2" /><text x="146" y="206.2" font-family="sans-serif" font-size="10.8" font-weight="700" fill="#8A6500" text-anchor="middle" >30</text><text x="250" y="208" font-family="sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="middle" >two single fares</text></svg>