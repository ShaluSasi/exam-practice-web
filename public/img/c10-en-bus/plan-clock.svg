<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Three clocks showing the planned bus times: leave the village at one, reach town at a quarter to two, back home at a quarter to three</title><style>.bob{animation:bob 1.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.drift{animation:drift 5s ease-in-out infinite alternate}@keyframes drift{from{transform:translateX(0)}to{transform:translateX(14px)}}
.driftl{animation:driftl 5s ease-in-out infinite alternate}@keyframes driftl{from{transform:translateX(0)}to{transform:translateX(-14px)}}
.spin{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinslow{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.35}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-22px);opacity:0}}
.sway{animation:sway 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.wave{animation:wave 1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0% 100%}@keyframes wave{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.scroll{animation:scroll 4s linear infinite}@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-60px)}}
.run{animation:run 4s linear infinite}@keyframes run{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.fall{animation:fall 2.4s linear infinite}@keyframes fall{from{transform:translateY(-6px);opacity:1}to{transform:translateY(16px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><circle cx="70" cy="70" r="38" fill="#FFF" stroke="#2B2F4A" stroke-width="2.5" /><path d="M70.0 35.0 L70.0 33.0" stroke="#2B2F4A" stroke-width="1.2"/><path d="M87.5 39.7 L88.5 38.0" stroke="#2B2F4A" stroke-width="1.2"/><path d="M100.3 52.5 L102.0 51.5" stroke="#2B2F4A" stroke-width="1.2"/><path d="M105.0 70.0 L107.0 70.0" stroke="#2B2F4A" stroke-width="1.2"/><path d="M100.3 87.5 L102.0 88.5" stroke="#2B2F4A" stroke-width="1.2"/><path d="M87.5 100.3 L88.5 102.0" stroke="#2B2F4A" stroke-width="1.2"/><path d="M70.0 105.0 L70.0 107.0" stroke="#2B2F4A" stroke-width="1.2"/><path d="M52.5 100.3 L51.5 102.0" stroke="#2B2F4A" stroke-width="1.2"/><path d="M39.7 87.5 L38.0 88.5" stroke="#2B2F4A" stroke-width="1.2"/><path d="M35.0 70.0 L33.0 70.0" stroke="#2B2F4A" stroke-width="1.2"/><path d="M39.7 52.5 L38.0 51.5" stroke="#2B2F4A" stroke-width="1.2"/><path d="M52.5 39.7 L51.5 38.0" stroke="#2B2F4A" stroke-width="1.2"/><path d="M70 70 L79.5 53.5" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M70 70 L70.0 40.4" fill="none" stroke="#2B2F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><circle cx="70" cy="70" r="1.8" fill="#2B2F4A" /><text x="70" y="140" font-family="sans-serif" font-size="16" font-weight="600" fill="#FF8A1F" text-anchor="middle" >1:00</text><text x="70" y="160" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Leave village</text><circle cx="200" cy="70" r="38" fill="#FFF" stroke="#2B2F4A" stroke-width="2.5" /><path d="M200.0 35.0 L200.0 33.0" stroke="#2B2F4A" stroke-width="1.2"/><path d="M217.5 39.7 L218.5 38.0" stroke="#2B2F4A" stroke-width="1.2"/><path d="M230.3 52.5 L232.0 51.5" stroke="#2B2F4A" stroke-width="1.2"/><path d="M235.0 70.0 L237.0 70.0" stroke="#2B2F4A" stroke-width="1.2"/><path d="M230.3 87