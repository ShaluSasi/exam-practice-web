<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A pirate climbing in through a window at night while a frightened girl cries for help</title><style>.bob{animation:bob 1.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.drift{animation:drift 5s ease-in-out infinite alternate}@keyframes drift{from{transform:translateX(0)}to{transform:translateX(14px)}}
.driftl{animation:driftl 5s ease-in-out infinite alternate}@keyframes driftl{from{transform:translateX(0)}to{transform:translateX(-14px)}}
.spin{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinslow{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.35}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-22px);opacity:0}}
.sway{animation:sway 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.wave{animation:wave 1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0% 100%}@keyframes wave{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.scroll{animation:scroll 4s linear infinite}@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-60px)}}
.run{animation:run 4s linear infinite}@keyframes run{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.fall{animation:fall 2.4s linear infinite}@keyframes fall{from{transform:translateY(-6px);opacity:1}to{transform:translateY(16px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M16 0 H384 Q400 0 400 16 V240 H0 V16 Q0 0 16 0Z" fill="#2B2F4A"/><rect x="110" y="24" width="180" height="130" rx="6" fill="#FFE9A8" stroke="#2B2F4A" stroke-width="3" /><path d="M200 24 V154 M110 89 H290" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><g class="bob"><g transform="translate(200 176) scale(1.6 1.6)"><rect x="-9" y="-18" width="8" height="18" rx="2" fill="#4A4E69" stroke="#2B2F4A" stroke-width="2" /><rect x="3" y="-18" width="6" height="18" rx="2" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2" /><circle cx="6" cy="0" r="3" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="1.5" /><path d="M-9 -40 L-26 -30" stroke="#F2B48C" stroke-width="5" stroke-linecap="round"/><path d="M9 -40 L26 -30" stroke="#F2B48C" stroke-width="5" stroke-linecap="round"/><path d="M-32 -34 H-22 V-28 H-27 V-24 H-32Z" fill="#555" stroke="#2B2F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><path d="M32 -34 H22 V-28 H27 V-24 H32Z" fill="#555" stroke="#2B2F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><path d="M-12 -16 L-10 -42 Q0 -46 10 -42 L12 -16Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="2"/><path d="M-11 -30 H11 M-11 -22 H11" stroke="#fff" stroke-width="3"/><circle cx="0" cy="-54" r="11" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2"/><path d="M-11 -50 Q0 -30 11 -50 Q0 -40 -11 -50Z" fill="#222" stroke="#2B2F4A" stroke-width="1.5"/><path d="M-14 -58 Q0 -80 14 -58Z" fill="#222" stroke="#2B2F4A" stroke-width="2"/><path d="M-16 -58 H16" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><circle cx="-4" cy="-55" r="1.6" fill="#2B2F4A"/><circle cx="4" cy="-55" r="1.6" fill="#2B2F4A"/><path d="M-12 -47 H20 Q26 -47 28 -56" fill="none" stroke="#B0B7C3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M-10 -44 h20" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g></g><rect x="10" y="184" width="380" height="46" rx="6" fill="#C9A27A" stroke="#2B2F4A" stroke-width="2.5" /><g transform="translate(60 222) scale(1.0 1.0)"><rect x="-8" y="-16" width="6" height="16" rx="2" fill="#F2B48C"/><rect x="2" y="-16" width="6" height="16" rx="2" fill="#F2B48C"/><ellipse cx="-5" cy="0" rx="6" ry="2.5" fill="#2B2F4A"/><ellipse cx="5" cy="0" rx="6" ry="2.5" fill="#2B2F4A"/><path d="M-9 -40 L-20 -56" stroke="#F2B48C" stroke-width="4.5" stroke-linecap="round"/><path d="M9 -40 L20 -56" stroke="#F2B48C" stroke-width="4.5" stroke-linecap="round"/><path d="M-15 -13 L-8 -42 Q0 -46 8 -42 L15 -13 Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><circle cx="0" cy="-54" r="11" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2"/><path d="M-11 -54 Q-12 -68 0 -67 Q12 -68 11 -54 Q6 -61 0 -61 Q-6 -61 -11 -54Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1.5"/><circle cx="-4" cy="-55" r="1.7" fill="#2B2F4A"/><circle cx="4" cy="-55" r="1.7" fill="#2B2F4A"/><ellipse cx="0" cy="-46" rx="4" ry="4.5" fill="#A33"/></g><g transform="translate(335 226) scale(-1.2 1.2)"><path d="M-18 -18 Q-28 -26 -22 -32" fill="none" stroke="#E0A400" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="0" cy="-16" rx="18" ry="11" fill="#F2C230" stroke="#2B2F4A" stroke-width="2"/><rect x="-12" y="-8" width="5" height="8" rx="2" fill="#E0A400" stroke="#2B2F4A" stroke-width="1.5" /><rect x="-4" y="-8" width="5" height="8" rx="2" fill="#E0A400" stroke="#2B2F4A" stroke-width="1.5" /><rect x="6" y="-8" width="5" height="8" rx="2" fill="#E0A400" stroke="#2B2F4A" stroke-width="1.5" /><rect x="12" y="-8" width="5" height="8" rx="2" fill="#E0A400" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="18" cy="-26" r="10" fill="#F2C230" stroke="#2B2F4A" stroke-width="2"/><ellipse cx="12" cy="-27" rx="4" ry="8" fill="#B8860B" stroke="#2B2F4A" stroke-width="1.5"/><circle cx="21" cy="-28" r="1.6" fill="#2B2F4A"/><circle cx="27" cy="-25" r="2.4" fill="#2B2F4A"/></g><g class="blink"><text x="60" y="120" font-family="sans-serif" font-size="20" font-weight="600" fill="#fff" text-anchor="middle" >Help!</text></g></svg>