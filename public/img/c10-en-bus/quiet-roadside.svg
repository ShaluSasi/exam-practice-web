<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A quiet roadside with one white flower, its head bowed, as a bus goes slowly by</title><style>.bob{animation:bob 1.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.drift{animation:drift 5s ease-in-out infinite alternate}@keyframes drift{from{transform:translateX(0)}to{transform:translateX(14px)}}
.driftl{animation:driftl 5s ease-in-out infinite alternate}@keyframes driftl{from{transform:translateX(0)}to{transform:translateX(-14px)}}
.spin{animation:spin 1.2s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spinslow{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.12)}}
.blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.35}}
.rise{animation:rise 3s ease-in infinite}@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-22px);opacity:0}}
.sway{animation:sway 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.wave{animation:wave 1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0% 100%}@keyframes wave{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.scroll{animation:scroll 4s linear infinite}@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-60px)}}
.run{animation:run 4s linear infinite}@keyframes run{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
.dash{stroke-dasharray:8 8;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-16}}
.fall{animation:fall 2.4s linear infinite}@keyframes fall{from{transform:translateY(-6px);opacity:1}to{transform:translateY(16px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M16 0 H384 Q400 0 400 16 V150 H0 V16 Q0 0 16 0Z" fill="#E4E1F2"/><path d="M0 150 H400 V224 Q400 240 384 240 H16 Q0 240 0 224 Z" fill="#B9D8A8"/><rect x="0" y="170" width="400" height="36" rx="0" fill="#9A9EA8" /><g transform="translate(90 40) scale(1.1 1.1)"><g class="drift"><ellipse cx="0" cy="0" rx="22" ry="9" fill="#FFF"/><circle cx="-8" cy="-6" r="9" fill="#FFF"/><circle cx="8" cy="-8" r="11" fill="#FFF"/></g></g><g transform="translate(300 56) scale(0.9 0.9)"><g class="driftl"><ellipse cx="0" cy="0" rx="22" ry="9" fill="#FFF"/><circle cx="-8" cy="-6" r="9" fill="#FFF"/><circle cx="8" cy="-8" r="11" fill="#FFF"/></g></g><path d="M0 170 H400" fill="none" stroke="#7F8490" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><g class="sway"><path d="M200 232 Q196 200 214 182" fill="none" stroke="#3FA34D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M206 214 q-14 -6 -22 4 M205 208 q14 -8 24 0" fill="none" stroke="#3FA34D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></g><g class="sway"><circle cx="216" cy="178" r="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="216" cy="178" r="4" fill="#FFD23F" stroke="#2B2F4A" stroke-width="1.5" /></g><g class="drift"><g transform="translate(70 200) scale(0.5 0.5)"><rect x="-85" y="-62" width="170" height="54" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><rect x="-85" y="-30" width="170" height="8" rx="0" fill="#3FA34D" /><path d="M-85 -30 H85 M-85 -22 H85" fill="none" stroke="#2B2F4A" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><rect x="-77" y="-55" width="22" height="18" rx="3" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.6" /><rect x="-50" y="-55" width="22" height="18" rx="3" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.6" /><rect x="-23" y="-55" width="22" height="18" rx="3" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.6" /><rect x="4" y="-55" width="22" height="18" rx="3" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.6" /><rect x="31" y="-55" width="22" height="18" rx="3" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.6" /><rect x="58" y="-55" width="22" height="18" rx="3" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.6" /><circle cx="82" cy="-14" r="4" fill="#FFD23F" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="-48" cy="-8" r="11" fill="#333" stroke="#2B2F4A" stroke-width="2" /><g class="spin"><circle cx="-48" cy="-8" r="5" fill="#DDD"/><path d="M-53 -8 H-43 M-48 -13 V-3" stroke="#777" stroke-width="1.5"/></g><circle cx="50" cy="-8" r="11" fill="#333" stroke="#2B2F4A" stroke-width="2" /><g class="spin"><circle cx="50" cy="-8" r="5" fill="#DDD"/><path d="M45 -8 H55 M50 -13 V-3" stroke="#777" stroke-width="1.5"/></g></g></g><g class="bob"><path d="M330 70 q8 -8 16 0 q8 -8 16 0" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/></g></svg>