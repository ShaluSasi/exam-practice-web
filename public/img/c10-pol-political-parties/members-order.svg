<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Bars of party membership for India, Canada, Japan, South Korea and Spain</title><style>.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.1)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.blink{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
.rock{animation:rock 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fade{animation:fade 3s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
.slide{animation:slide 3s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.slidel{animation:slidel 3s ease-in-out infinite alternate}@keyframes slidel{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
.down{animation:down 2.4s ease-in infinite}@keyframes down{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.up{animation:up 2.4s ease-in infinite}@keyframes up{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-10px);opacity:0}}
.grow{animation:grow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="20" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Party membership (per cent)</text><path d="M34 196 H360" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="52.16" y="63.0" width="39.68" height="133.0" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.2" class="grow d0"/><text x="72.0" y="58.0" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >11.4</text><text x="72.0" y="211" font-family="sans-serif" font-size="10" font-weight="600" fill="#2B2F4A" text-anchor="middle" >India</text><rect x="116.16" y="124.83333333333334" width="39.68" height="71.16666666666666" rx="3" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.2" class="grow d1"/><text x="136.0" y="119.83333333333334" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >6.1</text><text x="136.0" y="211" font-family="sans-serif" font-size="10" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Canada</text><rect x="180.16" y="156.33333333333334" width="39.68" height="39.666666666666664" rx="3" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.2" class="grow d2"/><text x="200.0" y="151.33333333333334" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >3.4</text><text x="200.0" y="211" font-family="sans-serif" font-size="10" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Japan</text><rect x="244.16" y="165.66666666666666" width="39.68" height="30.333333333333336" rx="3" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.2" class="grow d3"/><text x="264.0" y="160.66666666666666" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >2.6</text><text x="264.0" y="211" font-family="sans-serif" font-size="10" font-weight="600" fill="#2B2F4A" text-anchor="middle" >S Korea</text><rect x="308.16" y="180.83333333333334" width="39.68" height="15.166666666666668" rx="3" fill="#C9CED6" stroke="#2B2F4A" stroke-width="2.2" class="grow d4"/><text x="328.0" y="175.83333333333334" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >1.3</text><text x="328.0" y="211" font-family="sans-serif" font-size="10" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Spain</text></svg>