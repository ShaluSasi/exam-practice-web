<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A government building with an arrow to a box describing help in kind or in cash for a party</title><style>.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.1)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.blink{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
.rock{animation:rock 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fade{animation:fade 3s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
.slide{animation:slide 3s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.slidel{animation:slidel 3s ease-in-out infinite alternate}@keyframes slidel{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
.down{animation:down 2.4s ease-in infinite}@keyframes down{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.up{animation:up 2.4s ease-in infinite}@keyframes up{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-10px);opacity:0}}
.grow{animation:grow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="240" rx="0" fill="#FFF9EE" /><g transform="translate(70 150) scale(1.8)"><rect x="-30" y="-26" width="60" height="26" rx="0" fill="#F3D9A4" stroke="#2B2F4A" stroke-width="2.5" /><rect x="-34" y="-30" width="68" height="6" rx="0" fill="#E9C987" stroke="#2B2F4A" stroke-width="2.5" /><rect x="-23" y="-26" width="6" height="26" rx="0" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="1.8" /><rect x="-11" y="-26" width="6" height="26" rx="0" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="1.8" /><rect x="5" y="-26" width="6" height="26" rx="0" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="1.8" /><rect x="17" y="-26" width="6" height="26" rx="0" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="1.8" /><path d="M-16 -30 Q0 -62 16 -30Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 -58 V-70" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 -70 l10 3 l-10 3z" fill="#E5484D" stroke="#2B2F4A" stroke-width="1.5"/></g><path d="M120 110 L214.6 110.0" fill="none" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="dash"/><polygon points="220.0,110.0 212.1,114.3 212.1,105.7" fill="#0B93D4"/><rect x="230" y="70" width="140" height="110" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><text x="300" y="92" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Help in kind</text><text x="300" y="112" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >or in cash</text><g transform="translate(300 170) scale(0.7)"><circle cx="0" cy="-22" r="20" fill="#FFD23F" stroke="#2B2F4A" stroke-width="3" /><circle cx="0" cy="-22" r="13" fill="none" stroke="#C99A00" stroke-width="2" /><text x="0" y="-15" font-family="sans-serif" font-size="20" font-weight="800" fill="#2B2F4A" text-anchor="middle" >₹</text></g><g transform="translate(340 150) scale(1)"><circle cx="0" cy="0" r="11" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.2" /></g><text x="200" y="216" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Government gives parties money for election costs</text></svg>