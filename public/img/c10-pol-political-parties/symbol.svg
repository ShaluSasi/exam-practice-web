<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>An invented ballot paper listing four candidates each with a different generic shape</title><style>.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.1)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.blink{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
.rock{animation:rock 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fade{animation:fade 3s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
.slide{animation:slide 3s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.slidel{animation:slidel 3s ease-in-out infinite alternate}@keyframes slidel{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
.down{animation:down 2.4s ease-in infinite}@keyframes down{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.up{animation:up 2.4s ease-in infinite}@keyframes up{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-10px);opacity:0}}
.grow{animation:grow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="240" rx="0" fill="#FFF9EE" /><rect x="100" y="16" width="200" height="208" rx="6" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><text x="200" y="38" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Ballot paper (invented)</text><rect x="112" y="48" width="176" height="34" rx="3" fill="#FFF9EE" stroke="#C9CED6" stroke-width="2" /><text x="124" y="68" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="start" >Candidate 1</text><g transform="translate(262 65) scale(0.9)"><circle cx="0" cy="0" r="11" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.2" /></g><rect x="112" y="88" width="176" height="34" rx="3" fill="#FFF9EE" stroke="#C9CED6" stroke-width="2" /><text x="124" y="108" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="start" >Candidate 2</text><g transform="translate(262 105) scale(0.9)"><path d="M0 -12 L12 10 H-12Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="112" y="128" width="176" height="34" rx="3" fill="#FFF9EE" stroke="#C9CED6" stroke-width="2" /><text x="124" y="148" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="start" >Candidate 3</text><g transform="translate(262 145) scale(0.9)"><rect x="-10" y="-10" width="20" height="20" rx="2" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.2" /></g><rect x="112" y="168" width="176" height="34" rx="3" fill="#FFF9EE" stroke="#C9CED6" stroke-width="2" /><text x="124" y="188" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="start" >Candidate 4</text><g transform="translate(262 185) scale(0.9)"><path d="M0 -13 L11 0 L0 13 L-11 0Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(340 150) scale(1.2)"><circle cx="0" cy="-34" r="8" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2.2" /><path d="M-11 0 Q-11 -22 0 -22 Q11 -22 11 0Z" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g></svg>