<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A crowd holding petitions and a megaphone towards a party office</title><style>.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.1)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.blink{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
.rock{animation:rock 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fade{animation:fade 3s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
.slide{animation:slide 3s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.slidel{animation:slidel 3s ease-in-out infinite alternate}@keyframes slidel{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
.down{animation:down 2.4s ease-in infinite}@keyframes down{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.up{animation:up 2.4s ease-in infinite}@keyframes up{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-10px);opacity:0}}
.grow{animation:grow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="240" rx="0" fill="#EAF5FF" /><g transform="translate(30 210) scale(1.1)"><circle cx="0" cy="-34" r="8" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2.2" /><path d="M-11 0 Q-11 -22 0 -22 Q11 -22 11 0Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(52 210) scale(1.1)" class="bob d2"><circle cx="0" cy="-34" r="8" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2.2" /><path d="M-11 0 Q-11 -22 0 -22 Q11 -22 11 0Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(74 210) scale(1.1)"><circle cx="0" cy="-34" r="8" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2.2" /><path d="M-11 0 Q-11 -22 0 -22 Q11 -22 11 0Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(96 210) scale(1.1)" class="bob d4"><circle cx="0" cy="-34" r="8" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2.2" /><path d="M-11 0 Q-11 -22 0 -22 Q11 -22 11 0Z" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(118 210) scale(1.1)"><circle cx="0" cy="-34" r="8" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2.2" /><path d="M-11 0 Q-11 -22 0 -22 Q11 -22 11 0Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(140 210) scale(1.1)" class="bob d2"><circle cx="0" cy="-34" r="8" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2.2" /><path d="M-11 0 Q-11 -22 0 -22 Q11 -22 11 0Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(162 210) scale(1.1)"><circle cx="0" cy="-34" r="8" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2.2" /><path d="M-11 0 Q-11 -22 0 -22 Q11 -22 11 0Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(184 210) scale(1.1)" class="bob d4"><circle cx="0" cy="-34" r="8" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2.2" /><path d="M-11 0 Q-11 -22 0 -22 Q11 -22 11 0Z" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="70" y="60" width="40" height="50" rx="3" fill="#fff" stroke="#2B2F4A" stroke-width="2.2" /><path d="M78 72 H102" fill="none" stroke="#C9CED6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M78 81 H102" fill="none" stroke="#C9CED6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M90 110 V150" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="130" y="60" width="40" height="50" rx="3" fill="#fff" stroke="#2B2F4A" stroke-width="2.2" /><path d="M138 72 H162" fill="none" stroke="#C9CED6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M138 81 H162" fill="none" stroke="#C9CED6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M150 110 V150" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="190" y="60" width="40" height="50" rx="3" fill="#fff" stroke="#2B2F4A" stroke-width="2.2" /><path d="M198 72 H222" fill="none" stroke="#C9CED6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M198 81 H222" fill="none" stroke="#C9CED6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M210 110 V150" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(300 90) scale(1.8)"><path d="M-14 -8 L10 -20 V8 L-14 0Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="-22" y="-9" width="8" height="10" rx="2" fill="#C9CED6" stroke="#2B2F4A" stroke-width="2" /><path d="M14 -12 q8 8 0 22" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="blink"/></g><g transform="translate(350 170) scale(1.0)"><rect x="-30" y="-30" width="60" height="30" rx="0" fill="#D9E7F7" stroke="#2B2F4A" stroke-width="2.5" /><path d="M-34 -30 H34 L26 -42 H-26Z" fill="#8FB0DC" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="-21" y="-24" width="6" height="14" rx="0" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.8" /><rect x="-9" y="-24" width="6" height="14" rx="0" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.8" /><rect x="3" y="-24" width="6" height="14" rx="0" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.8" /><rect x="15" y="-24" width="6" height="14" rx="0" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.8" /><rect x="-6" y="-14" width="12" height="14" rx="1" fill="#6B4A3A" stroke="#2B2F4A" stroke-width="2" /></g><path d="M290 120 L325.2 137.6" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="dash"/><polygon points="330.0,140.0 321.0,140.3 324.9,132.6" fill="#E5484D"/></svg>