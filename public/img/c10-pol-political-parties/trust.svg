<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Donut chart: 37 per cent great or some trust, 43 per cent not much or none, 20 per cent do not know</title><style>.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.1)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.blink{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
.rock{animation:rock 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fade{animation:fade 3s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
.slide{animation:slide 3s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.slidel{animation:slidel 3s ease-in-out infinite alternate}@keyframes slidel{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
.down{animation:down 2.4s ease-in infinite}@keyframes down{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.up{animation:up 2.4s ease-in infinite}@keyframes up{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-10px);opacity:0}}
.grow{animation:grow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M110 120 L110.0 34.0 A86 86 0 0 1 172.7 178.9Z" fill="#B5313A" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M110 120 L172.7 178.9 A86 86 0 0 1 28.2 93.4Z" fill="#F08A6E" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M110 120 L28.2 93.4 A86 86 0 0 1 110.0 34.0Z" fill="#BFE0F5" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="110" cy="120" r="34" fill="#FFF9EE" stroke="#2B2F4A" stroke-width="2.5" /><text x="157.72324053556702" y="103.34830968699141" font-family="sans-serif" font-size="13" font-weight="600" fill="#fff" text-anchor="middle" >37%</text><text x="83.5298463809807" y="168.75858540420506" font-family="sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="middle" >43%</text><text x="79.4351668807914" y="81.93111629250274" font-family="sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="middle" >20%</text><rect x="228" y="70" width="16" height="16" rx="3" fill="#B5313A" stroke="#2B2F4A" stroke-width="2" /><text x="252" y="83" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="start" >Great or some trust</text><rect x="228" y="106" width="16" height="16" rx="3" fill="#F08A6E" stroke="#2B2F4A" stroke-width="2" /><text x="252" y="119" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="start" >Not much or none</text><rect x="228" y="142" width="16" height="16" rx="3" fill="#BFE0F5" stroke="#2B2F4A" stroke-width="2" /><text x="252" y="155" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="start" >Don't know</text><text x="200" y="226" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Trust in political parties, South Asia</text></svg>