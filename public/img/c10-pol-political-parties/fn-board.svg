<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Six cards: a ballot box, a funnel collecting opinions, a legislature, a minister with a building, two benches with a megaphone and a crowd hearing a speaker</title><style>.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.1)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.blink{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
.rock{animation:rock 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fade{animation:fade 3s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
.slide{animation:slide 3s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.slidel{animation:slidel 3s ease-in-out infinite alternate}@keyframes slidel{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
.down{animation:down 2.4s ease-in infinite}@keyframes down{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.up{animation:up 2.4s ease-in infinite}@keyframes up{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-10px);opacity:0}}
.grow{animation:grow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="14" y="14" width="112" height="100" rx="12" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><g transform="translate(70 96) scale(1.5)"><rect x="-22" y="-30" width="44" height="30" rx="3" fill="#4DA6E8" stroke="#2B2F4A" stroke-width="3" /><rect x="-10" y="-33" width="20" height="5" rx="2" fill="#2B2F4A" /><path d="M-6 -52 H6 V-36 H-6Z" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="down"/></g><g transform="translate(38 104) scale(0.7)"><circle cx="0" cy="-34" r="8" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2.2" /><path d="M-11 0 Q-11 -22 0 -22 Q11 -22 11 0Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="144" y="14" width="112" height="100" rx="12" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><path d="M164 34 H236 L208 72 V92 H192 V72Z" fill="#FFE6C7" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="178" cy="28" r="4" fill="#0B93D4" /><circle cx="200" cy="24" r="4" fill="#3FA34D" /><circle cx="222" cy="28" r="4" fill="#7C5CFF" /><rect x="274" y="14" width="112" height="100" rx="12" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><g transform="translate(330 98) scale(1.4)"><rect x="-30" y="-26" width="60" height="26" rx="0" fill="#F3D9A4" stroke="#2B2F4A" stroke-width="2.5" /><rect x="-34" y="-30" width="68" height="6" rx="0" fill="#E9C987" stroke="#2B2F4A" stroke-width="2.5" /><rect x="-23" y="-26" width="6" height="26" rx="0" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="1.8" /><rect x="-11" y="-26" width="6" height="26" rx="0" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="1.8" /><rect x="5" y="-26" width="6" height="26" rx="0" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="1.8" /><rect x="17" y="-26" width="6" height="26" rx="0" fill="#FFF3D