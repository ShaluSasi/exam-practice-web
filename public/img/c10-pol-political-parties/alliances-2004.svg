<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Three boxes each holding three small circles joined into one larger circle</title><style>.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.1)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.blink{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
.rock{animation:rock 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fade{animation:fade 3s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
.slide{animation:slide 3s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.slidel{animation:slidel 3s ease-in-out infinite alternate}@keyframes slidel{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
.down{animation:down 2.4s ease-in infinite}@keyframes down{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.up{animation:up 2.4s ease-in infinite}@keyframes up{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-10px);opacity:0}}
.grow{animation:grow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="20" y="30" width="112" height="160" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><text x="76" y="54" font-family="sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Alliance 1</text><circle cx="50" cy="100" r="10" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" /><circle cx="76" cy="100" r="10" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" /><circle cx="102" cy="100" r="10" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" /><circle cx="76" cy="150" r="18" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" class="pulse"/><rect x="146" y="30" width="112" height="160" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><text x="202" y="54" font-family="sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Alliance 2</text><circle cx="176" cy="100" r="10" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" /><circle cx="202" cy="100" r="10" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" /><circle cx="228" cy="100" r="10" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" /><circle cx="202" cy="150" r="18" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" class="pulse"/><rect x="272" y="30" width="112" height="160" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><text x="328" y="54" font-family="sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Alliance 3</text><circle cx="302" cy="100" r="10" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" /><circle cx="328" cy="100" r="10" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" /><circle cx="354" cy="100" r="10" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" /><circle cx="328" cy="150" r="18" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" class="pulse"/><text x="200" y="216" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Three alliances (invented labels)</text></svg>