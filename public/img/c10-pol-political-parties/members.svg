<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Bar chart of party membership: Bangladesh 23.5, India 11.4, Sweden 10.3, Canada 6.1, Japan 3.4, Spain 1.3, with global average 9.1</title><style>.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.1)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.blink{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
.rock{animation:rock 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fade{animation:fade 3s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
.slide{animation:slide 3s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.slidel{animation:slidel 3s ease-in-out infinite alternate}@keyframes slidel{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
.down{animation:down 2.4s ease-in infinite}@keyframes down{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.up{animation:up 2.4s ease-in infinite}@keyframes up{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-10px);opacity:0}}
.grow{animation:grow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="20" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Say they are party members (per cent)</text><path d="M34 196 H360" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="50.13333333333333" y="60.423076923076934" width="33.06666666666667" height="135.57692307692307" rx="3" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.2" class="grow d0"/><text x="66.66666666666667" y="55.423076923076934" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >23.5</text><text x="66.66666666666667" y="211" font-family="sans-serif" font-size="10" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Bangladesh</text><rect x="103.46666666666667" y="130.23076923076923" width="33.06666666666667" height="65.76923076923077" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.2" class="grow d1"/><text x="120.0" y="125.23076923076923" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >11.4</text><text x="120.0" y="211" font-family="sans-serif" font-size="10" font-weight="600" fill="#2B2F4A" text-anchor="middle" >India</text><rect x="156.8" y="136.57692307692307" width="33.06666666666667" height="59.42307692307693" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.2" class="grow d2"/><text x="173.33333333333334" y="131.57692307692307" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >10.3</text><text x="173.33333333333334" y="211" font-family="sans-serif" font-size="10" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Sweden</text><rect x="210.13333333333333" y="160.80769230769232" width="33.06666666666667" height="35.19230769230769" rx="3" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.2" class="grow d3"/><text x="226.66666666666666" y="155.80769230769232" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >6.1</text><text x="226.66666666666666" y="211" font-family="sans-serif" font-size="10" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Canada</text><rect x="263.4666666666667" y="176.3846153846154" width="33.06666666666667" height="19.615384615384617" rx="3" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.2" class="grow d4"/><text x="280.00000000000006" y="171.3846153846154" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >3.4</text><text x="280.00000000000006" y="211" font-family="sans-serif" font-size="10" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Japan</text><rect x="316.8" y="188.5" width="33.06666666666667" height="7.5" rx="3" fill="#C9CED6" stroke="#2B2F4A" stroke-width="2.2" class="grow d0"/><text x="333.33333333333337" y="183.5" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >1.3</text><text x="333.33333333333337" y="211" font-family="sans-serif" font-size="10" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Spain</text><path d="M34 143.5 H372" fill="none" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="dash"/><text x="372" y="125.5" font-family="sans-serif" font-size="10" font-weight="600" fill="#E5484D" text-anchor="end" >Global average 9.1</text></svg>