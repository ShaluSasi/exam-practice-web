<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Three cards each with a different invented shape and a tick</title><style>.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.1)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.blink{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
.rock{animation:rock 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fade{animation:fade 3s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
.slide{animation:slide 3s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.slidel{animation:slidel 3s ease-in-out infinite alternate}@keyframes slidel{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
.down{animation:down 2.4s ease-in infinite}@keyframes down{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.up{animation:up 2.4s ease-in infinite}@keyframes up{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-10px);opacity:0}}
.grow{animation:grow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="240" rx="0" fill="#FFF9EE" /><rect x="66" y="50" width="68" height="90" rx="8" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><g transform="translate(100 95) scale(1.6)"><circle cx="0" cy="0" r="11" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.2" /></g><g transform="translate(122 60) scale(0.7)" class="pulse"><circle cx="0" cy="0" r="11" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" /><path d="M-5 0 L-1 5 L6 -5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="166" y="50" width="68" height="90" rx="8" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><g transform="translate(200 95) scale(1.6)"><path d="M0 -12 L12 10 H-12Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(222 60) scale(0.7)" class="pulse"><circle cx="0" cy="0" r="11" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" /><path d="M-5 0 L-1 5 L6 -5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="266" y="50" width="68" height="90" rx="8" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><g transform="translate(300 95) scale(1.6)"><rect x="-10" y="-10" width="20" height="20" rx="2" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.2" /></g><g transform="translate(322 60) scale(0.7)" class="pulse"><circle cx="0" cy="0" r="11" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" /><path d="M-5 0 L-1 5 L6 -5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="200" y="176" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Recognised parties get a unique symbol</text><text x="200" y="200" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >(invented shapes)</text></svg>