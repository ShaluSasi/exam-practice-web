<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Three panels: a ballot box, a government building and a legislature</title><style>.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.1)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.blink{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
.rock{animation:rock 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fade{animation:fade 3s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
.slide{animation:slide 3s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.slidel{animation:slidel 3s ease-in-out infinite alternate}@keyframes slidel{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
.down{animation:down 2.4s ease-in infinite}@keyframes down{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.up{animation:up 2.4s ease-in infinite}@keyframes up{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-10px);opacity:0}}
.grow{animation:grow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="240" rx="0" fill="#EAF5FF" /><rect x="20" y="40" width="112" height="130" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><g transform="translate(76 150) scale(1.5)"><rect x="-22" y="-30" width="44" height="30" rx="3" fill="#4DA6E8" stroke="#2B2F4A" stroke-width="3" /><rect x="-10" y="-33" width="20" height="5" rx="2" fill="#2B2F4A" /><path d="M-6 -52 H6 V-36 H-6Z" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="down"/></g><rect x="148" y="40" width="112" height="130" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><g transform="translate(204 150) scale(1.5)"><rect x="-30" y="-30" width="60" height="30" rx="0" fill="#D9E7F7" stroke="#2B2F4A" stroke-width="2.5" /><path d="M-34 -30 H34 L26 -42 H-26Z" fill="#8FB0DC" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="-21" y="-24" width="6" height="14" rx="0" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.8" /><rect x="-9" y="-24" width="6" height="14" rx="0" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.8" /><rect x="3" y="-24" width="6" height="14" rx="0" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.8" /><rect x="15" y="-24" width="6" height="14" rx="0" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.8" /><rect x="-6" y="-14" width="12" height="14" rx="1" fill="#6B4A3A" stroke="#2B2F4A" stroke-width="2" /></g><rect x="276" y="40" width="112" height="130" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><g transform="translate(332 150) scale(1.5)"><rect x="-30" y="-26" width="60" height="26" rx="0" fill="#F3D9A4" stroke="#2B2F4A" stroke-width="2.5" /><rect x="-34" y="-30" width="68" height="6" rx="0" fill="#E9C987" stroke="#2B2F4A" stroke-width="2.5" /><rect x="-23" y="-26" width="6" height="26" rx="0" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="1.8" /><rect x="-11" y="-26" width="6" height="26" rx="0" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="1.8" /><rect x="5" y="-26" width="6" height="26" rx="0" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="1.8" /><rect x="17" y="-26" width="6" height="26" rx="0" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="1.8" /><path d="M-16 -30 Q0 -62 16 -30Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 -58 V-70" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 -70 l10 3 l-10 3z" fill="#E5484D" stroke="#2B2F4A" stroke-width="1.5"/></g><path d="M134 105 L141.8 105.0" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><polygon points="146.0,105.0 139.9,108.4 139.9,101.6" fill="#2B2F4A"/><path d="M262 105 L269.8 105.0" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><polygon points="274.0,105.0 267.9,108.4 267.9,101.6" fill="#2B2F4A"/><text x="200" y="206" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Contest, win and govern, lose and oppose</text></svg>