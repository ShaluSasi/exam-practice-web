<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Bar chart of votes per cent and seats won by five invented parties with a dashed line at 6 per cent</title><style>.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.1)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.blink{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
.rock{animation:rock 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fade{animation:fade 3s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
.slide{animation:slide 3s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.slidel{animation:slidel 3s ease-in-out infinite alternate}@keyframes slidel{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
.down{animation:down 2.4s ease-in infinite}@keyframes down{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.up{animation:up 2.4s ease-in infinite}@keyframes up{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-10px);opacity:0}}
.grow{animation:grow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M34 190 H360" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="52.16" y="88.0" width="39.68" height="102.0" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.2" class="grow d0"/><text x="72.0" y="83.0" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >34%</text><text x="72.0" y="205" font-family="sans-serif" font-size="10" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Party A</text><rect x="116.16" y="172.0" width="39.68" height="18.0" rx="3" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.2" class="grow d1"/><text x="136.0" y="167.0" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >6%</text><text x="136.0" y="205" font-family="sans-serif" font-size="10" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Party B</text><rect x="180.16" y="169.0" width="39.68" height="21.0" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.2" class="grow d2"/><text x="200.0" y="164.0" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >7%</text><text x="200.0" y="205" font-family="sans-serif" font-size="10" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Party C</text><rect x="244.16" y="175.0" width="39.68" height="15.0" rx="3" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.2" class="grow d3"/><text x="264.0" y="170.0" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >5%</text><text x="264.0" y="205" font-family="sans-serif" font-size="10" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Party D</text><rect x="308.16" y="184.0" width="39.68" height="6.0" rx="3" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.2" class="grow d4"/><text x="328.0" y="179.0" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >2%</text><text x="328.0" y="205" font-family="sans-serif" font-size="10" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Party E</text><path d="M34 172.0 H370" fill="none" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="dash"/><text x="372" y="168.0" font-family="sans-serif" font-size="11" font-weight="600" fill="#E5484D" text-anchor="end" >6%</text><text x="72.0" y="224" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >60 seats</text><text x="136.0" y="224" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >2 seats</text><text x="200.0" y="224" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >1 seat</text><text x="264.0" y="224" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >3 seats</text><text x="328.0" y="224" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >0 seats</text><text x="200" y="16" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >State Assembly election (invented parties)</text></svg>