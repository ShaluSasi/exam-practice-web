<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Bar chart of per cent who feel close to a party: 38, 31, 38, 53, 48 for 1971, 1996, 1999, 2004, 2005</title><style>.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.1)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.blink{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
.rock{animation:rock 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fade{animation:fade 3s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
.slide{animation:slide 3s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.slidel{animation:slidel 3s ease-in-out infinite alternate}@keyframes slidel{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
.down{animation:down 2.4s ease-in infinite}@keyframes down{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.up{animation:up 2.4s ease-in infinite}@keyframes up{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-10px);opacity:0}}
.grow{animation:grow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="22" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Those who feel close to a party (per cent)</text><path d="M34 196 H360" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="52.16" y="101.0" width="39.68" height="95.0" rx="3" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2.2" class="grow d0"/><text x="72.0" y="96.0" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >38</text><text x="72.0" y="211" font-family="sans-serif" font-size="10" font-weight="600" fill="#2B2F4A" text-anchor="middle" >1971</text><rect x="116.16" y="118.49999999999999" width="39.68" height="77.50000000000001" rx="3" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2.2" class="grow d1"/><text x="136.0" y="113.49999999999999" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >31</text><text x="136.0" y="211" font-family="sans-serif" font-size="10" font-weight="600" fill="#2B2F4A" text-anchor="middle" >1996</text><rect x="180.16" y="101.0" width="39.68" height="95.0" rx="3" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2.2" class="grow d2"/><text x="200.0" y="96.0" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >38</text><text x="200.0" y="211" font-family="sans-serif" font-size="10" font-weight="600" fill="#2B2F4A" text-anchor="middle" >1999</text><rect x="244.16" y="63.5" width="39.68" height="132.5" rx="3" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2.2" class="grow d3"/><text x="264.0" y="58.5" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >53</text><text x="264.0" y="211" font-family="sans-serif" font-size="10" font-weight="600" fill="#2B2F4A" text-anchor="middle" >2004</text><rect x="308.16" y="76.0" width="39.68" height="120.0" rx="3" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2.2" class="grow d4"/><text x="328.0" y="71.0" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >48</text><text x="328.0" y="211" font-family="sans-serif" font-size="10" font-weight="600" fill="#2B2F4A" text-anchor="middle" >2005</text></svg>