<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Three invented parties joining into an alliance which then heads to a legislature building</title><style>.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.1)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.blink{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
.rock{animation:rock 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fade{animation:fade 3s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
.slide{animation:slide 3s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.slidel{animation:slidel 3s ease-in-out infinite alternate}@keyframes slidel{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
.down{animation:down 2.4s ease-in infinite}@keyframes down{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.up{animation:up 2.4s ease-in infinite}@keyframes up{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-10px);opacity:0}}
.grow{animation:grow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="240" rx="0" fill="#EAF5FF" /><circle cx="60" cy="40" r="24" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><g transform="translate(60 37) scale(1.1)"><circle cx="0" cy="0" r="11" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.2" /></g><text x="60" y="76" font-family="sans-serif" font-size="10" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Party A</text><path d="M88 40 L185.5 106.9" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="dash"/><polygon points="190.0,110.0 181.0,109.1 185.9,102.0" fill="#2B2F4A"/><circle cx="60" cy="110" r="24" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><g transform="translate(60 107) scale(1.1)"><path d="M0 -12 L12 10 H-12Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="60" y="146" font-family="sans-serif" font-size="10" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Party B</text><path d="M88 110 L184.6 110.0" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="dash"/><polygon points="190.0,110.0 182.1,114.3 182.1,105.7" fill="#2B2F4A"/><circle cx="60" cy="180" r="24" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><g transform="translate(60 177) scale(1.1)"><rect x="-10" y="-10" width="20" height="20" rx="2" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.2" /></g><text x="60" y="216" font-family="sans-serif" font-size="10" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Party C</text><path d="M88 180 L185.5 113.1" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="dash"/><polygon points="190.0,110.0 185.9,118.0 181.0,110.9" fill="#2B2F4A"/><rect x="194" y="70" width="80" height="80" rx="14" fill="#FFD23F" stroke="#2B2F4A" stroke-width="3" class="pulse"/><text x="234" y="106" font-family="sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Alliance</text><text x="234" y="124" font-family="sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="middle" >or front</text><path d="M276 110 L304.6 110.0" fill="none" stroke="#3FA34D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="dash"/><polygon points="310.0,110.0 302.1,114.3 302.1,105.7" fill="#3FA34D"/><g transform="translate(350 140) scale(1.0)"><rect x="-30" y="-26" width="60" height="26" rx="0" fill="#F3D9A4" stroke="#2B2F4A" stroke-width="2.5" /><rect x="-34" y="-30" width="68" height="6" rx="0" fill="#E9C987" stroke="#2B2F4A" stroke-width="2.5" /><rect x="-23" y="-26" width="6" height="26" rx="0" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="1.8" /><rect x="-11" y="-26" width="6" height="26" rx="0" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="1.8" /><rect x="5" y="-26" width="6" height="26" rx="0" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="1.8" /><rect x="17" y="-26" width="6" height="26" rx="0" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="1.8" /><path d="M-16 -30 Q0 -62 16 -30Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 -58 V-70" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 -70 l10 3 l-10 3z" fill="#E5484D" stroke="#2B2F4A" stroke-width="1.5"/></g></svg>