<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Four cards: a pie with a purple part, coins and paper, a register with a tick, and a figure with a crossed arrow</title><style>.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.1)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.blink{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
.rock{animation:rock 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fade{animation:fade 3s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
.slide{animation:slide 3s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.slidel{animation:slidel 3s ease-in-out infinite alternate}@keyframes slidel{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
.down{animation:down 2.4s ease-in infinite}@keyframes down{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.up{animation:up 2.4s ease-in infinite}@keyframes up{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-10px);opacity:0}}
.grow{animation:grow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="14" y="12" width="176" height="100" rx="12" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><rect x="210" y="12" width="176" height="100" rx="12" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><rect x="14" y="128" width="176" height="100" rx="12" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><rect x="210" y="128" width="176" height="100" rx="12" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="102" cy="62" r="34" fill="#E9E2FF" stroke="#2B2F4A" stroke-width="2.5" /><path d="M102 62 L102.0 28.0 A34 34 0 0 1 131.4 79.0Z" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(262 100) scale(1.1)"><circle cx="0" cy="-22" r="20" fill="#FFD23F" stroke="#2B2F4A" stroke-width="3" /><circle cx="0" cy="-22" r="13" fill="none" stroke="#C99A00" stroke-width="2" /><text x="0" y="-15" font-family="sans-serif" font-size="20" font-weight="800" fill="#2B2F4A" text-anchor="middle" >₹</text></g><g transform="translate(300 100) scale(0.9)"><circle cx="0" cy="-22" r="20" fill="#FFD23F" stroke="#2B2F4A" stroke-width="3" /><circle cx="0" cy="-22" r="13" fill="none" stroke="#C99A00" stroke-width="2" /><text x="0" y="-15" font-family="sans-serif" font-size="20" font-weight="800" fill="#2B2F4A" text-anchor="middle" >₹</text></g><rect x="330" y="60" width="26" height="36" rx="3" fill="#C9CED6" stroke="#2B2F4A" stroke-width="2.5" /><rect x="50" y="148" width="80" height="60" rx="3" fill="#fff" stroke="#2B2F4A" stroke-width="2.2" /><path d="M58 160 H122" fill="none" stroke="#C9CED6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M58 169 H122" fill="none" stroke="#C9CED6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M58 178 H122" fill="none" stroke="#C9CED6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(150 208) scale(0.6)"><circle cx="0" cy="-34" r="8" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2.2" /><path d="M-11 0 Q-11 -22 0 -22 Q11 -22 11 0Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(60 160) scale(0.6)" class="pulse"><circle cx="0" cy="0" r="11" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" /><path d="M-5 0 L-1 5 L6 -5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(270 208) scale(0.9)"><circle cx="0" cy="-34" r="8" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2.2" /><path d="M-11 0 Q-11 -22 0 -22 Q11 -22 11 0Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M296 175 L330 175" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="dash"/><g transform="translate(344 175) scale(0.8)"><circle cx="0" cy="0" r="11" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" /><path d="M-5 -5 L5 5 M5 -5 L-5 5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g></svg>