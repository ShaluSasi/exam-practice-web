<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A signed sheet listing property and pending cases passing to a box labelled public next to a candidate figure</title><style>.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.1)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.blink{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
.rock{animation:rock 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fade{animation:fade 3s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
.slide{animation:slide 3s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.slidel{animation:slidel 3s ease-in-out infinite alternate}@keyframes slidel{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
.down{animation:down 2.4s ease-in infinite}@keyframes down{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.up{animation:up 2.4s ease-in infinite}@keyframes up{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-10px);opacity:0}}
.grow{animation:grow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="240" rx="0" fill="#FFF9EE" /><rect x="40" y="30" width="150" height="170" rx="3" fill="#fff" stroke="#2B2F4A" stroke-width="2.2" /><path d="M48 42 H182" fill="none" stroke="#C9CED6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M48 51 H182" fill="none" stroke="#C9CED6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M48 60 H182" fill="none" stroke="#C9CED6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M48 69 H182" fill="none" stroke="#C9CED6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M48 78 H182" fill="none" stroke="#C9CED6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M48 87 H182" fill="none" stroke="#C9CED6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><text x="115" y="50" font-family="sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Affidavit</text><path d="M56 168 q16 -16 30 0 t30 0" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><text x="115" y="98" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Property</text><text x="115" y="114" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Cases pending</text><g transform="translate(300 190) scale(1.5)" class="bob"><circle cx="0" cy="-34" r="8" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2.2" /><path d="M-11 0 Q-11 -22 0 -22 Q11 -22 11 0Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M190 110 L244.6 110.0" fill="none" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="dash"/><polygon points="250.0,110.0 242.1,114.3 242.1,105.7" fill="#0B93D4"/><rect x="250" y="40" width="110" height="50" rx="6" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" /><text x="305" y="70" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Public</text></svg>