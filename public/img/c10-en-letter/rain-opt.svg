<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>Raindrops falling from a cloud</title><style>
.fall{animation:fall 1.3s linear infinite}@keyframes fall{0%{transform:translateY(-16px);opacity:0}15%{opacity:1}100%{transform:translateY(36px);opacity:1}}
.drift{animation:drift 5s ease-in-out infinite alternate}@keyframes drift{0%{transform:translateX(0)}100%{transform:translateX(-26px)}}
.driftr{animation:driftr 5s ease-in-out infinite alternate}@keyframes driftr{0%{transform:translateX(0)}100%{transform:translateX(22px)}}
.bob{animation:bob 1.8s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{transform:scale(.9);opacity:.7}50%{transform:scale(1.12);opacity:1}}
.steam{animation:steam 2s ease-out infinite}@keyframes steam{0%{transform:translateY(4px);opacity:0}30%{opacity:.9}100%{transform:translateY(-16px);opacity:0}}
.spin{animation:spin 12s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spin2{animation:spin 2.4s linear infinite;transform-box:fill-box;transform-origin:center}
.sway{animation:sway 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.flick{animation:flick 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.15)}}
.slide{animation:slide 3s ease-in-out infinite}@keyframes slide{0%{transform:translateX(-30px);opacity:0}25%,70%{transform:translateX(0);opacity:1}100%{transform:translateX(0);opacity:0}}
.swarm{animation:swarm 1.4s ease-in-out infinite alternate}@keyframes swarm{0%{transform:translate(0,0)}100%{transform:translate(6px,-5px)}}
.shake{animation:shake .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes shake{0%{transform:rotate(-3deg)}100%{transform:rotate(3deg)}}
.dash{animation:dash 1.2s linear infinite}@keyframes dash{to{stroke-dashoffset:-24}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#D8DEE9"/><g><g transform="translate(100 36) scale(1.3)"><path d="M-30 10a14 14 0 0 1 4-27a18 18 0 0 1 34-4a14 14 0 0 1 22 10a12 12 0 0 1-2 21z" fill="#7D86A2" stroke="#2B2F4A" stroke-width="1.54" stroke-linejoin="round" stroke-linecap="round"/></g></g><line class="fall" style="animation-delay:-0.00s" x1="60" y1="62" x2="58" y2="71" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round"/><line class="fall" style="animation-delay:-0.23s" x1="85" y1="91" x2="83" y2="100" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round"/><line class="fall" style="animation-delay:-0.46s" x1="110" y1="90" x2="108" y2="99" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round"/><line class="fall" style="animation-delay:-0.69s" x1="135" y1="89" x2="133" y2="98" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round"/></svg>