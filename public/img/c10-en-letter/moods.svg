<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Four cartoon faces showing happy, sad, angry and surprised moods</title><style>
.fall{animation:fall 1.3s linear infinite}@keyframes fall{0%{transform:translateY(-16px);opacity:0}15%{opacity:1}100%{transform:translateY(36px);opacity:1}}
.drift{animation:drift 5s ease-in-out infinite alternate}@keyframes drift{0%{transform:translateX(0)}100%{transform:translateX(-26px)}}
.driftr{animation:driftr 5s ease-in-out infinite alternate}@keyframes driftr{0%{transform:translateX(0)}100%{transform:translateX(22px)}}
.bob{animation:bob 1.8s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{transform:scale(.9);opacity:.7}50%{transform:scale(1.12);opacity:1}}
.steam{animation:steam 2s ease-out infinite}@keyframes steam{0%{transform:translateY(4px);opacity:0}30%{opacity:.9}100%{transform:translateY(-16px);opacity:0}}
.spin{animation:spin 12s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spin2{animation:spin 2.4s linear infinite;transform-box:fill-box;transform-origin:center}
.sway{animation:sway 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.flick{animation:flick 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.15)}}
.slide{animation:slide 3s ease-in-out infinite}@keyframes slide{0%{transform:translateX(-30px);opacity:0}25%,70%{transform:translateX(0);opacity:1}100%{transform:translateX(0);opacity:0}}
.swarm{animation:swarm 1.4s ease-in-out infinite alternate}@keyframes swarm{0%{transform:translate(0,0)}100%{transform:translate(6px,-5px)}}
.shake{animation:shake .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes shake{0%{transform:rotate(-3deg)}100%{transform:rotate(3deg)}}
.dash{animation:dash 1.2s linear infinite}@keyframes dash{to{stroke-dashoffset:-24}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><g transform="translate(55 130) scale(1.5)"><rect x="-16" y="-20" width="32" height="22" rx="9" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cy="-32" r="13" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="-5" cy="-34" r="1.8" fill="#2B2F4A"/><circle cx="5" cy="-34" r="1.8" fill="#2B2F4A"/><path d="M-5 -28Q0 -23 5 -28" fill="none" stroke="#2B2F4A" stroke-width="1.8" stroke-linecap="round"/></g><g transform="translate(151 130) scale(1.5)"><rect x="-16" y="-20" width="32" height="22" rx="9" fill="#6FA8DC" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cy="-32" r="13" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="-5" cy="-34" r="1.8" fill="#2B2F4A"/><circle cx="5" cy="-34" r="1.8" fill="#2B2F4A"/><path d="M-5 -24Q0 -29 5 -24" fill="none" stroke="#2B2F4A" stroke-width="1.8" stroke-linecap="round"/><path d="M-8 -37L-2 -40M8 -37L2 -40" fill="none" stroke="#2B2F4A" stroke-width="1.8" stroke-linecap="round"/></g><g transform="translate(247 130) scale(1.5)"><rect x="-16" y="-20" width="32" height="22" rx="9" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cy="-32" r="13" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="-5" cy="-34" r="1.8" fill="#2B2F4A"/><circle cx="5" cy="-34" r="1.8" fill="#2B2F4A"/><path d="M-9 -40L-2 -37M9 -40L2 -37" fill="none" stroke="#2B2F4A" stroke-width="1.8" stroke-linecap="round"/><path d="M-4 -25H4" fill="none" stroke="#2B2F4A" stroke-width="1.8" stroke-linecap="round"/></g><g transform="translate(343 130) scale(1.5)"><rect x="-16" y="-20" width="32" height="22" rx="9" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cy="-32" r="13" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="-5" cy="-34" r="1.8" fill="#2B2F4A"/><circle cx="5" cy="-34" r="1.8" fill="#2B2F4A"/><circle cy="-26" r="3" fill="#7A1F2B" stroke="#2B2F4A" stroke-width="1.4"/></g><text x="200" y="190" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A">Which feeling comes when?</text></svg>