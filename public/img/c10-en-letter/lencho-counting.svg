<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>An angry Lencho counting coins at the counter</title><style>
.fall{animation:fall 1.3s linear infinite}@keyframes fall{0%{transform:translateY(-16px);opacity:0}15%{opacity:1}100%{transform:translateY(36px);opacity:1}}
.drift{animation:drift 5s ease-in-out infinite alternate}@keyframes drift{0%{transform:translateX(0)}100%{transform:translateX(-26px)}}
.driftr{animation:driftr 5s ease-in-out infinite alternate}@keyframes driftr{0%{transform:translateX(0)}100%{transform:translateX(22px)}}
.bob{animation:bob 1.8s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.pulse{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{0%,100%{transform:scale(.9);opacity:.7}50%{transform:scale(1.12);opacity:1}}
.steam{animation:steam 2s ease-out infinite}@keyframes steam{0%{transform:translateY(4px);opacity:0}30%{opacity:.9}100%{transform:translateY(-16px);opacity:0}}
.spin{animation:spin 12s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}
.spin2{animation:spin 2.4s linear infinite;transform-box:fill-box;transform-origin:center}
.sway{animation:sway 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.flick{animation:flick 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes flick{0%,100%{transform:scale(1,1)}50%{transform:scale(.88,1.15)}}
.slide{animation:slide 3s ease-in-out infinite}@keyframes slide{0%{transform:translateX(-30px);opacity:0}25%,70%{transform:translateX(0);opacity:1}100%{transform:translateX(0);opacity:0}}
.swarm{animation:swarm 1.4s ease-in-out infinite alternate}@keyframes swarm{0%{transform:translate(0,0)}100%{transform:translate(6px,-5px)}}
.shake{animation:shake .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes shake{0%{transform:rotate(-3deg)}100%{transform:rotate(3deg)}}
.dash{animation:dash 1.2s linear infinite}@keyframes dash{to{stroke-dashoffset:-24}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect width="100%" height="100%" rx="16" fill="#EAD9B8"/><rect x="0" y="195" width="400" height="45" fill="#C8A878"/><rect x="60" y="150" width="280" height="14" rx="3" fill="#9C6B34" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><g transform="translate(200 150) scale(1.6)"><rect x="-16" y="-20" width="32" height="22" rx="9" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cy="-32" r="13" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cy="-43" rx="25" ry="5" fill="#E0B050" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M-12 -43Q-12 -59 0 -59Q12 -59 12 -43Z" fill="#E0B050" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M-12 -47H12" stroke="#E5484D" stroke-width="3"/><circle cx="-5" cy="-34" r="1.8" fill="#2B2F4A"/><circle cx="5" cy="-34" r="1.8" fill="#2B2F4A"/><path d="M-9 -40L-2 -37M9 -40L2 -37" fill="none" stroke="#2B2F4A" stroke-width="1.8" stroke-linecap="round"/><path d="M-4 -25H4" fill="none" stroke="#2B2F4A" stroke-width="1.8" stroke-linecap="round"/></g><g><circle cx="120" cy="140" r="9" fill="#F4C430" stroke="#2B2F4A" stroke-width="1.6"/><circle cx="120" cy="140" r="5.4" fill="none" stroke="#C99A10" stroke-width="1.2"/></g><g><circle cx="142" cy="140" r="9" fill="#F4C430" stroke="#2B2F4A" stroke-width="1.6"/><circle cx="142" cy="140" r="5.4" fill="none" stroke="#C99A10" stroke-width="1.2"/></g><g><circle cx="164" cy="140" r="9" fill="#F4C430" stroke="#2B2F4A" stroke-width="1.6"/><circle cx="164" cy="140" r="5.4" fill="none" stroke="#C99A10" stroke-width="1.2"/></g><g><circle cx="186" cy="140" r="9" fill="#F4C430" stroke="#2B2F4A" stroke-width="1.6"/><circle cx="186" cy="140" r="5.4" fill="none" stroke="#C99A10" stroke-width="1.2"/></g><g><circle cx="208" cy="140" r="9" fill="#F4C430" stroke="#2B2F4A" stroke-width="1.6"/><circle cx="208" cy="140" r="5.4" fill="none" stroke="#C99A10" stroke-width="1.2"/></g><g><circle cx="230" cy="140" r="9" fill="#F4C430" stroke="#2B2F4A" stroke-width="1.6"/><circle cx="230" cy="140" r="5.4" fill="none" stroke="#C99A10" stroke-width="1.2"/></g><g><circle cx="252" cy="140" r="9" fill="#F4C430" stroke="#2B2F4A" stroke-width="1.6"/><circle cx="252" cy="140" r="5.4" fill="none" stroke="#C99A10" stroke-width="1.2"/></g><g class="steam"><circle cx="165" cy="70" r="5" fill="#FFFFFF" stroke="#9AA3C0"/><circle cx="235" cy="70" r="5" fill="#FFFFFF" stroke="#9AA3C0"/></g><g class="steam" style="animation-delay:-1s"><circle cx="150" cy="80" r="4" fill="#FFFFFF" stroke="#9AA3C0"/><circle cx="250" cy="80" r="4" fill="#FFFFFF" stroke="#9AA3C0"/></g></svg>