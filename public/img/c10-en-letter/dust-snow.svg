 x="-9" y="0" width="7" height="22" rx="3" fill="#4A5170" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="2" y="0" width="7" height="22" rx="3" fill="#4A5170" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M-13 -14L-20 -2" stroke="#3D7BC4" stroke-width="7" stroke-linecap="round"/><path d="M-13 -14L-20 -2" stroke="#2B2F4A" stroke-width="1" stroke-linecap="round" opacity=".0"/><circle cx="-20" cy="-2" r="4" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M13 -14L20 -2" stroke="#3D7BC4" stroke-width="7" stroke-linecap="round"/><path d="M13 -14L20 -2" stroke="#2B2F4A" stroke-width="1" stroke-linecap="round" opacity=".0"/><circle cx="20" cy="-2" r="4" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="-16" y="-20" width="32" height="22" rx="9" fill="#3D7BC4" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cy="-32" r="13" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M-13 -34Q-14 -48 0 -48Q14 -48 13 -34Q8 -41 0 -41Q-8 -41 -13 -34Z" fill="#3B2A1E" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="-5" cy="-34" r="1.8" fill="#2B2F4A"/><circle cx="5" cy="-34" r="1.8" fill="#2B2F4A"/><path d="M-4 -27Q0 -24 4 -27" fill="none" stroke="#2B2F4A" stroke-width="1.8" stroke-linecap="round"/></g></g></svg>