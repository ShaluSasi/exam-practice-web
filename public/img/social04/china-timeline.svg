<path class="wv" d="M10 50Q100 36 200 52T390 46" fill="none" stroke="#FFF3D6" stroke-width="2.5" stroke-linecap="round"/>
<g transform="translate(60 120) scale(1.3)"><path d="M-16 -12H16L12 -4Q20 4 14 12H-14Q-20 4 -12 -4Z" fill="#D4A63A" stroke="#8A6A1E" stroke-width="2.5" stroke-linejoin="round"/><path d="M-10 12L-12 20M10 12L12 20M0 12V20" stroke="#8A6A1E" stroke-width="2.5" stroke-linecap="round"/><path d="M-12 -12V-18M12 -12V-18" stroke="#8A6A1E" stroke-width="2.5" stroke-linecap="round"/></g>
<g stroke="#2B2F4A" stroke-width="2.5"><rect x="110" y="110" width="70" height="30" fill="#F6C453"/><rect x="180" y="110" width="90" height="30" fill="#F3B3A0"/><rect x="270" y="110" width="12" height="30" fill="#CDEBFA"/><rect x="282" y="110" width="60" height="30" fill="#C9E6B8"/></g>
<path d="M342 125H372M364 117l10 8l-10 8" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" font-size="12"><text x="110" y="166">older</text><text x="372" y="166" text-anchor="end">later</text></g>
</svg>
