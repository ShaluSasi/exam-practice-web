<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A rock shelter at dusk with a small campfire under the overhang</title>
<style>
.fi{animation:fi .8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fi{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M16 0H384Q400 0 400 16V200H0V16Q0 0 16 0Z" fill="#3D4470"/>
<g class="tw" fill="#F6C453"><circle cx="60" cy="30" r="2"/><circle cx="120" cy="50" r="1.6"/><circle cx="340" cy="26" r="2"/><circle cx="300" cy="60" r="1.6"/></g>
<path d="M0 200V60Q60 30 160 50Q260 26 400 70V200Z" fill="#A9886A" stroke="#6E5440" stroke-width="3" stroke-linejoin="round"/>
<path d="M60 200Q70 120 200 110Q330 116 340 200Z" fill="#5A4636"/>
<path d="M0 196H400V224Q400 240 384 240H16Q0 240 0 224Z" fill="#C2A27C"/>
<g transform="translate(200 196)"><path d="M-22 4L22 -4M-22 -4L22 4" stroke="#7E5A32" stroke-width="6" stroke-linecap="round"/>
<path class="fi" d="M0 -40Q14 -22 10 -8Q8 2 0 2Q-10 2 -10 -8Q-12 -20 0 -40Z" fill="#FF8A1F" stroke="#E5484D" stroke-width="2"/>
<path class="fi" d="M0 -22Q6 -12 4 -4Q2 0 0 0Q-4 0 -4 -4Q-6 -12 0 -22Z" fill="#F6C453"/></g>
<ellipse cx="200" cy="170" rx="70" ry="40" fill="#FF8A1F" opacity=".12"/>
</svg>
