<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" role="img">
<title>A number line of years from 80 BCE to 1 CE with a dot moving along it</title>
<style>
.dt{animation:dt 5s ease-in-out infinite}
@keyframes dt{0%{transform:translateX(0)}90%,100%{transform:translateX(320px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M24 80H376M366 72l10 8l-10 8" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" font-size="12" text-anchor="middle"><path d="M40 72V88" stroke="#2B2F4A" stroke-width="2"/><text x="40" y="108">80</text><path d="M80 72V88" stroke="#2B2F4A" stroke-width="2"/><text x="80" y="108">70</text><path d="M120 72V88" stroke="#2B2F4A" stroke-width="2"/><text x="120" y="108">60</text><path d="M160 72V88" stroke="#2B2F4A" stroke-width="2"/><text x="160" y="108">50</text><path d="M200 72V88" stroke="#2B2F4A" stroke-width="2"/><text x="200" y="108">40</text><path d="M240 72V88" stroke="#2B2F4A" stroke-width="2"/><text x="240" y="108">30</text><path d="M280 72V88" stroke="#2B2F4A" stroke-width="2"/><text x="280" y="108">20</text><path d="M320 72V88" stroke="#2B2F4A" stroke-width="2"/><text x="320" y="108">10</text><path d="M360 70V90" stroke="#E5484D" stroke-width="3"/><text x="356" y="108" fill="#E5484D">1 CE</text><text x="180" y="132">years BCE</text><text x="200" y="40">time</text></g>
<path d="M226 36H262M254 30l8 6l-8 6" fill="none" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<circle class="dt" cx="40" cy="80" r="7" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2"/>
</svg>
