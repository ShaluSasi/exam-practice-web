<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" role="img">
<title>An open account book, sacks of salt and rice, rolls of cloth, coins and a sailing ship at sea</title>
<style>
.bob{animation:bob 2.6s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.rock{animation:rock 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}@keyframes rock{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.wave{animation:wave 3s ease-in-out infinite}@keyframes wave{0%,100%{transform:translateX(0)}50%{transform:translateX(-8px)}}
.pe{animation:pe 2.4s ease-in-out infinite}@keyframes pe{0%,100%{transform:translate(0,0)}50%{transform:translate(-6px,4px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
