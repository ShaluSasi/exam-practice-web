<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" role="img">
<title>Five round icons: a wallet with a cross, a cracked smoking gear, an empty chair, three crowded shops and a pile of forms with a stamp</title>
<style>
.slow{animation:slow 5s steps(8) infinite;transform-box:fill-box;transform-origin:center}@keyframes slow{to{transform:rotate(90deg)}}
.smk{animation:smk 2s ease-out infinite}@keyframes smk{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-16px);opacity:0}}
.bl{animation:bl 1.6s ease-in-out infinite}@keyframes bl{0%,100%{opacity:1}50%{opacity:.4}}
.ex{animation:ex 1.6s ease-in-out infinite}@keyframes ex{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
.stamp{animation:stamp 1.8s ease-in-out infinite}@keyframes stamp{0%,100%{transform:translateY(-4px)}50%{transform:translateY(2px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="40" cy="100" r="32" fill="#F9D7D8" stroke="#2B2F4A" stroke-width="2"/><g transform="translate(40 100)"><rect x="-20" y="-12" width="40" height="26" rx="4" fill="#A86E3C" stroke="#2B2F4A" stroke-width="2"/><path d="M-20 -4H20" stroke="#2B2F4A" stroke-width="1.5"/><path d="M-8 -22L8 -6M8 -22L-8 -6" stroke="#E5484D" stroke-width="3.5" stroke-linecap="round" class="bl"/></g><circle cx="110" cy="100" r="32" fill="#E3E6F3" stroke="#2B2F4A" stroke-width="2"/><g transform="translate(110 100)"><g transform="translate(-2 4) scale(1)"><g class="slow"><rect x="-3.5" y="-15" width="7" height="8" rx="1.5" transform="rotate(0)" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="1.5"/><rect x="-3.5" y="-15" width="7" height="8" rx="1.5" transform="rotate(45)" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="1.5"/><rect x="-3.5" y="-15" width="7" height="8" rx="1.5" transform="rotate(90)" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="1.5"/><rect x="-3.5" y="-15" width="7" height="8" rx="1.5" transform="rotate(135)" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="1.5"/><rect x="-3.5" y="-15" width="7" height="8" rx="1.5" transform="rotate(180)" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="1.5"/><rect x="-3.5" y="-15" width="7" height="8" rx="1.5" transform="rotate(225)" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="1.5"/><rect x="-3.5" y="-15" width="7" height="8" rx="1.5" transform="rotate(270)" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="1.5"/><rect x="-3.5" y="-15" width="7" height="8" rx="1.5" transform="rotate(315)" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="1.5"/><circle r="10" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="2"/><circle r="4" fill="#FFF9EE" stroke="#2B2F4A" stroke-width="1.5"/></g></g><path d="M-6 -6L2 2L-3 8" stroke="#2B2F4A" stroke-width="2" fill="none"/><circle class="smk" cx="14" cy="-14" r="5" fill="#A3A8CC"/><circle class="smk" style="animation-delay:.8s" cx="14" cy="-14" r="4" fill="#A3A8CC"/></g><circle cx="180" cy="100" r="32" fill="#FFF3C4" stroke="#2B2F4A" stroke-width="2"/><g transform="translate(180 100)"><path d="M-14 -20V16M-14 -2H8V16M8 -2V-20" stroke="#2B2F4A" stroke-width="3" fill="none" stroke-linecap="round"/><rect x="-14" y="-6" width="22" height="6" fill="#C8925A" stroke="#2B2F4A" stroke-width="1.5"/><path class="ex" d="M12 4H24M20 0L24 4L20 8" stroke="#E5484D" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><circle cx="250" cy="100" r="32" fill="#FFE0C2" stroke="#2B2F4A" stroke-width="2"/><g transform="translate(250 100)"><g transform="translate(-14 4)"><rect x="-8" y="-6" width="16" height="16" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.5"/><path d="M-10 -6H10L8 -12H-8Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round"/></g><g transform="translate(0 -6)"><rect x="-8" y="-6" width="16" height="16" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.5"/><path d="M-10 -6H10L8 -12H-8Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round"/></g><g transform="translate(14 4)"><rect x="-8" y="-6" width="16" height="16" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.5"/><path d="M-10 -6H10L8 -12H-8Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round"/></g></g><circle cx="320" cy="100" r="32" fill="#D8F0DC" stroke="#2B2F4A" stroke-width="2"/><g transform="translate(320 100)"><rect x="-18" y="-18" width="28" height="32" rx="2" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.5"/><rect x="-15" y="-14" width="28" height="32" rx="2" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.5"/><rect x="-12" y="-10" width="28" height="32" rx="2" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.5"/><path d="M-8 0H12M-8 6H12" stroke="#A3A8CC" stroke-width="1.5"/><g class="stamp"><rect x="6" y="-26" width="10" height="12" fill="#C8925A" stroke="#2B2F4A" stroke-width="1.5"/><rect x="2" y="-14" width="18" height="6" rx="1" fill="#E5484D" stroke="#2B2F4A" stroke-width="1.5"/></g></g>
</svg>
