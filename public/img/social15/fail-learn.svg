<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 210" role="img">
<title>A growth line that rises, falls with a cross, then a new line that climbs higher after a light bulb</title>
<style>
.gl{animation:gl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes gl{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.85}}.dr{animation:dr 4s ease-in-out infinite}@keyframes dr{0%{stroke-dashoffset:260}60%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M40 30V184H320" stroke="#2B2F4A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<path d="M40 170L90 130L130 104L160 168" stroke="#E5484D" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M150 158L170 178M170 158L150 178" stroke="#E5484D" stroke-width="4" stroke-linecap="round"/>
<g transform="translate(186 140) scale(0.9)"><g class="gl"><path d="M-10 -2A12 12 0 1 1 10 -2Q6 4 6 9H-6Q-6 4 -10 -2Z" fill="#F6C453" stroke="#2B2F4A" stroke-width="2"/><path d="M-6 12H6M-5 16H5" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/></g></g>
<path class="dr" d="M196 168L230 140L262 110L290 70L314 36" stroke="#3FA34D" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="260" />
<path d="M304 40L316 34L314 48" stroke="#3FA34D" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="180" y="202" font-size="12" text-anchor="middle">Time</text><text transform="translate(24 110) rotate(-90)" font-size="12" text-anchor="middle">Growth</text></g>
</svg>
