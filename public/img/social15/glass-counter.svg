<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" role="img">
<title>A nimbu pani stall with tags for fixed costs, price and cost per glass, and a counter</title>
<style>
.fill{animation:fill 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@keyframes fill{0%{transform:scaleY(0)}60%,100%{transform:scaleY(1)}}
.pour{animation:pour 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom left}@keyframes pour{0%,100%{transform:rotate(0)}30%,60%{transform:rotate(12deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M0 170H360V194Q360 210 344 210H16Q0 210 0 194Z" fill="#D9C49A"/>
<rect x="20" y="132" width="140" height="12" rx="3" fill="#C8925A" stroke="#2B2F4A" stroke-width="2"/><rect x="28" y="144" width="124" height="34" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2"/>
<g class="pour"><path d="M50 84H84L80 128H54Z" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><path d="M52 96H82L80 126H54Z" fill="#F6E05E" opacity=".8"/><path d="M84 92Q98 92 94 112" stroke="#2B2F4A" stroke-width="3" fill="none"/></g>
<path d="M110 98H134L131 130H113Z" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><rect class="fill" x="113" y="104" width="18" height="25" fill="#F6E05E"/>
<g><rect x="168" y="29" width="184" height="20" rx="4" fill="#FFF3C4" stroke="#2B2F4A" stroke-width="1.5"/><circle cx="173" cy="39" r="1.8" fill="#2B2F4A"/><text x="262" y="43.5" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">Fixed costs today: ₹840</text></g><g><rect x="168" y="65" width="184" height="20" rx="4" fill="#FFF3C4" stroke="#2B2F4A" stroke-width="1.5"/><circle cx="173" cy="75" r="1.8" fill="#2B2F4A"/><text x="262" y="79.5" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">Price: ₹20 per glass</text></g><g><rect x="168" y="101" width="184" height="20" rx="4" fill="#FFE0C2" stroke="#2B2F4A" stroke-width="1.5"/><circle cx="173" cy="111" r="1.8" fill="#2B2F4A"/><text x="262" y="115.5" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">Lemons, sugar, cup: ₹8 a glass</text></g>
<rect x="196" y="140" width="128" height="34" rx="8" fill="#2B2F4A"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="260" y="162" font-size="14" text-anchor="middle" fill="#F6E05E">Glasses: ?</text></g>
</svg>
