.drive{animation:drive 3s ease-in-out infinite}@keyframes drive{0%,100%{transform:translateX(-3px)}50%{transform:translateX(5px)}}
.drop{animation:drop 2s ease-in infinite}@keyframes drop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(12px);opacity:.2}}
.sw2{animation:sw2 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}@keyframes sw2{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.pour{animation:pour 2s ease-in-out infinite;transform-box:fill-box;transform-origin:right center}@keyframes pour{0%,100%{transform:rotate(0)}50%{transform:rotate(-15deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
