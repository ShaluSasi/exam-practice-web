<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 210" role="img">
<title>A building held up by four pillars, one of which is cracked and wobbling</title>
<style>
.gl{animation:gl 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes gl{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.85}}.wob{animation:wob 2s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}@keyframes wob{0%,100%{transform:rotate(0)}50%{transform:rotate(2deg)}}
.tilt{animation:tilt 2s ease-in-out infinite;transform-origin:170px 62px}@keyframes tilt{0%,100%{transform:rotate(0)}50%{transform:rotate(1deg)}}
.fall{animation:fall 2s ease-in infinite}@keyframes fall{0%{opacity:0;transform:translateY(-30px)}60%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
