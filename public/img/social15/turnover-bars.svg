<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" role="img">
<title>A bar graph of a cooperative's turnover in the 1980s–90s and in 2023</title>
<style>
.gr{animation:gr 4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@keyframes gr{0%{transform:scaleY(.1)}30%,100%{transform:scaleY(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M70 144H320M70 106H320M70 68H320M70 30H320" stroke="#E3E6F3" stroke-width="1.5"/>
<path d="M70 182H326M70 182V24" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
<rect class="gr" x="115" y="172.5" width="60" height="9.5" fill="#F6C453" stroke="#2B2F4A" stroke-width="2"/>
<rect class="gr" style="animation-delay:.3s" x="225" y="30" width="60" height="152" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2"/>
<g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><g text-anchor="end"><text x="64" y="186" font-size="12">0</text><text x="64" y="148" font-size="12">400</text><text x="64" y="110" font-size="12">800</text><text x="64" y="72" font-size="12">1,200</text><text x="64" y="34" font-size="12">1,600</text></g>
<text x="145" y="198" font-size="12" text-anchor="middle">1980s–90s</text><text x="255" y="198" font-size="12" text-anchor="middle">2023</text>
<text x="145" y="164.5" font-size="13" text-anchor="middle">100</text><text x="255" y="24" font-size="13" text-anchor="middle">1,600</text>
<text transform="translate(18 106) rotate(-90)" font-size="12" text-anchor="middle">Turnover (₹ crore)</text></g>
</svg>
