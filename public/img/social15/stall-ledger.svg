<circle cx="306" cy="84" r="14" fill="#F6E05E" stroke="#B7950B" stroke-width="2"/><path d="M306 72V96M294 84H318M297 76L315 92M315 76L297 92" stroke="#B7950B" stroke-width="1.2"/>
