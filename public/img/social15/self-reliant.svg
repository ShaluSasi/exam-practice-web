)" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="1.5"/><rect x="-3.5" y="-15" width="7" height="8" rx="1.5" transform="rotate(270)" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="1.5"/><rect x="-3.5" y="-15" width="7" height="8" rx="1.5" transform="rotate(315)" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="1.5"/><circle r="10" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="2"/><circle r="4" fill="#FFF9EE" stroke="#2B2F4A" stroke-width="1.5"/></g></g>
