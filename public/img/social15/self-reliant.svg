<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" role="img">
<title>A local factory with turning gears sending boxes along a belt, beside rising bars and a growing plant</title>
<style>
.spin{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes spin{to{transform:rotate(360deg)}}.belt{animation:belt 4s linear infinite}@keyframes belt{from{transform:translateX(0)}to{transform:translateX(112px)}}
.smk{animation:smk 2.4s ease-out infinite}@keyframes smk{0%{transform:translateY(0);opacity:.8}100%{transform:translateY(-24px);opacity:0}}
.sw2{animation:sw2 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}@keyframes sw2{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
