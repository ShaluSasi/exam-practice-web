<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" role="img">
<title>A blank timeline arrow running from earlier to later, with four empty slots</title>
<style>
.o{stroke:#2B2F4A;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.t{stroke:#2B2F4A;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}.fb{transform-box:fill-box;transform-origin:center}
.mv{animation:mv 5s ease-in-out infinite}@keyframes mv{from{transform:translateX(0)}to{transform:translateX(320px)}}
