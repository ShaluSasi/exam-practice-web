eight="7" rx="2" fill="#E6D8FF" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><line x1="135" y1="120" x2="245" y2="120" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" class="fl" marker-end="url(#aho)"/><path d="M300 50c-8 -10 -20 0 -10 10l10 9l10 -9c10 -10 -2 -20 -10 -10Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="pul"/><text x="300" y="196" font-size="11" text-anchor="middle">Slow, not always clean,</text><text x="300" y="211" font-size="11" text-anchor="middle">but legitimate</text></svg>