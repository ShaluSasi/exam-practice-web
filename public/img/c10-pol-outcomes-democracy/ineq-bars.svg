nchor="middle">63</text><text x="109" y="171.5" font-size="10.5" text-anchor="middle">2.6</text><text x="97" y="206" font-size="11" text-anchor="middle">Brazil</text><rect x="130" y="97.9" width="21" height="92.1" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="152" y="182.5" width="21" height="7.5" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="93.9" font-size="10.5" text-anchor="middle">53.7</text><text x="163" y="178.5" font-size="10.5" text-anchor="middle">4.4</text><text x="151" y="206" font-size="11" text-anchor="middle">Russia</text><rect x="184" y="104.3" width="21" height="85.7" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="206" y="183.1" width="21" height="6.9" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="194" y="100.3" font-size="10.5" text-anchor="middle">50</text><text x="217" y="169.1" font-size="10.5" text-anchor="middle">4</text><text x="205" y="206" font-size="11" text-anchor="middle">USA</text><rect x="238" y="112.9" width="21" height="77.1" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="260" y="179.7" width="21" height="10.3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="248" y="108.9" font-size="10.5" text-anchor="middle">45</text><text x="271" y="175.7" font-size="10.5" text-anchor="middle">6</text><text x="259" y="206" font-size="11" text-anchor="middle">UK</text><rect x="292" y="130.9" width="21" height="59.1" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="314" y="173.5" width="21" height="16.5" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="302" y="126.9" font-size="10