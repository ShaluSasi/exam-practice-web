<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Four cards: two people in conflict, uneven coins, speech bubbles, equal ballots</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.blk,.drift,.rock{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.1)}}
.spin{animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rspin{transform-box:fill-box;transform-origin:center;animation:rspin 8s linear infinite}
@keyframes rspin{to{transform:rotate(-360deg)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.4}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-5px)}to{transform:translateX(5px)}}
.rock{animation:rock 3s ease-in-out infinite alternate}
@keyframes rock{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7C5CFF"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#E3F2FD"/><text x="200" y="22" font-size="13" text-anchor="middle">What has democracy not ended?</text><rect x="30" y="47" width="140" height="76" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(100 85) scale(1)"><g transform="translate(-14 0) scale(1)"><circle cx="0" cy="-13" r="6.5" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-9 14V0Q-9 -6 0 -6Q9 -6 9 0V14Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(14 0) scale(1)"><circle cx="0" cy="-13" r="6.5" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-9 14V0Q-9 -6 0 -6Q9 -6 9 0V14Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M-4 -26L4 -18M4 -26L-4 -18" stroke="#E5484D" stroke-width="3"/></g><rect x="230" y="47" width="140" height="76" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(300 85) scale(1)"><circle cx="-12" cy="0" r="12" fill="#FFC93C" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="14" cy="8" r="5" fill="#FFC93C" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="30" y="132" width="140" height="76" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(100 170) scale(1)"><g transform="translate(-12 -2) scale(0.9)"><path d="M-22 -14H22Q26 -14 26 -10V10Q26 14 22 14H-6L-16 24V14H-22Q-26 14 -26 10V-10Q-26 -14 -22 -14Z" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(12 8) scale(0.8)"><path d="M-22 -14H22Q26 -14 26 -10V10Q26 14 22 14H-6L-16 24V14H-22Q-26 14 -26 10V-10Q-26 -14 -22 -14Z" fill="#DCEBFF" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><rect x="230" y="132" width="140" height="76" rx="12" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(300 170) scale(1)"><g transform="translate(-20 0) scale(0.7)"><path d="M-3 -22L10 -26L12 -12L-1 -10Z" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-8)"/><rect x="-18" y="-8" width="36" height="28" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-9" y="-4" width="18" height="4" rx="2" fill="#2B2F4A"/></g><g transform="translate(0 0) scale(0.7)"><path d="M-3 -22L10 -26L12 -12L-1 -10Z" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-8)"/><rect x="-18" y="-8" width="36" height="28" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-9" y="-4" width="18" height="4" rx="2" fill="#2B2F4A"/></g><g transform="translate(20 0) scale(0.7)"><path d="M-3 -22L10 -26L12 -12L-1 -10Z" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-8)"/><rect x="-18" y="-8" width="36" height="28" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-9" y="-4" width="18" height="4" rx="2" fill="#2B2F4A"/></g></g></svg>