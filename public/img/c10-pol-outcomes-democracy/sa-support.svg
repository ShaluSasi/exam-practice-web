<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Bars of per cent agreeing with rule of elected leaders</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.blk,.drift,.rock{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.1)}}
.spin{animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rspin{transform-box:fill-box;transform-origin:center;animation:rspin 8s linear infinite}
@keyframes rspin{to{transform:rotate(-360deg)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.4}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-5px)}to{transform:translateX(5px)}}
.rock{animation:rock 3s ease-in-out infinite alternate}
@keyframes rock{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7C5CFF"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#E3F2FD"/><text x="200" y="22" font-size="13" text-anchor="middle">Agree with rule by elected leaders (per cent)</text><text x="92" y="58" font-size="12" text-anchor="end">South Asia</text><rect x="100" y="42" width="244.4" height="22" rx="3" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="350.4" y="58" font-size="12" text-anchor="start">94</text><text x="92" y="88" font-size="12" text-anchor="end">Sri Lanka</text><rect x="100" y="72" width="254.8" height="22" rx="3" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="360.8" y="88" font-size="12" text-anchor="start">98</text><text x="92" y="118" font-size="12" text-anchor="end">Bangladesh</text><rect x="100" y="102" width="249.6" height="22" rx="3" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="355.6" y="118" font-size="12" text-anchor="start">96</text><text x="92" y="148" font-size="12" text-anchor="end">India</text><rect x="100" y="132" width="247.0" height="22" rx="3" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="353.0" y="148" font-size="12" text-anchor="start">95</text><text x="92" y="178" font-size="12" text-anchor="end">Nepal</text><rect x="100" y="162" width="244.4" height="22" rx="3" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="350.4" y="178" font-size="12" text-anchor="start">94</text><text x="92" y="208" font-size="12" text-anchor="end">Pakistan</text><rect x="100" y="192" width="210.6" height="22" rx="3" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="316.6" y="208" font-size="12" text-anchor="start">81</text><path d="M100 38V224" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="238" font-size="11" text-anchor="middle">0</text><text x="230" y="238" font-size="11" text-anchor="middle">50</text><text x="360" y="238" font-size="11" text-anchor="middle">100</text></svg>