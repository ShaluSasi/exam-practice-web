<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Stacked bars for five South Asian countries showing three survey answers</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.blk,.drift,.rock{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.1)}}
.spin{animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rspin{transform-box:fill-box;transform-origin:center;animation:rspin 8s linear infinite}
@keyframes rspin{to{transform:rotate(-360deg)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.4}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-5px)}to{transform:translateX(5px)}}
.rock{animation:rock 3s ease-in-out infinite alternate}
@keyframes rock{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7C5CFF"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#E3F2FD"/><text x="200" y="22" font-size="13" text-anchor="middle">Which do you agree with? (per cent)</text><text x="84" y="61" font-size="12" text-anchor="end">Bangladesh</text><rect x="90" y="44" width="200.1" height="24" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="190.1" y="61" font-size="11" text-anchor="middle" style="fill:#fff">69</text><rect x="290.1" y="44" width="17.4" height="24" fill="#FFC93C" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="298.8" y="61" font-size="11" text-anchor="middle" style="fill:#2B2F4A">6</text><rect x="307.5" y="44" width="72.5" height="24" fill="#6EA8FF" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="343.8" y="61" font-size="11" text-anchor="middle" style="fill:#2B2F4A">25</text><text x="84" y="93" font-size="12" text-anchor="end">India</text><rect x="90" y="76" width="203.0" height="24" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="191.5" y="93" font-size="11" text-anchor="middle" style="fill:#fff">70</text><rect x="293.0" y="76" width="26.1" height="24" fill="#FFC93C" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="306.1" y="93" font-size="11" text-anchor="middle" style="fill:#2B2F4A">9</text><rect x="319.1" y="76" width="60.9" height="24" fill="#6EA8FF" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="349.6" y="93" font-size="11" text-anchor="middle" style="fill:#2B2F4A">21</text><text x="84" y="125" font-size="12" text-anchor="end">Nepal</text><rect x="90" y="108" width="179.8" height="24" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="179.9" y="125" font-size="11" text-anchor="middle" style="fill:#fff">62</text><rect x="269.8" y="108" width="29.0" height="24" fill="#FFC93C" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="284.3" y="125" font-size="11" text-anchor="middle" style="fill:#2B2F4A">10</text><rect x="298.8" y="108" width="81.2" height="24" fill="#6EA8FF" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="339.4" y="125" font-size="11" text-anchor="middle" style="fill:#2B2F4A">28</text><text x="84" y="157" font-size="12" text-anchor="end">Pakistan</text><rect x="90" y="140" width="107.3" height="24" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="143.7" y="157" font-size="11" text-anchor="middle" style="fill:#fff">37</text><rect x="197.3" y="140" width="40.6" height="24" fill="#FFC93C" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="217.6" y="157" font-size="11" text-anchor="middle" style="fill:#2B2F4A">14</text><rect 