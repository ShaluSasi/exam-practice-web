<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>Picture option</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.blk,.drift,.rock{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.1)}}
.spin{animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rspin{transform-box:fill-box;transform-origin:center;animation:rspin 8s linear infinite}
@keyframes rspin{to{transform:rotate(-360deg)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.4}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-5px)}to{transform:translateX(5px)}}
.rock{animation:rock 3s ease-in-out infinite alternate}
@keyframes rock{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7C5CFF"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#F4F8FF"/><g transform="translate(30 80) scale(0.9)"><rect x="-28" y="-18" width="56" height="38" rx="3" fill="#C9F0D1" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-32" y="-24" width="64" height="8" rx="2" fill="#2B2F4A"/><rect x="-20" y="-10" width="8" height="8" rx="1.5" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-20" y="4" width="8" height="8" rx="1.5" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-4" y="-10" width="8" height="8" rx="1.5" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-4" y="4" width="8" height="8" rx="1.5" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="12" y="-10" width="8" height="8" rx="1.5" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="12" y="4" width="8" height="8" rx="1.5" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-5" y="10" width="10" height="10" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(170 80) scale(1.2)"><path d="M-18 -4L0 -20L18 -4Z" fill="#FFD9D9" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-14" y="-4" width="28" height="22" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-4" y="6" width="8" height="12" fill="#FFD9D9" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(100 112) scale(0.8)"><path d="M-30 0H30L22 14H-22Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-18" y="-14" width="14" height="14" fill="#FFC93C" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="0" y="-14" width="14" height="14" fill="#FFC93C" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><line x1="55" y1="40" x2="145" y2="40" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" marker-end="url(#aho)"/><text x="30" y="138" font-size="11" text-anchor="middle">Rich</text><text x="170" y="138" font-size="11" text-anchor="middle">Poor</text></svg>