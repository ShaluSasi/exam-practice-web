<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Stacked bars for four countries: top 20, middle 60 and bottom 20 per cent income shares</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.blk,.drift,.rock{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.1)}}
.spin{animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rspin{transform-box:fill-box;transform-origin:center;animation:rspin 8s linear infinite}
@keyframes rspin{to{transform:rotate(-360deg)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.4}}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-5px)}to{transform:translateX(5px)}}
.rock{animation:rock 3s ease-in-out infinite alternate}
@keyframes rock{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7C5CFF"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#E3F2FD"/><text x="200" y="22" font-size="13" text-anchor="middle">Who takes what share (per cent)</text><text x="84" y="65" font-size="12" text-anchor="end">South Africa</text><rect x="90" y="48" width="162.0" height="26" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="171.0" y="66" font-size="12" text-anchor="middle">64.8</text><rect x="252.0" y="48" width="80.8" height="26" fill="#C9D3EA" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="292.4" y="66" font-size="12" text-anchor="middle">32.3</text><rect x="332.8" y="48" width="7.2" height="26" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="348" y="66" font-size="12" text-anchor="start" style="fill:#0B93D4">2.9</text><text x="84" y="105" font-size="12" text-anchor="end">Brazil</text><rect x="90" y="88" width="157.5" height="26" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="168.8" y="106" font-size="12" text-anchor="middle">63</text><rect x="247.5" y="88" width="86.0" height="26" fill="#C9D3EA" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="290.5" y="106" font-size="12" text-anchor="middle">34.4</text><rect x="333.5" y="88" width="6.5" height="26" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="348" y="106" font-size="12" text-anchor="start" style="fill:#0B93D4">2.6</text><text x="84" y="145" font-size="12" text-anchor="end">Denmark</text><rect x="90" y="128" width="86.2" height="26" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="133.1" y="146" font-size="12" text-anchor="middle">34.5</text><rect x="176.2" y="128" width="139.8" height="26" fill="#C9D3EA" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="246.1" y="146" font-size="12" text-anchor="middle">55.9</text><rect x="316.0" y="128" width="24.0" height="26" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="348" y="146" font-size="12" text-anchor="start" style="fill:#0B93D4">9.6</text><text x="84" y="185" font-size="12" text-anchor="end">Hungary</text><rect x="90" y="168" width="86.0" height="26" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="133.0" y="186" font-size="12" text-anchor="middle">34.4</text><rect x="176.0" y="168" width="139.0" height="26" fill="#C9D3EA" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="245.5" y="186" font-size="12" text-anchor="middle">55.6</text><rect x="315.0" y="168" width="25.0" height="26" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><tex