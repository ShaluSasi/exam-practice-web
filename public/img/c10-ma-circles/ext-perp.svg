<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Two tangents from an outside point P to a circle</title>
<style>.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.fl{stroke-dasharray:10 5;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-15}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:15px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="155" cy="120" r="90" fill="#EAF5FD" stroke="#0B93D4" stroke-width="3" class=""/>
<line x1="335" y1="120" x2="200" y2="42.1" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round" class="" />
<line x1="335" y1="120" x2="200" y2="197.9" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round" class="" />
<circle cx="200" cy="42.1" r="4" fill="#2B2F4A" class=""/>
<text x="208" y="33.5" font-size="15" text-anchor="middle" class="h">A</text>
<circle cx="200" cy="197.9" r="4" fill="#2B2F4A" class=""/>
<text x="208" y="217" font-size="15" text-anchor="middle" class="h">B</text>
<circle cx="335" cy="120" r="4.5" fill="#2B2F4A" class=""/>
<text x="351" y="125.2" font-size="15" text-anchor="middle" class="h">P</text>
<circle cx="155" cy="120" r="4.5" fill="#2B2F4A" class=""/>
<text x="142" y="139.2" font-size="15" text-anchor="middle" class="h">O</text>
</svg>
