<text x="338.5" y="59.3" font-size="15" text-anchor="middle" class="h">l</text>
<line x1="103.1" y1="168.5" x2="373.1" y2="168.5" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round" class="" />
<text x="110" y="159.7" font-size="15" text-anchor="middle" class="h">m</text>
<circle cx="200" cy="168.5" r="5.5" fill="#E5484D" class=""/>
<text x="200" y="191.7" font-size="15" text-anchor="middle" class="h">P</text>
<circle cx="352.3" cy="168.5" r="5.5" fill="#E5484D" class=""/>
<text x="352.3" y="191.7" font-size="15" text-anchor="middle" class="h">T</text>
<circle cx="200" cy="99.2" r="4" fill="#2B2F4A" class=""/>
