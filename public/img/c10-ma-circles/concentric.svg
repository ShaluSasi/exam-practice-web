<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Two concentric circles of radii 17 and 8; a chord AB of the larger circle touches the smaller circle</title>
<style>.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.fl{stroke-dasharray:10 5;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-15}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:15px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="200" cy="120" r="92" fill="#FFFFFF" stroke="#0B93D4" stroke-width="3" class=""/>
<circle cx="200" cy="120" r="43.3" fill="#EEE9FF" stroke="#7C5CFF" stroke-width="3" class=""/>
<line x1="118.8" y1="163.3" x2="281.2" y2="163.3" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round" class="" />
<line x1="200" y1="120" x2="200" y2="163.3" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" class="" />
<circle cx="118.8" cy="163.3" r="4" fill="#2B2F4A" class=""/>
<text x="105.6" y="175.6" font-size="15" text-anchor="middle" class="h">A</text>
<circle cx="281.2" cy="163.3" r="4" fill="#2B2F4A" class=""/>
<text x="294.4" y="175.6" font-size="15" text-anchor="middle" class="h">B</text>
<circle cx="200" cy="163.3" r="3.5" fill="#2B2F4A" class=""/>
<text x="212" y="154.5" font-size="15" text-anchor="middle" class="h">P</text>
<circle cx="200" cy="120" r="4.5" fill="#2B2F4A" class=""/>
<text x="214" y="117.2" font-size="15" text-anchor="middle" class="h">O</text>
</svg>
