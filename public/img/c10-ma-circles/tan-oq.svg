<line x1="170" y1="120" x2="224" y2="48" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" class="" />
<line x1="170" y1="120" x2="320" y2="120" stroke="#8A8FB0" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4" class="" />
<circle cx="224" cy="48" r="4" fill="#2B2F4A" class=""/>
<text x="233.6" y="40.4" font-size="15" text-anchor="middle" class="h">P</text>
<circle cx="320" cy="120" r="4.5" fill="#2B2F4A" class=""/>
