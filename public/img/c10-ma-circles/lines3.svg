<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A circle with three parallel lines l, m and n</title>
<style>.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.fl{stroke-dasharray:10 5;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-15}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:15px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="200" cy="97.4" r="75.4" fill="#EAF5FD" stroke="#0B93D4" stroke-width="3" class=""/>
<line x1="53" y1="55.9" x2="347" y2="55.9" stroke="#7C5CFF" stroke-width="3.5" stroke-linecap="round" class="" />
<text x="39.2" y="61.5" font-size="16" text-anchor="middle" class="h">l</text>
<line x1="53" y1="172.8" x2="347" y2="172.8" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round" class="" />
<text x="39.2" y="178.4" font-size="16" text-anchor="middle" class="h">m</text>
<line x1="53" y1="214.2" x2="347" y2="214.2" stroke="#3FA34D" stroke-width="3.5" stroke-linecap="round" class="" />
<text x="39.2" y="219.8" font-size="16" text-anchor="middle" class="h">n</text>
<circle cx="200" cy="97.4" r="4" fill="#2B2F4A" class=""/>
<text x="212" y="116.6" font-size="15" text-anchor="middle" class="h">O</text>
