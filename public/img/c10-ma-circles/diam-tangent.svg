<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A circle with diameter PQ and the tangents drawn at its two ends</title>
<style>.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.fl{stroke-dasharray:10 5;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-15}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:15px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="200" cy="120" r="62.7" fill="#EAF5FD" stroke="#0B93D4" stroke-width="3" class=""/>
<line x1="137.3" y1="210.9" x2="137.3" y2="29.1" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round" class="" />
<line x1="262.7" y1="210.9" x2="262.7" y2="29.1" stroke="#7C5CFF" stroke-width="3.5" stroke-linecap="round" class="" />
<line x1="137.3" y1="120" x2="262.7" y2="120" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" class="" />
<circle cx="137.3" cy="120" r="4" fill="#2B2F4A" class=""/>
<text x="121.3" y="123.2" font-size="15" text-anchor="middle" class="h">P</text>
<circle cx="262.7" cy="120" r="4" fill="#2B2F4A" class=""/>
<text x="278.7" y="123.2" font-size="15" text-anchor="middle" class="h">Q</text>
<circle cx="200" cy="120" r="4.5" fill="#2B2F4A" class=""/>
<text x="200" y="111.2" font-size="15" text-anchor="middle" class="h">O</text>
<text x="123.3" y="34.4" font-size="15" text-anchor="middle" class="h">l</text>
<text x="276.7" y="34.4" font-size="15" text-anchor="middle" class="h">m</text>
</svg>
