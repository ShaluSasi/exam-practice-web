<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A line pivots about a point P on a circle: only one position touches the circle at just one point</title>
<style>.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.fl{stroke-dasharray:10 5;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-15}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:15px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.sw{transform-box:view-box;transform-origin:200px 168.5px;animation:sw 7s ease-in-out infinite}@keyframes sw{0%,30%{transform:rotate(0)}45%{transform:rotate(-17deg)}60%,70%{transform:rotate(0)}85%{transform:rotate(17deg)}100%{transform:rotate(0)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="200" cy="99.2" r="69.2" fill="#EAF5FD" stroke="#0B93D4" stroke-width="3" class=""/>
<g class="sw">
<line x1="40.8" y1="168.5" x2="359.2" y2="168.5" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round" class="" />
<text x="51.2" y="157.7" font-size="15" text-anchor="middle" class="h">A</text>
<text x="348.8" y="157.7" font-size="15" text-anchor="middle" class="h">B</text>
</g>
<circle cx="200" cy="168.5" r="5.5" fill="#E5484D" class=""/>
<text x="200" y="193.7" font-size="15" text-anchor="middle" class="h">P</text>
<circle cx="200" cy="99.2" r="4" fill="#2B2F4A" class=""/>
<text x="186" y="96.5" font-size="15" text-anchor="middle" class="h">O</text>
</svg>
