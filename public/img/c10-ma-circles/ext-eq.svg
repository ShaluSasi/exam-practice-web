<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Two tangents PA and PB drawn from an external point P to a circle with centre O</title>
<style>.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.fl{stroke-dasharray:10 5;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-15}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:15px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="128" cy="120" r="90" fill="#EAF5FD" stroke="#0B93D4" stroke-width="3" class=""/>
<line x1="362" y1="120" x2="162.6" y2="36.9" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round" class="" />
<line x1="362" y1="120" x2="162.6" y2="203.1" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round" class="" />
<line x1="128" y1="120" x2="162.6" y2="36.9" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4" class="" />
<line x1="128" y1="120" x2="162.6" y2="203.1" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4" class="" />
<circle cx="162.6" cy="36.9" r="4" fill="#2B2F4A" class=""/>
<text x="168.8" y="27.4" font-size="15" text-anchor="middle" class="h">A</text>
<circle cx="162.6" cy="203.1" r="4" fill="#2B2F4A" class=""/>
<text x="168.8" y="223.1" font-size="15" text-anchor="middle" class="h">B</text>
<circle cx="362" cy="120" r="4.5" fill="#2B2F4A" class=""/>
<text x="378" y="125.2" font-size="15" text-anchor="middle" class="h">P</text>
<circle cx="128" cy="120" r="4.5" fill="#2B2F4A" class=""/>
<text x="115" y="139.2" font-size="15" text-anchor="middle" class="h">O</text>
</svg>
