<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A circle of radius 5 and a line 7 units below its centre</title>
<style>.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.fl{stroke-dasharray:10 5;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-15}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:15px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="200" cy="101.6" r="76.6" fill="#EAF5FD" stroke="#0B93D4" stroke-width="3" class=""/>
<line x1="105.1" y1="208.8" x2="294.9" y2="208.8" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round" class="" />
<line x1="200" y1="101.6" x2="200" y2="208.8" stroke="#8A8FB0" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 4" class="" />
<text x="188" y="160.5" font-size="15" text-anchor="middle" class="h">7</text>
<line x1="200" y1="101.6" x2="133.7" y2="63.3" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" class="" />
<text x="162.8" y="73.7" font-size="15" text-anchor="middle" class="h">5</text>
<circle cx="200" cy="101.6" r="4.5" fill="#2B2F4A" class=""/>
<text x="212" y="120.9" font-size="15" text-anchor="middle" class="h">O</text>
</svg>
