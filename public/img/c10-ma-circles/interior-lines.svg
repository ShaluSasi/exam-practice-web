<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A point P inside a circle with several lines through it; each line cuts the circle at two points</title>
<style>.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.fl{stroke-dasharray:10 5;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-15}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:15px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.sw{transform-box:view-box;transform-origin:225.3px 103.2px;animation:sw 8s linear infinite}@keyframes sw{to{transform:rotate(180deg)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="200" cy="120" r="84.2" fill="#EAF5FD" stroke="#0B93D4" stroke-width="3" class=""/>
<line x1="240.9" y1="14.7" x2="202.4" y2="232.9" stroke="#8A8FB0" stroke-width="2.5" stroke-linecap="round" class="" />
<circle cx="235.7" cy="43.7" r="3.5" fill="#3FA34D" class=""/>
<circle cx="207.5" cy="203.9" r="3.5" fill="#3FA34D" class=""/>
<line x1="135.6" y1="27.9" x2="301.8" y2="167.4" stroke="#8A8FB0" stroke-width="2.5" stroke-linecap="round" class="" />
<circle cx="158.2" cy="46.9" r="3.5" fill="#3FA34D" class=""/>
<circle cx="279.3" cy="148.5" r="3.5" fill="#3FA34D" class=""/>
<line x1="90.6" y1="91.4" x2="312.7" y2="110.8" stroke="#8A8FB0" stroke-width="2.5" stroke-linecap="round" class="" />
<circle cx="119.9" cy="93.9" r="3.5" fill="#3FA34D" class=""/>
<circle cx="283.4" cy="108.2" r="3.5" fill="#3FA34D" class=""/>
<g class="sw">
<line x1="340" y1="61.4" x2="110.5" y2="144.9" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round" class="" />
</g>
<circle cx="225.3" cy="103.2" r="5" fill="#E5484D" class=""/>
<text x="235.3" y="94.4" font-size="15" text-anchor="middle" class="h">P</text>
<circle cx="200" cy="120" r="4" fill="#2B2F4A" class=""/>
<text x="188" y="139.2" font-size="15" text-anchor="middle" class="h">O</text>
</svg>
