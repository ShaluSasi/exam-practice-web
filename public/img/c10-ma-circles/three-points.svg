<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A circle of radius 5 with point A inside, B on the circle and C outside, drawn to scale</title>
<style>.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}.fl{stroke-dasharray:10 5;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-15}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:15px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="177.3" cy="120" r="90" fill="#EAF5FD" stroke="#0B93D4" stroke-width="3" class=""/>
<line x1="177.3" y1="120" x2="146.4" y2="75.8" stroke="#8A8FB0" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" class="" />
<circle cx="146.4" cy="75.8" r="4.5" fill="#E5484D" class=""/>
<text x="136.6" y="67.1" font-size="15" text-anchor="middle" class="h">A</text>
<line x1="177.3" y1="120" x2="246.3" y2="177.9" stroke="#8A8FB0" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" class="" />
<circle cx="246.3" cy="177.9" r="4.5" fill="#3FA34D" class=""/>
<text x="259.3" y="194" font-size="15" text-anchor="middle" class="h">B</text>
<line x1="177.3" y1="120" x2="312.7" y2="70.7" stroke="#8A8FB0" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" class="" />
<circle cx="312.7" cy="70.7" r="4.5" fill="#E5484D" class=""/>
<text x="328.6" y="70.2" font-size="15" text-anchor="middle" class="h">C</text>
<circle cx="177.3" cy="120" r="4" fill="#2B2F4A" class=""/>
<text x="173.3" y="143.2" font-size="15" text-anchor="middle" class="h">O</text>
</svg>
