<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img">
<title>A steam engine puffing along a track</title>
<style>
.up{animation:up 3s ease-in infinite;transform-box:fill-box}@keyframes up{0%{transform:translateY(6px);opacity:0}30%{opacity:1}100%{transform:translateY(-26px);opacity:0}}.ch{animation:ch 2s ease-in-out infinite}@keyframes ch{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
