<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250" role="img">
<title>Four sentence cards, each with one clause underlined</title>
<style>

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="20" y="16" width="400" height="48" rx="10" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="2"/><circle cx="44" cy="40" r="13" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="44" y="45" font-size="14" text-anchor="middle">1</text></g><text x="68" y="46" font-size="17" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">Onula knew <tspan fill="#0B6FA4" font-weight="700" text-decoration="underline">that Sentila was nervous</tspan>.</text><rect x="20" y="74" width="400" height="48" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><circle cx="44" cy="98" r="13" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="44" y="103" font-size="14" text-anchor="middle">2</text></g><text x="68" y="104" font-size="17" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">The clay <tspan fill="#0B6FA4" font-weight="700" text-decoration="underline">that Arenla dug</tspan> was red.</text><rect x="20" y="132" width="400" height="48" rx="10" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="2"/><circle cx="44" cy="156" r="13" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="44" y="161" font-size="14" text-anchor="middle">3</text></g><text x="68" y="162" font-size="17" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">She smiled <tspan fill="#0B6FA4" font-weight="700" text-decoration="underline">when the pot was finished</tspan>.</text><rect x="20" y="190" width="400" height="48" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><circle cx="44" cy="214" r="13" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="44" y="219" font-size="14" text-anchor="middle">4</text></g><text x="68" y="220" font-size="15.5" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">She kept working <tspan fill="#0B6FA4" font-weight="700" text-decoration="underline">because the sun was out</tspan>.</text>
</svg>
