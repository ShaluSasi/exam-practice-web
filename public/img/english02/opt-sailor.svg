<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img">
<title>A sailing ship on the waves</title>
<style>
.bob{animation:bob 2.6s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.wv{animation:wv 3s ease-in-out infinite}@keyframes wv{0%,100%{transform:translateX(0)}50%{transform:translateX(-8px)}}
