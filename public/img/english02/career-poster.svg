<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" role="img">
<title>A school poster announcing an event</title>
<style>
.bob{animation:bob 2.6s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="14" y="12" width="272" height="376" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3"/><rect x="22" y="20" width="256" height="360" rx="6" fill="none" stroke="#FF8A1F" stroke-width="2" stroke-dasharray="6 4"/>
<g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="150" y="42" font-size="15" text-anchor="middle">Green Valley Public School</text><text x="150" y="60" font-size="12" text-anchor="middle" fill="#6B6F8A">announces</text></g>
<rect x="44" y="70" width="212" height="38" rx="8" fill="#0B93D4"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="150" y="97" font-size="24" text-anchor="middle" fill="#FFFFFF">CAREER MELA</text></g>
<g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="150" y="126" font-size="12" text-anchor="middle" fill="#6B6F8A">to help students explore careers</text></g>
<g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="150" y="152" font-size="13" text-anchor="middle">25 February • 9 a.m. to 6 p.m.</text></g>
<g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="150" y="176" font-size="13" text-anchor="middle">School Auditorium, Main Campus</text></g>
<rect x="40" y="190" width="220" height="80" rx="8" fill="#FFF3D6" stroke="#E0A520" stroke-width="1.5"/>
<g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="52" y="210" font-size="13">Highlights:</text><text x="58" y="230" font-size="12">• Guidance on all streams</text><text x="58" y="246" font-size="12">• Expert counsellors</text><text x="58" y="262" font-size="12">• Talks with professionals</text></g>
<g class="bob"><path d="M36 284H264L254 300L264 316H36L46 300Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="150" y="305" font-size="14" text-anchor="middle" fill="#FFFFFF">Dream it. Plan it. Be it!</text></g></g>
<g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="150" y="340" font-size="14" text-anchor="middle">Entry: Free</text></g>
<g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="150" y="366" font-size="11" text-anchor="middle" fill="#6B6F8A">Sponsored by City Book House</text></g>
</svg>
