@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g class="bob" style="animation-delay:0s"><rect x="31" y="44" width="70" height="52" rx="10" fill="#FFF3C4" stroke="#2B2F4A" stroke-width="2"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="66" y="77" font-size="18" text-anchor="middle">Each</text></g></g><g class="bob" style="animation-delay:0.25s"><rect x="113" y="44" width="70" height="52" rx="10" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="148" y="77" font-size="18" text-anchor="middle">girl</text></g></g><g class="bob" style="animation-delay:0.5s"><rect x="195" y="44" width="103" height="52" rx="10" fill="#DDF3DF" stroke="#2B2F4A" stroke-width="2"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="246.5" y="77" font-size="18" text-anchor="middle">carried</text></g></g><g class="bob" style="animation-delay:0.75s"><rect x="310" y="44" width="59" height="52" rx="10" fill="#FDE2E2" stroke="#2B2F4A" stroke-width="2"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="339.5" y="77" font-size="18" text-anchor="middle">her</text></g></g><g class="bob" style="animation-delay:1s"><rect x="42" y="136" width="92" height="52" rx="10" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="88" y="169" font-size="18" text-anchor="middle">basket</text></g></g><g class="bob" style="animation-delay:1.25s"><rect x="146" y="136" width="48" height="52" rx="10" fill="#DDF3DF" stroke="#2B2F4A" stroke-width="2"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="170" y="169" font-size="18" text-anchor="middle">to</text></g></g><g class="bob" style="animation-delay:1.5s"><rect x="206" y="136" width="59" height="52" rx="10" fill="#FDE2E2" stroke="#2B2F4A" stroke-width="2"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="235.5" y="169" font-size="18" text-anchor="middle">the</text></g></g><g class="bob" style="animation-delay:1.75s"><rect x="277" y="136" width="81" height="52" rx="10" fill="#FFF3C4" stroke="#2B2F4A" stroke-width="2"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" ><text x="317.5" y="169" font-size="18" text-anchor="middle">shed.</text></g></g>
</svg>
