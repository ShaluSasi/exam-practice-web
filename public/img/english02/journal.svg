<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" role="img">
<title>An open notebook being written in, with thought bubbles of hobbies</title>
<style>
.wr{animation:wr 3s ease-in-out infinite}@keyframes wr{0%{stroke-dashoffset:90}60%,100%{stroke-dashoffset:0}}.pn{animation:pn 3s ease-in-out infinite}@keyframes pn{0%,100%{transform:translate(0,0)}50%{transform:translate(-8px,4px)}}.bob{animation:bob 2.6s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
