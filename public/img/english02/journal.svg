<g class="bob"><circle cx="78" cy="40" r="24" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><path d="M66 46Q62 30 78 28Q94 30 92 42Q90 50 82 46Q76 44 74 50Q70 52 66 46Z" fill="#F6C453" stroke="#2B2F4A" stroke-width="1.5"/><circle cx="74" cy="36" r="2.5" fill="#E5484D"/><circle cx="84" cy="34" r="2.5" fill="#0B93D4"/></g>
