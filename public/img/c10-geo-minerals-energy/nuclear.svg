" height="55" rx="8" fill="#B8BED6" stroke="#2B2F4A" stroke-width="3" /><g class="up"><path d="M60 148q-8 -8 0 -16" fill="none" stroke="#DDDDDD" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></g><g class="up" style="animation-delay:.8s"><path d="M85 148q-8 -8 0 -16" fill="none" stroke="#DDDDDD" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M110 170H160" fill="none" stroke="#B8D8F0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><rect x="160" y="150" width="70" height="50" rx="8" fill="#B8BED6" stroke="#2B2F4A" stroke-width="3" /><g class="sp" style="transform-origin:195px 175px"><polygon points="195,175 191.8,157.3 196.8,157.1" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" /><polygon points="195,175 212.7,171.8 212.9,176.8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" /><polygon points="195,175 198.2,192.7 193.2,192.9" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" /><polygon points="195,175 177.3,178.2 177.1,173.2" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" /><circle cx="195" cy="175" r="2.3" fill="#2B2F4A" /></g><line x1="230" y1="175" x2="260" y2="175" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><circle cx="285" cy="172" r="18" fill="#FFE98A" stroke="#2B2F4A" stroke-width="3" class="pu"/><rect x="276" y="187.3" width="18" height="10.8" rx="2" fill="#B8BED6" stroke="#2B2F4A" stroke-width="2.5" /><text x="70" y="222" font-size="12" text-anchor="middle" >steam</text><text x="195" y="222" font-size="12" text-anchor="middle" >turbine</text><text x="285" y="222" font-size="12" text-anchor="middle" >power</text></svg>
