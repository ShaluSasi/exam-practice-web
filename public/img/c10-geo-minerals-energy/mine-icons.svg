<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Four minerals</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.fl{stroke-dasharray:8 8;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.up{animation:up 2.2s linear infinite}@keyframes up{0%{transform:translateY(0);opacity:0}25%{opacity:1}100%{transform:translateY(-34px);opacity:0}}.sp{animation:sp 3s linear infinite;transform-box:view-box}@keyframes sp{to{transform:rotate(360deg)}}.dn{animation:dn 2.2s linear infinite}@keyframes dn{0%{transform:translateY(-6px);opacity:0}25%{opacity:1}100%{transform:translateY(26px);opacity:0}}.sw{animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="10" y="40" width="88" height="150" rx="12" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" /><text x="54" y="212" font-size="13" text-anchor="middle" >iron ore</text><rect x="108" y="40" width="88" height="150" rx="12" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" /><text x="152" y="212" font-size="13" text-anchor="middle" >copper</text><rect x="206" y="40" width="88" height="150" rx="12" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" /><text x="250" y="212" font-size="13" text-anchor="middle" >bauxite</text><rect x="304" y="40" width="88" height="150" rx="12" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" /><text x="348" y="212" font-size="13" text-anchor="middle" >mica</text><polygon points="22,130 34,90 62,80 85,110 78,145 40,150" fill="#8E5A3C" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><polygon points="34,112 50,100 60,118" fill="#C77B52" /><ellipse cx="143" cy="95" rx="28" ry="9" fill="none" stroke="#C86B3C" stroke-width="5"/><ellipse cx="143" cy="111" rx="28" ry="9" fill="none" stroke="#C86B3C" stroke-width="5"/><ellipse cx="143" cy="127" rx="28" ry="9" fill="none" stroke="#C86B3C" stroke-width="5"/><ellipse cx="143" cy="143" rx="28" ry="9" fill="none" stroke="#C86B3C" stroke-width="5"/><polygon points="218,140 225,100 255,88 272,115 265,148 236,152" fill="#D2653A" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><circle cx="246" cy="118" r="5" fill="#EE9A6E" /><polygon points="318,130 362,130 370,112 326,112" fill="#C8E6F7" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" /><polygon points="323,116 367,116 375,98 331,98" fill="#F5E6B0" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" /><polygon points="328,102 372,102 380,84 336,84" fill="#D8F0D0" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" /><polygon points="333,88 377,88 385,70 341,70" fill="#F7D4D4" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" /></svg>
