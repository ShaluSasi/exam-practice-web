<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Thin plates of mica peeling apart, beside a plug and wire</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.fl{stroke-dasharray:8 8;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.up{animation:up 2.2s linear infinite}@keyframes up{0%{transform:translateY(0);opacity:0}25%{opacity:1}100%{transform:translateY(-34px);opacity:0}}.sp{animation:sp 3s linear infinite;transform-box:view-box}@keyframes sp{to{transform:rotate(360deg)}}.dn{animation:dn 2.2s linear infinite}@keyframes dn{0%{transform:translateY(-6px);opacity:0}25%{opacity:1}100%{transform:translateY(26px);opacity:0}}.sw{animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g class=""><polygon points="60,170 200,170 230,140 90,140" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" /></g><g class=""><polygon points="60,156 200,156 230,126 90,126" fill="#F7E9C0" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" /></g><g class=""><polygon points="60,142 200,142 230,112 90,112" fill="#E6F4D8" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" /></g><g class=""><polygon points="60,128 200,128 230,98 90,98" fill="#F8DADA" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" /></g><g class="sw"><polygon points="60,114 200,114 230,84 90,84" fill="#DDEBFA" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" /></g><rect x="270" y="110" width="60" height="56" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><line x1="285" y1="110" x2="285" y2="90" stroke="#8A8FB0" stroke-width="6" stroke-linecap="round" /><line x1="315" y1="110" x2="315" y2="90" stroke="#8A8FB0" stroke-width="6" stroke-linecap="round" /><line x1="300" y1="166" x2="300" y2="205" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><text x="140" y="205" font-size="12" text-anchor="middle" >splits into thin sheets</text><text x="300" y="225" font-size="12" text-anchor="middle" >insulates</text></svg>
