<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Five non-conventional energy sources</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.fl{stroke-dasharray:8 8;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.up{animation:up 2.2s linear infinite}@keyframes up{0%{transform:translateY(0);opacity:0}25%{opacity:1}100%{transform:translateY(-34px);opacity:0}}.sp{animation:sp 3s linear infinite;transform-box:view-box}@keyframes sp{to{transform:rotate(360deg)}}.dn{animation:dn 2.2s linear infinite}@keyframes dn{0%{transform:translateY(-6px);opacity:0}25%{opacity:1}100%{transform:translateY(26px);opacity:0}}.sw{animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="6" y="40" width="72" height="140" rx="12" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" /><text x="42" y="202" font-size="11" text-anchor="middle" >Solar</text><rect x="85" y="40" width="72" height="140" rx="12" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" /><text x="121" y="202" font-size="11" text-anchor="middle" >Wind</text><rect x="164" y="40" width="72" height="140" rx="12" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="202" font-size="11" text-anchor="middle" >Biogas</text><rect x="243" y="40" width="72" height="140" rx="12" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" /><text x="279" y="202" font-size="11" text-anchor="middle" >Tidal</text><rect x="322" y="40" width="72" height="140" rx="12" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" /><text x="358" y="202" font-size="11" text-anchor="middle" >Geothermal</text><circle cx="42" cy="78" r="14" fill="#FFD43B" stroke="#2B2F4A" stroke-width="2.5" class="pu"/><polygon points="18,150 66,150 72,120 24,120" fill="#2B5FA8" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" /><line x1="42" y1="120" x2="42" y2="150" stroke="#8FB6E8" stroke-width="2" stroke-linecap="round" /><line x1="121" y1="160" x2="121" y2="100" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><g class="sp" style="transform-origin:121px 92px"><polygon points="121,92 115.6,62.5 124,62.1" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" /><polygon points="121,92 149.2,102.1 145.4,109.5" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" /><polygon points="121,92 98.1,111.4 93.7,104.3" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" /><circle cx="121" cy="92" r="3.9" fill="#2B2F4A" /></g><path d="M174 150V125a26 26 0 0 1 52 0V150Z" fill="#B8BED6" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><line x1="200" y1="99" x2="200" y2="80" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><g class="up"><path d="M200 78q-8 -8 0 -16" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="274" y="90" width="10" height="70" rx="2" fill="#8A8FB0" stroke="#2B2F4A" stroke-width="2.5" /><path d="M246 140q8 -8 16 0t16 0M287 140q8 -8 16 0" fill="none" stroke="#0B93D4" stroke-width="3.5" class="fl"/><rect x="276" y="98" width="6" height="22" rx="2" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" /><polygon points="328,150 388,150 388,165 328,165" fill="#E2723A" /><g class="up"><path d="M358 140q-8 -8 0 -16q8 -8 0 -16" fill="none" stroke="#BBBBBB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></g><g class="up" style="animation-delay:.9s"><path d="M372 140q-8 -8 0 -16" fill="none" stroke="#BBBBBB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></g></svg>
