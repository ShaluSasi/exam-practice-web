<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img">
<title>Cracks in hard rock filled with mineral</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.fl{stroke-dasharray:8 8;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.up{animation:up 2.2s linear infinite}@keyframes up{0%{transform:translateY(0);opacity:0}25%{opacity:1}100%{transform:translateY(-34px);opacity:0}}.sp{animation:sp 3s linear infinite;transform-box:view-box}@keyframes sp{to{transform:rotate(360deg)}}.dn{animation:dn 2.2s linear infinite}@keyframes dn{0%{transform:translateY(-6px);opacity:0}25%{opacity:1}100%{transform:translateY(26px);opacity:0}}.sw{animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<polygon points="10,40 190,40 190,140 10,140" fill="#B9A9D6" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><polyline points="50,140 70,100 95,80 85,45" fill="none" stroke="#F2B01E" stroke-width="5" stroke-linecap="round"/><polyline points="130,140 150,110 140,70 160,45" fill="none" stroke="#F2B01E" stroke-width="4" stroke-linecap="round"/></svg>
