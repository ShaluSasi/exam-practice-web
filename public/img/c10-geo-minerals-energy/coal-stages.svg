<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Four kinds of coal from soft to hard</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.fl{stroke-dasharray:8 8;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.up{animation:up 2.2s linear infinite}@keyframes up{0%{transform:translateY(0);opacity:0}25%{opacity:1}100%{transform:translateY(-34px);opacity:0}}.sp{animation:sp 3s linear infinite;transform-box:view-box}@keyframes sp{to{transform:rotate(360deg)}}.dn{animation:dn 2.2s linear infinite}@keyframes dn{0%{transform:translateY(-6px);opacity:0}25%{opacity:1}100%{transform:translateY(26px);opacity:0}}.sw{animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<polygon points="14,140 24,90 54,70 86,92 92,140" fill="#8B6B43" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><polygon points="36,100 52,86 62,104" fill="#D9B97E" /><text x="53" y="168" font-size="12" text-anchor="middle" >Peat</text><polygon points="110,140 120,90 150,70 182,92 188,140" fill="#6B4A2B" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><polygon points="132,100 148,86 158,104" fill="#8E6A44" /><text x="149" y="168" font-size="12" text-anchor="middle" >Lignite</text><polygon points="206,140 216,90 246,70 278,92 284,140" fill="#2F2F3A" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><polygon points="228,100 244,86 254,104" fill="#55556A" /><text x="245" y="168" font-size="12" text-anchor="middle" >Bituminous</text><polygon points="302,140 312,90 342,70 374,92 380,140" fill="#0E0E18" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><polygon points="324,100 340,86 350,104" fill="#8A8FB0" /><text x="341" y="168" font-size="12" text-anchor="middle" >Anthracite</text><line x1="20" y1="205" x2="360" y2="205" stroke="#E5484D" stroke-width="4" stroke-linecap="round" /><polygon points="0,0 -11.7,-5.9 -11.7,5.9" fill="#E5484D" transform="translate(372 205) rotate(0.0)"/><text x="195" y="226" font-size="12" text-anchor="middle" >more burial, heat and squeezing</text></svg>
