<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Iron ore, coal and limestone loaded into a blast furnace</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.fl{stroke-dasharray:8 8;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.up{animation:up 2.2s linear infinite}@keyframes up{0%{transform:translateY(0);opacity:0}25%{opacity:1}100%{transform:translateY(-34px);opacity:0}}.sp{animation:sp 3s linear infinite;transform-box:view-box}@keyframes sp{to{transform:rotate(360deg)}}.dn{animation:dn 2.2s linear infinite}@keyframes dn{0%{transform:translateY(-6px);opacity:0}25%{opacity:1}100%{transform:translateY(26px);opacity:0}}.sw{animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<polygon points="160,50 240,50 262,190 138,190" fill="#B8BED6" stroke="#2B2F4A" stroke-width="3.5" stroke-linejoin="round" /><rect x="150" y="190" width="100" height="18" rx="3" fill="#7A7F9F" stroke="#2B2F4A" stroke-width="3" /><polygon points="172,80 228,80 236,140 164,140" fill="#FFB347" /><polygon points="150,200 250,200 230,215 170,215" fill="#E5484D" /><g class="up" style="animation-delay:0.0s"><polygon points="0,0 -9.9,-5 -9.9,5" fill="#E5484D" transform="translate(200 170) rotate(-90.0)"/></g><g class="up" style="animation-delay:0.6s"><polygon points="0,0 -9.9,-5 -9.9,5" fill="#E5484D" transform="translate(200 140) rotate(-90.0)"/></g><g class="up" style="animation-delay:1.2s"><polygon points="0,0 -9.9,-5 -9.9,5" fill="#E5484D" transform="translate(200 110) rotate(-90.0)"/></g><rect x="40" y="40" width="76" height="26" rx="6" fill="#8E5A3C" stroke="#2B2F4A" stroke-width="3" /><text x="78" y="58" font-size="12" text-anchor="middle" fill="#FFFFFF" >iron ore</text><rect x="40" y="74" width="76" height="26" rx="6" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="3" /><text x="78" y="92" font-size="12" text-anchor="middle" fill="#FFFFFF" >coal</text><rect x="40" y="108" width="76" height="26" rx="6" fill="#F1F1F1" stroke="#2B2F4A" stroke-width="3" /><text x="78" y="126" font-size="12" text-anchor="middle" >limestone</text><path d="M120 80C140 80 150 62 168 56" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><polygon points="0,0 -9,-4.5 -9,4.5" fill="#FF8A1F" transform="translate(168 56) rotate(-20.0)"/><text x="320" y="130" font-size="12" text-anchor="middle" >hot air</text><text x="320" y="214" font-size="12" text-anchor="middle" >molten iron</text></svg>
