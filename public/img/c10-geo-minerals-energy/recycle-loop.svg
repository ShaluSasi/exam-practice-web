<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A loop: metal goods, scrap, new metal</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.fl{stroke-dasharray:8 8;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.up{animation:up 2.2s linear infinite}@keyframes up{0%{transform:translateY(0);opacity:0}25%{opacity:1}100%{transform:translateY(-34px);opacity:0}}.sp{animation:sp 3s linear infinite;transform-box:view-box}@keyframes sp{to{transform:rotate(360deg)}}.dn{animation:dn 2.2s linear infinite}@keyframes dn{0%{transform:translateY(-6px);opacity:0}25%{opacity:1}100%{transform:translateY(26px);opacity:0}}.sw{animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g class="pu" style="animation-delay:0.0s"><path d="M226.2 60.1A70 70 0 0 1 269.3 134.7" fill="none" stroke="#3FA34D" stroke-width="6" stroke-linecap="round"/><polygon points="0,0 -12.6,-6.3 -12.6,6.3" fill="#3FA34D" transform="translate(269.3 134.7) rotate(106.0)"/></g><g class="pu" style="animation-delay:0.5s"><path d="M243.1 180.2A70 70 0 0 1 156.9 180.2" fill="none" stroke="#3FA34D" stroke-width="6" stroke-linecap="round"/><polygon points="0,0 -12.6,-6.3 -12.6,6.3" fill="#3FA34D" transform="translate(156.9 180.2) rotate(226.0)"/></g><g class="pu" style="animation-delay:1.0s"><path d="M130.7 134.7A70 70 0 0 1 173.8 60.1" fill="none" stroke="#3FA34D" stroke-width="6" stroke-linecap="round"/><polygon points="0,0 -12.6,-6.3 -12.6,6.3" fill="#3FA34D" transform="translate(173.8 60.1) rotate(346.0)"/></g><text x="200" y="130" font-size="15" text-anchor="middle" >reuse</text><rect x="148" y="15" width="104" height="28" rx="12" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5" /><text x="200" y="35" font-size="12" text-anchor="middle" >metal goods</text><rect x="248" y="190" width="104" height="28" rx="12" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5" /><text x="300" y="210" font-size="12" text-anchor="middle" >scrap metal</text><rect x="48" y="190" width="104" height="28" rx="12" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5" /><text x="100" y="210" font-size="12" text-anchor="middle" >new metal</text></svg>
