-width="1.5"/></g><g class="pu" style="animation-delay:1.2s"><path d="M215 76L218 82L224 85L218 88L215 94L212 88L206 85L212 82Z" fill="#FFD43B" stroke="#2B2F4A" stroke-width="1.5"/></g><text x="200" y="28" font-size="13" text-anchor="middle" >Naturally formed crystals, all the same substance</text></svg>
