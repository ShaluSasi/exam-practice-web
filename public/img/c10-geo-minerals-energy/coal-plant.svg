<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A coal mine next to a thermal power station</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.fl{stroke-dasharray:8 8;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.up{animation:up 2.2s linear infinite}@keyframes up{0%{transform:translateY(0);opacity:0}25%{opacity:1}100%{transform:translateY(-34px);opacity:0}}.sp{animation:sp 3s linear infinite;transform-box:view-box}@keyframes sp{to{transform:rotate(360deg)}}.dn{animation:dn 2.2s linear infinite}@keyframes dn{0%{transform:translateY(-6px);opacity:0}25%{opacity:1}100%{transform:translateY(26px);opacity:0}}.sw{animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<polygon points="0,185 400,185 400,240 0,240" fill="#B59A68" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><polygon points="0,185 110,185 100,120 40,100 0,120" fill="#8E7A55" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><rect x="40" y="70" width="36" height="55" rx="3" fill="#8A8FB0" stroke="#2B2F4A" stroke-width="3" /><line x1="58" y1="70" x2="58" y2="50" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><circle cx="58" cy="48" r="8" fill="#B8BED6" stroke="#2B2F4A" stroke-width="2.5" /><rect x="28" y="160" width="60" height="25" rx="4" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="3" /><rect x="210" y="120" width="90" height="65" rx="4" fill="#E8E3F0" stroke="#2B2F4A" stroke-width="3" /><rect x="305" y="60" width="24" height="125" rx="3" fill="#B8BED6" stroke="#2B2F4A" stroke-width="3" /><line x1="305" y1="85" x2="329" y2="85" stroke="#E5484D" stroke-width="4" stroke-linecap="round" /><line x1="305" y1="105" x2="329" y2="105" stroke="#E5484D" stroke-width="4" stroke-linecap="round" /><g class="up" style="animation-delay:0.0s"><circle cx="317" cy="50" r="10" fill="#BFBFBF" opacity=".8"/></g><g class="up" style="animation-delay:0.7s"><circle cx="317" cy="50" r="12" fill="#BFBFBF" opacity=".8"/></g><g class="up" style="animation-delay:1.4s"><circle cx="317" cy="50" r="14" fill="#BFBFBF" opacity=".8"/></g><line x1="90" y1="192" x2="215" y2="192" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 6" /><g class="sw"><rect x="100" y="170" width="44" height="18" rx="3" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="3" /><circle cx="110" cy="192" r="6" fill="#2B2F4A" /><circle cx="134" cy="192" r="6" fill="#2B2F4A" /></g><text x="60" y="218" font-size="13" text-anchor="middle" >coalfield</text><text x="255" y="218" font-size="13" text-anchor="middle" >thermal station</text></svg>
