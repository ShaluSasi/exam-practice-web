<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A coil of copper wire lighting a bulb</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.fl{stroke-dasharray:8 8;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.up{animation:up 2.2s linear infinite}@keyframes up{0%{transform:translateY(0);opacity:0}25%{opacity:1}100%{transform:translateY(-34px);opacity:0}}.sp{animation:sp 3s linear infinite;transform-box:view-box}@keyframes sp{to{transform:rotate(360deg)}}.dn{animation:dn 2.2s linear infinite}@keyframes dn{0%{transform:translateY(-6px);opacity:0}25%{opacity:1}100%{transform:translateY(26px);opacity:0}}.sw{animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<ellipse cx="90" cy="150" rx="48" ry="20" fill="none" stroke="#C86B3C" stroke-width="7"/><ellipse cx="90" cy="136" rx="48" ry="20" fill="none" stroke="#C86B3C" stroke-width="7"/><ellipse cx="90" cy="122" rx="48" ry="20" fill="none" stroke="#C86B3C" stroke-width="7"/><ellipse cx="90" cy="108" rx="48" ry="20" fill="none" stroke="#C86B3C" stroke-width="7"/><ellipse cx="90" cy="94" rx="48" ry="20" fill="none" stroke="#C86B3C" stroke-width="7"/><path d="M138 140C190 140 200 70 250 70" fill="none" stroke="#C86B3C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><path d="M138 140C190 140 200 70 250 70" fill="none" stroke="#FFD9A8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="fl"/><path d="M42 140C20 160 20 200 60 200H330" fill="none" stroke="#C86B3C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><circle cx="310" cy="75" r="36" fill="#FFE98A" stroke="#2B2F4A" stroke-width="3" class="pu"/><rect x="294" y="108" width="32" height="20" rx="3" fill="#B8BED6" stroke="#2B2F4A" stroke-width="3" /><line x1="250" y1="70" x2="274" y2="72" stroke="#C86B3C" stroke-width="6" stroke-linecap="round" /><line x1="310" y1="128" x2="310" y2="200" stroke="#C86B3C" stroke-width="6" stroke-linecap="round" /><text x="90" y="224" font-size="14" text-anchor="middle" >copper</text></svg>
