<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Three things that decide whether a mineral deposit is mined</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.fl{stroke-dasharray:8 8;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.up{animation:up 2.2s linear infinite}@keyframes up{0%{transform:translateY(0);opacity:0}25%{opacity:1}100%{transform:translateY(-34px);opacity:0}}.sp{animation:sp 3s linear infinite;transform-box:view-box}@keyframes sp{to{transform:rotate(360deg)}}.dn{animation:dn 2.2s linear infinite}@keyframes dn{0%{transform:translateY(-6px);opacity:0}25%{opacity:1}100%{transform:translateY(26px);opacity:0}}.sw{animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="12" y="30" width="116" height="160" rx="12" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" /><text x="70" y="210" font-size="13" text-anchor="middle" >rich ore</text><rect x="142" y="30" width="116" height="160" rx="12" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="210" font-size="13" text-anchor="middle" >easy to dig</text><rect x="272" y="30" width="116" height="160" rx="12" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" /><text x="330" y="210" font-size="13" text-anchor="middle" >near buyers</text><polygon points="30,140 45,80 95,78 110,140" fill="#B7AFA0" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><circle cx="55" cy="100" r="5" fill="#FFC933" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="70" cy="120" r="5" fill="#FFC933" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="85" cy="100" r="5" fill="#FFC933" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="65" cy="90" r="5" fill="#FFC933" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="90" cy="125" r="5" fill="#FFC933" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="48" cy="125" r="5" fill="#FFC933" stroke="#2B2F4A" stroke-width="1.5" /><polygon points="150,150 185,90 222,150" fill="#D2B27C" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><rect x="176" y="118" width="18" height="32" rx="4" fill="#0F1226" /><line x1="150" y1="150" x2="222" y2="150" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><g class="sw"><line x1="232" y1="126" x2="250" y2="138" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /></g><rect x="300" y="100" width="76" height="50" rx="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><polygon points="296,100 380,100 368,80 308,80" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><rect x="322" y="120" width="20" height="30" rx="2" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" /><g class="sw"><rect x="268" y="150" width="30" height="14" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="276" cy="168" r="5" fill="#2B2F4A" /><circle cx="292" cy="168" r="5" fill="#2B2F4A" /></g></svg>
