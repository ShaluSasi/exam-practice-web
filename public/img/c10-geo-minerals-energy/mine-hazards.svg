<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Dangers and damage around a mine</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.fl{stroke-dasharray:8 8;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.up{animation:up 2.2s linear infinite}@keyframes up{0%{transform:translateY(0);opacity:0}25%{opacity:1}100%{transform:translateY(-34px);opacity:0}}.sp{animation:sp 3s linear infinite;transform-box:view-box}@keyframes sp{to{transform:rotate(360deg)}}.dn{animation:dn 2.2s linear infinite}@keyframes dn{0%{transform:translateY(-6px);opacity:0}25%{opacity:1}100%{transform:translateY(26px);opacity:0}}.sw{animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}.fire{animation:fire .9s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}@keyframes fire{50%{transform:scale(1.2,.85)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<polygon points="0,110 150,110 210,70 400,70 400,190 0,190" fill="#D2B27C" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><polygon points="0,190 400,190 400,240 0,240" fill="#B59A68" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><polygon points="60,190 60,145 90,120 120,145 120,190" fill="#0F1226" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><line x1="60" y1="150" x2="60" y2="190" stroke="#8E5A3C" stroke-width="6" stroke-linecap="round" /><line x1="120" y1="150" x2="120" y2="190" stroke="#8E5A3C" stroke-width="6" stroke-linecap="round" /><line x1="56" y1="148" x2="124" y2="148" stroke="#8E5A3C" stroke-width="6" stroke-linecap="round" /><polygon points="80,170 94,166 96,180 82,182" fill="#8A8FB0" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" /><polygon points="98,180 112,176 114,190 100,192" fill="#8A8FB0" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" /><polygon points="108,168 122,164 124,178 110,180" fill="#8A8FB0" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" /><g class="up" style="animation-delay:0.0s"><circle cx="160" cy="90" r="18" fill="#BFBFBF" opacity=".75"/></g><g class="up" style="animation-delay:0.5s"><circle cx="190" cy="75" r="22" fill="#BFBFBF" opacity=".75"/></g><g class="up" style="animation-delay:1.0s"><circle cx="225" cy="85" r="17" fill="#BFBFBF" opacity=".75"/></g><g class="up" style="animation-delay:1.5s"><circle cx="255" cy="70" r="20" fill="#BFBFBF" opacity=".75"/></g><g class="fire"><path d="M300 190C280 165 305 160 300 130C325 150 335 170 322 190Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M0 210Q60 200 120 212T240 210T400 212" fill="none" stroke="#8B6B3A" stroke-width="12" class="fl" stroke-linecap="round" opacity=".8"/><text x="200" y="236" font-size="12" text-anchor="middle" >dust, fires, falling roofs, dirty water</text></svg>
