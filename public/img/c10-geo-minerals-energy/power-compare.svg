<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Hydro and thermal routes to the same electricity</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.fl{stroke-dasharray:8 8;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.up{animation:up 2.2s linear infinite}@keyframes up{0%{transform:translateY(0);opacity:0}25%{opacity:1}100%{transform:translateY(-34px);opacity:0}}.sp{animation:sp 3s linear infinite;transform-box:view-box}@keyframes sp{to{transform:rotate(360deg)}}.dn{animation:dn 2.2s linear infinite}@keyframes dn{0%{transform:translateY(-6px);opacity:0}25%{opacity:1}100%{transform:translateY(26px);opacity:0}}.sw{animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="10" y="30" width="180" height="150" rx="12" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" /><rect x="210" y="30" width="180" height="150" rx="12" fill="#FFE9D6" stroke="#2B2F4A" stroke-width="3" /><path d="M60 50q10 30 0 50" fill="none" stroke="#0B93D4" stroke-width="6" class="fl" stroke-linecap="round"/><path d="M85 50q10 30 0 50" fill="none" stroke="#0B93D4" stroke-width="6" class="fl" stroke-linecap="round"/><g class="sp" style="transform-origin:75px 125px"><polygon points="75,125 70.3,99.4 77.6,99.1" fill="#B8BED6" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><polygon points="75,125 100.6,120.3 100.9,127.6" fill="#B8BED6" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><polygon points="75,125 79.7,150.6 72.4,150.9" fill="#B8BED6" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><polygon points="75,125 49.4,129.7 49.1,122.4" fill="#B8BED6" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><circle cx="75" cy="125" r="3.4" fill="#2B2F4A" /></g><path d="M285 160c-25 -20 5 -35 -5 -60c35 25 45 45 25 60z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="pu"/><rect x="255" y="50" width="80" height="24" rx="4" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="3" /><rect x="250" y="168" width="90" height="10" rx="3" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" /><text x="100" y="200" font-size="13" text-anchor="middle" >running water</text><text x="300" y="200" font-size="13" text-anchor="middle" >burning fuel</text><text x="200" y="226" font-size="12" text-anchor="middle" >Either way, the electricity is the same</text></svg>
