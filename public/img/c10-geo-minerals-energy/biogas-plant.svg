<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Cross-section of a village biogas plant</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.fl{stroke-dasharray:8 8;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.up{animation:up 2.2s linear infinite}@keyframes up{0%{transform:translateY(0);opacity:0}25%{opacity:1}100%{transform:translateY(-34px);opacity:0}}.sp{animation:sp 3s linear infinite;transform-box:view-box}@keyframes sp{to{transform:rotate(360deg)}}.dn{animation:dn 2.2s linear infinite}@keyframes dn{0%{transform:translateY(-6px);opacity:0}25%{opacity:1}100%{transform:translateY(26px);opacity:0}}.sw{animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="0" y="0" width="400" height="240" rx="0" fill="#EAF6FD" /><rect x="0" y="130" width="400" height="110" rx="0" fill="#C9A36A" /><line x1="0" y1="130" x2="400" y2="130" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><rect x="125" y="135" width="130" height="85" rx="16" fill="#E8D3A8" stroke="#2B2F4A" stroke-width="3.5" /><rect x="131" y="160" width="118" height="54" rx="12" fill="#8B6B3A" /><g class="dn"><circle cx="160" cy="160" r="3" fill="#5B4528" /></g><g class="dn" style="animation-delay:.9s"><circle cx="200" cy="160" r="3" fill="#5B4528" /></g><path d="M150 130a40 36 0 0 1 80 0Z" fill="#B8BED6" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" /><g class="up"><path d="M190 100q-8 -8 0 -16" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><polygon points="30,100 80,100 66,126 44,126" fill="#E8D3A8" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><path d="M55 126L55 150L130 175" fill="none" stroke="#6B6F8F" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><path d="M55 126L55 150L130 175" fill="none" stroke="#E8D3A8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="fl"/><path d="M190 94V60H318V100" fill="none" stroke="#6B6F8F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><rect x="298" y="108" width="44" height="22" rx="3" fill="#8A8FB0" stroke="#2B2F4A" stroke-width="3" /><g class="pu"><path d="M320 106c-10 -8 4 -12 0 -22c12 8 14 16 0 22z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M255 190H300" fill="none" stroke="#6B6F8F" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><rect x="298" y="178" width="76" height="42" rx="4" fill="#8B6B3A" stroke="#2B2F4A" stroke-width="3" /><path d="M262 100l20 -30M270 100l16 -22" fill="none" stroke="#2B2F4A" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /></svg>
