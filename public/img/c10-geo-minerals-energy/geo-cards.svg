<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Four rock settings and what they hold</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.fl{stroke-dasharray:8 8;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.up{animation:up 2.2s linear infinite}@keyframes up{0%{transform:translateY(0);opacity:0}25%{opacity:1}100%{transform:translateY(-34px);opacity:0}}.sp{animation:sp 3s linear infinite;transform-box:view-box}@keyframes sp{to{transform:rotate(360deg)}}.dn{animation:dn 2.2s linear infinite}@keyframes dn{0%{transform:translateY(-6px);opacity:0}25%{opacity:1}100%{transform:translateY(26px);opacity:0}}.sw{animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="10" y="28" width="82" height="150" rx="10" fill="#B9A9D6" stroke="#2B2F4A" stroke-width="3" /><text x="51" y="198" font-size="11" text-anchor="middle" >Hard old rocks</text><rect x="110" y="28" width="82" height="150" rx="10" fill="#E8D3A8" stroke="#2B2F4A" stroke-width="3" /><text x="151" y="198" font-size="11" text-anchor="middle" >Rock flanks</text><rect x="210" y="28" width="82" height="150" rx="10" fill="#BFE3B4" stroke="#2B2F4A" stroke-width="3" /><text x="251" y="198" font-size="11" text-anchor="middle" >River plains</text><rect x="310" y="28" width="82" height="150" rx="10" fill="#F2CFA0" stroke="#2B2F4A" stroke-width="3" /><text x="351" y="198" font-size="11" text-anchor="middle" >Dry rock land</text><polygon points="30,100 50,88 70,100 62,125 38,125" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><polygon points="36,70 46,55 58,70 46,80" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" /><path d="M151 70Q131 105 151 125Q171 105 151 70Z" fill="#2B2F4A" class="pu"/><line x1="122" y1="138" x2="180" y2="138" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-dasharray="5 4" /><path d="M224 70q10 -8 20 0t20 0t20 0" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><path d="M224 90q10 -8 20 0t20 0t20 0" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><path d="M224 110q10 -8 20 0t20 0t20 0" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><path d="M224 130q10 -8 20 0t20 0t20 0" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><ellipse cx="351" cy="100" rx="22" ry="12" fill="none" stroke="#C86B3C" stroke-width="5"/><ellipse cx="351" cy="116" rx="22" ry="12" fill="none" stroke="#C86B3C" stroke-width="5"/><ellipse cx="351" cy="84" rx="22" ry="12" fill="none" stroke="#C86B3C" stroke-width="5"/></svg>
