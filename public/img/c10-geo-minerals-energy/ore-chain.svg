<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Ore carried from a mine by rail to a port and on by ship</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.fl{stroke-dasharray:8 8;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.up{animation:up 2.2s linear infinite}@keyframes up{0%{transform:translateY(0);opacity:0}25%{opacity:1}100%{transform:translateY(-34px);opacity:0}}.sp{animation:sp 3s linear infinite;transform-box:view-box}@keyframes sp{to{transform:rotate(360deg)}}.dn{animation:dn 2.2s linear infinite}@keyframes dn{0%{transform:translateY(-6px);opacity:0}25%{opacity:1}100%{transform:translateY(26px);opacity:0}}.sw{animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<polygon points="0,150 120,150 150,110 170,110 200,150 400,150 400,240 0,240" fill="#D2B27C" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><polygon points="25,150 60,100 95,150" fill="#8A8FB0" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><line x1="60" y1="100" x2="60" y2="150" stroke="#2B2F4A" stroke-width="0" stroke-linecap="round" /><line x1="0" y1="170" x2="220" y2="170" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><g class="sw"><rect x="60" y="152" width="36" height="16" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" /><rect x="100" y="152" width="36" height="16" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="70" cy="172" r="4.5" fill="#2B2F4A" /><circle cx="124" cy="172" r="4.5" fill="#2B2F4A" /></g><rect x="230" y="130" width="170" height="110" rx="0" fill="#0B93D4" /><line x1="230" y1="150" x2="400" y2="150" stroke="#7FD0F5" stroke-width="4" stroke-linecap="round" /><polygon points="250,175 370,175 350,200 270,200" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><rect x="290" y="150" width="40" height="25" rx="3" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><line x1="310" y1="126" x2="310" y2="150" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><polygon points="310,126 330,134 310,140" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" /><line x1="255" y1="168" x2="230" y2="168" stroke="#2B2F4A" stroke-width="0" stroke-linecap="round" /></svg>
