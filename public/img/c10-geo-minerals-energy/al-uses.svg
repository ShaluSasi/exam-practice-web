<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Why aluminium is useful</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.fl{stroke-dasharray:8 8;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.up{animation:up 2.2s linear infinite}@keyframes up{0%{transform:translateY(0);opacity:0}25%{opacity:1}100%{transform:translateY(-34px);opacity:0}}.sp{animation:sp 3s linear infinite;transform-box:view-box}@keyframes sp{to{transform:rotate(360deg)}}.dn{animation:dn 2.2s linear infinite}@keyframes dn{0%{transform:translateY(-6px);opacity:0}25%{opacity:1}100%{transform:translateY(26px);opacity:0}}.sw{animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<polygon points="30,170 45,120 95,105 125,140 110,180 60,188" fill="#D2653A" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><text x="78" y="215" font-size="13" text-anchor="middle" >bauxite</text><path d="M150 150H175" fill="none" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><polygon points="0,0 -10.8,-5.4 -10.8,5.4" fill="#FF8A1F" transform="translate(185 150) rotate(0.0)"/><rect x="200" y="90" width="56" height="90" rx="10" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" /><text x="228" y="200" font-size="12" text-anchor="middle" >light</text><rect x="260" y="90" width="56" height="90" rx="10" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" /><text x="288" y="200" font-size="12" text-anchor="middle" >strong</text><rect x="320" y="90" width="56" height="90" rx="10" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" /><text x="348" y="200" font-size="12" text-anchor="middle" >conducts</text><g class="bob"><polygon points="214,140 252,120 214,108" fill="#B8BED6" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" /><line x1="214" y1="126" x2="252" y2="126" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /></g><rect x="272" y="110" width="28" height="52" rx="4" fill="#B8BED6" stroke="#2B2F4A" stroke-width="3" /><rect x="280" y="104" width="12" height="8" rx="2" fill="#B8BED6" stroke="#2B2F4A" stroke-width="2" /><path d="M326 135H370" fill="none" stroke="#B8BED6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M326 135H370" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="fl"/></svg>
