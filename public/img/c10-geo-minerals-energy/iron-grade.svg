<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Iron content of two iron ores</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.fl{stroke-dasharray:8 8;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.up{animation:up 2.2s linear infinite}@keyframes up{0%{transform:translateY(0);opacity:0}25%{opacity:1}100%{transform:translateY(-34px);opacity:0}}.sp{animation:sp 3s linear infinite;transform-box:view-box}@keyframes sp{to{transform:rotate(360deg)}}.dn{animation:dn 2.2s linear infinite}@keyframes dn{0%{transform:translateY(-6px);opacity:0}25%{opacity:1}100%{transform:translateY(26px);opacity:0}}.sw{animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="24" font-size="14" text-anchor="middle" >Iron content of the ore (per cent)</text><text x="110" y="94" font-size="13" text-anchor="end" >Magnetite</text><rect x="120" y="70" width="210" height="36" rx="4" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" class="pu"/><text x="336" y="94" font-size="13" text-anchor="start" >up to 70</text><text x="110" y="164" font-size="13" text-anchor="end" >Hematite</text><rect x="120" y="140" width="150" height="36" rx="4" fill="#EFE7D4" stroke="#2B2F4A" stroke-width="2" stroke-dasharray="5 4"/><rect x="270" y="140" width="30" height="36" rx="4" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" class="pu"/><text x="306" y="164" font-size="13" text-anchor="start" >50-60</text><line x1="120" y1="190" x2="360" y2="190" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="120" y1="186" x2="120" y2="196" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="120" y="212" font-size="12" text-anchor="middle" >0</text><line x1="180" y1="186" x2="180" y2="196" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="180" y="212" font-size="12" text-anchor="middle" >20</text><line x1="240" y1="186" x2="240" y2="196" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="240" y="212" font-size="12" text-anchor="middle" >40</text><line x1="300" y1="186" x2="300" y2="196" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="300" y="212" font-size="12" text-anchor="middle" >60</text><line x1="360" y1="186" x2="360" y2="196" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="360" y="212" font-size="12" text-anchor="middle" >80</text></svg>
