<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Hot minerals rising through a crack in rock and cooling</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.fl{stroke-dasharray:8 8;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.up{animation:up 2.2s linear infinite}@keyframes up{0%{transform:translateY(0);opacity:0}25%{opacity:1}100%{transform:translateY(-34px);opacity:0}}.sp{animation:sp 3s linear infinite;transform-box:view-box}@keyframes sp{to{transform:rotate(360deg)}}.dn{animation:dn 2.2s linear infinite}@keyframes dn{0%{transform:translateY(-6px);opacity:0}25%{opacity:1}100%{transform:translateY(26px);opacity:0}}.sw{animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<polygon points="0,30 400,30 400,240 0,240" fill="#B9A9D6" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><polygon points="130,240 270,240 250,205 150,205" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><polygon points="190,205 210,205 214,120 200,30 196,30 192,120" fill="#F2B01E" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" /><g class="up" style="animation-delay:0.0s"><polygon points="0,0 -10.8,-5.4 -10.8,5.4" fill="#E5484D" transform="translate(200 190) rotate(-90.0)"/></g><g class="up" style="animation-delay:0.5s"><polygon points="0,0 -10.8,-5.4 -10.8,5.4" fill="#E5484D" transform="translate(200 150) rotate(-90.0)"/></g><g class="up" style="animation-delay:1.0s"><polygon points="0,0 -10.8,-5.4 -10.8,5.4" fill="#E5484D" transform="translate(200 110) rotate(-90.0)"/></g><g class="up" style="animation-delay:1.5s"><polygon points="0,0 -10.8,-5.4 -10.8,5.4" fill="#E5484D" transform="translate(200 70) rotate(-90.0)"/></g><text x="200" y="232" font-size="12" text-anchor="middle" fill="#FFFFFF" >molten minerals</text><rect x="0" y="0" width="400" height="30" fill="#CBE8C8"/><line x1="0" y1="30" x2="400" y2="30" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /></svg>
