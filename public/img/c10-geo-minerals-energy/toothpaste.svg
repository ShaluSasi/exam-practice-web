<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Toothpaste tube and brush with the minerals used in them</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.fl{stroke-dasharray:8 8;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.up{animation:up 2.2s linear infinite}@keyframes up{0%{transform:translateY(0);opacity:0}25%{opacity:1}100%{transform:translateY(-34px);opacity:0}}.sp{animation:sp 3s linear infinite;transform-box:view-box}@keyframes sp{to{transform:rotate(360deg)}}.dn{animation:dn 2.2s linear infinite}@keyframes dn{0%{transform:translateY(-6px);opacity:0}25%{opacity:1}100%{transform:translateY(26px);opacity:0}}.sw{animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g transform="rotate(-18 120 130)"><rect x="40" y="100" width="150" height="54" rx="14" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><rect x="40" y="100" width="52" height="54" rx="14" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" /><rect x="186" y="114" width="22" height="26" rx="4" fill="#BDBDBD" stroke="#2B2F4A" stroke-width="3" /><text x="130" y="133" font-size="14" text-anchor="middle" >PASTE</text></g><rect x="225" y="168" width="150" height="14" rx="7" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><rect x="355" y="150" width="24" height="32" rx="6" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" /><g class="sw"><rect x="222" y="154" width="70" height="14" rx="7" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /></g><g class="pu" style="animation-delay:0.0s"><rect x="214" y="25" width="72" height="28" rx="14" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5" /><text x="250" y="45" font-size="13" text-anchor="middle" >silica</text></g><g class="pu" style="animation-delay:0.5s"><rect x="294" y="47" width="72" height="28" rx="14" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5" /><text x="330" y="67" font-size="13" text-anchor="middle" >fluorite</text></g><g class="pu" style="animation-delay:1.0s"><rect x="216" y="80" width="72" height="28" rx="14" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5" /><text x="252" y="100" font-size="13" text-anchor="middle" >rutile</text></g><g class="pu" style="animation-delay:1.5s"><rect x="302" y="97" width="72" height="28" rx="14" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5" /><text x="338" y="117" font-size="13" text-anchor="middle" >mica</text></g><text x="105" y="215" font-size="13" text-anchor="middle" >Minerals in the paste</text></svg>
