#FFFFFF" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" /><polygon points="262,75 248.2,77.5 248.1,73.6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" /><circle cx="262" cy="75" r="1.8" fill="#2B2F4A" /></g><path d="M205 80H235" fill="none" stroke="#D9D9D9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><circle cx="288" cy="75" r="9" fill="#FFE98A" stroke="#2B2F4A" stroke-width="2.5" /><line x1="305" y1="75" x2="345" y2="75" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="345" y1="45" x2="345" y2="95" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /></svg>
