<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Ages of the two main coal series in India</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.fl{stroke-dasharray:8 8;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-16}}.up{animation:up 2.2s linear infinite}@keyframes up{0%{transform:translateY(0);opacity:0}25%{opacity:1}100%{transform:translateY(-34px);opacity:0}}.sp{animation:sp 3s linear infinite;transform-box:view-box}@keyframes sp{to{transform:rotate(360deg)}}.dn{animation:dn 2.2s linear infinite}@keyframes dn{0%{transform:translateY(-6px);opacity:0}25%{opacity:1}100%{transform:translateY(26px);opacity:0}}.sw{animation:sw 3s ease-in-out infinite}@keyframes sw{50%{transform:translateX(10px)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="26" font-size="14" text-anchor="middle" >Age of coal deposits (million years)</text><text x="40" y="50" font-size="13" text-anchor="start" >Gondwana coal</text><rect x="40" y="56" width="270" height="30" rx="5" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" class="pu"/><text x="316" y="76" font-size="12" text-anchor="start" >a little over 200</text><text x="40" y="114" font-size="13" text-anchor="start" >Tertiary coal</text><rect x="40" y="120" width="74.2" height="30" rx="5" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" class="pu"/><text x="120.2" y="140" font-size="12" text-anchor="start" >about 55</text><line x1="40" y1="190" x2="377.5" y2="190" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="40" y1="186" x2="40" y2="196" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="40" y="212" font-size="12" text-anchor="middle" >0</text><line x1="107.5" y1="186" x2="107.5" y2="196" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="107.5" y="212" font-size="12" text-anchor="middle" >50</text><line x1="175" y1="186" x2="175" y2="196" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="175" y="212" font-size="12" text-anchor="middle" >100</text><line x1="242.5" y1="186" x2="242.5" y2="196" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="242.5" y="212" font-size="12" text-anchor="middle" >150</text><line x1="310" y1="186" x2="310" y2="196" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="310" y="212" font-size="12" text-anchor="middle" >200</text><line x1="377.5" y1="186" x2="377.5" y2="196" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="377.5" y="212" font-size="12" text-anchor="middle" >250</text></svg>
