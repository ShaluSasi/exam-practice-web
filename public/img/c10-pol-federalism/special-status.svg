<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A fenced plot of land with a house, a visitor with luggage kept outside the fence by a red cross</title><style>.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.1)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.blink{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
.rock{animation:rock 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fade{animation:fade 3s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
.slide{animation:slide 3s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.slidel{animation:slidel 3s ease-in-out infinite alternate}@keyframes slidel{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
.down{animation:down 2.4s ease-in infinite}@keyframes down{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.up{animation:up 2.4s ease-in infinite}@keyframes up{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-10px);opacity:0}}
.grow{animation:grow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="120" rx="0" fill="#EAF5FF" /><rect x="0" y="120" width="400" height="120" rx="0" fill="#CFE8B0" /><rect x="150" y="120" width="6" height="92" rx="0" fill="#8A5A3C" stroke="#2B2F4A" stroke-width="2" /><rect x="150" y="120" width="6" height="92" rx="0" fill="#8A5A3C" stroke="#2B2F4A" stroke-width="2" /><rect x="150" y="130" width="160" height="6" rx="2" fill="#C9A06A" stroke="#2B2F4A" stroke-width="1.8" /><rect x="150" y="160" width="160" height="6" rx="2" fill="#C9A06A" stroke="#2B2F4A" stroke-width="1.8" /><rect x="150" y="190" width="160" height="6" rx="2" fill="#C9A06A" stroke="#2B2F4A" stroke-width="1.8" /><rect x="310" y="120" width="6" height="92" rx="0" fill="#8A5A3C" stroke="#2B2F4A" stroke-width="2" /><g transform="translate(235 128) scale(1.3)"><rect x="-24" y="-26" width="48" height="26" rx="0" fill="#E8C79A" stroke="#2B2F4A" stroke-width="2.5" /><path d="M-30 -26 L0 -52 L30 -26Z" fill="#B5523B" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="-7" y="-18" width="14" height="18" rx="2" fill="#6B4A3A" stroke="#2B2F4A" stroke-width="2" /><rect x="10" y="-20" width="10" height="10" rx="1" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.8" /></g><g transform="translate(350 118) scale(1.1)"><rect x="-5" y="-24" width="10" height="24" rx="2" fill="#8A5A3C" stroke="#2B2F4A" stroke-width="2" /><circle cx="0" cy="-38" r="20" fill="#5FBF5A" stroke="#2B2F4A" stroke-width="3" /><circle cx="-12" cy="-28" r="12" fill="#4DAF4D" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="12" cy="-28" r="12" fill="#4DAF4D" stroke="#2B2F4A" stroke-width="2.5" /></g><rect x="190" y="172" width="90" height="34" rx="4" fill="#E6D3A8" stroke="#2B2F4A" stroke-width="2.5" /><path d="M200 200 V182" fill="none" stroke="#3FA34D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M222 200 V182" fill="none" stroke="#3FA34D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M244 200 V182" fill="none" stroke="#3FA34D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M266 200 V182" fill="none" stroke="#3FA34D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(80 212) scale(1.1)" class="bob"><circle cx="0" cy="-34" r="8" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2.2" /><path d="M-11 0 Q-11 -22 0 -22 Q11 -22 11 0Z" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="96" y="180" width="22" height="18" rx="4" fill="#C0392B" stroke="#2B2F4A" stroke-width="2" /><g transform="translate(72 168) scale(0.9)"><circle cx="0" cy="0" r="11" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" /><path d="M-5 -5 L5 5 M5 -5 L-5 5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="200" y="28" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Special powers for some States</text><text x="200" y="50" font-family="sans-serif" font-size="12" font-weight="600" fill="#555B6B" text-anchor="middle" >(Article 371)</text></svg>