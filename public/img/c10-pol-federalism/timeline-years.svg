<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A timeline with four stops marked by a book, a hut, a government building and a clipboard</title><style>.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.1)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.blink{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
.rock{animation:rock 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fade{animation:fade 3s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
.slide{animation:slide 3s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.slidel{animation:slidel 3s ease-in-out infinite alternate}@keyframes slidel{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
.down{animation:down 2.4s ease-in infinite}@keyframes down{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.up{animation:up 2.4s ease-in infinite}@keyframes up{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-10px);opacity:0}}
.grow{animation:grow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M30 150 H370" fill="none" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><polygon points="372,150 358,142 358,158" fill="#2B2F4A"/><circle cx="70" cy="150" r="9" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2.5" class="pulse"/><path d="M70 141 V120" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(70 116) scale(1.0)"><rect x="-24" y="-34" width="48" height="34" rx="3" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="3" /><rect x="-18" y="-28" width="36" height="6" rx="2" fill="#fff" /><path d="M-18 -16 H18 M-18 -10 H8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><circle cx="153" cy="150" r="9" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2.5" class="pulse"/><path d="M153 141 V120" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(153 118) scale(0.8)"><rect x="-24" y="-26" width="48" height="26" rx="0" fill="#E8C79A" stroke="#2B2F4A" stroke-width="2.5" /><path d="M-30 -26 L0 -52 L30 -26Z" fill="#B5523B" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="-7" y="-18" width="14" height="18" rx="2" fill="#6B4A3A" stroke="#2B2F4A" stroke-width="2" /><rect x="10" y="-20" width="10" height="10" rx="1" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.8" /></g><circle cx="236" cy="150" r="9" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2.5" class="pulse"/><path d="M236 141 V120" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(236 118) scale(0.9)"><rect x="-30" y="-30" width="60" height="30" rx="0" fill="#D9E7F7" stroke="#2B2F4A" stroke-width="2.5" /><path d="M-34 -30 H34 L26 -42 H-26Z" fill="#8FB0DC" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="-21" y="-24" width="6" height="14" rx="0" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.8" /><rect x="-9" y="-24" width="6" height="14" rx="0" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.8" /><rect x="3" y="-24" width="6" height="14" rx="0" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.8" /><rect x="15" y="-24" width="6" height="14" rx="0" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.8" /><rect x="-6" y="-14" width="12" height="14" rx="1" fill="#6B4A3A" stroke="#2B2F4A" stroke-width="2" /></g><circle cx="319" cy="150" r="9" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2.5" class="pulse"/><path d="M319 141 V120" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(319 118) scale(1.0)"><rect x="-18" y="-44" width="36" height="44" rx="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><rect x="-8" y="-48" width="16" height="8" rx="3" fill="#C9CED6" stroke="#2B2F4A" stroke-width="2" /><path d="M-10 -28 H10 M-10 -18 H10 M-10 -8 H4" fill="none" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="40" y="184" font-family="sans-serif" font-size="12" font-weight="600" fill="#555B6B" text-anchor="start" >earlier</text><text x="360" y="184" font-family="sans-serif" font-size="12" font-weight="600" fill="#555B6B" text-anchor="end" >later</text></svg>