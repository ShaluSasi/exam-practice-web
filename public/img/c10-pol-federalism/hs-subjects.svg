<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Six objects on two shelves: a shield, a rupee coin, a police cap, wheat stalks, a book and a tree</title><style>.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.1)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.blink{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
.rock{animation:rock 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fade{animation:fade 3s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
.slide{animation:slide 3s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.slidel{animation:slidel 3s ease-in-out infinite alternate}@keyframes slidel{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
.down{animation:down 2.4s ease-in infinite}@keyframes down{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.up{animation:up 2.4s ease-in infinite}@keyframes up{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-10px);opacity:0}}
.grow{animation:grow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="240" rx="0" fill="#FFF3DC" /><rect x="20" y="104" width="360" height="8" rx="3" fill="#C9A06A" stroke="#2B2F4A" stroke-width="2.5" /><rect x="20" y="208" width="360" height="8" rx="3" fill="#C9A06A" stroke="#2B2F4A" stroke-width="2.5" /><g transform="translate(70 104) scale(1.5)"><path d="M0 -48 L22 -40 V-22 Q22 -6 0 2 Q-22 -6 -22 -22 V-40Z" fill="#7F8FB5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 -38 V-6 M-10 -26 H10" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(200 104) scale(1.5)"><circle cx="0" cy="-22" r="20" fill="#FFD23F" stroke="#2B2F4A" stroke-width="3" /><circle cx="0" cy="-22" r="13" fill="none" stroke="#C99A00" stroke-width="2" /><text x="0" y="-15" font-family="sans-serif" font-size="20" font-weight="800" fill="#2B2F4A" text-anchor="middle" >₹</text></g><g transform="translate(330 104) scale(1.5)"><path d="M-22 -14 Q-22 -42 0 -42 Q22 -42 22 -14Z" fill="#3B4A7A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="-26" y="-14" width="52" height="8" rx="3" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="0" cy="-28" r="5" fill="#FFD23F" stroke="#2B2F4A" stroke-width="1.8" /></g><g transform="translate(70 208) scale(1.5)"><path d="M-14 0 V-44" fill="none" stroke="#8A7A2C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M-14 -38 l-6 -5 M-14 -38 l6 -5" fill="none" stroke="#D9B52C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M-14 -30 l-6 -5 M-14 -30 l6 -5" fill="none" stroke="#D9B52C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M-14 -22 l-6 -5 M-14 -22 l6 -5" fill="none" stroke="#D9B52C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M-14 -14 l-6 -5 M-14 -14 l6 -5" fill="none" stroke="#D9B52C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 0 V-52" fill="none" stroke="#8A7A2C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 -46 l-6 -5 M0 -46 l6 -5" fill="none" stroke="#D9B52C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 -38 l-6 -5 M0 -38 l6 -5" fill="none" stroke="#D9B52C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 -30 l-6 -5 M0 -30 l6 -5" fill="none" stroke="#D9B52C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 -22 l-6 -5 M0 -22 l6 -5" fill="none" stroke="#D9B52C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M14 0 V-44" fill="none" stroke="#8A7A2C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M14 -38 l-6 -5 M14 -38 l6 -5" fill="none" stroke="#D9B52C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M14 -30 l-6 -5 M14 -30 l6 -5" fill="none" stroke="#D9B52C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M14 -22 l-6 -5 M14 -22 l6 -5" fill="none" stroke="#D9B52C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M14 -14 l-6 -5 M14 -14 l6 -5" fill="none" stroke="#D9B52C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(200 208) scale(1.5)"><rect x="-24" y="-34" width="48" height="34" rx="3" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="3" /><rect x="-18" y="-28" width="36" height="6" rx="2" fill="#fff" /><path d="M-18 -16 H18 M-18 -10 H8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(330 208) scale(1.5)"><rect x="-5" y="-24" width="10" height="24" rx="2" fill="#8A5A3C" stroke="#2B2F4A" stroke-width="2" /><circle cx="0" cy="-38" r="20" fill="#5FBF5A" stroke="#2B2F4A" stroke-width="3" /><circle cx="-12" cy="-28" r="12" fill="#4DAF4D" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="12" cy="-28" r="12" fill="#4DAF4D" stroke="#2B2F4A" stroke-width="2.5" /></g><circle cx="100" cy="38" r="3" fill="#FFD23F" class="blink"/><circle cx="230" cy="38" r="3" fill="#FFD23F" class="blink"/><circle cx="360" cy="38" r="3" fill="#FFD23F" class="blink"/></svg>