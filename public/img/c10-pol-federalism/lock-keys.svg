<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A padlock opened by two keys, one coming from a parliament building and one from a State building</title><style>.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.1)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.blink{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
.rock{animation:rock 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fade{animation:fade 3s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
.slide{animation:slide 3s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.slidel{animation:slidel 3s ease-in-out infinite alternate}@keyframes slidel{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
.down{animation:down 2.4s ease-in infinite}@keyframes down{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.up{animation:up 2.4s ease-in infinite}@keyframes up{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-10px);opacity:0}}
.grow{animation:grow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="24" font-family="sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Changing the power-sharing arrangement</text><rect x="168" y="100" width="64" height="56" rx="8" fill="#FFD23F" stroke="#2B2F4A" stroke-width="3" /><path d="M180 100 V80 Q180 60 200 60 Q220 60 220 80 V100" fill="none" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="200" cy="126" r="6" fill="#2B2F4A" /><path d="M200 128 V142" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(70 200) scale(1.2)"><rect x="-30" y="-26" width="60" height="26" rx="0" fill="#F3D9A4" stroke="#2B2F4A" stroke-width="2.5" /><rect x="-34" y="-30" width="68" height="6" rx="0" fill="#E9C987" stroke="#2B2F4A" stroke-width="2.5" /><rect x="-23" y="-26" width="6" height="26" rx="0" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="1.8" /><rect x="-11" y="-26" width="6" height="26" rx="0" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="1.8" /><rect x="5" y="-26" width="6" height="26" rx="0" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="1.8" /><rect x="17" y="-26" width="6" height="26" rx="0" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="1.8" /><path d="M-16 -30 Q0 -62 16 -30Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 -58 V-70" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 -70 l10 3 l-10 3z" fill="#E5484D" stroke="#2B2F4A" stroke-width="1.5"/></g><g transform="translate(332 200) scale(1.3)"><rect x="-30" y="-30" width="60" height="30" rx="0" fill="#D9E7F7" stroke="#2B2F4A" stroke-width="2.5" /><path d="M-34 -30 H34 L26 -42 H-26Z" fill="#8FB0DC" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="-21" y="-24" width="6" height="14" rx="0" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.8" /><rect x="-9" y="-24" width="6" height="14" rx="0" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.8" /><rect x="3" y="-24" width="6" height="14" rx="0" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.8" /><rect x="15" y="-24" width="6" height="14" rx="0" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.8" /><rect x="-6" y="-14" width="12" height="14" rx="1" fill="#6B4A3A" stroke="#2B2F4A" stroke-width="2" /></g><path d="M110 170 L159.4 138.9" fill="none" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" class="dash"/><polygon points="164.0,136.0 159.6,143.9 155.0,136.6" fill="#FF8A1F"/><path d="M292 170 L240.6 138.8" fill="none" stroke="#3FA34D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" class="dash"/><polygon points="236.0,136.0 245.0,136.4 240.5,143.8" fill="#3FA34D"/><g transform="translate(120 150) scale(1)" class="pulse"><circle cx="0" cy="0" r="8" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2.5" /><path d="M8 0 H26 M20 0 V8 M26 0 V6" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(280 150) scale(1)" class="pulse"><circle cx="0" cy="0" r="8" fill="#9BE09B" stroke="#2B2F4A" stroke-width="2.5" /><path d="M-8 0 H-26 M-20 0 V8 M-26 0 V6" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></svg>