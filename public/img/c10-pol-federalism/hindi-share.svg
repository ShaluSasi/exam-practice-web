<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Bars showing Hindi as the mother tongue of 43.63 percent and English as a mother tongue of 0.02 percent plus 11 percent as second or third language, with a 50 percent marker</title><style>.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.1)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.blink{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
.rock{animation:rock 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fade{animation:fade 3s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
.slide{animation:slide 3s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.slidel{animation:slidel 3s ease-in-out infinite alternate}@keyframes slidel{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
.down{animation:down 2.4s ease-in infinite}@keyframes down{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.up{animation:up 2.4s ease-in infinite}@keyframes up{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-10px);opacity:0}}
.grow{animation:grow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="22" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Mother tongues in India, 2011 Census</text><text x="30" y="54" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="start" >Hindi as mother tongue</text><rect x="30" y="62" width="340" height="30" rx="0" fill="#EDEFF3" stroke="#2B2F4A" stroke-width="2" /><rect x="30" y="62" width="148.342" height="30" rx="0" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" /><text x="104.171" y="82" font-family="sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >43.63%</text><text x="30" y="128" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="start" >English</text><rect x="30" y="136" width="340" height="30" rx="0" fill="#EDEFF3" stroke="#2B2F4A" stroke-width="2" /><rect x="30" y="136" width="2.5" height="30" rx="0" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.5" /><rect x="32.5" y="136" width="34.9" height="30" rx="0" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" /><text x="51.2" y="156" font-family="sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >11%</text><path d="M200 52 V176" fill="none" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="dash"/><text x="200" y="192" font-family="sans-serif" font-size="11" font-weight="600" fill="#E5484D" text-anchor="middle" >half of all Indians (50%)</text><circle cx="40" cy="216" r="6" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.5" /><text x="52" y="220" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="start" >Mother tongue</text><circle cx="180" cy="216" r="6" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5" /><text x="192" y="220" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="start" >Second or third language</text></svg>