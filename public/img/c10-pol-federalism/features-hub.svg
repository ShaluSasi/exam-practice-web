<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A hub labelled Federalism connected to icons for tiers of government, a constitution book, scales of justice, a coin and two people</title><style>.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.1)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.blink{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
.rock{animation:rock 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fade{animation:fade 3s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
.slide{animation:slide 3s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.slidel{animation:slidel 3s ease-in-out infinite alternate}@keyframes slidel{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
.down{animation:down 2.4s ease-in infinite}@keyframes down{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.up{animation:up 2.4s ease-in infinite}@keyframes up{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-10px);opacity:0}}
.grow{animation:grow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M200 120 L70 62" fill="none" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="dash"/><path d="M200 120 L330 62" fill="none" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="dash"/><path d="M200 120 L70 182" fill="none" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="dash"/><path d="M200 120 L330 182" fill="none" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="dash"/><path d="M200 120 L200 34" fill="none" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="dash"/><circle cx="200" cy="120" r="40" fill="#FFD23F" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="125" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Federalism</text><circle cx="70" cy="62" r="28" fill="#FFE6C7" stroke="#2B2F4A" stroke-width="2.5" /><g transform="translate(70 80) scale(0.9)"><rect x="-18" y="-40" width="36" height="12" rx="3" fill="#FFE6C7" stroke="#2B2F4A" stroke-width="2.2" /><rect x="-18" y="-26" width="36" height="12" rx="3" fill="#DFF3DF" stroke="#2B2F4A" stroke-width="2.2" /><rect x="-18" y="-12" width="36" height="12" rx="3" fill="#E9E2FF" stroke="#2B2F4A" stroke-width="2.2" /></g><circle cx="330" cy="62" r="28" fill="#E9E2FF" stroke="#2B2F4A" stroke-width="2.5" /><g transform="translate(330 76) scale(0.7)"><rect x="-24" y="-34" width="48" height="34" rx="3" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="3" /><rect x="-18" y="-28" width="36" height="6" rx="2" fill="#fff" /><path d="M-18 -16 H18 M-18 -10 H8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><circle cx="70" cy="182" r="28" fill="#DFF3DF" stroke="#2B2F4A" stroke-width="2.5" /><g transform="translate(70 200) scale(0.55)"><g class="rock"><path d="M-26 -40 H26 M0 -52 V0" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M-26 -40 L-34 -20 H-18Z M26 -40 L18 -20 H34Z" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="-12" y="-4" width="24" height="4" rx="1" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1" /></g><circle cx="330" cy="182" r="28" fill="#FFF3C4" stroke="#2B2F4A" stroke-width="2.5" /><g transform="translate(330 202) scale(0.7)"><circle cx="0" cy="-22" r="20" fill="#FFD23F" stroke="#2B2F4A" stroke-width="3" /><circle cx="0" cy="-22" r="13" fill="none" stroke="#C99A00" stroke-width="2" /><text x="0" y="-15" font-family="sans-serif" font-size="20" font-weight="800" fill="#2B2F4A" text-anchor="middle" >₹</text></g><g transform="translate(190 48) scale(0.6)"><circle cx="0" cy="-34" r="8" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2.2" /><path d="M-11 0 Q-11 -22 0 -22 Q11 -22 11 0Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(210 48) scale(0.6)"><circle cx="0" cy="-34" r="8" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2.2" /><path d="M-11 0 Q-11 -22 0 -22 Q11 -22 11 0Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g></svg>