<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Three small diagrams: independent circles joining, a big circle sharing power downward, and a big circle commanding smaller ones</title><style>.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.1)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.blink{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
.rock{animation:rock 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fade{animation:fade 3s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
.slide{animation:slide 3s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.slidel{animation:slidel 3s ease-in-out infinite alternate}@keyframes slidel{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
.down{animation:down 2.4s ease-in infinite}@keyframes down{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.up{animation:up 2.4s ease-in infinite}@keyframes up{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-10px);opacity:0}}
.grow{animation:grow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><circle cx="24" cy="62" r="14" fill="#FFE6C7" stroke="#2B2F4A" stroke-width="2.5" /><path d="M40 62 L69.9 87.3" fill="none" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="dash"/><polygon points="74.0,90.8 65.2,89.0 70.8,82.4" fill="#0B93D4"/><circle cx="24" cy="110" r="14" fill="#FFE6C7" stroke="#2B2F4A" stroke-width="2.5" /><path d="M40 110 L68.6 110.0" fill="none" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="dash"/><polygon points="74.0,110.0 66.1,114.3 66.1,105.7" fill="#0B93D4"/><circle cx="24" cy="158" r="14" fill="#FFE6C7" stroke="#2B2F4A" stroke-width="2.5" /><path d="M40 158 L69.9 132.7" fill="none" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="dash"/><polygon points="74.0,129.2 70.8,137.6 65.2,131.0" fill="#0B93D4"/><circle cx="106" cy="110" r="28" fill="#DFF3DF" stroke="#2B2F4A" stroke-width="3" /><circle cx="200" cy="64" r="32" fill="#DFF3DF" stroke="#2B2F4A" stroke-width="3" /><circle cx="156" cy="168" r="14" fill="#FFE6C7" stroke="#2B2F4A" stroke-width="2.5" /><path d="M178.0 94 L157.9 147.0" fill="none" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="dash"/><polygon points="156.0,152.0 154.8,143.1 162.8,146.1" fill="#0B93D4"/><circle cx="200" cy="168" r="14" fill="#FFE6C7" stroke="#2B2F4A" stroke-width="2.5" /><path d="M200.0 94 L200.0 146.6" fill="none" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="dash"/><polygon points="200.0,152.0 195.7,144.1 204.3,144.1" fill="#0B93D4"/><circle cx="244" cy="168" r="14" fill="#FFE6C7" stroke="#2B2F4A" stroke-width="2.5" /><path d="M222.0 94 L242.1 147.0" fill="none" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="dash"/><polygon points="244.0,152.0 237.2,146.1 245.2,143.1" fill="#0B93D4"/><circle cx="330" cy="64" r="32" fill="#DFF3DF" stroke="#2B2F4A" stroke-width="3" /><circle cx="286" cy="168" r="14" fill="#FFDADA" stroke="#2B2F4A" stroke-width="2.5" /><path d="M308.0 94 L287.9 147.0" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="dash"/><polygon points="286.0,152.0 284.8,143.1 292.8,146.1" fill="#E5484D"/><circle cx="330" cy="168" r="14" fill="#FFDADA" stroke="#2B2F4A" stroke-width="2.5" /><path d="M330.0 94 L330.0 146.6" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="dash"/><polygon points="330.0,152.0 325.7,144.1 334.3,144.1" fill="#E5484D"/><circle cx="374" cy="168" r="14" fill="#FFDADA" stroke="#2B2F4A" stroke-width="2.5" /><path d="M352.0 94 L372.1 147.0" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="dash"/><polygon points="374.0,152.0 367.2,146.1 375.2,143.1" fill="#E5484D"/><rect x="130" y="14" width="0" height="0" rx="0" fill="none" /></svg>