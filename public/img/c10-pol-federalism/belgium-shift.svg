<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Left: regional governments whose powers could be withdrawn by the centre. Right: regional governments with powers guaranteed by the constitution</title><style>.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.1)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.blink{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
.rock{animation:rock 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fade{animation:fade 3s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
.slide{animation:slide 3s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.slidel{animation:slidel 3s ease-in-out infinite alternate}@keyframes slidel{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
.down{animation:down 2.4s ease-in infinite}@keyframes down{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.up{animation:up 2.4s ease-in infinite}@keyframes up{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-10px);opacity:0}}
.grow{animation:grow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="10" y="28" width="180" height="190" rx="12" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><rect x="210" y="28" width="180" height="190" rx="12" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><text x="100" y="52" font-family="sans-serif" font-size="14" font-weight="800" fill="#FF8A1F" text-anchor="middle" >Before 1993</text><text x="300" y="52" font-family="sans-serif" font-size="14" font-weight="800" fill="#3FA34D" text-anchor="middle" >After 1993</text><rect x="60" y="66" width="80" height="26" rx="10" fill="#FFE6C7" stroke="#2B2F4A" stroke-width="2.5" /><text x="100.0" y="83.2" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Central</text><rect x="22" y="126" width="70" height="26" rx="10" fill="#DFF3DF" stroke="#2B2F4A" stroke-width="2.5" stroke-dasharray="5 4"/><text x="57.0" y="143.2" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Region</text><rect x="108" y="126" width="70" height="26" rx="10" fill="#DFF3DF" stroke="#2B2F4A" stroke-width="2.5" stroke-dasharray="5 4"/><text x="143.0" y="143.2" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Region</text><path d="M57 124 L74.8 100.3" fill="none" stroke="#E5484D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" class="dash"/><polygon points="78.0,96.0 76.7,104.9 69.8,99.7" fill="#E5484D"/><path d="M143 124 L125.2 100.3" fill="none" stroke="#E5484D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" class="dash"/><polygon points="122.0,96.0 130.2,99.7 123.3,104.9" fill="#E5484D"/><text x="100" y="184" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Powers could be withdrawn</text><rect x="260" y="66" width="80" height="26" rx="10" fill="#FFE6C7" stroke="#2B2F4A" stroke-width="2.5" /><text x="300.0" y="83.2" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Central</text><rect x="222" y="126" width="70" height="26" rx="10" fill="#DFF3DF" stroke="#3FA34D" stroke-width="4.5" /><text x="257.0" y="143.2" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Region</text><rect x="308" y="126" width="70" height="26" rx="10" fill="#DFF3DF" stroke="#3FA34D" stroke-width="4.5" /><text x="343.0" y="143.2" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Region</text><text x="300" y="184" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Powers set by Constitution</text><path d="M192 122 L202.6 122.0" fill="none" stroke="#0B93D4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><polygon points="208.0,122.0 200.1,126.3 200.1,117.7" fill="#0B93D4"/></svg>