<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A timeline with four unmarked stops from earlier to later, each with a question card</title><style>.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.1)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.blink{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
.rock{animation:rock 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fade{animation:fade 3s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
.slide{animation:slide 3s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.slidel{animation:slidel 3s ease-in-out infinite alternate}@keyframes slidel{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
.down{animation:down 2.4s ease-in infinite}@keyframes down{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.up{animation:up 2.4s ease-in infinite}@keyframes up{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-10px);opacity:0}}
.grow{animation:grow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M30 150 H370" fill="none" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><polygon points="372,150 358,142 358,158" fill="#2B2F4A"/><circle cx="70" cy="150" r="9" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2.5" class="pulse"/><path d="M70 141 V120" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="48" y="78" width="44" height="42" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><text x="70" y="108" font-family="sans-serif" font-size="24" font-weight="800" fill="#7C5CFF" text-anchor="middle" >?</text><circle cx="153" cy="150" r="9" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2.5" class="pulse"/><path d="M153 141 V120" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="131" y="78" width="44" height="42" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><text x="153" y="108" font-family="sans-serif" font-size="24" font-weight="800" fill="#7C5CFF" text-anchor="middle" >?</text><circle cx="236" cy="150" r="9" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2.5" class="pulse"/><path d="M236 141 V120" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="214" y="78" width="44" height="42" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><text x="236" y="108" font-family="sans-serif" font-size="24" font-weight="800" fill="#7C5CFF" text-anchor="middle" >?</text><circle cx="319" cy="150" r="9" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2.5" class="pulse"/><path d="M319 141 V120" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="297" y="78" width="44" height="42" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><text x="319" y="108" font-family="sans-serif" font-size="24" font-weight="800" fill="#7C5CFF" text-anchor="middle" >?</text><text x="40" y="184" font-family="sans-serif" font-size="12" font-weight="600" fill="#555B6B" text-anchor="start" >earlier</text><text x="360" y="184" font-family="sans-serif" font-size="12" font-weight="600" fill="#555B6B" text-anchor="end" >later</text></svg>