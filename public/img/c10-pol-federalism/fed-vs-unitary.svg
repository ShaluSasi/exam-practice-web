<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Two panels: a federal system where Central and State governments each deal with citizens, and a unitary system where the centre orders the provinces</title><style>.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.1)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.blink{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
.rock{animation:rock 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fade{animation:fade 3s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
.slide{animation:slide 3s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.slidel{animation:slidel 3s ease-in-out infinite alternate}@keyframes slidel{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
.down{animation:down 2.4s ease-in infinite}@keyframes down{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.up{animation:up 2.4s ease-in infinite}@keyframes up{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-10px);opacity:0}}
.grow{animation:grow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="8" y="34" width="186" height="198" rx="12" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><rect x="206" y="34" width="186" height="198" rx="12" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><text x="101" y="54" font-family="sans-serif" font-size="15" font-weight="800" fill="#3FA34D" text-anchor="middle" >Federal</text><text x="299" y="54" font-family="sans-serif" font-size="15" font-weight="800" fill="#FF8A1F" text-anchor="middle" >Unitary</text><rect x="50" y="64" width="100" height="28" rx="10" fill="#FFE6C7" stroke="#2B2F4A" stroke-width="2.5" /><text x="100.0" y="82.2" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Central govt</text><rect x="26" y="112" width="70" height="28" rx="10" fill="#DFF3DF" stroke="#2B2F4A" stroke-width="2.5" /><text x="61.0" y="130.2" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >State</text><rect x="104" y="112" width="70" height="28" rx="10" fill="#DFF3DF" stroke="#2B2F4A" stroke-width="2.5" /><text x="139.0" y="130.2" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >State</text><path d="M150 78 H184 V176" fill="none" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="dash"/><path d="M184 160 L184.0 172.6" fill="none" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><polygon points="184.0,178.0 179.7,170.1 188.3,170.1" fill="#0B93D4"/><path d="M61 142 L73.8 171.1" fill="none" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="dash"/><polygon points="76.0,176.0 68.9,170.5 76.8,167.0" fill="#0B93D4"/><path d="M139 142 L126.2 171.1" fill="none" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="dash"/><pol