<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Four cards: a gavel, two blocks joining, arrows from a top box to lower boxes, and a box with a question mark</title><style>.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.1)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.blink{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
.rock{animation:rock 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fade{animation:fade 3s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
.slide{animation:slide 3s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.slidel{animation:slidel 3s ease-in-out infinite alternate}@keyframes slidel{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
.down{animation:down 2.4s ease-in infinite}@keyframes down{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.up{animation:up 2.4s ease-in infinite}@keyframes up{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-10px);opacity:0}}
.grow{animation:grow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="16" y="16" width="176" height="100" rx="12" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><path d="M60 70 L100 30" fill="none" stroke="#8A5A3C" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><rect x="84" y="24" width="40" height="20" rx="4" fill="#B5523B" stroke="#2B2F4A" stroke-width="2.5" transform="rotate(40 104 34)"/><rect x="112" y="64" width="40" height="8" rx="3" fill="#C9CED6" stroke="#2B2F4A" stroke-width="2.5" /><rect x="208" y="16" width="176" height="100" rx="12" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><rect x="220" y="40" width="50" height="40" rx="6" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" /><rect x="300" y="40" width="50" height="40" rx="6" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" /><path d="M270 60 H300" fill="none" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="dash"/><circle cx="285" cy="60" r="8" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2" /><rect x="16" y="124" width="176" height="100" rx="12" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><rect x="60" y="134" width="56" height="20" rx="6" fill="#FFE6C7" stroke="#2B2F4A" stroke-width="2.5" /><path d="M88 156 L88.0 184.6" fill="none" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="dash"/><polygon points="88.0,190.0 83.7,182.1 92.3,182.1" fill="#0B93D4"/><rect x="30" y="194" width="40" height="16" rx="5" fill="#DFF3DF" stroke="#2B2F4A" stroke-width="2.5" /><rect x="108" y="194" width="40" height="16" rx="5" fill="#DFF3DF" stroke="#2B2F4A" stroke-width="2.5" /><path d="M70 156 L52.7 185.3" fill="none" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="dash"/><polygon points="50.0,190.0 50.3,181.0 57.7,185.4" fill="#0B93D4"/><path d="M106 156 L125.1 185.5" fill="none" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="dash"/><polygon points="128.0,190.0 120.1,185.7 127.3,181.0" fill="#0B93D4"/><rect x="208" y="124" width="176" height="100" rx="12" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><rect x="250" y="138" width="96" height="64" rx="10" fill="#E9E2FF" stroke="#2B2F4A" stroke-width="2.5" class="pulse"/><text x="298" y="184" font-family="sans-serif" font-size="38" font-weight="800" fill="#7C5CFF" text-anchor="middle" >?</text></svg>