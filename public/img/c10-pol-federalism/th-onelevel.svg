<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A single government with arrows to citizens</title><style>.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.1)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.blink{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
.rock{animation:rock 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fade{animation:fade 3s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
.slide{animation:slide 3s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.slidel{animation:slidel 3s ease-in-out infinite alternate}@keyframes slidel{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
.down{animation:down 2.4s ease-in infinite}@keyframes down{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.up{animation:up 2.4s ease-in infinite}@keyframes up{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-10px);opacity:0}}
.grow{animation:grow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFFFFF"/><rect x="45" y="10" width="110" height="26" rx="10" fill="#FFE6C7" stroke="#2B2F4A" stroke-width="2.5" /><text x="100.0" y="27.2" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Government</text><g transform="translate(50 142) scale(0.6)"><circle cx="0" cy="-34" r="8" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2.2" /><path d="M-11 0 Q-11 -22 0 -22 Q11 -22 11 0Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(84 142) scale(0.6)" class="bob d2"><circle cx="0" cy="-34" r="8" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2.2" /><path d="M-11 0 Q-11 -22 0 -22 Q11 -22 11 0Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(118 142) scale(0.6)"><circle cx="0" cy="-34" r="8" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2.2" /><path d="M-11 0 Q-11 -22 0 -22 Q11 -22 11 0Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(152 142) scale(0.6)" class="bob d4"><circle cx="0" cy="-34" r="8" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2.2" /><path d="M-11 0 Q-11 -22 0 -22 Q11 -22 11 0Z" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M70 38 L70.0 100.6" fill="none" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="dash"/><polygon points="70.0,106.0 65.7,98.1 74.3,98.1" fill="#0B93D4"/><path d="M100 38 L100.0 100.6" fill="none" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="dash"/><polygon points="100.0,106.0 95.7,98.1 104.3,98.1" fill="#0B93D4"/><path d="M130 38 L130.0 100.6" fill="none" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="dash"/><polygon points="130.0,106.0 125.7,98.1 134.3,98.1" fill="#0B93D4"/></svg>