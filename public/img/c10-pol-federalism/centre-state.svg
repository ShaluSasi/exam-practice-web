<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Before 1990 one colour at the Centre and States with a dismissal arrow; after 1990 many colours share power with arrows of respect</title><style>.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.1)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.blink{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
.rock{animation:rock 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fade{animation:fade 3s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
.slide{animation:slide 3s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.slidel{animation:slidel 3s ease-in-out infinite alternate}@keyframes slidel{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
.down{animation:down 2.4s ease-in infinite}@keyframes down{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.up{animation:up 2.4s ease-in infinite}@keyframes up{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-10px);opacity:0}}
.grow{animation:grow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="8" y="30" width="186" height="200" rx="12" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><rect x="206" y="30" width="186" height="200" rx="12" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><text x="101" y="52" font-family="sans-serif" font-size="14" font-weight="800" fill="#FF8A1F" text-anchor="middle" >Before 1990</text><text x="299" y="52" font-family="sans-serif" font-size="14" font-weight="800" fill="#3FA34D" text-anchor="middle" >After 1990</text><rect x="50" y="70" width="100" height="28" rx="10" fill="#FFB066" stroke="#2B2F4A" stroke-width="2.5" /><text x="100.0" y="88.2" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Centre</text><rect x="22" y="130" width="72" height="28" rx="10" fill="#FFB066" stroke="#2B2F4A" stroke-width="2.5" /><text x="58.0" y="148.2" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >State</text><rect x="106" y="130" width="72" height="28" rx="10" fill="#FFB066" stroke="#2B2F4A" stroke-width="2.5" /><text x="142.0" y="148.2" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >State</text><path d="M70 100 L61.8 122.9" fill="none" stroke="#E5484D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" class="dash"/><polygon points="60.0,128.0 58.6,119.1 66.7,122.0" fill="#E5484D"/><text x="101" y="196" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Same colour at both levels</text><rect x="250" y="70" width="34" height="28" rx="0" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" /><rect x="284" y="70" width="34" height="28" rx="0" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" /><rect x="318" y="70" width="34" height="28" rx="0" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.5" /><rect x="250" y="70" width="102" height="28" rx="6" fill="none" stroke="#2B2F4A" stroke-width="2.5" /><rect x="222" y="130" width="72" height="28" rx="10" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" /><text x="258.0" y="148.2" font-family="sans-serif" font-size="12" font-weight="600" fill="#fff" text-anchor="middle" >State</text><rect x="306" y="130" width="72" height="28" rx="10" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.5" /><text x="342.0" y="148.2" font-family="sans-serif" font-size="12" font-weight="600" fill="#fff" text-anchor="middle" >State</text><path d="M284 100 L265.3 123.8" fill="none" stroke="#3FA34D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" class="dash"/><polygon points="262.0,128.0 263.5,119.1 270.3,124.5" fill="#3FA34D"/><path d="M318 100 L334.9 123.6" fill="none" stroke="#3FA34D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" class="dash"/><polygon points="338.0,128.0 329.9,124.1 336.9,119.1" fill="#3FA34D"/><text x="299" y="196" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Many parties share power</text></svg>