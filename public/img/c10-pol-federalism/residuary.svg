<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A box for a new subject, computer software, with dashed lines to three list boxes each crossed out</title><style>.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.1)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.blink{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
.rock{animation:rock 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fade{animation:fade 3s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
.slide{animation:slide 3s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.slidel{animation:slidel 3s ease-in-out infinite alternate}@keyframes slidel{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
.down{animation:down 2.4s ease-in infinite}@keyframes down{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.up{animation:up 2.4s ease-in infinite}@keyframes up{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-10px);opacity:0}}
.grow{animation:grow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="8" y="16" width="124" height="34" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><text x="70.0" y="36.85" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Union List</text><g transform="translate(120 16) scale(0.8)"><circle cx="0" cy="0" r="11" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" /><path d="M-5 -5 L5 5 M5 -5 L-5 5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="138" y="16" width="124" height="34" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><text x="200.0" y="36.85" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >State List</text><g transform="translate(250 16) scale(0.8)"><circle cx="0" cy="0" r="11" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" /><path d="M-5 -5 L5 5 M5 -5 L-5 5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="268" y="16" width="124" height="34" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><text x="330.0" y="36.85" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Concurrent List</text><g transform="translate(380 16) scale(0.8)"><circle cx="0" cy="0" r="11" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" /><path d="M-5 -5 L5 5 M5 -5 L-5 5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="110" y="120" width="180" height="44" rx="10" fill="#E9E2FF" stroke="#2B2F4A" stroke-width="2.5" class="pulse"/><text x="200.0" y="138.7" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Computer software</text><text x="200.0" y="153.7" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >(a new subject)</text><path d="M135.0 118 L70 56" fill="none" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="dash"/><path d="M200.0 118 L200 56" fill="none" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="dash"/><path d="M265.0 118 L330 56" fill="none" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="dash"/><text x="200" y="206" font-family="sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Not in any list. Who can make laws?</text></svg>