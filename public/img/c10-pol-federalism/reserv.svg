<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Three rows of six seats each with a seated member, eighteen in all</title><style>.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.1)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.blink{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
.rock{animation:rock 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fade{animation:fade 3s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
.slide{animation:slide 3s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.slidel{animation:slidel 3s ease-in-out infinite alternate}@keyframes slidel{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
.down{animation:down 2.4s ease-in infinite}@keyframes down{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.up{animation:up 2.4s ease-in infinite}@keyframes up{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-10px);opacity:0}}
.grow{animation:grow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="26" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle" >A gram panchayat with 18 ward seats</text><rect x="36" y="44" width="44" height="48" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="58" cy="61" r="8" fill="#F2B48C" stroke="#2B2F4A" stroke-width="1.8" /><path d="M45 86 Q45 71 58 71 Q71 71 71 86Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><rect x="92" y="44" width="44" height="48" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="114" cy="61" r="8" fill="#F2B48C" stroke="#2B2F4A" stroke-width="1.8" /><path d="M101 86 Q101 71 114 71 Q127 71 127 86Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><rect x="148" y="44" width="44" height="48" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="170" cy="61" r="8" fill="#F2B48C" stroke="#2B2F4A" stroke-width="1.8" /><path d="M157 86 Q157 71 170 71 Q183 71 183 86Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><rect x="204" y="44" width="44" height="48" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="226" cy="61" r="8" fill="#F2B48C" stroke="#2B2F4A" stroke-width="1.8" /><path d="M213 86 Q213 71 226 71 Q239 71 239 86Z" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><rect x="260" y="44" width="44" height="48" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="282" cy="61" r="8" fill="#F2B48C" stroke="#2B2F4A" stroke-width="1.8" /><path d="M269 86 Q269 71 282 71 Q295 71 295 86Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><rect x="316" y="44" width="44" 