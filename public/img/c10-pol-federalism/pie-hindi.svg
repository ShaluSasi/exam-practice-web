<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A pie chart in which Hindi is 43.63 percent of mother tongues and all other languages together are 56.37 percent</title><style>.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.1)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.blink{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
.rock{animation:rock 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fade{animation:fade 3s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
.slide{animation:slide 3s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.slidel{animation:slidel 3s ease-in-out infinite alternate}@keyframes slidel{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
.down{animation:down 2.4s ease-in infinite}@keyframes down{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.up{animation:up 2.4s ease-in infinite}@keyframes up{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-10px);opacity:0}}
.grow{animation:grow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="24" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Mother tongue: Hindi and the rest</text><path d="M120 132 L120.0 48.0 A84 84 0 0 1 152.7 209.4Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M120 132 L152.7 209.4 A84 84 0 0 1 120.0 48.0Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="260" cy="100" r="8" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.8" /><text x="274" y="105" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="start" >Hindi 43.63%</text><circle cx="260" cy="140" r="8" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.8" /><text x="274" y="145" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="start" >All others 56.37%</text><text x="274" y="185" font-family="sans-serif" font-size="11" font-weight="600" fill="#555B6B" text-anchor="start" >Census of India, 2011</text></svg>