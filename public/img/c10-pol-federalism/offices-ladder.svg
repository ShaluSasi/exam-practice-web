<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Four steps going up, topped by a hut, a city building, a State office and a parliament building</title><style>.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.1)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.blink{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
.rock{animation:rock 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fade{animation:fade 3s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
.slide{animation:slide 3s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.slidel{animation:slidel 3s ease-in-out infinite alternate}@keyframes slidel{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
.down{animation:down 2.4s ease-in infinite}@keyframes down{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.up{animation:up 2.4s ease-in infinite}@keyframes up{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-10px);opacity:0}}
.grow{animation:grow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="20" y="164" width="80" height="50" rx="0" fill="#DFF3DF" stroke="#2B2F4A" stroke-width="2.5" /><g transform="translate(60 164) scale(1.0)"><rect x="-24" y="-26" width="48" height="26" rx="0" fill="#E8C79A" stroke="#2B2F4A" stroke-width="2.5" /><path d="M-30 -26 L0 -52 L30 -26Z" fill="#B5523B" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="-7" y="-18" width="14" height="18" rx="2" fill="#6B4A3A" stroke="#2B2F4A" stroke-width="2" /><rect x="10" y="-20" width="10" height="10" rx="1" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.8" /></g><g transform="translate(88 214) scale(0.7)" class="bob d0"><circle cx="0" cy="-34" r="8" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2.2" /><path d="M-11 0 Q-11 -22 0 -22 Q11 -22 11 0Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="112" y="148" width="80" height="66" rx="0" fill="#FFE6C7" stroke="#2B2F4A" stroke-width="2.5" /><g transform="translate(152 148) scale(1.0)"><rect x="-30" y="-48" width="20" height="48" rx="0" fill="#9FB4D8" stroke="#2B2F4A" stroke-width="2.5" /><rect x="-8" y="-62" width="22" height="62" rx="0" fill="#7C94C4" stroke="#2B2F4A" stroke-width="2.5" /><rect x="16" y="-38" width="18" height="38" rx="0" fill="#B3C6E6" stroke="#2B2F4A" stroke-width="2.5" /><rect x="-26" y="-42" width="4" height="5" rx="0" fill="#FFD23F" /><rect x="-20" y="-42" width="4" height="5" rx="0" fill="#FFD23F" /><rect x="-4" y="-56" width="4" height="6" rx="0" fill="#FFD23F" /><rect x="2" y="-56" width="4" height="6" rx="0" fill="#FFD23F" /><rect x="8" y="-56" width="4" height="6" rx="0" fill="#FFD23F" /><rect x="-26" y="-32" width="4" height="5" rx="0" fill="#FFD23F" /><rect x="-20" y="-32" width="4" height="5" rx="0" fill="#FFD23F" /><rect x="-4" y="-44" width="4" height="6" rx="0" fill="#FFD23F" /><rect x="2" y="-44" width="4" height="6" rx="0" fill="#FFD23F" /><rect x="8" y="-44" width="4" height="6" rx="0" fill="#FFD23F" /><rect x="-26" y="-22" width="4" height="5" rx="0" fill="#FFD23F" /><rect x="-20" y="-22" width="4" height="5" rx="0" fill="#FFD23F" /><rect x="-4" y="-32" width="4" height="6" rx="0" fill="#FFD23F" /><rect x="2" y="-32" width="4" height="6" rx="0" fill="#FFD23F" /><rect x="8" y="-32" width="4" height="6" rx="0" fill="#FFD23F" /><rect x="-26" y="-12" width="4" height="5" rx="0" fill="#FFD23F" /><rect x="-20" y="-12" width="4" height="5" rx="0" fill="#FFD23F" /><rect x="-4" y="-20" width="4" height="6" rx="0" fill="#FFD23F" /><rect x="2" y="-20" width="4" height="6" rx="0" fill="#FFD23F" /><rect x="8" y="-20" width="4" height="6" rx="0" fill="#FFD23F" /></g><g transform="translate(180 214) scale(0.7)" class="bob d1"><circle cx="0" cy="-34" r="8" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2.2" /><path d="M-11 0 Q-11 -22 0 -22 Q11 -22 11 0Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="204" y="132" width="80" height="82" rx="0" fill="#E9E2FF" stroke="#2B2F4A" stroke-width="2.5" /><g transform="translate(244 132) scale(1.0)"><rect x="-30" y="-30" width="60" height="30" rx="0" fill="#D9E7F7" stroke="#2B2F4A" stroke-width="2.5" /><path d="M-34 -30 H34 L26 -42 H-26Z" fill="#8FB0DC" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="-21" y="-24" width="6" height="14" rx="0" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.8" /><rect x="-9" y="-24" width="6" height="14" rx="0" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.8" /><rect x="3" y="-24" width="6" height="14" rx="0" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.8" /><rect x="15" y="-24" width="6" height="14" rx="0" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.8" /><rect x="-6" y="-14" width="12" height="14" rx="1" fill="#6B4A3A" stroke="#2B2F4A" stroke-width="2" /></g><g transform="translate(272 214) scale(0.7)" class="bob d2"><circle cx="0" cy="-34" r="8" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2.2" /><path d="M-11 0 Q-11 -22 0 -22 Q11 -22 11 0Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="296" y="116" width="80" height="98" rx="0" fill="#FFF3C4" stroke="#2B2F4A" stroke-width="2.5" /><g transform="translate(336 116) scale(1.0)"><rect x="-30" y="-26" width="60" height="26" rx="0" fill="#F3D9A4" stroke="#2B2F4A" stroke-width="2.5" /><rect x="-34" y="-30" width="68" height="6" rx="0" fill="#E9C987" stroke="#2B2F4A" stroke-width="2.5" /><rect x="-23" y="-26" width="6" height="26" rx="0" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="1.8" /><rect x="-11" y="-26" width="6" height="26" rx="0" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="1.8" /><rect x="5" y="-26" width="6" height="26" rx="0" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="1.8" /><rect x="17" y="-26" width="6" height="26" rx="0" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="1.8" /><path d="M-16 -30 Q0 -62 16 -30Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 -58 V-70" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 -70 l10 3 l-10 3z" fill="#E5484D" stroke="#2B2F4A" stroke-width="1.5"/></g><g transform="translate(364 214) scale(0.7)" class="bob d3"><circle cx="0" cy="-34" r="8" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2.2" /><path d="M-11 0 Q-11 -22 0 -22 Q11 -22 11 0Z" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g></svg>