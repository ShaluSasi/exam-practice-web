<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A year calendar with three months marked by small seated figures for Gram Sabha meetings</title><style>.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.1)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.blink{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
.rock{animation:rock 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fade{animation:fade 3s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
.slide{animation:slide 3s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.slidel{animation:slidel 3s ease-in-out infinite alternate}@keyframes slidel{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
.down{animation:down 2.4s ease-in infinite}@keyframes down{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.up{animation:up 2.4s ease-in infinite}@keyframes up{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-10px);opacity:0}}
.grow{animation:grow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="26" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle" >One year in the village</text><rect x="38" y="46" width="48" height="56" rx="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><rect x="38" y="46" width="48" height="14" rx="6" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" /><text x="62" y="78" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Jan</text><rect x="92" y="46" width="48" height="56" rx="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><rect x="92" y="46" width="48" height="14" rx="6" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" /><text x="116" y="78" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Feb</text><rect x="146" y="46" width="48" height="56" rx="6" fill="#FFE6C7" stroke="#2B2F4A" stroke-width="2.5" /><rect x="146" y="46" width="48" height="14" rx="6" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" /><text x="170" y="78" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Mar</text><g transform="translate(170 99) scale(0.42)" class="bob d2"><circle cx="0" cy="-34" r="8" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2.2" /><path d="M-11 0 Q-11 -22 0 -22 Q11 -22 11 0Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="200" y="46" width="48" height="56" rx="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><rect x="200" y="46" width="48" height="14" rx="6" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" /><text x="224" y="78" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Apr</text><rect x="254" y="46" width="48" height="56" rx="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><rect x="254" y="46" width="48" height="14" rx="6" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" /><text x="278" y="78" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >May</text><rect x="308" y="46" width="48" height="56" rx="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><rect x="308" y="46" width="48" height="14" rx="6" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" /><text x="332" y="78" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Jun</text><rect x="38" y="118" width="48" height="56" rx="6" fill="#FFE6C7" stroke="#2B2F4A" stroke-width="2.5" /><rect x="38" y="118" width="48" height="14" rx="6" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" /><text x="62" y="150" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Jul</text><g transform="translate(62 171) scale(0.42)" class="bob d2"><circle cx="0" cy="-34" r="8" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2.2" /><path d="M-11 0 Q-11 -22 0 -22 Q11 -22 11 0Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="92" y="118" width="48" height="56" rx="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><rect x="92" y="118" width="48" height="14" rx="6" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" /><text x="116" y="150" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Aug</text><rect x="146" y="118" width="48" height="56" rx="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><rect x="146" y="118" width="48" height="14" rx="6" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" /><text x="170" y="150" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Sep</text><rect x="200" y="118" width="48" height="56" rx="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><rect x="200" y="118" width="48" height="14" rx="6" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" /><text x="224" y="150" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Oct</text><rect x="254" y="118" width="48" height="56" rx="6" fill="#FFE6C7" stroke="#2B2F4A" stroke-width="2.5" /><rect x="254" y="118" width="48" height="14" rx="6" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" /><text x="278" y="150" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Nov</text><g transform="translate(278 171) scale(0.42)" class="bob d2"><circle cx="0" cy="-34" r="8" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2.2" /><path d="M-11 0 Q-11 -22 0 -22 Q11 -22 11 0Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="308" y="118" width="48" height="56" rx="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><rect x="308" y="118" width="48" height="14" rx="6" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" /><text x="332" y="150" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Dec</text><text x="200" y="206" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Gram Sabha meetings are marked</text><text x="200" y="226" font-family="sans-serif" font-size="11" font-weight="600" fill="#555B6B" text-anchor="middle" >(all the voters of the village)</text></svg>