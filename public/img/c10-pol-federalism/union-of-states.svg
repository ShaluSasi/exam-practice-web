<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A large box called Union of India containing eight smaller boxes labelled State</title><style>.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.1)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.blink{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
.rock{animation:rock 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fade{animation:fade 3s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
.slide{animation:slide 3s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.slidel{animation:slidel 3s ease-in-out infinite alternate}@keyframes slidel{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
.down{animation:down 2.4s ease-in infinite}@keyframes down{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.up{animation:up 2.4s ease-in infinite}@keyframes up{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-10px);opacity:0}}
.grow{animation:grow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="14" y="18" width="372" height="206" rx="18" fill="#FFE6C7" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="44" font-family="sans-serif" font-size="15" font-weight="800" fill="#2B2F4A" text-anchor="middle" >Union of India</text><rect x="34" y="64" width="76" height="50" rx="10" fill="#DFF3DF" stroke="#2B2F4A" stroke-width="2.5" class="pulse d0"/><text x="72.0" y="93.2" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >State</text><rect x="122" y="64" width="76" height="50" rx="10" fill="#DFF3DF" stroke="#2B2F4A" stroke-width="2.5" class="pulse d1"/><text x="160.0" y="93.2" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >State</text><rect x="210" y="64" width="76" height="50" rx="10" fill="#DFF3DF" stroke="#2B2F4A" stroke-width="2.5" class="pulse d2"/><text x="248.0" y="93.2" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >State</text><rect x="298" y="64" width="76" height="50" rx="10" fill="#DFF3DF" stroke="#2B2F4A" stroke-width="2.5" class="pulse d3"/><text x="336.0" y="93.2" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >State</text><rect x="34" y="136" width="76" height="50" rx="10" fill="#DFF3DF" stroke="#2B2F4A" stroke-width="2.5" class="pulse d0"/><text x="72.0" y="165.2" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >State</text><rect x="122" y="136" width="76" height="50" rx="10" fill="#DFF3DF" stroke="#2B2F4A" stroke-width="2.5" class="pulse d1"/><text x="160.0" y="165.2" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >State</text><rect x="210" y="136" width="76" height="50" rx="10" fill="#DFF3DF" stroke="#2B2F4A" stroke-width="2.5" class="pulse d2"/><text x="248.0" y="165.2" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >State</text><rect x="298" y="136" width="76" height="50" rx="10" fill="#DFF3DF" stroke="#2B2F4A" stroke-width="2.5" class="pulse d3"/><text x="336.0" y="165.2" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >State</text></svg>