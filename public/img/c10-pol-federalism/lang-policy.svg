<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Several language speech chips around a yellow question mark, and an exam paper asking the candidate to choose a language</title><style>.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.1)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.blink{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
.rock{animation:rock 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fade{animation:fade 3s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
.slide{animation:slide 3s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.slidel{animation:slidel 3s ease-in-out infinite alternate}@keyframes slidel{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
.down{animation:down 2.4s ease-in infinite}@keyframes down{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.up{animation:up 2.4s ease-in infinite}@keyframes up{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-10px);opacity:0}}
.grow{animation:grow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><circle cx="200" cy="64" r="34" fill="#FFD23F" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="78" font-family="sans-serif" font-size="40" font-weight="800" fill="#2B2F4A" text-anchor="middle" class="pulse">?</text><rect x="50" y="34" width="64" height="32" rx="16" fill="#FFE6C7" stroke="#2B2F4A" stroke-width="2.5" /><text x="80.0" y="53.85" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Tamil</text><rect x="50" y="80" width="64" height="32" rx="16" fill="#DFF3DF" stroke="#2B2F4A" stroke-width="2.5" /><text x="80.0" y="99.85" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Bengali</text><rect x="300" y="34" width="64" height="32" rx="16" fill="#E9E2FF" stroke="#2B2F4A" stroke-width="2.5" /><text x="330.0" y="53.85" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Telugu</text><rect x="300" y="80" width="64" height="32" rx="16" fill="#FFE6C7" stroke="#2B2F4A" stroke-width="2.5" /><text x="330.0" y="99.85" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Marathi</text><rect x="50" y="126" width="64" height="32" rx="16" fill="#DFF3DF" stroke="#2B2F4A" stroke-width="2.5" /><text x="80.0" y="145.85" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Urdu</text><rect x="300" y="126" width="64" height="32" rx="16" fill="#E9E2FF" stroke="#2B2F4A" stroke-width="2.5" /><text x="330.0" y="145.85" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Gujarati</text><rect x="80" y="170" width="240" height="42" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><text x="200.0" y="187.7" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Exam for Central Govt jobs:</text><text x="200.0" y="202.7" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >choose your language</text><g transform="translate(60 214) scale(1)"><circle cx="0" cy="-34" r="8" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2.2" /><path d="M-11 0 Q-11 -22 0 -22 Q11 -22 11 0Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(340 214) scale(1)"><circle cx="0" cy="-34" r="8" fill="#F2B48C" stroke="#2B2F4A" stroke-width="2.2" /><path d="M-11 0 Q-11 -22 0 -22 Q11 -22 11 0Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="200" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Which language is the national language?</text></svg>