<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Three columns headed Union List, State List and Concurrent List, each with three example subjects</title><style>.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.1)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.blink{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
.rock{animation:rock 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fade{animation:fade 3s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
.slide{animation:slide 3s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.slidel{animation:slidel 3s ease-in-out infinite alternate}@keyframes slidel{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
.down{animation:down 2.4s ease-in infinite}@keyframes down{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.up{animation:up 2.4s ease-in infinite}@keyframes up{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-10px);opacity:0}}
.grow{animation:grow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="12" y="12" width="116" height="34" rx="10" fill="#FFE6C7" stroke="#2B2F4A" stroke-width="2.5" /><text x="70.0" y="33.2" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Union List</text><rect x="16" y="58" width="108" height="34" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><text x="70.0" y="78.85" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Defence</text><rect x="16" y="102" width="108" height="34" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><text x="70.0" y="122.85" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Foreign affairs</text><rect x="16" y="146" width="108" height="34" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><text x="70.0" y="166.85" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Banking</text><g transform="translate(70 226) scale(0.62)"><path d="M0 -48 L22 -40 V-22 Q22 -6 0 2 Q-22 -6 -22 -22 V-40Z" fill="#7F8FB5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 -38 V-6 M-10 -26 H10" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="142" y="12" width="116" height="34" rx="10" fill="#DFF3DF" stroke="#2B2F4A" stroke-width="2.5" /><text x="200.0" y="33.2" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >State List</text><rect x="146" y="58" width="108" height="34" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><text x="200.0" y="78.85" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Police</text><rect x="146" y="102" width="108" height="34" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><text x="200.0" y="122.85" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Agriculture</text><rect x="146" y="146" width="108" height="34" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><text x="200.0" y="166.85" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Trade</text><g transform="translate(200 226) scale(0.62)"><path d="M-22 -14 Q-22 -42 0 -42 Q22 -42 22 -14Z" fill="#3B4A7A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="-26" y="-14" width="52" height="8" rx="3" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="0" cy="-28" r="5" fill="#FFD23F" stroke="#2B2F4A" stroke-width="1.8" /></g><rect x="272" y="12" width="116" height="34" rx="10" fill="#E9E2FF" stroke="#2B2F4A" stroke-width="2.5" /><text x="330.0" y="33.2" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Concurrent List</text><rect x="276" y="58" width="108" height="34" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><text x="330.0" y="78.85" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Education</text><rect x="276" y="102" width="108" height="34" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><text x="330.0" y="122.85" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Forests</text><rect x="276" y="146" width="108" height="34" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><text x="330.0" y="166.85" font-family="sans-serif" font-size="11" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Marriage</text><g transform="translate(330 226) scale(0.62)"><rect x="-24" y="-34" width="48" height="34" rx="3" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="3" /><rect x="-18" y="-28" width="36" height="6" rx="2" fill="#fff" /><path d="M-18 -16 H18 M-18 -10 H8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g></svg>