<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A village hut with a calendar, a coin and a shield each crossed out in red</title><style>.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.1)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.blink{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
.rock{animation:rock 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fade{animation:fade 3s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
.slide{animation:slide 3s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.slidel{animation:slidel 3s ease-in-out infinite alternate}@keyframes slidel{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
.down{animation:down 2.4s ease-in infinite}@keyframes down{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.up{animation:up 2.4s ease-in infinite}@keyframes up{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-10px);opacity:0}}
.grow{animation:grow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><g transform="translate(200 170) scale(1.9)"><rect x="-24" y="-26" width="48" height="26" rx="0" fill="#E8C79A" stroke="#2B2F4A" stroke-width="2.5" /><path d="M-30 -26 L0 -52 L30 -26Z" fill="#B5523B" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="-7" y="-18" width="14" height="18" rx="2" fill="#6B4A3A" stroke="#2B2F4A" stroke-width="2" /><rect x="10" y="-20" width="10" height="10" rx="1" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="1.8" /></g><text x="200" y="24" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Local bodies today: gaps</text><rect x="36" y="52" width="64" height="52" rx="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><rect x="36" y="52" width="64" height="14" rx="6" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" /><path d="M46 82 H90 M46 94 H80" fill="none" stroke="#C9CED6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(100 56) scale(1)"><circle cx="0" cy="0" r="11" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" /><path d="M-5 -5 L5 5 M5 -5 L-5 5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(340 118) scale(1.3)"><circle cx="0" cy="-22" r="20" fill="#FFD23F" stroke="#2B2F4A" stroke-width="3" /><circle cx="0" cy="-22" r="13" fill="none" stroke="#C99A00" stroke-width="2" /><text x="0" y="-15" font-family="sans-serif" font-size="20" font-weight="800" fill="#2B2F4A" text-anchor="middle" >₹</text></g><g transform="translate(366 66) scale(1)"><circle cx="0" cy="0" r="11" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" /><path d="M-5 -5 L5 5 M5 -5 L-5 5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(60 226) scale(1)"><path d="M0 -48 L22 -40 V-22 Q22 -6 0 2 Q-22 -6 -22 -22 V-40Z" fill="#7F8FB5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 -38 V-6 M-10 -26 H10" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(86 190) scale(1)"><circle cx="0" cy="0" r="11" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" /><path d="M-5 -5 L5 5 M5 -5 L-5 5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g></svg>