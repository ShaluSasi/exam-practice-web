<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A Union government box and a State government box in dispute, both pointing to a court with scales</title><style>.pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.1)}}
.bob{animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.blink{animation:blink 1.6s steps(2) infinite}@keyframes blink{50%{opacity:.3}}
.dash{stroke-dasharray:7 7;animation:dash 1s linear infinite}@keyframes dash{to{stroke-dashoffset:-14}}
.rock{animation:rock 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}@keyframes rock{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.fade{animation:fade 3s ease-in-out infinite}@keyframes fade{0%,100%{opacity:.25}50%{opacity:1}}
.slide{animation:slide 3s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.slidel{animation:slidel 3s ease-in-out infinite alternate}@keyframes slidel{from{transform:translateX(10px)}to{transform:translateX(-10px)}}
.down{animation:down 2.4s ease-in infinite}@keyframes down{from{transform:translateY(-8px);opacity:0}30%{opacity:1}to{transform:translateY(10px);opacity:0}}
.up{animation:up 2.4s ease-in infinite}@keyframes up{from{transform:translateY(8px);opacity:0}30%{opacity:1}to{transform:translateY(-10px);opacity:0}}
.grow{animation:grow 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes grow{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}.d4{animation-delay:1.6s}.d5{animation-delay:2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="14" y="28" width="116" height="34" rx="10" fill="#FFE6C7" stroke="#2B2F4A" stroke-width="2.5" /><text x="72.0" y="49.2" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Union Govt</text><rect x="270" y="28" width="116" height="34" rx="10" fill="#DFF3DF" stroke="#2B2F4A" stroke-width="2.5" /><text x="328.0" y="49.2" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >State Govt</text><path d="M190 40 L204 60 L196 60 L210 84 L190 62 L198 62Z" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="blink"/><path d="M72 66 L165.3 117.4" fill="none" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="dash"/><polygon points="170.0,120.0 161.0,120.0 165.2,112.4" fill="#0B93D4"/><path d="M328 66 L234.7 117.4" fill="none" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="dash"/><polygon points="230.0,120.0 234.8,112.4 239.0,120.0" fill="#0B93D4"/><g transform="translate(200 222) scale(1.7)"><rect x="-30" y="-8" width="60" height="8" rx="0" fill="#E9C987" stroke="#2B2F4A" stroke-width="2.5" /><path d="M-30 -34 L0 -50 L30 -34Z" fill="#F3D9A4" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="-25" y="-34" width="6" height="26" rx="0" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="1.8" /><rect x="-11" y="-34" width="6" height="26" rx="0" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="1.8" /><rect x="5" y="-34" width="6" height="26" rx="0" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="1.8" /><rect x="19" y="-34" width="6" height="26" rx="0" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="1.8" /><rect x="-30" y="-38" width="60" height="5" rx="0" fill="#E9C987" stroke="#2B2F4A" stroke-width="2.5" /><g transform="translate(0 -48) scale(0.45)"><g class="rock"><path d="M-26 -40 H26 M0 -52 V0" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M-26 -40 L-34 -20 H-18Z M26 -40 L18 -20 H34Z" fill="#FFD23F" stroke="#2B2F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="-12" y="-4" width="24" height="4" rx="1" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1" /></g></g></svg>