<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 350" role="img">
<title>A rectangle that changes shape while its perimeter stays fixed</title>
<style>.t{font:600 14px system-ui,sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui,sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}.big{font:700 22px system-ui,sans-serif;fill:#2B2F4A}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="30" y="40" width="30" height="270" rx="2" fill="#CDEBFA" stroke="#0B93D4" stroke-width="3"><animate attributeName="width" values="30;90;150;210;270;210;150;90;30" dur="8s" repeatCount="indefinite"/><animate attributeName="height" values="270;210;150;90;30;90;150;210;270" dur="8s" repeatCount="indefinite"/></rect><text x="180" y="24" class="t m">Perimeter always 40 units</text>
</svg>
