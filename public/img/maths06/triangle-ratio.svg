<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<polygon points="30,140 310,140 124.3,65.8" fill="#FBE7B0" stroke="#C9971B" stroke-width="3" stroke-linejoin="round" /><text x="170" y="162" class="t m">7x</text><text x="66" y="94" class="t m">3x</text><text x="228" y="90" class="t m">5x</text><text x="170" y="192" class="s m">Triangular plot, perimeter 300 m</text>
