<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 235" role="img">
<title>Two calendar cards for the days celebrated for the number pi</title>
<style>.t{font:600 14px system-ui,sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui,sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}.big{font:700 22px system-ui,sans-serif;fill:#2B2F4A}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="30" y="30" width="120" height="130" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="2.5"/><rect x="30" y="30" width="120" height="30" rx="10" fill="#E5484D"/><text x="90" y="52" class="s m" style="fill:#fff">MARCH</text><text x="90" y="110" class="big m">3-14</text><text x="90" y="140" class="s m">Pi Day</text><rect x="190" y="30" width="120" height="130" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="2.5"/><rect x="190" y="30" width="120" height="30" rx="10" fill="#0B93D4"/><text x="250" y="52" class="s m" style="fill:#fff">JULY</text><text x="250" y="110" class="big m">22-7</text><text x="250" y="140" class="s m">Pi Approx. Day</text><circle cx="170" cy="195" r="26" fill="#CDEBFA" stroke="#0B93D4" stroke-width="3" /><text x="170" y="202" class="big m">π</text>
</svg>
