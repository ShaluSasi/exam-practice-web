<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Two equal circles, each passing through the centre of the other</title>
<style>.t{font:600 14px system-ui,sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui,sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}.big{font:700 22px system-ui,sans-serif;fill:#2B2F4A}@media (prefers-reduced-motion: reduce){*{animation:none!important}}@keyframes flow{to{stroke-dashoffset:-44}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="150" cy="120" r="100" fill="#CDEBFA" stroke="#0B93D4" stroke-width="3" fill-opacity=".6"/><circle cx="250" cy="120" r="100" fill="#FFD9B0" stroke="#FF8A1F" stroke-width="3" fill-opacity=".6"/><line x1="150" y1="120" x2="250" y2="120" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><circle cx="150" cy="120" r="3.5" fill="#2B2F4A"/><circle cx="250" cy="120" r="3.5" fill="#2B2F4A"/><text x="150" y="142" class="t m">A</text><text x="250" y="142" class="t m">B</text>
</svg>
