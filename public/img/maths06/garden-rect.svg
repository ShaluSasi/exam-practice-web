<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" role="img">
<title>A rectangular garden with a fence round its border</title>
<style>.t{font:600 14px system-ui,sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui,sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}.big{font:700 22px system-ui,sans-serif;fill:#2B2F4A}@media (prefers-reduced-motion: reduce){*{animation:none!important}}@keyframes flow{to{stroke-dashoffset:-26}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="70" y="50" width="220" height="140" rx="4" fill="#CDEBCB" stroke="#2B2F4A" stroke-width="3"/><rect x="70" y="50" width="220" height="140" rx="4" fill="none" stroke="#FF8A1F" stroke-width="5" stroke-dasharray="3 10" style="animation:flow 2s linear infinite"/><text x="180" y="40" class="t m">length 11 m</text><text x="310" y="124" class="t">width ?</text><text x="180" y="126" class="big m">Garden</text><text x="180" y="222" class="t m">Fence all the way round: 36 m</text>
