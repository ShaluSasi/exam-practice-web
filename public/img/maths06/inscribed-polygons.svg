<style>.t{font:600 14px system-ui,sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui,sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}.big{font:700 22px system-ui,sans-serif;fill:#2B2F4A}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="70" cy="85" r="52" fill="#CDEBFA" stroke="#0B93D4" stroke-width="2.5" /><polygon points="70,33 25,111 115,111" fill="#FFD9B0" stroke="#FF8A1F" stroke-width="2.5" stroke-linejoin="round" /><text x="70" y="165" class="t m">A</text><circle cx="200" cy="85" r="52" fill="#CDEBFA" stroke="#0B93D4" stroke-width="2.5" /><polygon points="200,33 148,85 200,137 252,85" fill="#FFD9B0" stroke="#FF8A1F" stroke-width="2.5" stroke-linejoin="round" /><text x="200" y="165" class="t m">B</text><circle cx="330" cy="85" r="52" fill="#CDEBFA" stroke="#0B93D4" stroke-width="2.5" /><polygon points="330,33 285,59 285,111 330,137 375,111 375,59" fill="#FFD9B0" stroke="#FF8A1F" stroke-width="2.5" stroke-linejoin="round" /><text x="330" y="165" class="t m">C</text><circle cx="460" cy="85" r="52" fill="#CDEBFA" stroke="#0B93D4" stroke-width="2.5" /><polygon points="460,33 434,40 415,59 408,85 415,111 434,130 460,137 486,130 505,111 512,85 505,59 486,40" fill="#FFD9B0" stroke="#FF8A1F" stroke-width="2.5" stroke-linejoin="round" /><text x="460" y="165" class="t m">D</text>
</svg>
