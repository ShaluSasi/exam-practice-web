<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 190" role="img">
<title>A tyre rolling along a road with a red mark on its rim</title>
<style>.t{font:600 14px system-ui,sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui,sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}.big{font:700 22px system-ui,sans-serif;fill:#2B2F4A}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.roll{animation:roll 4s linear infinite}.spin{transform-origin:60px 112px;animation:spin 4s linear infinite}@keyframes roll{from{transform:translateX(0)}to{transform:translateX(255px)}}@keyframes spin{to{transform:rotate(360deg)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<line x1="20" y1="160" x2="380" y2="160" stroke="#8A7A55" stroke-width="4" stroke-linecap="round" /><rect x="20" y="162" width="360" height="20" fill="#D9C49A"/><g class="roll"><g class="spin"><circle cx="60" cy="112" r="44" fill="#444A6E" stroke="#2B2F4A" stroke-width="3" /><circle cx="60" cy="112" r="32" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="2.5" /><line x1="60" y1="112" x2="60" y2="80" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="60" y1="112" x2="32.3" y2="96" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="60" y1="112" x2="32.3" y2="128" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="60" y1="112" x2="60" y2="144" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="60" y1="112" x2="87.7" y2="128" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="60" y1="112" x2="87.7" y2="96" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><circle cx="60" cy="74" r="5" fill="#E5484D"/></g></g><text x="200" y="28" class="t m">Tyre diameter: 56 cm</text>
</svg>
