<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 190" role="img">
<title>A rectangle and a dashed square that have the same area</title>
<style>.t{font:600 14px system-ui,sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui,sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}.big{font:700 22px system-ui,sans-serif;fill:#2B2F4A}@media (prefers-reduced-motion: reduce){*{animation:none!important}}@keyframes flow{to{stroke-dashoffset:-30}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="20" y="60" width="180" height="80" fill="#CDEBFA" stroke="#0B93D4" stroke-width="3"/><rect x="270" y="40" width="120" height="120" fill="#FFD9B0" stroke="#FF8A1F" stroke-width="3" stroke-dasharray="9 6" style="animation:flow 2.5s linear infinite"/><text x="110" y="52" class="t m">18 cm</text><text x="8" y="106" class="s">8</text><text x="330" y="106" class="big m">?</text><text x="330" y="32" class="t m">side x</text><text x="235" y="108" class="big m">=</text><text x="235" y="126" class="s m">area</text>
</svg>
