<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img">
<title>A circle with its diameter marked beside a dashed square of unknown side</title>
<style>.t{font:600 14px system-ui,sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui,sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}.big{font:700 22px system-ui,sans-serif;fill:#2B2F4A}@media (prefers-reduced-motion: reduce){*{animation:none!important}}@keyframes flow{to{stroke-dashoffset:-28}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="100" cy="115" r="80" fill="#CDEBFA" stroke="#0B93D4" stroke-width="3" /><line x1="20" y1="115" x2="180" y2="115" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><circle cx="100" cy="115" r="3.5" fill="#2B2F4A"/><text x="100" y="105" class="s m">d = 18 cm</text><rect x="215" y="40" width="75" height="75" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-dasharray="8 6" style="animation:flow 2.5s linear infinite"/><text x="252" y="84" class="t m">area?</text><text x="252" y="134" class="s m">side = ?</text><text x="150" y="222" class="s m">A circle and a square with nearly equal area</text>
