<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 195" role="img">
<title>A circle, and a right-angled triangle whose legs are the radius and the unrolled circumference</title>
<style>.t{font:600 14px system-ui,sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui,sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}.big{font:700 22px system-ui,sans-serif;fill:#2B2F4A}@media (prefers-reduced-motion: reduce){*{animation:none!important}}@keyframes flow{to{stroke-dashoffset:-32}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="60" cy="80" r="40" fill="#CDEBFA" stroke="#0B93D4" stroke-width="3" /><line x1="60" y1="80" x2="100" y2="80" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><circle cx="60" cy="80" r="3.5" fill="#2B2F4A"/><text x="80" y="72" class="s m">r</text><text x="150" y="84" class="big m">→</text><polygon points="160,150 160,110 411,150" fill="#FFD9B0" stroke="#FF8A1F" stroke-width="3" stroke-linejoin="round" /><line x1="160" y1="150" x2="160" y2="110" stroke="#E5484D" stroke-width="4" stroke-linecap="round" /><line x1="160" y1="150" x2="411" y2="150" stroke="#0B93D4" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 6" style="animation:flow 3s linear infinite"/><path d="M169 150 L169 141 L160 141" fill="none" stroke="#2B2F4A" stroke-width="1.8"/><text x="140" y="134" class="s m">r</text><text x="285" y="174" class="s m">circumference unrolled</text><text x="150" y="188" class="s m">r = 7 cm, C = 44 cm</text>
</svg>
