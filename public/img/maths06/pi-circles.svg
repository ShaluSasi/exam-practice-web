<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 235" role="img">
<title>Three circles of different sizes with a diameter drawn in each</title>
<style>.t{font:600 14px system-ui,sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui,sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}.big{font:700 22px system-ui,sans-serif;fill:#2B2F4A}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="60" cy="110" r="30" fill="#CDEBFA" stroke="#0B93D4" stroke-width="3" /><circle cx="160" cy="100" r="50" fill="#FFD9B0" stroke="#FF8A1F" stroke-width="3" /><circle cx="290" cy="90" r="70" fill="#CDEBCB" stroke="#3FA34D" stroke-width="3" /><line x1="30" y1="110" x2="90" y2="110" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="110" y1="100" x2="210" y2="100" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="220" y1="90" x2="360" y2="90" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="180" y="220" class="t m">Small, medium and large circles</text><text x="180" y="24" class="big m">π</text>
</svg>
