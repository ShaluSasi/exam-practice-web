<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 195" role="img">
<title>A number line from 3.10 to 3.18 with tick marks</title>
<style>.t{font:600 14px system-ui,sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui,sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}.big{font:700 22px system-ui,sans-serif;fill:#2B2F4A}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<line x1="30" y1="100" x2="400" y2="100" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="40" y1="90" x2="40" y2="110" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><text x="40" y="132" class="s m">3.10</text><line x1="125" y1="90" x2="125" y2="110" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><text x="125" y="132" class="s m">3.12</text><line x1="210" y1="90" x2="210" y2="110" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><text x="210" y="132" class="s m">3.14</text><line x1="295" y1="90" x2="295" y2="110" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><text x="295" y="132" class="s m">3.16</text><line x1="380" y1="90" x2="380" y2="110" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><text x="380" y="132" class="s m">3.18</text><text x="215" y="56" class="t m">Where do the estimates of π fall?</text><text x="215" y="170" class="s m">A part of the number line from 3.10 to 3.18</text>
</svg>
