<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 200" role="img">
<title>Four different four-sided figures labelled A to D</title>
<style>.t{font:600 14px system-ui,sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui,sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}.big{font:700 22px system-ui,sans-serif;fill:#2B2F4A}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<polygon points="70,20 110,85 70,150 30,85" fill="#F9D0D3" stroke="#E5484D" stroke-width="2.5" stroke-linejoin="round" /><text x="70" y="178" class="t m">A</text><polygon points="150,140 235,140 255,40 170,40" fill="#CDEBCB" stroke="#3FA34D" stroke-width="2.5" stroke-linejoin="round" /><text x="200" y="178" class="t m">B</text><polygon points="330,15 372,60 330,150 288,60" fill="#FBE7B0" stroke="#C9971B" stroke-width="2.5" stroke-linejoin="round" /><text x="330" y="178" class="t m">C</text><rect x="410" y="45" width="100" height="75" fill="#CDEBFA" stroke="#0B93D4" stroke-width="2.5"/><text x="460" y="178" class="t m">D</text>
</svg>
