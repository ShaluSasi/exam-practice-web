<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 245" role="img">
<title>A four-sided figure whose fourth side slowly shrinks</title>
<style>.t{font:600 14px system-ui,sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui,sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}.big{font:700 22px system-ui,sans-serif;fill:#2B2F4A}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<polygon points="90,60 300,80 260,210 40,215" fill="#FFD9B0" stroke="#FF8A1F" stroke-width="3" stroke-linejoin="round"><animate attributeName="points" values="90,60 300,80 260,210 40,215;90,60 300,80 260,210 55,170;90,60 300,80 260,210 70,120;90,60 300,80 260,210 82,85;90,60 300,80 260,210 90,60;90,60 300,80 260,210 82,85;90,60 300,80 260,210 70,120;90,60 300,80 260,210 55,170;90,60 300,80 260,210 40,215" dur="8s" repeatCount="indefinite"/></polygon><text x="90" y="48" class="t m">A</text><text x="312" y="82" class="t m">B</text><text x="262" y="232" class="t m">C</text><text x="28" y="232" class="t m">D</text><text x="180" y="24" class="t m">Fourth side shrinks</text>
</svg>
