<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 275" role="img">
<title>A circle with one quarter of its disc shaded</title>
<style>.t{font:600 14px system-ui,sans-serif;fill:#2B2F4A}.s{font:600 12px system-ui,sans-serif;fill:#2B2F4A}.m{text-anchor:middle}.e{text-anchor:end}.big{font:700 22px system-ui,sans-serif;fill:#2B2F4A}@media (prefers-reduced-motion: reduce){*{animation:none!important}}@keyframes pulse{50%{fill:#A7DCA3}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="150" cy="150" r="90" fill="#FFF" stroke="#A3A8CC" stroke-width="2.5" stroke-dasharray="6 6"/><path d="M150 150L240 150A90 90 0 0 0 150 60Z" fill="#CDEBCB" stroke="#3FA34D" stroke-width="3" stroke-linejoin="round" style="animation:pulse 2.4s ease-in-out infinite"/><circle cx="150" cy="150" r="3.5" fill="#2B2F4A"/><text x="150" y="28" class="t m">Whole circle: circumference 44 cm</text><text x="150" y="262" class="s m">Shaded part is a quarter of the disc</text>
</svg>
