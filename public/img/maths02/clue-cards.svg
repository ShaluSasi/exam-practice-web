<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" role="img"><title>Three clue cards about two linear polynomials p(x) and q(x)</title><style>text{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}.cc{animation:sl 3s ease-in-out infinite}@keyframes sl{0%,100%{transform:none}50%{transform:translateX(8px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><g class="cc" style="animation-delay:0.0s"><rect x="40" y="24" width="400" height="60" rx="12" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="74" cy="54" r="16" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><text x="74.0" y="60.0" font-size="16" text-anchor="middle">1</text><text x="250.0" y="61.0" font-size="19" text-anchor="middle">p(0) = 5</text></g><g class="cc" style="animation-delay:0.5s"><rect x="40" y="100" width="400" height="60" rx="12" fill="#FDE2C4" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="74" cy="130" r="16" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><text x="74.0" y="136.0" font-size="16" text-anchor="middle">2</text><text x="250.0" y="137.0" font-size="19" text-anchor="middle">p(x) − q(x) is 0 at x = 3</text></g><g class="cc" style="animation-delay:1.0s"><rect x="40" y="176" width="400" height="60" rx="12" fill="#D7F0D9" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="74" cy="206" r="16" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><text x="74.0" y="212.0" font-size="16" text-anchor="middle">3</text><text x="250.0" y="213.0" font-size="19" text-anchor="middle">p(x) + q(x) = 6x + 4</text></g></svg>