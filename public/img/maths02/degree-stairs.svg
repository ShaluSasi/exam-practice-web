<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" role="img"><title>A staircase whose steps are labelled degree 0 to degree 4</title><style>text{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}.bl{animation:climb 5s ease-in-out infinite}@keyframes climb{0%{transform:translate(0,0)}20%{transform:translate(78px,-36px)}40%{transform:translate(156px,-72px)}60%{transform:translate(234px,-108px)}80%,100%{transform:translate(312px,-144px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="40" y="200" width="78" height="30" fill="#F9D6D7" stroke="#2B2F4A" stroke-width="2.5"/><text x="79.0" y="220.0" font-size="13" text-anchor="middle">degree 0</text><rect x="118" y="164" width="78" height="66" fill="#D7F0D9" stroke="#2B2F4A" stroke-width="2.5"/><text x="157.0" y="184.0" font-size="13" text-anchor="middle">degree 1</text><rect x="196" y="128" width="78" height="102" fill="#FDE2C4" stroke="#2B2F4A" stroke-width="2.5"/><text x="235.0" y="148.0" font-size="13" text-anchor="middle">degree 2</text><rect x="274" y="92" width="78" height="138" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><text x="313.0" y="112.0" font-size="13" text-anchor="middle">degree 3</text><rect x="352" y="56" width="78" height="174" fill="#E4DBFF" stroke="#2B2F4A" stroke-width="2.5"/><text x="391.0" y="76.0" font-size="13" text-anchor="middle">degree 4</text><circle class="bl" cx="79" cy="186" r="14" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5"/></svg>