<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 230" role="img"><title>Two digit cards a and b swapping places</title><style>text{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}.d1{animation:s1 4s ease-in-out infinite}.d2{animation:s2 4s ease-in-out infinite}@keyframes s1{0%,30%{transform:none}50%,80%{transform:translateX(80px)}100%{transform:none}}@keyframes s2{0%,30%{transform:none}50%,80%{transform:translateX(-80px)}100%{transform:none}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><g class="d1"><rect x="60" y="60" width="70" height="90" rx="12" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="3"/><text x="95.0" y="118.0" font-size="40" text-anchor="middle">a</text></g><g class="d2"><rect x="140" y="60" width="70" height="90" rx="12" fill="#FDE2C4" stroke="#2B2F4A" stroke-width="3"/><text x="175.0" y="118.0" font-size="40" text-anchor="middle">b</text></g><path d="M100 172q40 30 80 0" stroke="#A3A8CC" stroke-width="3" fill="none" stroke-dasharray="6 6"/><text x="300.0" y="104.0" font-size="26" text-anchor="middle">ab + ba</text><text x="300.0" y="140.0" font-size="26" text-anchor="middle">= 121</text><text x="135.0" y="210.0" font-size="15" text-anchor="middle">digits differ by 5</text></svg>