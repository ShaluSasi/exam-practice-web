<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" role="img"><title>An auto-rickshaw driving along a road with a fare meter</title><style>text{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}.rd{animation:mv 1.2s linear infinite}@keyframes mv{to{transform:translateX(-60px)}}.wh{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="190" width="480" height="60" fill="#8C8FA6"/><g class="rd"><path d="M-40 220H520" stroke="#fff" stroke-width="5" stroke-dasharray="30 30"/></g><path d="M110 180V110q0 -40 40 -46h80q30 0 40 30l20 50v36z" fill="#F6C453" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><path d="M110 120h40v-50q-40 6 -40 50z" fill="#3F8F4A" stroke="#2B2F4A" stroke-width="2"/><path d="M100 64h150" stroke="#3F8F4A" stroke-width="12" stroke-linecap="round"/><path d="M232 70l26 64h-36z" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2"/><g class="wh" style="transform-origin:140px 186px"><circle cx="140" cy="186" r="20" fill="#2B2F4A"/><circle cx="140" cy="186" r="8" fill="#A3A8CC"/><path d="M122 186h36M140 168v36" stroke="#A3A8CC" stroke-width="2"/></g><g class="wh" style="transform-origin:270px 186px"><circle cx="270" cy="186" r="20" fill="#2B2F4A"/><circle cx="270" cy="186" r="8" fill="#A3A8CC"/><path d="M252 186h36M270 168v36" stroke="#A3A8CC" stroke-width="2"/></g><rect x="320" y="40" width="140" height="80" rx="10" fill="#1F3B4D" stroke="#2B2F4A" stroke-width="3"/><text x="390.0" y="70.0" font-size="13" text-anchor="middle" style="fill:#9CF0C4">FARE</text><text x="390.0" y="102.0" font-size="22" text-anchor="middle" style="fill:#9CF0C4">₹ - - -</text></svg>