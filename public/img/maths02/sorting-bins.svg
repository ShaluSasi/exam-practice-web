<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" role="img"><title>Polynomial cards dropping into bins named by degree</title><style>text{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}.cd{animation:fall 3.5s ease-in infinite}.c2{animation-delay:1.2s}.c3{animation-delay:2.3s}@keyframes fall{0%{transform:translateY(-30px);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translateY(80px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M20 130h100l-10 100h-80z" fill="#F9D6D7" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><text x="70.0" y="190.0" font-size="14" text-anchor="middle">Constant</text><path d="M135 130h100l-10 100h-80z" fill="#D7F0D9" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><text x="185.0" y="190.0" font-size="14" text-anchor="middle">Linear</text><path d="M250 130h100l-10 100h-80z" fill="#FDE2C4" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><text x="300.0" y="190.0" font-size="14" text-anchor="middle">Quadratic</text><path d="M365 130h100l-10 100h-80z" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><text x="415.0" y="190.0" font-size="14" text-anchor="middle">Cubic</text><g class="cd c1"><rect x="90" y="40" width="56" height="40" rx="8" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><text x="118.0" y="67.0" font-size="20" text-anchor="middle">?</text></g><g class="cd c2"><rect x="215" y="40" width="56" height="40" rx="8" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><text x="243.0" y="67.0" font-size="20" text-anchor="middle">?</text></g><g class="cd c3"><rect x="330" y="40" width="56" height="40" rx="8" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><text x="358.0" y="67.0" font-size="20" text-anchor="middle">?</text></g></svg>