<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250" role="img"><title>A wallet with fifteen-rupee notes flying out each day</title><style>text{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}.nt{animation:fly 3s ease-in infinite;opacity:0}.n1{animation-delay:1s}.n2{animation-delay:2s}@keyframes fly{0%{transform:translate(0,40px);opacity:0}20%{opacity:1}100%{transform:translate(170px,-70px) rotate(25deg);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="60" y="100" width="180" height="120" rx="16" fill="#8B5E3C" stroke="#2B2F4A" stroke-width="3"/><rect x="170" y="140" width="80" height="44" rx="10" fill="#A9744F" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="190" cy="162" r="6" fill="#F6C453"/><g class="nt n0"><rect x="90" y="70" width="90" height="44" rx="5" fill="#9ED9A4" stroke="#2B2F4A" stroke-width="2"/><text x="135.0" y="98.0" font-size="15" text-anchor="middle">₹15</text></g><g class="nt n1"><rect x="90" y="70" width="90" height="44" rx="5" fill="#9ED9A4" stroke="#2B2F4A" stroke-width="2"/><text x="135.0" y="98.0" font-size="15" text-anchor="middle">₹15</text></g><g class="nt n2"><rect x="90" y="70" width="90" height="44" rx="5" fill="#9ED9A4" stroke="#2B2F4A" stroke-width="2"/><text x="135.0" y="98.0" font-size="15" text-anchor="middle">₹15</text></g><rect x="290" y="70" width="110" height="120" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="3"/><rect x="290" y="70" width="110" height="30" rx="10" fill="#0B93D4"/><text x="345.0" y="150.0" font-size="20" text-anchor="middle">Day n</text></svg>