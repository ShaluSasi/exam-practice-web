<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img"><title>A Celsius thermometer and a Fahrenheit thermometer side by side</title><style>text{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}.hg{animation:rs 4s ease-in-out infinite alternate}@keyframes rs{from{transform:scaleY(.25)}to{transform:scaleY(1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="96" y="30" width="28" height="200" rx="14" fill="#fff" stroke="#2B2F4A" stroke-width="3"/><circle cx="110" cy="248" r="24" fill="#E5484D" stroke="#2B2F4A" stroke-width="3"/><rect class="hg" x="104" y="70" width="12" height="170" rx="6" fill="#E5484D" style="transform-origin:110px 240px"/><path d="M124 70h12" stroke="#2B2F4A" stroke-width="2.5"/><text x="142.0" y="75.0" font-size="15" text-anchor="start">100</text><path d="M124 200h12" stroke="#2B2F4A" stroke-width="2.5"/><text x="142.0" y="205.0" font-size="15" text-anchor="start">0</text><text x="110.0" y="20.0" font-size="16" text-anchor="middle">°C</text><rect x="296" y="30" width="28" height="200" rx="14" fill="#fff" stroke="#2B2F4A" stroke-width="3"/><circle cx="310" cy="248" r="24" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3"/><rect class="hg" x="304" y="70" width="12" height="170" rx="6" fill="#0B93D4" style="transform-origin:310px 240px"/><path d="M324 70h12" stroke="#2B2F4A" stroke-width="2.5"/><text x="342.0" y="75.0" font-size="15" text-anchor="start">212</text><path d="M324 200h12" stroke="#2B2F4A" stroke-width="2.5"/><text x="342.0" y="205.0" font-size="15" text-anchor="start">32</text><text x="310.0" y="20.0" font-size="16" text-anchor="middle">°F</text><path d="M150 70H290M150 200H290" stroke="#A3A8CC" stroke-width="2" stroke-dasharray="6 6"/></svg>