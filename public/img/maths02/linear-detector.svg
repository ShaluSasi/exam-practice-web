<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250" role="img"><title>A machine that checks whether a polynomial has degree 1</title><style>text{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}.ln{animation:dr 3s ease-in-out infinite}@keyframes dr{0%{stroke-dashoffset:160}60%,100%{stroke-dashoffset:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="120" y="50" width="200" height="150" rx="18" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="3"/><rect x="140" y="70" width="160" height="80" rx="8" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2"/><path class="ln" d="M150 140L290 80" stroke="#0B93D4" stroke-width="5" stroke-linecap="round" stroke-dasharray="160"/><text x="220.0" y="180.0" font-size="15" text-anchor="middle">Is the degree 1?</text><circle cx="60" cy="120" r="30" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="4"/><path d="M82 142l22 22" stroke="#C8925A" stroke-width="9" stroke-linecap="round"/><rect x="352" y="96" width="64" height="44" rx="8" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><text x="384.0" y="125.0" font-size="20" text-anchor="middle">?</text></svg>