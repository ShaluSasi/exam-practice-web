<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 270" role="img"><title>A 24 cm wire bent into a rectangle of length x cm</title><style>text{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}.wr{animation:dr 4s ease-in-out infinite}@keyframes dr{0%{stroke-dashoffset:720}60%,100%{stroke-dashoffset:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="100" y="60" width="240" height="120" rx="3" fill="#E3F2FD" stroke="#E7D3BC" stroke-width="7"/><rect class="wr" x="100" y="60" width="240" height="120" rx="3" fill="none" stroke="#C8925A" stroke-width="7" stroke-dasharray="720" stroke-linecap="round"/><text x="220.0" y="46.0" font-size="17" text-anchor="middle">x cm</text><text x="366.0" y="126.0" font-size="22" text-anchor="middle">?</text><path d="M100 230H340" stroke="#C8925A" stroke-width="7" stroke-linecap="round"/><text x="220.0" y="258.0" font-size="15" text-anchor="middle">wire: 24 cm</text><path d="M100 214v32M340 214v32" stroke="#2B2F4A" stroke-width="2"/></svg>