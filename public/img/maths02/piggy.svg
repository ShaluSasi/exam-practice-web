<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250" role="img"><title>A piggy bank receiving a coin every month</title><style>text{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}.cn{animation:dp 2.4s ease-in infinite}@keyframes dp{0%{transform:translateY(-10px);opacity:0}25%{opacity:1}75%{transform:translateY(50px);opacity:1}100%{transform:translateY(56px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><ellipse cx="180" cy="160" rx="100" ry="66" fill="#F7A8C4" stroke="#2B2F4A" stroke-width="3"/><circle cx="270" cy="146" r="22" fill="#F7A8C4" stroke="#2B2F4A" stroke-width="3"/><circle cx="276" cy="146" r="4" fill="#2B2F4A"/><circle cx="266" cy="146" r="4" fill="#2B2F4A"/><path d="M110 106l10 -26 20 20z" fill="#F7A8C4" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="230" cy="130" r="5" fill="#2B2F4A"/><path d="M120 220v18M240 220v18" stroke="#2B2F4A" stroke-width="10" stroke-linecap="round"/><rect x="160" y="92" width="40" height="8" rx="4" fill="#2B2F4A"/><g class="cn"><ellipse cx="180" cy="40" rx="20" ry="20" fill="#F6C453" stroke="#B8860B" stroke-width="3"/><text x="180.0" y="46.0" font-size="16" text-anchor="middle">₹</text></g><rect x="320" y="60" width="100" height="110" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="3"/><rect x="320" y="60" width="100" height="28" rx="10" fill="#3FA34D"/><text x="370.0" y="136.0" font-size="16" text-anchor="middle">month</text></svg>