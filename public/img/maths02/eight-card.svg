<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 230" role="img"><title>The number 8 written as 8 times x to the power 0</title><style>text{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}.gl{animation:gl 2.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes gl{50%{transform:scale(1.08)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="40" y="50" width="130" height="130" rx="18" fill="#FDE2C4" stroke="#2B2F4A" stroke-width="3"/><text x="105.0" y="140.0" font-size="72" text-anchor="middle">8</text><text x="205.0" y="125.0" font-size="34" text-anchor="middle">=</text><g class="gl"><rect x="240" y="70" width="150" height="90" rx="18" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="3"/><text x="315.0" y="130.0" font-size="40" text-anchor="middle">8x<tspan dy="-16" font-size="25">0</tspan><tspan dy="16"> </tspan></text></g></svg>