<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 300" role="img"><title>A cylindrical water tank whose water level falls during summer</title><style>text{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}.wt{animation:dn 5s ease-in-out infinite;transform-origin:170px 250px}@keyframes dn{0%{transform:scaleY(1)}80%,100%{transform:scaleY(.35)}}.sn{animation:gl 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes gl{50%{transform:scale(1.2)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><ellipse cx="170" cy="50" rx="90" ry="16" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3"/><path d="M80 50V250a90 16 0 0 0 180 0V50" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3"/><g class="wt"><path d="M83 70.0V250a87 14 0 0 0 174 0V70.0z" fill="#7CC6EE"/><ellipse cx="170" cy="70.0" rx="87" ry="14" fill="#A8DCF5" stroke="#0B93D4" stroke-width="2"/></g><path d="M80 50V250a90 16 0 0 0 180 0V50" fill="none" stroke="#2B2F4A" stroke-width="3"/><path d="M290 250h14" stroke="#2B2F4A" stroke-width="2"/><text x="312.0" y="255.0" font-size="13" text-anchor="start">0 m</text><path d="M290 210h14" stroke="#2B2F4A" stroke-width="2"/><text x="312.0" y="215.0" font-size="13" text-anchor="start">1 m</text><path d="M290 170h14" stroke="#2B2F4A" stroke-width="2"/><text x="312.0" y="175.0" font-size="13" text-anchor="start">2 m</text><path d="M290 130h14" stroke="#2B2F4A" stroke-width="2"/><text x="312.0" y="135.0" font-size="13" text-anchor="start">3 m</text><path d="M290 90h14" stroke="#2B2F4A" stroke-width="2"/><text x="312.0" y="95.0" font-size="13" text-anchor="start">4 m</text><path d="M290 50h14" stroke="#2B2F4A" stroke-width="2"/><text x="312.0" y="55.0" font-size="13" text-anchor="start">5 m</text><path d="M297 250V50" stroke="#2B2F4A" stroke-width="2"/><g class="sn"><circle cx="40" cy="60" r="20" fill="#F6C453"/></g></svg>