<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" role="img"><title>Four ramps of different steepness with balls rolling down</title><style>text{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}.rb{animation:rl 2.6s ease-in infinite}@keyframes rl{0%{transform:translate(0,0)}80%,100%{transform:translate(var(--dx),var(--dy))}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="190" width="480" height="40" fill="#D9C49A" opacity=".6"/><path d="M20 190H120V120z" fill="#D7F0D9" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><circle class="rb" cx="112" cy="116.6" r="8" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" style="--dx:-84px;--dy:64px;animation-delay:0.0s"/><path d="M135 190H235V170z" fill="#FDE2C4" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><circle class="rb" cx="227" cy="162.6" r="8" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" style="--dx:-84px;--dy:18px;animation-delay:0.3s"/><path d="M250 190H350V40z" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><circle class="rb" cx="342" cy="43.0" r="8" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" style="--dx:-84px;--dy:138px;animation-delay:0.6s"/><path d="M365 190H465V145z" fill="#F9D6D7" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><circle class="rb" cx="457" cy="139.6" r="8" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" style="--dx:-84px;--dy:41px;animation-delay:0.9s"/></svg>