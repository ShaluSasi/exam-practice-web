<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 310" role="img"><title>An input-output machine for y = 3x - 5 fed the input x = -4</title><style>text{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}.in{animation:feed 3s ease-in-out infinite}@keyframes feed{0%{transform:translateY(-10px);opacity:0}25%{transform:translateY(0);opacity:1}60%{transform:translateY(0);opacity:1}100%{transform:translateY(40px);opacity:0}}.ou{animation:pop 3s ease-in-out infinite}@keyframes pop{0%,10%{opacity:1}30%,55%{opacity:.25}75%,100%{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M160 90h120v20h-120z" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="2"/><rect x="110" y="110" width="220" height="130" rx="16" fill="#8E96C8" stroke="#2B2F4A" stroke-width="3"/><rect x="135" y="130" width="170" height="54" rx="8" fill="#1F3B4D" stroke="#2B2F4A" stroke-width="2"/><text x="220.0" y="166.0" font-size="22" text-anchor="middle" style="fill:#9CF0C4">y = 3x − 5</text><circle cx="150" cy="212" r="8" fill="#E5484D"/><circle cx="176" cy="212" r="8" fill="#3FA34D"/><rect x="262" y="200" width="44" height="26" rx="5" fill="#2B2F4A"/><g class="in"><rect x="170" y="22" width="100" height="44" rx="8" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2.5"/><text x="220.0" y="51.0" font-size="19" text-anchor="middle">x = −4</text></g><path d="M330 220h40v20" stroke="#2B2F4A" stroke-width="3" fill="none"/><g class="ou"><rect x="320" y="248" width="100" height="44" rx="8" fill="#F6C453" stroke="#2B2F4A" stroke-width="2.5"/><text x="370.0" y="277.0" font-size="19" text-anchor="middle">y = ?</text></g></svg>