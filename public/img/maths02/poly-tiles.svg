<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" role="img"><title>Four term tiles of a polynomial</title><style>text{font-family:system-ui,sans-serif;font-weight:600;fill:#2B2F4A}.tl{animation:bob 3s ease-in-out infinite}.t2{animation-delay:.4s}.t3{animation-delay:.8s}.t4{animation-delay:1.2s}@keyframes bob{50%{transform:translateY(-6px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="240.0" y="34.0" font-size="18" text-anchor="middle">p(x)</text><g class="tl t1"><rect x="22" y="56" width="100" height="70" rx="14" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><text x="72.0" y="101.0" font-size="26" text-anchor="middle">9x<tspan dy="-10" font-size="16">3</tspan><tspan dy="10"> </tspan></text></g><circle cx="72" cy="172" r="19" fill="none" stroke="#A3A8CC" stroke-width="2.5" stroke-dasharray="5 5"/><path d="M72 130V150" stroke="#A3A8CC" stroke-width="2" stroke-dasharray="3 4"/><g class="tl t2"><rect x="134" y="56" width="100" height="70" rx="14" fill="#FDE2C4" stroke="#2B2F4A" stroke-width="2.5"/><text x="184.0" y="101.0" font-size="26" text-anchor="middle">+5x<tspan dy="-10" font-size="16">2</tspan><tspan dy="10"> </tspan></text></g><circle cx="184" cy="172" r="19" fill="none" stroke="#A3A8CC" stroke-width="2.5" stroke-dasharray="5 5"/><path d="M184 130V150" stroke="#A3A8CC" stroke-width="2" stroke-dasharray="3 4"/><g class="tl t3"><rect x="246" y="56" width="100" height="70" rx="14" fill="#D7F0D9" stroke="#2B2F4A" stroke-width="2.5"/><text x="296.0" y="101.0" font-size="26" text-anchor="middle">−8x</text></g><circle cx="296" cy="172" r="19" fill="none" stroke="#A3A8CC" stroke-width="2.5" stroke-dasharray="5 5"/><path d="M296 130V150" stroke="#A3A8CC" stroke-width="2" stroke-dasharray="3 4"/><g class="tl t4"><rect x="358" y="56" width="100" height="70" rx="14" fill="#F9D6D7" stroke="#2B2F4A" stroke-width="2.5"/><text x="408.0" y="101.0" font-size="26" te