<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A head in side view with a free earlobe</title><style>@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes fd{to{stroke-dashoffset:-14}}.fd{stroke-dasharray:7 7;animation:fd 1s linear infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}.bob2{animation:bob2 2.8s ease-in-out infinite}@keyframes sp{to{transform:rotate(360deg)}}.sp{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><ellipse cx="70" cy="72" rx="58" ry="66" fill="#F2C29B" stroke="#2B2F4A" stroke-width="3"/><ellipse cx="127" cy="72" rx="14" ry="26" fill="#F2C29B" stroke="#2B2F4A" stroke-width="3"/><ellipse cx="133" cy="106" rx="10" ry="12" fill="#F2C29B" stroke="#2B2F4A" stroke-width="3"/><ellipse cx="128" cy="92" rx="10" ry="6" fill="#F2C29B"/><path d="M125 58Q133 64 129 76" stroke="#2B2F4A" stroke-width="2" fill="none"/><path d="M42 58q10-8 20 0M78 58q10-8 20 0" stroke="#2B2F4A" stroke-width="3" fill="none" stroke-linecap="round"/></svg>