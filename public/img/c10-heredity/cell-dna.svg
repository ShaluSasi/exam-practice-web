<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Zoom from a cell with a nucleus to a chromosome to a DNA helix with a highlighted gene</title><style>@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes fd{to{stroke-dashoffset:-14}}.fd{stroke-dasharray:7 7;animation:fd 1s linear infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}.bob2{animation:bob2 2.8s ease-in-out infinite}@keyframes sp{to{transform:rotate(360deg)}}.sp{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><circle cx="60" cy="120" r="52" fill="#E8F6E8" stroke="#3FA34D" stroke-width="3"/><circle cx="60" cy="120" r="24" fill="#EADFFF" stroke="#7C5CFF" stroke-width="3"/><path d="M50.6 108.1L61.4 127.9M61.4 108.1L50.6 127.9" stroke="#FF8A1F" stroke-width="4.5" stroke-linecap="round" fill="none"/><path d="M118 120L141.0 120.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" fill="none" class="fd"/><path d="M150 120L141.0 126.0L141.0 114.0Z" fill="#2B2F4A"/><g class="pu"><path d="M172.0 87.0L208.0 153.0M208.0 87.0L172.0 153.0" stroke="#FF8A1F" stroke-width="15.0" stroke-linecap="round" fill="none"/></g><path d="M225 120L246.0 120.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" fill="none" class="fd"/><path d="M255 120L246.0 126.0L246.0 114.0Z" fill="#2B2F4A"/><rect x="258" y="85" width="134" height="70" rx="10" fill="#F4F0FF" stroke="#7C5CFF" stroke-width="2"/><path d="M266 120C274 98 290 142 298 120" stroke="#0B93D4" stroke-width="4" fill="none"/><path d="M266 120C274 142 290 98 298 120" stroke="#3FA34D" stroke-width="4" fill="none"/><path d="M298 120C306 98 322 142 330 120" stroke="#0B93D4" stroke-width="4" fill="none"/><path d="M298 120C306 142 322 98 330 120" stroke="#3FA34D" stroke-width="4" fill="none"/><path d="M330 120C338 98 354 142 362 120" stroke="#0B93D4" stroke-width="4" fill="none"/><path d="M330 120C338 142 354 98 362 120" stroke="#3FA34D" stroke-width="4" fill="none"/><path d="M362 120C370 98 386 142 394 120" stroke="#0B93D4" stroke-width="4" fill="none"/><path d="M362 120C370 142 386 98 394 120" stroke="#3FA34D" stroke-width="4" fill="none"/><g class="pu"><rect x="330" y="96" width="46" height="48" rx="10" fill="none" stroke="#FF8A1F" stroke-width="4" stroke-dasharray="6 4"/></g><text x="200" y="205" font-family="sans-serif" font-size="11" font-weight="400" fill="#2B2F4A" text-anchor="middle">Zoom in: cell, then nucleus, chromosome and DNA</text></svg>