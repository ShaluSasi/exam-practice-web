<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Bar chart of 315 round yellow, 108 round green, 101 wrinkled yellow and 32 wrinkled green seeds</title><style>@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes fd{to{stroke-dashoffset:-14}}.fd{stroke-dasharray:7 7;animation:fd 1s linear infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}.bob2{animation:bob2 2.8s ease-in-out infinite}@keyframes sp{to{transform:rotate(360deg)}}.sp{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="20" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">F2 seeds counted (out of 556)</text><g class="pu"><rect x="44" y="60.0" width="52" height="130.0" rx="5" fill="#F7D447" stroke="#2B2F4A" stroke-width="3"/></g><text x="70" y="54.0" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle">315</text><text x="70" y="208" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">Round</text><text x="70" y="222" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">yellow</text><g class="pu"><rect x="130" y="145.42857142857144" width="52" height="44.57142857142857" rx="5" fill="#8BCB5B" stroke="#2B2F4A" stroke-width="3"/></g><text x="156" y="139.42857142857144" font-family="sans-serif" font-size="14"