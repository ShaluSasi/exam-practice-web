<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Sixteen-box Punnett square for a dihybrid cross of round yellow seeds</title><style>@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes fd{to{stroke-dashoffset:-14}}.fd{stroke-dasharray:7 7;animation:fd 1s linear infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}.bob2{animation:bob2 2.8s ease-in-out infinite}@keyframes sp{to{transform:rotate(360deg)}}.sp{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="160" y="20" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle">Rr Yy × Rr Yy</text><text x="78.0" y="39" font-family="sans-serif" font-size="13" font-weight="700" fill="#0B93D4" text-anchor="middle">RY</text><text x="134.0" y="39" font-family="sans-serif" font-size="13" font-weight="700" fill="#0B93D4" text-anchor="middle">Ry</text><text x="190.0" y="39" font-family="sans-serif" font-size="13" font-weight="700" fill="#0B93D4" text-anchor="middle">rY</text><text x="246.0" y="39" font-family="sans-serif" font-size="13" font-weight="700" fill="#0B93D4" text-anchor="middle">ry</text><text x="28" y="73.0" font-family="sans-serif" font-size="13" font-weight="700" fill="#FF8A1F" text-anchor="middle">RY</text><text x="28" y="113.0" font-family="sans-serif" font-size="13" font-weight="700" fill="#FF8A1F" text-anchor="middle">Ry</text><text x="28" y="15