<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Family tree of one organism over three generations with growing differences</title><style>@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes fd{to{stroke-dashoffset:-14}}.fd{stroke-dasharray:7 7;animation:fd 1s linear infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}.bob2{animation:bob2 2.8s ease-in-out infinite}@keyframes sp{to{transform:rotate(360deg)}}.sp{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M200 40L120 110" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" fill="none" class="fd"/><path d="M200 40L280 110" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" fill="none" class="fd"/><path d="M120 110L70 185" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" fill="none" class="fd"/><path d="M120 110L170 185" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" fill="none" class="fd"/><path d="M280 110L230 185" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" fill="none" class="fd"/><path d="M280 110L330 185" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" fill="none" class="fd"/><circle cx="200" cy="40" r="20" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3"/><circle cx="120" cy="110" r="17" fill="#FFB866" stroke="#2B2F4A" stroke-width="3"/><circle cx="280" cy="110" r="17" fill="#FFA040" stroke="#2B2F4A" stroke-width="3"/><circle cx="70" cy="185" r="17" fill="#FFD9A8" stroke="#2B2F4A" stroke-width="3" class="pu"/><circle cx="170" cy="185" r="17" fill="#FFC27A" stroke="#2B2F4A" stroke-width="3" class="pu"/><circle cx="230" cy="185" r="17" fill="#FFAE52" stroke="#2B2F4A" stroke-width="3" class="pu"/><circle cx="330" cy="185" r="17" fill="#FF9B2E" stroke="#2B2F4A" stroke-width="3" class="pu"/><circle cx="115" cy="106" r="3" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1"/><circle cx="286" cy="113" r="3" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1"/><circle cx="73" cy="180" r="3" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1"/><circle cx="164" cy="188" r="3" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1"/><circle cx="235" cy="182" r="3" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1"/><circle cx="326" cy="190" r="3" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1"/><text x="30" y="45" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">Parent</text><text x="30" y="115" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">Gen 2</text><text x="30" y="190" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">Gen 3</text><text x="200" y="230" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">Differences are inherited AND newly added</text></svg>