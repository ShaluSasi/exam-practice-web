<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>One bacterium divides twice into four nearly identical bacteria</title><style>@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes fd{to{stroke-dashoffset:-14}}.fd{stroke-dasharray:7 7;animation:fd 1s linear infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}.bob2{animation:bob2 2.8s ease-in-out infinite}@keyframes sp{to{transform:rotate(360deg)}}.sp{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="176" y="27" width="48" height="22" rx="11" fill="#7FD38B" stroke="#2B2F4A" stroke-width="3"/><circle cx="192" cy="38" r="3" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1"/><circle cx="209" cy="38" r="2.5" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1"/><path d="M180 54L127.60337167998806 87.1845312693409" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" fill="none" class="fd"/><path d="M120 92L124.4 82.1L130.8 92.3Z" fill="#2B2F4A"/><path d="M220 54L272.3966283200119 87.1845312693409" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" fill="none" class="fd"/><path d="M280 92L269.2 92.3L275.6 82.1Z" fill="#2B2F4A"/><rect x="96" y="99" width="48" height="22" rx="11" fill="#7FD38B" stroke="#2B2F4A" stroke-width="3"/><circle cx="112" cy="110" r="3" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1"/><circle cx="129" cy="110" r="2.5" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1