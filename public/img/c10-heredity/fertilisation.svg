<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>An egg and a sperm each with one chromosome set fuse to give a zygote with two sets</title><style>@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes fd{to{stroke-dashoffset:-14}}.fd{stroke-dasharray:7 7;animation:fd 1s linear infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}.bob2{animation:bob2 2.8s ease-in-out infinite}@keyframes sp{to{transform:rotate(360deg)}}.sp{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="22" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle">Two germ cells fuse</text><circle cx="80" cy="85" r="34" fill="#FFF0DC" stroke="#FF8A1F" stroke-width="3"/><rect x="66.0" y="68.0" width="8" height="34" rx="4.0" fill="#E5484D" stroke="#2B2F4A" stroke-width="1.5"/><rect x="86.0" y="76.0" width="8" height="18" rx="4.0" fill="#E5484D" stroke="#2B2F4A" stroke-width="1.5"/><text x="80" y="140" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">Egg (one set)</text><g class="bob2"><ellipse cx="300" cy="85" rx="30" ry="18" fill="#E3F2FD" stroke="#0B93D4" stroke-width="3"/><rect x="289.0" y="80.0" width="6" height="10" rx="3.0" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5"/><rect x="303.0" y="80.0" width="6" height="10" rx="3.0" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5"/><path d="M330 85q20 10 30 -6" stroke="#0B93D4" stroke-width="3" fill="none"/></g><text x="340" y="140" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">Sperm (one set)</text><path d="M105 112L163.3867689983526 165.89547907540242" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" fill="none" class="fd"/><path d="M170 172L159.3 170.3L167.5 161.5Z" fill="#2B2F4A"/><path d="M285 108L235.86590068959188 165.17422465211126" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" fill="none" class="fd"/><path d="M230 172L231.3 161.3L240.4 169.1Z" fill="#2B2F4A"/><circle cx="200" cy="200" r="26" fill="#EADFFF" stroke="#7C5CFF" stroke-width="3"/><rect x="185.0" y="185.0" width="6" height="30" rx="3.0" fill="#E5484D" stroke="#2B2F4A" stroke-width="1.5"/><rect x="195.0" y="192.0" width="6" height="16" rx="3.0" fill="#E5484D" stroke="#2B2F4A" stroke-width="1.5"/><rect x="203.0" y="185.0" width="6" height="30" rx="3.0" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5"/><rect x="213.0" y="192.0" width="6" height="16" rx="3.0" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5"/><text x="240" y="196" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="start">Zygote: two sets,</text><text x="240" y="212" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="start">normal number</text></svg>