<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Two light-eyed parents and their light-eyed children</title><style>@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes fd{to{stroke-dashoffset:-14}}.fd{stroke-dasharray:7 7;animation:fd 1s linear infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}.bob2{animation:bob2 2.8s ease-in-out infinite}@keyframes sp{to{transform:rotate(360deg)}}.sp{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="110" y="25" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">Parents</text><ellipse cx="70" cy="70" rx="26" ry="14" fill="#fff" stroke="#2B2F4A" stroke-width="3"/><circle cx="70" cy="70" r="10" fill="#9ED7F2" stroke="#2B2F4A" stroke-width="2"/><circle cx="70" cy="70" r="4" fill="#2B2F4A"/><ellipse cx="150" cy="70" rx="26" ry="14" fill="#fff" stroke="#2B2F4A" stroke-width="3"/><circle cx="150" cy="70" r="10" fill="#9ED7F2" stroke="#2B2F4A" stroke-width="2"/><circle cx="150" cy="70" r="4" fill="#2B2F4A"/><text x="110" y="100" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">light</text><path d="M110 112L110.0 131.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" fill="none" class="fd"/><path d="M110 140L104.0 131.0L116.0 131.0Z" fill="#2B2F4A"/><text x="200" y="205" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">Children</text><g class="pu"><ellipse cx="60" cy="165" rx="26" ry="14" fill="#fff" stroke="#2B2F4A" stroke-width="3"/><circle cx="60" cy="165" r="10" fill="#9ED7F2" stroke="#2B2F4A" stroke-width="2"/><circle cx="60" cy="165" r="4" fill="#2B2F4A"/></g><g class="pu"><ellipse cx="130" cy="165" rx="26" ry="14" fill="#fff" stroke="#2B2F4A" stroke-width="3"/><circle cx="130" cy="165" r="10" fill="#9ED7F2" stroke="#2B2F4A" stroke-width="2"/><circle cx="130" cy="165" r="4" fill="#2B2F4A"/></g><g class="pu"><ellipse cx="200" cy="165" rx="26" ry="14" fill="#fff" stroke="#2B2F4A" stroke-width="3"/><circle cx="200" cy="165" r="10" fill="#9ED7F2" stroke="#2B2F4A" stroke-width="2"/><circle cx="200" cy="165" r="4" fill="#2B2F4A"/></g><text x="300" y="60" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">Light eyes in</text><text x="300" y="78" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">parents and</text><text x="300" y="96" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">children.</text><text x="300" y="130" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">Dominant or</text><text x="300" y="148" font-family="sans-serif" font-size="12" font-weight="700" fill="#E5484D" text-anchor="middle">recessive?</text></svg>