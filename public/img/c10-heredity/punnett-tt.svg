<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Tt × Tt Punnett square</title><style>@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes fd{to{stroke-dashoffset:-14}}.fd{stroke-dasharray:7 7;animation:fd 1s linear infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}.bob2{animation:bob2 2.8s ease-in-out infinite}@keyframes sp{to{transform:rotate(360deg)}}.sp{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="20" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle">Tt × Tt</text><text x="200" y="38" font-family="sans-serif" font-size="11" font-weight="400" fill="#2B2F4A" text-anchor="middle">pollen (male gametes)</text><text x="60" y="142" font-family="sans-serif" font-size="11" font-weight="400" fill="#2B2F4A" text-anchor="middle">egg cells</text><circle cx="170.0" cy="60" r="14" fill="#E3F2FD" stroke="#0B93D4" stroke-width="3"/><text x="170.0" y="66" font-family="sans-serif" font-size="16" font-weight="700" fill="#2B2F4A" text-anchor="middle">T</text><circle cx="250.0" cy="60" r="14" fill="#E3F2FD" stroke="#0B93D4" stroke-width="3"/><text x="250.0" y="66" font-family="sans-serif" font-size="16" font-weight="700" fill="#2B2F4A" text-anchor="middle">t</text><circle cx="100" cy="110.0" r="14" fill="#FFF0DC" stroke="#FF8A1F" stroke-width="3"/><text x="100" y="116.0" font-family="sans-serif" font-size="16" font-weight="700" fill="#2B2F4A" text-anchor="middle">T</text><circle cx="100" cy="170.0" r="14" fill="#FFF0DC" stroke="#FF8A1F" stroke-width="3"/><text x="100" y="176.0" font-family="sans-serif" font-size="16" font-weight="700" fill="#2B2F4A" text-anchor="middle">t</text><rect x="130" y="80" width="80" height="60" rx="6" fill="#DDF3DF" stroke="#2B2F4A" stroke-width="3"/><text x="170.0" y="114.0" font-family="sans-serif" font-size="22" font-weight="700" fill="#2B2F4A" text-anchor="middle">TT</text><text x="170.0" y="132.0" font-family="sans-serif" font-size="11" font-weight="700" fill="#3FA34D" text-anchor="middle">Tall</text><rect x="210" y="80" width="80" height="60" rx="6" fill="#DDF3DF" stroke="#2B2F4A" stroke-width="3"/><text x="250.0" y="114.0" font-family="sans-serif" font-size="22" font-weight="700" fill="#2B2F4A" text-anchor="middle">Tt</text><text x="250.0" y="132.0" font-family="sans-serif" font-size="11" font-weight="700" fill="#3FA34D" text-anchor="middle">Tall</text><rect x="130" y="140" width="80" height="60" rx="6" fill="#DDF3DF" stroke="#2B2F4A" stroke-width="3"/><text x="170.0" y="174.0" font-family="sans-serif" font-size="22" font-weight="700" fill="#2B2F4A" text-anchor="middle">Tt</text><text x="170.0" y="192.0" font-family="sans-serif" font-size="11" font-weight="700" fill="#3FA34D" text-anchor="middle">Tall</text><rect x="210" y="140" width="80" height="60" rx="6" fill="#FFE6CC" stroke="#2B2F4A" stroke-width="3" class="pu"/><text x="250.0" y="174.0" font-family="sans-serif" font-size="22" font-weight="700" fill="#2B2F4A" text-anchor="middle">tt</text><text x="250.0" y="192.0" font-family="sans-serif" font-size="11" font-weight="700" fill="#E5484D" text-anchor="middle">Short</text><text x="200" y="225" font-family="sans-serif" font-size="12" font-weight="400" fill="#2B2F4A" text-anchor="middle">Each box = one possible offspring</text></svg>