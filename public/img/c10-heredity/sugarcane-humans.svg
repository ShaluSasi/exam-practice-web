<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Identical sugarcane plants beside a group of very different people</title><style>@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes fd{to{stroke-dashoffset:-14}}.fd{stroke-dasharray:7 7;animation:fd 1s linear infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}.bob2{animation:bob2 2.8s ease-in-out infinite}@keyframes sp{to{transform:rotate(360deg)}}.sp{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M200 25L200 215" stroke="#CFC9B8" stroke-width="2" stroke-linecap="round" fill="none"/><text x="100" y="32" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">Sugarcane field</text><text x="300" y="32" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">Group of people</text><g class="sw"><path d="M45 190V70" stroke="#2B2F4A" stroke-width="10" stroke-linecap="round"/><path d="M45 190V70" stroke="#3FA34D" stroke-width="6" stroke-linecap="round"/><path d="M45 72l-14 -14M45 72l14 -14" stroke="#3FA34D" stroke-width="4" stroke-linecap="round"/></g><g class="sw"><path d="M75 190V70" stroke="#2B2F4A" stroke-width="10" stroke-linecap="round"/><path d="M75 190V70" stroke="#3FA34D" stroke-width="6" stroke-linecap="round"/><path d="M75 72l-14 -14M75 72l14 -14" stroke="#3FA34D" stroke-width="4" stroke-linecap="round"