<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Family tree with a father of blood group A a mother of group O and a daughter of group O</title><style>@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes fd{to{stroke-dashoffset:-14}}.fd{stroke-dasharray:7 7;animation:fd 1s linear infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}.bob2{animation:bob2 2.8s ease-in-out infinite}@keyframes sp{to{transform:rotate(360deg)}}.sp{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="70" y="35" width="50" height="50" rx="4" fill="#F4F0FF" stroke="#2B2F4A" stroke-width="3"/><text x="95" y="67" font-family="sans-serif" font-size="22" font-weight="700" fill="#2B2F4A" text-anchor="middle">A</text><text x="95" y="102" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">Father</text><circle cx="305" cy="60" r="26" fill="#FFE0EA" stroke="#2B2F4A" stroke-width="3"/><text x="305" y="67" font-family="sans-serif" font-size="22" font-weight="700" fill="#2B2F4A" text-anchor="middle">O</text><text x="305" y="102" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">Mother</text><path d="M120 60L279 60" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M200 60L200 140" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" fill="none"/><g class="pu"><circle cx="200" cy="170" r="26" fill="#FFE0EA" stroke="#2B2F4A" stroke-width="3"/></g><text x="200" y="177" font-family="sans-serif" font-size="22" font-weight="700" fill="#2B2F4A" text-anchor="middle">O</text><text x="200" y="216" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">Daughter</text></svg>