<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A snail changes from one sex to the other</title><style>@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes fd{to{stroke-dashoffset:-14}}.fd{stroke-dasharray:7 7;animation:fd 1s linear infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}.bob2{animation:bob2 2.8s ease-in-out infinite}@keyframes sp{to{transform:rotate(360deg)}}.sp{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="60" y="170" width="120" height="22" rx="11" fill="#9FD7A5" stroke="#2B2F4A" stroke-width="3"/><path d="M62 174Q50 150 66 138" stroke="#2B2F4A" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="66" cy="136" r="4" fill="#2B2F4A"/><circle cx="125" cy="140" r="38" fill="#FFB866" stroke="#2B2F4A" stroke-width="3"/><path d="M125 140m0 -4a4 4 0 1 1 -1 0M125 140m-14 0a14 14 0 1 1 14 14M125 140m-26 0a26 26 0 1 1 26 26" stroke="#2B2F4A" stroke-width="3" fill="none"/><path d="M200 150L261.0 150.0" stroke="#7C5CFF" stroke-width="3" stroke-linecap="round" fill="none" class="fd"/><path d="M270 150L261.0 156.0L261.0 144.0Z" fill="#7C5CFF"/><text x="235" y="135" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">changes sex</text><g class="pu"><circle cx="330" cy="140" r="38" fill="#FFB0CF" stroke="#2B2F4A" stroke-width="3"/><circle cx="330" cy="140" r="22" fill="none" stroke="#2B2F4A" stroke-width="3"/><circle cx="330" cy="140" r="8" fill="none" stroke="#2B2F4A" stroke-width="3"/></g><rect x="270" y="170" width="120" height="22" rx="11" fill="#9FD7A5" stroke="#2B2F4A" stroke-width="3"/><text x="200" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle">A snail is not locked to one sex</text><text x="200" y="225" font-family="sans-serif" font-size="12" font-weight="400" fill="#2B2F4A" text-anchor="middle">Sex is not genetically fixed in snails</text></svg>