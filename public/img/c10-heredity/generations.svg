<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Pea plant generations: parents P, first generation F1 and second generation F2</title><style>@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes fd{to{stroke-dashoffset:-14}}.fd{stroke-dasharray:7 7;animation:fd 1s linear infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}.bob2{animation:bob2 2.8s ease-in-out infinite}@keyframes sp{to{transform:rotate(360deg)}}.sp{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="85" y="28" font-family="sans-serif" font-size="15" font-weight="700" fill="#2B2F4A" text-anchor="middle">P</text><text x="200" y="28" font-family="sans-serif" font-size="15" font-weight="700" fill="#2B2F4A" text-anchor="middle">F1</text><text x="331" y="28" font-family="sans-serif" font-size="15" font-weight="700" fill="#2B2F4A" text-anchor="middle">F2</text><g class="sw"><path d="M55 205V95" stroke="#2B2F4A" stroke-width="9" stroke-linecap="round"/><path d="M55 205V95" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/><ellipse cx="42" cy="166" rx="11" ry="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(-25 42 166)"/><ellipse cx="68" cy="134" rx="11" ry="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(25 68 134)"/><circle cx="55" cy="91" r="8" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.5"/></g><g class="sw"><path d="M115