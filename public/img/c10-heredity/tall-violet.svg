<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A tall violet pea plant crossed with a short white one giving violet flowers with tall and short plants</title><style>@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes fd{to{stroke-dashoffset:-14}}.fd{stroke-dasharray:7 7;animation:fd 1s linear infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}.bob2{animation:bob2 2.8s ease-in-out infinite}@keyframes sp{to{transform:rotate(360deg)}}.sp{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="16" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">Tall, violet  ×  Short, white</text><g class="sw"><path d="M110 108V50" stroke="#2B2F4A" stroke-width="9" stroke-linecap="round"/><path d="M110 108V50" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/><ellipse cx="97" cy="82" rx="11" ry="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(-25 97 82)"/><circle cx="110" cy="46" r="8" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.5"/></g><g class="sw"><path d="M290 108V78" stroke="#2B2F4A" stroke-width="9" stroke-linecap="round"/><path d="M290 108V78" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/><ellipse cx="277" cy="94" rx="11" ry="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(-25 277 94)"/><circle cx="290" cy="74" r="8" fill="#F5F5F5" stroke="#2B2F4A" stroke-width="2.5"/></g><text x="200" y="90" font-family="sans-serif" font-size="22" font-weight="700" fill="#2B2F4A" text-anchor="middle">×</text><path d="M80 106L140 106" stroke="#8D6E63" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M260 106L320 106" stroke="#8D6E63" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M200 120L200.0 141.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" fill="none" class="fd"/><path d="M200 150L194.0 141.0L206.0 141.0Z" fill="#2B2F4A"/><text x="200" y="238" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">Progeny: all violet, about half short</text><g class="sw"><path d="M85 215V140" stroke="#2B2F4A" stroke-width="9" stroke-linecap="round"/><path d="M85 215V140" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/><ellipse cx="72" cy="189" rx="11" ry="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(-25 72 189)"/><ellipse cx="98" cy="166" rx="11" ry="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(25 98 166)"/><circle cx="85" cy="136" r="8" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.5"/></g><g class="sw"><path d="M155 215V185" stroke="#2B2F4A" stroke-width="9" stroke-linecap="round"/><path d="M155 215V185" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/><ellipse cx="142" cy="202" rx="11" ry="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(-25 142 202)"/><circle cx="155" cy="181" r="8" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.5"/></g><g class="sw"><path d="M245 215V140" stroke="#2B2F4A" stroke-width="9" stroke-linecap="round"/><path d="M245 215V140" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/><ellipse cx="232" cy="189" rx="11" ry="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(-25 232 189)"/><ellipse cx="258" cy="166" rx="11" ry="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(25 258 16