<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>One tall and one short pea plant</title><style>@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes fd{to{stroke-dashoffset:-14}}.fd{stroke-dasharray:7 7;animation:fd 1s linear infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}.bob2{animation:bob2 2.8s ease-in-out infinite}@keyframes sp{to{transform:rotate(360deg)}}.sp{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M30 132L170 132" stroke="#8D6E63" stroke-width="4" stroke-linecap="round" fill="none"/><g class="sw"><path d="M65 132V32" stroke="#2B2F4A" stroke-width="9" stroke-linecap="round"/><path d="M65 132V32" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/><ellipse cx="52" cy="97" rx="11" ry="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(-25 52 97)"/><ellipse cx="78" cy="67" rx="11" ry="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(25 78 67)"/><circle cx="65" cy="28" r="8" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.5"/></g><g class="sw"><path d="M135 132V92" stroke="#2B2F4A" stroke-width="9" stroke-linecap="round"/><path d="M135 132V92" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/><ellipse cx="122" cy="114" rx="11" ry="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(-25 122 114)"/><circle cx="135" cy="88" r="8" fill="#7C5CFF" stroke=