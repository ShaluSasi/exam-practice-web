<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Four pea seed types: round yellow, round green, wrinkled yellow and wrinkled green</title><style>@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes fd{to{stroke-dashoffset:-14}}.fd{stroke-dasharray:7 7;animation:fd 1s linear infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}.bob2{animation:bob2 2.8s ease-in-out infinite}@keyframes sp{to{transform:rotate(360deg)}}.sp{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><g class="bob"><circle cx="100" cy="75" r="28" fill="#F7D447" stroke="#2B2F4A" stroke-width="2.5"/></g><text x="100" y="125" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">Round, yellow</text><g class="bob"><circle cx="300" cy="75" r="28" fill="#8BCB5B" stroke="#2B2F4A" stroke-width="2.5"/></g><text x="300" y="125" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">Round, green</text><g class="bob"><polygon points="129.4,170.0 121.2,178.8 120.8,190.8 108.8,191.2 100.0,199.4 91.2,191.2 79.2,190.8 78.8,178.8 70.6,170.0 78.8,161.2 79.2,149.2 91.2,148.8 100.0,140.6 108.8,148.8 120.8,149.2 121.2,161.2" fill="#F7D447" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/></g><text x="100" y="220" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">Wrinkled, yellow</text><g class="bob"><polygon points="329.4,170.0 321.2,178.8 320.8,190.8 308.8,191.2 300.0,199.4 291.2,191.2 279.2,190.8 278.8,178.8 270.6,170.0 278.8,161.2 279.2,149.2 291.2,148.8 300.0,140.6 308.8,148.8 320.8,149.2 321.2,161.2" fill="#8BCB5B" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/></g><text x="300" y="220" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">Wrinkled, green</text></svg>