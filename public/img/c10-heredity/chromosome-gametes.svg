<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A body cell with two pairs of chromosomes makes four germ cells with one chromosome from each pair</title><style>@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes fd{to{stroke-dashoffset:-14}}.fd{stroke-dasharray:7 7;animation:fd 1s linear infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}.bob2{animation:bob2 2.8s ease-in-out infinite}@keyframes sp{to{transform:rotate(360deg)}}.sp{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><circle cx="200" cy="60" r="46" fill="#E3F2FD" stroke="#0B93D4" stroke-width="3"/><rect x="168.0" y="39.0" width="8" height="34" rx="4.0" fill="#E5484D" stroke="#2B2F4A" stroke-width="1.5"/><rect x="182.0" y="39.0" width="8" height="34" rx="4.0" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5"/><rect x="210.0" y="47.0" width="8" height="18" rx="4.0" fill="#E5484D" stroke="#2B2F4A" stroke-width="1.5"/><rect x="224.0" y="47.0" width="8" height="18" rx="4.0" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5"/><text x="256" y="52" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="start">Body cell:</text><text x="256" y="68" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="start">2 copies of each</text><text x="256" y="84" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="start">chromosome</text><path d="M200 106L70 148" stroke="#A3A8CC" stroke-width="2" stroke-linecap="round" fill="none"/><g class="bob"><circle cx="70" cy="185" r="28" fill="#E3F2FD" stroke="#0B93D4" stroke-width="3"/><rect x="58.0" y="168.0" width="8" height="34" rx="4.0" fill="#E5484D" stroke="#2B2F4A" stroke-width="1.5"/><rect x="74.0" y="176.0" width="8" height="18" rx="4.0" fill="#E5484D" stroke="#2B2F4A" stroke-width="1.5"/></g><path d="M200 106L160 148" stroke="#A3A8CC" stroke-width="2" stroke-linecap="round" fill="none"/><g class="bob"><circle cx="160" cy="185" r="28" fill="#E3F2FD" stroke="#0B93D4" stroke-width="3"/><rect x="148.0" y="168.0" width="8" height="34" rx="4.0" fill="#E5484D" stroke="#2B2F4A" stroke-width="1.5"/><rect x="164.0" y="176.0" width="8" height="18" rx="4.0" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5"/></g><path d="M200 106L250 148" stroke="#A3A8CC" stroke-width="2" stroke-linecap="round" fill="none"/><g class="bob"><circle cx="250" cy="185" r="28" fill="#E3F2FD" stroke="#0B93D4" stroke-width="3"/><rect x="238.0" y="168.0" width="8" height="34" rx="4.0" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5"/><rect x="254.0" y="176.0" width="8" height="18" rx="4.0" fill="#E5484D" stroke="#2B2F4A" stroke-width="1.5"/></g><path d="M200 106L340 148" stroke="#A3A8CC" stroke-width="2" stroke-linecap="round" fill="none"/><g class="bob"><circle cx="340" cy="185" r="28" fill="#E3F2FD" stroke="#0B93D4" stroke-width="3"/><rect x="328.0" y="168.0" width="8" height="34" rx="4.0" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5"/><rect x="344.0" y="176.0" width="8" height="18" rx="4.0" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5"/></g><text x="200" y="232" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">Each germ cell gets ONE chromosome of each pair</text></svg>