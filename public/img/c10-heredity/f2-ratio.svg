<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Selfing F1 tall pea plants gives three tall plants and one short plant in F2</title><style>@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes fd{to{stroke-dashoffset:-14}}.fd{stroke-dasharray:7 7;animation:fd 1s linear infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}.bob2{animation:bob2 2.8s ease-in-out infinite}@keyframes sp{to{transform:rotate(360deg)}}.sp{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="18" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">F1 tall plants self-pollinate</text><g class="pu"><path d="M200 95V50" stroke="#2B2F4A" stroke-width="9" stroke-linecap="round"/><path d="M200 95V50" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/><ellipse cx="187" cy="75" rx="11" ry="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(-25 187 75)"/><circle cx="200" cy="46" r="8" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.5"/></g><path d="M170 96L230 96" stroke="#8D6E63" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M200 104L200.0 117.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" fill="none" class="fd"/><path d="M200 126L194.0 117.0L206.0 117.0Z" fill="#2B2F4A"/><g class="sw"><path d="M70 215V145" stroke="#2B2F4A" stroke-width="9" stroke-linecap="round"/><path d="M70 215V145" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/><ellipse cx="57" cy="190" rx="11" ry="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(-25 57 190)"/><ellipse cx="83" cy="170" rx="11" ry="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(25 83 170)"/><circle cx="70" cy="141" r="8" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.5"/></g><g class="sw"><path d="M150 215V145" stroke="#2B2F4A" stroke-width="9" stroke-linecap="round"/><path d="M150 215V145" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/><ellipse cx="137" cy="190" rx="11" ry="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(-25 137 190)"/><ellipse cx="163" cy="170" rx="11" ry="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(25 163 170)"/><circle cx="150" cy="141" r="8" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.5"/></g><g class="sw"><path d="M250 215V185" stroke="#2B2F4A" stroke-width="9" stroke-linecap="round"/><path d="M250 215V185" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/><ellipse cx="237" cy="202" rx="11" ry="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(-25 237 202)"/><circle cx="250" cy="181" r="8" fill="#F5F5F5" stroke="#2B2F4A" stroke-width="2.5"/></g><g class="sw"><path d="M330 215V145" stroke="#2B2F4A" stroke-width="9" stroke-linecap="round"/><path d="M330 215V145" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/><ellipse cx="317" cy="190" rx="11" ry="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(-25 317 190)"/><ellipse cx="343" cy="170" rx="11" ry="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(25 343 170)"/><circle cx="330" cy="141" r="8" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.5"/></g><path d="M40 216L360 216" stroke="#8D6E63" stroke-width="4" stroke-linecap="round" fill="none"/><text x="110" y="236" font-family="sans-serif" font-size="12" font-weight="700" fill="#3FA34D" text-anchor="middle">3 tall</text><text x="290" y="236" font-family="sans-serif" font-size="12" font-weight="700" fill="#E5484D" text-anchor="middle">1 short</text><text x="32" y="180" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">F2</text></svg>