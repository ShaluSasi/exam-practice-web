<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Two side views of heads showing a free earlobe on the left and an attached earlobe on the right</title><style>@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes fd{to{stroke-dashoffset:-14}}.fd{stroke-dasharray:7 7;animation:fd 1s linear infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}.bob2{animation:bob2 2.8s ease-in-out infinite}@keyframes sp{to{transform:rotate(360deg)}}.sp{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><ellipse cx="100" cy="125" rx="65" ry="85" fill="#F2C29B" stroke="#2B2F4A" stroke-width="3"/><path d="M70 100q10-8 20 0M110 100q10-8 20 0" stroke="#2B2F4A" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M87 150q13 10 26 0" stroke="#2B2F4A" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="300" cy="125" rx="65" ry="85" fill="#F2C29B" stroke="#2B2F4A" stroke-width="3"/><path d="M270 100q10-8 20 0M310 100q10-8 20 0" stroke="#2B2F4A" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M287 150q13 10 26 0" stroke="#2B2F4A" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="165" cy="125" rx="14" ry="26" fill="#F2C29B" stroke="#2B2F4A" stroke-width="3"/><ellipse cx="171" cy="159" rx="10" ry="12" fill="#F2C29B" stroke="#2B2F4A" stroke-width="3"/><ellipse cx="166" cy="145" rx="10" ry="6" fill="#F2C29B"/><path d="M163 111Q171 117 167 129" stroke="#2B2F4A" stroke-width="2" fill="none"/><path d="M351 133C351 95 379 95 379 121C379 139 371 151 355 159" fill="#F2C29B" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><path d="M363 111Q371 117 367 129" stroke="#2B2F4A" stroke-width="2" fill="none"/></svg>