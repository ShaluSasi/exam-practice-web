<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A black dog and a brown dog and four puppies of unknown colour</title><style>@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes fd{to{stroke-dashoffset:-14}}.fd{stroke-dasharray:7 7;animation:fd 1s linear infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}.bob2{animation:bob2 2.8s ease-in-out infinite}@keyframes sp{to{transform:rotate(360deg)}}.sp{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><g transform="translate(90 70) scale(1 1)"><ellipse cx="0" cy="0" rx="34" ry="18" fill="#3A3A3A" stroke="#2B2F4A" stroke-width="3"/><circle cx="34" cy="-14" r="14" fill="#3A3A3A" stroke="#2B2F4A" stroke-width="3"/><path d="M26 -26l-4 -12 12 6Z" fill="#3A3A3A" stroke="#2B2F4A" stroke-width="3"/><circle cx="38" cy="-16" r="2.5" fill="#fff"/><circle cx="46" cy="-11" r="3" fill="#2B2F4A"/><path d="M-24 14v18M-8 16v18M10 16v18M24 14v18" stroke="#2B2F4A" stroke-width="6" stroke-linecap="round"/><path d="M-24 14v18M-8 16v18M10 16v18M24 14v18" stroke="#3A3A3A" stroke-width="3" stroke-linecap="round"/><path d="M-34 -4q-18 -14 -12 -26" stroke="#2B2F4A" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M-34 -4q-18 -14 -12 -26" stroke="#3A3A3A" stroke-width="3" fill="none" stroke-linecap="round"/></g><g transform="translate(310 70) scale(-1 1)"><ellipse cx="0" cy="0" rx="34" ry="18" fill="#B5651D" str