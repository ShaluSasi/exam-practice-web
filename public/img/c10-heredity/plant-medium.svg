<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A medium height pea plant</title><style>@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes fd{to{stroke-dashoffset:-14}}.fd{stroke-dasharray:7 7;animation:fd 1s linear infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}.bob2{animation:bob2 2.8s ease-in-out infinite}@keyframes sp{to{transform:rotate(360deg)}}.sp{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M40 132L160 132" stroke="#8D6E63" stroke-width="4" stroke-linecap="round" fill="none"/><g class="sw"><path d="M100 132V62" stroke="#2B2F4A" stroke-width="9" stroke-linecap="round"/><path d="M100 132V62" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/><ellipse cx="87" cy="108" rx="11" ry="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(-25 87 108)"/><ellipse cx="113" cy="86" rx="11" ry="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(25 113 86)"/><circle cx="100" cy="58" r="8" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.5"/></g></svg>