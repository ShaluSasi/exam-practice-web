<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Two thermometers show a cool and a warm nest of reptile eggs</title><style>@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes fd{to{stroke-dashoffset:-14}}.fd{stroke-dasharray:7 7;animation:fd 1s linear infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}.bob2{animation:bob2 2.8s ease-in-out infinite}@keyframes sp{to{transform:rotate(360deg)}}.sp{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="100" y="22" font-family="sans-serif" font-size="13" font-weight="700" fill="#0B93D4" text-anchor="middle">Cooler nest</text><text x="300" y="22" font-family="sans-serif" font-size="13" font-weight="700" fill="#E5484D" text-anchor="middle">Warmer nest</text><rect x="86" y="35" width="28" height="95" rx="14" fill="#fff" stroke="#2B2F4A" stroke-width="3"/><circle cx="100" cy="146" r="17" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3"/><rect x="95" y="105" width="10" height="31" fill="#0B93D4"/><g class="pu"><ellipse cx="70" cy="195" rx="14" ry="17" fill="#FFF" stroke="#2B2F4A" stroke-width="3"/><ellipse cx="130" cy="195" rx="14" ry="17" fill="#FFF" stroke="#2B2F4A" stroke-width="3"/></g><rect x="286" y="35" width="28" height="95" rx="14" fill="#fff" stroke="#2B2F4A" stroke-width="3"/><circle cx="300" cy="146" r="17" fill="#E5484D" stroke="#2B2F4A" stroke-width="3"/><rect x="295" y="70" width="10" height="66" fill="#E5484D"/><g class="pu"><ellipse cx="270" cy="195" rx="14" ry="17" fill="#FFF" stroke="#2B2F4A" stroke-width="3"/><ellipse cx="330" cy="195" rx="14" ry="17" fill="#FFF" stroke="#2B2F4A" stroke-width="3"/></g><text x="200" y="95" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle">vs</text><text x="200" y="232" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">Egg temperature decides the sex</text></svg>