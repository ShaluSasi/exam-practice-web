<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A tall and a short pea plant are crossed and all F1 plants are tall</title><style>@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes fd{to{stroke-dashoffset:-14}}.fd{stroke-dasharray:7 7;animation:fd 1s linear infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}.bob2{animation:bob2 2.8s ease-in-out infinite}@keyframes sp{to{transform:rotate(360deg)}}.sp{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">Cross-pollination</text><g class="sw"><path d="M90 105V35" stroke="#2B2F4A" stroke-width="9" stroke-linecap="round"/><path d="M90 105V35" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/><ellipse cx="77" cy="80" rx="11" ry="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(-25 77 80)"/><ellipse cx="103" cy="60" rx="11" ry="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(25 103 60)"/><circle cx="90" cy="31" r="8" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.5"/></g><g class="sw"><path d="M310 105V75" stroke="#2B2F4A" stroke-width="9" stroke-linecap="round"/><path d="M310 105V75" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/><ellipse cx="297" cy="92" rx="11" ry="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(-25 297 92)"/><circle cx="310" cy="71" r="8" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.5"/></g><path d="M50 106L130 106" stroke="#8D6E63" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M270 106L350 106" stroke="#8D6E63" stroke-width="4" stroke-linecap="round" fill="none"/><text x="200" y="85" font-family="sans-serif" font-size="26" font-weight="700" fill="#2B2F4A" text-anchor="middle">×</text><text x="90" y="125" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">Tall parent</text><text x="310" y="125" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">Short parent</text><path d="M200 130L200.0 141.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" fill="none" class="fd"/><path d="M200 150L194.0 141.0L206.0 141.0Z" fill="#2B2F4A"/><g class="pu"><path d="M110 222V167" stroke="#2B2F4A" stroke-width="9" stroke-linecap="round"/><path d="M110 222V167" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/><ellipse cx="97" cy="197" rx="11" ry="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(-25 97 197)"/><circle cx="110" cy="163" r="8" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.5"/></g><g class="pu"><path d="M200 222V167" stroke="#2B2F4A" stroke-width="9" stroke-linecap="round"/><path d="M200 222V167" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/><ellipse cx="187" cy="197" rx="11" ry="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(-25 187 197)"/><circle cx="200" cy="163" r="8" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.5"/></g><g class="pu"><path d="M290 222V167" stroke="#2B2F4A" stroke-width="9" stroke-linecap="round"/><path d="M290 222V167" stroke="#3FA34D" stroke-width="5" stroke-linecap="round"/><ellipse cx="277" cy="197" rx="11" ry="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" transform="rotate(-25 277 197)"/><circle cx="290" cy="163" r="8" fill="#7C5CFF" stroke="#2B