<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A wrinkled yellow seed and a wrinkled green seed</title><style>@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes fd{to{stroke-dashoffset:-14}}.fd{stroke-dasharray:7 7;animation:fd 1s linear infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}.bob2{animation:bob2 2.8s ease-in-out infinite}@keyframes sp{to{transform:rotate(360deg)}}.sp{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><polygon points="88.6,70.0 79.2,80.0 78.8,93.8 65.0,94.2 55.0,103.6 45.0,94.2 31.2,93.8 30.8,80.0 21.4,70.0 30.8,60.0 31.2,46.2 45.0,45.8 55.0,36.4 65.0,45.8 78.8,46.2 79.2,60.0" fill="#F7D447" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><polygon points="178.6,70.0 169.2,80.0 168.8,93.8 155.0,94.2 145.0,103.6 135.0,94.2 121.2,93.8 120.8,80.0 111.4,70.0 120.8,60.0 121.2,46.2 135.0,45.8 145.0,36.4 155.0,45.8 168.8,46.2 169.2,60.0" fill="#8BCB5B" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><rect x="10" y="15" width="180" height="110" rx="14" fill="none" stroke="#C9CCE0" stroke-width="2"/></svg>