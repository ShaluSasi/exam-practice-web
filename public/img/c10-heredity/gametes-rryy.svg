<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A Rr Yy parent cell makes four kinds of gamete RY Ry rY and ry</title><style>@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes fd{to{stroke-dashoffset:-14}}.fd{stroke-dasharray:7 7;animation:fd 1s linear infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}.bob2{animation:bob2 2.8s ease-in-out infinite}@keyframes sp{to{transform:rotate(360deg)}}.sp{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="140" y="20" width="120" height="50" rx="14" fill="#E3F2FD" stroke="#0B93D4" stroke-width="3"/><text x="200" y="52" font-family="sans-serif" font-size="22" font-weight="700" fill="#2B2F4A" text-anchor="middle">Rr Yy</text><path d="M200 70L55 140" stroke="#A3A8CC" stroke-width="2" stroke-linecap="round" fill="none" class="fd"/><g class="bob"><circle cx="55" cy="175" r="32" fill="#FFF0DC" stroke="#FF8A1F" stroke-width="3"/><text x="55" y="182" font-family="sans-serif" font-size="20" font-weight="700" fill="#2B2F4A" text-anchor="middle">RY</text></g><path d="M200 70L155 140" stroke="#A3A8CC" stroke-width="2" stroke-linecap="round" fill="none" class="fd"/><g class="bob"><circle cx="155" cy="175" r="32" fill="#FFF0DC" stroke="#FF8A1F" stroke-width="3"/><text x="155" y="182" font-family="sans-serif" font-size="20" font-weight="700" fill="#2B2F4A" text-anchor="middle">Ry</text></g><path d="M200 70L245 140" stroke="#A3A8CC" stroke-width="2" stroke-linecap="round" fill="none" class="fd"/><g class="bob"><circle cx="245" cy="175" r="32" fill="#FFF0DC" stroke="#FF8A1F" stroke-width="3"/><text x="245" y="182" font-family="sans-serif" font-size="20" font-weight="700" fill="#2B2F4A" text-anchor="middle">rY</text></g><path d="M200 70L345 140" stroke="#A3A8CC" stroke-width="2" stroke-linecap="round" fill="none" class="fd"/><g class="bob"><circle cx="345" cy="175" r="32" fill="#FFF0DC" stroke="#FF8A1F" stroke-width="3"/><text x="345" y="182" font-family="sans-serif" font-size="20" font-weight="700" fill="#2B2F4A" text-anchor="middle">ry</text></g><text x="200" y="232" font-family="sans-serif" font-size="11" font-weight="400" fill="#2B2F4A" text-anchor="middle">Each gamete carries one R/r gene and one Y/y gene</text></svg>