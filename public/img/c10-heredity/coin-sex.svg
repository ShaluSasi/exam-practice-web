<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Three daughters and a coin showing X or Y for the fourth child</title><style>@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes fd{to{stroke-dashoffset:-14}}.fd{stroke-dasharray:7 7;animation:fd 1s linear infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}.bob2{animation:bob2 2.8s ease-in-out infinite}@keyframes sp{to{transform:rotate(360deg)}}.sp{animation:sp 12s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}.sw{animation:sw 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="22" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">Three daughters already...</text><circle cx="80" cy="60" r="13" fill="#FFE0EA" stroke="#E5589A" stroke-width="3"/><path d="M80 73V105M66 105H94" stroke="#E5589A" stroke-width="5" stroke-linecap="round"/><circle cx="130" cy="60" r="13" fill="#FFE0EA" stroke="#E5589A" stroke-width="3"/><path d="M130 73V105M116 105H144" stroke="#E5589A" stroke-width="5" stroke-linecap="round"/><circle cx="180" cy="60" r="13" fill="#FFE0EA" stroke="#E5589A" stroke-width="3"/><path d="M180 73V105M166 105H194" stroke="#E5589A" stroke-width="5" stroke-linecap="round"/><text x="235" y="70" font-family="sans-serif" font-size="18" font-weight="700" fill="#2B2F4A" text-anchor="middle">+</text><text x="285" y="85" font-family="sans-serif" font-size="34" font-weight="700" fill="#E5484D" text-anchor="middle">?</text><g class="pu"><ellipse cx="200" cy="170" rx="34" ry="34" fill="#F5C518" stroke="#2B2F4A" stroke-width="3"/></g><text x="200" y="178" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle">X or Y</text><text x="200" y="230" font-family="sans-serif" font-size="11" font-weight="400" fill="#2B2F4A" text-anchor="middle">Each time: father passes X or Y</text><text x="100" y="175" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">Next child</text></svg>