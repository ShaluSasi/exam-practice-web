<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img">
<title>A glass of tea and a mug of coffee with price tags</title>
<style>
.o{animation:o 4s infinite}.n{animation:n 4s infinite}
@keyframes o{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}@keyframes n{0%,45%{opacity:0}50%,95%{opacity:1}100%{opacity:0}}
.up{animation:n 4s infinite}.st{animation:st 2.5s ease-in-out infinite}@keyframes st{0%,100%{transform:translateY(0);opacity:.9}50%{transform:translateY(-4px);opacity:.4}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
