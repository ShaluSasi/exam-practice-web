<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 190" role="img">
<title>An aeroplane flying across the sky with two ticket price tags below</title>
<style>
.fly{animation:fly 6s linear infinite}@keyframes fly{0%{transform:translate(-80px,10px)}100%{transform:translate(260px,-20px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M16 0H304Q320 0 320 16V190H0V16Q0 0 16 0Z" fill="#CDEBFA"/>
<g fill="#FFFFFF"><ellipse cx="70" cy="40" rx="26" ry="10"/><ellipse cx="250" cy="70" rx="30" ry="11"/></g>
<g class="fly"><path d="M40 92L110 88Q124 88 124 94Q124 100 110 100L40 98Z" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M70 92L58 70H68L90 92ZM70 98L56 118H66L90 98ZM44 92L38 80H46L52 92Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/></g>
<g transform="translate(0 0)"><g><rect x="35" y="145" width="110" height="20" rx="4" fill="#FFF3C4" stroke="#2B2F4A" stroke-width="1.5"/><circle cx="40" cy="155" r="1.8" fill="#2B2F4A"/><text x="92" y="159.5" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">Day 1: ₹3,000</text></g><g><rect x="175" y="145" width="110" height="20" rx="4" fill="#FFF3C4" stroke="#2B2F4A" stroke-width="1.5"/><circle cx="180" cy="155" r="1.8" fill="#2B2F4A"/><text x="232" y="159.5" font-size="12" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">Day 2: ₹9,000</text></g></g>
</svg>
