@keyframes o{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}@keyframes n{0%,45%{opacity:0}50%,95%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
