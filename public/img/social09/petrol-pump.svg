<g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" font-size="14" text-anchor="middle"><text class="o" x="87" y="76">₹100</text><text class="n" x="87" y="76" fill="#C2353A">₹200</text></g>
<text x="87" y="102" font-size="11" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="600">per litre</text>
