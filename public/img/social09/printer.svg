<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img">
<title>A printer printing a page, next to an ink cartridge</title>
<style>
.pp{animation:pp 3s ease-in-out infinite}@keyframes pp{0%{transform:translateY(-14px)}60%,100%{transform:translateY(14px)}}
.dp{animation:dp 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes dp{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
