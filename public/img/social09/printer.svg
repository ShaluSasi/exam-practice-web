<rect x="60" y="62" width="70" height="30" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/>
<rect x="40" y="88" width="150" height="62" rx="10" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="2.5"/>
<rect x="56" y="100" width="118" height="10" rx="3" fill="#2B2F4A"/><circle cx="170" cy="130" r="5" fill="#3FA34D"/>
<g class="pp"><rect x="66" y="104" width="98" height="52" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><path d="M78 120H150M78 130H140M78 140H146" stroke="#0B93D4" stroke-width="3"/></g>
<rect x="56" y="150" width="118" height="10" rx="3" fill="#7A7FA8" stroke="#2B2F4A" stroke-width="2"/>
<g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" font-size="26" text-anchor="middle"><text x="214" y="128" font-size="12">+</text></g>
<rect x="238" y="98" width="52" height="58" rx="6" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2.5"/><rect x="246" y="108" width="36" height="22" rx="3" fill="#FFFFFF"/>
<path class="dp" d="M264 112C270 120 272 124 264 128C256 124 258 120 264 112Z" fill="#0B93D4"/><rect x="250" y="140" width="28" height="8" rx="2" fill="#F6C453"/>
</svg>
