<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 110" role="img">
<title>Five round icons: a cup, a wallet, a heart, a snowflake and a calendar</title>
<style>
.st{animation:st 2.5s ease-in-out infinite}@keyframes st{0%,100%{opacity:.9}50%{opacity:.3}}
.hb{animation:hb 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes hb{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.spin{animation:sp 6s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
