<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="160" y="30" font-size="13" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">Tomato market, one morning</text><rect x="30" y="44" width="260" height="162" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><path d="M30 71H290" stroke="#2B2F4A" stroke-width="2"/><rect x="31" y="45" width="258" height="26" rx="7" fill="#FFE2C7"/><path d="M30 71H290" stroke="#2B2F4A" stroke-width="2"/><path d="M116 44V206M204 44V206M30 98H290M30 125H290M30 152H290M30 179H290" stroke="#A3A8CC" stroke-width="1.2"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" font-size="12" text-anchor="middle"><text x="73" y="62" font-size="12">Price (₹/kg)</text><text x="160" y="62" font-size="12">Demanded (kg)</text><text x="247" y="62" font-size="12">Supplied (kg)</text><text x="73" y="89" font-size="12" fill="#0B6FA4">20</text><text x="160" y="89" font-size="12">50</text><text x="247" y="89" font-size="12">10</text><text x="73" y="116" font-size="12" fill="#0B6FA4">30</text><text x="160" y="116" font-size="12">40</text><text x="247" y="116" font-size="12">20</text><text x="73" y="143" font-size="12" fill="#0B6FA4">40</text><text x="160" y="143" font-size="12">30</text><text x="247" y="143" font-size="12">30</text><text x="73" y="170" font-size="12" fill="#0B6FA4">50</text><text x="160" y="170" font-size="12">20</text><text x="247" y="170" font-size="12">40</text><text x="73" y="197" font-size="12" fill="#0B6FA4">60</text><text x="160" y="197" font-size="12">10</text><text x="247" y="197" font-size="12">50</text></g>
