xt><text x="223" y="147.5" font-size="12">4</text><text x="281" y="147.5" font-size="12">4</text><text x="335" y="147.5" font-size="12">?</text><text x="55" y="173.5" font-size="12" fill="#0B6FA4">₹20/kg</text><text x="113" y="173.5" font-size="12">5</text><text x="165" y="173.5" font-size="12">4</text><text x="223" y="173.5" font-size="12">6</text><text x="281" y="173.5" font-size="12">7</text><text x="335" y="173.5" font-size="12">?</text></g>
