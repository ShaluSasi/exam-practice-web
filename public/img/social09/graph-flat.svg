<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" role="img">
<title>A line on price–quantity axes</title>
<style>
.dr{stroke-dasharray:140;animation:dr 3.5s ease-in-out infinite}
@keyframes dr{0%{stroke-dashoffset:140}45%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M30 115H148M30 115V14" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
<path class="dr" d="M42 64L140 64" stroke="#0B93D4" stroke-width="5" stroke-linecap="round" fill="none"/>
<g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" font-size="12" text-anchor="middle"><text x="90" y="132" font-size="12">Quantity</text><text transform="translate(18 66) rotate(-90)">Price (₹)</text></g>
</svg>
