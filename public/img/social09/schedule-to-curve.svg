<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200" role="img">
<title>A small price and quantity table with an arrow pointing to a graph</title>
<style>
.dr{stroke-dasharray:145;animation:dr 4.5s ease-in-out infinite}
@keyframes dr{0%{stroke-dashoffset:145}45%,100%{stroke-dashoffset:0}}.ar{animation:ar 1.6s ease-in-out infinite}@keyframes ar{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
.pop{animation:pop 4.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pop{0%,10%{transform:scale(0)}25%,100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="18" y="40" width="106" height="104" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><path d="M18 66H124" stroke="#2B2F4A" stroke-width="2"/><rect x="19" y="41" width="104" height="25" rx="7" fill="#CDEBFA"/><path d="M18 66H124" stroke="#2B2F4A" stroke-width="2"/><path d="M74 40V144M18 92H124M18 118H124" stroke="#A3A8CC" stroke-width="1.2"/><g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" font-size="12" text-anchor="middle"><text x="46" y="57.5" font-size="12">Price</text><text x="99" y="57.5" font-size="12">Qty</text><text x="46" y="83.5" font-size="12" fill="#0B6FA4">₹150</text><text x="99" y="83.5" font-size="12">1 kg</text><text x="46" y="109.5" font-size="12" fill="#0B6FA4">₹100</text><text x="99" y="109.5" font-size="12">2 kg</text><text x="46" y="135.5" font-size="12" fill="#0B6FA4">₹50</text><text x="99" y="135.5" font-size="12">3 kg</text></g><path class="ar" d="M136 92H166m-8 -7l8 7l-8 7" stroke="#FF8A1F" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M200 165H325M200 165V30" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/>
<g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" font-size="12" text-anchor="middle"><text x="262" y="186" font-size="12">Quantity (kg)</text><text transform="translate(186 98) rotate(-90)">Price (₹)</text></g>
<path class="dr" d="M222 40L310 150" stroke="#E5484D" stroke-width="4" stroke-linecap="round"/>
<circle class="pop" style="animation-delay:0s" cx="236" cy="57.5" r="6" fill="#FFFFFF" stroke="#E5484D" stroke-width="3"/><circle class="pop" style="animation-delay:0.5s" cx="266" cy="95" r="6" fill="#FFFFFF" stroke="#E5484D" stroke-width="3"/><circle class="pop" style="animation-delay:1s" cx="296" cy="132.5" r="6" fill="#FFFFFF" stroke="#E5484D" stroke-width="3"/>
</svg>
