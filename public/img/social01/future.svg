<path d="M60 160V200M200 160V200M340 160V200" stroke="#6E7396" stroke-width="4"/>
<g class="train"><rect x="0" y="140" width="110" height="18" rx="9" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2"/><g fill="#CDEBFA"><rect x="14" y="144" width="14" height="8"/><rect x="40" y="144" width="14" height="8"/><rect x="66" y="144" width="14" height="8"/></g></g>
<path d="M0 198H400V244Q400 260 384 260H16Q0 260 0 244Z" fill="#A9D98E"/>
<g stroke="#2B2F4A" stroke-width="2"><circle cx="120" cy="214" r="8" fill="#8A5A3C"/><path d="M108 252Q108 224 120 224Q132 224 132 252Z" fill="#FF8A1F"/>
<rect x="132" y="222" width="12" height="20" rx="2" fill="#2B2F4A"/></g>
