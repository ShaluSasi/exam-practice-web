<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
<title>A village with people meeting under a big tree, green fields, an old fort on a hill, a market stall and a river</title>
<style>
.talk{animation:talk 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
@keyframes talk{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.leaf{animation:rust 4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
@keyframes rust{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.flow{stroke-dasharray:14 12;animation:flow 2.5s linear infinite}
@keyframes flow{to{stroke-dashoffset:-52}}
.tag{animation:swing 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:top}
@keyframes swing{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
