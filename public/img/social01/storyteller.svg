<path d="M200 198Q195 192 200 186Q205 192 200 198Z" fill="#FF8A1F"/>
<g stroke="#2B2F4A" stroke-width="2.5">
<circle cx="110" cy="132" r="15" fill="#A86E48"/><path d="M96 124Q110 108 124 124" fill="#E8E8EE"/>
<path d="M80 200Q80 150 110 150Q140 150 140 200Z" fill="#FF8A1F"/>
</g>
<g class="hand"><path d="M136 162L156 142" stroke="#A86E48" stroke-width="6" stroke-linecap="round"/></g>
<g stroke="#2B2F4A" stroke-width="2">
