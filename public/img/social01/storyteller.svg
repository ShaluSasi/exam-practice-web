<path d="M160 92L176 70L190 86L202 74L216 92Z" fill="#A9D98E" stroke="#3FA34D" stroke-width="2" stroke-linejoin="round"/>
<circle cx="230" cy="70" r="7" fill="#F6C453"/></g>
