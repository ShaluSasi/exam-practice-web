<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>An elder telling stories to children at night by the light of a lantern</title>
<style>
.glow{animation:glow 2s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:.7}}
.hand{animation:wave 2s ease-in-out infinite;transform-box:fill-box;transform-origin:left bottom}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
.tw{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.3}50%{opacity:1}}
.bub{animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
