<style>
.bus{animation:drive 7s linear infinite}
@keyframes drive{from{transform:translateX(-130px)}to{transform:translateX(430px)}}
.spark{animation:blink 1.4s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.15}50%{opacity:1}}
.kid{animation:hop 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.cl{animation:drift 6s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
