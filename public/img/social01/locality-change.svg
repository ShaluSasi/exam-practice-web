<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>Before and after: a dirt lane with a bullock cart, and the same place with a paved road, streetlight and an electric rickshaw</title>
<style>
.cart{animation:slow 6s ease-in-out infinite alternate}
@keyframes slow{from{transform:translateX(0)}to{transform:translateX(30px)}}
.rick{animation:fast 3s linear infinite}
@keyframes fast{from{transform:translateX(-50px)}to{transform:translateX(200px)}}
.arr{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.lamp{animation:glow 2s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.4}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="10" y="10" width="180" height="240" rx="12" fill="#FDF0D8" stroke="#C8925A" stroke-width="2"/>
<rect x="210" y="10" width="180" height="240" rx="12" fill="#E3F2FD" stroke="#0B93D4" stroke-width="2"/>
<path d="M10 170H190V238Q190 250 178 250H22Q10 250 10 238Z" fill="#D9B97E"/>
<path d="M30 196Q100 186 170 200" fill="none" stroke="#B48A55" stroke-width="3" stroke-dasharray="6 8"/>
<g stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"><rect x="30" y="120" width="40" height="50" fill="#E8C79A"/><path d="M22 122L50 96L78 122Z" fill="#C8925A"/></g>
<g class="cart">
<ellipse cx="66" cy="208" rx="16" ry="9" fill="#fff" stroke="#2B2F4A" stroke-width="2"/><circle cx="50" cy="204" r="5" fill="#2B2F4A"/>
<path d="M82 208H96" stroke="#8B5A2B" stroke-width="3"/><rect x="96" y="196" width="34" height="14" fill="#C8925A" stroke="#2B2F4A" stroke-width="2"/>
<circle cx="113" cy="216" r="9" fill="none" stroke="#2B2F4A" stroke-width="3"/>
</g>
<path d="M210 170H390V238Q390 250 378 250H222Q210 250 210 238Z" fill="#A9D98E"/>
<path d="M210 186H390V230H210Z" fill="#7A7F96"/>
<path d="M216 208H384" stroke="#fff" stroke-width="3" stroke-dasharray="12 10"/>
