<g class="arr"><circle cx="200" cy="130" r="18" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5"/><path d="M190 130H208M202 123L209 130L202 137" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
