<g fill="#FFF3C4" stroke="#2B2F4A" stroke-width="1.5"><rect x="240" y="92" width="10" height="10"/><rect x="258" y="92" width="10" height="10"/><rect x="240" y="118" width="10" height="10"/><rect x="258" y="118" width="10" height="10"/></g>
