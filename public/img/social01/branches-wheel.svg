<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
<title>A circle of people in the centre linked to four picture bubbles: a globe, an hourglass with a scroll, a meeting chamber and coins with a bar chart</title>
<style>
