.pop{animation:pop 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.sand{animation:sand 2s linear infinite}
@keyframes sand{0%{opacity:1}100%{opacity:.2}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
