<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>A crowded city of tall buildings beside scattered village huts among fields</title>
<style>
.car{animation:car 4s linear infinite}
@keyframes car{from{transform:translateX(-40px)}to{transform:translateX(220px)}}
.win{animation:win 2s steps(2) infinite}
@keyframes win{0%{opacity:1}100%{opacity:.3}}
.cow{animation:graze 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes graze{0%,100%{transform:rotate(0)}50%{transform:rotate(-5deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
