.dust{animation:dust 1.2s ease-out infinite}
@keyframes dust{0%{opacity:.9;transform:translate(0,0)}100%{opacity:0;transform:translate(-8px,-10px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
