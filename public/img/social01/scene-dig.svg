<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" role="img">
<title>An excavation trench with a string grid, old brick walls and broken pots being uncovered by a person with a brush</title>
<style>
.br{animation:brush 1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:top}
