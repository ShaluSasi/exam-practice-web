<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
<title>A town with a shopper holding a basket, a factory, a pillared public building and a delivery truck</title>
<style>
.smk{animation:smk 3.5s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes smk{0%{opacity:.8;transform:translateY(0) scale(.7)}100%{opacity:0;transform:translateY(-22px) scale(1.4)}}
.box{animation:belt 3s linear infinite}
@keyframes belt{from{transform:translateX(0)}to{transform:translateX(40px)}}
.trk{animation:bump .6s ease-in-out infinite alternate}
@keyframes bump{from{transform:translateY(0)}to{transform:translateY(-2px)}}
.bas{animation:sw 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:top}
@keyframes sw{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
