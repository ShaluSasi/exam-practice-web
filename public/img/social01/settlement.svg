<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>An early farming settlement with round huts, a field of crops, cattle, clay pots and stone tools</title>
<style>
.crop{animation:sway 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.smk{animation:smk 3.5s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes smk{0%{opacity:.8;transform:translateY(0) scale(.7)}100%{opacity:0;transform:translateY(-20px) scale(1.4)}}
.cow{animation:graze 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes graze{0%,100%{transform:rotate(0)}50%{transform:rotate(-5deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
