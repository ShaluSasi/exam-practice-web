<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
<title>A village in a drought with a dry field, a stepwell, a worried farmer, a bus to the city and a water tanker</title>
<style>
.ray{animation:pulse 2.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.bus{animation:go 5s ease-in-out infinite}
@keyframes go{0%{transform:translate(0,0)}100%{transform:translate(26px,-22px)}}
.drop{animation:drip 1.6s ease-in infinite}
@keyframes drip{0%{transform:translateY(0);opacity:1}100%{transform:translateY(12px);opacity:0}}
.haze{animation:haze 3s ease-in-out infinite}
@keyframes haze{0%,100%{opacity:.2}50%{opacity:.7}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
