<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>A wooden sailing ship loaded with sacks and bales of cloth on a blue sea, with a coastal port behind</title>
<style>
.boat{animation:rock 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
@keyframes rock{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-4px)}}
.wave{animation:wv 3s linear infinite}
@keyframes wv{from{transform:translateX(0)}to{transform:translateX(-40px)}}
.bird{animation:fly 5s ease-in-out infinite alternate}
@keyframes fly{from{transform:translate(0,0)}to{transform:translate(30px,-8px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
