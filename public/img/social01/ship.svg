<g class="bird" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"><path d="M120 50q6-6 12 0q6-6 12 0M160 70q5-5 10 0q5-5 10 0"/></g>
<g class="boat">
<path d="M150 170H330L310 206H170Z" fill="#C8925A" stroke="#7A5230" stroke-width="3" stroke-linejoin="round"/>
