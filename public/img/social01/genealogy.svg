<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>An old register page showing three generations of a family linked by lines</title>
<style>
.new{animation:pop 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.line{stroke-dasharray:6 5;animation:dash 2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-22}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M30 16H370V244H30Z" fill="#F3E3C7" stroke="#8B6A47" stroke-width="2.5"/>
<path d="M200 16V244" stroke="#D9C49A" stroke-width="2"/>
<g fill="none" stroke="#8B6A47" stroke-width="2.5" stroke-linecap="round">
<path d="M170 58H230M200 58V100M110 100H290M110 100V130M290 100V130M80 160H140M110 160V190M260 160H320M290 160V190"/>
</g>
<path class="line" d="M140 160H260" fill="none" stroke="#E5484D" stroke-width="2"/>
<g stroke="#2B2F4A" stroke-width="2">
<circle cx="160" cy="58" r="15" fill="#FFD9B0"/><circle cx="240" cy="58" r="15" fill="#CDEBFA"/>
<circle cx="110" cy="145" r="15" fill="#A9D98E"/><circle cx="290" cy="145" r="15" fill="#F6C453"/>
<circle cx="70" cy="160" r="12" fill="#E4E0F7"/><circle cx="330" cy="160" r="12" fill="#E4E0F7"/>
</g>
<g class="new" stroke="#2B2F4A" stroke-width="2"><circle cx="110" cy="206" r="13" fill="#FF8A1F"/></g>
<g class="new" stroke="#2B2F4A" stroke-width="2" style="animation-delay:1.2s"><circle cx="290" cy="206" r="13" fill="#0B93D4"/></g>
<g fill="#2B2F4A"><circle cx="156" cy="56" r="1.8"/><circle cx="164" cy="56" r="1.8"/><circle cx="236" cy="56" r="1.8"/><circle cx="244" cy="56" r="1.8"/><circle cx="106" cy="143" r="1.8"/><circle cx="114" cy="143" r="1.8"/><circle cx="286" cy="143" r="1.8"/><circle cx="294" cy="143" r="1.8"/></g>
<g stroke="#A9864B" stroke-width="2" stroke-linecap="round"><path d="M44 230h50M306 230h50M44 30h40M316 30h40"/></g>
</svg>
