<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A cheerful tiger beside a mango leaf and a cup of steaming tea</title><style>
.bob{animation:bob 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes bob{to{transform:translateY(-5px)}}
.sway{animation:sway 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.flick{animation:flick .45s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{to{transform:scale(1.18,.82)}}
.steam{animation:steam 2.4s ease-in infinite;transform-box:fill-box}
@keyframes steam{0%{transform:translateY(6px);opacity:0}30%{opacity:.85}100%{transform:translateY(-16px);opacity:0}}
.drift{animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(34px)}}
.fall{animation:fall 1.7s ease-in infinite}
@keyframes fall{0%{transform:translateY(-22px);opacity:0}25%{opacity:1}100%{transform:translateY(38px);opacity:0}}
.pulse{animation:pulse 1.3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes pulse{to{transform:scale(1.12)}}
.slide{animation:slide 4s ease-in-out infinite alternate}
@keyframes slide{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
.blink{animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.rip{animation:rip 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes rip{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.dive{animation:dive 2.2s ease-in infinite}
@keyframes dive{0%,20%{transform:translateY(-10px)}60%{transform:translateY(26px)}100%{transform:translateY(-10px)}}
.spin{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="170" rx="0" fill="#F6EBD0" /><rect x="0" y="170" width="400" height="70" rx="0" fill="#E0C99B" /><g transform="translate(70 190) rotate(30) scale(2.2)"><path d="M0 0 Q-9 -10 0 -22 Q9 -10 0 0Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><line x1="0" y1="0" x2="0" y2="-16" stroke="#1f6a2c" stroke-width="1.2" stroke-linecap="round" /></g><g transform="translate(50 190) rotate(-10) scale(2.2)"><path d="M0 0 Q-9 -10 0 -22 Q9 -10 0 0Z" fill="#4FB063" stroke="#2B2F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><line x1="0" y1="0" x2="0" y2="-16" stroke="#1f6a2c" stroke-width="1.2" stroke-linecap="round" /></g><circle cx="210" cy="120" r="48" fill="#FF9A2E" stroke="#2B2F4A" stroke-width="3" /><circle cx="172" cy="80" r="14" fill="#FF9A2E" stroke="#2B2F4A" stroke-width="3" /><circle cx="248" cy="80" r="14" fill="#FF9A2E" stroke="#2B2F4A" stroke-width="3" /><ellipse cx="210" cy="140" rx="24" ry="18" fill="#FFF2D8" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="194" cy="112" r="5" fill="#2B2F4A" /><circle cx="226" cy="112" r="5" fill="#2B2F4A" /><path d="M204 128 L216 128 L210 136 Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M196 148 Q210 160 224 148" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M194 148 L198 154 L202 149 M218 149 L222 154 L226 148" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M180 96 l8 8" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M240 96 l-8 8" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M164 126 h12" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M244 126 h12" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(330 196) scale(2.0)"><path d="M-12 -12 H12 V0 Q12 10 0 10 Q-12 10 -12 0 Z" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M12 -8 Q22 -8 20 0 Q18 6 11 5" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="0" cy="-12" rx="12" ry="3" fill="#B5651D" stroke="#2B2F4A" stroke-width="1.5" /><g class="steam"><path d="M-4 -18 Q-8 -24 -4 -30" fill="none" stroke="#9AA3B2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M4 -18 Q0 -24 4 -30" fill="none" stroke="#9AA3B2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g></g><path d="M320 200 q10 6 20 0" fill="none" /></svg>