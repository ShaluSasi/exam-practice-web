ircle cx="0" cy="-58" r="10" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="2.5" /><path d="M-10 -60 Q-9 -72 0 -70 Q10 -72 10 -60 Q4 -66 -10 -60Z" fill="#3a2a20" /><circle cx="-3.5" cy="-58" r="1.3" fill="#2B2F4A" /><circle cx="3.5" cy="-58" r="1.3" fill="#2B2F4A" /><path d="M-3 -54 Q0 -51 3 -54" fill="none" stroke="#2B2F4A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></g></g></svg>