<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Two men: one in a long black coat with an embroidered belt, one in a shirt and trousers</title><style>
.bob{animation:bob 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes bob{to{transform:translateY(-5px)}}
.sway{animation:sway 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.flick{animation:flick .45s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{to{transform:scale(1.18,.82)}}
.steam{animation:steam 2.4s ease-in infinite;transform-box:fill-box}
@keyframes steam{0%{transform:translateY(6px);opacity:0}30%{opacity:.85}100%{transform:translateY(-16px);opacity:0}}
.drift{animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(34px)}}
.fall{animation:fall 1.7s ease-in infinite}
@keyframes fall{0%{transform:translateY(-22px);opacity:0}25%{opacity:1}100%{transform:translateY(38px);opacity:0}}
.pulse{animation:pulse 1.3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes pulse{to{transform:scale(1.12)}}
.slide{animation:slide 4s ease-in-out infinite alternate}
@keyframes slide{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
.blink{animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.rip{animation:rip 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes rip{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.dive{animation:dive 2.2s ease-in infinite}
@keyframes dive{0%,20%{transform:translateY(-10px)}60%{transform:translateY(26px)}100%{transform:translateY(-10px)}}
.spin{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="190" rx="0" fill="#EFE6FF" /><rect x="0" y="190" width="400" height="50" rx="0" fill="#CDBFE8" /><g transform="translate(110 205) scale(2.0)"><rect x="-6" y="-24" width="5" height="24" rx="1" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="2" /><rect x="1" y="-24" width="5" height="24" rx="1" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="2" /><rect x="-7" y="-26" width="7" height="26" rx="1" fill="#1F2233" stroke="#2B2F4A" stroke-width="2" /><rect x="0" y="-26" width="7" height="26" rx="1" fill="#1F2233" stroke="#2B2F4A" stroke-width="2" /><rect x="-8" y="-26" width="16" height="4" rx="0" fill="#2B2F4A" /><rect x="-9" y="-48" width="18" height="24" rx="5" fill="#1F2233" stroke="#2B2F4A" stroke-width="2.5" /><line x1="-9" y1="-44" x2="-14" y2="-26" stroke="#F2C9A0" stroke-width="4" stroke-linecap="round" /><line x1="9" y1="-44" x2="14" y2="-26" stroke="#F2C9A0" stroke-width="4" stroke-linecap="round" /><circle cx="0" cy="-58" r="10" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="2.5" /><path d="M-10 -60 Q-9 -72 0 -70 Q10 -72 10 -60 Q4 -66 -10 -60Z" fill="#3a2a20" /><circle cx="-3.5" cy="-58" r="1.3" fill="#2B2F4A" /><circle cx="3.5" cy="-58" r="1.3" fill="#2B2F4A" /><path d="M-3 -54 Q0 -51 3 -54" fill="none" stroke="#2B2F4A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M92 107 L80 160 Q110 170 140 160 L128 107Z" fill="#1F2233" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="92" y="132" width="36" height="7" rx="0" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" /><line x1="94" y1="135" x2="98" y2="135" stroke="#FFD25E" stroke-width="2" stroke-linecap="round" /><line x1="99" y1="135" x2="103" y2="135" stroke="#FFD25E" stroke-width="2" stroke-linecap="round" /><line x1="104" y1="135" x2="108" y2="135" stroke="#FFD25E" stroke-width="2" stroke-linecap="round" /><line x1="109" y1="135" x2="113"