<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A poster layout with a brand name at the top, a big picture of a steaming cup, a slogan and contact details</title><style>
.bob{animation:bob 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes bob{to{transform:translateY(-5px)}}
.sway{animation:sway 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.flick{animation:flick .45s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{to{transform:scale(1.18,.82)}}
.steam{animation:steam 2.4s ease-in infinite;transform-box:fill-box}
@keyframes steam{0%{transform:translateY(6px);opacity:0}30%{opacity:.85}100%{transform:translateY(-16px);opacity:0}}
.drift{animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(34px)}}
.fall{animation:fall 1.7s ease-in infinite}
@keyframes fall{0%{transform:translateY(-22px);opacity:0}25%{opacity:1}100%{transform:translateY(38px);opacity:0}}
.pulse{animation:pulse 1.3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes pulse{to{transform:scale(1.12)}}
.slide{animation:slide 4s ease-in-out infinite alternate}
@keyframes slide{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
.blink{animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.rip{animation:rip 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes rip{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.dive{animation:dive 2.2s ease-in infinite}
@keyframes dive{0%,20%{transform:translateY(-10px)}60%{transform:translateY(26px)}100%{transform:translateY(-10px)}}
.spin{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="240" rx="0" fill="#FFF2D8" /><rect x="70" y="10" width="260" height="220" rx="12" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><rect x="86" y="22" width="228" height="34" rx="8" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" /><text x="200" y="46" font-family="sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle" >BRAND NAME</text><rect x="86" y="66" width="228" height="90" rx="8" fill="#CFE9FF" stroke="#2B2F4A" stroke-width="2.5" /><g transform="translate(200 138) scale(2.2)"><path d="M-12 -12 H12 V0 Q12 10 0 10 Q-12 10 -12 0 Z" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M12 -8 Q22 -8 20 0 Q18 6 11 5" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="0" cy="-12" rx="12" ry="3" fill="#B5651D" stroke="#2B2F4A" stroke-width="1.5" /><g class="steam"><path d="M-4 -18 Q-8 -24 -4 -30" fill="none" stroke="#9AA3B2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M4 -18 Q0 -24 4 -30" fill="none" stroke="#9AA3B2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g></g><rect x="86" y="164" width="228" height="28" rx="8" fill="#FFD25E" stroke="#2B2F4A" stroke-width="2.5" /><text x="200" y="184" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Catchy slogan here</text><rect x="86" y="198" width="228" height="20" rx="6" fill="#E8EAF0" stroke="#2B2F4A" stroke-width="2" /><text x="200" y="212" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Where to buy / contact</text></svg>