<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Three stiff branches with leaves, wearing white bands, shuffling slowly towards the door of a clinic</title><style>
.bob{animation:bob 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes bob{to{transform:translateY(-5px)}}
.sway{animation:sway 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.flick{animation:flick .45s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{to{transform:scale(1.18,.82)}}
.steam{animation:steam 2.4s ease-in infinite;transform-box:fill-box}
@keyframes steam{0%{transform:translateY(6px);opacity:0}30%{opacity:.85}100%{transform:translateY(-16px);opacity:0}}
.drift{animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(34px)}}
.fall{animation:fall 1.7s ease-in infinite}
@keyframes fall{0%{transform:translateY(-22px);opacity:0}25%{opacity:1}100%{transform:translateY(38px);opacity:0}}
.pulse{animation:pulse 1.3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes pulse{to{transform:scale(1.12)}}
.slide{animation:slide 4s ease-in-out infinite alternate}
@keyframes slide{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
.blink{animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.rip{animation:rip 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes rip{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.dive{animation:dive 2.2s ease-in infinite}
@keyframes dive{0%,20%{transform:translateY(-10px)}60%{transform:translateY(26px)}100%{transform:translateY(-10px)}}
.spin{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="240" rx="0" fill="#E8F1F5" /><rect x="0" y="180" width="400" height="60" rx="0" fill="#C8D4DC" /><rect x="300" y="50" width="80" height="130" rx="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><rect x="318" y="80" width="44" height="100" rx="2" fill="#CFE9FF" stroke="#2B2F4A" stroke-width="2.5" /><path d="M340 60 v14 M333 67 h14" fill="none" stroke="#3FA34D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><line x1="340" y1="80" x2="340" y2="180" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><g class="sway" transform="translate(70 195)" style="animation-delay:0.0s"><path d="M0 0 Q-4 -40 4 -80 M0 -30 l-16 -14 M2 -50 l16 -14 M3 -70 l-12 -12" fill="none" stroke="#8B5A2B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><circle cx="-16" cy="-46" r="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="18" cy="-66" r="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="1.5" /><rect x="-8" y="-42" width="16" height="8" rx="2" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.5" /><path d="M0 0 l-8 8 M0 0 l8 8" fill="none" stroke="#8B5A2B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></g><g class="sway" transform="translate(150 195)" style="animation-delay:0.4s"><path d="M0 0 Q-4 -40 4 -80 M0 -30 l-16 -14 M2 -50 l16 -14 M3 -70 l-12 -12" fill="none" stroke="#8B5A2B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><circle cx="-16" cy="-46" r="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="18" cy="-66" r="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="1.5" /><rect x="-8" y="-42" width="16" height="8" rx="2" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.5" /><path d="M0 0 l-8 8 M0 0 l8 8" fill="none" stroke="#8B5A2B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></g><g class="sway" transform="translate(230 195)" style="animation-delay:0.8s"><path d="M0 0 Q-4 -40 4 -80 M0 -30 l-16 -14 M2 -50 l16 -14 M3 -70 l-12 -12" fill="none" stroke="#8B5A2B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><circle cx="-16" cy="-46" r="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="18" cy="-66" r="5" fill="#3FA34D" stroke="#2B2F4A" stroke-width="1.5" /><rect x="-8" y="-42" width="16" height="8" rx="2" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.5" /><path d="M0 0 l-8 8 M0 0 l8 8" fill="none" stroke="#8B5A2B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /></g></svg>