<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Left: a teacup crossed out beside a worried person. Right: a busy tea house with cups steaming</title><style>
.bob{animation:bob 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes bob{to{transform:translateY(-5px)}}
.sway{animation:sway 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.flick{animation:flick .45s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{to{transform:scale(1.18,.82)}}
.steam{animation:steam 2.4s ease-in infinite;transform-box:fill-box}
@keyframes steam{0%{transform:translateY(6px);opacity:0}30%{opacity:.85}100%{transform:translateY(-16px);opacity:0}}
.drift{animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(34px)}}
.fall{animation:fall 1.7s ease-in infinite}
@keyframes fall{0%{transform:translateY(-22px);opacity:0}25%{opacity:1}100%{transform:translateY(38px);opacity:0}}
.pulse{animation:pulse 1.3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes pulse{to{transform:scale(1.12)}}
.slide{animation:slide 4s ease-in-out infinite alternate}
@keyframes slide{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
.blink{animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.rip{animation:rip 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes rip{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.dive{animation:dive 2.2s ease-in infinite}
@keyframes dive{0%,20%{transform:translateY(-10px)}60%{transform:translateY(26px)}100%{transform:translateY(-10px)}}
.spin{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="240" rx="0" fill="#FFF2D8" /><line x1="200" y1="10" x2="200" y2="230" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><g transform="translate(100 130) scale(2.0)"><path d="M-12 -12 H12 V0 Q12 10 0 10 Q-12 10 -12 0 Z" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M12 -8 Q22 -8 20 0 Q18 6 11 5" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="0" cy="-12" rx="12" ry="3" fill="#B5651D" stroke="#2B2F4A" stroke-width="1.5" /><g class="steam"><path d="M-4 -18 Q-8 -24 -4 -30" fill="none" stroke="#9AA3B2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M4 -18 Q0 -24 4 -30" fill="none" stroke="#9AA3B2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g></g><g class="blink"><circle cx="100" cy="110" r="40" fill="none" stroke="#E5484D" stroke-width="5" /><line x1="72" y1="82" x2="128" y2="138" stroke="#E5484D" stroke-width="5" stroke-linecap="round" /></g><g transform="translate(60 225) scale(0.9)"><rect x="-6" y="-24" width="5" height="24" rx="1" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="2" /><rect x="1" y="-24" width="5" height="24" rx="1" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="2" /><rect x="-7" y="-26" width="7" height="26" rx="1" fill="#4A4F6B" stroke="#2B2F4A" stroke-width="2" /><rect x="0" y="-26" width="7" height="26" rx="1" fill="#4A4F6B" stroke="#2B2F4A" stroke-width="2" /><rect x="-8" y="-26" width="16" height="4" rx="0" fill="#2B2F4A" /><rect x="-9" y="-48" width="18" height="24" rx="5" fill="#7FB5E8" stroke="#2B2F4A" stroke-width="2.5" /><line x1="-9" y1="-44" x2="-14" y2="-26" stroke="#F2C9A0" stroke-width="4" stroke-linecap="round" /><line x1="9" y1="-44" x2="17" y2="-66" stroke="#F2C9A0" stroke-width="4" stroke-linecap="round" /><circle cx="0" cy="-58" r="10" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="2.5" /><path d="M-10 -60 Q-9 -72 0 -70 Q10 -72 10 -60 Q4 -66 -10 -60Z" fill="#3a2a20" /><circle cx="-3.5" cy="-58" r="1.3" fill="#2B2F4A" /><circle cx="3.5" cy="-58" r="1.3" fill="#2B2F4A" /><path d="M-3 -52 Q0 -55 3 -52" fill="none" stroke="#2B2F4A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></g><rect x="230" y="90" width="140" height="90" rx="4" fill="#C0583E" stroke="#2B2F4A" stroke-width="3" /><path d="M220 92 L300 50 L380 92Z" fill="#8E3A28" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="285" y="130" width="30" height="50" rx="3" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2.5" /><g transform="translate(250 130) scale(0.8)"><path d="M-12 -12 H12 V0 Q12 10 0 10 Q-12 10 -12 0 Z" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M12 -8 Q22 -8 20 0 Q18 6 11 5" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="0" cy="-12" rx="12" ry="3" fill="#B5651D" stroke="#2B2F4A" stroke-width="1.5" /><g class="steam"><path d="M-4 -18 Q-8 -24 -4 -30" fill="none" stroke="#9AA3B2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M4 -18 Q0 -24 4 -30" fill="none" stroke="#9AA3B2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g></g><g transform="translate(350 130) scale(0.8)"><path d="M-12 -12 H12 V0 Q12 10 0 10 Q-12 10 -12 0 Z" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M12 -8 Q22 -8 20 0 Q18 6 11 5" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="0" cy="-12" rx="12" ry="3" fill="#B5651D" stroke="#2B2F4A" stroke-width="1.5" /><g class="steam"><path d="M-4 -18 Q-8 -24 -4 -30" fill="none" stroke="#9AA3B2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M4 -18 Q0 -24 4 -30" fill="none" stroke="#9AA3B2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g></g><rect x="262" y="104" width="76" height="16" rx="3" fill="#FFE0B2" stroke="#2B2F4A" stroke-width="2.5" /></svg>