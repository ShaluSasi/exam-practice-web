<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A bakery counter with several kinds of baked goods</title><style>
.bob{animation:bob 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes bob{to{transform:translateY(-5px)}}
.sway{animation:sway 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.flick{animation:flick .45s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{to{transform:scale(1.18,.82)}}
.steam{animation:steam 2.4s ease-in infinite;transform-box:fill-box}
@keyframes steam{0%{transform:translateY(6px);opacity:0}30%{opacity:.85}100%{transform:translateY(-16px);opacity:0}}
.drift{animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(34px)}}
.fall{animation:fall 1.7s ease-in infinite}
@keyframes fall{0%{transform:translateY(-22px);opacity:0}25%{opacity:1}100%{transform:translateY(38px);opacity:0}}
.pulse{animation:pulse 1.3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes pulse{to{transform:scale(1.12)}}
.slide{animation:slide 4s ease-in-out infinite alternate}
@keyframes slide{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
.blink{animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.rip{animation:rip 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes rip{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.dive{animation:dive 2.2s ease-in infinite}
@keyframes dive{0%,20%{transform:translateY(-10px)}60%{transform:translateY(26px)}100%{transform:translateY(-10px)}}
.spin{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="240" rx="0" fill="#FFEFD5" /><rect x="0" y="170" width="400" height="70" rx="0" fill="#D9B98A" /><rect x="14" y="18" width="110" height="70" rx="4" fill="#CFE9FF" stroke="#2B2F4A" stroke-width="3" /><line x1="69" y1="18" x2="69" y2="88" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><line x1="14" y1="53" x2="124" y2="53" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><rect x="10" y="150" width="380" height="18" rx="4" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="3" /><rect x="30" y="168" width="12" height="50" rx="0" fill="#6B4423" stroke="#2B2F4A" stroke-width="2.5" /><rect x="358" y="168" width="12" height="50" rx="0" fill="#6B4423" stroke="#2B2F4A" stroke-width="2.5" /><line x1="55" y1="70" x2="55" y2="150" stroke="#6BA84A" stroke-width="5" stroke-linecap="round" /><circle cx="55" cy="138" r="17" fill="none" stroke="#C98A3B" stroke-width="6" /><circle cx="55" cy="138" r="17" fill="none" stroke="#7a4a12" stroke-width="1.2" opacity=".6"/><circle cx="55" cy="121" r="17" fill="none" stroke="#C98A3B" stroke-width="6" /><circle cx="55" cy="121" r="17" fill="none" stroke="#7a4a12" stroke-width="1.2" opacity=".6"/><circle cx="55" cy="104" r="17" fill="none" stroke="#C98A3B" stroke-width="6" /><circle cx="55" cy="104" r="17" fill="none" stroke="#7a4a12" stroke-width="1.2" opacity=".6"/><g transform="translate(130 138) scale(1.1)"><ellipse cx="0" cy="0" rx="24" ry="11" fill="#D9923B" stroke="#2B2F4A" stroke-width="2.5" /><line x1="-10" y1="-6" x2="-6" y2="4" stroke="#9a5f1d" stroke-width="2" stroke-linecap="round" /><line x1="0" y1="-8" x2="3" y2="6" stroke="#9a5f1d" stroke-width="2" stroke-linecap="round" /><line x1="10" y1="-6" x2="12" y2="4" stroke="#9a5f1d" stroke-width="2" stroke-linecap="round" /></g><g transform="translate(150 122) scale(1.0)"><ellipse cx="0" cy="0" rx="24" ry="11" fill="#E0A24C" stroke="#2B2F4A" stroke-width="2.5" /><line x1="-10" y1="-6" x2="-6" y2="4" stroke="#9a5f1d" stroke-width="2" stroke-linecap="round" /><line x1="0" y1="-8" x2="3" y2="6" stroke="#9a5f1d" stroke-width="2" stroke-linecap="round" /><line x1="10" y1="-6" x2="12" y2="4" stroke="#9a5f1d" stroke-width="2" stroke-linecap="round" /></g><ellipse cx="205" cy="146" rx="26" ry="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="192" cy="138" r="8" fill="#E8B65C" stroke="#2B2F4A" stroke-width="2" /><circle cx="206" cy="138" r="8" fill="#E8B65C" stroke="#2B2F4A" stroke-width="2" /><circle cx="220" cy="138" r="8" fill="#E8B65C" stroke="#2B2F4A" stroke-width="2" /><circle cx="206" cy="128" r="8" fill="#E8B65C" stroke="#2B2F4A" stroke-width="2" /><rect x="250" y="124" width="46" height="26" rx="4" fill="#F6A5C0" stroke="#2B2F4A" stroke-width="2.5" /><rect x="258" y="104" width="30" height="20" rx="4" fill="#FFD6E5" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="273" cy="98" r="5" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" /><line x1="250" y1="136" x2="296" y2="136" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" /><path d="M320 150 L360 150 L340 118 Z" fill="#F3DFA8" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M326 142 L354 142" fill="none" stroke="#3FA34D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M330 136 L350 136" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M342 146 L382 146 L362 114 Z" fill="#F3DFA8" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M348 138 L376 138" fill="none" stroke="#3FA34D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M352 132 L372 132" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></svg>