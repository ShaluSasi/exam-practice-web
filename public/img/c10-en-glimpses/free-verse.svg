erif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >rhyme?</text><path d="M310 126 l50 36 M360 126 l-50 36" fill="none" stroke="#E5484D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></svg>