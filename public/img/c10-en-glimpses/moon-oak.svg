<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Two night scenes: a whole bright moon on the left, and on the right a moon broken into bright pieces that flash in the crown of a tall oak</title><style>
.bob{animation:bob 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes bob{to{transform:translateY(-5px)}}
.sway{animation:sway 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.flick{animation:flick .45s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{to{transform:scale(1.18,.82)}}
.steam{animation:steam 2.4s ease-in infinite;transform-box:fill-box}
@keyframes steam{0%{transform:translateY(6px);opacity:0}30%{opacity:.85}100%{transform:translateY(-16px);opacity:0}}
.drift{animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(34px)}}
.fall{animation:fall 1.7s ease-in infinite}
@keyframes fall{0%{transform:translateY(-22px);opacity:0}25%{opacity:1}100%{transform:translateY(38px);opacity:0}}
.pulse{animation:pulse 1.3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes pulse{to{transform:scale(1.12)}}
.slide{animation:slide 4s ease-in-out infinite alternate}
@keyframes slide{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
.blink{animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.rip{animation:rip 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes rip{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.dive{animation:dive 2.2s ease-in infinite}
@keyframes dive{0%,20%{transform:translateY(-10px)}60%{transform:translateY(26px)}100%{transform:translateY(-10px)}}
.spin{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="200" height="240" rx="0" fill="#1F2347" /><rect x="200" y="0" width="200" height="240" rx="0" fill="#2B2F4A" /><line x1="200" y1="0" x2="200" y2="240" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" /><g class="pulse"><circle cx="100" cy="100" r="40" fill="#FFF6C8" stroke="#E8D98A" stroke-width="3" /></g><circle cx="60" cy="40" r="2" fill="#FFFFFF" /><circle cx="150" cy="36" r="2" fill="#FFFFFF" /><path d="M250 240 V150 Q220 130 240 100 Q230 60 270 50 Q300 20 340 50 Q380 60 360 100 Q390 130 350 150 V240Z" fill="#1B3B2B" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><g class="blink" style="animation-delay:0.0s"><path d="M280 70 l14 -6 l6 14 l-12 8z" fill="#FFF6C8" stroke="#E8D98A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><g class="blink" style="animation-delay:0.25s"><path d="M310 62 l12 4 l-4 14 l-12 -6z" fill="#FFF6C8" stroke="#E8D98A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><g class="blink" style="animation-delay:0.5s"><path d="M330 90 l12 -4 l2 14 l-12 4z" fill="#FFF6C8" stroke="#E8D98A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><g class="blink" style="animation-delay:0.75s"><path d="M290 100 l10 8 l-8 10 l-10 -6z" fill="#FFF6C8" stroke="#E8D98A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><g class="blink" style="animation-delay:1.0s"><path d="M314 110 l12 2 l-4 12 l-12 -4z" fill="#FFF6C8" stroke="#E8D98A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><g class="blink" style="animation-delay:1.25s"><path d="M270 126 l12 -2 l2 12 l-12 2z" fill="#FFF6C8" stroke="#E8D98A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g></svg>