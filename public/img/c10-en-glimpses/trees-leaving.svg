<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Trees walking out of a house at night towards a forest, under a bright moon</title><style>
.bob{animation:bob 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes bob{to{transform:translateY(-5px)}}
.sway{animation:sway 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.flick{animation:flick .45s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{to{transform:scale(1.18,.82)}}
.steam{animation:steam 2.4s ease-in infinite;transform-box:fill-box}
@keyframes steam{0%{transform:translateY(6px);opacity:0}30%{opacity:.85}100%{transform:translateY(-16px);opacity:0}}
.drift{animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(34px)}}
.fall{animation:fall 1.7s ease-in infinite}
@keyframes fall{0%{transform:translateY(-22px);opacity:0}25%{opacity:1}100%{transform:translateY(38px);opacity:0}}
.pulse{animation:pulse 1.3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes pulse{to{transform:scale(1.12)}}
.slide{animation:slide 4s ease-in-out infinite alternate}
@keyframes slide{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
.blink{animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.rip{animation:rip 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes rip{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.dive{animation:dive 2.2s ease-in infinite}
@keyframes dive{0%,20%{transform:translateY(-10px)}60%{transform:translateY(26px)}100%{transform:translateY(-10px)}}
.spin{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="240" rx="0" fill="#1F2347" /><rect x="0" y="190" width="400" height="50" rx="0" fill="#2E5E3A" /><g class="pulse"><circle cx="340" cy="40" r="18" fill="#FFF6C8" stroke="#E8D98A" stroke-width="2" /></g><g transform="translate(290 190) scale(0.9)"><rect x="-5" y="-40" width="10" height="40" rx="0" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="0" cy="-58" r="26" fill="#2E7D3A" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="-18" cy="-44" r="16" fill="#2E7D3A" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="18" cy="-44" r="16" fill="#2E7D3A" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="0" cy="-58" r="22" fill="#2E7D3A" /></g><g transform="translate(340 188) scale(0.9)"><rect x="-5" y="-40" width="10" height="40" rx="0" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="0" cy="-58" r="26" fill="#2E7D3A" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="-18" cy="-44" r="16" fill="#2E7D3A" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="18" cy="-44" r="16" fill="#2E7D3A" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="0" cy="-58" r="22" fill="#2E7D3A" /></g><g transform="translate(375 192) scale(0.9)"><rect x="-5" y="-40" width="10" height="40" rx="0" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="0" cy="-58" r="26" fill="#2E7D3A" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="-18" cy="-44" r="16" fill="#2E7D3A" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="18" cy="-44" r="16" fill="#2E7D3A" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="0" cy="-58" r="22" fill="#2E7D3A" /></g><rect x="10" y="70" width="130" height="120" rx="0" fill="#E8C9A0" stroke="#2B2F4A" stroke-width="3" /><path d="M0 72 L75 30 L150 72Z" fill="#8E3A28" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="50" y="110" width="50" height="80" rx="3" fill="#FFF2D8" stroke="#2B2F4A" stroke-width="3" /><g class="slide" style="animation-delay:0.0s;animation-duration:3s"><g transform="translate(100 200) scale(0.8)"><rect x="-5" y="-40" width="10" height="40" rx="0" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="0" cy="-58" r="26" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="-18" cy="-44" r="16" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="18" cy="-44" r="16" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="0" cy="-58" r="22" fill="#3FA34D" /></g><path d="M-8 0 l-6 8 M0 0 l0 10 M8 0 l6 8" fill="none" stroke="#6B4423" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g class="slide" style="animation-delay:0.5s;animation-duration:3s"><g transform="translate(160 200) scale(0.8)"><rect x="-5" y="-40" width="10" height="40" rx="0" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="0" cy="-58" r="26" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="-18" cy="-44" r="16" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="18" cy="-44" r="16" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="0" cy="-58" r="22" fill="#3FA34D" /></g><path d="M-8 0 l-6 8 M0 0 l0 10 M8 0 l6 8" fill="none" stroke="#6B4423" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g class="slide" style="animation-delay:1.0s;animation-duration:3s"><g transform="translate(215 200) scale(0.8)"><rect x="-5" y="-40" width="10" height="40" rx="0" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="0" cy="-58" r="26" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="-18" cy="-44" r="16" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="18" cy="-44" r="16" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="0" cy="-58" r="22" fill="#3FA34D" /></g><path d="M-8 0 l-6 8 M0 0 l0 10 M8 0 l6 8" fill="none" stroke="#6B4423" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /