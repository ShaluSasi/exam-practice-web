<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Tea leaves drifting down into a pot of boiling water over a fire while a crowned figure looks on</title><style>
.bob{animation:bob 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes bob{to{transform:translateY(-5px)}}
.sway{animation:sway 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.flick{animation:flick .45s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{to{transform:scale(1.18,.82)}}
.steam{animation:steam 2.4s ease-in infinite;transform-box:fill-box}
@keyframes steam{0%{transform:translateY(6px);opacity:0}30%{opacity:.85}100%{transform:translateY(-16px);opacity:0}}
.drift{animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(34px)}}
.fall{animation:fall 1.7s ease-in infinite}
@keyframes fall{0%{transform:translateY(-22px);opacity:0}25%{opacity:1}100%{transform:translateY(38px);opacity:0}}
.pulse{animation:pulse 1.3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes pulse{to{transform:scale(1.12)}}
.slide{animation:slide 4s ease-in-out infinite alternate}
@keyframes slide{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
.blink{animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.rip{animation:rip 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes rip{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.dive{animation:dive 2.2s ease-in infinite}
@keyframes dive{0%,20%{transform:translateY(-10px)}60%{transform:translateY(26px)}100%{transform:translateY(-10px)}}
.spin{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="240" rx="0" fill="#FFF2D8" /><rect x="0" y="190" width="400" height="50" rx="0" fill="#D9B98A" /><g transform="translate(200 150) scale(2.0)"><path d="M-22 -14 H22 Q26 8 12 14 H-12 Q-26 8 -22 -14Z" fill="#6B7280" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="-26" y="-18" width="52" height="6" rx="3" fill="#4B5563" stroke="#2B2F4A" stroke-width="2" /></g><line x1="160" y1="190" x2="240" y2="170" stroke="#8B5A2B" stroke-width="6" stroke-linecap="round" /><line x1="160" y1="170" x2="240" y2="190" stroke="#8B5A2B" stroke-width="6" stroke-linecap="round" /><g class="flick" transform="translate(180 200) scale(1.4)" style="animation-delay:0s"><path d="M0 0 Q-9 -8 -4 -20 Q0 -14 2 -24 Q10 -10 8 -4 Q6 2 0 0Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 -2 Q-4 -8 0 -14 Q4 -8 0 -2Z" fill="#FFD25E" /></g><g class="flick" transform="translate(205 200) scale(1.7)" style="animation-delay:0.2s"><path d="M0 0 Q-9 -8 -4 -20 Q0 -14 2 -24 Q10 -10 8 -4 Q6 2 0 0Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 -2 Q-4 -8 0 -14 Q4 -8 0 -2Z" fill="#FFD25E" /></g><g class="flick" transform="translate(230 200) scale(1.3)" style="animation-delay:0.4s"><path d="M0 0 Q-9 -8 -4 -20 Q0 -14 2 -24 Q10 -10 8 -4 Q6 2 0 0Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 -2 Q-4 -8 0 -14 Q4 -8 0 -2Z" fill="#FFD25E" /></g><g class="fall" style="animation-delay:0.0s"><g transform="translate(185 90) rotate(-20) scale(1.0)"><path d="M0 0 Q-9 -10 0 -22 Q9 -10 0 0Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><line x1="0" y1="0" x2="0" y2="-16" stroke="#1f6a2c" stroke-width="1.2" stroke-linecap="round" /></g></g><g class="fall" style="animation-delay:0.5s"><g transform="translate(205 90) rotate(0) scale(1.0)"><path d="M0 0 Q-9 -10 0 -22 Q9 -10 0 0Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><line x1="0" y1="0" x2="0" y2="-16" stroke="#1f6a2c" stroke-width="1.2" stroke-linecap="round" /></g></g><g class="fall" style="animation-delay:1.0s"><g transform="translate(225 90) rotate(20) scale(1.0)"><path d="M0 0 Q-9 -10 0 -22 Q9 -10 0 0Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><line x1="0" y1="0" x2="0" y2="-16" stroke="#1f6a2c" stroke-width="1.2" stroke-linecap="round" /></g></g><g class="steam" transform="translate(200 100)"><path d="M-3 0 q-6 -10 0 -18 M4 0 q-6 -10 0 -18" fill="none" stroke="#9AA3B2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(70 230) scale(1.3)"><rect x="-6" y="-24" width="5" height="24" rx="1" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="2" /><rect x="1" y="-24" width="5" height="24" rx="1" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="2" /><rect x="-8" y="-26" width="16" height="4" rx="0" fill="#2B2F4A" /><rect x="-9" y="-48" width="18" height="24" rx="5" fill="#C0292E" stroke="#2B2F4A" stroke-width="2.5" /><path d="M-9 -28 L-15 -4 Q0 2 15 -4 L9 -28 Z" fill="#C0292E" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><line x1="-9" y1="-44" x2="-14" y2="-26" stroke="#F2C9A0" stroke-width="4" stroke-linecap="round" /><line x1="9" y1="-44" x2="14" y2="-26" stroke="#F2C9A0" stroke-width="4" stroke-linecap="round" /><circle cx="0" cy="-58" r="10" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="2.5" /><path d="M-10 -60 Q-9 -72 0 -70 Q10 -72 10 -60 Q4 -66 -10 -60Z" fill="#3a2a20" /><path d="M-10 -70 L-6 -82 L0 -74 L6 -82 L10 -70Z" fill="#FFD25E" stroke="#2B2F4A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="-3.5" cy="-58" r="1.3" fill="#2B2F4A" /><circle cx="3.5" cy="-58" r="1.3" fill="#2B2F4A" /><path d="M-3 -54 Q0 -51 3 -54" fill="none" stroke="#2B2F4A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></g></svg>