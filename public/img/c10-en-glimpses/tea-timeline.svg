<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A timeline with three pictures from left to right: a cup of tea, a sailing ship and a tea bush</title><style>
.bob{animation:bob 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes bob{to{transform:translateY(-5px)}}
.sway{animation:sway 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.flick{animation:flick .45s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{to{transform:scale(1.18,.82)}}
.steam{animation:steam 2.4s ease-in infinite;transform-box:fill-box}
@keyframes steam{0%{transform:translateY(6px);opacity:0}30%{opacity:.85}100%{transform:translateY(-16px);opacity:0}}
.drift{animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(34px)}}
.fall{animation:fall 1.7s ease-in infinite}
@keyframes fall{0%{transform:translateY(-22px);opacity:0}25%{opacity:1}100%{transform:translateY(38px);opacity:0}}
.pulse{animation:pulse 1.3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes pulse{to{transform:scale(1.12)}}
.slide{animation:slide 4s ease-in-out infinite alternate}
@keyframes slide{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
.blink{animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.rip{animation:rip 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes rip{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.dive{animation:dive 2.2s ease-in infinite}
@keyframes dive{0%,20%{transform:translateY(-10px)}60%{transform:translateY(26px)}100%{transform:translateY(-10px)}}
.spin{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="240" rx="0" fill="#FFF2D8" /><line x1="30" y1="140" x2="370" y2="140" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round" /><circle cx="70" cy="140" r="9" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" /><rect x="20" y="40" width="100" height="70" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><line x1="70" y1="110" x2="70" y2="131" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><circle cx="200" cy="140" r="9" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" /><rect x="150" y="40" width="100" height="70" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><line x1="200" y1="110" x2="200" y2="131" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><circle cx="330" cy="140" r="9" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" /><rect x="280" y="40" width="100" height="70" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><line x1="330" y1="110" x2="330" y2="131" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><g transform="translate(200 85) scale(1.4)"><path d="M-12 -12 H12 V0 Q12 10 0 10 Q-12 10 -12 0 Z" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M12 -8 Q22 -8 20 0 Q18 6 11 5" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="0" cy="-12" rx="12" ry="3" fill="#B5651D" stroke="#2B2F4A" stroke-width="1.5" /><g class="steam"><path d="M-4 -18 Q-8 -24 -4 -30" fill="none" stroke="#9AA3B2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M4 -18 Q0 -24 4 -30" fill="none" stroke="#9AA3B2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g></g><g class="bob" transform="translate(330 85)"><path d="M-26 6 H26 L16 20 H-16Z" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><line x1="0" y1="6" x2="0" y2="-22" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M0 -22 L20 -6 H0Z" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M42.0 95 Q42.0 55.800000000000004 70 55.800000000000004 Q98.0 55.800000000000004 98.0 95 Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></svg>