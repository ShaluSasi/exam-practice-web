<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Two scenes: a baker setting out with a full basket in the morning, and returning with an empty basket</title><style>
.bob{animation:bob 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes bob{to{transform:translateY(-5px)}}
.sway{animation:sway 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.flick{animation:flick .45s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{to{transform:scale(1.18,.82)}}
.steam{animation:steam 2.4s ease-in infinite;transform-box:fill-box}
@keyframes steam{0%{transform:translateY(6px);opacity:0}30%{opacity:.85}100%{transform:translateY(-16px);opacity:0}}
.drift{animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(34px)}}
.fall{animation:fall 1.7s ease-in infinite}
@keyframes fall{0%{transform:translateY(-22px);opacity:0}25%{opacity:1}100%{transform:translateY(38px);opacity:0}}
.pulse{animation:pulse 1.3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes pulse{to{transform:scale(1.12)}}
.slide{animation:slide 4s ease-in-out infinite alternate}
@keyframes slide{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
.blink{animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.rip{animation:rip 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes rip{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.dive{animation:dive 2.2s ease-in infinite}
@keyframes dive{0%,20%{transform:translateY(-10px)}60%{transform:translateY(26px)}100%{transform:translateY(-10px)}}
.spin{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="200" height="240" rx="0" fill="#FFE9B8" /><rect x="200" y="0" width="200" height="240" rx="0" fill="#FFC9A3" /><rect x="0" y="180" width="400" height="60" rx="0" fill="#CDE7B0" /><line x1="200" y1="0" x2="200" y2="240" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><g class="bob"><g class="pulse"><line x1="85.0" y1="60.0" x2="92.0" y2="60.0" stroke="#FFD25E" stroke-width="3" stroke-linecap="round" /><line x1="77.6776370627809" y1="77.67770199648683" x2="82.62737544035956" y2="82.62745855550315" stroke="#FFD25E" stroke-width="3" stroke-linecap="round" /><line x1="59.99990816987242" y1="84.99999999983135" x2="59.99988245743669" y2="91.99999999978412" stroke="#FFD25E" stroke-width="3" stroke-linecap="round" /><line x1="42.32223307004575" y1="77.67757212883646" x2="37.372458329658556" y2="82.62729232491067" stroke="#FFD25E" stroke-width="3" stroke-linecap="round" /><line x1="35.00000000067462" y1="59.99981633974483" x2="28.000000000863515" y2="59.99976491487339" stroke="#FFD25E" stroke-width="3" stroke-linecap="round" /><line x1="42.3224928053465" y1="42.32216813681684" x2="37.372790790843524" y2="37.37237521512556" stroke="#FFD25E" stroke-width="3" stroke-linecap="round" /><line x1="60.00027549038274" y1="35.000000001517904" x2="60.00035262768991" y2="28.00000000194291" stroke="#FFD25E" stroke-width="3" stroke-linecap="round" /><line x1="77.67789679617354" y1="42.32255773976797" x2="82.62770789910212" y2="37.372873906902996" stroke="#FFD25E" stroke-width="3" stroke-linecap="round" /><circle cx="60" cy="60" r="20" fill="#FFD25E" stroke="#FF8A1F" stroke-width="3" /></g></g><path d="M0 150 Q40 130 100 150 T200 150 V180 H0Z" fill="#8FC27B" /><g transform="translate(100 200) scale(1.3)"><rect x="-6" y="-24" width="5" height="24" rx="1" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="2" /><rect x="1" y="-24" width="5" height="24" rx="1" fill="#F2C9A0" stroke="#2B2F4A" stroke-w