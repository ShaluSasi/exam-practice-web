h="1.2" stroke-linecap="round" /></g><g transform="translate(234 118) rotate(25) scale(1.3)"><path d="M0 0 Q-9 -10 0 -22 Q9 -10 0 0Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><line x1="0" y1="0" x2="0" y2="-16" stroke="#1f6a2c" stroke-width="1.2" stroke-linecap="round" /></g></g><rect x="268" y="120" width="56" height="60" rx="8" fill="#CFF0C5" stroke="#2B2F4A" stroke-width="3" /><text x="296" y="156" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Jul</text><g class="bob" style="animation-delay:0.6s"><g transform="translate(296 118) rotate(-20) scale(1.3)"><path d="M0 0 Q-9 -10 0 -22 Q9 -10 0 0Z" fill="#4FB063" stroke="#2B2F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><line x1="0" y1="0" x2="0" y2="-16" stroke="#1f6a2c" stroke-width="1.2" stroke-linecap="round" /></g><g transform="translate(296 118) rotate(25) scale(1.3)"><path d="M0 0 Q-9 -10 0 -22 Q9 -10 0 0Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /><line x1="0" y1="0" x2="0" y2="-16" stroke="#1f6a2c" stroke-width="1.2" stroke-linecap="round" /></g></g><rect x="330" y="120" width="56" height="60" rx="8" fill="#E8EAF0" stroke="#2B2F4A" stroke-width="3" /><text x="358" y="156" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Aug</text><path d="M130 200 v14 h182 v-14" fill="none" stroke="#3FA34D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="221" y="236" font-family="sans-serif" font-size="14" font-weight="700" fill="#2E7D3A" text-anchor="middle" >Best tea</text><circle cx="200" cy="50" r="22" fill="none" /><g transform="translate(200 70) scale(1.5)"><path d="M-12 -12 H12 V0 Q12 10 0 10 Q-12 10 -12 0 Z" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M12 -8 Q22 -8 20 0 Q18 6 11 5" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="0" cy="-12" rx="12" ry="3" fill="#B5651D" stroke="#2B2F4A" stroke-width="1.5" /><g class="steam"><path d="M-4 -18 Q-8 -24 -4 -30" fill="none" stroke="#9AA3B2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M4 -18 Q0 -24 4 -30" fill="none" stroke="#9AA3B2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" /></g></g></svg>