<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Two text cards side by side: one warm and personal with a heart and a loaf, one a plain list of facts with a bar chart</title><style>
.bob{animation:bob 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes bob{to{transform:translateY(-5px)}}
.sway{animation:sway 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.flick{animation:flick .45s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{to{transform:scale(1.18,.82)}}
.steam{animation:steam 2.4s ease-in infinite;transform-box:fill-box}
@keyframes steam{0%{transform:translateY(6px);opacity:0}30%{opacity:.85}100%{transform:translateY(-16px);opacity:0}}
.drift{animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(34px)}}
.fall{animation:fall 1.7s ease-in infinite}
@keyframes fall{0%{transform:translateY(-22px);opacity:0}25%{opacity:1}100%{transform:translateY(38px);opacity:0}}
.pulse{animation:pulse 1.3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes pulse{to{transform:scale(1.12)}}
.slide{animation:slide 4s ease-in-out infinite alternate}
@keyframes slide{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
.blink{animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.rip{animation:rip 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes rip{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.dive{animation:dive 2.2s ease-in infinite}
@keyframes dive{0%,20%{transform:translateY(-10px)}60%{transform:translateY(26px)}100%{transform:translateY(-10px)}}
.spin{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="20" y="24" width="170" height="192" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><rect x="210" y="24" width="170" height="192" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><g class="pulse" transform="translate(105 70)"><path d="M0 6 C-26 -14 -12 -30 0 -16 C12 -30 26 -14 0 6Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(105 120) scale(1.4)"><ellipse cx="0" cy="0" rx="24" ry="11" fill="#D9923B" stroke="#2B2F4A" stroke-width="2.5" /><line x1="-10" y1="-6" x2="-6" y2="4" stroke="#9a5f1d" stroke-width="2" stroke-linecap="round" /><line x1="0" y1="-8" x2="3" y2="6" stroke="#9a5f1d" stroke-width="2" stroke-linecap="round" /><line x1="10" y1="-6" x2="12" y2="4" stroke="#9a5f1d" stroke-width="2" stroke-linecap="round" /></g><path d="M40 150 h130" fill="none" stroke="#B7BDCB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M40 164 h100" fill="none" stroke="#B7BDCB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M40 178 h130" fill="none" stroke="#B7BDCB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="238" cy="64" r="5" fill="#0B93D4" /><path d="M252 64 h100" fill="none" stroke="#B7BDCB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="238" cy="90" r="5" fill="#0B93D4" /><path d="M252 90 h76" fill="none" stroke="#B7BDCB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="238" cy="116" r="5" fill="#0B93D4" /><path d="M252 116 h100" fill="none" stroke="#B7BDCB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="238" cy="142" r="5" fill="#0B93D4" /><path d="M252 142 h76" fill="none" stroke="#B7BDCB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="236" y="164" width="20" height="36" rx="2" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" /><rect x="262" y="148" width="20" height="52" rx="2" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" /><rect x="288" y="176" width="20" height="24" rx="2" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" /><rect x="314" y="156" width="20" height="44" rx="2" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2" /></svg>