<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A tree canopy with a macaque and a langur watching, and a trekker stepping aside for a wild elephant on the trail</title><style>
.bob{animation:bob 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes bob{to{transform:translateY(-5px)}}
.sway{animation:sway 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.flick{animation:flick .45s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{to{transform:scale(1.18,.82)}}
.steam{animation:steam 2.4s ease-in infinite;transform-box:fill-box}
@keyframes steam{0%{transform:translateY(6px);opacity:0}30%{opacity:.85}100%{transform:translateY(-16px);opacity:0}}
.drift{animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(34px)}}
.fall{animation:fall 1.7s ease-in infinite}
@keyframes fall{0%{transform:translateY(-22px);opacity:0}25%{opacity:1}100%{transform:translateY(38px);opacity:0}}
.pulse{animation:pulse 1.3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes pulse{to{transform:scale(1.12)}}
.slide{animation:slide 4s ease-in-out infinite alternate}
@keyframes slide{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
.blink{animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.rip{animation:rip 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes rip{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.dive{animation:dive 2.2s ease-in infinite}
@keyframes dive{0%,20%{transform:translateY(-10px)}60%{transform:translateY(26px)}100%{transform:translateY(-10px)}}
.spin{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="240" rx="0" fill="#DFF1FF" /><rect x="0" y="170" width="400" height="70" rx="0" fill="#6FA95A" /><path d="M0 60 Q100 20 200 50 T400 40 V110 H0Z" fill="#2E7D3A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="90" cy="76" r="10" fill="#A6794C" stroke="#2B2F4A" stroke-width="2.5" /><rect x="82" y="84" width="16" height="18" rx="5" fill="#A6794C" stroke="#2B2F4A" stroke-width="2.5" /><path d="M98 90 Q118 100 108 112" fill="none" stroke="#A6794C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="94" cy="74" r="1.6" fill="#2B2F4A" /><circle cx="250" cy="78" r="10" fill="#555C70" stroke="#2B2F4A" stroke-width="2.5" /><rect x="242" y="86" width="16" height="22" rx="5" fill="#555C70" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="246" cy="76" r="1.6" fill="#FFFFFF" /><g class="slide" transform="translate(150 140)"><path d="M0 0 q8 -10 14 0 q-6 8 -14 0z" fill="#FFD25E" stroke="#2B2F4A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><g class="slide" transform="translate(300 150)" style="animation-delay:1s"><path d="M0 0 q8 -10 14 0 q-6 8 -14 0z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M120 240 Q200 190 300 170 L340 170 Q260 200 230 240Z" fill="#E9D8B4" /><ellipse cx="285" cy="178" rx="40" ry="24" fill="#9AA3B2" stroke="#2B2F4A" stroke-width="3" /><rect x="310" y="154" width="28" height="26" rx="9" fill="#9AA3B2" stroke="#2B2F4A" stroke-width="3" /><path d="M336 166 Q350 184 340 200" fill="none" stroke="#9AA3B2" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><circle cx="326" cy="162" r="2.2" fill="#2B2F4A" /><rect x="262" y="194" width="9" height="24" rx="3" fill="#9AA3B2" stroke="#2B2F4A" stroke-width="3" /><rect x="292" y="194" width="9" height="24" rx="3" fill="#9AA3B2" stroke="#2B2F4A" stroke-width="3" /><g class="slide" style="animation-duration:3s"><g transform="translate(120 222) scale(0.95)"><rect x="-6" y="-24" width="5" height="24" rx="1" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="2" /><rect x="1" y="-24" width="5" height="24" rx="1" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="2" /><rect x="-7" y="-26" width="7" height="26" rx="1" fill="#4A4F6B" stroke="#2B2F4A" stroke-width="2" /><rect x="0" y="-26" width="7" height="26" rx="1" fill="#4A4F6B" stroke="#2B2F4A" stroke-width="2" /><rect x="-8" y="-26" width="16" height="4" rx="0" fill="#2B2F4A" /><rect x="-9" y="-48" width="18" height="24" rx="5" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" /><line x1="-9" y1="-44" x2="-14" y2="-26" stroke="#F2C9A0" stroke-width="4" stroke-linecap="round" /><line x1="9" y1="-44" x2="17" y2="-66" stroke="#F2C9A0" stroke-width="4" stroke-linecap="round" /><circle cx="0" cy="-58" r="10" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="2.5" /><path d="M-10 -60 Q-9 -72 0 -70 Q10 -72 10 -60 Q4 -66 -10 -60Z" fill="#3a2a20" /><circle cx="-3.5" cy="-58" r="1.3" fill="#2B2F4A" /><circle cx="3.5" cy="-58" r="1.3" fill="#2B2F4A" /><path d="M-3 -54 Q0 -51 3 -54" fill="none" stroke="#2B2F4A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></g></g></svg>