<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Rolling green hills of Coorg with mist, tall trees and a small bungalow</title><style>
.bob{animation:bob 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes bob{to{transform:translateY(-5px)}}
.sway{animation:sway 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.flick{animation:flick .45s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{to{transform:scale(1.18,.82)}}
.steam{animation:steam 2.4s ease-in infinite;transform-box:fill-box}
@keyframes steam{0%{transform:translateY(6px);opacity:0}30%{opacity:.85}100%{transform:translateY(-16px);opacity:0}}
.drift{animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(34px)}}
.fall{animation:fall 1.7s ease-in infinite}
@keyframes fall{0%{transform:translateY(-22px);opacity:0}25%{opacity:1}100%{transform:translateY(38px);opacity:0}}
.pulse{animation:pulse 1.3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes pulse{to{transform:scale(1.12)}}
.slide{animation:slide 4s ease-in-out infinite alternate}
@keyframes slide{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
.blink{animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.rip{animation:rip 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes rip{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.dive{animation:dive 2.2s ease-in infinite}
@keyframes dive{0%,20%{transform:translateY(-10px)}60%{transform:translateY(26px)}100%{transform:translateY(-10px)}}
.spin{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="240" rx="0" fill="#DFF1FF" /><g class="pulse"><line x1="351.0" y1="34.0" x2="358.0" y2="34.0" stroke="#FFD25E" stroke-width="3" stroke-linecap="round" /><line x1="344.84921513273594" y1="48.849269677048945" x2="349.7989535103146" y2="53.79902623606526" stroke="#FFD25E" stroke-width="3" stroke-linecap="round" /><line x1="329.9999228626928" y1="54.99999999985833" x2="329.9998971502571" y2="61.99999999981111" stroke="#FFD25E" stroke-width="3" stroke-linecap="round" /><line x1="315.15067577883843" y1="48.84916058822263" x2="310.2009010384512" y2="53.79888078429684" stroke="#FFD25E" stroke-width="3" stroke-linecap="round" /><line x1="309.0000000005667" y1="33.99984572538566" x2="302.00000000075556" y2="33.99979430051421" stroke="#FFD25E" stroke-width="3" stroke-linecap="round" /><line x1="315.1508939564911" y1="19.15062123492615" x2="310.2011919419881" y2="14.200828313234865" stroke="#FFD25E" stroke-width="3" stroke-linecap="round" /><line x1="330.0002314119215" y1="13.000000001275037" x2="330.0003085492287" y2="6.000000001700048" stroke="#FFD25E" stroke-width="3" stroke-linecap="round" /><line x1="344.84943330878576" y1="19.150948501405093" x2="349.79924441171437" y2="14.201264668540123" stroke="#FFD25E" stroke-width="3" stroke-linecap="round" /><circle cx="330" cy="34" r="16" fill="#FFD25E" stroke="#FF8A1F" stroke-width="3" /></g><g transform="translate(90 36) scale(1.1)"><ellipse cx="0" cy="0" rx="26" ry="13" fill="#FFFFFF" /><ellipse cx="-14" cy="4" rx="16" ry="10" fill="#FFFFFF" /><ellipse cx="16" cy="5" rx="18" ry="10" fill="#FFFFFF" /></g><g transform="translate(220 56) scale(0.8)"><ellipse cx="0" cy="0" rx="26" ry="13" fill="#FFFFFF" /><ellipse cx="-14" cy="4" rx="16" ry="10" fill="#FFFFFF" /><ellipse cx="16" cy="5" rx="18" ry="10" fill="#FFFFFF" /></g><path d="M0 130 Q60 80 130 110 T260 96 T400 120 V190 H0Z" fill="#A8D58F" /><path d="M0 150 Q90 112 190 134 T400 126 V190 H0Z" fill="#7DB86B" /><path d="M0 175 Q100 150 200 170 T400 160 V240 H0Z" fill="#5FA55A" /><g class="drift"><ellipse cx="60" cy="150" rx="70" ry="9" fill="#FFFFFF" opacity="0.75"/><ellipse cx="250" cy="160" rx="90" ry="8" fill="#FFFFFF" opacity="0.75"/></g><g class="drift"><ellipse cx="60" cy="185" rx="70" ry="9" fill="#FFFFFF" opacity="0.6"/><ellipse cx="250" cy="195" rx="90" ry="8" fill="#FFFFFF" opacity="0.6"/></g><g transform="translate(50 215) scale(0.9)"><rect x="-5" y="-40" width="10" height="40" rx="0" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="0" cy="-58" r="26" fill="#2E7D3A" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="-18" cy="-44" r="16" fill="#2E7D3A" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="18" cy="-44" r="16" fill="#2E7D3A" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="0" cy="-58" r="22" fill="#2E7D3A" /></g><g transform="translate(120 215) scale(1.1)"><rect x="-5" y="-40" width="10" height="40" rx="0" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="0" cy="-58" r="26" fill="#2E7D3A" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="-18" cy="-44" r="16" fill="#2E7D3A" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="18" cy="-44" r="16" fill="#2E7D3A" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="0" cy="-58" r="22" fill="#2E7D3A" /></g><g transform="translate(300 215) scale(1.0)"><rect x="-5" y="-40" width="10" height="40" rx="0" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="0" cy="-58" r="26" fill="#2E7D3A" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="-18" cy="-44" r="16" fill="#2E7D3A" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="18" cy="-44" r="16" fill="#2E7D3A" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="0" cy="-58" r="22" fill="#2E7D3A" /></g><g transform="translate(360 215) scale(0.8)"><rect x="-5" y="-40" width="10" height="40" rx="0" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="0" cy="-58" r="26" fill="#2E7D3A" stroke=