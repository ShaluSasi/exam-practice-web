-60 Q-9 -72 0 -70 Q10 -72 10 -60 Q4 -66 -10 -60Z" fill="#3a2a20" /><circle cx="-3.5" cy="-58" r="1.3" fill="#2B2F4A" /><circle cx="3.5" cy="-58" r="1.3" fill="#2B2F4A" /><path d="M-3 -54 Q0 -51 3 -54" fill="none" stroke="#2B2F4A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" /></g><g class="bob"><line x1="262" y1="128" x2="276" y2="110" stroke="#8B5A2B" stroke-width="3" stroke-linecap="round" /></g><g class="slide" transform="translate(150 190)"><ellipse cx="0" cy="0" rx="24" ry="11" fill="#9AA3B2" stroke="#2B2F4A" stroke-width="2.5" /><path d="M24 0 L38 -9 V9Z" fill="#9AA3B2" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="-14" cy="-2" r="2.2" fill="#2B2F4A" /><path d="M-6 -8 Q4 -14 8 -8" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M20 150 q10 -6 20 0 t20 0" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M120 220 q10 -6 20 0 t20 0" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></svg>