<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A strip of months from June to March: the first three rainy and wet, the rest pleasant</title><style>
.bob{animation:bob 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes bob{to{transform:translateY(-5px)}}
.sway{animation:sway 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.flick{animation:flick .45s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{to{transform:scale(1.18,.82)}}
.steam{animation:steam 2.4s ease-in infinite;transform-box:fill-box}
@keyframes steam{0%{transform:translateY(6px);opacity:0}30%{opacity:.85}100%{transform:translateY(-16px);opacity:0}}
.drift{animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(34px)}}
.fall{animation:fall 1.7s ease-in infinite}
@keyframes fall{0%{transform:translateY(-22px);opacity:0}25%{opacity:1}100%{transform:translateY(38px);opacity:0}}
.pulse{animation:pulse 1.3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes pulse{to{transform:scale(1.12)}}
.slide{animation:slide 4s ease-in-out infinite alternate}
@keyframes slide{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
.blink{animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.rip{animation:rip 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes rip{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.dive{animation:dive 2.2s ease-in infinite}
@keyframes dive{0%,20%{transform:translateY(-10px)}60%{transform:translateY(26px)}100%{transform:translateY(-10px)}}
.spin{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="240" rx="0" fill="#F4FBF2" /><rect x="10" y="90" width="34" height="70" rx="6" fill="#B8C4D6" stroke="#2B2F4A" stroke-width="2.5" /><text x="27" y="130" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Jun</text><g class="bob"><g transform="translate(27 108) scale(0.55)"><ellipse cx="0" cy="0" rx="26" ry="13" fill="#7B879E" /><ellipse cx="-14" cy="4" rx="16" ry="10" fill="#7B879E" /><ellipse cx="16" cy="5" rx="18" ry="10" fill="#7B879E" /></g></g><rect x="48" y="90" width="34" height="70" rx="6" fill="#B8C4D6" stroke="#2B2F4A" stroke-width="2.5" /><text x="65" y="130" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Jul</text><g class="bob"><g transform="translate(65 108) scale(0.55)"><ellipse cx="0" cy="0" rx="26" ry="13" fill="#7B879E" /><ellipse cx="-14" cy="4" rx="16" ry="10" fill="#7B879E" /><ellipse cx="16" cy="5" rx="18" ry="10" fill="#7B879E" /></g></g><rect x="86" y="90" width="34" height="70" rx="6" fill="#B8C4D6" stroke="#2B2F4A" stroke-width="2.5" /><text x="103" y="130" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Aug</text><g class="bob"><g transform="translate(103 108) scale(0.55)"><ellipse cx="0" cy="0" rx="26" ry="13" fill="#7B879E" /><ellipse cx="-14" cy="4" rx="16" ry="10" fill="#7B879E" /><ellipse cx="16" cy="5" rx="18" ry="10" fill="#7B879E" /></g></g><rect x="124" y="90" width="34" height="70" rx="6" fill="#CFF0C5" stroke="#2B2F4A" stroke-width="2.5" /><text x="141" y="130" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Sep</text><circle cx="141" cy="108" r="6" fill="#FFD25E" stroke="#FF8A1F" stroke-width="2" /><rect x="162" y="90" width="34" height="70" rx="6" fill="#CFF0C5" stroke="#2B2F4A" stroke-width="2.5" /><text x="179" y="130" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Oct</text><circle cx="179" cy="108" r="6" fill="#FFD25E" stroke="#FF8A1F" stroke-width="2" /><rect x="200" y="90" width="34" height="70" rx="6" fill="#CFF0C5" stroke="#2B2F4A" stroke-width="2.5" /><text x="217" y="130" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Nov</text><circle cx="217" cy="108" r="6" fill="#FFD25E" stroke="#FF8A1F" stroke-width="2" /><rect x="238" y="90" width="34" height="70" rx="6" fill="#CFF0C5" stroke="#2B2F4A" stroke-width="2.5" /><text x="255" y="130" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Dec</text><circle cx="255" cy="108" r="6" fill="#FFD25E" stroke="#FF8A1F" stroke-width="2" /><rect x="276" y="90" width="34" height="70" rx="6" fill="#CFF0C5" stroke="#2B2F4A" stroke-width="2.5" /><text x="293" y="130" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Jan</text><circle cx="293" cy="108" r="6" fill="#FFD25E" stroke="#FF8A1F" stroke-width="2" /><rect x="314" y="90" width="34" height="70" rx="6" fill="#CFF0C5" stroke="#2B2F4A" stroke-width="2.5" /><text x="331" y="130" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Feb</text><circle cx="331" cy="108" r="6" fill="#FFD25E" stroke="#FF8A1F" stroke-width="2" /><rect x="352" y="90" width="34" height="70" rx="6" fill="#CFF0C5" stroke="#2B2F4A" stroke-width="2.5" /><text x="369" y="130" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Mar</text><circle cx="369" cy="108" r="6" fill="#FFD25E" stroke="#FF8A1F" stroke-width="2" /><path d="M120 170 v18 h274 v-18" fill="none" stroke="#3FA34D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="257" y="210" font-family="sans-serif" font-size="14" font-weight="700" fill="#2E7D3A" text-anchor="middle" >Season of joy</text><path d="M12 170 v18 h100 v-18" fill="none" stroke="#7B879E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="62" y="210" font-family="sans-serif" font-size="13" font-weight="700" fill="#55607A" text-anchor="middle" >Too wet</text></svg>