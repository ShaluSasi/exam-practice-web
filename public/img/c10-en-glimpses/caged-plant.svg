<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A plant in a pot indoors leaning towards a window through which a green forest can be seen</title><style>
.bob{animation:bob 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes bob{to{transform:translateY(-5px)}}
.sway{animation:sway 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.flick{animation:flick .45s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{to{transform:scale(1.18,.82)}}
.steam{animation:steam 2.4s ease-in infinite;transform-box:fill-box}
@keyframes steam{0%{transform:translateY(6px);opacity:0}30%{opacity:.85}100%{transform:translateY(-16px);opacity:0}}
.drift{animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(34px)}}
.fall{animation:fall 1.7s ease-in infinite}
@keyframes fall{0%{transform:translateY(-22px);opacity:0}25%{opacity:1}100%{transform:translateY(38px);opacity:0}}
.pulse{animation:pulse 1.3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes pulse{to{transform:scale(1.12)}}
.slide{animation:slide 4s ease-in-out infinite alternate}
@keyframes slide{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
.blink{animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.rip{animation:rip 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes rip{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.dive{animation:dive 2.2s ease-in infinite}
@keyframes dive{0%,20%{transform:translateY(-10px)}60%{transform:translateY(26px)}100%{transform:translateY(-10px)}}
.spin{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="240" rx="0" fill="#FFF2D8" /><rect x="0" y="190" width="400" height="50" rx="0" fill="#C9A66B" /><rect x="190" y="30" width="190" height="150" rx="6" fill="#CFE9FF" stroke="#2B2F4A" stroke-width="4" /><rect x="190" y="120" width="190" height="60" rx="0" fill="#7FB87A" /><g transform="translate(240 175) scale(0.5)"><rect x="-5" y="-40" width="10" height="40" rx="0" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="0" cy="-58" r="26" fill="#2E7D3A" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="-18" cy="-44" r="16" fill="#2E7D3A" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="18" cy="-44" r="16" fill="#2E7D3A" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="0" cy="-58" r="22" fill="#2E7D3A" /></g><g transform="translate(290 178) scale(0.6)"><rect x="-5" y="-40" width="10" height="40" rx="0" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="0" cy="-58" r="26" fill="#2E7D3A" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="-18" cy="-44" r="16" fill="#2E7D3A" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="18" cy="-44" r="16" fill="#2E7D3A" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="0" cy="-58" r="22" fill="#2E7D3A" /></g><g transform="translate(340 175) scale(0.5)"><rect x="-5" y="-40" width="10" height="40" rx="0" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="0" cy="-58" r="26" fill="#2E7D3A" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="-18" cy="-44" r="16" fill="#2E7D3A" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="18" cy="-44" r="16" fill="#2E7D3A" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="0" cy="-58" r="22" fill="#2E7D3A" /></g><rect x="190" y="30" width="190" height="150" rx="6" fill="none" stroke="#2B2F4A" stroke-width="4" /><line x1="285" y1="30" x2="285" y2="180" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M70 160 H130 L122 200 H78Z" fill="#C0583E" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><g class="sway"><path d="M100 160 Q90 120 110 100 M100 160 Q120 125 150 115 M100 160 Q96 130 80 110" fill="none" stroke="#3FA34D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><circle cx="112" cy="98" r="9" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" /><circle cx="152" cy="114" r="9" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" /><circle cx="78" cy="108" r="9" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" /></g></svg>