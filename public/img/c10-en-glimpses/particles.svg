<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Five verb cards each joined by a sliding particle card to make a new word</title><style>
.bob{animation:bob 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes bob{to{transform:translateY(-5px)}}
.sway{animation:sway 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.flick{animation:flick .45s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{to{transform:scale(1.18,.82)}}
.steam{animation:steam 2.4s ease-in infinite;transform-box:fill-box}
@keyframes steam{0%{transform:translateY(6px);opacity:0}30%{opacity:.85}100%{transform:translateY(-16px);opacity:0}}
.drift{animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(34px)}}
.fall{animation:fall 1.7s ease-in infinite}
@keyframes fall{0%{transform:translateY(-22px);opacity:0}25%{opacity:1}100%{transform:translateY(38px);opacity:0}}
.pulse{animation:pulse 1.3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes pulse{to{transform:scale(1.12)}}
.slide{animation:slide 4s ease-in-out infinite alternate}
@keyframes slide{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
.blink{animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.rip{animation:rip 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes rip{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.dive{animation:dive 2.2s ease-in infinite}
@keyframes dive{0%,20%{transform:translateY(-10px)}60%{transform:translateY(26px)}100%{transform:translateY(-10px)}}
.spin{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="240" rx="0" fill="#F2F0FF" /><rect x="40" y="20" width="100" height="32" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><text x="90" y="42" font-family="sans-serif" font-size="16" font-weight="700" fill="#2B2F4A" text-anchor="middle" >keep</text><g class="slide" transform="translate(150 20)" style="animation-duration:3s"><rect x="0" y="0" width="70" height="32" rx="8" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.5" /><text x="35" y="22" font-family="sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" >up</text></g><text x="300" y="42" font-family="sans-serif" font-size="16" font-weight="700" fill="#2E7D3A" text-anchor="start" >= keepup</text><rect x="40" y="62" width="100" height="32" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><text x="90" y="84" font-family="sans-serif" font-size="16" font-weight="700" fill="#2B2F4A" text-anchor="middle" >pour</text><g class="slide" transform="translate(150 62)" style="animation-duration:3s"><rect x="0" y="0" width="70" height="32" rx="8" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.5" /><text x="35" y="22" font-family="sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" >down</text></g><text x="300" y="84" font-family="sans-serif" font-size="16" font-weight="700" fill="#2E7D3A" text-anchor="start" >= pourdown</text><rect x="40" y="104" width="100" height="32" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><text x="90" y="126" font-family="sans-serif" font-size="16" font-weight="700" fill="#2B2F4A" text-anchor="middle" >go</text><g class="slide" transform="translate(150 104)" style="animation-duration:3s"><rect x="0" y="0" width="70" height="32" rx="8" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.5" /><text x="35" y="22" font-family="sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" >under</text></g><text x="300" y="126" font-family="sans-serif" font-size="16" font-weight="700" fill="#2E7D3A" text-anchor="start" >= gounder</text><rect x="40" y="146" width="100" height="32" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><text x="90" y="168" font-family="sans-serif" font-size="16" font-weight="700" fill="#2B2F4A" text-anchor="middle" >drop</text><g class="slide" transform="translate(150 146)" style="animation-duration:3s"><rect x="0" y="0" width="70" height="32" rx="8" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.5" /><text x="35" y="22" font-family="sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" >out</text></g><text x="300" y="168" font-family="sans-serif" font-size="16" font-weight="700" fill="#2E7D3A" text-anchor="start" >= dropout</text><rect x="40" y="188" width="100" height="32" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" /><text x="90" y="210" font-family="sans-serif" font-size="16" font-weight="700" fill="#2B2F4A" text-anchor="middle" >walk</text><g class="slide" transform="translate(150 188)" style="animation-duration:3s"><rect x="0" y="0" width="70" height="32" rx="8" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2.5" /><text x="35" y="22" font-family="sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle" >in</text></g><text x="300" y="210" font-family="sans-serif" font-size="16" font-weight="700" fill="#2E7D3A" text-anchor="start" >= walkin</text></svg>