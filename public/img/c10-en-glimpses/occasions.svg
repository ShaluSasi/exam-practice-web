<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Four occasions drawn as pictures: a wedding gift, a feast table, an engagement ring and a Christmas tree</title><style>
.bob{animation:bob 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes bob{to{transform:translateY(-5px)}}
.sway{animation:sway 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.flick{animation:flick .45s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{to{transform:scale(1.18,.82)}}
.steam{animation:steam 2.4s ease-in infinite;transform-box:fill-box}
@keyframes steam{0%{transform:translateY(6px);opacity:0}30%{opacity:.85}100%{transform:translateY(-16px);opacity:0}}
.drift{animation:drift 7s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(34px)}}
.fall{animation:fall 1.7s ease-in infinite}
@keyframes fall{0%{transform:translateY(-22px);opacity:0}25%{opacity:1}100%{transform:translateY(38px);opacity:0}}
.pulse{animation:pulse 1.3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes pulse{to{transform:scale(1.12)}}
.slide{animation:slide 4s ease-in-out infinite alternate}
@keyframes slide{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
.blink{animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.rip{animation:rip 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes rip{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.dive{animation:dive 2.2s ease-in infinite}
@keyframes dive{0%,20%{transform:translateY(-10px)}60%{transform:translateY(26px)}100%{transform:translateY(-10px)}}
.spin{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="240" rx="0" fill="#FFF2D8" /><rect x="10" y="20" width="90" height="200" rx="12" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><rect x="106" y="20" width="90" height="200" rx="12" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><rect x="202" y="20" width="90" height="200" rx="12" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><rect x="298" y="20" width="90" height="200" rx="12" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><rect x="30" y="120" width="50" height="40" rx="3" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" /><rect x="52" y="120" width="6" height="40" rx="0" fill="#FFD25E" /><rect x="30" y="108" width="50" height="14" rx="3" fill="#FF6A6F" stroke="#2B2F4A" stroke-width="3" /><path d="M55 108 q-14 -20 -4 -22 q8 0 4 22 q14 -20 4 -22 q-8 0 -4 22" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="112" y="150" width="68" height="8" rx="3" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2.5" /><line x1="122" y1="158" x2="122" y2="190" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="170" y1="158" x2="170" y2="190" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><ellipse cx="130" cy="142" rx="12" ry="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" /><g transform="translate(155 140) scale(0.8)"><ellipse cx="0" cy="0" rx="24" ry="11" fill="#D9923B" stroke="#2B2F4A" stroke-width="2.5" /><line x1="-10" y1="-6" x2="-6" y2="4" stroke="#9a5f1d" stroke-width="2" stroke-linecap="round" /><line x1="0" y1="-8" x2="3" y2="6" stroke="#9a5f1d" stroke-width="2" stroke-linecap="round" /><line x1="10" y1="-6" x2="12" y2="4" stroke="#9a5f1d" stroke-width="2" stroke-linecap="round" /></g><path d="M118 80 L168 80 L160 100 L126 100Z" fill="#FFD25E" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M122 80 l-6 -16 M164 80 l8 -16 M143 80 l0 -20" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="240" cy="140" r="22" fill="none" stroke="#FFD25E" stroke-width="8" /><circle cx="240" cy="140" r="22" fill="none" stroke="#2B2F4A" stroke-width="1.5" /><path d="M240 112 L230 98 L240 90 L250 98 Z" fill="#CFE9FF" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="342" y="168" width="12" height="24" rx="0" fill="#8B5A2B" stroke="#2B2F4A" stroke-width="2.5" /><path d="M348 90 L318 130 H378 Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M348 116 L312 160 H384 Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M348 144 L306 190 H390 Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><g class="pulse"><path d="M348 78 l4 8 h9 l-7 6 3 9 -9 -5 -9 5 3 -9 -7 -6 h9z" fill="#FFD25E" stroke="#2B2F4A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></g><circle cx="332" cy="150" r="4" fill="#E5484D" /><circle cx="364" cy="160" r="4" fill="#0B93D4" /><circle cx="350" cy="128" r="4" fill="#FF8A1F" /></svg>