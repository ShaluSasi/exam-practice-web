<path d="M43 31 V55 M76 31 V55" stroke="#4E8F2A" stroke-width="2"/>
<path d="M16 36 L24 50 L32 36 L40 50 M46 36 L54 50 L62 36 L70 50 M79 36 L87 50 L95 36 L103 50" fill="none" stroke="#3FA34D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
