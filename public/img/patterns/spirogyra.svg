<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img">
<title>Green threads made of cells with spiral ribbons inside</title>
<style>
.a{animation:a 4s ease-in-out infinite}.c{animation:a 4s ease-in-out infinite;animation-delay:-2s}
@keyframes a{0%,100%{transform:translateY(-3px)}50%{transform:translateY(3px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
