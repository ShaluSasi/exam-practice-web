<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img">
<title>Oval single cells, one forming a small bud</title>
<style>
.bd{transform-box:fill-box;transform-origin:0% 100%;animation:bd 4s ease-in-out infinite}
.b2{transform-box:fill-box;transform-origin:100% 0%;animation:bd 4s ease-in-out infinite;animation-delay:-2s}
@keyframes bd{0%{transform:scale(.3)}70%,100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="6" y="6" width="108" height="108" rx="12" fill="#F8F1E2"/>
<g stroke="#B9934A" stroke-width="2.5">
<ellipse class="bd" cx="82" cy="34" rx="12" ry="10" fill="#F6E7C1"/>
<ellipse cx="54" cy="56" rx="26" ry="21" fill="#F6E7C1"/>
<ellipse class="b2" cx="28" cy="96" rx="8" ry="7" fill="#F6E7C1"/>
<ellipse cx="46" cy="94" rx="14" ry="11" fill="#F6E7C1"/>
<ellipse cx="94" cy="86" rx="16" ry="13" fill="#F6E7C1"/>
</g>
<circle cx="50" cy="58" r="6" fill="#D9C3F5" stroke="#7B4BC0" stroke-width="1.8"/>
<ellipse cx="64" cy="50" rx="8" ry="6" fill="#E3F2FF" stroke="#4A90C8" stroke-width="1.5"/>
<circle cx="94" cy="86" r="4" fill="#D9C3F5" stroke="#7B4BC0" stroke-width="1.5"/>
<circle cx="46" cy="94" r="3.5" fill="#D9C3F5" stroke="#7B4BC0" stroke-width="1.5"/>
<g fill="#E2C98F"><circle cx="40" cy="48" r="2"/><circle cx="62" cy="66" r="2"/><circle cx="100" cy="80" r="1.6"/></g>
</svg>
