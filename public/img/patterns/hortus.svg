<path d="M50 146 l-6 6 M58 146 v8 M66 146 l6 6" stroke="#A9774F" stroke-width="2" stroke-linecap="round"/>
<g class="q"><path d="M150 40 C162 22 180 14 188 14 C184 24 172 40 156 48 Z" fill="#fff" stroke="#6E6E80" stroke-width="2" stroke-linejoin="round"/><path d="M156 48 L146 60" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/></g>
