<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img">
<title>An old open book with a hand-drawn medicinal plant and notes</title>
<style>
.pg{transform-box:view-box;transform-origin:100px 150px;animation:pg 5s ease-in-out infinite}
.q{transform-box:fill-box;transform-origin:0% 100%;animation:q 2s ease-in-out infinite}
@keyframes pg{0%,70%,100%{transform:skewY(0)}85%{transform:skewY(-3deg)}}
@keyframes q{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
