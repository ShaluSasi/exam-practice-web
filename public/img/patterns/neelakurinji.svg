<path d="M60 106 V70 M60 90 L40 66 M60 84 L82 60 M60 76 L56 50 M48 76 L30 74 M72 74 L92 78" fill="none" stroke="#5C7A3A" stroke-width="3" stroke-linecap="round"/>
<g fill="#6CC04A" stroke="#3F8A2A" stroke-width="1.5"><ellipse cx="44" cy="84" rx="7" ry="3.5" transform="rotate(-30 44 84)"/><ellipse cx="76" cy="84" rx="7" ry="3.5" transform="rotate(30 76 84)"/><ellipse cx="66" cy="70" rx="6" ry="3" transform="rotate(30 66 70)"/></g>
