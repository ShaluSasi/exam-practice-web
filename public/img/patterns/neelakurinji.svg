<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img">
<title>A shrub covered with clusters of blue-violet flowers on a hill slope</title>
<defs><g id="cl"><circle cx="0" cy="0" r="5" fill="#8A8FEA" stroke="#4F52B8" stroke-width="1.5"/><circle cx="7" cy="3" r="4.5" fill="#7C83E8" stroke="#4F52B8" stroke-width="1.5"/><circle cx="-6" cy="4" r="4.5" fill="#9AA0F0" stroke="#4F52B8" stroke-width="1.5"/><circle cx="1" cy="8" r="4.5" fill="#7C83E8" stroke="#4F52B8" stroke-width="1.5"/></g></defs>
<style>
.sw{transform-box:view-box;transform-origin:60px 104px;animation:sw 4s ease-in-out infinite}
.bee{animation:bee 4s ease-in-out infinite}
