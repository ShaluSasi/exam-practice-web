<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img">
<title>A small, slender, fish-like sea animal swimming over sand</title>
<style>
.sw{animation:sw 3s ease-in-out infinite}
.wv{transform-box:fill-box;transform-origin:center;animation:wv 1s ease-in-out infinite}
@keyframes sw{0%,100%{transform:translate(-5px,2px)}50%{transform:translate(5px,-2px)}}
@keyframes wv{0%,100%{transform:skewY(2deg)}50%{transform:skewY(-2deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
