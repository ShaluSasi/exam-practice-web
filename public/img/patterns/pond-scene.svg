<title>A pond and forest edge with many living things</title>
<style>
.cl{animation:cl 14s linear infinite}
.rp{transform-box:fill-box;transform-origin:center;animation:rp 3s ease-out infinite}.rp2{animation-delay:-1.5s}
.sp{animation:sp 3s ease-in infinite}.s1{animation-delay:-1s}.s2{animation-delay:-2s}
.sun{transform-box:fill-box;transform-origin:center;animation:sun 4s ease-in-out infinite}
@keyframes cl{0%{transform:translateX(0)}50%{transform:translateX(40px)}100%{transform:translateX(0)}}
@keyframes rp{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.4);opacity:0}}
@keyframes sp{0%{transform:translate(0,0);opacity:0}20%{opacity:1}100%{transform:translate(8px,16px);opacity:0}}
@keyframes sun{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
