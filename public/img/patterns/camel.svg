<path class="tl" d="M24 56 Q18 66 20 76" fill="none" stroke="#A9773C" stroke-width="3" stroke-linecap="round"/>
<g fill="#E3B778" stroke="#A9773C" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
<path d="M32 88 L30 104 M42 88 L42 104 M70 88 L70 104 M80 88 L82 104" fill="none" stroke-width="5"/>
<path d="M22 58 C22 46 32 44 38 44 C42 26 62 26 66 44 C72 46 78 48 82 52 L88 34 C90 28 100 26 104 32 L108 38 L100 42 L94 42 L90 60 C88 70 84 80 76 88 H30 C24 84 22 70 22 58 Z"/>
</g>
