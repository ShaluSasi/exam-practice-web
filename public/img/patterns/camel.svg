<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img">
<title>A one-humped camel in the desert</title>
<style>
.h{animation:h 2.5s ease-in-out infinite}.h2{animation-delay:-1.2s}
.tl{transform-box:view-box;transform-origin:24px 56px;animation:tl 2s ease-in-out infinite}
@keyframes h{0%,100%{transform:translateY(0);opacity:.2}50%{transform:translateY(-6px);opacity:.8}}
@keyframes tl{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
