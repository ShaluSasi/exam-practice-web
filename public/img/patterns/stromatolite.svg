<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" role="img">
<title>Layered rock mounds in shallow sunlit water, one cut open to show its layers</title>
<style>
.bu{animation:bu 3s ease-in infinite}.d1{animation-delay:-1s}.d2{animation-delay:-2s}
.ry{animation:ry 4s ease-in-out infinite}
