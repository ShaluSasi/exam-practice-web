<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img">
<title>A spindle-shaped single-celled organism with a whip-like thread, as seen under a microscope</title>
<style>
.fl{transform-box:view-box;transform-origin:50px 98px;animation:fl 1s ease-in-out infinite}
.ch{animation:ch 3s ease-in-out infinite}
@keyframes fl{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
@keyframes ch{0%,100%{opacity:1}50%{opacity:.75}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="6" y="6" width="188" height="188" rx="14" fill="#E3F2FF"/>
<path class="fl" d="M50 98 C42 84 34 106 26 92 S16 76 12 80" fill="none" stroke="#4E8F2A" stroke-width="3" stroke-linecap="round"/>
<path d="M48 100 C56 80 106 72 146 86 C160 92 170 98 182 104 C170 110 160 114 146 118 C106 130 56 120 48 100 Z" fill="#DDF3CF" stroke="#4E8F2A" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M66 92 C88 82 120 82 150 92" fill="none" stroke="#F0FAE8" stroke-width="5" stroke-linecap="round"/>
<g class="ch" fill="#6CC04A" stroke="#3F8A2A" stroke-width="1.6">
<ellipse cx="96" cy="88" rx="9" ry="5" transform="rotate(-10 96 88)"/>
<ellipse cx="84" cy="110" rx="8" ry="4.5" transform="rotate(12 84 110)"/>
<ellipse cx="112" cy="116" rx="8" ry="4.5" transform="rotate(-8 112 116)"/>
<ellipse cx="150" cy="94" rx="8" ry="4.5" transform="rotate(15 150 94)"/>
<ellipse cx="156" cy="110" rx="7" ry="4" transform="rotate(-12 156 110)"/>
<ellipse cx="112" cy="92" rx="6" ry="3.6" transform="rotate(20 112 92)"/>
<ellipse cx="102" cy="104" rx="6" ry="3.6" transform="rotate(-20 102 104)"/>
</g>
<circle cx="130" cy="104" r="11" fill="#B98BE8" stroke="#7B4BC0" stroke-width="2"/>
<circle cx="128" cy="102" r="3" fill="#7B4BC0"/>
<circle cx="66" cy="95" r="6" fill="#F4FAFF" stroke="#4A90C8" stroke-width="2"/>
<circle cx="61" cy="106" r="3.5" fill="#E04848"/>
</svg>
