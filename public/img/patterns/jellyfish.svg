<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img">
<title>A jellyfish swimming</title>
<style>
.bob{animation:b 2.4s ease-in-out infinite}
.bell{transform-box:fill-box;transform-origin:50% 100%;animation:p 2.4s ease-in-out infinite}
.t{transform-box:fill-box;transform-origin:50% 0%;animation:t 2.4s ease-in-out infinite}
@keyframes b{0%,100%{transform:translateY(5px)}50%{transform:translateY(-5px)}}
@keyframes p{0%,100%{transform:scale(1,1)}50%{transform:scale(.86,1.08)}}
@keyframes t{0%,100%{transform:skewX(6deg)}50%{transform:skewX(-6deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="6" y="6" width="108" height="108" rx="12" fill="#E3F2FF"/>
<g class="bob">
<g class="t" fill="none" stroke="#D9578F" stroke-width="2.5" stroke-linecap="round">
<path d="M40 60 q-5 10 0 20 t0 22"/><path d="M52 62 q5 10 0 20 t0 18"/><path d="M68 62 q-5 10 0 20 t0 18"/><path d="M80 60 q5 10 0 20 t0 22"/>
<path d="M57 60 q-3 14 3 26 q4 8 -2 14" stroke="#E58AB4" stroke-width="5"/><path d="M63 60 q3 14 -3 26" stroke="#E58AB4" stroke-width="5"/>
</g>
<g class="bell">
<path d="M30 62 C30 36 44 22 60 22 C76 22 90 36 90 62 Q83 57 75 62 Q67 57 60 62 Q53 57 45 62 Q37 57 30 62 Z" fill="#F7B6D2" stroke="#D9578F" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M42 50 C44 38 52 32 60 32 C68 32 76 38 78 50" fill="none" stroke="#FBD5E6" stroke-width="5" stroke-linecap="round"/>
<g fill="#E58AB4"><circle cx="50" cy="48" r="3"/><circle cx="60" cy="45" r="3"/><circle cx="70" cy="48" r="3"/></g>
</g>
</g>
</svg>
