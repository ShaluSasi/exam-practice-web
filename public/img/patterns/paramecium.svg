<path d="M150 87 V82 M150 109 V114 M139 98 H134 M161 98 H166 M142 90 L138 86 M158 106 L162 110 M158 90 L162 86 M142 106 L138 110" stroke="#4A90C8" stroke-width="2" stroke-linecap="round"/></g>
<ellipse cx="112" cy="96" rx="17" ry="11" fill="#B98BE8" stroke="#7B4BC0" stroke-width="2"/>
<circle cx="130" cy="86" r="4" fill="#7B4BC0"/>
