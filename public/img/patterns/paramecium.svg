<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img">
<title>A slipper-shaped single-celled organism as seen under a microscope</title>
<style>
.ci{animation:ci 1.1s linear infinite}
.cv{transform-box:fill-box;transform-origin:center;animation:cv 2.4s ease-in-out infinite}
.cv2{animation-delay:-1.2s}
@keyframes ci{to{stroke-dashoffset:-12}}
@keyframes cv{0%,100%{transform:scale(1)}50%{transform:scale(.55)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
