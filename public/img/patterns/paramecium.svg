<path d="M44 92 C56 76 90 70 120 72" fill="none" stroke="#F4EEFD" stroke-width="6" stroke-linecap="round"/>
<path d="M70 126 Q88 112 104 112" fill="none" stroke="#9A6ED6" stroke-width="6" stroke-linecap="round"/>
<circle cx="105" cy="112" r="4" fill="#9A6ED6"/>
