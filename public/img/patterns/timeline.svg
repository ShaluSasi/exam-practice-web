<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" role="img">
<title>A timeline of scientists who proposed classification systems</title>
<style>
.mv{animation:mv 6s ease-in-out infinite}
.pl{transform-box:fill-box;transform-origin:center;animation:pl 2s ease-in-out infinite}
@keyframes mv{0%{transform:translateX(0)}100%{transform:translateX(320px)}}
@keyframes pl{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M24 96 H372" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round"/>
<path d="M366 88 L380 96 L366 104 Z" fill="#2B2F4A"/>
<g stroke="#2B2F4A" stroke-width="2.5">
<circle class="pl" cx="40" cy="96" r="9" fill="#F7C6E0"/><circle class="pl" cx="120" cy="96" r="9" fill="#FFD45C" style="animation-delay:-.4s"/><circle class="pl" cx="200" cy="96" r="9" fill="#9EDCCB" style="animation-delay:-.8s"/><circle class="pl" cx="280" cy="96" r="9" fill="#D9C3F5" style="animation-delay:-1.2s"/><circle class="pl" cx="360" cy="96" r="9" fill="#FFB547" style="animation-delay:-1.6s"/>
</g>
<circle class="mv" cx="40" cy="96" r="4" fill="#2B2F4A"/>
<g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" text-anchor="middle">
<g font-size="15"><text x="40" y="72">4th c. BCE</text><text x="120" y="72">1758</text><text x="200" y="72">1866</text><text x="280" y="72">1938</text><text x="360" y="72">1969</text></g>
<g font-size="13"><text x="40" y="128">Aristotle</text><text x="120" y="128">Linnaeus</text><text x="200" y="128">Haeckel</text><text x="280" y="128">Copeland</text><text x="360" y="128">Whittaker</text></g>
</g>
<g fill="#F3E3C0" stroke="#A9774F" stroke-width="2"><path d="M30 30 h20 v22 h-20 z"/><path d="M110 30 h20 v22 h-20 z"/><path d="M190 30 h20 v22 h-20 z"/><path d="M270 30 h20 v22 h-20 z"/><path d="M350 30 h20 v22 h-20 z"/></g>
<g stroke="#A9774F" stroke-width="1.5"><path d="M34 37 h12 M34 42 h12 M34 47 h8 M114 37 h12 M114 42 h12 M114 47 h8 M194 37 h12 M194 42 h12 M194 47 h8 M274 37 h12 M274 42 h12 M274 47 h8 M354 37 h12 M354 42 h12 M354 47 h8"/></g>
<path d="M40 150 H360" stroke="#2B2F4A" stroke-opacity=".15" stroke-width="2" stroke-dasharray="4 6"/>
</svg>
