<g fill="#D9822B" stroke="#8A5A2B" stroke-width="2.5" stroke-linejoin="round"><path d="M20 122 L41 102 L62 122 Z"/><path d="M65 126 L83 108 L101 126 Z"/></g>
<g fill="#5B4636"><rect x="36" y="132" width="10" height="14"/><rect x="78" y="134" width="8" height="12"/></g>
<g class="tr">
<g fill="none" stroke="#6E4520" stroke-width="3" stroke-linecap="round">
