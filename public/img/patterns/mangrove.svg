<path d="M196 104 V124 M196 124 Q182 134 178 156 M196 124 Q192 138 192 156 M196 124 Q202 138 204 156 M196 124 Q210 134 214 156"/>
<path d="M240 112 V128 M240 128 Q228 136 224 156 M240 128 Q236 140 236 156 M240 128 Q246 140 248 156 M240 128 Q254 136 258 156"/>
</g>
