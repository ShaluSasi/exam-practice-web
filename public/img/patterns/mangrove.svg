<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img">
<title>Storm waves from the sea hitting a belt of coastal trees with stilt roots in front of a village</title>
<style>
.wv{animation:wv 2.4s ease-in infinite}.w2{animation-delay:-1.2s}
.cy{transform-box:fill-box;transform-origin:center;animation:cy 3s linear infinite}
.wd{animation:wd 1.5s linear infinite}
.tr{transform-box:fill-box;transform-origin:50% 100%;animation:tr 1.2s ease-in-out infinite}
@keyframes wv{0%{transform:translateX(0);opacity:0}15%{opacity:1}80%{opacity:1}100%{transform:translateX(-110px);opacity:0}}
@keyframes cy{to{transform:rotate(-360deg)}}
@keyframes wd{0%{transform:translateX(30px);opacity:0}30%{opacity:1}100%{transform:translateX(-60px);opacity:0}}
@keyframes tr{0%,100%{transform:skewX(0)}50%{transform:skewX(4deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="6" y="6" width="388" height="188" rx="12" fill="#D6DEE8"/>
