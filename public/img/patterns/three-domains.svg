<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" role="img">
<title>A tree of life that splits into three large branches, each ending in a different kind of cell</title>
<style>
.p{transform-box:fill-box;transform-origin:center;animation:p 3s ease-in-out infinite}.d1{animation-delay:-1s}.d2{animation-delay:-2s}
.fl{animation:fl 3s linear infinite}
@keyframes p{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes fl{to{stroke-dashoffset:-20}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M150 210 V150 M150 150 L64 88 M150 150 L150 82 M150 150 L236 88" fill="none" stroke="#A9774F" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<path class="fl" d="M150 206 V150 L64 92 M150 150 L150 86 M150 150 L236 92" fill="none" stroke="#F3E3C0" stroke-width="3" stroke-dasharray="4 6" stroke-linecap="round"/>
<g class="p"><circle cx="60" cy="66" r="40" fill="#DFF3EC" stroke="#2E8B7A" stroke-width="3"/>
<rect x="38" y="56" width="40" height="20" rx="10" fill="#9EDCCB" stroke="#2E8B7A" stroke-width="2.2"/><path d="M78 66 q6 -6 10 0 t8 0" fill="none" stroke="#2E8B7A" stroke-width="2" stroke-linecap="round"/><path d="M48 66 q4 -5 8 0 t8 0" fill="none" stroke="#E04848" stroke-width="1.8"/></g>
<g class="p d1"><circle cx="150" cy="48" r="40" fill="#FDE6D0" stroke="#D9822B" stroke-width="3"/>
<path d="M130 50 C128 36 144 32 152 38 C160 30 174 38 170 50 C176 58 166 66 156 62 C148 70 132 66 134 58 C126 56 126 52 130 50 Z" fill="#FFC48A" stroke="#D9822B" stroke-width="2.2"/><path d="M140 50 q4 -5 8 0 t8 0" fill="none" stroke="#E04848" stroke-width="1.8"/>
<g fill="none" stroke="#D9822B" stroke-width="1.5"><circle cx="128" cy="30" r="3"/><circle cx="170" cy="70" r="2.5"/></g></g>
<g class="p d2"><circle cx="240" cy="66" r="40" fill="#EDE3FB" stroke="#7B4BC0" stroke-width="3"/>
<path d="M216 66 C216 50 230 44 242 46 C256 48 266 56 264 70 C262 84 248 88 236 86 C224 84 216 78 216 66 Z" fill="#D9C3F5" stroke="#7B4BC0" stroke-width="2.2"/><circle cx="240" cy="66" r="9" fill="#B98BE8" stroke="#7B4BC0" stroke-width="2"/><ellipse cx="254" cy="58" rx="5" ry="2.6" fill="#F6D58E" stroke="#C99A3A" stroke-width="1.2"/><ellipse cx="226" cy="76" rx="5" ry="2.6" fill="#F6D58E" stroke="#C99A3A" stroke-width="1.2"/></g>
</svg>
