<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img">
<title>A plant whose leaf tip forms a hanging pitcher with a lid, with an insect flying near it</title>
<style>
.fly{animation:fly 3s ease-in-out infinite}
.sw{transform-box:view-box;transform-origin:30px 30px;animation:sw 4s ease-in-out infinite}
@keyframes fly{0%,100%{transform:translate(0,0)}25%{transform:translate(-8px,6px)}50%{transform:translate(-2px,12px)}75%{transform:translate(6px,4px)}}
@keyframes sw{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="6" y="6" width="108" height="108" rx="12" fill="#E9F5E1"/>
<g class="sw">
<path d="M8 22 C24 18 40 22 44 32 C36 36 20 34 8 30 Z" fill="#7CCB5B" stroke="#3F8A2A" stroke-width="2.2" stroke-linejoin="round"/>
<path d="M44 32 C56 34 60 44 58 52" fill="none" stroke="#3F8A2A" stroke-width="2.5" stroke-linecap="round"/>
<path d="M58 52 C48 56 46 74 50 92 C52 104 76 106 80 94 C84 78 80 60 72 52 Z" fill="#B8D96A" stroke="#6E8F2A" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M54 70 C56 82 58 94 66 100" fill="none" stroke="#C0504A" stroke-width="3" stroke-linecap="round" opacity=".7"/>
<path d="M64 60 C66 74 70 86 74 96" fill="none" stroke="#C0504A" stroke-width="2.5" stroke-linecap="round" opacity=".6"/>
<ellipse cx="65" cy="52" rx="10" ry="4" fill="#C0504A" stroke="#8A2F2A" stroke-width="2"/>
<path d="M72 50 C80 40 92 40 94 46 C88 50 80 52 72 50 Z" fill="#C0504A" stroke="#8A2F2A" stroke-width="2" stroke-linejoin="round"/>
</g>
<g class="fly"><ellipse cx="96" cy="70" rx="4" ry="3" fill="#2B2F4A"/><ellipse cx="94" cy="65" rx="3.5" ry="2" fill="#CDE9FF" stroke="#4A90C8" stroke-width="1"/><ellipse cx="99" cy="65" rx="3.5" ry="2" fill="#CDE9FF" stroke="#4A90C8" stroke-width="1"/></g>
</svg>
