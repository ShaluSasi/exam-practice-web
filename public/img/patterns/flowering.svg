<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img">
<title>A climbing plant with flowers and pods</title>
<style>
.sw{transform-box:view-box;transform-origin:56px 112px;animation:sw 4s ease-in-out infinite}
.fl{transform-box:fill-box;transform-origin:center;animation:fl 2s ease-in-out infinite}
@keyframes sw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes fl{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
