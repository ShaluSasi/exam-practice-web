<path d="M56 104 C50 84 62 66 54 46 C50 34 58 22 62 14" fill="none" stroke="#4E8F2A" stroke-width="3.5" stroke-linecap="round"/>
<g fill="#8FD16A" stroke="#3F8A2A" stroke-width="2">
<ellipse cx="40" cy="84" rx="10" ry="6" transform="rotate(-20 40 84)"/><ellipse cx="70" cy="76" rx="10" ry="6" transform="rotate(20 70 76)"/>
<ellipse cx="40" cy="58" rx="9" ry="5.5" transform="rotate(-25 40 58)"/><ellipse cx="68" cy="50" rx="9" ry="5.5" transform="rotate(25 68 50)"/>
</g>
