<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img">
<title>A flat, leaf-shaped worm gliding</title>
<style>
.g{animation:g 4s ease-in-out infinite}
.w{transform-box:fill-box;transform-origin:center;animation:w 2s ease-in-out infinite}
