<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" role="img">
<title>Cow dung slurry in an underground tank producing gas that lights a stove</title>
<style>
.bu{animation:bu 2.6s ease-in infinite}.d1{animation-delay:-.9s}.d2{animation-delay:-1.7s}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .5s ease-in-out infinite alternate}
.gs{animation:gs 1.2s linear infinite}
@keyframes bu{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-30px);opacity:0}}
@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.85,1.2)}}
@keyframes gs{to{stroke-dashoffset:-14}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
