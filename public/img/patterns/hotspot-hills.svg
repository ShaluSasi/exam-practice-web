<g fill="#5DA33E"><circle cx="70" cy="140" r="14"/><circle cx="92" cy="134" r="12"/><circle cx="270" cy="128" r="14"/><circle cx="300" cy="136" r="12"/><circle cx="350" cy="140" r="13"/><circle cx="130" cy="146" r="12"/></g>
<path d="M206 78 C204 110 210 140 206 176" fill="none" stroke="#CDE9FF" stroke-width="12" stroke-linecap="round"/>
<path class="wf" d="M206 78 C204 110 210 140 206 176" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="8 8" stroke-linecap="round"/>
<ellipse cx="206" cy="180" rx="22" ry="6" fill="#CDE9FF" stroke="#4A90C8" stroke-width="2"/>
<g fill="#fff"><ellipse class="ms" cx="100" cy="118" rx="70" ry="8"/><ellipse class="ms ms2" cx="300" cy="110" rx="80" ry="8"/></g>
