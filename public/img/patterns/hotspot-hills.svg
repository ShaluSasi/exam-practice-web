<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
<title>Misty forested hills with a waterfall and a stream</title>
<style>
.ms{animation:ms 9s ease-in-out infinite}.ms2{animation-delay:-4.5s}
.wf{animation:wf .8s linear infinite}
.bd{animation:bd 7s ease-in-out infinite}
@keyframes ms{0%,100%{transform:translateX(-20px);opacity:.5}50%{transform:translateX(20px);opacity:.85}}
@keyframes wf{to{stroke-dashoffset:-16}}
@keyframes bd{0%{transform:translate(0,0)}50%{transform:translate(-60px,-10px)}100%{transform:translate(0,0)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
