<path d="M6 150 Q90 96 170 140 Q250 100 320 136 Q360 120 394 132 V202 Q394 214 382 214 H18 Q6 214 6 202 Z" fill="#6FB552"/>
<path d="M6 186 Q100 160 200 180 Q300 196 394 176 V202 Q394 214 382 214 H18 Q6 214 6 202 Z" fill="#4E8F2A"/>
