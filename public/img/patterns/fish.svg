<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img">
<title>A fish swimming</title>
<style>
.tail{transform-box:view-box;transform-origin:32px 60px;animation:t .9s ease-in-out infinite}
.sw{animation:s 3s ease-in-out infinite}
.b{animation:b 3s ease-in infinite}.b2{animation-delay:-1.5s}
@keyframes t{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes s{0%,100%{transform:translateY(-3px)}50%{transform:translateY(3px)}}
@keyframes b{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-30px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="6" y="6" width="108" height="108" rx="12" fill="#E3F2FF"/>
<g fill="none" stroke="#4A90C8" stroke-width="1.8"><circle class="b" cx="100" cy="48" r="3"/><circle class="b b2" cx="96" cy="40" r="2.2"/></g>
<g class="sw">
<path class="tail" d="M34 60 L12 44 Q16 60 12 76 Z" fill="#FFB547" stroke="#D9822B" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M48 44 Q58 28 72 40" fill="#FFCF7A" stroke="#D9822B" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M30 60 C42 38 78 36 96 60 C78 84 42 82 30 60 Z" fill="#FFB547" stroke="#D9822B" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M54 74 Q60 86 68 76" fill="#FFCF7A" stroke="#D9822B" stroke-width="2" stroke-linejoin="round"/>
<path d="M76 48 Q70 60 76 72" fill="none" stroke="#D9822B" stroke-width="2.5" stroke-linecap="round"/>
<path d="M44 56 q4 -4 8 0 q4 -4 8 0 M48 64 q4 -4 8 0 q4 -4 8 0" fill="none" stroke="#F08A2B" stroke-width="1.8" stroke-linecap="round"/>
<circle cx="84" cy="56" r="4.5" fill="#fff" stroke="#2B2F4A" stroke-width="1.5"/><circle cx="85" cy="56" r="2.2" fill="#2B2F4A"/>
</g>
</svg>
