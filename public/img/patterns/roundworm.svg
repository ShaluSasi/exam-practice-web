<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img">
<title>A long, thin, cylindrical worm wriggling</title>
<style>
.wr{transform-box:fill-box;transform-origin:center;animation:wr 1.8s ease-in-out infinite}
@keyframes wr{0%,100%{transform:rotate(-5deg) scaleY(1)}50%{transform:rotate(5deg) scaleY(.85)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="6" y="6" width="108" height="108" rx="12" fill="#F4E6CC"/>
<g fill="#E2CBA2"><circle cx="24" cy="24" r="3"/><circle cx="96" cy="30" r="4"/><circle cx="88" cy="96" r="3"/><circle cx="20" cy="94" r="4"/><circle cx="56" cy="100" r="2.5"/></g>
<g class="wr" fill="none" stroke-linecap="round">
<path d="M16 78 C32 46 50 94 68 62 S94 40 106 54" stroke="#C8737A" stroke-width="10"/>
<path d="M16 78 C32 46 50 94 68 62 S94 40 106 54" stroke="#F2B9BC" stroke-width="6"/>
<path d="M20 72 C32 52 46 86 64 64" stroke="#FCE1E2" stroke-width="2"/>
</g>
</svg>
