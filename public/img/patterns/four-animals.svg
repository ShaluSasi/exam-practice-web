@keyframes b{0%,100%{transform:translateY(3px)}50%{transform:translateY(-3px)}}
@keyframes u{0%{transform:translateY(4px);opacity:0}25%{opacity:1}100%{transform:translateY(-12px);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
