<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img">
<title>A bead-like chain of tiny blue-green cells giving off bubbles</title>
<style>
.b{animation:b 3s ease-in infinite}.d1{animation-delay:-1s}.d2{animation-delay:-2s}
.sw{animation:sw 4s ease-in-out infinite}
@keyframes b{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
@keyframes sw{0%,100%{transform:translateY(-2px)}50%{transform:translateY(2px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="6" y="6" width="108" height="108" rx="12" fill="#E3F2FF"/>
<g fill="#fff" stroke="#4A90C8" stroke-width="1.6"><circle class="b" cx="44" cy="54" r="3"/><circle class="b d1" cx="70" cy="48" r="2.5"/><circle class="b d2" cx="94" cy="40" r="3"/><circle class="b d1" cx="30" cy="62" r="2.2"/></g>
<g class="sw" fill="#6FC7B5" stroke="#2E8B7A" stroke-width="2">
<circle cx="14" cy="86" r="7"/><circle cx="27" cy="82" r="7"/><circle cx="40" cy="77" r="7"/><circle cx="53" cy="72" r="9" fill="#BFEAE0"/><circle cx="67" cy="68" r="7"/><circle cx="80" cy="64" r="7"/><circle cx="92" cy="58" r="7"/><circle cx="104" cy="50" r="7"/>
<circle cx="30" cy="104" r="5.5"/><circle cx="41" cy="102" r="5.5"/><circle cx="52" cy="100" r="5.5"/><circle cx="63" cy="99" r="5.5"/><circle cx="74" cy="99" r="5.5"/><circle cx="85" cy="100" r="5.5"/>
</g>
</svg>
