<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img">
<title>A plump purple frog with a pointed snout on wet soil in the rain</title>
<style>
.r{animation:r 1.6s linear infinite}.d1{animation-delay:-.5s}.d2{animation-delay:-1.1s}
.br{transform-box:fill-box;transform-origin:50% 100%;animation:br 2.4s ease-in-out infinite}
@keyframes r{0%{transform:translate(0,-10px);opacity:0}20%{opacity:1}100%{transform:translate(-6px,40px);opacity:0}}
@keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.04,.97)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="6" y="6" width="108" height="108" rx="12" fill="#E2ECF2"/>
<rect x="6" y="82" width="108" height="32" rx="12" fill="#8C6A4A"/><rect x="6" y="82" width="108" height="14" fill="#8C6A4A"/>
<g fill="#6E5236"><ellipse cx="22" cy="100" rx="6" ry="2"/><ellipse cx="94" cy="104" rx="8" ry="2.4"/></g>
<g stroke="#4A90C8" stroke-width="2" stroke-linecap="round"><path class="r" d="M24 14 l-2 6"/><path class="r d1" d="M60 10 l-2 6"/><path class="r d2" d="M96 16 l-2 6"/><path class="r d1" d="M84 30 l-2 6"/><path class="r d2" d="M36 28 l-2 6"/></g>
<g class="br">
<path d="M40 82 l-8 6 M46 84 l-4 6 M82 84 l6 6 M86 82 l10 4" stroke="#5E3F8A" stroke-width="3" stroke-linecap="round"/>
<path d="M20 70 C16 64 22 58 30 58 C38 44 62 40 80 46 C96 52 102 66 96 78 C90 88 60 88 44 84 C34 82 26 78 20 70 Z" fill="#9C7BC6" stroke="#5E3F8A" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M44 54 C56 48 72 48 84 54" fill="none" stroke="#B9A0DC" stroke-width="4" stroke-linecap="round"/>
<circle cx="32" cy="62" r="2.4" fill="#2B2F4A"/>
<path d="M20 70 Q26 72 32 70" fill="none" stroke="#5E3F8A" stroke-width="1.8" stroke-linecap="round"/>
</g>
</svg>
