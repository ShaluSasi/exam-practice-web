<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img">
<title>A bird flying across the sky</title>
<style>
.wg{transform-box:view-box;transform-origin:56px 60px;animation:f .7s ease-in-out infinite alternate}
.fl{animation:fl 3s ease-in-out infinite}
.c{animation:c 8s linear infinite}
@keyframes f{from{transform:scaleY(1)}to{transform:scaleY(-.55)}}
@keyframes fl{0%,100%{transform:translateY(-4px)}50%{transform:translateY(4px)}}
@keyframes c{from{transform:translateX(20px)}to{transform:translateX(-40px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="6" y="6" width="108" height="108" rx="12" fill="#E6F4FF"/>
<g class="c" fill="#fff"><ellipse cx="90" cy="94" rx="14" ry="6"/><ellipse cx="100" cy="90" rx="9" ry="6"/></g>
<g class="fl">
<path d="M30 62 L12 54 L14 66 Z" fill="#5B8FD6" stroke="#2F5DA0" stroke-width="2.5" stroke-linejoin="round"/>
<ellipse cx="56" cy="64" rx="28" ry="13" fill="#7FB2F0" stroke="#2F5DA0" stroke-width="2.5"/>
<ellipse cx="58" cy="70" rx="18" ry="6" fill="#DDEBFF"/>
<circle cx="86" cy="56" r="11" fill="#7FB2F0" stroke="#2F5DA0" stroke-width="2.5"/>
<path d="M96 54 L108 58 L96 62 Z" fill="#F5B83D" stroke="#C98A1E" stroke-width="2" stroke-linejoin="round"/>
<circle cx="89" cy="53" r="2.4" fill="#2B2F4A"/>
<g class="wg"><path d="M44 60 C44 40 60 26 76 22 C70 34 68 46 66 60 Z" fill="#5B8FD6" stroke="#2F5DA0" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M52 56 L60 36 M58 58 L68 34" stroke="#A9C8F5" stroke-width="2" stroke-linecap="round"/></g>
</g>
</svg>
