<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" role="img">
<title>Two hands clapping</title>
<style>
.L{fill:none;stroke-linecap:round;stroke-linejoin:round}.K{stroke:#2B2F4A}.o,.p,.q,.r,.s,.t{stroke:#2B2F4A;stroke-width:2}.p{stroke-width:2.2}.q{stroke-width:1.6}.r{stroke-width:1.8}.s{stroke-width:1.5}.t{stroke-width:1.4}
.cl{animation:cl .9s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}@keyframes cl{50%{transform:rotate(-12deg)}}.cr{animation:cr .9s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom center}@keyframes cr{50%{transform:rotate(12deg)}}.tw{animation:tw 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes tw{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g class="cl"><path transform="translate(96 0) scale(1 1)" d="M0 170V110Q-2 70 6 50Q10 40 18 46L20 90L24 36Q30 28 36 36L34 92L40 44Q46 36 52 46L48 100L56 64Q62 58 66 66L60 130Q56 160 40 170Z" fill="#E0A878" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/></g><g class="cr"><path transform="translate(204 0) scale(-1 1)" d="M0 170V110Q-2 70 6 50Q10 40 18 46L20 90L24 36Q30 28 36 36L34 92L40 44Q46 36 52 46L48 100L56 64Q62 58 66 66L60 130Q56 160 40 170Z" fill="#E0A878" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/></g><path class="tw" d="M150 30V12M120 40L108 26M180 40L192 26" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round"/><path class="tw" style="animation-delay:0.3s" d="M60 42L62.4 47.6L68 50L62.4 52.4L60 58L57.6 52.4L52 50L57.6 47.6Z" fill="#F6C453"/><path class="tw" style="animation-delay:0.9s" d="M244 42L246.4 47.6L252 50L246.4 52.4L244 58L241.6 52.4L236 50L241.6 47.6Z" fill="#F6C453"/>
</svg>
