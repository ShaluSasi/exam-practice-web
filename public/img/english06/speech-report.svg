<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" role="img">
<title>An exclamation in a speech bubble turns into a sentence written in a notebook</title>
<style>
.L{fill:none;stroke-linecap:round;stroke-linejoin:round}.K{stroke:#2B2F4A}.o,.p,.q,.r,.s,.t{stroke:#2B2F4A;stroke-width:2}.p{stroke-width:2.2}.q{stroke-width:1.6}.r{stroke-width:1.8}.s{stroke-width:1.5}.t{stroke-width:1.4}
.da{stroke-dasharray:10 7;animation:da 1.4s linear infinite}@keyframes da{to{stroke-dashoffset:-17}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="20" y="40" width="140" height="90" rx="30" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5"/><path d="M60 128l-10 24 30 -23" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><text x="90" y="104" font-size="54" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" fill="#E5484D">!</text>
<path class="da" d="M170 90H220" stroke="#FF8A1F" stroke-width="5" stroke-linecap="round"/><path d="M216 78l14 12-14 12" fill="none" stroke="#FF8A1F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="238" y="44" width="116" height="128" rx="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5"/><path d="M248 44V172" stroke="#F28B82" stroke-width="1.5"/><path d="M252 70H340" stroke="#A3A8CC" stroke-width="3" stroke-linecap="round"/><path d="M252 90H340" stroke="#A3A8CC" stroke-width="3" stroke-linecap="round"/><path d="M252 110H340" stroke="#A3A8CC" stroke-width="3" stroke-linecap="round"/><path d="M252 130H340" stroke="#A3A8CC" stroke-width="3" stroke-linecap="round"/><path d="M252 150H340" stroke="#A3A8CC" stroke-width="3" stroke-linecap="round"/><circle cx="340" cy="154" r="4" fill="#2B2F4A"/>
</svg>
