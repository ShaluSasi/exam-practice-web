<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 256" role="img">
<title>A page from a play script</title>
<style>
.L{fill:none;stroke-linecap:round;stroke-linejoin:round}.K{stroke:#2B2F4A}.o,.p,.q,.r,.s,.t{stroke:#2B2F4A;stroke-width:2}.p{stroke-width:2.2}.q{stroke-width:1.6}.r{stroke-width:1.8}.s{stroke-width:1.5}.t{stroke-width:1.4}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="16" y="14" width="388" height="228" rx="8" fill="#FFFFFF" class="o"/><path d="M40 14V242" stroke="#F28B82" stroke-width="1.5"/>
<text x="212" y="38" font-size="13" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">ACT I</text>
<text x="82" y="82" font-size="15" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">IQBAL:</text><text x="188" y="82" font-size="15" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#5B6AA8" font-style="italic">(a little loudly)</text><text x="304" y="82" font-size="15" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">Shruti!</text>
<text x="92" y="132" font-size="15" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">AVINASH:</text><text x="196" y="132" font-size="15" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#5B6AA8" font-style="italic">(very loudly)</text><text x="296" y="132" font-size="15" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">SHRUTI!</text>
<text x="88" y="182" font-size="15" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">SHRUTI:</text><text x="162" y="182" font-size="15" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#5B6AA8" font-style="italic">(Aside)</text><text x="278" y="182" font-size="15" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">Just once more!</text>
<text x="88" y="228" font-size="15" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">SHRUTI:</text><text x="150" y="228" font-size="15" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">Papa</text><text x="184" y="228" font-size="15" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">…</text><text x="208" y="228" font-size="15" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">er</text><text x="232" y="228" font-size="15" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">…</text><text x="300" y="228" font-size="15" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">a concert.</text>
</svg>
