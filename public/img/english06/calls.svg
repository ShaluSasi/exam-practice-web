<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" role="img">
<title>Three speech bubbles, each bigger than the one before</title>
<style>
.L{fill:none;stroke-linecap:round;stroke-linejoin:round}.K{stroke:#2B2F4A}.o,.p,.q,.r,.s,.t{stroke:#2B2F4A;stroke-width:2}.p{stroke-width:2.2}.q{stroke-width:1.6}.r{stroke-width:1.8}.s{stroke-width:1.5}.t{stroke-width:1.4}
.g1,.g2,.g3{animation:gx 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom left}.g2{animation-delay:.5s}.g3{animation-delay:1s}@keyframes gx{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
