<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" role="img">
<title>The same music note repeated in a row with echo rings</title>
<style>
.L{fill:none;stroke-linecap:round;stroke-linejoin:round}.K{stroke:#2B2F4A}.o,.p,.q,.r,.s,.t{stroke:#2B2F4A;stroke-width:2}.p{stroke-width:2.2}.q{stroke-width:1.6}.r{stroke-width:1.8}.s{stroke-width:1.5}.t{stroke-width:1.4}
.ec{animation:ec 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes ec{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.4);opacity:0}}
