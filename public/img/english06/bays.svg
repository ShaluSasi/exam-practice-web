<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 220" role="img">
<title>Two sailboats in two bays, each pushed by its own wind</title>
<style>
.L{fill:none;stroke-linecap:round;stroke-linejoin:round}.K{stroke:#2B2F4A}.o,.p,.q,.r,.s,.t{stroke:#2B2F4A;stroke-width:2}.p{stroke-width:2.2}.q{stroke-width:1.6}.r{stroke-width:1.8}.s{stroke-width:1.5}.t{stroke-width:1.4}
.wd{stroke-dasharray:14 10;animation:wd 1.6s linear infinite}@keyframes wd{to{stroke-dashoffset:-24}}.wr{stroke-dasharray:14 10;animation:wd 1.6s linear infinite reverse}.bob{animation:bob 2.6s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M16 0H364Q380 0 380 16V220H0V16Q0 0 16 0Z" fill="#8FD3FF"/>
<path d="M0 30Q60 40 80 90Q90 140 40 160L0 170Z" fill="#BFE3B4" class="o"/><path d="M380 30Q320 40 300 90Q290 140 340 160L380 170Z" fill="#BFE3B4" class="o"/><path d="M150 0Q190 70 230 0Z" fill="#BFE3B4" class="o"/><path d="M0 170L40 160Q110 150 190 170Q270 150 340 160L380 170V204Q380 220 364 220H16Q0 220 0 204Z" fill="#E8D7A8" class="o"/>
<g class="bob"><path d="M86 120H134L126 132H94Z" fill="#C8925A" class="o"/><path d="M110 120V74" stroke="#2B2F4A" stroke-width="2.5"/><path d="M110 76Q140 94 110 114Z" fill="#FFFFFF" class="o"/><path d="M110 74l12 -4 0 8z" fill="#E5484D"/></g><g class="bob"><path d="M246 120H294L286 132H254Z" fill="#C8925A" class="o"/><path d="M270 120V74" stroke="#2B2F4A" stroke-width="2.5"/><path d="M270 76Q240 94 270 114Z" fill="#FFF3C4" class="o"/><path d="M270 74l-12 -4 0 8z" fill="#E5484D"/></g>
<path class="wd" d="M90 50H160" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/><path class="wd" d="M80 70H140" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/><path class="wr" d="M220 50H290" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/><path class="wr" d="M240 70H300" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
</svg>
