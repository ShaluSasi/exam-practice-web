<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" role="img">
<title>An open poetry book with a pencil and floating music notes</title>
<style>
.L{fill:none;stroke-linecap:round;stroke-linejoin:round}.K{stroke:#2B2F4A}.o,.p,.q,.r,.s,.t{stroke:#2B2F4A;stroke-width:2}.p{stroke-width:2.2}.q{stroke-width:1.6}.r{stroke-width:1.8}.s{stroke-width:1.5}.t{stroke-width:1.4}
.fl{animation:fl 3.2s ease-in-out infinite}@keyframes fl{0%{transform:translateY(8px);opacity:0}30%{opacity:1}100%{transform:translateY(-24px);opacity:0}}.tw{animation:tw 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes tw{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
