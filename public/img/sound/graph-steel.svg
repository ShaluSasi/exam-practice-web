<text x="412" y="250" text-anchor="end">Distance (m)</text><text x="30" y="120" transform="rotate(-90 30 120)" text-anchor="middle">Density</text><rect x="330" y="8" width="78" height="20" rx="6" fill="#C9CDE6" stroke="#6E7396" stroke-width="2"/><text x="369" y="23" text-anchor="middle" font-size="12">steel</text></g>
