<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" role="img">
<title>Density–distance graph of a sound wave in steel</title>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<defs><clipPath id="c"><rect x="60" y="20" width="342" height="200"/></clipPath></defs>
<path d="M60 30 V210" stroke="#E3E6F3" stroke-width="1.5"/><path d="M145 30 V210" stroke="#E3E6F3" stroke-width="1.5"/><path d="M230 30 V210" stroke="#E3E6F3" stroke-width="1.5"/><path d="M315 30 V210" stroke="#E3E6F3" stroke-width="1.5"/><path d="M400 30 V210" stroke="#E3E6F3" stroke-width="1.5"/>
<path d="M60 120 H405" stroke="#6B7A99" stroke-width="2" stroke-dasharray="7 5"/>
<g clip-path="url(#c)"><path d="M60 120 q42.5 -120 85 0 t85 0 t85 0 t85 0 t85 0" fill="none" stroke="#0B93D4" stroke-width="4" stroke-linecap="round"/></g>
<path d="M60 26 V210 H412" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/>
