<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img">
<title>A handheld sound level meter with a decibel scale</title>
<style>.nd{transform-origin:200px 140px;animation:nd 2.4s ease-in-out infinite alternate}@keyframes nd{from{transform:rotate(-70deg)}to{transform:rotate(62deg)}}
.sw{stroke:#0B93D4;animation:sw 1.4s linear infinite}@keyframes sw{0%{transform:translateX(0);opacity:0}30%{opacity:1}100%{transform:translateX(30px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="120" y="40" width="160" height="196" rx="22" fill="#2B2F4A"/>
<rect x="134" y="62" width="132" height="98" rx="10" fill="#FFF9EE"/>
<path d="M144 140 A56 56 0 0 1 172 91.5" fill="none" stroke="#3FA34D" stroke-width="12"/><path d="M172 91.5 A56 56 0 0 1 228 91.5" fill="none" stroke="#F6C453" stroke-width="12"/><path d="M228 91.5 A56 56 0 0 1 256 140" fill="none" stroke="#E5484D" stroke-width="12"/>
<g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" font-size="12" text-anchor="middle"><text x="150" y="156">0</text><text x="200" y="78">60</text><text x="252" y="156">120</text><text x="200" y="154">dB</text></g>
<g class="nd"><path d="M200 140 V92" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round"/></g><circle cx="200" cy="140" r="6" fill="#2B2F4A"/>
<circle cx="200" cy="30" r="18" fill="#A3A8CC" stroke="#6E7396" stroke-width="2.5"/>
<rect x="150" y="182" width="100" height="18" rx="9" fill="#6E7396"/><circle cx="200" cy="216" r="8" fill="#E5484D"/>
<g fill="none"><path class="sw" d="M110 19 q-7.699999999999999 11 0 22 M98 15 q-10.5 15 0 30 M86 11 q-13.299999999999999 19 0 38" fill="none" stroke-width="3" stroke-linecap="round"/></g>
</svg>
