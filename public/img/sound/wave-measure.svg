<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 270" role="img">
<title>A density–distance graph of a sound wave with four measurement arrows</title>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><clipPath id="c"><rect x="50" y="20" width="375" height="220"/></clipPath></defs>
<path d="M50 75 H425 M50 195 H425" stroke="#E3E6F3" stroke-width="1.5"/>
<path d="M50 135 H425" stroke="#6B7A99" stroke-width="2" stroke-dasharray="7 5"/>
<g clip-path="url(#c)"><path d="M55 135 q35 -120 70 0 t70 0 t70 0 t70 0 t70 0 t70 0" fill="none" stroke="#0B93D4" stroke-width="4" stroke-linecap="round"/></g>
<path d="M50 24 V240 H428" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/>
<g stroke="#8A90B8" stroke-width="1.6" stroke-dasharray="3 4"><path d="M90 75 V42 M230 75 V42 M230 75 V230 M300 195 V230 M96 75 H172"/></g>
<g stroke="#2B2F4A" stroke-width="2.5" marker-start="url(#a)" marker-end="url(#a)"><path d="M92 50 H228"/><path d="M370 133 V77"/><path d="M160 193 V77"/><path d="M232 222 H298"/></g>
<g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" font-size="13"><text x="24" y="135" transform="rotate(-90 24 135)" text-anchor="middle">Density</text><text x="428" y="260" text-anchor="end">Distance</text>
<path d="M300 18 h22" stroke="#6B7A99" stroke-width="2" stroke-dasharray="7 5"/><text x="328" y="23">average density</text></g>
</svg>
