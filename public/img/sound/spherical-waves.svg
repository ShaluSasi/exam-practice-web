<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 260" role="img">
<title>Sound spreading out in all directions from a small source</title>
<style>.ring{transform-box:fill-box;transform-origin:center;animation:ring 4s linear infinite}@keyframes ring{0%{transform:scale(.04);opacity:1}100%{transform:scale(1);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M90 130 L404 28 A330 330 0 0 1 404 232 Z" fill="#CDEBFA" opacity=".5"/>
<g fill="none" stroke="#0B93D4" stroke-width="2.5"><circle class="ring" style="animation-delay:-0s" cx="90" cy="130" r="340" vector-effect="non-scaling-stroke"/><circle class="ring" style="animation-delay:-1s" cx="90" cy="130" r="340" vector-effect="non-scaling-stroke"/><circle class="ring" style="animation-delay:-2s" cx="90" cy="130" r="340" vector-effect="non-scaling-stroke"/><circle class="ring" style="animation-delay:-3s" cx="90" cy="130" r="340" vector-effect="non-scaling-stroke"/></g>
<path d="M185.1 99.1 A100 100 0 0 1 185.1 160.9" fill="none" stroke="#FF8A1F" stroke-width="10" stroke-linecap="round"/>
<path d="M375.3 37.3 A300 300 0 0 1 375.3 222.7" fill="none" stroke="#FF8A1F" stroke-width="10" stroke-linecap="round" opacity=".35"/>
<circle cx="90" cy="130" r="13" fill="#F6C453" stroke="#B8892A" stroke-width="2.5"/><circle cx="90" cy="130" r="4" fill="#B8892A"/>
</svg>
