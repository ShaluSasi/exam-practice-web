.sw{stroke:#FF8A1F;animation:sw 1s linear infinite}@keyframes sw{0%{transform:translateX(0);opacity:1}100%{transform:translateX(30px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
