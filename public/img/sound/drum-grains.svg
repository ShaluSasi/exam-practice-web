<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>Grains on a rubber sheet stretched over a bowl, near a metal plate being struck</title>
<style>.gr{animation:gr .5s ease-out infinite alternate}@keyframes gr{to{transform:translateY(-14px)}}
