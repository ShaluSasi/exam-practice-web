<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 240" role="img">
<title>A bat flying at night sends out sound pulses towards a moth</title>
<style>.out{stroke:#FF8A1F;animation:out 2.6s linear infinite}.back{stroke:#0B93D4;animation:back 2.6s linear infinite}
@keyframes out{0%{transform:translateX(0);opacity:1}48%{transform:translateX(170px);opacity:1}50%,100%{transform:translateX(170px);opacity:0}}
@keyframes back{0%,49%{transform:translateX(0);opacity:0}50%{transform:translateX(0);opacity:1}98%{transform:translateX(-170px);opacity:1}100%{opacity:0}}.flap{animation:fp .5s ease-in-out infinite alternate}@keyframes fp{to{transform:translate(96px,114px) scale(1,.8)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
