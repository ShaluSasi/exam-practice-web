<ellipse cx="0" cy="4" rx="11" ry="16" fill="#4A3F6B" stroke="#2B2F4A" stroke-width="2"/><path d="M-8 -8 l2 -12 l6 8 l6 -8 l2 12Z" fill="#4A3F6B"/><circle cx="-4" cy="-2" r="2" fill="#FFFFFF"/><circle cx="4" cy="-2" r="2" fill="#FFFFFF"/></g>
<g transform="translate(340 130)"><ellipse rx="4" ry="11" fill="#C9B07A"/><path d="M0 -4 q-18 -16 -22 2 q10 8 22 2Z M0 -4 q18 -16 22 2 q-10 8 -22 2Z" fill="#F3E3C3" stroke="#C9B07A" stroke-width="1.5"/></g>
<g fill="none"><path class="out" d="M126 111 q7.699999999999999 11 0 22 M137 107 q10.5 15 0 30 M148 103 q13.299999999999999 19 0 38" fill="none" stroke-width="3" stroke-linecap="round"/><path class="back" d="M316 119 q-7.699999999999999 11 0 22 M305 115 q-10.5 15 0 30 M294 111 q-13.299999999999999 19 0 38" fill="none" stroke-width="3" stroke-linecap="round"/></g>
