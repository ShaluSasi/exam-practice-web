<path d="M360 20 L400 10 L432 20 V252 H360Z" fill="#B79C7E" stroke="#7E6448" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M76 84 H354 M354 100 H80 M76 194 H354 M354 210 H80" stroke="#6B7A99" stroke-width="2" stroke-dasharray="6 6"/>
<g><rect x="30" y="74" width="34" height="34" rx="6" fill="#2B2F4A"/><circle cx="52" cy="91" r="10" fill="#A3A8CC"/></g>
