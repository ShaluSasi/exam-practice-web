<style>.pa{animation:pa 2.2s linear infinite alternate}@keyframes pa{to{transform:translateX(272px)}}.pb{animation:pa .5s linear infinite alternate}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
