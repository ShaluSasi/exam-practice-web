<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" role="img">
<title>The range of sound frequencies split into three bands</title>
<style>.a{animation:a 1.5s linear infinite}@keyframes a{to{transform:translateX(90px)}}.b{animation:b .67s linear infinite}@keyframes b{to{transform:translateX(40px)}}.c{animation:c .27s linear infinite}@keyframes c{to{transform:translateX(16px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="20" y="110" width="110" height="34" rx="8" fill="#C9B8F0" stroke="#7E66C2" stroke-width="2"/>
<rect x="130" y="110" width="160" height="34" fill="#BFE3C0" stroke="#3FA34D" stroke-width="2"/>
<rect x="290" y="110" width="130" height="34" rx="8" fill="#FFD2A8" stroke="#E07A1A" stroke-width="2"/>
<defs><clipPath id="c1"><rect x="26" y="40" width="98" height="60"/></clipPath><clipPath id="c2"><rect x="140" y="40" width="140" height="60"/></clipPath><clipPath id="c3"><rect x="296" y="40" width="118" height="60"/></clipPath></defs>
<g fill="none" stroke-width="3" stroke-linecap="round">
<g clip-path="url(#c1)"><path class="a" d="M-64 72 q22.5 -40 45 0 t45 0 t45 0 t45 0 t45 0 t45 0 t45 0" stroke="#7E66C2"/></g>
<g clip-path="url(#c2)"><path class="b" d="M100 72 q10 -40 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0" stroke="#3FA34D"/></g>
<g clip-path="url(#c3)"><path class="c" d="M280 72 q4 -40 8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0" stroke="#E07A1A"/></g></g>
<g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" font-size="13" text-anchor="middle"><text x="75" y="132">Infrasonic</text><text x="210" y="132">Audible</text><text x="355" y="132">Ultrasonic</text>
<text x="75" y="166">below 20 Hz</text><text x="210" y="166">20 Hz to 20 kHz</text><text x="355" y="166">above 20 kHz</text></g>
<text x="220" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" font-size="12">frequency increases →</text>
