<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" role="img">
<title>A microphone connected by a wire to a loudspeaker</title>
<style>.sig{animation:sig 1s linear infinite}@keyframes sig{to{stroke-dashoffset:-32}}
.in{stroke:#0B93D4;animation:in 1.6s linear infinite}@keyframes in{0%{transform:translateX(0);opacity:0}30%{opacity:1}100%{transform:translateX(22px);opacity:0}}
.out2{stroke:#FF8A1F;animation:o2 1.6s linear infinite}@keyframes o2{0%{transform:translateX(0);opacity:1}100%{transform:translateX(22px);opacity:0}}
.cone{transform-box:fill-box;transform-origin:center;animation:cn .2s ease-in-out infinite alternate}@keyframes cn{to{transform:scale(.9)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M80 168 Q80 186 112 186 H300 Q340 186 340 160 V152" fill="none" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round"/>
<path class="sig" d="M80 168 Q80 186 112 186 H300 Q340 186 340 160 V152" fill="none" stroke="#F6C453" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 10"/>
<rect x="70" y="96" width="20" height="74" rx="7" fill="#2B2F4A"/>
<circle cx="80" cy="78" r="26" fill="#A3A8CC" stroke="#6E7396" stroke-width="2.5"/>
<path d="M60 70 H100 M57 82 H103 M64 94 H96 M72 56 V100 M88 56 V100" stroke="#6E7396" stroke-width="1.5"/>
<g fill="none"><path class="in" d="M14 68 q7 10 0 20 M24 64 q9.799999999999999 14 0 28 M34 60 q12.6 18 0 36" fill="none" stroke-width="3" stroke-linecap="round"/></g>
<rect x="300" y="50" width="80" height="104" rx="10" fill="#2B2F4A"/>
<circle class="cone" cx="340" cy="104" r="30" fill="#A3A8CC" stroke="#C9CDE6" stroke-width="3"/>
<circle cx="340" cy="104" r="10" fill="#6E7396"/><circle cx="340" cy="66" r="7" fill="#6E7396"/>
<g fill="none"><path class="out2" d="M392 91 q9.1 13 0 26 M404 87 q11.899999999999999 17 0 34 M416 83 q14.7 21 0 42" fill="none" stroke-width="3" stroke-linecap="round"/></g>
</svg>
