<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Two bars: a cost of 100 units in one country and 40 to 50 units when production is spread across countries</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift,.grow,.mv,.mv2{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-22px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 3.5s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-12px)}to{transform:translateX(12px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.3}}
.grow{transform-origin:50% 100%;animation:grow 3s ease-in-out infinite alternate}
@keyframes grow{from{transform:scaleY(.82)}to{transform:scaleY(1)}}
.mv{animation:mv 3s ease-in-out infinite alternate}
@keyframes mv{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
.mv2{animation:mv2 3s ease-in-out infinite alternate}
@keyframes mv2{from{transform:translateX(18px)}to{transform:translateX(-18px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M60 205H370" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="90" y="45" width="80" height="160" rx="4" fill="#FFB3B3" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="130" y="20" font-size="12" text-anchor="middle">Production in</text><text x="130" y="34" font-size="12" text-anchor="middle">one country</text><text x="130" y="130" font-size="22" text-anchor="middle">100</text><text x="130" y="150" font-size="12" text-anchor="middle">units of cost</text><rect x="260" y="125.0" width="80" height="80.0" rx="4" fill="#B9E4C0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="260" y="141.0" width="80" height="16.0" rx="0" fill="#E6F5E9" stroke="#3FA34D" stroke-width="2" stroke-dasharray="5 4"/><text x="300" y="82" font-size="12" text-anchor="middle">Production spread</text><text x="300" y="95" font-size="12" text-anchor="middle">across countries</text><text x="300" y="170" font-size="20" text-anchor="middle">40 to 50</text><text x="300" y="190" font-size="12" text-anchor="middle">units of cost</text><line x1="215" y1="110" x2="215" y2="170" stroke="#E5484D" stroke-width="4" stroke-linecap="round" class="fl" marker-end="url(#ahr)"/><text x="215" y="102" font-size="12" text-anchor="middle" style="fill:#E5484D">50-60 saved</text></svg>