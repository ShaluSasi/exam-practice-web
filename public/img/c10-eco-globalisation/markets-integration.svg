<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Goods travel between two markets and the prices of similar goods come closer together</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift,.grow,.mv,.mv2{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-22px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 3.5s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-12px)}to{transform:translateX(12px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.3}}
.grow{transform-origin:50% 100%;animation:grow 3s ease-in-out infinite alternate}
@keyframes grow{from{transform:scaleY(.82)}to{transform:scaleY(1)}}
.mv{animation:mv 3s ease-in-out infinite alternate}
@keyframes mv{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
.mv2{animation:mv2 3s ease-in-out infinite alternate}
@keyframes mv2{from{transform:translateX(18px)}to{transform:translateX(-18px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#E3F2FD"/><g transform="translate(70 105) scale(1.5)"><g><rect x="-24" y="-8" width="48" height="30" rx="4" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-28 -8L-22 -22H22L28 -8Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-12 -8V-22M0 -8V-22M12 -8V-22" stroke="#fff" stroke-width="3"/><rect x="-8" y="4" width="16" height="18" rx="2" fill="#FFD0A0" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-21" y="0" width="9" height="10" rx="1" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="12" y="0" width="9" height="10" rx="1" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(330 105) scale(1.5)"><g><rect x="-24" y="-8" width="48" height="30" rx="4" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-28 -8L-22 -22H22L28 -8Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-12 -8V-22M0 -8V-22M12 -8V-22" stroke="#fff" stroke-width="3"/><rect x="-8" y="4" width="16" height="18" rx="2" fill="#FFD0A0" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-21" y="0" width="9" height="10" rx="1" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="12" y="0" width="9" height="10" rx="1" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="70" y="175" font-size="13" text-anchor="middle">Market A</text><text x="330" y="175" font-size="13" text-anchor="middle">Market B</text><line x1="120" y1="90" x2="280" y2="90" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round" class="fl" marker-end="url(#aho)"/><g transform="translate(200 55) scale(0.8)"><g class="mv"><path d="M-10 -20L-24 -10L-17 0L-10 -4V20H10V-4L17 0L24 -10L10 -20Q0 -14 -10 -20Z" fill="#7CC4F2" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><line x1="280" y1="120" x2="120" y2="120" stroke="#0B93D4" stroke-width="4" stroke-linecap="round" class="fl" marker-end="url(#ahb)"/><g transform="translate(200 150) scale(0.8)"><g class="mv2"><rect x="-10" y="-4" width="20" height="16" rx="3" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-8" y="-16" width="16" height="12" rx="3" fill="#FFC93C" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-3" cy="-10" r="1.8" fill="#2B2F4A"/><circle cx="3" cy="-10" r="1.8" fill="#2B2F4A"/><path d="M-16 0L-10 4M16 0L10 4M-6 12V20M6 12V20" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(70 42) scale(0.8)"><g><path d="M-22 -10H8L22 0L8 10H-22Z" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-15" cy="0" r="3" fill="#2B2F4A"/></g></g><g transform="translate(330 42) scale(0.8)"><g><path d="M-22 -10H8L22 0L8 10H-22Z" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-15" cy="0" r="3" fill="#2B2F4A"/></g></g><text x="70" y="20" font-size="12" text-anchor="middle">price</text><text x="330" y="20" font-size="12" text-anchor="middle">price</text><path d="M120 42H150M280 42H250" stroke="#E5484D" stroke-width="4" stroke-linecap="round" marker-end="url(#ahr)"/><text x="200" y="215" font-size="13" text-anchor="middle">prices in the two markets move closer</text></svg>