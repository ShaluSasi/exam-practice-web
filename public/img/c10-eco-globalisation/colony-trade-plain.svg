ke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(260 130) scale(1.0)"><g class="mv2"><path d="M-30 6H30L22 22H-22Z" fill="#2B2F4A"/><rect x="-24" y="-4" width="15" height="10" rx="1" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-8" y="-4" width="15" height="10" rx="1" fill="#FFC93C" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="8" y="-4" width="15" height="10" rx="1" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-16" y="-14" width="15" height="10" rx="1" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="0" y="-14" width="15" height="10" rx="1" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="2" width="14" height="8" rx="1" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="55" y="24" font-size="14" text-anchor="middle">Colony</text><text x="345" y="24" font-size="14" text-anchor="middle">Industrial country</text><line x1="80" y1="200" x2="160" y2="200" stroke="#3FA34D" stroke-width="4" stroke-linecap="round" class="fl" marker-end="url(#ahg)"/><line x1="320" y1="218" x2="240" y2="218" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round" class="fl" marker-end="url(#aho)"/><g transform="translate(40 55) scale(0.8)"><g><rect x="-30" y="-4" width="60" height="24" rx="3" fill="#E8E0C8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-20" cy="3" r="5" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-20" cy="13" r="5" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-6" cy="3" r="5" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-6" cy="13" r="5" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="3" r="5" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="13" r="5" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="22" cy="3" r="5" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="22" cy="13" r="5" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(355 55) scale(0.8)"><g><rect x="-24" y="-4" width="48" height="26" rx="4" fill="#FFD0A0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-24 -4L-12 -14V-4L0 -14V-4L12 -14V-4" fill="#FFB87A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="14" y="-26" width="9" height="22" rx="2" fill="#C9B8A0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="-30" r="4" fill="#fff" stroke="#2B2F4A" stroke-width="2" class="rise"/><circle cx="21" cy="-30" r="3" fill="#fff" stroke="#2B2F4A" stroke-width="2" class="rise" style="animation-delay:1.2s"/><rect x="-8" y="8" width="16" height="14" rx="2" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-20" y="2" width="8" height="8" rx="1" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="12" y="2" width="8" height="8" rx="1" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg>