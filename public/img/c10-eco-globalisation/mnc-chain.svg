="-8" y="8" width="16" height="14" rx="2" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-20" y="2" width="8" height="8" rx="1" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="12" y="2" width="8" height="8" rx="1" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(235 70) scale(1.2)"><g><rect x="-26" y="6" width="52" height="10" rx="3" fill="#9AA5B8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-20" cy="21" r="3" fill="#2B2F4A"/><circle cx="-7" cy="21" r="3" fill="#2B2F4A"/><circle cx="6" cy="21" r="3" fill="#2B2F4A"/><circle cx="19" cy="21" r="3" fill="#2B2F4A"/><rect x="-18" y="-10" width="14" height="16" rx="2" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="6" y="-2" width="16" height="8" rx="2" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-4 -26V-14M-4 -14L8 -10" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-4" cy="-28" r="3" fill="#2B2F4A"/></g></g><g transform="translate(335 70) scale(1.2)"><g><rect x="-24" y="-8" width="48" height="30" rx="4" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-28 -8L-22 -22H22L28 -8Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-12 -8V-22M0 -8V-22M12 -8V-22" stroke="#fff" stroke-width="3"/><rect x="-8" y="4" width="16" height="18" rx="2" fill="#FFD0A0" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-21" y="0" width="9" height="10" rx="1" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="12" y="0" width="9" heig