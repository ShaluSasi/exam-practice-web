<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A foreign company building a factory with a crane</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift,.grow,.mv,.mv2{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-22px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 3.5s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-12px)}to{transform:translateX(12px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.3}}
.grow{transform-origin:50% 100%;animation:grow 3s ease-in-out infinite alternate}
@keyframes grow{from{transform:scaleY(.82)}to{transform:scaleY(1)}}
.mv{animation:mv 3s ease-in-out infinite alternate}
@keyframes mv{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
.mv2{animation:mv2 3s ease-in-out infinite alternate}
@keyframes mv2{from{transform:translateX(18px)}to{transform:translateX(-18px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#EAF6E4"/><g transform="translate(50 60) scale(0.9)"><g><path d="M-14 24L-6 -22L2 24M-10 8H-2M-8 -6H0" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-30" y="-26" width="60" height="6" rx="2" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 -20V0" stroke="#2B2F4A" stroke-width="2"/><rect x="12" y="0" width="14" height="9" rx="1" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(120 75) scale(1.2)"><g><rect x="-24" y="-4" width="48" height="26" rx="4" fill="#FFD0A0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-24 -4L-12 -14V-4L0 -14V-4L12 -14V-4" fill="#FFB87A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="14" y="-26" width="9" height="22" rx="2" fill="#C9B8A0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="-30" r="4" fill="#fff" stroke="#2B2F4A" stroke-width="2" class="rise"/><circle cx="21" cy="-30" r="3" fill="#fff" stroke="#2B2F4A" stroke-width="2" class="rise" style="animation-delay:1.2s"/><rect x="-8" y="8" width="16" height="14" rx="2" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-20" y="2" width="8" height="8" rx="1" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="12" y="2" width="8" height="8" rx="1" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(165 30) scale(0.7)"><g class="bob"><circle r="13" fill="#FFC93C" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text y="6" font-size="17" text-anchor="middle">₹</text></g></g></svg>