-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(85 160) scale(0.65)"><g class="bob" style="animation-delay:0.3s"><rect x="-10" y="-4" width="20" height="16" rx="3" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-8" y="-16" width="16" height="12" rx="3" fill="#FFC93C" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-3" cy="-10" r="1.8" fill="#2B2F4A"/><circle cx="3" cy="-10" r="1.8" fill="#2B2F4A"/><path d="M-16 0L-10 4M16 0L10 4M-6 12V20M6 12V20" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(120 160) scale(0.65)"><g class="bob" style="animation-delay:0.6s"><rect x="-10" y="-4" width="20" height="16" rx="3" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-8" y="-16" width="16" height="12" rx="3" fill="#FFC93C" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-3" cy="-10" r="1.8" fill="#2B2F4A"/><circle cx="3" cy="-10" r="1.8" fill="#2B2F4A"/><path d="M-16 0L-10 4M16 0L10 4M-6 12V20M6 12V20" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(155 160) scale(0.65)"><g class="bob" style="animation-delay:0.8999999999999999s"><rect x="-10" y="-4" width="20" height="16" rx="3" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-8" y="-16" width="16" height="12" rx="3" fill="#FFC93C" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-3" cy="-10" r="1.8" fill="#2B2F4A"/><circle cx="3" cy="-10" r="1.8" fill="#2B2F4A"/><path d="M-16 0L-10 4M16 0L10 4M-6 12V20M6 12V20" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><rect x="210" y="20" width="180" height="200" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="44" font-size="13" text-anchor="middle">Tax on imports</text><g transform="translate(300 90) scale(1.2)"><g><path d="M-22 -10H8L22 0L8 10H-22Z" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-15" cy="0" r="3" fill="#2B2F4A"/></g></g><text x="300" y="96" font-size="14" text-anchor="middle" style="fill:#E5484D">high</text><g transform="translate(250 160) scale(0.65)"><g class="bob"><rect x="-10" y="-4" width="20" height="16" rx="3" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-8" y="-16" width="16" height="12" rx="3" fill="#FFC93C" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-3" cy="-10" r="1.8" fill="#2B2F4A"/><circle cx="3" cy="-10" r="1.8" fill="#2B2F4A"/><path d="M-16 0L-10 4M16 0L10 4M-6 12V20M6 12V20" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(300 190) scale(0.6)"><g class="bob"><circle r="13" fill="#FFC93C" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text y="6" font-size="17" text-anchor="middle">₹</text></g></g></svg>