ill="#fff"/><circle cx="18" cy="14" r="2" fill="#fff"/></g></g><g transform="translate(165 160) scale(0.9)"><g><rect x="-30" y="-10" width="60" height="22" rx="4" fill="#C9D6F5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-23" y="-5" width="9" height="8" rx="1" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-9" y="-5" width="9" height="8" rx="1" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="5" y="-5" width="9" height="8" rx="1" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="19" y="-5" width="9" height="8" rx="1" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 -2L38 6V12H30" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-20" cy="14" r="4.5" fill="#2B2F4A"/><circle cx="-6" cy="14" r="4.5" fill="#2B2F4A"/><circle cx="8" cy="14" r="4.5" fill="#2B2F4A"/><circle cx="22" cy="14" r="4.5" fill="#2B2F4A"/></g></g><g transform="translate(265 160) scale(0.9)"><g><path d="M-30 6H30L22 22H-22Z" fill="#2B2F4A"/><rect x="-24" y="-4" width="15" height="10" rx="1" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-8" y="-4" width="15" height="10" rx="1" fill="#FFC93C" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="8" y="-4" width="15" height="10" rx="1" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-16" y="-14" width="15" height="10" rx="1" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="0" y="-14" width="15" height="10" rx="1" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="20" y="2" width="14" height="8" rx="1" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(345 110) scale(0.9)"><g><path d="M-28 0Q-28 -8 -16 -8H18Q30 -8 30 0Q30 6 18 6H-16Q-28 6 -28 0Z" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-4 -6L-14 -22H-6L8 -6ZM-4 6L-14 22H-6L8 6Z" fill="#C9D6F5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-26 -4L-32 -16H-26L-18 -6Z" fill="#C9D6F5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="-1" r="2" fill="#0B93D4"/><circle cx="13" cy="-1" r="2" fill="#0B93D4"/><circle cx="20" cy="-1" r="2" fill="#0B93D4"/></g></g><g transform="translate(200 60) scale(1.1)"><g class="mv"><rect x="-18" y="-10" width="36" height="22" rx="1.5" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-6.0 -10V12M6.0 -10V12" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="200" y="22" font-size="13" text-anchor="middle">One container, loaded intact</text><text x="200" y="215" font-size="12" text-anchor="middle">truck, rail, ship, air</text></svg>