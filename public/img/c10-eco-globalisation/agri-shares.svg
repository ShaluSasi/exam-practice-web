"64.0" rx="5" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="290" y="119.0" font-size="13" text-anchor="middle">0.5%</text><text x="290" y="210" font-size="12" text-anchor="middle">Share of employment</text><text x="235" y="22" font-size="13" text-anchor="middle">Agriculture in the United States</text></svg>