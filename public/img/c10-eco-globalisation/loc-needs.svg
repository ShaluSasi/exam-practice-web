linecap="round" stroke-linejoin="round"/></g></g><text x="200" y="170" font-size="12" text-anchor="middle">MNC factory</text><g transform="translate(55 55) scale(0.9)"><g><rect x="-24" y="-8" width="48" height="30" rx="4" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-28 -8L-22 -22H22L28 -8Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-12 -8V-22M0 -8V-22M12 -8V-22" stroke="#fff" stroke-width="3"/><rect x="-8" y="4" width="16" height="18" rx="2" fill="#FFD0A0" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-21" y="0" width="9" height="10" rx="1" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="12" y="0" width="9" height="10" rx="1" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(95 70) scale(0.6)"><g><path d="M-5 12V24M5 12V24M-9 -3L-15 10M9 -3L15 10" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-9" y="-8" width="18" height="22" rx="6" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-17" r="8" fill="#F4C9A0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="70" y="100" font-size="11" text-anchor="middle">Near buyers</text><g transform="translate(345 60) scale(0.9)"><g><path d="M-5 12V24M5 12V24M-9 -3L-15 10M9 -3L15 10" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-9" y="-8" width="18" height="22" rx="6" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-17" r="8" fill="#F4C9A0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-9 -20Q0 -32 9 -20Z" fill="#FFC93C" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="345" y="100" font-size="11" text-anchor="middle">Cheap labour</text><g transform="translate(55 190) scale(0.9)"><g class="spin"><circle r="11" fill="#9AA5B8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle r="4" fill="#fff"/><rect x="-3" y="-17" width="6" height="7" fill="#9AA5B8" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(0)"/><rect x="-3" y="-17" width="6" height="7" fill="#9AA5B8" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(60)"/><rect x="-3" y="-17" width="6" height="7" fill="#9AA5B8" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(120)"/><rect x="-3" y="-17" width="6" height="7" fill="#9AA5B8" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(180)"/><rect x="-3" y="-17" width="6" height="7" fill="#9AA5B8" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(240)"/><rect x="-3" y="-17" width="6" height="7" fill="#9AA5B8" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(300)"/></g></g><text x="55" y="225" font-size="11" text-anchor="middle">Other factors assured</text><g transform="translate(345 190) scale(0.8)"><g><path d="M-26 -6L0 -22L26 -6Z" fill="#F3D9A8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-18" y="-4" width="6" height="18" rx="1" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-6" y="-4" width="6" height="18" rx="1" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="6" y="-4" width="6" height="18" rx="1" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="12" y="-4" width="6" height="18" rx="1" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-28" y="14" width="56" height="7" rx="2" fill="#9AA5B8" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="345" y="225" font-size="11" text-anchor="middle">Helpful policies</text></svg>