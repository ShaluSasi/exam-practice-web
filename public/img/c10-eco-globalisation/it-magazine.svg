1" fill="#FFC93C" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(150 42) scale(1.3)"><g class="bob"><path d="M-18 -10Q-8 14 14 8Z" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-2 4L8 20M0 -6L10 -20" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="-20" r="3" fill="#E5484D"/></g></g><g transform="translate(255 80) scale(1.2)"><g><rect x="-20" y="-18" width="40" height="28" rx="4" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-15" y="-13" width="30" height="18" rx="2" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-6 16H6M0 10V16" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-9 -2L-3 -8L2 -2L8 -9" fill="none" stroke="#3FA34D" stroke-width="2.5"/></g></g><g transform="translate(345 80) scale(1.1)"><g><rect x="-26" y="-2" width="52" height="22" rx="4" fill="#C9D6F5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-18" y="-16" width="36" height="14" rx="2" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-8" cy="-9" r="4" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8" cy="-9" r="4" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-14" y="6" width="28" height="5" rx="1" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><g transform="translate(300 178) scale(1.1)"><g class="sw"><path d="M-28 0Q-28 -8 -16 -8H18Q30 -8 30 0Q30 6 18 6H-16Q-28 6 -28 0Z" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-4 -6L-14 -22H-6L