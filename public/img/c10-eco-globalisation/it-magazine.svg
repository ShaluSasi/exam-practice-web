nd="url(#ahg)"/><g transform="translate(185 148) scale(0.55)"><g class="bob"><circle r="13" fill="#FFC93C" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text y="6" font-size="17" text-anchor="middle">₹</text></g></g></svg>