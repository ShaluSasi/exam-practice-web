<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Five product icons: a car, a laptop, a pill, a paint tin and a nut and bolt</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift,.grow,.mv,.mv2{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-22px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 3.5s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-12px)}to{transform:translateX(12px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.3}}
.grow{transform-origin:50% 100%;animation:grow 3s ease-in-out infinite alternate}
@keyframes grow{from{transform:scaleY(.82)}to{transform:scaleY(1)}}
.mv{animation:mv 3s ease-in-out infinite alternate}
@keyframes mv{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
.mv2{animation:mv2 3s ease-in-out infinite alternate}
@keyframes mv2{from{transform:translateX(18px)}to{transform:translateX(-18px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#E3F2FD"/><g transform="translate(45 90) scale(1.1)"><g class="bob"><path d="M-24 6V-2L-14 -4L-8 -14H10L18 -4L26 -2V6Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-6 -12V-4H14M2 -12V-4" stroke="#fff" stroke-width="2"/><circle cx="-12" cy="8" r="6" fill="#2B2F4A"/><circle cx="14" cy="8" r="6" fill="#2B2F4A"/><circle cx="-12" cy="8" r="2" fill="#fff"/><circle cx="14" cy="8" r="2" fill="#fff"/></g></g><text x="45" y="135" font-size="11" text-anchor="middle">Automobiles</text><g transform="translate(123 90) scale(1.1)"><g class="bob" style="animation-delay:0.3s"><rect x="-18" y="-16" width="36" height="24" rx="4" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-14" y="-12" width="28" height="16" rx="1" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-24 14H24L18 8H-18Z" fill="#C9D6F5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="123" y="135" font-size="11" text-anchor="middle">IT</text><g transform="translate(201 90) scale(1.1)"><g class="bob" style="animation-delay:0.6s"><g transform="rotate(-35)"><rect x="-16" y="-7" width="16" height="14" rx="7" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="0" y="-7" width="16" height="14" rx="7" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><text x="201" y="135" font-size="11" text-anchor="middle">Medicines</text><g transform="translate(279 90) scale(1.1)"><g class="bob" style="animation-delay:0.8999999999999999s"><rect x="-12" y="-6" width="24" height="24" rx="3" fill="#C9D6F5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-14 -6H14" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-12 -6Q-4 -14 0 -6Q6 -16 12 -6" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-6 8H6" stroke="#7C5CFF" stroke-width="5"/></g></g><text x="279" y="135" font-size="11" text-anchor="middle">Paints</text><g transform="translate(357 90) scale(1.1)"><g class="bob" style="animation-delay:1.2s"><path d="M-6 -20L6 -20L14 -8L6 4H-6L-14 -8Z" fill="#B8BFCC" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-8" r="4" fill="#FFF9EE" stroke="#2B2F4A" stroke-width="2"/><rect x="-3" y="4" width="6" height="18" rx="1" fill="#B8BFCC" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="357" y="135" font-size="11" text-anchor="middle">Nuts and bolts</text><text x="200" y="30" font-size="13" text-anchor="middle">Indian companies operating worldwide</text><path d="M30 175H370" stroke="#FF8A1F" stroke-width="3" class="fl"/><g transform="translate(200 205) scale(0.5)"><g><rect x="-14" y="-26" width="28" height="48" rx="4" fill="#C9D6F5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-9" y="-20" width="6" height="6" rx="1" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-9" y="-9" width="6" height="6" rx="1" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-9" y="2" width="6" height="6" rx="1" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="-20" width="6" height="6" rx="1" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="-9" width="6" height="6" rx="1" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="2" width="6" height="6" rx="1" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-4" y="12" width="8" height="10" rx="1" fill="#FFC93C" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg>