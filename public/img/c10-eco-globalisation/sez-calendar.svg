<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Eight years: the first five are tax free for a company in a special zone, later years are taxed</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift,.grow,.mv,.mv2{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-22px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 3.5s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-12px)}to{transform:translateX(12px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.3}}
.grow{transform-origin:50% 100%;animation:grow 3s ease-in-out infinite alternate}
@keyframes grow{from{transform:scaleY(.82)}to{transform:scaleY(1)}}
.mv{animation:mv 3s ease-in-out infinite alternate}
@keyframes mv{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
.mv2{animation:mv2 3s ease-in-out infinite alternate}
@keyframes mv2{from{transform:translateX(18px)}to{transform:translateX(-18px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#E3F2FD"/><text x="200" y="28" font-size="13" text-anchor="middle">Taxes in a Special Economic Zone</text><rect x="24" y="60" width="40" height="60" rx="6" fill="#B9E4C0" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="95" font-size="13" text-anchor="middle">Y1</text><rect x="68" y="60" width="40" height="60" rx="6" fill="#B9E4C0" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="88" y="95" font-size="13" text-anchor="middle">Y2</text><rect x="112" y="60" width="40" height="60" rx="6" fill="#B9E4C0" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="132" y="95" font-size="13" text-anchor="middle">Y3</text><rect x="156" y="60" width="40" height="60" rx="6" fill="#B9E4C0" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="176" y="95" font-size="13" text-anchor="middle">Y4</text><rect x="200" y="60" width="40" height="60" rx="6" fill="#B9E4C0" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="220" y="95" font-size="13" text-anchor="middle">Y5</text><rect x="244" y="60" width="40" height="60" rx="6" fill="#FFB3B3" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="264" y="95" font-size="13" text-anchor="middle">Y6</text><rect x="288" y="60" width="40" height="60" rx="6" fill="#FFB3B3" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="308" y="95" font-size="13" text-anchor="middle">Y7</text><rect x="332" y="60" width="40" height="60" rx="6" fill="#FFB3B3" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="352" y="95" font-size="13" text-anchor="middle">Y8</text><text x="124" y="148" font-size="13" text-anchor="middle" style="fill:#3FA34D">no taxes</text><text x="300" y="148" font-size="13" text-anchor="middle" style="fill:#E5484D">taxes apply</text><g transform="translate(60 195) scale(0.6)"><g><rect x="-24" y="-4" width="48" height="26" rx="4" fill="#FFD0A0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-24 -4L-12 -14V-4L0 -14V-4L12 -14V-4" fill="#FFB87A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="14" y="-26" width="9" height="22" rx="2" fill="#C9B8A0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="18" cy="-30" r="4" fill="#fff" stroke="#2B2F4A" stroke-width="2" class="rise"/><circle cx="21" cy="-30" r="3" fill="#fff" stroke="#2B2F4A" stroke-width="2" class="rise" style="animation-delay:1.2s"/><rect x="-8" y="8" width="16" height="14" rx="2" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-20" y="2" width="8" height="8" rx="1" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="12" y="2" width="8" height="8" rx="1" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="120" y="200" font-size="12" text-anchor="start">unit starts production in year 1</text></svg>