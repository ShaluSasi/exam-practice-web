inecap="round" stroke-linejoin="round"/></g></g><g transform="translate(320 112) scale(1.5)"><g><rect x="-14" y="-26" width="28" height="48" rx="4" fill="#C9D6F5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-9" y="-20" width="6" height="6" rx="1" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-9" y="-9" width="6" height="6" rx="1" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-9" y="2" width="6" height="6" rx="1" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="-20" width="6" height="6" rx="1" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="-9" width="6" height="6" rx="1" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="3" y="2" width="6" height="6" rx="1" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-4" y="12" width="8" height="10" rx="1" fill="#FFC93C" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="80" y="192" font-size="13" text-anchor="middle">Local company</text><text x="320" y="192" font-size="13" text-anchor="middle">MNC</text><line x1="285" y1="85" x2="130" y2="85" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round" class="fl" marker-end="url(#aho)"/><g transform="translate(205 62) scale(0.8)"><g class="bob"><circle r="13" fill="#FFC93C" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text y="6" font-size="17" text-anchor="middle">₹</text></g></g><text x="205" y="44" font-size="12" text-anchor="middle">money for machines</text><line x1="285" y1="135" x2="130" y2="135" stroke="#0B93D4" stroke-width="4" stroke-linecap="round" class="fl" marker-end="url(#ahb)"/><g transform="translate(205 158) scale(0.9)"><g class="spin"><circle r="11" fill="#9AA5B8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle r="4" fill="#fff"/><rect x="-3" y="-17" width="6" height="7" fill="#9AA5B8" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(0)"/><rect x="-3" y="-17" width="6" height="7" fill="#9AA5B8" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(60)"/><rect x="-3" y="-17" width="6" height="7" fill="#9AA5B8" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(120)"/><rect x="-3" y="-17" width="6" height="7" fill="#9AA5B8" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(180)"/><rect x="-3" y="-17" width="6" height="7" fill="#9AA5B8" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(240)"/><rect x="-3" y="-17" width="6" height="7" fill="#9AA5B8" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(300)"/></g></g><text x="205" y="186" font-size="12" text-anchor="middle">latest technology</text></svg>