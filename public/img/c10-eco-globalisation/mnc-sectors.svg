<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Six industries and services: cell phones, automobiles, electronics, soft drinks, fast food and banking</title><style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A}
.fl{stroke-dasharray:7 6;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-13}}
.bob,.pul,.spin,.rise,.sway,.sw,.blk,.fall,.drift,.grow,.mv,.mv2{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.pul{animation:pul 2.4s ease-in-out infinite}
@keyframes pul{50%{transform:scale(1.12)}}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.6s ease-out infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-22px);opacity:0}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.sw{animation:sw 3.5s ease-in-out infinite alternate}
@keyframes sw{from{transform:translateX(-12px)}to{transform:translateX(12px)}}
.blk{animation:blk 2s ease-in-out infinite}
@keyframes blk{50%{opacity:.3}}
.grow{transform-origin:50% 100%;animation:grow 3s ease-in-out infinite alternate}
@keyframes grow{from{transform:scaleY(.82)}to{transform:scaleY(1)}}
.mv{animation:mv 3s ease-in-out infinite alternate}
@keyframes mv{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
.mv2{animation:mv2 3s ease-in-out infinite alternate}
@keyframes mv2{from{transform:translateX(18px)}to{transform:translateX(-18px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2B2F4A"/></marker><marker id="aho" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#FF8A1F"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E5484D"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3FA34D"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B93D4"/></marker></defs><rect width="100%" height="100%" rx="16" fill="#E3F2FD"/><g transform="translate(60 70) scale(1.2)"><g><rect x="-9" y="-16" width="18" height="32" rx="4" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-6" y="-11" width="12" height="20" rx="1" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="60" y="112" font-size="12" text-anchor="middle">Cell phones</text><g transform="translate(200 70) scale(1.2)"><g><path d="M-24 6V-2L-14 -4L-8 -14H10L18 -4L26 -2V6Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-6 -12V-4H14M2 -12V-4" stroke="#fff" stroke-width="2"/><circle cx="-12" cy="8" r="6" fill="#2B2F4A"/><circle cx="14" cy="8" r="6" fill="#2B2F4A"/><circle cx="-12" cy="8" r="2" fill="#fff"/><circle cx="14" cy="8" r="2" fill="#fff"/></g></g><text x="200" y="112" font-size="12" text-anchor="middle">Automobiles</text><g transform="translate(340 70) scale(1.1)"><g><rect x="-18" y="-16" width="36" height="24" rx="4" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-14" y="-12" width="28" height="16" rx="1" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M-24 14H24L18 8H-18Z" fill="#C9D6F5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="340" y="112" font-size="12" text-anchor="middle">Electronics</text><path d="M45 168H75L72 190H48Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="52" y="152" width="16" height="16" rx="3" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="215" font-size="12" text-anchor="middle">Soft drinks</text><circle cx="200" cy="178" r="16" fill="#E0A458" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M184 178H216" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M188 170Q200 164 212 170" fill="none" stroke="#3FA34D" stroke-width="3"/><text x="200" y="215" font-size="12" text-anchor="middle">Fast food</text><g transform="translate(340 172) scale(0.8)"><g><path d="M-26 -8L0 -24L26 -8Z" fill="#C9D6F5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-19" y="-6" width="7" height="22" rx="1" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-6" y="-6" width="7" height="22" rx="1" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="7" y="-6" width="7" height="22" rx="1" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="13" y="-6" width="7" height="22" rx="1" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-28" y="16" width="56" height="7" rx="2" fill="#9AA5B8" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="-13" r="3" fill="#FFC93C"/></g></g><text x="340" y="215" font-size="12" text-anchor="middle">Banking in cities</text></svg>