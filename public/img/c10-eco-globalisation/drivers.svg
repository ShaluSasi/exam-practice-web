e(1.3)"><g><path d="M-18 -10Q-8 14 14 8Z" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-2 4L8 20M0 -6L10 -20" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="10" cy="-20" r="3" fill="#E5484D"/></g></g><text x="200" y="118" font-size="12" text-anchor="middle">IT and telecom</text><g transform="translate(70 175) scale(0.8)"><g><rect x="-26" y="-20" width="52" height="40" rx="4" fill="#E0B48A" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-26 -7H26M-26 6H26M-8 -20V-7M10 -7V6M-14 6V20M6 6V20" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><path d="M45 150L95 200" stroke="#E5484D" stroke-width="5"/><text x="70" y="222" font-size="12" text-anchor="middle">Barriers removed</text><g transform="translate(330 70) scale(1.1)"><g><path d="M-26 -6L0 -22L26 -6Z" fill="#F3D9A8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="-18" y="-4" width="6" height="18" rx="1" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-6" y="-4" width="6" height="18" rx="1" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="6" y="-4" width="6" height="18" rx="1" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="12" y="-4" width="6" height="18" rx="1" fill="#fff" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="-28" y="14" width="56" height="7" rx="2" fill="#9AA5B8" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="330" y="118" font-size="12" text-anchor="middle">International body</text><g transform="translate(200 175) scale(1.2)"><g class="spin"><circle r="11" fill="#9AA5B8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle r="4" fill="#fff"/><rect x="-3" y="-17" width="6" height="7" fill="#9AA5B8" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(0)"/><rect x="-3" y="-17" width="6" height="7" fill="#9AA5B8" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(60)"/><rect x="-3" y="-17" width="6" height="7" fill="#9AA5B8" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(120)"/><rect x="-3" y="-17" width="6" height="7" fill="#9AA5B8" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(180)"/><rect x="-3" y="-17" width="6" height="7" fill="#9AA5B8" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(240)"/><rect x="-3" y="-17" width="6" height="7" fill="#9AA5B8" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="rotate(300)"/></g></g><text x="200" y="222" font-size="12" text-anchor="middle">Technology</text><g transform="translate(330 175) scale(0.9)"><g><circle r="13" fill="#FFC93C" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text y="6" font-size="17" text-anchor="middle">₹</text></g></g><text x="330" y="222" font-size="12" text-anchor="middle">Investment</text></svg>