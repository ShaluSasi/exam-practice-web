<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img">
<title>A truck loaded with logs and stumps</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.2s ease-in-out infinite}@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}.fl{stroke-dasharray:7 6;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-13}}.fw{transform-box:fill-box;transform-origin:50% 50%;animation:fw .5s ease-in-out infinite alternate}@keyframes fw{to{transform:scaleX(.55)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g transform="translate(0,-18)"><rect x="0" y="112" width="200" height="60" rx="0" fill="#BFE3B4" /><rect x="20" y="96" width="110" height="32" rx="4" fill="#D9A066" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="36" cy="112" r="9" fill="#E8B48A" stroke="#2B2F4A" stroke-width="2" /><circle cx="62" cy="112" r="9" fill="#E8B48A" stroke="#2B2F4A" stroke-width="2" /><circle cx="88" cy="112" r="9" fill="#E8B48A" stroke="#2B2F4A" stroke-width="2" /><circle cx="114" cy="112" r="9" fill="#E8B48A" stroke="#2B2F4A" stroke-width="2" /><rect x="130" y="104" width="44" height="26" rx="4" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="44" cy="134" r="9" fill="#2B2F4A" /><circle cx="150" cy="134" r="9" fill="#2B2F4A" /><circle cx="110" cy="134" r="9" fill="#2B2F4A" /><rect x="160" y="138" width="12" height="8" rx="2" fill="#B97A3A" stroke="#2B2F4A" stroke-width="2" /><rect x="180" y="140" width="12" height="8" rx="2" fill="#B97A3A" stroke="#2B2F4A" stroke-width="2" /></g></svg>
