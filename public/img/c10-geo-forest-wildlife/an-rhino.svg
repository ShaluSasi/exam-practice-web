<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img">
<title>A one-horned rhinoceros</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.2s ease-in-out infinite}@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}.fl{stroke-dasharray:7 6;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-13}}.fw{transform-box:fill-box;transform-origin:50% 50%;animation:fw .5s ease-in-out infinite alternate}@keyframes fw{to{transform:scaleX(.55)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g transform="translate(0,-18)"><rect x="0" y="112" width="200" height="60" rx="0" fill="#BFE3B4" /><g transform="translate(85 132) scale(1.3 1.3)" ><rect x="-24" y="-14" width="9" height="14" rx="3" fill="#8E97AB" stroke="#2B2F4A" stroke-width="2" /><rect x="-10" y="-14" width="9" height="14" rx="3" fill="#8E97AB" stroke="#2B2F4A" stroke-width="2" /><rect x="8" y="-14" width="9" height="14" rx="3" fill="#8E97AB" stroke="#2B2F4A" stroke-width="2" /><rect x="20" y="-14" width="9" height="14" rx="3" fill="#8E97AB" stroke="#2B2F4A" stroke-width="2" /><ellipse cx="0" cy="-26" rx="30" ry="17" fill="#9AA3B5" stroke="#2B2F4A" stroke-width="2.5" /><ellipse cx="31" cy="-21" rx="14" ry="10" fill="#9AA3B5" stroke="#2B2F4A" stroke-width="2.5" /><polygon points="36,-28 43,-45 45,-27" fill="#E6DFCF" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><circle cx="28" cy="-27" r="2" fill="#2B2F4A" /><circle cx="24" cy="-34" r="4" fill="#8E97AB" stroke="#2B2F4A" stroke-width="2" /><path d="M-10,-30 Q-4,-20 -10,-12" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g></g></svg>
