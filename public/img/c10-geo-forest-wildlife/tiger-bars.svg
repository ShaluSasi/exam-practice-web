<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Tiger numbers: early 1900s estimate and 1973</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.2s ease-in-out infinite}@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}.fl{stroke-dasharray:7 6;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-13}}.fw{transform-box:fill-box;transform-origin:50% 50%;animation:fw .5s ease-in-out infinite alternate}@keyframes fw{to{transform:scaleX(.55)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="24" font-size="15" text-anchor="middle" >Number of tigers</text><line x1="70" y1="190" x2="380" y2="190" stroke="#E6DFCF" stroke-width="1.5" stroke-linecap="round" /><text x="62" y="194" font-size="10" text-anchor="end" >0</text><line x1="70" y1="143.3" x2="380" y2="143.3" stroke="#E6DFCF" stroke-width="1.5" stroke-linecap="round" /><text x="62" y="147.3" font-size="10" text-anchor="end" >20,000</text><line x1="70" y1="96.7" x2="380" y2="96.7" stroke="#E6DFCF" stroke-width="1.5" stroke-linecap="round" /><text x="62" y="100.7" font-size="10" text-anchor="end" >40,000</text><line x1="70" y1="50" x2="380" y2="50" stroke="#E6DFCF" stroke-width="1.5" stroke-linecap="round" /><text x="62" y="54" font-size="10" text-anchor="end" >60,000</text><rect x="110" y="61.7" width="70" height="128.3" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" class="pu"/><text x="145" y="53.7" font-size="13" text-anchor="middle" class="h" >55,000</text><text x="145" y="212" font-size="12" text-anchor="middle" class="h" >Turn of the century</text><rect x="250" y="185.7" width="70" height="4.3" rx="3" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5" class="pu"/><text x="285" y="177.7" font-size="13" text-anchor="middle" class="h" >1,827</text><text x="285" y="212" font-size="12" text-anchor="middle" class="h" >1973</text><g transform="translate(342 128) scale(0.42 0.42)" ><path d="M-28,-24 Q-46,-30 -40,-50" fill="none" stroke="#FF8A1F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><rect x="-24" y="-14" width="8" height="14" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" /><rect x="-12" y="-14" width="8" height="14" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" /><rect x="10" y="-14" width="8" height="14" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" /><rect x="21" y="-14" width="8" height="14" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" /><ellipse cx="0" cy="-24" rx="30" ry="14" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" /><line x1="-14" y1="-36" x2="-12" y2="-26" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><line x1="-2" y1="-37" x2="0" y2="-26" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><line x1="10" y1="-36" x2="11" y2="-27" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><circle cx="31" cy="-32" r="12" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" /><circle cx="25" cy="-43" r="4.5" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" /><circle cx="38" cy="-43" r="4.5" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" /><ellipse cx="37" cy="-27" rx="6.5" ry="4.5" fill="#FFF3E0" stroke="#2B2F4A" stroke-width="2" /><circle cx="41" cy="-29" r="1.8" fill="#2B2F4A" /><circle cx="33" cy="-35" r="1.8" fill="#2B2F4A" /><line x1="27" y1="-29" x2="24" y2="-26" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /></g></svg>
