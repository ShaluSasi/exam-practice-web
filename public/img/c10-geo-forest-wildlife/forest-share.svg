<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Three categories of forest land</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.2s ease-in-out infinite}@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}.fl{stroke-dasharray:7 6;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-13}}.fw{transform-box:fill-box;transform-origin:50% 50%;animation:fw .5s ease-in-out infinite alternate}@keyframes fw{to{transform:scaleX(.55)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="28" font-size="14" text-anchor="middle" >Share of forest land (schematic)</text><rect x="20" y="60" width="187" height="70" rx="4" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" /><text x="113.5" y="100" font-size="13" text-anchor="middle" class="h" >Reserved</text><rect x="207" y="60" width="119" height="70" rx="4" fill="#7FCB6E" stroke="#2B2F4A" stroke-width="3" /><text x="266.5" y="100" font-size="13" text-anchor="middle" class="h" >Protected</text><rect x="326" y="60" width="54" height="70" rx="4" fill="#E8D9A0" stroke="#2B2F4A" stroke-width="3" class="pu"/><text x="353" y="100" font-size="11" text-anchor="middle" class="h" >Unclassed</text><text x="200" y="176" font-size="12" text-anchor="middle" >Not to scale</text><text x="200" y="204" font-size="11" text-anchor="middle" >Reserved and protected forests together are the permanent forest estates</text></svg>
