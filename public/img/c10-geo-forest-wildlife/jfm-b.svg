<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img">
<title>A forest officer alone with a fenced forest</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.2s ease-in-out infinite}@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}.fl{stroke-dasharray:7 6;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-13}}.fw{transform-box:fill-box;transform-origin:50% 50%;animation:fw .5s ease-in-out infinite alternate}@keyframes fw{to{transform:scaleX(.55)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><g id="tr2E7D3A"><rect x="-4" y="-32" width="8" height="32" rx="2" fill="#B97A3A" stroke="#2B2F4A" stroke-width="2"/><circle cx="-15" cy="-34" r="13" fill="#2E7D3A" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="15" cy="-34" r="13" fill="#2E7D3A" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="0" cy="-46" r="20" fill="#2E7D3A" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="0" cy="-44" r="15" fill="#2E7D3A"/></g></defs>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
