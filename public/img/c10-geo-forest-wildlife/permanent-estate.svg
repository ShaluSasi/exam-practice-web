<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Reserved and protected forests form the permanent estates</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.4}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3.2s ease-in-out infinite}@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}.fl{stroke-dasharray:7 6;animation:fl 1.2s linear infinite}@keyframes fl{to{stroke-dashoffset:-13}}.fw{transform-box:fill-box;transform-origin:50% 50%;animation:fw .5s ease-in-out infinite alternate}@keyframes fw{to{transform:scaleX(.55)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="20" y="90" width="100" height="70" rx="8" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" /><text x="70" y="130" font-size="13" text-anchor="middle" class="h" >Reserved</text><rect x="150" y="90" width="100" height="70" rx="8" fill="#7FCB6E" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="130" font-size="13" text-anchor="middle" class="h" >Protected</text><rect x="280" y="90" width="100" height="70" rx="8" fill="#E8D9A0" stroke="#2B2F4A" stroke-width="3" /><text x="330" y="130" font-size="13" text-anchor="middle" class="h" >Unclassed</text><path d="M20,80 L20,66 L250,66 L250,80" fill="none" stroke="#FF8A1F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="135" y="54" font-size="14" text-anchor="middle" >Permanent forest estates</text><text x="135" y="190" font-size="11" text-anchor="middle" >timber, forest produce and protection</text></svg>
