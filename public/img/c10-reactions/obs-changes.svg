<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Four signs of a chemical reaction: change in state, colour, gas given off and temperature</title><style>text{font-family:sans-serif;fill:#2B2F4A}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.88,1.14)}}.bu{animation:bu 2.4s linear infinite}@keyframes bu{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-52px);opacity:0}}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.45}to{opacity:1}}.wv{animation:wv 2s ease-in-out infinite}@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="8" y="8" width="186" height="108" rx="12" fill="#fff" stroke="#E3D9C2" stroke-width="2" /><rect x="206" y="8" width="186" height="108" rx="12" fill="#fff" stroke="#E3D9C2" stroke-width="2" /><rect x="8" y="124" width="186" height="108" rx="12" fill="#fff" stroke="#E3D9C2" stroke-width="2" /><rect x="206" y="124" width="186" height="108" rx="12" fill="#fff" stroke="#E3D9C2" stroke-width="2" /><path d="M86 41.0 H112 V69.0 a13.0 13.0 0 0 1 -26 0 Z" fill="#E8EEF4" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /><path d="M88 61.0 Q99.0 51.0 110 61.0 V69.0 a11.0 11.0 0 0 1 -22 0 Z" fill="#F6C453" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /><path d="M86 18 V69.0 a13.0 13.0 0 0 0 26 0 V18" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="101" y="106" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Change in state</text><rect x="238" y="34" width="36" height="22" rx="5" fill="#4DA8E8" stroke="#2B2F4A" stroke-width="2.5" /><line x1="282" y1="45" x2="310" y2="45" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M302.1 49.3 L310 45 L302.1 40.7" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="318" y="34" width="36" height="22" rx="5" fill="#B5651D" stroke="#2B2F4A" stroke-width="2.5" /><text x="299" y="106" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Change in colour</text><path d="M86 159.5 H112 V185.0 a13.0 13.0 0 0 1 -26 0 Z" fill="#CFE9F7" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /><path d="M86 134 V185.0 a13.0 13.0 0 0 0 26 0 V134" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="95" cy="176" r="3.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" class="bu" style="animation-delay:0.00s;animation-duration:2s"/><circle cx="104" cy="176" r="3.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" class="bu" style="animation-delay:0.67s;animation-duration:2s"/><circle cx="100" cy="176" r="3.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" class="bu" style="animation-delay:1.33s;animation-duration:2s"/><text x="101" y="222" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Evolution of a gas</text><rect x="293" y="138" width="12" height="50" rx="6" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><circle cx="299" cy="196" r="10" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" /><rect x="296" y="160" width="6" height="36" rx="6" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" /><g class="wv" style="animation-delay:0.0s"><path d="M248 190 q5 -6 0 -12 t0 -12" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g class="wv" style="animation-delay:0.5s"><path d="M262 190 q5 -6 0 -12 t0 -12" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g class="wv" style="animation-delay:1.0s"><path d="M276 190 q5 -6 0 -12 t0 -12" fill="none"