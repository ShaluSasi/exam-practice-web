<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img"><title>Brown copper powder in a china dish being heated and turning black on the surface</title><style>text{font-family:sans-serif;fill:#2B2F4A}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.88,1.14)}}.bu{animation:bu 2.4s linear infinite}@keyframes bu{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-52px);opacity:0}}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.45}to{opacity:1}}.wv{animation:wv 2s ease-in-out infinite}@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.gr{animation:gr 3s ease-in-out infinite alternate}@keyframes gr{from{opacity:.1}to{opacity:1}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M110 150 Q200 230 290 150Z" fill="#F0E6D8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M130 150 Q200 116 270 150Z" fill="#B5651D" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path class="gr" d="M130 150 Q200 116 270 150Z" fill="#1E1E1E"/><rect x="160" y="192" width="80" height="16" rx="5" fill="#BFE3F5" stroke="#2B2F4A" stroke-width="3" /><g class="fl"><path d="M200 160.6 C215.4 180.4 217.6 193.6 200 198 C182.4 193.6 184.6 180.4 200 160.6Z" fill="#FF8A1F"/><path d="M200 178.2 C207.7 188.1 207.7 195.8 200 198 C192.3 195.8 192.3 188.1 200 178.2Z" fill="#F6C453"/></g><text x="200" y="34" font-size="14" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Copper powder heated in air</text><text x="70" y="110" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >brown Cu</text><text x="330" y="110" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >black coating</text></svg>