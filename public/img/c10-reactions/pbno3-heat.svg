<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img"><title>Heating lead nitrate powder in a boiling tube gives brown fumes of nitrogen dioxide</title><style>text{font-family:sans-serif;fill:#2B2F4A}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.88,1.14)}}.bu{animation:bu 2.4s linear infinite}@keyframes bu{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-52px);opacity:0}}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.45}to{opacity:1}}.wv{animation:wv 2s ease-in-out infinite}@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><g transform="translate(150,200) rotate(50)"><path d="M-17 -140 V-17 a17 17 0 0 0 34 0 V-140" fill="#fff" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill-opacity=".5"/><path d="M-14 -26 Q0 -34 14 -26 V-17 a14 14 0 0 1 -28 0Z" fill="#F2F2F2" stroke="#9AA0B5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="-24" y="-104" width="48" height="14" rx="3" fill="#6B7089" stroke="#444" stroke-width="2" /><line x1="24" y1="-97" x2="70" y2="-97" stroke="#6B7089" stroke-width="6" stroke-linecap="round" /></g><rect x="112" y="226" width="76" height="10" rx="5" fill="#BFE3F5" stroke="#2B2F4A" stroke-width="3" /><g class="fl"><path d="M150 190 C164 208 166 220 150 224 C134 220 136 208 150 190Z" fill="#FF8A1F"/><path d="M150 206 C157 215 157 222 150 224 C143 222 143 215 150 206Z" fill="#F6C453"/></g><g class="wv" style="animation-delay:0.0s"><circle cx="265.24622203665695" cy="102.00973464388449" r="9" fill="#B5651D" stroke="none" stroke-width="0" opacity=".75"/></g><g class="wv" style="animation-delay:0.5s"><circle cx="277.24622203665695" cy="94.00973464388449" r="9" fill="#B5651D" stroke="none" stroke-width="0" opacity=".75"/></g><g class="wv" style="animation-delay:1.0s"><circle cx="289.24622203665695" cy="86.00973464388449" r="9" fill="#B5651D" stroke="none" stroke-width="0" opacity=".75"/></g><g class="wv" style="animation-delay:1.5s"><circle cx="301.24622203665695" cy="78.00973464388449" r="9" fill="#B5651D" stroke="none" stroke-width="0" opacity=".75"/></g><text x="362.24622203665695" y="86.00973464388449" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >brown fumes</text><text x="362.24622203665695" y="101.00973464388449" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >of NO₂</text><text x="70" y="50" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Lead nitrate</text><text x="70" y="67" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >(white powder)</text></svg>