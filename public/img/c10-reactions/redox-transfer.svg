<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Oxygen moving from zinc oxide to carbon, forming zinc and carbon monoxide</title><style>text{font-family:sans-serif;fill:#2B2F4A}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.88,1.14)}}.bu{animation:bu 2.4s linear infinite}@keyframes bu{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-52px);opacity:0}}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.45}to{opacity:1}}.wv{animation:wv 2s ease-in-out infinite}@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}@keyframes mv{0%,15%{transform:translateX(0)}55%,100%{transform:translateX(52px)}}.mv{animation:mv 3s ease-in-out infinite alternate}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><circle cx="70" cy="100" r="22" fill="#9AB6D8" stroke="#2B2F4A" stroke-width="2" /><text x="70" y="104.68" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Zn</text><g class="mv"><circle cx="104" cy="100" r="12" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" /></g><circle cx="190" cy="100" r="20" fill="#444" stroke="#2B2F4A" stroke-width="2" /><text x="190" y="104.68" font-size="13" fill="#fff" text-anchor="middle" font-weight="700" >C</text><text x="60" y="160" font-size="14" fill="#2B2F4A" text-anchor="middle" font-weight="700" >ZnO</text><text x="190" y="160" font-size="14" fill="#2B2F4A" text-anchor="middle" font-weight="700" >C</text><text x="120" y="200" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >The oxygen atom moves from Zn to C</text><line x1="235" y1="100" x2="265" y2="100" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M257.1 104.3 L265 100 L257.1 95.7" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="300" cy="100" r="22" fill="#9AB6D8" stroke="#2B2F4A" stroke-width="2" /><text x="300" y="104.68" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Zn</text><circle cx="350" cy="100" r="20" fill="#444" stroke="#2B2F4A" stroke-width="2" /><text x="350" y="104.68" font-size="13" fill="#fff" text-anchor="middle" font-weight="700" >C</text><circle cx="374" cy="100" r="10" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" /><text x="300" y="160" font-size="14" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Zn</text><text x="358" y="160" font-size="14" fill="#2B2F4A" text-anchor="middle" font-weight="700" >CO</text><text x="200" y="36" font-size="16" fill="#2B2F4A" text-anchor="middle" font-weight="700" >ZnO + C → Zn + CO</text></svg>