<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img"><title>A burner with a blue flame burning methane gas in air</title><style>text{font-family:sans-serif;fill:#2B2F4A}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.88,1.14)}}.bu{animation:bu 2.4s linear infinite}@keyframes bu{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-52px);opacity:0}}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.45}to{opacity:1}}.wv{animation:wv 2s ease-in-out infinite}@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="172" y="170" width="56" height="48" rx="8" fill="#BFE3F5" stroke="#2B2F4A" stroke-width="3" /><rect x="190" y="100" width="20" height="72" rx="3" fill="#9AA0B5" stroke="#2B2F4A" stroke-width="3" /><g class="fl"><path d="M200 46.2 C223.8 76.8 227.2 97.2 200 104 C172.8 97.2 176.2 76.8 200 46.2Z" fill="#0B93D4"/><path d="M200 73.4 C211.9 88.7 211.9 100.6 200 104 C188.1 100.6 188.1 88.7 200 73.4Z" fill="#BFE3F5"/></g><text x="70" y="100" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >CH₄ gas</text><text x="70" y="190" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >+ O₂ from air</text><line x1="106" y1="100" x2="168" y2="160" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M159.3 157.6 L168 160 L165.3 151.4" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="320" y="50" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >CO₂</text><text x="320" y="70" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >+ H₂O (steam)</text><text x="320" y="92" font-size="12" fill="#E5484D" text-anchor="middle" font-weight="700" >+ heat and light</text><text x="200" y="236" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >CH₄ + 2O₂ → CO₂ + 2H₂O</text></svg>