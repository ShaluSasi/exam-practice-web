<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>White silver chloride in a china dish turning grey in sunlight</title><style>text{font-family:sans-serif;fill:#2B2F4A}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.88,1.14)}}.bu{animation:bu 2.4s linear infinite}@keyframes bu{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-52px);opacity:0}}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.45}to{opacity:1}}.wv{animation:wv 2s ease-in-out infinite}@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.gr{animation:gr 3s ease-in-out infinite alternate}@keyframes gr{from{opacity:.05}to{opacity:.9}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><g class="pu"><circle cx="70" cy="50" r="26" fill="#F6C453" stroke="#FF8A1F" stroke-width="3" /><line x1="104.0" y1="50.0" x2="116.0" y2="50.0" stroke="#F6C453" stroke-width="3" stroke-linecap="round" /><line x1="94.04163056034261" y1="74.04163056034261" x2="102.5269119345812" y2="82.5269119345812" stroke="#F6C453" stroke-width="3" stroke-linecap="round" /><line x1="70.0" y1="84.0" x2="70.0" y2="96.0" stroke="#F6C453" stroke-width="3" stroke-linecap="round" /><line x1="45.95836943965739" y1="74.04163056034261" x2="37.473088065418814" y2="82.5269119345812" stroke="#F6C453" stroke-width="3" stroke-linecap="round" /><line x1="36.0" y1="50.00000000000001" x2="24.0" y2="50.00000000000001" stroke="#F6C453" stroke-width="3" stroke-linecap="round" /><line x1="45.958369439657375" y1="25.958369439657385" x2="37.47308806541881" y2="17.473088065418814" stroke="#F6C453" stroke-width="3" stroke-linecap="round" /><line x1="70.0" y1="16.0" x2="69.99999999999999" y2="4.0" stroke="#F6C453" stroke-width="3" stroke-linecap="round" /><line x1="94.04163056034261" y1="25.95836943965738" x2="102.52691193458118" y2="17.473088065418807" stroke="#F6C453" stroke-width="3" stroke-linecap="round" /></g><line x1="100" y1="70" x2="170" y2="150" stroke="#F6C453" stroke-width="4" stroke-linecap="round" class="pu"/><line x1="112" y1="60" x2="200" y2="140" stroke="#F6C453" stroke-width="4" stroke-linecap="round" class="pu"/><path d="M130 180 Q200 240 270 180Z" fill="#E8E8E8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M150 176 Q200 140 250 176Z" fill="#fff" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path class="gr" d="M150 176 Q200 140 250 176Z" fill="#7B7F8E"/><text x="200" y="224" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >silver chloride</text><text x="330" y="100" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >white → grey</text><text x="330" y="118" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >2AgCl → 2Ag + Cl₂</text><circle cx="190" cy="160" r="4" fill="#B9E3B2" stroke="#2B2F4A" stroke-width="1.5" class="bu" style="animation-delay:0.00s;animation-duration:2.4s"/><circle cx="210" cy="160" r="4" fill="#B9E3B2" stroke="#2B2F4A" stroke-width="1.5" class="bu" style="animation-delay:1.20s;animation-duration:2.4s"/></svg>