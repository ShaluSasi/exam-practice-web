<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Hydrogen gas passing over hot black copper oxide in a tube, which turns brown</title><style>text{font-family:sans-serif;fill:#2B2F4A}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.88,1.14)}}.bu{animation:bu 2.4s linear infinite}@keyframes bu{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-52px);opacity:0}}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.45}to{opacity:1}}.wv{animation:wv 2s ease-in-out infinite}@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.gr{animation:gr 3s ease-in-out infinite alternate}@keyframes gr{from{opacity:0}to{opacity:1}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="110" y="100" width="180" height="44" rx="22" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><rect x="160" y="108" width="80" height="28" rx="6" fill="#1E1E1E" stroke="none" stroke-width="0" /><rect class="gr" x="160" y="108" width="80" height="28" rx="6" fill="#B5651D"/><line x1="30" y1="122" x2="106" y2="122" stroke="#0B93D4" stroke-width="4" stroke-linecap="round" /><path d="M98.1 126.3 L106 122 L98.1 117.7" fill="none" stroke="#0B93D4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="60" y="108" font-size="12" fill="#0B93D4" text-anchor="middle" font-weight="700" >H₂ gas</text><g class="fl"><path d="M200 134 C214 152 216 164 200 168 C184 164 186 152 200 134Z" fill="#FF8A1F"/><path d="M200 150 C207 159 207 166 200 168 C193 166 193 159 200 150Z" fill="#F6C453"/></g><g class="fl"><path d="M172 140.8 C183.2 155.2 184.8 164.8 172 168 C159.2 164.8 160.8 155.2 172 140.8Z" fill="#FF8A1F"/><path d="M172 153.6 C177.6 160.8 177.6 166.4 172 168 C166.4 166.4 166.4 160.8 172 153.6Z" fill="#F6C453"/></g><g class="fl"><path d="M228 140.8 C239.2 155.2 240.8 164.8 228 168 C215.2 164.8 216.8 155.2 228 140.8Z" fill="#FF8A1F"/><path d="M228 153.6 C233.6 160.8 233.6 166.4 228 168 C222.4 166.4 222.4 160.8 228 153.6Z" fill="#F6C453"/></g><g class="wv" style="animation-delay:0.0s"><path d="M306 134 q5 -6 0 -12 t0 -12" fill="none" stroke="#8E8FA6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g class="wv" style="animation-delay:0.5s"><path d="M320 134 q5 -6 0 -12 t0 -12" fill="none" stroke="#8E8FA6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g class="wv" style="animation-delay:1.0s"><path d="M334 134 q5 -6 0 -12 t0 -12" fill="none" stroke="#8E8FA6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="340" y="100" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >H₂O (steam)</text><text x="200" y="34" font-size="15" fill="#2B2F4A" text-anchor="middle" font-weight="700" >CuO + H₂ → Cu + H₂O</text><text x="200" y="70" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >black CuO turns brown</text></svg>