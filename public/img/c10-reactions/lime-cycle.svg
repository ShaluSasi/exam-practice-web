<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A cycle: calcium carbonate heated to calcium oxide, then water gives calcium hydroxide, then carbon dioxide gives calcium carbonate</title><style>text{font-family:sans-serif;fill:#2B2F4A}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.88,1.14)}}.bu{animation:bu 2.4s linear infinite}@keyframes bu{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-52px);opacity:0}}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.45}to{opacity:1}}.wv{animation:wv 2s ease-in-out infinite}@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="26" font-size="14" fill="#2B2F4A" text-anchor="middle" font-weight="700" >The lime cycle</text><rect x="30" y="160" width="110" height="40" rx="8" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="85" y="186" font-size="15" fill="#2B2F4A" text-anchor="middle" font-weight="700" >CaCO₃</text><rect x="260" y="160" width="110" height="40" rx="8" fill="#FFE2B8" stroke="#FF8A1F" stroke-width="3" /><text x="315" y="186" font-size="15" fill="#2B2F4A" text-anchor="middle" font-weight="700" >CaO</text><rect x="145" y="50" width="110" height="40" rx="8" fill="#CFEFD2" stroke="#3FA34D" stroke-width="3" /><text x="200" y="76" font-size="15" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Ca(OH)₂</text><line x1="145" y1="182" x2="258" y2="182" stroke="#E5484D" stroke-width="3" stroke-linecap="round" /><path d="M250.1 186.3 L258 182 L250.1 177.7" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="200" y="174" font-size="12" fill="#E5484D" text-anchor="middle" font-weight="700" >heat</text><line x1="300" y1="156" x2="232" y2="96" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" /><path d="M240.8 98.0 L232 96 L235.1 104.5" fill="none" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="285" y="118" font-size="12" fill="#0B93D4" text-anchor="middle" font-weight="700" >+ water</text><line x1="168" y1="94" x2="100" y2="156" stroke="#9AA0B5" stroke-width="3" stroke-linecap="round" /><path d="M102.9 147.5 L100 156 L108.7 153.9" fill="none" stroke="#9AA0B5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="108" y="116" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >+ CO₂ (air)</text><g class="wv" style="animation-delay:0.0s"><path d="M301 150 q5 -6 0 -12 t0 -12" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g class="wv" style="animation-delay:0.5s"><path d="M315 150 q5 -6 0 -12 t0 -12" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g class="wv" style="animation-delay:1.0s"><path d="M329 150 q5 -6 0 -12 t0 -12" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g></svg>