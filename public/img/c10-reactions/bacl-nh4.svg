<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Barium hydroxide and ammonium chloride mixed in a test tube; the bottom feels cold in the palm</title><style>text{font-family:sans-serif;fill:#2B2F4A}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.88,1.14)}}.bu{animation:bu 2.4s linear infinite}@keyframes bu{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-52px);opacity:0}}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.45}to{opacity:1}}.wv{animation:wv 2s ease-in-out infinite}@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M160 113.0 H210 V155.0 a25.0 25.0 0 0 1 -50 0 Z" fill="#F4F4F4" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /><path d="M162 147.0 Q185.0 137.0 208 147.0 V155.0 a23.0 23.0 0 0 1 -46 0 Z" fill="#fff" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /><path d="M160 50 V155.0 a25.0 25.0 0 0 0 50 0 V50" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M150 190 Q185 160 220 190 L225 215 H145Z" fill="#FFD3B0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="185" y="208" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >palm</text><g class="pu"><line x1="150" y1="140" x2="156" y2="150" stroke="#B9E3F5" stroke-width="3" stroke-linecap="round" /><line x1="216" y1="140" x2="222" y2="150" stroke="#B9E3F5" stroke-width="3" stroke-linecap="round" /><line x1="150" y1="154" x2="156" y2="164" stroke="#B9E3F5" stroke-width="3" stroke-linecap="round" /><line x1="216" y1="154" x2="222" y2="164" stroke="#B9E3F5" stroke-width="3" stroke-linecap="round" /><line x1="150" y1="168" x2="156" y2="178" stroke="#B9E3F5" stroke-width="3" stroke-linecap="round" /><line x1="216" y1="168" x2="222" y2="178" stroke="#B9E3F5" stroke-width="3" stroke-linecap="round" /></g><text x="300" y="90" font-size="36" fill="#0B93D4" text-anchor="middle" font-weight="700" >❄</text><text x="300" y="120" font-size="13" fill="#0B93D4" text-anchor="middle" font-weight="700" >feels cold</text><text x="80" y="70" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Ba(OH)₂</text><text x="80" y="86" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >+ NH₄Cl</text><text x="80" y="102" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >mixed with a rod</text></svg>