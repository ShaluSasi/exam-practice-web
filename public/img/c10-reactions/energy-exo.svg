<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Energy diagram: reactants higher in energy than products, heat released</title><style>text{font-family:sans-serif;fill:#2B2F4A}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.88,1.14)}}.bu{animation:bu 2.4s linear infinite}@keyframes bu{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-52px);opacity:0}}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.45}to{opacity:1}}.wv{animation:wv 2s ease-in-out infinite}@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><line x1="52" y1="210" x2="52" y2="30" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M56.3 37.9 L52 30 L47.7 37.9" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="30" y="120" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" transform="rotate(-90 30 120)">Energy</text><line x1="52" y1="210" x2="376" y2="210" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><rect x="80" y="52" width="100" height="46" rx="8" fill="#FFE2B8" stroke="#FF8A1F" stroke-width="3" /><text x="130" y="80" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >CaO + H₂O</text><rect x="250" y="152" width="110" height="46" rx="8" fill="#CFEFD2" stroke="#3FA34D" stroke-width="3" /><text x="305" y="180" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Ca(OH)₂</text><path d="M180 75 H215 V175 H250" fill="none" stroke="#9AA0B5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/><line x1="215" y1="96" x2="215" y2="140" stroke="#E5484D" stroke-width="5" stroke-linecap="round" /><path d="M210.7 132.1 L215 140 L219.3 132.1" fill="none" stroke="#E5484D" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><g class="wv" style="animation-delay:0.0s"><path d="M201 150 q5 -6 0 -12 t0 -12" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g class="wv" style="animation-delay:0.5s"><path d="M215 150 q5 -6 0 -12 t0 -12" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g class="wv" style="animation-delay:1.0s"><path d="M229 150 q5 -6 0 -12 t0 -12" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="278" y="120" font-size="14" fill="#E5484D" text-anchor="middle" font-weight="700" >+ HEAT</text></svg>