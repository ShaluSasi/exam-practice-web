<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Quicklime added to water in a beaker, heat waves rising</title><style>text{font-family:sans-serif;fill:#2B2F4A}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.88,1.14)}}.bu{animation:bu 2.4s linear infinite}@keyframes bu{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-52px);opacity:0}}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.45}to{opacity:1}}.wv{animation:wv 2s ease-in-out infinite}@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="131.5" y="134.0" width="137" height="64.5" fill="#CFE9F7"/><path d="M126 90 L130 90 V200 H270 V90 L274 90" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="165" y="172" width="50" height="22" rx="6" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="190" y="188" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >CaO</text><circle cx="150" cy="160" r="3.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" class="bu" style="animation-delay:0.00s;animation-duration:2.4s"/><circle cx="215" cy="160" r="3.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" class="bu" style="animation-delay:0.60s;animation-duration:2.4s"/><circle cx="185" cy="160" r="3.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" class="bu" style="animation-delay:1.20s;animation-duration:2.4s"/><circle cx="240" cy="160" r="3.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" class="bu" style="animation-delay:1.80s;animation-duration:2.4s"/><g class="wv" style="animation-delay:0.0s"><path d="M146 84 q5 -6 0 -12 t0 -12" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g class="wv" style="animation-delay:0.5s"><path d="M160 84 q5 -6 0 -12 t0 -12" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g class="wv" style="animation-delay:1.0s"><path d="M174 84 q5 -6 0 -12 t0 -12" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g class="wv" style="animation-delay:0.0s"><path d="M186 84 q5 -6 0 -12 t0 -12" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g class="wv" style="animation-delay:0.5s"><path d="M200 84 q5 -6 0 -12 t0 -12" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g class="wv" style="animation-delay:1.0s"><path d="M214 84 q5 -6 0 -12 t0 -12" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g class="wv" style="animation-delay:0.0s"><path d="M226 84 q5 -6 0 -12 t0 -12" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g class="wv" style="animation-delay:0.5s"><path d="M240 84 q5 -6 0 -12 t0 -12" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g class="wv" style="animation-delay:1.0s"><path d="M254 84 q5 -6 0 -12 t0 -12" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="200" y="40" font-size="15" fill="#2B2F4A" text-anchor="middle" font-weight="700" >CaO + H₂O → Ca(OH)₂ + heat</text><text x="200" y="224" font-size="12" fill="#E5484D" text-anchor="middle" font-weight="700" >the beaker becomes hot</text></svg>