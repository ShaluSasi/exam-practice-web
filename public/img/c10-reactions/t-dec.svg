<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>One substance splitting into two</title><style>text{font-family:sans-serif;fill:#2B2F4A}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.88,1.14)}}.bu{animation:bu 2.4s linear infinite}@keyframes bu{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-52px);opacity:0}}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.45}to{opacity:1}}.wv{animation:wv 2s ease-in-out infinite}@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><g class="pu"><circle cx="29.0" cy="74.0" r="14.95" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" /><text x="29.0" y="78.6" font-size="13.799999999999999" fill="#fff" text-anchor="middle" font-weight="700" >A</text><circle cx="56.599999999999994" cy="74.0" r="14.95" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" /><text x="56.599999999999994" y="78.6" font-size="13.799999999999999" fill="#fff" text-anchor="middle" font-weight="700" >B</text><text x="84.19999999999999" y="79.75" font-size="20.7" fill="#2B2F4A" text-anchor="middle" font-weight="700" >→</text><circle cx="115.24999999999999" cy="74.0" r="14.95" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" /><text x="115.24999999999999" y="78.6" font-size="13.799999999999999" fill="#fff" text-anchor="middle" font-weight="700" >A</text><circle cx="161.25" cy="74.0" r="14.95" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" /><text x="161.25" y="78.6" font-size="13.799999999999999" fill="#fff" text-anchor="middle" font-weight="700" >B</text></g></svg>