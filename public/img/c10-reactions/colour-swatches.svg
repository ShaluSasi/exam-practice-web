<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Five colour swatches: green, black, yellow, reddish-brown and grey</title><style>text{font-family:sans-serif;fill:#2B2F4A}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.88,1.14)}}.bu{animation:bu 2.4s linear infinite}@keyframes bu{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-52px);opacity:0}}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.45}to{opacity:1}}.wv{animation:wv 2s ease-in-out infinite}@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><circle cx="48" cy="110" r="28" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" /><circle cx="120" cy="110" r="28" fill="#1E1E1E" stroke="#2B2F4A" stroke-width="3" /><circle cx="192" cy="110" r="28" fill="#F6D43C" stroke="#2B2F4A" stroke-width="3" /><circle cx="264" cy="110" r="28" fill="#B5651D" stroke="#2B2F4A" stroke-width="3" /><circle cx="336" cy="110" r="28" fill="#9AA0AC" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="36" font-size="14" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Five observations to match</text><text x="200" y="200" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >colour is a clue to what has formed</text></svg>