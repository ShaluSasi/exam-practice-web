<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Magnesium and oxygen molecule on the left, magnesium oxide on the right: two oxygen atoms against one</title><style>text{font-family:sans-serif;fill:#2B2F4A}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.88,1.14)}}.bu{animation:bu 2.4s linear infinite}@keyframes bu{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-52px);opacity:0}}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.45}to{opacity:1}}.wv{animation:wv 2s ease-in-out infinite}@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><circle cx="60" cy="100" r="22" fill="#B8BCCB" stroke="#2B2F4A" stroke-width="2" /><text x="60" y="104.32" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Mg</text><text x="100" y="106" font-size="22" fill="#2B2F4A" text-anchor="middle" font-weight="700" >+</text><circle cx="145" cy="100" r="18" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" /><circle cx="177" cy="100" r="18" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" /><text x="161" y="160" font-size="14" fill="#2B2F4A" text-anchor="middle" font-weight="700" >O₂</text><line x1="205" y1="100" x2="250" y2="100" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><path d="M242.1 104.3 L250 100 L242.1 95.7" fill="none" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="310" cy="100" r="22" fill="#B8BCCB" stroke="#2B2F4A" stroke-width="2" /><text x="310" y="104.32" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Mg</text><circle cx="352" cy="100" r="18" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" /><text x="331" y="160" font-size="14" fill="#2B2F4A" text-anchor="middle" font-weight="700" >MgO</text><g class="pu"><rect x="130" y="176" width="64" height="44" rx="8" fill="#FFE2B8" stroke="#FF8A1F" stroke-width="3" /><text x="162" y="194" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >O atoms</text><text x="162" y="212" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >2 on LHS</text><rect x="298" y="176" width="64" height="44" rx="8" fill="#FFD6D8" stroke="#E5484D" stroke-width="3" /><text x="330" y="194" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >O atoms</text><text x="330" y="212" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >1 on RHS</text></g><text x="200" y="36" font-size="18" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Mg + O₂ → MgO</text><text x="200" y="58" font-size="13" fill="#E5484D" text-anchor="middle" font-weight="700" >Is it balanced?</text></svg>