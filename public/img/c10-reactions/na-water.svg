<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A small piece of sodium moving on water with bubbles of gas</title><style>text{font-family:sans-serif;fill:#2B2F4A}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.88,1.14)}}.bu{animation:bu 2.4s linear infinite}@keyframes bu{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-52px);opacity:0}}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.45}to{opacity:1}}.wv{animation:wv 2s ease-in-out infinite}@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}@keyframes dr{to{transform:translateX(60px)}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="101.5" y="117.5" width="197" height="81.0" fill="#CFE9F7"/><path d="M96 90 L100 90 V200 H300 V90 L304 90" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><g style="animation:dr 2.4s ease-in-out infinite alternate"><circle cx="170" cy="118" r="13" fill="#C9CEDB" stroke="#2B2F4A" stroke-width="3" /></g><circle cx="160" cy="118" r="4" fill="#fff" stroke="#0B93D4" stroke-width="1.5" class="bu" style="animation-delay:0.00s;animation-duration:2s"/><circle cx="175" cy="118" r="4" fill="#fff" stroke="#0B93D4" stroke-width="1.5" class="bu" style="animation-delay:0.40s;animation-duration:2s"/><circle cx="150" cy="118" r="4" fill="#fff" stroke="#0B93D4" stroke-width="1.5" class="bu" style="animation-delay:0.80s;animation-duration:2s"/><circle cx="185" cy="118" r="4" fill="#fff" stroke="#0B93D4" stroke-width="1.5" class="bu" style="animation-delay:1.20s;animation-duration:2s"/><circle cx="170" cy="118" r="4" fill="#fff" stroke="#0B93D4" stroke-width="1.5" class="bu" style="animation-delay:1.60s;animation-duration:2s"/><text x="200" y="40" font-size="16" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Sodium + Water</text><text x="200" y="64" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >→ Sodium hydroxide + Hydrogen</text><text x="200" y="224" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >fizzing; metal darts about</text></svg>