<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Electrolysis of water: two inverted test tubes over carbon electrodes, one collecting twice as much gas</title><style>text{font-family:sans-serif;fill:#2B2F4A}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.88,1.14)}}.bu{animation:bu 2.4s linear infinite}@keyframes bu{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-52px);opacity:0}}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.45}to{opacity:1}}.wv{animation:wv 2s ease-in-out infinite}@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="90" y="112" width="220" height="84" rx="10" fill="#D6EBFA" stroke="#2B2F4A" stroke-width="3" /><path d="M153 140 V44 a17 17 0 0 1 34 0 V140" fill="#A9D4F0" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /><path d="M153 100 V44 a17 17 0 0 1 34 0 V100Z" fill="#FFFFFF" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /><path d="M153 140 V44 a17 17 0 0 1 34 0 V140" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M213 140 V44 a17 17 0 0 1 34 0 V140" fill="#A9D4F0" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /><path d="M213 64 V44 a17 17 0 0 1 34 0 V64Z" fill="#FFFFFF" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /><path d="M213 140 V44 a17 17 0 0 1 34 0 V140" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="164" y="112" width="12" height="86" rx="3" fill="#4A4D5E" stroke="#2B2F4A" stroke-width="2" /><rect x="224" y="112" width="12" height="86" rx="3" fill="#4A4D5E" stroke="#2B2F4A" stroke-width="2" /><circle cx="170" cy="124" r="3.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" class="bu" style="animation-delay:0.00s;animation-duration:2s"/><circle cx="172" cy="124" r="3.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" class="bu" style="animation-delay:0.67s;animation-duration:2s"/><circle cx="168" cy="124" r="3.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" class="bu" style="animation-delay:1.33s;animation-duration:2s"/><circle cx="230" cy="124" r="3.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" class="bu" style="animation-delay:0.00s;animation-duration:2s"/><circle cx="232" cy="124" r="3.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" class="bu" style="animation-delay:1.00s;animation-duration:2s"/><line x1="170" y1="198" x2="170" y2="212" stroke="#E5484D" stroke-width="3" stroke-linecap="round" /><line x1="230" y1="198" x2="230" y2="212" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><rect x="150" y="212" width="100" height="24" rx="6" fill="#FFE2B8" stroke="#2B2F4A" stroke-width="3" /><text x="192" y="229" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >6 V battery</text><text x="158" y="209" font-size="14" fill="#2B2F4A" text-anchor="middle" font-weight="700" >−</text><text x="242" y="209" font-size="14" fill="#E5484D" text-anchor="middle" font-weight="700" >+</text><text x="345" y="150" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >water +</text><text x="345" y="164" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >few drops of</text><text x="345" y="178" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >dilute H₂SO₄</text><text x="48" y="130" font-size="10" fill="#2B2F4A" text-anchor="middle" font-weight="700" >carbon</text><text x="48" y="142" font-size="10" fill="#2B2F4A" text-anchor="middle" font-weight="700" >electrodes</text></svg>