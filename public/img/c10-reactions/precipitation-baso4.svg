<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Two clear solutions mixed to give a white precipitate settling in a test tube</title><style>text{font-family:sans-serif;fill:#2B2F4A}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.88,1.14)}}.bu{animation:bu 2.4s linear infinite}@keyframes bu{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-52px);opacity:0}}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.45}to{opacity:1}}.wv{animation:wv 2s ease-in-out infinite}@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M50 74.9 H84 V133.0 a17.0 17.0 0 0 1 -34 0 Z" fill="#E9F2F9" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /><path d="M50 50 V133.0 a17.0 17.0 0 0 0 34 0 V50" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M110 74.9 H144 V133.0 a17.0 17.0 0 0 1 -34 0 Z" fill="#E9F2F9" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /><path d="M110 50 V133.0 a17.0 17.0 0 0 0 34 0 V50" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="67" y="40" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Na₂SO₄</text><text x="127" y="40" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >BaCl₂</text><text x="97" y="172" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >(both clear)</text><text x="180" y="100" font-size="30" fill="#2B2F4A" text-anchor="middle" font-weight="700" >→</text><path d="M240 81.5 H290 V155.0 a25.0 25.0 0 0 1 -50 0 Z" fill="#E9F2F9" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /><path d="M242 147.0 Q265.0 137.0 288 147.0 V155.0 a23.0 23.0 0 0 1 -46 0 Z" fill="#FFFFFF" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /><path d="M240 50 V155.0 a25.0 25.0 0 0 0 50 0 V50" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><g><circle cx="255" cy="100" r="3" fill="#fff" stroke="#9AA0B5" stroke-width="1.2" class="bu" style="animation-duration:2.6s;animation-direction:reverse;animation-delay:0.0s"/><circle cx="272" cy="90" r="3" fill="#fff" stroke="#9AA0B5" stroke-width="1.2" class="bu" style="animation-duration:2.6s;animation-direction:reverse;animation-delay:0.4s"/><circle cx="263" cy="115" r="3" fill="#fff" stroke="#9AA0B5" stroke-width="1.2" class="bu" style="animation-duration:2.6s;animation-direction:reverse;animation-delay:0.8s"/><circle cx="250" cy="125" r="3" fill="#fff" stroke="#9AA0B5" stroke-width="1.2" class="bu" style="animation-duration:2.6s;animation-direction:reverse;animation-delay:1.2000000000000002s"/></g><text x="265" y="206" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >white precipitate</text><text x="265" y="222" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >BaSO₄ + NaCl solution</text><text x="330" y="100" font-size="11" fill="#E5484D" text-anchor="middle" font-weight="700" >insoluble</text></svg>