<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>Colourless solution with a white precipitate at the bottom</title><style>text{font-family:sans-serif;fill:#2B2F4A}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.88,1.14)}}.bu{animation:bu 2.4s linear infinite}@keyframes bu{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-52px);opacity:0}}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.45}to{opacity:1}}.wv{animation:wv 2s ease-in-out infinite}@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M78 38.4 H122 V100.0 a22.0 22.0 0 0 1 -44 0 Z" fill="#E9F2F9" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /><path d="M80 92.0 Q100.0 82.0 120 92.0 V100.0 a20.0 20.0 0 0 1 -40 0 Z" fill="#FFFFFF" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /><path d="M78 12 V100.0 a22.0 22.0 0 0 0 44 0 V12" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="100" y="142" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >white solid at the bottom</text></svg>