<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Zinc granules in dilute acid in a conical flask, bubbles of gas rising and a thermometer showing a rise</title><style>text{font-family:sans-serif;fill:#2B2F4A}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.88,1.14)}}.bu{animation:bu 2.4s linear infinite}@keyframes bu{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-52px);opacity:0}}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.45}to{opacity:1}}.wv{animation:wv 2s ease-in-out infinite}@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M150 150 H250 L270 200 Q275 218 255 218 H145 Q125 218 130 200 Z" fill="#CFE9F7" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round" /><path d="M178 38 V90 L130 200 Q123 220 145 220 H255 Q277 220 270 200 L222 90 V38" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="165" cy="205" r="7" fill="#8A90A8" stroke="#4A4D5E" stroke-width="2" /><circle cx="192" cy="208" r="7" fill="#8A90A8" stroke="#4A4D5E" stroke-width="2" /><circle cx="220" cy="205" r="7" fill="#8A90A8" stroke="#4A4D5E" stroke-width="2" /><circle cx="240" cy="208" r="7" fill="#8A90A8" stroke="#4A4D5E" stroke-width="2" /><circle cx="188" cy="168" r="4.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" /><circle cx="214" cy="162" r="4.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" /><circle cx="202" cy="182" r="4.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" /><circle cx="228" cy="176" r="4.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" /><circle cx="175" cy="196" r="4.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" class="bu" style="animation-delay:0.00s;animation-duration:2.6s"/><circle cx="200" cy="196" r="4.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" class="bu" style="animation-delay:0.52s;animation-duration:2.6s"/><circle cx="225" cy="196" r="4.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" class="bu" style="animation-delay:1.04s;animation-duration:2.6s"/><circle cx="190" cy="196" r="4.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" class="bu" style="animation-delay:1.56s;animation-duration:2.6s"/><circle cx="215" cy="196" r="4.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" class="bu" style="animation-delay:2.08s;animation-duration:2.6s"/><rect x="318" y="50" width="14" height="130" rx="7" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><circle cx="325" cy="192" r="13" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" /><rect x="322" y="100" width="6" height="86" fill="#E5484D"/><rect class="pu" x="322" y="84" width="6" height="16" fill="#E5484D"/><text x="325" y="36" font-size="10" fill="#2B2F4A" text-anchor="middle" font-weight="700" >thermometer</text><text x="70" y="120" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >dilute acid</text><text x="70" y="134" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >+ zinc</text></svg>