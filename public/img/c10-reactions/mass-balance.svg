<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A balanced see-saw with reactants on one side and products on the other</title><style>text{font-family:sans-serif;fill:#2B2F4A}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.88,1.14)}}.bu{animation:bu 2.4s linear infinite}@keyframes bu{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-52px);opacity:0}}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.45}to{opacity:1}}.wv{animation:wv 2s ease-in-out infinite}@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.tilt{transform-box:fill-box;transform-origin:50% 50%;animation:tl 3s ease-in-out infinite alternate}@keyframes tl{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><line x1="200" y1="70" x2="200" y2="200" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round" /><rect x="150" y="196" width="100" height="16" rx="6" fill="#B8BCCB" stroke="#2B2F4A" stroke-width="3" /><g class="tilt"><line x1="80" y1="70" x2="320" y2="70" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round" /><path d="M80 70 L60 110 H100Z" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M320 70 L300 110 H340Z" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="46" y="112" width="68" height="34" rx="6" fill="#FFE2B8" stroke="#FF8A1F" stroke-width="3" /><text x="80" y="134" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >reactants</text><rect x="286" y="112" width="68" height="34" rx="6" fill="#CFEFD2" stroke="#3FA34D" stroke-width="3" /><text x="320" y="134" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >products</text></g><text x="200" y="40" font-size="14" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Mass of reactants = mass of products</text><text x="200" y="232" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >(sealed container)</text></svg>