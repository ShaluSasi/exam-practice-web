<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Limestone heated strongly; carbon dioxide rises and quicklime remains</title><style>text{font-family:sans-serif;fill:#2B2F4A}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.88,1.14)}}.bu{animation:bu 2.4s linear infinite}@keyframes bu{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-52px);opacity:0}}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.45}to{opacity:1}}.wv{animation:wv 2s ease-in-out infinite}@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="150" y="150" width="100" height="40" rx="8" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><path d="M160 150 Q200 110 240 150" fill="#F0F0F0" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="200" y="176" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >CaCO₃</text><g class="fl"><path d="M200 177.8 C218.2 201.2 220.8 216.8 200 222 C179.2 216.8 181.8 201.2 200 177.8Z" fill="#FF8A1F"/><path d="M200 198.6 C209.1 210.3 209.1 219.4 200 222 C190.9 219.4 190.9 210.3 200 198.6Z" fill="#F6C453"/></g><g class="fl"><path d="M175 188 C189 206 191 218 175 222 C159 218 161 206 175 188Z" fill="#FF8A1F"/><path d="M175 204 C182 213 182 220 175 222 C168 220 168 213 175 204Z" fill="#F6C453"/></g><g class="fl"><path d="M225 188 C239 206 241 218 225 222 C209 218 211 206 225 188Z" fill="#FF8A1F"/><path d="M225 204 C232 213 232 220 225 222 C218 220 218 213 225 204Z" fill="#F6C453"/></g><line x1="150" y1="196" x2="250" y2="196" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" transform="translate(0,6)"/><g class="wv" style="animation-delay:0.0s"><path d="M186 120 q5 -6 0 -1