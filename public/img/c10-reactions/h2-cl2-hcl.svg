<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A hydrogen molecule and a chlorine molecule forming two hydrogen chloride molecules</title><style>text{font-family:sans-serif;fill:#2B2F4A}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.88,1.14)}}.bu{animation:bu 2.4s linear infinite}@keyframes bu{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-52px);opacity:0}}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.45}to{opacity:1}}.wv{animation:wv 2s ease-in-out infinite}@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><circle cx="46" cy="100" r="13" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><text x="46" y="104.32" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >H</text><circle cx="70" cy="100" r="13" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><text x="70" y="104.32" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >H</text><text x="58" y="150" font-size="14" fill="#2B2F4A" text-anchor="middle" font-weight="700" >H₂</text><text x="100" y="106" font-size="22" fill="#2B2F4A" text-anchor="middle" font-weight="700" >+</text><circle cx="138" cy="100" r="22" fill="#7BC47F" stroke="#2B2F4A" stroke-width="2" /><text x="138" y="104.68" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Cl</text><circle cx="180" cy="100" r="22" fill="#7BC47F" stroke="#2B2F4A" stroke-width="2" /><text x="180" y="104.68" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Cl</text><text x="159" y="150" font-size="14" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Cl₂</text><line x1="222" y1="100" x2="262" y2="100" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><path d="M254.1 104.3 L262 100 L254.1 95.7" fill="none" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><g class="pu"><circle cx="290" cy="80" r="13" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><text x="290" y="84.32" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >H</text><circle cx="320" cy="80" r="22" fill="#7BC47F" stroke="#2B2F4A" stroke-width="2" /><text x="320" y="84.68" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Cl</text><circle cx="290" cy="130" r="13" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><text x="290" y="134.32" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >H</text><circle cx="320" cy="130" r="22" fill="#7BC47F" stroke="#2B2F4A" stroke-width="2" /><text x="320" y="134.68" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Cl</text></g><text x="305" y="176" font-size="14" fill="#2B2F4A" text-anchor="middle" font-weight="700" >2 HCl</text><text x="200" y="36" font-size="14" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Hydrogen + Chlorine → Hydrogen chloride</text></svg>