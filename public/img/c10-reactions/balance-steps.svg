<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Boxes drawn round the formulae Fe, H2O, Fe3O4 and H2 with a table counting the atoms of Fe, H and O on each side</title><style>text{font-family:sans-serif;fill:#2B2F4A}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.88,1.14)}}.bu{animation:bu 2.4s linear infinite}@keyframes bu{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-52px);opacity:0}}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.45}to{opacity:1}}.wv{animation:wv 2s ease-in-out infinite}@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="30" y="24" width="44" height="34" rx="6" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="52.0" y="47" font-size="15" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Fe</text><rect x="105" y="24" width="64" height="34" rx="6" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="137.0" y="47" font-size="15" fill="#2B2F4A" text-anchor="middle" font-weight="700" >H₂O</text><rect x="215" y="24" width="78" height="34" rx="6" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="254.0" y="47" font-size="15" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Fe₃O₄</text><rect x="320" y="24" width="50" height="34" rx="6" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="345.0" y="47" font-size="15" fill="#2B2F4A" text-anchor="middle" font-weight="700" >H₂</text><text x="92" y="47" font-size="18" fill="#2B2F4A" text-anchor="middle" font-weight="700" >+</text><text x="197" y="47" font-size="20" fill="#2B2F4A" text-anchor="middle" font-weight="700" >→</text><text x="302" y="47" font-size="18" fill="#2B2F4A" text-anchor="middle" font-weight="700" >+</text><rect x="60" y="78" width="280" height="138" rx="10" fill="#fff" stroke="#E3D9C2" stroke-width="2" /><text x="120" y="100" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Atoms</text><text x="200" y="100" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >LHS</text><text x="280" y="100" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >RHS</text><text x="120" y="128" font-size="15" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Fe</text><text x="200" y="128" font-size="15" fill="#2B2F4A" text-anchor="middle" font-weight="700" >1</text><text x="280" y="128" font-size="15" fill="#E5484D" text-anchor="middle" font-weight="700" >3</text><text x="120" y="160" font-size="15" fill="#2B2F4A" text-anchor="middle" font-weight="700" >H</text><text x="200" y="160" font-size="15" fill="#2B2F4A" text-anchor="middle" font-weight="700" >2</text><text x="280" y="160" font-size="15" fill="#3FA34D" text-anchor="middle" font-weight="700" >2</text><text x="120" y="192" font-size="15" fill="#2B2F4A" text-anchor="middle" font-weight="700" >O</text><text x="200" y="192" font-size="15" fill="#2B2F4A" text-anchor="middle" font-weight="700" >1</text><text x="280" y="192" font-size="15" fill="#E5484D" text-anchor="middle" font-weight="700" >4</text><rect class="pu" x="76" y="170" width="248" height="32" rx="8" fill="none" stroke="#FF8A1F" stroke-width="3"/></svg>