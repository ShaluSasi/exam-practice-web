roke="#2B2F4A" stroke-width="2" /><g class="fl"><path d="M150 151.2 C166.8 172.8 169.2 187.2 150 192 C130.8 187.2 133.2 172.8 150 151.2Z" fill="#FF8A1F"/><path d="M150 170.4 C158.4 181.2 158.4 189.6 150 192 C141.6 189.6 141.6 181.2 150 170.4Z" fill="#F6C453"/></g><g class="wv" style="animation-delay:0.0s"><path d="M263 79 q6 -7 0 -14 t0 -14" fill="none" stroke="#8E8FA6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g class="wv" style="animation-delay:0.6s"><path d="M277 71 q6 -7 0 -14 t0 -14" fill="none" stroke="#8E8FA6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g class="wv" style="animation-delay:1.2s"><path d="M291 63 q6 -7 0 -14 t0 -14" fill="none" stroke="#8E8FA6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="338" y="45.009734643884485" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >SO₂ + SO₃</text><text x="338" y="59.009734643884485" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >(choking smell)</text><text x="58" y="28" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Before</text><rect x="34" y="36" width="48" height="26" rx="4" fill="#7BC47F" stroke="#2A7A35" stroke-width="2" /><line x1="58" y1="66" x2="58" y2="92" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M53.7 84.1 L58 92 L62.3 84.1" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="58" y="108" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >After</text><rect x="34" y="116" width="48" height="26" rx="4" fill="#B5651D" stroke="#7A430F" stroke-width="2" /></svg>