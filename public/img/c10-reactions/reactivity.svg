<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A ladder of metals: zinc at the top, then iron, lead and copper at the bottom</title><style>text{font-family:sans-serif;fill:#2B2F4A}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.88,1.14)}}.bu{animation:bu 2.4s linear infinite}@keyframes bu{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-52px);opacity:0}}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.45}to{opacity:1}}.wv{animation:wv 2s ease-in-out infinite}@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><line x1="60" y1="215" x2="60" y2="30" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M64.3 37.9 L60 30 L55.7 37.9" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="60" y="22" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >more reactive</text><rect x="110" y="36" width="180" height="34" rx="8" fill="#9AB6D8" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="59" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >Zinc</text><rect x="110" y="82" width="180" height="34" rx="8" fill="#8A90A8" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="105" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >Iron</text><rect x="110" y="128" width="180" height="34" rx="8" fill="#7A7F90" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="151" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >Lead</text><rect x="110" y="174" width="180" height="34" rx="8" fill="#C77B3A" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="197" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >Copper</text><text x="200" y="232" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >A more reactive metal displaces a less reactive one</text></svg>