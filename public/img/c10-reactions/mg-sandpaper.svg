<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Magnesium ribbon with a dull oxide layer being rubbed with sandpaper to show shiny metal</title><style>text{font-family:sans-serif;fill:#2B2F4A}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.88,1.14)}}.bu{animation:bu 2.4s linear infinite}@keyframes bu{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-52px);opacity:0}}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.45}to{opacity:1}}.wv{animation:wv 2s ease-in-out infinite}@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}@keyframes sl{to{transform:translateX(-120px)}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="40" y="130" width="320" height="26" rx="6" fill="#D4D9E4" stroke="#2B2F4A" stroke-width="3" /><rect x="210" y="130" width="150" height="26" rx="6" fill="#BDB9AE" stroke="#2B2F4A" stroke-width="3" /><rect x="48" y="134" width="150" height="5" rx="2" fill="#fff" stroke="none" stroke-width="0" /><text x="120" y="184" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >shiny metal</text><text x="285" y="184" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >dull oxide layer</text><g style="animation:sl 2s ease-in-out infinite alternate"><rect x="220" y="84" width="70" height="34" rx="5" fill="#E0BE94" stroke="#B08A5C" stroke-width="3" /><circle cx="232" cy="96" r="1.8" fill="#B08A5C" stroke="none" stroke-width="2" /><circle cx="243" cy="103" r="1.8" fill="#B08A5C" stroke="none" stroke-width="2" /><circle cx="254" cy="110" r="1.8" fill="#B08A5C" stroke="none" stroke-width="2" /><circle cx="265" cy="101" r="1.8" fill="#B08A5C" stroke="none" stroke-width="2" /><circle cx="276" cy="108" r="1.8" fill="#B08A5C" stroke="none" stroke-width="2" /></g><text x="200" y="40" font-size="13" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Rub the ribbon with sandpaper</text></svg>