<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Two iron nails: the unpainted one is covered in reddish-brown rust, the painted one stays shiny</title><style>text{font-family:sans-serif;fill:#2B2F4A}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.88,1.14)}}.bu{animation:bu 2.4s linear infinite}@keyframes bu{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-52px);opacity:0}}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.45}to{opacity:1}}.wv{animation:wv 2s ease-in-out infinite}@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="8" y="8" width="186" height="224" rx="12" fill="#fff" stroke="#E3D9C2" stroke-width="2" /><rect x="206" y="8" width="186" height="224" rx="12" fill="#fff" stroke="#E3D9C2" stroke-width="2" /><rect x="86" y="40" width="30" height="150" rx="8" fill="#B5651D" stroke="#2B2F4A" stroke-width="3" /><circle cx="101" cy="40" r="18" fill="#B5651D" stroke="#2B2F4A" stroke-width="3" /><text x="101" y="214" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >unpainted</text><circle cx="90" cy="60" r="3" fill="#7A3A10" stroke="none" stroke-width="2" /><circle cx="103" cy="78" r="3" fill="#7A3A10" stroke="none" stroke-width="2" /><circle cx="94" cy="96" r="3" fill="#7A3A10" stroke="none" stroke-width="2" /><circle cx="107" cy="114" r="3" fill="#7A3A10" stroke="none" stroke-width="2" /><circle cx="98" cy="132" r="3" fill="#7A3A10" stroke="none" stroke-width="2" /><circle cx="111" cy="150" r="3" fill="#7A3A10" stroke="none" stroke-width="2" /><circle cx="102" cy="168" r="3" fill="#7A3A10" stroke="none" stroke-width="2" /><g class="pu"><circle cx="40" cy="80" r="5" fill="#E5484D" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="160" cy="100" r="5" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="50" cy="150" r="5" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5" /></g><rect x="284" y="40" width="30" height="150" rx="8" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" /><circle cx="299" cy="40" r="18" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" /><rect x="288" y="46" width="6" height="130" rx="3" fill="#FFF" stroke="none" stroke-width="0" /><text x="299" y="214" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >painted</text><g class="pu"><circle cx="250" cy="80" r="5" fill="#E5484D" stroke="#2B2F4A" stroke-width="1.5" /><circle cx="350" cy="100" r="5" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5" /></g></svg>