<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Glucose and oxygen reacting inside a cell to give carbon dioxide, water and energy</title><style>text{font-family:sans-serif;fill:#2B2F4A}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.88,1.14)}}.bu{animation:bu 2.4s linear infinite}@keyframes bu{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-52px);opacity:0}}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.45}to{opacity:1}}.wv{animation:wv 2s ease-in-out infinite}@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M50 120 C50 40 350 40 350 120 C350 200 50 200 50 120Z" fill="#FFF1DC" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M110 90 l16 -9 l16 9 v18 l-16 9 l-16 -9Z" fill="#FFB27A" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><text x="126" y="104" font-size="9" fill="#2B2F4A" text-anchor="middle" font-weight="700" >glu</text><text x="126" y="134" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >C₆H₁₂O₆</text><circle cx="170" cy="100" r="10" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" /><circle cx="188" cy="100" r="10" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" /><text x="180" y="134" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >O₂</text><line x1="210" y1="105" x2="246" y2="105" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M238.1 109.3 L246 105 L238.1 100.7" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="262" cy="92" r="9" fill="#8A90A8" stroke="#2B2F4A" stroke-width="2" /><circle cx="280" cy="92" r="9" fill="#8A90A8" stroke="#2B2F4A" stroke-width="2" /><text x="271" y="122" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >CO₂</text><circle cx="312" cy="98" r="8" fill="#7FC4EA" stroke="#2B2F4A" stroke-width="2" /><text x="312" y="122" font-size="11" fill="#2B2F4A" text-anchor="middle" font-weight="700" >H₂O</text><g class="pu"><path d="M200 140 l6 -14 l6 10 l6 -12 l6 16" fill="none" stroke="#F6C453" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /></g><text x="206" y="162" font-size="12" fill="#FF8A1F" text-anchor="middle" font-weight="700" >ENERGY</text><text x="200" y="22" font-size="14" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Inside a cell: respiration</text></svg>