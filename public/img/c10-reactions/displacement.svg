<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Zinc displacing copper from copper sulphate to give zinc sulphate and copper</title><style>text{font-family:sans-serif;fill:#2B2F4A}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.88,1.14)}}.bu{animation:bu 2.4s linear infinite}@keyframes bu{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-52px);opacity:0}}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.45}to{opacity:1}}.wv{animation:wv 2s ease-in-out infinite}@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="40" y="40" width="80" height="38" rx="6" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="80" y="64" font-size="15" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Zn</text><text x="140" y="64" font-size="20" fill="#2B2F4A" text-anchor="middle" font-weight="700" >+</text><rect x="160" y="40" width="110" height="38" rx="6" fill="#BFE3F5" stroke="#2B2F4A" stroke-width="3" /><text x="215" y="64" font-size="15" fill="#2B2F4A" text-anchor="middle" font-weight="700" >CuSO₄</text><text x="285" y="64" font-size="24" fill="#2B2F4A" text-anchor="middle" font-weight="700" >→</text><rect x="40" y="130" width="100" height="38" rx="6" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="90" y="154" font-size="15" fill="#2B2F4A" text-anchor="middle" font-weight="700" >ZnSO₄</text><text x="155" y="154" font-size="20" fill="#2B2F4A" text-anchor="middle" font-weight="700" >+</text><rect x="175" y="130" width="56" height="38" rx="6" fill="#C77B3A" stroke="#2B2F4A" stroke-width="3" /><text x="203" y="154" font-size="15" fill="#fff" text-anchor="middle" font-weight="700" >Cu</text><g class="pu"><line x1="110" y1="80" x2="150" y2="126" stroke="#E5484D" stroke-width="3" stroke-linecap="round" /><path d="M141.6 122.9 L150 126 L148.1 117.2" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="300" y="150" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >Zn takes the place</text><text x="300" y="166" font-size="12" fill="#2B2F4A" text-anchor="middle" font-weight="700" >of Cu in the salt</text></svg>