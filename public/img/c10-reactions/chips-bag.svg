<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A bag of chips filled with nitrogen gas that keeps oxygen out</title><style>text{font-family:sans-serif;fill:#2B2F4A}.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}@keyframes fl{to{transform:scale(.88,1.14)}}.bu{animation:bu 2.4s linear infinite}@keyframes bu{0%{transform:translateY(0);opacity:.95}100%{transform:translateY(-52px);opacity:0}}.pu{animation:pu 1.6s ease-in-out infinite alternate}@keyframes pu{from{opacity:.45}to{opacity:1}}.wv{animation:wv 2s ease-in-out infinite}@keyframes wv{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-22px);opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M110 50 L290 50 Q310 120 290 200 L110 200 Q90 120 110 50Z" fill="#FFD76E" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M110 50 l10 -12 l10 12 l10 -12 l10 12 l10 -12 l10 12 l10 -12 l10 12 l10 -12 l10 12 l10 -12 l10 12 l10 -12 l10 12" fill="#FFD76E" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="110" font-size="20" fill="#E5484D" text-anchor="middle" font-weight="700">CHIPS</text><g class="pu"><text x="150" y="150" font-size="11" fill="#0B93D4" text-anchor="middle" font-weight="700">N₂</text><text x="175" y="168" font-size="11" fill="#0B93D4" text-anchor="middle" font-weight="700">N₂</text><text x="200" y="150" font-size="11" fill="#0B93D4" text-anchor="middle" font-weight="700">N₂</text><text x="225" y="168" font-size="11" fill="#0B93D4" text-anchor="middle" font-weight="700">N₂</text><text x="250" y="150" font-size="11" fill="#0B93D4" text-anchor="middle" font-weight="700">N₂</text></g><text x="352" y="110" font-size="11" fill="#E5484D" text-anchor="middle" font-weight="700">O₂ kept</text><text x="352" y="124" font-size="11" fill="#E5484D" text-anchor="middle" font-weight="700">out</text><text x="70" y="222" font-size="10.5" fill="#2B2F4A" text-anchor="middle" font-weight="700">Bag flushed with nitrogen</text></svg>