<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A balance with golden hair in one pan and a heart in the other</title><style>
.fl{animation:fl 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.8,1.25)}}
.sw{animation:sw 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sw{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.bob{animation:bob 2.2s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.tw{animation:tw 1.6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:1}to{opacity:.25}}
.rot{animation:rot 24s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes rot{to{transform:rotate(360deg)}}
.dr{animation:dr 4s ease-in-out infinite alternate}
@keyframes dr{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
.fall{animation:fall 2s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}20%{opacity:1}100%{transform:translateY(22px);opacity:0}}
.pu{animation:pu 1.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pu{from{transform:scale(1)}to{transform:scale(1.12)}}
.d2{animation-delay:.5s}.d3{animation-delay:1s}.d4{animation-delay:1.5s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M16 0H384Q400 0 400 16V190H0V16Q0 0 16 0Z" fill="#F1F6FF"/><path d="M0 190H400V224Q400 240 384 240H16Q0 240 0 224Z" fill="#DDEFC8"/><rect x="194" y="50" width="12" height="140" rx="3" fill="#2B2F4A" /><line x1="80" y1="70" x2="320" y2="70" stroke="#2B2F4A" stroke-width="6" stroke-linecap="round" /><line x1="80" y1="70" x2="50" y2="110" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="80" y1="70" x2="110" y2="110" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><path d="M40 110H120Q110 132 80 132Q50 132 40 110Z" fill="#E5DCFF" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><line x1="320" y1="70" x2="290" y2="110" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><line x1="320" y1="70" x2="350" y2="110" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><path d="M280 110H360Q350 132 320 132Q290 132 280 110Z" fill="#E5DCFF" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><g transform="translate(80 108) scale(0.5)" ><path d="M-30 0Q-40 -40 -10 -60Q10 -70 30 -50Q44 -30 30 0Q10 -14 -10 -10Z" fill="#F2C230" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /></g><g transform="translate(320 100) scale(1.2)" ><path d="M0 14C-24 -2 -14 -20 0 -8C14 -20 24 -2 0 14Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /></g></svg>