nsform="translate(280 115) scale(0.7)" ><path d="M0 14C-24 -2 -14 -20 0 -8C14 -20 24 -2 0 14Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /></g><g transform="translate(320 115) scale(0.7)" ><path d="M0 14C-24 -2 -14 -20 0 -8C14 -20 24 -2 0 14Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /></g></svg>