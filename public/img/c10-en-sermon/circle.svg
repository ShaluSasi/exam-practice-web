<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Four people standing close with linked arms and a heart above them</title><style>
.fl{animation:fl 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.8,1.25)}}
.sw{animation:sw 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sw{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.bob{animation:bob 2.2s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.tw{animation:tw 1.6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:1}to{opacity:.25}}
.rot{animation:rot 24s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes rot{to{transform:rotate(360deg)}}
.dr{animation:dr 4s ease-in-out infinite alternate}
@keyframes dr{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
.fall{animation:fall 2s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}20%{opacity:1}100%{transform:translateY(22px);opacity:0}}
.pu{animation:pu 1.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pu{from{transform:scale(1)}to{transform:scale(1.12)}}
.d2{animation-delay:.5s}.d3{animation-delay:1s}.d4{animation-delay:1.5s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M16 0H384Q400 0 400 16V190H0V16Q0 0 16 0Z" fill="#FFF0F3"/><path d="M0 190H400V224Q400 240 384 240H16Q0 240 0 224Z" fill="#DDEFC8"/><g transform="translate(100 190) scale(1.2)" class="bob d2" ><line x1="-10" y1="-26" x2="-4" y2="-14" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="10" y1="-26" x2="4" y2="-14" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M-12 0L-9 -30Q0 -36 9 -30L12 0Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="0" cy="-42" r="9" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="3"/><path d="M-9 -44Q0 -56 9 -44Q0 -48 -9 -44Z" fill="#4A3426" stroke="#4A3426" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" /></g><g transform="translate(170 190) scale(1.2)" class="bob d3" ><line x1="-10" y1="-26" x2="-4" y2="-14" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="10" y1="-26" x2="4" y2="-14" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M-12 0L-9 -30Q0 -36 9 -30L12 0Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="0" cy="-42" r="9" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="3"/><path d="M-9 -44Q0 -56 9 -44Q0 -48 -9 -44Z" fill="#4A3426" stroke="#4A3426" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" /></g><g transform="translate(240 190) scale(1.2)" class="bob d4" ><line x1="-10" y1="-26" x2="-4" y2="-14" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="10" y1="-26" x2="4" y2="-14" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M-12 0L-9 -30Q0 -36 9 -30L12 0Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="0" cy="-42" r="9" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="3"/><path d="M-9 -44Q0 -56 9 -44Q0 -48 -9 -44Z" fill="#4A3426" stroke="#4A3426" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" /></g><g transform="translate(310 190) scale(1.2)" class="bob d2" ><line x1="-10" y1="-26" x2="-4" y2="-14" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="10" y1="-26" x2="4" y2="-14" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M-12 0L-9 -30Q0 -36 9 -30L12 0Z" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="0" cy="-42" r="9" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="3"/><path d="M-9 -44Q0 -56 9 -44Q0 -48 -9 -44Z" fill="#4A3426" stroke="#4A3426" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" /></g><line x1="121" y1="164" x2="149" y2="164" stroke="#F2C9A0" stroke-width="4" stroke-linecap="round" /><line x1="191" y1="164" x2="219" y2="164" stroke="#F2C9A0" stroke-width="4" stroke-linecap="round" /><line x1="261" y1="164" x2="289" y2="164" stroke="#F2C9A0" stroke-width="4" stroke-linecap="round" /><g transform="translate(205 80) scale(1.8)" ><path d="M0 14C-24 -2 -14 -20 0 -8C14 -20 24 -2 0 14Z" fill="#FF8AA8" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /></g></svg>