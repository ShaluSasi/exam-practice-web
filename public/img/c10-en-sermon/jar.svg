<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A large clay jar filled with tiny yellow seeds, with sparkles around it</title><style>
.fl{animation:fl 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.8,1.25)}}
.sw{animation:sw 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sw{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.bob{animation:bob 2.2s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.tw{animation:tw 1.6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:1}to{opacity:.25}}
.rot{animation:rot 24s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes rot{to{transform:rotate(360deg)}}
.dr{animation:dr 4s ease-in-out infinite alternate}
@keyframes dr{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
.fall{animation:fall 2s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}20%{opacity:1}100%{transform:translateY(22px);opacity:0}}
.pu{animation:pu 1.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pu{from{transform:scale(1)}to{transform:scale(1.12)}}
.d2{animation-delay:.5s}.d3{animation-delay:1s}.d4{animation-delay:1.5s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M16 0H384Q400 0 400 16V190H0V16Q0 0 16 0Z" fill="#FFF3D6"/><path d="M0 190H400V224Q400 240 384 240H16Q0 240 0 224Z" fill="#E9D6A8"/><g transform="translate(200 185) scale(3.4)" ><path d="M-14 -34Q-26 -30 -26 -14Q-26 2 -14 2H14Q26 2 26 -14Q26 -30 14 -34Z" fill="#D98F4E" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="-12" y="-42" width="24" height="10" rx="3" fill="#B8743A" stroke="#2B2F4A" stroke-width="3" /><circle cx="-14" cy="-18" r="2.6" fill="#E8B923" stroke="#8A6A00" stroke-width="1"/><circle cx="-4" cy="-22" r="2.6" fill="#E8B923" stroke="#8A6A00" stroke-width="1"/><circle cx="8" cy="-16" r="2.6" fill="#E8B923" stroke="#8A6A00" stroke-width="1"/><circle cx="-8" cy="-8" r="2.6" fill="#E8B923" stroke="#8A6A00" stroke-width="1"/><circle cx="12" cy="-6" r="2.6" fill="#E8B923" stroke="#8A6A00" stroke-width="1"/><circle cx="2" cy="-12" r="2.6" fill="#E8B923" stroke="#8A6A00" stroke-width="1"/><circle cx="-16" cy="-6" r="2.6" fill="#E8B923" stroke="#8A6A00" stroke-width="1"/></g><circle cx="70" cy="80" r="5.0" fill="#E8B923" class="tw"/><circle cx="330" cy="70" r="5.0" fill="#E8B923" class="tw"/><circle cx="90" cy="150" r="5.0" fill="#E8B923" class="tw"/><circle cx="320" cy="150" r="5.0" fill="#E8B923" class="tw"/><g transform="translate(70 200) scale(1.2)" ><path d="M-24 -10Q-22 10 0 10Q22 10 24 -10Z" fill="#C9743A" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M-20 -10Q-10 -24 0 -24Q10 -24 20 -10Z" fill="#E8B923" stroke="#8A6A00" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><circle cx="-10" cy="-14" r="2" fill="#8A6A00"/><circle cx="0" cy="-18" r="2" fill="#8A6A00"/><circle cx="9" cy="-13" r="2" fill="#8A6A00"/><circle cx="-3" cy="-10" r="2" fill="#8A6A00"/></g></svg>