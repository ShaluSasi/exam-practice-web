<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Three clause boxes separated by two semicolons</title><style>
.fl{animation:fl 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.8,1.25)}}
.sw{animation:sw 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sw{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.bob{animation:bob 2.2s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.tw{animation:tw 1.6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:1}to{opacity:.25}}
.rot{animation:rot 24s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes rot{to{transform:rotate(360deg)}}
.dr{animation:dr 4s ease-in-out infinite alternate}
@keyframes dr{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
.fall{animation:fall 2s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}20%{opacity:1}100%{transform:translateY(22px);opacity:0}}
.pu{animation:pu 1.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pu{from{transform:scale(1)}to{transform:scale(1.12)}}
.d2{animation-delay:.5s}.d3{animation-delay:1s}.d4{animation-delay:1.5s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="14" y="70" width="96" height="70" rx="12" fill="#E8F4FF" stroke="#2B2F4A" stroke-width="3" /><text x="62" y="112" font-family="sans-serif" font-size="15" font-weight="700" fill="#2B2F4A" text-anchor="middle">clause 1</text><rect x="152" y="70" width="96" height="70" rx="12" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="112" font-family="sans-serif" font-size="15" font-weight="700" fill="#2B2F4A" text-anchor="middle">clause 2</text><rect x="290" y="70" width="96" height="70" rx="12" fill="#EAF7E6" stroke="#2B2F4A" stroke-width="3" /><text x="338" y="112" font-family="sans-serif" font-size="15" font-weight="700" fill="#2B2F4A" text-anchor="middle">clause 3</text><text x="131" y="112" font-family="sans-serif" font-size="40" font-weight="700" fill="#7C5CFF" text-anchor="middle">;</text><text x="269" y="112" font-family="sans-serif" font-size="40" font-weight="700" fill="#7C5CFF" text-anchor="middle">;</text><text x="200" y="190" font-family="sans-serif" font-size="15" font-weight="700" fill="#6B7090" text-anchor="middle">One sentence, two semicolons</text></svg>