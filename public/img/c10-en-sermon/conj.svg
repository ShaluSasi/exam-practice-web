<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Two clause boxes and five joining-word tags</title><style>
.fl{animation:fl 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.8,1.25)}}
.sw{animation:sw 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sw{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.bob{animation:bob 2.2s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.tw{animation:tw 1.6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:1}to{opacity:.25}}
.rot{animation:rot 24s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes rot{to{transform:rotate(360deg)}}
.dr{animation:dr 4s ease-in-out infinite alternate}
@keyframes dr{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
.fall{animation:fall 2s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}20%{opacity:1}100%{transform:translateY(22px);opacity:0}}
.pu{animation:pu 1.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pu{from{transform:scale(1)}to{transform:scale(1.12)}}
.d2{animation-delay:.5s}.d3{animation-delay:1s}.d4{animation-delay:1.5s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="14" y="24" width="150" height="60" rx="12" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><rect x="236" y="24" width="150" height="60" rx="12" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><text x="89" y="60" font-family="sans-serif" font-size="18" font-weight="700" fill="#2B2F4A" text-anchor="middle">Clause 1</text><text x="311" y="60" font-family="sans-serif" font-size="18" font-weight="700" fill="#2B2F4A" text-anchor="middle">Clause 2</text><rect x="24" y="120" width="64" height="40" rx="20" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" /><text x="56" y="147" font-family="sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">and</text><rect x="98" y="120" width="64" height="40" rx="20" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" /><text x="130" y="147" font-family="sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">or</text><rect x="172" y="120" width="64" height="40" rx="20" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" /><text x="204" y="147" font-family="sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">but</text><rect x="246" y="120" width="64" height="40" rx="20" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="3" /><text x="278" y="147" font-family="sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">yet</text><rect x="320" y="120" width="64" height="40" rx="20" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" /><text x="352" y="147" font-family="sans-serif" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">then</text><path d="M164 54Q200 26 236 54" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6"/><text x="200" y="40" font-family="sans-serif" font-size="24" font-weight="700" fill="#7C5CFF" text-anchor="middle">?</text><text x="200" y="200" font-family="sans-serif" font-size="16" font-weight="700" fill="#6B7090" text-anchor="middle">Joining words</text></svg>