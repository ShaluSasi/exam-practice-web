<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A woman walking along a footpath towards a large tree</title><style>
.fl{animation:fl 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.8,1.25)}}
.sw{animation:sw 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sw{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.bob{animation:bob 2.2s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.tw{animation:tw 1.6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:1}to{opacity:.25}}
.rot{animation:rot 24s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes rot{to{transform:rotate(360deg)}}
.dr{animation:dr 4s ease-in-out infinite alternate}
@keyframes dr{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
.fall{animation:fall 2s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}20%{opacity:1}100%{transform:translateY(22px);opacity:0}}
.pu{animation:pu 1.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pu{from{transform:scale(1)}to{transform:scale(1.12)}}
.d2{animation-delay:.5s}.d3{animation-delay:1s}.d4{animation-delay:1.5s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
