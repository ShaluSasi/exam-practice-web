<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A rigid staircase on the left and a free winding path on the right</title><style>
.fl{animation:fl 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.8,1.25)}}
.sw{animation:sw 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sw{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.bob{animation:bob 2.2s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.tw{animation:tw 1.6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:1}to{opacity:.25}}
.rot{animation:rot 24s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes rot{to{transform:rotate(360deg)}}
.dr{animation:dr 4s ease-in-out infinite alternate}
@keyframes dr{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
.fall{animation:fall 2s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}20%{opacity:1}100%{transform:translateY(22px);opacity:0}}
.pu{animation:pu 1.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pu{from{transform:scale(1)}to{transform:scale(1.12)}}
.d2{animation-delay:.5s}.d3{animation-delay:1s}.d4{animation-delay:1.5s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M16 0H384Q400 0 400 16V190H0V16Q0 0 16 0Z" fill="#F3EEFF"/><path d="M0 190H400V224Q400 240 384 240H16Q0 240 0 224Z" fill="#DDEFC8"/><rect x="24" y="160" width="30" height="50" rx="4" fill="#E5DCFF" stroke="#2B2F4A" stroke-width="3" /><rect x="54" y="138" width="30" height="72" rx="4" fill="#E5DCFF" stroke="#2B2F4A" stroke-width="3" /><rect x="84" y="116" width="30" height="94" rx="4" fill="#E5DCFF" stroke="#2B2F4A" stroke-width="3" /><rect x="114" y="94" width="30" height="116" rx="4" fill="#E5DCFF" stroke="#2B2F4A" stroke-width="3" /><path d="M170 200Q230 130 270 170T380 110" fill="none" stroke="#D9C79E" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" /><g transform="translate(300 168) scale(0.9)" class="bob" ><line x1="-10" y1="-26" x2="-15" y2="-10" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="10" y1="-26" x2="15" y2="-10" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M-12 0L-9 -30Q0 -36 9 -30L12 0Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="0" cy="-42" r="9" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="3"/><path d="M-9 -44Q0 -56 9 -44Q0 -48 -9 -44Z" fill="#4A3426" stroke="#4A3426" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" /></g><text x="80" y="40" font-family="sans-serif" font-size="16" font-weight="700" fill="#7C5CFF" text-anchor="middle">fixed steps?</text><text x="300" y="40" font-family="sans-serif" font-size="16" font-weight="700" fill="#3FA34D" text-anchor="middle">own way?</text></svg>