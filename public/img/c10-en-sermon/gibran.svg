<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A wine cup, a lute, a clay oven with fire and a well</title><style>
.fl{animation:fl 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.8,1.25)}}
.sw{animation:sw 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sw{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.bob{animation:bob 2.2s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.tw{animation:tw 1.6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:1}to{opacity:.25}}
.rot{animation:rot 24s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes rot{to{transform:rotate(360deg)}}
.dr{animation:dr 4s ease-in-out infinite alternate}
@keyframes dr{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
.fall{animation:fall 2s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}20%{opacity:1}100%{transform:translateY(22px);opacity:0}}
.pu{animation:pu 1.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pu{from{transform:scale(1)}to{transform:scale(1.12)}}
.d2{animation-delay:.5s}.d3{animation-delay:1s}.d4{animation-delay:1.5s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M16 0H384Q400 0 400 16V190H0V16Q0 0 16 0Z" fill="#FFF3D6"/><path d="M0 190H400V224Q400 240 384 240H16Q0 240 0 224Z" fill="#E9D6A8"/><path d="M50 110H110Q110 150 80 150Q50 150 50 110Z" fill="#F2F2F7" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M110 118Q128 118 124 134Q120 142 108 140" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="48" y="106" width="64" height="8" rx="3" fill="#B02A3A" stroke="#2B2F4A" stroke-width="3" /><path class="tw" d="M70 96q-4 -10 2 -16M88 96q-4 -10 2 -16" fill="none" stroke="#9AA5B8" stroke-width="3" stroke-linecap="round"/><g transform="rotate(-25 205 130)"><ellipse cx="205" cy="160" rx="30" ry="40" fill="#C9743A" stroke="#2B2F4A" stroke-width="3"/><circle cx="205" cy="160" r="9" fill="#2B2F4A"/><rect x="199" y="60" width="12" height="62" fill="#8B5E3C" stroke="#2B2F4A" stroke-width="3"/><rect x="195" y="50" width="20" height="14" rx="4" fill="#8B5E3C" stroke="#2B2F4A" stroke-width="3"/><line x1="202" y1="66" x2="202" y2="184" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" /><line x1="205" y1="66" x2="205" y2="184" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" /><line x1="208" y1="66" x2="208" y2="184" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" /></g><path d="M270 190V140Q320 80 370 140V190Z" fill="#C98F6A" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M296 190V160Q320 130 344 160V190Z" fill="#3B2A22" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path class="fl" d="M320 188Q306 172 320 150Q334 172 320 188Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2"/><rect x="90" y="200" width="80" height="30" rx="6" fill="#B9B4A8" stroke="#2B2F4A" stroke-width="3" /><path d="M100 200V180H160V200" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /></svg>