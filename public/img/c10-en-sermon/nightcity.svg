<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A night street with a lamp post, a lit house, a darker house, the moon and a woman sitting at the wayside</title><style>
.fl{animation:fl 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.8,1.25)}}
.sw{animation:sw 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sw{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.bob{animation:bob 2.2s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.tw{animation:tw 1.6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:1}to{opacity:.25}}
.rot{animation:rot 24s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes rot{to{transform:rotate(360deg)}}
.dr{animation:dr 4s ease-in-out infinite alternate}
@keyframes dr{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
.fall{animation:fall 2s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}20%{opacity:1}100%{transform:translateY(22px);opacity:0}}
.pu{animation:pu 1.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pu{from{transform:scale(1)}to{transform:scale(1.12)}}
.d2{animation-delay:.5s}.d3{animation-delay:1s}.d4{animation-delay:1.5s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="0" y="0" width="400" height="240" rx="16" fill="#1F2A4A" /><circle cx="330" cy="38" r="18" fill="#FFF3B0" stroke="#C9A200" stroke-width="3"/><circle cx="337" cy="34" r="15" fill="#1F2A4A"/><circle cx="40" cy="30" r="3.0" fill="#FFFFFF" class="tw"/><circle cx="100" cy="50" r="3.0" fill="#FFFFFF" class="tw"/><circle cx="180" cy="24" r="3.0" fill="#FFFFFF" class="tw"/><circle cx="250" cy="56" r="3.0" fill="#FFFFFF" class="tw"/><circle cx="380" cy="90" r="3.0" fill="#FFFFFF" class="tw"/><rect x="215" y="100" width="70" height="90" rx="3" fill="#394270" stroke="#0F1630" stroke-width="2" /><rect x="224" y="110" width="10" height="14" rx="2" fill="#FFC83D" class="tw d2"/><rect x="244" y="110" width="10" height="14" rx="2" fill="#FFC83D" class="tw d3"/><rect x="264" y="110" width="10" height="14" rx="2" fill="#FFC83D" class="tw d4"/><rect x="224" y="136" width="10" height="14" rx="2" fill="#FFC83D" class="tw d3"/><rect x="244" y="136" width="10" height="14" rx="2" fill="#FFC83D" class="tw d4"/><rect x="264" y="136" width="10" height="14" rx="2" fill="#FFC83D" class="tw d2"/><rect x="224" y="162" width="10" height="14" rx="2" fill="#FFC83D" class="tw d4"/><rect x="244" y="162" width="10" height="14" rx="2" fill="#FFC83D" class="tw d2"/><rect x="264" y="162" width="10" height="14" rx="2" fill="#FFC83D" class="tw d3"/><rect x="295" y="110" width="70" height="80" rx="3" fill="#2E3560" stroke="#0F1630" stroke-width="2" /><rect x="304" y="122" width="10" height="14" rx="2" fill="#4B5686" /><rect x="324" y="122" width="10" height="14" rx="2" fill="#4B5686" /><rect x="344" y="122" width="10" height="14" rx="2" fill="#4B5686" /><rect x="304" y="150" width="10" height="14" rx="2" fill="#4B5686" /><rect x="324" y="150" width="10" height="14" rx="2" fill="#4B5686" /><rect x="344" y="150" width="10" height="14" rx="2" fill="#4B5686" /><rect x="0" y="190" width="400" height="50" rx="16" fill="#2B3558" /><rect x="144" y="130" width="6" height="62" rx="2" fill="#6B7090" /><circle cx="147" cy="126" r="8" fill="#FFC83D" class="tw"/><g transform="translate(66 206) scale(1.4)" ><path d="M-14 0Q-14 -26 0 -28Q14 -26 14 0Z" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="0" cy="-38" r="9" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="3"/><path d="M-9 -40Q0 -52 9 -40Q0 -44 -9 -40Z" fill="#4A3426" stroke="#4A3426" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" /><path d="M-14 -6L-4 -12" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /></g></svg>