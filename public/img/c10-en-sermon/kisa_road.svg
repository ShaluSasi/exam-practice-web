400V224Q400 240 384 240H16Q0 240 0 224Z" fill="#D9C79E"/><g transform="translate(200 222) scale(1)" class="dr" ><g transform="translate(0 0) scale(1.6)" class="bob" ><line x1="-10" y1="-26" x2="-4" y2="-14" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="10" y1="-26" x2="4" y2="-14" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M-12 0L-9 -30Q0 -36 9 -30L12 0Z" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="0" cy="-42" r="9" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="3"/><path d="M-9 -44Q0 -56 9 -44Q0 -48 -9 -44Z" fill="#4A3426" stroke="#4A3426" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" /></g><path d="M-18 -22Q0 -8 18 -22L14 -34Q0 -26 -14 -34Z" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" /></g><text x="200" y="26" font-family="sans-serif" font-size="16" font-weight="700" fill="#2B2F4A" text-anchor="middle">Where can I find help?</text></svg>