<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>An hourglass changing into a modern clock to show old and modern language</title><style>
.fl{animation:fl 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.8,1.25)}}
.sw{animation:sw 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sw{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.bob{animation:bob 2.2s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.tw{animation:tw 1.6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:1}to{opacity:.25}}
.rot{animation:rot 24s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes rot{to{transform:rotate(360deg)}}
.dr{animation:dr 4s ease-in-out infinite alternate}
@keyframes dr{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
.fall{animation:fall 2s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}20%{opacity:1}100%{transform:translateY(22px);opacity:0}}
.pu{animation:pu 1.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pu{from{transform:scale(1)}to{transform:scale(1.12)}}
.d2{animation-delay:.5s}.d3{animation-delay:1s}.d4{animation-delay:1.5s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M16 0H384Q400 0 400 16V200H0V16Q0 0 16 0Z" fill="#F6F1FF"/><path d="M72 42H128L100 100L128 158H72L100 100Z" fill="#F3E2B8" stroke="#8B5E3C" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><path d="M86 150H114L100 130Z" fill="#FFC83D" /><rect x="64" y="34" width="72" height="8" rx="3" fill="#8B5E3C" stroke="#2B2F4A" stroke-width="3" /><rect x="64" y="158" width="72" height="8" rx="3" fill="#8B5E3C" stroke="#2B2F4A" stroke-width="3" /><line x1="160" y1="100" x2="214" y2="100" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M206 94L214 100L206 106" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="300" cy="100" r="56" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="4"/><line x1="300" y1="100" x2="300" y2="64" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round" /><line x1="300" y1="100" x2="326" y2="112" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round" /><circle cx="300" cy="100" r="4" fill="#2B2F4A"/><text x="100" y="196" font-family="sans-serif" font-size="14" font-weight="700" fill="#6B7090" text-anchor="middle">then</text><text x="300" y="196" font-family="sans-serif" font-size="14" font-weight="700" fill="#6B7090" text-anchor="middle">now</text></svg>