h="2.5" stroke-linecap="round" /><rect x="248" y="150" width="60" height="12" rx="6" fill="#FFFFFF" /><circle cx="356" cy="96" r="30" fill="#FFE3A8" stroke="#2B2F4A" stroke-width="3"/><line x1="339.5" y1="91.5" x2="351.5" y2="91.5" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><line x1="360.5" y1="91.5" x2="372.5" y2="91.5" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><circle cx="356" cy="111.0" r="4.2" fill="#2B2F4A"/><rect x="326" y="150" width="60" height="12" rx="6" fill="#FFFFFF" /><text x="200" y="200" font-family="sans-serif" font-size="16" font-weight="700" fill="#6B7090" text-anchor="middle">Five feelings</text></svg>