<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A fork in the road with a signpost pointing two ways and a cartoon figure asking for directions</title><style>
.fl{animation:fl 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.8,1.25)}}
.sw{animation:sw 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sw{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.bob{animation:bob 2.2s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.tw{animation:tw 1.6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:1}to{opacity:.25}}
.rot{animation:rot 24s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes rot{to{transform:rotate(360deg)}}
.dr{animation:dr 4s ease-in-out infinite alternate}
@keyframes dr{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
.fall{animation:fall 2s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}20%{opacity:1}100%{transform:translateY(22px);opacity:0}}
.pu{animation:pu 1.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pu{from{transform:scale(1)}to{transform:scale(1.12)}}
.d2{animation-delay:.5s}.d3{animation-delay:1s}.d4{animation-delay:1.5s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M16 0H384Q400 0 400 16V140H0V16Q0 0 16 0Z" fill="#E3F2FD"/><path d="M0 140H400V224Q400 240 384 240H16Q0 240 0 224Z" fill="#DDEFC8"/><path d="M170 240L190 150L210 150L230 240Z" fill="#D9C79E" /><path d="M190 152L120 120L140 118L206 150Z" fill="#D9C79E" /><path d="M210 152L280 120L260 118L204 150Z" fill="#D9C79E" /><rect x="196" y="60" width="8" height="92" rx="2" fill="#8B5E3C" stroke="#2B2F4A" stroke-width="3" /><path d="M204 66H262L276 78L262 90H204Z" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M196 100H140L126 112L140 124H196Z" fill="#FFF3B0" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><g transform="translate(130 230) scale(1.2)" class="bob" ><line x1="-10" y1="-26" x2="-15" y2="-10" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="10" y1="-26" x2="28" y2="-30" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M-12 0L-9 -30Q0 -36 9 -30L12 0Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="0" cy="-42" r="9" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="3"/><path d="M-9 -44Q0 -56 9 -44Q0 -48 -9 -44Z" fill="#4A3426" stroke="#4A3426" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" /></g><g transform="translate(340 150) scale(0.8)" class="sw" ><rect x="-6" y="-40" width="12" height="40" rx="3" fill="#8B5E3C" stroke="#2B2F4A" stroke-width="3" /><circle cx="0" cy="-62" r="28" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3"/><circle cx="-24" cy="-48" r="20" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3"/><circle cx="24" cy="-48" r="20" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3"/><circle cx="0" cy="-42" r="16" fill="#3FA34D"/></g></svg>