ect x="-6" y="-52" width="12" height="14" rx="3" fill="#7A4A2A" stroke="#2B2F4A" stroke-width="3" /></g><g transform="translate(372 200) scale(1.0)" ><path d="M-12 0L-9 -30Q0 -36 9 -30L12 0Z" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="0" cy="-42" r="9" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="3"/></g><g transform="translate(372 188) scale(0.55)" ><path d="M-30 0Q-40 -40 -10 -60Q10 -70 30 -50Q44 -30 30 0Q10 -14 -10 -10Z" fill="#F2C230" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /></g></svg>