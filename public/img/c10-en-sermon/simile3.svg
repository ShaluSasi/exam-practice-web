<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Three small pictures: ripe fruits on a branch, an earthen pot and an arrow</title><style>
.fl{animation:fl 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.8,1.25)}}
.sw{animation:sw 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sw{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.bob{animation:bob 2.2s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.tw{animation:tw 1.6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:1}to{opacity:.25}}
.rot{animation:rot 24s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes rot{to{transform:rotate(360deg)}}
.dr{animation:dr 4s ease-in-out infinite alternate}
@keyframes dr{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
.fall{animation:fall 2s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}20%{opacity:1}100%{transform:translateY(22px);opacity:0}}
.pu{animation:pu 1.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pu{from{transform:scale(1)}to{transform:scale(1.12)}}
.d2{animation-delay:.5s}.d3{animation-delay:1s}.d4{animation-delay:1.5s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="14" y="30" width="108" height="150" rx="14" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><rect x="146" y="30" width="108" height="150" rx="14" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><rect x="278" y="30" width="108" height="150" rx="14" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><path d="M30 70Q70 40 110 66" fill="none" stroke="#8B5E3C" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" /><g transform="translate(56 82) scale(1.4)" ><circle cx="0" cy="0" r="9" fill="#E5484D" stroke="#2B2F4A" stroke-width="3"/><path d="M0 -9Q2 -15 6 -16" fill="none" stroke="#3FA34D" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /></g><g transform="translate(88 84) scale(1.4)" ><circle cx="0" cy="0" r="9" fill="#E5484D" stroke="#2B2F4A" stroke-width="3"/><path d="M0 -9Q2 -15 6 -16" fill="none" stroke="#3FA34D" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /></g><g transform="translate(200 150) scale(1.6)" ><path d="M-8 -34Q-24 -30 -24 -12Q-24 2 -10 2H10Q24 2 24 -12Q24 -30 8 -34Z" fill="#C9743A" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="-9" y="-40" width="18" height="8" rx="3" fill="#A85F2E" stroke="#2B2F4A" stroke-width="3" /></g><line x1="300" y1="130" x2="370" y2="70" stroke="#8B5E3C" stroke-width="4" stroke-linecap="round" /><path d="M370 70L356 72L366 82Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" /><path d="M300 130L290 120M300 130L290 140" fill="none" stroke="#E5484D" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" /><text x="200" y="214" font-family="sans-serif" font-size="15" font-weight="700" fill="#6B7090" text-anchor="middle">Three comparisons</text></svg>