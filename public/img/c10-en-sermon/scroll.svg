<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>An open scroll with lines of writing, a lamp and a lotus</title><style>
.fl{animation:fl 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.8,1.25)}}
.sw{animation:sw 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sw{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.bob{animation:bob 2.2s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.tw{animation:tw 1.6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:1}to{opacity:.25}}
.rot{animation:rot 24s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes rot{to{transform:rotate(360deg)}}
.dr{animation:dr 4s ease-in-out infinite alternate}
@keyframes dr{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
.fall{animation:fall 2s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}20%{opacity:1}100%{transform:translateY(22px);opacity:0}}
.pu{animation:pu 1.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pu{from{transform:scale(1)}to{transform:scale(1.12)}}
.d2{animation-delay:.5s}.d3{animation-delay:1s}.d4{animation-delay:1.5s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M16 0H384Q400 0 400 16V185H0V16Q0 0 16 0Z" fill="#FFF3D6"/><path d="M0 185H400V224Q400 240 384 240H16Q0 240 0 224Z" fill="#E9D6A8"/><rect x="80" y="40" width="240" height="120" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><rect x="70" y="32" width="16" height="136" rx="8" fill="#C9743A" stroke="#2B2F4A" stroke-width="3" /><rect x="314" y="32" width="16" height="136" rx="8" fill="#C9743A" stroke="#2B2F4A" stroke-width="3" /><line x1="104" y1="66" x2="296" y2="66" stroke="#B8C0E6" stroke-width="4" stroke-linecap="round" /><line x1="104" y1="86" x2="256" y2="86" stroke="#B8C0E6" stroke-width="4" stroke-linecap="round" /><line x1="104" y1="106" x2="296" y2="106" stroke="#B8C0E6" stroke-width="4" stroke-linecap="round" /><line x1="104" y1="126" x2="256" y2="126" stroke="#B8C0E6" stroke-width="4" stroke-linecap="round" /><line x1="104" y1="146" x2="296" y2="146" stroke="#B8C0E6" stroke-width="4" stroke-linecap="round" /><g transform="translate(50 200) scale(0.9)" ><circle cx="0" cy="-14" r="22" fill="#FFC83D" opacity=".3" class="pu"/><path d="M-16 -6Q-16 6 0 6Q16 6 16 -6Z" fill="#C9743A" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M16 -6Q26 -8 22 -12" fill="none" stroke="#C9743A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path class="fl" d="M0 -10Q-7 -20 0 -30Q7 -20 0 -10Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.5"/></g><g transform="translate(350 200) scale(1.0)" class="bob" ><ellipse cx="0" cy="4" rx="26" ry="6" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2"/><ellipse cx="0" cy="-12" rx="7" ry="15" fill="#FF9EC4" stroke="#2B2F4A" stroke-width="2" transform="rotate(-50 0 0)"/><ellipse cx="0" cy="-12" rx="7" ry="15" fill="#FF9EC4" stroke="#2B2F4A" stroke-width="2" transform="rotate(50 0 0)"/><ellipse cx="0" cy="-12" rx="7" ry="15" fill="#FF7FB0" stroke="#2B2F4A" stroke-width="2" transform="rotate(-22 0 0)"/><ellipse cx="0" cy="-12" rx="7" ry="15" fill="#FF7FB0" stroke="#2B2F4A" stroke-width="2" transform="rotate(22 0 0)"/><ellipse cx="0" cy="-12" rx="7" ry="15" fill="#FFB6D3" stroke="#2B2F4A" stroke-width="2" transform="rotate(0 0 0)"/></g></svg>