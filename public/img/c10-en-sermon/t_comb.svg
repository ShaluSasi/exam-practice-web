<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img"><title>A comb</title><style>
.fl{animation:fl 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.8,1.25)}}
.sw{animation:sw 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sw{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.bob{animation:bob 2.2s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.tw{animation:tw 1.6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:1}to{opacity:.25}}
.rot{animation:rot 24s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes rot{to{transform:rotate(360deg)}}
.dr{animation:dr 4s ease-in-out infinite alternate}
@keyframes dr{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
.fall{animation:fall 2s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}20%{opacity:1}100%{transform:translateY(22px);opacity:0}}
.pu{animation:pu 1.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pu{from{transform:scale(1)}to{transform:scale(1.12)}}
.d2{animation-delay:.5s}.d3{animation-delay:1s}.d4{animation-delay:1.5s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#F3EEFF"/><rect x="30" y="60" width="140" height="26" rx="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><line x1="38" y1="86" x2="38" y2="116" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="48" y1="86" x2="48" y2="116" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="58" y1="86" x2="58" y2="116" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="68" y1="86" x2="68" y2="116" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="78" y1="86" x2="78" y2="116" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="88" y1="86" x2="88" y2="116" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="98" y1="86" x2="98" y2="116" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="108" y1="86" x2="108" y2="116" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="118" y1="86" x2="118" y2="116" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="128" y1="86" x2="128" y2="116" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="138" y1="86" x2="138" y2="116" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="148" y1="86" x2="148" y2="116" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="158" y1="86" x2="158" y2="116" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="168" y1="86" x2="168" y2="116" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /></svg>