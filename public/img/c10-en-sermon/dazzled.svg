<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A cartoon young man amazed by a large mass of shining golden hair with sparkles</title><style>
.fl{animation:fl 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.8,1.25)}}
.sw{animation:sw 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sw{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.bob{animation:bob 2.2s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.tw{animation:tw 1.6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:1}to{opacity:.25}}
.rot{animation:rot 24s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes rot{to{transform:rotate(360deg)}}
.dr{animation:dr 4s ease-in-out infinite alternate}
@keyframes dr{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
.fall{animation:fall 2s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}20%{opacity:1}100%{transform:translateY(22px);opacity:0}}
.pu{animation:pu 1.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pu{from{transform:scale(1)}to{transform:scale(1.12)}}
.d2{animation-delay:.5s}.d3{animation-delay:1s}.d4{animation-delay:1.5s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M16 0H384Q400 0 400 16V180H0V16Q0 0 16 0Z" fill="#FFF9E0"/><path d="M0 180H400V224Q400 240 384 240H16Q0 240 0 224Z" fill="#DDEFC8"/><g transform="translate(90 196) scale(1.4)" class="bob" ><line x1="-10" y1="-26" x2="-16" y2="-44" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="10" y1="-26" x2="16" y2="-44" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M-12 0L-9 -30Q0 -36 9 -30L12 0Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="0" cy="-42" r="9" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="3"/><path d="M-9 -44Q0 -56 9 -44Q0 -48 -9 -44Z" fill="#4A3426" stroke="#4A3426" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" /></g><g transform="translate(300 150) scale(2.2)" ><path d="M-30 0Q-40 -40 -10 -60Q10 -70 30 -50Q44 -30 30 0Q10 -14 -10 -10Z" fill="#F2C230" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /></g><circle cx="250" cy="50" r="7.0" fill="#FFC83D" class="tw"/><circle cx="340" cy="40" r="7.0" fill="#FFC83D" class="tw"/><circle cx="300" cy="90" r="7.0" fill="#FFC83D" class="tw"/><circle cx="230" cy="100" r="7.0" fill="#FFC83D" class="tw"/><circle cx="370" cy="100" r="7.0" fill="#FFC83D" class="tw"/><text x="150" y="60" font-family="sans-serif" font-size="30" font-weight="700" fill="#E5484D" text-anchor="middle">!</text></svg>