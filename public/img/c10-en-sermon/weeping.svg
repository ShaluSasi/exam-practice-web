<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A woman sitting under a grey rain cloud with tears falling like rain</title><style>
.fl{animation:fl 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.8,1.25)}}
.sw{animation:sw 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sw{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.bob{animation:bob 2.2s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.tw{animation:tw 1.6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:1}to{opacity:.25}}
.rot{animation:rot 24s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes rot{to{transform:rotate(360deg)}}
.dr{animation:dr 4s ease-in-out infinite alternate}
@keyframes dr{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
.fall{animation:fall 2s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}20%{opacity:1}100%{transform:translateY(22px);opacity:0}}
.pu{animation:pu 1.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pu{from{transform:scale(1)}to{transform:scale(1.12)}}
.d2{animation-delay:.5s}.d3{animation-delay:1s}.d4{animation-delay:1.5s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M16 0H384Q400 0 400 16V170H0V16Q0 0 16 0Z" fill="#E8EDF7"/><path d="M0 170H400V224Q400 240 384 240H16Q0 240 0 224Z" fill="#D6D6C8"/><g transform="translate(160 70) scale(2.0)" class="dr" ><circle cx="-14" cy="0" r="12" fill="#9AA5B8" stroke="#2B2F4A" stroke-width="3"/><circle cx="0" cy="-8" r="15" fill="#9AA5B8" stroke="#2B2F4A" stroke-width="3"/><circle cx="15" cy="0" r="12" fill="#9AA5B8" stroke="#2B2F4A" stroke-width="3"/><rect x="-14" y="0" width="29" height="12" rx="0" fill="#9AA5B8" /></g><path class="fall d2" d="M110 100q-4 8 0 10q4 -2 0 -10" fill="#0B93D4"/><path class="fall d3" d="M128 100q-4 8 0 10q4 -2 0 -10" fill="#0B93D4"/><path class="fall d4" d="M146 100q-4 8 0 10q4 -2 0 -10" fill="#0B93D4"/><path class="fall d2" d="M164 100q-4 8 0 10q4 -2 0 -10" fill="#0B93D4"/><path class="fall d3" d="M182 100q-4 8 0 10q4 -2 0 -10" fill="#0B93D4"/><path class="fall d4" d="M200 100q-4 8 0 10q4 -2 0 -10" fill="#0B93D4"/><g transform="translate(160 208) scale(1.8)" ><path d="M-14 0Q-14 -26 0 -28Q14 -26 14 0Z" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="0" cy="-38" r="9" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="3"/><path d="M-9 -40Q0 -52 9 -40Q0 -44 -9 -40Z" fill="#4A3426" stroke="#4A3426" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" /><path d="M-14 -6L-4 -12" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /></g></svg>