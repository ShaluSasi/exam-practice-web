<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Ripe fruits on a branch, a shelf with a whole earthen pot and a broken one, a heart with an arrow and a clay lamp</title><style>
.fl{animation:fl 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.8,1.25)}}
.sw{animation:sw 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sw{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.bob{animation:bob 2.2s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.tw{animation:tw 1.6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:1}to{opacity:.25}}
.rot{animation:rot 24s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes rot{to{transform:rotate(360deg)}}
.dr{animation:dr 4s ease-in-out infinite alternate}
@keyframes dr{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
.fall{animation:fall 2s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}20%{opacity:1}100%{transform:translateY(22px);opacity:0}}
.pu{animation:pu 1.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pu{from{transform:scale(1)}to{transform:scale(1.12)}}
.d2{animation-delay:.5s}.d3{animation-delay:1s}.d4{animation-delay:1.5s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M16 0H384Q400 0 400 16V240H0V16Q0 0 16 0Z" fill="#F3F9FF"/><path d="M-4 50Q80 40 156 74" fill="none" stroke="#8B5E3C" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" /><g transform="translate(40 66) scale(1.3)" ><circle cx="0" cy="0" r="9" fill="#E5484D" stroke="#2B2F4A" stroke-width="3"/><path d="M0 -9Q2 -15 6 -16" fill="none" stroke="#3FA34D" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /></g><g transform="translate(92 74) scale(1.3)" ><circle cx="0" cy="0" r="9" fill="#E5484D" stroke="#2B2F4A" stroke-width="3"/><path d="M0 -9Q2 -15 6 -16" fill="none" stroke="#3FA34D" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /></g><g transform="translate(128 86) scale(1.3)" ><circle cx="0" cy="0" r="9" fill="#E5484D" stroke="#2B2F4A" stroke-width="3"/><path d="M0 -9Q2 -15 6 -16" fill="none" stroke="#3FA34D" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /></g><rect x="190" y="128" width="206" height="10" rx="3" fill="#8B5E3C" stroke="#2B2F4A" stroke-width="3" /><g transform="translate(228 128) scale(1.3)" ><path d="M-8 -34Q-24 -30 -24 -12Q-24 2 -10 2H10Q24 2 24 -12Q24 -30 8 -34Z" fill="#C9743A" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><rect x="-9" y="-40" width="18" height="8" rx="3" fill="#A85F2E" stroke="#2B2F4A" stroke-width="3" /></g><g transform="translate(340 128) scale(1.3)" ><path d="M-24 2L-24 -12Q-24 -24 -14 -30L-6 -14L2 -22L6 -4L4 2Z" fill="#C9743A" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M10 2L22 2Q24 -6 20 -12L14 -6Z" fill="#C9743A" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /></g><g transform="translate(80 190) scale(2.0)" ><path d="M0 14C-24 -2 -14 -20 0 -8C14 -20 24 -2 0 14Z" fill="#FFB6C8" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /></g><line x1="40" y1="170" x2="120" y2="214" stroke="#8B5E3C" stroke-width="5" stroke-linecap="round" /><path d="M120 214L106 212L112 202Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" /><g transform="translate(330 212) scale(1.2)" ><circle cx="0" cy="-14" r="22" fill="#FFC83D" opacity=".3" class="pu"/><path d="M-16 -6Q-16 6 0 6Q16 6 16 -6Z" fill="#C9743A" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M16 -6Q26 -8 22 -12" fill="none" stroke="#C9743A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path class="fl" d="M0 -10Q-7 -20 0 -30Q7 -20 0 -10Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.5"/></g></svg>