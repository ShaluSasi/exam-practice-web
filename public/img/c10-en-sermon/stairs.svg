<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A staircase of six steps rising to a glowing lamp, with a small figure climbing</title><style>
.fl{animation:fl 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.8,1.25)}}
.sw{animation:sw 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sw{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.bob{animation:bob 2.2s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.tw{animation:tw 1.6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:1}to{opacity:.25}}
.rot{animation:rot 24s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes rot{to{transform:rotate(360deg)}}
.dr{animation:dr 4s ease-in-out infinite alternate}
@keyframes dr{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
.fall{animation:fall 2s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}20%{opacity:1}100%{transform:translateY(22px);opacity:0}}
.pu{animation:pu 1.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pu{from{transform:scale(1)}to{transform:scale(1.12)}}
.d2{animation-delay:.5s}.d3{animation-delay:1s}.d4{animation-delay:1.5s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M16 0H384Q400 0 400 16V190H0V16Q0 0 16 0Z" fill="#F3EEFF"/><path d="M0 190H400V224Q400 240 384 240H16Q0 240 0 224Z" fill="#DDEFC8"/><rect x="30" y="170" width="52" height="44" rx="4" fill="#E5DCFF" stroke="#2B2F4A" stroke-width="3" /><rect x="82" y="146" width="52" height="68" rx="4" fill="#E5DCFF" stroke="#2B2F4A" stroke-width="3" /><rect x="134" y="122" width="52" height="92" rx="4" fill="#E5DCFF" stroke="#2B2F4A" stroke-width="3" /><rect x="186" y="98" width="52" height="116" rx="4" fill="#E5DCFF" stroke="#2B2F4A" stroke-width="3" /><rect x="238" y="74" width="52" height="140" rx="4" fill="#E5DCFF" stroke="#2B2F4A" stroke-width="3" /><rect x="290" y="50" width="52" height="164" rx="4" fill="#E5DCFF" stroke="#2B2F4A" stroke-width="3" /><g transform="translate(344 60) scale(1.3)" ><circle cx="0" cy="-14" r="22" fill="#FFC83D" opacity=".3" class="pu"/><path d="M-16 -6Q-16 6 0 6Q16 6 16 -6Z" fill="#C9743A" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path d="M16 -6Q26 -8 22 -12" fill="none" stroke="#C9743A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><path class="fl" d="M0 -10Q-7 -20 0 -30Q7 -20 0 -10Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.5"/></g><g transform="translate(90 146) scale(0.7)" class="bob" ><line x1="-10" y1="-26" x2="-15" y2="-10" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="10" y1="-26" x2="15" y2="-10" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M-12 0L-9 -30Q0 -36 9 -30L12 0Z" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="0" cy="-42" r="9" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="3"/><path d="M-9 -44Q0 -56 9 -44Q0 -48 -9 -44Z" fill="#4A3426" stroke="#4A3426" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" /></g></svg>