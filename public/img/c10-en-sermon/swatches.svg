<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Four locks of hair in brown, black, orange and yellow</title><style>
.fl{animation:fl 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.8,1.25)}}
.sw{animation:sw 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sw{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}
.bob{animation:bob 2.2s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
.tw{animation:tw 1.6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:1}to{opacity:.25}}
.rot{animation:rot 24s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes rot{to{transform:rotate(360deg)}}
.dr{animation:dr 4s ease-in-out infinite alternate}
@keyframes dr{from{transform:translateX(-8px)}to{transform:translateX(8px)}}
.fall{animation:fall 2s linear infinite}
@keyframes fall{0%{transform:translateY(-6px);opacity:0}20%{opacity:1}100%{transform:translateY(22px);opacity:0}}
.pu{animation:pu 1.8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
@keyframes pu{from{transform:scale(1)}to{transform:scale(1.12)}}
.d2{animation-delay:.5s}.d3{animation-delay:1s}.d4{animation-delay:1.5s}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M16 0H384Q400 0 400 16V190H0V16Q0 0 16 0Z" fill="#F6F1FF"/><path d="M0 190H400V224Q400 240 384 240H16Q0 240 0 224Z" fill="#E9E0D0"/><g transform="translate(60 160) scale(1.0)" ><path d="M-30 0Q-40 -40 -10 -60Q10 -70 30 -50Q44 -30 30 0Q10 -14 -10 -10Z" fill="#7A4A2A" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /></g><g transform="translate(142 160) scale(1.0)" ><path d="M-30 0Q-40 -40 -10 -60Q10 -70 30 -50Q44 -30 30 0Q10 -14 -10 -10Z" fill="#1C1C28" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /></g><g transform="translate(224 160) scale(1.0)" ><path d="M-30 0Q-40 -40 -10 -60Q10 -70 30 -50Q44 -30 30 0Q10 -14 -10 -10Z" fill="#E8731A" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /></g><g transform="translate(306 160) scale(1.0)" ><path d="M-30 0Q-40 -40 -10 -60Q10 -70 30 -50Q44 -30 30 0Q10 -14 -10 -10Z" fill="#F2C230" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /></g><text x="200" y="36" font-family="sans-serif" font-size="18" font-weight="700" fill="#6B7090" text-anchor="middle">Hair colours</text></svg>