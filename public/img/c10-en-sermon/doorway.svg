roke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="10" y1="-26" x2="15" y2="-10" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M-12 0L-9 -30Q0 -36 9 -30L12 0Z" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="0" cy="-42" r="9" fill="#F2C9A0" stroke="#2B2F4A" stroke-width="3"/><path d="M-9 -44Q0 -56 9 -44Q0 -48 -9 -44Z" fill="#4A3426" stroke="#4A3426" stroke-width="1" stroke-linejoin="round" stroke-linecap="round" /></g></svg>