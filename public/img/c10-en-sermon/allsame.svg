height="10" rx="5" fill="#2B2F4A" /><path d="M200 190L186 214H214Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><text x="200" y="40" font-family="sans-serif" font-size="16" font-weight="700" fill="#7C5CFF" text-anchor="middle">Young and old, simple and wise</text></svg>