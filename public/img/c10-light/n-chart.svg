<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Bar chart of refractive indices: water 1.33, kerosene 1.44, turpentine 1.47, crown glass 1.52, diamond 2.42</title>
<style>.fl{stroke-dasharray:12 5;animation:fl .9s linear infinite}@keyframes fl{to{stroke-dashoffset:-17}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.4}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="120" y="44" font-size="12" text-anchor="end" >Water</text><rect x="130" y="26" width="120" height="26" rx="6" fill="#0B93D4"/><text x="255.7" y="44" font-size="12" text-anchor="start" >1.33</text><text x="120" y="84" font-size="12" text-anchor="end" >Kerosene</text><rect x="130" y="66" width="130" height="26" rx="6" fill="#FF8A1F"/><text x="265.6" y="84" font-size="12" text-anchor="start" >1.44</text><text x="120" y="124" font-size="12" text-anchor="end" >Turpentine oil</text><rect x="130" y="106" width="132" height="26" rx="6" fill="#3FA34D"/><text x="268.3" y="124" font-size="12" text-anchor="start" >1.47</text><text x="120" y="164" font-size="12" text-anchor="end" >Crown glass</text><rect x="130" y="146" width="137" height="26" rx="6" fill="#7C5CFF"/><text x="272.8" y="164" font-size="12" text-anchor="start" >1.52</text><text x="120" y="204" font-size="12" text-anchor="end" >Diamond</text><rect x="130" y="186" width="218" height="26" rx="6" fill="#E5484D"/><text x="353.8" y="204" font-size="12" text-anchor="start" >2.42</text></svg>
