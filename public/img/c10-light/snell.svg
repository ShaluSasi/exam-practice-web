<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A ray passing from one medium into another with angle of incidence 45 degrees and angle of refraction 30 degrees</title>
<style>.fl{stroke-dasharray:12 5;animation:fl .9s linear infinite}@keyframes fl{to{stroke-dashoffset:-17}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.4}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="0" y="120" width="400" height="120" fill="#CFE9FA" fill-opacity=".7"/><line x1="0" y1="120" x2="400" y2="120" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><line x1="200" y1="14" x2="200" y2="228" stroke="#2B2F4A" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 4" /><polyline points="101,21 200,120 250,206.6" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polygon points="0,0 -9.0,-4.5 -9.0,4.5" fill="#FF8A1F" transform="translate(150.5 70.5) rotate(45.0)"/><polygon points="0,0 -9.0,-4.5 -9.0,4.5" fill="#FF8A1F" transform="translate(225 163.3) rotate(60.0)"/><path d="M200 80A40 40 0 0 0 171.7 91.7" fill="none" stroke="#0B93D4" stroke-width="3"/><path d="M200 160A40 40 0 0 0 220.0 154.6" fill="none" stroke="#3FA34D" stroke-width="3"/><text x="160" y="78" font-size="13" text-anchor="middle" class="h" >i = 45°</text><text x="240" y="168" font-size="13" text-anchor="middle" class="h" >r = 30°</text><text x="340" y="40" font-size="12" text-anchor="middle" >Medium 1</text><text x="340" y="150" font-size="12" text-anchor="middle" >Medium 2</text></svg>
