<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Top view of a glass slab ABCD on paper with pins E, F on one side and G, H on the other lying on a straight line</title>
<style>.fl{stroke-dasharray:12 5;animation:fl .9s linear infinite}@keyframes fl{to{stroke-dashoffset:-17}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.4}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="150" y="50" width="100" height="140" fill="#CFE9FA" fill-opacity=".8" stroke="#2B2F4A" stroke-width="3"/><text x="142" y="46" font-size="13" text-anchor="middle" class="h" >A</text><text x="258" y="46" font-size="13" text-anchor="middle" class="h" >B</text><text x="142" y="206" font-size="13" text-anchor="middle" class="h" >D</text><text x="258" y="206" font-size="13" text-anchor="middle" class="h" >C</text><circle cx="60" cy="62" r="6" fill="#E5484D"/><text x="60" y="50" font-size="13" text-anchor="middle" class="h" >E</text><circle cx="100" cy="90" r="6" fill="#E5484D"/><text x="100" y="78" font-size="13" text-anchor="middle" class="h" >F</text><circle cx="300" cy="168" r="6" fill="#E5484D"/><text x="300" y="156" font-size="13" text-anchor="middle" class="h" >G</text><circle cx="340" cy="196" r="6" fill="#E5484D"/><text x="340" y="184" font-size="13" text-anchor="middle" class="h" >H</text><line x1="60" y1="62" x2="150" y2="112" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" /><line x1="150" y1="112" x2="250" y2="140" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" /><line x1="250" y1="140" x2="340" y2="196" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" /><polyline points="150,112 300,168" fill="none" stroke="#8A8FB0" stroke-width="2" stroke-dasharray="3 5" stroke-linecap="round"/></svg>
