<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Top view of a glass slab ABCD on paper: pins E and F in front of face AB, pins G and H beyond face CD, with the ray path through the slab</title>
<style>.fl{stroke-dasharray:12 5;animation:fl .9s linear infinite}@keyframes fl{to{stroke-dashoffset:-17}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.4}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="100" y="80" width="200" height="80" fill="#CFE9FA" fill-opacity=".8" stroke="#2B2F4A" stroke-width="3"/><text x="92" y="76" font-size="13" text-anchor="middle" class="h" >A</text><text x="308" y="76" font-size="13" text-anchor="middle" class="h" >B</text><text x="92" y="176" font-size="13" text-anchor="middle" class="h" >D</text><text x="308" y="176" font-size="13" text-anchor="middle" class="h" >C</text>
<line x1="170" y1="50" x2="170" y2="120" stroke="#8A8FB0" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="212.8" y1="120" x2="212.8" y2="190" stroke="#8A8FB0" stroke-width="1.5" stroke-dasharray="4 4"/>
<line x1="110" y1="20" x2="170" y2="80" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round"/><line x1="170" y1="80" x2="212.8" y2="160" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round"/><line x1="212.8" y1="160" x2="272.8" y2="220" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round"/>
<circle cx="110" cy="20" r="6" fill="#E5484D"/><text x="96" y="25" font-size="13" text-anchor="middle" class="h" >E</text><circle cx="140" cy="50" r="6" fill="#E5484D"/><text x="126" y="55" font-size="13" text-anchor="middle" class="h" >F</text><circle cx="242.8" cy="190" r="6" fill="#E5484D"/><text x="257.8" y="195" font-size="13" text-anchor="middle" class="h" >G</text><circle cx="272.8" cy="220" r="6" fill="#E5484D"/><text x="287.8" y="225" font-size="13" text-anchor="middle" class="h" >H</text></svg>