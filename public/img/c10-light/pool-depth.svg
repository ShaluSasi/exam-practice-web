<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A pebble at the bottom of a pool seems raised: the real depth is greater than the apparent depth</title>
<style>.fl{stroke-dasharray:12 5;animation:fl .9s linear infinite}@keyframes fl{to{stroke-dashoffset:-17}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.4}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="30" y="90" width="320" height="120" fill="#8FD0F2" fill-opacity=".55"/><line x1="30" y1="90" x2="350" y2="90" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" /><line x1="30" y1="210" x2="350" y2="210" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><polyline points="280,200 180,90 68,34" fill="none" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="fl"/><polygon points="0,0 -9.0,-4.5 -9.0,4.5" fill="#FF8A1F" transform="translate(230 145) rotate(-132.3)"/><polygon points="0,0 -9.0,-4.5 -9.0,4.5" fill="#FF8A1F" transform="translate(124 62) rotate(-153.4)"/><polyline points="180,90 280,140" fill="none" stroke="#8A8FB0" stroke-width="2" stroke-dasharray="3 5" stroke-linecap="round"/><ellipse cx="280" cy="203" rx="14" ry="8" fill="#8A8FB0" stroke="#2B2F4A" stroke-width="2"/><ellipse cx="280" cy="140" rx="14" ry="8" fill="none" stroke="#8A8FB0" stroke-width="2" stroke-dasharray="3 3"/><ellipse cx="46" cy="30" rx="22" ry="14" fill="#fff" stroke="#2B2F4A" stroke-width="3"/><circle cx="52" cy="30" r="6" fill="#0B93D4"/><text x="300" y="196" font-size="11" text-anchor="start" class="h" >Real</text><text x="300" y="144" font-size="11" text-anchor="start" class="h" >Apparent</text><text x="200" y="232" font-size="12" text-anchor="middle" >Real depth is more than apparent depth</text></svg>
