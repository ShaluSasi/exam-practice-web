<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A convex lens held close to small print makes the letters look larger</title>
<style>.fl{stroke-dasharray:12 5;animation:fl .9s linear infinite}@keyframes fl{to{stroke-dashoffset:-17}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.4}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.z{animation:z 2.5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes z{50%{transform:scale(1.08)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="110" y="60" font-size="11" text-anchor="middle" >tiny text here and there</text><text x="110" y="200" font-size="11" text-anchor="middle" >more tiny print below</text><line x1="248" y1="150" x2="320" y2="215" stroke="#2B2F4A" stroke-width="12" stroke-linecap="round"/><circle cx="200" cy="120" r="62" fill="#E3F2FD" fill-opacity=".85" stroke="#2B2F4A" stroke-width="6"/><text class="z" x="200" y="136" font-size="42" text-anchor="middle" fill="#2B2F4A" style="font-weight:700">Abc</text></svg>
