<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Light travels fastest in vacuum and slows down in water, glass and diamond</title>
<style>.fl{stroke-dasharray:12 5;animation:fl .9s linear infinite}@keyframes fl{to{stroke-dashoffset:-17}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.4}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}.d{animation:mv linear infinite}@keyframes mv{from{transform:translateX(0)}to{transform:translateX(250px)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="110" y="30" width="270" height="12" rx="6" fill="#E6E8F5"/><text x="100" y="40" font-size="12" text-anchor="end" >Vacuum</text><circle class="d" cx="118" cy="36" r="8" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" style="animation-duration:1.60s"/><rect x="110" y="70" width="270" height="12" rx="6" fill="#E6E8F5"/><text x="100" y="80" font-size="12" text-anchor="end" >Air</text><circle class="d" cx="118" cy="76" r="8" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" style="animation-duration:1.60s"/><rect x="110" y="110" width="270" height="12" rx="6" fill="#E6E8F5"/><text x="100" y="120" font-size="12" text-anchor="end" >Water</text><circle class="d" cx="118" cy="116" r="8" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" style="animation-duration:2.13s"/><rect x="110" y="150" width="270" height="12" rx="6" fill="#E6E8F5"/><text x="100" y="160" font-size="12" text-anchor="end" >Crown glass</text><circle class="d" cx="118" cy="156" r="8" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" style="animation-duration:2.43s"/><rect x="110" y="190" width="270" height="12" rx="6" fill="#E6E8F5"/><text x="100" y="200" font-size="12" text-anchor="end" >Diamond</text><circle class="d" cx="118" cy="196" r="8" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" style="animation-duration:3.87s"/></svg>
