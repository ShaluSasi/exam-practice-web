<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A plane mirror shows a narrow field of view behind the car while a convex mirror shows a much wider one</title>
<style>.fl{stroke-dasharray:12 5;animation:fl .9s linear infinite}@keyframes fl{to{stroke-dashoffset:-17}}.pu{animation:pu 2s ease-in-out infinite}@keyframes pu{50%{opacity:.4}}text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<polygon points="66,58 36,228 76,228" fill="#0B93D4" fill-opacity=".22" class="pu"/><text x="100" y="16" font-size="13" text-anchor="middle" >Plane mirror</text><rect x="70" y="28" width="60" height="80" rx="14" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3"/><rect x="78" y="48" width="44" height="18" rx="4" fill="#fff"/><rect x="62" y="52" width="8" height="12" fill="#2B2F4A"/><rect x="13" y="175" width="24" height="40" rx="6" fill="#8A8FB0" stroke="#2B2F4A" stroke-width="2"/><rect x="46" y="175" width="24" height="40" rx="6" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2"/><rect x="93" y="175" width="24" height="40" rx="6" fill="#8A8FB0" stroke="#2B2F4A" stroke-width="2"/><polygon points="266,58 200,228 350,228" fill="#0B93D4" fill-opacity=".22" class="pu"/><text x="300" y="16" font-size="13" text-anchor="middle" >Convex mirror</text><rect x="270" y="28" width="60" height="80" rx="14" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3"/><rect x="278" y="48" width="44" height="18" rx="4" fill="#fff"/><rect x="262" y="52" width="8" height="12" fill="#2B2F4A"/><rect x="213" y="175" width="24" height="40" rx="6" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2"/><rect x="246" y="175" width="24" height="40" rx="6" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2"/><rect x="293" y="175" width="24" height="40" rx="6" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2"/></svg>
