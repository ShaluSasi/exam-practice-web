<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 210" role="img">
<title>A voter's hand with an inked finger, a voting machine button and a printed paper slip</title>
<style>
.press{animation:press 2.6s ease-in-out infinite}
@keyframes press{0%,100%{transform:translateY(0)}45%,55%{transform:translateY(5px)}}
.slip{animation:slip 2.6s ease-in-out infinite}
@keyframes slip{0%,50%{opacity:0;transform:translateY(-8px)}65%,90%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
