<rect x="36" y="150" width="80" height="22" fill="#FFFFFF"/><circle cx="146" cy="161" r="10" fill="#0B93D4"/>
<path d="M44 121l5-8 5 8Z" fill="#FF8A1F"/><circle cx="49" cy="161" r="5" fill="#3FA34D"/>
</g>
