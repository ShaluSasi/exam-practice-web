<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img">
<title>Elections at the centre, linked to four democratic values</title>
<style>
.ring{animation:spin 14s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g stroke="#A3A8CC" stroke-width="3" stroke-linecap="round">
<path d="M180 120L82 58M180 120L278 58M180 120L82 182M180 120L278 182"/>
</g>
<circle class="ring" cx="180" cy="120" r="52" fill="none" stroke="#0B93D4" stroke-width="2.5" stroke-dasharray="8 7"/>
<g class="pulse"><circle cx="180" cy="120" r="42" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/>
<rect x="164" y="98" width="32" height="26" rx="3" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/>
<rect x="172" y="95" width="16" height="5" fill="#2B2F4A"/>
<path d="M174 111l4 4 8-9" fill="none" stroke="#3FA34D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="180" y="142" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle">Elections</text></g>
<g stroke="#2B2F4A" stroke-width="2.5">
<rect x="18" y="38" width="124" height="40" rx="12" fill="#FDE3C8"/>
<rect x="218" y="38" width="124" height="40" rx="12" fill="#D8F0D9"/>
<rect x="18" y="162" width="124" height="40" rx="12" fill="#E4E0F7"/>
<rect x="218" y="162" width="124" height="40" rx="12" fill="#FFF0C2"/>
</g>
<g font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#2B2F4A" text-anchor="middle">
<text x="80" y="63">Equality</text>
<text x="280" y="63">Representation</text>
<text x="80" y="187">Accountability</text>
<text x="280" y="187">Legitimacy</text>
</g>
</svg>
