<g class="h h3"><path d="M290 190V116Q290 108 297 108Q304 108 304 116V148" fill="#E8B48C"/><path d="M304 148V136Q304 130 310 130Q316 130 316 136V190Z" fill="#E8B48C"/><path d="M297 108V118" stroke="#5B4FA8" stroke-width="4" stroke-linecap="round"/></g>
