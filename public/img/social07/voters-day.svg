<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 210" role="img">
<title>A calendar page for 25 January and raised hands with inked fingers</title>
<style>
.h{animation:up 2.6s ease-in-out infinite}
.h2{animation-delay:.4s}.h3{animation-delay:.8s}
@keyframes up{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="30" y="34" width="120" height="140" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5"/>
