<path d="M58 26V44M122 26V44" stroke="#2B2F4A" stroke-width="5" stroke-linecap="round"/>
<g font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">
<text x="90" y="62" font-size="15" fill="#FFFFFF">JANUARY</text>
<text x="90" y="138" font-size="52" fill="#2B2F4A">25</text>
<text x="90" y="162" font-size="12" fill="#2B2F4A">every year</text>
</g>
<g stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round">
