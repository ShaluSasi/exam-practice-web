<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" role="img">
<title>Vote shares of Party A, B and C and an empty 120-seat parliament</title>
<style>
.dot{animation:blink 3s ease-in-out infinite}
.d2{animation-delay:.5s}.d3{animation-delay:1s}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">
<text x="180" y="30" font-size="15" text-anchor="middle">Nationwide vote share</text>
</g>
<g stroke="#2B2F4A" stroke-width="2">
<rect x="30" y="42" width="135" height="34" fill="#FF8A1F"/>
<rect x="165" y="42" width="90" height="34" fill="#0B93D4"/>
<rect x="255" y="42" width="75" height="34" fill="#3FA34D"/>
</g>
<g font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">
<text x="97" y="64">A · 45%</text><text x="210" y="64">B · 30%</text><text x="292" y="64">C · 25%</text>
</g>
<path d="M90 196A90 90 0 0 1 270 196" fill="none" stroke="#E4E0F7" stroke-width="40"/>
<g fill="#FFFFFF" stroke="#A3A8CC" stroke-width="2">
<circle class="dot" cx="96" cy="166" r="6"/><circle class="dot d2" cx="104" cy="140" r="6"/><circle class="dot d3" cx="120" cy="120" r="6"/><circle class="dot" cx="141" cy="105" r="6"/><circle class="dot d2" cx="165" cy="97" r="6"/>
<circle class="dot d3" cx="195" cy="97" r="6"/><circle class="dot" cx="219" cy="105" r="6"/><circle class="dot d2" cx="240" cy="120" r="6"/><circle class="dot d3" cx="256" cy="140" r="6"/><circle class="dot" cx="264" cy="166" r="6"/>
</g>
<g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" text-anchor="middle">
<text x="180" y="172" font-size="22">120</text>
<text x="180" y="192" font-size="12">seats to share</text>
</g>
<path d="M0 206H360V214Q360 230 344 230H16Q0 230 0 214Z" fill="#D9C49A"/>
</svg>
