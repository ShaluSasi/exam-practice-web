<circle cx="308" cy="128" r="6" fill="#0B93D4"/><circle cx="288" cy="104" r="6" fill="#0B93D4"/><circle cx="264" cy="90" r="6" fill="#0B93D4"/><circle cx="276" cy="146" r="6" fill="#0B93D4"/><circle cx="256" cy="122" r="6" fill="#0B93D4"/>
</g>
<path d="M140 180H220" stroke="#2B2F4A" stroke-width="2" stroke-dasharray="5 5"/>
<path d="M214 174L222 180L214 186" fill="none" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/>
<g class="walk">
<circle cx="180" cy="122" r="10" fill="#E8B48C" stroke="#2B2F4A" stroke-width="2"/>
