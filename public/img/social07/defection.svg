<rect x="160" y="14" width="40" height="14" rx="5" fill="#8A5A2B" stroke="#2B2F4A" stroke-width="2"/>
<g fill="none" stroke-width="14" stroke-linecap="round">
<path d="M40 190Q40 100 120 84" stroke="#FFC48A"/>
<path d="M70 196Q72 126 128 112" stroke="#FFC48A"/>
<path d="M320 190Q320 100 240 84" stroke="#9FD3F0"/>
<path d="M290 196Q288 126 232 112" stroke="#9FD3F0"/>
</g>
<g stroke="#2B2F4A" stroke-width="1.5">
