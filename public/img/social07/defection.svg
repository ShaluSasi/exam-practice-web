<text x="60" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle">Party whip:</text>
<text x="60" y="55" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#E5484D" text-anchor="middle">Vote YES</text>
