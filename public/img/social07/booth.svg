<style>
.led{animation:led 1.4s ease-in-out infinite}
@keyframes led{0%,100%{opacity:.25}50%{opacity:1}}
.slip{animation:slip 4s ease-in-out infinite}
@keyframes slip{0%,12%{transform:translateY(-12px);opacity:0}30%,72%{transform:translateY(0);opacity:1}88%,100%{transform:translateY(8px);opacity:0}}
.drop{animation:drop 2.4s ease-in infinite}
@keyframes drop{0%{transform:translateY(0);opacity:0}20%{opacity:1}75%{transform:translateY(10px);opacity:1}100%{transform:translateY(10px);opacity:0}}
.page{animation:page 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
@keyframes page{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.6)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
