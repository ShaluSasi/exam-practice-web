<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Two non-overlapping windscreen wipers, each sweeping 100 degrees</title>
<style>
.pl{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.45}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.w0{opacity:0;animation:w0k 3.6s ease-in-out infinite}@keyframes w0k{0%,100%{opacity:0}50%{opacity:1}}.wb0{transform-origin:115.0px 200.0px;animation:wb0k 3.6s ease-in-out infinite}@keyframes wb0k{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}.w1{opacity:0;animation:w1k 3.6s ease-in-out infinite}@keyframes w1k{0%,100%{opacity:0}50%{opacity:1}}.wb1{transform-origin:285.0px 200.0px;animation:wb1k 3.6s ease-in-out infinite}@keyframes wb1k{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="20" y="25" width="360" height="190" rx="22" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="4"/><path d="M115.0 200.0 L179.3 146.0 A84.0 84.0 0 0 0 50.7 146.0 Z" fill="#FF8A1F" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" fill-opacity="0.6"/><path d="M115.0 200.0 L50.7 146.0 A84.0 84.0 0 0 0 39.5 163.2 Z" fill="#FF8A1F" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" class="w0" opacity="0" fill-opacity="0.6"/><line x1="115.0" y1="200.0" x2="179.3" y2="146.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><g class="wb0"><line x1="115.0" y1="200.0" x2="50.7" y2="146.0" stroke="#E5484D" stroke-width="4" stroke-linecap="round" /></g><circle cx="115.0" cy="200.0" r="5" fill="#2B2F4A" /><path d="M285.0 200.0 L349.3 146.0 A84.0 84.0 0 0 0 220.7 146.0 Z" fill="#FF8A1F" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" fill-opacity="0.6"/><path d="M285.0 200.0 L220.7 146.0 A84.0 84.0 0 0 0 209.5 163.2 Z" fill="#FF8A1F" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" class="w1" opacity="0" fill-opacity="0.6"/><line x1="285.0" y1="200.0" x2="349.3" y2="146.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><g class="wb1"><line x1="285.0" y1="200.0" x2="220.7" y2="146.0" stroke="#E5484D" stroke-width="4" stroke-linecap="round" /></g><circle cx="285.0" cy="200.0" r="5" fill="#2B2F4A" /><text x="200.0" y="62.0" font-family="sans-serif" font-size="14" font-weight="700" fill="#E5484D" text-anchor="middle" >Each blade is 21 cm long</text><text x="200.0" y="84.0" font-family="sans-serif" font-size="14" font-weight="600" fill="#2B2F4A" text-anchor="middle" >and sweeps through 100°</text>
</svg>
