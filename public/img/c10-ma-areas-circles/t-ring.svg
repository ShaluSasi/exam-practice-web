</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="100.0" cy="75.0" r="56.0" fill="#FFD7A8" stroke="#FF8A1F" stroke-width="3" /><circle cx="100.0" cy="75.0" r="30.8" fill="#FFFFFF" stroke="#FF8A1F" stroke-width="3" />
</svg>
