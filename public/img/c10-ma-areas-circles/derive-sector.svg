<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A whole circle, a one degree slice and a sector of angle theta</title>
<style>
.pl{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.45}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="70.0" cy="120.0" r="55.0" fill="#FFD7A8" stroke="#FF8A1F" stroke-width="3" /><circle cx="200.0" cy="120.0" r="55.0" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><path d="M200.0 120.0 L200.0 65.0 A55.0 55.0 0 0 0 197.1 65.1 Z" fill="#FFD7A8" stroke="#FF8A1F" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><circle cx="330.0" cy="120.0" r="55.0" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><g class="pl"><path d="M330.0 120.0 L372.1 84.6 A55.0 55.0 0 0 0 294.6 77.9 Z" fill="#FFD7A8" stroke="#FF8A1F" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /></g><circle cx="70.0" cy="120.0" r="3" fill="#2B2F4A" /><circle cx="200.0" cy="120.0" r="3" fill="#2B2F4A" /><circle cx="330.0" cy="120.0" r="3" fill="#2B2F4A" /><text x="70.0" y="205.0" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >360° (whole)</text><text x="200.0" y="205.0" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >1° (thin slice)</text><text x="330.0" y="205.0" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >θ° (our sector)</text><text x="135.0" y="124.0" font-family="sans-serif" font-size="24" font-weight="700" fill="#FF8A1F" text-anchor="middle" >→</text><text x="265.0" y="124.0" font-family="sans-serif" font-size="24" font-weight="700" fill="#FF8A1F" text-anchor="middle" >→</text>
