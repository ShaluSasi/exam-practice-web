<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Two concentric circles with radii r and 2r</title>
<style>
.pl{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.45}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.dc{transform-box:fill-box;transform-origin:50% 50%;animation:dck 3.6s ease-in-out infinite}@keyframes dck{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g class="dc"><circle cx="160.0" cy="125.0" r="90.0" fill="#BFE3F5" stroke="#0B93D4" stroke-width="3" /></g><circle cx="160.0" cy="125.0" r="45.0" fill="#FFD7A8" stroke="#FF8A1F" stroke-width="3" /><circle cx="160.0" cy="125.0" r="4" fill="#2B2F4A" /><line x1="160.0" y1="125.0" x2="117.7" y2="140.4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="160.0" y1="125.0" x2="237.9" y2="170.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="133.7" y="128.6" font-family="sans-serif" font-size="15" font-weight="700" fill="#2B2F4A" text-anchor="middle" >r</text><text x="219.4" y="175.0" font-family="sans-serif" font-size="15" font-weight="700" fill="#2B2F4A" text-anchor="middle" >2r</text><text x="325.0" y="105.0" font-family="sans-serif" font-size="13" font-weight="700" fill="#FF8A1F" text-anchor="middle" >Inner circle:</text><text x="325.0" y="122.0" font-family="sans-serif" font-size="13" font-weight="700" fill="#FF8A1F" text-anchor="middle" >radius r</text><text x="325.0" y="150.0" font-family="sans-serif" font-size="13" font-weight="700" fill="#0B93D4" text-anchor="middle" >Outer circle:</text><text x="325.0" y="167.0" font-family="sans-serif" font-size="13" font-weight="700" fill="#0B93D4" text-anchor="middle" >radius 2r</text>
</svg>
