<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="150.0" cy="125.0" r="100.0" fill="#FFFFFF" stroke="#B8BCD0" stroke-width="3" /><path d="M150.0 125.0 L250.0 125.0 A100.0 100.0 0 0 0 100.0 38.4 Z" fill="#FFD7A8" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M150.0 125.0 L100.0 38.4 A100.0 100.0 0 0 0 63.4 175.0 Z" fill="#BFE3F5" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M150.0 125.0 L63.4 175.0 A100.0 100.0 0 0 0 150.0 225.0 Z" fill="#CDEBD0" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><path d="M150.0 125.0 L150.0 225.0 A100.0 100.0 0 0 0 200.0 211.6 Z" fill="#DDD3FF" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /><circle cx="150.0" cy="125.0" r="4" fill="#2B2F4A" /><text x="330.0" y="100.0" font-family="sans-serif" font-size="14" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Sectors of the</text><text x="330.0" y="120.0" font-family="sans-serif" font-size="14" font-weight="600" fill="#2B2F4A" text-anchor="middle" >same circle,</text><text x="330.0" y="140.0" font-family="sans-serif" font-size="15" font-weight="700" fill="#E5484D" text-anchor="middle" >r = 21 cm</text>
