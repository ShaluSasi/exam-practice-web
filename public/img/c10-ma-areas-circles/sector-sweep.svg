<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A sector whose angle at the centre opens and closes</title>
<style>
.pl{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.45}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.pe{opacity:0;animation:pek 3.6s ease-in-out infinite}@keyframes pek{0%,100%{opacity:0}50%{opacity:1}}.hb{transform-origin:150.0px 125.0px;animation:hbk 3.6s ease-in-out infinite}@keyframes hbk{0%,100%{transform:rotate(0)}50%{transform:rotate(-25deg)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="150.0" cy="125.0" r="100.0" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><path d="M150.0 125.0 L250.0 125.0 A100.0 100.0 0 0 0 184.2 31.0 Z" fill="#FF8A1F" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" fill-opacity="0.55"/><path d="M150.0 125.0 L184.2 31.0 A100.0 100.0 0 0 0 141.3 25.4 Z" fill="#FF8A1F" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round" class="pe" opacity="0" fill-opacity="0.55"/><line x1="150.0" y1="125.0" x2="250.0" y2="125.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><g class="hb"><line x1="150.0" y1="125.0" x2="184.2" y2="31.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><circle cx="184.2" cy="31.0" r="4" fill="#E5484D" /></g><circle cx="150.0" cy="125.0" r="4" fill="#2B2F4A" /><text x="136.0" y="143.0" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle" >O</text><text x="264.0" y="130.0" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle" >A</text><text x="192.2" y="23.0" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle" >B</text><path d="M176.0 125.0 A26.0 26.0 0 0 0 158.9 100.6" fill="none" stroke="#E5484D" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" /><text x="182.8" y="107.7" font-family="sans-serif" font-size="16" font-weight="700" fill="#E5484D" text-anchor="middle" >θ</text><text x="202.0" y="145.0" font-family="sans-serif" font-size="15" font-weight="700" fill="#0B93D4" text-anchor="middle" >r</text><text x="325.0" y="100.0" font-family="sans-serif" font-size="14" font-weight="600" fill="#2B2F4A" text-anchor="middle" >OB turns</text><text x="325.0" y="120.0" font-family="sans-serif" font-size="14" font-weight="600" fill="#2B2F4A" text-anchor="middle" >about O,</text><text x="325.0" y="140.0" font-family="sans-serif" font-size="14" font-weight="700" fill="#E5484D" text-anchor="middle" >θ changes</text>
</svg>
