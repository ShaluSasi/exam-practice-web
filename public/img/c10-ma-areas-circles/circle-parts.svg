<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A radius turning once around a circle</title>
<style>
.pl{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.45}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.sp{transform-origin:170px 125px;animation:spin 8s linear infinite}@keyframes spin{to{transform:rotate(-360deg)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="170.0" cy="125.0" r="95.0" fill="#BFE3F5" stroke="#2B2F4A" stroke-width="3" /><circle cx="170.0" cy="125.0" r="4" fill="#2B2F4A" /><g class="sp"><line x1="170.0" y1="125.0" x2="265.0" y2="125.0" stroke="#E5484D" stroke-width="4" stroke-linecap="round" /><circle cx="265.0" cy="125.0" r="5" fill="#E5484D" /></g><text x="158.0" y="143.0" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle" >O</text><text x="220.0" y="117.0" font-family="sans-serif" font-size="15" font-weight="700" fill="#E5484D" text-anchor="middle" >r</text><text x="330.0" y="90.0" font-family="sans-serif" font-size="14" font-weight="600" fill="#2B2F4A" text-anchor="middle" >One full turn</text><text x="330.0" y="110.0" font-family="sans-serif" font-size="14" font-weight="600" fill="#2B2F4A" text-anchor="middle" >traces the</text><text x="330.0" y="130.0" font-family="sans-serif" font-size="14" font-weight="600" fill="#2B2F4A" text-anchor="middle" >boundary</text>
</svg>
