<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A slope cut by deep channels that water has carved, leaving broken ground</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.spin{transform-box:fill-box;transform-origin:center;animation:spin 4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.fall{animation:fall 2s linear infinite}@keyframes fall{0%{transform:translateY(-8px);opacity:0}30%{opacity:1}100%{transform:translateY(26px);opacity:0}}.rise{animation:rise 3s ease-out infinite}@keyframes rise{0%{transform:translateY(8px);opacity:.9}100%{transform:translateY(-22px);opacity:0}}.flow{stroke-dasharray:8 6;animation:flow 1s linear infinite}@keyframes flow{to{stroke-dashoffset:-14}}.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite}@keyframes sway{50%{transform:rotate(4deg)}}.tilt{transform-box:fill-box;transform-origin:center;animation:tilt 4s ease-in-out infinite}@keyframes tilt{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}.slide{animation:slide 3s ease-in-out infinite}@keyframes slide{50%{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#E3F2FD"/>
<polygon points="0,80 400,80 400,240 0,240" fill="#C79A5E" stroke="#2B2F4A" stroke-width="0" stroke-linejoin="round" /><polygon points="64,80 76,80 92,232 48,232" fill="#6B4423" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" /><g class="fall" style="animation-delay:0.0s"><path d="M70 87.9Q76.3 96.9 70 100.5Q63.7 96.9 70 87.9Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5" /></g><polygon points="154,80 166,80 182,232 138,232" fill="#6B4423" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" /><g class="fall" style="animation-delay:1.2s"><path d="M160 87.9Q166.3 96.9 160 100.5Q153.7 96.9 160 87.9Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5" /></g><polygon points="244,80 256,80 272,232 228,232" fill="#6B4423" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" /><g class="fall" style="animation-delay:1.0s"><path d="M250 87.9Q256.3 96.9 250 100.5Q243.7 96.9 250 87.9Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5" /></g><polygon points="324,80 336,80 352,232 308,232" fill="#6B4423" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round" /><g class="fall" style="animation-delay:0.2s"><path d="M330 87.9Q336.3 96.9 330 100.5Q323.7 96.9 330 87.9Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5" /></g><g fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"><ellipse cx="110" cy="36" rx="22" ry="11"/><ellipse cx="98" cy="30" rx="11" ry="9"/><ellipse cx="118" cy="27" rx="12" ry="10"/></g><g fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"><ellipse cx="300" cy="40" rx="22" ry="11"/><ellipse cx="288" cy="34" rx="11" ry="9"/><ellipse cx="308" cy="31" rx="12" ry="10"/></g></svg>
