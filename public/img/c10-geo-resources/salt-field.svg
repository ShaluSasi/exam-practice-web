<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A canal field where water has risen to the surface and left a white salty crust</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.spin{transform-box:fill-box;transform-origin:center;animation:spin 4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.fall{animation:fall 2s linear infinite}@keyframes fall{0%{transform:translateY(-8px);opacity:0}30%{opacity:1}100%{transform:translateY(26px);opacity:0}}.rise{animation:rise 3s ease-out infinite}@keyframes rise{0%{transform:translateY(8px);opacity:.9}100%{transform:translateY(-22px);opacity:0}}.flow{stroke-dasharray:8 6;animation:flow 1s linear infinite}@keyframes flow{to{stroke-dashoffset:-14}}.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite}@keyframes sway{50%{transform:rotate(4deg)}}.tilt{transform-box:fill-box;transform-origin:center;animation:tilt 4s ease-in-out infinite}@keyframes tilt{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}.slide{animation:slide 3s ease-in-out infinite}@keyframes slide{50%{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#E3F2FD"/>
<rect x="30" y="70" width="340" height="130" rx="6" fill="#B58A5A" stroke="#2B2F4A" stroke-width="3" /><rect x="30" y="130" width="340" height="70" rx="0" fill="#7BC4E8" /><rect x="30" y="70" width="340" height="130" rx="6" fill="none" stroke="#2B2F4A" stroke-width="3" /><path d="M30 130q20 -10 40 0t40 0t40 0t40 0t40 0t40 0t40 0t40 0" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="slide"/><polygon points="46,70 54,62 62,70" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round" /><polygon points="76,70 84,62 92,70" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round" /><polygon points="106,70 114,62 122,70" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round" /><polygon points="136,70 144,62 152,70" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round" /><polygon points="166,70 174,62 182,70" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round" /><polygon points="196,70 204,62 212,70" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round" /><polygon points="226,70 234,62 242,70" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round" /><polygon points="256,70 264,62 272,70" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round" /><polygon points="286,70 294,62 302,70" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round" /><polygon points="316,70 324,62 332,70" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round" /><polygon points="346,70 354,62 362,70" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round" /><rect x="150" y="100" width="100" height="24" rx="6" fill="#7BC4E8" stroke="#2B2F4A" stroke-width="2" class="pu"/><text x="200" y="117" font-size="12" text-anchor="middle" >Over-irrigation</text><text x="200" y="222" font-size="12" text-anchor="middle" >Water-logging raises salt in the soil</text><text x="200" y="40" font-size="14" text-anchor="middle" >Salinity and alkalinity</text></svg>
