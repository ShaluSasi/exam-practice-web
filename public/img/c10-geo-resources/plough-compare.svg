<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Two slopes ploughed in different directions with arrows for flowing water</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.spin{transform-box:fill-box;transform-origin:center;animation:spin 4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.fall{animation:fall 2s linear infinite}@keyframes fall{0%{transform:translateY(-8px);opacity:0}30%{opacity:1}100%{transform:translateY(26px);opacity:0}}.rise{animation:rise 3s ease-out infinite}@keyframes rise{0%{transform:translateY(8px);opacity:.9}100%{transform:translateY(-22px);opacity:0}}.flow{stroke-dasharray:8 6;animation:flow 1s linear infinite}@keyframes flow{to{stroke-dashoffset:-14}}.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite}@keyframes sway{50%{transform:rotate(4deg)}}.tilt{transform-box:fill-box;transform-origin:center;animation:tilt 4s ease-in-out infinite}@keyframes tilt{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}.slide{animation:slide 3s ease-in-out infinite}@keyframes slide{50%{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#E3F2FD"/>
<polygon points="16,60 186,60 186,190 16,190" fill="#C79A5E" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><line x1="36" y1="66" x2="36" y2="184" stroke="#6B4423" stroke-width="3" stroke-linecap="round" /><line x1="62" y1="66" x2="62" y2="184" stroke="#6B4423" stroke-width="3" stroke-linecap="round" /><line x1="88" y1="66" x2="88" y2="184" stroke="#6B4423" stroke-width="3" stroke-linecap="round" /><line x1="114" y1="66" x2="114" y2="184" stroke="#6B4423" stroke-width="3" stroke-linecap="round" /><line x1="140" y1="66" x2="140" y2="184" stroke="#6B4423" stroke-width="3" stroke-linecap="round" /><line x1="166" y1="66" x2="166" y2="184" stroke="#6B4423" stroke-width="3" stroke-linecap="round" /><line x1="49" y1="70" x2="49" y2="168" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" class="flow"/><polygon points="0,0 -9,-4.5 -9,4.5" fill="#0B93D4" transform="translate(49 176) rotate(90.0)"/><line x1="101" y1="70" x2="101" y2="168" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" class="flow"/><polygon points="0,0 -9,-4.5 -9,4.5" fill="#0B93D4" transform="translate(101 176) rotate(90.0)"/><line x1="153" y1="70" x2="153" y2="168" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" class="flow"/><polygon points="0,0 -9,-4.5 -9,4.5" fill="#0B93D4" transform="translate(153 176) rotate(90.0)"/><text x="101" y="214" font-size="12" text-anchor="middle" >Up and down the slope</text><polygon points="214,60 384,60 384,190 214,190" fill="#C79A5E" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round" /><line x1="220" y1="80" x2="378" y2="80" stroke="#6B4423" stroke-width="3" stroke-linecap="round" /><line x1="220" y1="100" x2="378" y2="100" stroke="#6B4423" stroke-width="3" stroke-linecap="round" /><line x1="220" y1="120" x2="378" y2="120" stroke="#6B4423" stroke-width="3" stroke-linecap="round" /><line x1="220" y1="140" x2="378" y2="140" stroke="#6B4423" stroke-width="3" stroke-linecap="round" /><line x1="220" y1="160" x2="378" y2="160" stroke="#6B4423" stroke-width="3" stroke-linecap="round" /><line x1="220" y1="180" x2="378" y2="180" stroke="#6B4423" stroke-width="3" stroke-linecap="round" /><g class="pu"><line x1="254" y1="70" x2="254" y2="80" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" /></g><g class="pu"><line x1="299" y1="70" x2="299" y2="80" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" /></g><g class="pu"><line x1="344" y1="70" x2="344" y2="80" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" /></g><text x="299" y="214" font-size="12" text-anchor="middle" >Along the contour lines</text><text x="100" y="40" font-size="12" text-anchor="middle" >Slope 1</text><text x="300" y="40" font-size="12" text-anchor="middle" >Slope 2</text></svg>
