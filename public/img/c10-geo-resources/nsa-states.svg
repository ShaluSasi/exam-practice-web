<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Net sown area as a share of total area for six states and union territory</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.spin{transform-box:fill-box;transform-origin:center;animation:spin 4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.fall{animation:fall 2s linear infinite}@keyframes fall{0%{transform:translateY(-8px);opacity:0}30%{opacity:1}100%{transform:translateY(26px);opacity:0}}.rise{animation:rise 3s ease-out infinite}@keyframes rise{0%{transform:translateY(8px);opacity:.9}100%{transform:translateY(-22px);opacity:0}}.flow{stroke-dasharray:8 6;animation:flow 1s linear infinite}@keyframes flow{to{stroke-dashoffset:-14}}.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite}@keyframes sway{50%{transform:rotate(4deg)}}.tilt{transform-box:fill-box;transform-origin:center;animation:tilt 4s ease-in-out infinite}@keyframes tilt{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}.slide{animation:slide 3s ease-in-out infinite}@keyframes slide{50%{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200" y="24" font-size="14" text-anchor="middle" >Net sown area (% of total area)</text><rect x="30" y="55" width="40" height="135" rx="4" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" class="pu" style="animation-delay:0.0s"/><text x="50" y="206" font-size="10" text-anchor="middle" >Punjab</text><rect x="90" y="58" width="40" height="132" rx="4" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2.5" class="pu" style="animation-delay:0.2s"/><text x="110" y="206" font-size="10" text-anchor="middle" >Haryana</text><rect x="150" y="179.5" width="40" height="10.5" rx="4" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" class="pu" style="animation-delay:0.4s"/><text x="170" y="206" font-size="10" text-anchor="middle" >Arunachal</text><rect x="210" y="181" width="40" height="9" rx="4" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" class="pu" style="animation-delay:0.6s"/><text x="230" y="206" font-size="10" text-anchor="middle" >Mizoram</text><rect x="270" y="178" width="40" height="12" rx="4" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" class="pu" style="animation-delay:0.8s"/><text x="290" y="206" font-size="10" text-anchor="middle" >Manipur</text><rect x="330" y="182.5" width="40" height="7.5" rx="4" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2.5" class="pu" style="animation-delay:1.0s"/><text x="350" y="206" font-size="10" text-anchor="middle" >A and N Is.</text><line x1="20" y1="70" x2="390" y2="70" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 5" /><text x="386" y="64" font-size="12" text-anchor="end" fill="#E5484D" class="h" >80%</text><line x1="20" y1="175" x2="390" y2="175" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 5" /><text x="386" y="169" font-size="12" text-anchor="end" fill="#E5484D" class="h" >10%</text><line x1="20" y1="190" x2="392" y2="190" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><text x="200" y="228" font-size="10" text-anchor="middle" >Bars are drawn to show only which side of each line a state falls</text></svg>
