<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A time line with four unlabelled markers</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.spin{transform-box:fill-box;transform-origin:center;animation:spin 4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.fall{animation:fall 2s linear infinite}@keyframes fall{0%{transform:translateY(-8px);opacity:0}30%{opacity:1}100%{transform:translateY(26px);opacity:0}}.rise{animation:rise 3s ease-out infinite}@keyframes rise{0%{transform:translateY(8px);opacity:.9}100%{transform:translateY(-22px);opacity:0}}.flow{stroke-dasharray:8 6;animation:flow 1s linear infinite}@keyframes flow{to{stroke-dashoffset:-14}}.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite}@keyframes sway{50%{transform:rotate(4deg)}}.tilt{transform-box:fill-box;transform-origin:center;animation:tilt 4s ease-in-out infinite}@keyframes tilt{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}.slide{animation:slide 3s ease-in-out infinite}@keyframes slide{50%{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<line x1="24" y1="120" x2="372" y2="120" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" /><polygon points="0,0 -9,-4.5 -9,4.5" fill="#2B2F4A" transform="translate(380 120) rotate(0.0)"/><circle cx="70" cy="120" r="17" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="3" /><text x="70" y="126" font-size="15" text-anchor="middle" fill="#FFFFFF" >1</text><line x1="70" y1="103" x2="70" y2="80" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><rect x="42" y="56" width="56" height="24" rx="6" fill="#FFF3B0" stroke="#2B2F4A" stroke-width="2.5" /><text x="70" y="72" font-size="14" text-anchor="middle" >?</text><circle cx="160" cy="120" r="17" fill="#0B93D4" stroke="#2B2F4A" stroke-width="3" /><text x="160" y="126" font-size="15" text-anchor="middle" fill="#FFFFFF" >2</text><line x1="160" y1="137" x2="160" y2="160" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><rect x="132" y="160" width="56" height="24" rx="6" fill="#FFF3B0" stroke="#2B2F4A" stroke-width="2.5" /><text x="160" y="176" font-size="14" text-anchor="middle" >?</text><circle cx="250" cy="120" r="17" fill="#3FA34D" stroke="#2B2F4A" stroke-width="3" /><text x="250" y="126" font-size="15" text-anchor="middle" fill="#FFFFFF" >3</text><line x1="250" y1="103" x2="250" y2="80" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><rect x="222" y="56" width="56" height="24" rx="6" fill="#FFF3B0" stroke="#2B2F4A" stroke-width="2.5" /><text x="250" y="72" font-size="14" text-anchor="middle" >?</text><circle cx="340" cy="120" r="17" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="3" /><text x="340" y="126" font-size="15" text-anchor="middle" fill="#FFFFFF" >4</text><line x1="340" y1="137" x2="340" y2="160" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><rect x="312" y="160" width="56" height="24" rx="6" fill="#FFF3B0" stroke="#2B2F4A" stroke-width="2.5" /><text x="340" y="176" font-size="14" text-anchor="middle" >?</text><text x="200" y="210" font-size="13" text-anchor="middle" >Time</text></svg>
