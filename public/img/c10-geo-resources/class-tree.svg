ight="28" rx="7" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" /><text x="205" y="134" font-size="11" text-anchor="middle" >Non-renewable</text><rect x="4" y="191" width="76" height="52" rx="7" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" /><text x="42" y="209" font-size="11" text-anchor="middle" >Continuous</text><text x="42" y="222" font-size="11" text-anchor="middle" >or flow:</text><text x="42" y="235" font-size="11" text-anchor="middle" >wind, water</text><rect x="89" y="191" width="82" height="52" rx="7" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" /><text x="130" y="209" font-size="11" text-anchor="middle" >Biological:</text><text x="130" y="222" font-size="11" text-anchor="middle" >forests,</text><text x="130" y="235" font-size="11" text-anchor="middle" >wildlife</text><rect x="177" y="191" width="82" height="38" rx="7" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" /><text x="218" y="209" font-size="11" text-anchor="middle" >Recyclable:</text><text x="218" y="222" font-size="11" text-anchor="middle" >e.g. metals</text><rect x="265" y="191" width="90" height="52" rx="7" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2" /><text x="310" y="209" font-size="11" text-anchor="middle" >Non-recyclable:</text><text x="310" y="222" font-size="11" text-anchor="middle" >e.g. fossil</text><text x="310" y="235" font-size="11" text-anchor="middle" >fuels</text><rect x="315" y="136" width="80" height="52" rx="7" fill="#FFF0DC" stroke="#2B2F4A" stroke-width="2" /><text x="355" y="154" font-size="11" text-anchor="middle" >Structures</text><text x="355" y="167" font-size="11" text-anchor="middle" >and</text><text x="355" y="180" font-size="11" text-anchor="middle" >institutions</text><rect x="402" y="136" width="76" height="52" rx="7" fill="#FFF0DC" stroke="#2B2F4A" stroke-width="2" /><text x="440" y="154" font-size="11" text-anchor="middle" >Quantity</text><text x="440" y="167" font-size="11" text-anchor="middle" >and</text><text x="440" y="180" font-size="11" text-anchor="middle" >quality</text></svg>
