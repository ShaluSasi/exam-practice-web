" /><polygon points="112,78 118,74 122,80 116,84" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.2" stroke-linejoin="round" /><polygon points="148,78 154,74 158,80 152,84" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.2" stroke-linejoin="round" /><polygon points="184,78 190,74 194,80 188,84" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.2" stroke-linejoin="round" /><polygon points="220,78 226,74 230,80 224,84" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.2" stroke-linejoin="round" /><polygon points="256,78 262,74 266,80 260,84" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.2" stroke-linejoin="round" /><g class="fall" style="animation-delay:0.0s"><path d="M150 58.8Q155.6 66.8 150 70Q144.4 66.8 150 58.8Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5" /></g><g class="fall" style="animation-delay:0.6s"><path d="M200 58.8Q205.6 66.8 200 70Q194.4 66.8 200 58.8Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5" /></g><g class="fall" style="animation-delay:1.2s"><path d="M250 58.8Q255.6 66.8 250 70Q244.4 66.8 250 58.8Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5" /></g><text x="300" y="92" font-size="12" text-anchor="start" >Sandy and</text><text x="300" y="107" font-size="12" text-anchor="start" >saline top</text><text x="300" y="172" font-size="12" text-anchor="start" >Kankar layer</text><text x="300" y="187" font-size="12" text-anchor="start" >stops water</text></svg>
