<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.spin{transform-box:fill-box;transform-origin:center;animation:spin 4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.fall{animation:fall 2s linear infinite}@keyframes fall{0%{transform:translateY(-8px);opacity:0}30%{opacity:1}100%{transform:translateY(26px);opacity:0}}.rise{animation:rise 3s ease-out infinite}@keyframes rise{0%{transform:translateY(8px);opacity:.9}100%{transform:translateY(-22px);opacity:0}}.flow{stroke-dasharray:8 6;animation:flow 1s linear infinite}@keyframes flow{to{stroke-dashoffset:-14}}.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite}@keyframes sway{50%{transform:rotate(4deg)}}.tilt{transform-box:fill-box;transform-origin:center;animation:tilt 4s ease-in-out infinite}@keyframes tilt{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}.slide{animation:slide 3s ease-in-out infinite}@keyframes slide{50%{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
