<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Five things that shape soil, with arrows pointing to a block of soil</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.spin{transform-box:fill-box;transform-origin:center;animation:spin 4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.fall{animation:fall 2s linear infinite}@keyframes fall{0%{transform:translateY(-8px);opacity:0}30%{opacity:1}100%{transform:translateY(26px);opacity:0}}.rise{animation:rise 3s ease-out infinite}@keyframes rise{0%{transform:translateY(8px);opacity:.9}100%{transform:translateY(-22px);opacity:0}}.flow{stroke-dasharray:8 6;animation:flow 1s linear infinite}@keyframes flow{to{stroke-dashoffset:-14}}.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite}@keyframes sway{50%{transform:rotate(4deg)}}.tilt{transform-box:fill-box;transform-origin:center;animation:tilt 4s ease-in-out infinite}@keyframes tilt{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}.slide{animation:slide 3s ease-in-out infinite}@keyframes slide{50%{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="150" y="92" width="100" height="56" rx="10" fill="#8A5A2B" stroke="#2B2F4A" stroke-width="3" /><text x="200" y="126" font-size="18" text-anchor="middle" fill="#FFFFFF" >SOIL</text><rect x="14" y="20" width="112" height="30" rx="8" fill="#FFF3B0" stroke="#2B2F4A" stroke-width="2.5" /><text x="70" y="40" font-size="12" text-anchor="middle" >Relief</text><line x1="100" y1="52" x2="144.2" y2="94.5" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" class="flow"/><polygon points="0,0 -9,-4.5 -9,4.5" fill="#FF8A1F" transform="translate(150 100) rotate(43.8)"/><rect x="144" y="14" width="112" height="30" rx="8" fill="#FFF3B0" stroke="#2B2F4A" stroke-width="2.5" /><text x="200" y="34" font-size="12" text-anchor="middle" >Parent rock</text><line x1="200" y1="46" x2="200" y2="82" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" class="flow"/><polygon points="0,0 -9,-4.5 -9,4.5" fill="#FF8A1F" transform="translate(200 90) rotate(90.0)"/><rect x="274" y="20" width="112" height="30" rx="8" fill="#FFF3B0" stroke="#2B2F4A" stroke-width="2.5" /><text x="330" y="40" font-size="12" text-anchor="middle" >Climate</text><line x1="300" y1="52" x2="255.8" y2="94.5" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" class="flow"/><polygon points="0,0 -9,-4.5 -9,4.5" fill="#FF8A1F" transform="translate(250 100) rotate(136.2)"/><rect x="14" y="188" width="112" height="30" rx="8" fill="#FFF3B0" stroke="#2B2F4A" stroke-width="2.5" /><text x="70" y="208" font-size="12" text-anchor="middle" >Vegetation, life</text><line x1="100" y1="188" x2="144.2" y2="145.5" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" class="flow"/><polygon points="0,0 -9,-4.5 -9,4.5" fill="#FF8A1F" transform="translate(150 140) rotate(-43.8)"/><rect x="274" y="188" width="112" height="30" rx="8" fill="#FFF3B0" stroke="#2B2F4A" stroke-width="2.5" /><text x="330" y="208" font-size="12" text-anchor="middle" >Time</text><line x1="300" y1="188" x2="255.8" y2="145.5" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" class="flow"/><polygon points="0,0 -9,-4.5 -9,4.5" fill="#FF8A1F" transform="translate(250 140) rotate(-136.2)"/></svg>
