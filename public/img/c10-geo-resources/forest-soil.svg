224" y="64" font-size="11" text-anchor="start" >acidic, little humus</text><text x="250" y="108" font-size="11" text-anchor="start" >Upper slopes:</text><text x="250" y="122" font-size="11" text-anchor="start" >coarse grained</text><text x="6" y="236" font-size="11" text-anchor="start" >Valley sides: loamy and silty</text></svg>
