<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Black soil in the hot season with deep cracks, and after rain when it is sticky</title>
<style>text{font-family:sans-serif;font-weight:700;fill:#2B2F4A;font-size:13px}.h{paint-order:stroke;stroke:#FFF9EE;stroke-width:4px;stroke-linejoin:round}.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{0%,100%{opacity:1}50%{opacity:.45}}.bob{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px)}}.spin{transform-box:fill-box;transform-origin:center;animation:spin 4s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.fall{animation:fall 2s linear infinite}@keyframes fall{0%{transform:translateY(-8px);opacity:0}30%{opacity:1}100%{transform:translateY(26px);opacity:0}}.rise{animation:rise 3s ease-out infinite}@keyframes rise{0%{transform:translateY(8px);opacity:.9}100%{transform:translateY(-22px);opacity:0}}.flow{stroke-dasharray:8 6;animation:flow 1s linear infinite}@keyframes flow{to{stroke-dashoffset:-14}}.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite}@keyframes sway{50%{transform:rotate(4deg)}}.tilt{transform-box:fill-box;transform-origin:center;animation:tilt 4s ease-in-out infinite}@keyframes tilt{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}.slide{animation:slide 3s ease-in-out infinite}@keyframes slide{50%{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#E3F2FD"/>
<g class="pu"><line x1="88" y1="38" x2="94" y2="38" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" /><line x1="82.7" y1="50.7" x2="87" y2="55" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" /><line x1="70" y1="56" x2="70" y2="62" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" /><line x1="57.3" y1="50.7" x2="53" y2="55" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" /><line x1="52" y1="38" x2="46" y2="38" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" /><line x1="57.3" y1="25.3" x2="53" y2="21" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" /><line x1="70" y1="20" x2="70" y2="14" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" /><line x1="82.7" y1="25.3" x2="87" y2="21" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" /></g><circle cx="70" cy="38" r="14" fill="#FFC93C" stroke="#FF8A1F" stroke-width="3" /><rect x="14" y="100" width="170" height="100" rx="6" fill="#2E2E38" stroke="#2B2F4A" stroke-width="3" /><path d="M40 100L52 130L44 160L60 200" fill="none" stroke="#B8B2A0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M100 100L92 140L108 170L96 200" fill="none" stroke="#B8B2A0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M150 100L158 130L144 168L152 200" fill="none" stroke="#B8B2A0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M70 128L100 140M120 150L158 130" fill="none" stroke="#B8B2A0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="99" y="224" font-size="12" text-anchor="middle" >Hot weather: deep cracks</text><g fill="#C9CCE0" stroke="#2B2F4A" stroke-width="2"><ellipse cx="300" cy="44" rx="24.2" ry="12.1"/><ellipse cx="286.8" cy="37.4" rx="12.1" ry="9.9"/><ellipse cx="308.8" cy="34.1" rx="13.2" ry="11"/></g><g class="fall" style="animation-delay:0.0s"><path d="M260 66.8Q265.6 74.8 260 78Q254.4 74.8 260 66.8Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5" /></g><g class="fall" style="animation-delay:0.5s"><path d="M282 66.8Q287.6 74.8 282 78Q276.4 74.8 282 66.8Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5" /></g><g class="fall" style="animation-delay:1.0s"><path d="M304 66.8Q309.6 74.8 304 78Q298.4 74.8 304 66.8Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5" /></g><g class="fall" style="animation-delay:1.5s"><path d="M326 66.8Q331.6 74.8 326 78Q320.4 74.8 326 66.8Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5" /></g><g class="fall" style="animation-delay:2.0s"><path d="M348 66.8Q353.6 74.8 348 78Q342.4 74.8 348 66.8Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5" /></g><rect x="216" y="110" width="170" height="90" rx="6" fill="#4A4A58" stroke="#2B2F4A" stroke-width="3" /><ellipse cx="240" cy="145" rx="16" ry="8" fill="#5C5C6B" stroke="#2B2F4A" stroke-width="1.5"/><ellipse cx="290" cy="160" rx="16" ry="8" fill="#5C5C6B" stroke="#2B2F4A" stroke-width="1.5"/><ellipse cx="335" cy="140" rx="16" ry="8" fill="#5C5C6B" stroke="#2B2F4A" stroke-width="1.5"/><ellipse cx="270" cy="130" rx="16" ry="8" fill="#5C5C6B" stroke="#2B2F4A" stroke-width="1.5"/><ellipse cx="355" cy="175" rx="16" ry="8" fill="#5C5C6B" stroke="#2B2F4A" stroke-width="1.5"/><ellipse cx="240" cy="180" rx="16" ry="8" fill="#5C5C6B" stroke="#2B2F4A" stroke-width="1.5"/><text x="301" y="224" font-size="12" text-anchor="middle" >After rain: sticky</text></svg>
