ill="#F6E27A" stroke="#2B2F4A" stroke-width="2.5" /><text x="55" y="144" font-size="11" text-anchor="middle" >Season 1</text><text x="55" y="176" font-size="11" text-anchor="middle" >Season 2</text><rect x="94" y="120" width="66" height="36" rx="4" fill="#8BCB6B" stroke="#2B2F4A" stroke-width="2.5" /><rect x="94" y="156" width="66" height="30" rx="4" fill="#F6E27A" stroke="#2B2F4A" stroke-width="2.5" /><text x="127" y="144" font-size="11" text-anchor="middle" >Season 1</text><text x="127" y="176" font-size="11" text-anchor="middle" >Season 2</text><rect x="166" y="120" width="66" height="36" rx="4" fill="#8BCB6B" stroke="#2B2F4A" stroke-width="2.5" /><rect x="166" y="156" width="66" height="30" rx="4" fill="#E3D5B8" stroke="#2B2F4A" stroke-width="2.5" /><text x="199" y="144" font-size="11" text-anchor="middle" >Season 1</text><text x="199" y="176" font-size="11" text-anchor="middle" >bare</text><rect x="238" y="120" width="66" height="36" rx="4" fill="#8BCB6B" stroke="#2B2F4A" stroke-width="2.5" /><rect x="238" y="156" width="66" height="30" rx="4" fill="#E3D5B8" stroke="#2B2F4A" stroke-width="2.5" /><text x="271" y="144" font-size="11" text-anchor="middle" >Season 1</text><text x="271" y="176" font-size="11" text-anchor="middle" >bare</text><rect x="310" y="120" width="66" height="36" rx="4" fill="#8BCB6B" stroke="#2B2F4A" stroke-width="2.5" /><rect x="310" y="156" width="66" height="30" rx="4" fill="#E3D5B8" stroke="#2B2F4A" stroke-width="2.5" /><text x="343" y="144" font-size="11" text-anchor="middle" >Season 1</text><text x="343" y="176" font-size="11" text-anchor="middle" >bare</text><rect x="22" y="208" width="14" height="14" rx="2" fill="#8BCB6B" stroke="#2B2F4A" stroke-width="1.5" /><text x="42" y="220" font-size="11" text-anchor="start" >crop sown</text><rect x="130" y="208" width="14" height="14" rx="2" fill="#F6E27A" stroke="#2B2F4A" stroke-width="1.5" /><text x="150" y="220" font-size="11" text-anchor="start" >sown again</text><rect x="250" y="208" width