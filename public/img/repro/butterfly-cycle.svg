<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
<title>The life cycle of a butterfly</title>
<style>
.ar{stroke-dasharray:6 8;animation:run 1.6s linear infinite}
@keyframes run{to{stroke-dashoffset:-28}}
.flap{animation:flap 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes flap{50%{transform:scaleX(.7)}}
.inch{animation:inch 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes inch{50%{transform:translateX(4px) scaleX(1.05)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
