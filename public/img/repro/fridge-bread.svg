<path d="M78 166v-28q0-10 12-10h22q12 0 12 10v28z" fill="#F6E2B8"/>
<g stroke="#4A90C8" stroke-width="2" stroke-linecap="round"><path d="M100 70v24M88 76l24 12M112 76l-24 12"/></g>
<text x="101" y="226" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#2B2F4A" text-anchor="middle">5 °C</text>
