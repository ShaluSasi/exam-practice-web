<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
<title>One bread slice kept in a refrigerator and one left on a warm kitchen counter</title>
<style>
.m{animation:m 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.m2{animation-delay:-1.5s}.m3{animation-delay:-3s}
@keyframes m{0%{transform:scale(.2)}60%,90%{transform:scale(1)}100%{transform:scale(.2)}}
.sun{animation:spin 12s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
