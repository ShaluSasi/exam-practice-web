<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
<title>A stem piece planted at a slant in soil</title>
<style>
.rt{stroke-dasharray:60;stroke-dashoffset:60;animation:root 5s ease-in-out infinite}
.r2{animation-delay:-.6s}.r3{animation-delay:-1.2s}
@keyframes root{0%,10%{stroke-dashoffset:60}60%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:60}}
.lf{animation:lf 5s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 100%}
@keyframes lf{0%,20%{transform:scale(.4)}70%,90%{transform:scale(1)}100%{transform:scale(.4)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.rt{stroke-dashoffset:0}}
</style>
