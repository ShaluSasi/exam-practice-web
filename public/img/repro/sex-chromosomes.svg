<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
<title>An egg carrying an X chromosome and a sperm carrying a Y chromosome</title>
<style>
.sp{animation:sw 3s ease-in-out infinite}
@keyframes sw{50%{transform:translateX(-10px)}}
.q{animation:q 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes q{50%{transform:scale(1.12)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="80" cy="110" r="56" fill="#FDE3CF" stroke="#E0A08A" stroke-width="5"/>
<circle cx="80" cy="110" r="26" fill="#D9C3F5" stroke="#7B4BC0" stroke-width="2.5"/>
<text x="80" y="120" font-family="system-ui, sans-serif" font-size="26" font-weight="600" fill="#2B2F4A" text-anchor="middle">X</text>
<text x="152" y="122" font-family="system-ui, sans-serif" font-size="30" font-weight="600" fill="#2B2F4A" text-anchor="middle">+</text>
<g class="sp">
<ellipse cx="206" cy="110" rx="24" ry="17" fill="#CDE9FF" stroke="#2F6FA8" stroke-width="2.5"/>
<path d="M230 110q12-10 24 0t24 0" fill="none" stroke="#2F6FA8" stroke-width="3" stroke-linecap="round"/>
<text x="206" y="119" font-family="system-ui, sans-serif" font-size="24" font-weight="600" fill="#2B2F4A" text-anchor="middle">Y</text>
</g>
<text x="300" y="122" font-family="system-ui, sans-serif" font-size="30" font-weight="600" fill="#2B2F4A" text-anchor="middle">=</text>
<g class="q"><circle cx="352" cy="110" r="30" fill="#F7E3F0" stroke="#C2557F" stroke-width="3" stroke-dasharray="6 5"/>
<text x="352" y="122" font-family="system-ui, sans-serif" font-size="30" font-weight="600" fill="#2B2F4A" text-anchor="middle">?</text></g>
</svg>
