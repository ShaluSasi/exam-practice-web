<text x="250" y="27">Place A</text><text x="324" y="27">Place B</text>
</g>
<g font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#6B6F86" text-anchor="middle">
<text x="118" y="257">A</text><text x="162" y="257">B</text><text x="268" y="257">A</text><text x="312" y="257">B</text>
</g>
