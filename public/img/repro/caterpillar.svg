<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>A caterpillar munching on a leaf</title>
<style>
.cr{animation:cr 3s ease-in-out infinite}
@keyframes cr{50%{transform:translateX(-14px)}}
.seg{animation:hump 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.s2{animation-delay:-.2s}.s3{animation-delay:-.4s}.s4{animation-delay:-.6s}.s5{animation-delay:-.8s}
@keyframes hump{50%{transform:translateY(-5px)}}
.jaw{animation:jaw .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes jaw{to{transform:scaleY(.6)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M30 200C80 110 220 70 360 80C340 90 336 110 350 120C330 128 330 146 346 152C300 210 140 240 30 200Z" fill="#6DB33F" stroke="#3E7A20" stroke-width="3" stroke-linejoin="round"/>
<path d="M30 200C120 170 240 130 352 96" fill="none" stroke="#3E7A20" stroke-width="2.5"/>
<path d="M120 172l-10-40M190 150l-8-44M260 128l-4-36M150 164l20 36M220 142l24 34" stroke="#3E7A20" stroke-width="1.6"/>
<g class="cr">
<g fill="#F6C453" stroke="#B8860B" stroke-width="2">
<circle class="seg" cx="140" cy="150" r="15"/><circle class="seg s2" cx="164" cy="146" r="16"/><circle class="seg s3" cx="190" cy="142" r="16"/><circle class="seg s4" cx="216" cy="138" r="16"/><circle class="seg s5" cx="242" cy="134" r="16"/>
</g>
<g fill="#2B2F4A"><circle cx="164" cy="140" r="3"/><circle cx="190" cy="136" r="3"/><circle cx="216" cy="132" r="3"/></g>
<circle cx="270" cy="126" r="18" fill="#8CCB5E" stroke="#3E7A20" stroke-width="2.5"/>
<circle cx="276" cy="120" r="3.5" fill="#2B2F4A"/>
<path class="jaw" d="M284 132q6 2 8-4" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/>
<path d="M262 110l-4-14M274 108l4-14" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/>
</g>
</svg>
