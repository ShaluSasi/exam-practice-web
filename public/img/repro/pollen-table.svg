<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 230" role="img">
<title>Pollen grains released and seeds formed for two pollination strategies</title>
<style>
.p{animation:dr 3s ease-in-out infinite}
.p2{animation-delay:-1s}.p3{animation-delay:-2s}
@keyframes dr{50%{transform:translate(6px,-4px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A">
<text x="150" y="40" font-size="13" text-anchor="middle">Pollen grains</text>
<text x="150" y="56" font-size="13" text-anchor="middle">released per flower</text>
<text x="340" y="40" font-size="13" text-anchor="middle">Average number</text>
<text x="340" y="56" font-size="13" text-anchor="middle">of seeds formed</text>
</g>
<rect x="20" y="70" width="400" height="66" rx="12" fill="#EAF4DE" stroke="#8CC152" stroke-width="2"/>
<rect x="20" y="146" width="400" height="66" rx="12" fill="#FDECC8" stroke="#E0A21B" stroke-width="2"/>
<g transform="translate(50 103)">
<path d="M0 26V-14" stroke="#8DB04A" stroke-width="4" stroke-linecap="round"/>
<path d="M0-14l-10-14M0-14v-18M0-14l10-14" stroke="#C9B26A" stroke-width="3" stroke-linecap="round"/>
<path d="M0 14q-16-8-18-24q12 10 18 16z" fill="#9CC46A" stroke="#5E8A2A" stroke-width="1.5"/>
<path d="M14-24q20-6 30 4M14-12q18-4 26 4" fill="none" stroke="#9AB8D8" stroke-width="2" stroke-linecap="round"/>
</g>
<g transform="translate(50 179)">
<g fill="#F6C453" stroke="#C99A1E" stroke-width="1.5"><circle cy="-16" r="8"/><circle cx="15" cy="-5" r="8"/><circle cx="9" cy="13" r="8"/><circle cx="-9" cy="13" r="8"/><circle cx="-15" cy="-5" r="8"/></g>
<circle r="8" fill="#8B5E3C"/>
</g>
<g font-family="system-ui, sans-serif" font-weight="600" fill="#2B2F4A" text-anchor="middle">
<text x="150" y="108" font-size="15">5,00,000 – 10,00,000</text>
<text x="340" y="108" font-size="15">50 – 200</text>
<text x="150" y="184" font-size="15">20,000 – 40,000</text>
<text x="340" y="184" font-size="15">800 – 1,000</text>
</g>
<g fill="#F2C94C"><circle class="p" cx="240" cy="84" r="3"/><circle class="p p2" cx="250" cy="124" r="3"/><circle class="p p3" cx="232" cy="96" r="2.5"/></g>
<path d="M245 70v142" stroke="#C8C0AA" stroke-width="1.5" stroke-dasharray="4 4"/>
</svg>
