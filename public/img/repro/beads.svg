<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
<title>Four pairs of coloured beads, each pair with a light and a dark bead</title>
<style>
.pk{animation:pk 4s ease-in-out infinite}
.k2{animation-delay:-1s}.k3{animation-delay:-2s}.k4{animation-delay:-3s}
@keyframes pk{0%,40%{transform:translateY(0)}50%,90%{transform:translateY(96px)}100%{transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g fill="#FFFFFF" stroke="#E0D3B8" stroke-width="2">
<rect x="20" y="30" width="82" height="64" rx="14"/><rect x="112" y="30" width="82" height="64" rx="14"/><rect x="204" y="30" width="82" height="64" rx="14"/><rect x="296" y="30" width="82" height="64" rx="14"/>
</g>
<g font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle">
<text x="61" y="22">Pair 1</text><text x="153" y="22">Pair 2</text><text x="245" y="22">Pair 3</text><text x="337" y="22">Pair 4</text>
<text x="200" y="208">One bead from each pair</text>
</g>
<rect x="20" y="130" width="358" height="60" rx="14" fill="#F5EEDC" stroke="#D9C9A8" stroke-width="2" stroke-dasharray="6 5"/>
<g stroke-width="2.5">
<circle cx="44" cy="62" r="14" fill="#B7E39A" stroke="#4E8F2A"/>
<g class="pk"><circle cx="78" cy="62" r="14" fill="#2F7D1E" stroke="#1F5A12"/></g>
<g class="pk k2"><circle cx="136" cy="62" r="14" fill="#A8D4F5" stroke="#2F6FA8"/></g>
<circle cx="170" cy="62" r="14" fill="#1F4E9A" stroke="#123468"/>
<g class="pk k3"><circle cx="228" cy="62" r="14" fill="#F7B3B3" stroke="#C9606A"/></g>
<circle cx="262" cy="62" r="14" fill="#B02A2E" stroke="#7A1A1C"/>
<circle cx="320" cy="62" r="14" fill="#FBE7A0" stroke="#C99A1E"/>
<g class="pk k4"><circle cx="354" cy="62" r="14" fill="#D99A1E" stroke="#9A6A0E"/></g>
</g>
<g fill="#FFFFFF" opacity=".6"><circle cx="40" cy="57" r="4"/><circle cx="74" cy="57" r="4"/><circle cx="132" cy="57" r="4"/><circle cx="166" cy="57" r="4"/><circle cx="224" cy="57" r="4"/><circle cx="258" cy="57" r="4"/><circle cx="316" cy="57" r="4"/><circle cx="350" cy="57" r="4"/></g>
</svg>
