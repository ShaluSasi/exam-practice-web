<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
<title>A hydra attached to a rock under water</title>
<style>
.bud{animation:bud 6s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 100%}
@keyframes bud{0%{transform:translate(0,0) scale(.15);opacity:1}50%{transform:translate(0,0) scale(1);opacity:1}80%{transform:translate(60px,30px) scale(1);opacity:1}95%{opacity:0;transform:translate(60px,30px) scale(1)}100%{opacity:0;transform:scale(.15)}}
.tn{animation:wave 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes wave{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
