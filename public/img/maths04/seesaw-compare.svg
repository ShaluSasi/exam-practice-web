<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" role="img">
<title>A seesaw with (a plus b) squared on one side and a squared plus b squared on the other</title>
<style>.t{font-family:system-ui, sans-serif;font-weight:600;fill:#2B2F4A}.v{font-style:italic}.bm{transform-box:view-box;transform-origin:200px 157px;animation:sw 4s ease-in-out infinite}@keyframes sw{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M180 200L200 160L220 200Z" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="20" y="200" width="360" height="12" rx="6" fill="#D9C49A"/>
<g class="bm">
<rect x="40" y="152" width="320" height="10" rx="5" fill="#C8925A" stroke="#2B2F4A" stroke-width="2"/>
<rect x="45" y="100" width="120" height="52" rx="10" fill="#F6C453" stroke="#2B2F4A" stroke-width="2.5"/><text class="t" x="105" y="133" font-size="19" text-anchor="middle">(a + b)²</text>
<rect x="235" y="100" width="120" height="52" rx="10" fill="#8EC5F0" stroke="#2B2F4A" stroke-width="2.5"/><text class="t" x="295" y="133" font-size="19" text-anchor="middle">a² + b²</text>
</g>
<text class="t" x="200" y="50" font-size="16" text-anchor="middle">Which side is heavier?</text>
</svg>
