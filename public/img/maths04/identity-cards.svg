<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Four identity flash cards</title>
<style>.t{font-family:system-ui, sans-serif;font-weight:600;fill:#2B2F4A}.v{font-style:italic}.f{animation:fl 4s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g class="f" style="animation-delay:0.0s"><rect x="30" y="30" width="160" height="80" rx="14" fill="#F6C453" stroke="#2B2F4A" stroke-width="2.5"/><rect x="38" y="38" width="144" height="64" rx="10" fill="none" stroke="#FFF9EE" stroke-width="2" stroke-dasharray="5 5"/><text class="t" x="110" y="78" font-size="21" text-anchor="middle">(a + b)²</text></g>
<g class="f" style="animation-delay:0.5s"><rect x="210" y="30" width="160" height="80" rx="14" fill="#F79A8C" stroke="#2B2F4A" stroke-width="2.5"/><rect x="218" y="38" width="144" height="64" rx="10" fill="none" stroke="#FFF9EE" stroke-width="2" stroke-dasharray="5 5"/><text class="t" x="290" y="78" font-size="21" text-anchor="middle">(a − b)²</text></g>
<g class="f" style="animation-delay:1.0s"><rect x="30" y="130" width="160" height="80" rx="14" fill="#8FD19E" stroke="#2B2F4A" stroke-width="2.5"/><rect x="38" y="138" width="144" height="64" rx="10" fill="none" stroke="#FFF9EE" stroke-width="2" stroke-dasharray="5 5"/><text class="t" x="110" y="178" font-size="21" text-anchor="middle">(a + b)(a − b)</text></g>
<g class="f" style="animation-delay:1.5s"><rect x="210" y="130" width="160" height="80" rx="14" fill="#B9C2F7" stroke="#2B2F4A" stroke-width="2.5"/><rect x="218" y="138" width="144" height="64" rx="10" fill="none" stroke="#FFF9EE" stroke-width="2" stroke-dasharray="5 5"/><text class="t" x="290" y="178" font-size="21" text-anchor="middle">(a + b)³</text></g>
</svg>
