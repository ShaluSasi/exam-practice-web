<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
<title>Six cards showing pairs of numbers whose product is minus 42</title>
<style>.t{font-family:system-ui, sans-serif;font-weight:600;fill:#2B2F4A}.v{font-style:italic}.c{animation:bob 4s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text class="t" x="200" y="34" font-size="16" text-anchor="middle">Pairs that multiply to −42</text>
<g class="c" style="animation-delay:0.00s"><rect x="22" y="52" width="170" height="64" rx="12" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="54" cy="84" r="18" fill="#FFF9EE" stroke="#0B93D4" stroke-width="2" stroke-dasharray="4 4"/><text class="t" x="134" y="92" font-size="20" text-anchor="middle">−6  and  7</text></g>
<g class="c" style="animation-delay:0.25s"><rect x="208" y="52" width="170" height="64" rx="12" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="240" cy="84" r="18" fill="#FFF9EE" stroke="#0B93D4" stroke-width="2" stroke-dasharray="4 4"/><text class="t" x="320" y="92" font-size="20" text-anchor="middle">3  and  −14</text></g>
<g class="c" style="animation-delay:0.50s"><rect x="22" y="132" width="170" height="64" rx="12" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="54" cy="164" r="18" fill="#FFF9EE" stroke="#0B93D4" stroke-width="2" stroke-dasharray="4 4"/><text class="t" x="134" y="172" font-size="20" text-anchor="middle">6  and  −7</text></g>
<g class="c" style="animation-delay:0.75s"><rect x="208" y="132" width="170" height="64" rx="12" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="240" cy="164" r="18" fill="#FFF9EE" stroke="#0B93D4" stroke-width="2" stroke-dasharray="4 4"/><text class="t" x="320" y="172" font-size="20" text-anchor="middle">−3  and  14</text></g>
<g class="c" style="animation-delay:1.00s"><rect x="22" y="212" width="170" height="64" rx="12" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="54" cy="244" r="18" fill="#FFF9EE" stroke="#0B93D4" stroke-width="2" stroke-dasharray="4 4"/><text class="t" x="134" y="252" font-size="20" text-anchor="middle">2  and  −21</text></g>
<g class="c" style="animation-delay:1.25s"><rect x="208" y="212" width="170" height="64" rx="12" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="240" cy="244" r="18" fill="#FFF9EE" stroke="#0B93D4" stroke-width="2" stroke-dasharray="4 4"/><text class="t" x="320" y="252" font-size="20" text-anchor="middle">−2  and  21</text></g>
</svg>
