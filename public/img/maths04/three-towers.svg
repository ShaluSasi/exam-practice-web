<rect class="bk" style="animation-delay:1.5s" x="270" y="95" width="50" height="28" rx="5" fill="#8FD19E" stroke="#2B2F4A" stroke-width="2"/>
<rect class="bk" style="animation-delay:1.6s" x="270" y="65" width="50" height="28" rx="5" fill="#8FD19E" stroke="#2B2F4A" stroke-width="2"/>
<rect class="bk" style="animation-delay:1.7s" x="270" y="35" width="50" height="28" rx="5" fill="#8FD19E" stroke="#2B2F4A" stroke-width="2"/>
<text class="t v" x="295" y="248" font-size="16" text-anchor="middle">n + 1</text>
