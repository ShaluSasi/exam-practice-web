<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>Three mystery boxes a, b and c with two clue cards</title>
<style>.t{font-family:system-ui, sans-serif;font-weight:600;fill:#2B2F4A}.v{font-style:italic}.f{animation:fl 4s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g class="f" style="animation-delay:0.0s"><rect x="50" y="40" width="80" height="70" rx="8" fill="#F28B82" stroke="#2B2F4A" stroke-width="2.5"/><rect x="84" y="40" width="12" height="70" fill="#F6C453" stroke="#2B2F4A" stroke-width="1.5"/><path d="M90 40Q70 18 78 34M90 40Q110 18 102 34" stroke="#2B2F4A" stroke-width="2.5" fill="none"/><circle cx="90" cy="80" r="15" fill="#FFF9EE" stroke="#2B2F4A" stroke-width="2"/><text class="t v" x="90" y="86" font-size="18" text-anchor="middle">a</text></g>
<g class="f" style="animation-delay:0.6s"><rect x="160" y="40" width="80" height="70" rx="8" fill="#8EC5F0" stroke="#2B2F4A" stroke-width="2.5"/><rect x="194" y="40" width="12" height="70" fill="#F6C453" stroke="#2B2F4A" stroke-width="1.5"/><path d="M200 40Q180 18 188 34M200 40Q220 18 212 34" stroke="#2B2F4A" stroke-width="2.5" fill="none"/><circle cx="200" cy="80" r="15" fill="#FFF9EE" stroke="#2B2F4A" stroke-width="2"/><text class="t v" x="200" y="86" font-size="18" text-anchor="middle">b</text></g>
<g class="f" style="animation-delay:1.2s"><rect x="270" y="40" width="80" height="70" rx="8" fill="#8FD19E" stroke="#2B2F4A" stroke-width="2.5"/><rect x="304" y="40" width="12" height="70" fill="#F6C453" stroke="#2B2F4A" stroke-width="1.5"/><path d="M310 40Q290 18 298 34M310 40Q330 18 322 34" stroke="#2B2F4A" stroke-width="2.5" fill="none"/><circle cx="310" cy="80" r="15" fill="#FFF9EE" stroke="#2B2F4A" stroke-width="2"/><text class="t v" x="310" y="86" font-size="18" text-anchor="middle">c</text></g>
<rect x="70" y="135" width="260" height="30" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><text class="t" x="200" y="156" font-size="15" text-anchor="middle">a + b + c = 6</text>
<rect x="70" y="173" width="260" height="30" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><text class="t" x="200" y="194" font-size="15" text-anchor="middle">ab + bc + ca = 11</text>
</svg>
