<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" role="img">
<title>James and Reshma each start expanding (a minus b) squared times (a plus b)</title>
<style>.t{font-family:system-ui, sans-serif;font-weight:600;fill:#2B2F4A}.v{font-style:italic}.f{animation:fl 4s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M34 230Q34 188 60 188Q86 188 86 230Z" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="60" cy="164" r="22" fill="#E9B48A" stroke="#2B2F4A" stroke-width="2.5"/><path d="M38 158Q42 136 60 140Q80 136 82 158Q68 148 38 158Z" fill="#5A3A22" stroke="#2B2F4A" stroke-width="2"/><circle cx="52" cy="164" r="2.6" fill="#2B2F4A"/><circle cx="68" cy="164" r="2.6" fill="#2B2F4A"/><path d="M53 174Q60 180 67 174" stroke="#2B2F4A" stroke-width="2" fill="none" stroke-linecap="round"/>
<path d="M352 230Q352 188 378 188Q404 188 404 230Z" fill="#E5484D" stroke="#2B2F4A" stroke-width="2.5"/><circle cx="378" cy="164" r="22" fill="#E9B48A" stroke="#2B2F4A" stroke-width="2.5"/><path d="M355 164Q356 138 378 140Q400 138 401 164Q390 148 378 150Q366 148 355 164Z" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2"/><path d="M356 162Q348 190 354 206M400 162Q408 190 402 206" stroke="#2B2F4A" stroke-width="7" stroke-linecap="round" fill="none"/><circle cx="370" cy="164" r="2.6" fill="#2B2F4A"/><circle cx="386" cy="164" r="2.6" fill="#2B2F4A"/><path d="M371 174Q378 180 385 174" stroke="#2B2F4A" stroke-width="2" fill="none" stroke-linecap="round"/>
<g class="f"><path d="M12 14H300V98H100L74 124L80 98H12Z" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><text class="t" x="156" y="48" font-size="18" text-anchor="middle">(a − b)²(a + b)</text><text class="t" x="156" y="80" font-size="17" text-anchor="middle">= (a² − 2ab + b²)(a + b)</text></g>
<g class="f" style="animation-delay:2s"><path d="M110 134H330V160L350 172L330 184V212H110Z" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><text class="t" x="220" y="164" font-size="18" text-anchor="middle">(a − b)²(a + b)</text><text class="t" x="220" y="196" font-size="17" text-anchor="middle">= (a − b)(a² − b²)</text></g>
<text class="t" x="60" y="252" font-size="15" text-anchor="middle">James</text>
<text class="t" x="378" y="252" font-size="15" text-anchor="middle">Reshma</text>
</svg>
