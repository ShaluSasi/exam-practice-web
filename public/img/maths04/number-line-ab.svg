<g class="f"><circle cx="104" cy="110" r="9" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2"/><text class="t v" x="104" y="90" font-size="17" text-anchor="middle" style="fill:#0B93D4">b</text></g>
