<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img">
<title>A sum and product diamond with 12 on top and 7 below</title>
<style>.t{font-family:system-ui, sans-serif;font-weight:600;fill:#2B2F4A}.v{font-style:italic}.q{transform-box:fill-box;transform-origin:center;animation:wb 2.4s ease-in-out infinite}@keyframes wb{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M90 30L310 230M310 30L90 230" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round"/>
<rect x="152" y="28" width="96" height="44" rx="10" fill="#F6C453" stroke="#2B2F4A" stroke-width="2.5"/>
<text class="t" x="200" y="58" font-size="20" text-anchor="middle">12</text>
<text class="t" x="200" y="20" font-size="13" text-anchor="middle">multiply to</text>
<rect x="152" y="188" width="96" height="44" rx="10" fill="#8FD19E" stroke="#2B2F4A" stroke-width="2.5"/>
<text class="t" x="200" y="218" font-size="20" text-anchor="middle">7</text>
<text class="t" x="200" y="250" font-size="13" text-anchor="middle">add to</text>
<g class="q" style="animation-delay:0.0s"><circle cx="80" cy="130" r="28" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><text class="t" x="80" y="138" font-size="24" text-anchor="middle">?</text></g>
<g class="q" style="animation-delay:0.6s"><circle cx="320" cy="130" r="28" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2.5"/><text class="t" x="320" y="138" font-size="24" text-anchor="middle">?</text></g>
</svg>
