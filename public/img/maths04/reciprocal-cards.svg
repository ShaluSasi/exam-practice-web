<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img">
<title>A number card plus its reciprocal card equals seventeen quarters</title>
<style>.t{font-family:system-ui, sans-serif;font-weight:600;fill:#2B2F4A}.v{font-style:italic}.fl1,.fl2{transform-box:fill-box;transform-origin:center;animation:fp 4s ease-in-out infinite}.fl2{animation-delay:2s}@keyframes fp{0%,40%,100%{transform:scaleX(1)}20%{transform:scaleX(.1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g class="fl1"><rect x="40" y="50" width="110" height="120" rx="14" fill="#F6C453" stroke="#2B2F4A" stroke-width="2.5"/><text class="t v" x="95" y="124" font-size="40" text-anchor="middle">x</text></g>
<text class="t" x="185" y="124" font-size="34" text-anchor="middle">+</text>
<g class="fl2"><rect x="220" y="50" width="110" height="120" rx="14" fill="#8EC5F0" stroke="#2B2F4A" stroke-width="2.5"/><text class="t" x="275" y="100" font-size="30" text-anchor="middle">1</text><path d="M250 112H300" stroke="#2B2F4A" stroke-width="3"/><text class="t v" x="275" y="148" font-size="30" text-anchor="middle">x</text></g>
<text class="t" x="352" y="124" font-size="30" text-anchor="middle">=</text>
<text class="t" x="382" y="100" font-size="18" text-anchor="middle">17</text>
<path d="M368 108H396" stroke="#2B2F4A" stroke-width="2.5"/>
<text class="t" x="382" y="128" font-size="18" text-anchor="middle">4</text>
</svg>
