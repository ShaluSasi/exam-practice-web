<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" role="img">
<title>Two cubes of volumes 8a cubed and 27b cubed</title>
<style>.t{font-family:system-ui, sans-serif;font-weight:600;fill:#2B2F4A}.v{font-style:italic}.f{animation:fl 4s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g class="f"><path d="M50 70L104 28H224L170 70Z" fill="#FAD9A6" stroke="#2B2F4A" stroke-width="2.2" stroke-linejoin="round"/><path d="M170 70L224 28V148L170 190Z" fill="#DDA257" stroke="#2B2F4A" stroke-width="2.2" stroke-linejoin="round"/><rect x="50" y="70" width="120" height="120" fill="#F6C27A" stroke="#2B2F4A" stroke-width="2.2"/></g>
<text class="t" x="232" y="145" font-size="34" text-anchor="middle">+</text>
<g class="f" style="animation-delay:1.5s"><path d="M270 100L310.5 68.5H400.5L360 100Z" fill="#B8E6C2" stroke="#2B2F4A" stroke-width="2.2" stroke-linejoin="round"/><path d="M360 100L400.5 68.5V158.5L360 190Z" fill="#68B47A" stroke="#2B2F4A" stroke-width="2.2" stroke-linejoin="round"/><rect x="270" y="100" width="90" height="90" fill="#8FD19E" stroke="#2B2F4A" stroke-width="2.2"/></g>
<text class="t" x="110" y="225" font-size="15" text-anchor="middle">volume 8a³</text>
<text class="t" x="318" y="225" font-size="15" text-anchor="middle">volume 27b³</text>
</svg>
