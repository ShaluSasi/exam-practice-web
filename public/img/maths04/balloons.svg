<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 270" role="img">
<title>Three balloons labelled 12, minus 7 and minus 5</title>
<style>.t{font-family:system-ui, sans-serif;font-weight:600;fill:#2B2F4A}.v{font-style:italic}.f{animation:fl 4s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g class="f" style="animation-delay:0.0s"><path d="M90 142Q98 190 86 240" stroke="#2B2F4A" stroke-width="1.6" fill="none"/><ellipse cx="90" cy="90" rx="44" ry="52" fill="#F28B82" stroke="#2B2F4A" stroke-width="2.5"/><path d="M84 146L90 140L96 146Z" fill="#F28B82" stroke="#2B2F4A" stroke-width="2"/><ellipse cx="74" cy="68" rx="8" ry="13" fill="#FFFFFF" opacity=".6"/><text class="t" x="90" y="99" font-size="26" text-anchor="middle">12</text></g>
<g class="f" style="animation-delay:0.7s"><path d="M200 122Q208 170 196 220" stroke="#2B2F4A" stroke-width="1.6" fill="none"/><ellipse cx="200" cy="70" rx="44" ry="52" fill="#8EC5F0" stroke="#2B2F4A" stroke-width="2.5"/><path d="M194 126L200 120L206 126Z" fill="#8EC5F0" stroke="#2B2F4A" stroke-width="2"/><ellipse cx="184" cy="48" rx="8" ry="13" fill="#FFFFFF" opacity=".6"/><text class="t" x="200" y="79" font-size="26" text-anchor="middle">−7</text></g>
<g class="f" style="animation-delay:1.4s"><path d="M310 147Q318 195 306 245" stroke="#2B2F4A" stroke-width="1.6" fill="none"/><ellipse cx="310" cy="95" rx="44" ry="52" fill="#F6C453" stroke="#2B2F4A" stroke-width="2.5"/><path d="M304 151L310 145L316 151Z" fill="#F6C453" stroke="#2B2F4A" stroke-width="2"/><ellipse cx="294" cy="73" rx="8" ry="13" fill="#FFFFFF" opacity=".6"/><text class="t" x="310" y="104" font-size="26" text-anchor="middle">−5</text></g>
<text class="t" x="200" y="258" font-size="15" text-anchor="middle">Cube each balloon and add?</text>
