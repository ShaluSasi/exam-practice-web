e="animation-delay:1.0s" cx="90" cy="182" r="7" fill="#0B93D4" stroke="#075E88" stroke-width="2.5"/><line x1="300.0" y1="64.0" x2="331.2" y2="82.0" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round" /><line x1="331.2" y1="82.0" x2="331.2" y2="118.0" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round" /><line x1="331.2" y1="118.0" x2="300.0" y2="136.0" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round" /><line x1="300.0" y1="136.0" x2="268.8" y2="118.0" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round" /><line x1="268.8" y1="118.0" x2="268.8" y2="82.0" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round" /><line x1="268.8" y1="82.0" x2="300.0" y2="64.0" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round" /><circle class="bp" style="animation-delay:0.0s" cx="300.0" cy="64.0" r="7" fill="#0B93D4" stroke="#075E88" stroke-width="2.5"/><circle class="bp" style="animation-delay:0.25s" cx="331.1769145362398" cy="82.0" r="7" fill="#0B93D4" stroke="#075E88" stroke-width="2.5"/><circle class="bp" style="animation-delay:0.5s" cx="331.1769145362398" cy="118.0" r="7" fill="#0B93D4" stroke="#075E88" stroke-width="2.5"/><circle class="bp" style="animation-delay:0.75s" cx="300.0" cy="136.0" r="7" fill="#0B93D4" stroke="#075E88" stroke-width="2.5"/><circle class="bp" style="animation-delay:1.0s" cx="268.8230854637602" cy="118.0" r="7" fill="#0B93D4" stroke="#075E88" stroke-width="2.5"/><circle class="bp" style="animation-delay:1.25s" cx="268.8230854637602" cy="82.0" r="7" fill="#0B93D4" stroke="#075E88" stroke-width="2.5"/><text x="90.0" y="112.0" font-family="sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="middle" >straight chain</text><text x="90.0" y="214.0" font-family="sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="middle" >branched chain</text><text x="300.0" y="170.0" font-family="sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="middle" >ring</text><text x="2