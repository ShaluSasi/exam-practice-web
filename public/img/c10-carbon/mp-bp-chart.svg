<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Bar chart of melting and boiling points of four carbon compounds</title>
<style>
.pl{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
.bp{animation:bp 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes bp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.fl{animation:fl .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,.9)}to{transform:scale(1,1.1)}}
.rise{animation:rise 2.4s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-42px);opacity:0}}
.rise2{animation:rise 2.4s ease-in 1.2s infinite}
.rise3{animation:rise 2.4s ease-in .6s infinite}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@keyframes growx{0%{transform:scaleX(.2)}25%,100%{transform:scaleX(1)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200.0" y="22.0" font-family="sans-serif" font-size="14" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Melting and boiling points (kelvin)</text><text x="104.0" y="62.0" font-family="sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="end" >Methane</text><rect x="112" y="44" width="49.5" height="14" rx="5" fill="#FF8A1F" stroke="#B35A00" stroke-width="2" style="transform-box:fill-box;transform-origin:0 50%;animation:growx 5s ease-out infinite"/><text x="167.5" y="56.0" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#2B2F4A" text-anchor="start" >90</text><rect x="112" y="61" width="61.1" height="14" rx="5" fill="#0B93D4" stroke="#075E88" stroke-width="2" style="transform-box:fill-box;transform-origin:0 50%;animation:growx 5s ease-out infinite"/><text x="179.1" y="73.0" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#2B2F4A" text-anchor="start" >111</text><text x="104.0" y="106.0" font-family="sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="end" >Ethanol</text><rect x="112" y="88" width="85.8" height="14" rx="5" fill="#FF8A1F" stroke="#B35A00" stroke-width="2" style="transform-box:fill-box;transform-origin:0 50%;animation:growx 5s ease-out infinite"/><text x="203.8" y="100.0" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#2B2F4A" text-anchor="start" >156</text><rect x="112" y="105" width="193.1" height="14" rx="5" fill="#0B93D4" stroke="#075E88" stroke-width="2" style="transform-box:fill-box;transform-origin:0 50%;animation:growx 5s ease-out infinite"/><text x="311.1" y="117.0" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#2B2F4A" text-anchor="start" >351</text><text x="104.0" y="150.0" font-family="sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="end" >Chloroform</text><rect x="112" y="132" width="115.0" height="14" rx="5" fill="#FF8A1F" stroke="#B35A00" stroke-width="2" style="transform-box:fill-box;transform-origin:0 50%;animation:growx 5s ease-out infinite"/><text x="232.9" y="144.0" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#2B2F4A" text-anchor="start" >209</text><rect x="112" y="149" width="183.7" height="14" rx="5" fill="#0B93D4" stroke="#075E88" stroke-width="2" style="transform-box:fill-box;transform-origin:0 50%;animation:growx 5s ease-out infinite"/><text x="301.7" y="161.0" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#2B2F4A" text-anchor="start" >334</text><text x="104.0" y="194.0" font-family="sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="end" >Acetic acid</text><rect x="112" y="176" width="159.5" height="14" rx="5" fill="#FF8A1F" stroke="#B35A00" stroke-width="2" style="transform-box:fill-box;transform-origin:0 50%;animation:growx 5s ease-out infinite"/><text x="277.5" y="188.0" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#2B2F4A" text-anchor="start" >290</text><rect x="112" y="193" width="215.1" height="14" rx="5" fill="#0B93D4" stroke="#075E88" stroke-width="2" style="transform-box:fill-box;transform-origin:0 50%;animation:growx 5s ease-out infinite"/><text x="333.1" y="205.0" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#2B2F4A" text-anchor="start" >391</text><rect x="120" y="222" width="12" height="12" rx="3" fill="#FF8A1F"/><text x="138.0" y="232.0" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#2B2F4A" text-anchor="start" >melting point</text><rect x="240" y="222" width="12" height="12" rx="3" fill="#0B93D4"/><text x="258.0" y="232.0" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#2B2F4A" text-anchor="start" >boiling point</text>
</svg>
