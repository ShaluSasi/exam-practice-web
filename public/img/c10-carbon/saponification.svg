<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>An ester reacting with sodium hydroxide</title>
<style>
.pl{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
.bp{animation:bp 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes bp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.fl{animation:fl .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,.9)}to{transform:scale(1,1.1)}}
.rise{animation:rise 2.4s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-42px);opacity:0}}
.rise2{animation:rise 2.4s ease-in 1.2s infinite}
.rise3{animation:rise 2.4s ease-in .6s infinite}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200.0" y="26.0" font-family="sans-serif" font-size="14" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Ester reacts with sodium hydroxide</text><rect x="15.0" y="80.0" width="130" height="40" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="2.5"/><text x="80.0" y="105.0" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle" >CH₃COOC₂H₅</text><text x="80.0" y="134.0" font-family="sans-serif" font-size="12" font-weight="600" fill="#5A5F80" text-anchor="middle" >ester</text><text x="155.0" y="106.0" font-family="sans-serif" font-size="20" font-weight="600" fill="#2B2F4A" text-anchor="middle" >+</text><rect x="193.0" y="80.0" width="70" height="40" rx="10" fill="#fff" stroke="#E5484D" stroke-width="2.5"/><text x="228.0" y="105.0" font-family="sans-serif" font-size="14" font-weight="700" fill="#E5484D" text-anchor="middle" >NaOH</text><text x="228.0" y="134.0" font-family="sans-serif" font-size="12" font-weight="600" fill="#5A5F80" text-anchor="middle" >alkali</text><line x1="150.0" y1="146.0" x2="150.0" y2="171.0" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round" /><path d="M150.0 180.0L144.0 171.0L156.0 171.0Z" fill="#2B2F4A"/><rect x="20.0" y="188.0" width="120" height="36" rx="10" fill="#fff" stroke="#3FA34D" stroke-width="2.5"/><text x="80.0" y="211.0" font-family="sans-serif" font-size="14" font-weight="700" fill="#3FA34D" text-anchor="middle" >C₂H₅OH</text><text x="155.0" y="212.0" font-family="sans-serif" font-size="20" font-weight="600" fill="#2B2F4A" text-anchor="middle" >+</text><rect x="168.0" y="188.0" width="120" height="36" rx="10" fill="#fff" stroke="#3FA34D" stroke-width="2.5"/><text x="228.0" y="211.0" font-family="sans-serif" font-size="14" font-weight="700" fill="#3FA34D" text-anchor="middle" >CH₃COONa</text><text x="335.0" y="90.0" font-family="sans-serif" font-size="12.5" font-weight="800" fill="#FF8A1F" text-anchor="middle" >same idea</text><text x="335.0" y="108.0" font-family="sans-serif" font-size="12.5" font-weight="800" fill="#FF8A1F" text-anchor="middle" >makes soap</text><rect x="298" y="140" width="74" height="42" rx="14" fill="#CFEBFF" stroke="#0B93D4" stroke-width="3"/><text x="335.0" y="166.0" font-family="sans-serif" font-size="13" font-weight="800" fill="#0B93D4" text-anchor="middle" >SOAP</text>
</svg>
