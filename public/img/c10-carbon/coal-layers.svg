<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Plants buried under layers of earth slowly becoming coal</title>
<style>
.pl{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
.bp{animation:bp 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes bp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.fl{animation:fl .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,.9)}to{transform:scale(1,1.1)}}
.rise{animation:rise 2.4s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-42px);opacity:0}}
.rise2{animation:rise 2.4s ease-in 1.2s infinite}
.rise3{animation:rise 2.4s ease-in .6s infinite}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="14" y="30" width="112" height="170" rx="12" fill="#fff" stroke="#C9CEE8" stroke-width="2.5"/><rect x="144" y="30" width="112" height="170" rx="12" fill="#fff" stroke="#C9CEE8" stroke-width="2.5"/><rect x="274" y="30" width="112" height="170" rx="12" fill="#fff" stroke="#C9CEE8" stroke-width="2.5"/><path d="M40 150V108" stroke="#2E7D32" stroke-width="4" stroke-linecap="round"/><ellipse cx="40" cy="100" rx="13" ry="22" fill="#3FA34D"/><path d="M64 150V108" stroke="#2E7D32" stroke-width="4" stroke-linecap="round"/><ellipse cx="64" cy="100" rx="13" ry="22" fill="#3FA34D"/><path d="M90 150V108" stroke="#2E7D32" stroke-width="4" stroke-linecap="round"/><ellipse cx="90" cy="100" rx="13" ry="22" fill="#3FA34D"/><path d="M110 150V108" stroke="#2E7D32" stroke-width="4" stroke-linecap="round"/><ellipse cx="110" cy="100" rx="13" ry="22" fill="#3FA34D"/><rect x="20" y="150" width="100" height="44" rx="6" fill="#8D6E63"/><rect x="150" y="110" width="100" height="14" fill="#2E7D32"/><rect x="150" y="124" width="100" height="22" fill="#A1887F"/><rect x="150" y="146" width="100" height="22" fill="#8D6E63"/><rect x="150" y="168" width="100" height="26" rx="6" fill="#6D4C41"/><g class="drift"><line x1="200.0" y1="44.0" x2="200.0" y2="91.0" stroke="#E5484D" stroke-width="4" stroke-linecap="round" /><path d="M200.0 100.0L194.0 91.0L206.0 91.0Z" fill="#E5484D"/></g><rect x="280" y="60" width="100" height="40" fill="#A1887F"/><rect x="280" y="100" width="100" height="26" fill="#1F2235"/><rect x="280" y="126" width="100" height="68" rx="6" fill="#8D6E63"/><rect class="pl" x="288" y="108" width="84" height="6" rx="3" fill="#5A5F80"/><text x="70.0" y="222.0" font-family="sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="middle" >plants</text><text x="200.0" y="222.0" font-family="sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="middle" >pressed down</text><text x="330.0" y="222.0" font-family="sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="middle" >coal seam</text><line x1="130.0" y1="115.0" x2="133.0" y2="115.0" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" /><path d="M142.0 115.0L133.0 121.0L133.0 109.0Z" fill="#FF8A1F"/><line x1="262.0" y1="115.0" x2="265.0" y2="115.0" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" /><path d="M274.0 115.0L265.0 121.0L265.0 109.0Z" fill="#FF8A1F"/>
</svg>
