<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Carbon bonded to four hydrogen atoms</title>
<style>
.pl{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
.bp{animation:bp 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes bp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.fl{animation:fl .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,.9)}to{transform:scale(1,1.1)}}
.rise{animation:rise 2.4s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-42px);opacity:0}}
.rise2{animation:rise 2.4s ease-in 1.2s infinite}
.rise3{animation:rise 2.4s ease-in .6s infinite}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect class="pl" x="173.6" y="93.6" width="52.8" height="52.8" rx="26" fill="#FFD7A8"/><line x1="186.8" y1="120.0" x2="157.2" y2="120.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="213.2" y1="120.0" x2="242.8" y2="120.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="200.0" y1="106.8" x2="200.0" y2="77.2" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="200.0" y1="133.2" x2="200.0" y2="162.8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="200.0" y="128.6" font-family="sans-serif" font-size="24" font-weight="700" fill="#2B2F4A" text-anchor="middle" >C</text><text x="144.0" y="128.6" font-family="sans-serif" font-size="24" font-weight="700" fill="#4A90C2" text-anchor="middle" >H</text><text x="256.0" y="128.6" font-family="sans-serif" font-size="24" font-weight="700" fill="#4A90C2" text-anchor="middle" >H</text><text x="200.0" y="72.6" font-family="sans-serif" font-size="24" font-weight="700" fill="#4A90C2" text-anchor="middle" >H</text><text x="200.0" y="184.6" font-family="sans-serif" font-size="24" font-weight="700" fill="#4A90C2" text-anchor="middle" >H</text><text x="200.0" y="224.0" font-family="sans-serif" font-size="12" font-weight="600" fill="#5A5F80" text-anchor="middle" >Carbon: 4 valence electrons, valency 4</text>
</svg>
