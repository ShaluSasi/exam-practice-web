<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Three carbon skeletons that fit C5H12</title>
<style>
.pl{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
.bp{animation:bp 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes bp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.fl{animation:fl .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,.9)}to{transform:scale(1,1.1)}}
.rise{animation:rise 2.4s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-42px);opacity:0}}
.rise2{animation:rise 2.4s ease-in 1.2s infinite}
.rise3{animation:rise 2.4s ease-in .6s infinite}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<line x1="14.0" y1="100.0" x2="40.0" y2="80.0" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round" /><line x1="40.0" y1="80.0" x2="66.0" y2="100.0" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round" /><line x1="66.0" y1="100.0" x2="92.0" y2="80.0" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round" /><line x1="92.0" y1="80.0" x2="118.0" y2="100.0" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round" /><circle class="bp" style="animation-delay:0.0s" cx="14" cy="100" r="7" fill="#0B93D4" stroke="#075E88" stroke-width="2.5"/><circle class="bp" style="animation-delay:0.25s" cx="40" cy="80" r="7" fill="#0B93D4" stroke="#075E88" stroke-width="2.5"/><circle class="bp" style="animation-delay:0.5s" cx="66" cy="100" r="7" fill="#0B93D4" stroke="#075E88" stroke-width="2.5"/><circle class="bp" style="animation-delay:0.75s" cx="92" cy="80" r="7" fill="#0B93D4" stroke="#075E88" stroke-width="2.5"/><circle class="bp" style="animation-delay:1.0s" cx="118" cy="100" r="7" fill="#0B93D4" stroke="#075E88" stroke-width="2.5"/><line x1="14.0" y1="190.0" x2="40.0" y2="170.0" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round" /><line x1="40.0" y1="170.0" x2="66.0" y2="190.0" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round" /><line x1="66.0" y1="190.0" x2="92.0" y2="170.0" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round" /><line x1="40.0" y1="170.0" x2="40.0" y2="200.0" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round" /><circle class="bp" style="animation-delay:0.0s" cx="14" cy="190" r="7" fill="#0B93D4" stroke="#075E88" stroke-width="2.5"/><circle class="bp" style="animation-delay:0.25s" cx="40" cy="170" r="7" fill="#0B93D4" stroke="#075E88" stroke-width="2.5"/><circle class="bp" style="animation-delay:0.5s" cx="66" cy="190" r="7" fill="#0B93D4" stroke="#075E88" stroke-width="2.5"/><circle class="bp" style="animation-delay:0.75s" cx="92" cy="170" r="7" fill="#0B93D4" stroke="#075E88" stroke-width="2.5"/><circle class="bp" style="animation-delay:1.0s" cx="40" cy="200" r="7" fill="#0B93D4" stroke="#075E88" stroke-width="2.5"/><line x1="286.0" y1="170.0" x2="260.0" y2="170.0" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round" /><line x1="286.0" y1="170.0" x2="312.0" y2="170.0" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round" /><line x1="286.0" y1="170.0" x2="286.0" y2="144.0" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round" /><line x1="286.0" y1="170.0" x2="286.0" y2="196.0" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round" /><circle class="bp" style="animation-delay:0.0s" cx="286" cy="170" r="7" fill="#0B93D4" stroke="#075E88" stroke-width="2.5"/><circle class="bp" style="animation-delay:0.25s" cx="260" cy="170" r="7" fill="#0B93D4" stroke="#075E88" stroke-width="2.5"/><circle class="bp" style="animation-delay:0.5s" cx="312" cy="170" r="7" fill="#0B93D4" stroke="#075E88" stroke-width="2.5"/><circle class="bp" style="animation-delay:0.75s" cx="286" cy="144" r="7" fill="#0B93D4" stroke="#075E88" stroke-width="2.5"/><circle class="bp" style="animation-delay:1.0s" cx="286" cy="196" r="7" fill="#0B93D4" stroke="#075E88" stroke-width="2.5"/><text x="66.0" y="36.0" font-family="sans-serif" font-size="16" font-weight="800" fill="#FF8A1F" text-anchor="middle" >A</text><text x="66.0" y="128.0" font-family="sans-serif" font-size="16" font-weight="800" fill="#FF8A1F" text-anchor="middle" >B</text><text x="286.0" y="112.0" font-family="sans-serif" font-size="16" font-weight="800" fill="#FF8A1F" text-anchor="middle" >C</text><text x="300.0" y="36.0" font-family="sans-serif" font-size="15" font-weight="800" fill="#2B2F4A" text-anchor="middle" >All three: C₅H₁₂</text><text x="200.0" y="225.0" font-family="sans-serif" font-size="11" font-weight="600" fill="#5A5F80" text-anchor="middle" >dots are carbon atoms, hydrogens not drawn</text>
</svg>
