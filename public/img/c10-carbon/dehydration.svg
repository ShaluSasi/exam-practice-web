<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Ethanol heated with concentrated sulphuric acid at 443 K</title>
<style>
.pl{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
.bp{animation:bp 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes bp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.fl{animation:fl .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,.9)}to{transform:scale(1,1.1)}}
.rise{animation:rise 2.4s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-42px);opacity:0}}
.rise2{animation:rise 2.4s ease-in 1.2s infinite}
.rise3{animation:rise 2.4s ease-in .6s infinite}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M126.5 106H173.5V151.0A23.5 23.5 0 0 1 126.5 151.0Z" fill="#F3E9FF"/><path d="M125.0 56V151.0A25.0 25.0 0 0 0 175.0 151.0V56" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><rect x="136" y="46" width="28" height="14" rx="4" fill="#C58B5A" stroke="#2B2F4A" stroke-width="3"/><path d="M150 50V28H290" fill="none" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path class="drift" d="M200 28H280" stroke="#3FA34D" stroke-width="3" stroke-dasharray="8 7" stroke-linecap="round"/><path class="fl" d="M135.0 214.0Q135.0 192.0 150.0 174.0Q165.0 192.0 165.0 214.0Z" fill="#6FC3F0" opacity="1"/><rect x="132" y="214" width="36" height="12" rx="4" fill="#6B718F" stroke="#2B2F4A" stroke-width="3"/><text x="296.0" y="33.0" font-family="sans-serif" font-size="12.5" font-weight="800" fill="#3FA34D" text-anchor="start" >ethene gas</text><text x="256.0" y="96.0" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#2B2F4A" text-anchor="start" >ethanol +</text><text x="256.0" y="114.0" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#2B2F4A" text-anchor="start" >excess hot conc.</text><text x="256.0" y="132.0" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#2B2F4A" text-anchor="start" >H₂SO₄</text><rect x="295.0" y="173.0" width="90" height="34" rx="10" fill="#FFF" stroke="#E5484D" stroke-width="2.5"/><text x="340.0" y="195.4" font-family="sans-serif" font-size="15" font-weight="700" fill="#E5484D" text-anchor="middle" >443 K</text><circle class="rise" cx="140" cy="130" r="4" fill="#FFFFFF" stroke="#0B93D4" stroke-width="1.6"/><circle class="rise2" cx="156" cy="124" r="4" fill="#FFFFFF" stroke="#0B93D4" stroke-width="1.6"/><circle class="rise3" cx="162" cy="130" r="4" fill="#FFFFFF" stroke="#0B93D4" stroke-width="1.6"/>
</svg>
