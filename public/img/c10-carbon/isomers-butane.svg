e="18" font-weight="800" fill="#2B2F4A" text-anchor="middle" >C₄H₁₀</text><text x="330.0" y="164.0" font-family="sans-serif" font-size="18" font-weight="800" fill="#2B2F4A" text-anchor="middle" >C₄H₁₀</text>
