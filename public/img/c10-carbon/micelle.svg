fff" stroke="#0B93D4" stroke-width="3.5"/><line x1="185.0" y1="94.0" x2="167.0" y2="62.8" stroke="#FF8A1F" stroke-width="5" stroke-linecap="round" /><circle class="pl" style="animation-delay:1.2s" cx="162.0" cy="54.2" r="9" fill="#fff" stroke="#0B93D4" stroke-width="3.5"/><line x1="200.0" y1="90.0" x2="200.0" y2="54.0" stroke="#FF8A1F" stroke-width="5" stroke-linecap="round" /><circle class="pl" style="animation-delay:1.3499999999999999s" cx="200.0" cy="44.0" r="9" fill="#fff" stroke="#0B93D4" stroke-width="3.5"/><line x1="215.0" y1="94.0" x2="233.0" y2="62.8" stroke="#FF8A1F" stroke-width="5" stroke-linecap="round" /><circle class="pl" style="animation-delay:1.5s" cx="238.0" cy="54.2" r="9" fill="#fff" stroke="#0B93D4" stroke-width="3.5"/><line x1="226.0" y1="105.0" x2="257.2" y2="87.0" stroke="#FF8A1F" stroke-width="5" stroke-linecap="round" /><circle class="pl" style="animation-delay:1.65s" cx="265.8" cy="82.0" r="9" fill="#fff" stroke="#0B93D4" stroke-width="3.5"/><text x="340.0" y="40.0" font-family="sans-serif" font-size="13" font-weight="800" fill="#0B93D4" text-anchor="middle" >water</text><text x="60.0" y="214.0" font-family="sans-serif" font-size="13" font-weight="800" fill="#0B93D4" text-anchor="middle" >water</text>
