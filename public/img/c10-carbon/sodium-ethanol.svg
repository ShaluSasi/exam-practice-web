<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A small piece of sodium in ethanol with bubbles rising</title>
<style>
.pl{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
.bp{animation:bp 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes bp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.fl{animation:fl .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,.9)}to{transform:scale(1,1.1)}}
.rise{animation:rise 2.4s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-42px);opacity:0}}
.rise2{animation:rise 2.4s ease-in 1.2s infinite}
.rise3{animation:rise 2.4s ease-in .6s infinite}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M73.5 100H126.5V172.0A26.5 26.5 0 0 1 73.5 172.0Z" fill="#EAF6FF"/><path d="M72.0 50V172.0A28.0 28.0 0 0 0 128.0 172.0V50" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><circle cx="100" cy="122" r="8" fill="#D0D4E6" stroke="#2B2F4A" stroke-width="2.5"/><circle class="rise" cx="86" cy="118" r="4" fill="#FFFFFF" stroke="#0B93D4" stroke-width="1.6"/><circle class="rise2" cx="100" cy="112" r="4" fill="#FFFFFF" stroke="#0B93D4" stroke-width="1.6"/><circle class="rise3" cx="114" cy="118" r="4" fill="#FFFFFF" stroke="#0B93D4" stroke-width="1.6"/><circle class="rise" cx="92" cy="112" r="4" fill="#FFFFFF" stroke="#0B93D4" stroke-width="1.6"/><circle class="rise2" cx="108" cy="118" r="4" fill="#FFFFFF" stroke="#0B93D4" stroke-width="1.6"/><text x="200.0" y="90.0" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#2B2F4A" text-anchor="start" >tiny piece of sodium</text><line x1="192.0" y1="88.0" x2="110.0" y2="118.0" stroke="#8A90C0" stroke-width="2" stroke-linecap="round" /><text x="200.0" y="150.0" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#2B2F4A" text-anchor="start" >ethanol (absolute)</text><line x1="192.0" y1="148.0" x2="124.0" y2="160.0" stroke="#8A90C0" stroke-width="2" stroke-linecap="round" /><text x="200.0" y="190.0" font-family="sans-serif" font-size="12.5" font-weight="800" fill="#FF8A1F" text-anchor="start" >bubbles of a gas</text>
</svg>
