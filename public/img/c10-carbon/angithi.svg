<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A candle flame beside glowing charcoal</title>
<style>
.pl{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
.bp{animation:bp 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes bp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.fl{animation:fl .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,.9)}to{transform:scale(1,1.1)}}
.rise{animation:rise 2.4s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-42px);opacity:0}}
.rise2{animation:rise 2.4s ease-in 1.2s infinite}
.rise3{animation:rise 2.4s ease-in .6s infinite}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="80" y="130" width="40" height="80" rx="6" fill="#FFF3D6" stroke="#2B2F4A" stroke-width="3"/><path d="M100 130V114" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><path class="fl" d="M89.0 116.0Q89.0 91.8 100.0 72.0Q111.0 91.8 111.0 116.0Z" fill="#FFC83A" opacity="1"/><path class="fl" d="M95.0 116.0Q95.0 103.9 100.0 94.0Q105.0 103.9 105.0 116.0Z" fill="#FF8A1F" opacity="1"/><text x="100.0" y="230.0" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#2B2F4A" text-anchor="middle" >candle: vapour burns</text><text x="100.0" y="24.0" font-family="sans-serif" font-size="12" font-weight="800" fill="#FF8A1F" text-anchor="middle" >with a flame</text><path d="M232.0 190L238.0 164L280.0 160L288.0 186L278.0 198L240.0 200Z" fill="#3B3F5A" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><path class="pl" d="M252 184Q260 170 270 184" fill="none" stroke="#E5484D" stroke-width="4" stroke-linecap="round"/><path d="M275.0 176L281.0 150L317.0 146L325.0 172L315.0 184L283.0 186Z" fill="#3B3F5A" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><path class="pl" d="M292 170Q300 156 310 170" fill="none" stroke="#E5484D" stroke-width="4" stroke-linecap="round"/><path d="M262.0 156L268.0 130L298.0 126L306.0 152L296.0 164L270.0 166Z" fill="#3B3F5A" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><path class="pl" d="M276 150Q284 136 294 150" fill="none" stroke="#E5484D" stroke-width="4" stroke-linecap="round"/><text x="285.0" y="230.0" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#2B2F4A" text-anchor="middle" >charcoal: glows red</text><text x="285.0" y="24.0" font-family="sans-serif" font-size="12" font-weight="800" fill="#E5484D" text-anchor="middle" >no flame</text>
</svg>
