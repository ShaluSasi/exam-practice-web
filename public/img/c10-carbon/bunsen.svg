<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A Bunsen burner with a blue flame</title>
<style>
.pl{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
.bp{animation:bp 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes bp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.fl{animation:fl .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,.9)}to{transform:scale(1,1.1)}}
.rise{animation:rise 2.4s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-42px);opacity:0}}
.rise2{animation:rise 2.4s ease-in 1.2s infinite}
.rise3{animation:rise 2.4s ease-in .6s infinite}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="70" y="216" width="260" height="6" rx="3" fill="#C9CEE8"/><path d="M150 214Q150 200 200 200Q250 200 250 214Z" fill="#6B718F" stroke="#2B2F4A" stroke-width="3"/><rect x="96" y="181" width="94" height="14" rx="5" fill="#B8BDD9" stroke="#2B2F4A" stroke-width="3"/><rect x="88" y="177" width="14" height="22" rx="4" fill="#8A90C0" stroke="#2B2F4A" stroke-width="3"/><path class="drift" d="M108 188H150" stroke="#FF8A1F" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"/><rect x="186" y="66" width="28" height="136" rx="6" fill="#DDE1F3" stroke="#2B2F4A" stroke-width="3"/><rect x="180" y="146" width="40" height="30" rx="6" fill="#8A90C0" stroke="#2B2F4A" stroke-width="3"/><ellipse cx="200" cy="161" rx="9" ry="7" fill="#2B2F4A"/><path d="M150 160H178M250 160H222" stroke="#8A90C0" stroke-width="3" stroke-dasharray="4 5" stroke-linecap="round" class="drift"/><path class="fl" d="M180.0 66.0Q180.0 37.4 200.0 14.0Q220.0 37.4 220.0 66.0Z" fill="#6FC3F0" opacity="1"/><path class="fl" d="M190.0 66.0Q190.0 49.5 200.0 36.0Q210.0 49.5 210.0 66.0Z" fill="#D6F0FF" opacity="1"/>
</svg>
