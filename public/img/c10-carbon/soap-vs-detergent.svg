FF8A1F" text-anchor="middle" >1</text><text x="280.0" y="224.0" font-family="sans-serif" font-size="18" font-weight="800" fill="#FF8A1F" text-anchor="middle" >2</text><text x="120.0" y="40.0" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >hard water + soap</text><text x="280.0" y="40.0" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >hard water + detergent</text>
