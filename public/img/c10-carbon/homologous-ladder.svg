<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>The first four alkanes, each one CH2 more than the one before</title>
<style>
.pl{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
.bp{animation:bp 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes bp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.fl{animation:fl .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,.9)}to{transform:scale(1,1.1)}}
.rise{animation:rise 2.4s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-42px);opacity:0}}
.rise2{animation:rise 2.4s ease-in 1.2s infinite}
.rise3{animation:rise 2.4s ease-in .6s infinite}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="35.0" y="19.0" width="190" height="34" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="2.5"/><text x="130.0" y="41.0" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Methane   CH₄</text><g class="drift"><line x1="130.0" y1="55.0" x2="130.0" y2="66.0" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" /><path d="M130.0 75.0L124.0 66.0L136.0 66.0Z" fill="#FF8A1F"/></g><text x="160.0" y="70.0" font-family="sans-serif" font-size="13" font-weight="800" fill="#FF8A1F" text-anchor="start" >+ CH₂</text><rect x="35.0" y="77.0" width="190" height="34" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="2.5"/><text x="130.0" y="99.0" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Ethane   C₂H₆</text><g class="drift"><line x1="130.0" y1="113.0" x2="130.0" y2="124.0" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" /><path d="M130.0 133.0L124.0 124.0L136.0 124.0Z" fill="#FF8A1F"/></g><text x="160.0" y="128.0" font-family="sans-serif" font-size="13" font-weight="800" fill="#FF8A1F" text-anchor="start" >+ CH₂</text><rect x="35.0" y="135.0" width="190" height="34" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="2.5"/><text x="130.0" y="157.0" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Propane   C₃H₈</text><g class="drift"><line x1="130.0" y1="171.0" x2="130.0" y2="182.0" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" /><path d="M130.0 191.0L124.0 182.0L136.0 182.0Z" fill="#FF8A1F"/></g><text x="160.0" y="186.0" font-family="sans-serif" font-size="13" font-weight="800" fill="#FF8A1F" text-anchor="start" >+ CH₂</text><rect x="35.0" y="193.0" width="190" height="34" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="2.5"/><text x="130.0" y="215.0" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle" >Butane   C₄H₁₀</text><text x="310.0" y="90.0" font-family="sans-serif" font-size="14" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Each member</text><text x="310.0" y="108.0" font-family="sans-serif" font-size="14" font-weight="600" fill="#2B2F4A" text-anchor="middle" >differs from the</text><text x="310.0" y="126.0" font-family="sans-serif" font-size="14" font-weight="600" fill="#2B2F4A" text-anchor="middle" >next by one</text><text x="310.0" y="144.0" font-family="sans-serif" font-size="14" font-weight="800" fill="#FF8A1F" text-anchor="middle" >CH₂ unit</text>
</svg>
