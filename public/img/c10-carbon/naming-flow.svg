<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Steps for naming a carbon compound</title>
<style>
.pl{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
.bp{animation:bp 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes bp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.fl{animation:fl .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,.9)}to{transform:scale(1,1.1)}}
.rise{animation:rise 2.4s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-42px);opacity:0}}
.rise2{animation:rise 2.4s ease-in 1.2s infinite}
.rise3{animation:rise 2.4s ease-in .6s infinite}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200.0" y="22.0" font-family="sans-serif" font-size="14" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Naming a carbon compound</text><rect x="10.0" y="59.0" width="72" height="30" rx="10" fill="#E3F2FD" stroke="#0B93D4" stroke-width="2.5"/><text x="46.0" y="78.3" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >1  meth</text><rect x="90.0" y="59.0" width="72" height="30" rx="10" fill="#E3F2FD" stroke="#0B93D4" stroke-width="2.5"/><text x="126.0" y="78.3" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >2  eth</text><rect x="10.0" y="101.0" width="72" height="30" rx="10" fill="#E3F2FD" stroke="#0B93D4" stroke-width="2.5"/><text x="46.0" y="120.3" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >3  prop</text><rect x="90.0" y="101.0" width="72" height="30" rx="10" fill="#E3F2FD" stroke="#0B93D4" stroke-width="2.5"/><text x="126.0" y="120.3" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >4  but</text><rect x="10.0" y="143.0" width="72" height="30" rx="10" fill="#E3F2FD" stroke="#0B93D4" stroke-width="2.5"/><text x="46.0" y="162.3" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >5  pent</text><rect x="90.0" y="143.0" width="72" height="30" rx="10" fill="#E3F2FD" stroke="#0B93D4" stroke-width="2.5"/><text x="126.0" y="162.3" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle" >6  hex</text><text x="86.0" y="50.0" font-family="sans-serif" font-size="11" font-weight="600" fill="#5A5F80" text-anchor="middle" >carbon atoms: stem</text><circle cx="190" cy="52" r="11" fill="#FF8A1F"/><text x="190.0" y="57.0" font-family="sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >1</text><text x="208.0" y="56.0" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#2B2F4A" text-anchor="start" >Count carbons: choose the stem</text><line x1="190.0" y1="65.0" x2="190.0" y2="74.0" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" /><path d="M190.0 83.0L184.0 74.0L196.0 74.0Z" fill="#FF8A1F"/><circle cx="190" cy="96" r="11" fill="#FF8A1F"/><text x="190.0" y="101.0" font-family="sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >2</text><text x="208.0" y="100.0" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#2B2F4A" text-anchor="start" >Add prefix or suffix for the group</text><line x1="190.0" y1="109.0" x2="190.0" y2="118.0" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" /><path d="M190.0 127.0L184.0 118.0L196.0 118.0Z" fill="#FF8A1F"/><circle cx="190" cy="140" r="11" fill="#FF8A1F"/><text x="190.0" y="145.0" font-family="sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >3</text><text x="208.0" y="144.0" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#2B2F4A" text-anchor="start" >Vowel suffix: drop the final e</text><line x1="190.0" y1="153.0" x2="190.0" y2="162.0" stroke="#FF8A1F" stroke-width="2.5" stroke-linecap="round" /><path d="M190.0 171.0L184.0 162.0L196.0 162.0Z" fill="#FF8A1F"/><circle cx="190" cy="184" r="11" fill="#FF8A1F"/><text x="190.0" y="189.0" font-family="sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle" >4</text><text x="208.0" y="188.0" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#2B2F4A" text-anchor="start" >Double / triple bond: ene / yne</text><text x="200.0" y="228.0" font-family="sans-serif" font-size="12" font-weight="600" fill="#3FA34D" text-anchor="middle" >e.g. propane - e + one = propanone</text>
</svg>
