<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Universal indicator in dilute hydrochloric acid and dilute ethanoic acid</title>
<style>
.pl{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
.bp{animation:bp 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes bp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.fl{animation:fl .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,.9)}to{transform:scale(1,1.1)}}
.rise{animation:rise 2.4s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-42px);opacity:0}}
.rise2{animation:rise 2.4s ease-in 1.2s infinite}
.rise3{animation:rise 2.4s ease-in .6s infinite}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M83.5 100H136.5V162.0A26.5 26.5 0 0 1 83.5 162.0Z" fill="#E5484D"/><path d="M82.0 60V162.0A28.0 28.0 0 0 0 138.0 162.0V60" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><path d="M263.5 100H316.5V162.0A26.5 26.5 0 0 1 263.5 162.0Z" fill="#FF9F40"/><path d="M262.0 60V162.0A28.0 28.0 0 0 0 318.0 162.0V60" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><text x="110.0" y="214.0" font-family="sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="middle" >dilute HCl</text><text x="290.0" y="214.0" font-family="sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="middle" >dilute ethanoic acid</text><text x="200.0" y="26.0" font-family="sans-serif" font-size="12" font-weight="600" fill="#5A5F80" text-anchor="middle" >same concentration, universal indicator added</text><rect x="150" y="92" width="14" height="14" fill="#E5484D"/><rect x="164" y="92" width="14" height="14" fill="#FF8A1F"/><rect x="178" y="92" width="14" height="14" fill="#FFD43B"/><rect x="192" y="92" width="14" height="14" fill="#8BC34A"/><rect x="206" y="92" width="14" height="14" fill="#3FA34D"/><rect x="220" y="92" width="14" height="14" fill="#0B93D4"/><rect x="234" y="92" width="14" height="14" fill="#7C5CFF"/><text x="200.0" y="126.0" font-family="sans-serif" font-size="11" font-weight="600" fill="#5A5F80" text-anchor="middle" >colour scale</text><text x="152.0" y="84.0" font-family="sans-serif" font-size="11" font-weight="600" fill="#E5484D" text-anchor="start" >acidic</text><text x="246.0" y="84.0" font-family="sans-serif" font-size="11" font-weight="600" fill="#7C5CFF" text-anchor="end" >basic</text>
</svg>
