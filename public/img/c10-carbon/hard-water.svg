#fff" stroke="#9AA0C8" stroke-width="2"/><circle cx="276" cy="106" r="5" fill="#fff" stroke="#0B93D4" stroke-width="1.8"/><text x="120.0" y="224.0" font-family="sans-serif" font-size="18" font-weight="800" fill="#FF8A1F" text-anchor="middle" >A</text><text x="280.0" y="224.0" font-family="sans-serif" font-size="18" font-weight="800" fill="#FF8A1F" text-anchor="middle" >B</text><text x="120.0" y="40.0" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >distilled water</text><text x="280.0" y="40.0" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >hard water</text><text x="200.0" y="20.0" font-family="sans-serif" font-size="12" font-weight="600" fill="#5A5F80" text-anchor="middle" >a few drops of soap solution in each</text>
