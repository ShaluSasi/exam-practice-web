<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Ethanol burning with an unbalanced equation</title>
<style>
.pl{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
.bp{animation:bp 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes bp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.fl{animation:fl .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,.9)}to{transform:scale(1,1.1)}}
.rise{animation:rise 2.4s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-42px);opacity:0}}
.rise2{animation:rise 2.4s ease-in 1.2s infinite}
.rise3{animation:rise 2.4s ease-in .6s infinite}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="110.0" y="36.0" font-family="sans-serif" font-size="15" font-weight="600" fill="#2B2F4A" text-anchor="middle" >CH₃CH₂OH + O₂</text><line x1="180.0" y1="31.0" x2="209.0" y2="31.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M218.0 31.0L209.0 37.0L209.0 25.0Z" fill="#2B2F4A"/><text x="310.0" y="36.0" font-family="sans-serif" font-size="14" font-weight="600" fill="#2B2F4A" text-anchor="middle" >CO₂ + H₂O + heat and light</text><text x="200.0" y="62.0" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#E5484D" text-anchor="middle" >(not yet balanced)</text><path d="M130 190H270L258 214H142Z" fill="#B8BDD9" stroke="#2B2F4A" stroke-width="3.5"/><ellipse cx="200" cy="190" rx="70" ry="8" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3"/><path class="fl" d="M170.0 184.0Q170.0 137.8 200.0 100.0Q230.0 137.8 230.0 184.0Z" fill="#FFC83A" opacity="1"/><path class="fl" d="M182.0 184.0Q182.0 156.5 200.0 134.0Q218.0 156.5 218.0 184.0Z" fill="#FF8A1F" opacity="1"/><path class="fl" d="M192.0 184.0Q192.0 170.8 200.0 160.0Q208.0 170.8 208.0 184.0Z" fill="#6FC3F0" opacity="1"/><text x="330.0" y="150.0" font-family="sans-serif" font-size="12" font-weight="600" fill="#5A5F80" text-anchor="middle" >ethanol burns</text><text x="330.0" y="166.0" font-family="sans-serif" font-size="12" font-weight="600" fill="#5A5F80" text-anchor="middle" >in air (oxygen)</text>
</svg>
