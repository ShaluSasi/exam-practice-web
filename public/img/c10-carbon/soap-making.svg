<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Heating oil with sodium hydroxide, then salt, to make soap</title>
<style>
.pl{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
.bp{animation:bp 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes bp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.fl{animation:fl .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,.9)}to{transform:scale(1,1.1)}}
.rise{animation:rise 2.4s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-42px);opacity:0}}
.rise2{animation:rise 2.4s ease-in 1.2s infinite}
.rise3{animation:rise 2.4s ease-in .6s infinite}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@keyframes stir{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M80 80V190Q80 204 94 204H186Q200 204 200 190V80" fill="none" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round"/><path d="M82 110H198V190Q198 202 186 202H94Q82 202 82 190Z" fill="#FFE9A8"/><g style="transform-origin:140px 110px;animation:stir 2s ease-in-out infinite alternate"><rect x="136" y="40" width="8" height="140" rx="4" fill="#C58B5A" stroke="#2B2F4A" stroke-width="2.5"/></g><path class="fl" d="M115.0 232.0Q115.0 217.7 140.0 206.0Q165.0 217.7 165.0 232.0Z" fill="#6FC3F0" opacity="1"/><rect x="110" y="228" width="60" height="8" rx="3" fill="#6B718F"/><line x1="214.0" y1="130.0" x2="253.0" y2="130.0" stroke="#FF8A1F" stroke-width="3.5" stroke-linecap="round" /><path d="M262.0 130.0L253.0 136.0L253.0 124.0Z" fill="#FF8A1F"/><rect x="276" y="108" width="90" height="48" rx="16" fill="#CFEBFF" stroke="#0B93D4" stroke-width="3.5"/><text x="321.0" y="138.0" font-family="sans-serif" font-size="15" font-weight="800" fill="#0B93D4" text-anchor="middle" >SOAP</text><text x="140.0" y="28.0" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#2B2F4A" text-anchor="middle" >oil + NaOH solution, heated and stirred</text><text x="321.0" y="182.0" font-family="sans-serif" font-size="12" font-weight="600" fill="#5A5F80" text-anchor="middle" >cut into shapes</text><rect class="pl" x="296" y="80" width="8" height="8" rx="2" fill="#fff" stroke="#8A90C0" stroke-width="2"/><rect class="pl" x="316" y="70" width="8" height="8" rx="2" fill="#fff" stroke="#8A90C0" stroke-width="2"/><rect class="pl" x="338" y="82" width="8" height="8" rx="2" fill="#fff" stroke="#8A90C0" stroke-width="2"/><text x="320.0" y="62.0" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#5A5F80" text-anchor="middle" >salt added</text>
</svg>
