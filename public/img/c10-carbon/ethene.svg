<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Structure of ethene</title>
<style>
.pl{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
.bp{animation:bp 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes bp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.fl{animation:fl .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,.9)}to{transform:scale(1,1.1)}}
.rise{animation:rise 2.4s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-42px);opacity:0}}
.rise2{animation:rise 2.4s ease-in 1.2s infinite}
.rise3{animation:rise 2.4s ease-in .6s infinite}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<line x1="180.8" y1="116.8" x2="219.2" y2="116.8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="180.8" y1="123.2" x2="219.2" y2="123.2" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="161.4" y1="110.5" x2="141.1" y2="84.5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="161.4" y1="129.5" x2="141.1" y2="155.5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="238.6" y1="110.5" x2="258.9" y2="84.5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="238.6" y1="129.5" x2="258.9" y2="155.5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="168.8" y="127.2" font-family="sans-serif" font-size="20" font-weight="700" fill="#2B2F4A" text-anchor="middle" >C</text><text x="231.2" y="127.2" font-family="sans-serif" font-size="20" font-weight="700" fill="#2B2F4A" text-anchor="middle" >C</text><text x="133.8" y="82.2" font-family="sans-serif" font-size="20" font-weight="700" fill="#4A90C2" text-anchor="middle" >H</text><text x="133.8" y="172.2" font-family="sans-serif" font-size="20" font-weight="700" fill="#4A90C2" text-anchor="middle" >H</text><text x="266.2" y="82.2" font-family="sans-serif" font-size="20" font-weight="700" fill="#4A90C2" text-anchor="middle" >H</text><text x="266.2" y="172.2" font-family="sans-serif" font-size="20" font-weight="700" fill="#4A90C2" text-anchor="middle" >H</text>
