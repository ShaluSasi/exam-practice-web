<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" role="img">
<title>CH3-CH2-CH2-COOH</title>
<style>
.pl{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
.bp{animation:bp 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes bp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.fl{animation:fl .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,.9)}to{transform:scale(1,1.1)}}
.rise{animation:rise 2.4s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-42px);opacity:0}}
.rise2{animation:rise 2.4s ease-in 1.2s infinite}
.rise3{animation:rise 2.4s ease-in .6s infinite}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<line x1="52.1" y1="100.6" x2="61.9" y2="95.6" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="94.1" y1="95.6" x2="103.9" y2="100.6" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="136.1" y1="100.6" x2="152.6" y2="92.3" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="158.8" y1="77.1" x2="158.8" y2="51.9" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="165.2" y1="77.1" x2="165.2" y2="51.9" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="171.4" y1="92.3" x2="190.6" y2="101.9" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="36.0" y="114.0" font-family="sans-serif" font-size="15" font-weight="700" fill="#2B2F4A" text-anchor="middle" >CH₃</text><text x="78.0" y="93.0" font-family="sans-serif" font-size="15" font-weight="700" fill="#2B2F4A" text-anchor="middle" >CH₂</text><text x="120.0" y="114.0" font-family="sans-serif" font-size="15" font-weight="700" fill="#2B2F4A" text-anchor="middle" >CH₂</text><text x="162.0" y="93.0" font-family="sans-serif" font-size="15" font-weight="700" fill="#2B2F4A" text-anchor="middle" >C</text><text x="162.0" y="46.8" font-family="sans-serif" font-size="15" font-weight="700" fill="#E5484D" text-anchor="middle" >O</text><text x="204.0" y="114.0" font-family="sans-serif" font-size="15" font-weight="700" fill="#E5484D" text-anchor="middle" >OH</text>
</svg>
