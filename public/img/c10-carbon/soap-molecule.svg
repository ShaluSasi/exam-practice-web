<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A soap molecule with an ionic head and a long hydrocarbon tail beside an oil droplet</title>
<style>
.pl{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
.bp{animation:bp 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes bp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.fl{animation:fl .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,.9)}to{transform:scale(1,1.1)}}
.rise{animation:rise 2.4s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-42px);opacity:0}}
.rise2{animation:rise 2.4s ease-in 1.2s infinite}
.rise3{animation:rise 2.4s ease-in .6s infinite}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<ellipse cx="350" cy="120" rx="36" ry="30" fill="#C58B5A" stroke="#8D5A2B" stroke-width="3.5"/><text x="350.0" y="124.0" font-family="sans-serif" font-size="14" font-weight="800" fill="#fff" text-anchor="middle" >oil</text><polyline points="116,120 138,130 160,110 182,130 204,110 226,130 248,110 270,130 292,110" fill="none" stroke="#FF8A1F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="70" cy="120" r="34" fill="#CFEBFF" stroke="#0B93D4" stroke-width="4"/><text x="70.0" y="125.0" font-family="sans-serif" font-size="15" font-weight="800" fill="#2B2F4A" text-anchor="middle" >COO⁻</text><circle cx="42" cy="58" r="15" fill="#E4DCFF" stroke="#7C5CFF" stroke-width="3"/><text x="42.0" y="63.0" font-family="sans-serif" font-size="12" font-weight="800" fill="#7C5CFF" text-anchor="middle" >Na⁺</text><path class="rise" d="M22 150q-7 -9 0 -16q7 7 0 16z" fill="#0B93D4" opacity=".7"/><path class="rise" d="M36 188q-7 -9 0 -16q7 7 0 16z" fill="#0B93D4" opacity=".7"/><path class="rise" d="M90 178q-7 -9 0 -16q7 7 0 16z" fill="#0B93D4" opacity=".7"/>
</svg>
