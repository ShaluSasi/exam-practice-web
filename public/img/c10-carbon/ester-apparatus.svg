<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>A test tube of ethanol, ethanoic acid and sulphuric acid warmed in a water bath</title>
<style>
.pl{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
.bp{animation:bp 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes bp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.fl{animation:fl .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,.9)}to{transform:scale(1,1.1)}}
.rise{animation:rise 2.4s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-42px);opacity:0}}
.rise2{animation:rise 2.4s ease-in 1.2s infinite}
.rise3{animation:rise 2.4s ease-in .6s infinite}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M100 96V196Q100 204 108 204H292Q300 204 300 196V96" fill="none" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round"/><path d="M102 126H298V196Q298 202 292 202H108Q102 202 102 196Z" fill="#CFEBFF"/><path d="M185 40V176Q185 190 200 190Q215 190 215 176V40" fill="#fff" fill-opacity=".6" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round"/><path d="M187 130V176Q187 188 200 188Q213 188 213 176V130Z" fill="#FFE9A8"/><rect x="262" y="60" width="10" height="120" rx="5" fill="#fff" stroke="#2B2F4A" stroke-width="3"/><circle cx="267" cy="182" r="9" fill="#E5484D" stroke="#2B2F4A" stroke-width="3"/><rect x="264.5" y="110" width="5" height="70" fill="#E5484D"/><rect x="112" y="204" width="176" height="6" rx="3" fill="#2B2F4A"/><path class="fl" d="M178.0 232.0Q178.0 218.8 200.0 208.0Q222.0 218.8 222.0 232.0Z" fill="#6FC3F0" opacity="1"/><rect x="170" y="230" width="60" height="8" rx="3" fill="#6B718F"/><circle class="rise" cx="130" cy="190" r="3.5" fill="#FFFFFF" stroke="#0B93D4" stroke-width="1.6"/><circle class="rise2" cx="150" cy="184" r="3.5" fill="#FFFFFF" stroke="#0B93D4" stroke-width="1.6"/><circle class="rise3" cx="235" cy="190" r="3.5" fill="#FFFFFF" stroke="#0B93D4" stroke-width="1.6"/>
</svg>
