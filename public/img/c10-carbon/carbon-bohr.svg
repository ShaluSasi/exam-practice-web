<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Bohr diagram of carbon with K, L and an empty dashed M shell</title>
<style>
.pl{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
.bp{animation:bp 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes bp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.fl{animation:fl .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,.9)}to{transform:scale(1,1.1)}}
.rise{animation:rise 2.4s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-42px);opacity:0}}
.rise2{animation:rise 2.4s ease-in 1.2s infinite}
.rise3{animation:rise 2.4s ease-in .6s infinite}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="200" cy="120" r="40" fill="none" stroke="#8A90C0" stroke-width="2.5"/><circle cx="200" cy="120" r="72" fill="none" stroke="#8A90C0" stroke-width="2.5"/><circle cx="200" cy="120" r="100" fill="none" stroke="#8A90C0" stroke-width="2.5" stroke-dasharray="5 5"/><circle cx="200" cy="120" r="16" fill="#F8B4B6" stroke="#E5484D" stroke-width="3"/><text x="200.0" y="124.0" font-family="sans-serif" font-size="11" font-weight="700" fill="#E5484D" text-anchor="middle" >6p</text><g style="transform-origin:200px 120px;animation:sp 8s linear infinite"><circle cx="200.0" cy="80.0" r="6" fill="#0B93D4" stroke="#075E88" stroke-width="2"/><circle cx="200.0" cy="160.0" r="6" fill="#0B93D4" stroke="#075E88" stroke-width="2"/></g><g style="transform-origin:200px 120px;animation:sp 12s linear infinite reverse"><circle cx="200.0" cy="48.0" r="6" fill="#0B93D4" stroke="#075E88" stroke-width="2"/><circle cx="272.0" cy="120.0" r="6" fill="#0B93D4" stroke="#075E88" stroke-width="2"/><circle cx="200.0" cy="192.0" r="6" fill="#0B93D4" stroke="#075E88" stroke-width="2"/><circle cx="128.0" cy="120.0" r="6" fill="#0B93D4" stroke="#075E88" stroke-width="2"/></g>
</svg>
