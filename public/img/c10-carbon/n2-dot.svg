<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img">
<title>Electron dot structure of N2: three shared pairs</title>
<style>
.pl{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
.bp{animation:bp 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes bp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.fl{animation:fl .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,.9)}to{transform:scale(1,1.1)}}
.rise{animation:rise 2.4s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-42px);opacity:0}}
.rise2{animation:rise 2.4s ease-in 1.2s infinite}
.rise3{animation:rise 2.4s ease-in .6s infinite}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="58.0" y="82.7" font-family="sans-serif" font-size="22" font-weight="800" fill="#7C5CFF" text-anchor="middle" >N</text><circle cx="36.0" cy="70.5" r="3" fill="#2B2F4A"/><circle cx="36.0" cy="79.5" r="3" fill="#2B2F4A"/><text x="142.0" y="82.7" font-family="sans-serif" font-size="22" font-weight="800" fill="#7C5CFF" text-anchor="middle" >N</text><path d="M161.0 67.5L167.0 73.5M161.0 73.5L167.0 67.5" stroke="#FF8A1F" stroke-width="2.2" stroke-linecap="round"/><path d="M161.0 76.5L167.0 82.5M161.0 82.5L167.0 76.5" stroke="#FF8A1F" stroke-width="2.2" stroke-linecap="round"/><ellipse class="pl" cx="100.0" cy="75.0" rx="13" ry="21.0" fill="#FFD7A8"/><circle cx="95.0" cy="66.0" r="3" fill="#2B2F4A"/><path d="M102.0 63.0L108.0 69.0M102.0 69.0L108.0 63.0" stroke="#FF8A1F" stroke-width="2.2" stroke-linecap="round"/><circle cx="95.0" cy="75.0" r="3" fill="#2B2F4A"/><path d="M102.0 72.0L108.0 78.0M102.0 78.0L108.0 72.0" stroke="#FF8A1F" stroke-width="2.2" stroke-linecap="round"/><circle cx="95.0" cy="84.0" r="3" fill="#2B2F4A"/><path d="M102.0 81.0L108.0 87.0M102.0 87.0L108.0 81.0" stroke="#FF8A1F" stroke-width="2.2" stroke-linecap="round"/>
</svg>
