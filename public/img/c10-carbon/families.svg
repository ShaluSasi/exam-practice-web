<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Formulae of alkanes, alkenes and alkynes</title>
<style>
.pl{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
.bp{animation:bp 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes bp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.fl{animation:fl .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,.9)}to{transform:scale(1,1.1)}}
.rise{animation:rise 2.4s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-42px);opacity:0}}
.rise2{animation:rise 2.4s ease-in 1.2s infinite}
.rise3{animation:rise 2.4s ease-in .6s infinite}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200.0" y="24.0" font-family="sans-serif" font-size="14" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Three hydrocarbon families</text><text x="12.0" y="74.0" font-family="sans-serif" font-size="14" font-weight="800" fill="#0B93D4" text-anchor="start" >Alkanes</text><text x="12.0" y="90.0" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#5A5F80" text-anchor="start" >single bonds only</text><rect x="115.0" y="54.0" width="62" height="32" rx="10" fill="#fff" stroke="#0B93D4" stroke-width="2.5"/><text x="146.0" y="74.7" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >CH₄</text><rect x="185.0" y="54.0" width="62" height="32" rx="10" fill="#fff" stroke="#0B93D4" stroke-width="2.5"/><text x="216.0" y="74.7" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >C₂H₆</text><rect x="255.0" y="54.0" width="62" height="32" rx="10" fill="#fff" stroke="#0B93D4" stroke-width="2.5"/><text x="286.0" y="74.7" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >C₃H₈</text><rect x="325.0" y="54.0" width="62" height="32" rx="10" fill="#fff" stroke="#0B93D4" stroke-width="2.5"/><text x="356.0" y="74.7" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >C₄H₁₀</text><text x="12.0" y="136.0" font-family="sans-serif" font-size="14" font-weight="800" fill="#3FA34D" text-anchor="start" >Alkenes</text><text x="12.0" y="152.0" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#5A5F80" text-anchor="start" >a double bond</text><rect x="115.0" y="116.0" width="62" height="32" rx="10" fill="#fff" stroke="#3FA34D" stroke-width="2.5"/><text x="146.0" y="136.7" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >C₂H₄</text><rect x="185.0" y="116.0" width="62" height="32" rx="10" fill="#fff" stroke="#3FA34D" stroke-width="2.5"/><text x="216.0" y="136.7" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >C₃H₆</text><rect x="255.0" y="116.0" width="62" height="32" rx="10" fill="#fff" stroke="#3FA34D" stroke-width="2.5"/><text x="286.0" y="136.7" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >C₄H₈</text><rect x="325.0" y="116.0" width="62" height="32" rx="10" fill="#fff" stroke="#3FA34D" stroke-width="2.5"/><text x="356.0" y="136.7" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >C₅H₁₀</text><text x="12.0" y="198.0" font-family="sans-serif" font-size="14" font-weight="800" fill="#7C5CFF" text-anchor="start" >Alkynes</text><text x="12.0" y="214.0" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#5A5F80" text-anchor="start" >a triple bond</text><rect x="115.0" y="178.0" width="62" height="32" rx="10" fill="#fff" stroke="#7C5CFF" stroke-width="2.5"/><text x="146.0" y="198.7" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >C₂H₂</text><rect x="185.0" y="178.0" width="62" height="32" rx="10" fill="#fff" stroke="#7C5CFF" stroke-width="2.5"/><text x="216.0" y="198.7" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >C₃H₄</text><rect x="255.0" y="178.0" width="62" height="32" rx="10" fill="#fff" stroke="#7C5CFF" stroke-width="2.5"/><text x="286.0" y="198.7" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle" >C₄H₆</text>
</svg>
