<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Diamond: each carbon atom bonded to four others in a rigid 3D structure</title>
<style>
.pl{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
.bp{animation:bp 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes bp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.fl{animation:fl .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,.9)}to{transform:scale(1,1.1)}}
.rise{animation:rise 2.4s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-42px);opacity:0}}
.rise2{animation:rise 2.4s ease-in 1.2s infinite}
.rise3{animation:rise 2.4s ease-in .6s infinite}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<g opacity="1"><line x1="200.0" y1="128.0" x2="130.0" y2="92.0" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round" /><line x1="130.0" y1="92.0" x2="99.6" y2="73.0" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" opacity=".55"/><circle cx="99.6" cy="73.0" r="5" fill="#9AA0C8"/><line x1="130.0" y1="92.0" x2="130.0" y2="54.0" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" opacity=".55"/><circle cx="130.0" cy="54.0" r="5" fill="#9AA0C8"/><line x1="130.0" y1="92.0" x2="160.4" y2="73.0" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" opacity=".55"/><circle cx="160.4" cy="73.0" r="5" fill="#9AA0C8"/><circle cx="130" cy="92" r="9" fill="#0B93D4" stroke="#075E88" stroke-width="2.5"/></g><g opacity="1"><line x1="200.0" y1="128.0" x2="270.0" y2="92.0" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round" /><line x1="270.0" y1="92.0" x2="239.6" y2="73.0" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" opacity=".55"/><circle cx="239.6" cy="73.0" r="5" fill="#9AA0C8"/><line x1="270.0" y1="92.0" x2="270.0" y2="54.0" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" opacity=".55"/><circle cx="270.0" cy="54.0" r="5" fill="#9AA0C8"/><line x1="270.0" y1="92.0" x2="300.4" y2="73.0" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" opacity=".55"/><circle cx="300.4" cy="73.0" r="5" fill="#9AA0C8"/><circle cx="270" cy="92" r="9" fill="#0B93D4" stroke="#075E88" stroke-width="2.5"/></g><g opacity="1"><line x1="200.0" y1="128.0" x2="200.0" y2="196.0" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round" /><line x1="200.0" y1="196.0" x2="169.6" y2="218.8" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" opacity=".55"/><circle cx="169.6" cy="218.8" r="5" fill="#9AA0C8"/><line x1="200.0" y1="196.0" x2="230.4" y2="218.8" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" opacity=".55"/><circle cx="230.4" cy="218.8" r="5" fill="#9AA0C8"/><line x1="200.0" y1="196.0" x2="200.0" y2="234.0" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" opacity=".55"/><circle cx="200.0" cy="234.0" r="5" fill="#9AA0C8"/><circle cx="200" cy="196" r="9" fill="#0B93D4" stroke="#075E88" stroke-width="2.5"/></g><g opacity="0.45"><line x1="200.0" y1="128.0" x2="200.0" y2="52.0" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round" /><line x1="200.0" y1="52.0" x2="182.4" y2="43.2" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" opacity=".55"/><circle cx="182.4" cy="43.2" r="5" fill="#9AA0C8"/><line x1="200.0" y1="52.0" x2="217.6" y2="43.2" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" opacity=".55"/><circle cx="217.6" cy="43.2" r="5" fill="#9AA0C8"/><line x1="200.0" y1="52.0" x2="200.0" y2="30.0" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" opacity=".55"/><circle cx="200.0" cy="30.0" r="5" fill="#9AA0C8"/><circle cx="200" cy="52" r="9" fill="#0B93D4" stroke="#075E88" stroke-width="2.5"/></g><circle class="bp" cx="200" cy="128" r="11" fill="#FF8A1F" stroke="#B35A00" stroke-width="2.5"/>
</svg>
