<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Graphite: layers of hexagonal arrays that slide over each other</title>
<style>
.pl{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
.bp{animation:bp 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes bp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.fl{animation:fl .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,.9)}to{transform:scale(1,1.1)}}
.rise{animation:rise 2.4s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-42px);opacity:0}}
.rise2{animation:rise 2.4s ease-in 1.2s infinite}
.rise3{animation:rise 2.4s ease-in .6s infinite}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.slide{animation:slide 3.6s ease-in-out infinite alternate}@keyframes slide{from{transform:translateX(-14px)}to{transform:translateX(14px)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<defs><g id="hx"><polygon points="14.7,8.5 0.0,17.0 -14.7,8.5 -14.7,-8.5 -0.0,-17.0 14.7,-8.5" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><polygon points="44.2,8.5 29.4,17.0 14.7,8.5 14.7,-8.5 29.4,-17.0 44.2,-8.5" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><polygon points="73.6,8.5 58.9,17.0 44.2,8.5 44.2,-8.5 58.9,-17.0 73.6,-8.5" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><polygon points="103.1,8.5 88.3,17.0 73.6,8.5 73.6,-8.5 88.3,-17.0 103.1,-8.5" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><polygon points="29.4,34.0 14.7,42.5 -0.0,34.0 0.0,17.0 14.7,8.5 29.4,17.0" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><polygon points="58.9,34.0 44.2,42.5 29.4,34.0 29.4,17.0 44.2,8.5 58.9,17.0" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><polygon points="88.3,34.0 73.6,42.5 58.9,34.0 58.9,17.0 73.6,8.5 88.3,17.0" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><polygon points="117.8,34.0 103.1,42.5 88.3,34.0 88.3,17.0 103.1,8.5 117.8,17.0" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><polygon points="14.7,59.5 0.0,68.0 -14.7,59.5 -14.7,42.5 -0.0,34.0 14.7,42.5" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><polygon points="44.2,59.5 29.4,68.0 14.7,59.5 14.7,42.5 29.4,34.0 44.2,42.5" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><polygon points="73.6,59.5 58.9,68.0 44.2,59.5 44.2,42.5 58.9,34.0 73.6,42.5" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><polygon points="103.1,59.5 88.3,68.0 73.6,59.5 73.6,42.5 88.3,34.0 103.1,42.5" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><circle cx="58.9" cy="-17.0" r="4.5" fill="#2B2F4A"/><circle cx="-14.7" cy="42.5" r="4.5" fill="#2B2F4A"/><circle cx="73.6" cy="8.5" r="4.5" fill="#2B2F4A"/><circle cx="1