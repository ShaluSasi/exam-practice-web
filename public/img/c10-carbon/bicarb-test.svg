<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Two test tubes with sodium hydrogencarbonate, one fizzing</title>
<style>
.pl{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
.bp{animation:bp 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes bp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.fl{animation:fl .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,.9)}to{transform:scale(1,1.1)}}
.rise{animation:rise 2.4s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-42px);opacity:0}}
.rise2{animation:rise 2.4s ease-in 1.2s infinite}
.rise3{animation:rise 2.4s ease-in .6s infinite}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M103.5 120H156.5V162.0A26.5 26.5 0 0 1 103.5 162.0Z" fill="#EAF6FF"/><path d="M102.0 60V162.0A28.0 28.0 0 0 0 158.0 162.0V60" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><rect x="118" y="176" width="24" height="9" rx="3" fill="#fff" stroke="#8A90C0" stroke-width="1.5"/><circle class="rise" cx="116" cy="160" r="4" fill="#FFFFFF" stroke="#0B93D4" stroke-width="1.6"/><circle class="rise2" cx="130" cy="154" r="4" fill="#FFFFFF" stroke="#0B93D4" stroke-width="1.6"/><circle class="rise3" cx="144" cy="160" r="4" fill="#FFFFFF" stroke="#0B93D4" stroke-width="1.6"/><circle class="rise" cx="124" cy="154" r="4" fill="#FFFFFF" stroke="#0B93D4" stroke-width="1.6"/><circle class="rise2" cx="138" cy="160" r="4" fill="#FFFFFF" stroke="#0B93D4" stroke-width="1.6"/><text x="130.0" y="222.0" font-family="sans-serif" font-size="18" font-weight="800" fill="#FF8A1F" text-anchor="middle" >P</text><path d="M243.5 120H296.5V162.0A26.5 26.5 0 0 1 243.5 162.0Z" fill="#EAF6FF"/><path d="M242.0 60V162.0A28.0 28.0 0 0 0 298.0 162.0V60" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><rect x="258" y="176" width="24" height="9" rx="3" fill="#fff" stroke="#8A90C0" stroke-width="1.5"/><text x="270.0" y="222.0" font-family="sans-serif" font-size="18" font-weight="800" fill="#FF8A1F" text-anchor="middle" >Q</text><text x="200.0" y="32.0" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#2B2F4A" text-anchor="middle" >A pinch of sodium hydrogencarbonate is added to each</text>
</svg>
