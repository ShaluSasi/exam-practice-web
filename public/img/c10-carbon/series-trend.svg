<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Bars rising along a homologous series</title>
<style>
.pl{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
.bp{animation:bp 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes bp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.fl{animation:fl .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,.9)}to{transform:scale(1,1.1)}}
.rise{animation:rise 2.4s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-42px);opacity:0}}
.rise2{animation:rise 2.4s ease-in 1.2s infinite}
.rise3{animation:rise 2.4s ease-in .6s infinite}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@keyframes grow{0%{transform:scaleY(.3)}30%,100%{transform:scaleY(1)}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="200.0" y="24.0" font-family="sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Alcohol family: chain grows, properties change gradually</text><line x1="40.0" y1="195.0" x2="40.0" y2="45.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="40.0" y1="195.0" x2="380.0" y2="195.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="52.0" y="56.0" font-family="sans-serif" font-size="11" font-weight="700" fill="#FF8A1F" text-anchor="start" >melting and boiling points rise</text><rect x="70" y="155" width="56" height="40" rx="8" fill="#FFC27A" stroke="#FF8A1F" stroke-width="3" style="transform-box:fill-box;transform-origin:50% 100%;animation:grow 4s ease-in-out infinite;animation-delay:0.0s"/><text x="98.0" y="214.0" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >CH₃OH</text><rect x="152" y="125" width="56" height="70" rx="8" fill="#FFC27A" stroke="#FF8A1F" stroke-width="3" style="transform-box:fill-box;transform-origin:50% 100%;animation:grow 4s ease-in-out infinite;animation-delay:0.2s"/><text x="180.0" y="214.0" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >C₂H₅OH</text><rect x="234" y="95" width="56" height="100" rx="8" fill="#FFC27A" stroke="#FF8A1F" stroke-width="3" style="transform-box:fill-box;transform-origin:50% 100%;animation:grow 4s ease-in-out infinite;animation-delay:0.4s"/><text x="262.0" y="214.0" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >C₃H₇OH</text><rect x="316" y="65" width="56" height="130" rx="8" fill="#FFC27A" stroke="#FF8A1F" stroke-width="3" style="transform-box:fill-box;transform-origin:50% 100%;animation:grow 4s ease-in-out infinite;animation-delay:0.6000000000000001s"/><text x="344.0" y="214.0" font-family="sans-serif" font-size="12" font-weight="600" fill="#2B2F4A" text-anchor="middle" >C₄H₉OH</text><text x="200.0" y="232.0" font-family="sans-serif" font-size="11" font-weight="600" fill="#3FA34D" text-anchor="middle" >all contain the -OH group, so chemical properties stay similar</text>
</svg>
