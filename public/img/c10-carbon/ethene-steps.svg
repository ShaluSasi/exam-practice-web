<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Building ethene step by step</title>
<style>
.pl{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
.bp{animation:bp 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes bp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.fl{animation:fl .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,.9)}to{transform:scale(1,1.1)}}
.rise{animation:rise 2.4s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-42px);opacity:0}}
.rise2{animation:rise 2.4s ease-in 1.2s infinite}
.rise3{animation:rise 2.4s ease-in .6s infinite}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="66.0" y="28.0" font-family="sans-serif" font-size="13" font-weight="600" fill="#FF8A1F" text-anchor="middle" >Step 1</text><text x="200.0" y="28.0" font-family="sans-serif" font-size="13" font-weight="600" fill="#FF8A1F" text-anchor="middle" >Step 2</text><text x="334.0" y="28.0" font-family="sans-serif" font-size="13" font-weight="600" fill="#FF8A1F" text-anchor="middle" >Step 3</text><line x1="120.0" y1="12.0" x2="120.0" y2="218.0" stroke="#C9CEE8" stroke-width="2" stroke-linecap="round" /><line x1="268.0" y1="12.0" x2="268.0" y2="218.0" stroke="#C9CEE8" stroke-width="2" stroke-linecap="round" /><line x1="52.0" y1="110.0" x2="80.0" y2="110.0" stroke="#2B2F4A" stroke-width="3.5" stroke-linecap="round" /><text x="40.0" y="118.0" font-family="sans-serif" font-size="22" font-weight="800" fill="#2B2F4A" text-anchor="middle" >C</text><text x="92.0" y="118.0" font-family="sans-serif" font-size="22" font-weight="800" fill="#2B2F4A" text-anchor="middle" >C</text><line x1="190.8" y1="120.0" x2="209.2" y2="120.0" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="173.4" y1="111.5" x2="158.6" y2="92.5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="173.4" y1="128.5" x2="158.6" y2="147.5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="226.6" y1="111.5" x2="241.4" y2="92.5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="226.6" y1="128.5" x2="241.4" y2="147.5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="180.0" y="125.8" font-family="sans-serif" font-size="16" font-weight="700" fill="#2B2F4A" text-anchor="middle" >C</text><text x="220.0" y="125.8" font-family="sans-serif" font-size="16" font-weight="700" fill="#2B2F4A" text-anchor="middle" >C</text><text x="152.0" y="89.8" font-family="sans-serif" font-size="16" font-weight="700" fill="#4A90C2" text-anchor="middle" >H</text><text x="152.0" y="161.8" font-family="sans-serif" font-size="16" font-weight="700" fill="#4A90C2" text-anchor="middle" >H</text><text x="248.0" y="89.8" font-family="sans-serif" font-size="16" font-weight="700" fill="#4A90C2" text-anchor="middle" >H</text><text x="248.0" y="161.8" font-family="sans-serif" font-size="16" font-weight="700" fill="#4A90C2" text-anchor="middle" >H</text><circle class="bp" cx="180.0" cy="94.0" r="5" fill="#E5484D"/><circle class="bp" cx="220.0" cy="94.0" r="5" fill="#E5484D"/><text x="200.0" y="205.0" font-family="sans-serif" font-size="11" font-weight="600" fill="#E5484D" text-anchor="middle" >1 valency left each</text><line x1="324.8" y1="116.8" x2="343.2" y2="116.8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="324.8" y1="123.2" x2="343.2" y2="123.2" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="307.4" y1="111.5" x2="292.6" y2="92.5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="307.4" y1="128.5" x2="292.6" y2="147.5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="360.6" y1="111.5" x2="375.4" y2="92.5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="360.6" y1="128.5" x2="375.4" y2="147.5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="314.0" y="125.8" font-family="sans-serif" font-size="16" font-weight="700" fill="#2B2F4A" text-anchor="middle" >C</text><text x="354.0" y="125.8" font-family="sans-serif" font-size="16" font-weight="700" fill="#2B2F4A" text-anchor="middle" >C</text><text x="286.0" y="89.8" font-family="sans-serif" font-size="16" font-weight="700" fill="#4A90C2" text-anchor="middle" >H</text><text x="286.0" y="161.8" font-family="sans-serif" font-size="16" font-weight="700" fill="#4A90C2" text-anchor="middle" >H</text><text x="382.0" y="89.8" font-family="sans-serif" font-size="16" font-weight="700" fill="#4A90C2" text-anchor="middle" >H</text><text x="382.0" y="161.8" font-family="sans-serif" font-size="16" font-weight="700" fill="#4A90C2" text-anchor="middle" >H</text><text x="66.0" y="140.0" font-family="sans-serif" font-size="11" font-weight="600" fill="#5A5F80" text-anchor="middle" >C-C single</text><text x="334.0" y="205.0" font-family="sans-serif" font-size="11" font-weight="600" fill="#3FA34D" text-anchor="middle" >all valencies filled</text>
</svg>
