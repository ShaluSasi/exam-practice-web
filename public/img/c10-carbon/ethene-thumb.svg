<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" role="img">
<title>Structure of ethene with a double bond</title>
<style>
.pl{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
.bp{animation:bp 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes bp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.fl{animation:fl .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,.9)}to{transform:scale(1,1.1)}}
.rise{animation:rise 2.4s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-42px);opacity:0}}
.rise2{animation:rise 2.4s ease-in 1.2s infinite}
.rise3{animation:rise 2.4s ease-in .6s infinite}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<line x1="85.8" y1="71.8" x2="114.2" y2="71.8" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="85.8" y1="78.2" x2="114.2" y2="78.2" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="68.4" y1="66.5" x2="53.6" y2="47.5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="68.4" y1="83.5" x2="53.6" y2="102.5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="131.6" y1="66.5" x2="146.4" y2="47.5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="131.6" y1="83.5" x2="146.4" y2="102.5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="75.0" y="80.8" font-family="sans-serif" font-size="16" font-weight="700" fill="#2B2F4A" text-anchor="middle" >C</text><text x="125.0" y="80.8" font-family="sans-serif" font-size="16" font-weight="700" fill="#2B2F4A" text-anchor="middle" >C</text><text x="47.0" y="44.8" font-family="sans-serif" font-size="16" font-weight="700" fill="#4A90C2" text-anchor="middle" >H</text><text x="47.0" y="116.8" font-family="sans-serif" font-size="16" font-weight="700" fill="#4A90C2" text-anchor="middle" >H</text><text x="153.0" y="44.8" font-family="sans-serif" font-size="16" font-weight="700" fill="#4A90C2" text-anchor="middle" >H</text><text x="153.0" y="116.8" font-family="sans-serif" font-size="16" font-weight="700" fill="#4A90C2" text-anchor="middle" >H</text>
</svg>
