<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img">
<title>Carbon forming C4- by gaining or C4+ by losing four electrons</title>
<style>
.pl{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.35}50%{opacity:1}}
.bp{animation:bp 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes bp{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.fl{animation:fl .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fl{from{transform:scale(1,.9)}to{transform:scale(1,1.1)}}
.rise{animation:rise 2.4s ease-in infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-42px);opacity:0}}
.rise2{animation:rise 2.4s ease-in 1.2s infinite}
.rise3{animation:rise 2.4s ease-in .6s infinite}
.drift{animation:drift 3s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<circle cx="100" cy="108" r="34" fill="none" stroke="#8A90C0" stroke-width="2.5"/><circle cx="100" cy="108" r="58" fill="none" stroke="#8A90C0" stroke-width="2.5"/><circle cx="100" cy="108" r="14" fill="#F8B4B6" stroke="#E5484D" stroke-width="3"/><text x="100.0" y="112.0" font-family="sans-serif" font-size="11" font-weight="700" fill="#E5484D" text-anchor="middle" >6p</text><g style="transform-origin:100px 108px;animation:sp 8s linear infinite"><circle cx="100.0" cy="74.0" r="5" fill="#0B93D4" stroke="#075E88" stroke-width="2"/><circle cx="100.0" cy="142.0" r="5" fill="#0B93D4" stroke="#075E88" stroke-width="2"/></g><g style="transform-origin:100px 108px;animation:sp 12s linear infinite reverse"><circle cx="100.0" cy="50.0" r="5" fill="#0B93D4" stroke="#075E88" stroke-width="2"/><circle cx="141.0" cy="67.0" r="5" fill="#0B93D4" stroke="#075E88" stroke-width="2"/><circle cx="158.0" cy="108.0" r="5" fill="#0B93D4" stroke="#075E88" stroke-width="2"/><circle cx="141.0" cy="149.0" r="5" fill="#0B93D4" stroke="#075E88" stroke-width="2"/><circle cx="100.0" cy="166.0" r="5" fill="#0B93D4" stroke="#075E88" stroke-width="2"/><circle cx="59.0" cy="149.0" r="5" fill="#0B93D4" stroke="#075E88" stroke-width="2"/><circle cx="42.0" cy="108.0" r="5" fill="#0B93D4" stroke="#075E88" stroke-width="2"/><circle cx="59.0" cy="67.0" r="5" fill="#0B93D4" stroke="#075E88" stroke-width="2"/></g><circle cx="300" cy="108" r="34" fill="none" stroke="#8A90C0" stroke-width="2.5"/><circle cx="300" cy="108" r="14" fill="#F8B4B6" stroke="#E5484D" stroke-width="3"/><text x="300.0" y="112.0" font-family="sans-serif" font-size="11" font-weight="700" fill="#E5484D" text-anchor="middle" >6p</text><g style="transform-origin:300px 108px;animation:sp 8s linear infinite"><circle cx="300.0" cy="74.0" r="5" fill="#0B93D4" stroke="#075E88" stroke-width="2"/><circle cx="300.0" cy="142.0" r="5" fill="#0B93D4" stroke="#075E88" stroke-width="2"/></g><text x="100.0" y="192.0" font-family="sans-serif" font-size="20" font-weight="800" fill="#2B2F4A" text-anchor="middle" >C⁴⁻</text><text x="300.0" y="192.0" font-family="sans-serif" font-size="20" font-weight="800" fill="#2B2F4A" text-anchor="middle" >C⁴⁺</text><text x="100.0" y="214.0" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#E5484D" text-anchor="middle" >gains 4 e⁻: 10 electrons</text><text x="100.0" y="230.0" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#E5484D" text-anchor="middle" >round 6 protons</text><text x="300.0" y="214.0" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#E5484D" text-anchor="middle" >loses 4 e⁻: only 2 electrons</text><text x="300.0" y="230.0" font-family="sans-serif" font-size="11.5" font-weight="600" fill="#E5484D" text-anchor="middle" >left round 6 protons</text><text x="200.0" y="22.0" font-family="sans-serif" font-size="13" font-weight="600" fill="#2B2F4A" text-anchor="middle" >Two ways carbon could get a full outer shell</text>
</svg>
