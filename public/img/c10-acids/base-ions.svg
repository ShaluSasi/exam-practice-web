<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 215" role="img"><title>Sodium hydroxide dissolving in water gives sodium ions and hydroxide ions</title><style>.bub{animation:bub 2.2s linear infinite;transform-box:fill-box}@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--rise,-40px));opacity:0}}
.fl{animation:fl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.dr{animation:dr 1.6s ease-in infinite;transform-box:fill-box}@keyframes dr{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(var(--fall,30px));opacity:0}}
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gl{animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{from{opacity:.35}to{opacity:.9}}
.dft{animation:dft 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes dft{from{transform:translate(0,0)}to{transform:translate(var(--dx,6px),var(--dy,-6px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="30" y="80" width="80" height="44" rx="10" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><text x="70" y="108" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">NaOH(s)</text><line x1="120" y1="102" x2="180" y2="102" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M172.1,106.3 L180,102 L172.1,97.7" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="150" y="90" font-family="sans-serif" font-size="11" font-weight="700" fill="#0B93D4" text-anchor="middle">water</text><rect x="190" y="50" width="190" height="130" rx="14" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" /><g class="dft" style="--dx:6px;--dy:-5px;animation-delay:0.0s"><circle cx="225" cy="85" r="13" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2" /><text x="225" y="89" font-family="sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">Na⁺</text></g><g class="dft" style="--dx:-6px;--dy:6px;animation-delay:-0.4s"><circle cx="300" cy="100" r="13" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" /><text x="300" y="104" font-family="sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">OH⁻</text></g><g class="dft" style="--dx:8px;--dy:-5px;animation-delay:-0.8s"><circle cx="260" cy="140" r="13" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2" /><text x="260" y="144" font-family="sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">Na⁺</text></g><g class="dft" style="--dx:-6px;--dy:6px;animation-delay:-1.2000000000000002s"><circle cx="340" cy="80" r="13" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" /><text x="340" y="84" font-family="sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">OH⁻</text></g><g class="dft" style="--dx:10px;--dy:-5px;animation-delay:-1.6s"><circle cx="345" cy="150" r="13" fill="#7C5CFF" stroke="#2B2F4A" stroke-width="2" /><text x="345" y="154" font-family="sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">Na⁺</text></g><g class="dft" style="--dx:-6px;--dy:6px;animation-delay:-2.0s"><circle cx="230" cy="150" r="13" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" /><text x="230" y="154" font-family="sans-serif" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">OH⁻</text></g><text x="285" y="200" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">free ions: Na⁺ and OH⁻</text></svg>