<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img"><title>Zinc granules warmed with sodium hydroxide solution give hydrogen gas</title><style>.bub{animation:bub 2.2s linear infinite;transform-box:fill-box}@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--rise,-40px));opacity:0}}
.fl{animation:fl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.dr{animation:dr 1.6s ease-in infinite;transform-box:fill-box}@keyframes dr{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(var(--fall,30px));opacity:0}}
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gl{animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{from{opacity:.35}to{opacity:.9}}
.dft{animation:dft 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes dft{from{transform:translate(0,0)}to{transform:translate(var(--dx,6px),var(--dy,-6px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="10" y="205" width="380" height="10" rx="3" fill="#C9B28A" stroke="#8B6B3E" stroke-width="2" /><path d="M150,116.0 L150,160.0 Q150,185 175.0,185 L175.0,185 Q200,185 200,160.0 L200,116.0 Z" fill="#EAF3F6" opacity=".95" class=""/><path d="M150,70 L150,160.0 Q150,185 175.0,185 L175.0,185 Q200,185 200,160.0 L200,70" fill="none" fill-opacity="1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="146" y1="70" x2="204" y2="70" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><circle cx="165" cy="172" r="6" fill="#9AA0B5" stroke="#2B2F4A" stroke-width="2" /><circle cx="180" cy="176" r="6" fill="#9AA0B5" stroke="#2B2F4A" stroke-width="2" /><circle class="bub" cx="160" cy="165" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-55px;animation-duration:2.2s;animation-delay:-0.00s"/><circle class="bub" cx="175" cy="158" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-55px;animation-duration:2.2s;animation-delay:-0.73s"/><circle class="bub" cx="188" cy="151" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-55px;animation-duration:2.2s;animation-delay:-1.47s"/><g class="fl"><path d="M175,200 q10.799999999999999,-15.6 0,-33.6 q-10.799999999999999,18.0 0,33.6Z" fill="#FF8A1F" stroke="#E5484D" stroke-width="1.5"/><path d="M175,200 q4.8,-7.199999999999999 0,-16.8 q-4.8,9.6 0,16.8Z" fill="#FFE27A"/></g><text x="95" y="100" font-family="sans-serif" font-size="12" font-weight="700" fill="#E5484D" text-anchor="middle">warm</text><line x1="115" y1="106" x2="147" y2="125" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" /><path d="M138.0,124.7 L147,125 L142.4,117.3" fill="none" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="90" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">NaOH solution + zinc</text><text x="300" y="115" font-family="sans-serif" font-size="12" font-weight="700" fill="#3FA34D" text-anchor="middle">Hydrogen gas is evolved</text><text x="300" y="150" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">Product: sodium zincate</text><text x="300" y="172" font-family="sans-serif" font-size="13" font-weight="700" fill="#7C5CFF" text-anchor="middle">(Na₂ZnO₂)</text></svg>