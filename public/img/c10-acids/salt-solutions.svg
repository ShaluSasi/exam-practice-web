<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 235" role="img"><title>Three beakers of salt solutions to be tested with pH paper</title><style>.bub{animation:bub 2.2s linear infinite;transform-box:fill-box}@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--rise,-40px));opacity:0}}
.fl{animation:fl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.dr{animation:dr 1.6s ease-in infinite;transform-box:fill-box}@keyframes dr{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(var(--fall,30px));opacity:0}}
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gl{animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{from{opacity:.35}to{opacity:.9}}
.dft{animation:dft 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes dft{from{transform:translate(0,0)}to{transform:translate(var(--dx,6px),var(--dy,-6px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M50,101.0 L50,138 Q50,150 62,150 L118,150 Q130,150 130,138 L130,101.0 Z" fill="#EAF6FB" opacity=".95" class=""/><path d="M50,80 L50,138 Q50,150 62,150 L118,150 Q130,150 130,138 L130,80" fill="none" fill-opacity="1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="46" y1="80" x2="134" y2="80" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="90" y="170" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">NaCl</text><text x="90" y="190" font-family="sans-serif" font-size="11" font-weight="700" fill="#555" text-anchor="middle">solution</text><path d="M150,101.0 L150,138 Q150,150 162,150 L218,150 Q230,150 230,138 L230,101.0 Z" fill="#EAF6FB" opacity=".95" class=""/><path d="M150,80 L150,138 Q150,150 162,150 L218,150 Q230,150 230,138 L230,80" fill="none" fill-opacity="1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="146" y1="80" x2="234" y2="80" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="190" y="170" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">CuSO₄</text><text x="190" y="190" font-family="sans-serif" font-size="11" font-weight="700" fill="#555" text-anchor="middle">solution</text><path d="M250,101.0 L250,138 Q250,150 262,150 L318,150 Q330,150 330,138 L330,101.0 Z" fill="#EAF6FB" opacity=".95" class=""/><path d="M250,80 L250,138 Q250,150 262,150 L318,150 Q330,150 330,138 L330,80" fill="none" fill-opacity="1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="246" y1="80" x2="334" y2="80" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="290" y="170" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">CH₃COONa</text><text x="290" y="190" font-family="sans-serif" font-size="11" font-weight="700" fill="#555" text-anchor="middle">solution</text><text x="200" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">Three salt solutions to be tested with pH paper</text><rect x="60" y="208" width="24" height="16" rx="3" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" /><text x="90" y="221" font-family="sans-serif" font-size="10" font-weight="400" fill="#2B2F4A" text-anchor="start">red: acidic</text><rect x="170" y="208" width="24" height="16" rx="3" fill="#7CC576" stroke="#2B2F4A" stroke-width="2" /><text x="200" y="221" font-family="sans-serif" font-size="10" font-weight="400" fill="#2B2F4A" text-anchor="start">green: neutral</text><rect x="280" y="208" width="24" height="16" rx="3" fill="#6B52D1" stroke="#2B2F4A" stroke-width="2" /><text x="310" y="221" font-family="sans-serif" font-size="10" font-weight="400" fill="#2B2F4A" text-anchor="start">blue-violet: basic</text></svg>