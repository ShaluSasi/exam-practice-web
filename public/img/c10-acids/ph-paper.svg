<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 235" role="img"><title>Two beakers A (pH 6) and B (pH 8) tested with pH paper</title><style>.bub{animation:bub 2.2s linear infinite;transform-box:fill-box}@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--rise,-40px));opacity:0}}
.fl{animation:fl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.dr{animation:dr 1.6s ease-in infinite;transform-box:fill-box}@keyframes dr{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(var(--fall,30px));opacity:0}}
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gl{animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{from{opacity:.35}to{opacity:.9}}
.dft{animation:dft 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes dft{from{transform:translate(0,0)}to{transform:translate(var(--dx,6px),var(--dy,-6px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M70,117.0 L70,166 Q70,180 84,180 L136,180 Q150,180 150,166 L150,117.0 Z" fill="#EAF6FB" opacity=".95" class=""/><path d="M70,90 L70,166 Q70,180 84,180 L136,180 Q150,180 150,166 L150,90" fill="none" fill-opacity="1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="66" y1="90" x2="154" y2="90" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><rect x="104" y="40" width="14" height="70" rx="2" fill="#E2D13B" stroke="#2B2F4A" stroke-width="2" /><text x="110" y="205" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">Solution A</text><text x="110" y="223" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">pH 6</text><path d="M250,117.0 L250,166 Q250,180 264,180 L316,180 Q330,180 330,166 L330,117.0 Z" fill="#EAF6FB" opacity=".95" class=""/><path d="M250,90 L250,166 Q250,180 264,180 L316,180 Q330,180 330,166 L330,90" fill="none" fill-opacity="1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="246" y1="90" x2="334" y2="90" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><rect x="284" y="40" width="14" height="70" rx="2" fill="#38B4B5" stroke="#2B2F4A" stroke-width="2" /><text x="290" y="205" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">Solution B</text><text x="290" y="223" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">pH 8</text><text x="200" y="22" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">pH paper dipped in two solutions</text></svg>