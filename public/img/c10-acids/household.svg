<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 190" role="img"><title>Everyday uses: cake baking, laundry, clean water, a bone cast and toys</title><style>.bub{animation:bub 2.2s linear infinite;transform-box:fill-box}@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--rise,-40px));opacity:0}}
.fl{animation:fl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.dr{animation:dr 1.6s ease-in infinite;transform-box:fill-box}@keyframes dr{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(var(--fall,30px));opacity:0}}
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gl{animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{from{opacity:.35}to{opacity:.9}}
.dft{animation:dft 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes dft{from{transform:translate(0,0)}to{transform:translate(var(--dx,6px),var(--dy,-6px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="18" y="100" width="44" height="26" rx="6" fill="#F2C97D" stroke="#B9833A" stroke-width="3" /><line x1="40" y1="100" x2="40" y2="88" stroke="#E5484D" stroke-width="3" stroke-linecap="round" /><g class="fl"><path d="M40,86 q4.5,-6.5 0,-14.0 q-4.5,7.5 0,14.0Z" fill="#FF8A1F" stroke="#E5484D" stroke-width="1.5"/><path d="M40,86 q2.0,-3.0 0,-7.0 q-2.0,4.0 0,7.0Z" fill="#FFE27A"/></g><path d="M98,100 L142,100 L136,135 L104,135Z" fill="#6EA8DC" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M104,100 Q120,80 136,100" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M200,80 Q222,110 200,128 Q178,110 200,80Z" fill="#CDEFF7" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><rect x="250" y="100" width="60" height="24" rx="10" fill="#F4D7BF" stroke="#C9955B" stroke-width="3" /><rect x="268" y="96" width="24" height="32" rx="6" fill="#FFFFFF" stroke="#9AA0B5" stroke-width="3" /><circle cx="360" cy="115" r="16" fill="#FFD84A" stroke="#2B2F4A" stroke-width="3" /><path d="M373,112 l14,3 l-14,5Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="356" cy="110" r="2.5" fill="#2B2F4A" stroke="none" stroke-width="2" /><text x="40" y="160" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">Cake</text><text x="120" y="160" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">Laundry</text><text x="200" y="160" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">Clean water</text><text x="280" y="160" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">Bone cast</text><text x="360" y="160" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">Toys</text><text x="200" y="40" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle">Everyday uses of chemicals made from salts</text></svg>