<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" role="img"><title>pH paper shown as Orange</title><style>.bub{animation:bub 2.2s linear infinite;transform-box:fill-box}@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--rise,-40px));opacity:0}}
.fl{animation:fl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.dr{animation:dr 1.6s ease-in infinite;transform-box:fill-box}@keyframes dr{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(var(--fall,30px));opacity:0}}
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gl{animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{from{opacity:.35}to{opacity:.9}}
.dft{animation:dft 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes dft{from{transform:translate(0,0)}to{transform:translate(var(--dx,6px),var(--dy,-6px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="75" y="18" width="50" height="100" rx="6" fill="#FF9A3C" stroke="#2B2F4A" stroke-width="3" /><line x1="85" y1="118" x2="85" y2="128" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" /><path class="dr" d="M100,5.199999999999999 q3,4.800000000000001 0,6.6000000000000005 q-3,-1.7999999999999998 0,-6.6000000000000005Z" fill="#0B93D4" style="--fall:8px;animation-duration:1.6s;animation-delay:0.00s"/><text x="100" y="146" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">Orange</text></svg>