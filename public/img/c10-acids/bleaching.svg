<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 238" role="img"><title>Chlorine gas is passed over dry slaked lime to make bleaching powder, used for bleaching and disinfecting</title><style>.bub{animation:bub 2.2s linear infinite;transform-box:fill-box}@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--rise,-40px));opacity:0}}
.fl{animation:fl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.dr{animation:dr 1.6s ease-in infinite;transform-box:fill-box}@keyframes dr{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(var(--fall,30px));opacity:0}}
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gl{animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{from{opacity:.35}to{opacity:.9}}
.dft{animation:dft 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes dft{from{transform:translate(0,0)}to{transform:translate(var(--dx,6px),var(--dy,-6px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="25" y="70" width="40" height="100" rx="10" fill="#D6EE6B" stroke="#7A9A12" stroke-width="3" /><text x="45" y="125" font-family="sans-serif" font-size="13" font-weight="700" fill="#4A6000" text-anchor="middle">Cl₂</text><text x="45" y="190" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">chlorine gas</text><line x1="72" y1="110" x2="128" y2="110" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M120.1,114.3 L128,110 L120.1,105.7" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M130,120 Q130,160 175,160 Q220,160 220,120Z" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M135,120 Q175,100 215,120" fill="#F4F4F4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="175" y="185" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">dry slaked lime</text><line x1="230" y1="120" x2="270" y2="120" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M262.1,124.3 L270,120 L262.1,115.7" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M275,130 Q275,170 315,170 Q355,170 355,130Z" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M280,130 Q315,110 350,130" fill="#F4F4F4" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="315" y="192" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">bleaching powder</text><rect x="45" y="205" width="90" height="22" rx="8" fill="#E3F2FD" stroke="#0B93D4" stroke-width="2" /><text x="90" y="220" font-family="sans-serif" font-size="10" font-weight="700" fill="#2B2F4A" text-anchor="middle">textile &amp; paper</text><rect x="155" y="205" width="90" height="22" rx="8" fill="#E3F2FD" stroke="#0B93D4" stroke-width="2" /><text x="200" y="220" font-family="sans-serif" font-size="10" font-weight="700" fill="#2B2F4A" text-anchor="middle">laundry</text><rect x="265" y="205" width="90" height="22" rx="8" fill="#E3F2FD" stroke="#0B93D4" stroke-width="2" /><text x="310" y="220" font-family="sans-serif" font-size="10" font-weight="700" fill="#2B2F4A" text-anchor="middle">germ-free water</text><text x="200" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle">Chlorine + dry slaked lime</text></svg>