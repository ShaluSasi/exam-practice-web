<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Gas from sodium carbonate and dilute HCl is passed through lime water, which turns milky</title><style>.bub{animation:bub 2.2s linear infinite;transform-box:fill-box}@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--rise,-40px));opacity:0}}
.fl{animation:fl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.dr{animation:dr 1.6s ease-in infinite;transform-box:fill-box}@keyframes dr{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(var(--fall,30px));opacity:0}}
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gl{animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{from{opacity:.35}to{opacity:.9}}
.dft{animation:dft 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes dft{from{transform:translate(0,0)}to{transform:translate(var(--dx,6px),var(--dy,-6px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}.milk{animation:milk 4s ease-in-out infinite alternate}@keyframes milk{from{fill:#E8F6FB}to{fill:#FFFFFF}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="10" y="215" width="380" height="10" rx="3" fill="#C9B28A" stroke="#8B6B3E" stroke-width="2" /><path d="M40,150.0 L40,180.0 Q40,205 65.0,205 L65.0,205 Q90,205 90,180.0 L90,150.0 Z" fill="#EEF2F5" opacity=".95" class=""/><path d="M40,95 L40,180.0 Q40,205 65.0,205 L65.0,205 Q90,205 90,180.0 L90,95" fill="none" fill-opacity="1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="36" y1="95" x2="94" y2="95" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><circle cx="55" cy="196" r="5" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><circle cx="66" cy="198" r="5" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><circle cx="77" cy="195" r="5" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><circle class="bub" cx="52" cy="180" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-50px;animation-duration:2.2s;animation-delay:-0.00s"/><circle class="bub" cx="66" cy="173" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-50px;animation-duration:2.2s;animation-delay:-0.55s"/><circle class="bub" cx="78" cy="166" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-50px;animation-duration:2.2s;animation-delay:-1.10s"/><circle class="bub" cx="58" cy="180" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-50px;animation-duration:2.2s;animation-delay:-1.65s"/><rect x="52" y="88" width="26" height="12" rx="3" fill="#C9955B" stroke="#8B5A2B" stroke-width="2" /><path d="M65,90 L65,62 L268,62 L268,175" fill="none" stroke="#2B2F4A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M65,90 L65,62 L268,62 L268,175" fill="none" stroke="#CFE9F7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M225,171.5 L225,198 Q225,210 237,210 L303,210 Q315,210 315,198 L315,171.5 Z" fill="#E8F6FB" opacity=".95" class="milk"/><path d="M225,140 L225,198 Q225,210 237,210 L303,210 Q315,210 315,198 L315,140" fill="none" fill-opacity="1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="221" y1="140" x2="319" y2="140" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><circle class="bub" cx="258" cy="172" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-22px;animation-duration:2.2s;animation-delay:-0.00s"/><circle class="bub" cx="268" cy="165" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-22px;animation-duration:2.2s;animation-delay:-0.73s"/><circle class="bub" cx="278" cy="158" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-22px;animation-duration:2.2s;animation-delay:-1.47s"/><text x="65" y="237" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">Na₂CO₃ + dil. HCl</text><text x="270" y="237" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">lime water</text></svg>