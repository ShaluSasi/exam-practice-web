<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 242" role="img"><title>Zinc granules in dilute sulphuric acid; hydrogen passes into soap solution and a burning candle is brought near the bubble</title><style>.bub{animation:bub 2.2s linear infinite;transform-box:fill-box}@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--rise,-40px));opacity:0}}
.fl{animation:fl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.dr{animation:dr 1.6s ease-in infinite;transform-box:fill-box}@keyframes dr{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(var(--fall,30px));opacity:0}}
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gl{animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{from{opacity:.35}to{opacity:.9}}
.dft{animation:dft 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes dft{from{transform:translate(0,0)}to{transform:translate(var(--dx,6px),var(--dy,-6px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="10" y="215" width="380" height="10" rx="3" fill="#C9B28A" stroke="#8B6B3E" stroke-width="2" /><path d="M40,130.25 L40,180.0 Q40,205 65.0,205 L65.0,205 Q90,205 90,180.0 L90,130.25 Z" fill="#D6ECF9" opacity=".95" class=""/><path d="M40,90 L40,180.0 Q40,205 65.0,205 L65.0,205 Q90,205 90,180.0 L90,90" fill="none" fill-opacity="1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="36" y1="90" x2="94" y2="90" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><circle cx="55" cy="190" r="6" fill="#9AA0B5" stroke="#2B2F4A" stroke-width="2" /><circle cx="68" cy="194" r="6" fill="#9AA0B5" stroke="#2B2F4A" stroke-width="2" /><circle cx="78" cy="188" r="6" fill="#9AA0B5" stroke="#2B2F4A" stroke-width="2" /><circle class="bub" cx="52" cy="185" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-60px;animation-duration:2.2s;animation-delay:-0.00s"/><circle class="bub" cx="66" cy="178" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-60px;animation-duration:2.2s;animation-delay:-0.55s"/><circle class="bub" cx="78" cy="171" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-60px;animation-duration:2.2s;animation-delay:-1.10s"/><circle class="bub" cx="60" cy="185" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-60px;animation-duration:2.2s;animation-delay:-1.65s"/><rect x="52" y="84" width="26" height="12" rx="3" fill="#C9955B" stroke="#8B5A2B" stroke-width="2" /><path d="M65,86 L65,58 L270,58 L270,185" fill="none" stroke="#2B2F4A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M65,86 L65,58 L270,58 L270,185" fill="none" stroke="#CFE9F7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M225,171.5 L225,198 Q225,210 237,210 L303,210 Q315,210 315,198 L315,171.5 Z" fill="#CDEFF7" opacity=".95" class=""/><path d="M225,140 L225,198 Q225,210 237,210 L303,210 Q315,210 315,198 L315,140" fill="none" fill-opacity="1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="221" y1="140" x2="319" y2="140" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><circle class="bub" cx="262" cy="178" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-22px;animation-duration:2.2s;animation-delay:-0.00s"/><circle class="bub" cx="270" cy="171" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-22px;animation-duration:2.2s;animation-delay:-0.73s"/><circle class="bub" cx="278" cy="164" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-22px;animation-duration:2.2s;animation-delay:-1.47s"/><circle cx="332" cy="108" r="14" fill="#EAF6FD" stroke="#0B93D4" stroke-width="2" /><circle cx="327" cy="103" r="3" fill="#fff" stroke="none" stroke-width="2" /><rect x="355" y="150" width="14" height="55" rx="3" fill="#F2E7D0" stroke="#B9A06A" stroke-width="2" /><g class="fl"><path d="M362,148 q9,-13 0,-28 q-9,15 0,28Z" fill="#FF8A1F" stroke="#E5484D" stroke-width="1.5"/><path d="M362,148 q4,-6 0,-14 q-4,8 0,14Z" fill="#FFE27A"/></g><text x="360" y="236" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">candle</text><text x="270" y="236" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">soap solution</text><line x1="340" y1="100" x2="352" y2="128" stroke="#3FA34D" stroke-width="2.5" stroke-linecap="round" /><path d="M344.9,122.4 L352,128 L352.9,119.0" fill="none" stroke="#3FA34D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>