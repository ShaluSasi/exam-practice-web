<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img"><title>Four test tubes showing acid reacting with a metal, a carbonate, a metal oxide and a base</title><style>.bub{animation:bub 2.2s linear infinite;transform-box:fill-box}@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--rise,-40px));opacity:0}}
.fl{animation:fl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.dr{animation:dr 1.6s ease-in infinite;transform-box:fill-box}@keyframes dr{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(var(--fall,30px));opacity:0}}
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gl{animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{from{opacity:.35}to{opacity:.9}}
.dft{animation:dft 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes dft{from{transform:translate(0,0)}to{transform:translate(var(--dx,6px),var(--dy,-6px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M30,114.0 L30,158.0 Q30,180 52.0,180 L52.0,180 Q74,180 74,158.0 L74,114.0 Z" fill="#EAF6FB" opacity=".95" class=""/><path d="M30,70 L30,158.0 Q30,180 52.0,180 L52.0,180 Q74,180 74,158.0 L74,70" fill="none" fill-opacity="1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="26" y1="70" x2="78" y2="70" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><circle cx="44" cy="168" r="5" fill="#9AA0B5" stroke="#2B2F4A" stroke-width="2" /><circle cx="58" cy="170" r="5" fill="#9AA0B5" stroke="#2B2F4A" stroke-width="2" /><circle class="bub" cx="44" cy="160" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-50px;animation-duration:2.2s;animation-delay:-0.00s"/><circle class="bub" cx="56" cy="153" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-50px;animation-duration:2.2s;animation-delay:-1.10s"/><text x="52" y="205" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">Zn + acid</text><path d="M122,114.0 L122,158.0 Q122,180 144.0,180 L144.0,180 Q166,180 166,158.0 L166,114.0 Z" fill="#EAF6FB" opacity=".95" class=""/><path d="M122,70 L122,158.0 Q122,180 144.0,180 L144.0,180 Q166,180 166,158.0 L166,70" fill="none" fill-opacity="1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="118" y1="70" x2="170" y2="70" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><circle cx="134" cy="170" r="4" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><circle class="bub" cx="134" cy="160" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-55px;animation-duration:2.2s;animation-delay:-0.00s"/><circle class="bub" cx="144" cy="153" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-55px;animation-duration:2.2s;animation-delay:-0.73s"/><circle class="bub" cx="154" cy="146" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-55px;animation-duration:2.2s;animation-delay:-1.47s"/><text x="144" y="205" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">Na₂CO₃ + acid</text><path d="M214,114.0 L214,158.0 Q214,180 236.0,180 L236.0,180 Q258,180 258,158.0 L258,114.0 Z" fill="#EAF6FB" opacity=".95" class=""/><path d="M214,70 L214,158.0 Q214,180 236.0,180 L236.0,180 Q258,180 258,158.0 L258,70" fill="none" fill-opacity="1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="210" y1="70" x2="262" y2="70" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M220,176 Q236,168 252,176" fill="#2B2B33" stroke="#2B2B33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="236" y="205" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">CuO + acid</text><path d="M306,114.0 L306,158.0 Q306,180 328.0,180 L328.0,180 Q350,180 350,158.0 L350,114.0 Z" fill="#F06BB0" opacity=".95" class=""/><path d="M306,70 L306,158.0 Q306,180 328.0,180 L328.0,180 Q350,180 350,158.0 L350,70" fill="none" fill-opacity="1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="302" y1="70" x2="354" y2="70" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path class="dr" d="M328,48.6 q4,6.4 0,8.8 q-4,-2.4 0,-8.8Z" fill="#0B93D4" style="--fall:30px;animation-duration:1.6s;animation-delay:0.00s"/><text x="328" y="205" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">NaOH + acid</text><text x="200" y="28" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle">Four reactions of dilute acids</text></svg>