<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 238" role="img"><title>Black copper oxide dissolving in hydrochloric acid to give a blue-green solution</title><style>.bub{animation:bub 2.2s linear infinite;transform-box:fill-box}@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--rise,-40px));opacity:0}}
.fl{animation:fl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.dr{animation:dr 1.6s ease-in infinite;transform-box:fill-box}@keyframes dr{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(var(--fall,30px));opacity:0}}
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gl{animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{from{opacity:.35}to{opacity:.9}}
.dft{animation:dft 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes dft{from{transform:translate(0,0)}to{transform:translate(var(--dx,6px),var(--dy,-6px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M120,116.0 L120,182 Q120,200 138,200 L262,200 Q280,200 280,182 L280,116.0 Z" fill="#EAF6FB" opacity=".95" class=""/><path d="M120,80 L120,182 Q120,200 138,200 L262,200 Q280,200 280,182 L280,80" fill="none" fill-opacity="1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="116" y1="80" x2="284" y2="80" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path class="gl" d="M121,100 L121,182 Q121,198 139,198 L261,198 Q279,198 279,182 L279,100Z" fill="#2FB5A8" opacity=".6"/><path d="M130,196 Q200,184 270,196" fill="#2B2B33" stroke="#2B2B33" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><line x1="235" y1="40" x2="205" y2="170" stroke="#8FA0B3" stroke-width="5" stroke-linecap="round" /><path class="dr" d="M160,48.6 q4,6.4 0,8.8 q-4,-2.4 0,-8.8Z" fill="#7DB8D8" style="--fall:40px;animation-duration:1.6s;animation-delay:0.00s"/><path class="dr" d="M175,48.6 q4,6.4 0,8.8 q-4,-2.4 0,-8.8Z" fill="#7DB8D8" style="--fall:40px;animation-duration:1.6s;animation-delay:-0.80s"/><text x="200" y="25" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">Black CuO powder + dilute HCl</text><text x="200" y="225" font-family="sans-serif" font-size="12" font-weight="700" fill="#1F7D74" text-anchor="middle">solution turns blue-green: CuCl₂ forms</text></svg>