<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 245" role="img"><title>Sour foods and plants: vinegar, tamarind, tomato, curd and a nettle leaf</title><style>.bub{animation:bub 2.2s linear infinite;transform-box:fill-box}@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--rise,-40px));opacity:0}}
.fl{animation:fl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.dr{animation:dr 1.6s ease-in infinite;transform-box:fill-box}@keyframes dr{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(var(--fall,30px));opacity:0}}
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gl{animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{from{opacity:.35}to{opacity:.9}}
.dft{animation:dft 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes dft{from{transform:translate(0,0)}to{transform:translate(var(--dx,6px),var(--dy,-6px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="35" y="50" width="50" height="70" rx="10" fill="#E8C97A" stroke="#2B2F4A" stroke-width="3" /><rect x="48" y="34" width="24" height="20" rx="4" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="60" y="142" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">Vinegar</text><path d="M130,100 Q160,60 210,80 Q180,115 130,100Z" fill="#A8743A" stroke="#6B4A22" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="170" y="142" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">Tamarind</text><circle cx="260" cy="85" r="28" fill="#E5484D" stroke="#2B2F4A" stroke-width="3" /><path d="M250,58 l10,8 l10,-8" fill="none" stroke="#2E7D32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="260" y="142" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">Tomato</text><path d="M310,100 Q310,140 350,140 Q390,140 390,100Z" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="350" y="162" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">Curd</text><path d="M55,200 Q85,170 130,190 Q100,225 55,200Z" fill="#6DBE45" stroke="#2E7D32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="95" y="235" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">Nettle leaf</text></svg>