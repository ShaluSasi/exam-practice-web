<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" role="img"><title>Lime water turns milky with a little CO2 and clear again with excess CO2</title><style>.bub{animation:bub 2.2s linear infinite;transform-box:fill-box}@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--rise,-40px));opacity:0}}
.fl{animation:fl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.dr{animation:dr 1.6s ease-in infinite;transform-box:fill-box}@keyframes dr{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(var(--fall,30px));opacity:0}}
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gl{animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{from{opacity:.35}to{opacity:.9}}
.dft{animation:dft 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes dft{from{transform:translate(0,0)}to{transform:translate(var(--dx,6px),var(--dy,-6px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M40,80.0 L40,125 Q40,150 65,150 L65,150 Q90,150 90,125 L90,80.0 Z" fill="#EAF6FB" opacity=".95" class=""/><path d="M40,50 L40,125 Q40,150 65,150 L65,150 Q90,150 90,125 L90,50" fill="none" fill-opacity="1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="36" y1="50" x2="94" y2="50" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="65" y="175" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">1. Lime water</text><text x="65" y="193" font-family="sans-serif" font-size="10" font-weight="700" fill="#555" text-anchor="middle">Ca(OH)₂ solution</text><path d="M170,80.0 L170,125 Q170,150 195,150 L195,150 Q220,150 220,125 L220,80.0 Z" fill="#FFFFFF" opacity=".95" class=""/><path d="M170,50 L170,125 Q170,150 195,150 L195,150 Q220,150 220,125 L220,50" fill="none" fill-opacity="1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="166" y1="50" x2="224" y2="50" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><circle cx="180" cy="100" r="3" fill="#E7E3DA" stroke="none" stroke-width="2" /><circle cx="187" cy="113" r="3" fill="#E7E3DA" stroke="none" stroke-width="2" /><circle cx="194" cy="126" r="3" fill="#E7E3DA" stroke="none" stroke-width="2" /><circle cx="201" cy="139" r="3" fill="#E7E3DA" stroke="none" stroke-width="2" /><circle cx="208" cy="112" r="3" fill="#E7E3DA" stroke="none" stroke-width="2" /><circle cx="183" cy="125" r="3" fill="#E7E3DA" stroke="none" stroke-width="2" /><circle cx="190" cy="138" r="3" fill="#E7E3DA" stroke="none" stroke-width="2" /><circle cx="197" cy="111" r="3" fill="#E7E3DA" stroke="none" stroke-width="2" /><text x="195" y="175" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">2. A little CO₂</text><text x="195" y="193" font-family="sans-serif" font-size="10" font-weight="700" fill="#555" text-anchor="middle">CaCO₃ (white ppt)</text><circle class="bub" cx="184" cy="130" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-45px;animation-duration:2.2s;animation-delay:-0.00s"/><circle class="bub" cx="195" cy="123" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-45px;animation-duration:2.2s;animation-delay:-0.73s"/><circle class="bub" cx="206" cy="116" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-45px;animation-duration:2.2s;animation-delay:-1.47s"/><path d="M300,80.0 L300,125 Q300,150 325,150 L325,150 Q350,150 350,125 L350,80.0 Z" fill="#EAF6FB" opacity=".95" class=""/><path d="M300,50 L300,125 Q300,150 325,150 L325,150 Q350,150 350,125 L350,50" fill="none" fill-opacity="1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="296" y1="50" x2="354" y2="50" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="325" y="175" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">3. Excess CO₂</text><text x="325" y="193" font-family="sans-serif" font-size="10" font-weight="700" fill="#555" text-anchor="middle">Ca(HCO₃)₂ (soluble)</text><circle class="bub" cx="314" cy="130" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-45px;animation-duration:2.2s;animation-delay:-0.00s"/><circle class="bub" cx="325" cy="123" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-45px;animation-duration:2.2s;animation-delay:-0.73s"/><circle class="bub" cx="336" cy="116" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-45px;animation-duration:2.2s;animation-delay:-1.47s"/><line x1="98" y1="100" x2="160" y2="100" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><path d="M152.1,104.3 L160,100 L152.1,95.7" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="228" y1="100" x2="290" y2="100" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><path d="M282.1,104.3 L290,100 L282.1,95.7" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>