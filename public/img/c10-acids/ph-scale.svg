<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 215" role="img"><title>The pH scale from 0 (red, strongly acidic) through 7 (green, neutral) to 14 (purple, strongly basic)</title><style>.bub{animation:bub 2.2s linear infinite;transform-box:fill-box}@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--rise,-40px));opacity:0}}
.fl{animation:fl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.dr{animation:dr 1.6s ease-in infinite;transform-box:fill-box}@keyframes dr{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(var(--fall,30px));opacity:0}}
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gl{animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{from{opacity:.35}to{opacity:.9}}
.dft{animation:dft 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes dft{from{transform:translate(0,0)}to{transform:translate(var(--dx,6px),var(--dy,-6px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="200" y="26" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle">The pH scale</text><rect x="20" y="100" width="24" height="44" rx="0" fill="#E5484D" stroke="#fff" stroke-width="1" /><text x="32" y="127" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">0</text><rect x="44" y="100" width="24" height="44" rx="0" fill="#EE5A3E" stroke="#fff" stroke-width="1" /><text x="56" y="127" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="68" y="100" width="24" height="44" rx="0" fill="#F5742F" stroke="#fff" stroke-width="1" /><text x="80" y="127" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="92" y="100" width="24" height="44" rx="0" fill="#F98F26" stroke="#fff" stroke-width="1" /><text x="104" y="127" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="116" y="100" width="24" height="44" rx="0" fill="#FBAA1E" stroke="#fff" stroke-width="1" /><text x="128" y="127" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text><rect x="140" y="100" width="24" height="44" rx="0" fill="#F7C531" stroke="#fff" stroke-width="1" /><text x="152" y="127" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">5</text><rect x="164" y="100" width="24" height="44" rx="0" fill="#E2D13B" stroke="#fff" stroke-width="1" /><text x="176" y="127" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">6</text><rect x="188" y="100" width="24" height="44" rx="0" fill="#7CC576" stroke="#fff" stroke-width="1" /><text x="200" y="127" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">7</text><rect x="212" y="100" width="24" height="44" rx="0" fill="#5BBE95" stroke="#fff" stroke-width="1" /><text x="224" y="127" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">8</text><rect x="236" y="100" width="24" height="44" rx="0" fill="#38B4B5" stroke="#fff" stroke-width="1" /><text x="248" y="127" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">9</text><rect x="260" y="100" width="24" height="44" rx="0" fill="#2E9FD0" stroke="#fff" stroke-width="1" /><text x="272" y="127" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">10</text><rect x="284" y="100" width="24" height="44" rx="0" fill="#3B7FE0" stroke="#fff" stroke-width="1" /><text x="296" y="127" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">11</text><rect x="308" y="100" width="24" height="44" rx="0" fill="#5568D8" stroke="#fff" stroke-width="1" /><text x="320" y="127" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">12</text><rect x="332" y="100" width="24" height="44" rx="0" fill="#6B52D1" stroke="#fff" stroke-width="1" /><text x="344" y="127" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">13</text><rect x="356" y="100" width="24" height="44" rx="0" fill="#7C3FC4" stroke="#fff" stroke-width="1" /><text x="368" y="127" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">14</text><rect x="20" y="100" width="360" height="44" rx="6" fill="none" stroke="#2B2F4A" stroke-width="3" /><line x1="195" y1="78" x2="40" y2="78" stroke="#E5484D" stroke-width="3" stroke-linecap="round" /><path d="M47.9,73.7 L40,78 L47.9,82.3" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="205" y1="78" x2="360" y2="78" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" /><path d="M352.1,82.3 L360,78 L352.1,73.7" fill="none" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="68" font-family="sans-serif" font-size="13" font-weight="700" fill="#E5484D" text-anchor="middle">acidic</text><text x="300" y="68" font-family="sans-serif" font-size="13" font-weight="700" fill="#0B93D4" text-anchor="middle">basic (alkaline)</text><g class="dft" style="--dx:140px;--dy:0px;animation-duration:4s"><path d="M52,164 l8,-14 l8,14Z" fill="#2B2F4A"/></g><text x="200" y="190" font-family="sans-serif" font-size="11" font-weight="700" fill="#555" text-anchor="middle">colours are only a rough guide</text></svg>