<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" role="img"><title>Red litmus paper dipped in three test tubes; in tube 2 it turns blue</title><style>.bub{animation:bub 2.2s linear infinite;transform-box:fill-box}@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--rise,-40px));opacity:0}}
.fl{animation:fl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.dr{animation:dr 1.6s ease-in infinite;transform-box:fill-box}@keyframes dr{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(var(--fall,30px));opacity:0}}
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gl{animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{from{opacity:.35}to{opacity:.9}}
.dft{animation:dft 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes dft{from{transform:translate(0,0)}to{transform:translate(var(--dx,6px),var(--dy,-6px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}.lit{animation:lit 4s ease-in-out infinite}@keyframes lit{0%,30%{fill:#E5484D}55%,100%{fill:#3B6FE0}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M70,130.0 L70,168 Q70,190 92,190 L92,190 Q114,190 114,168 L114,130.0 Z" fill="#DDEFFA" opacity=".95" class=""/><path d="M70,90 L70,168 Q70,190 92,190 L92,190 Q114,190 114,168 L114,90" fill="none" fill-opacity="1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="66" y1="90" x2="118" y2="90" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="92" y="215" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">Tube 1</text><rect x="86" y="48" width="12" height="62" rx="2" fill="#E5484D" stroke="#2B2F4A" stroke-width="2"/><path d="M180,130.0 L180,168 Q180,190 202,190 L202,190 Q224,190 224,168 L224,130.0 Z" fill="#DDEFFA" opacity=".95" class=""/><path d="M180,90 L180,168 Q180,190 202,190 L202,190 Q224,190 224,168 L224,90" fill="none" fill-opacity="1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="176" y1="90" x2="228" y2="90" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="202" y="215" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">Tube 2</text><rect x="196" y="48" width="12" height="62" rx="2" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" class="lit"/><path d="M290,130.0 L290,168 Q290,190 312,190 L312,190 Q334,190 334,168 L334,130.0 Z" fill="#DDEFFA" opacity=".95" class=""/><path d="M290,90 L290,168 Q290,190 312,190 L312,190 Q334,190 334,168 L334,90" fill="none" fill-opacity="1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="286" y1="90" x2="338" y2="90" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="312" y="215" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">Tube 3</text><rect x="306" y="48" width="12" height="62" rx="2" fill="#E5484D" stroke="#2B2F4A" stroke-width="2"/><text x="200" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">Red litmus paper dipped in each tube</text></svg>