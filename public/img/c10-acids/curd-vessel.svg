<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" role="img"><title>Sour curd kept in a brass vessel forms greenish metal salts</title><style>.bub{animation:bub 2.2s linear infinite;transform-box:fill-box}@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--rise,-40px));opacity:0}}
.fl{animation:fl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.dr{animation:dr 1.6s ease-in infinite;transform-box:fill-box}@keyframes dr{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(var(--fall,30px));opacity:0}}
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gl{animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{from{opacity:.35}to{opacity:.9}}
.dft{animation:dft 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes dft{from{transform:translate(0,0)}to{transform:translate(var(--dx,6px),var(--dy,-6px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M90,90 L310,90 Q300,170 200,175 Q100,170 90,90Z" fill="#D9A93B" stroke="#8B6B1E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M95,92 Q200,70 305,92 Q200,110 95,92Z" fill="#FFFFFF" stroke="#C9C2B0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="200" y="100" font-family="sans-serif" font-size="12" font-weight="700" fill="#6B6B6B" text-anchor="middle">curd (sour)</text><circle cx="120" cy="150" r="7" fill="#3FA3A0" stroke="#1F6D6A" stroke-width="2" class="gl" style="animation-delay:0.0s"/><circle cx="170" cy="162" r="7" fill="#3FA3A0" stroke="#1F6D6A" stroke-width="2" class="gl" style="animation-delay:-0.35s"/><circle cx="240" cy="160" r="7" fill="#3FA3A0" stroke="#1F6D6A" stroke-width="2" class="gl" style="animation-delay:-0.7s"/><circle cx="275" cy="145" r="7" fill="#3FA3A0" stroke="#1F6D6A" stroke-width="2" class="gl" style="animation-delay:-1.0499999999999998s"/><text x="200" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle">Brass / copper vessel</text><text x="200" y="52" font-family="sans-serif" font-size="12" font-weight="700" fill="#E5484D" text-anchor="middle">The acid attacks the metal</text><line x1="110" y1="62" x2="125" y2="88" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" /><path d="M117.3,83.3 L125,88 L124.8,79.0" fill="none" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="290" y1="62" x2="275" y2="88" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" /><path d="M275.2,79.0 L275,88 L282.7,83.3" fill="none" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="205" font-family="sans-serif" font-size="12" font-weight="700" fill="#1F6D6A" text-anchor="middle">green-blue patches: harmful metal salts form</text></svg>