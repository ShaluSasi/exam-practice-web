<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 248" role="img"><title>Concentrated acid is added slowly to water in a beaker while stirring; the mixture warms up</title><style>.bub{animation:bub 2.2s linear infinite;transform-box:fill-box}@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--rise,-40px));opacity:0}}
.fl{animation:fl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.dr{animation:dr 1.6s ease-in infinite;transform-box:fill-box}@keyframes dr{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(var(--fall,30px));opacity:0}}
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gl{animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{from{opacity:.35}to{opacity:.9}}
.dft{animation:dft 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes dft{from{transform:translate(0,0)}to{transform:translate(var(--dx,6px),var(--dy,-6px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M120,158.0 L120,201 Q120,215 134,215 L246,215 Q260,215 260,201 L260,158.0 Z" fill="#CDEFF7" opacity=".95" class=""/><path d="M120,120 L120,201 Q120,215 134,215 L246,215 Q260,215 260,201 L260,120" fill="none" fill-opacity="1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="116" y1="120" x2="264" y2="120" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="205" y1="75" x2="170" y2="180" stroke="#8FA0B3" stroke-width="6" stroke-linecap="round" /><g transform="rotate(35 300 50)"><rect x="274" y="36" width="52" height="28" rx="6" fill="#FFE9A8" stroke="#2B2F4A" stroke-width="3" /><rect x="266" y="43" width="10" height="14" rx="2" fill="#FFE9A8" stroke="#2B2F4A" stroke-width="3" /><text x="304" y="54" font-family="sans-serif" font-size="10" font-weight="700" fill="#2B2F4A" text-anchor="middle">acid</text></g><path class="dr" d="M262,71.6 q4,6.4 0,8.8 q-4,-2.4 0,-8.8Z" fill="#E8B923" style="--fall:62px;animation-duration:1.6s;animation-delay:0.00s"/><path class="dr" d="M264,71.6 q4,6.4 0,8.8 q-4,-2.4 0,-8.8Z" fill="#E8B923" style="--fall:62px;animation-duration:1.6s;animation-delay:-0.80s"/><path d="M150,108 q6,-8 0,-16 t0,-16" fill="none" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="dft" style="--dy:-8px;--dx:0px;animation-delay:0.0s"/><path d="M190,108 q6,-8 0,-16 t0,-16" fill="none" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="dft" style="--dy:-8px;--dx:0px;animation-delay:-0.5s"/><path d="M230,108 q6,-8 0,-16 t0,-16" fill="none" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="dft" style="--dy:-8px;--dx:0px;animation-delay:-1.0s"/><text x="80" y="90" font-family="sans-serif" font-size="12" font-weight="700" fill="#0B93D4" text-anchor="middle">stir</text><line x1="95" y1="95" x2="125" y2="125" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" /><path d="M116.4,122.5 L125,125 L122.5,116.4" fill="none" stroke="#0B93D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="195" y="237" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">Acid added slowly to water, with stirring</text></svg>