<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 245" role="img"><title>Electrolysis of brine: chlorine at the anode, hydrogen at the cathode, sodium hydroxide near the cathode</title><style>.bub{animation:bub 2.2s linear infinite;transform-box:fill-box}@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--rise,-40px));opacity:0}}
.fl{animation:fl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.dr{animation:dr 1.6s ease-in infinite;transform-box:fill-box}@keyframes dr{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(var(--fall,30px));opacity:0}}
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gl{animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{from{opacity:.35}to{opacity:.9}}
.dft{animation:dft 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes dft{from{transform:translate(0,0)}to{transform:translate(var(--dx,6px),var(--dy,-6px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M100,143.75 L100,199 Q100,215 116,215 L284,215 Q300,215 300,199 L300,143.75 Z" fill="#DDEFF7" opacity=".95" class=""/><path d="M100,120 L100,199 Q100,215 116,215 L284,215 Q300,215 300,199 L300,120" fill="none" fill-opacity="1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="96" y1="120" x2="304" y2="120" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><rect x="140" y="60" width="16" height="140" rx="3" fill="#4A4E63" stroke="#2B2F4A" stroke-width="2" /><rect x="244" y="60" width="16" height="140" rx="3" fill="#4A4E63" stroke="#2B2F4A" stroke-width="2" /><rect x="172" y="28" width="56" height="26" rx="5" fill="#FFD9A8" stroke="#2B2F4A" stroke-width="3" /><text x="185" y="45" font-family="sans-serif" font-size="15" font-weight="700" fill="#3FA34D" text-anchor="middle">+</text><text x="215" y="46" font-family="sans-serif" font-size="15" font-weight="700" fill="#E5484D" text-anchor="middle">−</text><path d="M148,60 L148,41 L172,41" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M252,60 L252,41 L228,41" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle class="bub" cx="118" cy="160" r="3" fill="#D6EE6B" stroke="#7A9A12" stroke-width="1.5" style="--rise:-50px;animation-duration:2.2s;animation-delay:-0.00s"/><circle class="bub" cx="128" cy="153" r="3" fill="#D6EE6B" stroke="#7A9A12" stroke-width="1.5" style="--rise:-50px;animation-duration:2.2s;animation-delay:-0.73s"/><circle class="bub" cx="168" cy="146" r="3" fill="#D6EE6B" stroke="#7A9A12" stroke-width="1.5" style="--rise:-50px;animation-duration:2.2s;animation-delay:-1.47s"/><circle class="bub" cx="232" cy="160" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-50px;animation-duration:2.2s;animation-delay:-0.00s"/><circle class="bub" cx="276" cy="153" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-50px;animation-duration:2.2s;animation-delay:-0.73s"/><circle class="bub" cx="284" cy="146" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-50px;animation-duration:2.2s;animation-delay:-1.47s"/><text x="120" y="100" font-family="sans-serif" font-size="13" font-weight="700" fill="#7A9A12" text-anchor="middle">Cl₂</text><text x="285" y="100" font-family="sans-serif" font-size="13" font-weight="700" fill="#0B93D4" text-anchor="middle">H₂</text><text x="200" y="236" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">brine (NaCl solution)</text><text x="282" y="196" font-family="sans-serif" font-size="11" font-weight="700" fill="#7C5CFF" text-anchor="middle">NaOH</text></svg>