<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Acid rain falling into a river and lowering its pH, making life difficult for fish</title><style>.bub{animation:bub 2.2s linear infinite;transform-box:fill-box}@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--rise,-40px));opacity:0}}
.fl{animation:fl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.dr{animation:dr 1.6s ease-in infinite;transform-box:fill-box}@keyframes dr{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(var(--fall,30px));opacity:0}}
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gl{animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{from{opacity:.35}to{opacity:.9}}
.dft{animation:dft 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes dft{from{transform:translate(0,0)}to{transform:translate(var(--dx,6px),var(--dy,-6px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M70,70 Q60,40 100,40 Q120,15 160,35 Q200,20 215,50 Q250,55 240,80 L80,80 Q60,82 70,70Z" fill="#C7CBD6" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="dr" d="M100,88.6 q4,6.4 0,8.8 q-4,-2.4 0,-8.8Z" fill="#9AC93C" style="--fall:60px;animation-duration:1.6s;animation-delay:0.00s"/><path class="dr" d="M130,88.6 q4,6.4 0,8.8 q-4,-2.4 0,-8.8Z" fill="#9AC93C" style="--fall:60px;animation-duration:1.6s;animation-delay:-0.32s"/><path class="dr" d="M160,88.6 q4,6.4 0,8.8 q-4,-2.4 0,-8.8Z" fill="#9AC93C" style="--fall:60px;animation-duration:1.6s;animation-delay:-0.64s"/><path class="dr" d="M190,88.6 q4,6.4 0,8.8 q-4,-2.4 0,-8.8Z" fill="#9AC93C" style="--fall:60px;animation-duration:1.6s;animation-delay:-0.96s"/><path class="dr" d="M215,88.6 q4,6.4 0,8.8 q-4,-2.4 0,-8.8Z" fill="#9AC93C" style="--fall:60px;animation-duration:1.6s;animation-delay:-1.28s"/><rect x="280" y="35" width="95" height="48" rx="8" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" /><text x="327" y="56" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">rain water</text><text x="327" y="75" font-family="sans-serif" font-size="14" font-weight="700" fill="#E5484D" text-anchor="middle">pH &lt; 5.6</text><path d="M10,170 Q100,150 200,170 T400,170 L400,240 L10,240Z" fill="#7FC4E8" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><g class="dft" style="--dx:30px;--dy:0px;animation-duration:3s"><path d="M120,205 q18,-14 40,0 q-22,14 -40,0Z M160,205 l12,-9 l0,18Z" fill="#FF9A3C" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /></g><circle cx="137" cy="203" r="2" fill="#2B2F4A" stroke="none" stroke-width="2" /><text x="300" y="215" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">river pH falls: fish struggle</text></svg>