<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 215" role="img"><title>HCl gas gives no ions on its own but forms hydronium and chloride ions in water</title><style>.bub{animation:bub 2.2s linear infinite;transform-box:fill-box}@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--rise,-40px));opacity:0}}
.fl{animation:fl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.dr{animation:dr 1.6s ease-in infinite;transform-box:fill-box}@keyframes dr{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(var(--fall,30px));opacity:0}}
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gl{animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{from{opacity:.35}to{opacity:.9}}
.dft{animation:dft 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes dft{from{transform:translate(0,0)}to{transform:translate(var(--dx,6px),var(--dy,-6px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="100" y="28" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">Dry HCl gas</text><text x="300" y="28" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">HCl in water</text><circle cx="70" cy="110" r="16" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" /><text x="70" y="114" font-family="sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">Cl</text><circle cx="104" cy="110" r="10" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><text x="104" y="114" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">H</text><line x1="86" y1="110" x2="96" y2="110" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="150" y1="110" x2="200" y2="110" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M192.1,114.3 L200,110 L192.1,105.7" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="175" y="98" font-family="sans-serif" font-size="11" font-weight="700" fill="#0B93D4" text-anchor="middle">H₂O</text><circle cx="250" cy="110" r="16" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" /><text x="250" y="114" font-family="sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">O</text><circle cx="232" cy="126" r="9" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><text x="232" y="130" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">H</text><circle cx="268" cy="126" r="9" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><text x="268" y="130" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">H</text><g class="dft" style="--dx:-16px;--dy:-2px"><circle cx="272" cy="90" r="10" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><text x="272" y="94" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">H</text></g><g class="dft" style="--dx:10px;--dy:6px"><circle cx="345" cy="110" r="17" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2" /><text x="345" y="114" font-family="sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Cl⁻</text></g><text x="250" y="176" font-family="sans-serif" font-size="12" font-weight="700" fill="#E5484D" text-anchor="middle">H₃O⁺ (hydronium)</text><text x="345" y="176" font-family="sans-serif" font-size="12" font-weight="700" fill="#3FA34D" text-anchor="middle">Cl⁻</text></svg>