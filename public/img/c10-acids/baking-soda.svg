<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 244" role="img"><title>Baking soda being heated in a test tube and giving off carbon dioxide and water vapour</title><style>.bub{animation:bub 2.2s linear infinite;transform-box:fill-box}@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--rise,-40px));opacity:0}}
.fl{animation:fl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.dr{animation:dr 1.6s ease-in infinite;transform-box:fill-box}@keyframes dr{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(var(--fall,30px));opacity:0}}
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gl{animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{from{opacity:.35}to{opacity:.9}}
.dft{animation:dft 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes dft{from{transform:translate(0,0)}to{transform:translate(var(--dx,6px),var(--dy,-6px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="10" y="213" width="380" height="10" rx="3" fill="#C9B28A" stroke="#8B6B3E" stroke-width="2" /><path d="M150,185 L150,160.0 Q150,185 175.0,185 L175.0,185 Q200,185 200,160.0 L200,185 Z" fill="#FFFFFF" opacity=".95" class=""/><path d="M150,70 L150,160.0 Q150,185 175.0,185 L175.0,185 Q200,185 200,160.0 L200,70" fill="none" fill-opacity="1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="146" y1="70" x2="204" y2="70" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M156,170 Q175,162 194,170 L194,176 Q194,181 175,181 Q156,181 156,176Z" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle class="bub" cx="165" cy="150" r="3" fill="#EAF6FB" stroke="#2B2F4A" stroke-width="1.5" style="--rise:-50px;animation-duration:2.2s;animation-delay:-0.00s"/><circle class="bub" cx="178" cy="143" r="3" fill="#EAF6FB" stroke="#2B2F4A" stroke-width="1.5" style="--rise:-50px;animation-duration:2.2s;animation-delay:-0.73s"/><circle class="bub" cx="190" cy="136" r="3" fill="#EAF6FB" stroke="#2B2F4A" stroke-width="1.5" style="--rise:-50px;animation-duration:2.2s;animation-delay:-1.47s"/><g class="fl"><path d="M175,206 q9.9,-14.3 0,-30.800000000000004 q-9.9,16.5 0,30.800000000000004Z" fill="#FF8A1F" stroke="#E5484D" stroke-width="1.5"/><path d="M175,206 q4.4,-6.6000000000000005 0,-15.400000000000002 q-4.4,8.8 0,15.400000000000002Z" fill="#FFE27A"/></g><text x="175" y="58" font-family="sans-serif" font-size="12" font-weight="700" fill="#E5484D" text-anchor="middle">heat</text><circle cx="212" cy="62" r="3" fill="#0B93D4" stroke="none" stroke-width="2" /><circle cx="220" cy="72" r="3" fill="#0B93D4" stroke="none" stroke-width="2" /><text x="310" y="95" font-family="sans-serif" font-size="11" font-weight="700" fill="#7C5CFF" text-anchor="middle">2NaHCO₃ → Na₂CO₃ + H₂O + CO₂</text><text x="310" y="125" font-family="sans-serif" font-size="12" font-weight="700" fill="#3FA34D" text-anchor="middle">CO₂ bubbles out</text><text x="310" y="150" font-family="sans-serif" font-size="11" font-weight="700" fill="#0B93D4" text-anchor="middle">water vapour at the mouth</text><text x="175" y="236" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">baking soda (white powder)</text></svg>