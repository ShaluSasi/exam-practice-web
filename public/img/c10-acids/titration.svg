<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 262" role="img"><title>Burette of dilute HCl above a flask of NaOH with phenolphthalein</title><style>.bub{animation:bub 2.2s linear infinite;transform-box:fill-box}@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--rise,-40px));opacity:0}}
.fl{animation:fl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.dr{animation:dr 1.6s ease-in infinite;transform-box:fill-box}@keyframes dr{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(var(--fall,30px));opacity:0}}
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gl{animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{from{opacity:.35}to{opacity:.9}}
.dft{animation:dft 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes dft{from{transform:translate(0,0)}to{transform:translate(var(--dx,6px),var(--dy,-6px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="188" y="16" width="24" height="110" rx="4" fill="#EAF6FB" stroke="#2B2F4A" stroke-width="3" /><rect x="190" y="50" width="20" height="74" rx="0" fill="#DDEFFA" stroke="none" stroke-width="0" /><line x1="188" y1="126" x2="212" y2="126" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="200" y1="126" x2="200" y2="142" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><rect x="194" y="134" width="12" height="10" rx="2" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" /><path class="dr" d="M200,143.6 q4,6.4 0,8.8 q-4,-2.4 0,-8.8Z" fill="#0B93D4" style="--fall:36px;animation-duration:1.6s;animation-delay:0.00s"/><path d="M188,172 L188,198 L152,246 Q148,254 158,254 L242,254 Q252,254 248,246 L212,198 L212,172" fill="#EAF6FB" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M168,226 L232,226 L248,246 Q252,254 242,254 L158,254 Q148,254 152,246Z" fill="#F06BB0"/><text x="95" y="60" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">burette: HCl</text><text x="95" y="76" font-family="sans-serif" font-size="11" font-weight="700" fill="#555" text-anchor="middle">(8 mL used)</text><text x="300" y="226" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">flask: 10 mL NaOH</text><text x="300" y="242" font-family="sans-serif" font-size="11" font-weight="700" fill="#555" text-anchor="middle">+ phenolphthalein</text></svg>