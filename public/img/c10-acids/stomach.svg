<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A stomach with excess hydrochloric acid being neutralised by an antacid containing magnesium hydroxide</title><style>.bub{animation:bub 2.2s linear infinite;transform-box:fill-box}@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--rise,-40px));opacity:0}}
.fl{animation:fl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.dr{animation:dr 1.6s ease-in infinite;transform-box:fill-box}@keyframes dr{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(var(--fall,30px));opacity:0}}
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gl{animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{from{opacity:.35}to{opacity:.9}}
.dft{animation:dft 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes dft{from{transform:translate(0,0)}to{transform:translate(var(--dx,6px),var(--dy,-6px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M130,60 Q120,30 160,30 Q200,30 215,70 Q280,60 320,110 Q340,170 270,190 Q200,205 160,170 Q120,150 130,60Z" fill="#FFB5A0" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path class="dr" d="M180,73.6 q4,6.4 0,8.8 q-4,-2.4 0,-8.8Z" fill="#E5484D" style="--fall:50px;animation-duration:1.6s;animation-delay:0.00s"/><path class="dr" d="M215,73.6 q4,6.4 0,8.8 q-4,-2.4 0,-8.8Z" fill="#E5484D" style="--fall:50px;animation-duration:1.6s;animation-delay:-0.53s"/><path class="dr" d="M250,73.6 q4,6.4 0,8.8 q-4,-2.4 0,-8.8Z" fill="#E5484D" style="--fall:50px;animation-duration:1.6s;animation-delay:-1.07s"/><text x="175" y="100" font-family="sans-serif" font-size="13" font-weight="700" fill="#E5484D" text-anchor="middle">HCl</text><rect x="40" y="95" width="70" height="36" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="75" y="110" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">antacid</text><text x="75" y="124" font-family="sans-serif" font-size="11" font-weight="700" fill="#7C5CFF" text-anchor="middle">Mg(OH)₂</text><line x1="115" y1="113" x2="168" y2="120" stroke="#3FA34D" stroke-width="3" stroke-linecap="round" /><path d="M159.6,123.2 L168,120 L160.7,114.7" fill="none" stroke="#3FA34D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="240" y="150" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">excess acid</text><text x="200" y="225" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">A base neutralises the excess acid</text></svg>