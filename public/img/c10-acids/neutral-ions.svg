<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 185" role="img"><title>Hydrogen ion and hydroxide ion combining to form a water molecule</title><style>.bub{animation:bub 2.2s linear infinite;transform-box:fill-box}@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--rise,-40px));opacity:0}}
.fl{animation:fl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.dr{animation:dr 1.6s ease-in infinite;transform-box:fill-box}@keyframes dr{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(var(--fall,30px));opacity:0}}
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gl{animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{from{opacity:.35}to{opacity:.9}}
.dft{animation:dft 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes dft{from{transform:translate(0,0)}to{transform:translate(var(--dx,6px),var(--dy,-6px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><circle cx="60" cy="90" r="18" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" /><text x="60" y="94" font-family="sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">H⁺</text><text x="95" y="95" font-family="sans-serif" font-size="20" font-weight="700" fill="#2B2F4A" text-anchor="middle">+</text><circle cx="140" cy="90" r="20" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" /><text x="140" y="94" font-family="sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">OH⁻</text><line x1="180" y1="90" x2="240" y2="90" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M232.1,94.3 L240,90 L232.1,85.7" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="300" cy="90" r="16" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2" /><text x="300" y="94" font-family="sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">O</text><circle cx="284" cy="106" r="9" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><text x="284" y="110" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">H</text><circle cx="316" cy="106" r="9" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><text x="316" y="110" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">H</text><g class="dft" style="--dx:30px;--dy:0px"><circle cx="60" cy="150" r="0"/></g><text x="100" y="160" font-family="sans-serif" font-size="14" font-weight="700" fill="#7C5CFF" text-anchor="middle">H⁺(aq) + OH⁻(aq) → H₂O(l)</text><text x="300" y="150" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">water</text></svg>