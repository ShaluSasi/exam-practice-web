<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" role="img"><title>Four dropper bottles of indicators: litmus, phenolphthalein, methyl orange and turmeric</title><style>.bub{animation:bub 2.2s linear infinite;transform-box:fill-box}@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--rise,-40px));opacity:0}}
.fl{animation:fl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.dr{animation:dr 1.6s ease-in infinite;transform-box:fill-box}@keyframes dr{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(var(--fall,30px));opacity:0}}
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gl{animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{from{opacity:.35}to{opacity:.9}}
.dft{animation:dft 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes dft{from{transform:translate(0,0)}to{transform:translate(var(--dx,6px),var(--dy,-6px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="30" y="70" width="50" height="70" rx="10" fill="#B79CE6" stroke="#2B2F4A" stroke-width="3" /><rect x="45" y="52" width="20" height="20" rx="4" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><path d="M55,52 l0,-18" fill="none" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="55" cy="30" r="6" fill="#2B2F4A" stroke="none" stroke-width="2" /><text x="55" y="162" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">Litmus</text><rect x="125" y="70" width="50" height="70" rx="10" fill="#F6F1E4" stroke="#2B2F4A" stroke-width="3" /><rect x="140" y="52" width="20" height="20" rx="4" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><path d="M150,52 l0,-18" fill="none" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="150" cy="30" r="6" fill="#2B2F4A" stroke="none" stroke-width="2" /><text x="150" y="162" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">Phenolphthalein</text><rect x="220" y="70" width="50" height="70" rx="10" fill="#F2A33A" stroke="#2B2F4A" stroke-width="3" /><rect x="235" y="52" width="20" height="20" rx="4" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><path d="M245,52 l0,-18" fill="none" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="245" cy="30" r="6" fill="#2B2F4A" stroke="none" stroke-width="2" /><text x="245" y="162" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">Methyl orange</text><rect x="315" y="70" width="50" height="70" rx="10" fill="#F7C531" stroke="#2B2F4A" stroke-width="3" /><rect x="330" y="52" width="20" height="20" rx="4" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><path d="M340,52 l0,-18" fill="none" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="340" cy="30" r="6" fill="#2B2F4A" stroke="none" stroke-width="2" /><text x="340" y="162" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">Turmeric</text><text x="200" y="20" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">Indicators on the laboratory shelf</text></svg>