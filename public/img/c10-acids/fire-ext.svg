<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 245" role="img"><title>A wash-bottle soda-acid fire extinguisher: acid in an ignition tube mixes with sodium hydrogencarbonate and CO2 is directed on a candle flame</title><style>.bub{animation:bub 2.2s linear infinite;transform-box:fill-box}@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--rise,-40px));opacity:0}}
.fl{animation:fl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.dr{animation:dr 1.6s ease-in infinite;transform-box:fill-box}@keyframes dr{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(var(--fall,30px));opacity:0}}
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gl{animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{from{opacity:.35}to{opacity:.9}}
.dft{animation:dft 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes dft{from{transform:translate(0,0)}to{transform:translate(var(--dx,6px),var(--dy,-6px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="172" y="56" width="36" height="16" rx="3" fill="#C9955B" stroke="#8B5A2B" stroke-width="2" /><path d="M178,72 L178,100 Q120,100 120,150 L120,200 Q120,215 135,215 L245,215 Q260,215 260,200 L260,150 Q260,100 202,100 L202,72" fill="#EAF6FB" fill-opacity=".5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M121,165 L121,200 Q121,214 135,214 L245,214 Q259,214 259,200 L259,165Z" fill="#DFF1FA"/><circle class="bub" cx="160" cy="200" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-25px;animation-duration:2.2s;animation-delay:-0.00s"/><circle class="bub" cx="200" cy="193" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-25px;animation-duration:2.2s;animation-delay:-0.73s"/><circle class="bub" cx="230" cy="186" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-25px;animation-duration:2.2s;animation-delay:-1.47s"/><line x1="190" y1="72" x2="190" y2="112" stroke="#6B6B6B" stroke-width="1.5" stroke-linecap="round" /><rect x="178" y="112" width="26" height="48" rx="6" fill="#FFE9A8" stroke="#2B2F4A" stroke-width="3" /><path d="M204,64 L300,64 L325,92" fill="none" stroke="#2B2F4A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M204,64 L300,64 L325,92" fill="none" stroke="#CFE9F7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="340" y="150" width="14" height="50" rx="3" fill="#F2E7D0" stroke="#B9A06A" stroke-width="2" /><g class="fl"><path d="M347,148 q9,-13 0,-28 q-9,15 0,28Z" fill="#FF8A1F" stroke="#E5484D" stroke-width="1.5"/><path d="M347,148 q4,-6 0,-14 q-4,8 0,14Z" fill="#FFE27A"/></g><path d="M326,96 q6,10 4,20 q4,10 10,18" fill="none" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="gl"/><path d="M332,94 q8,10 6,20 q4,8 8,16" fill="none" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="gl"/><text x="190" y="236" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">NaHCO₃ solution</text><text x="347" y="222" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">candle</text><text x="80" y="130" font-family="sans-serif" font-size="11" font-weight="400" fill="#2B2F4A" text-anchor="middle">ignition tube</text><text x="80" y="144" font-family="sans-serif" font-size="11" font-weight="400" fill="#2B2F4A" text-anchor="middle">with dil. H₂SO₄</text></svg>