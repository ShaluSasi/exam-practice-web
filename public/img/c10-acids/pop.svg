<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 235" role="img"><title>Gypsum loses water on heating to give Plaster of Paris; adding water turns it back into hard gypsum</title><style>.bub{animation:bub 2.2s linear infinite;transform-box:fill-box}@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--rise,-40px));opacity:0}}
.fl{animation:fl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.dr{animation:dr 1.6s ease-in infinite;transform-box:fill-box}@keyframes dr{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(var(--fall,30px));opacity:0}}
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gl{animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{from{opacity:.35}to{opacity:.9}}
.dft{animation:dft 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes dft{from{transform:translate(0,0)}to{transform:translate(var(--dx,6px),var(--dy,-6px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="60" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">Gypsum</text><text x="200" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">Plaster of Paris</text><text x="335" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">Set cast</text><path d="M25,120 Q25,80 60,80 Q95,80 95,120Z" fill="#FFFFFF" stroke="#9AA0B5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="60" y="145" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">CaSO₄·2H₂O</text><line x1="105" y1="100" x2="150" y2="100" stroke="#E5484D" stroke-width="3" stroke-linecap="round" /><path d="M142.1,104.3 L150,100 L142.1,95.7" fill="none" stroke="#E5484D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="128" y="88" font-family="sans-serif" font-size="11" font-weight="700" fill="#E5484D" text-anchor="middle">373 K</text><g class="fl"><path d="M128,128 q8.1,-11.700000000000001 0,-25.2 q-8.1,13.5 0,25.2Z" fill="#FF8A1F" stroke="#E5484D" stroke-width="1.5"/><path d="M128,128 q3.6,-5.4 0,-12.6 q-3.6,7.2 0,12.6Z" fill="#FFE27A"/></g><path d="M160,120 Q160,95 200,95 Q240,95 240,120Z" fill="#F4F4F4" stroke="#9AA0B5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="200" y="145" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">CaSO₄·½H₂O</text><line x1="250" y1="100" x2="290" y2="100" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" /><path d="M282.1,104.3 L290,100 L282.1,95.7" fill="none" stroke="#0B93D4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="270" y="88" font-family="sans-serif" font-size="11" font-weight="700" fill="#0B93D4" text-anchor="middle">+ water</text><rect x="300" y="85" width="70" height="30" rx="12" fill="#FFFFFF" stroke="#9AA0B5" stroke-width="3" /><rect x="310" y="92" width="50" height="16" rx="8" fill="#F4D7BF" stroke="#C9955B" stroke-width="2" /><rect x="300" y="85" width="70" height="30" rx="12" fill="none" stroke="#9AA0B5" stroke-width="3" /><text x="335" y="145" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">hard mass: gypsum</text><text x="200" y="200" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">Hemihydrate means half a water molecule per CaSO₄</text><text x="200" y="220" font-family="sans-serif" font-size="11" font-weight="700" fill="#555" text-anchor="middle">(shared by two formula units)</text><path class="dr" d="M270,55.2 q3,4.800000000000001 0,6.6000000000000005 q-3,-1.7999999999999998 0,-6.6000000000000005Z" fill="#0B93D4" style="--fall:14px;animation-duration:1.6s;animation-delay:0.00s"/></svg>