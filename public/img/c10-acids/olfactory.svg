<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" role="img"><title>Onion-scented cloth strips: smell stays with acid and is lost with base</title><style>.bub{animation:bub 2.2s linear infinite;transform-box:fill-box}@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--rise,-40px));opacity:0}}
.fl{animation:fl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.dr{animation:dr 1.6s ease-in infinite;transform-box:fill-box}@keyframes dr{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(var(--fall,30px));opacity:0}}
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gl{animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{from{opacity:.35}to{opacity:.9}}
.dft{animation:dft 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes dft{from{transform:translate(0,0)}to{transform:translate(var(--dx,6px),var(--dy,-6px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="60" y="110" width="100" height="56" rx="6" fill="#F4E9D0" stroke="#B9A06A" stroke-width="3" /><text x="110" y="142" font-family="sans-serif" font-size="12" font-weight="700" fill="#7A6730" text-anchor="middle">onion cloth</text><text x="110" y="190" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">Onion strip + dilute HCl</text><path d="M80,100 q8,-10 0,-20 t0,-20" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="dft" style="--dx:0px;--dy:-8px"/><path d="M110,100 q8,-10 0,-20 t0,-20" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="dft" style="--dx:0px;--dy:-8px"/><path d="M140,100 q8,-10 0,-20 t0,-20" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="dft" style="--dx:0px;--dy:-8px"/><rect x="250" y="110" width="100" height="56" rx="6" fill="#F4E9D0" stroke="#B9A06A" stroke-width="3" /><text x="300" y="142" font-family="sans-serif" font-size="12" font-weight="700" fill="#7A6730" text-anchor="middle">onion cloth</text><text x="300" y="190" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">Onion strip + dilute NaOH</text><path d="M270,100 q8,-10 0,-20 t0,-20" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="gl"/><path d="M300,100 q8,-10 0,-20 t0,-20" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="gl"/><path d="M330,100 q8,-10 0,-20 t0,-20" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="gl"/><text x="110" y="30" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">?</text><text x="300" y="30" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">?</text></svg>