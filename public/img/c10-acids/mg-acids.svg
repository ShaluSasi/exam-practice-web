<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" role="img"><title>Magnesium ribbon in hydrochloric acid (many bubbles) and in acetic acid (few bubbles)</title><style>.bub{animation:bub 2.2s linear infinite;transform-box:fill-box}@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--rise,-40px));opacity:0}}
.fl{animation:fl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.dr{animation:dr 1.6s ease-in infinite;transform-box:fill-box}@keyframes dr{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(var(--fall,30px));opacity:0}}
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gl{animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{from{opacity:.35}to{opacity:.9}}
.dft{animation:dft 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes dft{from{transform:translate(0,0)}to{transform:translate(var(--dx,6px),var(--dy,-6px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M70,96.0 L70,152.0 Q70,180 98.0,180 L98.0,180 Q126,180 126,152.0 L126,96.0 Z" fill="#DDEFFA" opacity=".95" class=""/><path d="M70,60 L70,152.0 Q70,180 98.0,180 L98.0,180 Q126,180 126,152.0 L126,60" fill="none" fill-opacity="1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="66" y1="60" x2="130" y2="60" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><rect x="82" y="150" width="32" height="6" rx="2" fill="#B8BCC8" stroke="#6B6F82" stroke-width="2" /><circle class="bub" cx="82" cy="145" r="3.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-70px;animation-duration:1.2s;animation-delay:-0.00s"/><circle class="bub" cx="91" cy="138" r="3.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-70px;animation-duration:1.2s;animation-delay:-0.13s"/><circle class="bub" cx="100" cy="131" r="3.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-70px;animation-duration:1.2s;animation-delay:-0.27s"/><circle class="bub" cx="109" cy="145" r="3.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-70px;animation-duration:1.2s;animation-delay:-0.40s"/><circle class="bub" cx="84" cy="138" r="3.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-70px;animation-duration:1.2s;animation-delay:-0.53s"/><circle class="bub" cx="93" cy="131" r="3.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-70px;animation-duration:1.2s;animation-delay:-0.67s"/><circle class="bub" cx="102" cy="145" r="3.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-70px;animation-duration:1.2s;animation-delay:-0.80s"/><circle class="bub" cx="111" cy="138" r="3.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-70px;animation-duration:1.2s;animation-delay:-0.93s"/><circle class="bub" cx="86" cy="131" r="3.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-70px;animation-duration:1.2s;animation-delay:-1.07s"/><text x="98" y="205" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">A: HCl + Mg</text><path d="M250,96.0 L250,152.0 Q250,180 278.0,180 L278.0,180 Q306,180 306,152.0 L306,96.0 Z" fill="#DDEFFA" opacity=".95" class=""/><path d="M250,60 L250,152.0 Q250,180 278.0,180 L278.0,180 Q306,180 306,152.0 L306,60" fill="none" fill-opacity="1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="246" y1="60" x2="310" y2="60" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><rect x="262" y="150" width="32" height="6" rx="2" fill="#B8BCC8" stroke="#6B6F82" stroke-width="2" /><circle class="bub" cx="262" cy="145" r="4.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-70px;animation-duration:3.2s;animation-delay:-0.00s"/><circle class="bub" cx="271" cy="138" r="4.5" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-70px;animation-duration:3.2s;animation-delay:-1.60s"/><text x="278" y="205" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">B: CH₃COOH + Mg</text><text x="200" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">Same amount and concentration of each acid</text></svg>