<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 164" role="img"><title>Acid dumped in quickly</title><style>.bub{animation:bub 2.2s linear infinite;transform-box:fill-box}@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--rise,-40px));opacity:0}}
.fl{animation:fl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.dr{animation:dr 1.6s ease-in infinite;transform-box:fill-box}@keyframes dr{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(var(--fall,30px));opacity:0}}
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gl{animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{from{opacity:.35}to{opacity:.9}}
.dft{animation:dft 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes dft{from{transform:translate(0,0)}to{transform:translate(var(--dx,6px),var(--dy,-6px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M60,104.0 L60,128 Q60,140 72,140 L128,140 Q140,140 140,128 L140,104.0 Z" fill="#CDEFF7" opacity=".95" class=""/><path d="M60,80 L60,128 Q60,140 72,140 L128,140 Q140,140 140,128 L140,80" fill="none" fill-opacity="1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="56" y1="80" x2="144" y2="80" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><g transform="rotate(30 158 34)"><rect x="132" y="20" width="52" height="28" rx="6" fill="#FFE9A8" stroke="#2B2F4A" stroke-width="3" /><rect x="124" y="27" width="10" height="14" rx="2" fill="#FFE9A8" stroke="#2B2F4A" stroke-width="3" /><text x="162" y="38" font-family="sans-serif" font-size="10" font-weight="700" fill="#2B2F4A" text-anchor="middle">acid</text></g><path class="dr" d="M128,49.6 q4,6.4 0,8.8 q-4,-2.4 0,-8.8Z" fill="#E8B923" style="--fall:24px;animation-duration:1.6s;animation-delay:0.00s"/><path d="M64,76 q-12,-14 -4,-24" fill="none" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M136,76 q12,-14 4,-24" fill="none" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><text x="100" y="70" font-family="sans-serif" font-size="10" font-weight="700" fill="#E5484D" text-anchor="middle">splash!</text><text x="100" y="157" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">Acid dumped in quickly</text></svg>