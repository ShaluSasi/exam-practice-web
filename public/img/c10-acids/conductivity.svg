2" /><line x1="170" y1="134" x2="170" y2="200" stroke="#8F95A8" stroke-width="6" stroke-linecap="round" /><line x1="230" y1="134" x2="230" y2="200" stroke="#8F95A8" stroke-width="6" stroke-linecap="round" /><text x="188" y="182" font-family="sans-serif" font-size="11" font-weight="700" fill="#E5484D" text-anchor="middle">H⁺</text><text x="205" y="205" font-family="sans-serif" font-size="11" font-weight="700" fill="#0B93D4" text-anchor="middle">Cl⁻</text><text x="214" y="176" font-family="sans-serif" font-size="11" font-weight="700" fill="#E5484D" text-anchor="middle">H⁺</text><text x="188" y="207" font-family="sans-serif" font-size="11" font-weight="700" fill="#0B93D4" text-anchor="middle">Cl⁻</text><text x="60" y="175" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">battery</text><text x="108" y="32" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">switch (closed)</text><text x="310" y="92" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">bulb</text><text x="200" y="234" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">dilute HCl</text></svg>