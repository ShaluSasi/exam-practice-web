<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 238" role="img"><title>Fresh milk, a spoon of baking soda and a bowl of curd</title><style>.bub{animation:bub 2.2s linear infinite;transform-box:fill-box}@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--rise,-40px));opacity:0}}
.fl{animation:fl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.dr{animation:dr 1.6s ease-in infinite;transform-box:fill-box}@keyframes dr{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(var(--fall,30px));opacity:0}}
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gl{animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{from{opacity:.35}to{opacity:.9}}
.dft{animation:dft 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes dft{from{transform:translate(0,0)}to{transform:translate(var(--dx,6px),var(--dy,-6px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M70,60 L110,60 L115,90 Q130,100 130,130 L130,190 Q130,200 120,200 L60,200 Q50,200 50,190 L50,130 Q50,100 65,90Z" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="90" y="150" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">milk</text><text x="90" y="222" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">pH 6</text><rect x="165" y="100" width="56" height="44" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="193" y="120" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">baking</text><text x="193" y="134" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">soda</text><line x1="170" y1="95" x2="125" y2="80" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" /><path d="M133.9,78.4 L125,80 L131.1,86.6" fill="none" stroke="#0B93D4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path class="dr" d="M128,95.2 q3,4.800000000000001 0,6.6000000000000005 q-3,-1.7999999999999998 0,-6.6000000000000005Z" fill="#C9C2B0" style="--fall:20px;animation-duration:1.6s;animation-delay:0.00s"/><path d="M250,150 Q250,200 310,200 Q370,200 370,150Z" fill="#FFF8E1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="310" y="176" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">curd</text><text x="310" y="222" font-family="sans-serif" font-size="12" font-weight="700" fill="#E5484D" text-anchor="middle">pH below 6</text><line x1="230" y1="140" x2="260" y2="140" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M252.1,144.3 L260,140 L252.1,135.7" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>