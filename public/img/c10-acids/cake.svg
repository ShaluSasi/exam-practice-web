<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>A cake rising as carbon dioxide bubbles form from baking powder</title><style>.bub{animation:bub 2.2s linear infinite;transform-box:fill-box}@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--rise,-40px));opacity:0}}
.fl{animation:fl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.dr{animation:dr 1.6s ease-in infinite;transform-box:fill-box}@keyframes dr{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(var(--fall,30px));opacity:0}}
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gl{animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{from{opacity:.35}to{opacity:.9}}
.dft{animation:dft 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes dft{from{transform:translate(0,0)}to{transform:translate(var(--dx,6px),var(--dy,-6px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}.rs{animation:rs 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes rs{from{transform:scaleY(.75)}to{transform:scaleY(1.05)}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="80" y="150" width="240" height="50" rx="8" fill="#B9A06A" stroke="#7A6730" stroke-width="3" /><g class="rs"><path d="M90,150 Q200,70 310,150Z" fill="#F2C97D" stroke="#B9833A" stroke-width="3"/></g><circle cx="150" cy="135" r="4" fill="#fff" stroke="#B9833A" stroke-width="1.5" class="pu"/><circle cx="190" cy="125" r="4" fill="#fff" stroke="#B9833A" stroke-width="1.5" class="pu"/><circle cx="230" cy="132" r="4" fill="#fff" stroke="#B9833A" stroke-width="1.5" class="pu"/><circle cx="260" cy="142" r="4" fill="#fff" stroke="#B9833A" stroke-width="1.5" class="pu"/><circle cx="200" cy="145" r="4" fill="#fff" stroke="#B9833A" stroke-width="1.5" class="pu"/><circle class="bub" cx="140" cy="160" r="3" fill="#FFF3D6" stroke="#B9833A" stroke-width="1.5" style="--rise:-30px;animation-duration:2.2s;animation-delay:-0.00s"/><circle class="bub" cx="200" cy="153" r="3" fill="#FFF3D6" stroke="#B9833A" stroke-width="1.5" style="--rise:-30px;animation-duration:2.2s;animation-delay:-0.73s"/><circle class="bub" cx="260" cy="146" r="3" fill="#FFF3D6" stroke="#B9833A" stroke-width="1.5" style="--rise:-30px;animation-duration:2.2s;animation-delay:-1.47s"/><text x="200" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle">Cake batter with baking powder</text><text x="200" y="225" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">CO₂ bubbles make the cake rise: soft and spongy</text></svg>