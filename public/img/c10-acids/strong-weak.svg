#0B93D4" text-anchor="middle">Cl⁻</text><text x="100" y="195" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">1 M HCl</text><circle cx="290" cy="38" r="16" fill="#F4F0DC" stroke="#2B2F4A" stroke-width="3" /><line x1="290" y1="54" x2="290" y2="72" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M230,107.0 L230,158 Q230,170 242,170 L338,170 Q350,170 350,158 L350,107.0 Z" fill="#DFF1FA" opacity=".95" class=""/><path d="M230,80 L230,158 Q230,170 242,170 L338,170 Q350,170 350,158 L350,80" fill="none" fill-opacity="1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="226" y1="80" x2="354" y2="80" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="264" y="112" font-family="sans-serif" font-size="11" font-weight="700" fill="#E5484D" text-anchor="middle">H⁺</text><text x="310" y="152" font-family="sans-serif" font-size="11" font-weight="700" fill="#0B93D4" text-anchor="middle">A⁻</text><text x="250" y="134" font-family="sans-serif" font-size="11" font-weight="700" fill="#777" text-anchor="middle">HA</text><text x="286" y="126" font-family="sans-serif" font-size="11" font-weight="700" fill="#777" text-anchor="middle">HA</text><text x="328" y="112" font-family="sans-serif" font-size="11" font-weight="700" fill="#777" text-anchor="middle">HA</text><text x="334" y="136" font-family="sans-serif" font-size="11" font-weight="700" fill="#777" text-anchor="middle">HA</text><text x="270" y="154" font-family="sans-serif" font-size="11" font-weight="700" fill="#777" text-anchor="middle">HA</text><text x="296" y="108" font-family="sans-serif" font-size="11" font-weight="700" fill="#777" text-anchor="middle">HA</text><text x="290" y="195" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">1 M CH₃COOH</text></svg>