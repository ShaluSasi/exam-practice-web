<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" role="img"><title>Sample P</title><style>.bub{animation:bub 2.2s linear infinite;transform-box:fill-box}@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--rise,-40px));opacity:0}}
.fl{animation:fl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.dr{animation:dr 1.6s ease-in infinite;transform-box:fill-box}@keyframes dr{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(var(--fall,30px));opacity:0}}
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gl{animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{from{opacity:.35}to{opacity:.9}}
.dft{animation:dft 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes dft{from{transform:translate(0,0)}to{transform:translate(var(--dx,6px),var(--dy,-6px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><path d="M56,110 l12,-16 l16,4 l4,16 l-16,12Z" fill="#2E7DD7" stroke="#1F4F8F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M86,100 l12,-16 l16,4 l4,16 l-16,12Z" fill="#2E7DD7" stroke="#1F4F8F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M116,112 l12,-16 l16,4 l4,16 l-16,12Z" fill="#2E7DD7" stroke="#1F4F8F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M71,85 l12,-16 l16,4 l4,16 l-16,12Z" fill="#2E7DD7" stroke="#1F4F8F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M101,78 l12,-16 l16,4 l4,16 l-16,12Z" fill="#2E7DD7" stroke="#1F4F8F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M86,125 l12,-16 l16,4 l4,16 l-16,12Z" fill="#2E7DD7" stroke="#1F4F8F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><text x="100" y="150" font-family="sans-serif" font-size="13" font-weight="700" fill="#2B2F4A" text-anchor="middle">Sample P</text></svg>