<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 235" role="img"><title>A bee sting and a nettle sting inject acid; baking soda and a dock leaf give relief</title><style>.bub{animation:bub 2.2s linear infinite;transform-box:fill-box}@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--rise,-40px));opacity:0}}
.fl{animation:fl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.dr{animation:dr 1.6s ease-in infinite;transform-box:fill-box}@keyframes dr{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(var(--fall,30px));opacity:0}}
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gl{animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{from{opacity:.35}to{opacity:.9}}
.dft{animation:dft 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes dft{from{transform:translate(0,0)}to{transform:translate(var(--dx,6px),var(--dy,-6px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="100" y="24" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle">Bee sting</text><text x="300" y="24" font-family="sans-serif" font-size="14" font-weight="700" fill="#2B2F4A" text-anchor="middle">Nettle sting</text><ellipse cx="90" cy="90" rx="30" ry="20" fill="#F7C531" stroke="#2B2F4A" stroke-width="3"/><line x1="80" y1="72" x2="80" y2="108" stroke="#2B2F4A" stroke-width="6" stroke-linecap="round" /><line x1="95" y1="72" x2="95" y2="108" stroke="#2B2F4A" stroke-width="6" stroke-linecap="round" /><line x1="108" y1="72" x2="108" y2="108" stroke="#2B2F4A" stroke-width="6" stroke-linecap="round" /><ellipse cx="85" cy="62" rx="16" ry="9" fill="#DDEFFA" stroke="#2B2F4A" stroke-width="2"/><line x1="120" y1="92" x2="148" y2="96" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path class="dr" d="M150,95.2 q3,4.800000000000001 0,6.6000000000000005 q-3,-1.7999999999999998 0,-6.6000000000000005Z" fill="#E5484D" style="--fall:18px;animation-duration:1.6s;animation-delay:0.00s"/><path d="M270,120 Q300,40 360,70 Q340,130 270,120Z" fill="#6DBE45" stroke="#2E7D32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><line x1="275" y1="118" x2="330" y2="80" stroke="#2E7D32" stroke-width="2" stroke-linecap="round" /><line x1="300" y1="95" x2="294" y2="87" stroke="#2E7D32" stroke-width="2" stroke-linecap="round" /><line x1="320" y1="80" x2="314" y2="72" stroke="#2E7D32" stroke-width="2" stroke-linecap="round" /><line x1="335" y1="100" x2="329" y2="92" stroke="#2E7D32" stroke-width="2" stroke-linecap="round" /><rect x="60" y="170" width="100" height="36" rx="10" fill="#fff" stroke="#2B2F4A" stroke-width="3" /><text x="110" y="193" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">baking soda</text><path d="M260,200 Q300,160 350,190 Q310,225 260,200Z" fill="#8DD07A" stroke="#2E7D32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="305" y="224" font-family="sans-serif" font-size="11" font-weight="700" fill="#3FA34D" text-anchor="middle">dock leaf</text></svg>