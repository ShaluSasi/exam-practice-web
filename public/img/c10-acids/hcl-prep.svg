<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img"><title>Dry HCl gas passing over dry blue litmus and then wet blue litmus; only the wet paper changes colour</title><style>.bub{animation:bub 2.2s linear infinite;transform-box:fill-box}@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--rise,-40px));opacity:0}}
.fl{animation:fl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.dr{animation:dr 1.6s ease-in infinite;transform-box:fill-box}@keyframes dr{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(var(--fall,30px));opacity:0}}
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gl{animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{from{opacity:.35}to{opacity:.9}}
.dft{animation:dft 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes dft{from{transform:translate(0,0)}to{transform:translate(var(--dx,6px),var(--dy,-6px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}.wetl{animation:wl 4s ease-in-out infinite}@keyframes wl{0%,30%{fill:#3B6FE0}60%,100%{fill:#E5484D}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="10" y="215" width="380" height="10" rx="3" fill="#C9B28A" stroke="#8B6B3E" stroke-width="2" /><path d="M40,150.0 L40,180.0 Q40,205 65.0,205 L65.0,205 Q90,205 90,180.0 L90,150.0 Z" fill="#F1F1D6" opacity=".95" class=""/><path d="M40,95 L40,180.0 Q40,205 65.0,205 L65.0,205 Q90,205 90,180.0 L90,95" fill="none" fill-opacity="1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="36" y1="95" x2="94" y2="95" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><circle cx="55" cy="196" r="4" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><circle cx="68" cy="198" r="4" fill="#fff" stroke="#2B2F4A" stroke-width="2" /><circle class="bub" cx="52" cy="180" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-45px;animation-duration:2.2s;animation-delay:-0.00s"/><circle class="bub" cx="66" cy="173" r="3" fill="#fff" stroke="#0B93D4" stroke-width="1.5" style="--rise:-45px;animation-duration:2.2s;animation-delay:-1.10s"/><rect x="52" y="88" width="26" height="12" rx="3" fill="#C9955B" stroke="#8B5A2B" stroke-width="2" /><path d="M65,90 L65,60 L252,60 L252,150" fill="none" stroke="#2B2F4A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M65,90 L65,60 L252,60 L252,150" fill="none" stroke="#CFE9F7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M228,110 L228,178.0 Q228,208 258.0,208 L258.0,208 Q288,208 288,178.0 L288,110" fill="#EAF6FD" fill-opacity="0.5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="224" y1="110" x2="292" y2="110" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><rect x="222" y="104" width="72" height="10" rx="3" fill="#C9955B" stroke="#8B5A2B" stroke-width="2" /><rect x="264" y="150" width="16" height="52" rx="2" fill="#3B6FE0" stroke="#2B2F4A" stroke-width="2" /><path d="M284,106 L284,80 L345,80 L345,150" fill="none" stroke="#2B2F4A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M284,106 L284,80 L345,80 L345,150" fill="none" stroke="#CFE9F7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M318,163.9 L318,178.0 Q318,208 348.0,208 L348.0,208 Q378,208 378,178.0 L378,163.9 Z" fill="#DDEFFA" opacity=".95" class=""/><path d="M318,110 L318,178.0 Q318,208 348.0,208 L348.0,208 Q378,208 378,178.0 L378,110" fill="none" fill-opacity="1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="314" y1="110" x2="382" y2="110" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><rect x="312" y="104" width="72" height="10" rx="3" fill="#C9955B" stroke="#8B5A2B" stroke-width="2" /><rect x="340" y="150" width="16" height="52" rx="2" fill="#3B6FE0" stroke="#2B2F4A" stroke-width="2" class="wetl"/><text x="65" y="237" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">NaCl + conc. H₂SO₄</text><text x="258" y="237" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">dry</text><text x="348" y="237" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">wet</text><text x="200" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">HCl gas passes over blue litmus paper</text></svg>