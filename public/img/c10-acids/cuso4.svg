<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 235" role="img"><title>Blue copper sulphate crystals turn white on heating and blue again on adding water</title><style>.bub{animation:bub 2.2s linear infinite;transform-box:fill-box}@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--rise,-40px));opacity:0}}
.fl{animation:fl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.dr{animation:dr 1.6s ease-in infinite;transform-box:fill-box}@keyframes dr{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(var(--fall,30px));opacity:0}}
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gl{animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{from{opacity:.35}to{opacity:.9}}
.dft{animation:dft 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes dft{from{transform:translate(0,0)}to{transform:translate(var(--dx,6px),var(--dy,-6px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}.back{animation:bk 4s ease-in-out infinite alternate}@keyframes bk{from{fill:#FFFFFF}to{fill:#4D93E8}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><text x="70" y="26" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">1. Blue crystals</text><text x="200" y="26" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">2. Heat</text><text x="330" y="26" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">3. Add water</text><path d="M45,50 L45,135.0 Q45,160 70.0,160 L70.0,160 Q95,160 95,135.0 L95,50" fill="#EAF6FD" fill-opacity="0.5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="41" y1="50" x2="99" y2="50" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M52,148 l6,-8 l8,2 l2,8 l-8,6Z" fill="#2E7DD7" stroke="#1F4F8F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M64,150 l6,-8 l8,2 l2,8 l-8,6Z" fill="#2E7DD7" stroke="#1F4F8F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M76,146 l6,-8 l8,2 l2,8 l-8,6Z" fill="#2E7DD7" stroke="#1F4F8F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M58,138 l6,-8 l8,2 l2,8 l-8,6Z" fill="#2E7DD7" stroke="#1F4F8F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M72,134 l6,-8 l8,2 l2,8 l-8,6Z" fill="#2E7DD7" stroke="#1F4F8F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="70" y="185" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">CuSO₄·5H₂O</text><text x="70" y="200" font-family="sans-serif" font-size="11" font-weight="700" fill="#0B93D4" text-anchor="middle">blue</text><path d="M175,50 L175,135.0 Q175,160 200.0,160 L200.0,160 Q225,160 225,135.0 L225,50" fill="#EAF6FD" fill-opacity="0.5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="171" y1="50" x2="229" y2="50" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M180,152 Q200,138 220,152 L220,156 Q200,160 180,156Z" fill="#FFFFFF" stroke="#9AA0B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="182" cy="110" r="3" fill="#0B93D4" stroke="none" stroke-width="2" /><circle cx="218" cy="100" r="3" fill="#0B93D4" stroke="none" stroke-width="2" /><circle cx="185" cy="125" r="3" fill="#0B93D4" stroke="none" stroke-width="2" /><g class="fl"><path d="M200,190 q10.799999999999999,-15.6 0,-33.6 q-10.799999999999999,18.0 0,33.6Z" fill="#FF8A1F" stroke="#E5484D" stroke-width="1.5"/><path d="M200,190 q4.8,-7.199999999999999 0,-16.8 q-4.8,9.6 0,16.8Z" fill="#FFE27A"/></g><text x="200" y="215" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">white: CuSO₄</text><text x="300" y="100" font-family="sans-serif" font-size="1" font-weight="700" fill="#2B2F4A" text-anchor="middle"></text><path d="M305,50 L305,135.0 Q305,160 330.0,160 L330.0,160 Q355,160 355,135.0 L355,50" fill="#EAF6FD" fill-opacity="0.5" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="301" y1="50" x2="359" y2="50" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M310,152 Q330,138 350,152 L350,156 Q330,160 310,156Z" fill="#4D93E8" stroke="#1F4F8F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="back"/><path class="dr" d="M330,29.6 q4,6.4 0,8.8 q-4,-2.4 0,-8.8Z" fill="#0B93D4" style="--fall:70px;animation-duration:1.6s;animation-delay:0.00s"/><text x="330" y="185" font-family="sans-serif" font-size="11" font-weight="700" fill="#0B93D4" text-anchor="middle">blue again</text><line x1="108" y1="105" x2="162" y2="105" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><path d="M154.1,109.3 L162,105 L154.1,100.7" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="238" y1="105" x2="292" y2="105" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" /><path d="M284.1,109.3 L292,105 L284.1,100.7" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>