<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" role="img"><title>Conductivity set-up with glucose solution</title><style>.bub{animation:bub 2.2s linear infinite;transform-box:fill-box}@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--rise,-40px));opacity:0}}
.fl{animation:fl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.dr{animation:dr 1.6s ease-in infinite;transform-box:fill-box}@keyframes dr{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(var(--fall,30px));opacity:0}}
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gl{animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{from{opacity:.35}to{opacity:.9}}
.dft{animation:dft 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes dft{from{transform:translate(0,0)}to{transform:translate(var(--dx,6px),var(--dy,-6px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><circle cx="100" cy="46" r="16" fill="#F1F1F1" stroke="#2B2F4A" stroke-width="3"/><line x1="100" y1="62" x2="100" y2="82" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="65" y1="82" x2="135" y2="82" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M55,103.8 L55,126 Q55,136 65,136 L135,136 Q145,136 145,126 L145,103.8 Z" fill="#DFF1FA" opacity=".95" class=""/><path d="M55,90 L55,126 Q55,136 65,136 L135,136 Q145,136 145,126 L145,90" fill="none" fill-opacity="1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="51" y1="90" x2="149" y2="90" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><line x1="82" y1="82" x2="82" y2="124" stroke="#8F95A8" stroke-width="5" stroke-linecap="round" /><line x1="118" y1="82" x2="118" y2="124" stroke="#8F95A8" stroke-width="5" stroke-linecap="round" /><text x="100" y="156" font-family="sans-serif" font-size="12" font-weight="700" fill="#2B2F4A" text-anchor="middle">glucose solution</text></svg>