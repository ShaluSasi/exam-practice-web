<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 235" role="img"><title>Pink NaOH and phenolphthalein turns colourless as dilute HCl is added drop by drop</title><style>.bub{animation:bub 2.2s linear infinite;transform-box:fill-box}@keyframes bub{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(var(--rise,-40px));opacity:0}}
.fl{animation:fl .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes fl{from{transform:scaleY(.85)}to{transform:scaleY(1.12)}}
.dr{animation:dr 1.6s ease-in infinite;transform-box:fill-box}@keyframes dr{0%{transform:translateY(0);opacity:1}80%{opacity:1}100%{transform:translateY(var(--fall,30px));opacity:0}}
.pu{animation:pu 2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.gl{animation:gl 1.4s ease-in-out infinite alternate}@keyframes gl{from{opacity:.35}to{opacity:.9}}
.dft{animation:dft 3s ease-in-out infinite alternate;transform-box:fill-box}@keyframes dft{from{transform:translate(0,0)}to{transform:translate(var(--dx,6px),var(--dy,-6px))}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}.fade{animation:fd 5s ease-in-out infinite}@keyframes fd{0%,20%{fill:#F06BB0}65%,100%{fill:#EAF6FB}}</style><rect width="100%" height="100%" rx="16" fill="#FFF9EE"/><rect x="10" y="198" width="380" height="10" rx="3" fill="#C9B28A" stroke="#8B6B3E" stroke-width="2" /><path d="M60,124.0 L60,164.0 Q60,190 86.0,190 L86.0,190 Q112,190 112,164.0 L112,124.0 Z" fill="#F06BB0" opacity=".95" class=""/><path d="M60,80 L60,164.0 Q60,190 86.0,190 L86.0,190 Q112,190 112,164.0 L112,80" fill="none" fill-opacity="1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="56" y1="80" x2="116" y2="80" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="86" y="226" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">NaOH + phenolphthalein</text><path d="M280,124.0 L280,164.0 Q280,190 306.0,190 L306.0,190 Q332,190 332,164.0 L332,124.0 Z" fill="#F06BB0" opacity=".95" class="fade"/><path d="M280,80 L280,164.0 Q280,190 306.0,190 L306.0,190 Q332,190 332,164.0 L332,80" fill="none" fill-opacity="1" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="276" y1="80" x2="336" y2="80" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><text x="306" y="226" font-family="sans-serif" font-size="11" font-weight="700" fill="#2B2F4A" text-anchor="middle">adding dilute HCl</text><path d="M285,30 l42,0 l-10,16 l0,12 l-4,0 l0,-12Z" fill="#DDEFFA" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path class="dr" d="M306,55.6 q4,6.4 0,8.8 q-4,-2.4 0,-8.8Z" fill="#0B93D4" style="--fall:40px;animation-duration:1.6s;animation-delay:0.00s"/><line x1="130" y1="140" x2="250" y2="140" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" /><path d="M242.1,144.3 L250,140 L242.1,135.7" fill="none" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>