<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A">
<title>A stationery shop counter with a pile of books and a pile of book covers</title>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="320" y="28" text-anchor="middle" font-size="17" fill="#2B2F4A">A stationery shop</text><rect x="0" y="200" width="640" height="60" fill="#C8925A"/>
<rect x="80" y="170" width="120" height="22" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2"/><rect x="80" y="146" width="120" height="22" rx="3" fill="#E5484D" stroke="#2B2F4A" stroke-width="2"/><rect x="80" y="122" width="120" height="22" rx="3" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2"/><rect x="80" y="98" width="120" height="22" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2"/>
<rect x="400" y="170" width="110" height="12" rx="2" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2"/><rect x="400" y="156" width="110" height="12" rx="2" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="2"/>
<text x="140" y="62" text-anchor="middle" font-size="15" fill="#2B2F4A">Books: ₹6000 sales</text><text x="140" y="82" text-anchor="middle" font-size="14" fill="#2B2F4A">20% of it is profit</text>
<text x="455" y="62" text-anchor="middle" font-size="15" fill="#2B2F4A">Book covers: ₹2000 sales</text><text x="455" y="82" text-anchor="middle" font-size="14" fill="#2B2F4A">40% of it is profit</text>
</svg>
