<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A">
<title>A farm with cows, sheep and chickens shown as three portions of a bar</title>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="320" y="26" text-anchor="middle" font-size="16" fill="#2B2F4A">A farm last year: share of all animals</text>
<rect x="60" y="60" width="300" height="40" rx="0" fill="#E8D8C3" stroke="#2B2F4A" stroke-width="2"/><rect x="360" y="60" width="125" height="40" rx="0" fill="#F3F3F3" stroke="#2B2F4A" stroke-width="2"/><rect x="485" y="60" width="75" height="40" rx="0" fill="#FFE69A" stroke="#2B2F4A" stroke-width="2"/>
<text x="210" y="86" text-anchor="middle" font-size="15" fill="#2B2F4A">Cows 60%</text><text x="422" y="86" text-anchor="middle" font-size="14" fill="#2B2F4A">Sheep 25%</text><text x="522" y="86" text-anchor="middle" font-size="13" fill="#2B2F4A">Hens 15%</text>
<circle cx="150" cy="160" r="18" fill="#E8D8C3" stroke="#2B2F4A" stroke-width="2"/><circle cx="150" cy="150" r="6" fill="#F4C8C8" stroke="#2B2F4A" stroke-width="1.5"/><circle cx="260" cy="160" r="18" fill="#F3F3F3" stroke="#2B2F4A" stroke-width="2"/><circle cx="370" cy="160" r="13" fill="#FFE69A" stroke="#2B2F4A" stroke-width="2"/>
<text x="320" y="214" text-anchor="middle" font-size="13" fill="#2B2F4A">This year the number of every kind of animal fell</text>
</svg>
