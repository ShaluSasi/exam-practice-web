<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A">
<title>A 100 percent stacked bar chart of flowers blooming by season in two gardens</title>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="150" y="12" width="14" height="14" rx="3" fill="#F6C453" stroke="#2B2F4A" stroke-width="1.5"/><text x="170" y="24" text-anchor="start" font-size="13" fill="#2B2F4A">Spring</text><rect x="280" y="12" width="14" height="14" rx="3" fill="#3FA34D" stroke="#2B2F4A" stroke-width="1.5"/><text x="300" y="24" text-anchor="start" font-size="13" fill="#2B2F4A">Summer</text><rect x="410" y="12" width="14" height="14" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5"/><text x="430" y="24" text-anchor="start" font-size="13" fill="#2B2F4A">Autumn</text><line x1="100" y1="40" x2="100" y2="150" stroke="#D8D2C0" stroke-width="1" stroke-linecap="round"/><text x="100" y="172" text-anchor="middle" font-size="12" fill="#2B2F4A">0%</text><line x1="225" y1="40" x2="225" y2="150" stroke="#D8D2C0" stroke-width="1" stroke-linecap="round"/><text x="225" y="172" text-anchor="middle" font-size="12" fill="#2B2F4A">25%</text><line x1="350" y1="40" x2="350" y2="150" stroke="#D8D2C0" stroke-width="1" stroke-linecap="round"/><text x="350" y="172" text-anchor="middle" font-size="12" fill="#2B2F4A">50%</text><line x1="475" y1="40" x2="475" y2="150" stroke="#D8D2C0" stroke-width="1" stroke-linecap="round"/><text x="475" y="172" text-anchor="middle" font-size="12" fill="#2B2F4A">75%</text><line x1="600" y1="40" x2="600" y2="150" stroke="#D8D2C0" stroke-width="1" stroke-linecap="round"/><text x="600" y="172" text-anchor="middle" font-size="12" fill="#2B2F4A">100%</text><text x="90" y="72" text-anchor="end" font-size="14" fill="#2B2F4A">Garden P</text><rect x="100" y="48" width="225" height="38" rx="0" fill="#F6C453" stroke="#2B2F4A" stroke-width="1.5"/><text x="212.5" y="73" text-anchor="middle" font-size="14" fill="#2B2F4A">45%</text><rect x="325" y="48" width="175" height="38" rx="0" fill="#3FA34D" stroke="#2B2F4A" stroke-width="1.5"/><text x="412.5" y="73" text-anchor="middle" font-size="14" fill="#2B2F4A">35%</text><rect x="500" y="48" width="100" height="38" rx="0" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5"/><text x="550" y="73" text-anchor="middle" font-size="14" fill="#2B2F4A">20%</text><text x="90" y="124" text-anchor="end" font-size="14" fill="#2B2F4A">Garden Q</text><rect x="100" y="100" width="125" height="38" rx="0" fill="#F6C453" stroke="#2B2F4A" stroke-width="1.5"/><text x="162.5" y="125" text-anchor="middle" font-size="14" fill="#2B2F4A">25%</text><rect x="225" y="100" width="275" height="38" rx="0" fill="#3FA34D" stroke="#2B2F4A" stroke-width="1.5"/><text x="362.5" y="125" text-anchor="middle" font-size="14" fill="#2B2F4A">55%</text><rect x="500" y="100" width="100" height="38" rx="0" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5"/><text x="550" y="125" text-anchor="middle" font-size="14" fill="#2B2F4A">20%</text><text x="320" y="205" text-anchor="middle" font-size="13" fill="#2B2F4A">Share of each garden’s yearly flowers that bloomed in each season</text>
</svg>
