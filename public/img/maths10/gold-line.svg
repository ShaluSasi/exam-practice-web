<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A">
<title>A number line of gold prices with a marker O and numbered markers</title>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="320" y="26" text-anchor="middle" font-size="16" fill="#2B2F4A">Price of gold per gram (₹ thousand)</text><line x1="40" y1="140" x2="600" y2="140" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><line x1="40" y1="133" x2="40" y2="147" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><text x="40" y="170" text-anchor="middle" font-size="14" fill="#2B2F4A">10</text><line x1="120" y1="133" x2="120" y2="147" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><text x="120" y="170" text-anchor="middle" font-size="14" fill="#2B2F4A">15</text><line x1="200" y1="133" x2="200" y2="147" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><text x="200" y="170" text-anchor="middle" font-size="14" fill="#2B2F4A">20</text><line x1="280" y1="133" x2="280" y2="147" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><text x="280" y="170" text-anchor="middle" font-size="14" fill="#2B2F4A">25</text><line x1="360" y1="133" x2="360" y2="147" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><text x="360" y="170" text-anchor="middle" font-size="14" fill="#2B2F4A">30</text><line x1="440" y1="133" x2="440" y2="147" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><text x="440" y="170" text-anchor="middle" font-size="14" fill="#2B2F4A">35</text><line x1="520" y1="133" x2="520" y2="147" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><text x="520" y="170" text-anchor="middle" font-size="14" fill="#2B2F4A">40</text><line x1="600" y1="133" x2="600" y2="147" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><text x="600" y="170" text-anchor="middle" font-size="14" fill="#2B2F4A">45</text><polygon points="189,100 211,100 200,118" fill="#E5484D" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><text x="200" y="92" text-anchor="middle" font-size="13" fill="#2B2F4A">O: Suvarna’s mean price now</text><text x="320" y="205" text-anchor="middle" font-size="13" fill="#2B2F4A">Mark where the mean price will be after