<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A">
<title>Two bottles of salty water being poured together into a measuring jar</title>
<style>.pr{animation:p 1.8s ease-in-out infinite}@keyframes p{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="320" y="28" text-anchor="middle" font-size="17" fill="#2B2F4A">Mixing salty waters</text>
<rect x="60" y="70" width="90" height="130" rx="14" fill="#E8F1FF" stroke="#2B2F4A" stroke-width="3"/><text x="105" y="120" text-anchor="middle" font-size="16" fill="#2B2F4A">1 L</text><text x="105" y="142" text-anchor="middle" font-size="13" fill="#2B2F4A">salinity</text><text x="105" y="160" text-anchor="middle" font-size="15" fill="#2B2F4A">34%</text><text x="105" y="222" text-anchor="middle" font-size="14" fill="#2B2F4A">Dead Sea</text>
<rect x="250" y="70" width="120" height="130" rx="14" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="3"/><text x="310" y="120" text-anchor="middle" font-size="16" fill="#2B2F4A">3 L</text><text x="310" y="142" text-anchor="middle" font-size="13" fill="#2B2F4A">salinity</text><text x="310" y="160" text-anchor="middle" font-size="15" fill="#2B2F4A">3.5%</text><text x="310" y="222" text-anchor="middle" font-size="14" fill="#2B2F4A">Ocean water</text>
<g class="pr"><polygon points="395,125 425,125 425,110 455,135 425,160 425,145 395,145" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/></g>
<path d="M490 70 L490 200 L590 200 L590 70" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="3"/><text x="540" y="140" text-anchor="middle" font-size="15" fill="#2B2F4A">salinity ?</text>
</svg>
