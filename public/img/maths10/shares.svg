<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A">
<title>Share certificates: a pile already held and a smaller pile being bought</title>
<style>.in{animation:i 3s ease-in-out infinite alternate}@keyframes i{from{transform:translateX(30px)}to{transform:translateX(-40px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="320" y="26" text-anchor="middle" font-size="16" fill="#2B2F4A">Buying more shares of one company</text>
<rect x="50" y="70" width="200" height="100" rx="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><rect x="62" y="82" width="200" height="100" rx="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><rect x="74" y="94" width="200" height="100" rx="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><text x="150" y="130" text-anchor="middle" font-size="14" fill="#2B2F4A">Already held: 20 shares</text><text x="150" y="152" text-anchor="middle" font-size="14" fill="#2B2F4A">mean price ₹120</text>
<g class="in"><rect x="400" y="80" width="190" height="90" rx="4" fill="#CFEBD1" stroke="#2B2F4A" stroke-width="2"/><text x="495" y="120" text-anchor="middle" font-size="14" fill="#2B2F4A">Buying: 10 shares</text><text x="495" y="142" text-anchor="middle" font-size="14" fill="#2B2F4A">at ₹30 each</text></g>
<text x="320" y="225" text-anchor="middle" font-size="14" fill="#2B2F4A">Mean price per share after buying: ?</text>
</svg>
