<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A">
<title>A white stork flying over a dotted trail of daily journeys</title>
<style>.fl{animation:f 3s ease-in-out infinite}@keyframes f{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,-12px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="320" y="28" text-anchor="middle" font-size="17" fill="#2B2F4A">Migration of a white stork</text>
<path d="M40 190 Q200 120 320 170 T600 130" fill="none" stroke="#A3A8CC" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/>
<text x="40" y="225" text-anchor="start" font-size="13" fill="#2B2F4A">Day 1</text><text x="600" y="225" text-anchor="end" font-size="13" fill="#2B2F4A">Day 21</text>
<g class="fl"><ellipse cx="300" cy="100" rx="26" ry="10" fill="#fff" stroke="#2B2F4A" stroke-width="2.5"/><path d="M300 98 Q280 60 250 62 Q275 85 290 100 Z" fill="#fff" stroke="#2B2F4A" stroke-width="2.5" stroke-linejoin="round"/><path d="M322 96 L350 90 L322 102 Z" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/><line x1="280" y1="108" x2="255" y2="122" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/></g>
<text x="320" y="205" text-anchor="middle" font-size="14" fill="#2B2F4A">first 20 days: mean 38 km per day   |   day 21: 59 km</text>
</svg>
