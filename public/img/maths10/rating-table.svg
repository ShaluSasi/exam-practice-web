<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A">
<title>A table of how many of 10 customers gave each star rating for food, service and ambience</title>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="320" y="26" text-anchor="middle" font-size="16" fill="#2B2F4A">Ratings from 10 customers (1 to 5 stars)</text>
<text x="230" y="60" text-anchor="middle" font-size="13" fill="#2B2F4A">5 stars</text><text x="296" y="60" text-anchor="middle" font-size="13" fill="#2B2F4A">4 stars</text><text x="362" y="60" text-anchor="middle" font-size="13" fill="#2B2F4A">3 stars</text><text x="428" y="60" text-anchor="middle" font-size="13" fill="#2B2F4A">2 stars</text><text x="494" y="60" text-anchor="middle" font-size="13" fill="#2B2F4A">1 star</text><text x="560" y="60" text-anchor="middle" font-size="13" fill="#2B2F4A">Weight</text>
<rect x="40" y="78" width="560" height="46" rx="6" fill="#F3F7FF" stroke="#2B2F4A" stroke-width="1.5"/><text x="60" y="107" text-anchor="start" font-size="15" fill="#2B2F4A">Food</text><text x="230" y="107" text-anchor="middle" font-size="16" fill="#2B2F4A">4</text><text x="296" y="107" text-anchor="middle" font-size="16" fill="#2B2F4A">4</text><text x="362" y="107" text-anchor="middle" font-size="16" fill="#2B2F4A">2</text><text x="428" y="107" text-anchor="middle" font-size="16" fill="#2B2F4A">0</text><text x="494" y="107" text-anchor="middle" font-size="16" fill="#2B2F4A">0</text><text x="560" y="107" text-anchor="middle" font-size="16" fill="#2B2F4A">5</text><rect x="40" y="134" width="560" height="46" rx="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.5"/><text x="60" y="163" text-anchor="start" font-size="15" fill="#2B2F4A">Service</text><text x="230" y="163" text-anchor="middle" font-size="16" fill="#2B2F4A">1</text><text x="296" y="163" text-anchor="middle" font-size="16" fill="#2B2F4A">3</text><text x="362" y="163" text-anchor="middle" font-size="16" fill="#2B2F4A">4</text><text x="428" y="163" text-anchor="middle" font-size="16" fill="#2B2F4A">2</text><text x="494" y="163" text-anchor="middle" font-size="16" fill="#2B2F4A">0</text><text x="560" y="163" text-anchor="middle" font-size="16" fill="#2B2F4A">3</text><rect x="40" y="190" width="560" height="46" rx="6" fill="#F3F7FF" stroke="#2B2F4A" stroke-width="1.5"/><text x="60" y="219" text-anchor="start" font-size="15" fill="#2B2F4A">Ambience</text><text x="230" y="219" text-anchor="middle" font-size="16" fill="#2B2F4A">0</text><text x="296" y="219" text-anchor="middle" font-size="16" fill="#2B2F4A">5</text><text x="362" y="219" text-anchor="middle" font-size="16" fill="#2B2F4A">3</text><text x="428" y="219" text-anchor="middle" font-size="16" fill="#2B2F4A">2</text><text x="494" y="219" text-anchor="middle" font-size="16" fill="#2B2F4A">0</text><text x="560" y="219" text-anchor="middle" font-size="16" fill="#2B2F4A">2</text>
<text x="320" y="252" text-anchor="middle" font-size="13" fill="#2B2F4A">Combined rating uses the weights in the last column</text>
</svg>
