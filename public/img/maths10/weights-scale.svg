<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A">
<title>Two groups of data points with small counters that show their weights, and a second picture with twice as many counters</title>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="160" y="26" text-anchor="middle" font-size="15" fill="#2B2F4A">Weights 1 and 3</text><text x="480" y="26" text-anchor="middle" font-size="15" fill="#2B2F4A">Weights 2 and 6</text>
<circle cx="70" cy="120" r="16" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2"/><text x="70" y="126" text-anchor="middle" font-size="16" fill="#2B2F4A">x</text><circle cx="190" cy="120" r="16" fill="#FFE3C2" stroke="#2B2F4A" stroke-width="2"/><text x="190" y="126" text-anchor="middle" font-size="16" fill="#2B2F4A">y</text>
<circle cx="70" cy="175" r="5" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2"/><circle cx="160" cy="175" r="5" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2"/><circle cx="182" cy="175" r="5" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2"/><circle cx="204" cy="175" r="5" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2"/>
<circle cx="390" cy="120" r="16" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2"/><text x="390" y="126" text-anchor="middle" font-size="16" fill="#2B2F4A">x</text><circle cx="510" cy="120" r="16" fill="#FFE3C2" stroke="#2B2F4A" stroke-width="2"/><text x="510" y="126" text-anchor="middle" font-size="16" fill="#2B2F4A">y</text>
<circle cx="380" cy="175" r="5" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2"/><circle cx="402" cy="175" r="5" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2"/><circle cx="470" cy="170" r="5" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2"/><circle cx="492" cy="170" r="5" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2"/><circle cx="514" cy="170" r="5" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2"/><circle cx="470" cy="186" r="5" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2"/><circle cx="492" cy="186" r="5" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2"/><circle cx="514" cy="186" r="5" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2"/>
<text x="320" y="225" text-anchor="middle" font-size="13" fill="#2B2F4A">Dots under each value show its weight</text>
</svg>
