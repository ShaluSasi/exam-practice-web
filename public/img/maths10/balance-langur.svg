<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="320" y="28" text-anchor="middle" font-size="17" fill="#2B2F4A">Where does the group balance?</text><line x1="60" y1="190" x2="580" y2="190" stroke="#2B2F4A" stroke-width="4" stroke-linecap="round"/><line x1="60" y1="182" x2="60" y2="198" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><text x="60" y="220" text-anchor="middle" font-size="14" fill="#2B2F4A">8</text><line x1="125" y1="182" x2="125" y2="198" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><text x="125" y="220" text-anchor="middle" font-size="14" fill="#2B2F4A">10</text><line x1="190" y1="182" x2="190" y2="198" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><text x="190" y="220" text-anchor="middle" font-size="14" fill="#2B2F4A">12</text><line x1="255" y1="182" x2="255" y2="198" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><text x="255" y="220" text-anchor="middle" font-size="14" fill="#2B2F4A">14</text><line x1="320" y1="182" x2="320" y2="198" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><text x="320" y="220" text-anchor="middle" font-size="14" fill="#2B2F4A">16</text><line x1="385" y1="182" x2="385" y2="198" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><text x="385" y="220" text-anchor="middle" font-size="14" fill="#2B2F4A">18</text><line x1="450" y1="182" x2="450" y2="198" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><text x="450" y="220" text-anchor="middle" font-size="14" fill="#2B2F4A">20</text><line x1="515" y1="182" x2="515" y2="198" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><text x="515" y="220" text-anchor="middle" font-size="14" fill="#2B2F4A">22</text><line x1="580" y1="182" x2="580" y2="198" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><text x="580" y="220" text-anchor="middle" font-size="14" fill="#2B2F4A">24</text><text x="320" y="258" text-anchor="middle" font-size="13" fill="#2B2F4A">weight in kg</text><circle cx="125" cy="120" r="34" fill="#FFE3C2" stroke="#2B2F4A" stroke-width="2"/><text x="125" y="126" text-anchor="middle" font-size="20" fill="#2B2F4A">18</text><text x="125" y="70" text-anchor="middle" font-size="14" fill="#2B2F4A">Females: mean 10 kg</text><circle cx="515" cy="130" r="24" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2"/><text x="515" y="136" text-anchor="middle" font-size="20" fill="#2B2F4A">6</text><text x="515" y="82" text-anchor="middle" font-size="14" fill="#2B2F4A">Males: mean 22 kg</text><line x1="125" y1="154" x2="125" y2="190" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/><line x1="515" y1="154" x2="515" y2="190" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
