<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A">
<title>Side view of a pit with four sections of different lengths and depths</title>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="320" y="30" text-anchor="middle" font-size="17" fill="#2B2F4A">A pit dug to different depths along its length</text><rect x="20" y="70" width="600" height="190" rx="4" fill="#D9C49A" stroke="#2B2F4A" stroke-width="2"/><rect x="40" y="70" width="84" height="160" fill="#FFF9EE" stroke="#2B2F4A" stroke-width="2"/><text x="82" y="62" text-anchor="middle" font-size="13" fill="#2B2F4A">3 hastas</text><text x="82" y="155" text-anchor="middle" font-size="13" fill="#2B2F4A">8 deep</text><rect x="124" y="70" width="112" height="120" fill="#FFF9EE" stroke="#2B2F4A" stroke-width="2"/><text x="180" y="62" text-anchor="middle" font-size="13" fill="#2B2F4A">4 hastas</text><text x="180" y="135" text-anchor="middle" font-size="13" fill="#2B2F4A">6 deep</text><rect x="236" y="70" width="140" height="80" fill="#FFF9EE" stroke="#2B2F4A" stroke-width="2"/><text x="306" y="62" text-anchor="middle" font-size="13" fill="#2B2F4A">5 hastas</text><text x="306" y="115" text-anchor="middle" font-size="13" fill="#2B2F4A">4 deep</text><rect x="376" y="70" width="224" height="40" fill="#FFF9EE" stroke="#2B2F4A" stroke-width="2"/><text x="488" y="62" text-anchor="middle" font-size="13" fill="#2B2F4A">8 hastas</text><text x="488" y="95" text-anchor="middle" font-size="13" fill="#2B2F4A">2 deep</text><line x1="20" y1="70" x2="620" y2="70" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/><text x="320" y="284" text-anchor="middle" font-size="13" fill="#2B2F4A">Each section has its own depth; lengths and depths in hastas</text>
</svg>
