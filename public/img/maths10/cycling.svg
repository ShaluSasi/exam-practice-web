<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A">
<title>A girl cycling along a road; a table of three weeks with five weekday rides each</title>
<style>.bk{animation:r 5s ease-in-out infinite alternate}@keyframes r{from{transform:translateX(0)}to{transform:translateX(380px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="0" y="170" width="640" height="90" fill="#D9C49A"/><line x1="0" y1="215" x2="640" y2="215" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 12"/>
<text x="320" y="26" text-anchor="middle" font-size="17" fill="#2B2F4A">Three weeks of weekday rides</text>
<text x="100" y="62" text-anchor="end" font-size="14" fill="#2B2F4A">Week 1</text><circle cx="130" cy="56" r="11" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2"/><circle cx="166" cy="56" r="11" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2"/><circle cx="202" cy="56" r="11" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2"/><circle cx="238" cy="56" r="11" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2"/><circle cx="274" cy="56" r="11" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2"/><text x="100" y="92" text-anchor="end" font-size="14" fill="#2B2F4A">Week 2</text><circle cx="130" cy="86" r="11" fill="#FFE3C2" stroke="#2B2F4A" stroke-width="2"/><circle cx="166" cy="86" r="11" fill="#FFE3C2" stroke="#2B2F4A" stroke-width="2"/><circle cx="202" cy="86" r="11" fill="#FFE3C2" stroke="#2B2F4A" stroke-width="2"/><circle cx="238" cy="86" r="11" fill="#FFE3C2" stroke="#2B2F4A" stroke-width="2"/><circle cx="274" cy="86" r="11" fill="#FFE3C2" stroke="#2B2F4A" stroke-width="2"/><text x="100" y="122" text-anchor="end" font-size="14" fill="#2B2F4A">Week 3</text><circle cx="130" cy="116" r="11" fill="#CFEBD1" stroke="#2B2F4A" stroke-width="2"/><circle cx="166" cy="116" r="11" fill="#CFEBD1" stroke="#2B2F4A" stroke-width="2"/><circle cx="202" cy="116" r="11" fill="#CFEBD1" stroke="#2B2F4A" stroke-width="2"/><circle cx="238" cy="116" r="11" fill="#CFEBD1" stroke="#2B2F4A" stroke-width="2"/><circle cx="274" cy="116" r="11" fill="#CFEBD1" stroke="#2B2F4A" stroke-width="2"/>
<g class="bk"><circle cx="70" cy="205" r="20" fill="none" stroke="#2B2F4A" stroke-width="3"/><circle cx="140" cy="205" r="20" fill="none" stroke="#2B2F4A" stroke-width="3"/><line x1="70" y1="205" x2="100" y2="175" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><line x1="100" y1="175" x2="140" y2="205" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><line x1="100" y1="175" x2="125" y2="175" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><line x1="70" y1="205" x2="100" y2="205" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/><line x1="100" y1="205" x2="100" y2="175" stroke="#2B2F4A" stroke-width="2" stroke-linecap="round"/>
<circle cx="106" cy="140" r="10" fill="#FFD9B3" stroke="#2B2F4A" stroke-width="2"/><rect x="95" y="150" width="22" height="26" rx="8" fill="#E5484D" stroke="#2B2F4A" stroke-width="2"/></g>
