<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A">
<title>A pot of spicy pani with a jug of plain water being added</title>
<style>.wj{animation:w 2.5s ease-in-out infinite}@keyframes w{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(-110px,10px) rotate(-18deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="30" y="34" text-anchor="start" font-size="17" fill="#2B2F4A">Spicy pani for a snack stall</text>
<path d="M140 90 L130 200 Q130 225 160 225 L260 225 Q290 225 290 200 L280 90 Z" fill="#9BC77B" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/>
<text x="210" y="150" text-anchor="middle" font-size="18" fill="#2B2F4A">12 L</text><text x="210" y="175" text-anchor="middle" font-size="15" fill="#2B2F4A">10% spice</text>
<g class="wj"><path d="M390 80 L390 150 Q390 165 405 165 L455 165 Q470 165 470 150 L470 80 Z" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><text x="430" y="125" text-anchor="middle" font-size="14" fill="#2B2F4A">plain water</text></g>
<text x="500" y="200" text-anchor="start" font-size="14" fill="#2B2F4A">Goal: spice level</text><text x="500" y="220" text-anchor="start" font-size="14" fill="#2B2F4A">cut to 3/5 of before</text>
</svg>
