<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" role="img" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A">
<title>A 100 percent stacked bar chart of how four people spend a 24-hour day, with numbered markers</title>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="110" y="12" width="14" height="14" rx="3" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="1.5"/><text x="130" y="24" text-anchor="start" font-size="13" fill="#2B2F4A">Lying down</text><rect x="280" y="12" width="14" height="14" rx="3" fill="#F6C453" stroke="#2B2F4A" stroke-width="1.5"/><text x="300" y="24" text-anchor="start" font-size="13" fill="#2B2F4A">Sitting</text><rect x="450" y="12" width="14" height="14" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.5"/><text x="470" y="24" text-anchor="start" font-size="13" fill="#2B2F4A">Standing or moving</text><line x1="110" y1="38" x2="110" y2="214" stroke="#D8D2C0" stroke-width="1" stroke-linecap="round"/><text x="110" y="234" text-anchor="middle" font-size="12" fill="#2B2F4A">0%</text><line x1="250" y1="38" x2="250" y2="214" stroke="#D8D2C0" stroke-width="1" stroke-linecap="round"/><text x="250" y="234" text-anchor="middle" font-size="12" fill="#2B2F4A">25%</text><line x1="390" y1="38" x2="390" y2="214" stroke="#D8D2C0" stroke-width="1" stroke-linecap="round"/><text x="390" y="234" text-anchor="middle" font-size="12" fill="#2B2F4A">50%</text><line x1="530" y1="38" x2="530" y2="214" stroke="#D8D2C0" stroke-width="1" stroke-linecap="round"/><text x="530" y="234" text-anchor="middle" font-size="12" fill="#2B2F4A">75%</text><line x1="670" y1="38" x2="670" y2="214" stroke="#D8D2C0" stroke-width="1" stroke-linecap="round"/><text x="670" y="234" text-anchor="middle" font-size="12" fill="#2B2F4A">100%</text><text x="100" y="66" text-anchor="end" font-size="14" fill="#2B2F4A">Pavani</text><rect x="110" y="44" width="466.7" height="32" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="1.5"/><rect x="576.7" y="44" width="70" height="32" fill="#F6C453" stroke="#2B2F4A" stroke-width="1.5"/><rect x="646.7" y="44" width="23.3" height="32" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.5"/><text x="100" y="111" text-anchor="end" font-size="14" fill="#2B2F4A">Raghu</text><rect x="110" y="89" width="163.3" height="32" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="1.5"/><rect x="273.3" y="89" width="93.3" height="32" fill="#F6C453" stroke="#2B2F4A" stroke-width="1.5"/><rect x="366.7" y="89" width="303.3" height="32" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.5"/><text x="100" y="156" text-anchor="end" font-size="14" fill="#2B2F4A">Zakir</text><rect x="110" y="134" width="186.7" height="32" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="1.5"/><rect x="296.7" y="134" width="140" height="32" fill="#F6C453" stroke="#2B2F4A" stroke-width="1.5"/><rect x="436.7" y="134" width="233.3" height="32" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.5"/><text x="100" y="201" text-anchor="end" font-size="14" fill="#2B2F4A">Julie</text><rect x="110" y="179" width="186.7" height="32" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="1.5"/><rect x="296.7" y="179" width="233.3" height="32" fill="#F6C453" stroke="#2B2F4A" stroke-width="1.5"/><rect x="530" y="179" width="140" height="32" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.5"/>
</svg>
