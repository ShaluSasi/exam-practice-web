<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" role="img" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A">
<title>Three batches of brass drawn as bars: Batch C has an unknown weight</title>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="320" y="28" text-anchor="middle" font-size="17" fill="#2B2F4A">Brass batches (alloy of copper and zinc)</text>
<rect x="40" y="55" width="140" height="36" rx="4" fill="#F2C777" stroke="#2B2F4A" stroke-width="2"/><text x="40" y="112" text-anchor="start" font-size="14" fill="#2B2F4A">Batch A: 100 kg, 60% copper</text>
<rect x="40" y="135" width="210" height="36" rx="4" fill="#F2C777" stroke="#2B2F4A" stroke-width="2"/><text x="40" y="192" text-anchor="start" font-size="14" fill="#2B2F4A">Batch B: 150 kg, 40% copper</text>
<rect x="40" y="215" width="130" height="36" rx="4" fill="#FFF9EE" stroke="#2B2F4A" stroke-width="2" stroke-dasharray="8 6"/><text x="105" y="239" text-anchor="middle" font-size="16" fill="#2B2F4A">? kg</text><text x="180" y="235" text-anchor="start" font-size="14" fill="#2B2F4A">Batch C: 30% copper</text>
<text x="560" y="150" text-anchor="middle" font-size="15" fill="#2B2F4A">Mixture</text><text x="560" y="170" text-anchor="middle" font-size="15" fill="#2B2F4A">40% copper</text>
</svg>
