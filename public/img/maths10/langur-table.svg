<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A">
<title>A table of langur weights with some counts unknown</title>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="320" y="28" text-anchor="middle" font-size="17" fill="#2B2F4A">Langurs in an animal facility</text>
<text x="220" y="62" text-anchor="middle" font-size="15" fill="#2B2F4A">Male</text><text x="360" y="62" text-anchor="middle" font-size="15" fill="#2B2F4A">Female</text><text x="500" y="62" text-anchor="middle" font-size="15" fill="#2B2F4A">All langurs</text>
<rect x="30" y="75" width="580" height="44" rx="6" fill="#F3F7FF" stroke="#2B2F4A" stroke-width="1.5"/><text x="50" y="103" text-anchor="start" font-size="14" fill="#2B2F4A">Mean weight</text><text x="220" y="103" text-anchor="middle" font-size="14" fill="#2B2F4A">20 kg</text><text x="360" y="103" text-anchor="middle" font-size="14" fill="#2B2F4A">14 kg</text><text x="500" y="103" text-anchor="middle" font-size="14" fill="#2B2F4A">16 kg</text>
<rect x="30" y="125" width="580" height="44" rx="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.5"/><text x="50" y="153" text-anchor="start" font-size="14" fill="#2B2F4A">Number of langurs</text><text x="220" y="153" text-anchor="middle" font-size="14" fill="#2B2F4A">?</text><text x="360" y="153" text-anchor="middle" font-size="14" fill="#2B2F4A">?</text><text x="500" y="153" text-anchor="middle" font-size="14" fill="#2B2F4A">48</text>
<text x="320" y="205" text-anchor="middle" font-size="13" fill="#2B2F4A">Male and female counts add up to the total</text>
</svg>
