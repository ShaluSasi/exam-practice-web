<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A">
<title>A weighing scale with a group of female langurs and one new langur arriving</title>
<style>.nw{animation:n 3s ease-in-out infinite alternate}@keyframes n{from{transform:translateX(60px)}to{transform:translateX(-30px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="320" y="28" text-anchor="middle" font-size="17" fill="#2B2F4A">Female langurs in the facility</text>
<circle cx="90" cy="130" r="16" fill="#C8925A" stroke="#2B2F4A" stroke-width="2"/><circle cx="90" cy="134" r="8" fill="#FFD9B3" stroke="#2B2F4A" stroke-width="1.5"/><circle cx="130" cy="144" r="16" fill="#C8925A" stroke="#2B2F4A" stroke-width="2"/><circle cx="130" cy="148" r="8" fill="#FFD9B3" stroke="#2B2F4A" stroke-width="1.5"/><circle cx="170" cy="130" r="16" fill="#C8925A" stroke="#2B2F4A" stroke-width="2"/><circle cx="170" cy="134" r="8" fill="#FFD9B3" stroke="#2B2F4A" stroke-width="1.5"/><circle cx="210" cy="144" r="16" fill="#C8925A" stroke="#2B2F4A" stroke-width="2"/><circle cx="210" cy="148" r="8" fill="#FFD9B3" stroke="#2B2F4A" stroke-width="1.5"/><circle cx="250" cy="130" r="16" fill="#C8925A" stroke="#2B2F4A" stroke-width="2"/><circle cx="250" cy="134" r="8" fill="#FFD9B3" stroke="#2B2F4A" stroke-width="1.5"/><circle cx="290" cy="144" r="16" fill="#C8925A" stroke="#2B2F4A" stroke-width="2"/><circle cx="290" cy="148" r="8" fill="#FFD9B3" stroke="#2B2F4A" stroke-width="1.5"/>
<text x="180" y="190" text-anchor="middle" font-size="15" fill="#2B2F4A">12 females, mean 14 kg</text>
<g class="nw"><circle cx="480" cy="130" r="16" fill="#C8925A" stroke="#2B2F4A" stroke-width="2"/><circle cx="480" cy="134" r="8" fill="#FFD9B3" stroke="#2B2F4A" stroke-width="1.5"/><text x="480" y="175" text-anchor="middle" font-size="14" fill="#2B2F4A">new: 17 kg</text></g>
<rect x="330" y="195" width="300" height="22" rx="8" fill="#A3A8CC" stroke="#2B2F4A" stroke-width="2"/><text x="320" y="240" text-anchor="middle" font-size="14" fill="#2B2F4A">Mean weight of the females after she joins: ?</text>
</svg>
