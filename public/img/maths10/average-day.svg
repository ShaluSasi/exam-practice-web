<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" role="img" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A">
<title>One strip for an average day above four strips for different age groups, with different colour patterns</title>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="320" y="24" text-anchor="middle" font-size="16" fill="#2B2F4A">An “average day” strip and strips for age groups</text>
<text x="20" y="62" text-anchor="start" font-size="13" fill="#2B2F4A">Everyone</text>
<rect x="110" y="45" width="150" height="28" rx="0" fill="#3FA34D" stroke="#2B2F4A" stroke-width="1.5"/><rect x="260" y="45" width="90" height="28" rx="0" fill="#F6C453" stroke="#2B2F4A" stroke-width="1.5"/><rect x="350" y="45" width="60" height="28" rx="0" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.5"/><rect x="410" y="45" width="110" height="28" rx="0" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5"/><rect x="520" y="45" width="100" height="28" rx="0" fill="#8E7CC3" stroke="#2B2F4A" stroke-width="1.5"/>
<text x="20" y="110" text-anchor="start" font-size="13" fill="#2B2F4A">Children</text><rect x="110" y="94" width="120" height="24" rx="0" fill="#3FA34D" stroke="#2B2F4A" stroke-width="1.5"/><rect x="230" y="94" width="200" height="24" rx="0" fill="#8E7CC3" stroke="#2B2F4A" stroke-width="1.5"/><rect x="430" y="94" width="80" height="24" rx="0" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5"/><rect x="510" y="94" width="110" height="24" rx="0" fill="#F6C453" stroke="#2B2F4A" stroke-width="1.5"/>
<text x="20" y="150" text-anchor="start" font-size="13" fill="#2B2F4A">Youth</text><rect x="110" y="134" width="100" height="24" rx="0" fill="#3FA34D" stroke="#2B2F4A" stroke-width="1.5"/><rect x="210" y="134" width="140" height="24" rx="0" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5"/><rect x="350" y="134" width="100" height="24" rx="0" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.5"/><rect x="450" y="134" width="170" height="24" rx="0" fill="#8E7CC3" stroke="#2B2F4A" stroke-width="1.5"/>
<text x="20" y="190" text-anchor="start" font-size="13" fill="#2B2F4A">Adults</text><rect x="110" y="174" width="130" height="24" rx="0" fill="#3FA34D" stroke="#2B2F4A" stroke-width="1.5"/><rect x="240" y="174" width="40" height="24" rx="0" fill="#F6C453" stroke="#2B2F4A" stroke-width="1.5"/><rect x="280" y="174" width="190" height="24" rx="0" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.5"/><rect x="470" y="174" width="150" height="24" rx="0" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5"/>
<text x="20" y="230" text-anchor="start" font-size="13" fill="#2B2F4A">Elderly</text><rect x="110" y="214" width="190" height="24" rx="0" fill="#3FA34D" stroke="#2B2F4A" stroke-width="1.5"/><rect x="300" y="214" width="70" height="24" rx="0" fill="#F6C453" stroke="#2B2F4A" stroke-width="1.5"/><rect x="370" y="214" width="60" height="24" rx="0" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.5"/><rect x="430" y="214" width="190" height="24" rx="0" fill="#8E7CC3" stroke="#2B2F4A" stroke-width="1.5"/>
</svg>
