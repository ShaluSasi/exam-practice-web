<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A">
<title>A stacked bar turning into a full-length 100 percent bar</title>
<style>.ar{animation:a 2s ease-in-out infinite}@keyframes a{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="150" y="28" text-anchor="middle" font-size="15" fill="#2B2F4A">Stacked bars</text><text x="490" y="28" text-anchor="middle" font-size="15" fill="#2B2F4A">100% stacked bars</text>
<rect x="40" y="50" width="60" height="30" rx="0" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2"/><rect x="100" y="50" width="40" height="30" rx="0" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2"/><rect x="140" y="50" width="50" height="30" rx="0" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2"/>
<rect x="40" y="100" width="120" height="30" rx="0" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2"/><rect x="160" y="100" width="40" height="30" rx="0" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2"/><rect x="200" y="100" width="70" height="30" rx="0" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2"/>
<g class="ar"><polygon points="290,100 340,100 340,85 380,110 340,135 340,120 290,120" fill="#F6C453" stroke="#2B2F4A" stroke-width="2" stroke-linejoin="round"/></g>
<rect x="400" y="50" width="76" height="30" rx="0" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2"/><rect x="476" y="50" width="44" height="30" rx="0" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2"/><rect x="520" y="50" width="70" height="30" rx="0" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2"/><rect x="400" y="100" width="100" height="30" rx="0" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2"/><rect x="500" y="100" width="34" height="30" rx="0" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="2"/><rect x="534" y="100" width="56" height="30" rx="0" fill="#3FA34D" stroke="#2B2F4A" stroke-width="2"/>
<text x="320" y="200" text-anchor="middle" font-size="13">Every bar becomes the same total length</text>
</svg>
