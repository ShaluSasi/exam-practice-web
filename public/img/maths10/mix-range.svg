<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A">
<title>A number line of salt concentrations with three marks and a question mark</title>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="320" y="26" text-anchor="middle" font-size="16" fill="#2B2F4A">Salt concentration (%)</text><line x1="60" y1="110" x2="580" y2="110" stroke="#2B2F4A" stroke-width="3" stroke-linecap="round"/>
<circle cx="60" cy="110" r="8" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2"/><text x="60" y="140" text-anchor="middle" font-size="13" fill="#2B2F4A">0.001</text><circle cx="150" cy="110" r="8" fill="#0B93D4" stroke="#2B2F4A" stroke-width="2"/><text x="150" y="140" text-anchor="middle" font-size="13" fill="#2B2F4A">0.01</text><circle cx="570" cy="110" r="8" fill="#E5484D" stroke="#2B2F4A" stroke-width="2"/><text x="570" y="140" text-anchor="middle" font-size="13" fill="#2B2F4A">34</text>
<text x="60" y="70" text-anchor="middle" font-size="12" fill="#2B2F4A">Purified</text><text x="570" y="170" text-anchor="middle" font-size="12" fill="#2B2F4A">Dead Sea</text><text x="150" y="85" text-anchor="middle" font-size="12" fill="#2B2F4A">Groundwater</text><text x="60" y="85" text-anchor="middle" font-size="12" fill="#2B2F4A">drinking water</text>
<text x="320" y="190" text-anchor="middle" font-size="12" fill="#2B2F4A">Mix Dead Sea water with groundwater: where can the result land?</text>
</svg>
