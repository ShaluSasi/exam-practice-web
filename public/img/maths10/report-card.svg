<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" role="img" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A">
<title>A report card with marks for three parts and a weight bar for each</title>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="60" y="20" width="520" height="230" rx="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><text x="320" y="50" text-anchor="middle" font-size="18" fill="#2B2F4A">Report card: Maths</text><text x="120" y="80" text-anchor="start" font-size="14" fill="#2B2F4A">Part</text><text x="300" y="80" text-anchor="start" font-size="14" fill="#2B2F4A">Marks</text><text x="470" y="80" text-anchor="start" font-size="14" fill="#2B2F4A">Weight</text><line x1="80" y1="88" x2="560" y2="88" stroke="#2B2F4A" stroke-width="1.5" stroke-linecap="round"/><text x="120" y="118" text-anchor="start" font-size="15" fill="#2B2F4A">Internal tests</text><text x="300" y="118" text-anchor="start" font-size="15" fill="#2B2F4A">54 out of 100</text><rect x="470" y="100" width="48" height="22" rx="6" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2"/><text x="528" y="118" text-anchor="start" font-size="15" fill="#2B2F4A">3</text><text x="120" y="158" text-anchor="start" font-size="15" fill="#2B2F4A">Project</text><text x="300" y="158" text-anchor="start" font-size="15" fill="#2B2F4A">70 out of 100</text><rect x="470" y="140" width="32" height="22" rx="6" fill="#FFE3C2" stroke="#2B2F4A" stroke-width="2"/><text x="512" y="158" text-anchor="start" font-size="15" fill="#2B2F4A">2</text><text x="120" y="198" text-anchor="start" font-size="15" fill="#2B2F4A">Final exam</text><text x="300" y="198" text-anchor="start" font-size="15" fill="#2B2F4A">82 out of 100</text><rect x="470" y="180" width="80" height="22" rx="6" fill="#CFEBD1" stroke="#2B2F4A" stroke-width="2"/><text x="560" y="198" text-anchor="start" font-size="15" fill="#2B2F4A">5</text>
</svg>
