<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A">
<title>A rain cloud above three month cards showing daily rainfall averages and the number of days</title>
<style>.rn{animation:rn 1.2s linear infinite}@keyframes rn{from{transform:translateY(-6px);opacity:.3}to{transform:translateY(10px);opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<path d="M200 90 Q180 90 180 70 Q180 50 205 50 Q215 25 245 30 Q270 15 290 40 Q320 35 325 65 Q345 70 340 90 Z" fill="#E3F2FD" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/>
<g class="rn"><line x1="210" y1="105" x2="204" y2="125" stroke="#0B93D4" stroke-width="3" stroke-linecap="round"/><line x1="240" y1="113" x2="234" y2="133" stroke="#0B93D4" stroke-width="3" stroke-linecap="round"/><line x1="270" y1="105" x2="264" y2="125" stroke="#0B93D4" stroke-width="3" stroke-linecap="round"/><line x1="300" y1="113" x2="294" y2="133" stroke="#0B93D4" stroke-width="3" stroke-linecap="round"/></g>
<rect x="40" y="150" width="180" height="80" rx="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><text x="130" y="176" text-anchor="middle" font-size="15" fill="#2B2F4A">May: 31 days</text><text x="130" y="204" text-anchor="middle" font-size="14" fill="#2B2F4A">average 3.5 mm per day</text><rect x="230" y="150" width="180" height="80" rx="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><text x="320" y="176" text-anchor="middle" font-size="15" fill="#2B2F4A">June: 30 days</text><text x="320" y="204" text-anchor="middle" font-size="14" fill="#2B2F4A">average 10 mm per day</text><rect x="420" y="150" width="180" height="80" rx="4" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="2"/><text x="510" y="176" text-anchor="middle" font-size="15" fill="#2B2F4A">July: 31 days</text><text x="510" y="204" text-anchor="middle" font-size="14" fill="#2B2F4A">average 8.7 mm per day</text>
</svg>
