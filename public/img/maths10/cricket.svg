<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A">
<title>A cricket scoreboard showing overs and runs, with a batter and a ball</title>
<style>.ba{animation:s 2s ease-in-out infinite;transform-origin:467px 160px}@keyframes s{0%,100%{transform:rotate(0)}50%{transform:rotate(-30deg)}}.bl{animation:q 2s ease-in-out infinite}@keyframes q{0%,100%{transform:translateX(0)}50%{transform:translateX(-60px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="60" y="40" width="330" height="150" rx="12" fill="#2B2F4A" stroke="#2B2F4A" stroke-width="2"/><text x="225" y="74" text-anchor="middle" font-size="16" fill="#fff">T20 SCOREBOARD</text>
<text x="225" y="110" text-anchor="middle" font-size="15" fill="#F6C453">After 14 overs: run rate 7</text><text x="225" y="140" text-anchor="middle" font-size="15" fill="#fff">15th over: 13 runs scored</text><text x="225" y="170" text-anchor="middle" font-size="15" fill="#fff">Run rate after 15 overs: ?</text>
<g class="ba"><rect x="460" y="70" width="14" height="90" rx="6" fill="#F6C453" stroke="#2B2F4A" stroke-width="2.5" transform="rotate(-20 467 160)"/></g>
<g class="bl"><circle cx="540" cy="200" r="11" fill="#E5484D" stroke="#2B2F4A" stroke-width="2"/></g>
</svg>
