<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A">
<title>A furniture shop with two review boxes: recent reviews and older reviews</title>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="320" y="28" text-anchor="middle" font-size="17" fill="#2B2F4A">Portable furniture store: customer reviews</text>
<rect x="50" y="55" width="250" height="150" rx="4" fill="#FFE3C2" stroke="#2B2F4A" stroke-width="2"/><text x="175" y="85" text-anchor="middle" font-size="16" fill="#2B2F4A">Last 3 months</text><text x="175" y="110" text-anchor="middle" font-size="14" fill="#2B2F4A">40 reviews</text><polygon points="105,130 107.6,136.4 114.5,136.9 109.3,141.4 110.9,148.1 105,144.5 99.1,148.1 100.7,141.4 95.5,136.9 102.4,136.4" fill="#F6C453" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round"/><polygon points="129,130 131.6,136.4 138.5,136.9 133.3,141.4 134.9,148.1 129,144.5 123.1,148.1 124.7,141.4 119.5,136.9 126.4,136.4" fill="#F6C453" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round"/><polygon points="153,130 155.6,136.4 162.5,136.9 157.3,141.4 158.9,148.1 153,144.5 147.1,148.1 148.7,141.4 143.5,136.9 150.4,136.4" fill="#F6C453" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round"/><polygon points="177,130 179.6,136.4 186.5,136.9 181.3,141.4 182.9,148.1 177,144.5 171.1,148.1 172.7,141.4 167.5,136.9 174.4,136.4" fill="#F6C453" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round"/><polygon points="201,130 203.6,136.4 210.5,136.9 205.3,141.4 206.9,148.1 201,144.5 195.1,148.1 196.7,141.4 191.5,136.9 198.4,136.4" fill="#F6C453" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round"/><text x="175" y="175" text-anchor="middle" font-size="15" fill="#2B2F4A">mean rating 4.5</text><text x="175" y="196" text-anchor="middle" font-size="13" fill="#2B2F4A">counts double</text>
<rect x="340" y="55" width="250" height="150" rx="4" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="2"/><text x="465" y="85" text-anchor="middle" font-size="16" fill="#2B2F4A">Older</text><text x="465" y="110" text-anchor="middle" font-size="14" fill="#2B2F4A">60 reviews</text><polygon points="395,130 397.6,136.4 404.5,136.9 399.3,141.4 400.9,148.1 395,144.5 389.1,148.1 390.7,141.4 385.5,136.9 392.4,136.4" fill="#F6C453" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round"/><polygon points="419,130 421.6,136.4 428.5,136.9 423.3,141.4 424.9,148.1 419,144.5 413.1,148.1 414.7,141.4 409.5,136.9 416.4,136.4" fill="#F6C453" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round"/><polygon points="443,130 445.6,136.4 452.5,136.9 447.3,141.4 448.9,148.1 443,144.5 437.1,148.1 438.7,141.4 433.5,136.9 440.4,136.4" fill="#F6C453" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round"/><polygon points="467,130 469.6,136.4 476.5,136.9 471.3,141.4 472.9,148.1 467,144.5 461.1,148.1 462.7,141.4 457.5,136.9 464.4,136.4" fill="#F6C453" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round"/><polygon points="491,130 493.6,136.4 500.5,136.9 495.3,141.4 496.9,148.1 491,144.5 485.1,148.1 486.7,141.4 481.5,136.9 488.4,136.4" fill="#EEE" stroke="#2B2F4A" stroke-width="1.5" stroke-linejoin="round"/><text x="465" y="175" text-anchor="middle" font-size="15" fill="#2B2F4A">mean rating 3.5</text><text x="465" y="196" text-anchor="middle" font-size="13" fill="#2B2F4A">counts once</text>
<text x="320" y="240" text-anchor="middle" font-size="14" fill="#2B2F4A">Store rating = weighted mean of all reviews</text>
</svg>
