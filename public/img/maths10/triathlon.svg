<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A">
<title>A triathlon table with three athletes and finish times for swimming, cycling and running</title>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="320" y="24" text-anchor="middle" font-size="16" fill="#2B2F4A">Triathlon finish times (hours : minutes)</text>
<text x="240" y="56" text-anchor="middle" font-size="15" fill="#2B2F4A">Swim</text><text x="370" y="56" text-anchor="middle" font-size="15" fill="#2B2F4A">Cycle</text><text x="500" y="56" text-anchor="middle" font-size="15" fill="#2B2F4A">Run</text>
<path d="M205 66 q10 -8 20 0 t20 0 t20 0" fill="none" stroke="#0B93D4" stroke-width="3" stroke-linecap="round"/>
<circle cx="330" cy="70" r="5" fill="none" stroke="#2B2F4A" stroke-width="2"/><circle cx="352" cy="70" r="5" fill="none" stroke="#2B2F4A" stroke-width="2"/>
<path d="M470 70 l14 -6 l10 6" fill="none" stroke="#2B2F4A" stroke-width="2.5" stroke-linecap="round"/>
<rect x="30" y="92" width="580" height="46" rx="6" fill="#F3F7FF" stroke="#2B2F4A" stroke-width="1.5"/><text x="50" y="121" text-anchor="start" font-size="15" fill="#2B2F4A">Athlete 1</text><text x="240" y="121" text-anchor="middle" font-size="16" fill="#2B2F4A">01:08</text><text x="370" y="121" text-anchor="middle" font-size="16" fill="#2B2F4A">05:00</text><text x="500" y="121" text-anchor="middle" font-size="16" fill="#2B2F4A">03:15</text><rect x="30" y="148" width="580" height="46" rx="6" fill="#FFFFFF" stroke="#2B2F4A" stroke-width="1.5"/><text x="50" y="177" text-anchor="start" font-size="15" fill="#2B2F4A">Athlete 2</text><text x="240" y="177" text-anchor="middle" font-size="16" fill="#2B2F4A">01:05</text><text x="370" y="177" text-anchor="middle" font-size="16" fill="#2B2F4A">05:10</text><text x="500" y="177" text-anchor="middle" font-size="16" fill="#2B2F4A">03:35</text><rect x="30" y="204" width="580" height="46" rx="6" fill="#F3F7FF" stroke="#2B2F4A" stroke-width="1.5"/><text x="50" y="233" text-anchor="start" font-size="15" fill="#2B2F4A">Athlete 3</text><text x="240" y="233" text-anchor="middle" font-size="16" fill="#2B2F4A">01:22</text><text x="370" y="233" text-anchor="middle" font-size="16" fill="#2B2F4A">05:55</text><text x="500" y="233" text-anchor="middle" font-size="16" fill="#2B2F4A">03:50</text>
<text x="320" y="268" text-anchor="middle" font-size="13" fill="#2B2F4A">Swim 3.8 km, then cycle 180 km, then run 42.2 km</text>
</svg>
