<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" role="img" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A">
<title>Three equal sacks of fertiliser labelled with their nitrogen fractions</title>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="300" y="28" text-anchor="middle" font-size="17" fill="#2B2F4A">Equal quantities of three fertilisers</text>
<path d="M80 70 Q70 130 82 200 L178 200 Q190 130 180 70 Z" fill="#CFEBD1" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><text x="130" y="120" text-anchor="middle" font-size="14" fill="#2B2F4A">Fertiliser X</text><text x="130" y="150" text-anchor="middle" font-size="14" fill="#2B2F4A">1/5 nitrogen</text><text x="130" y="222" text-anchor="middle" font-size="13" fill="#2B2F4A">50 kg</text><path d="M250 70 Q240 130 252 200 L348 200 Q360 130 350 70 Z" fill="#FFE3C2" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><text x="300" y="120" text-anchor="middle" font-size="14" fill="#2B2F4A">Fertiliser Y</text><text x="300" y="150" text-anchor="middle" font-size="14" fill="#2B2F4A">3/10 nitrogen</text><text x="300" y="222" text-anchor="middle" font-size="13" fill="#2B2F4A">50 kg</text><path d="M420 70 Q410 130 422 200 L518 200 Q530 130 520 70 Z" fill="#CDEBFA" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/><text x="470" y="120" text-anchor="middle" font-size="14" fill="#2B2F4A">Fertiliser Z</text><text x="470" y="150" text-anchor="middle" font-size="14" fill="#2B2F4A">1/4 nitrogen</text><text x="470" y="222" text-anchor="middle" font-size="13" fill="#2B2F4A">50 kg</text>
</svg>
