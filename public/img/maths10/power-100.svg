<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" role="img" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A">
<title>A 100 percent stacked bar chart of electricity use by type for two years, with numbered markers</title>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<rect x="110" y="14" width="14" height="14" rx="3" fill="#F6C453" stroke="#2B2F4A" stroke-width="1.5"/><text x="130" y="26" text-anchor="start" font-size="13" fill="#2B2F4A">Lighting</text><rect x="240" y="14" width="14" height="14" rx="3" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5"/><text x="260" y="26" text-anchor="start" font-size="13" fill="#2B2F4A">Cooling</text><rect x="370" y="14" width="14" height="14" rx="3" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.5"/><text x="390" y="26" text-anchor="start" font-size="13" fill="#2B2F4A">Kitchen</text><rect x="500" y="14" width="14" height="14" rx="3" fill="#8E7CC3" stroke="#2B2F4A" stroke-width="1.5"/><text x="520" y="26" text-anchor="start" font-size="13" fill="#2B2F4A">Other</text><line x1="100" y1="44" x2="100" y2="205" stroke="#D8D2C0" stroke-width="1" stroke-linecap="round"/><text x="100" y="226" text-anchor="middle" font-size="12" fill="#2B2F4A">0%</text><line x1="240" y1="44" x2="240" y2="205" stroke="#D8D2C0" stroke-width="1" stroke-linecap="round"/><text x="240" y="226" text-anchor="middle" font-size="12" fill="#2B2F4A">25%</text><line x1="380" y1="44" x2="380" y2="205" stroke="#D8D2C0" stroke-width="1" stroke-linecap="round"/><text x="380" y="226" text-anchor="middle" font-size="12" fill="#2B2F4A">50%</text><line x1="520" y1="44" x2="520" y2="205" stroke="#D8D2C0" stroke-width="1" stroke-linecap="round"/><text x="520" y="226" text-anchor="middle" font-size="12" fill="#2B2F4A">75%</text><line x1="660" y1="44" x2="660" y2="205" stroke="#D8D2C0" stroke-width="1" stroke-linecap="round"/><text x="660" y="226" text-anchor="middle" font-size="12" fill="#2B2F4A">100%</text><text x="88" y="84" text-anchor="end" font-size="14" fill="#2B2F4A">2005</text><rect x="100" y="55" width="201.6" height="46" fill="#F6C453" stroke="#2B2F4A" stroke-width="1.5"/><rect x="301.6" y="55" width="168" height="46" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5"/><rect x="469.6" y="55" width="67.2" height="46" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.5"/><rect x="536.8" y="55" width="123.2" height="46" fill="#8E7CC3" stroke="#2B2F4A" stroke-width="1.5"/><text x="88" y="154" text-anchor="end" font-size="14" fill="#2B2F4A">2025</text><rect x="100" y="125" width="61.6" height="46" fill="#F6C453" stroke="#2B2F4A" stroke-width="1.5"/><rect x="161.6" y="125" width="224" height="46" fill="#0B93D4" stroke="#2B2F4A" stroke-width="1.5"/><rect x="385.6" y="125" width="128.8" height="46" fill="#FF8A1F" stroke="#2B2F4A" stroke-width="1.5"/><rect x="514.4" y="125" width="145.6" height="46" fill="#8E7CC3" stroke="#2B2F4A" stroke-width="1.5"/><text x="350" y="254" text-anchor="middle" font-size="13" fill="#2B2F4A">Share of each year’s total electricity use</text>
</svg>
