<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 260" role="img" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#2B2F4A">
<title>A big bowl and a small glass of lemonade being poured into one jug</title>
<style>.dr{animation:p 1.8s ease-in-out infinite}@keyframes p{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="100%" height="100%" rx="16" fill="#FFF9EE"/>
<text x="300" y="28" text-anchor="middle" font-size="17" fill="#2B2F4A">Lemonade with jaggery</text>
<path d="M40 100 Q40 190 135 190 Q230 190 230 100 Z" fill="#FFF2A8" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/>
<text x="135" y="150" text-anchor="middle" font-size="16" fill="#2B2F4A">300 mL</text><text x="135" y="172" text-anchor="middle" font-size="14" fill="#2B2F4A">10% jaggery</text>
<path d="M300 110 L300 190 Q300 205 315 205 L365 205 Q380 205 380 190 L380 110 Z" fill="#FFD87A" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/>
<text x="340" y="148" text-anchor="middle" font-size="14" fill="#2B2F4A">100 mL</text><text x="340" y="170" text-anchor="middle" font-size="14" fill="#2B2F4A">30%</text><text x="340" y="187" text-anchor="middle" font-size="12" fill="#2B2F4A">jaggery</text>
<path d="M460 95 L460 205 Q460 220 475 220 L545 220 Q560 220 560 205 L560 95" fill="#FFFBEA" stroke="#2B2F4A" stroke-width="3" stroke-linejoin="round"/>
<text x="510" y="255" text-anchor="middle" font-size="15" fill="#2B2F4A">Mixture: ?</text>
<g class="dr"><path d="M255 110 L285 110" stroke="#FF8A1F" stroke-width="5" stroke-linecap="round"/><polygon points="285,100 300,110 285,120" fill="#FF8A1F"/></g>
<g class="dr"><path d="M395 110 L430 110" stroke="#FF8A1F" stroke-width="5" stroke-linecap="round"/><polygon points="430,100 445,110 430,120" fill="#FF8A1F"/></g>
</svg>
